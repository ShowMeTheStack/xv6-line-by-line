# Every lock in the kernel at 06aad25 (see annotations/LOCKS.md and the concept page
# annotations/concepts/03-locks.md, which has a section {#lock-<id>} for each entry).
#
# The build scans kernel/*.c for acquire/release/acquiresleep/releasesleep/holding/
# holdingsleep/initlock/initsleeplock calls and maps each argument (with & and spaces
# removed) to a lock through `match` (optionally limited to `files`). Every call must map
# to exactly one lock; `annot.py concepts` reports the ones that don't. push_off, pop_off,
# intr_on and intr_off calls get an "interrupt state" marker too.
#
#   id       anchor and key
#   name     how the lock is written in prose
#   kind     spin | sleep
#   count    how many instances exist
#   decl     where the lock variable is declared (file:line)
#   match    the argument expressions that mean this lock
#   protects one line, shown in the source view's notes panel
#   intr     yes if an interrupt handler acquires it

- id: kmem
  name: kmem.lock
  kind: spin
  count: "1"
  decl: kernel/kalloc.c:22
  match: [kmem.lock]
  protects: the free list of physical pages (`kmem.freelist`)
  intr: no
- id: bcache
  name: bcache.lock
  kind: spin
  count: "1"
  decl: kernel/bio.c:26
  match: [bcache.lock]
  protects: the buffer cache's LRU list and every buffer's `refcnt`, `dev`, `blockno`
  intr: no
- id: buf
  name: b->lock
  kind: sleep
  count: "30 (NBUF), one per buffer"
  decl: kernel/buf.h:6
  match: [b->lock]
  files: [kernel/bio.c]
  protects: one buffer's `data` and `valid`; held from bread/bget until brelse
  intr: no
- id: itable
  name: itable.lock
  kind: spin
  count: "1"
  decl: kernel/fs.c:179
  match: [itable.lock]
  protects: every in-memory inode's `ref`, `dev` and `inum` (which slot holds which inode)
  intr: no
- id: inode
  name: ip->lock
  kind: sleep
  count: "50 (NINODE), one per in-memory inode"
  decl: kernel/file.h:21
  match: [ip->lock, "itable.inode[i].lock"]
  files: [kernel/fs.c]
  protects: all other inode fields (`valid`, `type`, `size`, `addrs`, ...) and the inode's contents
  intr: no
- id: ftable
  name: ftable.lock
  kind: spin
  count: "1"
  decl: kernel/file.c:18
  match: [ftable.lock]
  protects: every open file's `ref` and allocation of `struct file` slots
  intr: no
- id: log
  name: log.lock
  kind: spin
  count: "1"
  decl: kernel/log.c:41
  match: [log.lock]
  protects: "`log.outstanding`, `log.committing`, `log.ncommit` and the in-memory log header"
  intr: no
- id: pipe
  name: pi->lock
  kind: spin
  count: one per pipe, created by pipealloc
  decl: kernel/pipe.c:14
  match: [pi->lock]
  files: [kernel/pipe.c]
  protects: a pipe's buffer, `nread`, `nwrite`, `readopen`, `writeopen`
  intr: no
- id: proc
  name: p->lock
  kind: spin
  count: "64 (NPROC), one per process slot"
  decl: kernel/proc.h:83
  match: [p->lock, np->lock, pp->lock]
  files: [kernel/proc.c]
  protects: "`p->state`, `p->chan`, `p->killed`, `p->xstate`, `p->pid`; held across swtch"
  intr: yes
- id: wait_lock
  name: wait_lock
  kind: spin
  count: "1"
  decl: kernel/proc.c:27
  match: [wait_lock]
  protects: every `p->parent`; makes exit's wakeup and wait's sleep atomic. Taken before any p->lock
  intr: no
- id: pid_lock
  name: pid_lock
  kind: spin
  count: "1"
  decl: kernel/proc.c:16
  match: [pid_lock]
  protects: "`nextpid`"
  intr: no
- id: tickslock
  name: tickslock
  kind: spin
  count: "1"
  decl: kernel/trap.c:9
  match: [tickslock]
  protects: "`ticks`, the timer-tick counter"
  intr: yes
- id: cons
  name: cons.lock
  kind: spin
  count: "1"
  decl: kernel/console.c:48
  match: [cons.lock]
  protects: the console input buffer `cons.buf` and its indices `r`, `w`, `e`
  intr: yes
- id: pr
  name: pr.lock
  kind: spin
  count: "1"
  decl: kernel/printk.c:23
  match: [pr.lock]
  protects: keeps one printk's characters together; skipped once a panic starts
  intr: yes
- id: vdisk
  name: disk.vdisk_lock
  kind: spin
  count: "1"
  decl: kernel/virtio_disk.c:57
  match: [disk.vdisk_lock]
  protects: the virtio descriptors, the avail/used rings, `disk.free[]` and `disk.info[]`
  intr: yes
- id: uart
  name: tx_lock
  kind: sleep
  count: "1"
  decl: kernel/uart.c:42
  match: [tx_lock]
  files: [kernel/uart.c]
  protects: the UART transmitter, one writing process at a time (uartwrite)
  intr: no
- id: sleeplock-lk
  name: lk->lk
  kind: spin
  count: one inside every sleep-lock (81)
  decl: kernel/sleeplock.h:4
  match: [lk->lk]
  files: [kernel/sleeplock.c]
  protects: a sleep-lock's own `locked` and `pid` fields, for a few instructions at a time
  intr: no
- id: any
  name: lk
  kind: spin
  count: the spinlock being acquired or released
  decl: kernel/spinlock.h:2
  match: [lk]
  files: [kernel/spinlock.c]
  protects: whatever the caller's spinlock protects (this is the lock code itself)
  intr: "-"
