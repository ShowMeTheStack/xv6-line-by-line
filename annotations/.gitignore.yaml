summary: |
  Tells `git` which files to ignore: everything the build produces, so that `git status`
  shows only files you actually edited, and nobody commits a compiled kernel or a disk
  image by accident. Each line is a pattern. A pattern without a `/` matches a file of that
  name in any directory; a leading `/` anchors the pattern to the top of the repository; `*`
  matches any characters.

  The list mirrors what `make clean` deletes ([[Makefile:159]]).

blocks:
  - lines: 1-7
    title: Patterns that match anywhere
    note: |
      - `*~`: backup copies that some editors (Emacs, for instance) save next to a file
        you edit, such as `vm.c~`.
      - `_*`: the compiled user programs, `user/_cat`, `user/_sh` and so on, named with a
        leading underscore by the Makefile ([[Makefile:106]]). It would also hide any other
        file whose name starts with `_`.
      - `*.o`: [[g:object-file|object files]] from the compiler.
      - `*.d`: dependency files written by `-MD` ([[g:flag-MD]]).
      - `*.asm`: disassembly listings such as `kernel/kernel.asm`.
      - `*.sym`: symbol lists such as `kernel/kernel.sym`.
      - `*.img`: the disk image `fs.img` built by [[mkfs/mkfs.c|mkfs]].

  - lines: 8-12
    title: Individual generated files
    note: |
      - `/mkfs/mkfs`: the host program compiled from [[mkfs/mkfs.c]]. Anchored with a
        leading `/` so that only this exact path matches.
      - `/kernel/kernel`: the linked kernel.
      - `/user/usys.S`: the system-call stubs generated by [[user/usys.pl]]. It is ignored
        because it is rebuilt from the Perl script, which is the real source.
      - `.gdbinit`: generated from [[.gdbinit.tmpl-riscv]] with your own port number, so it
        differs per user and must not be shared.
      - `TAGS`: the editor index made by `make tags`.
