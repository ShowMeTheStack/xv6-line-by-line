summary: |
  The one header every xv6 user program includes: the declarations of everything a program
  can call. It plays the role that `<unistd.h>`, `<string.h>`, `<stdio.h>` and `<stdlib.h>`
  play on a Unix system, in 50 lines.

  It has four groups, each matching the file that defines it:

  | Lines | Group | Defined in |
  |---|---|---|
  | 6–27 | system calls | [[user/usys.S]] (generated stubs) |
  | 30–42 | string and helper functions | [[user/ulib.c]] |
  | 45–46 | formatted output | [[user/printf.c]] |
  | 49–50 | memory allocation | [[user/umalloc.c]] |

  For a system call, the declaration is all the C compiler sees; the definition is a
  three-instruction [[g:syscall-stub]] that traps into the kernel. Each line note below
  names the kernel function that does the real work, so you can follow any call down, for
  example `fork()` → [[fork|stub]] → `ecall` → [[kernel:syscall]] → [[kernel:sys_fork]] →
  [[kernel:kfork]].

  The header is not self-contained: it uses the type `uint` without defining it, so
  programs include [[kernel/types.h]] first. A program that reads the fields of a
  `struct stat` also includes [[kernel/stat.h]]; for the prototypes, the declaration on
  line 3 is enough.

  **Read next:** [[user/usys.pl]] and [[user/usys.S]].

blocks:
  - lines: 1
    title: The error value of sbrk
    note: |
      `sbrk` returns an address, so it cannot report failure as an ordinary -1 integer;
      it returns the pointer whose bits are all ones, `(char *)-1`, which can never be the
      start of newly added memory. The kernel's [[kernel:sys_sbrk]] returns -1 on failure,
      and the stub's `char *` return type turns that into exactly this value. Unix systems
      use the same convention, often spelled `(void *)-1`.

  - lines: 3
    title: Declare struct stat without defining it
    note: |
      An incomplete declaration: it tells the compiler that a struct called `stat` exists,
      without listing its fields. That is enough for the prototypes of `fstat` and `stat`,
      which only pass a pointer to it. A program that wants to read the fields includes
      [[kernel/stat.h]], which has the full definition.

  - lines: 5-27
    title: The system calls
    note: |
      The 22 system calls of xv6. Their numbers are defined in [[kernel/syscall.h]] (the
      order here is different, and does not matter). Each name is a label in
      [[user/usys.S]]; `sys_sbrk` on line 24 is named differently on purpose.

      The types are the user's view. In the kernel every handler has the signature
      `uint64 sys_xxx(void)`: it fetches its arguments itself from the saved registers
      ([[g:syscall-arguments]]) and returns a 64-bit value, which [[kernel:syscall]] puts
      in `a0`. On return the C caller reads `a0` as whatever type this header promises: the
      low 32 bits for an `int`, all 64 for a pointer. Nothing checks that the two sides
      agree; this file and the handlers are kept consistent by hand.

      Almost every call returns -1 on failure, with no further detail (there is no
      `errno`). Pointers passed in are untrusted by the kernel and copied with
      [[kernel:copyin]] and [[kernel:copyout]], so a bad pointer usually produces -1
      instead of a crash.

  - lines: 29-42
    title: Helpers from ulib.c
    note: |
      The functions in [[user/ulib.c]]: the C string and memory functions in small
      versions, and three helpers built on system calls (`stat`, `gets`, and the `sbrk`
      wrappers). The parameter types differ in places from standard C: lengths are `uint`
      or `int` rather than `size_t`, and `memmove` takes an `int` count while `memcpy`
      takes a `uint`.

      Standard C names are used on purpose, so programs read like ordinary C. Because the
      Makefile compiles with `-ffreestanding` ([[Makefile:72]]), which implies
      `-fno-builtin`, GCC does not assume these functions behave like the standard
      library's (it will not, for example, replace a call with its own inline code). The
      individual `-fno-builtin-...` flags in [[Makefile:74]] repeat this for some of the
      names and are redundant.

  - lines: 44-46
    title: Formatted output, checked by the compiler
    note: |
      [[printf]] writes to standard output, [[fprintf]] to a chosen
      [[g:file-descriptor]].

      `__attribute__((format(printf, 2, 3)))` ([[g:attribute]]) tells GCC that argument 2
      is a printf-style [[g:format-string]] and the values to format start at argument 3
      (for `printf`, 1 and 2). GCC then checks each call: `printf("%d", "hello")` produces
      a warning, which xv6's `-Werror` turns into an error. Without the attribute, a
      mismatch would only show up as garbage output or a crash at run time.

  - lines: 48-50
    title: Memory allocation
    note: |
      [[malloc]] and [[free]] from [[user/umalloc.c]], a [[g:free-list-allocator]] on top
      of `sbrk`. The size is a `uint` where standard C uses `size_t`.

lines:
  6: |
    `fork()`: create a copy of the calling process. Returns the child's [[g:pid]] in the
    parent and 0 in the child, or -1. Kernel: [[kernel:sys_fork]] → [[kernel:kfork]].
  7: |
    `exit(status)`: end the calling process; `status` is passed to the parent's `wait`
    ([[g:exit-status]]). Kernel: [[kernel:sys_exit]] → [[kernel:kexit]].

    It never returns, and `__attribute__((noreturn))` ([[g:attribute]]) tells the compiler
    so. The compiler can then omit code after a call to `exit` and does not warn about a
    function that "falls off the end" after calling it. The `int` return type is
    meaningless for a function that never returns.
  8: |
    `wait(&status)`: wait for a child to exit; return its pid and store its exit status
    at the address given (which may be 0 to ignore it). Returns -1 if the caller has no
    children. Kernel: [[kernel:sys_wait]] → [[kernel:kwait]].
  9: |
    `pipe(fds)`: create a [[g:pipe]]; store the read end's descriptor in `fds[0]` and the
    write end's in `fds[1]`. Kernel: [[kernel:sys_pipe]] → [[kernel:pipealloc]].
  10: |
    `write(fd, buf, n)`: write `n` bytes from `buf`; returns the number written, or -1.
    Kernel: [[kernel:sys_write]] → [[kernel:filewrite]].
  11: |
    `read(fd, buf, n)`: read up to `n` bytes into `buf`; returns the number read, 0 at end
    of file, or -1. Kernel: [[kernel:sys_read]] → [[kernel:fileread]].
  12: |
    `close(fd)`: release a file descriptor. Kernel: [[kernel:sys_close]] →
    [[kernel:fileclose]].
  13: |
    `kill(pid)`: mark process `pid` as killed, and wake it if it is sleeping. The process
    exits when the kernel next checks the mark, at the latest before it returns to user
    mode. Kernel: [[kernel:sys_kill]] →
    [[kernel:kkill]]. Unlike Unix `kill`, there is no signal number.
  14: |
    `exec(path, argv)`: replace the calling process's program with the one in file
    `path`, passing it the null-terminated argument array `argv` ([[g:exec]]). Returns
    only on failure. Kernel: [[kernel:sys_exec]] → [[kernel:kexec]].
  15: |
    `open(path, flags)`: open or create a file; returns a new descriptor, or -1. The flags
    are in [[kernel/fcntl.h]]. Kernel: [[kernel:sys_open]].
  16: |
    `mknod(path, major, minor)`: create a device file; reading or writing it goes to the
    driver selected by `major`. [[user/init.c:20]] uses it to create `console`. Kernel:
    [[kernel:sys_mknod]].
  17: |
    `unlink(path)`: remove a name from a directory; the file itself is deleted when no
    name and no open descriptor refers to it any more ([[g:link-count]]). Kernel:
    [[kernel:sys_unlink]].
  18: |
    `fstat(fd, &st)`: fill `st` with information about an open file. Kernel:
    [[kernel:sys_fstat]] → [[kernel:filestat]].
  19: |
    `link(old, new)`: give the file `old` a second name `new` ([[g:hard-link]]). Kernel:
    [[kernel:sys_link]].
  20: |
    `mkdir(path)`: create a [[g:directory]]. Kernel: [[kernel:sys_mkdir]].
  21: |
    `chdir(path)`: change the calling process's current directory, the starting point for
    relative path names. Kernel: [[kernel:sys_chdir]].
  22: |
    `dup(fd)`: return a new descriptor, the lowest free one, that refers to the same
    [[g:open-file]] as `fd`. Kernel: [[kernel:sys_dup]].
  23: |
    `getpid()`: the calling process's [[g:pid]]. Kernel: [[kernel:sys_getpid]].
  24: |
    The raw `sbrk` system call: grow (or shrink) the process's memory by the first
    argument, in the mode given by the second ([[SBRK_EAGER]] or [[SBRK_LAZY]] from
    [[kernel/vm.h]]); returns the old end of memory. Kernel: [[kernel:sys_sbrk]].

    Its stub is called `sys_sbrk` instead of `sbrk` ([[user/usys.pl:12]]) so that the name
    `sbrk` can be the one-argument wrapper in [[user/ulib.c]]. Programs call [[sbrk]] or
    [[sbrklazy]] rather than this. The user-space `sys_sbrk` and the kernel's
    `sys_sbrk` share only a name; they are in different programs.
  25: |
    `pause(n)`: sleep for `n` clock ticks (about a tenth of a second each on QEMU; see
    [[g:timer-interrupt]]). Returns -1 if the process is killed while waiting. Unix calls
    this `sleep`. Kernel: [[kernel:sys_pause]].
  26: |
    `uptime()`: the number of clock ticks since boot. Kernel: [[kernel:sys_uptime]].
  27: |
    `sync()`: if a file-system [[g:transaction]] is open or being committed, wait until it
    has been committed to disk; otherwise return at once (every finished operation is
    already on disk, see [[g:write-ahead-log]]). Always returns 0. Kernel:
    [[kernel:sys_sync]].
  30: |
    `stat(path, &st)`: like `fstat`, but by name; implemented in user space with `open`,
    `fstat` and `close`.
  35: |
    `gets(buf, max)`: read one line from standard input. The C standard library's `gets`
    had no size limit and was removed from the language for that reason; this one takes
    the buffer size.
  41-42: |
    `sbrk(n)` and `sbrklazy(n)`: the two modes of the `sys_sbrk` system call, as
    one-argument functions. `sbrk` allocates the memory immediately; `sbrklazy` only
    reserves it, and pages are allocated when first touched.
  45: |
    `fprintf(fd, fmt, ...)`: formatted output to descriptor `fd`; the format starts at
    argument 2, the values at 3.
  46: |
    `printf(fmt, ...)`: formatted output to descriptor 1, standard output.
