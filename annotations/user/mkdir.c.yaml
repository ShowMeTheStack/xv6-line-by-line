summary: |
  `mkdir name ...` creates one empty [[g:directory]] for each name: `mkdir d` makes `d`,
  containing only the entries `.` (itself) and `..` (its parent). The whole job is done by
  one system call per name, `mkdir`, whose kernel side is [[kernel:sys_mkdir]]. That
  calls [[kernel:create]] with type `T_DIR`, which allocates an [[g:inode]], adds the `.`
  and `..` entries, and links the new directory into its parent, all inside one file
  system [[g:transaction]] so a crash cannot leave a half-made directory.

  **Read before:** [[user/cat.c]] (argument handling). **Read next:** [[user/rm.c]] and
  [[user/ln.c]], which have the same shape.

blocks:
  - lines: 1-3
    title: Headers
    note: |
      [[user/user.h]] declares `mkdir`; [[kernel/types.h]] must come first because
      `user.h` uses its types. [[kernel/stat.h]] is not used.

  - lines: 5-13
    title: At least one name is required
    note: |
      [[g:argv|argv]]`[0]` is the program name, so `argc < 2` means no directory was named.
      The usage message goes to [[g:standard-streams|standard error]] and the program
      exits with status 1 ([[g:exit-status]]).

  - lines: 15-23
    title: Create each directory, stopping at the first failure
    note: |
      For each name, the `mkdir` stub in [[user/usys.S]] traps into the kernel, which runs
      [[kernel:sys_mkdir]]. It returns -1 if the name already exists (as anything: file,
      directory or device), if the parent directory does not exist or has been removed, if
      the parent already has the maximum number of links ([[kernel:NLINK_MAX]]), or if the
      disk has no free inode.

      On failure the program prints which name failed and `break`s out of the loop, so the
      names after it are not attempted. It then falls through to `exit(0)`: the
      [[g:exit-status]] is 0 even though something failed. A script (or another program
      checking `wait`'s status) could not tell. Unix `mkdir` reports the error, continues
      with the remaining names and exits with a non-zero status.

lines:
  16: |
    Ask the kernel to create directory `argv[i]` ([[kernel:sys_mkdir]] →
    [[kernel:create]]). The path may be relative to the current directory or absolute.
  17: |
    Name the directory that could not be created, on standard error.
  18: |
    Stop: the remaining names are skipped.
  22: |
    Exit with status 0, even after a failure.
