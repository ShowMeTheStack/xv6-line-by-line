summary: |
  `/init` is the first user program, process 1. The kernel creates its process in
  [[kernel:userinit]] and loads this program into it in [[kernel:forkret]]
  ([[kernel/proc.c:532]]); every other process descends from it.

  It has two jobs:

  1. **Give the system a console.** It opens the console device as
     [[g:file-descriptor|descriptors]] 0, 1 and 2 (standard input, output and error).
     Every later process inherits these through `fork`, which is why programs can print
     without opening anything.
  2. **Keep a shell running and reap orphans.** It starts `/sh`, then waits forever. When
     the shell exits it starts a new one. Meanwhile its `wait` also collects every
     process whose parent died first, which the kernel hands to `init`
     ([[kernel:reparent]]). Without this, such processes would stay [[g:zombie|zombies]]
     forever.

  `init` must never exit: [[kernel:kexit]] panics the whole kernel if it tries.

  **Read before:** [[kernel/proc.c]] ([[kernel:userinit]], [[kernel:kwait]],
  [[kernel:reparent]]). **Read next:** [[user/sh.c]].

blocks:
  - lines: 1-10
    title: Headers
    note: |
      The only kernel definition this program needs is [[CONSOLE]], the console's device
      number, from [[kernel/file.h]]. That header also defines `struct inode`, which uses
      `struct sleeplock` and `NDIRECT`, so [[kernel/spinlock.h]],
      [[kernel/sleeplock.h]] and [[kernel/fs.h]] must be included before it to make it
      compile. [[kernel/fcntl.h]] supplies `O_RDWR`, and [[user/user.h]] the system calls.
      [[kernel/stat.h]] is not used by this file's own code.

  - lines: 12
    title: Arguments for the shell
    note: |
      The [[g:argv]] array passed to `exec`: one argument, the program name `sh`, then
      the null pointer that ends every `argv`.

  - lines: 14-24
    title: Open the console as descriptors 0, 1 and 2
    note: |
      The first process starts with no open files at all. The console is reached through
      a *device file* named `console` in the root directory: an [[g:inode]] of type
      `T_DEVICE` whose major number [[CONSOLE]] tells the kernel to send `read` and
      `write` to [[kernel:consoleread]] and [[kernel:consolewrite]] ([[kernel:devsw]]).

      `mkfs` does not create that file, so on the first boot of a fresh `fs.img` the
      [[open]] fails. [[mknod]] then creates it ([[kernel:sys_mknod]]), and the second
      `open` succeeds. The file stays in `fs.img`, so later boots find it.

      Since no descriptor is open yet, `open` returns 0, the lowest free one. Each [[dup]]
      then takes the next lowest: 1, then 2. All three now refer to the same
      [[g:open-file]], readable and writable. Every process forked from here on inherits
      them ([[kernel:kfork]]), and `exec` keeps them, which is how every program in xv6
      gets a [[g:console]] for standard input, output and error.

  - lines: 26-37
    title: Start a shell
    note: |
      The outer loop runs once per shell. [[printf]] writes to descriptor 1, the console
      just set up; this is the `init: starting sh` line you see after boot.

      Then the usual [[g:fork-exec]] pattern. The child replaces itself with the shell.
      The path `sh` has no leading `/`, so it is looked up in the current directory, which
      for this process is `/` ([[kernel:userinit]] set it, and `fork` copies it).

      If `fork` or `exec` fails, `init` (or its child) gives up with `exit(1)`. For the
      child that is harmless: `init` will see it exit and start another. For `init` itself
      it is fatal: [[kernel:kexit]] calls [[kernel:panic]] with `init exiting`
      ([[kernel/proc.c:331]]), because there would be no process left to adopt orphans.

  - lines: 39-54
    title: Wait forever, reaping the shell and orphans
    note: |
      [[wait]] ([[kernel:kwait]]) sleeps until *any* child of `init` exits, frees that
      child's process-table slot, and returns its [[g:pid]]. `init`'s children are not only
      the shells it started. When any process exits while its own children are still
      around, [[kernel:reparent]] makes `init` their parent and wakes `init`
      ([[kernel/proc.c:317]]). A [[g:background-job]] started by the shell is the
      everyday example: the shell's helper process exits at once, leaving the job to
      `init`.

      So this loop sees two kinds of exits:

      - **The shell.** For example after Ctrl-D at the prompt. The inner loop breaks, and
        the outer loop starts a new shell.
      - **An adopted orphan.** Nothing to do; `wait` has already freed its slot, which is
        the whole point. The loop waits again.

      `wait` returns -1 only if `init` has no children (impossible while a shell runs) or
      has been killed. The error branch calls `exit`, which panics the kernel. Typing
      `kill 1` at the shell prompt does crash xv6 with `panic: init exiting` (tested in
      QEMU); the kernel notices the kill on its way back to user space, before `init`
      gets to print the error message.

lines:
  19: |
    Try to open the console device for reading and writing. With no descriptors open,
    success returns 0.
  20: |
    The device file is missing: create `/console` as a device with major number
    [[CONSOLE]] (1) and minor number 0.
  21: |
    Open it again; this time it exists. The result, descriptor 0, is not checked.
  23: |
    Make descriptor 1 (standard output) refer to the console too.
  24: |
    And descriptor 2 (standard error).
  28: |
    Create the child that will become the shell ([[fork]] → [[kernel:sys_fork]] →
    [[kernel:kfork]]).
  29-32: |
    Fork failed. `init` exiting makes the kernel panic, so this ends the system.
  33-34: |
    In the child: become the shell. On success `exec` never returns.
  35-36: |
    `exec` failed (for example, no `sh` in the file system): this child exits, and `init`
    tries again.
  42: |
    Sleep until any child exits; collect it and get its PID. The `(int *)0` says the exit
    status is not wanted.
  43-45: |
    The shell itself exited: leave the inner loop so the outer loop starts a new one.
  46-48: |
    No children, or `init` was killed. Exiting here panics the kernel.
  49-51: |
    An orphan adopted from an exited parent has been reaped. Nothing more to do.
