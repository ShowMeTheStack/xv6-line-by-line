summary: |
  `cat` ("concatenate") copies files to standard output, one after another. `cat README`
  prints the file; `cat a b > c` joins two files into a third; plain `cat` with no
  arguments copies its standard input to its standard output, which makes it useful at
  either end of a pipeline.

  It is the smallest complete example of the Unix I/O model seen from user space: `open` a
  file by name to get a [[g:file-descriptor]], `read` from it in chunks until `read`
  returns 0 (end of file), `write` each chunk to descriptor 1, `close` the descriptor.
  Because `read` and `write` work the same way on files, the [[g:console]] and
  [[g:pipe|pipes]], `cat` never needs to know which kind of object it is copying.

  Each call goes through a stub in [[user/usys.S]] that executes `ecall`, and lands in the
  kernel in [[kernel:sys_open]], [[kernel:sys_read]], [[kernel:sys_write]] or
  [[kernel:sys_close]] ([[kernel/sysfile.c]]).

  **Read before:** [[user/user.h]] (the system-call declarations). **Read next:**
  [[user/echo.c]], then [[user/grep.c]] and [[user/wc.c]], which follow the same pattern.

blocks:
  - lines: 1-3
    title: Headers
    note: |
      [[kernel/types.h]] defines `uint` and friends, which [[user/user.h]] uses.
      [[kernel/fcntl.h]] supplies `O_RDONLY`, the open mode used on line 35. [[user/user.h]]
      declares the system calls (`read`, `write`, `open`, ...) and the small user library
      (`fprintf`, `strlen`, ...). There is no standard C library in xv6; these headers are
      all a user program gets.

  - lines: 5
    title: The copy buffer
    note: |
      A 512-byte buffer for moving data from input to output. It is a global, so it lives in
      the program's [[g:bss]] section rather than on the small user [[g:stack]]. 512 is a
      reasonable chunk: each `read` is one system call, so a bigger buffer means fewer
      trips into the kernel, but the size does not affect correctness.

  - lines: 7-22
    title: "cat(): copy one descriptor to standard output"
    note: |
      The loop is the classic Unix copy: `read` up to 512 bytes, then `write` exactly as many
      bytes as were read. `read` returns how many bytes it delivered, which can be fewer
      than asked: at the end of a file, or from the console, where [[kernel:consoleread]]
      returns after each line you type. That is why line 13 writes `n` bytes and not
      `sizeof(buf)`.

      `read` returns 0 at end of file (or when all write ends of a pipe are closed, or when
      you type Ctrl-D at the console) and -1 on error. Both end the loop; line 18 tells
      them apart.

      Errors go to descriptor 2, [[g:standard-streams|standard error]], so that they
      still reach the screen when standard output is redirected to a file. Both errors exit
      with status 1 ([[g:exit-status]]).

  - lines: 24-43
    title: "main(): standard input, or each named file in turn"
    note: |
      [[g:argv|argv]]`[0]` is the program name, so `argc <= 1` means "no file names". Then
      `cat` copies descriptor 0, [[g:standard-streams|standard input]], which the shell
      has already connected to the console, a file (`cat < f`) or a pipe (`ls | cat`).
      `cat` does not open or close it; it was inherited.

      Otherwise each argument is opened, copied and closed in order. Closing matters: a
      process has only 16 descriptor slots ([[kernel:NOFILE]]), so `cat` on more than about
      13 files would run out if it never closed them. Since [[kernel:sys_open]] always
      returns the lowest free descriptor ([[kernel:fdalloc]]), each file here gets descriptor
      3 again after the previous one is closed.

      A file that cannot be opened stops `cat` immediately with status 1; files named after
      it are not printed. (GNU `cat` reports the error and carries on with the next file.)

lines:
  12: |
    Read up to 512 bytes from `fd` into `buf`. The stub in [[user/usys.S]] traps into the
    kernel, where [[kernel:sys_read]] finds the open file and calls [[kernel:fileread]];
    that function dispatches to a pipe, a device driver or [[kernel:readi]] for a file on
    disk, and advances the file's offset. The loop continues while `read` returns a
    positive count.
  13: |
    Write the `n` bytes just read to descriptor 1 ([[kernel:sys_write]] →
    [[kernel:filewrite]]). A short or failed write means the output could not take the data
    (for example, the reading end of a pipe was closed), and continuing would silently
    lose data, so `cat` stops.
  14: |
    `fprintf(2, ...)` is the user library's formatted print to descriptor 2
    ([[user:fprintf]]); `printf` would go to descriptor 1.
  15: |
    `exit(1)` ends the process with a non-zero status: failure. It never returns
    ([[kernel:sys_exit]] → [[kernel:kexit]]).
  18: |
    The loop ended with `n == 0` (end of file, normal) or `n < 0` (an error, for example a
    bad descriptor). Only the second is reported.
  29: |
    No arguments other than the program name.
  30: |
    Copy standard input to standard output.
  35: |
    Open the file read-only. [[kernel:sys_open]] looks the path up ([[kernel:namei]]),
    allocates an [[g:open-file]] and a descriptor, and returns the descriptor, or -1 if the
    file does not exist or the tables are full. Opening a directory read-only succeeds, so
    `cat .` prints the directory's raw 16-byte entries: the file names show up, mixed with
    unprintable bytes (the 2-byte inode numbers and the NUL padding).
  36: |
    Report which file failed, on standard error.
  39: |
    Copy this file's contents to standard output.
  40: |
    Release the descriptor ([[kernel:sys_close]] → [[kernel:fileclose]]) so the slot can
    be reused for the next file.
  42: |
    Every file was copied: exit with status 0, success.
