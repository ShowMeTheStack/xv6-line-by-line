    `ctx` points at the generator's state, so the caller decides where the state lives.
  30: |
    Map any stored value into 1 … 0x7ffffffe, so that the state is never 0 or 2³¹ − 1,
    the two values that would make the generator stick at 0.
  31: |
    Split x for Schrage's method: 127773 is (2³¹ − 1) / 16807, rounded down.
  33: |
    16807 × x mod (2³¹ − 1), possibly minus 2³¹ − 1; no intermediate exceeds 31 bits.
  34: |
    Bring a negative result back into range by adding the modulus 2³¹ − 1.
