blocks:
  - lines: 1761-1812
    title: "bigfile: write a file in odd-sized pieces and read it back"
    note: |
      Writes 20 chunks of 600 bytes, chunk `i` filled with the byte value `i`, and then
      reads the file back in 300-byte pieces, checking that every piece holds the right
      value and that the total is 12,000 bytes.

      Neither size is a multiple of the 1024-byte [[kernel:BSIZE|block size]], so almost
      every `write` and `read` starts or ends in the middle of a [[g:block]], and many cross
      from one block into the next. That exercises the offset arithmetic in
      [[kernel:writei]] and [[kernel:readi]] (`off % BSIZE`, `BSIZE - off % BSIZE`) and the
      block lookup in [[kernel:bmap]]. The file needs 12 blocks, exactly the 12 direct
      blocks of an [[g:inode]], so it never reaches the [[g:indirect-block]].

      Each 600-byte chunk is read back as two 300-byte halves, which is why read number `i`
      must contain the value `i / 2`. Checking the first and last byte of each half is
      enough to catch data from the wrong chunk or the wrong place. A short read before the
      end, a wrong byte, or a wrong total fails the test with `exit(1)`.

  - lines: 1814-1859
    title: "fourteen: path components longer than DIRSIZ"
    note: |
      A directory entry stores a name in exactly [[kernel:DIRSIZ]] = 14 bytes, with no room
      for a terminating NUL when the name is 14 characters long ([[kernel/fs.h:54]]). This
      test checks the two rules that follow from that layout:

      - a 14-character name is stored and found again correctly, even though it is not
        NUL-terminated on disk;
      - a longer name is silently cut to its first 14 characters, both when creating and
        when looking up. The cut happens in [[kernel:skipelem]], which copies at most
        `DIRSIZ` bytes of each path element ([[kernel/fs.c:676]]), and comparisons use
        [[kernel:namecmp]], which compares at most `DIRSIZ` bytes.

      So `123456789012345` and `12345678901234` name the same thing. The test creates a
      directory with the 14-character name, then a subdirectory and a file through
      15-character spellings, opens the
      file through the 14-character ones, and checks that creating an existing directory
      through either spelling fails. Any mismatch means the kernel stored or compared names
      wrongly.

  - lines: 1861-1896
    title: "rmdot: the kernel refuses to unlink . and .."
    note: |
      Every [[g:directory]] contains the entries `.` (itself) and `..` (its parent). Removing
      either would break the tree: `..` is how a path climbs upward, and the parent's
      [[g:link-count]] counts the child's `..` entry. [[kernel:sys_unlink]] refuses both
      names explicitly ([[kernel/sysfile.c:221]]).

      The test tries all the ways to name them: `.` and `..` from inside the directory,
      then `dots/.` and `dots/..` from outside, where the final path element is still `.`
      or `..`. Every attempt must fail. Finally it removes the now-empty `dots` itself,
      which must succeed. A kernel that let `unlink(".")` through would corrupt link
      counts; the test notices because the call returned 0.

  - lines: 1898-1951
    title: "dirfile: a plain file cannot be used as a directory"
    note: |
      Creates an ordinary file `dirfile` and then tries every operation that needs a
      directory in that position: `chdir` into it, open or create `dirfile/xx`, `mkdir`,
      `unlink` and `link` under it. All must fail.

      The checks live in two places. [[kernel:sys_chdir]] tests the type of its target
      ([[kernel/sysfile.c:446]]). Path lookup in [[kernel:namex]] refuses to look inside
      anything that is not a directory ([[kernel/fs.c:703]]), so every path that goes
      *through* `dirfile` fails, whichever system call uses it. The `link` attempt also
      tests a cleanup path: [[kernel:sys_link]] raises the link count of `README` before it
      looks up the new name, and must lower it again when that lookup fails.

      The last part checks the rules for opening a directory: [[kernel:sys_open]] refuses
      to open one for writing ([[kernel/sysfile.c:355]]), and a directory opened read-only
      cannot be written through its descriptor, because the [[g:open-file]] is marked not
      writable and [[kernel:filewrite]] rejects it.

  - lines: 1953-1988
    title: "iref: path lookup must not leak inode references"
    note: |
      The kernel keeps in-memory copies of inodes in a table of only [[kernel:NINODE]] = 50
      slots. Each lookup takes a reference on the inodes it passes through and must drop it
      again with [[kernel:iput]]; a lookup that forgets one leaves a slot permanently in
      use, and once all 50 are taken [[kernel:iget]] panics with `iget: no inodes`.

      The test repeats a batch of lookups `NINODE + 1` times, each time one directory
      deeper, so that a leak of even one reference per iteration would exhaust the table.
      The batch deliberately includes failing lookups, because error paths are where
      references are most easily forgotten: the empty name `""`, and `README`, which does
      not exist inside `irefd`. The source comment names the case that motivated the test:
      when [[kernel:nameiparent]] is given a path with no elements, [[kernel:namex]] must
      still `iput` the starting directory before returning failure
      ([[kernel/fs.c:723]]).

      The return values are ignored; the test fails only by crashing the kernel. Cleanup
      climbs back up and removes the 51 nested directories.

  - lines: 1990-2028
    title: "forktest: fork fails cleanly when resources run out"
    note: |
      Forks up to 1000 children, each of which exits at once, until `fork` returns -1. Then
      it waits for all of them. It checks that at least one fork worked, that fork did fail
      before 1000 (there are not enough resources for 1000 processes), that `wait` returns
      exactly as many children as were created, and that one more `wait` reports "no
      children" with -1.

      When fork fails, [[kernel:kfork]] must undo whatever it had already set up, or later
      tests would find less memory. The leak check in [[drivetests]] would catch that.

      The source comment is outdated for this configuration. It says that inside usertests
      memory runs out before process slots do. But xv6 now has 128 MiB of RAM and
      [[kernel:NPROC]] = 64 slots, and a usertests process needs only a few dozen pages. So
      the process table fills first: [[kernel:allocproc]] finds no `UNUSED` slot. Run in QEMU
      with a print added, the loop stops at `n = 60`: 64 slots minus `init`, the shell,
      usertests and the test's own process.

  - lines: 2030-2092
    title: "sbrkbasic: sbrk fails cleanly, grows byte by byte, and survives fork"
    note: |
      [[sbrk]] moves the process's *break*, the end of its memory, and returns the old
      break. In this xv6, `sbrk` asks for eager allocation ([[kernel:SBRK_EAGER]]): the
      kernel allocates and maps the pages immediately, through [[kernel:sys_sbrk]],
      [[kernel:growproc]] and [[kernel:uvmalloc]].

      The test has three parts:

      1. A child asks for 1 GiB, far more than the 128 MiB of RAM. The call must fail with
         [[SBRK_ERROR]], or (with a lazy kernel) touching the memory must get the child
         killed. Only a child that writes to every page and survives exits with 1.
      2. The parent grows its memory 1 byte at a time, 5000 times. Each call must return
         exactly the previous break, and each new byte must be writable, including the
         ones that land on a freshly allocated page.
      3. After a `fork`, parent and child each grow by 2 more bytes. Both must see the same
         break, which checks that [[kernel:kfork]] copied the size `p->sz` along with the
         memory.

      The test ends with `exit(xstatus)` in the parent, so the child's verdict becomes the
      test's verdict.

  - lines: 2094-2149
    title: "sbrkmuch: grow to 100 MiB, shrink, regrow"
    note: |
      Grows the process until its break is at 100 MiB (`BIG`), most of the machine's 128
      MiB, and writes to the very last byte. Then it checks deallocation: shrinking by one
      page with a negative argument must move the break down, and growing again must
      return a page that is *zero*, not the page that still held the 99 written earlier.

      That last check is the interesting one. Shrinking goes through [[kernel:growproc]]
      to [[kernel:uvmdealloc]], which unmaps the pages and frees them. Growing goes through
      [[kernel:uvmalloc]], which takes a fresh page from [[kernel:kalloc]] and zeroes it
      ([[kernel/vm.c:233]]). If the kernel had only lowered `p->sz` without unmapping, the
      new mapping would hit the old one and [[kernel:mappages]] would panic with
      `mappages: remap`; if it handed back a page without zeroing, the 99 would leak into
      the "new" memory. Either way the test (or the kernel) fails.

      Finally it shrinks all the way back to where it started, so the 100 MiB returns to
      the free list before the next test.

  - lines: 2151-2173
    title: "kernmem: user code cannot read kernel memory"
    note: |
      The kernel lives at [[kernel:KERNBASE]] (`0x80000000`, 2 GiB) and above in physical
      memory, and in the kernel's own page table. A user process's [[g:page-table]] has no
      mappings there at all, so a user load from those addresses must cause a
      [[g:page-fault]] and kill the process.

      The test tries 40 addresses, spaced 50,000 bytes apart over the first 2 MB of physical
      memory, where the kernel's code and data begin. Each attempt happens in its
      own child, because the first successful fault kills the process that made it. In the
      kernel, the fault arrives in [[kernel:usertrap]] as a load page fault (cause 13).
      [[kernel:vmfault]] refuses it because the address is above the process size
      ([[kernel/vm.c:463]]), so `usertrap` marks the process killed and it exits with
      status -1 ([[kernel/trap.c:78]]). That -1 is what the parent waits for.

  - lines: 2175-2197
    title: "MAXVAplus: no writes at or above MAXVA"
    note: |
      [[kernel:MAXVA]] (`0x4000000000`, 2^38) is the end of the address range xv6 uses. The
      test tries to write at `MAXVA`, then `2 * MAXVA`, `4 * MAXVA`, and so on, doubling
      until the bit falls off the top of the 64-bit value: 26 addresses, from 2^38 to 2^63.
      Each write must kill the child that makes it.

      These addresses are invalid twice over. In [[g:sv39]] a virtual address must have
      bits 63–39 equal to bit 38; none of these do, so the hardware raises a page fault
      without even consulting the page table. And in software, [[kernel:vmfault]] refuses
      them because they are above the process size. Run in QEMU, each child produces a
      `usertrap(): unexpected scause 0xf` message (a store page fault) with `stval` equal
      to the address, and is killed.

      The test matters because the kernel's page-table code must never be asked to look up
      such an address: [[kernel:walk]] panics on any `va >= MAXVA` ([[kernel/vm.c:101]]).

  - lines: 2199-2271
    title: "sbrkfail: a failed allocation must give back what it took"
    note: |
      When [[kernel:uvmalloc]] runs out of memory partway through a large request, it must
      free the pages it already allocated for that request ([[kernel/vm.c:228-231]]). This
      test makes that happen and then checks that no memory was lost.

      Ten children in turn each try to grow to 100 MiB. The first one succeeds and keeps the
      memory; with 128 MiB of RAM only the first can get its 100 MiB, and later ones fail
      partway. Each child reports success or
      failure through a [[g:pipe]] and then waits to be killed, still holding whatever it
      got. While they are all still alive, the parent asks for one page. That page can only
      come from memory released by the *failed* attempts, so if a failed `uvmalloc` leaked
      its partial allocation, nothing is left and the parent's `sbrk` fails: `failed sbrk
      leaked memory`.

      After killing and reaping the children, a last child asks for 1000 MiB, which must
      fail with [[SBRK_ERROR]] rather than succeed or crash.

      If no child's allocation ever failed, the test prints a hint but continues: in that
      case it has not tested what it meant to.

  - lines: 2273-2299
    title: "sbrkarg: system calls can use freshly sbrk'd memory"
    note: |
      Passes newly allocated memory to system calls in both directions: as the source
      buffer of a `write` (the kernel reads it with [[kernel:copyin]]) and as the array that
      `pipe` fills in (the kernel writes it with [[kernel:copyout]]).

      With this kernel's eager [[sbrk]] the pages are already mapped, so both calls simply
      work. The test exists for kernels that allocate lazily (as the "lazy allocation" lab
      versions of xv6 do, and as [[sbrklazy]] does here): there, the kernel itself must
      notice an unmapped but legal page while copying and allocate it, the way
      `copyin` and `copyout` call [[kernel:vmfault]] in this kernel ([[kernel/vm.c:389-393]]).
      A kernel that treated such a page as a bad pointer would make `write` or `pipe` fail.

      The file is unlinked right after it is opened; the open descriptor keeps it alive
      until `close`.

  - lines: 2301-2315
    title: "validatetest: wild string pointers must not crash the kernel"
    note: |
      Calls `link("nosuchfile", p)` with `p` stepping one page at a time from 0 to about
      1.1 MB. The new-name pointer covers the program's own text and data, its stack
      [[g:guard-page]], its stack, and then hundreds of pages that are not mapped at all.

      [[kernel:sys_link]] copies both names in with [[kernel:argstr]] before doing anything
      else ([[kernel/sysfile.c:129]]). For an unmapped page or the guard page,
      [[kernel:copyinstr]] fails cleanly and `link` returns -1. For a mapped page, the
      kernel reads whatever bytes are there as a name, and `link` then fails because
      `nosuchfile` does not exist. Either way the answer is -1; the real test is that the
      kernel never faults while reading a user pointer. A kernel [[g:page-fault]] would make
      [[kernel:kerneltrap]] panic.

  - lines: 2317-2330
    title: "bsstest: uninitialized globals start out zero"
    note: |
      C promises that a global variable without an initializer, like `uninit` here, starts
      out as all zeros. Such variables go in the [[g:bss]] section, which takes no space in
      the executable file: the ELF [[g:program-header]] just says the segment is larger in
      memory (`memsz`) than in the file (`filesz`).

      It is the kernel's job to supply the zeros. [[kernel:kexec]] allocates the whole
      `memsz` with [[kernel:uvmalloc]], which zeroes every page it hands out
      ([[kernel/vm.c:233]]), and then copies in only `filesz` bytes. The test scans all 10,000
      bytes; any non-zero byte means the kernel exposed stale memory.

  - lines: 2332-2371
    title: "bigargtest: exec rejects arguments too big for the stack"
    note: |
      The new program's arguments are copied onto its one-page [[g:user-stack]]. If they do
      not fit, [[kernel:kexec]] must fail instead of writing below the stack, into the
      [[g:guard-page]] and the program's data.

      A child builds 31 arguments (`MAXARG - 1`) of 399 spaces each, about 12 KB in total,
      three times the 4096-byte stack, and calls `exec("echo", ...)`. [[kernel:sys_exec]]
      can still fetch them (one kernel page per string), but kexec checks each string
      against the stack bottom and gives up ([[kernel/exec.c:104]]), freeing the new
      [[g:page-table]] at its `bad:` label.

      The child cannot report failure through its exit status, because if `exec` wrongly
      succeeded, `echo` would run and exit with 0 too. So it leaves a file instead:
      `bigarg-ok` exists only if `exec` returned, and the parent checks for it.

  - lines: 2373-2424
    title: "fsfull: an old, unused test that fills the disk"
    note: |
      Creates files `f0000`, `f0001`, ... and writes each one block at a time until a write
      comes up short, stopping when a file gets no data at all; then deletes them.

      This function is **never run**. It takes no `char *s` parameter, so it does not fit
      the `struct test` type, and it appears in neither [[quicktests]] nor [[slowtests]].
      Its comment is also outdated: [[kernel:balloc]] no longer panics when the disk is
      full; it prints `balloc: out of blocks` and returns 0
      ([[kernel/fs.c:88]]), and the callers fail cleanly. The test that now checks
      disk-full behavior is [[diskfull]].

      Each file stops at [[kernel:MAXFILE]] blocks (268 KiB), because [[kernel:writei]]
      refuses to write past that size.

  - lines: 2426-2437
    title: "argptest: a buffer at the very end of memory with count -1"
    note: |
      Asks `read` to put -1 bytes into a buffer that starts at the last byte of the
      process's memory (`sbrk(0) - 1`). The result is ignored; the test passes as long as
      the kernel does not crash.

      The test was added in 2016, for the x86 version of xv6, to check how the kernel
      validated a pointer argument whose size is negative. In this kernel the case is cut off at the top:
      [[kernel:fileread]] rejects any negative count before touching the buffer
      ([[kernel/file.c:111]]), a check added in commit 2534832.

  - lines: 2439-2463
    title: "stacktest: there is a guard page below the user stack"
    note: |
      Below each user stack, [[kernel:kexec]] leaves one [[g:guard-page]]: mapped, but with
      the user-access bit cleared by [[kernel:uvmclear]] ([[kernel/exec.c:95]]). A stack
      that overflows into it causes a [[g:page-fault]] instead of quietly overwriting the
      program's data, which sits right below.

      A child reads from one stack-size below its current stack pointer. The stack is
      [[kernel:USERSTACK]] = 1 page and the stack pointer is somewhere inside it, so that
      address is inside the guard page. The read must fault. In [[kernel:usertrap]],
      [[kernel:vmfault]] declines to help, since the page is already mapped
      ([[kernel/vm.c:466]]), so the child is killed and exits with -1. In QEMU the child
      reports `scause 0xd` (load page fault) with `stval` inside the guard page.

      Unusually, this test's parent itself calls `exit`, turning -1 into 0 (pass) and any
      other status into failure.

  - lines: 2465-2497
    title: "nowrite: writes to forbidden addresses must fault"
    note: |
      Each child writes to one forbidden address and must be killed for it. If the write
      goes through, the child prints a message and exits with 0, and the parent turns that
      into a failure. The addresses cover each kind of protection:

      - `0`, the program's own code: mapped, but without write permission;
      - `0x80000000`, where the kernel lives: not mapped in a user page table;
      - [[kernel:TRAPFRAME]] and [[kernel:TRAMPOLINE]], the top two pages: mapped, but
        without the user bit, so only the kernel may touch them;
      - [[kernel:MAXVA]] and `0xffffffffffffffff`: outside the range xv6 ever maps.

      In every case the store raises a store [[g:page-fault]] (cause 15), and
      [[kernel:vmfault]] refuses it: the address is either already mapped or above the
      process size. Run in QEMU, all six children print `scause 0xf` and are killed,
      including the last, even though a 4-byte store to an address ending in `f` is also
      misaligned.

      Compare [[kernel:copyout]], which enforces the same read-only rule for the kernel's
      own writes into user memory ([[kernel/vm.c:363-365]]).

  - lines: 2499-2512
    title: "pgbug: a wild pointer above MAXVA used to crash the kernel"
    note: |
      A [[g:regression-test]] for a bug fixed in 2019 (commit 402e7b5). The pointer
      `0xeaeb0b5b00002f5e` is far above [[kernel:MAXVA]]. Back then,
      [[kernel:copyinstr]] cast the page address to a 32-bit `uint`, which chopped off the
      high bits. [[kernel:walkaddr]] checked the truncated address, which was mapped, but the
      copy then added the full, untruncated offset to the physical address, so the kernel
      read from a wild address and took a page fault of its own, which is a panic.

      The fix removed the cast and made [[kernel:walkaddr]] reject addresses at or above
      `MAXVA` ([[kernel/vm.c:127]]). Today `exec(big, ...)` fails when
      [[kernel:argstr]] cannot copy the path, and `pipe(big)` fails when
      [[kernel:copyout]] refuses the destination ([[kernel/vm.c:352]]). Both return
      values are ignored: the test passes if the kernel survives to run `exit(0)`.

  - lines: 2514-2570
    title: "sbrkbugs: shrinking memory in awkward amounts"
    note: |
      A [[g:regression-test]] for bugs in [[kernel:uvmdealloc]], each run in its own
      child: shrink to size 0, shrink into the middle of the first page, and shrink by 10
      bytes, too little to free a page. Each case once panicked the kernel. The children's
      exit statuses are ignored (`wait(0)`); the test passes if the kernel survives.

      The interesting part is that in the first two cases the child shrinks away the very
      code it is running, and in the third its stack. So none of the children reaches its
      `exit(0)`. Running the test in QEMU shows what happens:

      - cases 1 and 2: the `sys_sbrk` [[g:syscall-stub]] (code page 5) is gone when the
        kernel returns to it, so the next instruction fetch faults (`scause 0xc`) and the
        child is killed;
      - case 3: the code survives (the break is set in page 10), but the stack page above
        it does not. The [[sbrk]] wrapper reloads its return address from the stack, that
        load faults (`scause 0xd`), and the child is killed **before** calling `sbrk(-10)`.

      So with this build's memory layout the third case no longer tests what its comment
      describes. What all three still test is that [[kernel:kexit]] and
      [[kernel:uvmfree]] can tear down a process whose memory has been cut to an odd size.

  - lines: 2572-2596
    title: "sbrklast: copying to and from the last, partial page"
    note: |
      Arranges for the process size to end 10 bytes short of a page boundary: grow to a
      page boundary, add a page, add 10 bytes (which maps one more page), then shrink by 20
      bytes. The shrink drops the page that held the extra 10 bytes ([[kernel:uvmdealloc]]
      frees whole pages above the rounded-up new size), so the last mapped page is now
      only partly inside the process.

      Then it uses an address 64 bytes below the end in three system calls: as a path for
      `open` ([[kernel:copyinstr]]), as the source of a `write` ([[kernel:copyin]]) and as
      the destination of a `read` ([[kernel:copyout]]). The page is mapped and the
      addresses are below `p->sz`, so all three must work and the byte must survive the
      round trip. A kernel that got the arithmetic around a partial last page wrong, for
      example by unmapping one page too many, would fail here.

      The test leaves a file named `x` behind; it never unlinks it.

  - lines: 2598-2606
    title: "sbrk8000: a negative argument that looks like a large positive one"
    note: |
      `sbrk` takes an `int`. The constant `0x80000004` does not fit in a 32-bit signed
      `int`, so it arrives as -2,147,483,644: a request to shrink by about 2 GiB, more than
      the process has.

      [[kernel:sys_sbrk]] sends negative requests to [[kernel:growproc]], which computes
      the new size as `sz + n` in unsigned 64-bit arithmetic. Because `n` is larger than
      `sz`, the sum wraps around to a huge number. [[kernel:uvmdealloc]] sees a "new size"
      that is not smaller than the old one and does nothing. So the call changes nothing
      and returns the old break.

      The test then reads and writes the last byte of memory. That only works if the kernel
      neither grew the process by 2 GiB (treating the value as unsigned) nor freed pages
      because of a wrapped-around size. [[lazy_copy]] relies on the same behavior.

  - lines: 2608-2621
    title: "badarg: exec with a bad argument pointer must not leak memory"
    note: |
      A [[g:regression-test]] for commit d940fd1 (2019). [[kernel:sys_exec]] copies each
      argument string into a page of its own from [[kernel:kalloc]]. It allocates the page
      *before* copying, so when the copy fails (here because `0xffffffff` is far above the
      process's memory), it must free that page on the way out
      ([[kernel/sysfile.c:495-497]]). Before the fix it did not.

      Repeating the bad call 50,000 times would leak about 195 MiB at one page per call,
      more than the 128 MiB of RAM. A leaking kernel therefore runs out of memory long
      before the loop ends, and the leak check in [[drivetests]] would catch even a smaller
      leak. The test itself checks nothing; it exits 0 if it gets through.

  - lines: 2623-2650
    title: "lazy_alloc: a 1 GiB lazy region, touched sparsely"
    note: |
      [[sbrklazy]] grows the process without allocating anything:
      [[kernel:sys_sbrk]] only raises `p->sz` ([[kernel/sysproc.c:54-63]]). A page gets
      real memory the first time the program touches it. The access raises a
      [[g:page-fault]], and [[kernel:usertrap]] calls [[kernel:vmfault]], which allocates a
      zeroed page and maps it ([[kernel/trap.c:71-74]]). The faulting instruction is then
      run again and succeeds.

      This test reserves 1 GiB, eight times the machine's RAM, so it can only pass if the
      allocation really is lazy. It then writes to one page in every 64 (each page stores
      its own address) and reads all of them back. That touches 4096 pages, 16 MiB.

      When the test process exits, [[kernel:uvmfree]] walks the whole 1 GiB range, and
      [[kernel:uvmunmap]] skips the pages that were never mapped ([[kernel/vm.c:203-206]]).
      The leak check in [[drivetests]] confirms that the 4096 pages came back.

  - lines: 2652-2691
    title: "lazy_unmap: shrinking really unmaps lazily allocated pages"
    note: |
      Reserves 1 GiB lazily, touches one page in every 4096 (16 MiB apart, 64 pages in
      all), and then checks each of them in a separate child. The child shrinks the
      process by the whole 1 GiB and writes to the page again. That write must kill the
      child: the page is now beyond the process size, and [[kernel:vmfault]] refuses it. If
      the old page were still mapped, the write would succeed, the child would exit 0, and
      the test would report `memory not unmapped`.

      Two kernel paths are involved. A negative [[sbrklazy]] is not lazy at all:
      [[kernel:sys_sbrk]] sends every negative request to [[kernel:growproc]] and
      [[kernel:uvmdealloc]] ([[kernel/sysproc.c:50]]), which free the pages. And each
      `fork` copies a process whose size is over 1 GiB, which works only because
      [[kernel:uvmcopy]] skips pages that were never allocated ([[kernel/vm.c:306-310]]).
      Otherwise each child would need 1 GiB of RAM.

  - lines: 2693-2741
    title: "lazy_copy: system calls meeting lazy and invalid addresses"
    note: |
      Three separate checks on how the kernel's copying functions treat unusual user
      addresses.

      1. **A lazy page as a system-call argument.** The path given to `open` sits in a page
         that [[sbrklazy]] reserved but nobody touched yet. When
         [[kernel:copyinstr]] finds no mapping, it calls [[kernel:vmfault]] itself
         ([[kernel/vm.c:419-424]]), which allocates a zeroed page, so the path is the empty
         string. The result of `open` is ignored (the empty path in fact opens the current
         directory, and the descriptor is never closed), so the test only catches a kernel
         panic.
      2. **Shrinking by more than the whole size.** `sbrk(-(sz + 1))` must leave the
         process alone and return the old size. The new size `sz + n` wraps around, as in
         [[sbrk8000]], so [[kernel:uvmdealloc]] does nothing.
      3. **Addresses no copy may use.** `read` into, and `write` from, six addresses must
         fail: two unmapped pages just below the [[kernel:TRAPFRAME]], the trapframe and
         [[kernel:TRAMPOLINE]] pages (mapped, but not for user access), and
         [[kernel:MAXVA]] and twice MAXVA. Each fails inside [[kernel:copyout]] or
         [[kernel:copyin]], so `read` returns -1 through [[kernel:readi]], and `write`
         returns -1 because [[kernel:writei]] copied 0 of the 512 bytes.

  - lines: 2743-2776
    title: "lazy_copyinstr: a path that runs into a lazy page"
    note: |
      Places a one-character path, `/`, in the last byte of the first of two lazily
      reserved pages. Storing it faults that page in, while the second page, starting at
      `p[4096]`, stays unmapped. When [[kernel:copyinstr]] copies the
      path, it reads `/`, reaches the end of the page, and looks for the terminating NUL on
      the next page. That page has no mapping yet, so `copyinstr` calls
      [[kernel:vmfault]] ([[kernel/vm.c:421-424]]), which maps a fresh zeroed page. Its
      first byte, 0, ends the string.

      The test passes if `open` succeeds and `fstat` reports that what it opened is a
      directory (`T_DIR`), the root. A `copyinstr` that gave up at the page boundary, or
      did not handle lazy pages, would make `open` fail.

      The first `sbrk` rounds the break up to a page boundary, so that `p[4095]` and
      `p[4096]` fall on opposite sides of a page boundary.

  - lines: 2778-2826
    title: "lazy_sbrk: growing right up to the trapframe"
    note: |
      Grows the process lazily, 1 GiB at a time, until it is almost 256 GiB
      ([[kernel:MAXVA]]), then sets the break exactly one page below
      [[kernel:TRAPFRAME]], the highest a process may grow. It then allocates that last
      page eagerly, checks it is zero-filled, and checks that growing by even one more byte
      fails, whether eagerly or lazily.

      The top two pages of every address space, the trapframe and the
      [[g:trampoline]], are already mapped. Commit 8402fc9 (2025) added this test, which at
      first panicked the kernel: nothing stopped `sbrk` from growing into those pages, and
      [[kernel:mappages]] panicked on the existing mapping. The companion commit c71a6c4
      made both kinds of growth stop at `TRAPFRAME`: [[kernel:growproc]] checks
      eager requests ([[kernel/proc.c:243]]), and [[kernel:sys_sbrk]] checks lazy ones,
      including overflow of the addition ([[kernel/sysproc.c:58-61]]).

      Some of the error checks are dead code. A pointer is never less than 0, so
      `p < 0` and `p1 < 0` are always false; the compiled code
      (`user/usertests.asm`) contains no test for them at all. The checks that work are the
      exact comparisons with the expected address and with -1.

      Exiting this process is a lot of work: [[kernel:uvmfree]] visits each of the roughly
      67 million page numbers below its size, even though almost none are mapped.

  - lines: 2828-2931
    title: "partial_write: a failed write must still log what it changed"
    note: |
      A [[g:regression-test]] for a [[g:write-ahead-log]] bug fixed in commit fb0fed8
      (2026). The test's own comment at the top lists the steps.

      The file starts as `A`. The test writes 2 bytes starting at the last byte of its
      memory: the first byte, `X`, is valid, and the second is beyond the process size.
      Inside [[kernel:writei]], [[kernel:copyin]] copies the `X` into the cached disk block
      and then fails on the second byte. So the block in the [[g:buffer-cache]] has been
      changed, even though `write` reports failure (-1).

      The bug: on that error path `writei` released the block without calling
      [[kernel:log_write]]. The block was modified but not logged, so nothing would ever
      write it to disk, and nothing kept it in the cache. Reading the file right away still
      showed `X` from the cache. But once the block was evicted, a later read fetched the
      old `A` from disk. The fix logs the block on the error path too
      ([[kernel/fs.c:560-564]]).

      To force the eviction, the test writes 64 KiB to another file, far more than the 30
      buffers of the cache ([[kernel:NBUF]]), and then reads the byte again. Note the
      design decision this reveals: xv6 keeps the partial change and reports an error,
      instead of undoing it.

  - lines: 2933-2962
    title: "unlinkcwd: looking up paths from a deleted directory"
    note: |
      A [[g:regression-test]] for commit 9da28f5 (2026), which fixed a panic found with
      these shell commands: `mkdir /a; mkdir /a/b; cd /a/b; rm /a/b; rm /a; ls ..`.

      After the two unlinks, the current directory `b` has no names left (link count 0),
      but it stays in memory because the process's `cwd` still refers to it. Its parent
      `a`, though, is gone completely: its inode was freed. `b`'s `..` entry still holds
      `a`'s old [[g:inode-number]]. Looking up `..` from `b` used to fetch that freed inode,
      and [[kernel:ilock]] panicked with `ilock: no type`.

      The fix makes [[kernel:namex]] refuse to search any directory whose link count is 0
      ([[kernel/fs.c:707]]), and makes [[kernel:create]] refuse to create entries in one
      ([[kernel/sysfile.c:269]]). So `open("../")` and `open("../c", O_CREATE)` must fail.
      The test only prints a message if they succeed; the failure that really matters, a
      kernel panic, would stop the whole run.

  - lines: 2964-3037
    title: "The table of quick tests"
    note: |
      `quicktests` lists every test that runs in a few seconds or less, in the order
      [[runtests]] runs them. Each entry pairs a test function with its name: the name is
      what `usertests <name>` matches and what the output prints. The first 38 entries are
      defined in the first half of this file.

      The order is roughly from basic to demanding: copying data across the user/kernel
      boundary, then files, processes, and concurrent file-system work, then memory
      ([[sbrk]], lazy allocation, protection), and last the newest regression tests. Order
      matters little for correctness, because each test runs in its own process and most
      tests clean up their files. It does matter for diagnosis: a failure in a basic test early on
      explains later failures. The table ends with a `{0, 0}` entry, so that loops over it
      need no separate length.

      Together with [[slowtests]], [[run]], [[runtests]], [[countfree]], [[drivetests]] and
      [[main@user/usertests.c|main]], this table is the [[g:test-harness]].

  - lines: 3039-3082
    title: "bigdir: a directory with 500 entries"
    note: |
      Creates one file `bd` and gives it 500 more names in the current directory with
      `link`, then removes all 501 names. Every `link` makes [[kernel:dirlink]] scan the
      directory for a free slot and [[kernel:dirlookup]] scan it for a duplicate, so the
      test exercises linear search over a large [[g:directory]]. At the end, the file's
      [[g:link-count]] goes from 501 down to 0, and the inode is freed when the last name
      goes.

      The comment "directory that uses indirect blocks" is outdated. With 16-byte entries
      and 1024-byte blocks, the 12 direct blocks hold 768 entries. Even with the root
      directory's own two dozen or so entries, about 525 are in use, so the directory never
      reaches its [[g:indirect-block]]. The comment dates from the x86 xv6, whose blocks
      were 512 bytes, which would put the same entries well past the 12 direct blocks.

      The names are `x` plus two characters, computed from `i / 64` and `i % 64` by adding
      them to `'0'`. That gives characters from `0` to `o` in ASCII, never `/` or NUL, and
      a different name for each `i`.

  - lines: 3084-3136
    title: "manywrites: concurrent writers, looking for deadlock"
    note: |
      Four children write to the disk at the same time, each to its own file (`ba` to
      `bd`), for 30 rounds. In each round child `ci` writes the 12 KiB `buf` `ci + 1` times
      and then deletes the file. Each 12 KiB write is split by [[kernel:filewrite]] into
      four [[g:transaction|transactions]] of 3 KiB ([[kernel/file.c:153]]).

      So four processes on several CPUs keep calling [[kernel:begin_op]] and
      [[kernel:end_op]], filling and committing the [[g:write-ahead-log]], and sending
      requests to the virtio disk driver at once. As the comment says, the goal is to
      provoke a [[g:deadlock]] in the disk driver, a bug that only shows up when requests
      overlap. A deadlock would make the test hang rather than fail; `howmany` can be raised
      to run longer.

      Each child exits with 1 on any error, and the parent passes the first non-zero
      status on as its own.

  - lines: 3138-3173
    title: "badwrite: a write from a bad buffer must not leak a disk block"
    note: |
      A [[g:regression-test]] for commit 7c7ed20 (2019). Writing one byte to an empty file
      makes [[kernel:writei]] allocate the file's first data block with [[kernel:bmap]]
      *before* it copies the byte from the user. Here the copy then fails, because
      `0xffffffffff` is not a valid user address. The bug was that `writei` wrote the inode
      back to disk only when the file had grown, so on this failure path the newly
      allocated block was never recorded in the on-disk inode. After `close`, the
      in-memory copy has no references, and [[kernel:iget]] never hands out a slot's cached
      contents once its count is 0: it recycles the slot as invalid. So when `unlink` later
      freed the file, it re-read the inode from disk, which did not list the block, and the
      block was lost for good. Today `writei` calls [[kernel:iupdate]] unconditionally
      ([[kernel/fs.c:573-576]]).

      The test repeats create, bad write, close, delete 600 times, then checks that one
      honest 1-byte write still succeeds. If every round leaked a block, the disk would
      eventually be full and that last write would fail. ([[kernel:balloc]] no longer
      panics when the disk is full, despite the comment.) The comment's caveat applies:
      the freshly built file-system image has roughly 990 free blocks, so 600 rounds alone
      might not use them all up.

  - lines: 3175-3210
    title: "execout: exec when memory is almost gone"
    note: |
      [[kernel:kexec]] allocates memory at many points: a new [[g:page-table]], the
      program's segments, the stack, and the pages [[kernel:sys_exec]] uses for argument
      strings. If any allocation fails, exec must free everything it already took and
      return -1, leaving the old program intact. This test makes allocations fail at as
      many different points as it can.

      For each `avail` from 0 to 14, a child first takes *all* free memory, one page at a
      time, and then gives back `avail` pages. Then it tries to run `echo`. With 0 pages
      free, exec fails at its first allocation; with a few more, it gets further before
      failing; eventually there is enough and `echo` runs. Closing descriptor 1 first keeps
      `echo`'s output, if it runs at all, off the screen.

      The children's exit statuses are ignored. The test passes if the kernel does not
      panic. Any page lost on a failure path is caught by the leak check in
      [[drivetests]]. Commit 5860dcd (2020) added this test and fixed the exec bugs it
      found.

  - lines: 3212-3291
    title: "diskfull: run out of disk blocks, then keep going"
    note: |
      Fills the disk and then checks that operations needing a new block fail cleanly
      instead of panicking.

      First it creates files `big0`, `big1`, ... and writes each one full
      ([[kernel:MAXFILE]] blocks), until a write fails because [[kernel:balloc]] found no
      free block. A fresh file system has about 990 free blocks, so this takes about four
      files.

      Then it creates up to 128 empty files. An empty file needs an inode but no data
      block, so these succeed while the root directory still has free slots in the blocks
      it already owns. Once it needs one more block for its entries, [[kernel:dirlink]]
      fails, and [[kernel:create]] must undo the half-made inode. Finally it calls `mkdir`,
      which must fail too, because a new directory needs a block for its `.` and `..`
      entries ([[kernel/sysfile.c:302]]).

      Commits 872fa88 and 8621be8 (2022) made these paths tolerate a full disk; before,
      `balloc` panicked. Everything is deleted at the end. Note that when a write fails,
      the file is closed twice (lines 3240 and 3244); the second `close` returns -1
      harmlessly.

  - lines: 3293-3322
    title: "outofinodes: run out of inodes"
    note: |
      The disk has room for only 200 inodes (`NINODES` in [[mkfs/mkfs.c]]), and every file
      uses one. This test creates up to 1024 empty files and expects creation to fail
      somewhere along the way. When it does, [[kernel:ialloc]] must print
      `ialloc: no inodes` and return 0 ([[kernel/fs.c:219]]), and `open` must return -1.
      Before commit 7c1810e (2022) the kernel panicked instead.

      The test stops creating at the first failure and then deletes every name it might
      have made, so the inodes come back for the following tests. The names `zz00` to
      `zzOO` come from the same digit-plus-offset trick as in [[bigdir]].

  - lines: 3324-3392
    title: "linkoverflow: link count must not overflow"
    note: |
      A file's [[g:link-count]] is a `short`, at most 32767. Before commit fa4789f (2026),
      the `link` call that would give a file its 32768th name wrapped the count around to
      -32768. Now
      [[kernel:sys_link]] refuses to go past [[kernel:NLINK_MAX]] ([[kernel/sysfile.c:145]]).

      The test creates `/lof` and links it up to 32768 times. A single directory cannot
      hold that many entries, because a directory file is at most [[kernel:MAXFILE]] blocks,
      so the links are spread over 64 directories `/d_aa` to `/d_dp`, 512 names in each.
      When `link` fails, the test uses `stat` to check that the count stopped at the
      maximum; a failure earlier than that is a real error. After the loop, the count must
      not be negative.

      This test is **not run**: its entry in [[slowtests]] is commented out, because it is
      extremely slow (commit 35b0884). It also cleans up only `/lof` itself, leaving the 64
      directories and 32766 links behind.

  - lines: 3394-3404
    title: "The table of slow tests"
    note: |
      Tests that take a long time, mostly because they fill the disk or the inode table or
      write a lot of data. [[drivetests]] runs them after the quick tests, unless
      `usertests -q` asked for the quick tests only. The format and the `{0, 0}` end marker
      are the same as in [[quicktests]].

  - lines: 3406-3434
    title: "run(): one test in its own process"
    note: |
      Runs one test function in a fresh child process and turns the child's
      [[g:exit-status]] into a verdict: 0 is a pass, anything else a failure.

      A separate process for every test is the key design choice of this
      [[g:test-harness]]. A test may run its process out of memory, close its standard
      output, change its working directory, unmap its own stack, or get killed by the
      kernel, and none of that affects the harness or the next test. When the child is
      killed for a bad memory access, [[kernel:usertrap]] makes it exit with -1, which
      counts as a failure here. That is why the tests that *expect* a kill (like
      [[kernmem]]) check for -1 in their own children and turn it into a normal exit code.

      The kernel's `usertrap(): unexpected scause ...` messages often appear in the middle
      of the `test name: OK` line. The file's header comment says they can be ignored when
      the test prints OK.

  - lines: 3436-3452
    title: "runtests(): run one table, or one test from it"
    note: |
      Walks a test table until its `{0, 0}` end marker, running either every test or, if
      `justone` names a test, only that one. Returns how many tests it ran, or -1 if one
      failed and the run should stop.

      `continuous` comes from [[main@user/usertests.c|main]]: with `-C` (value 2) a failure
      is reported by [[run]] but does not stop the run; otherwise the first failure prints
      `SOME TESTS FAILED` and ends this table.

  - lines: 3454-3469
    title: "countfree(): count free memory pages from user space"
    note: |
      A user program cannot ask the kernel how much memory is free; xv6 has no such system
      call. So `countfree` measures it: it grows its own memory one page at a time with the
      eager [[sbrk]], which takes a real page from [[kernel:kalloc]] each time, until the
      kernel says no. The number of successful calls is the number of free pages. Then it
      gives everything back in one shrink.

      The count is a little lower than the true number of free pages, because some free
      pages become page-table pages for the growing process. That does not matter, because
      [[drivetests]] only compares two counts taken the same way in the same process. The
      page-table pages stay with the process after the shrink ([[kernel:uvmunmap]] frees
      only the data pages), so the second count does not pay for them again.

      For a moment the whole machine has no free memory. That is safe here because nothing
      else is running while the harness counts.

  - lines: 3471-3512
    title: "drivetests(): run everything, then check for leaked memory"
    note: |
      Runs the quick tests, then (unless `quick`) the slow tests, and around them compares
      free memory before and after. If fewer pages are free at the end than at the start,
      some test made the kernel lose memory, even if every test said OK. Several tests
      ([[badarg]], [[execout]], [[sbrkfail]], the lazy-allocation tests) rely on this check
      to catch the leaks they are designed to provoke.

      With `continuous` set (`-c` or `-C`) the whole sequence repeats forever, which is a
      way to find bugs that appear only rarely, such as races. `-c` stops at the first
      failure; `-C` reports failures and keeps going.

      Returns 0 for success and 1 for failure; [[main@user/usertests.c|main]] turns that
      into the program's exit status.

  - lines: 3514-3538
    title: "main(): parse the command line"
    note: |
      usertests accepts at most one argument:

      | Command | Meaning |
      |---|---|
      | `usertests` | all quick and slow tests, once |
      | `usertests -q` | quick tests only |
      | `usertests -c` | all tests, repeated until one fails |
      | `usertests -C` | all tests, repeated forever, failures reported but ignored |
      | `usertests name` | only the test called `name`, from either table |

      Options cannot be combined: the usage message lists `[-c] [-C] [-q] [testname]` as if
      they could, but any second argument is rejected.

      The program ends by printing `ALL TESTS PASSED`. `test-xv6.py` waits for exactly that
      line after typing `usertests`, `usertests -q` or `usertests <name>` into xv6's shell
      ([[test-xv6.py:203-206]]), so this one line
      is what the project's automated testing checks.

lines:
  1764: |
    An `enum` is a common way to give a name to an integer constant inside a function.
    `SZ = 600` is deliberately not a divisor of the 1024-byte block size.
  1774: |
    Fills the chunk with the byte value `i`, so each 600-byte region of the file is
    recognizable when read back.
  1789: |
    Reads half a chunk at a time. Reads therefore start at offsets 0, 300, 600, ..., most of
    them in the middle of a block, and some (such as 900 to 1200) cross a block boundary.
  1800: |
    Read number `i` covers half of chunk `i / 2`. Checking the first and last byte is
    enough to catch data from the wrong chunk.
  1821: |
    Exactly 14 characters: the name fills all `DIRSIZ` bytes of the directory entry, with no
    NUL after it.
  1825: |
    The second component has 15 characters. [[kernel:skipelem]] keeps only the first 14,
    so this creates `12345678901234/12345678901234`.
  1829: |
    All three 15-character components are cut to 14 characters, so the new file is
    `12345678901234/12345678901234/12345678901234`, inside the two directories just made.
  1836: |
    Opening by the 14-character spelling must find the file created under the 15-character
    one.
  1843: |
