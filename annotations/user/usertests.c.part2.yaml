  2310: |
    `p` is the *new name*. The kernel copies both names before doing anything else, so this
    is a test of [[kernel:copyinstr]] on each page.
  2318: |
    10,000 bytes in [[g:bss]]. Because it has no initializer, it takes no space in the
    executable file; the kernel must provide it as zeros.
  2343: |
    `static` places the 32-pointer array in the program's [[g:bss]] rather than on the
    one-page stack. Its elements start out as 0.
  2345-2347: |
    One 400-byte buffer of spaces, ending in a NUL: a 399-character string. All 31 argument
    pointers below point at this same buffer.
  2348-2350: |
    31 arguments plus the NULL that ends the list: the most [[kernel:sys_exec]] accepts
    ([[kernel:MAXARG]] = 32). Copied onto the new stack, they need 31 × 400 = 12,400 bytes,
    three times its 4096.
  2353: |
    Must fail and return. [[kernel:kexec]] sees that the strings would go below the stack
    ([[kernel/exec.c:104]]) and jumps to `bad:`.
  2354-2355: |
    Reached only if `exec` returned. The file is the child's way of saying so: if `exec`
    had succeeded, `echo` would also exit with status 0, so the status alone cannot tell.
  2376: |
    No `char *s` parameter, unlike every other test: this function cannot go in the test
    tables, and nothing calls it.
  2399-2401: |
    Writes one block at a time until a write comes up short, that is, the disk is full or
    the file has reached its maximum size.
  2435: |
    `sbrk(0) - 1` is the last byte of the process's memory, and -1 asks for an impossible
    number of bytes. [[kernel:fileread]] rejects a negative count at once
    ([[kernel/file.c:111]]).
  2449: |
    [[r_sp]] reads the stack pointer register with one instruction. It comes from
    [[kernel/riscv.h]], which this user program includes.
  2450: |
    One stack-size ([[kernel:USERSTACK]] pages) below a pointer inside the one-page stack
    is an address inside the guard page.
  2452: |
    `*sp` is evaluated before `printf` runs, so the fault happens before anything is
    printed.
  2459-2462: |
    -1 means the kernel killed the child, which is the expected outcome. This test's own
    process then exits with 0 for a pass. Any other status is passed on as the failure.
  2472-2477: |
    One address per kind of protection: read-only program text, kernel memory,
    [[kernel:TRAPFRAME]], [[kernel:TRAMPOLINE]], [[kernel:MAXVA]], and the very top of the
    64-bit range.
  2482-2483: |
    A `volatile` pointer, so the compiler must really perform the store; storing through
    an address like 0 could otherwise be treated as undefined behavior and optimized
    unpredictably.
  2491: |
    0 means the store worked and the child reached `exit(0)`. The kernel's kill would have
    produced -1.
  2502: |
    A global, so the address is loaded at run time from the data segment. Bits 63–32 hold
    `0xeaeb0b5b`; the low 32 bits, `0x00002f5e`, look like a plausible small user address.
    That is what made the old 32-bit truncation so dangerous.
  2508: |
    The path pointer is invalid, so [[kernel:sys_exec]] fails at its first
    [[kernel:argstr]] ([[kernel/sysfile.c:466]]); `argv` is never looked at.
  2509: |
    The kernel would write the two new descriptors to `big`; [[kernel:copyout]] refuses the
    address, so `pipe` closes the new pipe and returns -1.
  2526-2530: |
    Shrinks the process to size 0, freeing every page, including the code that is running.
    The kernel must set `p->sz` to 0, so that when the process exits, [[kernel:uvmfree]]
    has nothing left to free. The old bug, as the comment says, left `p->sz` at a wrong
    value, and `exit` then panicked.
  2531: |
    "user page fault here": the child never reaches `exit(0)`. Its next instruction
    fetch faults, and the kernel kills it.
  2546: |
    Shrinks to 3500 bytes, inside the first page. [[kernel:uvmdealloc]] must keep page 0,
    since `PGROUNDUP(3500)` is 4096, and free everything above it.
  2558: |
    Sets the break at 10 pages + 2048 bytes, in the middle of a page. In this build that
    frees the child's stack.
  2563: |
    Intended to shrink by 10 bytes without freeing a page. Commit e1a3730 (2019) fixed
    [[kernel:uvmdealloc]] for this case, which used to compute a nonsensical range to unmap.
    As the block note explains, in this build the child is killed just before it gets here.
  2578-2580: |
    Rounds the break up to a page boundary, so the following steps land at known offsets
    within pages.
  2582-2583: |
    +10 bytes maps one more page; -20 bytes then unmaps it again. The break ends 10 bytes
    below a page boundary.
  2585: |
    64 bytes below the break, in the last page that is still mapped.
  2588: |
    The page holds the path `x`, which [[kernel:copyinstr]] must be able to read.
  2603: |
    `0x80000004` converted to `int` is -2,147,483,644, a request to shrink by about 2 GiB.
    The kernel treats it as a no-op (see the block note).
  2605: |
    Reads and writes the last byte of memory. If the break had moved in either direction,
    this would fault or touch the wrong page.
  2615: |
    About 4 GB, far above this process's memory: [[kernel:fetchstr]] fails to copy the
    string.
  2617: |
    [[kernel:sys_exec]] has already taken a page from [[kernel:kalloc]] for this argument
    when the copy fails. It must free it on its `bad:` path ([[kernel/sysfile.c:495-497]]).
  2623: |
    1 GiB, eight times the machine's physical memory. It still fits in `int` (2^30), the
    argument type of [[sbrklazy]].
  2632: |
    Reserves 1 GiB without allocating any of it, and returns the old break.
  2639-2640: |
    Touches one page in 64. Each first touch causes a [[g:page-fault]] that
    [[kernel:vmfault]] handles by mapping a zeroed page. Each page stores its own address,
    so a page mapped in the wrong place would be noticed.
  2668-2669: |
    `PGSIZE * PGSIZE` = 16 MiB: touches one page in 4096, 64 pages in all.
  2677: |
    A negative argument makes even `sbrklazy` shrink at once ([[kernel/sysproc.c:50]]).
    The touched pages are unmapped and freed.
  2678: |
    Must fault: the address is now above the process size, so [[kernel:vmfault]] refuses
    it and the child is killed. Exiting with 0 means the old page was still mapped.
  2698-2700: |
    `p + 8192` is 8 KiB into the new lazy region, on a page nobody has touched.
    [[kernel:copyinstr]] faults it in ([[kernel/vm.c:419-424]]), finds a 0 byte at once, and
    `open` receives the empty path.
  2704-2705: |
    Asks to shrink by one byte more than the whole process. The new size `sz + n` wraps
    around to a huge number, which [[kernel:uvmdealloc]] treats as "not smaller", so nothing
    happens and `sbrk` returns the old break.
  2713-2716: |
    Two unmapped pages just below [[kernel:TRAPFRAME]] (`0x3fffffe000`), the trapframe
    page, the [[kernel:TRAMPOLINE]] page (`0x3ffffff000`), [[kernel:MAXVA]]
    (`0x4000000000`) and twice MAXVA.
  2723: |
    Reading into a bad address: [[kernel:copyout]] fails inside [[kernel:readi]], which
    returns -1.
  2733: |
    Writing from a bad address: [[kernel:copyin]] fails inside [[kernel:writei]], which
    copies nothing, so [[kernel:filewrite]] returns -1.
  2747: |
    Rounds the break up to the next page boundary (or adds a whole page if it is already on
    one), using ordinary eager allocation.
  2755: |
    Two more pages, reserved lazily. Neither is mapped yet.
  2756: |
    The last byte before the boundary is in the first lazy page; this store faults it in.
    The second lazy page, starting at `p[4096]`, is still unmapped.
  2757: |
    The path starts one byte before a page boundary. [[kernel:copyinstr]] reads `/`, moves
    to the next page, faults it in through [[kernel:vmfault]], and finds a 0 byte there.
  2783-2791: |
    255 steps of 1 GiB each, all lazy, so no memory is allocated. The value returned by
    the first `sbrklazy` is discarded at once; the loop takes the new break from
    `sbrklazy(0)`. The `p < 0` check between the two calls can never be true (see the
    block note), and the compiler drops it.
  2793: |
    The distance from the current break to one page below [[kernel:TRAPFRAME]]. It is less
    than 1 GiB, so it fits in an `int`.
  2795: |
    Lazily grows so that the break is exactly one page below [[kernel:TRAPFRAME]], leaving
    room for exactly one more page.
  2801: |
    Eagerly allocates the page `[TRAPFRAME - PGSIZE, TRAPFRAME)`. [[kernel:growproc]]
    allows it because `sz + n` equals `TRAPFRAME`, which is not greater than it.
  2807-2808: |
    The page must be writable and zero-filled like any newly allocated memory.
  2813-2823: |
    One more byte, eager or lazy, would reach the trapframe page; both must fail. Comparing
    with `-1` as a `uint64` is the correct way to test for [[SBRK_ERROR]].
  2867: |
    The last byte of the process's memory gets `X`; the byte after it, `p[0]`, is beyond the
    process size.
  2869: |
    The 2-byte write copies `X` into the file's cached block, then fails on the second byte.
    The call must return -1.
  2884-2895: |
    Right after the failed write, the block is still in the [[g:buffer-cache]], so this read
    shows `X` even on the buggy kernel.
  2897-2909: |
    64 writes of 1 KiB each pass 64 blocks through the 30-buffer cache, which pushes the
    `testfile` block out.
  2917-2928: |
    This read must come from disk. Without the fix it returns the old `A`.
  2944-2955: |
    The current directory is `/a/b`. Both directories are then removed; `b` survives in
    memory only as this process's current directory.
  2956: |
    `../` from the deleted `b`. Before the fix, this lookup reached the freed inode of `a`
    and panicked. Any descriptor here would be at least 3, so `> 0` detects success.
  2959: |
    Must not create a file in a directory that no longer exists.
  2964-2967: |
    One test: a [[g:function-pointer]] to the test and its name. Every test function takes
    the name as its argument `s`, so its error messages can say which test failed. The same
    statement declares the type `struct test` and defines the array `quicktests`.
  2968-2973: |
    Tests (from the first half of this file) that pass bad addresses to the kernel's
    copying functions [[kernel:copyin]], [[kernel:copyout]] and [[kernel:copyinstr]].
  2974-2985: |
    Basic file-system and exec tests: truncation, inode reference counts, opening,
    creating and writing files, directories, and running a program.
  2986-2996: |
    Process tests: pipes, `kill`, preemption, `exit` and `wait`, reparenting to `init`,
    nested forks, and running out of memory.
  2997-3010: |
    File-system tests with more pressure: shared and concurrent writes, concurrent create
    and delete, links, subdirectories, large files and names, and the tests in this half
    from [[bigfile]] to [[iref]].
  3011-3033: |
    `fork` exhaustion and the memory tests of this half: [[sbrk]] growth and failure,
    memory protection, `exec`'s limits, and lazy allocation with [[sbrklazy]].
  3034-3035: |
    The two newest regression tests, both from 2026.
  3036: |
    The end marker. [[runtests]] stops at the entry whose name is 0.
  3401: |
    [[linkoverflow]] is commented out because it takes too long, even for the slow tests.
    Run it by uncommenting this line (it cannot be selected by name while it is not in a
    table).
  3413: |
    The parameter `void f(char *)` is written like a function, but C adjusts a function
    parameter type to a pointer, so it means exactly `void (*f)(char *)`.
  3418: |
    Printed before the test starts and without a newline, so the verdict appears on the
    same line, unless the test or the kernel prints something in between.
  3423-3425: |
    The child runs the test. A test fails by calling `exit(1)` (or being killed); if the
    function returns normally, the child exits with 0, a pass.
  3427: |
    The test process is the harness's only child, so `wait` returns its status. A test's
    own children that it did not reap are given to `init` when it exits, so they cannot
    confuse this `wait`.
  3432: |
    Returns 1 for a pass and 0 for a failure, so callers can write `if (!run(...))`.
  3440: |
    Loops until the entry whose name is 0, the end marker of the table.
  3441: |
    With no name given, every test runs. With a name, only the exact match runs. That
    could be in either table, which is why [[drivetests]] searches the slow table too.
  3444-3447: |
    Without `-C`, the first failure ends the whole run. With `-C`, [[run]] has already
    printed FAILED and the loop goes on.
  3459: |
    Remembers the current break so it can be restored exactly afterwards.
  3460-3466: |
    Each successful `sbrk(PGSIZE)` took one page from [[kernel:kalloc]]. The loop ends
    when [[kernel:uvmalloc]] finds no free page and `sbrk` returns [[SBRK_ERROR]].
  3467: |
    One shrink back to the starting break returns all the counted pages to the free list.
  3474: |
    A `do ... while` loop: the body runs once, and again for as long as `continuous` is set.
  3476: |
    Free pages before any test runs.
  3480-3487: |
    Quick tests first. A failure ends `drivetests` with 1 unless `-C` was given. Otherwise
    `n` is how many tests ran, added to `ntests`.
  3488-3499: |
    Then the slow tests, unless `-q`. With a single test name, this searches the slow table
    too, without announcing it.
  3500-3505: |
    The leak check. Fewer free pages now than before means some kernel path lost pages:
    allocated them and never freed them, even after every test process exited.
  3506-3509: |
    A test name that matched nothing in either table is an error, probably a typo.
  3521-3526: |
    The three options, each valid only as the sole argument. `-q` skips the slow tests,
    `-c` repeats until a failure, `-C` repeats forever.
  3527-3528: |
    Any other single argument that does not start with `-` is taken as a test name.
  3529-3532: |
    More than one argument, or an unknown option.
  3533-3535: |
    A non-zero [[g:exit-status]] tells whoever ran usertests that something failed.
  3536: |
    The line `test-xv6.py` waits for. The shell prints its prompt after this, when
    usertests exits.
