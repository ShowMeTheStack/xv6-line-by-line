    Parse as much of the line as fits the grammar; `s` is advanced past it.
  341: |
    Skip trailing whitespace (an empty `toks` list never matches).
  342-345: |
    Text remains that the grammar could not place: report it and end this child.
  346: |
    Write the NULs that end each word, now that parsing is finished.
