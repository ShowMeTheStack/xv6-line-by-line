    Close the original descriptors. The child keeps only descriptor 1; a leftover `p[0]`
    or `p[1]` would hold the pipe open for no reason.
  110: |
    Run the left command with standard output going into the pipe. Never returns.
  112: |
    The second child will run the right command, the reader.
  113-114: |
    Make descriptor 0 refer to the pipe's read end, by the same close-then-dup trick.
  115-116: |
    Close the originals. Closing `p[1]` here is essential: if the reader kept a write end,
    its own reads would never see end-of-file.
  117: |
    Run the right command with standard input coming from the pipe.
