    Run the command in a child, and do not wait for it.
  131: |
    The end of every path that did not `exec`. `exit` never returns, which is what makes
    the `noreturn` promise on line 55 true.
  137: |
    Print the prompt on standard error.
  138: |
    Clear the buffer, so that `buf[0]` is 0 if nothing is read.
  139: |
    Read one line, at most `nbuf - 1` characters plus the terminating NUL.
  140-141: |
    Nothing at all was read: end of input. A line containing only a newline is not end of
