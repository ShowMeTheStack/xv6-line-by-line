summary: |
  The system call stubs: the code that connects a C call such as `write(1, "x", 1)` in a
  user program to the kernel. This file is generated by [[user/usys.pl]] during the build;
  it is not part of the xv6 repository.

  Every stub has the same three instructions (see [[g:syscall-stub]]):

  1. `li a7, SYS_name` puts the [[g:syscall-number]] in register `a7`;
  2. `ecall` traps into the kernel, which performs the call;
  3. `ret` returns to the C caller, with the kernel's result in `a0`.

  The arguments need no code at all. The caller is ordinary compiled C, which by the
  [[g:calling-convention]] has already placed them in `a0`, `a1`, ... before calling the
  stub, and the kernel reads them from exactly those registers
  ([[g:syscall-arguments]]).

  The whole round trip for `write`, as an example:

  ```
  user:   write(fd, buf, n)        C call, args in a0..a2
          write: li a7, 16         this file
                 ecall             ── trap ──┐
  kernel: uservec                  save registers in the trapframe (trampoline.S)
          usertrap                 scause 8: system call; epc += 4 (trap.c)
          syscall                  a7 = 16 → syscalls[16] = sys_write (syscall.c)
          sys_write → filewrite    the work (sysfile.c, file.c)
          syscall                  trapframe->a0 = result
          prepare_return, userret  restore registers, sret (trap.c, trampoline.S)
  user:          ret               ◄─────────┘ back in C, a0 = result
  ```

  Each stub is 8 bytes of machine code: `li` with a small constant assembles into a 2-byte
  compressed instruction, `ecall` is 4 bytes, `ret` 2 bytes (see `user/cat.asm`).

  **Read before:** [[user/usys.pl]], [[user/user.h]]. **Read next:** [[kernel/trampoline.S]],
  [[kernel/trap.c]], [[kernel/syscall.c]].

blocks:
  - lines: 1-2
    title: Generated file; get the numbers from the kernel
    note: |
      Line 1 is an assembler comment printed by [[user/usys.pl:5]]: change the script, not
      this file, because the build regenerates it.

      Line 2 is a C [[g:preprocessor]] directive. Because the file name ends in `.S`
      (capital S), GCC preprocesses it before assembling ([[Makefile:115]]), so every
      `SYS_` name below is replaced by its number from [[kernel/syscall.h]]. The kernel's
      table [[kernel:syscalls]] is indexed by the same names, so both sides always agree
      on which number means which call.

  - lines: 3-7
    title: "fork: the stub, instruction by instruction"
    note: |
      `fork` is the stub for system call 1, `SYS_fork`: create a copy of the calling
      process. Kernel: [[kernel:sys_fork]] → [[kernel:kfork]].

      `fork` returns twice. The parent returns through this `ret` with the child's
      [[g:pid]] in `a0`. The child also starts by "returning" from this same `ecall`:
      [[kernel:kfork]] copies the parent's [[g:trapframe]], including the saved program
      counter, and sets the child's saved `a0` to 0. When the child first runs, it
      returns to user mode right after the `ecall`, executes this `ret`, and sees 0.

      The line notes explain the three instructions; every other stub in this file works
      the same way.
  - lines: 8-12
    title: "exit: end the calling process"
    note: |
      `exit` is the stub for system call 2, `SYS_exit`: end the calling process. Kernel:
      [[kernel:sys_exit]] → [[kernel:kexit]]. This stub's `ecall` never returns, so its
      `ret` is never executed. [[user:start]] calls it with `main`'s return value.
  - lines: 13-17
    title: "wait: wait for a child process to exit"
    note: |
      `wait` is the stub for system call 3, `SYS_wait`: wait for a child process to exit.
      Kernel: [[kernel:sys_wait]] → [[kernel:kwait]], which may sleep until a child
      becomes a [[g:zombie]].
  - lines: 18-22
    title: "pipe: create a pipe"
    note: |
      `pipe` is the stub for system call 4, `SYS_pipe`: create a [[g:pipe]]. Kernel:
      [[kernel:sys_pipe]] → [[kernel:pipealloc]]. The two new descriptors are written into
      the caller's array with [[kernel:copyout]].
  - lines: 23-27
    title: "read: read bytes from a file descriptor"
    note: |
      `read` is the stub for system call 5, `SYS_read`: read bytes from a
      [[g:file-descriptor]]. Kernel: [[kernel:sys_read]] → [[kernel:fileread]], which
      dispatches to a pipe, a device such as the console ([[kernel:consoleread]]), or an
      [[g:inode]].
  - lines: 28-32
    title: "write: write bytes to a file descriptor"
    note: |
      `write` is the stub for system call 16, `SYS_write`: write bytes to a
      [[g:file-descriptor]]. Kernel: [[kernel:sys_write]] → [[kernel:filewrite]]. Every
      character printed by [[printf]] passes through here.
  - lines: 33-37
    title: "close: release a file descriptor"
    note: |
      `close` is the stub for system call 21, `SYS_close`: release a file descriptor.
      Kernel: [[kernel:sys_close]] → [[kernel:fileclose]].
  - lines: 38-42
    title: "kill: mark a process as killed"
    note: |
      `kill` is the stub for system call 6, `SYS_kill`: mark a process as killed. Kernel:
      [[kernel:sys_kill]] → [[kernel:kkill]].
  - lines: 43-47
    title: "exec: replace the program running in this process"
    note: |
      `exec` is the stub for system call 7, `SYS_exec`: replace the program running in
      this process. Kernel: [[kernel:sys_exec]] → [[kernel:kexec]]. On success the `ecall`
      does not come back here: the return to user mode lands at the new program's entry
      point, [[user:start]], and this stub's `ret` is never executed. Only a failed `exec`
      returns, with -1.
  - lines: 48-52
    title: "open: open or create a file by name"
    note: |
      `open` is the stub for system call 15, `SYS_open`: open or create a file by name.
      Kernel: [[kernel:sys_open]].
  - lines: 53-57
    title: "mknod: create a device file"
    note: |
      `mknod` is the stub for system call 17, `SYS_mknod`: create a device file. Kernel:
      [[kernel:sys_mknod]].
  - lines: 58-62
    title: "unlink: remove a name from a directory"
    note: |
      `unlink` is the stub for system call 18, `SYS_unlink`: remove a name from a
      directory. Kernel: [[kernel:sys_unlink]].
  - lines: 63-67
    title: "fstat: get information about an open file"
    note: |
      `fstat` is the stub for system call 8, `SYS_fstat`: get information about an open
      file. Kernel: [[kernel:sys_fstat]] → [[kernel:filestat]]. [[stat]] in
      [[user/ulib.c]] builds on it.
  - lines: 68-72
    title: "link: give a file another name"
    note: |
      `link` is the stub for system call 19, `SYS_link`: give a file another name. Kernel:
      [[kernel:sys_link]].
  - lines: 73-77
    title: "mkdir: create a directory"
    note: |
      `mkdir` is the stub for system call 20, `SYS_mkdir`: create a directory. Kernel:
      [[kernel:sys_mkdir]].
  - lines: 78-82
    title: "chdir: change the current directory"
    note: |
      `chdir` is the stub for system call 9, `SYS_chdir`: change the current directory.
      Kernel: [[kernel:sys_chdir]].
  - lines: 83-87
    title: "dup: duplicate a file descriptor"
    note: |
      `dup` is the stub for system call 10, `SYS_dup`: duplicate a file descriptor.
      Kernel: [[kernel:sys_dup]].
  - lines: 88-92
    title: "getpid: return the caller's process ID"
    note: |
      `getpid` is the stub for system call 11, `SYS_getpid`: return the caller's process
      ID. Kernel: [[kernel:sys_getpid]].
  - lines: 93-97
    title: "sys_sbrk: grow or shrink the process's memory"
    note: |
      `sys_sbrk` is the stub for system call 12, `SYS_sbrk`: grow or shrink the process's
      memory. Kernel: [[kernel:sys_sbrk]]. The label is `sys_sbrk`, not `sbrk`
      ([[user/usys.pl:12]]): the C functions [[sbrk]] and [[sbrklazy]] in [[user/ulib.c]]
      call it with a second argument, [[SBRK_EAGER]] or [[SBRK_LAZY]], in `a1`. The kernel
      handler happens to have the same name; the two are in different programs and are
      never linked together.
  - lines: 98-102
    title: "pause: sleep for a number of clock ticks"
    note: |
      `pause` is the stub for system call 13, `SYS_pause`: sleep for a number of clock
      ticks. Kernel: [[kernel:sys_pause]].
  - lines: 103-107
    title: "uptime: return the number of clock ticks since boot"
    note: |
      `uptime` is the stub for system call 14, `SYS_uptime`: return the number of clock
      ticks since boot. Kernel: [[kernel:sys_uptime]].
  - lines: 108-112
    title: "sync: wait for an open file-system transaction to commit"
    note: |
      `sync` is the stub for system call 22, `SYS_sync`: if a file-system
      [[g:transaction]] is open or being committed, wait until it has been committed to
      disk; otherwise return at once (every finished operation is already on disk). Always
      returns 0. Kernel: [[kernel:sys_sync]].

lines:
  3: |
    Make the label `fork` visible outside this file ([[g:dir-globl]]), so the
    [[g:linker]] can connect a C call to `fork()` in any program to the code below.
  4: |
    The label: the address of the stub's first instruction. To C, this is the function
    `fork` declared in [[user/user.h:6]].
  5: |
    Load the system call number into `a7` ([[g:insn:li|li]]); the preprocessor has
    replaced `SYS_fork` by `1`. `a7` is used because it is the last argument register:
    up to six real arguments (`a0`–`a5`) stay where the C caller put them. The calling
    convention lets a called function overwrite `a7` freely, so the stub does not need to
    save it.
  6: |
    Trap into the kernel ([[g:insn:ecall|ecall]]). In user mode, `ecall` raises an
    environment-call exception (cause 8); the hardware switches to supervisor mode, saves
    this instruction's address in `sepc`, and jumps to the trap handler in `stvec`, which
    is [[kernel:uservec]] on the [[g:trampoline]] page. The kernel saves all user
    registers, handles the call in [[kernel:usertrap]] and [[kernel:syscall]], writes the
    result into the saved `a0`, and returns to the instruction after `ecall`: before
    handling the call, `usertrap` adds 4 to the saved program counter
    ([[kernel/trap.c:62]]), the length of `ecall`. All other registers come back as they
    were.
  7: |
    Return to the C caller ([[g:insn:ret|ret]]); `ra` still holds the caller's return
    address, since nothing here changed it. The kernel's result is in `a0`, where C
    expects a function's return value.
