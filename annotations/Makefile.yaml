summary: |
  This file tells [[g:make]] how to turn xv6's source code into three things, and how to run
  them:

  1. **`kernel/kernel`**, the kernel: every `kernel/*.c` and `kernel/*.S` compiled into an
     [[g:object-file]], then linked by [[kernel/kernel.ld]].
  2. **The user programs** (`user/_sh`, `user/_cat`, ...): each `user/X.c` compiled and
     linked with a small library, by [[user/user.ld]].
  3. **`fs.img`**, a [[g:disk-image]] holding the user programs, built by the host program
     [[mkfs/mkfs.c]].

  Then `make qemu` starts [[g:qemu]] with the kernel and the disk image.

  Everything here runs on *your* computer, not inside xv6. The compiler is a
  [[g:cross-compiler]]: it runs on your machine but produces RISC-V code.

  If Makefiles are new to you, read the [[g:make]] glossary entry first; then the block notes
  below go through this one from top to bottom. The most useful lines to understand are the
  compiler flags (lines 66–89), the kernel link rule (93–96) and the QEMU command line
  (177–183).

blocks:
  - lines: 1-2
    title: Short names for the two main directories
    note: |
      `K` and `U` are variables holding the directory names. Because they are one letter
      long they can be used as `$K` and `$U` without parentheses, which keeps the long file
      lists below readable: `$K/vm.o` means `kernel/vm.o`.

  - lines: 4-31
    title: The kernel's object files
    note: |
      [[build:OBJS]] lists every [[g:object-file]] the kernel is linked from, one per source
      file in `kernel/`. Each `\` at the end of a line continues the list onto the next line.

      You will not find rules here for building each `.o`. For a `.S` file, the pattern rule
      on line 98 does it. For a `.c` file there is no rule in this Makefile at all: make
      uses its built-in rule for C, which runs `$(CC) $(CFLAGS) -c`, so the
      [[build:CFLAGS]] set below apply. Click any entry to open the source file it is built
      from.

      `$K/entry.o` comes first. Order matters to the linker: object files are laid out in
      this order, and [[kernel/entry.S]] must be at the very start of the kernel. (The linker
      script also makes sure of that; see [[kernel/kernel.ld:13]].)

  - lines: 33-53
    title: Find the RISC-V toolchain
    note: |
      The compiler, assembler and linker for RISC-V are installed under different names on
      different systems: `riscv64-unknown-elf-gcc`, `riscv64-elf-gcc` (Homebrew),
      `riscv64-linux-gnu-gcc` (Debian/Ubuntu), and so on. [[build:TOOLPREFIX]] holds the
      part before `gcc`, and every tool name below is built from it.

      If you did not set `TOOLPREFIX` yourself (`ifndef`), lines 39–52 run a shell
      command, once, while the Makefile is read: for each candidate prefix it runs that
      `objdump -i`, which lists the file formats the tool understands, and checks the list
      for `elf64-big`. A RISC-V `objdump` lists `elf64-bigriscv`. The first prefix that
      passes is used. If none does, the command prints the error on lines 49–51 to the
      terminal. Note that make ignores the failure of a `$(shell ...)` command: it leaves
      `TOOLPREFIX` empty and carries on with plain `gcc`, so the build then fails with
      confusing compiler errors. If you see them, look for the `***` message above them.

      Lines 33–35 are comments: a hint about where the tools might live, and a
      commented-out line you could edit to force a prefix.

  - lines: 55-61
    title: The programs make will run
    note: |
      [[build:QEMU]] names the emulator and [[build:MIN_QEMU_VERSION]] the oldest version
      known to work (checked by the target on line 196). [[build:CC]], [[build:LD]],
      [[build:OBJCOPY]] and [[build:OBJDUMP]] are the C compiler, linker, object-file copier
      and disassembler, each with the prefix found above. For example, with Homebrew's
      toolchain `$(CC)` becomes `riscv64-elf-gcc`. (`OBJCOPY` is defined but not used in
      this Makefile.)

  - lines: 63-64
    title: Reproducible builds
    note: |
      [[build:DETFLAGS]] holds one compiler option,
      [[g:flag-prefix-map|-ffile-prefix-map]]. [[g:make-curdir|CURDIR]] is the directory
      make is running in. The option replaces that directory's full path with `.` in
      everything the compiler records (debug information), so two people building the same
      source in different directories get identical output.

  - lines: 66-81
    title: How every C file is compiled
    note: |
      [[build:CFLAGS]] collects the options passed to the C compiler. It is built up over
      several lines with `+=`, one theme per line. Hover over any option in the code to see
      its glossary entry. In groups:

      - **Warnings and debugging** (line 66): stop on any warning (`-Wall -Werror`),
        optimize lightly (`-O`), and include debug information and frame pointers so that
        `gdb` can show source lines and stack traces.
      - **Target** (68–71): generate 64-bit RISC-V code ([[g:flag-march|-march=rv64gc]]) that
        can be placed anywhere in memory ([[g:flag-mcmodel|-mcmodel=medany]], needed
        because the kernel lives at `0x80000000`); write a `.d` dependency file next to each `.o`
        ([[g:flag-MD|-MD]]).
      - **No operating system underneath** (72–79): the kernel and the user programs are
        [[g:freestanding]] C. There is no C library, so the compiler must not assume one:
        `-nostdlib`, and `-fno-builtin-X` for each function name xv6 writes itself
        (`memset`, `printf`, `malloc`...), so the compiler never swaps in its own idea of
        what they do. (`-ffreestanding` already implies this for every function, and
        `-nostdlib` only matters when gcc does the linking, which it never does here; both
        lists are belt-and-braces safeguards.)
      - **Headers** (80): `-I.` lets source files `#include "kernel/types.h"` from the top
        directory.
      - **Stack protector** (81): disabled if the compiler supports disabling it.

      The same `CFLAGS` are used for both the kernel and the user programs.

  - lines: 83-89
    title: Turn off position-independent code where needed
    note: |
      Some compilers (the comment mentions Ubuntu 16.10's) produce position-independent
      executables (PIE) by default. xv6 is linked to fixed addresses, so PIE must be off.
      Each test asks the compiler to print its built-in configuration (`-dumpspecs`) and
      looks for a mention of the option `no-pie` (or the older spelling `nopie`); if the
      compiler knows the option, the flags to turn PIE off are added. `[^f]` in the pattern
      skips the text `fno-pie`, so only a standalone `no-pie` counts.

  - lines: 91
    title: Linker options
    note: |
      [[build:LDFLAGS]] holds `-z max-page-size=4096`: the linker aligns the program's
      loadable segments to 4096-byte pages. That is already the default for the RISC-V
      `ld` (linking without it produces an identical kernel), so the option only guards
      against a toolchain with a larger default.

  - lines: 93-96
    title: "Link the kernel: kernel/kernel"
    note: |
      The rule for the kernel itself. Because it is the first ordinary rule in the file, it
      is make's default: plain `make` builds `kernel/kernel` and nothing else.

      The prerequisites are every object file in [[build:OBJS]] plus the linker script, so
      the kernel is relinked whenever any of them changes. The recipe:

      1. links the objects with `ld`, using [[kernel/kernel.ld]] for the memory layout;
      2. writes `kernel/kernel.asm`, a disassembly of the whole kernel with the source lines
         mixed in, useful for seeing what any C line compiled into;
      3. writes `kernel/kernel.sym`, a list of every symbol and its address.

  - lines: 98-99
    title: Assemble the kernel's .S files
    note: |
      A pattern rule: `kernel/X.o` can be built from `kernel/X.S` (`%` matches the `X`).
      It runs gcc rather than the assembler directly, because files ending in capital `.S`
      must go through the [[g:preprocessor|C preprocessor]] first (for `#include` and
      `#define`), and gcc does that automatically. `$@` is the target and `$<` the source
      ([[g:make-auto|automatic variables]]).

      Only a few options are needed: the instruction set, debug info (`-g`) and the
      reproducible-path option. The preprocessor finds `#include "riscv.h"` in
      [[kernel/trampoline.S]] because quoted includes are looked up in the including file's
      own directory first.

  - lines: 101-102
    title: An editor index (optional)
    note: |
      `make tags` builds a `TAGS` file with `etags`, which lets the Emacs editor jump to
      definitions. It is not needed to build or run xv6 (though, because its prerequisites
      are [[build:OBJS]], it compiles the kernel's object files first).

  - lines: 104
    title: The user library
    note: |
      [[build:ULIB]] lists the object files linked into every user program: [[user/ulib.c]]
      (string functions, `gets`, `stat`...), `user/usys.o` (the system-call stubs from
      [[user/usys.S]]), [[user/printf.c]] and [[user/umalloc.c]] (`malloc`/`free`). This is
      all the "C library" xv6 programs get.

  - lines: 106-109
    title: "Link a user program: user/_X"
    note: |
      A pattern rule for every user program. The target `user/_cat` is built from
      `user/cat.o` plus [[build:ULIB]], laid out by [[user/user.ld]], which starts each
      program at address 0.

      When the pattern (`_%`) contains no `/`, make matches only the file-name part, so for
      `user/_cat` the stem `$*` is `user/cat`, and the prerequisite `%.o` becomes
      `user/cat.o`.

      The program files are named with a leading `_` so that, on your computer, `user/_cat`
      can never be mistaken for the real `cat`. [[mkfs/mkfs.c]] removes the `_` when it
      copies the program into the disk image, so inside xv6 it is `/cat`.

      Like the kernel rule, it also writes a disassembly (`user/cat.asm`) and a symbol list
      (`user/cat.sym`).

  - lines: 111-115
    title: Generate and assemble the system-call stubs
    note: |
      User programs call `fork()`, `write()` and so on as if they were ordinary functions.
      Each is a three-instruction stub in assembly that puts the system-call number in
      `a7` and executes `ecall`. Rather than writing them by hand, the Perl script
      [[user/usys.pl]] prints them all; line 112 saves its output as [[user/usys.S]], and
      line 115 assembles that. The stubs need [[kernel/syscall.h]], where the numbers are
      defined, which is found through `-I.` in `CFLAGS`.

  - lines: 117-121
    title: forktest is linked differently
    note: |
      This explicit rule overrides the pattern rule above for `user/_forktest` alone.
      [[user/forktest.c]] creates processes until the process table is full, so the
      program is kept as small as possible: it is linked with only `ulib.o` and `usys.o` (no
      `printf`, no `malloc`). `-N` (sections not page-aligned), `-e main` (start at `main`)
      and `-Ttext 0` (code at address 0) replace the user linker script.

      Lines 118–119 start with a tab, so make treats them as part of the recipe and passes
      them to the shell, which ignores them as comments. As a side effect make prints them
      while building.

  - lines: 123-124
    title: Build mkfs, a program for your computer
    note: |
      [[mkfs/mkfs.c]] creates the disk image. It runs on your computer during the build,
      not inside xv6, so it is compiled with your computer's ordinary C compiler, plain
      `gcc`, not the RISC-V cross-compiler. It shares the on-disk format with the kernel
      by including [[kernel/fs.h]] and [[kernel/param.h]], which is why those headers are
      prerequisites.

  - lines: 126-130
    title: Keep the .o files
    note: |
      When make builds `user/_cat` from `user/cat.c` through the in-between file
      `user/cat.o`, it normally deletes `cat.o` afterwards, as an "intermediate" file.
      [[g:make-precious|.PRECIOUS]] keeps every `%.o`. As the comment explains, that stops
      make from rebuilding `user/_cat`, and with it `fs.img`, the next time you run it,
      which would wipe any files you created inside xv6.

  - lines: 132-152
    title: The list of user programs
    note: |
      [[build:UPROGS]] lists every program that goes into the disk image. To add your own
      program to xv6, you write `user/myprog.c` and add `$U/_myprog\` to this list; the
      pattern rule on line 106 knows how to build it.

  - lines: 154-155
    title: "Build the disk image: fs.img"
    note: |
      [[mkfs/mkfs.c|mkfs]] creates `fs.img` containing the [[README]] file and every
      program in [[build:UPROGS]]. The prerequisites guarantee that `mkfs` and every program
      are built (or rebuilt) first.

  - lines: 157
    title: Rebuild when a header changes
    note: |
      Because of `-MD`, compiling `kernel/vm.c` also wrote `kernel/vm.d`, a one-rule
      makefile listing `vm.c` and every header it included as prerequisites of `vm.o`. This
      line reads all of those files ([[g:make-include|-include]]), so editing, say,
      [[kernel/riscv.h]] rebuilds exactly the object files that include it. The `-` makes
      make skip the line silently before the first build, when no `.d` files exist yet.

  - lines: 159-165
    title: "make clean"
    note: |
      Deletes everything the build produced: object and dependency files, disassemblies,
      symbol lists, the kernel, the disk image, `mkfs`, the generated `.gdbinit` and
      `usys.S`, and the user programs. The first line also removes files from typesetting
      the xv6 book with TeX (`*.tex`, `*.dvi`...), probably left over from older versions
      that kept the book in the same repository.

  - lines: 167-172
    title: Settings for debugging with gdb
    note: |
      `make qemu-gdb` (line 188) lets the `gdb` debugger control the emulated machine over a
      network port. On a shared machine, several students could do this at once, so
      [[build:GDBPORT]] derives a port number from your user ID: `uid % 5000 + 25000`, a
      number between 25000 and 29999.

      [[build:QEMUGDB]] holds the QEMU option that opens the port. Very old QEMU versions
      (before 0.11) spelled it `-s -p PORT` instead of `-gdb tcp::PORT`, so the shell
      command checks which one this QEMU's help text mentions.

  - lines: 173-175
    title: How many CPUs
    note: |
      [[build:CPUS]] is the number of harts QEMU emulates, 3 unless you choose otherwise:
      `make qemu CPUS=2` starts xv6 on two harts. A value given on the command line wins over
      the assignment here anyway; the `ifndef` also lets you set `CPUS` as an environment
      variable. The kernel supports up to [[NCPU]] (8).

  - lines: 177-180
    title: The emulated machine
    note: |
      [[build:QEMUOPTS]] describes the computer QEMU pretends to be:

      | Option | Meaning |
      |---|---|
      | `-machine virt` | QEMU's generic RISC-V board: RAM at `0x80000000`, a UART at `0x10000000`, virtio devices at `0x10001000`, a PLIC (compare [[kernel/memlayout.h]]) |
      | `-bios none` | no firmware such as OpenSBI: a few instructions built into QEMU at `0x1000` jump straight to the kernel at `0x80000000`, still in machine mode |
      | `-kernel kernel/kernel` | load this ELF file into memory |
      | `-m 128M` | 128 MiB of RAM, matching [[PHYSTOP]] |
      | `-smp $(CPUS)` | number of harts |
      | `-nographic` | no window; the UART is connected to your terminal |
      | `-global virtio-mmio.force-legacy=false` | use the current virtio interface (version 2), which [[virtio_disk_init]] requires, not the legacy one |
      | `-drive file=fs.img,...,id=x0` | open `fs.img` as a raw disk named `x0` |
      | `-device virtio-blk-device,drive=x0,bus=virtio-mmio-bus.0` | attach disk `x0` as a virtio block device in the first virtio slot, at `0x10001000` ([[VIRTIO0]]) |

  - lines: 182-183
    title: "make qemu"
    note: |
      The command you use most. It first checks the QEMU version, builds the kernel and the
      disk image if anything changed, then runs QEMU with the options above. xv6 boots in
      your terminal. To quit QEMU, press Ctrl-A and then X.

  - lines: 185-186
    title: Generate .gdbinit
    note: |
      `gdb` reads commands from a file named `.gdbinit` when it starts. The template
      [[.gdbinit.tmpl-riscv]] contains the default port `1234`; `sed` replaces it with
      [[build:GDBPORT]]. `$^` is the template and `$@` the output file.

  - lines: 188-190
    title: "make qemu-gdb"
    note: |
      Like `make qemu`, but QEMU starts with every hart paused (`-S`) and waits for a debugger
      on [[build:GDBPORT]]. You then run `gdb` in a second terminal; it reads `.gdbinit`,
      connects, and you can set breakpoints anywhere in the kernel, even on [[_entry]],
      before the kernel's first instruction runs. (Recent gdb versions only read a
      project's `.gdbinit` if you allow it, e.g. with `add-auto-load-safe-path` in
      `~/.gdbinit`; gdb's warning message shows the exact line to add.) The `@` before `echo` stops make from printing the
      command itself.

  - lines: 192-193
    title: "make print-gdbport"
    note: |
      Prints the port number, for scripts that need it.

  - lines: 195-200
    title: Check the QEMU version
    note: |
      Line 195 runs `qemu-system-riscv64 --version` once and extracts the "major.minor" part
      from its first line (`QEMU emulator version 11.0.0` becomes `11.0`). The target
      `check-qemu-version` compares it with [[build:MIN_QEMU_VERSION]] using `bc`, a
      command-line calculator that prints `1` when `11.0 >= 7.2` is true and `0` when it is
      false. If it is false, the build stops with an error before QEMU is started.

  - lines: 202-204
    title: "make fmt"
    note: |
      Reformats all C sources in place with `clang-format`, following the style in
      [[.clang-format]]. [[g:make-phony|.PHONY]] marks `fmt` as an action, not a file name.
      [[g:make-wildcard|wildcard]] expands to the list of existing `.c` and `.h` files.

lines:
  1: |
    `K` is `kernel`, so `$K/vm.o` means `kernel/vm.o`.
  2: |
    `U` is `user`, so `$U/_sh` means `user/_sh`.
  4: |
    Start the list [[build:OBJS]]. The `\` continues it on the next line.
  5: |
    First in the list, and therefore first in the kernel: [[kernel/entry.S]], the code that
    runs at `0x80000000`.
  38: |
    Skip the detection if `TOOLPREFIX` is already set, e.g. by running
    `make TOOLPREFIX=riscv64-elf-`.
  39: |
    `:=` runs the `$(shell ...)` command once, right now, and stores its output. (With `=`
    it would run again every time `TOOLPREFIX` is used.) The `if` tests the first candidate
    prefix.
  52: |
    `exit 1` marks the shell command as failed, but make ignores that; see the block
    note.
  58: |
    The C compiler, e.g. `riscv64-elf-gcc`.
  59: |
    The linker, e.g. `riscv64-elf-ld`.
  61: |
    The disassembler, used to produce the `.asm` files.
  66: |
    Create [[build:CFLAGS]] with the warning, optimization and debugging options. Because
    it is created with `=`, everything appended with `+=` below stays unexpanded until
    `CFLAGS` is used.
  68: |
    Target 64-bit RISC-V with the "g" and "c" extensions.
  69: |
    The C dialect: C99 plus GNU extensions such as `asm` and `__attribute__`.
  70: |
    Write a `.d` dependency file for each `.o`; see line 157.
  71: |
    Code that can be placed anywhere in memory, as long as the whole program fits within
    2 GiB. The default (`medlow`) only reaches the lowest 2 GiB of addresses, and the
    kernel starts at `0x80000000`, just past that. [[kernel/start.c:24]] mentions it.
  72: |
    There is no operating system or C library under this code.
  73: |
    `-fno-common`: two files defining the same global is an error. `-nostdlib`: no standard
    library when gcc links (a safeguard; here `ld` is called directly).
  74: |
    `-fno-builtin-...` (lines 74–79): xv6 implements these functions itself, so the compiler
    must not substitute its built-in versions.
  78: |
    `-Wno-main`: do not complain that `main` is unusual (the kernel's `main` returns
    `void`, not `int`). `-ffreestanding` already turns that check off, so this is a safety
    net.
  80: |
    Search the top directory for `#include "..."` files.
  81: |
    Add `-fno-stack-protector` if the compiler accepts it: the test compiles an empty
    file (`/dev/null`) with that option and echoes the option only if that succeeds.
    Because [[build:CFLAGS]] was created with `=`, this test actually runs every time
    `CFLAGS` is expanded, once per compiled file, not just once.
  91: |
    Assume 4096-byte pages when aligning segments.
  93: |
    Target `kernel/kernel` depends on all kernel object files and the linker script.
  94: |
    Link. `-T $K/kernel.ld` selects the [[g:linker-script]]; `-o` names the output.
  95: |
    Disassemble the kernel, with source lines mixed in (`-S`), into `kernel/kernel.asm`.
  96: |
    List the kernel's symbols (`objdump -t`) and trim them with `sed` to one
    "address name" pair per line. In the `sed` script, `1,/SYMBOL TABLE/d` deletes the
    header, `s/ .* / /` keeps only the first and last columns, and `/^$$/d` deletes empty
    lines (`$$` is how a Makefile writes a literal `$`).
  99: |
    Compile (`-c`) one assembly file into one object file. The C preprocessor runs first
    because the file ends in capital `.S`.
  107: |
    Link one user program from its own object file (`$<`) and the library.
  108: |
    Disassemble it to `user/X.asm` (`$*` is the stem, e.g. `user/cat`).
  109: |
    List its symbols to `user/X.sym`.
  112: |
    Run [[user/usys.pl]] and save what it prints as `user/usys.S`.
  115: |
    Assemble the stubs with the full [[build:CFLAGS]].
  120: |
    Link forktest with a minimal library and no linker script.
  121: |
    Disassemble it, as for other programs.
  124: |
    Compile `mkfs` with the host compiler. `-I.` lets it include `kernel/fs.h`.
  130: |
    Never delete `.o` files as intermediates.
  133: |
    The first program in the disk image: `cat`. Each entry is a target built by the rule on
    line 106 (or, for forktest, line 117).
  137: |
    `init`, the first user program the kernel runs ([[kernel/proc.c:532]]).
  143: |
    `sh`, the shell started by `init`.
  145: |
    `usertests`, xv6's large test suite.
  155: |
    Run `mkfs`: output file first, then every file to copy into the image.
  157: |
    Read every `.d` file, if any exist.
  168: |
    `id -u` prints your numeric user ID; `expr` does the arithmetic.
  174: |
    Default to 3 harts.
  177: |
    The core machine description; see the table in the block note.
  183: |
    Start the emulator: `qemu-system-riscv64` followed by [[build:QEMUOPTS]].
  186: |
    Copy the template, replacing `:1234` with `:` and the port number.
  189: |
    Remind you to start gdb. `1>&2` prints the reminder on the error output (it still
    appears in your terminal).
  190: |
    `-S`: start with the CPUs paused until gdb tells them to run.
  197: |
    `$(shell echo "11.0 >= 7.2" | bc)` is evaluated by make, giving `1` or `0`; the shell
    `if` compares it with 0.
  204: |
    Reformat every `.c` and `.h` file in `kernel/` and `user/`, and `mkfs.c`.
