      sp: kernel
    note: |
      [[bread]] sets `valid = 1` and returns. From now on, until this buffer is recycled,
      any `bread(1, 48)` is a cache hit with no disk I/O. That will be true for `cat`'s
      second `read`, which wants bytes 512–1023 of the same block.

      In [[readi]], `m = min(512, 1024 - 0)` = 512, and [[either_copyout]] copies 512 bytes
      from `bp->data` to user address `0x1010` in `cat`'s memory ([[copyout]] walks `cat`'s
      page table, as in [[tour:28]]). Then [[brelse]] drops the buffer's lock and moves it to
      the front of the LRU list.

      `readi` returns 512, `fileread` advances `f->off` to 512 and calls [[iunlock]], and
      the system call returns 512 to `cat`, which writes the bytes to the console
      ([[tour:5]]).

  - title: Three requests, eight descriptors
    file: kernel/virtio_disk.c
    lines: 226-236
    focus: 228-232
    state:
      hart: 2
      mode: S
      proc: a third process issuing a disk request
      intr: off
      satp: kernel
      locks: ["its b->lock (sleep-lock)", vdisk_lock]
      irq: {noff: 1, intena: 1}
      stack: [bread, virtio_disk_rw]
      sp: kernel
    note: |
      What if several harts issue requests at once? Each request needs 3 descriptors and
      there are only 8, so at most **two** requests can be in flight (6 descriptors), with 2
      left over. Running `logstress f1 f2 f3`, three processes writing files in parallel,
      we saw two requests in flight (the second using descriptors 3, 4, 5) 122 times, but
      never a third request having to wait for descriptors. A third request can arrive,
      though, and then it must wait:

      | Time | Hart 0 (A) | Hart 1 (B) | Hart 2 (C) |
      |---|---|---|---|
      | t1 | descriptors 0, 1, 2; notify; sleeps on its buf | | |
      | t2 | | descriptors 3, 4, 5; notify; sleeps | |
      | t3 | | | gets 6 and 7, fails on the third, frees them |
      | t4 | | | `sleep_prepare(&disk.free[0])`, releases `vdisk_lock`, `sleep()` |
      | t5 | (on some hart) A resumes, `free_chain(0)` → `wakeup(&disk.free[0])` | | |
      | t6 | | | wakes, re-takes `vdisk_lock`, tries again: gets 0, 1, 2 |

      The channel `&disk.free[0]` is just an agreed-on address; any descriptor being freed
      wakes the waiters. And because `alloc3_desc` gives back partial allocations, a sleeping
      request holds no descriptors, so every allocated descriptor belongs to a request the
      device will finish and free. If waiters kept partial sets, four waiters holding two
      each could own all eight with nothing in flight, and nobody would ever free one.

      (In the state box, the call stack is shortened to the driver; C could be any file
      system operation, and its lock list shows only the driver-level locks.)

  - title: What one block cost
    file: user/cat.c
    lines: 7-22
    focus: 12-17
    state:
      hart: 1
      mode: U
      proc: "cat (pid 3), on hart 1 (inferred, see step 14)"
      intr: on
      satp: user
      locks: []
      stack: [main, cat]
      sp:
        "on": user
        switched: "`ld sp, 48(a0)` in [[userret]] ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]])"
    note: |
      `cat` has its first 512 bytes. To get them, the kernel:

      - took 2 sleep-locks (README's inode, buffer 48) and 2 kinds of spinlock besides the
        `p->lock`s and the sleep-locks' own internal spinlocks (`bcache.lock` twice, in `bget` and `brelse`; `vdisk_lock` three times:
        to issue, in the interrupt handler, and on resuming),
      - built 3 descriptors and 1 ring entry, and issued the request with 2 `io_fence`s and
        a single doorbell store (the interrupt handler added 2 more `io_fence`s, a read of
        the device's interrupt status, a write to its `InterruptACK` register, and the PLIC
        claim and complete),
      - slept once, while 1,024 bytes moved by DMA with no hart executing a single instruction to copy them,
      - took 1 interrupt on a different hart, and called `wakeup` 4 times in the driver
        alone (once for `cat`, three times for freed descriptors), each visiting all 64
        process slots.

      The next `read` will cost almost nothing: block 48 is in the cache. So will block
      49's second half, after the first read of block 49 brings it in. The buffer cache
      turns three disk reads into the whole file.

      The key ideas:

      - The disk is driven by shared memory (descriptors and rings) plus one doorbell
        register; the fences make the order of writes part of the protocol.
      - A request sleeps holding sleep-locks but no spinlock. `vdisk_lock` is released
        before sleeping, because the interrupt handler needs it.
      - The completion can be handled by any hart, and the requester can resume on any
        hart; the buffer address is the meeting point.
      - Eight descriptors allow two requests in flight; a third waits on `disk.free[0]`.
locks:
  - lock: "ip->lock (sleep-lock)"
    where: "[[fileread]] via [[ilock]]"
    protects: "README's in-memory inode for the whole read, including the disk wait"
  - lock: "bcache.lock (spinlock)"
    where: "[[bget]], [[brelse]]"
    protects: "Which buffer holds which block, reference counts, the LRU list"
  - lock: "b->lock (sleep-lock)"
    where: "[[bget]] (acquire), [[brelse]] (release)"
    protects: "Buffer 48's contents and `valid` flag; held through the disk read"
  - lock: "vdisk_lock (spinlock)"
    where: "[[virtio_disk_rw]], [[virtio_disk_intr]]"
    protects: "The descriptor table, `free[]`, the avail and used rings, `used_idx`, `info[]` and `b->disk`"
  - lock: "p->lock (spinlock)"
    where: "[[sleep_prepare]], [[sleep]], [[wakeup]]"
    protects: "`p->chan` and `p->state`, so the disk wakeup cannot be lost"
  - lock: "no kernel lock: the PLIC claim"
    where: "[[plic_claim]]"
    protects: "The PLIC gives each pending interrupt to exactly one claiming hart"
quiz:
  - q: "`virtio_disk_rw` releases `vdisk_lock` before calling `sleep()`, but keeps the buffer's sleep-lock. Why each choice?"
    a: "The interrupt handler must take `vdisk_lock` to process the completion, and a spinlock may not be held while sleeping, so it must be released. The buffer's sleep-lock must stay held so that no other process reads or modifies the buffer, or sees `valid`, while the device is filling it (its `refcnt` of 1 is what stops it being recycled). Sleep-locks may be held while sleeping."
  - q: "Suppose the first `io_fence` in `virtio_disk_rw` were removed. What could the device see?"
    a: "It could see `avail->idx` = 35 before the descriptors or `ring[2]` were written, and process a stale or half-built chain: the wrong sector, the wrong buffer, or garbage. The fence makes the ring entry and descriptors visible before the index."
  - q: "The completion interrupt for `cat`'s request is taken on hart 1, while `cat` was sleeping after issuing it on hart 0. How does hart 1 know which process to wake?"
    a: "The driver recorded the buffer in `disk.info[0].b`, indexed by the chain's head descriptor. The used ring tells hart 1 that chain 0 finished, so it calls `wakeup(b)`, and `cat` registered on exactly that channel with `sleep_prepare(b)`."
  - q: "The interrupt arrives on hart 1 just after `cat` released `vdisk_lock` on hart 0 but before it called `sleep()`. Trace why `cat` does not sleep forever."
    a: "`cat` already called `sleep_prepare(b)`, so `p->chan == b`. `wakeup(b)` on hart 1 clears `p->chan`. When `cat` then runs `sleep()`, it sees `p->chan == 0` and returns at once, re-takes `vdisk_lock`, and finds `b->disk == 0`."
  - q: "Why does `alloc3_desc` give back the descriptors it got when it cannot get all three?"
    a: "If a waiting request kept 1 or 2 descriptors while sleeping, the remaining ones might be too few for anyone, and several waiters each holding a partial set could block one another forever. Giving them back means a waiter holds nothing, and any completed request frees a full set."
  - q: "`cat` reads README 512 bytes at a time. How many disk reads does the whole 2,441-byte file take if nothing is evicted, and why?"
    a: "Three: blocks 48, 49 and 50, one each. Every 1024-byte block serves two 512-byte reads (the last block serves the final 393 bytes); after the first read of a block it stays valid in the buffer cache."
