title: Life of a system call
group: Traps and system calls
prerequisites: [2, 4]
summary: |
  You type `echo hi` at the xv6 shell, and two letters appear on your screen. Between those
  two events, a user program asks the kernel for help, the CPU changes privilege mode twice,
  two page tables take turns, a process goes to sleep on one CPU and wakes up on another, and
  a device interrupt is handled by a third.

  This tour follows one system call, `write(1, "hi", 2)`, from the moment `echo` makes it
  to the moment `echo` continues with the next line, through every layer of xv6:
  the user-space [[g:syscall-stub]], the [[g:trampoline]], [[kernel:usertrap]], the system
  call table, the file layer, the console driver and the [[g:uart|UART]], and all the way
  back.

  It is the single most important path in the kernel. Almost every other tour is a detour
  from it.
cast: |
  The machine has three [[g:hart|harts]]. When the tour starts:

  | Hart | What it is doing |
  |---|---|
  | 0 | Its [[kernel:scheduler]] is looping, looking for something to run |
  | 1 | Running `echo` (pid 3) in user mode: the process this tour follows |
  | 2 | Running whatever else is runnable, or idle in its own scheduler |

  The shell (pid 2) is asleep in [[kernel:kwait]], waiting for `echo` to finish.
steps:
  - title: echo asks for help
    file: user/echo.c
    lines: 5-19
    focus: 11
    state:
      hart: 1
      mode: U
      proc: echo (pid 3)
      intr: on
      satp: user
      locks: []
      stack: [main]
      sp: {"on": user, detail: "echo's user stack; its kernel stack is empty"}
    note: |
      The shell started `echo` with `argv = {"echo", "hi", 0}`, so the loop runs once, with
      `argv[1] = "hi"`. Line 11 calls `write(1, "hi", 2)`.

      `echo` cannot print anything by itself. It runs in **user mode**, where the hardware
      forbids touching device registers, and even if it could, the kernel must decide who
      gets the screen. So printing means asking the kernel, and asking the kernel means a
      [[g:system-call]].

      File descriptor `1` is [[g:standard-streams|standard output]]. `echo` never opened it.
      It inherited it from the shell, which inherited it from `init`, which opened the
      console device at boot ([[user/init.c]]). All three processes' descriptor 1 point at
      the **same** [[g:open-file]] in the kernel. Remember that: it will matter when we reach
      the kernel's file layer.
    others: |
      Hart 1 runs only `echo` right now: a process runs on at most one hart at a time. But
      the kernel is shared by all three harts. While `echo` heads into it, hart 2 might be
      inside the very same kernel functions on behalf of another process. Everything we see
      from here on has to be safe against that.

  - title: The stub puts a number in a7 and executes ecall
    file: user/usys.S
    lines: 26-33
    focus: 28-32
    state:
      hart: 1
      mode: U
      proc: echo (pid 3)
      intr: on
      satp: user
      locks: []
      stack: [main, write]
      sp: {"on": user, detail: "`ecall` will not change `sp`"}
    note: |
      `write` is not a C function. It is a three-instruction [[g:syscall-stub]] generated by
      [[user/usys.pl]]. By the RISC-V [[g:calling-convention]], the C call already left the
      arguments in registers: `a0 = 1`, `a1 = ` the address of `"hi"`, `a2 = 2`.

      - `li a7, SYS_write` adds the one thing the kernel needs to know: *which* service is
        requested. [[kernel:SYS_write]] is 16 ([[kernel/syscall.h]]). In the built program it
        is the 2-byte instruction `li a7,16` at address `0x352` (`user/echo.asm`).
      - [[g:insn:ecall|ecall]] is the doorway: the instruction RISC-V provides for a program
        to ask a more privileged level for a service.

      What `ecall` does, all at once, in hardware:

      | Register | Becomes |
      |---|---|
      | `sepc` | the address of this `ecall` |
      | `scause` | 8, "environment call from U-mode" |
      | `sstatus.SPP` | 0: the trap came from user mode |
      | `sstatus.SPIE` / `SIE` | the old interrupt-enable bit is saved, and interrupts are turned **off** |
      | privilege mode | supervisor (because [[start]] delegated all exceptions to S-mode with `medeleg`, [[kernel/start.c:31]]; otherwise the trap would go to machine mode) |
      | `pc` | the address in [[g:csr:stvec|stvec]] |

      One thing does **not** change: [[g:csr:satp|satp]]. The CPU is now in supervisor mode
      but still translating addresses with **echo's page table**.

  - title: Landing in the trampoline, with the wrong page table
    file: kernel/trampoline.S
    lines: 16-38
    focus: 22-37
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "`sp` still holds echo's user stack pointer; `uservec` never pushes"}
      irq: 0
    note: |
      `stvec` pointed at [[uservec]], so this is where hart 1 now executes. The problem it
      must solve: the CPU is in the kernel's privilege mode, but it is still using the *user*
      page table, and every register still holds a user value that must be preserved.

      This works only because the [[g:trampoline]] page is mapped at the same virtual address
      (`TRAMPOLINE`, the top page of the address space) in **every** page table, user and
      kernel alike ([[kernel/vm.c:47]], [[kernel/proc.c:189]]). Whatever `satp` says, the next
      instruction is there.

      The code needs one free register to work with, but all 31 hold user data. So it parks
      the user's `a0` in [[g:csr:sscratch|sscratch]], a spare CSR, and loads `TRAPFRAME` into
      `a0`. `TRAPFRAME` is the page just below the trampoline, and in *this* process's page
      table it maps to *this* process's [[g:trapframe]].

      Notice what the hart does **not** have: a stack. `ecall` did not touch `sp`, so it
      still holds echo's user stack pointer, a value the user program chose and that may
      not even be a valid address. The kernel must never push onto it, and `uservec` is
      written so that it never pushes at all. Until the kernel page table is installed at
      line 92, the hart has no usable stack ([[concept:stacks]]): first it holds the user's
      `sp`, then, after line 76, a kernel-stack address that echo's page table does not
      map.
    others: |
      Suppose hart 2 traps from a different process at this very instant. It runs these
      exact same instructions, from the same physical trampoline page, at the same time.
      No lock is needed, because they share **no data**: hart 2 is using its process's page
      table, in which `TRAPFRAME` maps to a *different* physical page. Same code, same
      virtual address, different memory. Per-process data is the oldest trick for avoiding
      locks.

  - title: Saving every user register
    file: kernel/trampoline.S
    lines: 39-74
    focus: 39-73
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "echo's user `sp`, saved into the trapframe by line 41"}
      irq: 0
    note: |
      Thirty-one `sd` instructions copy every general-purpose register into the trapframe,
      at the offsets of [[kernel:trapframe|struct trapframe]] ([[kernel/proc.h:40]]):
      `ra` at 40, `sp` at 48, and so on. The user's `a0`, parked in `sscratch`, goes to
      offset 112 on lines 72–73.

      From now until the return, the trapframe *is* `echo`'s user state. The kernel will
      read the system-call number from `a7` (offset 168) and the arguments from `a0`–`a2`,
      and it will write the return value into the saved `a0`. When `echo` resumes, it gets
      these registers back, with `a0` changed to the result.

      Interrupts are still off (the `ecall` turned them off), so nothing can interrupt this
      half-saved state.

  - title: "ld sp: echo's kernel stack, and the kernel's other notes"
    file: kernel/trampoline.S
    lines: 75-98
    focus: 76-85
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "after line 76, `sp` holds the top of echo's empty kernel stack, but the user page table does not map it; it becomes usable when `satp` switches at line 92"}
      irq: 0
    note: |
      Now `uservec` loads what the kernel left in the trapframe last time `echo` returned
      to user space:

      - `sp` ← `kernel_sp`: the top of echo's [[g:kernel-stack]]. Every process has its own,
        so the C code about to run has a stack that no other hart is using.
      - `tp` ← `kernel_hartid`: the kernel keeps the hart's ID in `tp` ([[kernel/start.c:48]]),
        but user code may have overwritten `tp` with anything.
      - `t0` ← `kernel_trap`, the address of [[usertrap]].
      - `t1` ← `kernel_satp`, the kernel page table.

      Line 76, `ld sp, 8(a0)`, is the stack switch of this trip into the kernel
      ([[concept:stacks#kernel]]). Echo's user `sp` is safe in the trapframe (line 41), and
      the hart now points at the top of echo's kernel stack. That stack is **empty**: every
      return to user mode sets `kernel_sp` to `p->kstack + PGSIZE` ([[kernel/trap.c:117]]),
      so a process in user mode has nothing on its kernel stack. If `echo` is the first
      command after boot, it is in `proc[2]`, and its stack is the page
      `0x3fffff9000`–`0x3fffffa000`, so `sp = 0x3fffffa000`. For four more instructions that
      address is not even mapped, because `echo`'s page table is still installed; nothing
      pushes until the kernel page table is in place.

      Why is `kernel_hartid` still correct? It was saved by [[prepare_return]] on whatever
      hart last sent `echo` to user mode, and a process in user mode never changes hart:
      only the kernel's scheduler moves processes between harts. So it was saved on hart 1,
      and it is still hart 1.
    others: |
      If hart 2 traps from another process at this moment, its own `ld sp` loads *that*
      process's `kernel_sp`, from that process's trapframe. Each hart has its own `sp`, and
      each process its own kernel stack, so two harts in the trampoline never share a stack.

  - title: Switching to the kernel's world
    file: kernel/trampoline.S
    lines: 75-98
    focus: 92-98
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: kernel
      locks: []
      stack: [uservec]
      sp: {"on": kernel, switched: "`csrw satp` ([[kernel/trampoline.S:92]]) makes the stack loaded on line 76 reachable", detail: "echo's kernel stack, empty, now mapped"}
      irq: 0
    note: |
      Then `csrw satp, t1`, bracketed by two [[g:insn:sfence.vma|sfence.vma]] instructions,
      switches this hart to the kernel page table and discards cached user translations
      from the [[g:tlb]]. The trampoline is mapped at the same address in the kernel table,
      so the very next fetch still works. Finally `jalr t0` calls `usertrap`.

      The same switch makes `sp` usable: the kernel page table maps every process's kernel
      stack (all 64 were mapped once, at boot, by [[proc_mapstacks]]), so the first push in
      `usertrap`'s prologue lands in echo's stack page.
    others: |
      All three harts use the **same** kernel page table ([[kernel:kernel_pagetable]]),
      built once by hart 0 at boot. Software never modifies it after boot (the hardware may
      set its accessed/dirty bits, which needs no lock), so harts can load it into their own
      `satp` without any lock. Each hart has its own `satp` and its own TLB:
      hart 1 switching tables does not disturb harts 0 and 2.

  - title: usertrap takes charge
    file: kernel/trap.c
    lines: 32-53
    focus: 42-52
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: {"on": kernel, detail: "echo's kernel stack: `usertrap`'s frame only"}
      irq: 0
    note: |
      We are in C, on echo's kernel stack, with the kernel page table. That stack was empty
      a moment ago; `usertrap`'s prologue has just pushed the first frame, 32 bytes holding
      `ra` (the trampoline address of [[userret]]) and some saved registers. [[usertrap]]:

      1. Checks that the trap really came from user mode (`SPP` is 0). A kernel trap
         arriving here would be a disaster.
      2. Points [[g:csr:stvec|stvec]] at [[kernelvec]]. If an interrupt or exception happens
         *while the kernel is running*, it must go to the kernel's own handler, not back into
         the trampoline.
      3. Finds the current process with [[myproc]]: hart number from `tp`, then
         `cpus[hart].proc`. That is why `tp` had to be right.
      4. Saves `sepc`, the address of the `ecall`, into the trapframe, before anything can
         overwrite it.
    others: |
      [[myproc]] reads `cpus[cpuid()].proc`. It turns interrupts off around the read
      ([[push_off]]) because a timer interrupt could otherwise move this process to another
      hart between reading the hart number and reading the array, and it would get the wrong
      CPU's entry. No lock is needed, because each hart only ever writes its *own*
      `struct cpu`.

  - title: It is a system call. Turn interrupts back on
    file: kernel/trap.c
    lines: 54-68
    focus: 62-68
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: kernel
      irq: 0
    note: |
      `scause` is 8, so this is a system call ([[g:trap-cause]]).

      - If `echo` has been killed (perhaps by a `kill` from another hart a moment ago), it
        exits now instead of doing the work.
      - `epc += 4`: when `echo` resumes, it must continue *after* the `ecall`, not run it
        again. `ecall` is always 4 bytes.
      - [[intr_on]]: interrupts back on.

      That last line changes everything for the rest of the tour. From here on, a timer or
      device interrupt can arrive on hart 1 in the middle of the system call. The kernel
      waited until now because an interrupt overwrites `sepc`, `scause` and `sstatus`, and
      those have now been read and saved.
    others: |
      With interrupts on, the timer can fire on hart 1 at any instruction from here on.
      [[kerneltrap]] would then call [[yield]], and `echo` would stop mid-system-call. It is
      not lost: its kernel stack and registers are saved by [[swtch]]. But when it continues,
      it may be on **hart 0 or hart 2**. A system call can start on one CPU and finish on
      another. Any code that remembered "which hart am I on" across a possible switch would be
      wrong. That is why xv6 always asks again ([[cpuid]] and [[myproc]]) instead of caching
      the answer.

  - title: Dispatching through the system-call table
    file: kernel/syscall.c
    lines: 136-151
    focus: 142-146
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall]
      sp: kernel
      irq: 0
    note: |
      [[syscall]] reads the number from the saved `a7`: 16. It checks it is in range and
      calls `syscalls[16]`, which the table at [[kernel/syscall.c:126]] maps to [[sys_write]]
      using C [[g:designated-initializer|designated initializers]].

      Look at line 146: whatever `sys_write` returns is stored into `p->trapframe->a0`, the
      saved user `a0`. That is how a system call "returns a value": when `echo` resumes, its
      `a0` register will hold the result, exactly as if `write` had been an ordinary
      function.

      A bad number (a buggy or hostile program could put anything in `a7`) gets -1 and a
      message, not a crash.

  - title: sys_write fetches its arguments
    file: kernel/sysfile.c
    lines: 82-95
    focus: 89-94
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_write]
      sp: kernel
      irq: 0
    note: |
      System-call handlers take no C arguments. They fetch them from the trapframe
      ([[g:syscall-arguments]]):

      - [[argaddr]]`(1, &p)`: `p` is the *user* address of `"hi"`. It is only a number; the
        kernel cannot dereference it, because it means something only in echo's page table.
      - [[argint]]`(2, &n)`: `n = 2`.
      - [[argfd]]`(0, 0, &f)`: turns descriptor 1 into a `struct file *`.

      Notice what is *not* checked: whether `p` points to readable memory. Checking now would
      only duplicate work: [[copyin]] must translate every page of the buffer through echo's
      page table anyway when it copies the bytes, and it fails cleanly if an address is bad.
      So the check happens exactly when the bytes are copied.

  - title: From descriptor to open file, without a lock
    file: kernel/sysfile.c
    lines: 20-35
    focus: 27-29
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_write, argfd]
      sp: kernel
      irq: 0
    note: |
      [[argfd]] checks that the descriptor is in range and refers to an open file:
      `myproc()->ofile[1]`, the per-process table of open files ([[g:file-descriptor]]).

      There is no lock around that array read. Why is that safe on a three-hart machine?
      Because `ofile[]` belongs to `echo` alone, and only `echo` itself ever changes it
      (through `open`, `close`, `dup`, `pipe`). xv6 processes have one thread, so while `echo`
      is here, nothing else can be modifying `echo`'s descriptor table.
    others: |
      The `struct file` that `ofile[1]` points to is a different story: it is **shared**.
      `init` opened the console once and `dup`ed it to descriptors 1 and 2, and each `fork`
      copied all three references, so `init`, the shell and `echo` hold 9 references to this
      one `struct file`. `init` and the shell are asleep in `wait` right now, but any other
      process started from this shell (a background job, say) would share it too, and could
      be in [[filewrite]] on hart 2 with this very `struct file`. That is safe because the
      file can't disappear (its [[g:reference-count]] stays above zero while anyone holds it)
      and because a console file has no offset to fight over. The real contention comes at
      the UART, and there it is handled with a lock.

  - title: filewrite dispatches to the console driver
    file: kernel/file.c
    lines: 132-148
    focus: 139-147
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_write, filewrite]
      sp: kernel
      irq: 0
    note: |
      [[filewrite]] is the file layer: one entry point for pipes, disk files and devices.
      After checking the file was opened for writing, it looks at `f->type`.

      The console is `FD_DEVICE` with major number `CONSOLE` (1). Line 147 calls
      `devsw[1].write`, a [[g:function-pointer]] that [[consoleinit]] set to
      [[consolewrite]] at boot ([[kernel/console.c:202]]). The first argument, `1`, means "the
      address is a user address".

      This table of function pointers is how a tiny kernel gets device independence: the
      file layer knows nothing about UARTs.

  - title: consolewrite copies the bytes in, 32 at a time
    file: kernel/console.c
    lines: 58-79
    focus: 65-75
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite]
      sp: kernel
      irq: 0
    note: |
      [[consolewrite]] moves the data in batches through a 32-byte buffer on the kernel
      stack. Ours is one batch of 2 bytes.

      [[either_copyin]] with `user_src = 1` calls [[copyin]] to bring `"hi"` from echo's
      memory into `buf`. If the address is bad, the copy fails and the loop stops, returning
      how much it managed to write. A bad pointer from user space costs the program its
      write, never the kernel its life.

      Each batch then goes to [[uartwrite]].
    others: |
      Another process on hart 2 writing to the console runs this same loop with its own
      `buf` (on its own kernel stack, so no sharing). Both will call `uartwrite`. The
      batching means two writers' output can interleave in pieces of up to 32 bytes, but
      never byte by byte.

  - title: copyin walks echo's page table by hand
    file: kernel/vm.c
    lines: 383-405
    focus: 387-402
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, either_copyin, copyin]
      sp: kernel
      irq: 0
    note: |
      The hart is using the *kernel* page table, so it cannot simply read address `p`: in
      the kernel's map, that number means something else entirely. [[copyin]] does in
      software what the hardware would do with echo's page table:

      1. Round the address down to its page (`va0`).
      2. [[walkaddr]] looks it up in `echo`'s page table and returns the *physical* address,
         or 0 if it is not mapped (or not a user page).
      3. If it is not mapped, [[vmfault]] may supply a lazily-allocated page; otherwise the
         copy fails.
      4. Copy from `pa0 + offset`. That works because the kernel maps all physical memory
         at the same address ([[g:direct-map]]).

      `"hi"` is two bytes on one page, so one iteration.
    others: |
      Could another hart change echo's page table while we walk it? Only `echo`'s own system
      calls (`sbrk`, `exec`) modify its user page table, and `echo` is busy here. Its memory
      is freed only after it exits. So no lock is needed for the walk. If the page was
      allocated lazily, [[vmfault]] calls [[kalloc]], which takes `kmem.lock`, because the
      free-page list *is* shared by all harts.

  - title: Taking the UART's sleep-lock
    file: kernel/sleeplock.c
    lines: 21-34
    focus: 24-31
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: kernel
      locks: ["tx_lock.lk (spinlock)"]
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, uartwrite, acquiresleep]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      [[uartwrite]] begins with `acquiresleep(&tx_lock)` ([[kernel/uart.c:82]]): only one
      thread at a time may feed bytes to the UART, or two writers' bytes would be shuffled
      together.

      Why a [[g:sleeplock]] and not a [[g:spinlock]]? Because the holder may have to *wait*
      for the UART, maybe for a long time on real hardware. A spinlock holder must never
      sleep, and a waiter spins with interrupts off, burning a whole CPU. With a sleep-lock,
      a waiting thread gives up its CPU instead.

      Inside, a sleep-lock is a spinlock (`lk->lk`) protecting a `locked` flag. If it is
      taken, the caller registers to wait, releases the spinlock and sleeps.

      Look at the display above: throughout lines 24–33 (unless the loop at 25–29 has to
      wait) hart 1 holds the sleep-lock's *inner spinlock* `tx_lock.lk`, so interrupts are **off**. Only after line 31 sets
      `locked` and line 33 releases the spinlock does `echo` hold `tx_lock` the sleep-lock,
      with interrupts back on, which is the state you will see in the next step.
      They come back on because the `acquire` on line 24 found them on and recorded
      `intena = 1`; line 32's [[myproc]] pushes `noff` to 2 and back for a moment without
      changing that ([[concept:locks#intena]]).
    others: |
      Suppose `cat` on hart 2 is also writing to the console:

      | Time | Hart 1 (echo) | Hart 2 (cat) |
      |---|---|---|
      | t1 | `acquire(&tx_lock.lk)` | `acquire(&tx_lock.lk)`: spins |
      | t2 | sees `locked == 0`, sets it to 1 | still spinning |
      | t3 | `release(&tx_lock.lk)` | gets the spinlock, sees `locked == 1` |
      | t4 | starts sending bytes | `sleep_prepare(lk)`, releases the spinlock, `sleep()` |
      | t5 | … `releasesleep` → `wakeup(lk)` | wakes, re-checks, takes the lock |

      The inner spinlock is held for only a few instructions, so the spinning at t1 is brief.
      The long wait at t4 happens asleep, with hart 2 free to run other processes.

  - title: Ready? Send. Busy? Register, then sleep
    file: kernel/uart.c
    lines: 76-96
    focus: 84-93
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: [tx_lock (sleep-lock)]
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, uartwrite]
      sp: kernel
      irq: 0
    note: |
      For each byte, [[uartwrite]] checks the UART's line-status register: is the transmitter
      ready (`LSR_TX_IDLE`)? If so, it writes the byte to the transmit-holding register
      `THR`, a [[g:mmio|memory-mapped]] device register. The UART then shifts it out, one bit
      at a time.

      If the transmitter is busy, the thread must wait for the UART's "I'm ready" interrupt.
      On QEMU the emulated UART is almost always ready immediately. On a real 38,400-baud
      line each byte takes about a quarter of a millisecond, an eternity for a CPU. Let's
      follow the busy case.

      The order of the three operations is the whole trick:

      1. [[sleep_prepare]]`(&tx_chan)`: "I am about to wait on `tx_chan`".
      2. *Then* check the UART.
      3. Busy? [[sleep]]`()`.

      Registering *before* checking is what prevents a **lost wakeup**. See the box below.
    others: |
      The UART interrupt can be taken by **any** hart. Suppose we registered *after*
      checking:

      | Time | Hart 1 (echo) | Hart 2 |
      |---|---|---|
      | t1 | reads LSR: busy | |
      | t2 | | UART interrupt → `uartintr` → `wakeup(&tx_chan)`: **nobody registered yet** |
      | t3 | registers and sleeps | |
      | t4 | sleeps forever: the only wakeup already happened | |

      With xv6's order, at t2 `echo` is already registered, so [[wakeup]] clears its
      `p->chan`, and at t3 [[sleep]] sees `chan == 0` and returns at once. No lost wakeup,
      and no lock spanning the check and the sleep. ([[g:sleep-wakeup]])

  - title: Going to sleep, holding the right lock
    file: kernel/proc.c
    lines: 558-572
    focus: 566-571
    state:
      hart: 1
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: kernel
      locks: [tx_lock (sleep-lock), echo's p->lock]
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, uartwrite, sleep]
      sp: {"on": kernel, detail: "echo's kernel stack, `usertrap` … `sleep`; `sched`'s `swtch` will leave it"}
      irq: {noff: 1, intena: 1}
    note: |
      [[sleep]] takes `echo`'s `p->lock`, a spinlock, so interrupts are now off on hart 1. If
      `p->chan` is still set (no wakeup yet), it marks the process `SLEEPING` and calls
      [[sched]], which [[swtch|switches]] to hart 1's scheduler thread. `sched` insists that
      `noff` is exactly 1 (`p->lock` only) and saves `echo`'s `intena`, 1, in a local
      variable that this build keeps in the callee-saved register `s3`, which [[swtch]]
      stores in `echo`'s `p->context`, because the next thread on hart 1 will set its own
      ([[concept:locks#sched-intena]]).

      Hart 1 is now free. Its scheduler will release `echo`'s `p->lock` and look for another
      process to run. `echo` is frozen inside `sleep`, with its whole kernel call stack
      preserved on its kernel stack, still holding `tx_lock`.

      Inside `sched`, the `ld sp, 8(a1)` in [[swtch]] ([[kernel/swtch.S:26]]) moves hart 1's
      `sp` to its scheduler stack. Echo's kernel stack, empty when `uservec` set `sp` to its
      top, now holds everything this system call has done so far, and no hart's `sp` points
      into it:

      ```text
      echo's kernel stack (KSTACK(2), one page)
        top ─► usertrap
               syscall
               sys_write
               filewrite
               consolewrite   (buf[32] is in this frame)
               uartwrite
               sleep
               sched     ◄─ echo's p->context.sp, saved by swtch
      ```

      Holding a sleep-lock while asleep is allowed, and it is the reason sleep-locks exist.
      Holding a *spinlock* while asleep is forbidden, except for `p->lock` itself, which the
      scheduler releases on the sleeper's behalf ([[g:context-switch]]).
    others: |
      `p->lock` protects `p->state` and `p->chan`. Every hart's scheduler reads `p->state`
      under `p->lock` when looking for work, and [[wakeup]] on any hart writes it under the
      same lock. Because `echo` sets `SLEEPING` and gives up the CPU *while holding*
      `p->lock`, no other hart can see `SLEEPING` and wake or run `echo` before it has fully
      stopped running on hart 1.

  - title: The UART interrupts, and hart 2 answers
    file: kernel/trap.c
    lines: 188-212
    focus: 192-210
    state:
      hart: 2
      mode: S
      proc: none (hart 2's scheduler)
      intr: off
      satp: kernel
      locks: []
      stack: [main, scheduler, kernelvec, kerneltrap, devintr]
      sp: {"on": scheduler, detail: "hart 2's slice of `stack0`, with a 256-byte `kernelvec` frame on top"}
      irq: 0
    note: |
      The UART finishes sending and raises its interrupt line. The
      [[g:plic|PLIC]] has the UART interrupt enabled for every hart ([[plicinithart]]), so
      whichever hart *claims* it handles it. Here hart 2 wins. It arrives in [[devintr]],
      through [[kerneltrap]] if it was in the kernel or [[usertrap]] if it was in user mode.

      In this telling hart 2 was idle, looping in its [[scheduler]], and took the interrupt
      in the moment at [[kernel/proc.c:441]] when the scheduler turns interrupts on, with
      `noff = 0`, as every interrupt must be: a hart holding any spinlock has its interrupts
      off ([[concept:locks#invariant]]). There
      is no separate interrupt stack in xv6: [[kernelvec]] pushed its 256-byte save area
      onto the stack hart 2 was already using, its **scheduler stack** in [[stack0]], and
      `kerneltrap` and `devintr` run on top of it. (Had hart 2 been in a system call, the
      same frame would have gone onto that process's kernel stack; had it been in user mode,
      [[uservec]] would have switched to that process's kernel stack.)

      `scause` says "supervisor external interrupt". [[plic_claim]] asks the PLIC which
      device it was: `UART0_IRQ`. After [[uartintr]] runs, [[plic_complete]] tells the PLIC
      the UART may interrupt again.

      This hart is handling an interrupt on behalf of a process (`echo`) that is not running
      anywhere. Interrupt handlers serve the machine, not the current process.
    others: |
      What if hart 0 tries to claim at the same moment? The PLIC hands each pending
      interrupt to exactly one claimer, because a claim atomically clears the source's
      pending bit. A second, simultaneous claim gets 0 ("nothing pending", unless another
      device is also pending), and [[devintr]] ignores it. The PLIC itself does the
      arbitration, so there is no kernel lock here.

  - title: wakeup visits every process
    file: kernel/proc.c
    lines: 574-595
    focus: 580-594
    state:
      hart: 2
      mode: S
      proc: none (hart 2's scheduler)
      intr: off
      satp: kernel
      locks: [each p->lock in turn]
      stack: [main, scheduler, kernelvec, kerneltrap, devintr, uartintr, wakeup]
      sp: {"on": scheduler, detail: "hart 2's scheduler stack, under the `kernelvec` frame"}
      irq: {noff: 1, intena: 0}
    note: |
      [[uartintr]] sees the transmitter idle and calls `wakeup(&tx_chan)`
      ([[kernel/uart.c:145]]). [[wakeup]] walks the whole process table. For each process it
      takes `p->lock`, and if that process is waiting on `tx_chan`, it clears `p->chan` and,
      if it is fully asleep, sets it `RUNNABLE`. Each of those `acquire`s runs inside an
      interrupt handler with interrupts already off, so it records `intena = 0` and its
      `release` leaves them off ([[concept:locks#handlers]]).

      `echo` is now `RUNNABLE`. It is not running yet; it is eligible. (The source comment
      says "RUNNING"; the code correctly sets `RUNNABLE`.)

      When the handler is done, [[kerneltrap]] does not [[yield]]: it yields only when
      `myproc()` is a process, and hart 2 has none. `kernelvec` pops its frame and `sret`s
      back into the scheduler loop, where hart 2 could now find `echo` `RUNNABLE` too. In this
      telling, hart 0's scheduler gets there first.
    others: |
      `wakeup` must take each process's lock, because it reads and writes `p->chan` and
      `p->state`, which the sleeper and every scheduler also use. Remember step 17: `echo`
      held its `p->lock` from marking itself `SLEEPING` until hart 1's scheduler released it.
      So hart 2 sees `echo` in one of three clean states: not yet registered (it skips it),
      registered but still running (it only clears `p->chan`, and `sleep()` will return at
      once), or fully asleep with its registers saved by `swtch` (it sets `RUNNABLE`). It can
      never catch `echo` marked `SLEEPING` while still running on hart 1, so no scheduler can
      start `echo` on a second hart while hart 1 is still using its kernel stack.

  - title: Resumed on a different hart
    file: kernel/uart.c
    lines: 79-96
    focus: 85-95
    state:
      hart: 0
      mode: S
      proc: echo (pid 3)
      intr: on
      satp: kernel
      locks: [tx_lock (sleep-lock)]
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, uartwrite]
      sp: {"on": kernel, switched: "`ld sp, 8(a1)` in [[swtch]] ([[kernel/swtch.S:26]]), called by hart 0's scheduler", detail: "echo's kernel stack: the frames pushed on hart 1"}
      irq: 0
    note: |
      Hart 0's scheduler was looking for work. It finds `echo` `RUNNABLE`, marks it
      `RUNNING`, and switches to it. `echo` returns out of [[sleep]] exactly where it
      stopped, still inside `uartwrite`, still holding `tx_lock`, now running on
      **hart 0**.

      The switch is the `ld sp, 8(a1)` in hart 0's [[swtch]]: it loads `echo`'s
      `p->context.sp`, saved on hart 1, so hart 0's `sp` now points into echo's kernel stack,
      at the very frames hart 1 pushed. Hart 0's own scheduler frames stay behind in its
      slice of [[stack0]].

      Interrupts are on again because [[sched]] put back `echo`'s own `intena`, 1, saved on
      hart 1, so [[sleep]]'s `release(&p->lock)` turned them on, although hart 0's scheduler
      had taken that lock with interrupts off ([[concept:locks#sched-intena]]).

      The loop goes around again: register, check, the transmitter is idle, write the byte
      it was waiting to send. When both bytes are out, [[releasesleep]] gives up `tx_lock` and wakes anyone
      waiting for it, such as the `cat` from step 15.

      Nothing in `uartwrite` noticed the change of CPU, and nothing needed to. The kernel
      stack, the local variables and the locks held all belong to the *thread*, not to the
      hart.
    others: |
      Hart 1, where the system call began, is now running something else entirely. Three
      harts have touched this one `write`: hart 1 started it, hart 2 took the interrupt,
      hart 0 is finishing it. This is normal on a multi-core kernel, and it is why
      per-CPU state (`struct cpu`, `tp`) must never be trusted across a point where the
      thread might sleep or be preempted.

