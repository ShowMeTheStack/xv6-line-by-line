    note: |
      The stub's `ret` returns to `main` with `a0 = 2`. `echo` ignores the result, and on
      line 15 writes the newline: the whole journey again, for one byte. Then `exit(0)`,
      another system call, which has a tour of its own: [[tour:21]].

      Count what one `write` took in our story: 2 privilege-mode changes (`ecall` and
      `sret`), 2 `satp` writes (one in `uservec`, one in `userret`, each between two
      `sfence.vma`s), 31 registers saved and 31 restored, 1 sleep and the UART interrupt
      that ended it (the UART interrupts again after the last byte, with nobody waiting),
      and 3 harts. It also took 4 stack switches: `uservec`'s `ld sp` onto echo's kernel
      stack, the [[swtch]] in [[sched]] onto hart 1's scheduler stack, hart 0's `swtch`
      back onto echo's kernel stack, and `userret`'s `ld sp` back to the user stack (usable once `sret` returned to user mode). Hart 2's
      `kernelvec` frame was pushed onto the stack it was already on, which is not a switch. On QEMU, whose UART is almost always ready, there would usually be no
      sleep at all. A system call is not a
      function call. It is a carefully staged handover of the CPU, and the lock at every
      shared point is what lets three CPUs do this at once without tripping over each other.
locks:
  - lock: "cpus[].proc (no lock: interrupts off)"
    where: "[[myproc]]"
    protects: "Reading this hart's current process; interrupts off keeps the hart from changing mid-read"
  - lock: "tx_lock.lk (spinlock)"
    where: "[[acquiresleep]], [[releasesleep]]"
    protects: "The sleep-lock's own `locked` flag and holder pid"
  - lock: "tx_lock (sleep-lock)"
    where: "[[uartwrite]]"
    protects: "The UART transmitter: one writer feeds it at a time"
  - lock: "p->lock (spinlock)"
    where: "[[sleep_prepare]], [[sleep]], [[wakeup]], [[killed]] (twice in [[usertrap]]), the schedulers"
    protects: "`p->chan`, `p->state` and `p->killed`: who is waiting, who may run, who must exit"
  - lock: "kmem.lock (spinlock)"
    where: "[[kalloc]], only if [[copyin]] meets a lazily allocated page"
    protects: "The shared free-page list"
quiz:
  - q: "When `ecall` executes, `satp` still holds the user page table. Why doesn't the CPU crash fetching the next instruction?"
    a: "The trampoline page is mapped at the same virtual address (`TRAMPOLINE`) in every user page table and in the kernel page table, and `stvec` points into it. Whatever page table is active, the trampoline code is there."
  - q: "`echo`'s system call began on hart 1 and finished on hart 0. Which line makes sure the *next* trap from `echo` restores the right hart ID into `tp`, and why is the answer guaranteed to be correct?"
    a: "`p->trapframe->kernel_hartid = r_tp()` in `prepare_return` ([[kernel/trap.c:119]]) records hart 0. It stays correct because a process in user mode never changes hart; only the kernel scheduler moves processes. So the next trap from `echo` is taken on hart 0."
  - q: "Why does `uartwrite` use a sleep-lock (`tx_lock`) instead of a spinlock?"
    a: "The holder may wait a long time for the UART and sleeps while doing so. A spinlock holder must never sleep (and has interrupts off), and its waiters would spin uselessly. A sleep-lock lets waiters give up their CPU."
  - q: "The UART interrupt arrives on hart 2 between `uartwrite`'s check of `LSR` (busy) on hart 1 and its call to `sleep()`. Walk through why `echo` does not sleep forever."
    a: "`echo` called `sleep_prepare(&tx_chan)` *before* checking, so `p->chan` was already set. `wakeup(&tx_chan)` on hart 2 clears `p->chan` under `p->lock`. When `echo` then calls `sleep()`, it sees `p->chan == 0` and returns immediately, loops, and finds the transmitter idle."
  - q: "`argfd` reads `myproc()->ofile[fd]` without taking any lock. Why is that safe even with three harts?"
    a: "Only the process itself changes its own `ofile[]` table, and xv6 processes have a single thread. While `echo` runs `argfd`, no other code can be modifying echo's descriptor table. The shared `struct file` it points to is kept alive by its reference count."
  - q: "Why does `usertrap` wait until after saving `sepc` and checking `scause` before calling `intr_on()`?"
    a: "An interrupt overwrites `sepc`, `scause` and `sstatus`. Those registers had to be read and saved first, or the information about the system call would be lost."
