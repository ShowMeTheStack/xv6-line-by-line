    note: |
      `usertrap` returns into the trampoline, right after `jalr t0`, which is [[userret]].
      In reverse order:

      - [[g:insn:fence.i|fence.i]] (line 107, just before this) makes hart 0's instruction
        fetches see what is now in memory. `echo`'s code was written into its pages with
        ordinary data stores when `exec` loaded it, on whichever hart ran `exec`, and hart
        0's instruction cache could still hold stale bytes for those physical pages, for
        example from a program that used them earlier. That matters the first time a process
        runs on a hart; xv6 doesn't track that, so it executes `fence.i` on every return to
        user space.
      - Switch `satp` to echo's page table, again between two `sfence.vma`s.

      From here until `sret` the hart has **no usable stack**. `sp` is back at the
      top of echo's kernel stack (`usertrap` popped its frame when it returned), but echo's
      page table does not map kernel stacks; from line 118 it holds echo's user `sp`, which
      supervisor code cannot use. The trampoline never pushes, so it does not matter.

  - title: "ld sp, then sret: back to user mode"
    file: kernel/trampoline.S
    lines: 100-153
    focus: 118-153
    state:
      hart: 0
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: user
      locks: []
      stack: [userret]
      sp: {"on": none, switched: "`ld sp, 48(a0)` in [[userret]] ([[kernel/trampoline.S:118]]) loads the user's `sp`", detail: "`sp` holds echo's user stack pointer, where `write` left it; supervisor code cannot use it"}
      irq: 0
    note: |
      - Reload all user registers from the trapframe, including `a0`, which now holds **2**.
        The first of them that matters for stacks is line 118, `ld sp, 48(a0)`: `sp` is
        back on echo's **user stack**, at exactly the value that [[uservec]] saved, still
        holding `main`'s frame. From here to `sret` the hart is still in supervisor mode with
        the user page table, and supervisor code cannot use user pages, so there is no usable
        stack and nothing is pushed.
      - [[g:insn:sret|sret]]: return to user mode, at `sepc`, with interrupts enabled. It
        does not touch `sp`, but by changing the mode it makes the user stack usable again.

      In one instruction the hart drops from supervisor to user mode, and `echo` continues
      as if `write` were an ordinary function call that took a while. Its kernel stack is
      empty again, as it is whenever `echo` runs in user mode.

