  - title: prepare_return records the new hart
    file: kernel/trap.c
    lines: 97-132
    focus: 108-131
    state:
      hart: 0
      mode: S
      proc: echo (pid 3)
      intr: off
      satp: kernel
      locks: []
      stack: [usertrap, prepare_return]
      sp: {"on": kernel, detail: "echo's kernel stack; `kernel_sp` is set to its top for next time"}
      irq: 0
    note: |
      [[prepare_return]] first turns interrupts **off**. It is about to point `stvec` back
      at `uservec` in the trampoline, and from that moment a kernel interrupt would land in
      user-trap code. That would be a disaster.

      Then it refills the trapframe's kernel fields for the *next* trap: the kernel page
      table, the top of the kernel stack (always the top: the next trap starts on an empty
      stack), the address of `usertrap`, and, on line 119,
      `kernel_hartid = r_tp()`: **0**, this hart. The next time `echo` traps, it will be on
      hart 0, because a process in user mode stays where it was sent. So hart 0 is the right
      answer, and the hart 1 written on the last return is now stale.

      Finally `sstatus` (`SPP = 0`: return to user mode; `SPIE = 1`: interrupts on once
      there) and `sepc` (the saved user PC, already advanced past the `ecall`).

