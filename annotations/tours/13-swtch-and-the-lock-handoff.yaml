quiz:
  - q: "Why does `struct context` hold only `ra`, `sp` and `s0`–`s11`, while a trapframe holds 31 registers?"
    a: "`swtch` is entered by a normal C call, so the calling convention already allows it to destroy `t` and `a` registers; the compiler saved any live ones before the call. A trap can interrupt user code at any instruction, so every register must be saved."
  - q: "`release` panics unless the lock is held by this CPU. Why doesn't the scheduler's release of `cat`'s lock, acquired by `cat`'s thread, trigger that panic?"
    a: "`holding` compares `lk->cpu` with the current CPU, not the current thread. `cat` acquired the lock on hart 1 and the scheduler releases it on hart 1, so the check passes. The hand-off always happens on a single hart."
  - q: "Suppose `sched` did not save and restore `intena`. Trace what happens to interrupts on hart 2 after `cat` wakes there."
    a: "`cpus[2].intena` would still be 0, set by hart 2's scheduler's `acquire`. When `sleep` releases `p->lock`, `pop_off` would leave interrupts off, so the rest of `cat`'s system call would run unpreemptible with interrupts off on hart 2, although `cat` had them on before sleeping."
  - q: "What would go wrong if `sleep` called `sched` while also holding `cons.lock`?"
    a: "`sched` would panic (`noff != 1`). Without that check, `cons.lock` would stay held while `cat` sleeps, so `consoleintr` on any hart would spin forever with interrupts off trying to deliver the very keystroke that would wake `cat`: a deadlock."
  - q: "A brand-new process has never called `swtch`. How does the scheduler's ordinary `swtch` start it, and what must its first code do?"
    a: "`allocproc` forged its context with `ra = forkret` and `sp` at the top of its kernel stack, so `swtch`'s `ret` jumps to `forkret` on an empty stack. `forkret` must first release `p->lock`, which the scheduler acquired, because there is no `yield` or `sleep` frame to do it."
  - q: "`swtch` does not save or restore `tp`. Why is that essential rather than an oversight?"
    a: "`tp` holds the hart number used by `cpuid`/`mycpu`. A thread resumed on hart 2 must see 2, not the 1 it had when it stopped. Since `tp` is never switched, it always describes the hart actually executing."
