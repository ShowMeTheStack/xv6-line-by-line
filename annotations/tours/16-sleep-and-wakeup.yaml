  - title: Re-check the condition, then take the bytes
    file: kernel/pipe.c
    lines: 118-142
    focus: 129-140
    state:
      hart: 0
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: ["pi->lock"]
      stack: [usertrap, syscall, sys_read, fileread, piperead]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      `wc` re-acquires `pi->lock` and goes back to the top of the `while`: is the pipe still
      empty? No: `nwrite - nread == 512`. The loop exits and the copy loop moves up to 512
      bytes to `wc`'s `buf` with [[copyout]], one byte at a time, advancing `nread`. (Like
      `copyin`, `copyout` could call [[kalloc]] under `pi->lock` for a lazily reserved
      page.)

      Then `wakeup(&pi->nwrite)`: the pipe has room again, and `cat`, asleep on that channel
      since step 14, becomes `RUNNABLE`. Both directions of the pipe use the same handshake,
      with the roles swapped.

      `read` returns 512. `wc` counts those bytes in user space and calls `read` again. The
      dance repeats until `README`'s 2441 bytes are through. When `cat` exits, closing the
      last write end, [[pipeclose]] sets `writeopen = 0` and calls `wakeup(&pi->nread)`, so
      a `wc` waiting on an empty pipe wakes, sees `writeopen == 0`, and returns 0: end of
      file.
    others: |
      | Time | Hart 0 (wc) | Hart 1 (cat) | Hart 2 |
      |---|---|---|---|
      | t1 | spins on `pi->lock` | holds it: full pipe, `sleep_prepare(&pi->nwrite)` | idle |
      | t2 | gets `pi->lock` | `release`, `sleep()`: `SLEEPING` | |
      | t3 | copies 512 bytes, `wakeup(&pi->nwrite)`: `cat` → `RUNNABLE` | | |
      | t4 | `release`, returns 512 | a scheduler (hart 1's, most likely) picks `cat` | |

  - title: Why every sleep sits in a while loop
    file: kernel/pipe.c
    lines: 111-128
    focus: 119
    state:
      hart: 0
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: ["pi->lock"]
      stack: [usertrap, syscall, sys_read, fileread, piperead]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      Line 119 is a `while`, not an `if`. A wakeup means "something happened on this
      channel", never "your condition is now true". There are several ways `wc` can come out
      of `sleep()` with the pipe still empty:

      - **Several readers.** If two processes read the same pipe, `wakeup(&pi->nread)` wakes
        both. The first to get `pi->lock` takes all the data; the second finds the pipe empty
        again and must go back to sleep.
      - **Kill.** [[kkill]] makes a sleeping victim `RUNNABLE` without any event at all
        (next step).
      - **Shared channels.** One channel can stand for several conditions. [[begin_op]] waits
        on `&log` both for a commit to finish and for log space to free up.
      - **Wakeups without data.** `pipewrite` calls `wakeup(&pi->nread)` on line 105 even
        when it copied nothing: for `write(fd, buf, 0)`, or when the very first `copyin`
        fails.

      So the rule throughout xv6: re-acquire the condition lock, re-test the condition, and
      sleep again if it does not hold. A wakeup that turns out to be useless costs one loop;
      trusting it could cost correctness.
    others: |
      Two readers, same pipe:

      | Time | Hart 0 (reader A) | Hart 1 (writer) | Hart 2 (reader B) |
      |---|---|---|---|
      | t1 | asleep on `&pi->nread` | writes 5 bytes, `wakeup`: A and B → `RUNNABLE` | asleep on `&pi->nread` |
      | t2 | takes `pi->lock`, reads all 5 | | spins on `pi->lock` |
      | t3 | releases | | gets it: `nread == nwrite` again, so `while` sends B back to sleep |

  - title: A kill is a wakeup with no event
    file: kernel/proc.c
    lines: 597-622
    focus: 610-616
    state:
      hart: any
      mode: S
      proc: some process calling kill(5)
      intr: off
      satp: kernel
      locks: ["wc's p->lock"]
      stack: [usertrap, syscall, sys_kill, kkill]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      Suppose some process calls `kill(5)` while `wc` sleeps on an empty pipe. [[kkill]]
      takes `wc`'s `p->lock`, sets `killed = 1` and, because `wc` is `SLEEPING`, makes it
      `RUNNABLE`. It does **not** clear `p->chan`. No data arrived; the "wakeup" is fake.

      `wc` returns from `sleep()` with `p->chan` still `&pi->nread`. That stale value is
      harmless: a later `wakeup(&pi->nread)` would clear it without changing `wc`'s state
      (state 2 of step 13), and the next `sleep()` is always preceded by a new
      `sleep_prepare`, which overwrites it.

      Back in `piperead`, the `while` re-tests: the pipe is still empty, so it goes round
      again, and line 120's [[killed]] check sees the flag and returns -1. `wc` then dies on
      its way back to user space ([[kernel/trap.c:81]]). This is why the `killed` test sits
      *inside* the loop, before each sleep, not once at the top.
    others: |
      Without the loop's re-check, the copy loop's own test (line 130) would stop at once and
      `piperead` would return 0, which a reader takes as end of file even though `cat` still
      holds the write end. (A killed `wc` dies before user space sees it, but a reader woken
      by a competing reader would see a false EOF.) Without the `killed` test inside the loop, a killed `wc` would
      go straight back to sleep and might never exit if no writer ever comes. See
      [[tour:23]].

  - title: One channel, two conditions in begin_op
    file: kernel/log.c
    lines: 127-150
    focus: 138
    state:
      hart: any
      mode: S
      proc: any process starting a file-system call
      intr: off
      satp: kernel
      locks: ["log.lock"]
      stack: [usertrap, syscall, sys_open, begin_op]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      The same pattern appears all over xv6, and [[begin_op]] shows why the loop must
      re-test *everything*. A file-system call may not start while a commit is in progress
      (line 133), nor if its worst-case writes might overflow the log (line 138). Both waits
      use the single channel `&log`, under the condition lock `log.lock`.

      [[end_op]] calls `wakeup(&log)` in two situations: after a commit finishes, and when
      a call ends without committing, freeing reserved space. Either one wakes every
      sleeper in `begin_op`, whatever it was waiting for. A process woken because a
      commit finished may find that the log is still too full; a process woken because space
      freed may find that a commit has started meanwhile. The `while (1)` re-runs both
      tests and sleeps again if needed. ([[sys_sync]] waits on `&log` too, for a commit to
      complete, so one channel actually serves three waits.)

      Using one channel for two conditions is a deliberate simplification. It costs some
      useless wakeups and buys simpler code; the loop keeps it correct. ([[tour:31]] covers
      the log itself.)
    others: |
      Many processes can sleep on `&log` at once. When `end_op` wakes them, they race for
      `log.lock`, and each reserves its own space in turn under it. Without the lock, two
      processes could both see room for one more operation and both take it.

  - title: The UART sleeps with no condition lock
    file: kernel/uart.c
    lines: 76-96
    focus: 84-93
    state:
      hart: 0
      mode: S
      proc: wc (pid 5)
      intr: on
      satp: kernel
      locks: ["tx_lock (sleep-lock)"]
      stack: [usertrap, syscall, sys_write, filewrite, consolewrite, uartwrite]
      sp: kernel
      irq: 0
    note: |
      `wc` finishes counting and prints `48 336 2441 ` and a newline. User `printf` writes
      one character per `write` call ([[user/printf.c:12]]), so that is 13 trips into
      [[uartwrite]], each with `n = 1`.

      Here the "condition" is a bit in a device register, `LSR_TX_IDLE`. No kernel lock
      protects it: the UART changes it whenever it finishes sending, and the waker is
      [[uartintr]], an interrupt handler that may run on any hart. There is no condition lock
      to hold across the check.

      The split design handles it by ordering alone: [[sleep_prepare]]`(&tx_chan)` first,
      *then* read `LSR`. If the transmitter becomes idle after the read, its interrupt comes
      after the registration, so the wakeup clears `p->chan` and `sleep()` returns at once.
      The older `sleep(chan, lk)` needed a lock to hand over, so the older driver kept a
      software copy of the device state (a `tx_busy` flag) under a `tx_lock` spinlock that the
      interrupt handler also took. The split design lets `uartwrite` test the hardware bit
      directly, with no condition lock ([[concept:locks#sleep-wakeup]]). [[tour:5]] walks through this exact loop.

      When `LSR` says idle, `uartwrite` writes the byte and never sleeps, leaving `p->chan`
      set to `&tx_chan`. That stale registration is harmless, for the same reason as after a
      kill: every `sleep()` is preceded by a fresh `sleep_prepare`.
    others: |
      A UART interrupt on hart 1 or 2 may run `wakeup(&tx_chan)` while `wc` still has the
      stale `chan`. `wakeup` takes `wc`'s `p->lock`, sees `RUNNING`, clears `chan`, and
      leaves the state alone: state 2 of step 13. The only cost is the wasted work.

  - title: What it took
    file: user/wc.c
    lines: 8-34
    focus: 33
    state:
      hart: 0
      mode: U
      proc: wc (pid 5)
      intr: on
      satp: user
      locks: []
      stack: [main, wc]
      sp:
        "on": user
        switched: "`ld sp, 48(a0)` in [[kernel:userret]] ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]])"
    note: |
      `wc` has counted `README`: 48 lines, 336 words, 2441 bytes. At least five `read`s of the pipe
      returned data; each could have gone to sleep, been woken from another hart, and
      resumed on a third.

      The key ideas:

      - **Register before you release.** [[sleep_prepare]] records the channel while the
        condition lock is held, so a wakeup can never slip between the check and the
        registration.
      - **Decide under `p->lock`.** [[sleep]] sleeps only if `p->chan` is still set, checked
        under the lock [[wakeup]] also takes. A wakeup in the gap becomes "return at once".
      - **Only `p->lock` across the switch.** [[sched]] panics if any other spinlock is
        held, because a sleeping spinlock holder would freeze every hart that wants it.
      - **Wakeups are hints.** Every sleep sits in a loop that re-tests the condition and
        the `killed` flag.

      Older xv6 got the first two by passing the condition lock into `sleep`. This version
      splits the work, which costs one extra `p->lock` round trip per sleep and buys a
      `sleep` that does not need a lock at all, as `uartwrite` shows. [[tour:39]] follows
      pipes further; [[tour:17]] builds sleep-locks on top of this primitive.
locks:
  - lock: "pi->lock (spinlock)"
    where: "[[piperead]], [[pipewrite]], [[pipeclose]]"
    protects: "The pipe's `data`, `nread`, `nwrite`, `readopen`, `writeopen`: the condition both sides test"
  - lock: "p->lock (spinlock)"
    where: "[[sleep_prepare]], [[sleep]], [[wakeup]], [[killed]], [[kkill]], the schedulers"
    protects: "`p->chan` and `p->state`: whether a process is registered, asleep, runnable or running. Always taken after `pi->lock`, never before"
  - lock: "kmem.lock (spinlock)"
    where: "[[kalloc]], only if [[copyin]] or [[copyout]] meets a lazily reserved page"
    protects: "The free-page list; taken under `pi->lock` in that case"
  - lock: "log.lock (spinlock)"
    where: "[[begin_op]], [[end_op]]"
    protects: "`log.committing`, `log.outstanding`, `log.lh.n`: two conditions sharing channel `&log`"
  - lock: "tx_lock (sleep-lock)"
    where: "[[uartwrite]]"
    protects: "The UART transmitter, one writer at a time"
  - lock: "no lock: the UART's LSR_TX_IDLE bit"
    where: "[[uartwrite]], [[uartintr]]"
    protects: "Nothing can lock a device register; register-before-check ordering prevents the lost wakeup instead"
quiz:
  - q: "In `piperead`, what could go wrong if `sleep_prepare(&pi->nread)` were moved to just after `release(&pi->lock)`?"
    a: "`cat` could take `pi->lock` in between, add data and call `wakeup(&pi->nread)` while `wc` is not yet registered. The wakeup finds nobody, `wc` then registers and sleeps, and it is never woken although the pipe holds data: a lost wakeup."
  - q: "`cat` calls `wakeup(&pi->nread)` while `wc` is between lines 125 and 126 of `pipe.c`, registered but still `RUNNING`. Trace what happens to `wc`."
    a: "[[wakeup]] takes `wc`'s `p->lock`, sees `p->chan == &pi->nread`, clears it to 0, and leaves the state `RUNNING`. When `wc` calls `sleep()`, it sees `p->chan == 0` under `p->lock` and returns immediately; the `while` loop re-takes `pi->lock` and finds the data."
  - q: "Why must `piperead` release `pi->lock` before calling `sleep()`, and what does `sched` do if it doesn't?"
    a: "The writer needs `pi->lock` to add data; a sleeper holding it would leave the writer spinning forever with interrupts off, a deadlock. `sched` checks that exactly one spinlock (`p->lock`) is held (`noff == 1`) and panics with `sched locks` otherwise."
  - q: "`wakeup` sets a process `RUNNABLE` only if it is `SLEEPING`, but it clears `p->chan` in every matching case. Why is clearing the channel alone enough for a process that has not gone to sleep yet?"
    a: "Such a process will call `sleep()`, which decides under `p->lock` whether to sleep by testing `p->chan`. Seeing 0, it knows the event already happened and returns at once, so the wakeup is not lost even though the process was not yet asleep."
  - q: "`uartwrite` sleeps without holding any condition lock. Why is that safe, and what did the older `sleep(chan, lk)` force the driver to do instead?"
    a: "It registers on `&tx_chan` before reading `LSR`, so any interrupt that follows the transmitter becoming idle finds it registered and clears `p->chan`. The old `sleep` needed a lock to hand over, so the older driver kept a software `tx_busy` flag under a `tx_lock` spinlock that the interrupt handler also took; the split design tests the hardware bit directly."
  - q: "Give two reasons why `wc` might return from `sleep()` in `piperead` while the pipe is still empty."
    a: "A second reader of the same pipe may have been woken by the same `wakeup` and taken the data first; or [[kkill]] made `wc` `RUNNABLE` without any data. (Or a writer called `write` with 0 bytes, or a bad address, and line 105's `wakeup` fired with no data.) The `while` loop re-tests the condition and the `killed` flag."
