title: Memory ordering across harts
group: Concurrency primitives
prerequisites: [3, 15]
summary: |
  When you read a C program you assume that its statements happen in the order you wrote
  them. On one hart that assumption is safe: whatever the compiler and the CPU do behind
  the scenes, a hart always sees its *own* loads and stores as if they ran in program order.
  The moment a second hart looks at the same memory, the assumption breaks. The compiler
  may keep a variable in a register, merge or move accesses, and the CPU may let other harts
  see its stores in a different order than it made them.

  This tour follows the places where xv6 has to say "this, *then* that, and every hart must
  agree": the `started` flag that releases harts 1 and 2 at boot, the barriers hidden inside
  every [[acquire]] and [[release]], a process's saved registers handed from one hart to
  another through `p->lock`, the fences around the [[g:virtqueue]] that talks to the disk,
  the difference between `volatile` and atomics, and the `fence.i` executed on every return
  to user space.

  You will see the real instructions the compiler produced (`kernel/kernel.asm` of this
  build), what happens without them (timelines), and exactly what each fence promises and
  what it does not.
cast: |
  The tour has two halves. It starts at boot, when the machine has three
  [[g:hart|harts]] and no processes yet:

  | Hart | What it is doing |
  |---|---|
  | 0 | In [[main]], building the kernel: page allocator, page table, process table, devices |
  | 1 | In [[main]], spinning on the `started` flag, paging off, interrupts off |
  | 2 | The same as hart 1 |

  Later steps jump forward to a running system, where a shell, `cat` and the disk driver
  keep three harts busy. Each step says which hart it is on.
steps:
  - title: Hart 0 builds, harts 1 and 2 wait
    file: kernel/main.c
    lines: 1-45
    focus: 7
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main]
      sp: {"on": boot, switched: "`add sp, sp, a0` in `_entry` ([[kernel/entry.S:17]]), at power-on", detail: "hart 0's 4 KiB slice of stack0, top 0x80008890"}
    note: |
      All three harts arrive in [[main]] at about the same moment, in supervisor mode, with
      paging off and interrupts off ([[tour:2]]). Hart 0 does all the one-time setup on lines
      14–31. Harts 1 and 2 must not touch the kernel's data structures until that setup is
      finished, so they wait for a flag: `started`, declared on line 7.

      This is the simplest cross-hart protocol there is, the **message-passing** pattern:

      1. Hart 0 writes a lot of data (the free-page list, `kernel_pagetable`, the process
         table, device state).
      2. Hart 0 writes a flag: `started = 1`.
      3. Harts 1 and 2 wait until they see the flag, then read the data.

      It looks trivially correct. It is correct only because of the two GCC
      [[g:atomic|atomic built-ins]] on lines 33 and 35. With ordinary C assignments the
      pattern can fail in three different ways: the compiler can break the waiting loop,
      the compiler can move hart 0's flag store, and the CPU can let harts 1 and 2 see the
      flag before the data. The next steps take them one at a time. [[tour:3]] tells the
      story of what hart 0 builds; this tour is about how the other harts are allowed to see
      it.
    others: |
      Harts 1 and 2 are executing lines 35–36 right now, over and over. They hold no locks
      and could not use any: [[kinit]] and [[procinit]] have not run yet, so most of the locks
      they might want have not been initialized yet. The flag is the only synchronization available.
      Each spins on its own boot stack, its own 4 KiB slice of [[stack0]] (hart 1's top is
      `0x80009890`, hart 2's `0x8000a890`), with its own `sp`; the stacks are private, and
      only `started` and the data it guards are shared.

  - title: What the compiler may do to a waiting loop
    file: kernel/main.c
    lines: 31-42
    focus: 35-36
    state:
      hart: 1
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Suppose line 35 were the plain C `while (started == 0) ;` with `started` an ordinary
      `int`. The C standard lets the compiler assume no other thread changes a variable
      unless the program uses atomics, so it may read `started` once and never again. An
      experiment with this toolchain (GCC 15.2.0 for riscv64, `-O`, xv6's flags) shows
      that it does exactly that:

      ```
      lw    a5,0(a5)        # read the flag once
      beqz  a5,.            # branch to itself, forever
      ```

      The second instruction jumps to its own address. If the flag was 0 at the first read,
      the hart spins forever, no matter what hart 0 writes later.

      Declaring the variable [[g:volatile]] fixes *this* problem: in the same experiment the
      loop reloads `lw` on every pass. But `volatile` emits no fence and says nothing about
      the *other* variables, as the next steps show.

      xv6 instead uses `__atomic_load_n(&started, __ATOMIC_ACQUIRE)`. GCC's `__atomic`
      built-ins follow the C11 atomic rules, which require another thread's store to become
      visible to atomic loads within a reasonable time, so the compiler cannot turn the loop
      into a single read. In practice GCC performs the load on every pass, and the acquire
      order adds a barrier (step 6).
    others: |
      This failure needs no second hart to show itself: the loop is broken in the compiled
      code before the program even runs. That is what makes compiler reordering different
      from hardware reordering. One is visible in `kernel.asm`; the other only in timing.

  - title: What the compiler may do to the publishing side
    file: kernel/main.c
    lines: 13-33
    focus: 22-33
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Hart 0's side has a quieter problem. `started` is `static` and its address is never
      passed to any of the functions on lines 19–31. So, as far as the compiler can tell,
      none of them can read it. With a plain `started = 1;` the compiler would be allowed to
      move that store *earlier*, above [[userinit]] or [[kinit]], because to a single thread
      the result is identical. Whether a particular compiler version actually does so is
      beside the point: the rules allow it, so correct code cannot depend on it not
      happening.

      Making `started` volatile, as line 7 does, would stop the compiler from reordering
      *volatile* accesses among themselves. It would not stop it from moving an ordinary
      store past the volatile store: if [[kvminit]] were inlined into `main`, its store to
      `kernel_pagetable` could legally sink below `started = 1`. (In this build `kvminit` is
      in another file, so GCC cannot see into the call, but correct code must not rely on
      that.) And even in program order, a volatile store emits no fence, so the CPU may still
      reorder (step 4).

      The release store on line 33 is stronger: the compiler may not move *any* memory
      access that comes before it in the program to after it. That is a compiler barrier
      and, as the next step shows, a hardware one too.

      Note the state: by line 33 hart 0 has run [[kvminithart]] on line 21, so it is the
      only hart with paging on.

  - title: "What the CPU may do: RVWMO in brief"
    file: kernel/main.c
    lines: 19-33
    focus: 22-33
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Even when the compiler emits the stores in program order, the hardware need not show
      them to other harts in that order. RISC-V's memory model, **RVWMO** (RISC-V Weak
      Memory Ordering, in the unprivileged specification), is deliberately weak:

      - A hart always sees its own loads and stores as if they happened in program order.
      - Other harts may observe two accesses to *different* addresses (store–store,
        store–load, load–load, load–store) in either order, unless something forces the
        order: a [[g:insn:fence|fence]], an `aq`/`rl` bit on an atomic instruction, or
        certain dependencies (for example, a load whose address comes from an earlier
        load).

      A real core gets this freedom from store buffers, caches and loads performed early.
      So hart 0's store to `kernel_pagetable` (made inside [[kvminit]], line 20) and its
      later store to `started` may reach hart 1 in the opposite order.

      How often does that happen? It depends entirely on the machine. Simple cores may never
      do it, aggressive ones do it routinely, and under QEMU it depends on the host CPU and
      on how QEMU runs the emulated harts. A bug of this kind can stay hidden for years and
      then appear on new hardware. The only safe approach is to write code that is correct
      under the model, not under one machine's behavior. (Simplified: RVWMO has more rules,
      for example about two accesses to the same address; this tour needs only the ones
      above.)

  - title: The release store, as compiled
    file: kernel/main.c
    lines: 31-33
    focus: 33
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      `__atomic_store_n(&started, 1, __ATOMIC_RELEASE)` compiles to (`kernel/kernel.asm`):

      ```
      80000f08:  li     a4,1
      80000f0a:  fence  rw,w
      80000f0e:  sw     a4,0(a5)      # a5 = &started (0x8000786c)
      ```

      [[g:insn:fence|fence rw,w]] has a *predecessor set* (`rw`: earlier reads and writes)
      and a *successor set* (`w`: later writes). It guarantees that every load and store
      before the fence is ordered, as seen by every other hart, before every store after
      it. The store after it is the one that sets `started`.

      So by the time any hart can read `started == 1`, all of hart 0's earlier writes are
      visible: the free list built by [[kinit]], `kernel_pagetable`, the `proc[]` array,
      the buffer cache, the inode table, the first process.

      This is half a contract. A release store promises that the data is *published*
      before the flag. It does not, by itself, stop a *reader* from looking at the data
      too early. That is the job of the other half.
    others: |
      The `sw` is a single aligned 32-bit store, so harts 1 and 2 see either 0 or 1, never a
      mixture. That is what "atomic" means for a plain store like this one; the ordering is
      what the `fence` adds.

  - title: The acquire load, as compiled
    file: kernel/main.c
    lines: 31-42
    focus: 35-36
    state:
      hart: 1
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      On harts 1 and 2 the waiting loop compiles to:

      ```
      80000e74:  lw     a5,0(a4)      # a4 = &started
      80000e76:  fence  r,rw
      80000e7a:  sext.w a5,a5
      80000e7c:  beqz   a5,80000e74
      ```

      `fence r,rw` orders the load of `started` before every later load and store of this
      hart. Without it, RVWMO allows hart 1 to perform a later load, say of
      `kernel_pagetable` in [[kvminithart]], *before* the load that sees `started == 1`. A
      branch between them does not help: in RVWMO a control dependency orders a later
      *store*, not a later load, and a core may load speculatively past a branch.

      Release on the writer plus acquire on the reader is the pairing that makes the
      message-passing pattern correct. Formally: if an acquire load reads the value written
      by a release store, everything before the release *happens before* everything after
      the acquire.

      Notice where the fence sits: inside the loop, after every read. Only the last read
      (the one that sees 1) needs it, but the compiler cannot know which one that will be.
      The cost is irrelevant here: the hart has nothing else to do.

  - title: The bug the pair prevents
    file: kernel/main.c
    lines: 31-45
    focus: 35-38
    state:
      hart: 1
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Here is the interleaving that plain stores and loads would permit. The state box shows
      hart 1, which has not turned paging on yet: [[kvminithart]] on line 39 does that.

      | Time | Hart 0 | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | [[kvminit]] stores `kernel_pagetable`; the store sits in hart 0's store buffer | spinning | spinning |
      | t2 | stores `started = 1`; this store becomes visible first | | |
      | t3 | | reads `started == 1`, leaves the loop | still spinning |
      | t4 | | [[kvminithart]] reads `kernel_pagetable`: still 0 | |
      | t5 | | writes `satp` with a root page table at physical address 0 | |
      | t6 | `kernel_pagetable` store finally becomes visible | next instruction fetch is translated through garbage: hart 1 is lost | |

      The same thing can happen with load reordering on hart 1 alone: even if hart 0's stores
      arrive in order, hart 1 may have loaded `kernel_pagetable` early (t2) and checked
      `started` late (t3).

      With the pair, t2 cannot become visible before t1 (the `fence rw,w`), and t4 cannot be
      performed before t3 (the `fence r,rw`). Hart 1 is guaranteed to see the real page
      table.

      The `printk("hart %d starting\n")` on line 38 depends on the same guarantee: it uses
      `pr.lock`, which [[printkinit]] on hart 0 initialized, and the UART that
      [[consoleinit]] set up.
    others: |
      Hart 2 runs the same loop and gets the same guarantee independently. Release and
      acquire pair up between the one writer and *each* reader; harts 1 and 2 need nothing
      from each other.

  - title: Visible to the hart is not yet visible to the page-table walker
    file: kernel/vm.c
    lines: 72-84
    focus: 77-78
    state:
      hart: 1
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main, kvminithart]
      sp: boot
    note: |
      Hart 1 now calls [[kvminithart]]. The acquire made hart 0's page-table stores visible
      to hart 1's ordinary loads. But once paging is on, the page table is also read by the
      hardware **page-table walker**, through *implicit* memory accesses that are not part
      of any instruction's normal loads. The RISC-V privileged specification does not order
      those with ordinary fences.

      That is the job of [[g:insn:sfence.vma|sfence.vma]] on line 78. The specification says
      that executing it guarantees that any previous stores *already visible to this hart*
      are ordered before certain implicit page-table references made by later instructions on
      this hart. So the chain is:

      1. Hart 0's `fence rw,w` + store to `started` publishes the page table.
      2. Hart 1's load + `fence r,rw` makes it visible to hart 1.
      3. Hart 1's `sfence.vma` makes it visible to hart 1's page-table walker.

      Line 80 then writes `satp`, and the `sfence.vma` on line 83 discards any stale
      translations in the [[g:tlb]] before the next fetch. (The source comment on line 77
      says "wait for any previous writes to the page table memory to finish", which is the
      same idea from the writer's point of view: on hart 0, those writes were its own.)
    others: |
      No hart ever writes `kernel_pagetable`'s entries again after boot ([[tour:24]]), so this
      one-time chain is enough. User page tables are different: they change constantly, and
      every switch to one goes through `sfence.vma` pairs in the trampoline.

  - title: volatile and atomic are different tools
    file: kernel/main.c
    lines: 1-13
    focus: 7
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Line 7 declares `started` `volatile` *and* the code accesses it only through atomics.
      The `volatile` is redundant: the atomics already force every access to happen and
      add the ordering. It does no harm, and it documents that another hart changes this
      variable.

      Compare the three tools:

      | | Every access really happens | Atomic (no torn value) | Orders *other* memory accesses |
      |---|---|---|---|
      | plain variable | no | not guaranteed | no |
      | [[g:volatile]] | yes | not guaranteed by C | no (only among volatile accesses, and only in the compiler) |
      | `__atomic_*` with acquire/release | yes | yes | yes: compiler *and* CPU |

      Where does xv6 use `volatile` on its own? For **device registers**: `Reg()` in
      [[kernel/uart.c:17]] and `R()` in [[kernel/virtio_disk.c:20]] cast addresses to
      `volatile` pointers, so that every read of the UART's line-status register really
      reaches the device, and no write is merged or dropped. A device register changes on
      its own, and reading or writing it can have side effects. That is exactly the
      problem `volatile` was designed for. Ordering between harts was never its job.

  - title: A spinlock is a pair of fences
    file: kernel/spinlock.c
    lines: 21-42
    focus: 37-38
    state:
      hart: 1
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: ["child's p->lock (from allocproc)"]
      irq: {noff: 2, intena: 1, note: "the child's `p->lock`, plus the push_off on line 24 of this `acquire`; `kmem.lock` itself is not held until the swap returns 0"}
      stack: [usertrap, syscall, sys_fork, kfork, allocproc, kalloc, acquire]
      sp: kernel
    note: |
      Jump forward to a running system. The shell (pid 2) on hart 1 is forking.
      [[allocproc]] holds the new child's `p->lock` and calls [[kalloc]] for a trapframe
      page. [[kalloc]] calls [[acquire]] on `kmem.lock`, and the spin loop on line 37 runs
      ([[tour:15]] follows this lock in detail):

      ```
      80000c02:  mv            a5,a4          # a4 = 1
      80000c04:  amoswap.w.aq  a5,a5,(s1)    # s1 = &kmem.lock.locked
      80000c08:  sext.w        a5,a5
      80000c0a:  bnez          a5,80000c02
      ```

      [[g:insn:amoswap|amoswap.w.aq]] does two things. It swaps atomically, which gives
      mutual exclusion. And its `aq` (acquire) bit means no later load or store of this
      hart can be observed before the swap. That is exactly the reader half of the
      message-passing pattern from steps 5–7: the "flag" is `locked`, and the "data" is
      whatever the lock protects.

      So every lock in xv6 is the `started` protocol in miniature, run thousands of times a
      second. The previous holder's `release` publishes; this `acquire` reads the
      publication. That is why code inside a critical section needs no fences of its
      own to share data with other harts that take the same lock (a device is another
      matter, step 15).
    others: |
      Hart 2 has just released `kmem.lock` after [[kfree]] pushed a page onto the free list.
      The next step shows what its release did, and what hart 1 would see without it.

  - title: The release half
    file: kernel/spinlock.c
    lines: 44-76
    focus: 51-73
    state:
      hart: 2
      mode: S
      proc: a process shrinking its memory with sbrk
      intr: off
      satp: kernel
      locks: [kmem.lock]
      irq: {noff: 1, intena: 1, note: "`kmem.lock` is still held at the fence; `pop_off` on line 75 takes noff to 0 and, because intena is 1, turns interrupts back on"}
      stack: [usertrap, syscall, sys_sbrk, growproc, uvmdealloc, uvmunmap, kfree, release]
      sp: kernel
    note: |
      On hart 2, [[kfree]] has written `r->next = kmem.freelist` and `kmem.freelist = r`
      inside the lock, and now calls [[release]]:

      ```
      80000c82:  sd     zero,16(s1)   # lk->cpu = 0
      80000c86:  fence  rw,w
      80000c8a:  sw     zero,0(s1)    # lk->locked = 0
      ```

      The `fence rw,w` orders both stores to the free list, and the store to `lk->cpu`,
      before the store that frees the lock. It also orders hart 2's earlier *loads* (the
      `r` in `rw`): a load inside the critical section must not be performed after the
      lock is free, or it could read a value written by the next holder.

      Notice that the compiler did not use `amoswap.w.rl` for the release. GCC's RISC-V
      mapping for a release *store* is a fence followed by a plain `sw`, which has the
      same effect: the `.rl` bit, if it were used, would mean "no earlier access of this
      hart can be observed after this instruction". The mapping is a property of this
      compiler; the guarantee is what the C memory model asks for.

      The state box shows the moment of the fence: `kmem.lock` is still held, so interrupts
      are still off on hart 2. They come back on in [[pop_off]] after the `sw`, and only
      because this release takes `noff` to 0 and `intena` is 1: when `noff` last went from 0
      to 1 (this `kmem.lock` acquire), interrupts were on, because this is a system call
      after [[usertrap]]'s `intr_on` ([[concept:locks#noff]],
      [[concept:locks#intena]]).

  - title: The free list without the fences
    file: kernel/kalloc.c
    lines: 65-82
    focus: 74-77
    state:
      hart: 1
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: ["child's p->lock (from allocproc)", kmem.lock]
      irq: {noff: 2, intena: 1, note: "the child's `p->lock` and `kmem.lock`: a `p->lock` → `kmem.lock` nesting"}
      stack: [usertrap, syscall, sys_fork, kfork, allocproc, kalloc]
      sp: kernel
    note: |
      Hart 1's swap finally returns 0: it holds `kmem.lock`. It reads `kmem.freelist` and
      `r->next`. Suppose hart 2 has just freed page P, so the list was Q → … and is now
      P → Q → …. Without the release and acquire barriers:

      | Time | Hart 0 | Hart 1 (sh, kalloc) | Hart 2 (kfree of P) |
      |---|---|---|---|
      | t1 | | spinning | writes `P->next = Q`, `freelist = P` (in its store buffer) |
      | t2 | | | `locked = 0` becomes visible first |
      | t3 | | swap gets 0: lock "held" | |
      | t4 | | reads `freelist`: still Q (stale) | |
      | t5 | | sets `freelist = Q->next`, returns Q | |
      | t6 | | | `freelist = P` finally lands, overwriting hart 1's update |

      After t6 the list starts at P, whose `next` is Q: page Q is on the free list *and* in
      use as the child's trapframe. The next `kalloc` hands Q out a second time, and two
      unrelated owners scribble on the same page. Nothing fails at the moment of the bug.

      With the real code, the `fence rw,w` keeps t2 after t1, and the `aq` on hart 1's
      swap keeps t4 after t3. Mutual exclusion alone (the atomic swap) is not enough; a
      lock also has to carry the data's *visibility* with it.
    others: |
      Hart 0 might be spinning in [[acquire]] for `kmem.lock` too, running `amoswap.w.aq`
      over and over. Each failed swap writes 1 over 1, which changes nothing, so the spinners
      do not disturb the holder's data. (On real hardware every swap still claims the cache
      line, which is why spinning is costly; xv6 accepts that cost.)

  - title: A thread's registers handed across harts
    file: kernel/swtch.S
    lines: 1-40
    focus: 10-23
    state:
      hart: 1
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: ["sh's p->lock"]
      irq: {noff: 1, intena: 0, note: "intena 0: `yield` was called from a timer interrupt, so SIE was already off at its acquire. `sched` keeps that 0 for `sh` across `swtch`"}
      stack: [usertrap, yield, sched, swtch]
      sp: kernel
    note: |
      Locks carry more than data structures. Later, the timer interrupts the shell on hart 1
      while it is in user mode. [[usertrap]] calls [[yield]], which takes `sh`'s `p->lock`,
      marks it `RUNNABLE` and calls [[sched]], which calls [[swtch]] ([[tour:13]]).

      Lines 10–23 are fourteen ordinary `sd` instructions that save `ra`, `sp` and
      `s0`–`s11` into `p->context`, in memory. All of them run with `sp` still in `sh`'s
      kernel stack, and line 11 saves exactly that pointer. The stack itself does not move:
      its frames (`usertrap → yield → sched`) stay in `sh`'s page at `KSTACK(1)`, and only
      the 8-byte pointer to them travels to the next hart, through `p->context`. Line 26
      ([[kernel/swtch.S:26]]) is where hart 1 leaves that stack for its scheduler stack
      ([[concept:stacks]]). Then `swtch` loads hart 1's scheduler
      context and returns into [[scheduler]] on hart 1, which releases `sh`'s `p->lock`
      ([[kernel/proc.c:463]]).

      Those fourteen stores are the "data" of a message-passing protocol, and `p->lock` is
      its flag. Any hart's scheduler might pick `sh` up next. If that hart could see
      `RUNNABLE` but read stale values from `p->context`, it would resume `sh` with a stack
      pointer and return address from an earlier switch: a crash, or worse, silent
      corruption of another stack.

      The release in [[release]] (its `fence rw,w`) orders the fourteen `sd`s before
      `locked = 0`.

      The interrupt state travels the same way. [[sched]] keeps this thread's `intena` in a
      local, which this build holds in `s3`, one of the registers saved here. It is 0:
      `yield` ran from a timer interrupt, with interrupts already off. When `sh` resumes on
      hart 0, `sched` writes that 0 into hart 0's `struct cpu`, so the `release` at the end
      of `yield` leaves interrupts off, as `usertrap` expects ([[concept:locks#sched-intena]]).
    others: |
      Hart 0's scheduler is scanning `proc[]` right now. When it reaches `sh`, its
      [[acquire]] spins until hart 1's scheduler releases `p->lock`. The next step is that
      acquire.

  - title: Another hart picks the thread up
    file: kernel/proc.c
    lines: 443-464
    focus: 447-453
