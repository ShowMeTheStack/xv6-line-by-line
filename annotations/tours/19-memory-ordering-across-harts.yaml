      stack: [scheduler]
      sp: {"on": scheduler, detail: "hart 0's slice of stack0, top 0x80008890"}
    note: |
      Hart 0's [[scheduler]] acquired `sh`'s `p->lock` on line 446, with `amoswap.w.aq`.
      Because hart 1 released it with `fence rw,w; sw`, and hart 0's swap read that
      release's 0, everything hart 1 wrote before the release is now visible to hart 0:
      the new `p->state`, and the fourteen saved registers in `p->context`.

      Line 447 sees `RUNNABLE`. Line 453 calls `swtch(&c->context, &p->context)`, whose
      fourteen `ld`s read the registers hart 1 saved. One of them is `sp`
      ([[kernel/swtch.S:26]]): if it were stale, hart 0 would land on the wrong spot of
      `sh`'s kernel stack, or on another stack altogether. The shell continues on hart 0, inside
      [[yield]], exactly where it stopped on hart 1.

      | Time | Hart 0 (scheduler) | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | | `swtch` saves `sh`'s registers to `p->context` | |
      | t2 | spins on `sh`'s `p->lock` | scheduler: `release` (`fence rw,w`, `sw 0`) | |
      | t3 | `amoswap.w.aq` returns 0 | looks for other work | |
      | t4 | reads `p->state`, `swtch` loads `p->context` | | |

      This is why [[tour:13]] calls it a lock *handed across* a context switch: the lock is
      both the mutual exclusion that stops two schedulers from running `sh` at once and the
      memory barrier that makes `sh`'s registers travel safely between harts.
    others: |
      Hart 2's scheduler may reach `sh`'s slot a moment later. It spins on the same
      `p->lock`, and when it gets it, it sees `RUNNING` (set by hart 0 on line 451 under the
      lock) and moves on. Same lock, same barriers, and so the same view of the state.

  - title: Talking to a device through memory
    file: kernel/virtio_disk.c
    lines: 270-298
    focus: 274-284
    state:
      hart: 1
      mode: S
      proc: cat (pid 4)
      intr: off
      satp: kernel
      locks: ["README's inode lock (sleep-lock)", "buffer for block 48 (sleep-lock)", disk.vdisk_lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, readi, bread, virtio_disk_rw]
      sp: kernel
    note: |
      Now `cat README` (pid 4) reads block 48, the first data block of `README` in this
      build's `fs.img`. Suppose it is not in the buffer cache. [[virtio_disk_rw]] has filled three
      descriptors with ordinary stores ([[tour:29]]). Now it must tell the disk, which
      is a third party with its own view of memory: it reads the rings by [[g:dma]].

      Three things must reach the device in order:

      1. the ring entry naming the descriptor chain (line 275),
      2. the new `avail->idx`, which says "one more entry is ready" (line 280),
      3. the write to the `QUEUE_NOTIFY` register (line 284), which tells the device to look.

      If the device saw step 2 before step 1, it would read a stale ring slot and process
      the wrong descriptors. If it got the notify before the index, it might find nothing
      new and go back to idle, and the request would never complete. So
      `io_fence()` sits between each pair:

      ```
      80005a62:  sh    a0,4(a3)       # avail->ring[...] = idx[0]
      80005a66:  fence                # io_fence()
      ...
      80005a72:  sh    a5,2(a4)       # avail->idx += 1
      80005a76:  fence                # io_fence()
      80005a7e:  sw    zero,80(a5)    # *R(QUEUE_NOTIFY) = 0  (0x10001050)
      ```
    others: |
      `disk.vdisk_lock` is a spinlock, so its release and acquire already order these
      stores for any other *hart* that takes the lock. The device does not take locks.
      That is why device communication needs explicit fences even inside a critical
      section.

  - title: io_fence is fence iorw, iorw
    file: kernel/riscv.h
    lines: 369-382
    focus: 370-375
    state:
      hart: 1
      mode: S
      proc: cat (pid 4)
      intr: off
      satp: kernel
      locks: ["README's inode lock (sleep-lock)", "buffer for block 48 (sleep-lock)", disk.vdisk_lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, readi, bread, virtio_disk_rw, io_fence]
      sp: kernel
    note: |
      [[io_fence]] is one instruction, `fence iorw, iorw`. The disassembler prints it as a
      bare `fence` (encoding `0x0ff0000f`), because "all four kinds before, all four kinds
      after" is the default.

      RISC-V fences name four kinds of access: `r` and `w` for memory, `i` and `o` for
      device input and output. The ring and `avail->idx` live in ordinary RAM (`w`); the
      notify register is memory-mapped I/O (`o`). The first fence orders a memory store
      before another memory store; the second orders a memory store before a device
      write. `fence rw,w`, the spinlock's fence, would not cover the second case at all.

      The other half of the definition matters too: `asm volatile(... ::: "memory")`. The
      `"memory"` clobber tells the compiler that the instruction may read or write any
      memory. So the compiler must finish all stores before it and reload any value after
      it. Every fence xv6 writes as inline asm (`sfence_vma`, `io_fence`, `icache_fence`)
      carries this clobber, so each is also a full compiler barrier; the `__atomic` release
      and acquire operations are one-way compiler barriers by their own definition.

      Older xv6 releases wrote `__sync_synchronize()` here. With this compiler that is
      `fence rw,rw`: a full barrier for ordinary memory, but it says nothing about device
      I/O, so it does not order the ring stores before the `QUEUE_NOTIFY` write. Commit
      `429989d` ("emit the right kind of fence for MMIO") replaced it with `io_fence()`,
      which names `iorw` explicitly.
    others: |
      The same [[kernel/riscv.h]] also defines `icache_fence()` (`fence.i`, line 379),
      which nothing in this commit calls; the trampoline writes `fence.i` directly (step
      19).

  - title: The completion side reads in order
    file: kernel/virtio_disk.c
    lines: 300-333
    focus: 311-320
    state:
      hart: 2
      mode: S
      proc: none (hart 2's scheduler)
      intr: off
      satp: kernel
      locks: [disk.vdisk_lock]
      irq: {noff: 1, intena: 0, note: "an interrupt handler: SIE was off at the first push_off, so intena is 0"}
      stack: [main, scheduler, kernelvec, kerneltrap, devintr, virtio_disk_intr]
      sp: {"on": scheduler, detail: "hart 2's slice of stack0, with a kernelvec frame on top"}
    note: |
      The disk finishes. The device writes the result status, then an entry in the *used*
      ring, then increments `used->idx`, and raises an interrupt. Hart 2 claims it from the
      [[g:plic]] and arrives in [[virtio_disk_intr]] holding `disk.vdisk_lock`. Hart 2 was
      idle, so [[kernelvec]] pushed its register frame onto hart 2's scheduler stack; had it
      been running a system call, the same frame would have gone onto that process's kernel
      stack. xv6 has no separate interrupt stack.

      This is message passing again, with the device as writer: `used->idx` is the flag,
      the ring entry and status byte are the data. The driver must read them in the right
      order:

      ```
      80005b4a:  lhu   a5,2(a5)       # used->idx
      80005b4e:  beq   a4,a5,...      # nothing new? leave
      80005b52:  fence                # io_fence() (line 319)
      80005b56:  ...                  # then read used->ring[...].id
      ```

      The fence on line 319 keeps the load of the ring entry after the load of the index;
      the same fence also keeps the read of the status byte (line 322), which the device
      wrote by DMA, after the index. Without it, RVWMO would allow the ring entry to be read
      *first*, before the device had written it, and paired with a fresh index: the driver
      could take a stale descriptor id. It might wake the wrong buffer, or dereference a
      cleared `info[id].b` and crash.

      The fence on line 313 orders the device-register accesses on line 311 (reading
      `INTERRUPT_STATUS`, writing the acknowledgement) before every later memory access,
      starting with the load of `used->idx` on line 318. If that load could be performed
      before the acknowledgement, a completion that the device posted in between would be
      missed now and never signalled again, and its process would sleep forever.

      `disk.used` is not a `volatile` pointer. What forces the compiler to read `used->idx`
      from memory each time round the loop? The `"memory"` clobber of `io_fence()` and the
      call to [[wakeup]], both of which tell the compiler memory may have changed. The
      compiled loop reloads it at `0x80005b96` on every later pass.
    others: |
      Hart 1's `cat` is asleep in [[virtio_disk_rw]] waiting for `b->disk` to become 0.
      Hart 2 writes `b->disk = 0` and calls [[wakeup]] under `disk.vdisk_lock`; `cat` will
      read `b->disk` after reacquiring that same lock. The lock's acquire and release order
      that hart-to-hart handoff, no extra fence needed.

  - title: When volatile alone is enough
    file: kernel/printk.c
    lines: 137-146
    focus: 140-143
    state:
      hart: 0
      mode: S
      proc: any
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [panic]
      sp: {"on": kernel, detail: "assuming the panic came from a system call; panic runs on whatever stack is current"}
    note: |
      [[panic]] sets two flags, both plain [[g:volatile]] `int`s with no atomics
      ([[kernel/printk.c:18]]): `panicking` (stop taking `pr.lock`, so a panic can print
      even if the lock is stuck) and `panicked` (freeze every other hart's console output).
      Other harts read `panicked` in [[uartputc_sync]] ([[kernel/uart.c:108]]) and spin
      forever once they see it.

      Why is `volatile` enough here when it was not enough for `started`? Because no other
      data travels with these flags. A hart that sees `panicked == 1` does not go on to read
      something that `panic` prepared; it stops. If it sees the flag a few instructions
      late, it prints one more character. `volatile` guarantees the only thing that
      matters: the readers really re-read the flag, and the writer really writes it.

      (Simplified: the state shown assumes the panic was raised with interrupts off and no
      locks held; `panic` itself changes neither, and it is sometimes called while holding
      a lock.)

      The rule of thumb: if seeing a flag means "now go read other memory", use acquire
      and release (or a lock). If it means only "stop", `volatile` does the job.
    others: |
      Another hart could be in the middle of a `printk` holding `pr.lock` when this hart
      panics. `panic` does not wait for it: with `panicking` set, its own `printk` calls
      skip the lock, and the two harts' output may interleave. That is a deliberate trade:
      better garbled output than a panic that cannot print at all.

  - title: fence.i on every return to user space
    file: kernel/trampoline.S
    lines: 100-112
    focus: 105-107
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [userret]
      sp: {"on": kernel, detail: "sh's kernel stack, empty again: sp = 0x3fffffc000, its top"}
    note: |
      Instructions are memory too. The shell, now running on hart 0, is about to return to
      user mode through [[userret]] (`0x8000609c` in this build), and the first
      instruction is [[g:insn:fence.i|fence.i]].

      A hart may fetch instructions through a path (an instruction cache) that does not
      watch data stores. The bytes of a user program are written into memory with ordinary
      data stores, by [[kexec]] when it loads a program, and a physical page that used to
      hold data may later hold code. `fence.i` makes this hart's later instruction fetches
      see every store that is *already visible to this hart*.

      That last phrase is the limit. `fence.i` is local. The RISC-V specification says that
      to make stores visible to another hart's instruction fetches, the writing hart needs
      a data fence and the fetching hart needs its own `fence.i`. In xv6 the data side is
      provided by the locks of the previous steps (the scheduler's `p->lock` handoff, for
      one, whose `fence rw,w` and `amoswap.w.aq` order everything the process's earlier
      harts wrote). The fetching side is this instruction.

      xv6 does not track whether this process's code changed or whether it ran on this hart
      before. It executes `fence.i` on every return to user space, from every hart.
    others: |
      Harts 1 and 2 execute the same `fence.i` whenever they return to user mode. It affects
      only the hart that executes it, so there is nothing to coordinate and no lock.

  - title: What it all cost, and what to remember
    file: kernel/main.c
    lines: 31-45
    focus: 35-36
    state:
      hart: 1
      mode: S
      proc: none (boot)
      intr: off
      satp: bare
      locks: []
      irq: 0
      stack: [main]
      sp: boot
    note: |
      Count the explicit ordering in this tour: one `fence rw,w` and one `fence r,rw` at
      boot, one `amoswap.w.aq` and one `fence rw,w` per lock acquire/release, four `fence`
      instructions in the disk driver's two hottest functions, one `sfence.vma` pair per
      `satp` write, and one `fence.i` per return to user space. That is all. Most of the
      kernel never mentions memory ordering because it does all its sharing under locks.

      The ideas to keep:

      - **Program order is a single-hart illusion.** Compiler and CPU both reorder; other
        harts and devices can see the difference.
      - **Publishing needs two halves.** The writer releases (data before flag); the reader
        acquires (flag before data). Either half alone is a bug.
      - **Every lock is a release/acquire pair.** That is why critical sections need no
        fences for data shared only with other harts, and why a lock can carry a thread's registers between harts.
      - **Devices and the page-table walker don't take locks.** They need explicit
        `fence` and `sfence.vma`.
      - **`volatile` means "really access it", not "in order".** Right for device registers
        and stop flags, wrong for publishing data.

      The cheapest way to be correct is the one xv6 takes almost everywhere: put shared data
      under a lock and let [[acquire]] and [[release]] do the ordering.
locks:
  - lock: "started (no lock: release/acquire atomics)"
    where: "[[main]]"
    protects: "Publishes everything hart 0 built at boot to harts 1 and 2; no lock exists yet, and one writer with a one-way flag needs none"
  - lock: kmem.lock
    where: "[[kalloc]], [[kfree]]"
    protects: "The free-page list; its acquire/release also carry the list's latest contents between harts"
  - lock: "p->lock (spinlock)"
    where: "[[yield]], [[scheduler]] (checked in [[sched]])"
    protects: "`p->state` and, across a context switch, the visibility of the registers saved in `p->context`"
  - lock: disk.vdisk_lock
    where: "[[virtio_disk_rw]], [[virtio_disk_intr]]"
    protects: "The driver's descriptors and rings against other harts; the device itself is ordered with `io_fence()`, not the lock"
  - lock: "panicking, panicked (no lock: volatile)"
    where: "[[panic]], [[printk]], [[uartputc_sync]]"
    protects: "Stop signals that carry no other data, so `volatile` is enough"
  - lock: "instruction memory (no lock: fence.i)"
    where: "[[userret]]"
    protects: "This hart's instruction fetches see stores already visible to it; cross-hart visibility comes from the locks above"
quiz:
  - q: "If line 35 of `main.c` used a plain `int started` and `while (started == 0) ;`, what does this compiler actually produce, and what happens on harts 1 and 2?"
    a: "It loads `started` once and then branches to the same instruction forever (`beqz a5,.`). If the flag was 0 at that first read, which it almost certainly is, harts 1 and 2 never leave `main`'s loop."
  - q: "Hart 0's release store emits `fence rw,w`. Why is that not enough on its own, so that harts 1 and 2 also need `fence r,rw`?"
    a: "The release only guarantees that hart 0's data is visible before the flag. RVWMO still lets the reader perform a later load (of `kernel_pagetable`, say) before the load that sees `started == 1`, even across a branch. The acquire's `fence r,rw` forbids that on the reader's side."
  - q: "Hart 1 has seen `started == 1` with an acquire load. Why does `kvminithart` still execute `sfence.vma` before writing `satp`?"
    a: "The acquire orders hart 1's ordinary loads, but the page-table walker's implicit reads are not ordinary loads. `sfence.vma` orders stores already visible to this hart before those implicit page-table references, so the walker sees the page table hart 0 built."
  - q: "`virtio_disk_rw` runs while holding `disk.vdisk_lock`, a spinlock with acquire/release barriers. Why does it still need `io_fence()` before writing `QUEUE_NOTIFY`?"
    a: "The lock's barriers only order memory for other harts that also take the lock. The disk device never takes it; it reads the rings by DMA after the notify. `fence iorw,iorw` orders the ring and index stores (memory) before the notify (device output), which no lock does."
  - q: "`panicked` is only `volatile`, but `started` uses atomics. Why is the weaker tool enough for `panicked`?"
    a: "A hart that sees `panicked` only stops; it reads nothing that `panic` prepared, so it does not matter in what order other memory becomes visible. `started` publishes data (the page table, free list, process table) that the reader goes on to use, so it needs release/acquire ordering."
  - q: "A process saves its registers in `swtch` on hart 1, and hart 0's scheduler resumes it. Which instructions guarantee that hart 0 loads the registers hart 1 saved, rather than older values?"
    a: "Hart 1's scheduler releases the process's `p->lock` with `fence rw,w; sw`, ordering the `sd`s in `swtch` before the unlock. Hart 0's `acquire` swaps with `amoswap.w.aq`, so its later loads in `swtch` happen after it sees the unlock. See [[tour:13]]."
