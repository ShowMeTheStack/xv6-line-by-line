      the three descriptors (each [[free_desc]] calls `wakeup(&disk.free[0])`, in case a
      request is waiting for descriptors), and line 297 releases `vdisk_lock`.
    others: |
      Hart 2, where the interrupt was handled, is idle again. Three harts took part in this
      one disk read: hart 0 issued it and is finishing it, hart 2 served its interrupt, and
      hart 1 took a trap for it and found nothing to do (or, in step 19's variation, served
      the keystroke instead).

  - title: The data reaches cat, and what it cost
    file: kernel/fs.c
    lines: 510-534
    focus: 525-526
    state:
      hart: 0
      mode: S
      proc: cat (pid 3)
      intr: on
      satp: kernel
      locks: ["README's ip->lock (sleep-lock)", "block 48's b->lock (sleep-lock)"]
      stack: [usertrap, syscall, sys_read, fileread, readi]
      sp: kernel
      irq: 0
    note: |
      [[bread]] marks the buffer `valid` and returns it. [[readi]] copies the first 512
      bytes of block 48 into `cat`'s `buf` with [[either_copyout]] and releases the buffer
      with [[brelse]]. [[fileread]] unlocks the inode and returns 512, and `cat` heads back
      to user mode as in [[tour:5]]. The next `read` of `README` finds block 48 in the
      cache and never touches the disk.

      What one disk interrupt took:

      - one doorbell write and one DMA transfer, during which no CPU touched the data;
      - one PLIC signal to three harts; in this run two harts trapped and claimed, and one
        claim returned 0 (often only one hart traps at all);
      - two acknowledgements: the device's (`INTERRUPT_ACK`) and the PLIC's
        (`plic_complete`);
      - one spinlock, `vdisk_lock`, shared between a process and an interrupt handler, and
        held with interrupts off on both sides;
      - one sleep and one wakeup, ordered so the wakeup cannot be lost.

      The ideas generalize to every driver: the device tells the PLIC, the PLIC tells the
      harts, the hardware arbitrates the claim, the handler changes ownership and wakes a
      channel, and the sleeping thread re-checks its condition under the lock.
locks:
  - lock: "README's ip->lock (sleep-lock)"
    where: "[[ilock]] in [[fileread]]"
    protects: "The inode's contents and the file's read position while `cat` reads; held across the sleep"
  - lock: "bcache.lock (spinlock)"
    where: "[[bget]]"
    protects: "The buffer cache's list and reference counts; released before the disk is involved"
  - lock: "b->lock (sleep-lock)"
    where: "[[bget]], released by [[brelse]]"
    protects: "Block 48's buffer: no one else reads or reuses it while the disk fills it; held across the sleep"
  - lock: "disk.vdisk_lock (spinlock)"
    where: "[[virtio_disk_rw]] (process context) and [[virtio_disk_intr]] (interrupt context)"
    protects: "Descriptors, `free[]`, `info[]`, the rings, `used_idx`, and `b->disk`; interrupts must be off while it is held"
  - lock: "p->lock (spinlock)"
    where: "[[sleep_prepare]], [[sleep]], [[wakeup]], the schedulers"
    protects: "`p->chan` and `p->state`; when both are held, `vdisk_lock` is taken first (never acquire `vdisk_lock` while holding a `p->lock`)"
  - lock: "cons.lock (spinlock)"
    where: "[[consoleintr]], on hart 1"
    protects: "The console's input line buffer; unrelated to the disk, so the two handlers run in parallel"
