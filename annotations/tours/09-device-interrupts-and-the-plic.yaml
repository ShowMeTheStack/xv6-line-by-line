quiz:
  - q: "Why must `virtio_disk_rw` hold `vdisk_lock` with interrupts off, even though the disk interrupt might well be handled by a *different* hart?"
    a: "Because it might also arrive on the *same* hart. If hart 0 held `vdisk_lock` with interrupts on and took the disk interrupt, `virtio_disk_intr` would try to acquire a lock its own hart holds, and the holder could never run again to release it. `acquire` turns interrupts off precisely to rule this out."
  - q: "In `virtio_disk_rw`, what goes wrong if `sleep_prepare(b)` is moved to after `release(&disk.vdisk_lock)`?"
    a: "The interrupt handler on another hart could take the lock in the gap, set `b->disk = 0` and call `wakeup(b)` while nobody is registered on `b`. `cat` would then register and sleep, and no second wakeup would ever come: a lost wakeup."
  - q: "The disk completes once, but up to three harts may trap. Why does only one of them call `virtio_disk_intr`, and why is no kernel lock needed for that?"
    a: "Reading a claim register atomically returns and clears the highest pending source, so only the first claimer gets 1; later claims return 0 and `devintr` does nothing. The PLIC arbitrates in hardware, and each hart reads its own claim register."
  - q: "`virtio_disk_intr` writes `INTERRUPT_ACK` to the device, and `devintr` later calls `plic_complete`. What would happen if xv6 called `plic_complete` without acknowledging the device first?"
    a: "The virtio device would keep its interrupt line raised, so as soon as the PLIC was re-armed it would see source 1 pending again and interrupt a hart for work that was already done. The device-side ack lowers the line; the PLIC completion re-opens the gateway."
  - q: "When `cat` wakes up, why does it loop and re-check `b->disk` under `vdisk_lock` instead of assuming the read is done?"
    a: "`sleep` can return while the condition is false: kill makes a sleeping process RUNNABLE without a wakeup on `b`, and `b->disk` may still be 1. Re-checking under `vdisk_lock` sends it back to sleep in that case, and lets it proceed when the disk really is done."
  - q: "A UART interrupt and a disk interrupt are pending at the same moment, both priority 1. Which does the first claim return, and can the two handlers run at the same time?"
    a: "The PLIC breaks priority ties by the lower source number, so the first claim returns 1 (the disk) and the next returns 10. Yes, they can run in parallel on two harts: they use different devices, different claim registers and different locks (`vdisk_lock` and `cons.lock`); they can only briefly contend for a `p->lock` inside `wakeup`."
