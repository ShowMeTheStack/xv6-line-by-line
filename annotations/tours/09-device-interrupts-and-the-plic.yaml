      return while `b->disk` is still 1: [[kkill]] sets `killed` and makes a `SLEEPING`
      process `RUNNABLE` without any wakeup on `b`; the loop simply registers and sleeps
      again (the disk still owns the buffer, so `cat` must not abandon it). `sleep` also
      returns at once when the wakeup came between `sleep_prepare` and `sleep`; in that case
      the re-check finds 0.

