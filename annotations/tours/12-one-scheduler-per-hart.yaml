quiz:
  - q: "Why does the scheduler take `p->lock` even for slots whose state is `UNUSED`?"
    a: "Because the rule is that `state` is read and written only under `p->lock`: checking `RUNNABLE` and claiming it with `RUNNING` must happen in one critical section, and the lock's barriers ensure a hart that sees `RUNNABLE` also sees the finished process. For an `UNUSED` slot an unlocked peek would be harmless in practice, but xv6 keeps one simple rule rather than special cases."
  - q: "Hart 1 and hart 2 both reach `proc[4]` while it is `RUNNABLE`. Trace what each one does, and explain why exactly one of them runs pid 5."
    a: "Both call `acquire`; their `amoswap`s are serialized and only the first gets 0. That hart sets `RUNNING` and switches to pid 5 while still holding the lock. The other spins until pid 5's own kernel thread releases the lock (here in `forkret`), then reads `RUNNING` and moves on."
  - q: "What would go wrong if the scheduler left interrupts enabled during its scan, as an older version did?"
    a: "An interrupt could be handled after a scan that found nothing but before `wfi`. If its handler made a process `RUNNABLE`, the hart would then stall in `wfi` until the next interrupt (up to a tick) with a runnable process waiting."
  - q: "`kfork` on hart 0 makes pid 5 `RUNNABLE` while harts 1 and 2 are stalled in `wfi`. How long can it take before pid 5 runs, and why?"
    a: "Up to about one tick (0.1 s). xv6 sends no inter-processor interrupt, so the idle harts discover new work only when their own next interrupt (usually the timer) wakes them and they rescan."
  - q: "Why is it safe for `scheduler` to compute `c = mycpu()` once, when the comment above `cpuid` warns that a process can be moved to a different CPU?"
    a: "The scheduler thread is only ever switched to and from on its own hart, through `c->context`, so it never migrates. A process's kernel thread can resume on any hart, so its code must call `mycpu()` again after a switch."
  - q: "Could two schedulers deadlock each other? Why not?"
    a: "No. Each holds at most one `p->lock` at a time and releases it before taking the next, so no hart ever waits for a lock while holding another, and no cycle of waiting can form."
