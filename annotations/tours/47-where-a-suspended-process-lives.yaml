    note: |
      [[kexec]] runs on the process's kernel stack (the 1920-byte dump above came from inside
      it) and builds a **new page table** with a new user stack, while the old ones stay
      intact for a possible failure ([[tour:22]]). At the commit point:

      | Place | What `exec` does |
      |---|---|
      | user memory and user stack | replaced: new page table installed, old one freed at line 138 |
      | trapframe | same page; `epc` = the ELF entry, `sp` = the new stack; `a1` = `argv` (line 124); the other 28 registers left as they were |
      | kernel stack | the same page, still holding `kexec`'s own frames |
      | `p->context` | untouched |

      The return value, `argc`, reaches `a0` through [[syscall]] like any result. The new
      program starts with whatever `s` and `t` registers the old one had, a reason `exec`'d
      programs must not assume registers start at zero.

  - title: "exit: a zombie keeps its stack and its context"
    file: kernel/proc.c
    lines: 347-365
    focus: 362-363
    state:
      hart: 1
      mode: S
      proc: usertests child (pid 5)
      intr: off
      satp: kernel
      locks: ["pid 5's p->lock"]
      irq: {noff: 1, intena: 0, note: "`kexit` took `wait_lock` (noff 1, intena 0: it came from a timer trap), then its own `p->lock` (noff 2), and released `wait_lock` at line 360, leaving the 1 that `sched` demands"}
      stack: [usertrap, kexit]
      sp: {"on": kernel, detail: "KSTACK(4), 128 bytes used"}
    note: |
      Pid 5 was killed. At its next timer trap, [[usertrap]] saw `killed` and called
      [[kexit]] directly, on pid 5's kernel stack. `kexit` marked it `ZOMBIE` and called
      [[sched]], which never returns. gdb, afterwards:

      ```text
      proc[4] pid 5 ZOMBIE   context: ra=0x80001e9c sp=0x3fffff5f80 s4=0xffffffffffffffff
      frames: usertrap → kexit → sched       (128 bytes)
      ```

      `s4 = -1` is `kexit`'s `status` argument, kept in a callee-saved register and saved by
      `swtch` into a context that nobody will ever load. (Pid 4, which exited normally, left
      `usertrap → syscall → sys_exit → kexit → sched`, 192 bytes.)

      `kexit` holds two spinlocks for a moment, `wait_lock` and its own `p->lock`, and
      releases `wait_lock` (line 360) before calling `sched`, which would panic with
      "sched locks" at `noff` 2 ([[concept:locks#unusual]]).

      The zombie cannot free its own kernel stack: it is standing on it until `swtch`
      finishes, and it still holds `p->lock`. Its hart's scheduler releases that lock only
      after `sp` has left this page. Its trapframe and user memory remain too, until the
      parent collects it.

  - title: "wait: the parent frees two places of three"
    file: kernel/proc.c
    lines: 152-171
    focus: 158-170
    state:
      hart: any
      mode: S
      proc: usertests (pid 4)
      intr: off
      satp: kernel
      locks: [wait_lock, "pid 5's p->lock"]
      irq: {noff: 2, intena: 1, note: "`wait_lock` and the child's `p->lock`, taken inside `wait` with SIE on; `kfree` on line 159 adds `kmem.lock` for a moment: noff 3, the deepest nesting measured ([[concept:locks#nesting]])"}
      stack: [usertrap, syscall, sys_wait, kwait, freeproc]
      sp: {"on": kernel, detail: "the parent's KSTACK(3)"}
    note: |
      The parent's [[kwait]] finds the zombie under `wait_lock` and the child's `p->lock`, and
      calls [[freeproc]]:

      | Place | Fate |
      |---|---|
      | trapframe page | `kfree` (line 159) |
      | user page table, user memory, user stack | [[proc_freepagetable]] (line 162) |
      | kernel stack | **not freed**: it belongs to slot 4, mapped since boot |
      | `p->context` | **not cleared**: still says `sp = 0x3fffff5f80`, until the next [[allocproc]] overwrites it |

      Then `state = UNUSED`, and slot 4, with its kernel stack, is free for the next
      process. When the next `fork` lands in `proc[4]`, its forged context will start at the
      top of the same page, and the zombie's old frames will be overwritten as the new
      process's call chains grow down over them.

      This is why a design where each process owned a freshly allocated kernel stack would
      need extra care: something other than the dying process would have to free it, after
      the last `swtch` off it. xv6 avoids the question by tying stacks to slots.
    others: |
      Who could race the parent here? The zombie's own hart has finished with it (it released
      `p->lock` only after `swtch`). Other schedulers skip `ZOMBIE` and `UNUSED`. Another
      [[kwait]] in a sibling cannot see this child, because `p->parent` is read under
      `wait_lock`. And [[allocproc]] on another hart cannot claim slot 4 until it sees
      `UNUSED` under the same `p->lock` that `kwait` holds now.

  - title: The ledger of a suspended process
    file: kernel/proc.h
    lines: 81-104
    focus: 85-103
    state:
      hart: 2
      mode: S
      proc: "none (hart 2's scheduler)"
      intr: off
      satp: kernel
      locks: []
      irq: 0
      stack: [main, scheduler]
      sp: {"on": scheduler}
    note: |
      Everything that makes a process resumable, with its size in our dumps and its owner:

      | Place | Holds | Size here | Allocated | Freed |
      |---|---|---|---|---|
      | trapframe | user `x1`–`x31`, `pc`, 4 kernel fields | 288 bytes in a 4 KiB page | [[allocproc]] | [[freeproc]] |
      | kernel stack | the kernel's call chain, spills, at most one `kernelvec` frame per trap | 112 / 336 / 1920 bytes of 4 KiB | at boot, per slot | never |
      | `p->context` | `ra`, `sp`, `s0`–`s11` of the kernel thread | 112 bytes | forged by [[allocproc]], saved by [[swtch]] | never cleared |
      | page table | user memory, user stack | a few pages | `fork`, `exec` | [[freeproc]], `exec` |

      And what is **not** in any of them, because it belongs to a hart: `tp`, the scheduler
      stack, `struct cpu`, `stvec`, `stimecmp`. A process carries nothing hart-specific, which
      is precisely what lets it resume on any hart.

      The three places are not three disjoint thirds of one register file. They are the
      saved state of **two** threads of control, the user program and its kernel thread, plus
      the kernel thread's memory. Overlaps between them are harmless because each copy has a
      single reader.
locks:
  - lock: "p->lock"
    where: "[[yield]] / [[sleep]] → [[sched]] → released by the [[scheduler]]; [[kwait]]; [[allocproc]]"
    protects: "The moment of suspension: no hart may load `p->context` until `swtch` has saved it and left the stack"
  - lock: "wait_lock"
    where: "[[kwait]], [[kexit]], [[kfork]]"
    protects: "`p->parent`; who may free a zombie's trapframe and page table"
  - lock: "(no lock) the trapframe"
    where: "[[uservec]], [[usertrap]], [[prepare_return]], [[kfork]]"
    protects: "Nothing needed: apart from its birth (the parent's `kfork`, while the child is `USED`) and its death (the parent's `freeproc`, after `ZOMBIE`), only the process's own thread touches it, and a process runs on one hart at a time"
  - lock: "(no lock) the kernel stack"
    where: "every kernel function"
    protects: "Nothing needed: exactly one thread uses it, and `p->lock` covers the hand-over between harts"
quiz:
  - q: "A textbook table says: trapframe = user registers, kernel stack = caller-saved registers, context = callee-saved registers, \"no overlap\". Using pid 5's dump, give one register value stored in two of the places, and one register that has different values in two places."
    a: "User `s7 = 0x9010` is in both the trapframe and `p->context` (also `s4`–`s11`; `s3` matches only by coincidence, since `sched` reuses it for `intena`). User `s2 = 0x8430` is in the trapframe and in `usertrap`'s frame on the kernel stack. `s2` itself has different values in the trapframe (`0x8430`, the user's) and the context (`0x8000f9a0`, the kernel thread's)."
  - q: "Why is it safe that the same register has two different saved values?"
    a: "Each copy has exactly one reader. `swtch` reads only `p->context` (the kernel thread's value), epilogues read only their own spills, and `userret` reads only the trapframe (the user's value). The two copies describe two different threads of control and are never compared."
  - q: "Explain why `userret`'s loads of `s0`–`s11` usually write back values the registers already hold, and name the case where they are essential."
    a: "`usertrap` is a C function reached from `uservec`, which never touches `s` registers, so by the calling convention it returns with the user's `s` values intact. The loads matter on one path: every new process's first return, through [[forkret]] (each fork child, and `init`). `forkret` reaches `userret` from a forged kernel thread whose `s` registers are not the user's; only the copied trapframe has them."
  - q: "Where is the `pc` at which a process was interrupted kept, (a) if it was in user mode, (b) if it was in the kernel?"
    a: "(a) In `trapframe->epc`, copied from `sepc` by `usertrap`. (b) In `kerneltrap`'s local variable `sepc`, which in this build lives in `s2` and is spilled onto the kernel stack by the prologue of a function it calls (`sched` in our dump); `kerneltrap` writes it back to the hart's `sepc` before `sret`."
  - q: "A child's trapframe, copied from the parent, says `kernel_sp = 0x3fffff8000`, the parent's stack. What stops the child from trapping onto its parent's kernel stack?"
    a: "The child can only enter user mode through [[forkret]], which calls [[prepare_return]] first, and that rewrites `kernel_sp` (and the other kernel fields) for the child. A trap can only happen from user mode, so the stale value is never used."
  - q: "After `wait` frees a zombie, its `p->context` still holds a saved `sp`. Why is that harmless, and what would make it dangerous?"
    a: "No scheduler loads a context unless the process is `RUNNABLE`, and an `UNUSED` slot becomes runnable only after [[allocproc]] forges a fresh context. It would be dangerous if some code could set an `UNUSED` or `USED` slot `RUNNABLE` without going through `allocproc`."
