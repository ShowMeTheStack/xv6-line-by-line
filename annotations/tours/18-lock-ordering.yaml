  - title: sched enforces "only p->lock"
    file: kernel/proc.c
    lines: 479-497
    focus: 485-492
    state:
      hart: 2
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: ["wc's p->lock"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, piperead, sleep, sched]
      sp: kernel
    note: |
      Why does `p->lock` have to be the *innermost* lock, below every condition lock? Look
      at what [[sched]] demands. A process that gives up the CPU must hold **exactly one**
      spinlock: its own `p->lock` (line 485 checks it is held, line 487 checks that `noff`,
      this hart's push_off depth, which here counts the spinlocks it holds, is exactly 1;
      [[concept:locks#noff]]).

      `wc` got here from [[piperead]] through [[sleep]]. Before calling `sleep()`, `piperead`
      released `pi->lock` ([[kernel/pipe.c:125]]); `sleep()` then took only `wc`'s
      `p->lock`. A process cannot switch away holding `pi->lock`, because other harts would
      spin on it, interrupts off, until `wc` happened to run again.

      What `wc` leaves behind when it switches away is its kernel stack, frozen in place:
      `usertrap → syscall → sys_read → fileread → piperead → sleep → sched`, 336 bytes at
      the top of its page, with `swtch` saving the stack pointer into `p->context` before
      moving hart 2 to its scheduler stack ([[kernel/swtch.S:26]]). Nothing on that stack
      records which locks are held. Sleep-locks live in their structs, but a spinlock's
      "held" is a property of the *hart*: `lk->cpu` and this hart's `noff`. Any other
      spinlock carried across the switch would still name hart 2 as its holder while `wc`
      slept, and if `wc` woke on another hart, its `release` would fail the [[holding]]
      check and panic. (`p->lock` is the one exception: the scheduler on the same hart
      releases it, [[tour:13]].)

      This check enforces the half of Rule 8 that sleepers depend on: no process may switch
      away holding a condition lock. Any path that tried would panic with `sched locks`. And because a
      sleeping process holds `p->lock` across [[swtch]] (released by the scheduler, as in
      [[tour:13]]), anything taken *after* `p->lock` would be held across the switch too.
      Only lock types that a process being built or freed needs are taken under a `p->lock`
      (`pid_lock`, `kmem.lock`, `ftable.lock`, `itable.lock`, in [[kfork]]/[[allocproc]], and
      `kmem.lock` in [[freeproc]]), and none of them is held across a switch. The one that can
      lead back, `itable.lock`, does so only inside [[iput]] with `ref == 1`, where it never
      waits.
    others: |
      `p->lock` is also taken by every hart's [[scheduler]] for every process it inspects.
      The schedulers hold nothing else while doing so. If some path took `p->lock` and then
      a lock that can lead back to a `p->lock`, a scheduler loop could become part of a cycle, and an idle hart would
      freeze while looking for work. The only such lock, `itable.lock` under `np->lock` in
      [[kfork]], leads back only inside [[iput]] with `ref == 1`, where it never waits.

