      (Simplified: the log's [[write_log]] and [[install_trans]] hold a log block, then a
      home block; [[bmap]] and [[itrunc]] hold an indirect block while [[balloc]]/[[bfree]]
      lock a bitmap block. The UART's `tx_lock` sleep-lock is taken with nothing held, and
      only `lk->lk` and `p->lock` nest under it. `pr.lock` is reached from `cons.lock` when
      Ctrl-P runs [[procdump]] → [[printk]].)

      Taken as lock types, `p->lock` → `itable.lock` (kfork's [[idup]]) → `lk->lk` ([[iput]])
