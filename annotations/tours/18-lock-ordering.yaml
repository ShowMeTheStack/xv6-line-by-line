title: "Lock ordering: how xv6 avoids deadlock"
group: Concurrency primitives
prerequisites: [15, 16, 17]
summary: |
  One lock can never deadlock a correct program. Two locks can. If hart 1 holds lock A and
  waits for B while hart 2 holds B and waits for A, both wait forever, and soon every other
  hart that touches A or B joins them. Nothing crashes, nothing prints. The machine simply
  stops making progress. This is a [[g:deadlock]], and it is the price of having more than
  one lock.

  xv6 has dozens of locks: one per process, one per inode, one per buffer, plus `wait_lock`,
  `itable.lock`, `bcache.lock`, `log.lock`, pipe locks, the disk lock and more. It has no
  deadlock detector. It avoids deadlock the classic way: almost every code path that holds two
  locks at once takes them **in the same order**, so a cycle of waiting can never close; the
  few exceptions ([[iput]]'s, step 16) only ever take the second lock when it cannot be held
  by anyone else. The order
  is written down in exactly one comment ([[kernel/proc.c:26]]). Everywhere else it lives in
  the code, as a release placed *before* an acquire, a name refused, a lock dropped early.

  This tour is a pilgrimage through those places. At each stop you see the rule, the line
  that obeys it, and a timeline of the deadlock that would happen if the line were written
  the other way. It ends with the whole partial order on one page.
cast: |
  This tour visits many short scenes rather than following one process. The machine has
  three [[g:hart|harts]], and in every scene at least two of them are inside the kernel at
  once, usually on behalf of processes you would meet at an ordinary shell prompt: `sh`,
  the children of a pipeline `cat README | wc`, `rm`, `ln`, a program writing a file.

  | Hart | Typical role in the scenes |
  |---|---|
  | 0 | Often a parent: the shell waiting for children, or a process walking a path |
  | 1 | The process whose code path we are reading |
  | 2 | The competitor: another process trying to take the same locks in the other order |

  Each step names its processes. Pids follow a freshly booted system: `init` is 1, `sh` is
  2, the first command's processes are 3, 4, 5, and so on.
steps:
  - title: Two locks, two harts, one cycle
    file: kernel/spinlock.c
    lines: 19-42
    focus: 24-38
    state:
      hart: 1
      mode: S
      proc: any process
      intr: off
      satp: kernel
      locks: ["lock A (spinlock)"]
      irq: {noff: 2, intena: 1, note: "lock A, plus the push_off on line 24 of this `acquire(&B)`: interrupts are off before the spin starts. intena 1 assumes A was taken in a system call"}
      stack: [acquire]
      sp: kernel
    note: |
      Start with the mechanism every rule in this tour protects against. Hart 1 holds lock A
      and calls `acquire(&B)`. [[push_off]] has turned interrupts off, and the
      [[g:insn:amoswap|amoswap]] loop on line 37 spins until `B.locked` is 0 ([[tour:15]]).

      If hart 2 is holding B and spinning in this same loop for A, neither loop can ever
      finish:

      | Time | Hart 0 | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | | `acquire(&A)`: gets it | `acquire(&B)`: gets it |
      | t2 | | `acquire(&B)`: spins | `acquire(&A)`: spins |
      | t3 | wants A for something: spins | spins | spins |
      | t4 | spins, interrupts off | spins, interrupts off | spins, interrupts off |

      Because spinlock waiters spin with interrupts off, even the timer cannot rescue them:
      no hart can be preempted, so no scheduler ever runs again. The whole machine is dead.

      Lines 25–26 catch only the smallest cycle, a hart waiting for **itself**:
      [[holding]] notices that this hart already owns `lk` and [[panic]]s with `acquire`.
      A cycle that involves two harts has no such check. It must be made impossible by
      design, and the design is a fixed order: if every path takes A before B, then nobody
      can hold B while waiting for A, and the cycle at t2 cannot form.
    others: |
      Sleep-locks deadlock too, more quietly: the waiters are `SLEEPING` instead of spinning,
      the harts stay free, and the shell still answers. But the processes in the cycle never
      run again, and every process that later needs one of those locks joins them. The rest
      of this tour treats both kinds of lock with the same discipline.

  - title: "Rule 1: wait_lock before any p->lock"
    file: kernel/proc.c
    lines: 21-28
    focus: 23-27
    state:
      proc: none
      locks: []
      stack: []
    note: |
      The only place xv6 writes a lock order down is this comment: `wait_lock` "must be
      acquired before any p->lock".

      Why do these two locks ever nest? `wait_lock` protects the family tree: every
      `p->parent` field ([[kernel/proc.h:93]]). Each `p->lock` protects one process's
      `state`, `chan`, `killed`, `xstate` and `pid`. Parents and children meet in two places
      that need both:

      - [[kexit]] must reparent its children and wake its parent (family tree) and become a
        `ZOMBIE` (its own state).
      - [[kwait]] must find its children (family tree) and check whether each is a
        `ZOMBIE` (the child's state).

      Both take `wait_lock` first and a `p->lock` second. The next three steps visit them, and
      [[kfork]], the one place that is tempted to go the other way. The family-tree logic
      itself (why the parent's wakeup cannot be lost) belongs to [[tour:21]]; here we only
      care about the order.
    others: |
      There are 64 `p->lock`s (`NPROC`) and only one `wait_lock`. Ordering "the global lock
      before any of the per-process locks" also keeps the `p->lock`s from needing an order
      among themselves: no path ever holds two `p->lock`s at once. [[kwait]] comes closest:
      it holds `wait_lock` plus one child's `p->lock`, and takes its own only after letting
      the child's go.

  - title: kfork lets go of the child before touching the family tree
    file: kernel/proc.c
    lines: 284-305
    focus: 296-298
    state:
      hart: 1
      mode: S
      proc: sh (pid 3, the pipeline's subshell)
      intr: off
      satp: kernel
      locks: [wait_lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_fork, kfork]
      sp: kernel
    note: |
      The scene: you typed `cat README | wc`. The subshell (pid 3) has already forked
      `cat` (pid 4) and is now forking `wc` (pid 5) on hart 1.

      [[allocproc]] returned the new `struct proc` with its `p->lock` held, so all of the
      copying above runs with `np->lock` held. Then look at line 294: `release(&np->lock)`.
      Only *after* that does line 296 take `wait_lock` to set `np->parent`, and line 300
      re-takes `np->lock` to mark the child `RUNNABLE`.

      Releasing and re-acquiring looks wasteful. It is the price of Rule 1. Holding
      `np->lock` while acquiring `wait_lock` would be the forbidden order, `p->lock` then
      `wait_lock`. The `others` box shows the deadlock it would cause.

      The copying itself nests a few locks *under* `np->lock`: [[uvmcopy]] calls [[kalloc]]
      (`kmem.lock`), [[filedup]] takes `ftable.lock`, [[idup]] takes `itable.lock`; earlier,
      [[allocproc]] took `pid_lock` ([[allocpid]]) and `kmem.lock` with the child's lock
      held. `pid_lock`, `kmem.lock` and `ftable.lock` never lead back to a `p->lock`.
      `itable.lock` can, through [[iput]]'s `acquiresleep` ([[kernel/fs.c:362]]), which closes
      the one class-level cycle `p->lock` → `itable.lock` → `lk->lk` → `p->lock`. It cannot
      deadlock, because `iput` does this only when `ref == 1`, so its `acquiresleep` never
      waits (step 16, [[concept:locks#order]]). A
      measured run confirms that these four are the only locks this kernel ever takes while
      holding a `p->lock` ([[tour:51]], [[concept:locks#order]]).

      Is it safe to let go of `np->lock` in between? Yes: `np->state` is still `USED`, so
      no scheduler will run it ([[scheduler]] only picks `RUNNABLE`), and no `wait` will
      reap it (it is not a `ZOMBIE`).
    others: |
      `cat` (pid 4) finishes and exits on hart 2 at the same moment. Suppose `kfork` had
      kept `np->lock` while taking `wait_lock`:

      | Time | Hart 0 | Hart 1 (sh, pid 3, in kfork) | Hart 2 (cat, pid 4, in kexit) |
      |---|---|---|---|
      | t1 | | holds `np->lock` (pid 5's slot) | `acquire(&wait_lock)`: gets it |
      | t2 | | `acquire(&wait_lock)`: spins | `wakeup(p->parent)` walks the table, taking every `p->lock` |
      | t3 | | spins | reaches pid 5's slot: `acquire(&np->lock)`: spins |
      | t4 | any other fork, exit or wait: `acquire(&wait_lock)`: spins | spins forever | spins forever |

      [[wakeup]] does not know who is on the channel until it looks, so it takes **every**
      `p->lock` in turn, including the half-built child's. Line 294 breaks the cycle at
      t1: hart 1 holds nothing when it asks for `wait_lock`.

  - title: kexit takes wait_lock, then wakes the parent
    file: kernel/proc.c
    lines: 342-365
    focus: 347-353
    state:
      hart: 2
      mode: S
      proc: cat (pid 4)
      intr: off
      satp: kernel
      locks: [wait_lock, each p->lock in turn]
      irq: {noff: 2, intena: 1, note: "`wait_lock` plus whichever `p->lock` `wakeup` holds at this moment"}
      stack: [usertrap, syscall, sys_exit, kexit, wakeup]
      sp: kernel
    note: |
      Now the other side of that timeline, as the code really runs. `cat` (pid 4) has
      closed its files and dropped its working directory. Line 347 takes `wait_lock`.

      [[reparent]] hands any children of `cat` to `init`. It reads and writes
      `pp->parent`, which `wait_lock` protects, so it takes no `p->lock` at all, except
      inside [[wakeup]]`(initproc)` when it finds a child to hand over.

      Line 353, `wakeup(p->parent)`, wakes the subshell (pid 3) in case it is sleeping in
      `wait`. Inside [[wakeup]], hart 2 takes each of the 64 `p->lock`s one at a time, while
      still holding `wait_lock`. That is the `wait_lock` → `p->lock` order, 64 times over.

      Notice that `cat` itself reads `p->parent` here. It may only do so holding
      `wait_lock`, because its parent could be exiting on another hart and reparenting
      `cat` to `init` at this very moment.
    others: |
      While hart 2 walks the table, hart 1 might be in [[kfork]] (previous step). Because
      `kfork` releases `np->lock` before asking for `wait_lock`, hart 1 either finishes its
      `np->parent = p` before hart 2 gets `wait_lock`, or waits for `wait_lock` holding no
      `p->lock`. Either way, hart 2's walk through the table can always take every lock it
      meets, eventually.

  - title: kexit becomes a zombie holding both
    file: kernel/proc.c
    lines: 342-365
    focus: 355-358
    state:
      hart: 2
      mode: S
      proc: cat (pid 4)
      intr: off
      satp: kernel
      locks: [wait_lock, "cat's p->lock"]
      irq: {noff: 2, intena: 1, note: "`wait_lock` and `cat`'s `p->lock`; line 360 brings it down to 1, the exact count `sched` demands on line 363"}
      stack: [usertrap, syscall, sys_exit, kexit]
      sp: kernel
    note: |
      Line 355 takes `cat`'s own `p->lock` while still holding `wait_lock`: Rule 1 again,
      in its plainest form. Then `xstate` and `state = ZOMBIE` are written under both locks.

      Then the order of the *releases* gets interesting. Line 360 releases `wait_lock`,
      but `p->lock` stays held into [[sched]] and is released by the scheduler on the other
      side of [[swtch]] ([[tour:13]]). Releasing in a different order from acquiring is
      fine: deadlock comes from the order in which you **wait**, and releasing never waits.

      Why hold `wait_lock` until the zombie is fully set up? Because the parent scans for
      zombies holding `wait_lock` ([[kwait]], next step). With both locks held here, the
      parent sees `cat` either before it started exiting or as a finished zombie, never in
      between.
    others: |
      [[sched]] insists that exactly one spinlock is held when a process switches away
      (`noff == 1`, [[kernel/proc.c:487]]). That is why `wait_lock` must be released before
      line 363. A process that went to sleep holding `wait_lock` would leave every other
      `exit`, `wait` and `fork` on the machine spinning.

  - title: kwait holds wait_lock, then each child's lock
    file: kernel/proc.c
    lines: 369-405
    focus: 384-387
    state:
      hart: 0
      mode: S
      proc: sh (pid 3, the pipeline's subshell)
      intr: off
      satp: kernel
      locks: [wait_lock, "cat's p->lock"]
      irq: {noff: 2, intena: 1, note: "`wait_lock` and the child's `p->lock`; `freeproc` → `kfree` on line 398 makes it 3"}
      stack: [usertrap, syscall, sys_wait, kwait]
      sp: kernel
    note: |
      The subshell (pid 3) is in `wait(0)` ([[user/sh.c:121]]), here running on hart 0.
      Line 376 took `wait_lock`; line 382 finds a child by reading `pp->parent` (allowed,
      under `wait_lock`), and line 384 takes that child's `p->lock` to read its `state`.
      Same order: `wait_lock`, then a `p->lock`.

      The `p->lock` is needed for the comment's reason: "make sure the child isn't still in
      exit() or swtch()". A child that has set `ZOMBIE` still holds its `p->lock` until it
      has fully switched away; the parent must not free the slot (and so let a new process
      inherit the slot's kernel stack) while the child is still running on that stack.
      Kernel stacks themselves are never freed: they belong to slots ([[concept:stacks]]).

      If the zombie is found, the parent may call [[copyout]] to deliver the exit status
      while holding *both* locks (line 391). `copyout` may need a fresh page from
      [[vmfault]] → [[kalloc]], which takes `kmem.lock`: so `p->lock` → `kmem.lock` is also
      part of the order. `kmem.lock` is a **leaf**: nobody holding it ever takes another
      lock. (`sh` passes `0` here, so this particular `wait` skips the copy.)

      Line 398 nests one level deeper on every reap: [[freeproc]] frees the zombie's pages
      with [[kfree]], which takes `kmem.lock` while `wait_lock` and the child's `p->lock`
      are still held. That is `noff` 3, the deepest spinlock nesting a measured run found
      (227,333 times) ([[concept:locks#nesting]], [[tour:51]]).
    others: |
      What `kwait` does *not* do matters as much: it never takes its own `p->lock` while
      holding a child's. When it has to sleep, it calls [[sleep_prepare]] (which takes and
      releases its own `p->lock`) at line 414 *after* releasing every child's lock, while
      holding only `wait_lock`. So `wait_lock` → own `p->lock` is the only other nesting,
      and no path ever holds two `p->lock`s and waits for a third.

  - title: "Rule 2: begin_op before any inode lock"
    file: kernel/file.c
    lines: 148-170
    focus: 161
    state:
      hart: 2
      mode: S
      proc: echo (pid 6, writing to x)
      intr: on
      satp: kernel
      locks: ["inode 24 lock (sleep-lock), x"]
      irq: 0
      stack: [usertrap, syscall, sys_write, filewrite]
      sp: kernel
    note: |
      The scene: `echo hi > x` is writing to a file `x` (in a fresh `fs.img`, the first file
      you create gets inode 24). [[filewrite]] opens a [[g:transaction]] with [[begin_op]]
      on line 160, and only *then*, on line 161, takes the inode's sleep-lock with [[ilock]].

      `begin_op` is not a lock, but it can make a process wait, and anything that waits can
      be part of a deadlock cycle. It waits when the log might not have room for one more
      operation, until the current group of operations commits ([[tour:31]]). The commit
      happens only when the last outstanding operation calls [[end_op]].

      So xv6 orders it like a lock: **`begin_op` first, inode locks after**. Every file-system
      system call follows this: [[sys_open]], [[sys_unlink]], [[sys_link]], [[kexec]],
      `filewrite`, and [[kexit]] (for the `iput` of its working directory). The next step
      shows what goes wrong otherwise.
    others: |
      The display shows the state just after line 161: `echo` holds inode 24's sleep-lock
      and has interrupts **on**. A sleep-lock is held across [[readi]]/[[writei]] and their
      disk waits, which is the whole point of it ([[tour:17]]). Another process wanting
      inode 24 sleeps; it does not spin.

  - title: Why begin_op cannot come second
    file: kernel/log.c
    lines: 127-150
    focus: 138
    state:
      hart: 2
      mode: S
      proc: echo (pid 6, hypothetical buggy order)
      intr: off
      satp: kernel
      locks: ["inode 24 lock (sleep-lock), held in the buggy order", log.lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_write, filewrite, begin_op]
      sp: kernel
    note: |
      Here is the wait inside [[begin_op]]. With `LOGBLOCKS` = 30 and `MAXOPBLOCKS` = 10, a
      new operation must sleep if `log.lh.n + (log.outstanding + 1) * 10 > 30`: the blocks
      already logged by this group, plus a worst-case reservation for every running
      operation and the new one.

      Suppose `filewrite` were written the other way round, `ilock` first. The log already
      holds 15 blocks from earlier operations in this group, and `rm x` (pid 7) is one
      operation in progress:

      | Time | Hart 0 | Hart 1 (rm, pid 7) | Hart 2 (echo, pid 6) |
      |---|---|---|---|
      | t1 | | in `sys_unlink`, `begin_op` done: `outstanding = 1` | |
      | t2 | | | `ilock(x)`: gets inode 24 |
      | t3 | | | `begin_op`: 15 + 2 × 10 = 35 > 30, sleeps until a commit |
      | t4 | | `ilock(x)`: sleeps, inode 24 is held by `echo` | |
      | t5 | `sh` runs, every later file operation queues in `begin_op` | asleep forever | asleep forever |

      The commit needs `outstanding` to reach 0, which needs `rm` to call `end_op`, which
      needs inode 24, which needs `echo` to get past `begin_op`, which needs the commit.
      With the real order, `echo` waits at t3 *without* holding inode 24, `rm` finishes, and
      the commit wakes `echo`.
    others: |
      This is a cycle between a lock and a **condition** (log space), not between two locks.
      Your lock-ordering discipline has to include everything that can make you wait:
      locks, `begin_op`, and any `sleep` whose wakeup depends on another process making
      progress.

  - title: "Rule 3: parent directory before child, in unlink"
    file: kernel/sysfile.c
    lines: 201-233
    focus: 226
    state:
      hart: 1
      mode: S
      proc: rm (pid 7, removing a/b)
      intr: on
      satp: kernel
      locks: ["a's inode lock (sleep-lock)", "b's inode lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_unlink]
      sp: kernel
    note: |
      The scene: `rm a/b`, where `b` is an empty directory inside `a`. [[nameiparent]]
      returned `a` (unlocked) with `name = "b"`. Line 218 locks `a`, line 224 looks up `b`
      in it, and line 226 locks `b`. Now `rm` holds two inode sleep-locks: **parent first,
      then child**.

      That is the inode order for the whole file system: when a path holds two inode locks,
      it takes the one higher in the directory tree first. Holding both is necessary here:
      the entry in `a` and `b`'s link count must change together, and if `b` is a directory
      it must still be empty ([[isdirempty]]) at the moment its entry disappears, which only
      `b`'s lock can guarantee.

      Which inodes are "parent" and "child" is decided by the directory tree, which is a
      tree because xv6 forbids hard links to directories ([[sys_link]] refuses `T_DIR`,
      [[kernel/sysfile.c:139]]). On a tree, "ancestor first" is a consistent order. With
      directory hard links the tree could become a graph with cycles, and the rule would no
      longer be well defined.
    others: |
      Another `rm` on hart 2 removing `a/c` locks `a` first, too. It sleeps on `a`'s lock
      until hart 1 is done, then proceeds. Two processes contending for the same parent are
      serialized, not deadlocked, because both ask for `a` before anything below it.

  - title: unlink refuses "." and ".."
    file: kernel/sysfile.c
    lines: 201-233
    focus: 220-222
    state:
      hart: 1
      mode: S
      proc: rm (pid 7)
      intr: on
      satp: kernel
      locks: ["b's inode lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_unlink]
      sp: kernel
    note: |
      Line 221 refuses to unlink a final path element named `.` or `..`. There are good
      file-system reasons (removing them would corrupt the directory structure), but both
      would also break the lock order.

      **`rm a/b/.`**: `dp` is `b` and `name` is `.`. [[dirlookup]] would return `b` itself,
      and line 226 would call [[ilock]] on the lock this process already holds. A sleep-lock
      has no "do I already hold this?" check: [[acquiresleep]] would see `locked == 1` and
      sleep, waiting for itself, forever.

      **`rm a/b/..`**: `dp` is `b`, and `..` names `a`, its parent. Line 226 would lock the
      **parent while holding the child**, the reverse of Rule 3:

      | Time | Hart 0 | Hart 1 (rm a/b/.., pid 7) | Hart 2 (rm a/b, pid 8) |
      |---|---|---|---|
      | t1 | | `ilock(b)` (as `dp`) | `ilock(a)` (as `dp`) |
      | t2 | | looks up `..` → `a` | looks up `b` |
      | t3 | | `ilock(a)`: sleeps, held by pid 8 | `ilock(b)`: sleeps, held by pid 7 |
      | t4 | `ls a` locks `a`: sleeps | asleep forever | asleep forever |

      The check on line 221 runs before any lookup, so neither case gets as far as a second
      lock.
    others: |
      Notice the display: when line 221 runs, `rm` holds exactly one inode lock, `b`'s
      (here `dp`). The refusal path (`goto bad`) releases it and ends the transaction.
      Refusing early is the cheapest deadlock avoidance there is.

  - title: create, the new-file path, parent then child
    file: kernel/sysfile.c
    lines: 258-298
    focus: 294
    state:
      hart: 1
      mode: S
      proc: sh (pid 6, the child that will exec echo)
      intr: on
      satp: kernel
      locks: ["root inode lock (sleep-lock)", "inode 24 lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_open, create]
      sp: kernel
    note: |
      [[create]] is the mirror image of unlink ([[tour:35]]). For `echo hi > x`, the shell's
      `open("x", O_WRONLY|O_CREATE|O_TRUNC)` ([[user/sh.c:395]]), made in the forked shell
      child before it runs `echo`, gets here. Line 267 locks the parent, the root
      directory. If `x` does not exist yet, [[ialloc]] picks a free inode (24 in a fresh
      image) and line 294 locks it: **parent, then child**, Rule 3 again.

      Could another process have locked inode 24 first, in some other order? No: it was
      free a moment ago, and the only path to it is the directory entry that line 306 is
      about to write into the root, which this process is holding locked. A brand-new inode
      cannot be part of anyone else's cycle.

      For a new directory, line 302 writes `..` into the child pointing at the parent. It
      does this with [[dirlink]] on the *locked child*, using `dp->inum`, a number. It does
      not lock `dp` again, so no child-to-parent acquisition happens even though the data
      points upward.
    others: |
      `ialloc` itself runs [[bread]] on inode blocks, taking and releasing a buffer
      sleep-lock for each inode it examines (the same block up to 16 times), while the process holds the parent's inode lock.
      So "inode lock before buffer lock" is part of the order, too. We meet buffers in
      Rule 6.

  - title: create, the existing-name path, lets go of the parent first
    file: kernel/sysfile.c
    lines: 258-292
    focus: 282-284
    state:
      hart: 1
      mode: S
      proc: sh (pid 9, the child that will exec echo)
      intr: on
      satp: kernel
      locks: ["inode 24 lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_open, create]
      sp: kernel
    note: |
      Run `echo hi > x` a second time. Now [[dirlookup]] on line 280 finds `x`. Look at the
      order on lines 281–282: `iunlockput(dp)` **releases the parent first**, then
      `ilock(ip)` locks `x`. Unlike unlink, `create` never holds parent and child together
      on this path. The display shows the state from line 282 on: only inode 24 is held.

      Holding both would follow Rule 3 only if `ip` were really a child of `dp`. The code has
      no comment explaining the release, but it is necessary: `name` comes from the
      user and can be anything, including `.`. `open("a/.", O_CREATE)` gives `dp = a`,
      `name = "."`, and `dirlookup` returns `a` itself. Locking `ip` while holding `dp`
      would then be a process waiting for its own sleep-lock, the self-deadlock of the
      previous step. Releasing first makes `.` harmless: the call locks `a` again, sees it
      is a directory, and fails the test on line 283. (`..` is harmless for the same reason: nothing
      is held when the parent's parent is locked.)

      Nothing needs the parent anymore on this path. The entry exists; `create` only
      returns the file.
    others: |
      Between lines 281 and 282, holding nothing, another process on hart 2 could unlink
      `x`. The shell child still holds a reference (from `dirlookup`'s [[iget]]), so the
      inode cannot be freed or reused under it; `echo` would end up writing to a file that has no
      name. That is the normal Unix behavior for an open file whose name is removed.

  - title: "Rule 4: namex holds one inode lock at a time"
    file: kernel/fs.c
    lines: 691-728
    focus: 716-719
    state:
      hart: 0
      mode: S
      proc: cat (pid 10, opening a/b/c)
      intr: on
      satp: kernel
      locks: ["a's inode lock (sleep-lock)"]
      irq: 0
