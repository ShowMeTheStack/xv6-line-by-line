quiz:
  - q: "In `kfork`, why is `np->lock` released on line 294 and taken again on line 300, instead of being held while `wait_lock` is acquired?"
    a: "Holding `np->lock` while taking `wait_lock` would be `p->lock` before `wait_lock`, the reverse of Rule 1. A process in `kexit` holding `wait_lock` calls `wakeup`, which takes every `p->lock` including `np`'s, so the two harts would wait for each other forever."
  - q: "A buggy system call locks an inode and then calls `begin_op`. Describe a deadlock that involves no second lock at all."
    a: "If the log is short of space, `begin_op` sleeps until a commit, which needs `outstanding` to reach 0. Another operation already inside a transaction that needs the same inode sleeps on its lock and can never call `end_op`, so the commit never happens and both wait forever."
  - q: "`sys_unlink` holds the parent and the child inode locks at once. Why does it refuse a final name of `..`, and why `.`?"
    a: "`..` names the parent of `dp`, so locking it would take a parent while holding its child, the reverse of the parent-first order, which can deadlock with an `unlink` going the normal way. `.` names `dp` itself, so `ilock` would wait for a sleep-lock the process already holds, and `acquiresleep` has no check for that: the process would sleep forever."
  - q: "`iput` calls `acquiresleep` while holding the spinlock `itable.lock`. Why can that not sleep or deadlock?"
    a: "It does so only when `ip->ref == 1`: the caller holds the only reference and has already unlocked the inode, and nobody can get a new reference while `itable.lock` is held. So the sleep-lock is free and `acquiresleep` returns at once, never sleeping with a spinlock held."
  - q: "What would happen if `bget` called `acquiresleep(&b->lock)` before `release(&bcache.lock)` and the buffer was held by a process waiting for the disk?"
    a: "The caller would sleep holding a spinlock, and `sched` would panic with `sched locks` because `noff` is 2. Even without that check, other harts calling `bget` or `brelse` (including the buffer's holder) would spin on `bcache.lock` with interrupts off, and the machine would freeze."
  - q: "Why must `p->lock` be taken after condition locks like `pi->lock` and `tickslock`, never before?"
    a: "A sleeper must give up the CPU holding only its `p->lock` (`sched` checks `noff == 1`), so condition locks are released before `sleep()`. Wakers take `p->lock` while holding the condition lock. If anyone took a condition lock while holding a `p->lock`, a waker inside `wakeup` and that path could each wait for the other's lock."
