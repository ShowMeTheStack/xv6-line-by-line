      ([[sys_open]]'s [[filealloc]]); buffer sleep-lock → `vdisk_lock` ([[bread]]/[[bwrite]]).

      Three habits keep the table true: **release before you acquire** when the order would
      be wrong ([[kfork]], [[bget]], [[sys_link]], `create`); **refuse inputs** that would
