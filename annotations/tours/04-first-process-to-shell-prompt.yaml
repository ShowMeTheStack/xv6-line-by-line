      must be taken **before** any `p->lock` ([[kernel/proc.c:26]]). [[kexit]] and [[kwait]]
      take them in that order; taking them in the opposite order here could deadlock
      against them, for example `kexit` on another hart holds `wait_lock` while its
      [[wakeup]] call acquires every `p->lock`, including `np`'s ([[tour:18]]). The
      highlighted line is step 3, holding `proc[1].lock` with interrupts off. This acquire
      ran inside a system call with interrupts on, so [[push_off]] recorded `intena = 1` and
      the release on line 302 turns them back on, unlike the release in [[forkret]] (step 7)
