title: From the first process to the shell prompt
group: Boot and build
prerequisites: [3]
summary: |
  At the end of [[main]], the kernel is built but nothing is running. There is no `init`
  program in memory, no shell, no user code at all: just one entry in the process table,
  marked `RUNNABLE`, with an empty address space. Less than a second later, the console
  shows

  ```
  init: starting sh
  $
  ```

  and two processes are asleep, waiting for you.

  This tour follows that second: [[userinit]] creating process 1, three schedulers racing
  to run it, [[forkret]] doing the file-system setup that `main` could not do, [[kexec]]
  loading `/init` from the disk image built in [[tour:1]], the first drop into user mode,
  `init` creating the console device and forking the shell, and the shell printing its
  prompt and blocking in `read`.

  It is also the first time a process **moves between harts**. Whenever it waits for the
  disk, or later, once it runs with interrupts on, whenever a timer tick makes it yield,
  the hart it was on goes off to do something else, and whichever hart's scheduler finds
  it runnable again picks it up (often the same hart, sometimes another). The run this tour follows (traced with `gdb`) is
  one real interleaving among many; your boot will differ in the details, never in the
  outcome.
cast: |
  | Hart | What it is doing |
  |---|---|
  | 0 | Finishing [[main]]: about to call [[userinit]] |
  | 1 | Spinning on [[started]], waiting for hart 0 ([[tour:3]]) |
  | 2 | The same as hart 1 |

  Interrupts are off on all three harts. The process table is empty.
steps:
  - title: allocproc claims a slot under its lock
    file: kernel/proc.c
    lines: 105-150
    focus: 116-126
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [main, userinit, allocproc]
      sp: {"on": boot, detail: "hart 0's slice of `stack0`; process 1's kernel stack exists but is unused"}
      irq: {noff: 1, intena: 0}
    note: |
      [[userinit]] begins with [[allocproc]], the same function [[kfork]] will use for
      every later process. It walks the table, taking each `p->lock` in turn, looking for
      `UNUSED`. `proc[0]` is free, so it jumps to `found` **still holding `proc[0].lock`**.

      [[allocpid]] takes `pid_lock` for an instant to hand out the next pid: **1**. Then
      `p->state = USED`: the slot is reserved but not yet runnable.

      Holding `p->lock` from the check to the claim is what makes "find a free slot"
      safe. Right now no other hart can compete, but later two harts forking at once will
      both run this loop, and without the lock both could see the same `UNUSED` slot and
      both take it.
    others: |
      Harts 1 and 2 are still in their loop on [[started]] and cannot see `proc[0]` at all.
      The lock is uncontended. It is taken anyway because `allocproc` cannot know who might
      be watching: after boot, every hart's [[scheduler]] reads `proc[0].state` under this
      same lock.

  - title: A trapframe, a page table and a kernel context
    file: kernel/proc.c
    lines: 124-150
    focus: 128-149
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [main, userinit, allocproc]
      sp: {"on": boot, detail: "hart 0's slice of `stack0`; `p->context.sp` only records a future `sp`"}
      irq: {noff: 1, intena: 0}
    note: |
      Still under the lock, [[allocproc]] gives the process what it needs to run in the
      kernel. In this build, `gdb` shows:

      | Field | Value |
      |---|---|
      | `p->trapframe` | `0x87f56000`, a fresh page from [[kalloc]] |
      | `p->pagetable` | `0x87f55000`, built by [[proc_pagetable]]: only the trampoline and the trapframe are mapped |
      | `p->kstack` | `0x3fffffd000`, mapped at boot by [[proc_mapstacks]] |
      | `p->context.ra` | `0x8000193a`, [[forkret]] |
      | `p->context.sp` | `0x3fffffe000`, the top of the kernel stack |

      The four pages (trapframe, page-table root, and two lower-level page-table pages for
      the top of the address space) cost four trips through `kmem.lock`.

      The `context` is the trick that starts every process. [[swtch]] restores `ra` and
      `sp` and executes `ret`, which jumps to `ra`. So the first time any scheduler switches
      to this process, it will "return" into [[forkret]] on this process's own kernel stack,
      as if the process had been running there all along.

  - title: userinit marks process 1 runnable
    file: kernel/proc.c
    lines: 217-231
    focus: 224-228
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [main, userinit]
      sp: boot
      irq: {noff: 1, intena: 0}
    note: |
      Back in [[userinit]], three short lines and one remarkable omission.

      - `initproc = p`: the kernel remembers process 1. Orphans will be given to it.
      - `p->cwd = namei("/")`: the working directory is the root. This only reserves an
        in-memory inode slot for inode 1 under `itable.lock`; it does not read the disk.
      - `p->state = RUNNABLE`, then release the lock.

      The omission: **no user memory**. `p->sz` is 0. There is no program in this address
      space, not even a tiny bootstrap. Older versions of xv6 copied a hand-assembled
      `initcode` here; this version does not. Process 1 will get its program the same way
      every other process does, from the file system with [[kexec]], and it will do that
      from inside the kernel before ever reaching user mode.

      Line 33 of [[main]] then sets [[started]] ([[tour:3]]), and all three harts head for
      their schedulers.
    others: |
      `p->state = RUNNABLE` is written under `proc[0].lock`, and every scheduler reads
      `p->state` under that same lock. That pairing, not the [[started]] flag, is what
      protects this field from now on. Even a hart that somehow skipped the flag would see
      either `USED` (skip it) or `RUNNABLE` (claim it), never a half-written value.

  - title: Three schedulers race for process 1
    file: kernel/proc.c
    lines: 428-470
    focus: 447-453
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "the boot stack's new role: hart 0's slice of `stack0`, `sp = 0x80008810`"}
      irq: {noff: 1, intena: 0, note: "the scheduler acquires after `intr_off()` on line 442: intena 0"}
    note: |
      Each hart's [[scheduler]] scans `proc[0]` through `proc[63]`, taking each `p->lock`
      and checking for `RUNNABLE`. Only `proc[0]` qualifies. In the run this tour follows,
      hart 0 got there first; in other runs, hart 1 did.

      Each hart scans on its own **scheduler stack**: the same slice of [[stack0]] it booted
      on, which became the scheduler stack when [[main]] called [[scheduler]] and never got
      control back ([[tour:3]]).

      The winner, holding `proc[0].lock`:

      1. sets `p->state = RUNNING`, so that other schedulers will skip it;
      2. sets `cpus[0].proc = p`, so that [[myproc]] on this hart returns process 1;
      3. calls [[swtch]] to switch from the scheduler's context to the process's.

      It does **not** release `proc[0].lock` before switching. The lock travels with the
      switch, and the process releases it, in [[forkret]] here, or after `sched()` returns in
      [[yield]] or [[sleep]] for a process that stopped earlier. The same hand-off in the
      other direction is the one that matters: a process giving up the hart keeps `p->lock`
      until the scheduler is running on its own stack, so no other hart can resume it while
      its registers are still being saved ([[tour:13]]). The scheduler took the lock right
      after `intr_off()` on line 442, so hart 0 has `noff = 1`, `intena = 0`, and that one
      [[push_off]] level crosses the switch together with the lock ([[concept:locks#handoff]]).
    others: |
      | Time | Hart 0 | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | `acquire(&proc[0].lock)`: wins the `amoswap` | `acquire`: spins | still printing "hart 2 starting" |
      | t2 | `RUNNABLE` → `RUNNING`; [[swtch]] | spinning | `acquire`: spins |
      | t3 | in [[forkret]]: `release(&p->lock)` | gets the lock: `RUNNING`, skip | spinning |
      | t4 | [[fsinit]] … | scans `proc[1..63]`: all `UNUSED` | gets the lock: skip |

      Harts 1 and 2 find nothing to run, execute `wfi` and doze until an interrupt
      arrives. Each loop briefly enables interrupts at line 441 so that a pending timer or
      device interrupt can be taken.

  - title: swtch saves the scheduler
    file: kernel/swtch.S
    lines: 1-41
    focus: 10-25
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [main, scheduler, swtch]
      sp: {"on": scheduler, detail: "hart 0's slice of `stack0`; line 11 saves `sp = 0x80008810` in `cpus[0].context`"}
      irq: {noff: 1, intena: 0}
    note: |
      [[swtch]] saves the scheduler's callee-saved registers (`ra`, `sp`, `s0`–`s11`)
      into `cpus[0].context`, then starts loading the process's from `proc[0].context`:
      line 25 loads `ra = forkret`.

      Line 11 is the one to watch: `sd sp, 8(a0)` records where hart 0's scheduler stack
      stands, `0x80008810`, just below `scheduler`'s frame. `cpus[0].context` is only a
      save area, not a stack; the scheduler's frames stay where they are, in hart 0's slice
      of [[stack0]], and the saved `sp` is the way back to them.

  - title: "ld sp: onto process 1's empty kernel stack"
    file: kernel/swtch.S
    lines: 1-41
    focus: 26-40
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["proc[0].lock"]
      stack: [swtch]
      sp: {"on": kernel, switched: "`ld sp, 8(a1)` in [[swtch]] ([[kernel/swtch.S:26]])", detail: "process 1's `KSTACK(0)`, empty: `sp = 0x3fffffe000`, `ra = forkret`"}
      irq: {noff: 1, intena: 0, note: "the level the scheduler pushed, now carried by process 1's thread along with the lock"}
    note: |
      Line 26, `ld sp, 8(a1)`, is the moment hart 0 leaves its scheduler stack. Only two of
      the values loaded from `proc[0].context` are non-zero, and [[allocproc]] put both
      there: `ra = forkret` and `sp = 0x3fffffe000`, the top of `KSTACK(0)`.

      ```text
      hart 0's stack0 slice                process 1's kernel stack, KSTACK(0)
        start (abandoned), main,             0x3fffffe000 top ◄─ sp
        scheduler                            … nothing: never used …
        (saved sp 0x80008810                 0x3fffffd000 bottom, guard page below
         in cpus[0].context)
      ```

      The final `ret` jumps to `ra`. Hart 0 is now running [[forkret]], on process 1's
      kernel stack, as process 1. Nothing was "returned to": this is the first time this
      kernel thread has ever run, and its stack is **empty**. That is why the call stack
      above shows only `swtch`: the scheduler's frames are still in hart 0's slice of
      [[stack0]], but they are no longer on the stack `sp` points into. This `ld sp` is one
      of only four instructions in xv6 that switch stacks ([[concept:stacks]]); it never
      goes from one process's stack straight to another's, only between a process and a
      scheduler.
    others: |
      Each hart has its own `sp`. Harts 1 and 2 are still on their own scheduler stacks, in
      their own slices of [[stack0]], spinning on `proc[0].lock`. Even if one of them later
      ran process 1 (as hart 2 will), it would do so by loading process 1's saved
      `p->context.sp` into *its own* `sp`: a kernel stack belongs to a process slot, not to a hart, and only the
      hart running that process uses it.

  - title: forkret, the first code process 1 runs
    file: kernel/proc.c
    lines: 510-543
    focus: 522-528
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: []
      stack: [forkret]
      sp: {"on": kernel, detail: "process 1's `KSTACK(0)`: only `forkret`'s 48-byte frame"}
      irq: 0
    note: |
      [[forkret]] first releases `p->lock`, the lock the scheduler acquired on this
      process's behalf. Now other schedulers may look at `proc[0]` again (they will see
      `RUNNING` and skip it).

      Then the `static int first`. Process 1 is the only process that will ever see it
      set. It clears it and calls [[fsinit]], with a comment that says why this could not
      happen in `main`: reading the disk means sleeping, and only a process can sleep.

      Part of the reason is the stack. `gdb` shows `sp = 0x3fffffe000` at `forkret`'s first
      instruction; its prologue pushes the first frame process 1's kernel stack has ever
      held (48 bytes). A sleeping thread leaves its frames on its own stack while the hart
      goes off to run something else. `main` had only the hart's boot stack, which the hart
      itself keeps using, so it had nowhere to leave them.

      Interrupts stay **off** here, and that surprises people. The scheduler's [[acquire]]
      recorded "interrupts were off" in `cpus[0].intena`, so the [[release]] on line 520
      leaves them off ([[concept:locks#intena]]). Process 1 will run [[fsinit]] and [[kexec]] with interrupts off on
      its hart, and no timer can preempt it until it reaches user mode. Its disk interrupts
      are taken by a hart that is idling in its scheduler loop, which briefly enables
      interrupts on every pass. That includes process 1's own hart once process 1 is asleep.
    others: |
      `first` is a shared global read and written with no lock. That is safe only because
      of timing: the one process that can reach this line with `first == 1` is process 1,
      and it clears the flag long before it can fork any other process. Every later process
      also starts in `forkret` (that is how `allocproc` sets them up), but finds `first == 0`.

  - title: fsinit reads block 1
    file: kernel/fs.c
    lines: 29-49
    focus: 35-36
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["buffer for block 1 (sleep-lock)"]
      stack: [forkret, fsinit, readsb]
      sp: kernel
      irq: 0
    note: |
      [[fsinit]] reads the [[g:superblock]], block 1 of `fs.img`, the block `mkfs` wrote in
      [[tour:1]]. [[bread]] asks the buffer cache: block 1 is not cached, so [[bget]] takes
      `bcache.lock`, recycles a free buffer, releases `bcache.lock`, and acquires the
      buffer's **sleep-lock**. Then [[virtio_disk_rw]] sends a read request to the disk.

      When the data arrives, [[readsb]] copies it into the global `sb`:
      `magic = 0x10203040`, `size = 2000`, `nlog = 31`, `logstart = 2`, `inodestart = 33`,
      `bmapstart = 46`. The magic number check on line 45 is the kernel's only defense
      against booting from a disk that is not an xv6 file system.

      Then [[initlog]] (next step but one) and [[ireclaim]], which reads all 13 inode blocks
      (33–45) looking for inodes that were orphaned by a crash. On a fresh image it finds
      none.

  - title: Waiting for the disk, and waking up somewhere else
    file: kernel/virtio_disk.c
    lines: 274-298
    focus: 290
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: ["buffer for block 1 (sleep-lock)"]
      stack: [forkret, fsinit, readsb, bread, virtio_disk_rw]
      sp: kernel
      irq: 0
    note: |
      The disk is a separate device. After [[virtio_disk_rw]] notifies it (line 284), the
      process must wait for the completion interrupt. It registers on the channel `b` with
      [[sleep_prepare]], releases `disk.vdisk_lock`, and calls [[sleep]], which marks it
      `SLEEPING` under `p->lock` and switches back to hart 0's scheduler ([[tour:16]]).

      Process 1 is now frozen inside `virtio_disk_rw`, still holding the buffer's
      sleep-lock, which is allowed: sleep-locks may be held while sleeping. It must not hold
      `vdisk_lock` (a spinlock) while asleep, because the interrupt handler needs it.
      [[sched]] saves process 1's `intena`, 0 (it has had interrupts off since [[forkret]]),
      and puts it back on whichever hart resumes it, so process 1 keeps running with
      interrupts off there too ([[concept:locks#sched-intena]]).

      Frozen means: its frames stay on its kernel stack, and the `ld sp, 8(a1)` in
      [[swtch]], called from [[sched]], moves hart 0's `sp` back to the scheduler stack.

      ```text
      process 1's kernel stack, KSTACK(0), while it sleeps
        0x3fffffe000 top
                     forkret
                     fsinit     (readsb is inlined here in this build: no frame of its own)
                     bread
                     virtio_disk_rw
                     sleep
                     sched      ◄─ p->context.sp (saved by swtch)
      ```

      The disk finishes. Its interrupt goes to whichever hart claims it at the PLIC.
      [[virtio_disk_intr]] takes `vdisk_lock`, sets `b->disk = 0`, and calls
      [[wakeup]]`(b)`, which makes process 1 `RUNNABLE`. Then **any** scheduler may pick it
      up. In the traced run, [[fsinit]] started on hart 0, and by the time it reached
      [[ireclaim]] process 1 was running on **hart 2**.
    others: |
      | Time | Hart 0 | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | process 1: `sleep()`; switch to scheduler | `wfi` | `wfi` |
      | t2 | scheduler: nothing runnable; `wfi` | | |
      | t3 | | disk interrupt: [[virtio_disk_intr]] → [[wakeup]]: process 1 `RUNNABLE` | |
      | t4 | still in `wfi` | back in its scheduler, scans | a timer tick ends its `wfi`; scans |
      | t5 | `acquire(&proc[0].lock)`: spins | | `acquire`: wins, runs process 1 |

      (Which hart takes the interrupt is up to the PLIC; the table shows one possibility.
      [[wakeup]] only updates `p->chan` and `p->state` under `p->lock`; it sends no signal to
      a hart sitting in `wfi`.
      An idle hart notices the runnable process only after some interrupt of its own,
      such as its next timer tick, ends the `wfi`.)

      Whichever scheduler wins the `p->lock` runs process 1, returning out of [[sleep]] on
      a different hart, with its kernel stack and its sleep-lock intact. The kernel stack,
      the call chain and the locks held belong to the process's thread, not to the hart.

  - title: initlog creates the last boot lock
    file: kernel/log.c
    lines: 54-64
    focus: 60-63
    state:
      hart: any
      mode: S
      intr: off
      satp: kernel
      locks: []
      stack: [forkret, fsinit, initlog]
      sp: {"on": kernel, detail: "process 1's `KSTACK(0)`, frames intact, reloaded by `swtch` on whichever hart resumed it"}
      irq: 0
    note: |
      [[initlog]] creates `log.lock`, the one lock `main` did not create, and points the log
      at block 2.

      [[recover_from_log]] then does what a file system must do on every boot before
      anything else touches the disk: read the log header (block 2), and if it describes a
      committed transaction that may not have reached its home blocks, copy those blocks
      into place ([[tour:32]]). On a fresh image the header says `n = 0`: nothing to do.
      Then it writes the empty header back.

      Doing this here, before [[kexec]] reads a single file, guarantees that no process ever
      sees a half-applied transaction from before a crash. It is the second reason
      [[fsinit]] must run in a process: these reads and the write all sleep for the disk.

  - title: kexec opens /init
    file: kernel/exec.c
    lines: 27-58
    focus: 46-57
    state:
      hart: 2
      mode: S
      intr: off
      satp: kernel
      locks: ["inode 7 /init (sleep-lock)"]
      stack: [forkret, kexec]
      sp: {"on": kernel, detail: "process 1's `KSTACK(0)`, now on hart 2"}
      irq: 0
    note: |
      Line 532 of [[forkret]] calls `kexec("/init", {"/init", 0})`, the kernel half of the
      `exec` system call, called directly. It is the same code that will later replace the
      shell's child with `ls` or `cat` ([[tour:22]]).

      - [[begin_op]] joins a file-system transaction (`log.lock` held briefly).
      - [[namei]]`("/init")` locks the root inode (inode 1, block 33), reads the root
        directory (block 47), finds the entry `init` → **inode 7**.
      - [[ilock]] takes inode 7's sleep-lock and copies the inode out of block 33 (already
        in the buffer cache from [[ireclaim]]).
      - [[readi]] reads the ELF header from the file's first block, 189. Magic number OK,
        entry point `0xbc`, 4 program headers.
      - [[proc_pagetable]] builds a **new** page table. The old one, from [[allocproc]],
        stays in use until the new image is complete.

      Each of those reads may sleep on the disk, and each sleep is another chance for
      process 1 to change harts.

  - title: Loading the two segments
    file: kernel/exec.c
    lines: 59-81
    focus: 60-78
    state:
      hart: any
      mode: S
      intr: off
      satp: kernel
      locks: ["inode 7 /init (sleep-lock)"]
      stack: [forkret, kexec]
      sp: kernel
      irq: 0
    note: |
      Of the 4 program headers, 2 are `LOAD` (the other two describe RISC-V attributes and
      the stack and are skipped):

      | Segment | Virtual address | In file | In memory | Permissions |
      |---|---|---|---|---|
      | code | `0x0` | `0xa01` bytes | `0xa01` | read, execute |
      | data | `0x1000` | `0x10` bytes | `0x30` | read, write |

      For each, [[uvmalloc]] allocates zeroed pages (under `kmem.lock`) and maps them with
      `PTE_U` plus the segment's permissions, then [[loadseg]] reads the bytes from the file
      into those pages through their kernel addresses. After both, `sz = 0x1030`.

      [[iunlockput]] releases inode 7's sleep-lock and [[end_op]] ends the transaction.
      Nothing was written to the disk, so the commit has nothing to do.

  - title: The user stack and the point of no return
    file: kernel/exec.c
    lines: 83-140
    focus: 89-138
    state:
      hart: any
      mode: S
      intr: off
      satp: kernel
      locks: []
      stack: [forkret, kexec]
      sp: kernel
      irq: 0
    note: |
      [[kexec]] rounds `sz` up to `0x2000` and adds two pages: a guard page at
      `0x2000`–`0x3000` (made inaccessible to user mode by [[uvmclear]]) and the stack page
      `0x3000`–`0x4000`. Then it builds `main`'s arguments at the top of the stack:

      | Address | Contents |
      |---|---|
      | `0x3ff0` | the string `"/init"` (6 bytes, 16-byte aligned) |
      | `0x3fe0` | `argv[0] = 0x3ff0`, `argv[1] = 0` |

      Lines 133–138 commit: the process gets the new page table, `sz = 0x4000`, saved
      `epc = 0xbc` ([[user:start]]), saved `sp = 0x3fe0`, and `a1 = 0x3fe0` (`argv`). The
      empty page table from [[allocproc]] is freed. `kexec` returns `argc = 1`, which
      [[forkret]] stores in `a0`.

      Two stacks are involved here, and only one is in use. The hart is running `kexec` on
      process 1's **kernel** stack. The new **user** stack is just a page in the new page
      table: `kexec` writes the strings and `argv` into it with [[copyout]], through that
      table, and nobody's `sp` points into it yet. Line 137 only *prepares* a future `sp`:
      the value in the trapframe that `userret` will load ([[concept:stacks#user]]).

      Everything up to line 133 can fail and leave the process unchanged. After it, the old
      image is gone. For process 1 the old image was empty, but for every later `exec` this
      ordering is what lets a failed `exec` return -1 to a program that still exists.

  - title: forkret heads for user mode
    file: kernel/proc.c
    lines: 528-543
    focus: 538-542
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: []
      stack: [forkret]
      sp: {"on": kernel, detail: "process 1's `KSTACK(0)`, back on hart 0"}
      irq: 0
    note: |
      The last disk read in [[kexec]] slept, and in the traced run process 1 woke up on
      **hart 0** again. So the remaining lines of [[forkret]] run on hart 0.

      Lines 539–542 do by hand what [[usertrap]] does at the end of every system call:

      1. [[prepare_return]] sets up the trapframe and the CSRs for the trip to user mode
         (next step).
      2. [[MAKE_SATP]]`(p->pagetable)`: the `satp` value for process 1's new page table.
      3. Compute the address of [[userret]] **in the trampoline page**,
         `TRAMPOLINE + (userret - trampoline)` = `0x3ffffff09c`, and call it as a function
         with `satp` as its argument.

      Why not call `userret` at its kernel address, `0x8000609c`? Because `userret` switches
      to the user page table, and the kernel address is not mapped there. The trampoline
      address is mapped in both, so the instruction after the `satp` switch can still be
      fetched.

  - title: prepare_return records hart 0 in the trapframe
    file: kernel/trap.c
    lines: 97-132
    focus: 108-131
    state:
      hart: 0
      mode: S
      intr: off
      satp: kernel
      locks: []
      stack: [forkret, prepare_return]
      sp: {"on": kernel, detail: "`forkret`'s frame, then `prepare_return`'s 16 bytes: `sp = 0x3fffffdfc0`"}
      irq: 0
    note: |
      [[prepare_return]] fills in the trapframe fields the trampoline will need the next
      time process 1 traps into the kernel:

      | Field | Value |
      |---|---|
