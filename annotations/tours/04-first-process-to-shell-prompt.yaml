    protects: "The open-file table and each file's `ref`"
  - lock: "wait_lock (spinlock)"
    where: "[[kfork]], [[kwait]]"
    protects: "`p->parent`; taken before any `p->lock`"
  - lock: "tx_lock (uart sleep-lock)"
    where: "[[uartwrite]] via [[consolewrite]], for each of init's 18 one-byte writes and the shell's prompt"
    protects: "The UART transmitter: one writer at a time; may sleep waiting for the transmit-ready interrupt"
  - lock: "cons.lock (spinlock)"
    where: "[[consoleread]]"
    protects: "The console input buffer"
  - lock: "(no lock) first"
    where: "[[forkret]]"
    protects: "Read and cleared only by process 1, before any other process can exist"
  - lock: "(no lock) p->ofile[]"
    where: "[[fdalloc]], [[sys_dup]]"
    protects: "Private to its single-threaded process"
quiz:
  - q: "The scheduler holds `proc[0].lock` when it calls `swtch`, and `forkret` releases it. Why does the lock cross the switch instead of being released first?"
    a: |
      Because every process resumes in code that releases `p->lock`: `forkret`, or the end
      of `yield`/`sleep`. The convention exists for the opposite direction. A process giving
      up the hart calls `swtch` while still holding `p->lock`, and only the scheduler,
      already off the process's stack, releases it. Otherwise another hart could start the
      process while its registers were still being saved on its kernel stack
      ([[tour:13]]).
  - q: "Why must `fsinit` run in `forkret` instead of in `main`?"
    a: |
      It reads the disk, and waiting for a disk read means calling `sleep()`, which needs a
      current process to mark `SLEEPING`. During `main` there is no process. (It also
      replays the log before any file is read.)
  - q: "In the traced run, `fsinit` started on hart 0 and `ireclaim` ran on hart 2. Explain how the process moved."
    a: |
      Each disk read sleeps until the disk interrupt. Sleeping returns hart 0 to its
      scheduler. The interrupt's `wakeup` makes process 1 `RUNNABLE`, and whichever
      scheduler acquires `proc[0].lock` first runs it, here hart 2's. The kernel stack and
      the buffer sleep-lock go with the process.
  - q: "`kfork` releases `np->lock`, takes `wait_lock`, then takes `np->lock` again. Why not just hold `np->lock` throughout?"
    a: |
      The kernel's lock order requires `wait_lock` before any `p->lock`. `kexit` and `kwait`
      take `wait_lock` then a `p->lock`; taking `np->lock` then `wait_lock` here could
      deadlock against them.
  - q: "After `init`'s two `dup` calls and its `fork`, what is `ftable.file[0].ref`, and why?"
    a: |
      6. `open` set it to 1, the two `dup`s made it 3 (descriptors 0, 1, 2 of `init`), and
      `fork` called `filedup` on each of the child's 3 inherited descriptors.
  - q: "Process 1 runs `fsinit` and `kexec` with interrupts off on its hart. How does its disk interrupt ever get handled?"
    a: |
      While process 1 waits, it is asleep and its hart is back in the scheduler, which
      enables interrupts briefly on every loop. The PLIC delivers the disk interrupt to
      whichever hart has interrupts enabled and claims it first, often an idle hart in its
      scheduler.
