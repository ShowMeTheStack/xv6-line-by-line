      may run the child, possibly before `kfork` has even returned in the parent:

      | Time | Hart 0 | Hart 2 (init in kfork) |
      |---|---|---|
      | t1 | spins on `proc[1].lock` | holds `proc[1].lock`, sets `RUNNABLE` |
      | t2 | still spinning | `release(&np->lock)` |
      | t3 | gets the lock, sees `RUNNABLE`, sets `RUNNING`, calls [[swtch]] | returns pid 2 |
      | t4 | child (pid 2) in [[forkret]], on its own empty kernel stack | `init` returns to user mode |

      Parent and child are now running at the same time on two harts. Neither may assume
      the other has run first.

