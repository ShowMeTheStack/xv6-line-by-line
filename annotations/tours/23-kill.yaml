    protects: "`p->parent`, so that a killed child's exit and its parent's wait do not miss each other"
  - lock: "pi->lock (not taken by kkill)"
    where: "[[kernel:kkill]]"
    protects: "Nothing: kkill does not know what the victim waits on, which is why a kill can land in the check-to-sleep window"
quiz:
  - q: "Why doesn't `kkill` simply call `kexit` on the victim's behalf?"
    a: "`kexit` must run in the dying process's own thread: it closes that process's files, may sleep in `begin_op`, and finally switches away from it. The victim may be running on another hart, or hold sleep-locks or be mid-transaction; only the victim can release those safely, so it exits itself at a boundary."
  - q: "Pid 5 spins in user mode on hart 1 and never makes a system call. How long after `kill(5)` returns can it go on running, and which line kills it?"
    a: "If pid 5 is running when the flag is set, until hart 1's next timer interrupt, at most about 0.1 s; [[kernel:usertrap]] checks `killed` at [[kernel/trap.c:81]] after `devintr` and calls `kexit(-1)` before it would yield. If the kill lands while pid 5 sits `RUNNABLE` after line 86's `yield`, it runs one more slice, because `usertrap` does not re-check after `yield` returns."
  - q: "Before commit `bd77f8e`, `kill(0)` followed by `fork()` produced a child that died immediately. Explain the chain of events."
    a: "Free slots have `pid == 0`, so `kkill(0)` matched the first free slot and set its `killed`. `allocproc` doesn't clear `killed` and allocates the first free slot, so the next fork's child got that slot, and `usertrap` killed it at its first trap."
  - q: "`kkill` sets a `SLEEPING` victim `RUNNABLE` without checking what it was waiting for. Why is that safe?"
    a: "Every sleep in xv6 is in a loop that re-checks its real condition after waking. Loops that could wait forever also check `killed` and return an error; the others find their condition still false and sleep again until their operation completes."
  - q: "Describe an interleaving in which a kill is not noticed by a process in `piperead` until someone writes to (or closes) the pipe."
    a: "The reader checks `killed` (0) and calls `sleep_prepare`; `kkill` then sets `killed` while the reader is still `RUNNING`, so it does not wake it; the reader's `sleep()` sees `chan` still set and sleeps. Only a real `wakeup(&pi->nread)` lets the loop re-check and see `killed`."
  - q: "Why must `kkill` compare `p->pid` while holding `p->lock`?"
    a: "The victim could be reaped and its slot reused by a new process between the comparison and setting the flag. `freeproc` changes `pid` under `p->lock`, so holding it makes compare-and-mark atomic, and an innocent new process can never be marked."
