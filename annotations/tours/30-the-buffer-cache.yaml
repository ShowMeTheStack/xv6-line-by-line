quiz:
  - q: "Child B's `bget` finds block 46 before child A's disk read has finished. Why doesn't B get stale data?"
    a: "B must take the buffer's sleep-lock, which A holds through the whole read. When B gets it, A has set `valid = 1`, so B's `bread` sees valid data and does not read again."
  - q: "Why must `bget` increment `refcnt` before releasing `bcache.lock`, not after?"
    a: "`refcnt` is how other harts' `bget` know the buffer is wanted. In the window after the release and before a late increment, another hart could see `refcnt == 0` and relabel the buffer for a different block, and the thread would then lock and use a buffer that no longer holds the block it asked for."
  - q: "What would go wrong if two harts could each miss on block 46 at the same time and get two different buffers for it?"
    a: "Each would set a bit (quite possibly the same one) in its own copy of the bitmap. The log records block numbers, not buffers, so only one copy would reach disk and the other change would be lost: a block could be handed out twice, or recorded as free while in use."
  - q: "After child A's `brelse`, block 46 has `refcnt == 2` and is not moved to the head of the LRU list. Why doesn't that matter?"
    a: "`bget` recycles only buffers with `refcnt == 0`, so a buffer in use is never chosen no matter where it is in the list. It moves to the head when its count finally reaches 0, after the commit unpins it."
  - q: "Why does `bget` never write a buffer's old contents to disk before recycling it?"
    a: "Every modified buffer is pinned by `log_write` and stays pinned until `install_trans` has written it home and unpinned it. So a buffer with `refcnt == 0` is always clean, and its old contents can be discarded."
  - q: "`NBUF` and `LOGBLOCKS` are both 30. Describe how `bget: no buffers` could happen during a commit."
    a: "If one transaction logged 30 distinct blocks, all 30 buffers would be pinned. `write_log` then calls `bread` for a log block that is not cached, `bget` finds no buffer with `refcnt == 0`, and panics. `begin_op` lets `lh.n` reach 30 only if the operations running at the end each log a full 10 new blocks; no xv6 operation logs more than about 7, so in this build it does not happen."
