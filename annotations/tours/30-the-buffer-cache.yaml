  - lock: "bcache.lock (spinlock)"
    where: "[[bget]], [[brelse]], [[bpin]], [[bunpin]]"
    protects: "Each buffer's `dev`, `blockno` and `refcnt`, and the LRU list links"
  - lock: "b->lock (sleep-lock)"
    where: "[[bget]] (acquire), [[brelse]] (release)"
    protects: "A buffer's `data` and `valid`: one thread works on a block's contents at a time, across disk reads"
  - lock: "b->lock.lk (spinlock inside the sleep-lock)"
    where: "[[acquiresleep]], [[releasesleep]], [[holdingsleep]]"
    protects: "The sleep-lock's `locked` flag and holder pid"
  - lock: "ip->lock (sleep-lock)"
    where: "[[writei]]'s caller ([[filewrite]] via [[ilock]])"
    protects: "Each child's own inode; different inodes, so the children are not serialized until block 46"
  - lock: "disk.vdisk_lock (spinlock)"
    where: "[[virtio_disk_rw]], [[virtio_disk_intr]] (step 9, [[tour:29]])"
    protects: "The virtio rings and each buffer's `disk` flag"
  - lock: "p->lock (spinlock)"
    where: "[[sleep_prepare]], [[sleep]], [[wakeup]]"
    protects: "Child B's `chan` and `state` while it waits for the buffer's sleep-lock and is woken by `releasesleep` (and child A's while it waits for the disk)"
  - lock: "log.lock (spinlock)"
    where: "[[log_write]], taken before `bcache.lock` in [[bpin]]"
