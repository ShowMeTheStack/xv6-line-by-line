quiz:
  - q: "`argaddr` performs no check on the address it returns. Why is that not a security hole?"
    a: |
      The address is never dereferenced. It is only ever passed to [[copyin]],
      [[copyout]] or [[copyinstr]], which translate it through the process's page table
      and check every page at the moment they read or write it. A check in `argaddr` would
      be redundant.
  - q: "`cat`'s page table maps `TRAPFRAME`. What stops `open((char *)TRAPFRAME, 0)` from making the kernel read `cat`'s trapframe, and why does the same check matter even more for `read`?"
    a: |
      [[walkaddr]] returns 0 for any page without `PTE_U`, and [[vmfault]] then refuses
      because `TRAPFRAME` is above `p->sz`. Reading is the lesser danger: the same check in
      [[copyout]] is what stops `read(fd, (char *)TRAPFRAME, n)` from overwriting
      `kernel_trap` or `kernel_satp`, which would let `cat` choose where the next trap
      jumps in supervisor mode.
  - q: "Why does `walkaddr` test `va >= MAXVA` itself instead of leaving it to `walk`?"
    a: |
      [[walk]] panics on such an address. The value comes from a user program, and no user
      argument may be able to panic the kernel. `walkaddr` turns it into an ordinary
      "not mapped" result.
  - q: "A user passes a path of exactly 128 non-NUL bytes. What does `copyinstr` write into `path`, and why must it not write a 129th byte?"
    a: |
      It copies 128 bytes into `path[0..127]`, runs out of `max` before finding a NUL,
      and returns -1. `path` has only 128 bytes; a NUL at `path[128]` would overwrite
      whatever lies next on the kernel stack.
  - q: "`pipewrite` calls `copyin` while holding the spinlock `pi->lock`. What property of `copyin` makes that safe, and what would go wrong without it?"
    a: |
      `copyin` never sleeps: at worst it calls [[kalloc]], which holds `kmem.lock` briefly.
      If it could sleep while `pi->lock` is held (with interrupts off), another hart
      spinning for `pi->lock` could wait indefinitely, and sleeping with a spinlock held
      breaks xv6's scheduler rules ([[sched]] panics unless only `p->lock` is held).
  - q: "xv6 processes are single-threaded, so nothing can change `cat`'s memory while `cat` is in `sys_open`. Why is copying the path once into `path` still the right design?"
    a: |
      It makes the kernel's correctness independent of what user memory does later: every
      check and every use sees the same bytes, even across sleeps in [[namei]]. In a
      kernel with multithreaded processes or shared memory, re-reading user memory after
      checking it is a time-of-check to time-of-use bug; with one copy, it cannot arise.
