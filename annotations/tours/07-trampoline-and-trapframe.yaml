      `init`'s `main` starts with `open("console", O_RDWR)` ([[user/init.c:19]]). The stub
      loads `a7 = 15` (`SYS_open`) at `0x3b2` and executes `ecall` at `0x3b4`. The hardware
      does what [[tour:5]] described: supervisor mode, interrupts off, `sepc = 0x3b4`,
      `scause = 8`, `pc = stvec = 0x3ffffff000`.

      What matters for this tour is what the hardware does **not** do. At the first
      instruction of [[uservec]], gdb sees:

      | Register | Value | Still… |
      |---|---|---|
      | `satp` | `0x8000000000087f52` | init's page table |
      | `sp` | `0x3fb0`, in init's user stack | a user pointer |
      | `tp` | `0x0505050505050505` | init's junk, not a hart ID |
      | `a0` | `0x970` | the address of the string `"console"` |
      | `a1` | `2` | `O_RDWR` |
      | `a7` | `15` | `SYS_open` |

      Every one of the 31 registers is a value `init` will want back. The trampoline must
      store them somewhere, but storing needs an address in a register, and every register
      is taken.

  - title: sscratch buys one free register
    file: kernel/trampoline.S
    lines: 16-38
    focus: 30-37
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "init's user `sp`, `0x3fb0`; `uservec` never pushes"}
      irq: 0
    note: |
      The way out is [[g:csr:sscratch|sscratch]], a 64-bit CSR that the hardware never reads
      or writes on its own: it exists for trap handlers to stash one value. `csrw sscratch,
      a0` (`14051073`) moves the user's `a0` (`0x970`) out of the way, and `a0` is free.

      The next three instructions put `TRAPFRAME` into `a0`. They work for every process
      without knowing which process trapped, because every user page table maps
      `0x3fffffe000` to *that* process's own trapframe. The hardware's translation, through
      the still-installed user `satp`, does the "which process?" lookup for free.

      Other kernels use `sscratch` differently. Linux on RISC-V, for example, keeps a pointer
      to per-thread kernel data in `sscratch` while user code runs and swaps it into a
      register (into `tp`) with one `csrrw`. xv6 needs no such pointer, because the fixed `TRAPFRAME`
      address plays that role; `sscratch` is only a parking spot for a few instructions.
      (Its value is never cleared: during the whole system call, `sscratch` on hart 0 still
      holds `0x970`.)
    others: |
      Interrupts went off with the `ecall` and stay off for all of `uservec`, so no
      interrupt can arrive and overwrite `sscratch`, `sepc` or `scause` while they hold
      values not yet saved. That is the only thing protecting them: there is no lock, and
      none is needed, because each hart has its own copy of every one of these CSRs.

  - title: Thirty-one stores into init's page
    file: kernel/trampoline.S
    lines: 39-74
    focus: 40-73
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "init's user `sp`, `0x3fb0`, saved by `sd sp, 48(a0)` on line 41"}
      irq: 0
    note: |
      Each `sd reg, offset(a0)` writes one register into physical page `0x87f56000`. The
      assembler chose compact encodings where it could: `sd s0,96(a0)` is the 2-byte `f120`,
      `sd ra,40(a0)` the 4-byte `02153423`. The whole of `uservec` is `0x9c` = 156 bytes.

      Two orderings are forced:

      - `t0` must be saved (line 44) before it is used as scratch on line 72 to bring the
        user `a0` back from `sscratch`.
      - All stores must happen before line 92 switches `satp`, because only the user page
        table maps `TRAPFRAME`.

      What if one of these stores faulted? `stvec` still points at `uservec`. The fault
      would re-enter the trampoline, overwrite `sscratch` with the trapframe address, and
      the user's `a0` would be lost, then fault again forever. That is why the trapframe is
      mapped in [[proc_pagetable]] before the process ever runs, and every table the process
      ever runs on maps it: [[proc_freepagetable]] unmaps it only from a table that will
      never be installed again (the old one after `exec`, or the last one after `exit`). The code is correct
      because it *cannot* fault, not because it handles faults.

      At the end, the trapframe holds `a0 = 0x970`, `a1 = 2`, `a7 = 15`, `sp = 0x3fb0`. The
      `epc` slot still says `0xbc` from `kexec`; the real trap PC `0x3b4` is still only in
      `sepc`, and [[usertrap]] will copy it in C.

  - title: Picking up the kernel's message
    file: kernel/trampoline.S
    lines: 75-86
    focus: 76-85
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "after line 76, `sp` holds `0x3fffffe000`, the empty top of `KSTACK(0)`, but the user page table does not map it; it becomes usable after `csrw satp` on line 92"}
      irq: 0
    note: |
      Now the four fields that [[prepare_return]] left read back in:

      | Instruction | Loads | Value for init |
      |---|---|---|
      | `ld sp, 8(a0)` | kernel stack top | `0x3fffffe000` |
      | `ld tp, 32(a0)` | hart ID | `0` |
      | `ld t0, 16(a0)` | [[usertrap]] | `0x800025ca` |
      | `ld t1, 0(a0)` | kernel `satp` | `0x8000000000087fff` |

      Look at `sp`: `0x3fffffe000`. Under init's table that address is, by the coincidence
      from step 6, init's own trapframe; the stack page below it, where pushes would land,
      is not mapped at all. That is fine, because nothing pushes before the switch. Five
      instructions later, at `csrw satp`, it becomes a perfectly good kernel address.

      All four loads must come before the `satp` switch two instructions after the last of
      them, because after it `TRAPFRAME` is no longer mapped; their order among themselves
      does not matter. (In the kernel page table, as we saw, `0x3fffffe000` is a guard
      page.)
    others: |
      These four values were written on whichever hart last returned `init` to user mode.
      `kernel_hartid` is only right because a process in user mode never moves between
      harts; see [[tour:5]]. The other three are the same no matter which hart reads them.

  - title: The floor changes, the code keeps running
    file: kernel/trampoline.S
    lines: 87-98
    focus: 92-95
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: kernel
      locks: []
      stack: [uservec]
      sp: {"on": kernel, switched: "`csrw satp` ([[kernel/trampoline.S:92]]) makes the stack loaded on line 76 reachable", detail: "`0x3fffffe000`, now mapped by the kernel page table"}
      irq: 0
    note: |
      `sfence.vma` (`12000073`), `csrw satp, t1` (`18031073`), `sfence.vma`. This is the
      mirror image of the switch in `userret`, and now the stale-TLB danger runs the other
      way: the hart has been using init's translations, and the kernel must not see them.
      Most of init's translations have `PTE_U`, and supervisor mode cannot use those (xv6
      never sets `SUM`). If the kernel touched the UART at `0x10000000` while a stale user
      entry for a large heap was cached, it would take a spurious page fault and panic. The
      one stale entry the kernel *could* use is `TRAPFRAME`, which has no `PTE_U`: a stray
      kernel access to `0x3fffffe000`, which should hit the unmapped page above init's
      kernel stack and fault, would instead silently reach this process's trapframe.

      Here is the address space before and after line 92, as seen from this hart:

      | Virtual address | Under init's table | Under the kernel table |
      |---|---|---|
      | `0x0`–`0x3fff` | init's code, data, stack | unmapped |
      | `0x80006000` | unmapped | trampoline (as kernel text) |
      | `0x3fffffd000` | unmapped | init's kernel stack |
      | `0x3fffffe000` | init's trapframe | unmapped (guard) |
      | `0x3ffffff000` | **trampoline** | **trampoline** |

      Only the last row survives the switch, and the `pc` is in it. That single row is the
      whole reason the trampoline exists. The third row is what makes `sp` usable: the
      `0x3fffffe000` loaded on line 76 is the top of a page that is mapped only under the
      kernel table, so [[usertrap]]'s prologue can move `sp` to `0x3fffffdfe0` and store `ra`
      at `0x3fffffdff8`, inside init's kernel stack.
    others: |
      The kernel page table this hart just installed is the same one harts 1 and 2 are
      using: one table, three `satp` registers pointing at it. Sharing it without a lock is
      safe because it is never modified after boot. Kernel stacks for all 64 process slots
      were mapped into it once, by [[proc_mapstacks]], precisely so that it never has to
      change when processes come and go.

  - title: jalr t0 and the return address that is userret
    file: kernel/trampoline.S
    lines: 96-104
    focus: 97-98
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: kernel
      locks: []
      stack: [uservec]
      sp: kernel
      irq: 0
    note: |
      `jalr t0` is the 2-byte instruction `9282` at `0x3ffffff09a`. It jumps to
      `0x800025ca` and stores the address of the next instruction in `ra`:
      `0x3ffffff09a + 2` = `0x3ffffff09c`. That is [[userret]], at its trampoline address.
      gdb, stopped at the first line of [[usertrap]], shows exactly `ra = 0x3ffffff09c`.

      So `usertrap` is an ordinary C function called with an ordinary return address. When
      it finishes with `return satp;`, its compiled `ret` jumps to `userret`, with the
      return value in `a0` as the [[g:calling-convention]] says. No special exit code is
      needed: the way back is set up by the way in.

      Why not `call usertrap`? `call` assembles to a PC-relative `auipc`/`jalr` pair. The
      linker computed the offset assuming this code runs at `0x80006000`; it runs at
      `0x3ffffff000` instead, so the jump would land about 254 GiB above `usertrap`, at
      `0x3fffffb5ca`, which happens to be inside `proc[1]`'s kernel stack. That page is not
      executable, so the fetch would fault (and with `stvec` still pointing at `uservec`,
      loop). Loading the absolute address from the trapframe works from any
      location.

      After checking that the trap came from user mode, `usertrap` points `stvec` at
      [[kernelvec]]: from now on, traps on
      this hart are kernel traps ([[tour:8]]).
    others: |
      `ra` is saved on init's *kernel stack* by `usertrap`'s prologue. If the system call
      sleeps and `init` resumes on hart 2, the frame, and `ra = 0x3ffffff09c` in it, come
      along. `userret` exists at that address on every hart, so the return works wherever
      `usertrap` finishes.

  - title: usertrap hands back the user satp
    file: kernel/trap.c
    lines: 80-95
    focus: 90-94
    state:
      hart: 0
      mode: S
      proc: init (pid 1)
      intr: off
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: kernel
      irq: 0
    note: |
      After [[sys_open]] returns (file descriptor 0, stored into `trapframe->a0`; on a
      brand-new `fs.img` it would be -1, see the summary), `usertrap`
      calls [[prepare_return]], which redoes the four kernel fields and arms `sret`, and
      computes `MAKE_SATP(p->pagetable)`. The C `return` delivers it in `a0` to `userret`.

      This is the trapframe's other half of the bargain. On the way in, the kernel fields
      told `uservec` how to reach the kernel. On the way out, the user-register fields tell
      `userret` what to give back, with three possible edits made in between: `epc`
      advanced past the `ecall`, `a0` replaced by the result, and, after an `exec`,
      `epc`, `sp`, `a1` and `a0` set for the new program (the other registers keep whatever
      the old program had).

      (`open` had to read `console`'s inode from disk, so `init` slept; it may finish this
      system call on any hart. We show hart 0.)

      Note why `satp` is computed *here*, at the end, and not saved at entry: a system call
      can change the page table. After a successful `exec`, `p->pagetable` is a brand-new
      table, and `userret` must switch to it, not to the one the process trapped from. The
      trampoline and trapframe rows in the new table are the same as in the old one, so
      `userret` still works.

  - title: Three harts in the trampoline at once
    file: kernel/trampoline.S
    lines: 22-98
    focus: 30-73
    state:
      hart: [0, 1, 2]
      mode: S
      proc: cat (pid 4), grep (pid 6), wc (pid 7)
      intr: off
      satp: user
      locks: []
      stack: [uservec]
      sp: {"on": none, detail: "three different user `sp` values, one per hart, until each hart's `ld sp` at t4"}
      irq: 0
    note: |
      Later, you type `cat README | grep the | wc`. If it is the first command since boot,
      [[allocproc]] hands out process slots in order: `cat` (pid 4) is `proc[3]`, `grep`
      (pid 6) is `proc[5]`, `wc` (pid 7) is `proc[6]`. All three are runnable, and each hart
      runs one. At the same instant, `cat` calls `write`, a timer interrupt hits `grep`, and
      `wc` calls `read`:

      | Time | Hart 0 (`cat`) | Hart 1 (`grep`) | Hart 2 (`wc`) |
      |---|---|---|---|
      | t1 | `ecall` → `pc = 0x3ffffff000` | timer interrupt → `pc = 0x3ffffff000` | `ecall` → `pc = 0x3ffffff000` |
      | t2 | `csrw sscratch, a0` (hart 0's) | `csrw sscratch, a0` (hart 1's) | `csrw sscratch, a0` (hart 2's) |
      | t3 | `sd`s to `0x3fffffe000` → cat's page | `sd`s to `0x3fffffe000` → grep's page | `sd`s to `0x3fffffe000` → wc's page |
      | t4 | `ld sp` = `0x3fffff8000` | `ld sp` = `0x3fffff4000` | `ld sp` = `0x3fffff2000` |
      | t5 | `satp` ← kernel table | `satp` ← kernel table | `satp` ← kernel table |
      | t6 | `usertrap`: [[sys_write]] | `usertrap`: [[devintr]], [[yield]] | `usertrap`: [[sys_read]] |

      Same instructions, same physical code page, same virtual addresses, no lock. Nothing
      collides, because everything *written* is private: each hart's CSRs are its own, each
      `0x3fffffe000` translates through a different page table to a different trapframe
      page, and each `sp` is the top of a different kernel stack (`KSTACK(k) + PGSIZE` =
      `0x4000000000 - 0x2000·(k+1)`).

      The highlighted lines are t2 and t3, before any `ld sp`: each hart's `sp` still holds
      its own process's user stack pointer, three different values in three different
      registers, and none of them is used. At t4 each hart moves to its own process's empty
      kernel stack. Each hart has its own `sp`, so even the stack switch needs no
      coordination.

      Imagine instead a single global save area, as a naive design might use:

      | Time | Hart 0 (`cat`) | Hart 1 (`grep`) |
      |---|---|---|
      | t1 | saves cat's registers into the area | |
      | t2 | | saves grep's registers into the same area |
      | t3 | `usertrap` reads `a7`: grep's value | |
      | t4 | returns to `cat` with grep's `sp` and `pc` | |

      `cat` would run with `grep`'s registers. A lock around the save area would not rescue
      the design: the area would have to stay locked from the trap until the return to user
      mode, across every sleep in the system call, so only one process at a time could be in
      the kernel. Per-process trapframes remove the shared data instead of protecting it:
      nothing the trampoline writes is shared, so it needs no lock at all.
    others: |
      The first shared object on any of these paths appears only in C, at t6. `cat`'s
      `write` takes the lock of the first pipe (`cat` → `grep`), and `wc`'s `read` takes the
      lock of the second (`grep` → `wc`), so even these two do not contend; only `grep`
      shares a pipe with each of them ([[tour:39]]). `grep`'s [[yield]] takes its own
      `p->lock`. Everything in the
      trampoline is lock-free by construction.

      Could another hart touch `cat`'s trapframe meanwhile? Only `cat`'s own kernel thread
      reads or writes it. [[kfork]] copies a parent's trapframe while the *parent* runs
      `fork`, into a child that is not yet runnable. And the page is freed only by
      [[freeproc]], after the process has become a zombie and stopped running anywhere.

  - title: What the border costs, and why it is built this way
    file: user/init.c
    lines: 14-30
    focus: 19-24
    state:
      hart: 0
      mode: U
      proc: init (pid 1)
      intr: on
      satp: user
      locks: []
      stack: [start, main]
      sp: {"on": user, switched: "`ld sp, 48(a0)` in [[kernel:userret]] ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]])", detail: "init's user stack; its kernel stack is empty again"}
    note: |
      `init` gets back `a0 = 0` from `open` (on a brand-new `fs.img` it would get -1, create
      the device with `mknod`, and open it again), and goes on to `dup` its console descriptor,
      fork the shell, and wait ([[tour:4]]).

      Count one round trip through the border: 2 privilege changes; 2 `satp` writes and 4
      `sfence.vma`s, each wiping this hart's whole TLB, so the first accesses on each side
      miss; 31 stores and 31 loads of user registers; 4 loads of kernel fields and 4 C
      stores in [[prepare_return]] to refill them; 1 `fence.i`; 1 `sret`. In this build,
      83 instructions run in the trampoline itself (44 in `uservec`, 39 in `userret`), and
      the TLB misses afterwards can easily cost more than all of them.

      The key ideas:

      - **Same virtual address, same physical page, every table.** The trampoline is the
        one place where the two worlds overlap, so `satp` can change mid-stream.
      - **Same virtual address, different physical page, every process.** `TRAPFRAME` lets
        identical code save into a per-process page with no lookup and no lock.
      - **The kernel leaves itself a note.** Four fields written by `prepare_return` give a
        stackless, registerless piece of assembly everything it needs.
      - **Windows closed by ordering, not by locks.** Interrupts off before `stvec` changes,
        `SIE` turned on by `sret` itself, stores before the `satp` switch, `a0` loaded last.

      Where to go next: [[tour:8]] for traps that happen while already in the kernel (which
      do not use this page at all), [[tour:9]] for device interrupts arriving through it,
      [[tour:10]] for faults, and [[tour:25]] for the rest of a user address space.
locks:
  - lock: "trampoline page (no lock: read-only code)"
    where: "[[uservec]], [[userret]] on every hart"
    protects: "Nothing to protect: mapped `R X` and never written, so any number of harts run it at once"
  - lock: "trapframe (no lock: one per process)"
    where: "[[uservec]], [[usertrap]], [[prepare_return]], [[userret]], [[syscall]]"
    protects: "A process's saved user registers and kernel fields; only that process's own thread touches it, and a thread runs on one hart at a time"
  - lock: "sscratch, stvec, sepc, sstatus, satp, TLB (no lock: per-hart hardware)"
    where: "[[uservec]], [[prepare_return]], [[userret]]"
    protects: "Each hart has its own copy; writes on one hart are invisible to the others"
  - lock: "interrupts off (not a lock, but the guard here)"
    where: "`ecall`/trap until [[intr_on]] in [[usertrap]] (system calls only; for interrupts and faults they stay off until `sret`); [[prepare_return]] until `sret`"
    protects: "`sscratch`, `sepc`, `scause` and the half-switched state from being overwritten by a nested interrupt"
  - lock: "kernel_pagetable (no lock: never modified after boot)"
    where: "[[kvmmake]] at boot; loaded into `satp` by [[uservec]] on every hart"
    protects: "Shared read-only by all harts; kernel stacks for all slots are mapped once by [[proc_mapstacks]]"
  - lock: "p->lock (spinlock)"
    where: "[[allocproc]] while [[proc_pagetable]] maps the two pages; held by the scheduler across [[swtch]] into [[forkret]]"
    protects: "A half-built or just-scheduled process from being picked by another hart's scheduler"
  - lock: "pid_lock (spinlock)"
    where: "[[allocpid]] from [[allocproc]]"
    protects: "`nextpid`"
  - lock: "kmem.lock (spinlock)"
    where: "[[kalloc]] for the trapframe page and page-table pages"
    protects: "The shared free-page list"
quiz:
  - q: "`uservec` is at physical address `0x80006000`, which the kernel page table also maps. Why does `prepare_return` put `0x3ffffff000` in `stvec` instead of `0x80006000`?"
    a: "When the trap arrives, the user page table is still installed, and it maps the trampoline only at `0x3ffffff000` (and nothing at `0x80006000`). The first instruction must be fetchable under the user table, and the code must stay fetchable after `satp` switches to the kernel table, which `0x3ffffff000` is in both."
  - q: "What would go wrong if `prepare_return` wrote `stvec` first and turned interrupts off afterwards?"
    a: "A timer interrupt in between would vector to `uservec` while the kernel page table is installed and the registers hold kernel values. `uservec` would treat kernel registers as user state and store to `TRAPFRAME`, which is unmapped in the kernel table, faulting back into `uservec` repeatedly."
  - q: "Two harts execute `sd ra, 40(a0)` with `a0 = 0x3fffffe000` at the same instant. Why do they not overwrite each other, and why is no lock needed?"
    a: "Each hart is translating through a different process's page table (its own `satp`), in which `0x3fffffe000` maps to that process's own trapframe page. The stores go to different physical memory. Nothing written in the trampoline is shared: CSRs are per hart and trapframes are per process."
  - q: "After `usertrap` handles a system call that slept and finished on a different hart, how does control get back to `userret`, and why does it still work?"
    a: "`jalr t0` put `ra = 0x3ffffff09c` (`userret`'s trampoline address), which `usertrap`'s prologue saved on the process's kernel stack. That stack travels with the thread, and `0x3ffffff09c` is mapped in the shared kernel page table seen by every hart, so the `ret` lands in `userret` wherever it executes. `prepare_return` has meanwhile recorded the new hart in `kernel_hartid`."
  - q: "Why does `userret` take the `satp` value as an argument from `usertrap`, rather than reading back the value `uservec` switched away from?"
    a: "The system call may have replaced the page table: after a successful `exec`, `p->pagetable` is a new table, so the correct `satp` is only known at the end. Both tables map the trampoline and the trapframe at the same addresses, so `userret` continues to work after the switch."
  - q: "xv6 uses ASID 0 for every address space. What could happen if the `sfence.vma` after `csrw satp` in `uservec` were removed?"
    a: "The TLB could still hold init's translations, under the same ASID 0 as the kernel's. Most have `PTE_U`, which S-mode cannot use with `SUM` = 0: a kernel access that hit one (the UART at `0x10000000`, if the process's heap reaches that far) would take a spurious page fault and panic instead of reaching the device. The one stale entry without `PTE_U` is `TRAPFRAME`: a stray kernel access to `0x3fffffe000`, which should fault, would silently read or write this process's trapframe."
