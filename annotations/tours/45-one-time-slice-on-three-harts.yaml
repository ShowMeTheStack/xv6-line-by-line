quiz:
  - q: "Rows 3 and 12 both say \"no usable stack\", yet in row 3 (after `ld sp`) and in row 12 (from `csrw satp` until `ld sp`) `sp` holds a valid kernel-stack address. Why is it unusable, and why is the order of `ld sp` and `csrw satp` reversed between the two?"
    a: "The address is mapped only in the kernel page table, and in both rows `satp` names a user page table. The order is forced by the trapframe: `ld sp, 8(a0)` and `ld sp, 48(a0)` both read through `TRAPFRAME`, which only the user page table maps. So `uservec` must load the kernel `sp` before switching to the kernel table, and `userret` must switch to the user table before it can load the user `sp`. A consequence is that the user's `sp` value is never paired with the kernel page table. The trampoline uses no stack in either stretch, nor after `userret` loads the user `sp`: that becomes usable only at `sret` (row 13)."
  - q: "In row 16 the scheduler picked A rather than going back to `proc[0]`. What in the code makes it continue from `proc[4]`, and what would have happened if B had been in `proc[5]` instead of `proc[3]`?"
    a: "The scheduler's `for` loop resumes after the `swtch` that ran B, with `p = proc[3]`, and simply moves on to `p + 1`. If B were in `proc[5]`, the scan would continue at `proc[6]` (pid 7, running), reach the end of the table, wrap around, and find A at `proc[4]` a little later. A would still run, just after a longer scan."
  - q: "B's `read` was entered on hart 2 with interrupts on, and A's tick entered with interrupts off. When each resumed in `sched`, what decided whether interrupts would come back on, and where is that value kept while the process is suspended?"
    a: "`sched` saves `mycpu()->intena` in a local variable before `swtch` and restores it after ([[kernel/proc.c:494-496]]). The local lives on the process's own kernel stack (or in a callee-saved register that `swtch` saves in `p->context`), so it travels with the thread, not the hart. A's was 0 and B's was 1."
  - q: "B killed A in row 14, yet A returned to user mode in row 18 and executed more instructions. Point to the line that lets this happen, and explain why it is harmless."
    a: "[[usertrap]] checks `killed` at line 81, before `yield`, and not again after `yield` returns; it goes straight to `prepare_return`. It is harmless because A gets no further than its next trap: any trap runs `usertrap`, which checks `killed` and calls [[kexit]]. A process can only be removed while it is in the kernel, so delaying it by one tick costs nothing but time."
  - q: "Count the `csrw satp` instructions hart 2 executed in this slice without looking back, using only the T-numbers: T4 1, T1 21, T5 22, T6 4, T7 16."
    a: "Every entry from user mode (T1–T4) executes one in `uservec`, and every T5 executes one in `userret`: 1 + 21 + 22 = 44. T6 (`swtch`) and T7 (`kernelvec`) execute none, because they stay in the kernel page table."
  - q: "Hart 0's timer fires during B's slice (row 14). Describe what changes in this tour's ending, and which lock makes the outcome safe either way."
    a: "Hart 0's scheduler would take A at `proc[4]` (as in [[tour:11]]) and resume it on hart 0, using the same kernel stack `KSTACK(4)` from hart 0. Later, hart 2's scan would reach `proc[4]`, find `RUNNING`, and skip it. A's `p->lock` makes the claim indivisible: only one scheduler can change A from `RUNNABLE` to `RUNNING`."
