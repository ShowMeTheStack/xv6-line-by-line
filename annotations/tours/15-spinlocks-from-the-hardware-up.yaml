quiz:
  - q: "Why does `acquire` turn interrupts off *before* the `amoswap`, not after it?"
    a: "If the swap came first, there would be a window in which this hart holds the lock with interrupts still on. An interrupt in that window whose handler wants the same lock would spin on a lock held by the code it interrupted."
  - q: "Hart 2 holds a `p->lock` and then takes `kmem.lock`. When it releases `kmem.lock`, why do interrupts stay off?"
    a: "`push_off` counts nesting in `noff`. Releasing `kmem.lock` takes `noff` from 2 to 1, and [[pop_off]] only turns interrupts on when `noff` reaches 0 and `intena` (saved at the outermost `push_off`) is 1. That happens when the `p->lock` is released."
  - q: "Replace the `amoswap` loop with `while (lk->locked) ; lk->locked = 1;`. Trace an interleaving that breaks mutual exclusion."
    a: "Both harts load `locked == 0`, both leave the loop, both store 1 and both enter the critical section. Testing and setting must be one indivisible operation, which `amoswap` provides."
  - q: "`release` executes `fence rw,w` before `sw zero,0(s1)`. What could another hart observe if the fence were missing?"
    a: "It could see `locked == 0` before the stores of the critical section (for example the new `kmem.freelist`), acquire the lock and read stale data, handing out the same page twice. The fence orders every earlier load and store before the freeing store."
  - q: "A timer interrupt is pending on hart 1 while it holds `kmem.lock`. When is it taken, and why is that safe?"
    a: "It stays pending (interrupts are off) until `pop_off` in `release` turns them on. Then the hart holds no spinlock, so [[yield]] and [[sched]] are allowed and no handler can find a lock held by the code it interrupted."
  - q: "`holding()` reads `lk->cpu` without any atomic or lock while another hart may be writing it. Why is its answer reliable?"
    a: "Only this hart ever writes its own `struct cpu` pointer into `lk->cpu`, and with interrupts off nothing else on this hart can run while it checks. Another hart can only write its own pointer or 0, so the comparison with `mycpu()` is true exactly when this hart holds the lock."
