    note: |
      Scene 4 needs a kernel bug, so we planted one in a scratch copy: line 109 became
      `xticks = *(volatile uint *)0;`, and a two-line program `up`, also only in that scratch copy, called `uptime()`. The
      planted load compiled to `lw a5,0(zero)` at `0x80002ae6` in that build.

      The kernel page table maps nothing at virtual address 0 (its lowest mapping is the
      PLIC at `0x0c000000`), so the load raises a **load page fault**, `scause = 13`,
      `stval = 0`, exactly as a user load would. Exceptions cannot be masked: interrupts are
      off (the hart holds `tickslock`, a spinlock) but the fault happens anyway. `SIE`
      controls only *interrupts*.

      The trap came from supervisor mode, so `stvec` points at [[kernelvec]], not the
      trampoline ([[usertrap]] set it on entry). `kernelvec` pushes the registers on pid 3's
      kernel stack, right below `sys_uptime`'s frame, and calls [[kerneltrap]]. That entry
      path is [[tour:8]].

      Note what the hart is holding: `tickslock`. It will never release it.

  - title: kerneltrap has no repair to offer
    file: kernel/trap.c
    lines: 134-164
    focus: 140-153
    state:
      hart: 2
      mode: S
      proc: up (pid 3)
      intr: off
      satp: kernel
      locks: [tickslock]
      stack: [usertrap, syscall, sys_uptime, kernelvec, kerneltrap]
      sp: {"on": kernel, detail: "a 256-byte `kernelvec` frame now sits below `sys_uptime`'s"}
      irq: {noff: 1, intena: 1, note: "kerneltrap does not touch noff: sys_uptime's tickslock level is still counted"}
    note: |
      The fault did not change stacks. [[kernelvec]]'s `addi sp, sp, -256`
      ([[kernel/kernelvec.S:14]]) pushed its register frame onto the stack that was already
      in use, pid 3's kernel stack:

      ```text
      pid 3's kernel stack
        top ─► usertrap
               syscall
               sys_uptime
               kernelvec    256-byte register frame
               kerneltrap  ◄─ sp
      ```

      [[kerneltrap]] reads `sepc`, `sstatus` and `scause`, checks that the trap really came
      from supervisor mode (`SPP = 1`) and that interrupts are off (the trap turned `SIE` off),
      and then asks [[devintr]] whether this was a device. `scause = 13` is not an
      interrupt, so `devintr` returns 0.

      In user mode, that would lead to "kill the process". In the kernel there is no such
      option. The kernel has no `vmfault` path of its own and no other plan: a fault in
      kernel code means a kernel bug, and the half-finished operation (here, a critical
      section holding `tickslock`) cannot be safely abandoned or retried. So it prints the
      evidence and panics. Our run:

      ```
      scause=0xd sepc=0x80002ae6 stval=0x0
      panic: kerneltrap
      ```

      The first line is an ordinary [[printk]]: no panic is in progress yet, so it takes
      `pr.lock` like any other line.
    others: |
      Hart 2 holds `tickslock` and will never let go. Hart 0 is the only hart that takes
      `tickslock` in [[clockintr]]. Its next timer interrupt, within about a tenth of a
      second, calls `acquire(&tickslock)` and spins forever with interrupts off. `ticks`
      stops; `pause()`ing processes never wake. A panic on one hart quietly takes others
      down through the locks it held, which is one more reason the only safe response is to
      stop. In the run we follow, hart 2 took the fault; in other runs it is hart 0 or 1. If
      hart 0 itself panics, nothing spins on `tickslock`: `ticks` simply stops.

  - title: panic sets two flags and never returns
    file: kernel/printk.c
    lines: 137-146
    focus: 140-145
    state:
      hart: 2
      mode: S
      proc: up (pid 3)
      intr: off
      satp: kernel
      locks: [tickslock]
      stack: [usertrap, syscall, sys_uptime, kernelvec, kerneltrap, panic]
      sp: {"on": kernel, detail: "hart 2 will spin on pid 3's kernel stack forever"}
      irq: {noff: 1, intena: 1, note: "tickslock is never released: noff stays 1 on this hart for good"}
    note: |
      [[panic]] does four things:

      1. `panicking = 1`. From now on, `printk` on **every** hart skips `pr.lock`, and
         [[uartputc_sync]] skips its [[push_off]]/[[pop_off]] (a `printk` already past that
         check keeps the lock it took or is waiting for).
      2. Print `panic: kerneltrap`, in two `printk` calls, without the lock.
      3. `panicked = 1`: freeze every other hart that tries to print.
      4. Spin forever. Interrupts are off, so nothing will ever run on hart 2 again.

      Why must the panic message bypass `pr.lock`? Because the panicking hart may already
      hold it. If the fault had happened inside `printk` itself, or if `printk` were the
      caller that tripped [[acquire]]'s own `panic("acquire")` check, a panic that called
      `acquire(&pr.lock)` would find the lock held by its own hart: `acquire` would
      `panic("acquire")` again, recursively, and never print a word. Another hart holding
      the lock forever (frozen in the middle of a line) would block it the same way. The one
      message that matters most must not depend on a lock.

      Both flags are `volatile int`, so each check in `printk` and `uartputc_sync` really
      reads memory, not a copy the compiler kept in a register.

  - title: Other harts freeze the moment they print
    file: kernel/uart.c
    lines: 98-120
    focus: 105-111
    state:
      hart: 0
      mode: S
      proc: hypothetical faulting process (pid 7)
      intr: off
      satp: kernel
      locks: [pr.lock]
      stack: [usertrap, printk, consputc, uartputc_sync]
      sp: kernel
      irq: {noff: 1, intena: 0, note: "pr.lock's level, plus one more only if `panicking` flipped in the middle of a uartputc_sync (its pop_off is then skipped); once the flag is seen at line 105, no push_off"}
    note: |
      This scene is hypothetical: a second process, pid 7, faults on hart 0 just as hart 2
      panics. `panic` does not stop the other harts directly. xv6 has no inter-processor interrupt to
      send them. Instead, every path that prints to the UART synchronously checks the flags:

      - `panicking` set: no `push_off`/`pop_off`. The interrupt bookkeeping is skipped.
      - `panicked` set: spin forever, right here, before writing the character.

      So a hart keeps running processes after another hart has panicked, until the moment it
      tries to emit a character through [[uartputc_sync]] (kernel `printk`, or the echo of a
      typed key in [[consoleintr]]), or until it blocks on a lock the dead hart held. The
      console usually shows a `panic:` line as the last thing on the screen (possibly mixed
      with one in-flight line, see below) instead of a mess.

      This is a simplification of "stop the machine", and an honest one: user `write`s go
      through [[uartwrite]], which does not check `panicked`, so in principle a user program
      on a still-running hart could print after the panic message.
    others: |
      Two harts printing while hart 2 panics:

      | Time | Hart 0 (pid 7 faults) | Hart 2 (kernel fault) |
      |---|---|---|
      | t1 | `printk`: takes `pr.lock`, prints `usertrap(): ... pid=7` | `kerneltrap` → `printk`: spins on `pr.lock` |
      | t2 | releases `pr.lock`; its second `printk` sees `panicking == 0` and spins in `acquire` | takes `pr.lock`, prints `scause=0xd ...` |
      | t3 | gets `pr.lock` as hart 2 releases it; starts printing `   sepc=...` | releases `pr.lock`, sets `panicking = 1`, prints `panic: ` without the lock |
      | t4 | still printing `sepc=...`, holding `pr.lock` | still printing `kerneltrap` |
      | t5 | characters from both harts interleave on the UART | `panicked = 1`, spins forever |
      | t6 | next `uartputc_sync` sees `panicked`: spins forever; `pr.lock` is never released, because `printk` skips the release once `panicking` is 1 | |

      Between t3 and t5 hart 0 holds `pr.lock`, but hart 2's panic `printk` ignores it, so
      the two harts' characters can mix. xv6
      accepts that: a garbled line during a panic is better than a panic that never prints.
      After t6 both harts are frozen. Hart 1 keeps running until it next prints, or until it
      needs `tickslock`, which hart 2 will never release.

  - title: Three outcomes of one question
    file: kernel/trap.c
    lines: 37-95
    focus: 69-79
    state:
      hart: any
      mode: S
      proc: the faulting process
      intr: off
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: kernel
      irq: 0
    note: |
      Every exception in this tour reached one question: *can the kernel make this
      instruction succeed?*

      | Fault | Who answers | Outcome | Cost |
      |---|---|---|---|
      | store to a promised page (`lazy_alloc`) | [[vmfault]]: below `p->sz`, not mapped | page allocated, instruction retried | one trap, `kmem.lock`, a zeroed page |
      | store to read-only text (`nowrite`) | `vmfault`: already mapped | `usertrap(): unexpected scause 0xf`, `kexit(-1)` | two `printk` lines, `p->lock`, `wait_lock` |
      | illegal instruction (`csrr mhartid`) | nobody: not a page fault | killed, `scause 0x2` | same as above |
      | kernel load from address 0 | [[kerneltrap]]: nothing to try | `panic: kerneltrap`, machine stops | everything |

      The key ideas: `sepc` points at the faulting instruction, so a repaired fault is
      invisible; `p->sz` is the kernel's record of what the process is owed, and the PTE
      bits say how it may be used; a user fault costs the user its process, never the
      kernel its life; a kernel fault costs everything, and `panic` is written to need no
      lock because it may already be holding them. And with three harts, even dying is a
      concurrent operation: the other harts stop only when they next touch the console or
      a lock the dead hart kept.
locks:
  - lock: "kmem.lock (spinlock)"
    where: "[[kalloc]] from [[vmfault]], and from [[walk]] when [[mappages]] needs a page-table page; [[kfree]] if `mappages` fails"
    protects: "The free-page list shared by all harts: no two faults get the same page"
  - lock: "p->sz and the user page table (no lock)"
    where: "[[sys_sbrk]], [[vmfault]], [[mappages]]"
    protects: "Changed only on behalf of the process itself, which is single-threaded; other harts never touch them while it is alive"
  - lock: "pr.lock (spinlock)"
    where: "[[printk]], only while `panicking == 0`"
    protects: "One formatted line at a time on the console; not a multi-line message"
  - lock: "p->lock (spinlock)"
    where: "[[setkilled]], [[killed]], [[kkill]], [[kexit]]"
    protects: "`p->killed` and `p->state`: a kill set on one hart is seen on another"
  - lock: "wait_lock (spinlock)"
    where: "[[kexit]]"
    protects: "Parent links while the dying child reparents and wakes its parent"
  - lock: "ftable.lock (spinlock)"
    where: "[[fileclose]]"
    protects: "Taken by [[kexit]]; see [[tour:21]]"
  - lock: "log.lock (spinlock)"
    where: "[[begin_op]], [[end_op]]"
    protects: "Taken by [[kexit]]; see [[tour:21]]"
  - lock: "itable.lock (spinlock)"
    where: "[[iput]]"
    protects: "Taken by [[kexit]]; see [[tour:21]]"
  - lock: "every other process's p->lock"
    where: "[[wakeup]] from [[kexit]]"
    protects: "`p->chan` and `p->state` while waking the parent; see [[tour:21]]"
  - lock: "tickslock (spinlock)"
    where: "[[sys_uptime]], [[clockintr]]"
    protects: "`ticks`; in scene 4 it is held forever by the panicked hart, so hart 0's clock interrupt spins on it"
  - lock: "panicking, panicked (no lock: volatile flags)"
    where: "[[panic]], [[printk]], [[uartputc_sync]]"
    protects: "Written once by the panicking hart and only ever set, never cleared; a lock would deadlock a hart that panics while holding pr.lock"
  - lock: "sepc, scause, stval (no lock: per-hart CSRs)"
    where: "[[usertrap]], [[kerneltrap]]"
    protects: "Each hart has its own trap CSRs, so simultaneous faults on three harts never see each other's values"
quiz:
  - q: "After `vmfault` maps the page, why does `usertrap` not add 4 to `p->trapframe->epc`, as it does for a system call?"
    a: "For `ecall` the instruction has completed and execution must continue after it. A faulting store has *not* happened; `sepc` points at it, and it must run again now that the page exists. Adding 4 would silently skip the store."
  - q: "`vmfault` returns 0 if the page is already mapped. Which fault in this tour depends on that check, and what would happen without it?"
    a: "The `nowrite` store to address 0: the text page is valid but read-only. Without the `ismapped` check, `vmfault` would call `mappages` on a valid PTE and hit `panic(\"mappages: remap\")`, so a user program could crash the kernel by writing to its own code."
  - q: "Why does `vmfault` test `va >= psz` *before* calling `ismapped`?"
    a: "`ismapped` calls `walk`, which panics for `va >= MAXVA`. A user can make `stval` anything, for example `0xffffffffffffffff`. Since `psz` never exceeds `TRAPFRAME`, the size check rejects every such address before it reaches `walk`."
  - q: "Two harts take lazy page faults at the same moment, for two different processes. Which data do they share, and what keeps them from interfering?"
    a: "They share only the free-page list, protected by `kmem.lock` in `kalloc`. Their trapframes, kernel stacks, page tables, `p->sz` and trap CSRs are all separate, so everything else runs without locks."
  - q: "`panic` sets `panicking = 1` before printing. Describe a situation in which taking `pr.lock` inside `panic` would hang the machine without printing anything."
    a: "If the panicking hart already holds `pr.lock` (it faulted inside `printk`), `acquire` sees it is already held by this hart and calls `panic(\"acquire\")`, which would try the lock again, forever. If another hart holds it and is frozen, `acquire` would spin forever. Skipping the lock lets the message out in both cases."
  - q: "In scene 4 the planted bug faults while holding `tickslock` on hart 2. Trace what happens to hart 0 over the next tenth of a second."
    a: "Hart 0's next timer interrupt enters `clockintr`, which on hart 0 calls `acquire(&tickslock)`. Hart 2 will never release it, so hart 0 spins in `acquire` forever with interrupts off. `ticks` stops advancing, and any process in `pause()` never wakes."
