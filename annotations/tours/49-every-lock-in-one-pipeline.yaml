quiz:
  - q: "Four in five spinlock acquisitions came from `wakeup`, almost all finding nobody. Why does it take every slot's `p->lock` instead of peeking at `p->chan` without the lock?"
    a: "Without it, this interleaving loses a wakeup: `sleep()` reads `chan != 0`; `wakeup` clears `chan`, sees `RUNNING` and does nothing; `sleep()` then sets `SLEEPING` and switches away, with nobody left to wake it. Holding `p->lock` makes `sleep()`'s check-then-`SLEEPING` atomic with respect to `wakeup`'s clear-then-check ([[concept:locks#sleep-wakeup]])."
  - q: "In step 13 the disk interrupt arrived before `sleep()` ran. What would happen if `wakeup` only changed `SLEEPING` processes and did not clear `p->chan`?"
    a: "`wakeup` would find `ls` `RUNNING` and do nothing. `sleep()` would then see `chan` still set, mark `ls` `SLEEPING` and switch away, waiting for an interrupt that had already come: `ls` would sleep forever. Clearing `chan` is the record that the wakeup happened."
  - q: "`tickslock` was used on hart 0 only. Why must it still be taken with interrupts off?"
    a: "`sys_uptime` and `sys_pause` take it in process context on any hart, including hart 0. If one held it on hart 0 with interrupts on, hart 0's next tick would spin forever in `clockintr` on a lock its own hart holds."
  - q: "The deepest nesting was `wait_lock` → a child's `p->lock` → `kmem.lock`. Why is it safe to take `kmem.lock` under two other locks?"
    a: "A deadlock needs a cycle. `kalloc` and `kfree` take no other lock while holding `kmem.lock`, so no path holds it and waits for `wait_lock` or a `p->lock`. A leaf lock can sit under anything."
  - q: "`ls` held an inode's and a buffer's sleep-locks across a disk read and even moved to another hart meanwhile. Why is that fine for sleep-locks but forbidden for spinlocks?"
    a: "A spinlock records the hart and keeps interrupts off on it; switching away would leave a hart owning a lock for a thread that is not running, so `sched` panics unless `noff` is 1. A sleep-lock records the pid, holds no spinlock between `acquiresleep` and `releasesleep`, and its waiters sleep instead of spinning."
  - q: "Only one of 637 `acquiresleep` calls had to wait. Which, and why did it cost so little?"
    a: "`wc`'s `exec` wanted the root directory's inode lock while `ls`'s `exec` held it during path lookup. `wc` slept on the lock's address holding no spinlock, so hart 0 was free; `ls`'s `iunlock` woke it, and it took the lock after two context switches (out and back in)."
