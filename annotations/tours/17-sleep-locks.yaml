quiz:
  - q: "Why does `bget` release `bcache.lock` *before* calling `acquiresleep(&b->lock)`, and why is the gap between those two lines safe?"
    a: "`acquiresleep` may sleep, and a process must not sleep holding a spinlock ([[sched]] panics with `sched locks`; other harts would spin with interrupts off). The gap is safe because `refcnt` was already incremented under `bcache.lock`, so the buffer cannot be recycled for another block, and anyone else wanting the same block finds this buffer and waits on its sleep-lock."
  - q: "`ls` sleeps in `virtio_disk_rw` while owning two sleep-locks. Why doesn't `sched`'s check `mycpu()->noff != 1` panic?"
    a: "`noff` counts spinlocks held by this hart. Each sleep-lock's inner spinlock was released at the end of `acquiresleep`; owning a sleep-lock is only `locked = 1` in memory. The single spinlock held at `sched` is `p->lock`."
  - q: "The disk interrupt handler calls `wakeup(b)`. Why doesn't that wake `grep`, which is waiting for the same buffer, and why is that correct?"
    a: "`grep` sleeps on channel `&b->lock`, which is a different address (`b + 16`). The disk finishing does not make the buffer's lock free: `ls` still owns it and has not used the data yet. `grep` is woken later by `releasesleep`'s `wakeup(lk)`."
  - q: "Suppose `acquiresleep` called `sleep_prepare(lk)` *after* `release(&lk->lk)`. Give an interleaving in which `grep` sleeps forever."
    a: "`grep` sees `locked == 1` and releases `lk->lk`. Before it registers, `ls` on another hart runs `releasesleep`: `locked = 0`, `wakeup(lk)` finds nobody registered. Then `grep` registers and sleeps, and no one will ever call `wakeup(lk)` again unless someone else takes and releases the lock."
  - q: "Why can't the virtio interrupt handler simply take block 33's sleep-lock itself and mark the buffer valid?"
    a: "An interrupt handler is not a process. Taking a sleep-lock may sleep, and sleeping there would either put an unrelated interrupted process to sleep or, when the hart was in its scheduler (as hart 0 was), there is no process at all. Interrupt handlers may only use spinlocks; the handler changes `b->disk` under `disk.vdisk_lock` and lets the owner continue."
  - q: "Why is `acquiresleep`'s test `while (lk->locked)` and not `if (lk->locked)`?"
    a: "A wakeup means only that the lock was released at some point. All waiters are woken, and another process may take the lock before this one runs again. The woken process must re-check `locked` under the inner spinlock and sleep again if it lost."
