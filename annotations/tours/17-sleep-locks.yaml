    note: |
      Hart 2's scheduler picks up `grep`, and [[swtch]] moves hart 2 from its scheduler
      stack back onto `grep`'s frozen kernel stack. It returns from [[sleep]] on line 28, re-takes the
      inner spinlock on line 29, and goes back to the top of the `while`.

      Being woken does not mean the lock is now `grep`'s. It means only "the lock was
      released at some point". Between `ls`'s release and this check, a third process might
      have called [[acquiresleep]] on block 33 and taken it; [[wakeup]] wakes every waiter,
      and only one can win. That is why the test is a `while`, not an `if`, as in every
      sleep loop in xv6 ([[tour:16]]).

      This time `locked` is 0. The loop ends, line 31 sets `locked = 1`, line 32 records pid
      5, line 33 releases the inner spinlock, and `grep` owns block 33's sleep-lock.

      Note there is no fairness here. A newcomer arriving at line 24 just as `grep` was
      being woken could take the lock first, and `grep` would sleep again.
    others: |
      Even with three waiters, [[wakeup]] would wake all three and they would line up on the
      inner spinlock. One would win, and the other two would see `locked == 1` and sleep
      again. That costs some CPU, but nothing breaks.

  - title: grep gets the block without touching the disk
    file: kernel/bio.c
    lines: 90-102
    focus: 97
    state:
      hart: 2
      mode: S
      proc: grep (pid 5)
      intr: on
      satp: kernel
      locks: ["inode 6 ip->lock (sleep-lock)", "block 33 b->lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_exec, kexec, ilock, bread]
      sp: kernel
    note: |
      [[bget]] returns the locked buffer to [[bread]], which checks `b->valid`. `ls` set it
      to 1, so there is **no disk read**. `grep`'s [[ilock]] copies dinode 6 (entry 6, bytes
      384–447 of the same block), calls [[brelse]], and this time `refcnt` drops to 0, so the
      buffer moves to the front of the recently-used list.

      This is the payoff of waiting on a lock instead of reading independently. `grep`
      slept through `ls`'s disk read and then used its result. One read served two
      processes, and the buffer cache never held two copies of block 33.

      What if `grep` had won the race in step 6 instead? Then `grep` would have seen
      `valid == 0` and done the read, and `ls` would have waited and found `valid == 1`. The
      lock does not care who comes first; it only makes sure the reader and the data never
      collide.
    others: |
      Both processes now hold their own inode's sleep-lock and continue `exec` in parallel:
      `ls` on hart 0, `grep` on hart 2, each reading its own program's data blocks, which
      are different blocks with different buffers and sleep-locks. The only sleep-lock
      contention between them was the root directory (its inode and block 47) and block 33;
      they still meet briefly on spinlocks such as `bcache.lock` and `itable.lock`.

  - title: Two kinds of lock, side by side
    file: kernel/sleeplock.h
    lines: 1-9
    state:
      hart: 2
      mode: S
      proc: grep (pid 5)
      intr: on
      satp: kernel
      locks: ["inode 6 ip->lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_exec, kexec]
      sp: kernel
    note: |
      What did block 33 cost? One disk read, two harts' worth of sleeping, a disk interrupt
      on a third hart, and a migration from hart 1 to hart 0. Along the way the two
      processes took five different sleep-locks between them (root inode, inode 10, inode 6,
      block 47 inside `dirlookup`, block 33), and every sleep-lock operation took its inner
      spinlock for a handful of instructions.

      | | Spinlock | Sleep-lock |
      |---|---|---|
      | Owner | a CPU (`lk->cpu`) | a process (`lk->pid`) |
      | Waiter | spins, interrupts off | sleeps, CPU free |
      | Holder may sleep? | no (`sched locks`) | yes |
      | Interrupts while held | off | unchanged |
      | Usable in interrupt handlers | yes | no |
      | Good for | short updates of shared data | long operations, such as disk I/O |
      | Built from | `amoswap` | a spinlock + a flag + sleep/wakeup |

      The key idea: a sleep-lock moves the *waiting* out of the CPU and into the scheduler.
      That is what makes it possible to hold a lock across something as slow as a disk, and
      what makes it unusable where there is no process to put to sleep.
