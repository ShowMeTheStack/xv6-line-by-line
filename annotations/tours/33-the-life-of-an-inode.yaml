quiz:
  - q: "Why does `iget` not read the inode from disk, leaving that to `ilock`?"
    a: "`iget` runs under `itable.lock`, a spinlock, and reading the disk means sleeping, which is forbidden while holding a spinlock. `ilock` holds the inode's sleep-lock, which may be held while sleeping, and it also guarantees that only one process loads the entry."
  - q: "Hart 0 and hart 1 call `iget(1, 2)` at the same time and the table has no entry for inode 2. What would go wrong without `itable.lock`, and what happens with it?"
    a: "Without it both could claim slots, creating two in-memory copies of inode 2 with separate sleep-locks (or one slot with `ref` 1 for two users). With it, one claims a slot first, and the other's scan finds that entry with `ref > 0` and increments `ref` to 2."
  - q: "`rm README` ran while `cat` had it open. Why did `cat` still print the whole file?"
    a: "`sys_unlink` removed the name and set `nlink` to 0, but `cat`'s open file still held a reference: `rm`'s `iput` saw `ref == 2` and only dropped it to 1, so it did not truncate the file. The blocks were freed only by the final `iput` when `cat` closed the file."
  - q: "`iput` calls `acquiresleep` while holding `itable.lock`. Why can that not deadlock?"
    a: "It happens only when `ref == 1`: the caller holds the only reference, and any process holding the sleep-lock would also hold a reference. So the lock is free and `acquiresleep` never sleeps."
  - q: "In the old `iput`, `type` was set to 0 before `ref` was decremented. Trace how that leaked an inode."
    a: "In the lock-free gap, another process's `ialloc` saw `type == 0`, claimed the inode, and its `iget` found the old entry with `ref == 1` and shared it (`ref = 2`). When the new file was unlinked, its `iput` saw `ref == 2` and did not free it; then the old `iput` decremented `ref` to 0. The inode stayed allocated with no links until the next boot."
  - q: "Why does `fileclose` wrap a mere `iput` in `begin_op`/`end_op`?"
    a: "If this is the last reference and `nlink == 0`, `iput` truncates and frees the inode, writing the bitmap and inode blocks. Every disk change must belong to a transaction, so the call has to be inside one, even when it turns out to write nothing."
