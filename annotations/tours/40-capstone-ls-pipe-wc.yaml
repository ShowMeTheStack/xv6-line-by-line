      in the trapframe, or a kernel stack whose `sp` is saved in `p->context`, or, for hart 1's
      scheduler stack, in `cpus[1].context`. Notice that the
      user stacks share virtual addresses (three at 0x3000, two at 0x4000) yet are five different
