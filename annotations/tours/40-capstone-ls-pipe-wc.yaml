      hart, inspecting this child in [[kwait]], takes the child's `p->lock`. It must not
      see `ZOMBIE`, call [[freeproc]] and mark the slot `UNUSED` while `ls` is still
      executing on hart 1: a `fork` on a third hart could then claim the slot and start a
      new process on the very kernel stack `ls` is still running on (kernel stacks belong to
      slots, not to processes). The scheduler releases the lock only after `ls` has stopped
      using its stack.

