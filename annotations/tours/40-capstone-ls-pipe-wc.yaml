      `wait_lock` (`noff` 2 → 1), because [[sched]] refuses to switch with any spinlock but
      `p->lock` held ([[concept:locks#unusual]]). [[sched]] switches away for the
      last time. Its memory and slot remain until pid 3 collects them.

