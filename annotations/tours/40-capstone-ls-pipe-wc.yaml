title: "Capstone: the shell running ls | wc"
group: Devices and putting it all together
prerequisites: [5, 20, 21, 22, 37, 39]
summary: |
  You type seven characters and press Enter:

  ```
  $ ls | wc
  24 96 608
  $
  ```

  Less than a second later the answer is on the screen. In that second, xv6 used almost
  everything it has: the UART and the [[g:plic|PLIC]], interrupts on all three harts, the
  console's line editor, five processes, three `fork`s and two `exec`s, a [[g:pipe]], the
  path-name lookup, the inode table, the buffer cache, the virtio disk, the scheduler on
  every hart, processes going to [[g:sleep-wakeup|sleep]] more than a dozen times (and `wakeup`
  called hundreds of times), and nearly 800
  system calls. Every other tour on this site is a close-up of one stretch of this road.

  This tour drives the whole road once, at a steady speed, in 25 stops. It follows not one
  process but five, so watch the machine-state display: at every step it says which
  process we are following, on which hart, in which mode, holding which locks. The story
  jumps between processes and harts the way the machine does, and each jump is a place
  where the kernel had to make sharing safe.

  All the numbers are real. We ran this command on this build of xv6 with a tracing kernel
  and recorded which process ran where, every disk read, and every pipe read. Where the
  run could have gone differently (which hart wins a race), the tour says so.
cast: |
  The machine has three [[g:hart|harts]]. xv6 has just booted, and this is the first
  command. When the tour starts:

  | Hart | What it is doing |
  |---|---|
  | 0 | Running the shell `sh` (pid 2), which has just printed `$ ` |
  | 1 | Idle in its [[kernel:scheduler]], waiting in `wfi` |
  | 2 | Idle in its [[kernel:scheduler]], waiting in `wfi` |

  `init` (pid 1) is asleep in [[kernel:kwait]], as it will be for the whole tour. The cast
  of processes, in order of appearance:

  | pid | Program | Role |
  |---|---|---|
  | 2 | `sh` | the interactive shell; reads the line, forks, waits |
  | 3 | `sh` (copy) | parses the line, builds the pipe, forks both sides, waits for both |
  | 4 | `sh` → `ls` | the left side: writes the directory listing into the pipe |
  | 5 | `sh` → `wc` | the right side: counts what comes out of the pipe |
steps:
  - title: "sh (pid 2): the prompt, and a read that will wait"
    file: user/sh.c
    lines: 134-143
    focus: 137-139
    state:
      hart: 0
      mode: U
      proc: sh (pid 2)
      intr: on
      satp: user
      locks: []
      stack: [main, getcmd]
      sp: user
    note: |
      The shell has printed `$ ` with `write(2, "$ ", 2)`, a trip through the system-call
      path of [[tour:5]]: `ecall`, the [[g:trampoline]], [[kernel:usertrap]],
      [[kernel:consolewrite]], [[kernel:uartwrite]], and back. Now it clears its 100-byte
      `buf` and calls [[user:gets]], which calls `read(0, &c, 1)`: one byte per system call.

      Descriptor 0 is the console, opened by `init` at boot and inherited. One
      `struct file` is shared by `init`'s descriptors 0, 1, 2 and the shell's 0, 1, 2:
      reference count **6**. Keep counting it; by the end of the tour it will have been
      as high as 15.
    others: |
      Harts 1 and 2 have nothing to run. Their schedulers loop through the process table,
      find nothing `RUNNABLE`, and stop in `wfi` until an interrupt arrives
      ([[kernel/proc.c:467]]).

  - title: "sh (pid 2): nothing typed yet, so sleep on &cons.r"
    file: kernel/console.c
    lines: 87-108
    focus: 99-104
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: [cons.lock]
      irq: {noff: 1, intena: 1, note: "`cons.lock` from a system call (intena 1); [[sleep_prepare]] adds `p->lock` for a moment"}
      stack: [usertrap, syscall, sys_read, fileread, consoleread]
      sp: {"on": kernel, switched: "`ld sp, 8(a0)` in `uservec` ([[kernel/trampoline.S:76]]) when the shell executed `ecall`", detail: "sh's kernel stack, slot 1 (0x3fffffb000)"}
    note: |
      [[fileread]] routed the read through `devsw[CONSOLE]` to [[consoleread]], which took
      `cons.lock` (interrupts off) and found the input buffer empty: `r == w`.

      So the shell registers on the channel `&cons.r` with [[sleep_prepare]], *while still
      holding* `cons.lock`, then releases the lock and calls [[sleep]]. Registering before
      releasing is the rule that prevents lost wakeups everywhere in this version of xv6;
      you will see it at every sleep in this tour.

      The shell is now `SLEEPING`. Hart 0's scheduler finds nothing else to run and joins
      the others in `wfi`. **All three harts are idle**, and the whole machine waits for
      your fingers. [[tour:37]] follows this wait, and your keystrokes, in detail.

      Keep an eye on the "running on" strip: this tour visits every kind of stack
      ([[concept:stacks]]). Here hart 0 is on the shell's **kernel stack**, the page of its
      process slot (slot 1, at 0x3fffffb000 in this build), which `uservec` pointed `sp` at
      ([[kernel/trampoline.S:76]]). When the shell sleeps, its frames (`usertrap` …
      `consoleread`, `sleep`, `sched`) stay on that page and `swtch` moves hart 0 to its
      scheduler stack ([[kernel/swtch.S:26]]). From then on, all three harts' `sp`s point into
      their scheduler stacks, the three 4 KiB slices of `stack0`.
    others: |
      A keystroke can be handled on any hart. If one arrived on hart 2 right now, its
      handler would spin on `cons.lock` until hart 0 releases it on line 105, and by then
      the shell is registered: its wakeup cannot be lost.

  - title: "No process: you press Enter, and hart 2 commits the line"
    file: kernel/console.c
    lines: 146-190
    focus: 179-184
    state:
      hart: 2
      mode: S
      proc: none (scheduler)
      intr: off
      satp: kernel
      locks: [cons.lock]
      irq: {noff: 1, intena: 0, note: "`cons.lock` taken inside the trap handler, SIE already off: intena 0 ([[concept:locks#handlers]])"}
      stack: [scheduler, kernelvec, kerneltrap, devintr, uartintr, consoleintr]
      sp: {"on": scheduler, detail: "hart 2's slice of stack0, with a `kernelvec` frame on top"}
    note: |
      You type `l`, `s`, space, `|`, space, `w`, `c`. Each key is its own UART interrupt,
      claimed through the PLIC by whichever hart gets there first (in our trace, a mix of
      all three). Each time, [[consoleintr]] echoes the character with
      [[uartputc_sync]] and appends it to `cons.buf`, but does **not** commit it: the shell
      sleeps on.

      Then Enter. Your terminal sends `\r`; hart 2 claims the interrupt. `\r` becomes `\n`,
      it is echoed and stored, and line 182 commits the whole line: `w = e = 8`. Then
      `wakeup(&cons.r)` walks the process table, taking each `p->lock`, finds the shell, and
      makes it `RUNNABLE`.

      This step belongs to no process. Hart 2 was idle; the interrupt arrived in its
      scheduler loop. The kernel did all of this, echoing and line editing, before any
      program saw a single byte.

      Which stack does a keystroke run on? Whatever the claiming hart was using: `kernelvec`
      pushes its 256-byte frame onto the current stack ([[kernel/kernelvec.S:14]]), and xv6 has
      no separate interrupt stack. Here every hart is idle, so it is a scheduler stack. When
      we replayed this command under gdb, all eight keystrokes (on harts 2, 0, 2, 0, 1, 1, 2, 0)
      entered `consoleintr` on the claiming hart's scheduler stack with `sp` 496 bytes below the
      top of its slice. Had a hart been running a process, the same handler would have run on that
      process's kernel stack ([[tour:37]]).
    others: |
      Lock order: `cons.lock` then each `p->lock`. The shell took them in the same order
      (in `sleep_prepare`), so the two harts cannot deadlock. And because the shell's
      `p->lock` is taken for the check, the wakeup finds the shell either registered and
      running or fully asleep, never halfway ([[tour:16]]).

  - title: "sh (pid 2): awake on hart 1, eight reads later"
    file: user/ulib.c
    lines: 69-85
    focus: 75-83
    state:
      hart: 1
      mode: U
      proc: sh (pid 2)
      intr: on
      satp: user
      locks: []
      stack: [main, getcmd, gets]
      sp: {"on": user, switched: "`ld sp, 48(a0)` in `userret` ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]])", detail: "sh's user stack, the page at 0x4000"}
    note: |
      No hart is *told* that the shell is runnable; each scheduler notices on its next scan.
      Hart 1 woke from `wfi` and found it first. The shell resumes inside [[kernel:sleep]],
      on a different hart from the one it fell asleep on. Nothing in its kernel stack cares.

      [[kernel:consoleread]] retakes `cons.lock`, takes `l`, copies it to the user with
      [[kernel:copyout]], and returns 1. [[user:gets]] loops. The line costs eight one-byte
      reads in all: the first is the one that slept in step 2 and now returns `l`; the
      other seven find committed bytes and return at once.

      `buf` now holds `"ls | wc\n"`. Hart 0 is idle; hart 2 is back in its scheduler.

      Two stack switches brought the shell here. Hart 1's scheduler `swtch`ed onto the shell's
      kernel stack, at the `sched` frame saved in step 2 ([[kernel/swtch.S:26]]), so the frames
      hart 0 left behind were resumed by hart 1. Then the read returned and `userret` loaded the
      shell's user `sp` from the trapframe ([[kernel/trampoline.S:118]]), leaving the kernel stack
      empty.
    others: |
      While the shell reads, `cons.lock` is taken and released eight times on hart 1. A
      key typed now (on any hart) would be appended after the newline, as the start of the
      *next* command. This command's reads stop at the newline and never see it; the shell
      reads it after the next prompt.

  - title: "sh (pid 2): fork a child to do the work, then wait"
    file: user/sh.c
    lines: 145-176
    focus: 160-174
    state:
      hart: 1
      mode: U
      proc: sh (pid 2)
      intr: on
      satp: user
      locks: []
      stack: [main]
      sp: user
    note: |
      The line is not `cd`, so the shell calls [[user:fork1]] and the child runs
      `runcmd(parsecmd(cmd))`. The parent goes straight to `wait(0)`.

      Notice who parses: the **child**. Parsing allocates a tree with [[user:malloc]] and
      writes `\0`s into `buf`. Done in the child, all of that vanishes when the child exits;
      the shell itself never parses, never allocates and never frees, so it can run
      forever without leaking. `cd` is the exception (line 166) because changing directory
      in a child would change only the child's directory.

      `fork` returns twice. We follow the kernel side first.

  - title: "sh (pid 2): kfork copies memory and shares open files"
    file: kernel/proc.c
    lines: 256-305
    focus: 284-292
    state:
      hart: 1
      mode: S
      proc: sh (pid 2)
      intr: off
      satp: kernel
      locks: ["pid 3's p->lock (np->lock)"]
      irq: {noff: 1, intena: 1, note: "`np->lock`, held since [[allocproc]]; [[filedup]] and [[idup]] add `ftable.lock` / `itable.lock` for a moment (2)"}
      stack: [usertrap, syscall, sys_fork, kfork]
      sp: {"on": kernel, switched: "`ld sp, 8(a0)` in `uservec` ([[kernel/trampoline.S:76]]) for `fork`", detail: "sh's kernel stack"}
    note: |
      [[kfork]] ([[tour:20]]) has already built pid 3: a slot from [[allocproc]], a
      trapframe page, a new page table with a full copy of the shell's memory
      ([[uvmcopy]]), and a copy of the shell's registers with `a0 = 0` so the child sees
      `fork()` return 0.

      Lines 285-288 are where the pipeline's plumbing will later come from. The child gets
      the parent's descriptor *table* copied, but the open files themselves are shared:
      [[filedup]] increments each `struct file`'s reference count. The console's count goes
      from 6 to **9**. The child also shares the shell's current directory, the root inode,
      through [[idup]].

      Then pid 3 is made `RUNNABLE` and `fork` returns 3 to the shell. The shell calls
      `wait`, and [[kwait]] finds no exited child, registers on its own `struct proc` as
      a channel, and sleeps. Hart 1's scheduler takes the next `RUNNABLE` process in table
      order: pid 3.

      The stacks of pid 3 are made in two different ways. Its **user** stack is part of the
      memory [[uvmcopy]] copies: same virtual addresses (the page at 0x4000 in this build), a
      different physical page, with the shell's frames in it, so the child returns from `fork`
      into the same `main`. Its **kernel** stack is not copied at all. pid 3 gets slot 2, whose
      stack page (0x3fffff9000) was mapped at boot, and [[allocproc]] set
      `context.sp` to its top and `context.ra` to [[forkret]] ([[kernel/proc.c:147]]): an empty
      stack, waiting for a first `swtch`.
    others: |
      [[filedup]] takes `ftable.lock` for each increment, since other harts may be opening
      or closing files at the same time. Linking the child to its parent takes `wait_lock`
      ([[kernel/proc.c:296]]), so a parent in [[kwait]] on another hart never sees a
      half-linked child.

  - title: "sh (pid 3): parsecmd builds a PIPE tree"
    file: user/sh.c
    lines: 367-378
    focus: 372-376
    state:
      hart: 1
      mode: U
      proc: sh (pid 3)
      intr: on
      satp: user
      locks: []
      stack: [main, parsecmd, parseline, parsepipe]
      sp: {"on": user, switched: "`ld sp, 48(a0)` in `userret` ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]]), reached from [[forkret]]", detail: "pid 3's user stack, a copy of the shell's"}
    note: |
      pid 3 starts life returning from `fork` with 0 and calls [[user:parsecmd]], a small
      recursive-descent parser ([[g:recursive-descent]]). [[user:parsepipe]] parses one
      command with [[user:parseexec]] (`ls`), sees `|`, and recurses for the right side
      (`wc`). The result:

      ```
      pipecmd
      ├── left:  execcmd  argv = {"ls", 0}
      └── right: execcmd  argv = {"wc", 0}
      ```

      The `argv` strings are not copied. They point into `buf` itself, and
      [[user:nulterminate]] writes a `\0` after each word, turning `"ls | wc\n"` into
      `"ls\0| wc\0"`. This is pid 3's private copy of `buf`; the shell's is untouched.

      The first [[user:malloc]] asks the kernel for memory with `sbrk`: 64 KiB, allocated
      eagerly, a few hundred bytes of which hold this tree.

      On the stacks, pid 3's first run went: hart 1's scheduler `swtch`ed to it and landed on
      the **empty** top of its kernel stack (0x3fffffa000 when we checked under gdb), in
      [[forkret]]; `forkret` went straight to `userret`, whose `ld sp` switched to pid 3's copy
      of the user stack, usable from the `sret` on. pid 3 never ran a line of `usertrap` before its first instruction in
      user mode.

  - title: "sh (pid 3): pipe() creates the channel"
    file: user/sh.c
    lines: 101-123
    focus: 102-104
    state:
      hart: 1
      mode: U
      proc: sh (pid 3)
      intr: on
      satp: user
      locks: []
      stack: [main, runcmd]
      sp: user
    note: |
      [[user:runcmd]] sees `PIPE`. `pipe(p)` enters the kernel, where [[pipealloc]] claims
      two `struct file`s from the global table (under `ftable.lock`) and one 4096-byte page
      from [[kalloc]] (under `kmem.lock`) to hold a `struct pipe`: a spinlock, a 512-byte
      ring buffer, two counters (`nread`, `nwrite`) and two open flags (`readopen`,
      `writeopen`). [[sys_pipe]] installs the read end as descriptor 3 and
      the write end as descriptor 4, the lowest free slots, and copies `{3, 4}` into `p`.

      Tour [[tour:39]] takes this apart byte by byte. Here, remember three facts: the pipe
      holds 512 bytes; a reader of an empty pipe sleeps until a write *or* until every
      write end is closed; and "every write end" is counted in `struct file` references,
      which `fork` is about to multiply.

  - title: "sh (pid 3): two forks, and descriptors rewired"
    file: user/sh.c
    lines: 101-123
    focus: 105
    state:
      hart: 1
      mode: U
      proc: sh (pid 3)
      intr: on
      satp: user
      locks: []
      stack: [main, runcmd]
      sp: user
    note: |
      pid 3 forks pid 4 (left side, `ls`) at line 105 and pid 5 (right side, `wc`) at line
      112. Lines 106–110 and 113–117 then run in the children, not in pid 3. Each fork dups
      all five open files: the console's count rises to 12, then **15** (in our trace both
      forks happened before either child ran, so nothing had been closed yet).

      The children rearrange their descriptors with the "close, then dup into the lowest
      free slot" idiom:

      | pid | runs | `close` | `dup` lands in | then closes |
      |---|---|---|---|---|
      | 4 | `ls` | 1 (console) | **1** ← write end | 3, 4 |
      | 5 | `wc` | 0 (console) | **0** ← read end | 3, 4 |

      After this, `ls`'s standard output *is* the pipe and `wc`'s standard input *is* the
      pipe. When the children `exec`, the descriptor table survives ([[tour:22]]), so
      `ls` and `wc` inherit the wiring without knowing it exists. This is the whole trick
      of Unix pipelines: the shell connects programs by arranging descriptors 0 and 1
      before `exec`.

      In our trace all three forks ran on hart 1. pid 4 and pid 5 are now `RUNNABLE`, but
      harts 0 and 2 are in `wfi` and will not notice until their next interrupt.
    others: |
      The children's `close` and `dup` calls run concurrently with pid 3's, possibly on
      other harts. Each changes only its own process's `ofile[]` (no lock needed: only the
      process itself touches its table) and the shared reference counts (always under
      `ftable.lock`). However they interleave, each pipe end finishes with exactly one
      holder: `ls` holds the write end, `wc` the read end.

  - title: "sh (pid 3): close both ends, then wait"
    file: kernel/proc.c
    lines: 369-419
    focus: 407-414
    state:
      hart: 1
      mode: S
      proc: sh (pid 3)
      intr: off
      satp: kernel
      locks: [wait_lock]
      irq: {noff: 1, intena: 1, note: "`wait_lock`; [[sleep_prepare]] adds `p->lock` for a moment, and line 415 drops it to 0 before `sleep()`"}
      stack: [usertrap, syscall, sys_wait, kwait]
      sp: {"on": kernel, switched: "`ld sp, 8(a0)` in `uservec` ([[kernel/trampoline.S:76]]) for `wait`", detail: "pid 3's kernel stack"}
    note: |
      pid 3 closes `p[0]` and `p[1]` ([[user/sh.c:119]]). It must: if it kept the write end
      open, `wc` could never see end of file, and pid 3 would wait for `wc` forever while
      `wc` waited for pid 3. [[tour:39]] shows this classic bug in full.

      Then `wait(0)`. [[kwait]] takes `wait_lock` (a [[g:spinlock]]: interrupts off), scans
      the table for children of pid 3, finds pids 4 and 5 alive, and registers on the
      channel `p` (its own `struct proc`) with [[sleep_prepare]], still holding `wait_lock`.
      Then it releases the lock and sleeps.

      Three processes now sleep, each on a different channel: `init` and the shell on their
      own `struct proc`s, pid 3 on its own. Hart 1 is free, and its scheduler picks the
      next `RUNNABLE` process in table order: pid 4.
    others: |
      `wait_lock` closes the window between "no zombie child yet" and "registered": a child
      exiting on another hart calls [[kexit]], which takes `wait_lock` before its
      `wakeup(p->parent)`. So the child's exit happens either before pid 3's scan (and the
      scan finds a zombie) or after pid 3 registered (and the wakeup finds it).
      [[tour:21]] walks through it.

  - title: "ls (pid 4): exec loads the program from disk"
    file: kernel/exec.c
    lines: 39-80
    focus: 48-50
    state:
      hart: 1
      mode: S
      proc: ls (pid 4)
      intr: on
      satp: kernel
      locks: ["ls's inode lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_exec, kexec]
      sp: {"on": kernel, switched: "`ld sp, 8(a0)` in `uservec` ([[kernel/trampoline.S:76]]) when pid 4 called `exec`", detail: "pid 4's kernel stack, slot 3 (0x3fffff7000)"}
    note: |
      pid 4 calls `exec("ls", argv)` ([[user/sh.c:79]]). [[kexec]] ([[tour:22]]) looks up
      `ls` in the current directory (the root) and finds inode 10, locks it, and reads its ELF header with
      [[readi]].

      This is the first time anything touches the **disk**. `ls`'s header is in block 301
      of the disk image, and it is not in the buffer cache. [[bread]] calls
      [[virtio_disk_rw]], which queues the request for the virtio disk and sleeps until
      the disk's completion interrupt ([[tour:29]]). Then the code segment, at file offset
      `0x1000` and `0xb89` bytes long, comes from blocks 305, 306 and 307.

      In our trace, those four blocks were the **only** disk reads `ls` caused in the
      whole command. The directory, the inode blocks and everything else were already in
      the buffer cache. (`ls` is 40,256 bytes on disk, but `exec` loads only 2,953 bytes
      of it; most of the rest is debugging information, symbol tables and page-alignment
      padding, which `exec` never reads.)

      When `kexec` returns, pid 4 is no longer a shell. Its name is `ls`, its memory is
      `ls`'s, and its descriptors are untouched: 0 console, 1 pipe, 2 console.

      `kexec` runs entirely on pid 4's kernel stack, and it is what gives `ls` a new **user**
      stack. It builds it in a brand-new page table (one page at 0x3000 in this build, with a
      guard page below it), copies the argument string `"ls"` and the `argv` array onto it, and
      sets `trapframe->sp` to point at them ([[kernel/exec.c:137]]). Only then does it free the
      old image, including the shell's user stack that pid 4 had been running on
      ([[kernel/exec.c:138]]).
    others: |
      While `ls` sleeps for the disk, hart 1 runs something else, and the disk interrupt
      may arrive at any hart; `ls` may finish `exec` on a different hart than it started.
      Meanwhile `wc` (pid 5) is being exec'd too, on another hart, reading its own blocks
      777 and 781–783. The two `exec`s share the buffer cache (`bcache.lock`), the log
      ([[begin_op]] counts them as two outstanding operations), and the disk queue.

  - title: "wc (pid 5): reads an empty pipe, and sleeps"
    file: kernel/pipe.c
    lines: 111-128
    focus: 119-124
    state:
      hart: 2
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: [pi->lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, piperead]
      sp: {"on": kernel, switched: "`ld sp, 8(a0)` in `uservec` ([[kernel/trampoline.S:76]]) when `wc` executed `ecall`", detail: "wc's kernel stack, slot 4 (0x3fffff5000)"}
    note: |
      Now we follow `wc`, on hart 2. Its `exec` finished, and with no arguments it calls
      `wc(0, "")`, reading descriptor 0: `read(0, buf, 512)` ([[user/wc.c:16]]).
      [[fileread]] sees `FD_PIPE` and calls [[piperead]].

      Take the simplest case: `wc` gets here **before** `ls` has written a byte. (In other
      traced runs `ls` was usually 72–299 bytes ahead by the time `wc`
      first found the pipe empty; sooner or later `wc` always does.) The pipe is empty
      (`nread == nwrite == 0`) and the write end is open (`ls` holds it), so
      `wc` must wait: [[sleep_prepare]]`(&pi->nread)` while holding `pi->lock`, release,
      [[sleep]].

      `wc` has no idea it is reading from `ls`. Had you typed `wc` alone, the same
      `read(0, …)` would have gone to [[consoleread]] and waited for your keystrokes.

      When `wc` sleeps, its frames (`usertrap`, `syscall`, `sys_read`, `fileread`,
      `piperead`, `sleep`, `sched`) stay on its kernel stack and hart 2 returns to its scheduler
      stack. [[tour:39]] draws that stack.
    others: |
      `ls` on hart 1 will soon call [[pipewrite]], which needs `pi->lock`. Because `wc`
      registered before releasing the lock, a byte written at any moment after this is
      seen by its `wakeup(&pi->nread)`, and a byte written before it would have been seen
      by `wc`'s check. No lost wakeup.

  - title: "ls (pid 4): open the current directory"
    file: user/ls.c
    lines: 27-46
    focus: 35-46
    state:
      hart: 1
      mode: U
      proc: ls (pid 4)
      intr: on
      satp: user
      locks: []
      stack: [main, ls]
      sp: {"on": user, switched: "`ld sp, 48(a0)` in `userret` ([[kernel/trampoline.S:118]]) and `sret` ([[kernel/trampoline.S:153]]) at the end of `exec`", detail: "ls's new user stack, the page at 0x3000"}
    note: |
      Back to `ls`, in user mode on hart 1. With no arguments, `main` calls
      `ls(".")`. A directory is a file, so `ls` opens it like any other file and asks
      [[user:fstat]] what it is: `T_DIR`.

      `open(".")` returns descriptor **3**, the lowest free slot (0, 1 and 2 are taken).
      Do not confuse it with pid 3's old descriptor 3: `ls` closed that one before
      `exec`. Descriptor numbers are per process; the same number can mean different files
      in different processes.

      The kernel side of this `open` is the next stop.

