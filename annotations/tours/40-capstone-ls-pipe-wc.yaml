    protects: "An inode's contents and a file's offset during a read; may be held across disk waits"
  - lock: itable.lock (spinlock)
    where: "[[iget]], [[idup]], [[iput]]"
    protects: "The in-memory inode table's reference counts"
  - lock: bcache.lock (spinlock)
    where: "[[bget]], [[brelse]]"
    protects: "Which block each buffer holds, their reference counts, the LRU list"
  - lock: "buffer lock (sleep-lock)"
    where: "[[bread]] to [[brelse]]"
    protects: "One cached block's data while it is read or filled from disk"
  - lock: tx_lock (sleep-lock)
    where: "[[uartwrite]]"
    protects: "The UART transmitter, one 32-byte batch at a time ([[tour:38]])"
  - lock: pid_lock (spinlock)
    where: "[[allocpid]], in each of the 3 forks"
    protects: "`nextpid`, so no two processes get the same pid"
  - lock: log.lock (spinlock)
    where: "[[begin_op]], [[end_op]]: both `exec`s, every `open` and `close`, each exit's [[iput]] of its directory"
    protects: "The log's count of outstanding operations and its committing state"
  - lock: disk.vdisk_lock (spinlock)
    where: "[[virtio_disk_rw]] and the disk interrupt, for the 8 disk reads"
    protects: "The virtio descriptor ring and the disk's in-flight request bookkeeping"
  - lock: tickslock (spinlock)
    where: "[[clockintr]], on hart 0 only"
    protects: "The global `ticks` counter, advanced by timer interrupts throughout"
  - lock: "lk->lk inside each sleep-lock (spinlock)"
    where: "[[acquiresleep]], [[releasesleep]]"
    protects: "Each sleep-lock's `locked` flag and holder pid, for inode, buffer and `tx_lock` sleep-locks alike"
  - lock: "ofile[] (no lock)"
    where: "[[fdalloc]], [[sys_close]], [[sys_dup]]"
    protects: "Changed only by the owning single-threaded process"
quiz:
  - q: "Why does the shell parse the command in the child (`runcmd(parsecmd(cmd))` after `fork1`) rather than before forking?"
    a: "Parsing allocates the command tree with `malloc` and writes `\\0`s into `buf`. In the child, all of that disappears when the child exits, so the long-lived shell never leaks memory or needs to free anything."
  - q: "`ls` writes to descriptor 1 and `wc` reads descriptor 0, and neither program mentions pipes. Which lines make that work, and why does it survive `exec`?"
    a: "In the children, `close(1); dup(p[1])` and `close(0); dup(p[0])` ([[user/sh.c:106]], [[user/sh.c:113]]) put the pipe ends in the lowest free slots, 1 and 0. `exec` replaces memory and registers but keeps the descriptor table, so `ls` and `wc` inherit the wiring."
  - q: "Suppose `wc` has read all 608 bytes while `ls` is still running, so its next `read` sleeps. What exactly wakes it, and why would it sleep forever if pid 3 had not closed `p[1]`?"
    a: "`ls`'s exit closes the last write-end reference: `fileclose` calls `pipeclose`, which sets `writeopen = 0` and calls `wakeup(&pi->nread)`; `wc` then returns 0. If pid 3 still held the write end, its reference count would not reach 0, `writeopen` would stay 1, and pid 3 would be waiting for `wc` while `wc` waited for pid 3's write end."
  - q: "In one traced run, `wc`'s reads returned 244, 238, 2, 80, 22, 22 and 0 bytes. Why not 512, 96 and 0?"
    a: "A pipe read returns whatever is in the pipe when the reader runs, not a full buffer. `ls` writes one byte per call while `wc` runs concurrently on another hart, so each `read` gets the bytes that have accumulated since the last one; the split depends on scheduling."
  - q: "Block 47 holds the root directory. Name three moments in this tour when some process locked that buffer, and explain why `bget` releases `bcache.lock` before taking the buffer's sleep-lock."
    a: "`exec`'s lookups of `ls` and `wc`, `ls`'s `open(\".\")` and its 64 directory reads that return data, and each `stat` path lookup. `bcache.lock` is a spinlock; taking the sleep-lock may sleep (if another process holds the buffer, possibly waiting for the disk), and sleeping while holding a spinlock is forbidden."
  - q: "`ls` becomes a zombie while holding both `wait_lock` and its own `p->lock`. What could go wrong on another hart if it released its `p->lock` before calling `sched()`?"
    a: "pid 3's `kwait` on another hart could see `ZOMBIE` and call `freeproc`, marking the slot `UNUSED` while `ls` is still running on that slot's kernel stack on hart 1; a `fork` elsewhere could then reuse the slot and its stack at the same time. Holding `p->lock` until the scheduler releases it guarantees `ls` has stopped running first."
