      ([[kernel/swtch.S:26]]), which moves hart 1 to its scheduler stack for good. Nothing frees
      that stack, and nothing needs to: it belongs to slot 3, not to `ls`. What `ls` leaves for
      its parent to free is the trapframe and the user page table, with its user stack in it.
