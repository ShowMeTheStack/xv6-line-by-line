      The comment says "the current stack is a kernel stack". It is right in the broad sense:
      at site B it is a process's kernel stack, at site C it is the hart's scheduler stack,
      and both are kernel memory mapped in the kernel page table.

      | | Site A: user | Site B: process in kernel | Site C: scheduler |
      |---|---|---|---|
      | `stvec` | [[uservec]] | [[kernelvec]] | [[kernelvec]] |
      | page table switch | yes, `csrw satp` | no | no |
      | registers saved to | trapframe (31) | kernelvec frame (17) | kernelvec frame (17) |
      | lands on | empty kernel stack | top of a busy kernel stack | the scheduler's frame |
      | `sepc` kept in | `trapframe->epc` | a local in [[kerneltrap]] | a local in [[kerneltrap]] |
      | timer leads to | [[yield]] | [[yield]] | nothing |
      | may resume on another hart | yes | yes, so `tp` isn't restored | no |
      | measured `sepc` | `0x3a7a` | `0x8000266c` | `0x80001e10` |

      The handler code is shared ([[devintr]], [[clockintr]]); only the entry and exit
      differ. And in every case the hardware did the same few things. The difference comes
      from what xv6 left in `stvec` and `sp`. [[tour:45]] puts all three sites into one
      complete time slice.
locks:
  - lock: "tickslock (spinlock)"
    where: "[[clockintr]], on hart 0 only"
    protects: "`ticks`, the global tick counter; the other harts only re-arm their own `stimecmp`"
  - lock: "p->lock (spinlock)"
    where: "[[yield]] (sites A and B), released by the [[scheduler]], re-taken by the next hart's scheduler"
    protects: "`p->state`, so exactly one hart runs on a suspended thread's kernel stack"
  - lock: "stvec, sepc, sstatus, tp (no lock)"
    where: "every step"
    protects: "Per-hart registers: other harts can't touch them. The danger is this hart's next trap, or a thread moving to another hart, which is why `kerneltrap` keeps copies and `kernelvec` leaves `tp` alone"
  - lock: "PLIC claim (no kernel lock)"
    where: "[[plic_claim]] at site C"
    protects: "The PLIC gives each device interrupt to one claimer; the others read 0"
quiz:
  - q: "A timer tick arrives at site A and another at site C. At what point do their paths become the same code, and where do they part again?"
    a: "They converge at [[devintr]] → [[clockintr]], reached from [[usertrap]] at site A and from [[kerneltrap]] at site C. They part right after: `usertrap` yields when `which_dev == 2`, while `kerneltrap` yields only if `myproc() != 0`, which is false in the scheduler. They return differently too: `prepare_return`, `userret` and `sret` to user mode, versus `kernelvec`'s `sret` back into the scheduler at `0x80001e10`."
  - q: "Why doesn't `kernelvec` restore `tp`, while `userret` does restore the user's `tp`?"
    a: "In the kernel `tp` is the hart's identity, and after a `yield` inside `kerneltrap` the thread may be on a different hart (we measured hart 1 → hart 0). Restoring the saved `tp` would make that hart claim to be the old one. For user code, `tp` is just a register the program owns. The kernel's hart number goes back into `tp` from `kernel_hartid` on the next trap."
  - q: "`kerneltrap` writes `sepc` and `sstatus` back even when it did not yield. What would go wrong, in our measured run, if it only did so after a yield returned on a different hart?"
    a: "Even on the same hart, the yield may have run other threads, or taken interrupts in the scheduler's window, and each overwrites `sepc` and `sstatus`. A scheduler-window interrupt on the *same* hart leaves `sepc = 0x80001e10` and `SPP = 0`, exactly the leftovers we measured after a hart change, so a \"did we move?\" test would miss it. Writing both back always costs two instructions."
  - q: "`sched` panics with \"sched interruptible\" if interrupts are on. Describe the failure that check prevents."
    a: "`sched` is called holding the process's `p->lock`. If interrupts were on, a timer could arrive at site B inside `sched`. Its `kerneltrap` would call `yield`, which calls `acquire(&p->lock)` on a lock this hart already holds, and `acquire` panics. In practice `acquire` already turned interrupts off; the check catches code that turned them back on."
  - q: "The scheduler runs `wfi` with interrupts *off*. Why doesn't the hart sleep through the interrupt that should wake it?"
    a: "`wfi` resumes when an interrupt is *pending* (and enabled in `sie`), whatever the global `SIE` bit says. The hart falls through to `intr_on()` at line 441, and the pending interrupt is taken there, with `sepc = 0x80001e10`. Keeping interrupts off until then is what prevents the lost-wakeup race in step 16."
  - q: "Site B's kernelvec frame and site C's both hold 17 registers. Why does site A need 31, and why can't it put them on a stack like the other two?"
    a: "At site A the interrupted code is a user program, which owes the kernel nothing under the calling convention, so every register must be saved. And there's no usable stack: the user's `sp` can't be trusted, and the kernel stack isn't mapped until `satp` changes. So [[uservec]] stores into the trapframe, reachable through the user page table at `TRAPFRAME`."
