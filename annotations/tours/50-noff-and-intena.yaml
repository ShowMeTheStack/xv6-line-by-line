title: noff and intena through a sleep, a yield and an interrupt
group: Locks and interrupt state
prerequisites: [8, 11, 13, 15, 16]
summary: |
  Every hart keeps three small facts about interrupts. **SIE** is one bit in `sstatus`: may an
  interrupt be taken right now? **noff** (`mycpu()->noff`) counts how many [[push_off]] calls
  are still open. **intena** (`mycpu()->intena`) remembers whether SIE was on just before the
  outermost `push_off`. Together they decide, at every [[release]], whether interrupts come
  back on ([[concept:locks#noff]], [[concept:locks#intena]]).

  This tour watches those three values on **hart 0**, instruction by instruction, through
  one real stretch of time. The shell goes to sleep in `read`. The scheduler takes over and
  resets `intena`. A timer tick lands in the scheduler. A process that was preempted on
  another hart resumes here, inside a trap handler, and leaves with interrupts still off,
  as it must. A brand-new process starts in [[forkret]]. Finally a tick lands inside that
  process's kernel code and shows how the preempted process got into its state in the first
  place.

  Nothing here is invented. We booted this build on three harts, typed `grind &` (a test
  program that runs random system calls in several processes forever), and attached gdb to
  QEMU. Breakpoints on hart 0 recorded `sstatus`, `cpus[0].noff` (offset 120 of [[kernel:cpu|struct cpu]]),
  `cpus[0].intena` (offset 124), `sp` and the relevant registers at each instruction we
  quote. Every number below comes from that run, or from the build's `kernel/kernel.asm`.
  [[tour:13]] and [[tour:15]] explained the code; this tour is about the *values*.
cast: |
  The run starts at tick 12, about 1.2 s after boot. `grind &` has just been typed.

  | Hart | What it is doing |
  |---|---|
  | 0 | Running `sh` (pid 2, slot `proc[1]`): it printed `$ ` and is about to call `read(0, &c, 1)` |
  | 1 | In its scheduler loop, idle |
  | 2 | Running pid 4 (slot `proc[3]`), the shell's background grandchild, inside `exec("grind")`: still named `sh` (pid 3, the forked copy of `sh` that started it, has already exited) |

  `sh` uses `KSTACK(1)` (top `0x3fffffc000`), pid 4 uses `KSTACK(3)` (top `0x3fffff8000`).
  Hart 0's scheduler stack is its slice of [[stack0]], `0x80007890`–`0x80008890`.

  In the state strip, `intena` is shown only while `noff > 0`. When `noff` is 0 the field
  still holds a stale value; we mention it where it matters.
steps:
  - title: "read enters the kernel: usertrap turns SIE on"
    file: kernel/trap.c
    lines: 37-68
    focus: 64-66
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "on"
      satp: kernel
      locks: []
      irq: {noff: 0, note: "the stale intena is 0, last written by the acquire inside killed(p) on line 57 (and before that by myproc on line 49), both with SIE off"}
      stack: [usertrap]
      sp: {"on": kernel, detail: "KSTACK(1), usertrap's frame, sp = 0x3fffffbfe0"}
    note: |
      `sh` executed `ecall` for `read`. The trap cleared SIE, so [[usertrap]] starts with
      interrupts off. gdb at the `csrsi sstatus,2` of line 66 (`0x80002668`) shows:

      | | `sstatus` | SIE | noff | intena |
      |---|---|---|---|---|
      | before line 66 | `0x200000020` | 0 | 0 | 0 (stale) |
      | after line 66 | `0x200000022` | **1** | 0 | 0 (stale) |

      Bit 1 (`0x2`) is SIE. Bit 5 (`0x20`) is SPIE, the copy of SIE the trap saved; the high
      `0x200000000` is the UXL field and never changes.

      Look at the stale `intena`. It is 0 because [[myproc]] on line 49, and then the
      `acquire` inside [[killed]] on line 57, each ran an outermost `push_off` while SIE was
      still off, and a `push_off` at `noff == 0` always overwrites `intena`. That is the first lesson of this tour: **intena is rewritten
      every time noff goes from 0 to 1**. It is not a long-lived setting; it is a note about
      the latest outermost `push_off`.

      Why turn interrupts on at all? A system call may run for a long time, and while it does,
      the hart should still take timer and device interrupts. Line 66 comes after line 52
      saved `sepc`, because an interrupt would overwrite it ([[tour:8]]).
    others: |
      Hart 2 is in pid 4's `exec`, with `cpus[2].noff = 2`, `intena = 1`. Hart 1 is in its
      scheduler. Each hart has its own `cpus[i]`; nothing hart 0 does to `noff` or `intena`
      is visible to them, and no lock protects these fields because none is needed
      ([[concept:locks#unlocked]]).

  - title: The first push_off that is not a lock
    file: kernel/proc.c
    lines: 82-91
    focus: 85-88
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: []
      irq: {noff: 1, intena: 1, note: "myproc's own push_off: no lock is held"}
      stack: [usertrap, syscall, myproc]
      sp: {"on": kernel, detail: "sp = 0x3fffffbf80"}
    note: |
      [[syscall]] calls [[myproc]] to find the trapframe. `myproc` brackets its read of
      `c->proc` with `push_off`/`pop_off`, so that a timer interrupt cannot move this thread
      to another hart between "which hart am I?" and "read that hart's `proc`".

      This is the first `push_off` with SIE on. gdb at the `csrrci a5,sstatus,2`
      (`0x80000bb8`):

      | | `sstatus` | `a5` | noff | intena |
      |---|---|---|---|---|
      | before | `0x200000022` | | 0 | 0 |
      | after `csrrci` | `0x200000020` | `0x200000022` | 0 | 0 |
      | end of `push_off` | `0x200000020` | | **1** | **1** |

      `csrrci` read the old `sstatus` into `a5` and cleared SIE in the same instruction. Since
      `noff` was 0, `intena` took the old SIE bit: 1. Then [[pop_off]] took `noff` back to 0,
      saw `intena == 1`, and executed `csrsi sstatus,2` (`0x80000c4c`): SIE on again.

      Before `consoleread` was even reached, the same pair ran four more times (three in
      [[argraw]], via [[argaddr]], [[argint]] and `argfd`'s `argint`, and one in [[argfd]]
      itself), each time turning SIE off and back on. A
      `push_off` level is not always a lock. `myproc` and [[uartputc_sync]] use it too, which
      is why `noff` can be larger than the number of locks held.

  - title: "consoleread takes cons.lock: noff 1, intena 1"
    file: kernel/spinlock.c
    lines: 88-103
    focus: 97-102
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: [cons.lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, acquire, push_off]
      sp: {"on": kernel, detail: "sp = 0x3fffffbec0 inside push_off"}
    note: |
      [[consoleread]] was entered with SIE on (`sstatus = 0x200000022`, `a2 = 1`: `sh` reads
      one byte at a time). Its first act is `acquire(&cons.lock)`, and [[acquire]]'s first act
      is `push_off`:

      ```text
      0x80000bb8  csrrci a5,sstatus,2   a5 = 0x200000022   sstatus -> 0x200000020
      0x80000bc2  lw     a5,120(a0)     noff was 0, so ...
      0x80000be4  sw     a5,124(a0)     intena = 1         (cpus[0] + 124 = 0x8000fa4c)
      0x80000bce  sw     a5,120(a0)     noff   = 1         (cpus[0] + 120 = 0x8000fa48)
      ```

      Only then does the `amoswap.w.aq` spin take `cons.lock` (at `0x8000f890`). The order
      matters: interrupts are off **before** the lock is held, so there is no instant where
      this hart holds `cons.lock` with SIE on. If there were, a keystroke interrupt could
      arrive, [[consoleintr]] would try to take `cons.lock` on the same hart, and spin
      forever, because the holder is the code it interrupted
      ([[concept:locks#handlers]]).

      From here on, `intena = 1` records one fact: "when `sh`'s thread started holding things
      on this hart, interrupts were on". Every `release` below consults it.
    others: |
      Another hart that wanted `cons.lock` now would spin in `acquire`, with its own SIE off.
      Typing a key now would raise the UART interrupt; the PLIC can deliver it to any hart
      with SIE on, and that hart's `consoleintr` would wait for hart 0 to release the lock.

  - title: "noff 2: a myproc inside the critical section"
    file: kernel/console.c
    lines: 87-108
    focus: 99-104
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: [cons.lock]
      irq: {noff: 2, intena: 1, note: "the second level is myproc's push_off, not a lock"}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, myproc]
      sp: {"on": kernel, detail: "sp = 0x3fffffbec0"}
    note: |
      The buffer is empty (`cons.r == cons.w`), so line 100 calls `killed(myproc())`.
      `myproc`'s `push_off` now runs **inside** the critical section:

      | | `a5` (old `sstatus`) | noff | intena |
      |---|---|---|---|
      | `csrrci` | `0x200000020` (SIE already 0) | 1 | 1 |
      | end of `push_off` | | **2** | 1 (untouched) |
      | end of `pop_off` | | 1 | 1 |

      This is why `push_off` only writes `intena` when `noff == 0`. The old SIE here is 0,
      because `acquire` already cleared it. If the nested call recorded that 0, the final
      release would leave interrupts off for the rest of the system call. And this `pop_off`
      at `noff` 2 → 1 must not turn interrupts on, or `cons.lock` would be held with SIE on.
      The counter handles both.

      Then [[killed]] acquires `sh`'s `p->lock`: `noff` 2 again, this time with two real
      locks, and back to 1 at its release.

  - title: "sleep_prepare: two locks, noff 2"
    file: kernel/proc.c
    lines: 545-556
    focus: 549-555
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: [cons.lock, "sh's p->lock"]
      irq: {noff: 2, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, sleep_prepare]
      sp: {"on": kernel, detail: "sp = 0x3fffffbee0"}
    note: |
      [[sleep_prepare]] registers `sh` on the channel `&cons.r`. First a `myproc` (noff
      1 → 2 → 1, as before). Then `acquire(&p->lock)` for `sh`'s lock at `0x8000ff38`:

      - `csrrci` returns `a5 = 0x200000020`: SIE was already off.
      - `noff` becomes 2. `intena` stays 1.

      Two spinlocks are held, `cons.lock` and `sh`'s `p->lock`, in that order, which matches
      the measured edge `cons.lock → p->lock` ([[concept:locks#order]]). `p->chan` is set,
      and the `release` at line 555 drops `noff` to 1. Its `pop_off` sees `noff == 1` and
      leaves SIE alone.

      Why is it safe to register before letting go of `cons.lock`? Because a
      [[wakeup]] that runs any time after this point finds `chan == &cons.r` and clears it,
      so the coming [[sleep]] will return at once instead of sleeping through it
      ([[concept:locks#sleep-wakeup]]).
    others: |
      A [[wakeup]] on another hart would scan all 64 `p->lock`s and spin on `sh`'s for the
      few instructions hart 0 holds it. The UART interrupt handler is the one that calls
      `wakeup(&cons.r)`; it cannot run here on hart 0 while SIE is off.

  - title: "release(&cons.lock): the pop_off that turns SIE back on"
    file: kernel/spinlock.c
    lines: 105-116
    focus: 111-115
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_read, fileread, consoleread, release, pop_off]
      sp: {"on": kernel, detail: "sp = 0x3fffffbed0"}
    note: |
      Line 105 of `consoleread` releases `cons.lock`. [[release]] stores 0 into the lock word
      (after `fence rw,w`) and then calls [[pop_off]]:

      ```text
      0x80000c42  addiw a5,a5,-1     noff 1 -> 0
      0x80000c48  lw    a5,124(a0)   intena = 1
      0x80000c4c  csrsi sstatus,2    sstatus 0x200000020 -> 0x200000022
      ```

      This is the **only** way a `release` turns interrupts on: the counter reaches 0 *and*
      `intena` says they were on before. From here until the next `acquire`, `sh` can be
      interrupted. Notice what the window is for: if the Enter key (completing a line) arrives
      now, the UART interrupt can run on this very hart, take `cons.lock`, and call
      `wakeup(&cons.r)`, which
      clears `sh`'s `chan`. The coming `sleep()` would then return at once.

      Note the address `0x80000c50`, the instruction right after this `csrsi`. It will come
      back three times in this tour.

  - title: "sleep(): intena is re-recorded, noff 1"
    file: kernel/proc.c
    lines: 558-572
    focus: 564-569
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: ["sh's p->lock"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, sleep]
      sp: {"on": kernel, detail: "sp = 0x3fffffbee0"}
    note: |
      [[sleep]] calls `myproc` (another 0 → 1 → 0, SIE off and on), then `acquire(&p->lock)`.
      gdb at that `push_off`:

      - before: `sstatus = 0x200000022`, `noff = 0`
      - `csrrci`: `a5 = 0x200000022`, so the old SIE is 1
      - after: `noff = 1`, `intena = 1`

      `intena` was already 1, but it was **written again**: this is a new outermost
      `push_off`. The value that matters for the coming switch is this one, recorded with
      `sh`'s `p->lock` as the only lock.

      `p->chan` is still `&cons.r` (no key yet), so `sh` becomes `SLEEPING` and calls
      [[sched]]. It holds exactly one spinlock, its own `p->lock`, which the scheduler will
      release for it ([[concept:locks#handoff]]).

  - title: sched's checks read noff and SIE
    file: kernel/proc.c
    lines: 479-497
    focus: 483-492
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: ["sh's p->lock"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, sleep, sched]
      sp: {"on": kernel, detail: "sp = 0x3fffffbeb0"}
    note: |
      [[sched]]'s own `myproc()` takes `noff` to 2 and back to 1 (the trace shows both). Then
      the checks, as compiled:

      - line 487: `lw a4,168(a5)` at `0x80001e54` loads `cpus[0].noff` (168 is 120 plus the
        48 bytes from `pid_lock`, the base the compiler uses, to `cpus`). It is **1**. Had
        `consoleread` called `sleep` while still holding `cons.lock`, it would be 2 and the
        kernel would `panic("sched locks")`.
      - line 491: `csrr a5,sstatus` at `0x80001e66` reads `0x200000020`: SIE is 0, so no
        `panic("sched interruptible")`.

      The `noff == 1` rule is the code version of "never sleep holding a spinlock". A sleeping
      thread cannot release anything, so a second lock would stay held, with interrupts off on
      whatever hart wants it, for as long as `sh` sleeps. Sleep-locks are not counted in
      `noff`, which is why they may be held across a sleep ([[concept:locks#rules]]).

  - title: "sched saves intena in s3: the value is 1"
    file: kernel/proc.c
    lines: 479-497
    focus: 494-495
    state:
      hart: 0
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: ["sh's p->lock"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_read, fileread, consoleread, sleep, sched, swtch]
      sp: {"on": kernel, detail: "sp = 0x3fffffbeb0 at the call"}
    note: |
      Line 494 compiles to one load:

      ```text
      0x80001e7e  lw   s3,172(a5)    a5 = 0x8000f9a0, so this reads 0x8000fa4c = cpus[0].intena
                                     s3 = 1
      0x80001e98  jal  swtch         swtch(&p->context, &cpus[0].context)
      ```

      `s3` is a callee-saved register, so [[swtch]] stores it into `sh`'s `p->context`
      along with `ra` and `sp`. From this moment, `sh`'s "interrupts were on" no longer lives
      in `cpus[0]`. It lives in `sh`'s saved context, and it will come back wherever and
      whenever `sh` runs again, possibly on hart 1 or 2.

      `noff` is not saved. It is 1 on both sides of every `swtch`, because the one lock held
      is the one being handed over. The comment above `sched` ([[kernel/proc.c:472]]) says
      why `intena` is not simply a field of `struct proc`: some code holds locks with no
      process at all (the scheduler, boot).
    others: |
      At this instant hart 2 is still running pid 4's `exec`, with `cpus[2].noff = 2` and
      `cpus[2].intena = 1`: its own values for its own thread. Hart 1 is in its scheduler,
      and if its scan reaches slot 1 now it spins on `sh`'s `p->lock` until hart 0's
      scheduler releases it below.

  - title: "The scheduler inherits intena 1 and erases it (line 456)"
    file: kernel/proc.c
    lines: 444-464
    focus: 453-456
    state:
      hart: 0
      mode: S
      proc: "none (hart 0's scheduler; c->proc still points at sh)"
      intr: "off"
      satp: kernel
      locks: ["sh's p->lock"]
      irq: {noff: 1, intena: 0, note: "line 456 has just changed intena from 1 (sh's value) to 0"}
      stack: [main, scheduler]
      sp: {"on": scheduler, switched: "`ld sp, 8(a1)` in [[swtch]] ([[kernel/swtch.S:26]])", detail: "sp = 0x80008810, hart 0's slice of stack0"}
    note: |
      `swtch` returns into the scheduler at `0x80001df0`. gdb, before and after line 456
      (`sw zero,172(a5)` at `0x80001df8`):

      | | noff | intena | SIE |
      |---|---|---|---|
      | after `swtch` | 1 | **1** (left by `sh`) | 0 |
      | after line 456 | 1 | **0** | 0 |

      `cpus[0]` is a per-hart structure, so the scheduler inherits whatever the last thread
      left there. Here that is `sh`'s 1. The scheduler's own truth is different: its
      interrupts are off on purpose (line 442). Without line 456, the `release` at line 463
      would see `noff` 0 and `intena` 1 and execute `csrsi`, turning interrupts on in the
      middle of the scan. The later `acquire`s in that same pass would then record `intena = 1`,
      and a new process picked later in that pass would carry the wrong 1 into [[forkret]]
      (compare step 18). Lines 441–442 reset SIE before the next pass, so the damage lasts
      one pass at a time.

      So there are **two** safeguards, one for each direction:

      - line 456 protects the scheduler from the process's `intena`;
      - [[sched]]'s save and restore protects each process from the scheduler's `intena`.

  - title: The scheduler releases sh's lock with SIE staying off
    file: kernel/proc.c
    lines: 444-464
    focus: 463
    state:
      hart: 0
      mode: S
      proc: "none (hart 0's scheduler)"
      intr: "off"
      satp: kernel
      locks: []
      irq: 0
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "sp = 0x80008810"}
    note: |
      `c->proc = 0`, then `release(&p->lock)` on `sh`'s lock. `sh` is now `SLEEPING` (state
      2 in our trace). The release's `pop_off` takes `noff` from 1 to 0, finds `intena == 0`,
      and skips the `csrsi`. SIE stays 0.

      One lock was acquired by `sh`'s thread in [[sleep]] and released by the scheduler's
      thread. `holding()` accepted it because the lock records the *hart*, `cpus[0]`, not the
      thread ([[concept:locks#holding]]).

      The scan goes on through the remaining 62 slots (2 to 63). Each `acquire` in the scan is
      an outermost `push_off` made with SIE off, so each one records `intena = 0`. Slot 3,
      pid 4, is `RUNNING` (on hart 2). Nothing else is `RUNNABLE`. `found` is already 1 (line
      461, because `sh` ran in this pass), so this pass skips `wfi`; the next pass finds
      nothing and reaches it.
    others: |
      As soon as `sh`'s lock is free, any hart may take it: a `wakeup(&cons.r)` from a
      keystroke on any hart would now find `SLEEPING` and make `sh` `RUNNABLE`. That is
      exactly the moment the hand-off was designed for: `sh`'s registers are saved, and no
      hart is on its stack.

  - title: One instruction with interrupts on, then wfi
    file: kernel/proc.c
    lines: 428-470
    focus: 442
    state:
      hart: 0
      mode: S
      proc: "none (hart 0's scheduler)"
      intr: "off"
      satp: kernel
      locks: []
      irq: 0
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "sp = 0x80008810"}
    note: |
      The loop goes round. In this build the instructions are laid out
      as:

      ```text
      0x80001e08  wfi                  only if found == 0
      0x80001e0c  csrsi sstatus,2      line 441: sstatus 0x200000020 -> 0x200000022
      0x80001e10  csrci sstatus,2      line 442: back to 0x200000020
      ```

      gdb saw the next pass: SIE 0, then 1 for exactly one instruction, then 0, then the scan,
      then `wfi`. `wfi` waits for an interrupt to become *pending*; it does not need SIE on,
      and with SIE off nothing is taken while it waits. When it returns, the `csrsi` opens the
      window and a pending interrupt is taken right there.

      Why off around `wfi`? If interrupts were on, a device interrupt could be handled
      between the scan and the `wfi` and make a process `RUNNABLE`; the hart would then sleep
      until the *next* interrupt with work waiting. Why on at all? So that, with every process
      asleep, the interrupt that wakes one of them can be taken. And note `noff` here: 0.
      This window is where the [[concept:locks#invariant|invariant]] is easiest to see: SIE is
      only ever 1 when `noff` is 0.

  - title: "A tick lands in the window: tickslock at noff 1, intena 0"
    file: kernel/trap.c
    lines: 166-180
    focus: 169-173
    state:
      hart: 0
      mode: S
      proc: "none (hart 0's scheduler)"
      intr: "off"
      satp: kernel
      locks: [tickslock]
      irq: {noff: 1, intena: 0}
      stack: [main, scheduler, kernelvec, kerneltrap, devintr, clockintr]
      sp: {"on": scheduler, detail: "a 256-byte kernelvec frame on top: sp = 0x800086e0 in kerneltrap"}
    note: |
      The `wfi` returned, the `csrsi` at `0x80001e0c` ran, and the timer interrupt was taken
      before the next instruction: [[kerneltrap]] reads `sepc = 0x80001e10`, `scause =
      0x8000000000000005` (supervisor timer), `sstatus = 0x200000120`. That `sstatus` now has
      SPP set (`0x100`, came from S-mode) and SPIE set (`0x20`, SIE was 1 when the trap hit).
      [[kernelvec]]'s `addi sp,sp,-256` pushed its frame onto the **scheduler stack**: there
      is no separate interrupt stack.

      At `clockintr`'s `acquire(&tickslock)` gdb shows `noff = 0`, `intena = 0` (stale), SIE
      0. The `push_off` reads an `sstatus` whose SIE is 0, so it records **intena 0** and
      `noff` becomes 1. Hart 0 is the only hart that counts time: `ticks` goes from 12 to 13,
      and [[wakeup]] scans all 64 `p->lock`s at `noff` 2.

      Two facts about interrupt context, both visible here:

      - It always starts at `noff == 0`. It has to: SIE can only be 1 when `noff` is 0. In a
        separate run of `grind` (about a minute of wall-clock time, slowed by gdb) with a
        breakpoint on `kerneltrap`, gdb counted **43,104** kernel-mode traps on the three
        harts, and none of those whose `noff` it could read had `noff ≠ 0` (one read
        failed). Most hit idle schedulers; 2,103 interrupted a process and 929 were timer
        ticks. In the tour's own run, all 310 kernel traps checked were at `noff` 0 too.
      - Everything a handler takes records `intena = 0`, so its releases never turn
        interrupts on inside the handler.

      `myproc()` is 0 here, so there is no `yield`. `kernelvec`'s `sret` returns to
      `0x80001e10` with SIE restored from SPIE, and the `csrci` turns it off again.
    others: |
      Of those 43,104 traps, 40,920 arrived at `0x80001e10`, the instruction after this
      `csrsi`, and 1,953 at `0x80000c50`, the instruction after [[pop_off]]'s `csrsi`. An
      interrupt that becomes pending while a hart has SIE off simply waits, and it is taken
      the instant SIE comes back on. That is the [[concept:locks#invariant|invariant]] doing
      its job: no hart ever takes an interrupt in the middle of a critical section.

