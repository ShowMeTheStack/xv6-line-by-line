      stack: [kernelvec, kerneltrap, devintr, clockintr, wakeup]
      sp: {"on": kernel, detail: "KSTACK(5), sp = 0x3fffff3d80 in wakeup's acquire"}
    note: |
      `acquire(&tickslock)` (the lock named `time`, at `0x800157d0`). gdb at its `push_off`:

      | | `a5` from `csrrci` | noff | intena |
      |---|---|---|---|
      | before | | 0 | 1 (stale) |
      | after | `0x200000120` (SIE 0) | **1** | **0** |

      The stale 1 is gone: an outermost `push_off` in a handler records the handler's truth.
      `ticks` goes from 17 to 18 and [[wakeup]] walks all 64 slots, each `acquire` taking
      `noff` to 2 and each `release` back to 1, `intena` 0 throughout. gdb saw `init`
      (pid 1), `sh` (pid 2) and `grind` pid 5 `SLEEPING` among them.

      This is the pair the whole mechanism exists for. [[sys_pause]] holds `tickslock` in
      process context. If a timer interrupt could arrive on the same hart while it does,
      `clockintr` would spin on `tickslock` forever, since its holder cannot run until the
      handler returns. `push_off` in `sys_pause`'s `acquire` makes that impossible. The evidence: none of the
      2,103 measured traps that interrupted process code, nor the 310 checked in this run,
      arrived at `noff` above 0.

      The `release(&tickslock)`: `noff` 1 → 0, `intena` 0, SIE stays off.
    others: |
      `tickslock` is a global, so another hart's `sys_pause` could hold it now. Then hart 0
      spins here, in interrupt context, with SIE off; that is fine, because the holder is on
      another hart and will finish. Only *same-hart* waiting is a deadlock.

