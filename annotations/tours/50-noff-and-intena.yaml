quiz:
  - q: "In step 4 the nested `push_off` saw an old SIE of 0. Why must it not write that 0 into `intena`, and what would the user notice if it did?"
    a: "`intena` must describe the state before the *outermost* `push_off`, which was 1. If the nested call stored 0, the final `release(&cons.lock)` in step 6 would skip the `csrsi`, and `sh` would continue its system call, and every later outermost `push_off` would re-record 0, with interrupts off until it returned to user mode. Timer preemption and device interrupts on that hart would be delayed for the rest of the system call."
  - q: "Steps 9 and 21 both end in a call to `swtch` from `sched`, with `noff = 1`. Why does `s3` differ, and where does each value come from?"
    a: "`s3` is loaded from `cpus[0].intena`, which the last outermost `push_off` wrote. In step 9 the value came from `sleep`'s `acquire` (step 7), run in a system call with SIE on, so 1. In step 21 it was `yield`'s `acquire`, run inside `kerneltrap` with SIE off, so 0."
  - q: "Remove only line 496 (sched's restore). Which of this tour's three threads (`sh`, pid 4, pid 7) behave differently, and how?"
    a: "Of the suspensions shown, only `sh`'s. Every thread resumes with the 0 the scheduler's `acquire` recorded. That is correct for pid 4 and pid 7 in the suspensions shown here, which saved 0 anyway; but any thread that sleeps in a system call is affected like `sh` (pid 4 and pid 7 also do, later in this run, with `s3 = 1`). `sh` saved 1; it would resume with 0, `sleep`'s `release` would leave SIE off, and the rest of `sh`'s `read` would run with interrupts off."
  - q: "Remove both line 456 and line 496. Trace what happens in steps 10–16 with the values you saw."
    a: "In step 10 `cpus[0].intena` stays 1 (`sh`'s). The `release` in step 11 then executes `csrsi`, and the rest of *that* scan runs with SIE on, each `acquire` recording 1; a process picked later in that same pass would get 1. Pid 4 is not: lines 441–442 turn SIE off before the next pass, so its `acquire` in step 14 still records 0. Had pid 4 been RUNNABLE further along that first pass, then with no restore its `release` in `yield` would turn SIE on inside `kerneltrap`, and an interrupt between `csrw sepc` and `csrw sstatus` would leave `sepc` pointing into `kerneltrap`, and `kernelvec`'s `sret` would jump there with the frame already popped."
  - q: "gdb counted 43,104 kernel-mode traps and found none at `noff > 0`, and most of them at `0x80001e10` or `0x80000c50`. Explain both facts."
    a: "An *interrupt* can be taken in S-mode only while SIE is 1 (a kernel exception would panic), and SIE is 1 only when `noff` is 0 (every `push_off` clears it first; only `pop_off` at `noff` 0, `usertrap`'s `intr_on`, the scheduler's `intr_on` and `sret` set it). An interrupt that becomes pending while SIE is off waits, so it is delivered on the first instruction after SIE comes back on: right after the scheduler's `csrsi` (`0x80001e10`) or `pop_off`'s `csrsi` (`0x80000c50`)."
  - q: "Why does `forkret` need no saved `intena`, and why is 0 the right value for it?"
    a: "A new process has no `sched` frame to restore from; it inherits whatever the scheduler's `acquire` recorded, which is always 0 because the scheduler acquires with SIE off. 0 is right because `forkret` goes straight to `prepare_return`, which turns interrupts off before changing `stvec`, and `sret` turns them on in user mode through SPIE."
