      interrupts; the pending tick was taken on the very next instruction; and pid 4 now
      resumes that instruction on **hart 0**, with SIE on, exactly as if nothing had happened.

      Interrupts came back on only here, by `sret`, at `noff` 0, in the code that had them on
      before the trap. That is the whole contract: `intena` 0 kept the handler closed, and
      SPIE carried the "they were on" fact across the trap instead.

