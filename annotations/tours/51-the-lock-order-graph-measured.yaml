quiz:
  - q: "The recorder saw `p->lock → itable.lock`, `itable.lock → lk->lk` and `lk->lk → p->lock`. Why is this cycle not a deadlock risk?"
    a: "The middle edge occurs only in `iput` when `ref == 1`: the caller holds the only reference and has already unlocked the inode. No other process can be inside `acquiresleep` or `releasesleep` on that inode's lock, so the instance of `lk->lk` in the middle edge is never the one held in the last edge."
  - q: "`kfork` releases `np->lock` on line 294 and retakes it on line 300. Which edge would appear in the graph if it held the lock across `acquire(&wait_lock)`, and what would it form a cycle with?"
    a: "`p->lock → wait_lock`. With `kexit`'s and `kwait`'s `wait_lock → p->lock`, it makes a two-node cycle; a `kexit` holding `wait_lock` and walking the table in `wakeup` would spin on the child's lock while `kfork` spins on `wait_lock`."
  - q: "The main run's deepest sleep-lock nesting was 3, but our test program reached 4. What did it have to build, and why did `usertests` never get there?"
    a: "A directory with 768 entries (12 full blocks), so that `create`'s `dirlink`, holding the directory and the new inode, needs an indirect block: `bmap` holds it while `balloc` reads the bitmap. No test builds a directory that large; with only 200 inodes, the program used hard links to one file."
  - q: "Why can every condition lock call `wakeup` while held, but no code may take a condition lock while holding a `p->lock`?"
    a: "`wakeup` takes every `p->lock`, so its callers create `condition → p->lock`. A sleeper must register under its condition lock and give up the CPU holding only `p->lock` (`sched` checks `noff == 1`). If some path held a `p->lock` and wanted a condition lock, a waker inside `wakeup` holding that condition lock could wait for the same `p->lock`: a two-lock cycle."
  - q: "The recorder never saw `pi->lock → kmem.lock` in the workload. Is the edge possible, and is it dangerous?"
    a: "It is possible: `piperead`'s `copyout` and `pipewrite`'s `copyin` call `vmfault` → `kalloc` when the user buffer is a lazily allocated page, and our test program produced both. It is not dangerous because `kmem.lock` is a leaf: nothing is acquired while holding it, so no cycle can pass through it."
  - q: "`begin_op` is not a lock. What did the recorder check about it, and why does that matter for deadlock?"
    a: "It checked whether the process held any lock, spinlock or sleep-lock, when it entered `begin_op` or `end_op`: never, in 13,251 operations. `begin_op` can sleep until a commit that needs every running operation to finish; waiting there while holding an inode another operation needs would deadlock."
