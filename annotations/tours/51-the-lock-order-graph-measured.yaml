  - title: What keeps the graph true
    file: kernel/proc.c
    lines: 472-497
    focus: 485-492
    state:
      hart: 2
      mode: S
      proc: wc (pid 5, waiting for input)
      intr: off
      satp: kernel
      locks: ["wc's p->lock"]
      stack: [usertrap, syscall, sys_read, fileread, piperead, sleep, sched]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      None of xv6's lock checks looks at order. [[acquire]], [[release]] and [[pop_off]]
      catch misuse by one hart; [[iunlock]], [[brelse]] and [[bwrite]] check
      [[holdingsleep]]; and these lines in [[sched]] insist that a process switch away holding
      **exactly one** spinlock, its own `p->lock`. That last check is what pins `p->lock` at the bottom of every condition lock: a sleeper must
      release `pi->lock` before [[sleep]], so the condition lock is always the outer one.

      What the measurement adds to [[tour:18]]:

      - The graph has 15 spinlock → spinlock edges (counting every `lk->lk` as one class),
        all pointing down the ranks of step 15, except `itable.lock → lk->lk`, which closes
        the one cycle among spinlock classes; the `ref == 1` argument rules it out between
        instances, as it does the sleep-lock cycle `inode → itable.lock → inode`.
      - `p->lock` is almost a leaf: four leaves under it, only for a slot being born or a
        zombie being freed.
      - The deepest nesting is `noff` 3, on three paths, the commonest 227,333 times (pages freed while reaping about 6,700 children); the most
        sleep-locks held at once was 3, and 4 is reachable.
      - Besides every inode + buffer pair, six places hold two sleep-locks *of the same kind*: `create`, `unlink`, `bmap`, `itrunc`, `write_log`,
        `install_trans`, and `iput` holds a spinlock over one.

      The cost of the discipline is small: a release and re-acquire in [[kfork]], one in
      [[bget]], one in `create`, one in `sys_link`, a refusal in `sys_unlink`. In exchange, three
      harts took nearly 29 million locks without one deadlock.

