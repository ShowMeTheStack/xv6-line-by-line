      tree by refusing hard links to directories (line 139). The two holders above both take
      a directory and then something named inside it.


  - title: "Inode → buffer → buffer: three sleep-locks, and four"
    file: kernel/fs.c
    lines: 420-459
    focus: 437-453
    state:
      hart: 0
      mode: S
      proc: lkpaths d (pid 3, our test program)
      intr: on
      satp: kernel
      locks: ["dd's inode (sleep-lock)", "dd/new's inode (sleep-lock)", "dd's indirect block (sleep-lock)", "bitmap block (sleep-lock)"]
      stack: [usertrap, syscall, sys_open, create, dirlink, writei, bmap, balloc]
      sp: kernel
      irq: 0
    note: |
      Every file operation holds an inode while it reads buffers: `inode → buffer`. Two
      places hold two buffers under an inode. [[bmap]] holds the indirect block (line 445)
      while [[balloc]] reads the bitmap block (line 75) and then [[bzero]] reads the new
      block; [[itrunc]] holds the indirect block while [[bfree]] reads the bitmap. The
      main run's maximum, **3 sleep-locks**, came in two shapes:

      | Shape | Times reached |
      |---|---|
      | two inodes + a buffer (`create`, `unlink`) | 31,719 |
      | an inode + two buffers (`bmap`, `itrunc`) | 1,221 |

      The code allows **4**: `create` holds two inodes, and if `dirlink` must grow a
      directory past its 12 direct blocks (768 entries of 16 bytes), `bmap` holds the indirect
      block under both. No test makes a directory that large. So we wrote a program that
      fills `dd` with one file and 765 hard links (768 entries counting `.` and `..`), then
      creates `dd/new`. The recorder printed `maxsleep=4` with exactly this chain.
    others: |
      Is `buffer → buffer` safe? The bitmap block is a leaf among buffers: [[balloc]] and
      [[bfree]] take no other buffer while holding it (only `log.lock` and `bcache.lock` in
      [[log_write]]), and `balloc` releases it (line 81) before
      [[bzero]] reads the new block. The block `bzero` reads was free a moment ago, so no
      operation can be holding it.

  - title: "Buffer → buffer in commit, with nothing else held"
    file: kernel/log.c
    lines: 186-212
    focus: 192-198
    state:
      hart: 2
      mode: S
      proc: echo (pid 6, the last end_op)
      intr: on
      satp: kernel
      locks: ["log block 3 (sleep-lock)", "x's data block (sleep-lock)"]
      stack: [usertrap, syscall, sys_write, filewrite, end_op, commit, write_log]
      sp: kernel
      irq: 0
    note: |
      [[write_log]] holds a log block (`to`, line 193) while it reads the home block (`from`,
      line 194). [[install_trans]] does the reverse copy with the same nesting: log block
      (line 76), then home block (line 77). In the second run each made 6,537 such pairs, one
      per block committed.

      Could a log block → home block wait close a cycle? Only if someone held the home block
      and waited for a log block, and only the commit path touches log blocks. Moreover,
      [[commit]] runs only when `log.outstanding` is 0, with `committing` set so every new
      [[begin_op]] waits. No file-system operation is inside a transaction during it. A
      reader in [[fileread]] (which uses no transaction) might hold the home block for a
      moment, but it never waits for anything the commit holds.

      The recorder confirms the context: none of its three-sleep-lock snapshots involves
      `write_log` or `install_trans`, so the committing process held no inode, and
      `log.lock` had been released at [[kernel/log.c:172]].


  - title: begin_op behaves like the outermost lock
    file: kernel/log.c
    lines: 127-150
    focus: 131-147
    state:
      hart: 1
      mode: S
      proc: echo (pid 6, echo hi > x)
      intr: off
      satp: kernel
      locks: [log.lock]
      stack: [usertrap, syscall, sys_write, filewrite, begin_op]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      [[begin_op]] is not a lock, but it can make a process wait, until a commit, so it
      belongs in the order. The rule: call it **before** any inode lock, and call [[end_op]]
      only after releasing them. If `begin_op` waited while holding an inode that an
      operation already inside the transaction needs, that operation could never reach its
      `end_op`, and the commit it waits for would never come ([[tour:18]] has the timeline).

      Is that rule written down? Not as such. The comments say that every file-system call
      must be bracketed by `begin_op`/`end_op` ([[kernel/log.c:18]]) and that [[iput]] and
      [[namex]] must run inside a transaction ([[kernel/fs.c:347]], [[kernel/fs.c:690]]).
      The ordering lives in the code: in every caller (`sys_open`, `sys_unlink`, `sys_link`,
      `sys_mkdir`, `sys_mknod`, `sys_chdir`, [[kexec]], [[filewrite]], [[fileclose]],
      [[kexit]], [[ireclaim]]), `begin_op` comes first.

      The recorder checked it at run time. Line 131 ran 13,251 times in the second run, and
      the number of times the process held any lock then, spinlock or sleep-lock, was **0**. The same for
      `end_op`'s line 159. `begin_op` had to wait 1,136 times (lines 134–143), each time holding
      nothing.
    others: |
      One near miss in [[sys_open]]: on a failure at line 368 it calls [[fileclose]] while
      holding the inode, and `fileclose` can call `begin_op`. It does not here, because the
      just-allocated file still has type `FD_NONE`, so `fileclose` skips the inode branch.

