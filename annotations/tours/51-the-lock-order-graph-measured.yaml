  - title: Why the spinlock graph has no other cycle
    file: kernel/proc.c
    lines: 105-150
    focus: 114-125
    state:
      hart: 1
      mode: S
      proc: sh (pid 3, forking wc)
      intr: off
      satp: kernel
      locks: ["slot 4's p->lock (becoming pid 5)", pid_lock]
      stack: [usertrap, syscall, sys_fork, kfork, allocproc, allocpid]
      sp: kernel
      irq: {noff: 2, intena: 1}
    note: |
      [[allocproc]] scans slots taking each `p->lock` with nothing held (line 115), and under
      the one it keeps, takes `pid_lock` (line 125 → [[allocpid]]). That is the shape of the
      whole spinlock graph. Give each class a rank:

      | Rank | Classes |
      |---|---|
      | 1 | `wait_lock`, `pi->lock`, `tickslock`, `disk.vdisk_lock`, `log.lock`, `cons.lock`, a sleep-lock's `lk->lk` |
      | 2 | `p->lock` |
      | 3 | `pid_lock`, `kmem.lock`, `ftable.lock`, `itable.lock`, `bcache.lock`, `pr.lock` |

      Every measured spinlock → spinlock edge goes from a lower rank to a higher one, except
      `itable.lock → lk->lk` (step 13). Within rank 1 the edges are `wait_lock → kmem`,
      `log.lock → bcache`, `cons.lock → pr`: all into rank 3. No two rank-1 locks are ever
      held together. A path can only move to higher ranks, so it can never come back to a
      lock that is waiting on it.

      This is why the scheduler is safe too: [[scheduler]] takes `p->lock` with nothing held,
      4.1 million times in the second run, and under it takes nothing.


  - title: "Sleep-locks: parent directory, then child, in create"
    file: kernel/sysfile.c
    lines: 258-326
    focus: 280-294
    state:
      hart: 2
      mode: S
      proc: sh (pid 6, opening x for echo hi > x)
      intr: on
      satp: kernel
      locks: ["/'s inode (sleep-lock)", "x's new inode (sleep-lock)"]
      stack: [usertrap, syscall, sys_open, create, ilock]
      sp: kernel
      irq: 0
    note: |
      Now the sleep-locks. The `inode → inode` edge was recorded 736 times in the main run. The
      second run's call chains show **only two places** that hold two inode sleep-locks at once:

      | Held | Acquired | Count |
      |---|---|---|
      | [[create]]'s `dp`, line 267 | the new inode, line 294 (open, mkdir, mknod) | 291 + 62 + 1 |
      | [[sys_unlink]]'s `dp`, line 218 | the entry `ip`, line 226 | 381 |

      Here, `x` does not exist, so [[ialloc]] picks a free inode and line 294 locks it while
      `dp` is held: parent, then child. The child is brand new; no one else can be holding it.

      The existing-name path is different. Line 281 unlocks `dp` *before* line 282 locks `ip`.
      The data agree: `create:282` never appears holding another inode. That release is what
      makes `open("a/.", O_CREATE)` safe: `dirlookup` returns `a` itself, and locking it
      while holding it would be a sleep-lock waiting for itself. [[acquiresleep]] has no check
      for that; the process would sleep forever.


