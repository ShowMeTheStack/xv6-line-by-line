title: "The lock-order graph, measured"
group: Locks and interrupt state
prerequisites: [15, 16, 17, 18]
summary: |
  [[tour:18]] derived xv6's lock order by reading the code: find each place that holds two
  locks, check that it agrees with the others. This tour does the opposite. We let the kernel
  tell us. A copy of the kernel with a small recorder in its lock functions ran a real
  workload on three [[g:hart|harts]] (boot, `ls | wc`, `usertests -q` with every test
  passing, `stressfs`, `forktest`, `cat README | grep the | wc`) and wrote down, for every one
  of nearly 29 million lock acquisitions, which locks the same hart or the same process was
  already holding.

  The result is a graph: an arrow from A to B for every "B was acquired while A was held".
  Then we explain every arrow by the line that creates it, with how often it happened. You
  will see the deepest nesting the kernel reaches, the one cycle among the spinlock classes (and why it
  cannot deadlock), and the code paths the workload never reached, some of which we then
  drive on purpose.

  All numbers are from our runs of this build. The main run gives the totals. A second run of
  the same workload, with a recorder that also kept call chains, gives the per-site
  breakdowns; its totals differ by a few percent because timing differs between runs.
cast: |
  The recorder ran on all three harts at once. The workload is ordinary: a shell, pipelines,
  `usertests` forking thousands of children, `stressfs` writing files from several processes.

  | Hart | What it is doing |
  |---|---|
  | 0 | The only hart that runs [[clockintr]]'s `ticks++`; otherwise like the others |
  | 1 | Running processes, taking interrupts, idling in [[scheduler]] |
  | 2 | The same |

  When the workload is done, we type Ctrl-P. The recorder prints its tables from inside
  [[procdump]], and that readout itself adds one edge to the graph.
steps:
  - title: The recorder's hook in acquire
    file: kernel/spinlock.c
    lines: 19-42
    focus: 37-41
    state:
      hart: 1
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: [pi->lock]
      stack: [usertrap, syscall, sys_read, fileread, piperead, acquire]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      `wc` (pid 5) has just won the swap on line 37 for its pipe's lock and recorded
      `lk->cpu` on line 41. In the measured copy of the kernel, one call was added right after
      line 41. That is the moment the lock is truly held and interrupts are off
      ([[push_off]] on line 24), so the recorder cannot be interrupted on this hart.

      The recorder keeps, **per hart**, a small stack of the spinlocks that hart holds. When
      [[acquire]] succeeds, it does three things:

      1. For every lock already on this hart's stack, it counts an edge "held → this one".
         Here the stack is empty, so `pi->lock` gets no incoming edge.
      2. It notes whether the hart is inside an interrupt handler (a counter set around
         [[devintr]]) and the current `noff`.
      3. It pushes `pi->lock`. [[release]] pops it again.

      Locks are grouped into **classes** by name: all 64 `p->lock`s are one class `proc`, every
      pipe's lock is `pipe`. The edges are *class* edges, which matters later.

      A single `push_off` that is not part of an acquire (in [[myproc]] or [[uartputc_sync]])
      is recorded only when it sets a new nesting record or reaches `noff` 3.
    others: |
      The recorder guards its shared tables with a private spinlock, which serializes every
      acquire in the machine and changes timing. The edges depend on code paths, not timing;
      exact counts move by a few percent from run to run.

  - title: Sleep-locks are tracked per process
    file: kernel/sleeplock.c
    lines: 21-44
    focus: 31-32
    state:
      hart: 2
      mode: S
      proc: rm (pid 7, rm d/f)
      intr: off
      satp: kernel
      locks: ["d's inode (sleep-lock)", "f's inode lk->lk (spinlock)"]
      stack: [usertrap, syscall, sys_unlink, ilock, acquiresleep]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      A sleep-lock is held across [[sleep]], and its holder may wake up on another hart. So
      a per-hart list would lose it. The recorder keeps a second list **per process slot**,
      pushed in [[acquiresleep]] once lines 31–32 have set `locked` and `pid`, and popped in
      [[releasesleep]].

      Here `rm` holds directory `d` and is locking the file `f` inside it ([[sys_unlink]]). When
      `f`'s lock is granted, the recorder counts a sleep-lock → sleep-lock edge `inode →
      inode`. When `rm` later takes `bcache.lock` inside [[bread]], it counts `inode →
      bcache` for each inode it holds. Sleep-lock → spinlock edges are not counted inside
      interrupt handlers: a handler runs on whatever process it interrupted but does not act
      for it.

      Two counting details matter when you read the numbers. An acquisition adds one edge
      per lock already held, so with two inodes held, one buffer acquisition counts twice.
      And the inner spinlock `lk->lk` is its own class (`inode.lk`, `buffer.lk`, `uart.lk`).
      One artifact follows: [[releasesleep]] takes `lk->lk` (line 39) before the hook pops the
      sleep-lock, so every sleep-lock appears "held" while its own inner spinlock is taken
      (`tx_lock → lk->lk`, for one). Those edges are not real nesting, and we ignore them.

      Notice line 32: [[myproc]] does a [[push_off]] of its own, so for a moment `noff` is 2
      here. That extra level shows up in the deepest-nesting results.
    others: |
      The third hook counts, inside [[sleep]], which sleep-locks a process holds as it goes to
      sleep. Buffer sleep-locks were held across a sleep 32,427 times, inode sleep-locks 1,165
      times, and `tx_lock` never: QEMU's UART is always ready to transmit, so [[uartwrite]] never
      sleeps while holding it (processes did wait to *get* it, 84 times in the second run).

  - title: Reading the results with Ctrl-P
    file: kernel/console.c
    lines: 146-154
    focus: 149-153
    state:
      hart: any
      mode: S
      proc: none
      intr: off
      satp: kernel
      locks: [cons.lock]
      stack: [scheduler, kernelvec, kerneltrap, devintr, uartintr, consoleintr, procdump]
      sp: {"on": scheduler, detail: "every process was asleep, so the interrupt landed on an idle hart"}
      irq: {noff: 1, intena: 0}
    note: |
      The recorder prints its tables at the end of [[procdump]], which runs when you type
      Ctrl-P, inside the UART interrupt, holding `cons.lock`. Only `init` and `sh` existed and
      both were asleep, so the interrupt was taken in some hart's [[scheduler]], with a
      [[kernelvec]] frame on the scheduler stack.

      The first line of output:

      ```text
      LS BEGIN maxnoff=3 maxsleep=3 edgeoverflow=0
      ```

      The deepest `noff` on any hart was 3; the most sleep-locks held by one process at
      once was 3; and no edge was lost. Then one line per class:

      | Class | Acquisitions | In interrupt handlers |
      |---|---|---|
      | `p->lock` | 26,327,578 | 1,366,848 |
      | `kmem.lock` | 1,025,207 | 0 |
      | `bcache.lock` | 409,426 | 0 |
      | buffer sleep-locks | 198,161 | n/a |
      | `disk.vdisk_lock` | 57,088 | 19,028 |
      | `log.lock` | 51,832 | 0 |
      | `wait_lock` | 24,111 | 0 |
      | inode sleep-locks | 11,893 | n/a |
      | `tickslock`, `cons.lock`, `pr.lock` | 871, 138, 290 | 578, 67, 5 |

      `p->lock` dominates because [[wakeup]] and the scheduler loop each take all 64 of them.
      Only five spinlock classes were ever taken in an interrupt handler. (The recorder does
      not check sleep-locks for interrupt context, hence "n/a".)

      One edge in the output exists only because of this readout. `procdump` calls
      [[printk]], which takes `pr.lock` while `cons.lock` is held: `cons.lock → pr.lock`, 5
      times, all in this interrupt.


  - title: "Edge 1: wait_lock → p->lock, in kexit"
    file: kernel/proc.c
    lines: 342-365
    focus: 347-355
    figure: t51-graph
    caption: |
      The graph the run produced. An arrow from A to B means B was acquired while A was held.
      `p->lock` sits below every condition lock; under it hang four leaves, taken only for a
      process slot under construction or a zombie being freed. The dashed arrow is the one
      upward edge, which closes the only cycle among spinlock classes (step 13). The
      sleep-locks in the top row have cycles of their own: the inode and buffer self-loops.
    state:
      hart: 2
      mode: S
      proc: wc (pid 5)
      intr: off
      satp: kernel
      locks: [wait_lock, "each p->lock in turn"]
      stack: [usertrap, syscall, sys_exit, kexit, wakeup]
      sp: kernel
      irq: {noff: 2, intena: 1}
    note: |
      Here is the whole graph. Now the arrows one at a time, starting with the only order
      xv6 writes down: `wait_lock` "must be acquired before any p->lock" ([[kernel/proc.c:26]]).

      `wc` is exiting. Line 347 takes `wait_lock`; then three places take `p->lock`s under it:

      | Site | `p->lock` acquisitions (second run) |
      |---|---|
      | [[wakeup]]`(p->parent)`, line 353 | 413,952 from `exit()`, plus 16,192 from killed processes |
      | [[reparent]] → `wakeup(initproc)`, line 317 | 170,176 |
      | its own lock, line 355 | 6,721 |

      413,952 is exactly 6,468 × 64: every `wakeup` walks all 64 slots. The 6,721 own-lock
      acquisitions match the 6,721 exits in that run, and the 6,722 forks: everyone who was
      forked, except the `sh` still alive, exited.

      Line 360 releases `wait_lock` while `p->lock` stays held into [[sched]]. Releasing out of
      order is harmless; only the order of *acquiring* can create a wait.
    others: |
      The main run counted 629,416 `wait_lock → p->lock` acquisitions in total. Nothing was ever
      acquired with `p->lock` held and then `wait_lock` taken: the reverse edge is absent from
      both runs. The next steps show the code that keeps it absent.

  - title: "Edge 2: wait_lock → child's p->lock → kmem.lock, the deepest spinlock nesting"
    file: kernel/proc.c
    lines: 369-419
    focus: 384-399
    state:
      hart: 0
      mode: S
      proc: sh (pid 3, reaping wc)
      intr: off
      satp: kernel
      locks: [wait_lock, "wc's p->lock (pid 5)", kmem.lock]
      stack: [usertrap, syscall, sys_wait, kwait, freeproc, kfree]
      sp: kernel
      irq: {noff: 3, intena: 1, note: "wait_lock, the child's p->lock and kmem.lock: three spinlocks, the most any hart held"}
    note: |
      The parent side. [[kwait]] holds `wait_lock` (line 376, or 417 after a sleep), takes a
      child's lock on line 384, and if the child is a `ZOMBIE`, frees it on line 398.
      [[freeproc]] calls [[kfree]] for the trapframe and every page of the child's memory, each
      taking `kmem.lock`. So this hart holds **three** spinlocks: `noff` is 3.

      This is the most common of the three `noff`-3 paths: **227,333** `kmem.lock`
      acquisitions at `noff` 3 in the main run, one per page freed, while reaping about 6,700
      children. The second run split them by where `wait_lock` came from: 65,772 under the first acquire
      (line 376), 161,314 under the re-acquire after a sleep (line 417). The parent usually
      had to wait for its child.

      `kwait` also takes its *own* `p->lock` under `wait_lock`, in [[killed]] (line 408) and
      [[sleep_prepare]] (line 414), 3,953 times each. But never while holding a child's: line
      403 releases the child first. So no path ever holds two `p->lock`s, and there is no
      `p->lock → p->lock` edge in the data.
    others: |
      Line 391 can also nest: [[copyout]] of the exit status runs with both locks held, and if
      the status variable lives in a lazily allocated page, [[vmfault]] calls [[kalloc]]. The
      workload never did that. A test program we wrote (step 21) did, once: the same `noff` 3,
      reached through `kalloc` instead of `kfree`.

  - title: "Edges 3–6: kfork holds the child's lock over four leaves"
    file: kernel/proc.c
    lines: 256-305
    focus: 288
    state:
      hart: 1
      mode: S
      proc: sh (pid 3, forking wc)
      intr: off
      satp: kernel
      locks: ["pid 5's p->lock (np)", itable.lock]
      stack: [usertrap, syscall, sys_fork, kfork, idup]
      sp: kernel
      irq: {noff: 2, intena: 1}
    note: |
      [[allocproc]] returns the new slot with its `p->lock` held ([[kernel/proc.c:115]]), and
      [[kfork]] keeps it while it builds the child. Every lock taken in that window becomes a
      `p->lock → X` edge. The second run's breakdown, for 6,722 forks:

      | Edge | Site | Count |
      |---|---|---|
      | `p->lock → pid_lock` | [[allocpid]] from allocproc line 125 | 6,722 |
      | `p->lock → kmem.lock` | trapframe, line 129; page table, line 136 | 6,722 + 6,722 |
      | | [[uvmcopy]] copying user pages, line 271 | 124,063 |
      | | page-table pages in [[mappages]] → [[walk]] | 30,920 |
      | `p->lock → ftable.lock` | [[filedup]], line 287 | 20,205 |
      | `p->lock → itable.lock` | [[idup]], line 288 | 6,722 |

      20,205 is almost exactly 3 × 6,722: nearly every process had three open files (fds 0,
      1, 2) to share with its child.

      Why is this safe? All four are **leaves**: code holding `pid_lock`, `kmem.lock` or
      `ftable.lock` acquires nothing, and the recorder confirms none of them has an outgoing
      edge. `itable.lock` has exactly one, in [[iput]], which step 13 deals with. A leaf can
      never be part of a cycle, because a cycle needs every member to wait while holding.


  - title: kfork lets go before taking wait_lock
    file: kernel/proc.c
    lines: 284-305
    focus: 296-298
    state:
      hart: 1
      mode: S
      proc: sh (pid 3, forking wc)
      intr: off
      satp: kernel
      locks: [wait_lock]
      stack: [usertrap, syscall, sys_fork, kfork]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      `kfork` needs `wait_lock` to set `np->parent`. Holding `np->lock` while asking for it
      would create `p->lock → wait_lock`, the reverse of edge 1. So line 294 releases the
      child first.

      The recorder confirms both halves. Of 6,722 acquisitions of `wait_lock` at line 296, the
      number made while holding anything: **0**. Of 6,722 acquisitions of `np->lock` at line
      300: **0**.

      What if line 294 were moved below line 298? A two-hart deadlock with `kexit`:

      | Time | Hart 1 (sh in kfork) | Hart 2 (cat in kexit) |
      |---|---|---|
      | t1 | holds pid 5's `p->lock` | holds `wait_lock` (line 347) |
      | t2 | `acquire(&wait_lock)`: spins | `wakeup` reaches slot of pid 5: spins |
      | t3 | spins forever, interrupts off | spins forever, interrupts off |

      Then every other `fork`, `exit` and `wait` piles up on `wait_lock`. In the graph this is
      the arrow `p->lock → wait_lock`, which would close a two-node cycle with edge 1.
    others: |
      Releasing for a moment is safe: pid 5 is still `USED`: not yet runnable and not reapable. Only `np->state = RUNNABLE` on line 301 makes it runnable, and from then on it may
      start on hart 0 or hart 2 at once.

  - title: The rarest edge in the graph, once per boot
    file: kernel/proc.c
    lines: 217-231
    focus: 226
    state:
      hart: 0
      mode: S
      proc: none (pid 1 being built)
      intr: off
      satp: kernel
      locks: ["pid 1's p->lock", itable.lock]
      stack: [main, userinit, namei, namex, iget]
      sp: boot
      irq: {noff: 2, intena: 0}
    note: |
      The `p->lock → itable.lock` edge had two sources. 6,722 came from [[idup]] in `kfork`.
      Exactly **one** came from here: [[userinit]], on hart 0 during boot, holding the first
      process's lock from [[allocproc]], calls [[namei]]`("/")`, which reaches [[iget]] on
      [[kernel/fs.c:697]] and takes `itable.lock`.

      `namei("/")` with no further path elements never locks the inode, so no sleep-lock is
      involved, and nothing can sleep here: hart 0 is still on its boot stack, before any
      scheduler runs, with interrupts off since power-on (`intena` 0).

      It is the same edge `kfork` creates, so it adds no risk. But a measurement that started
      after boot would never have seen it.


  - title: "Edges 7–12: every condition lock sits above p->lock"
    file: kernel/proc.c
    lines: 574-595
    focus: 580-593
    state:
      hart: 0
      mode: S
      proc: none
      intr: off
      satp: kernel
      locks: [tickslock, "each p->lock in turn"]
      stack: [scheduler, kernelvec, kerneltrap, devintr, clockintr, wakeup]
      sp: {"on": scheduler, detail: "an idle hart 0, interrupted in its intr_on window"}
      irq: {noff: 2, intena: 0}
    note: |
      Most edges into `p->lock` come from three small functions: [[wakeup]] (here), and
      [[sleep_prepare]] and [[killed]], which take the caller's own `p->lock`. Whoever calls
      them while holding a condition lock creates `that lock → p->lock`. The second run,
      counting `p->lock` acquisitions (one `wakeup` is 64 of them):

      | Condition lock | Where | Count |
      |---|---|---|
      | `lk->lk` of a buffer | [[releasesleep]]'s wakeup ([[kernel/sleeplock.c:42]]) | 12,667,904 |
      | `disk.vdisk_lock` | [[free_desc]]'s wakeup, 3 per request | 3,650,304 |
      | | [[virtio_disk_intr]], in the interrupt | 1,216,768 |
      | `log.lock` | [[end_op]] wakeups, lines 170 and 181 | 848,064 |
      | | [[begin_op]] going to sleep, lines 134 and 140 | 1,136 |
      | `lk->lk` of an inode | `releasesleep` | 761,344 |
      | `wait_lock` | [[kexit]], [[kwait]] | 629,567 |
      | `lk->lk` of `tx_lock` | `releasesleep` in [[uartwrite]] | 91,264 |
      | `pi->lock` | [[pipewrite]], [[piperead]], [[pipeclose]] | 58,945 |
      | `tickslock` | [[clockintr]] (47,424); [[sys_pause]] (380) | 47,804 |
      | `cons.lock` | [[consoleintr]] (320); [[consoleread]] (6) | 326 |

      848,064 is exactly 13,251 × 64: one `wakeup(&log)` per `end_op`, and the second run had
      13,251 file-system operations.

      Never the reverse. A `p->lock` holder acquires only the four leaves of step 6. That
      makes `p->lock` almost a leaf itself, and that is why every condition lock can safely
      call `wakeup` while holding its own lock.
    others: |
      Why it must be this way round: a sleeper registers with [[sleep_prepare]] while holding
      its condition lock, so `condition lock → p->lock` is forced. If any path held a `p->lock`
      and then took, say, `pi->lock`, it could wait for a `pipewrite` on another hart that is
      inside `wakeup`, waiting for that very `p->lock`. Two arrows in opposite directions is
      all a deadlock needs.

  - title: The locks interrupt handlers take
    file: kernel/virtio_disk.c
    lines: 300-333
    focus: 303-327
    state:
      hart: any
      mode: S
      proc: the process the interrupt landed on
      intr: off
      satp: kernel
      locks: [disk.vdisk_lock, "each p->lock in turn"]
      stack: [usertrap, devintr, virtio_disk_intr, wakeup]
      sp: kernel
      irq: {noff: 2, intena: 0}
    note: |
      An interrupt handler is just one more acquirer, so its edges belong in the graph. The
      main run found exactly five classes taken inside [[devintr]]:

      | Class | In handlers | Handler |
      |---|---|---|
      | `p->lock` | 1,366,848 | every [[wakeup]] below, plus [[uartintr]]'s `wakeup(&tx_chan)` with no lock held (about 111,680) |
      | `disk.vdisk_lock` | 19,028 | [[virtio_disk_intr]] |
      | `tickslock` | 578 | [[clockintr]], hart 0 only |
      | `cons.lock` | 67 | [[consoleintr]] |
      | `pr.lock` | 5 | `procdump` (Ctrl-P) |

      Apart from `cons.lock → pr.lock`, which only the Ctrl-P readout creates, handlers add
      no new *order*: `vdisk_lock → p->lock` here is the same edge
      [[virtio_disk_rw]] creates in process context. What handlers add is a different danger,
      a deadlock with the *same* hart. That is why every one of these five locks is taken with
      interrupts off everywhere, and why `noff` > 0 always means SIE = 0
      ([[concept:locks#invariant]]): a handler can only start on a hart that holds no
      spinlock at all.

      A lock taken by a handler can also never be a sleep-lock: a handler runs on borrowed
      time and must not sleep. (The recorder does not watch for this; the code has no
      `acquiresleep` reachable from [[devintr]].)


  - title: "Edge 13: log.lock → bcache.lock"
    file: kernel/log.c
    lines: 214-244
    focus: 228-243
    state:
      hart: 2
      mode: S
      proc: echo (pid 6, echo hi > x)
      intr: off
      satp: kernel
      locks: ["x's inode (sleep-lock)", "x's data block (sleep-lock)", log.lock, bcache.lock]
      stack: [usertrap, syscall, sys_write, filewrite, writei, log_write, bpin]
      sp: kernel
      irq: {noff: 2, intena: 1}
    note: |
      [[log_write]] records a modified block under `log.lock` and, the first time a block
      joins the transaction, pins it in the cache with [[bpin]], which takes `bcache.lock`:
      `log.lock → bcache.lock`, 6,537 times in the second run. Its callers:

      | Caller of `log_write` | Count |
      |---|---|
      | [[iupdate]] | 2,455 |
      | [[writei]] | 1,839 |
      | [[balloc]] (bitmap) and [[bzero]] (new block) | 605 + 895 |
      | [[bmap]] (indirect block) | 338 |
      | [[ialloc]] | 276 |
      | [[bfree]] | 129 |

      The total is less than the 13,991 calls to `log_write`: a block already in the log is
      absorbed (line 235) and not pinned again.

      `bcache.lock` is a leaf: in [[bget]], [[brelse]], `bpin` and [[bunpin]], nothing is
      acquired under it. And look at the display: two sleep-locks and two spinlocks.
      Except in `iput` (next step), sleep-locks always sit outside spinlocks. `noff` counts only the two spinlocks.
    others: |
      Who holds `bcache.lock` when `log.lock` is wanted? Nobody: no path holds `bcache.lock`
      and then acquires anything. That is the whole proof that this edge is safe.
      [[end_op]] adds a related rule: it releases `log.lock` before [[commit]] (lines
      172–177), because commit sleeps on the disk.

  - title: "Edge 14: itable.lock → an inode's sleep-lock, the second noff 3"
    file: kernel/fs.c
    lines: 349-378
    focus: 362
    state:
      hart: 1
      mode: S
      proc: rm (pid 7, rm x)
      intr: off
      satp: kernel
      locks: [itable.lock, "x's inode lk->lk (spinlock)"]
      stack: [usertrap, syscall, sys_unlink, iunlockput, iput, acquiresleep, myproc]
      sp: kernel
      irq: {noff: 3, intena: 1, note: "itable.lock, the inode's lk->lk, and the push_off inside myproc on sleeplock.c:32"}
    note: |
      The only place a spinlock is held while a **sleep-lock** is acquired. When [[iput]]
      drops the last reference to a file with no links, line 362 calls [[acquiresleep]] with
      `itable.lock` held. Inside, `lk->lk` is taken, and [[myproc]] on
      [[kernel/sleeplock.c:32]] pushes once more: `noff` 3, the second of the three deepest
      paths. **344** times in the main run, each one a file being deleted for good. The
      second run's 344 split as: 336 from [[sys_unlink]] (`rm`), 5 from [[fileclose]] (an
      unlinked file closed last), 2 from [[kexit]] dropping its working directory, 1 from
      [[sys_chdir]].

      Holding a spinlock while taking a sleep-lock is normally forbidden: if it slept,
      [[sched]] would panic with `sched locks`. It cannot sleep because of line 357: `ref ==
      1` means this process holds the only reference, and a process must hold a reference
      to hold or wait for the sleep-lock. Line 363 releases `itable.lock` before the slow
      [[itrunc]].

      Had it ever slept, `sched` would have panicked. In 344 tries, it never did.
    others: |
      While this hart holds `itable.lock`, any other hart in [[iget]], [[idup]] or `iput`
      spins. The wait is a few instructions, precisely because the `acquiresleep` on line 362
      cannot sleep.

  - title: The one cycle, and why it cannot close
    file: kernel/sleeplock.c
    lines: 36-44
    focus: 39-43
    state:
      hart: 0
      mode: S
      proc: cat (pid 4, opening README)
      intr: off
      satp: kernel
      locks: ["/'s inode lk->lk (spinlock)", "each p->lock in turn"]
      stack: [usertrap, syscall, sys_open, namei, namex, iunlockput, iunlock, releasesleep, wakeup]
      sp: kernel
      irq: {noff: 2, intena: 1}
    note: |
      Put three measured edges side by side:

      1. `p->lock → itable.lock`: [[kfork]]'s [[idup]] (step 6).
      2. `itable.lock → inode lk->lk`: [[iput]] (step 12).
      3. `inode lk->lk → p->lock`: here, [[releasesleep]] calls [[wakeup]] holding `lk->lk`
         (761,344 times), and [[acquiresleep]] calls [[sleep_prepare]] holding it.

      That is a **cycle** among spinlock classes. A deadlock along it would need three harts:

      | Time | Hart 0 | Hart 1 | Hart 2 |
      |---|---|---|---|
      | t1 | holds inode I's `lk->lk`, `wakeup` wants slot S | holds `itable.lock`, `iput(I)` wants I's `lk->lk` | holds S's `p->lock` in `kfork`, `idup` wants `itable.lock` |

      Hart 1's `iput` only reaches that `acquiresleep` when `I->ref == 1`, and the one
      reference belongs to hart 1's own process, which has already unlocked I. Hart 0 can only
      be inside `releasesleep` or `acquiresleep` on I if its process holds a reference to I.
      There is none to hold. Hart 0's column is impossible, so the cycle cannot close.

      The lesson: a class graph **over-approximates**. Deadlock is about lock *instances*:
      the 50 inode locks are 50 locks, and this argument shows that the particular instance
      in the middle edge is never the one in the last edge. A checker that sees only classes
      would report this cycle.
    others: |
      Among spinlock classes there is no other cycle: in the figure every arrow between
      spinlocks points down a row, except the dashed one from `itable.lock`. Add the sleep-lock
      classes and more appear. The inode and buffer self-loops are ordered by instance (parent
      before child; indirect block before bitmap, log block before home block). And `inode →
      itable.lock` ([[iget]] and `iput` called with a directory locked, 2,607 times) meets `itable.lock → inode` (`iput`,
      344): ruled out by the same `ref == 1` argument, since no one else can hold that inode.

