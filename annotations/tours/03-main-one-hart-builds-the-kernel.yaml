quiz:
  - q: "Why can't hart 0 call `fsinit()` (which reads the superblock from disk) during `main`, alongside `binit` and `iinit`?"
    a: |
      Reading a disk block waits for a disk interrupt by calling `sleep()`, and sleeping
      requires a current process whose state can be set to `SLEEPING`. During `main` no
      process exists (and interrupts are off), so `fsinit` is postponed until the first
      process runs, in `forkret`.
  - q: "`kfree` takes `kmem.lock` 32,735 times during `kinit`, with no other hart able to compete. Why not skip the lock during boot?"
    a: |
      `kfree` is the same function used after boot by any hart at any time, and it must
      always take the lock then. A special no-lock path would add code and a way to get it
      wrong, to save a cost that only occurs once.
  - q: "Hart 0 used a plain `started = 1;` instead of `__atomic_store_n(..., __ATOMIC_RELEASE)`. Describe an interleaving that breaks hart 1."
    a: |
      Under RISC-V's memory model, two plain stores to different addresses can become
      visible to other harts in either order. So in general hart 1 could see `started == 1`
      before an earlier store to a shared table, such as `kernel_pagetable`. It would then
      load `satp` with a root at physical page 0 and fault on its next instruction fetch.
      (This build would happen to survive: every `release()` hart 0 calls after `kvminit`,
      the last in `userinit`, contains a `fence rw,w`. The compiler can't move the store
      either, because it is inside a call to another file. Relying on this would be
      fragile; the release store states the requirement explicitly.)
  - q: "Harts 1 and 2 call `trapinithart()` and `plicinithart()` but not `trapinit()` and `plicinit()`. What is the rule that decides this?"
    a: |
      Functions without `hart` initialize shared state (memory or machine-wide device
      registers) and must run once. Functions ending in `hart` set up per-hart state: CSRs such
      as `stvec` and `satp`, which only the hart itself can write, and that hart's PLIC
      enable/threshold block, which xv6 has each hart write for itself using `cpuid()`.
  - q: "Why does each process get its own `p->lock` instead of one lock for the whole process table?"
    a: |
      All three schedulers scan the table constantly. One table lock would make every scan
      exclude every other hart's scan. With a lock per process, two harts only wait for each
      other when they look at the same process at the same moment.
  - q: "All three schedulers reach `proc[0]` at about the same time. What makes sure exactly one of them runs process 1?"
    a: |
      Each scheduler holds `proc[0].lock` while it checks `p->state == RUNNABLE` and sets it
      to `RUNNING`. The first hart to get the lock claims the process; the others get the
      lock later and see `RUNNING`, so they skip it.
