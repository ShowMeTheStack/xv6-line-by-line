summary: |
  The [[g:continuous-integration]] configuration for xv6's GitHub repository. Every time
  someone pushes commits or opens a pull request, GitHub Actions starts two fresh virtual
  machines, one Linux and one macOS, and runs the steps below. If any step's command exits
  with a non-zero status, the job fails and the change is marked as broken.

  Between them the jobs check that the code is formatted with [[.clang-format]], that the
  kernel and `fs.img` build with both Linux and macOS toolchains, and (on Linux only) that
  xv6 boots and passes `usertests` and the crash-recovery tests driven by [[test-xv6.py]].

  The steps are also a tested recipe for setting up your own machine: line 8 lists the
  Ubuntu packages needed to build and run xv6, and line 18 is the compiler for macOS; to
  run xv6 there you also need QEMU (`brew install qemu`).

blocks:
  - lines: 1
    title: When it runs
    note: |
      The workflow is triggered by two GitHub events: a `push` of commits to any branch,
      and a `pull_request` being opened, reopened, or updated with new commits (GitHub's
      default activity types when none are listed). A
      contributor therefore sees the results before the change is merged.

  - lines: 3-12
    title: "The Linux job: format, build, test"
    note: |
      `jobs:` lists the jobs, which run in parallel; this one is named `linux` and runs on
      GitHub's Ubuntu 26.04 virtual machine (`runs-on`). Its steps run in order, each in
      the repository's top directory, and the job stops at the first failure.

      - **Line 7** fetches the repository with GitHub's standard `checkout` action
        (version 7 of it).
      - **Line 8** installs the tools: `gcc-riscv64-linux-gnu` is Ubuntu's RISC-V
        [[g:cross-compiler]] (the Makefile finds it through the prefix
        `riscv64-linux-gnu-`, [[Makefile:46]]), `qemu-system-riscv` provides
        `qemu-system-riscv64`, `clang-format` is needed by `make fmt`, and `bc` by the QEMU
        version check ([[Makefile:197]]).
      - **Line 9** reformats every C file with `make fmt` ([[Makefile:202]]), then
        `git diff --exit-code` exits with status 1 if that changed anything. So a commit
        whose code is not exactly in the [[.clang-format]] style fails here.
      - **Line 10** builds the kernel and the disk image.
      - **Line 11** boots xv6 and runs the whole of `usertests` ([[user/usertests.c]]),
        waiting for `ALL TESTS PASSED`.
      - **Line 12** runs the crash tests: it repeatedly kills QEMU in the middle of disk
        activity and checks that the [[g:write-ahead-log|log]] and orphaned-inode recovery
        repair the file system on the next boot.

  - lines: 14-19
    title: "The macOS job: build only"
    note: |
      The second job runs on GitHub's newest macOS machine (`macos-latest`). It installs
      Homebrew's `riscv64-elf-gcc` (prefix `riscv64-elf-`) and checks only that the kernel
      and `fs.img` build. That matters because [[mkfs/mkfs.c]] is compiled with the host's
      own compiler, Apple's clang, and with macOS's C library, both different from Linux's.

      It does not boot xv6: QEMU is not installed in this job, and [[test-xv6.py]] uses a
      Linux-only form of the `ps` command when it crashes QEMU ([[test-xv6.py:65]]).
