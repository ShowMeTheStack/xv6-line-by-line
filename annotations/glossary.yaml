# Glossary. See STYLE.md for the format. Entries are grouped on the glossary page by `kind`.

# ============================================================ OS and hardware concepts

hart:
  term: hart
  kind: Concept
  short: >
    RISC-V's word for one CPU core: a "hardware thread" that fetches and executes its own
    stream of instructions. A machine started with `-smp 3` has three harts, numbered 0, 1, 2.
  body: |
    Every hart has its own registers, its own program counter and its own copy of most
    [[g:csr|control and status registers]]. All harts share the same physical memory. xv6
    calls them "CPUs" in comments and C names (`struct cpu`, [[cpuid]]) and "harts" when talking
    to the hardware ([[g:csr:mhartid|mhartid]]).

privilege-mode:
  term: privilege mode
  kind: Concept
  keys: []
  short: >
    The level of authority a hart is running at. RISC-V defines three basic ones: Machine mode (M, all
    powers), Supervisor mode (S, where the xv6 kernel runs) and User mode (U, where programs
    like the shell run).
  body: |
    The privilege mode decides which instructions and [[g:csr|CSRs]] the hart may use and,
    through [[g:page-table|page tables]] and [[g:pmp|PMP]], which memory it may touch. A
    program in U-mode cannot, for example, turn off interrupts or change the page table; it
    must ask the kernel through a [[g:system-call|system call]].

    | Mode | Who runs there in xv6 | Typical powers |
    |---|---|---|
    | M (machine) | only [[kernel/entry.S]] and [[kernel/start.c]], once, at boot | everything: all CSRs, all memory |
    | S (supervisor) | the kernel | page tables, trap handling, interrupts |
    | U (user) | user programs | ordinary computation only |

    A hart moves to a *less* privileged mode with a return instruction ([[g:insn:mret|mret]],
    `sret`) and to a *more* privileged one only through a [[g:trap|trap]].

csr:
  term: CSR (control and status register)
  kind: Concept
  short: >
    A special register that controls the hart or reports its state, separate from the 32
    ordinary registers. CSRs are read and written only with dedicated instructions such as
    [[g:insn:csrr|csrr]] and [[g:insn:csrw|csrw]].
  body: |
    Each CSR has a name and a 12-bit number. Its name usually starts with the lowest
    [[g:privilege-mode|privilege mode]] allowed to access it: `m...` CSRs (like `mstatus`)
    are for machine mode only, `s...` CSRs (like `sstatus`) for supervisor mode and above.
    Touching a CSR from a mode that is not allowed raises an illegal-instruction exception.
    xv6 wraps every CSR it uses in a tiny C function in [[kernel/riscv.h]], such as
    [[r_mstatus]] and [[w_mstatus]].

trap:
  term: trap
  kind: Concept
  short: >
    A forced transfer of control from the running code to a handler, caused either by an
    [[g:exception]] (the running instruction cannot proceed) or an [[g:interrupt]] (a device
    or timer wants attention). It is also how system calls enter the kernel.
  body: |
    On a trap the hart saves where it was (in `mepc` or `sepc`) and why (in `mcause` or
    `scause`), switches to the handler's [[g:privilege-mode|privilege mode]] (the same or
    a higher one, never lower), and jumps to the handler
    address held in `mtvec` or [[g:csr:stvec|stvec]]. Which of the two sets is used is
    decided by [[g:delegation]].

exception:
  term: exception
  kind: Concept
  short: >
    A [[g:trap]] caused by the instruction being executed: an illegal instruction, a page
    fault, a misaligned access, or a deliberate `ecall` (a system call).

interrupt:
  term: interrupt
  kind: Concept
  short: >
    A [[g:trap]] caused by something outside the running instruction stream, such as a
    timer expiring or a device (keyboard, disk) needing service. Interrupts are taken only
    when enabled.
  body: |
    A supervisor-level interrupt is taken only if its bit in [[g:csr:sie|sie]] is set, and
    either the hart is running in U-mode, or it is in S-mode with the global `SIE` bit in
    `sstatus` set. xv6 enables the individual bits once at boot in [[start]] and toggles the global
    bit with [[intr_on]] and [[intr_off]].

delegation:
  term: trap delegation
  kind: Concept
  short: >
    Configuring the hardware so that a [[g:trap]] goes straight to the supervisor-mode
    handler instead of machine mode. Set with the [[g:csr:medeleg|medeleg]] and
    [[g:csr:mideleg|mideleg]] CSRs.
  body: |
    By default (on QEMU, where the delegation registers start at 0) every trap is handled
    in machine mode. xv6's kernel runs in supervisor mode
    and wants to handle traps itself, so [[start]] delegates all of them. Delegation only
    applies to traps that happen while the hart is in S or U mode; a trap in M mode always
    stays in M mode.

timer-interrupt:
  term: timer interrupt
  kind: Concept
  short: >
    An [[g:interrupt]] raised when the hart's clock ([[g:csr:time|time]]) reaches a
    programmed deadline. The kernel uses it to take the CPU away from a running program
    periodically, so that other programs get a turn.

virtual-memory:
  term: virtual memory
  kind: Concept
  short: >
    The scheme in which every address a program uses (a virtual address) is translated by
    the hardware into a physical memory address, using a [[g:page-table]] chosen by the
    kernel. It lets each process have its own private view of memory.

page-table:
  term: page table
  kind: Concept
  short: >
    A tree of tables in memory that tells the hardware how to translate virtual addresses
    into physical ones, one 4096-byte page at a time, and what access (read, write, execute,
    user) each page allows. The [[g:csr:satp|satp]] register points at the active one.

tlb:
  term: TLB (translation lookaside buffer)
  kind: Concept
  short: >
    A small cache inside the hart of recent virtual-to-physical translations, so that the
    [[g:page-table]] does not have to be walked on every memory access. It must be flushed
    with [[g:insn:sfence.vma|sfence.vma]] when page tables change.

physical-memory:
  term: physical memory / physical address
  kind: Concept
  short: >
    The real RAM and device registers, addressed by the numbers the memory bus uses. On
    QEMU's `virt` machine RAM starts at physical address `0x80000000`; below that are
    devices.

mmio:
  term: memory-mapped I/O (MMIO)
  kind: Concept
  short: >
    Controlling a device by reading and writing ordinary memory addresses that are wired to
    the device's registers instead of to RAM. xv6 talks to the UART, the disk and the
    interrupt controller this way (see [[kernel/memlayout.h]]).

pmp:
  term: PMP (physical memory protection)
  kind: Concept
  short: >
    A RISC-V mechanism that lets machine mode limit which physical addresses supervisor and
    user mode may access. If PMP is implemented and no PMP entry grants access, S-mode and
    U-mode accesses fail, so xv6 sets one entry that grants everything.

sstc:
  term: Sstc extension
  kind: Concept
  short: >
    A RISC-V extension that gives supervisor mode its own timer-compare register,
    [[g:csr:stimecmp|stimecmp]], so the kernel can schedule its own
    [[g:timer-interrupt|timer interrupts]] without help from machine mode.

svadu:
  term: Svadu extension (A and D bits)
  kind: Concept
  short: >
    A RISC-V extension in which the hardware itself sets the "accessed" (A) and "dirty" (D)
    bits in a page-table entry when a page is used or written. When Svadu is present but
    turned off (`menvcfg.ADUE` = 0), as on QEMU by default, such an access raises a page
    fault instead and software must set the bits.

plic:
  term: PLIC (platform-level interrupt controller)
  kind: Concept
  short: >
    The device that collects interrupt requests from other devices (UART, disk) and routes
    them to harts. xv6 programs it in [[kernel/plic.c]].

uart:
  term: UART
  kind: Concept
  short: >
    A serial-port device that sends and receives characters one at a time. On QEMU it is
    connected to your terminal, so it is xv6's console: everything xv6 prints goes through
    it ([[kernel/uart.c]]).

virtio:
  term: virtio
  kind: Concept
  short: >
    A standard interface for devices that virtual machines such as QEMU provide. xv6's
    "hard disk" is a virtio block device, driven by [[kernel/virtio_disk.c]].

kernel:
  term: kernel
  kind: Concept
  short: >
    The part of the operating system that runs with more hardware privilege than user
    programs (supervisor mode in xv6), manages memory, processes, files and devices, and serves
    system calls from user programs.

process:
  term: process
  kind: Concept
  short: >
    A running program: its memory, its registers, its open files, and its state (running,
    runnable, sleeping...). In xv6 each process is a `struct proc` in the [[proc]] table.

system-call:
  term: system call
  kind: Concept
  short: >
    A request from a user program to the kernel (read a file, create a process...). The
    program executes `ecall`, which [[g:trap|traps]] into the kernel; the kernel does the
    work and returns the result.

scheduler:
  term: scheduler
  kind: Concept
  short: >
    The kernel code that decides which runnable process each CPU runs next. In xv6 every
    hart ends its boot by entering [[scheduler]], which never returns.

boot:
  term: boot
  kind: Concept
  short: >
    The sequence from power-on to a running system. For xv6: QEMU loads the kernel at
    `0x80000000` → [[_entry]] → [[start]] → [[main]] → the first process → the shell.

stack:
  term: stack
  kind: Concept
  short: >
    A region of memory a function uses for its local variables, saved registers and return
    addresses. On RISC-V it grows *downwards* (toward lower addresses) and the
    [[g:reg:sp|sp]] register points at its current top. C code cannot run without one.
  body: |
    xv6 has three kinds. Apart from a few instructions at power-on and two short stretches in
    the trampoline ([[concept:stacks#none]]), each [[g:hart]] is on exactly one of them,
    whichever memory its `sp` points into:

    - a [[g:user-stack]] per process, for the program's own code;
    - a [[g:kernel-stack]] per process slot, for kernel code running on a process's behalf;
    - a [[g:boot-stack]] per hart, a slice of [[stack0]], which becomes the hart's
      [[g:scheduler-stack]] once boot is over.

    Only four instructions ever move `sp` from one stack to another
    ([[g:stack-pointer]]). The trapframe and the `context` structures that save registers
    are not stacks ([[g:save-area]]). See [[concept:stacks]].

calling-convention:
  term: calling convention
  kind: Concept
  short: >
    The rules compiled code follows when one function calls another: arguments go in
    registers `a0`–`a7`, the return value comes back in `a0`, the return address is in `ra`,
    `sp` must stay 16-byte aligned, and `s0`–`s11` must be preserved by the callee.

atomic:
  term: atomic operation and memory ordering
  kind: C
  short: >
    An operation other harts can never observe half-done. Its "memory order" argument also
    controls when your *other* memory writes become visible to other harts, which matters
    when one hart prepares data and another waits for a flag saying it is ready.
  body: |
    Different harts may see each other's writes late or in a different order than they were
    written, and the compiler may reorder memory accesses too. The GCC built-ins used by xv6
    fix this:

    - `__atomic_store_n(&flag, 1, __ATOMIC_RELEASE)`: every memory write this hart did
      *before* this store is visible to any hart that reads `flag == 1` with an acquire
      load.
    - `__atomic_load_n(&flag, __ATOMIC_ACQUIRE)`: once this load sees the new value, reads
      that come *after* it see everything the releasing hart wrote before its store.

    Used as a pair, they make a one-way "ready" signal. See [[kernel/main.c]].

volatile:
  term: volatile
  kind: C
  short: >
    A C qualifier meaning "this variable may change behind the compiler's back, so read and
    write it in memory every time the code says to". It stops the compiler from keeping the
    value in a register or deleting accesses it thinks are useless.

attribute:
  term: __attribute__
  kind: C
  short: >
    A GCC/Clang extension that attaches extra instructions for the compiler to a variable or
    function, e.g. `__attribute__((aligned(16)))` to place a variable at an address that is a
    multiple of 16.

inline-asm:
  term: inline assembly (asm volatile)
  kind: C
  short: >
    A GCC/Clang extension that puts specific machine instructions in the middle of C code,
    e.g. `asm volatile("mret")`. `volatile` tells the compiler not to delete the instruction
    (or hoist it out of a loop) even if its result looks unused; it does not stop all
    reordering, which takes a `"memory"` clobber or a fence. xv6 uses inline assembly for
    things C cannot express, like reading CSRs.

old-style-decl:
  term: empty parentheses in a C declaration
  kind: C
  short: >
    In C before C23, `void f();` declares `f` without saying anything about its parameters
    (unlike `void f(void)`, which says "no parameters"). The compiler will not check calls
    to it.

freestanding:
  term: freestanding (vs. hosted) C
  kind: Toolchain
  keys: [flag:-ffreestanding]
  short: >
    C without an operating system underneath: no standard library functions (only a few
    headers such as `<stdarg.h>` and `<stdint.h>`), no `printf` or `malloc` unless you write
    them, and `main` is not special. A kernel is freestanding code;
    `-ffreestanding` tells the compiler so.

# ============================================================ toolchain concepts

cross-compiler:
  term: cross-compiler / toolchain
  kind: Toolchain
  short: >
    A compiler, assembler and linker that run on one machine (your Mac or PC) but produce
    code for another (RISC-V). The tool names carry a prefix saying the target, e.g.
    `riscv64-unknown-elf-gcc`; the Makefile stores it in [[build:TOOLPREFIX]].

object-file:
  term: object file (.o)
  kind: Toolchain
  short: >
    The output of compiling or assembling one source file: machine code and data split into
    [[g:section|sections]], plus a list of the [[g:symbol|symbols]] it defines and the ones it
    still needs from other files. The [[g:linker]] combines object files into a program.

linker:
  term: linker (ld)
  kind: Toolchain
  short: >
    The tool that combines [[g:object-file|object files]] into one program: it decides the
    final address of every piece of code and data, and fills in each reference to a
    [[g:symbol]] with the symbol's address. A [[g:linker-script]] controls the layout.

linker-script:
  term: linker script
  kind: Toolchain
  short: >
    A file that tells the [[g:linker]] exactly where to place each kind of
    [[g:section]] in memory and which symbols to define. xv6 has one for the kernel
    ([[kernel/kernel.ld]]) and one for user programs ([[user/user.ld]]).

section:
  term: section
  kind: Toolchain
  short: >
    A named chunk of an [[g:object-file]] or program holding one kind of content:
    [[g:text|.text]] (code), [[g:rodata|.rodata]] (constants), [[g:data|.data]]
    (initialized variables), [[g:bss|.bss]] (zero-initialized variables).

text:
  term: .text section
  kind: Toolchain
  short: The [[g:section]] holding machine code (instructions).

rodata:
  term: .rodata section
  kind: Toolchain
  short: >
    The [[g:section]] for read-only data, such as string literals and `const` tables.
    `.srodata` is the same for small objects.

data:
  term: .data section
  kind: Toolchain
  short: >
    The [[g:section]] for global and static variables that have a non-zero initial value
    (`int x = 5;`). Their initial bytes are stored in the program file. `.sdata` is the same
    for small objects.

bss:
  term: .bss section
  kind: Toolchain
  short: >
    The [[g:section]] for global and static variables that start as zero (`int x;`). The
    program file records only its size, not its contents; the memory must be zero when the
    program starts. `.sbss` is the same for small objects.

small-data:
  term: small data sections (.sdata, .sbss, .srodata)
  kind: Toolchain
  short: >
    RISC-V compilers put small variables in separate "small" sections so they can be
    reached with one instruction relative to the `gp` register. xv6 does not use that
    optimization, so its linker scripts just merge them with the normal sections.

symbol:
  term: symbol
  kind: Toolchain
  short: >
    A name for an address in a program: a function, a global variable, an assembly label, or
    a name defined in a [[g:linker-script]]. The [[g:linker]] matches each use of a symbol
    with its single definition.

elf:
  term: ELF
  kind: Toolchain
  short: >
    The standard file format for programs and [[g:object-file|object files]] on Unix-like
    systems. Its header records, among other things, the [[g:entry-point]] and which bytes
    to load at which addresses. Both `kernel/kernel` and xv6's user programs are ELF files.

entry-point:
  term: entry point
  kind: Toolchain
  short: >
    The address of a program's first instruction, recorded in its [[g:elf]] header. For the
    kernel it is [[_entry]], set by `ENTRY(_entry)` in [[kernel/kernel.ld]].

pseudo-instruction:
  term: pseudo-instruction
  kind: Toolchain
  short: >
    An assembly-language shorthand that the assembler turns into one or more real
    instructions. `la`, `li`, `call`, `j`, `mv`, `csrr` and `csrw` are all
    pseudo-instructions.

preprocessor:
  term: C preprocessor
  kind: Toolchain
  short: >
    The first stage of compiling C: it handles `#include`, `#define` and `#if` by editing the
    source text before the compiler proper sees it. Assembly files named `.S` (capital S) are
    also run through it, which is how [[kernel/trampoline.S]] can use `#define`s from
    [[kernel/memlayout.h]].

qemu:
  term: QEMU
  kind: Toolchain
  short: >
    An emulator: a program that pretends to be a whole computer. `qemu-system-riscv64
    -machine virt` emulates a RISC-V board with RAM, a UART, a disk and an interrupt
    controller, and is the only "hardware" xv6 runs on in this course.

disk-image:
  term: disk image (fs.img)
  kind: Toolchain
  short: >
    A file whose bytes are the contents of a whole disk. `make` builds `fs.img` with
    [[mkfs/mkfs.c]] and QEMU presents it to xv6 as a virtio disk, holding the file system
    with `/init`, the shell and the other programs.

make:
  term: make / Makefile
  kind: Toolchain
  short: >
    A build tool. A Makefile lists *targets* (files to build), the *prerequisites* each one
    depends on, and the shell commands (the *recipe*) that build it. `make` rebuilds a target
    only when a prerequisite is newer than it.
  body: |
    A rule looks like this (the recipe line must start with a tab):

    ```
    target: prerequisite1 prerequisite2
    	command that builds target
    ```

    Variables are set with `=` (expanded every time they are used), `:=` (expanded once,
    now), `+=` (append) or `?=` (set only if not set yet), and used as `$(NAME)`, or `$X`
    for a one-letter name. A *pattern rule* such as `%.o: %.S` is a template for many
    targets; `%` matches any stem. If no rule in the Makefile matches, make falls back to its
    built-in *implicit rules*, such as compiling `x.c` into `x.o` with `$(CC) $(CFLAGS) -c`.

# ============================================================ RISC-V registers

reg-sp:
  term: sp (stack pointer, x2)
  kind: RISC-V register
  keys: [reg:sp]
  short: >
    The register holding the address of the top of the current [[g:stack]]. Compiled C code
    assumes `sp` points at valid, 16-byte-aligned memory.

reg-ra:
  term: ra (return address, x1)
  kind: RISC-V register
  keys: [reg:ra]
  short: >
    The register where a call instruction stores the address to return to. `ret` jumps back
    to it.

reg-tp:
  term: tp (thread pointer, x4)
  kind: RISC-V register
  keys: [reg:tp]
  short: >
    A general-purpose register reserved by convention for a "thread pointer". The xv6
    kernel uses it to hold the current hart's ID, so [[cpuid]] can find it quickly.

reg-zero:
  term: zero (x0)
  kind: RISC-V register
  keys: [reg:zero, reg:x0]
  short: A register that always reads as 0; writes to it are discarded.

reg-gp:
  term: gp (global pointer, x3)
  kind: RISC-V register
  keys: [reg:gp]
  short: >
    A register reserved by convention for reaching [[g:small-data|small global data]]
    quickly. The xv6 kernel does not use it for that.

reg-a:
  term: a0–a7 (argument registers, x10–x17)
  kind: RISC-V register
  keys: [reg:a0, reg:a1, reg:a2, reg:a3, reg:a4, reg:a5, reg:a6, reg:a7]
  short: >
    Registers that carry a function's first eight arguments; `a0` (and `a1`) also carry the
    return value. In a system call `a7` holds the call number.

reg-t:
  term: t0–t6 (temporary registers)
  kind: RISC-V register
  keys: [reg:t0, reg:t1, reg:t2, reg:t3, reg:t4, reg:t5, reg:t6]
  short: >
    Scratch registers. A called function may overwrite them, so the caller must save them
    if it needs their values afterwards.

reg-s:
  term: s0–s11 (saved registers)
  kind: RISC-V register
  keys: [reg:s0, reg:s1, reg:s2, reg:s3, reg:s4, reg:s5, reg:s6, reg:s7, reg:s8, reg:s9, reg:s10, reg:s11, reg:fp]
  short: >
    Registers a called function must leave unchanged (saving and restoring them if it uses
    them). `s0` doubles as the frame pointer `fp`.

# ============================================================ RISC-V instructions

insn-la:
  term: la (load address)
  kind: RISC-V instruction
  keys: [insn:la]
  short: >
    A [[g:pseudo-instruction]]: `la rd, symbol` puts the address of `symbol` into `rd`. In
    xv6's kernel it becomes `auipc` + `addi`, computing the address relative to the current
    instruction.

insn-li:
  term: li (load immediate)
  kind: RISC-V instruction
  keys: [insn:li]
  short: >
    A [[g:pseudo-instruction]]: `li rd, constant` puts a constant into `rd`. The assembler
    picks the shortest real instruction sequence (`addi`, `lui`, or several) for the value.

insn-csrr:
  term: csrr (read CSR)
  kind: RISC-V instruction
  keys: [insn:csrr]
  short: >
    `csrr rd, csr` copies a [[g:csr]] into register `rd`. It is a
    [[g:pseudo-instruction]] for `csrrs rd, csr, x0`.

insn-csrw:
  term: csrw (write CSR)
  kind: RISC-V instruction
  keys: [insn:csrw]
  short: >
    `csrw csr, rs` copies register `rs` into a [[g:csr]]. It is a
    [[g:pseudo-instruction]] for `csrrw x0, csr, rs`.

insn-addi:
  term: addi (add immediate)
  kind: RISC-V instruction
  keys: [insn:addi]
  short: "`addi rd, rs, imm` sets `rd = rs + imm`, where `imm` is a constant from −2048 to 2047."

insn-add:
  term: add
  kind: RISC-V instruction
  keys: [insn:add]
  short: "`add rd, rs1, rs2` sets `rd = rs1 + rs2`."

insn-mul:
  term: mul (multiply)
  kind: RISC-V instruction
  keys: [insn:mul]
  short: >
    `mul rd, rs1, rs2` sets `rd` to the low 64 bits of `rs1 × rs2`. It belongs to the "M"
    extension, which `rv64gc` includes.

insn-mv:
  term: mv (move)
  kind: RISC-V instruction
  keys: [insn:mv]
  short: "`mv rd, rs` copies `rs` into `rd`; a [[g:pseudo-instruction]] for `addi rd, rs, 0`."

insn-call:
  term: call
  kind: RISC-V instruction
  keys: [insn:call]
  short: >
    A [[g:pseudo-instruction]]: `call f` jumps to function `f` and stores the return address
    in [[g:reg:ra|ra]]. It assembles to `auipc` + `jalr`, which the linker shrinks to a single
    `jal` when `f` is close enough.

insn-j:
  term: j (jump)
  kind: RISC-V instruction
  keys: [insn:j]
  short: >
    `j label` jumps to `label` without saving a return address; a
    [[g:pseudo-instruction]] for `jal x0, label`.

insn-mret:
  term: mret (return from machine mode)
  kind: RISC-V instruction
  keys: [insn:mret]
  short: >
    Leaves machine mode: the hart switches to the privilege mode stored in the `MPP` field
    of [[g:csr:mstatus|mstatus]] and jumps to the address in [[g:csr:mepc|mepc]]. Meant for
    returning from a trap, but also usable to *enter* a lower mode for the first time.
  body: |
    In detail, `mret`:

    1. sets the privilege mode to `mstatus.MPP`, then sets `MPP` to U (the lowest mode);
    2. copies `mstatus.MPIE` into `mstatus.MIE` (restoring the machine interrupt enable) and
       sets `MPIE` to 1;
    3. sets the program counter to `mepc`.

insn-sfence:
  term: sfence.vma
  kind: RISC-V instruction
  keys: [insn:sfence.vma]
  short: >
    Orders earlier writes to [[g:page-table|page tables]] before later address translations,
    and discards cached translations in the [[g:tlb]]. Needed whenever page tables or
    [[g:csr:satp|satp]] change.

insn-sd:
  term: sd / ld (store / load doubleword)
  kind: RISC-V instruction
  keys: [insn:sd, insn:ld]
  short: >
    `sd rs, off(base)` stores the 8 bytes of `rs` at address `base + off`; `ld rd, off(base)`
    loads 8 bytes from there into `rd`.

insn-ret:
  term: ret
  kind: RISC-V instruction
  keys: [insn:ret]
  short: >
    Returns from a function by jumping to the address in [[g:reg:ra|ra]]; a
    [[g:pseudo-instruction]] for `jalr x0, 0(ra)`.

insn-ecall:
  term: ecall
  kind: RISC-V instruction
  keys: [insn:ecall]
  short: >
    Deliberately causes an [[g:exception]] so that more privileged code runs. User programs
    use it to make a [[g:system-call]].

insn-wfi:
  term: wfi (wait for interrupt)
  kind: RISC-V instruction
  keys: [insn:wfi]
  short: >
    A hint that the hart has nothing to do and may pause (saving power) until an
    [[g:interrupt]] is pending.

# ============================================================ RISC-V CSRs

csr-mstatus:
  term: mstatus
  kind: RISC-V CSR
  keys: [csr:mstatus]
  short: >
    Machine status: a machine-mode [[g:csr]] packed with control fields. xv6 uses its `MPP`
    field (bits 12–11), the "previous privilege mode" that [[g:insn:mret|mret]] switches to.

csr-mepc:
  term: mepc
  kind: RISC-V CSR
  keys: [csr:mepc]
  short: >
    Machine exception program counter: the address [[g:insn:mret|mret]] jumps to. On a trap
    into machine mode the hardware stores the interrupted instruction's address here.

csr-medeleg:
  term: medeleg / mideleg
  kind: RISC-V CSR
  keys: [csr:medeleg, csr:mideleg]
  short: >
    Machine exception / interrupt delegation registers. Bit *n* set means: a
    [[g:trap]] with cause number *n* that happens in S or U mode goes to the supervisor-mode
    handler instead of machine mode ([[g:delegation]]).

csr-mhartid:
  term: mhartid
  kind: RISC-V CSR
  keys: [csr:mhartid]
  short: >
    Read-only machine-mode [[g:csr]] holding this [[g:hart]]'s ID number (0, 1, 2...).
    Supervisor mode cannot read it, which is why xv6 copies it into [[g:reg:tp|tp]] while
    still in machine mode.

csr-satp:
  term: satp
  kind: RISC-V CSR
  keys: [csr:satp]
  short: >
    Supervisor address translation and protection: selects the address-translation scheme
    and points at the root [[g:page-table]]. Value 0 means "Bare": no translation, virtual
    address = physical address.
  body: |
    | Bits | Field | Meaning |
    |---|---|---|
    | 63–60 | MODE | 0 = Bare (paging off), 8 = Sv39 (three-level page tables) |
    | 59–44 | ASID | address-space ID (xv6 leaves it 0) |
    | 43–0 | PPN | physical page number of the root page table (its address ÷ 4096) |

    xv6 builds this value with [[MAKE_SATP]].

csr-sie:
  term: sie
  kind: RISC-V CSR
  keys: [csr:sie]
  short: >
    Supervisor interrupt enable: one bit per kind of supervisor [[g:interrupt]]. Bit 9 (SEIE)
    enables external (device) interrupts, bit 5 (STIE) timer interrupts, bit 1 (SSIE)
    software interrupts.

csr-sstatus:
  term: sstatus
  kind: RISC-V CSR
  keys: [csr:sstatus]
  short: >
    Supervisor status. Its `SIE` bit (bit 1) is the global on/off switch for interrupts in
    supervisor mode; its `SPP` bit records the mode a trap came from.

csr-stvec:
  term: stvec
  kind: RISC-V CSR
  keys: [csr:stvec]
  short: >
    Supervisor trap vector: the address the hart jumps to when a [[g:trap]] is handled in
    supervisor mode.

csr-pmp:
  term: pmpaddr0 / pmpcfg0
  kind: RISC-V CSR
  keys: [csr:pmpaddr0, csr:pmpcfg0]
  short: >
    The first [[g:pmp|PMP]] entry. `pmpaddr0` holds an address (shifted right by 2) and
    `pmpcfg0` holds 8-bit permission settings for entries 0–7.
  body: |
    Entry 0's settings are the low byte of `pmpcfg0`:

    | Bit | Name | Meaning |
    |---|---|---|
    | 0 | R | reads allowed |
    | 1 | W | writes allowed |
    | 2 | X | instruction fetch allowed |
    | 4–3 | A | how the region is matched: 0 off, 1 TOR, 2 NA4, 3 NAPOT |
    | 7 | L | locked (also applies to M mode) |

    With A = 1 (TOR, "top of range"), entry 0 covers addresses from 0 up to (not including)
    `pmpaddr0 × 4`.

csr-menvcfg:
  term: menvcfg
  kind: RISC-V CSR
  keys: [csr:menvcfg]
  short: >
    Machine environment configuration: turns optional features on for lower privilege
    modes. Bit 63 (STCE) enables [[g:sstc|Sstc]] (`stimecmp`); bit 61 (ADUE) enables hardware
    updates of page-table A/D bits ([[g:svadu|Svadu]]).

csr-mcounteren:
  term: mcounteren
  kind: RISC-V CSR
  keys: [csr:mcounteren]
  short: >
    Machine counter enable: which counter CSRs supervisor mode may access. Bit 0 = `cycle`,
    bit 1 (TM) = `time` (and, with Sstc, also `stimecmp`), bit 2 = `instret`.

csr-time:
  term: time
  kind: RISC-V CSR
  keys: [csr:time]
  short: >
    A read-only counter that increases at a constant rate. On QEMU's `virt` machine it
    ticks 10,000,000 times per second.

csr-stimecmp:
  term: stimecmp
  kind: RISC-V CSR
  keys: [csr:stimecmp]
  short: >
    Supervisor timer compare ([[g:sstc|Sstc]] extension): a supervisor
    [[g:timer-interrupt]] becomes pending whenever [[g:csr:time|time]] ≥ `stimecmp`.

csr-sepc-scause:
  term: sepc / scause / stval / sip / sscratch
  kind: RISC-V CSR
  keys: [csr:sepc, csr:scause, csr:stval, csr:sip, csr:sscratch]
  short: >
    Supervisor trap CSRs: `sepc` holds the address of the interrupted instruction, `scause`
    the reason for the trap, `stval` extra information (such as a faulting address), `sip`
    which interrupts are pending, and `sscratch` is a spare register for trap handlers.

csr-mie:
  term: mie
  kind: RISC-V CSR
  keys: [csr:mie]
  short: >
      Machine interrupt enable: one bit per kind of machine-level [[g:interrupt]].

# ============================================================ assembler directives

dir-section:
  term: .section
  kind: Assembler directive
  keys: [dir:.section]
  short: >
    Tells the assembler which [[g:section]] the following code or data belongs to, e.g.
    `.section .text` for code.

dir-globl:
  term: .globl / .global
  kind: Assembler directive
  keys: [dir:.globl, dir:.global]
  short: >
    Makes a label visible to other files, so that the [[g:linker]] can connect it to C code
    that uses the same name. Without it a label is private to its file.

dir-align:
  term: .align
  kind: Assembler directive
  keys: [dir:.align]
  short: >
    Pads with zeros or no-ops until the address is a multiple of 2^n. On RISC-V, `.align 4`
    means a multiple of 16 bytes.

# ============================================================ linker script keywords

ld-output-arch:
  term: OUTPUT_ARCH
  kind: Linker script
  keys: [ld:OUTPUT_ARCH]
  short: Names the machine architecture of the output file (here `riscv`).

ld-entry:
  term: ENTRY
  kind: Linker script
  keys: [ld:ENTRY]
  short: >
    `ENTRY(symbol)` records `symbol`'s address as the program's [[g:entry-point]] in the
    [[g:elf]] header.

ld-sections:
  term: SECTIONS
  kind: Linker script
  keys: [ld:SECTIONS]
  short: >
    The block that describes the output file: which output [[g:section|sections]] exist, in
    what order, at what addresses, and which input sections go into each.

ld-dot:
  term: . (location counter)
  kind: Linker script
  keys: [ld:.]
  short: >
    The address where the linker will place the next thing. Reading `.` gives the current
    address; assigning to it (`. = 0x80000000;`) moves it forward.

ld-align:
  term: ALIGN
  kind: Linker script
  keys: [ld:ALIGN]
  short: >
    `ALIGN(n)` is the location counter rounded up to a multiple of `n` (unchanged if it
    already is one), so `. = ALIGN(0x1000);` moves to a 4096-byte page boundary.

ld-provide:
  term: PROVIDE
  kind: Linker script
  keys: [ld:PROVIDE]
  short: >
    `PROVIDE(name = value);` defines the [[g:symbol]] `name`, but only if some file uses it
    and no file defines it itself.

ld-assert:
  term: ASSERT
  kind: Linker script
  keys: [ld:ASSERT]
  short: >
    `ASSERT(condition, "message")` makes linking fail with the message if the condition is
    false. A build-time sanity check.

# ============================================================ make

make-auto:
  term: make automatic variables ($@ $< $^ $*)
  kind: Make
  keys: ["make:$@", "make:$<", "make:$^", "make:$*"]
  short: >
    Inside a recipe: `$@` is the target being built, `$<` its first prerequisite, `$^` all its
    prerequisites, and `$*` the part matched by `%` in a pattern rule (including any
    directory).

make-shell:
  term: $(shell ...)
  kind: Make
  keys: [make:shell]
  short: Runs a shell command while the Makefile is being read and uses its output as text.

make-wildcard:
  term: $(wildcard ...)
  kind: Make
  keys: [make:wildcard]
  short: Expands to the list of existing files matching a pattern such as `kernel/*.c`.

make-cond:
  term: ifndef / ifneq / endif
  kind: Make
  keys: [make:ifndef, make:ifneq, make:ifdef, make:ifeq, make:else, make:endif]
  short: >
    Conditionals evaluated while the Makefile is read: `ifndef X` keeps the lines up to
    `endif` only if variable `X` is not defined; `ifneq (a,b)` only if `a` and `b` differ.

make-include:
  term: -include
  kind: Make
  keys: [make:-include, make:include]
  short: >
    Reads other makefiles at this point. With the leading `-`, files that do not exist are
    silently skipped.

make-phony:
  term: .PHONY
  kind: Make
  keys: [make:.PHONY]
  short: >
    Declares targets that are names of actions, not files, so make runs them even if a file
    with that name happens to exist.

make-precious:
  term: .PRECIOUS
  kind: Make
  keys: [make:.PRECIOUS]
  short: >
    Tells make not to delete the listed files (here, every `%.o`) even when they were only
    built as intermediate steps.

make-curdir:
  term: CURDIR
  kind: Make
  keys: [make:CURDIR]
  short: A variable make sets to the directory it is running in.

# ============================================================ compiler and tool options

flag-march:
  term: -march=rv64gc
  kind: Compiler option
  keys: [flag:-march]
  short: >
    Which instruction set to generate code for: 64-bit RISC-V ("rv64") with the general
    extensions "g" (integer multiply/divide, atomics, floating point, CSR access, fences) and
    "c" (compressed 2-byte encodings of common instructions).

flag-mcmodel:
  term: -mcmodel=medany
  kind: Compiler option
  keys: [flag:-mcmodel]
  short: >
    Generate code that reaches each symbol relative to the current instruction, so the
    program can sit anywhere in memory as long as it fits within 2 GiB. The default model,
    `medlow`, can only reach addresses between −2 GiB and +2 GiB, and the kernel starts at
    `0x80000000`, exactly 2 GiB, just out of range.

flag-nostdlib:
  term: -nostdlib
  kind: Compiler option
  keys: [flag:-nostdlib]
  short: >
    When gcc links, do not add the standard C library or startup files. (xv6 links with
    `ld` directly, so this only documents the intent.)

flag-fno-builtin:
  term: -fno-builtin-NAME
  kind: Compiler option
  keys: [flag:-fno-builtin-strncpy, flag:-fno-builtin-strncmp, flag:-fno-builtin-strlen,
         flag:-fno-builtin-memset, flag:-fno-builtin-memmove, flag:-fno-builtin-memcmp,
         flag:-fno-builtin-log, flag:-fno-builtin-bzero, flag:-fno-builtin-strchr,
         flag:-fno-builtin-exit, flag:-fno-builtin-malloc, flag:-fno-builtin-putc,
         flag:-fno-builtin-free, flag:-fno-builtin-memcpy, flag:-fno-builtin-printf,
         flag:-fno-builtin-fprintf, flag:-fno-builtin-vprintf]
  short: >
    Do not treat the function `NAME` as the standard C library function of that name. xv6
    writes its own `memset`, `printf`, `malloc`..., which may behave differently, so the
    compiler must not substitute its own built-in version or assume standard behavior.
    (`-ffreestanding` already implies this for every function.)

flag-O:
  term: -O
  kind: Compiler option
  keys: [flag:-O]
  short: Turn on the basic level of optimization (same as `-O1`).

flag-warn:
  term: -Wall / -Werror / -Wno-...
  kind: Compiler option
  keys: [flag:-Wall, flag:-Werror, flag:-Wno-main, flag:-Wno-unknown-attributes]
  short: >
    `-Wall` turns on most warnings and `-Werror` turns every warning into an error, so the
    build stops on any warning. `-Wno-main` silences complaints about `main`'s unusual
    signature; `-Wno-unknown-attributes` silences warnings from compilers that do not
    know the `nonstring` attribute used in [[kernel/fs.h:60]].

flag-frame:
  term: -fno-omit-frame-pointer
  kind: Compiler option
  keys: [flag:-fno-omit-frame-pointer]
  short: >
    Keep a frame pointer (register `s0`) in every function, so that a debugger or a
    backtrace routine can walk the chain of stack frames.

flag-debug:
  term: -g / -ggdb / -gdwarf-2
  kind: Compiler option
  keys: [flag:-g, flag:-ggdb, flag:-gdwarf-2]
  short: >
    Include debugging information (which source line each instruction came from, variable
    names and types) for debuggers such as gdb, in the DWARF format.

flag-std:
  term: -std=gnu99
  kind: Compiler option
  keys: [flag:-std=gnu99]
  short: Compile the C99 language plus GNU extensions (such as `asm` and `__attribute__`).

flag-MD:
  term: -MD
  kind: Compiler option
  keys: [flag:-MD]
  short: >
    While compiling `x.c`, also write `x.d`: a small makefile listing every header `x.c`
    included, so that make rebuilds `x.o` when any of those headers changes.

flag-fno-common:
  term: -fno-common
  kind: Compiler option
  keys: [flag:-fno-common]
  short: >
    Treat each uninitialized global variable (`int x;`) as a real definition, so that two
    files defining the same global is a link error instead of being silently merged.

flag-I:
  term: -I.
  kind: Compiler option
  keys: [flag:-I.]
  short: >
    Also search the top directory for `#include "..."` files. That is why user programs can
    write `#include "kernel/types.h"`.

flag-stackprot:
  term: -fno-stack-protector
  kind: Compiler option
  keys: [flag:-fno-stack-protector]
  short: >
    Do not add stack-overflow checking code; it would call library functions that a kernel
    does not have.

flag-pie:
  term: -fno-pie / -no-pie
  kind: Compiler option
  keys: [flag:-fno-pie, flag:-no-pie, flag:-nopie]
  short: >
    Produce ordinary code for fixed addresses instead of "position-independent executable"
    code, which some Linux distributions' compilers generate by default.

flag-prefix-map:
  term: -ffile-prefix-map
  kind: Compiler option
  keys: ["flag:-ffile-prefix-map=$(CURDIR)=."]
  short: >
    Replace the build directory's full path with `.` wherever the compiler records file
    names (in debug info), so the output does not depend on where you built it.

flag-c:
  term: -c / -o / -E / -x / -S / -t
  kind: Compiler option
  keys: [flag:-c, flag:-o, flag:-E, flag:-x, flag:-S, flag:-t, flag:-dumpspecs]
  short: >
    Common tool options, whose meaning depends on the tool. gcc: `-c` compile without linking,
    `-o FILE` name the output, `-E` preprocess only, `-x c` treat input as C. objdump: `-S`
    disassemble mixed with source, `-t` print the symbol table. qemu: `-S` start with the CPU
    paused (for a debugger).

flag-T:
  term: -T / -Ttext / -N / -e / -z max-page-size
  kind: Linker option
  keys: [flag:-T, flag:-Ttext, flag:-N, flag:-e, flag:-z]
  short: >
    ld options: `-T script` use a [[g:linker-script]]; `-Ttext 0` place code at address 0;
    `-N` do not page-align sections; `-e main` use `main` as the [[g:entry-point]];
    `-z max-page-size=4096` align the program's segments to 4096-byte pages (already the
    RISC-V default).

qemu-opts:
  term: QEMU options
  kind: QEMU option
  keys: [flag:-machine, flag:-bios, flag:-kernel, flag:-m, flag:-smp, flag:-nographic,
         flag:-global, flag:-drive, flag:-device, flag:-gdb]
  short: >
    `-machine virt` emulate QEMU's generic RISC-V board; `-bios none` load no firmware, so
    QEMU's tiny boot ROM jumps straight to the kernel at `0x80000000`; `-kernel FILE` load this ELF file into memory; `-m 128M` 128 MiB
    of RAM; `-smp N` N harts; `-nographic` use the terminal as the serial console;
    `-drive`/`-device` attach `fs.img` as a virtio disk; `-gdb tcp::PORT` accept a debugger.
