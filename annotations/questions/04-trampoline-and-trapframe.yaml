title: Trampoline and trapframe
summary: The border between user and kernel - one trampoline page mapped at the same address in every page table, one trapframe page per process, and the stackless assembly in uservec and userret that crosses it in both directions.
questions:
  - id: tramp-01
    level: 1
    type: choice
    q: |
      [[proc_pagetable]] maps the trampoline page at `TRAMPOLINE` in every user page table,
      and [[kvmmake]] maps the same page at the same address in the kernel page table. Why must
      the address be the same in both?
    code: kernel/proc.c:185-192@189-190
    options:
      - text: "[[uservec]] and [[userret]] switch `satp` in the middle of their own code; the next instruction is fetched through the new page table, so the code page must be at the same address in both."
        correct: true
        why: |
          After `csrw satp`, the `pc` is unchanged but now translated through the other table.
          The trampoline is the one page that looks identical from both sides, so execution
          simply continues.
      - text: "So that user programs can call kernel functions at a known address."
        why: |
          You may have thought the trampoline is an entry point user code calls. It has no
          `PTE_U`: user mode cannot read or execute it. Only the hardware's trap (through
          `stvec`) and the kernel ever run it.
      - text: "To save memory: each page table would otherwise need its own copy of the code."
        why: |
          It is true that one physical page is shared, but that is about the *physical* page.
          Sharing would work at any virtual address. The *same virtual address* is needed so the
          code survives the `satp` switch.
      - text: "Because the kernel's text is mapped at the same address in user page tables too."
        why: |
          You may have thought user page tables contain the kernel. They do not: under a user
          page table the kernel text at `0x80000000` is unmapped. The trampoline is the only
          kernel code mapped there.
    explain: |
      **Same virtual address, same physical page, every table.** That one overlap is what lets
      `satp` change under running code ([[tour:7]], [[g:trampoline]]).

  - id: tramp-02
    level: 1
    type: choice
    q: |
      The first instruction of [[uservec]] is `csrw sscratch, a0`. Why does it start there?
    code: kernel/trampoline.S:22-38@30-37
    options:
      - text: "Every general register holds a user value that must be saved, and saving needs an address in a register; parking `a0` in `sscratch` frees `a0` to hold `TRAPFRAME`."
        correct: true
        why: |
          `sd` needs a base register. `sscratch` is a CSR the hardware never touches on its own,
          so it can hold the user's `a0` for a few dozen instructions until line 72 copies it
          into the trapframe.
      - text: "Because `a0` holds the system-call number, which the kernel needs first."
        why: |
          You may have confused `a0` with `a7`. The number is in `a7`; `a0` holds the first
          argument. The choice of `a0` is arbitrary: any register would do as the one to park.
      - text: "To push `a0` onto the kernel stack."
        why: |
          You may have thought `sscratch` is a stack. It is a single 64-bit register, and at this
          point there is no usable stack at all.
      - text: "Because the hardware requires the trap handler to save `a0` before anything else."
        why: |
          The hardware imposes no such rule; `sscratch` is free for software to use. xv6 chose
          this sequence because it needed one free register.
    explain: |
      With no stack and no free register, the trampoline buys one register with `sscratch`,
      then uses `a0 = TRAPFRAME` as the base for 31 stores ([[tour:7]],
      [[g:csr:sscratch|sscratch]]).

  - id: tramp-03
    level: 1
    type: number
    q: |
      What is the virtual address `TRAPFRAME` in this kernel? (Answer in hex.)
    code: kernel/memlayout.h:46-63
    answer: "0x3fffffe000"
    wrong:
      "0x3ffffff000": |
        That is `TRAMPOLINE`, the highest page. `TRAPFRAME` is one page below it:
        `TRAMPOLINE - PGSIZE`.
      "0x7fffffe000": |
        You may have taken `MAXVA` to be 2³⁹. xv6 uses one bit less, `1L << 38` =
        `0x4000000000`, to avoid sign-extension trouble.
      "0x4000000000": |
        That is `MAXVA`, one past the highest usable address. The top page starts one page
        below it, and `TRAPFRAME` one page lower still.
    why_wrong: "Work it out from `MAXVA = 1L << 38`: `TRAMPOLINE = MAXVA - PGSIZE`, `TRAPFRAME = TRAMPOLINE - PGSIZE`."
    explain: |
      `MAXVA` = `0x4000000000`, `TRAMPOLINE` = `0x3ffffff000`, `TRAPFRAME` = `0x3fffffe000`.
      The same address in every process's page table, each pointing at that process's own
      trapframe page ([[TRAPFRAME]], [[tour:7]]).

  - id: tramp-04
    level: 1
    type: tf
    q: |
      True or false: every process has its own trampoline page.
    answer: false
    why_tf: |
      You may have mixed up the two pages at the top of the address space. The trampoline is
      shared; the trapframe is per process.
    reasons:
      - text: "There is one physical trampoline page, part of the kernel's text; every page table maps that same page at `TRAMPOLINE`. Each process has its own *trapframe* page instead."
        correct: true
        why: |
          [[proc_pagetable]] maps `(uint64)trampoline`, the same address for every process, and
          `p->trapframe`, a page [[allocproc]] got from [[kalloc]] for this process alone.
      - text: "There is no trampoline page at all in user page tables; only the kernel maps it."
        why: |
          You may have thought user tables contain nothing of the kernel. They must map the
          trampoline: the first instructions after a trap run under the *user* page table.
      - text: "Each hart has its own trampoline page, shared by all the processes that run on it."
        why: |
          You may have thought trap code is per CPU. One page serves every hart; it is read-only
          code, so any number of harts can run it at once.
    explain: |
      Same virtual address, same physical page for the trampoline; same virtual address,
      different physical page for the trapframe. That pair is the design ([[tour:7]]).

  - id: tramp-05
    level: 1
    type: number
    q: |
      How many general-purpose registers does [[uservec]] save into the trapframe?
    code: kernel/trampoline.S:39-74
    answer: 31
    wrong:
      32: |
        You may have counted `zero` (`x0`). It always reads 0, so there is nothing to save.
      30: |
        You may have counted only the `sd` lines 40–69. The user's `a0` is saved too, from
        `sscratch` through `t0`, on lines 72–73.
      36: |
        That is the number of `uint64` fields in `struct trapframe`. Five of them
        (`kernel_satp`, `kernel_sp`, `kernel_trap`, `epc`, `kernel_hartid`) are not user
        registers.
    why_wrong: Count `x1` to `x31`; every one of them is a user value the program will want back.
    explain: |
      31 registers, `ra` (`x1`) through `t6` (`x31`): 30 straight stores and one more for `a0`,
      fetched back from `sscratch`. Together with `epc` that is the whole user state
      ([[kernel/proc.h:40]], [[tour:47]]).

  - id: tramp-06
    level: 1
    type: line
    q: |
      In [[userret]], one register must be restored last. Click the line that restores it.
    code: kernel/trampoline.S:114-153
    answer: 149
    lines:
      114: |
        This line *sets* `a0` to `TRAPFRAME`, so it can serve as the base for the loads. It
        comes first, not last.
      118: |
        Loading `sp` is an important moment (`sp` moves to the user stack, usable once `sret`
        returns to user mode), but `sp` is not the base register; the other loads still work after it.
      153: |
        `sret` comes after all the loads, but it restores no general register: it changes the
        mode, `pc` and `SIE`.
    why_wrong: Which register is every other load using as its base address?
    explain: |
      Every load is `ld reg, offset(a0)`. Once `a0` is overwritten with the user's value, the
      trapframe is out of reach, so `ld a0, 112(a0)` must be the final load ([[tour:7]]).

  - id: tramp-07
    level: 1
    type: order
    q: |
      Put the steps of [[userret]] in the order it executes them.
    code: kernel/trampoline.S:100-153
    items:
      - text: "`fence.i`: make this hart's instruction fetches see what is now in memory"
        why: It is the very first instruction of userret, while the kernel page table is still installed.
      - text: "`csrw satp, a0` between two `sfence.vma`: install the user page table"
        why: The switch must come before any access to `TRAPFRAME`, which only the user page table maps.
      - text: "`li a0, TRAPFRAME`"
        why: The base register can be loaded only after `a0` (the satp value) has been used.
      - text: "load `sp` and the other user registers, except `a0`"
        why: These loads all use `a0` as their base.
      - text: "`ld a0, 112(a0)`: the user's `a0`"
        why: The base register goes last.
      - text: "`sret`: drop to user mode at `sepc`"
        why: Leaving the kernel is the final step; everything must be in place first.
    why_wrong: Ask for each step which page table and which register it depends on.
    explain: |
      Fence, switch page tables, point `a0` at the trapframe, restore everything else, restore
      `a0`, `sret`. Each step depends on the one before ([[tour:7]], [[tour:43]]).

  - id: tramp-08
    level: 1
    type: choice
    q: |
      Neither the `TRAMPOLINE` nor the `TRAPFRAME` mapping has `PTE_U`. What does that achieve?
    code: kernel/proc.c:185-202
    options:
      - text: "User code cannot read, write or execute either page (any access faults), while the kernel, in supervisor mode, can execute the trampoline and use the trapframe."
        correct: true
        why: |
          Without `PTE_U` the page is supervisor-only. A program cannot tamper with its saved
          registers or the trap code; usertests' [[user:nowrite]] checks that stores to both
          addresses kill the process.
      - text: "The kernel cannot access these pages; only user code can."
        why: |
          You may have read `PTE_U` backwards. Setting it gives *user* mode access; leaving it
          clear makes the page supervisor-only. (RISC-V even forbids supervisor mode from
          executing a `PTE_U` page, so the trampoline must not have it.)
      - text: "The pages are kept out of the TLB."
        why: |
          `PTE_U` says nothing about caching. These translations are cached like any other,
          which is why the trampoline brackets each `satp` write with `sfence.vma`.
      - text: "The pages are shared between all processes."
        why: |
          Sharing is decided by which physical page is mapped, not by `PTE_U`. The trampoline is
          shared; each trapframe is private, and neither has `PTE_U`.
    explain: |
      Both pages sit in the user's address space only so the trap path can run before and
      after the `satp` switch. They are mapped supervisor-only, with `R X` and `R W`
      respectively ([[tour:7]]).

  - id: tramp-09
    level: 2
    type: match
    q: |
      Match each load in the trampoline with what it fetches from the trapframe.
    code: kernel/trampoline.S:75-86
    pairs:
      - left: "`ld sp, 8(a0)` in uservec"
        right: the top of this process's kernel stack
        why: "Offset 8 is `kernel_sp`, set by [[prepare_return]] to `p->kstack + PGSIZE`."
      - left: "`ld tp, 32(a0)` in uservec"
        right: the ID of this hart
        why: "Offset 32 is `kernel_hartid`. The user may have put anything in `tp`; the kernel needs its hart ID there."
      - left: "`ld t0, 16(a0)` in uservec"
        right: the address of usertrap
        why: "Offset 16 is `kernel_trap`; line 98 jumps through `t0`."
      - left: "`ld t1, 0(a0)` in uservec"
        right: the satp value of the kernel page table
        why: "Offset 0 is `kernel_satp`, written into `satp` on line 92."
      - left: "`ld sp, 48(a0)` in userret"
        right: the user's stack pointer
        why: "Offset 48 is the saved user `sp`, stored by `sd sp, 48(a0)` on line 41."
    explain: |
      The four `kernel_*` fields are a note the kernel left itself in [[prepare_return]]: the
      trampoline can neither compute nor look up anything, only load from a fixed address
      ([[kernel/proc.h:40]], [[tour:7]]).

  - id: tramp-10
    level: 2
    type: line
    q: |
      Line 76 puts the kernel-stack address into `sp`, but at that moment the address is not
      mapped. Click the line that installs the page table in which it maps the kernel stack.
    code: kernel/trampoline.S:72-98
    answer: 92
    lines:
      76: |
        This line loads the address, but the user page table is still installed, and it does
        not map kernel stacks. A push here would fault.
      85: |
        This line only *loads* the kernel page table's `satp` value into `t1`; nothing is
        installed yet.
      89: |
        The first `sfence.vma` orders earlier memory operations; it does not change which page
        table is in use.
      95: |
        The second `sfence.vma` discards stale cached translations, but the kernel page table
        was installed one line earlier.
    why_wrong: Look for the instruction that writes `satp`.
    explain: |
      `csrw satp, t1` on line 92 installs the kernel page table, which maps every slot's kernel
      stack ([[proc_mapstacks]]). The stack switch is two steps: the address on line 76, the
      mapping on line 92. Nothing pushes in between ([[concept:stacks#none]]).

  - id: tramp-11
    level: 2
    type: state
    q: |
      A process has just made a system call. Hart 0 has executed line 76 of [[uservec]],
      `ld sp, 8(a0)`, and nothing after it. What is its state? (For `stack`, give the stack the
      hart could safely push to right now; see [[concept:stacks#none]].)
    code: kernel/trampoline.S:72-98@76
    state:
      mode: S
      stack: none
      satp: user
      sie: "off"
    why:
      mode: |
        `ecall` switched the hart to supervisor mode before the first instruction of
        `uservec`. The trampoline always runs in S-mode.
      stack: |
        `sp` now holds the top of the process's kernel stack, but the user page table is still
        installed and does not map it. A push would fault, so there is no usable stack yet.
      satp: |
        The kernel page table is installed only on line 92. Until then every access, including
        the stores to `TRAPFRAME`, goes through the user page table.
      sie: |
        `ecall` cleared `SIE`. Interrupts stay off through all of `uservec`; for a system call
        [[usertrap]] turns them on at trap.c line 66.
    why_wrong: Ask what ecall changed (mode, SIE) and what uservec has changed so far (only registers, not satp).
    explain: |
      S-mode, user page table, interrupts off, and `sp` holding an address that becomes usable
      only after `csrw satp`. This is the second half of the first "no usable stack" stretch
      (uservec lines 76–92) in [[concept:stacks#none]].

  - id: tramp-12
    level: 2
    type: bits
    q: |
      gdb shows `sstatus = 0x8000000200006020` on hart 0 at the `sret` in [[userret]]. Decode
      the bits xv6 cares about.
    value: "0x8000000200006020"
    fields:
      - label: SIE (bit 1), now
        options: ["0 (interrupts off)", "1 (interrupts on)"]
        answer: "0 (interrupts off)"
        why: "The low byte is `0x20` = `0b0010_0000`: bit 1 is clear. [[prepare_return]] turned interrupts off on trap.c line 108."
      - label: SPIE (bit 5)
        options: ["1", "0"]
        answer: "1"
        why: "`0x20` is bit 5. [[prepare_return]] set it on line 127."
      - label: "SPP (bit 8): the mode sret returns to"
        options: ["user mode", "supervisor mode"]
        answer: "user mode"
        why: "Bit 8 would be `0x100`, which is not present: SPP = 0, user mode. Line 126 cleared it."
      - label: SIE right after sret
        options: ["1", "0"]
        answer: "1"
        why: "`sret` copies SPIE into SIE, so interrupts come on at the same instant the hart enters user mode."
    explain: |
      `0x20` is SPIE; SIE and SPP are 0. The other set bits are not xv6's business: `0x6000`
      is the floating-point state field, `0x200000000` says user mode is 64-bit, and bit 63
      summarizes the FP state. [[prepare_return]] armed exactly these bits so that `sret`
      enters user mode with interrupts on ([[tour:7]]).

  - id: tramp-13
    level: 2
    type: bits
    q: |
      [[forkret]] computes `MAKE_SATP(p->pagetable)` for `init` and gets `0x8000000000087f52`.
      Decode it.
    value: "0x8000000000087f52"
    fields:
      - label: MODE (bits 63-60)
        options: ["8: Sv39 paging", "0: paging off", "9: Sv48 paging"]
        answer: "8: Sv39 paging"
        why: "The top hex digit is 8: `SATP_SV39` is `8L << 60`."
      - label: PPN (low 44 bits)
        options: ["0x87f52", "0x87f52000", "0x8000000000087f52"]
        answer: "0x87f52"
        why: "The PPN field holds the root table's *page number*, the physical address shifted right by 12."
      - label: Physical address of the root page table
        options: ["0x87f52000", "0x87f52", "0x3ffffff000"]
        answer: "0x87f52000"
        why: "Page number `0x87f52` times 4096 (shift left by 12) gives `0x87f52000`."
      - label: Does writing this value into satp also flush the TLB?
        options: ["no: that takes sfence.vma", "yes"]
        answer: "no: that takes sfence.vma"
        why: "Writing `satp` does not discard cached translations; that is why the trampoline puts an `sfence.vma` around each `csrw satp`."
    explain: |
      [[MAKE_SATP]] is `SATP_SV39 | (pagetable >> 12)`: mode in the top four bits, root page
      number below. [[userret]] installs it with `csrw satp` between two fences ([[tour:7]]).

  - id: tramp-14
    level: 2
    type: choice
    q: |
      [[prepare_return]] calls `intr_off()` (line 108) *before* it points `stvec` at
      `uservec` (line 112). What would go wrong if an interrupt could arrive after line 112?
    code: kernel/trap.c:100-112@105-112
    options:
      - text: "The interrupt would enter `uservec` while the kernel page table is still installed; its first store to `TRAPFRAME` would fault, and the fault would enter `uservec` again, forever."
        correct: true
        why: |
          `uservec` assumes the user page table, in which `TRAPFRAME` is mapped. Under the kernel
          page table it is not, and with `stvec` still pointing at `uservec` each fault leads to
          the same faulting store: the hart hangs silently.
      - text: "Turning interrupts off is what makes `sret` start user mode with interrupts off."
        why: |
          You may have thought `SIE` carries over into user mode. `sret` sets `SIE` from `SPIE`,
          which [[prepare_return]] sets to 1; user mode runs with interrupts on.
      - text: "Writing `stvec` is only allowed while interrupts are off."
        why: |
          The hardware allows `csrw stvec` at any time in S-mode. The danger is not the write
          itself but what happens if a trap uses the new value too early.
      - text: "Another hart could start running this process while its trapframe is half-filled."
        why: |
          You may have thought `SIE` affects other harts. It is per hart. And no other hart can
          pick this process: it is `RUNNING`, and only its own thread touches its trapframe.
    explain: |
      From line 112 until `sret`, any trap on this hart would go to the user-mode handler while
      the hart is still in the kernel. Interrupts off closes that window; the code in it is
      written so that it cannot fault ([[tour:7]], [[tour:43]]).

  - id: tramp-15
    level: 2
    type: multi
    q: |
      Which trapframe fields does [[prepare_return]] write?
    code: kernel/trap.c:100-132
    options:
      - text: "`kernel_satp`"
        correct: true
        why: "Line 116, from this hart's `satp`: the kernel page table that `uservec` will install."
      - text: "`kernel_sp`"
        correct: true
        why: "Line 117: `p->kstack + PGSIZE`, the empty top of this process's kernel stack."
      - text: "`kernel_trap`"
        correct: true
        why: "Line 118: the address of [[usertrap]], for `uservec`'s `jalr t0`."
      - text: "`kernel_hartid`"
        correct: true
        why: "Line 119: this hart's ID from `tp`, so `uservec` can restore `tp` on the next trap."
      - text: "`epc`"
        why: |
          You may have read line 131 as a write to the trapframe. It *reads* `trapframe->epc`
          and writes it into the `sepc` CSR. `epc` itself is written by [[usertrap]] (and
          [[kexec]]).
      - text: "`a0`"
        why: |
          The result of a system call is stored in `trapframe->a0` by [[syscall]] (syscall.c
          line 146), not by [[prepare_return]].
    explain: |
      [[prepare_return]] writes the four `kernel_*` fields (the note for the next trap) and three
      CSRs: `stvec` (line 112, the entry point for the next trap) and `sstatus` and `sepc` (the
      orders for `sret`). The user-register part of the
      trapframe it leaves alone ([[tour:47]]).

  - id: tramp-16
    level: 2
    type: multi
    q: |
      Which of these are `sret`'s own doing, done by the hardware when [[userret]] executes it?
    code: kernel/trampoline.S:148-153@153
    options:
      - text: "`pc` ← `sepc`"
        correct: true
        why: "`sret` jumps to the address in `sepc`, which [[prepare_return]] set from `trapframe->epc`."
      - text: "mode ← `sstatus.SPP` (user)"
        correct: true
        why: "`SPP` = 0, set by [[prepare_return]], so `sret` drops to user mode."
      - text: "`SIE` ← `SPIE`"
        correct: true
        why: "That is how interrupts come back on: at the same instant the mode changes."
      - text: "`satp` ← the user page table"
        why: |
          You may have thought the return to user mode switches page tables. `sret` does not
          touch `satp`; [[userret]] switched it itself on line 111, before `sret`.
      - text: "`sp` ← the user's stack pointer"
        why: |
          `sret` does not touch general registers. `sp` was loaded from the trapframe by
          `ld sp, 48(a0)` on line 118.
      - text: "`a0` ← the system call's return value"
        why: |
          `a0` was restored by the last load, line 149, from `trapframe->a0`, where
          [[syscall]] had stored the result.
    explain: |
      The hardware's share of the return is small: `pc` from `sepc`, the mode from `SPP`, `SIE`
      from `SPIE` (then `SPIE` ← 1 and `SPP` ← U). Page table, stack and registers are all
      ordinary instructions that ran before it ([[tour:43]]).

  - id: tramp-17
    level: 3
    type: multi
    q: |
      Which of these are the same for every process in this kernel?
    options:
      - text: "the physical page mapped at `TRAMPOLINE`"
        correct: true
        why: "Every page table maps `TRAMPOLINE` to the one physical trampoline page in kernel text."
      - text: "the value of `trapframe->kernel_satp`"
        correct: true
        why: "There is one kernel page table, loaded into every hart's `satp`; [[prepare_return]] copies that same value for everyone."
      - text: "the value of `trapframe->kernel_trap`"
        correct: true
        why: "It is always the address of [[usertrap]]."
      - text: "the physical page mapped at `TRAPFRAME`"
        why: |
          You may have treated the trapframe like the trampoline. The virtual address is the
          same everywhere, but each page table maps it to that process's own page,
          `p->trapframe`.
      - text: "the value of `trapframe->kernel_sp`"
        why: |
          Each process slot has its own kernel stack, `KSTACK(slot)`, so `kernel_sp` differs
          from slot to slot.
      - text: "the satp value that [[userret]] installs"
        why: |
          That is `MAKE_SATP(p->pagetable)`, the process's own user page table. Every process has
          a different one.
    explain: |
      What is shared: the trampoline code, the kernel page table, the address of `usertrap`.
      What is per process: the trapframe page, the kernel stack, the user page table. (The
      fourth kernel field, `kernel_hartid`, depends on which hart last returned the process to
      user mode.) See [[tour:7]].

  - id: tramp-18
    level: 2
    type: choice
    q: |
      Hart 0 (running `cat`) and hart 1 (running `grep`) both execute `sd ra, 40(a0)` in
      [[uservec]] at the same instant, both with `a0 = 0x3fffffe000`. Why does neither
      overwrite the other's saved `ra`?
    code: kernel/trampoline.S:37-41
    options:
      - text: "Each hart translates `0x3fffffe000` through its own `satp`, which names its own process's page table, so the two stores reach two different physical pages."
        correct: true
        why: |
          `TRAPFRAME` is a virtual address. Under `cat`'s table it means `cat`'s trapframe page;
          under `grep`'s, `grep`'s.
      - text: "The trampoline takes a lock around the stores."
        why: |
          You may have expected shared code to need a lock. There is none in the trampoline, and
          none is needed: nothing it writes is shared.
      - text: "`sd` is atomic, so the two stores cannot interfere."
        why: |
          You may have thought atomicity prevents overwriting. Two atomic stores to the *same*
          physical address would still leave only one value. The stores are safe because the
          addresses are different.
      - text: "Only one hart can be in the trampoline at a time, because interrupts are off."
        why: |
          You may have thought `SIE` is global. Each hart's `SIE` affects only that hart; three
          harts can run the trampoline at once.
    explain: |
      Per-process trapframes at one virtual address remove the shared data instead of
      protecting it. CSRs are per hart and each trapframe is per process, so nothing the
      trampoline writes is shared ([[tour:7]]).

  - id: tramp-19
    level: 2
    type: choice
    q: |
      In this tree, what does `sscratch` hold while a process runs in user mode?
    options:
      - text: "Nothing the kernel relies on: a stale value, the user `a0` that the last trap on this hart parked there."
        correct: true
        why: |
          The only write is `csrw sscratch, a0` on trampoline.S line 32, and the only read is
          line 72, a few dozen instructions later. Between traps the value is leftover.
      - text: "A pointer to the current process's trapframe, set before each return to user mode."
        why: |
          You may be remembering older xv6 releases (and the book written for them), which kept
          a trapframe pointer there. This tree uses the fixed `TRAPFRAME` address instead, and
          never writes `sscratch` on the way out.
      - text: "The top of the process's kernel stack."
        why: |
          You may be thinking of designs that swap a kernel pointer in with `csrrw`. Here the
          kernel stack top lives in `trapframe->kernel_sp`, loaded on line 76.
      - text: "The ID of the hart."
        why: |
          The hart ID is kept in `trapframe->kernel_hartid` for the trampoline, and in `tp`
          inside the kernel. `sscratch` is never used for it.
    explain: |
      In this tree `sscratch` is only a parking spot for the user's `a0` during the first few
      instructions of [[uservec]]. Nothing clears it afterwards, and nothing needs to
      ([[tour:43]], [[g:csr:sscratch|sscratch]]).

  - id: tramp-20
    level: 2
    type: choice
    q: |
      [[usertrap]] computes the user `satp` at the very end and hands it to [[userret]] in `a0`.
      Why not reuse the `satp` value that was installed when the trap arrived?
    code: kernel/trap.c:84-95@90-94
    options:
      - text: "The system call may have replaced the page table: after a successful `exec`, `p->pagetable` is a new table and the old one has been freed."
        correct: true
        why: |
          [[kexec]] builds a new page table and frees the old one with [[proc_freepagetable]].
          Only `p->pagetable`, read at the end, names the table to return to.
      - text: "`uservec` saved the user `satp` in the trapframe, but `prepare_return` overwrites that field."
        why: |
          You may have thought the old value was saved. `uservec` never saves the user `satp`;
          the trapframe has no field for it. It is simply recomputed from `p->pagetable`.
      - text: "`satp` belongs to the hart, and the process may have moved to another hart."
        why: |
          The user `satp` value describes the process's page table, which is the same whichever
          hart runs it. Moving harts changes `kernel_hartid`, not this value.
      - text: "So that `userret` can return to a different process than the one that trapped."
        why: |
          `userret` always returns the *current* process to user mode. Switching processes is
          the scheduler's job, through [[swtch]], long before this point.
    explain: |
      `satp` is computed from `p->pagetable` on the way out. Both the old and the new table map
      the trampoline and a trapframe at the same addresses, so [[userret]] keeps working right
      after the switch ([[tour:7]]).

  - id: tramp-21
    level: 3
    type: number
    q: |
      A process lives in `proc[2]`. What value does [[prepare_return]] store in its
      `trapframe->kernel_sp`? (Answer in hex.)
    code: kernel/memlayout.h:46-52
    answer: "0x3fffffa000"
    wrong:
      "0x3fffff9000": |
        That is `KSTACK(2)`, the *bottom* of the stack page. The stack grows down, so
        `kernel_sp` is the top: `p->kstack + PGSIZE`.
      "0x3fffffc000": |
        You may have used `KSTACK(p) = TRAMPOLINE - p * 2 * PGSIZE`, forgetting the `+ 1`. The
        macro subtracts `(p + 1) * 2` pages, so slot 0's stack is already below a guard page.
      "0x3fffffd000": |
        You may have forgotten the guard pages and counted one page per slot. Each slot takes
        two pages: the stack and an unmapped guard page.
    why_wrong: "Compute `KSTACK(2) = TRAMPOLINE - 3 * 2 * PGSIZE`, then add `PGSIZE` for the top."
    explain: |
      `TRAMPOLINE` = `0x3ffffff000`; `KSTACK(2)` = `0x3ffffff000 - 0x6000` = `0x3fffff9000`;
      the top is `0x3fffffa000`, the value [[tour:43]] measured for `echo` in slot 2. It is
      always the *empty* top: whenever a process is in user mode its kernel stack holds nothing
      ([[kernel/trap.c:117]], [[concept:stacks#kernel]]).

  - id: tramp-22
    level: 3
    type: choice
    q: |
      [[uservec]] reaches [[usertrap]] with `ld t0, 16(a0)` … `jalr t0` instead of simply
      `call usertrap`. Why?
    code: kernel/trampoline.S:75-98@97-98
    options:
      - text: "`call` is PC-relative: the linker computed the offset for code at `0x80006000`, but `uservec` runs at `0x3ffffff000`, so the jump would land about 254 GiB away from `usertrap`."
        correct: true
        why: |
          The trampoline is linked as kernel text but executed through its high alias. Only an
          absolute address, loaded from `trapframe->kernel_trap`, works from there.
      - text: "`call` pushes the return address on the stack, and there is no stack yet."
        why: |
          You may be thinking of x86. RISC-V `call` puts the return address in `ra` and pushes
          nothing; `jalr t0` writes `ra` the same way. And by line 98 the kernel stack is usable.
      - text: "`usertrap` is not mapped in the user page table."
        why: |
          True, but irrelevant: by line 98 `satp` already holds the kernel page table, which maps
          all kernel text. The problem is the computed target address, not the mapping.
      - text: "`jalr t0` lets `usertrap` return to `uservec`'s next line, which `call` would not."
        why: |
          Both forms set `ra` to the next instruction, which is [[userret]] at its trampoline
          address. The return address is not the difference.
    explain: |
      Code that runs at an address other than the one it was linked for must avoid
      PC-relative references to code outside itself. Hence `li a0, TRAPFRAME` (an absolute
      constant) and the jump through `kernel_trap` ([[tour:7]]).

  - id: tramp-23
    level: 3
    type: choice
    q: |
      Imagine a bug that leaves the `TRAPFRAME` mapping out of a process's page table. What
      happens the first time that process traps into the kernel?
    code: kernel/trampoline.S:30-42
    options:
      - text: "The first `sd` through `TRAPFRAME` takes a store page fault; `stvec` still points at `uservec`, so the fault enters `uservec` again and faults on the same store, forever: the hart hangs without a message."
        correct: true
        why: |
          Nothing in this path can report the problem: `usertrap` is never reached, and the
          trap vector sends every fault right back into the code that faults.
      - text: "[[usertrap]] sees a store page fault and kills the process."
        why: |
          You may have thought every user-mode fault reaches [[usertrap]]. This fault happens
          inside [[uservec]], before the jump to `usertrap`, and it re-enters `uservec`.
      - text: "The kernel panics with `kerneltrap`."
        why: |
          You may have thought a fault in S-mode goes to [[kernelvec]]. `stvec` is switched to
          `kernelvec` only by [[usertrap]] (line 47), which is never reached.
      - text: "[[vmfault]] maps a fresh page there, and the trap continues."
        why: |
          `vmfault` is called only from `usertrap`, and it would refuse anyway: `TRAPFRAME` is
          above `p->sz`.
    explain: |
      `uservec` is correct because it *cannot* fault, not because it handles faults. That is
      why [[proc_pagetable]] maps the trapframe before the process ever runs, and why the
      kernel turns interrupts off before pointing `stvec` at `uservec` ([[tour:7]],
      [[tour:43]]).

  - id: tramp-24
    level: 3
    type: tf
    q: |
      True or false: in this kernel, the twelve loads `ld s0` … `ld s11` in [[userret]] are
      redundant on every return to user mode, because the `s` registers already hold the user's
      values when `usertrap` returns.
    code: kernel/trampoline.S:116-146
    answer: false
    why_tf: |
      You may have followed only the path that enters through [[uservec]]. On that path the
      calling convention does keep the user's `s` registers, but there is another path into
      [[userret]].
    reasons:
      - text: "A new process's first return goes through [[forkret]], whose kernel thread never came in through `uservec`; its `s` registers hold kernel values, and the trapframe copy is the only place its user `s` registers exist."
        correct: true
        why: |
          A fork child starts in `forkret` with a forged context, and reaches `userret` through
          a function pointer. Only the trapframe, copied from the parent by [[kfork]], holds
          the user `s` registers it must start with.
      - text: "[[usertrap]] and the functions it calls always destroy the `s` registers."
        why: |
          You may have thought C code is free to clobber them. The calling convention obliges
          every function to return with `s0`–`s11` as it found them; on the `uservec` path they
          really do come back unchanged.
      - text: "`sret` clears the `s` registers, so they must be reloaded."
        why: |
          `sret` touches no general register at all; it changes the mode, `pc` and a few
          `sstatus` bits.
    explain: |
      On the ordinary path the `s` loads write the same numbers back. They are needed for
      every fork child's first return, and the trampoline restores everything rather than
      depending on which path led there ([[tour:47]]).

  - id: tramp-25
    level: 3
    type: choice
    q: |
      [[uservec]] sets `tp` from `trapframe->kernel_hartid`, a value written by
      [[prepare_return]] the last time this process left the kernel. Why is it guaranteed to be
      the ID of the hart now executing `uservec`?
    code: kernel/trap.c:114-120@119
    options:
      - text: "A process in user mode never changes hart: only the kernel's scheduler moves processes, so the hart that ran `prepare_return` is the hart on which the process traps next."
        correct: true
        why: |
          Migration happens only inside the kernel, through [[swtch]]. Every return to user mode
          rewrites `kernel_hartid` on the hart doing the return, so the value is always current.
      - text: "Each process is pinned to one hart for its whole life."
        why: |
          You may have thought processes stay on one hart. A process that sleeps or yields in
          the kernel can resume on any hart; [[tour:7]]'s `init` started on hart 2 and woke up
          on hart 0.
      - text: "`uservec` checks the value against `mhartid` and corrects it."
        why: |
          `uservec` does no checking, and supervisor mode cannot read the machine-mode CSR
          `mhartid` at all. That is exactly why xv6 keeps the ID in `tp` and the trapframe.
      - text: "`kernel_hartid` is set once by [[kfork]] and never changes."
        why: |
          It is rewritten by [[prepare_return]] on every return to user mode (line 119), from
          the `tp` of the hart doing the return.
    explain: |
      `kernel_hartid` is refreshed on every exit, and between that exit and the next trap the
      process runs only in user mode, on that one hart. So `tp` is right for [[cpuid]],
      [[mycpu]] and [[myproc]] from the first line of [[usertrap]] ([[tour:5]], [[tour:7]]).
