title: "User space: ulib, usys and the shell"
summary: How a user program starts, calls the kernel through the usys stubs and the small ulib/printf/malloc library, and how the shell parses a command line and wires pipes and redirections with fork, close, dup and exec.
questions:
  - id: ush-01
    level: 1
    type: choice
    q: |
      This is the whole user-side `write` function, generated by [[user/usys.pl]]. How do
      the descriptor, buffer address and byte count reach the kernel?
    code: user/usys.S:28-32
    options:
      - text: "The caller already put them in `a0`, `a1` and `a2` (the C calling convention); the stub only adds the call number in `a7` and executes `ecall`"
        correct: true
        why: |
          A C call `write(1, buf, n)` puts its three arguments in `a0`-`a2`
          ([[g:calling-convention]]). The stub leaves them alone, so after `ecall` the trap
          code saves them in the trapframe, where [[argint]] and [[argaddr]] read them.
      - text: "The stub pushes them on the user stack, and the kernel reads them from there"
        why: |
          You may be thinking of 32-bit x86 conventions. On RISC-V the first arguments
          travel in registers, and this stub touches no memory at all.
      - text: "`li a7, SYS_write` loads the arguments into a7"
        why: |
          `a7` receives only the system call *number* (16 for write). The kernel's
          [[syscall]] uses it to pick `sys_write` from its table.
      - text: "ecall copies the caller's local variables into the kernel"
        why: |
          `ecall` only traps: it changes mode and jumps to `stvec`. It copies nothing. Any
          data behind a pointer argument is fetched later by the kernel with [[copyin]].
    explain: |
      A system call stub is three instructions: number in `a7`, `ecall`, `ret`. The
      arguments ride in the argument registers where the compiler already put them, and the
      kernel's return value comes back in `a0`, which is also where C expects a return value
      ([[tour:5]], [[g:system-call]]).

  - id: ush-02
    level: 1
    type: number
    q: |
      When `cat` calls `write(1, buf, n)`, what number is in register `a7` at the `ecall`?
    code: user/usys.S:28-32
    answer: 16
    wrong:
      6: |
        You may have counted the position of `write` in [[user/usys.pl]] (it is the sixth
        `entry`). The stub uses `SYS_write` from [[kernel/syscall.h]], whose numbers are in
        a different order.
      5: |
        5 is `SYS_read`. The two are not adjacent in [[kernel/syscall.h]]: `write` is 16.
    why_wrong: Look up SYS_write in kernel/syscall.h; cat.asm shows the stub as li a7,16.
    explain: |
      `SYS_write` is 16, and `user/cat.asm` shows the stub as `li a7,16`. The kernel's
      [[syscall]] reads `p->trapframe->a7` and calls `syscalls[16]`, which is [[sys_write]].
      The user side and the kernel side agree only because both include the same
      `kernel/syscall.h`.

  - id: ush-03
    level: 1
    type: tf
    q: |
      True or false: if a user program's `main` returns 3 without calling `exit`, the
      process crashes, because `main` returns to an invalid address.
    code: user/ulib.c:8-18
    answer: false
    why_tf: |
      You may have thought `main` is the first function of the program, with nothing to
      return to. In xv6 user programs it is called by [[user:start]].
    reasons:
      - text: "The program begins in start(), which calls main and passes its return value to exit, so the process exits with status 3."
        correct: true
        why: |
          That is the purpose of the wrapper ([[user/ulib.c:16-17]]). Returning from `main` is
          the same as calling `exit(3)`.
      - text: "The kernel notices that main returned and exits the process with status 0."
        why: |
          The kernel never sees `main` return; it is an ordinary user-mode `ret`. All of
          this is done in user space by [[user:start]], and the status is `main`'s value.
      - text: "exec places a return address on the user stack that points at exit."
        why: |
          [[kexec]] puts only the argument strings and the `argv` array on the stack. It
          points `epc` at the ELF entry point, which is `start`.
    explain: |
      Every user program except `forktest` is linked with [[user/ulib.c]], whose
      [[user:start]] is the [[g:entry-point]]: `exit(main(argc, argv))`. Programs still call
      `exit` explicitly, but they don't have to.

  - id: ush-04
    level: 1
    type: choice
    q: |
      [[user/user.ld]] has no `ENTRY` line, and the Makefile passes no `-e` option when it
      links `_cat`. Where does `cat` start executing after [[kexec]]?
    code: user/user.ld:1-9
    options:
      - text: "At `start` in ulib.c (address 0xf6 in `_cat`), because GNU ld falls back to a symbol named `start`"
        correct: true
        why: |
          With no `ENTRY` and no `-e`, `ld` uses the symbol `start` if it exists. The ELF
          header of `_cat` records entry 0xf6, and `cat.asm` shows `start` there. [[kexec]]
          copies that into `epc`.
      - text: "At address 0, the first byte of `.text`"
        why: |
          You may have thought execution begins at the start of the code. Address 0 in
          `_cat` holds the function `cat`, which is not where the program starts. `ld` uses
          the start of `.text` only if there is no `start` symbol.
      - text: "At `main`, because C programs always start at main"
        why: |
          `main` is called by [[user:start]]. Only `forktest`, linked with `-e main`, starts
          directly at `main`.
      - text: "At `_start`, the usual Unix entry symbol"
        why: |
          xv6 user programs define no `_start`, and the GNU linker's default when no entry
          is given is the symbol `start`.
    explain: |
      The [[g:entry-point]] is stored in the ELF header (`elf.entry`), and [[kexec]] sets
      `p->trapframe->epc` to it ([[kernel/exec.c:136]]). For every program linked with
      ULIB that is [[user:start]], which calls `main` ([[tour:4]]).

  - id: ush-05
    level: 1
    type: number
    q: |
      `init` executes `printf("init: starting sh\n")`. How many `write` system calls does
      that one call make?
    code: user/printf.c:9-13
    answer: 18
    wrong:
      1: |
        You may have expected `printf` to build the line and write it once, as a real C
        library does. xv6's [[user:printf]] has no buffer: `putc` is `write(fd, &c, 1)`.
      17: |
        You probably forgot the newline. `"init: starting sh\n"` is 18 characters, and the
        `\n` is written like any other.
      19: |
        You may have counted the string's terminating `\0`. [[user:vprintf]] stops at it
        and never writes it.
    why_wrong: Count the characters printf sends, one write per character.
    explain: |
      [[user:vprintf]] sends every character of the format (and every digit of every
      number) through `putc`, which is one `write` of one byte. "init: starting sh" is 17
      characters plus `\n`: 18 system calls, each a full trip through the kernel
      ([[tour:4]], [[tour:38]]).

  - id: ush-06
    level: 1
    type: choice
    q: |
      The shell handles `cd` itself instead of forking a child to run it like every other
      command. Why?
    code: user/sh.c:159-176@166-170
    options:
      - text: "The current directory belongs to each process; a child that changed directory and exited would leave the shell's directory unchanged"
        correct: true
        why: |
          `chdir` changes `p->cwd` of the process that calls it. The next command is forked
          from the shell, so it inherits the *shell's* directory; only the shell itself can
          change that.
      - text: "There is no `cd` program on the disk, so exec would fail"
        why: |
          True, but not the reason. A `cd` program could not work anyway: it would change
          only its own directory and then exit.
      - text: "chdir is only allowed for the process with pid 2"
        why: |
          [[sys_chdir]] has no such check: any process can change its own directory.
      - text: "To save the cost of a fork for such a short command"
        why: |
          Speed is not the point; correctness is. Running `cd` in a child would have no
          visible effect at all.
    explain: |
      `fork` copies the working directory reference to the child ([[idup]]), and nothing
      flows back to the parent when the child exits. Commands that must change the shell's
      own state have to be built into the shell ([[g:fork-exec]]).

  - id: ush-07
    level: 1
    type: match
    q: |
      Match each piece of shell syntax with the node that the parser in [[user/sh.c]]
      builds for it.
    pairs:
      - left: "`ls | wc`"
        right: a pipecmd with ls on the left and wc on the right
        why: "[[user:parsepipe]] builds `pipecmd(left, right)` when it sees `|`."
      - left: "`echo a ; echo b`"
        right: a listcmd that runs the left side, waits for it, then runs the right side
        why: "[[user:parseline]] builds a `listcmd` on `;` ([[user/sh.c:362]])."
      - left: "`echo hi &`"
        right: a backcmd whose child is not waited for
        why: "[[user:parseline]] wraps the command in `backcmd` for each `&`."
      - left: "`echo hi > out`"
        right: a redircmd on descriptor 1 with O_WRONLY | O_CREATE | O_TRUNC
        why: "[[user:parseredirs]], line 395."
      - left: "`wc < in`"
        right: a redircmd on descriptor 0 with O_RDONLY
        why: "[[user:parseredirs]], line 392."
    explain: |
      The parser turns the line into a tree of five node types, and [[user:runcmd]] runs
      the tree with one `switch` on `type`. `>>` is the same as `>` without `O_TRUNC`
      ([[g:parse-tree]], [[g:shell-pipeline]], [[g:io-redirection]]).

  - id: ush-08
    level: 1
    type: multi
    q: |
      Every user program except `forktest` is linked with `ULIB = ulib.o usys.o printf.o
      umalloc.o`. Which of these are therefore part of `_cat`?
    options:
      - text: "`start`, the function that calls `main`"
        correct: true
        why: "It is in ulib.o, and it is `_cat`'s entry point (0xf6)."
      - text: "The `write` stub with `li a7, SYS_write` and `ecall`"
        correct: true
        why: "It is in usys.o, generated from [[user/usys.pl]]."
      - text: "`printf` and `fprintf`"
        correct: true
        why: "They are in printf.o; `cat` uses `fprintf(2, ...)` for its error messages."
      - text: "`malloc`, even though `cat` never calls it"
        correct: true
        why: "The Makefile links whole `.o` files, not a library archive, so `umalloc.o` comes in whole; `cat.asm` contains `malloc`."
      - text: "The kernel's `printk`"
        why: |
          You may have thought user and kernel share library code. `printk` is in the
          kernel image; user programs are linked separately and can reach the kernel only
          through `ecall`.
      - text: "A buffered `FILE *stdout` like the standard C library's"
        why: |
          xv6 has no stdio buffering at all; [[user:printf]] writes one byte per system call.
    explain: |
      xv6 user programs use no standard C library (they are built freestanding). ULIB is
      the whole runtime: a startup wrapper and string helpers, the system call stubs, an
      unbuffered `printf`, and K&R's `malloc` ([[user/ulib.c]], [[user/usys.pl]]).

  - id: ush-09
    level: 2
    type: line
    q: |
      For `ls | wc`, click the line that makes `ls`'s standard output (descriptor 1) refer
      to the pipe.
    code: user/sh.c:101-123
    answer: 107
    lines:
      106: |
        `close(1)` only frees slot 1. Until something is put into it, descriptor 1 refers
        to nothing; the next line fills it.
      113: |
        This is the right child (`wc`), which rewires descriptor 0, not 1.
      114: |
        This puts the read end into `wc`'s descriptor 0. `ls` gets the write end.
      109: |
        Closing `p[1]` removes the original descriptor 4; the copy in slot 1 made just
        before stays open.
    why_wrong: Find the dup that, right after close(1), lands in the lowest free slot.
    explain: |
      `dup(p[1])` puts the write end in the lowest free descriptor, and line 106 has just
      made that 1. The new descriptor 1 is the pipe, and `exec` keeps it, so `ls` writes to
      the pipe with plain `write(1, ...)` ([[g:file-descriptor]], [[tour:39]]).

  - id: ush-10
    level: 2
    type: order
    q: |
      You type `ls` and press Enter. Put these steps in the order they happen in the shell
      and its child.
    items:
      - text: "getcmd writes `$ ` to descriptor 2"
        why: The prompt comes before any input is read.
      - text: "gets reads the line one byte per `read`, stopping at the newline"
        why: Nothing can be parsed or run before the whole line is in buf.
      - text: "main checks whether the line starts with `cd `"
        why: The cd test happens in the shell itself, before any fork.
      - text: "fork1 creates a child; the shell goes on to wait"
        why: Parsing is done by the child, so the fork comes before it.
      - text: "The child's parsecmd builds the tree, and nulterminate writes `\\0`s into its copy of buf"
        why: runcmd needs the finished tree with NUL-terminated words.
      - text: "runcmd reaches the EXEC case and calls exec"
        why: exec is last; if it succeeds nothing after it runs.
    why_wrong: Follow main's loop in sh.c from getcmd to the child's runcmd.
    explain: |
      The shell itself only prompts, reads, checks for `cd`, forks and waits. Everything
      that allocates or modifies the line (parsing, `malloc`, `\0`s) happens in the child,
      so the shell never leaks ([[tour:40]], [[g:fork-exec]]).

  - id: ush-11
    level: 2
    type: choice
    q: |
      In the right child (the future `wc`) someone deletes line 116, `close(p[1])`. You run
      `ls | wc`. What happens?
    code: user/sh.c:101-123@112-118
    options:
      - text: "`wc` counts everything `ls` wrote but never finishes: it waits forever for end of file, and no prompt comes back"
        correct: true
        why: |
          `wc` itself still holds a write end (descriptor 4, kept through `exec`). When `ls`
          exits, the write end's `ref` only drops to 1, so `writeopen` stays 1 and
          [[piperead]] sleeps on an empty pipe waiting for a writer that is `wc` itself.
      - text: "Nothing changes: `wc` never writes to the pipe, so an extra write end is harmless"
        why: |
          You may have thought only *using* a descriptor matters. End of file needs every
          write end closed, and an open but unused one counts.
      - text: "`wc` prints its counts early, before `ls` has finished"
        why: |
          Nothing tells `wc` to stop early; it reads until `read` returns 0, and that
          requires the write end to be closed by everyone.
      - text: "The kernel detects the extra descriptor and closes it at exec"
        why: |
          xv6 has no close-on-exec: [[kexec]] leaves the descriptor table untouched.
    explain: |
      A pipe's reader sees end of file only when every `struct file` reference to the write
      end is gone. The shell's careful `close` calls exist to make that happen; one missing
      `close` in the reader turns into a hang of `wc`, of the process waiting for it, and of
      the shell ([[tour:39]], [[g:shell-pipeline]]).

  - id: ush-12
    level: 2
    type: bits
    q: |
      While parsing `echo hi > out`, [[user:parseredirs]] builds a redircmd whose `mode`
      field is `0x601`. Decode it with [[kernel/fcntl.h]].
    code: user/sh.c:390-400
    value: "0x601"
    fields:
      - label: "O_WRONLY (0x001)"
        options: ["set", "clear"]
        answer: "set"
        why: "0x601 = 0x400 + 0x200 + 0x001: bit 0 is set."
      - label: "O_RDWR (0x002)"
        options: ["set", "clear"]
        answer: "clear"
        why: "Bit 1 (value 2) is not part of 0x601."
      - label: "O_CREATE (0x200)"
        options: ["set", "clear"]
        answer: "set"
        why: "0x200 is part of 0x601, so a missing `out` is created."
      - label: "O_TRUNC (0x400)"
        options: ["set", "clear"]
        answer: "set"
        why: "0x400 is part of 0x601, so an existing `out` is emptied first."
      - label: "Which token produced it"
        options: [">", ">>", "<"]
        answer: ">"
        why: "`>>` (token '+') gives O_WRONLY | O_CREATE = 0x201, without O_TRUNC; `<` gives O_RDONLY = 0."
    explain: |
      `>` means "create or empty, then write": `O_WRONLY | O_CREATE | O_TRUNC` = 0x601, on
      descriptor 1. [[user:runcmd]] passes `mode` unchanged to `open` after `close(1)`
      ([[g:io-redirection]]).

  - id: ush-13
    level: 2
    type: tf
    q: |
      True or false: in the `REDIR` case, [[user:runcmd]] tells `open` which descriptor
      number the file should get (`rcmd->fd`).
    code: user/sh.c:83-91
    answer: false
    why_tf: |
      You may have read `close(rcmd->fd)` and `open(...)` as one operation. `open` takes
      only a path and a mode; it cannot be told a descriptor number.
    reasons:
      - text: "It closes rcmd->fd first, and open always returns the lowest free descriptor, which is now that one."
        correct: true
        why: |
          [[fdalloc]] scans `ofile[]` from 0 upward. For `> out`, descriptors 0 and 2 are
          open and 1 was just closed, so `open` returns 1.
      - text: "open's second argument is the descriptor number."
        why: |
          The second argument is `mode` (here 0x601 or 0). xv6's `open` has no way to
          request a number.
      - text: "runcmd calls dup afterwards to move the file to rcmd->fd."
        why: |
          That is how the `PIPE` case works, with `dup`. The `REDIR` case has no `dup`;
          the lowest-free rule does the job alone.
    explain: |
      "Close, then open (or dup) into the lowest free slot" is the whole trick of Unix
      redirection. It works only because [[fdalloc]] always picks the lowest free
      descriptor ([[g:file-descriptor]], [[tour:4]]).

  - id: ush-14
    level: 2
    type: choice
    q: |
      Why does the shell parse the command line in the **child** after `fork1()`, rather
      than parsing first and forking afterwards?
    code: user/sh.c:171-175
    options:
      - text: "Parsing allocates the tree with malloc (never freed) and writes `\\0`s into buf; in the child all of that disappears when it exits"
        correct: true
        why: |
          The shell never calls `free`. If it parsed, every command would leak a few
          hundred bytes in the long-lived shell and scribble on its `buf`. A child's memory
          is reclaimed as a whole by [[kwait]]/[[freeproc]].
      - text: "Only a child process is allowed to call malloc"
        why: |
          Any process can call [[user:malloc]]; it is ordinary user code calling `sbrk`.
      - text: "So that the shell can wait for the child while parsing happens in parallel"
        why: |
          The shell's `wait` returns only when the child exits, long after parsing. There
          is no useful parallelism here.
      - text: "Because parsecmd calls exec, which would replace the shell"
        why: |
          [[user:parsecmd]] only builds the tree. `exec` is called by [[user:runcmd]], which
          is the other reason runcmd must run in a child.
    explain: |
      The child is a disposable copy of the shell: it can allocate, modify `buf`, and
      finally `exec` without any effect on the parent. The shell itself stays small and
      unchanged from one command to the next ([[tour:40]]).

  - id: ush-15
    level: 2
    type: choice
    q: |
      After parsing `ls | wc`, where do the strings `ecmd->argv[0]` of the two exec nodes
      point?
    code: user/sh.c:421-452@442-443
    options:
      - text: "Into the child's own copy of buf: `\"ls | wc\\n\"` becomes `\"ls\\0| wc\\0\"`, and the pointers aim at `l` and `w`"
        correct: true
        why: |
          [[user:gettoken]] returns pointers `q` and `eq` into the line, and
          [[user:nulterminate]] writes `\0` at each `eq`. No string is copied.
      - text: "Into fresh strings that parseexec copied with malloc"
        why: |
          You may have expected each word to be copied. Only the nodes are allocated;
          the words stay in `buf`.
      - text: "Into the shell parent's buf, shared through fork"
        why: |
          fork gives the child a *copy* of the parent's memory. The child's `\0`s are
          written in its copy; the parent's `buf` is untouched.
      - text: "Into the kernel, which keeps the command line for exec"
        why: |
          The kernel sees the strings only when `exec` is called: [[sys_exec]] copies them
          in with [[fetchstr]] at that moment.
    explain: |
      Recording start and end pointers and terminating the strings in place afterwards
      saves copying and keeps the parser tiny. The `\0` cannot be written during parsing:
      [[user:gettoken]] treats a `\0` as the end of the input, and in a line like `ls|wc`
      it would even overwrite the `|` the parser still needs ([[g:recursive-descent]], [[tour:40]]).

  - id: ush-16
    level: 2
    type: number
    q: |
      A freshly exec'd program's first [[user:malloc]] call is `malloc(100)`. How many
      bytes does [[user:malloc]] (through `morecore`) ask the kernel for with `sbrk`? A
      `Header` is 16 bytes.
    code: user/umalloc.c:46-90
    answer: 65536
    wrong:
      128: |
        You computed the request correctly (8 units of 16 bytes), but `morecore` never asks
        for fewer than 4096 units.
      4096: |
        You may have read `nu = 4096` as bytes. It is a count of 16-byte `Header` units, and
        line 54 multiplies by `sizeof(Header)`.
      100: |
        [[user:malloc]] never asks the kernel for exactly what you requested; it rounds up
        to units, adds a header, and asks for a large chunk to carve later requests from.
    why_wrong: Compute nunits on line 69, then follow morecore's minimum.
    explain: |
      `nunits = (100 + 15) / 16 + 1 = 8`. The free list is empty, so [[user:malloc]] calls
      `morecore(8)`, which raises the request to 4096 units: `sbrk(4096 * 16)` = 65536
      bytes, 64 KiB. Later small requests are carved from that chunk without system calls
      ([[tour:40]]).

  - id: ush-17
    level: 2
    type: state
    q: |
      `cat` is in its `write` stub ([[user/usys.S:31]]) and is about to execute `ecall`;
      the trap has not happened yet. What is the state of the hart running it?
    code: user/usys.S:28-32@31
    state:
      mode: U
      stack: user
      satp: user
      sie: "on"
      noff: 0
      intena: "-"
    why:
      mode: |
        The stub is ordinary user code. Supervisor mode starts only after `ecall` traps
        into `uservec`.
      stack: |
        `sp` still points into `cat`'s user stack. The kernel stack is loaded only by
        `uservec`, after the trap.
      satp: |
        In user mode the hart always uses the process's own page table; the switch to the
        kernel table happens in `uservec`.
      sie: |
        `sret` copied SPIE (set to 1 by [[prepare_return]]) into SIE on the way out. In user
        mode, supervisor interrupts are taken whatever SIE says, but the bit itself is 1.
      noff: |
        No spinlock can be held in user mode: the hart left the kernel with `noff` 0.
      intena: |
        intena only means something while `noff > 0`.
    why_wrong: Nothing has happened yet, so the hart is still where the return to user mode left it.
    explain: |
      User mode, user stack, user page table, interrupts enabled, no push_off outstanding.
      The `ecall` will change the mode, and `uservec` will change `sp` and `satp`
      ([[concept:stacks#user]], [[tour:5]]).

  - id: ush-18
    level: 2
    type: multi
    q: |
      Which of these user library functions can make a system call?
    options:
      - text: "`gets`"
        correct: true
        why: "It calls `read(0, &c, 1)` for every character ([[user/ulib.c:76]])."
      - text: "`stat`"
        correct: true
        why: "It is three system calls: `open`, `fstat`, `close` ([[user/ulib.c:87-99]])."
      - text: "`printf`"
        correct: true
        why: "One `write` per character, through `putc`."
      - text: "`malloc`"
        correct: true
        why: "When the free list has no block big enough, `morecore` calls `sbrk`."
      - text: "`strlen`"
        why: "It only walks memory the program already has. No kernel help needed."
      - text: "`memmove`"
        why: "A plain byte-copy loop in user mode; copying within your own memory needs no system call."
    explain: |
      Anything that touches a file, the console or the size of memory must enter the
      kernel; string and memory helpers work entirely within the process's own address
      space. Knowing which is which explains why `ls` makes hundreds of system calls
      ([[tour:40]]).

  - id: ush-19
    level: 2
    type: line
    q: |
      For `echo a ; echo b`, click the line that guarantees `a` is printed before `echo b`
      even starts.
    code: user/sh.c:93-99
    answer: 97
    lines:
      95: |
        `fork1` only starts the left command in a child. Without the next line, the parent
        would go on to the right side at once and both could run at the same time.
      96: |
        This runs the left side, but in the child; nothing here makes the parent wait.
      98: |
        This starts the right side. It is safe only because the line above already waited.
    why_wrong: Look for the call that blocks the parent until the left child exits.
    explain: |
      `wait(0)` blocks until the left child has exited, and only then does the process run
      the right side, itself, without another fork ([[user:runcmd]], [[g:shell-pipeline]]).

  - id: ush-20
    level: 3
    type: number
    q: |
      You type `a | b | c` (three programs). Counting the shell's own `fork1` in `main` and
      every `fork1` in [[user:runcmd]], how many times is `fork` called to run this line?
    code: user/sh.c:367-378
    answer: 5
    wrong:
      3: |
        You may have counted one process per program. Each `PIPE` node is run by its own
        process, which forks *both* sides, and the shell's first child runs the outer node.
      4: |
        You may have forgotten the shell's own `fork1` in `main` (line 172), or one of the
        two inner forks.
      6: |
        You may have thought each `PIPE` node forks itself as well. The process that runs a
        `PIPE` node forks two children and does not fork again for the node.
    why_wrong: Build the tree first (parsepipe is right-recursive), then count the forks for each PIPE node.
    explain: |
      The tree is `pipe(a, pipe(b, c))`. The shell forks child 1 (1), which runs the outer
      pipe: fork for `a` (2), fork for the inner pipe (3). That child forks `b` (4) and
      `c` (5). Two processes, the outer and inner pipe runners, never exec; they only wait.

  - id: ush-21
    level: 3
    type: choice
    q: |
      You type `echo hi &`. The shell prints the next prompt without waiting for `echo`.
      Which process eventually calls `wait` and frees `echo`'s process slot?
    code: user/sh.c:125-131
    options:
      - text: "init (pid 1): echo's parent exits at once, so echo is reparented to init, whose wait loop collects it"
        correct: true
        why: |
          The shell's child runs the `BACK` node: it forks `echo` and exits right away. The
          shell's `wait` reaps that child. In its exit, [[reparent]] gives `echo` to `init`,
          and [[user/init.c:50]]'s "parentless process" branch is exactly that reaping.
      - text: "The shell, in its wait(0) on the next command"
        why: |
          The shell is `echo`'s grandparent. Its `wait` only reaps its own children, and its
          child (the BACK runner) has already exited and been reaped.
      - text: "Nobody: echo stays a zombie forever"
        why: |
          That would be true if nobody adopted orphans. [[kexit]] reparents the children of
          an exiting process to `init`, and `init` waits forever.
      - text: "echo frees its own slot when it exits"
        why: |
          A process cannot free its own slot: it is still running on its kernel stack in
          [[kexit]]. It becomes a [[g:zombie]] until some parent's [[kwait]] calls
          [[freeproc]].
    explain: |
      The extra process in the `BACK` case keeps the shell's `wait` pattern intact: the
      shell always waits for the child it just forked, and the real job becomes an orphan.
      (Had the shell forked `echo` directly and not waited, a later `wait(0)`, which returns
      *any* exited child, could collect `echo` instead of the command it meant to wait for.) `init` reaps orphans; that is why its wait loop ignores pids that
      are not the shell ([[g:background-job]], [[tour:21]]).

  - id: ush-22
    level: 3
    type: choice
    q: |
      The file `out` contains 50 bytes. You type `cat < nosuchfile > out`, and `nosuchfile`
      does not exist. What happens?
    code: user/sh.c:380-403
    options:
      - text: "The shell prints `open nosuchfile failed`, and `out` is now empty"
        correct: true
        why: |
          `>` is parsed after `<`, so its redircmd wraps the other and is the outermost
          node. [[user:runcmd]] handles it first: `close(1)`, then `open("out", 0x601)`,
          which truncates `out`. Only then does the inner node try to open `nosuchfile` and
          fail.
      - text: "The shell prints `open nosuchfile failed`, and `out` still has its 50 bytes"
        why: |
          That would be true if input redirection were done first. Each later redirection
          wraps the earlier ones, so the last one on the line is opened first.
      - text: "`cat` starts with an empty standard input and writes nothing to `out`"
        why: |
          `cat` is never exec'd: the failed `open` makes the child print the error and
          `exit(1)` before reaching the EXEC node.
      - text: "The shell reports a syntax error and runs nothing"
        why: |
          The line is valid syntax; the problem is only discovered at run time, by `open`.
    explain: |
      [[user:parseredirs]] wraps the current node each time it sees a redirection, so the
      tree is `redir(> out, redir(< nosuchfile, exec cat))` and [[user:runcmd]] works from
      the outside in. The truncation of `out` has already happened when the second `open`
      fails ([[g:io-redirection]], [[g:parse-tree]]).

  - id: ush-23
    level: 3
    type: choice
    q: |
      `char buf[] = "abcde";` then `memmove(buf + 1, buf, 4);`. Which branch of
      [[user:memmove]] runs, and what does `buf` hold afterwards?
    code: user/ulib.c:112-130
    options:
      - text: "The backward copy (src < dst); buf becomes `aabcd`"
        correct: true
        why: |
          `src` is below `dst`, so the `else` branch copies from the end: `d` to position 4,
          `c` to 3, `b` to 2, `a` to 1. Each source byte is read before it is overwritten.
      - text: "The forward copy; buf becomes `aaaaa`"
        why: |
          That is what a naive forward loop would produce for this overlap: each copied `a`
          is read again as the next source byte. [[user:memmove]] avoids it by choosing
          the direction.
      - text: "The forward copy; buf becomes `aabcd`"
        why: |
          The result is right but the branch is not: the forward branch runs only when
          `src > dst`. Copying forward here would smear the first byte.
      - text: "The backward copy; buf becomes `bcdee`"
        why: |
          You may have swapped source and destination. The first argument is the
          destination: bytes move up by one, not down.
    explain: |
      When regions overlap, copy in the direction that reads each byte before overwriting
      it: forward if the destination is below the source, backward if it is above. ulib's
      `memcpy` calls [[user:memmove]], so in xv6 user space even `memcpy` is overlap-safe.

  - id: ush-24
    level: 3
    type: multi
    q: |
      The shell's child calls `exec("echo", argv)` for the line `echo hi there`. When
      `echo`'s [[user:start]] executes its first instruction, which statements are true?
    code: kernel/exec.c:96-140@121-140
    options:
      - text: "`a0` holds 3"
        correct: true
        why: "[[kexec]] returns `argc`, and [[syscall]] stores the return value in `trapframe->a0`, which `userret` loads into `a0`."
      - text: "`a1` holds the address of the argv array on echo's new user stack"
        correct: true
        why: "Line 124: `p->trapframe->a1 = sp`, the address where the pointer array was copied."
      - text: "`argv[3]` is 0"
        correct: true
        why: "Line 110 stores `ustack[argc] = 0`, and that array is copied to the stack."
      - text: "`argv[1]` points into the shell child's old buf"
        why: |
          You may remember that the parser's pointers aim into `buf`. That memory is gone
          after exec; [[kexec]] copied each string onto the new user stack and points
          `argv[i]` at those copies.
      - text: "`argc` was passed in `a7`"
        why: |
          `a7` carries a system call number into the kernel. `argc` reaches `start` as the
          first argument, in `a0`, by way of exec's return value.
    explain: |
      [[kexec]] builds `main`'s arguments by hand: strings, then a NULL-terminated pointer
      array, on the new stack; `a1` = that array, and the return value (`argc`) becomes
      `a0`. [[user:start]] then calls `main(argc, argv)` with them ([[g:argv]],
      [[g:user-stack]], [[tour:22]]).

  - id: ush-25
    level: 3
    type: choice
    q: |
      [[user/user.ld]] places `.text` at address 0, and [[kexec]] maps it with `PTE_R`,
      `PTE_X` and `PTE_U`. A buggy user program executes `int x = *(int *)0;`. What happens?
    code: user/user.ld:1-9
    options:
      - text: "The load succeeds and `x` gets the first 4 bytes of the program's code"
        correct: true
        why: |
          Virtual address 0 is a valid, readable user page: the program's own text. The
          hardware finds a PTE with `PTE_R` and `PTE_U` and simply loads from it. A NULL
          pointer read goes unnoticed.
      - text: "A load page fault; usertrap kills the process"
        why: |
          That would be true on systems that leave page 0 unmapped. Here page 0 holds the
          program's code, and reading it is allowed.
      - text: "x is 0, because the kernel maps a zero page at address 0"
        why: |
          There is no special zero page. Address 0 is ordinary text, so the bytes are
          instructions, not zeros.
      - text: "The kernel panics"
        why: |
          A user-mode fault never panics the kernel; at worst [[usertrap]] kills the
          process. And here there is no fault at all.
    explain: |
      Because text starts at 0 and is readable, NULL pointer *reads* do not fault in xv6
      user programs. A *write* through NULL does fault (text has no `PTE_W`): [[vmfault]]
      finds the page already mapped, so [[usertrap]] kills the process ([[tour:25]]).
