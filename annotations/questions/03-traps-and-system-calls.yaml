title: Traps and system calls
summary: How a user program asks the kernel for a service, what ecall and the trap path do, how usertrap and kerneltrap sort traps by scause, and how a system call's number, arguments and result travel through the trapframe.
questions:
  - id: syscall-01
    level: 1
    type: choice
    q: |
      `echo` calls `write(1, "hi", 2)`. What is `write` in user space?
    code: user/usys.S:28-32
    options:
      - text: "A three-instruction stub, generated by `user/usys.pl`, that puts the system-call number in `a7` and executes `ecall`."
        correct: true
        why: |
          [[user/usys.pl]] prints one such stub per system call into `usys.S`. The C call has
          already put the arguments in `a0`–`a2`; the stub adds the number and enters the kernel.
      - text: "A C function in `user/ulib.c` that copies the bytes into the kernel's memory."
        why: |
          You may have thought every user library function is C code in `ulib.c`. That file
          holds helpers such as `strlen` and the `sbrk` wrappers, but not `write`. And no user
          code can copy into kernel memory: kernel pages are not mapped for user mode at all.
      - text: "The kernel's [[sys_write]], linked into every user program."
        why: |
          You may have thought the kernel's code is linked into programs. User programs are
          linked only with `ulib.o`, `usys.o`, `printf.o` and `umalloc.o`; kernel functions live
          in the kernel image and can only run in supervisor mode.
      - text: "A jump to a fixed kernel address that user programs are allowed to call."
        why: |
          That would be true if user mode could jump into the kernel. It cannot: the kernel's
          pages are not in the user page table, and the trampoline page has no `PTE_U`. The only
          door is `ecall`, which goes wherever `stvec` points.
    explain: |
      A system call looks like a C call to the program, but the callee is a
      [[g:syscall-stub]]: `li a7, SYS_write` then `ecall`, then `ret` once the kernel has
      returned. The kernel learns *which* service from `a7` and the arguments from `a0`–`a5`
      ([[tour:5]]).

  - id: syscall-02
    level: 1
    type: choice
    q: |
      How does the kernel know *which* system call the program asked for, and where does
      [[syscall]] read that information?
    code: kernel/syscall.c:136-151@142
    options:
      - text: "The stub put the number in `a7`; `syscall()` reads the saved copy, `p->trapframe->a7`."
        correct: true
        why: |
          [[uservec]] stored every user register in the trapframe, `a7` at offset 168. By the
          time `syscall()` runs, kernel C code (and any kernel trap taken since `intr_on`) is
          free to have reused the live `a7` register, so the trapframe copy is the one that
          counts.
      - text: "The number is in `a0`, the first argument register."
        why: |
          You may have confused the number with the first argument or the return value. `a0`
          carries the first argument in (the file descriptor for `write`) and the result out.
          The number has its own register, `a7`.
      - text: "The stub pushes the number on the user stack, and the kernel pops it."
        why: |
          You may be thinking of calling conventions that pass values on the stack. The stub
          pushes nothing, and the kernel never reads the user's stack to find out what to do.
      - text: "`ecall` writes the number into `scause`."
        why: |
          `scause` is 8 for *every* `ecall` from user mode: it says "environment call from
          U-mode", not which service. The hardware knows nothing about xv6's numbering.
    explain: |
      The number travels in `a7`, which [[uservec]] saves to `p->trapframe->a7`. Line 142 reads
      it from there and line 146 uses it as an index into the `syscalls[]` table
      ([[g:syscall-number]]).

  - id: syscall-03
    level: 1
    type: number
    q: |
      In our gdb run, `echo`'s `ecall` for `write` sits at user address `0x354`. When the system
      call finishes, at what address does `echo` continue? (Answer in hex.)
    code: kernel/trap.c:49-63@60-62
    answer: "0x358"
    wrong:
      "0x354": |
        You may have thought `sepc` already points past the `ecall`. It points *at* it: the
        hardware records the instruction that trapped. Returning to `0x354` would execute the
        same `ecall` again, forever. Line 62 adds 4 to the saved copy.
      "0x356": |
        You may have thought `ecall` is a 2-byte compressed instruction, like some of the
        stores in the trampoline. There is no compressed `ecall`; it is always 4 bytes, and
        line 62 adds exactly 4.
    why_wrong: Start from the address of the `ecall` itself, which is what `sepc` holds, and apply line 62.
    explain: |
      `ecall` sets `sepc = 0x354`. [[usertrap]] copies it into `p->trapframe->epc` (line 52)
      and adds 4 (line 62): `0x358`, the stub's `ret`. [[prepare_return]] later writes that
      into `sepc`, and `sret` jumps there ([[tour:43]]).

  - id: syscall-04
    level: 1
    type: tf
    q: |
      True or false: when a user program executes `ecall`, the hardware switches `sp` to the
      process's kernel stack.
    answer: false
    why_tf: |
      You may have thought a trap switches stacks in hardware, as it does on x86. On RISC-V
      `ecall` leaves every general register alone, `sp` included.
    reasons:
      - text: "`ecall` changes only the mode, the `pc` and a few CSRs (`sepc`, `scause`, `stval`, `sstatus`); the stack switch is an ordinary load, `ld sp, 8(a0)` in [[uservec]]."
        correct: true
        why: |
          The hardware's whole contribution is the mode, the `pc` and those CSRs. xv6 loads the
          kernel stack pointer from `trapframe->kernel_sp` itself ([[kernel/trampoline.S:76]]).
      - text: "`ecall` loads `sp` from `sscratch`."
        why: |
          You may be remembering older kernels that kept a pointer in `sscratch`. The hardware
          never reads `sscratch` on a trap, and in this tree `uservec` uses it only to park the
          user's `a0`.
      - text: "`ecall` loads `sp` from the trapframe's `kernel_sp` field."
        why: |
          The trapframe is a C struct that xv6 invented; the hardware does not know it exists.
          It is software, `uservec` line 76, that reads `kernel_sp`.
    explain: |
      Right after `ecall`, the hart is in supervisor mode but still on the user's `sp` and the
      user page table. That is why the trampoline must work with no usable stack until it has
      loaded `kernel_sp` and switched `satp` ([[concept:stacks#none]], [[tour:43]]).

  - id: syscall-05
    level: 1
    type: choice
    q: |
      Why does [[usertrap]] add 4 to `p->trapframe->epc` for a system call?
    code: kernel/trap.c:49-69@60-62
    options:
      - text: "`sepc` holds the address of the `ecall` itself; without the +4, the process would return to the `ecall` and make the same system call again, forever."
        correct: true
        why: |
          For every synchronous exception the hardware records the instruction that trapped.
          A system call is the case where the kernel wants to continue *after* it, so it adds
          the length of `ecall`.
      - text: "To skip the stub's `ret`, which the kernel has already performed."
        why: |
          You may have thought the kernel returns from the stub on the program's behalf. It does
          not touch the user's `ra` or stack: the `ret` at `epc + 4` still has to run in user
          mode to get back to `main`.
      - text: "Because `epc` is counted in 4-byte words, not bytes."
        why: |
          `epc` is an ordinary byte address, copied straight from `sepc` on line 52. Adding 4
          moves it one 4-byte instruction forward.
      - text: "To skip the `li a7` instruction in front of the `ecall`."
        why: |
          You may have thought `sepc` points at the start of the stub. It points at the `ecall`;
          the `li a7` before it already ran. Adding 4 moves *forward*, past the `ecall`.
    explain: |
      A page fault takes the other branch and gets no +4, because the faulting instruction
      must run again once the kernel has fixed the cause ([[tour:10]]). Only a system call
      "succeeds" by trapping, so only it skips the trapping instruction.

  - id: syscall-06
    level: 1
    type: choice
    q: |
      The first thing [[usertrap]] does after its `SPP` check is point `stvec` at
      [[kernelvec]] (line 47). Why?
    code: kernel/trap.c:37-50@45-47
    options:
      - text: "From now on the hart runs kernel code; a trap here must go to the handler for traps from supervisor mode, because `uservec` assumes the user page table and saves through `TRAPFRAME`, which the kernel page table does not map."
        correct: true
        why: |
          `stvec` still points at `uservec` from the last return to user mode. Any trap taken in
          the kernel with that value would make `uservec` store to an unmapped address and
          fault again and again.
      - text: "So that this process's next system call reaches the kernel faster."
        why: |
          You may have the direction backwards. The next system call comes from user mode and
          must go to `uservec`; [[prepare_return]] sets `stvec` back to the trampoline on the way
          out (line 112).
      - text: "Because `ecall` cleared `stvec`, and it has to be given a valid value again."
        why: |
          The hardware never writes `stvec`; it only reads it to find the handler. Only xv6's own
          code writes it, in three places.
      - text: "So that interrupts on the other harts go to `kernelvec`."
        why: |
          `stvec` is per hart. Writing it on this hart changes nothing for the others; each one
          set its own `stvec` when it last entered the kernel.
    explain: |
      Two kinds of trap, two entry points. `uservec` is for traps from user mode (user page
      table, user registers to save); `kernelvec` is for traps in the kernel (kernel page table,
      push a frame on the current stack). `stvec` must name the right one at every moment
      ([[tour:8]], [[concept:mode-stack-page-table#t7]]).

  - id: syscall-07
    level: 2
    type: match
    q: |
      Match each `scause` value with what it means. These are the values [[usertrap]],
      [[kerneltrap]] and [[devintr]] compare against.
    pairs:
      - left: "`8`"
        right: environment call from U-mode (a system call)
        why: "`ecall` from user mode always sets `scause = 8`; it is what line 54 of trap.c tests."
      - left: "`13`"
        right: load page fault
        why: "13 is a *load* page fault; together with 15 it is the only cause usertrap offers to [[vmfault]]."
      - left: "`15`"
        right: store/AMO page fault
        why: "15 is a *store* page fault, raised for example by a store to a lazily allocated page or to read-only text."
      - left: "`2`"
        right: illegal instruction
        why: "2 is an illegal instruction, such as reading a machine-mode CSR in user mode; usertrap kills the process."
      - left: "`0x8000000000000005`"
        right: supervisor timer interrupt
        why: "The top bit marks an interrupt; code 5 is the supervisor timer. [[devintr]] calls [[clockintr]] and returns 2."
      - left: "`0x8000000000000009`"
        right: supervisor external interrupt (a device, through the PLIC)
        why: "Top bit set, code 9: a device interrupt routed by the PLIC. [[devintr]] calls [[plic_claim]] and returns 1."
    explain: |
      Bit 63 of `scause` separates interrupts (1) from exceptions (0); the low bits give the
      code. xv6 handles 8 (system call), 13 and 15 (possibly a lazy page) and the two interrupt
      codes; every other exception from user mode kills the process ([[g:trap-cause]],
      [[tour:10]]).

  - id: syscall-08
    level: 2
    type: multi
    q: |
      Which of these does the hardware itself change when a user program executes `ecall`?
    options:
      - text: "`sepc`"
        correct: true
        why: "`ecall` sets `sepc` to its own address, so the kernel knows where the program stopped."
      - text: "`scause`"
        correct: true
        why: "`ecall` sets `scause` to 8, \"environment call from U-mode\"."
      - text: "`sstatus.SIE`"
        correct: true
        why: "Every trap into S-mode clears `SIE` (after copying it into `SPIE`): interrupts are off when `uservec` starts."
      - text: "`sp`"
        why: |
          You may have thought the hardware switches to a kernel stack. It does not: `sp` still
          holds the user's value at the first instruction of [[uservec]], which loads the kernel
          stack itself on line 76.
      - text: "`satp`"
        why: |
          You may have thought entering the kernel installs the kernel page table. It does not:
          `uservec` runs under the user page table until its own `csrw satp` on line 92. That is
          why the trampoline must be mapped in every user page table.
      - text: "`stvec`"
        why: |
          The hardware *reads* `stvec` to find the handler; it never writes it. xv6 changes it
          in [[usertrap]] (line 47) and [[prepare_return]] (line 112).
    explain: |
      The hardware does very little: mode U to S, `pc` from `stvec`, and the CSRs `sepc`,
      `scause`, `stval` and three `sstatus` bits. Stack, page table and register saving are all
      ordinary instructions in [[uservec]] ([[tour:43]], [[concept:mode-stack-page-table#who]]).

  - id: syscall-09
    level: 2
    type: choice
    q: |
      For a system call, [[usertrap]] turns interrupts on at line 66, but only after line 52
      and the `scause` test. Why not earlier?
    code: kernel/trap.c:49-69@64-66
    options:
      - text: "Any interrupt overwrites `sepc`, `scause` and `sstatus` on this hart; by line 66 `sepc` is safe in the trapframe and `scause` has been read."
        correct: true
        why: |
          These CSRs are per hart, and the next trap of any kind rewrites them. Once the values
          that matter are copied into per-process memory, an interrupt can no longer lose them.
      - text: "The kernel stack only becomes usable at line 66."
        why: |
          You may have thought `usertrap` sets up its own stack. The kernel stack was loaded by
          [[uservec]] (line 76) and became usable when it installed the kernel page table (line
          92), before `usertrap` even started; its prologue already pushed a frame.
      - text: "[[killed]] at line 57 takes `p->lock`, and a spinlock must not be acquired with interrupts on."
        why: |
          You may have thought `acquire` needs interrupts off beforehand. It turns them off
          itself with [[push_off]] and restores the previous state afterwards; it works either way.
      - text: "To keep other harts from modifying this process's trapframe until it is complete."
        why: |
          You may have thought `SIE` affects other harts. It only controls interrupts on this
          hart. And no other hart touches this process's trapframe anyway.
    explain: |
      The comment on lines 64–65 says it: an interrupt changes `sepc`, `scause` and `sstatus`.
      Copy what you need into the trapframe first, then let interrupts in. [[tour:43]] caught a
      pending timer tick being taken at the very next instruction after `intr_on`.

  - id: syscall-10
    level: 1
    type: line
    q: |
      Click the line that delivers `sys_write`'s result to the user program.
    code: kernel/syscall.c:136-151
    answer: 146
    lines:
      142: |
        This line *reads* the saved `a7`, the system-call number. Nothing is delivered yet.
      143: |
        This is the bounds check that decides whether the number is valid. The handler has not
        run yet.
      149: |
        This line also writes `a0`, but only for an invalid number, which gets -1. For a valid
        call such as `write`, the handler's result is stored on line 146.
    why_wrong: Look for the line that stores into the saved user `a0`, which [[userret]] will load back into the register.
    explain: |
      Line 146 calls the handler through the table and stores its return value in
      `p->trapframe->a0`. When [[userret]] reloads the registers, `a0` holds the result, exactly
      as if `write` had been an ordinary C function ([[tour:5]]).

  - id: syscall-11
    level: 2
    type: choice
    q: |
      A buggy program puts `99` in `a7` and executes `ecall`. What happens in this kernel?
    code: kernel/syscall.c:136-151@143-150
    options:
      - text: "The kernel prints `<pid> <name>: unknown sys call 99`, the `ecall` returns -1 in `a0`, and the program keeps running."
        correct: true
        why: |
          Line 143 rejects the number, line 148 prints the message and line 149 sets the saved
          `a0` to -1. Nothing else changes, and the return path is the normal one.
      - text: "The kernel panics: index 99 is outside `syscalls[]`."
        why: |
          You may have thought the kernel indexes the table blindly. Line 143 checks
          `num < NELEM(syscalls)` first. A user program must never be able to crash the kernel
          with a bad number.
      - text: "The process is killed, like one that executes an illegal instruction."
        why: |
          You may be mixing this up with a bad *instruction*. The `ecall` itself is legal
          (`scause` 8); only its number is bad, and [[syscall]] never calls [[setkilled]].
      - text: "Whatever word lies 99 entries past the start of `syscalls[]` is called as a function."
        why: |
          That is what would happen without the bounds check: a hostile program could make the
          kernel jump almost anywhere. Line 143 is there to prevent exactly that.
    explain: |
      Every value in the trapframe is controlled by the user, so [[syscall]] treats `a7` as
      untrusted input: it must be positive, inside the table, and point at a non-null entry.
      Anything else is an error code, not a crash ([[tour:5]]).

  - id: syscall-12
    level: 2
    type: number
    q: |
      What is `NELEM(syscalls)`, the number of elements in the table?
    code: kernel/syscall.c:107-134
    answer: 23
    wrong:
      22: |
        You may have counted the 22 entries. The table uses designated initializers, and the
        lowest index is `SYS_fork` = 1, not 0. A C array sized by its initializers has
        (highest index + 1) elements, so slot 0 exists and is a null pointer.
      21: |
        You may have thought the highest number, `SYS_sync` = 22, is one past the end. It is
        the last valid index, so the array needs 23 elements.
    why_wrong: The array is sized by its highest designated index, `SYS_sync` = 22, plus one.
    explain: |
      `[SYS_sync] = sys_sync` with `SYS_sync` 22 forces 23 elements, indices 0–22. Slot 0 is
      never filled, which is why [[syscall]] also checks `num > 0` and `syscalls[num]` is
      non-null ([[g:designated-initializer]]).

  - id: syscall-13
    level: 1
    type: number
    q: |
      At most how many arguments can a system call handler fetch with [[argint]],
      [[argaddr]] or [[argstr]]?
    code: kernel/syscall.c:34-54
    answer: 6
    wrong:
      8: |
        You may have counted all argument registers, `a0`–`a7`. `a7` carries the system-call
        number, and [[argraw]] has no case for `a6` or `a7`: `argraw(6)` panics.
      7: |
        You may have thought `a6` is available too. [[argraw]] handles `n` from 0 to 5 only; any
        other `n` reaches `panic("argraw")`.
    why_wrong: Count the `case` labels in [[argraw]].
    explain: |
      [[argraw]] reads `a0`–`a5` from the trapframe: six arguments. No xv6 system call needs
      more (`write`, `read` and `sbrk` use three or fewer). See [[tour:6]].

  - id: syscall-14
    level: 2
    type: multi
    q: |
      A timer interrupt arrives while `cat` runs in user mode (it has not been killed). Which of
      these does [[usertrap]] do for this trap?
    code: kernel/trap.c:37-95
    options:
      - text: "calls [[devintr]], which returns 2"
        correct: true
        why: "`scause` is not 8, so line 69 calls [[devintr]]; it recognizes the timer, calls [[clockintr]] and returns 2."
      - text: "calls [[yield]]"
        correct: true
        why: "`which_dev == 2` at line 85: a timer tick from user mode gives up the CPU."
      - text: "calls [[prepare_return]]"
        correct: true
        why: "Every trap from user mode that does not end in `kexit` returns through [[prepare_return]] (line 88)."
      - text: "adds 4 to `p->trapframe->epc`"
        why: |
          You may have thought every trap skips an instruction. Only the system-call branch adds
          4. An interrupt arrives *between* instructions: `sepc` points at the instruction that
          has not run yet, and it must run when `cat` resumes.
      - text: "turns interrupts on with [[intr_on]]"
        why: |
          You may have remembered line 66. It is inside the system-call branch only. For an
          interrupt, `usertrap` never turns interrupts on: whenever `cat`'s kernel thread is
          running, they are off, from the trap until `sret`.
      - text: "calls [[syscall]]"
        why: "`syscall()` runs only when `scause == 8`. A timer interrupt has `scause = 0x8000000000000005`."
    explain: |
      [[usertrap]] sorts the trap by `scause`: system call, device or timer (via [[devintr]]),
      lazy page fault, or "unexpected". For the timer it re-arms the timer, yields, and later
      returns to the very instruction that was interrupted ([[tour:11]]).

  - id: syscall-15
    level: 3
    type: state
    q: |
      A user program stores to a lazily allocated heap page and takes a store page fault
      (`scause` 15). [[usertrap]] calls [[vmfault]]. What is the state of the hart at line 463,
      before [[kalloc]] has been called?
    code: kernel/vm.c:458-478@463
    state:
      mode: S
      stack: kernel
      satp: kernel
      sie: "off"
      noff: 0
      intena: "-"
    why:
      sie: |
        You may have remembered that [[usertrap]] turns interrupts on. It does, but only in the
        system-call branch (line 66). A page fault takes the `else if` branch at line 71, so
        interrupts are still off from the trap itself.
      noff: |
        No spinlock is held yet: [[vmfault]] has not called [[kalloc]], which is where
        `kmem.lock` will be taken. Interrupts are off because of the trap, not because of
        [[push_off]].
      intena: |
        `intena` only means something while `noff > 0`. With no `push_off` outstanding, it is
        not in use.
      satp: |
        [[vmfault]] works on the *user* page table, but in software, through `walk`. The hart
        itself has been on the kernel page table since [[uservec]] switched `satp` at line 92.
      stack: |
        All of [[usertrap]]'s callees run on the process's kernel stack, which [[uservec]]
        loaded. The kernel never runs on the user's stack.
    why_wrong: Follow the path - store fault, uservec, usertrap's page-fault branch, vmfault - and track each field.
    explain: |
      Supervisor mode, the process's kernel stack, the kernel page table, interrupts **off**
      with `noff` 0. A page fault is short work, so `usertrap` never enables interrupts for it.
      When [[kalloc]]'s `acquire` runs, [[push_off]] will record `intena = 0`, and the matching
      release will leave interrupts off ([[tour:10]], [[concept:locks#intena]]).

  - id: syscall-16
    level: 2
    type: bits
    q: |
      Inside [[usertrap]], `scause` reads `0x8000000000000009`. Decode it.
    value: "0x8000000000000009"
    fields:
      - label: Bit 63
        options: ["1: an interrupt", "0: an exception"]
        answer: "1: an interrupt"
        why: "`0x8...` has the top bit set. RISC-V uses bit 63 of `scause` to mark interrupts."
      - label: Code (the low bits)
        options: ["9", "8", "5"]
        answer: "9"
        why: "With bit 63 removed, the remaining value is 9. (8 would be an `ecall` exception; 5 the timer interrupt.)"
      - label: Meaning
        options: ["supervisor external interrupt (a device, through the PLIC)", "supervisor timer interrupt", "environment call from U-mode"]
        answer: "supervisor external interrupt (a device, through the PLIC)"
        why: "Interrupt code 9 is the supervisor external interrupt, which on QEMU's `virt` machine comes from the PLIC."
      - label: What [[devintr]] returns
        options: ["1", "2", "0"]
        answer: "1"
        why: "[[devintr]] returns 1 for an external interrupt (line 212), 2 only for the timer, 0 for anything it does not recognize."
      - label: Will usertrap call yield() for this trap?
        options: ["no", "yes"]
        answer: "no"
        why: "Line 85 yields only when `which_dev == 2`, the timer. A device interrupt is handled and the process continues."
    explain: |
      `0x8000000000000009` is the supervisor external interrupt: [[devintr]] asks the PLIC
      which device it was ([[plic_claim]]), runs that driver's handler, and tells the PLIC it is
      done ([[plic_complete]]). See [[tour:9]].

  - id: syscall-17
    level: 2
    type: tf
    q: |
      True or false: if a user program sets `sp` to `0` just before its `ecall`, it can crash the
      kernel.
    answer: false
    why_tf: |
      You may have thought the kernel uses the caller's stack, as an ordinary function would.
      The kernel never runs on the user's stack, so the user's `sp` can be anything.
    reasons:
      - text: "[[uservec]] only *stores* the user's `sp` in the trapframe (line 41) and then loads the kernel stack from `kernel_sp` (line 76); the kernel never pushes through the user's `sp`."
        correct: true
        why: |
          The user's `sp` is treated as data: saved on the way in, restored on the way out.
          Nothing in the kernel dereferences it.
      - text: "The kernel checks `sp` with [[copyin]] before it uses it."
        why: |
          You may have thought every user value is checked. There is no check of `sp`, and none
          is needed, because the kernel never uses it as a pointer.
      - text: "`ecall` replaces a bad `sp` with the kernel stack."
        why: |
          The hardware does not touch `sp` on a trap; it still holds `0` at the first
          instruction of `uservec`.
    explain: |
      The program itself will probably crash when it next uses its stack, but the kernel is
      unaffected. That is one reason [[uservec]] is written to use no stack at all until it has
      loaded the kernel's own ([[concept:stacks#none]]).

  - id: syscall-18
    level: 2
    type: order
    q: |
      Put these steps of one system call (one that does not sleep or yield) in the order they
      happen.
    items:
      - text: "`ecall`: mode U to S, `sepc` = the `ecall`'s address, `pc` = `stvec`"
        why: The trap itself comes first; nothing in the kernel runs before the hardware has entered it.
      - text: "[[uservec]] saves the user registers into the trapframe"
        why: The user's registers must be saved before any of them can be reused, and only the user page table maps `TRAPFRAME`.
      - text: "[[uservec]] loads the kernel stack and switches `satp` to the kernel page table"
        why: The switch must come after the saves, because `TRAPFRAME` is not mapped in the kernel page table.
      - text: "[[usertrap]] copies `sepc` into `p->trapframe->epc`"
        why: This is the first thing done in C (after stvec), before anything can overwrite `sepc`.
      - text: "[[usertrap]] turns interrupts on"
        why: Interrupts go on only after `sepc` and `scause` are safe.
      - text: "[[syscall]] runs the handler and stores its result in `trapframe->a0`"
        why: The handler runs with interrupts on, after all the bookkeeping.
      - text: "[[prepare_return]] turns interrupts off and points `stvec` at `uservec`"
        why: The return path starts only once the result is in the trapframe.
      - text: "[[userret]] switches to the user page table, restores the registers and executes `sret`"
        why: Restoring is the very last step; `sret` drops back to user mode.
    why_wrong: Ask what each step needs from the step before it - which page table, which saved value.
    explain: |
      In: trap, save, switch, record `epc`, enable interrupts, dispatch. Out: disable interrupts,
      re-aim `stvec`, switch back, restore, `sret`. [[tour:5]] and [[tour:43]] follow every step.

  - id: syscall-19
    level: 3
    type: choice
    q: |
      Why must [[kerneltrap]] write `sepc` and `sstatus` back (lines 162–163) before returning
      to [[kernelvec]]?
    code: kernel/trap.c:134-164@160-163
    options:
      - text: "`yield()` may have run other threads on this hart, or moved this thread to another hart; their traps and returns overwrote `sepc` and `sstatus`, and `kernelvec`'s `sret` needs this trap's values."
        correct: true
        why: |
          `sepc` and `sstatus` belong to the hart. The saved copies live in `kerneltrap`'s
          locals (callee-saved registers and its stack frame), which belong to this thread and
          travel with it.
      - text: "[[kernelvec]] saved them on the stack, and these lines copy them back."
        why: |
          You may have thought `kernelvec` saves CSRs. It saves only 17 general registers. The
          only copies of `sepc` and `sstatus` are the local variables read on lines 140–141.
      - text: "`sret` clears `sepc`, so it has to be rewritten before every `sret`."
        why: |
          `sret` *reads* `sepc` to find where to go; it does not clear it. The problem is that
          other traps may have changed it in the meantime.
      - text: "To return to user mode: the saved `sstatus` has `SPP = 0`."
        why: |
          You may have confused this with [[prepare_return]]. A kernel trap came from supervisor
          mode, so the saved `sstatus` has `SPP = 1`, and `sret` returns to the interrupted
          kernel code.
    explain: |
      Per-hart CSRs are copied into per-thread storage on entry and copied back just before
      `sret`. Without lines 162–163, a thread that yielded could `sret` to some other thread's
      address, possibly in user mode ([[tour:8]]).

  - id: syscall-20
    level: 3
    type: choice
    q: |
      [[kernelvec]] restores every register it saved except `tp`; it does not even save it. Why?
    code: kernel/kernelvec.S:40-64@44
    options:
      - text: "The interrupted thread may have yielded and resumed on another hart; `tp` must hold the ID of the hart the thread is on *now*, which it already does."
        correct: true
        why: |
          Inside the kernel `tp` holds the hart ID that [[cpuid]] and [[mycpu]] rely on.
          Restoring the value saved on another hart would make the thread use the wrong
          `struct cpu`.
      - text: "`tp` is a callee-saved register, so [[kerneltrap]] preserves it anyway."
        why: |
          You may have thought `tp` is one of the `s` registers. It is not; the callee-saved
          registers are `s0`–`s11` (and `sp`). C code here leaves `tp` alone, but the reason
          `kernelvec` skips it is the one in the comment on line 44.
      - text: "`tp` holds the user's thread pointer, which the kernel must not modify."
        why: |
          You may be thinking of user mode. In the kernel, `tp` holds the hart ID; the user's
          `tp` is saved in the trapframe by [[uservec]] and is not involved in a kernel trap.
      - text: "The 256-byte frame has no slot for `tp`."
        why: |
          It has one, at offset 24; line 20 is commented out on purpose. The frame has a slot for
          every register `x1`–`x31`, at offset 8×(n−1).
    explain: |
      `tp` describes the hart, not the thread. After a kernel trap that yielded, the same frame
      may be popped on a different hart, and `tp` must stay as it is ([[tour:8]],
      [[concept:stacks#same]]).

  - id: syscall-21
    level: 3
    type: choice
    q: |
      Suppose [[usertrap]] called `intr_on()` right after line 47 (so before line 52), and a timer interrupt was
      already pending when `echo` executed its `ecall` for `write`. What would happen?
    code: kernel/trap.c:49-69
    options:
      - text: "The timer is taken at once through [[kernelvec]]; afterwards `sepc` holds a kernel address and `scause` says \"timer\", so `usertrap` saves the kernel address as `epc`, never calls `syscall()`, and `echo` returns to that address in user mode, faults and is killed."
        correct: true
        why: |
          [[kerneltrap]] restores `sepc` to the kernel instruction it interrupted (inside
          `usertrap`) and never restores `scause`. Line 52 then copies the wrong `sepc`, and the
          `scause == 8` test fails. Returning to a kernel address in user mode is an instruction
          page fault, which `usertrap` handles by killing the process.
      - text: "Nothing changes: [[kernelvec]] saves and restores `sepc` and `scause`."
        why: |
          You may have thought the kernel trap path puts everything back. [[kerneltrap]] puts
          back *its own* `sepc` (a kernel address) and `sstatus`, and never touches `scause`.
          The user's `ecall` address is gone.
      - text: "The kernel panics with `kerneltrap`."
        why: |
          You may have thought any trap inside `usertrap` is fatal. A timer is a recognized
          interrupt: [[devintr]] returns 2 and [[kerneltrap]] returns normally.
      - text: "The `write` runs twice."
        why: |
          You may have thought the lost `+4` would repeat the `ecall`. The `+4` is never reached:
          `scause` no longer says 8, so the system call does not run even once.
    explain: |
      This is exactly why line 66 comes after line 52 and the `scause` test: an interrupt
      overwrites `sepc` and `scause` on this hart. [[tour:43]] ran this experiment; the process
      was killed after a page fault at a kernel address.

  - id: syscall-22
    level: 3
    type: multi
    q: |
      In this kernel, which of these traps from user mode end with [[usertrap]] killing the
      process?
    code: kernel/trap.c:69-82
    options:
      - text: "an illegal instruction, such as `csrr` of a machine-mode CSR (`scause` 2)"
        correct: true
        why: "2 is not 8, [[devintr]] returns 0, and it is neither 13 nor 15: the `else` branch calls [[setkilled]]."
      - text: "a store to the program's own read-only text page (`scause` 15)"
        correct: true
        why: "[[vmfault]] finds the page already mapped ([[ismapped]]): a permission problem, not a missing page. It returns 0, so the process is killed."
      - text: "a jump into a lazily allocated heap page that was never touched (instruction page fault, `scause` 12)"
        correct: true
        why: "Only 13 and 15 are offered to [[vmfault]]. An instruction page fault falls to the `else` branch."
      - text: "a load from a lazily allocated page below `p->sz` that was never touched (`scause` 13)"
        why: |
          You may have thought every page fault is fatal. This one is the lazy-allocation case:
          [[vmfault]] finds the address below `p->sz` and unmapped, maps a zeroed page, and the
          load runs again.
      - text: "an `ecall` with `a7 = 99`"
        why: |
          You may have thought a bad system-call number is an error trap. The `ecall` is a normal
          system call; [[syscall]] only returns -1.
      - text: "a timer interrupt"
        why: "A timer interrupt is handled by [[devintr]] and causes a [[yield]], not a kill."
    explain: |
      The policy is: system calls run, device and timer interrupts are handled, load/store faults
      on promised-but-missing pages are repaired, and every other exception kills the process
      with `kexit(-1)`. A user fault never costs the kernel its life ([[tour:10]]).

  - id: syscall-23
    level: 3
    type: order
    q: |
      `cat` is inside [[copyout]] (in a system call, interrupts on) when hart 2's timer fires.
      Put the steps in order.
    items:
      - text: "The hardware sets `sepc` to the interrupted instruction, `scause` to the timer code, clears `SIE`, and jumps to `stvec`, which is [[kernelvec]]"
        why: The trap itself comes first; it is the hardware that diverts the hart.
      - text: "[[kernelvec]] pushes a 256-byte frame on `cat`'s kernel stack and saves the caller-saved registers"
        why: Registers are saved before any C code can clobber them.
      - text: "[[kerneltrap]] copies `sepc` and `sstatus` into local variables"
        why: These per-hart CSRs must be copied into thread storage before anything can switch threads.
      - text: "[[devintr]] calls [[clockintr]], which writes a new `stimecmp`"
        why: The cause is identified and the timer re-armed before deciding to yield.
      - text: "[[yield]] switches away; later `cat` resumes, perhaps on another hart"
        why: Yielding comes after the timer has been acknowledged, using the 2 that devintr returned.
      - text: "[[kerneltrap]] writes the saved `sepc` and `sstatus` back"
        why: This happens only after `yield` returns, just before going back to kernelvec.
      - text: "[[kernelvec]] reloads the registers, pops its frame and executes `sret`"
        why: "`sret` is the very last step: it jumps back to the instruction in copyout that never ran."
    why_wrong: Ask for each step what must already be saved or decided for it to be safe.
    explain: |
      Kernel traps reuse the current kernel stack, so the trap's state is pushed onto `cat`'s
      own stack and travels with it if `cat` moves to another hart. The CSRs are copied out on
      entry and back in just before `sret` ([[tour:8]], [[concept:stacks#same]]).

  - id: syscall-24
    level: 2
    type: choice
    q: |
      Hart 1 has nothing to run. Its [[scheduler]] briefly enables interrupts at line 441, and a
      timer interrupt is taken there. What does [[kerneltrap]] do?
    code: kernel/trap.c:149-164
    options:
      - text: "[[clockintr]] re-arms hart 1's timer, and that is all: `myproc()` is 0, so there is no `yield`, and `kernelvec` returns to the scheduler loop."
        correct: true
        why: |
          `which_dev` is 2, but line 157 also requires a current process. A hart in its
          scheduler has none (`c->proc = 0`), so there is nothing to give up.
      - text: "It increments `ticks` and wakes sleepers."
        why: |
          You may have thought every hart counts time. Only hart 0 does (`cpuid() == 0` in
          [[clockintr]]); otherwise `ticks` would run three times too fast.
      - text: "It calls [[yield]] so the scheduler can pick a process."
        why: |
          You may have thought every timer tick yields. Line 157 checks `myproc() != 0`; the
          scheduler thread is not a process and has nothing to yield.
      - text: "It panics, because traps are not allowed on the scheduler stack."
        why: |
          You may have thought a trap needs a process's kernel stack. [[kernelvec]] pushes its
          frame on whatever stack is current, here hart 1's scheduler stack, and pops it again.
    explain: |
      A kernel trap is handled on the current stack whoever is running. In the scheduler, a
      tick only re-arms the timer (and on hart 0 counts `ticks`); preemption needs a process
      ([[tour:8]], [[concept:stacks#same]]).

  - id: syscall-25
    level: 2
    type: number
    q: |
      During one system call that neither sleeps nor yields, how many times is `stvec` written,
      from the `ecall` to the `sret`?
    answer: 2
    wrong:
      0: |
        You may have thought the hardware handles the trap vector. The hardware only reads
        `stvec`. xv6 changes it itself, because the kernel and user mode need different
        handlers.
      1: |
        You may have counted only one direction. [[usertrap]] points it at [[kernelvec]] on the
        way in (line 47), and [[prepare_return]] points it back at [[uservec]] on the way out
        (line 112).
      3: |
        You may have counted [[trapinithart]] too. It writes `stvec` once per hart at boot, not
        during system calls.
    why_wrong: Find every `w_stvec` call in trap.c and decide which of them run during a system call.
    explain: |
      Two writes: line 47 (to [[kernelvec]], for traps while in the kernel) and line 112 (back
      to the trampoline, for the next trap from user mode). The third writer, [[trapinithart]],
      runs only at boot ([[tour:43]]).
