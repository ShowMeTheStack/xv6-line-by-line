title: RISC-V privilege and CSRs
summary: Machine, supervisor and user mode, the control and status registers xv6 uses, what the hardware does on a trap, mret and sret, and why every CSR belongs to one hart.
questions:
  - id: csr-01
    level: 1
    type: choice
    q: |
      [[kernel:start]] runs in machine mode and wants [[kernel:main]] to run in supervisor
      mode. Why does it write `mstatus.MPP` and `mepc` and then execute `mret`, instead of
      switching modes directly?
    code: kernel/start.c:14-25
    options:
      - text: RISC-V has no instruction that simply lowers the privilege mode; the only way down is to return from a trap, and mret takes the new mode from MPP and the new pc from mepc.
        correct: true
        why: |
          `start` fills in what a trap from supervisor mode at `main` *would* have left, then
          "returns" from that trap that never happened ([[tour:46]]).
      - text: There is such an instruction, but `mret` is used because it also jumps, saving one instruction.
        why: |
          You may have assumed every CPU has a "set mode" instruction. RISC-V does not: the
          mode changes only on a trap (up) or on `mret`/`sret` (down).
      - text: "`mret` is needed to switch to the supervisor's own stack pointer."
        why: |
          You may have thought each mode has its own `sp`. RISC-V has one `sp` per hart, and
          `mret` leaves it untouched: `main` runs on the same boot stack `start` used.
      - text: "`mepc` holds the address of the machine-mode trap handler, which `mret` installs."
        why: |
          You may have confused `mepc` with `mtvec`. `mepc` is the pc to return to; xv6 never
          writes `mtvec`, because it has no machine-mode trap handler.
    explain: |
      Privilege goes up only through a trap and down only through a trap return. `mret`
      sets the mode from `MPP`, the `pc` from `mepc`, and `MIE` from `MPIE`, all at once
      ([[g:insn:mret]], [[concept:mode-stack-page-table#t8]]).

  - id: csr-02
    level: 1
    type: line
    q: |
      Click the line in [[kernel:start]] where the hart actually stops running in machine mode.
    code: kernel/start.c:14-52
    answer: 51
    lines:
      20: |
        This line only puts `01` (supervisor) into the `MPP` field of a variable; line 21
        writes it to `mstatus`. Neither changes the current mode: `MPP` is read later, by
        `mret`.
      21: |
        You may have thought writing `MPP` switches modes. It only arms the switch: `MPP`
        records the mode that the next `mret` will enter.
      25: |
        Writing `mepc` chooses *where* `mret` will go, not when. The hart is still in machine
        mode after this line.
      28: |
        `satp = 0` turns paging off for the supervisor mode the hart is about to enter. It has
        no effect on machine mode, which never translates addresses here.
      48: |
        Copying the hart ID into `tp` is the last thing done in machine mode, but it changes
        no privilege.
    why_wrong: Every line before it only prepares registers; look for the instruction that consumes them.
    explain: |
      Line 51, `mret`, is the only instruction that changes the mode: it reads `MPP` (S) and
      `mepc` (`main`) and switches both at once. gdb shows `$priv` going from 3 to 1 across it
      ([[tour:46]]).

  - id: csr-03
    level: 1
    type: tf
    q: |
      True or false: when a user program executes `ecall`, the hardware switches to the
      process's kernel stack and the kernel page table as part of the trap.
    code: kernel/trampoline.S:22-37
    answer: false
    why_tf: |
      You may know architectures (such as x86) that load a kernel stack pointer on a trap.
      RISC-V does not: a trap changes the mode, the `pc` and a few CSRs, and nothing else.
    reasons:
      - text: "The trap leaves `sp` and `satp` untouched; [[uservec]] switches them itself, with `ld sp, 8(a0)` (line 76) and `csrw satp, t1` (line 92)."
        correct: true
        why: |
          That is why [[uservec]] must first park `a0` in `sscratch` and save every register into
          the trapframe through the *user* page table: it starts with no usable stack.
      - text: "The hardware switches the page table but not the stack; `uservec` only needs to set `sp`."
        why: |
          You may have thought the page table is part of the mode. `satp` keeps the user page
          table until line 92; the trampoline is mapped in the user page table precisely so that
          `uservec` can run there.
      - text: "The hardware switches the stack but not the page table, using the `kernel_sp` field of the trapframe."
        why: |
          You may have thought the CPU reads the trapframe. The trapframe is ordinary memory
          that only xv6's code reads; `kernel_sp` is loaded by `uservec`'s own `ld sp`.
    explain: |
      On a trap into supervisor mode the hardware sets `sepc`, `scause`, `stval`, `SPP`,
      `SPIE`, clears `SIE`, sets the mode to S and jumps to `stvec`. Stack and page table are
      software's job ([[concept:mode-stack-page-table#who]], [[tour:43]]).

  - id: csr-04
    level: 1
    type: choice
    q: |
      Just before `mret`, [[kernel:start]] copies the hart ID into the ordinary register `tp`.
      From then on [[cpuid]] returns `tp`. Why not just read `mhartid` whenever the ID is
      needed?
    code: kernel/start.c:46-51@46-48
    options:
      - text: "`mhartid` is a machine-mode CSR; once the hart runs in supervisor mode, reading it raises an illegal-instruction exception."
        correct: true
        why: |
          After `mret` the kernel never runs in machine mode again, so this is the last chance to
          read the ID. `tp` is a general-purpose register that supervisor code can read freely.
      - text: Reading a CSR is too slow to do on every `mycpu()` call.
        why: |
          You may have thought speed is the reason. A `csrr` is one instruction, like `mv`. The
          real problem is permission: supervisor mode may not read `mhartid` at all.
      - text: "`mhartid` changes when a process moves to another hart, so it cannot be trusted."
        why: |
          You may have mixed up harts and processes. `mhartid` is fixed for each hart and never
          changes; it is `tp` that the kernel must keep correct as threads move ([[kernelvec]]
          deliberately does not restore it).
      - text: "`mret` clears `mhartid`, so it must be saved first."
        why: |
          You may have thought `mret` resets machine state. It changes only the mode, `pc`,
          `MIE`, `MPIE` and `MPP`; `mhartid` is read-only and never changes.
    explain: |
      Machine-mode CSRs are out of reach from supervisor mode. Anything the kernel needs from
      them later must be copied out before `mret`; `tp` is the one value xv6 copies
      ([[g:csr:mhartid]], [[g:reg:tp]], [[tour:2]]).

  - id: csr-05
    level: 1
    type: match
    q: |
      Match each supervisor CSR with what it holds in xv6.
    pairs:
      - left: "`stvec`"
        right: the address the hart jumps to when a trap is taken into supervisor mode
        why: "xv6 points it at [[kernelvec]] while in the kernel and at [[uservec]] (in the trampoline) while heading to user mode."
      - left: "`sepc`"
        right: the address of the instruction that was interrupted or that caused the trap
        why: "The hardware writes it on a trap; `sret` jumps to it. [[usertrap]] copies it into `p->trapframe->epc` at once."
      - left: "`scause`"
        right: why the trap happened, with the top bit set for interrupts
        why: "8 means a system call from U-mode; `0x8000000000000005` a supervisor timer interrupt ([[devintr]])."
      - left: "`satp`"
        right: the paging mode and the physical page number of the root page table
        why: "[[MAKE_SATP]] combines mode 8 (Sv39) with the root's page number."
      - left: "`sscratch`"
        right: one spare register where uservec parks the user's a0
        why: "The hardware never writes it; [[uservec]] uses it for a few dozen instructions ([[kernel/trampoline.S:32]])."
      - left: "`stimecmp`"
        right: the time at which this hart's next timer interrupt fires
        why: "Set first by [[timerinit]], then by every [[clockintr]], about 0.1 s ahead."
    explain: |
      Each of these is one register per hart. The hardware writes `sepc` and `scause` on a
      trap; xv6 writes `stvec`, `satp`, `sscratch` and `stimecmp` itself ([[tour:43]],
      [[g:csr:stvec]], [[g:csr:satp]]).

  - id: csr-06
    level: 1
    type: multi
    q: |
      A user program executes `ecall`. Which of these does the **hardware** change as part of
      taking the trap? Choose all that apply.
    options:
      - text: "`sepc`"
        correct: true
        why: "It gets the address of the `ecall` instruction itself."
      - text: "`scause`"
        correct: true
        why: "It gets 8, \"environment call from U-mode\"."
      - text: "`sstatus.SIE`"
        correct: true
        why: "The old value is copied into `SPIE` and `SIE` is cleared, so interrupts are off in the handler."
      - text: "`sp`"
        why: |
          You may have expected the hardware to switch to a kernel stack. It does not; `sp` still
          holds the user's value when [[uservec]] starts.
      - text: "`satp`"
        why: |
          You may have thought entering supervisor mode installs the kernel page table. `satp`
          still names the user page table until [[kernel/trampoline.S:92]].
      - text: "`stvec`"
        why: |
          You may have confused reading `stvec` with writing it. The hardware jumps *to* the
          address in `stvec`; only xv6's code ([[kernel/trap.c:47]]) changes it.
    explain: |
      The hardware's part of a trap is small: the mode, the `pc`, `sepc`, `scause`, `stval`
      and three `sstatus` bits (`SPP`, `SPIE`, `SIE`). Everything else in the trap path is
      instructions in [[uservec]] and [[usertrap]] ([[tour:43]]).

  - id: csr-07
    level: 1
    type: choice
    q: |
      Lines 31–32 write `0xffff` to `medeleg` and `mideleg`. What would go wrong without them?
    code: kernel/start.c:30-33@31-32
    options:
      - text: Traps would go to machine mode, where xv6 has no handler at all; system calls, page faults and timer interrupts would never reach the kernel's supervisor-mode code.
        correct: true
        why: |
          By default every trap goes to machine mode, to `mtvec`, which xv6 never sets.
          [[g:delegation|Delegation]] sends them to supervisor mode, to `stvec`, instead.
      - text: Interrupts would stay disabled, because delegation is what enables them.
        why: |
          You may have mixed up *where* a trap goes with *whether* it is taken. Enabling is done
          by `sie` (line 33) and `sstatus.SIE`; delegation only chooses the destination mode.
      - text: Supervisor mode could not read the `time` CSR.
        why: |
          You may be thinking of `mcounteren` ([[kernel/start.c:62]]), which grants that
          permission. Delegation has nothing to do with counter access.
      - text: User programs would trap straight into user-mode handlers instead of the kernel.
        why: |
          You may have thought traps can go *down*. A trap never goes to a less privileged mode
          than the one it came from, and xv6 has no user-mode handlers.
    explain: |
      `medeleg` (exceptions) and `mideleg` (interrupts) say which traps from S- or U-mode are
      handled in S-mode. xv6 delegates everything it can, so after boot the hart never enters
      machine mode again ([[tour:46]], [[g:csr:medeleg]]).

  - id: csr-08
    level: 1
    type: number
    q: |
      [[usertrap]] recognizes a system call by the value of `scause`. What value is it?
    code: kernel/trap.c:52-58@54
    answer: 8
    wrong:
      9: |
        9 is "environment call from **S**-mode". xv6's kernel never executes `ecall`; a system
        call comes from user mode, cause 8.
      11: |
        11 is "environment call from **M**-mode". Machine mode is used only at boot, and never
        executes `ecall`.
      2: |
        2 is "illegal instruction". `ecall` is a perfectly legal instruction; it raises its own
        cause.
    why_wrong: Read line 54 of trap.c, and remember that the cause code depends on the mode the ecall came from.
    explain: |
      An `ecall` from U-mode sets `scause` = 8, with the top (interrupt) bit clear because it is
      an exception. The code then adds 4 to the saved `epc` so that the program resumes after
      the `ecall` ([[g:csr:sepc]], [[tour:43]]).

  - id: csr-09
    level: 2
    type: bits
    q: |
      After line 33 of [[kernel:start]], gdb reads `sie = 0x220` on every hart. Decode it.
    code: kernel/start.c:30-33@33
    value: "0x220"
    fields:
      - label: "SEIE (bit 9): supervisor external interrupts"
        options: ["1 (enabled)", "0 (disabled)"]
        answer: "1 (enabled)"
        why: "`0x220` = `0x200 + 0x20`; `0x200` is bit 9. This is `SIE_SEIE`, the PLIC's device interrupts."
      - label: "STIE (bit 5): supervisor timer interrupts"
        options: ["1 (enabled)", "0 (disabled)"]
        answer: "1 (enabled)"
        why: "`0x20` is bit 5, `SIE_STIE`. The Sstc timer raises this interrupt."
      - label: "SSIE (bit 1): supervisor software interrupts"
        options: ["1 (enabled)", "0 (disabled)"]
        answer: "0 (disabled)"
        why: "Bit 1 would be `0x2`, which is not part of `0x220`. xv6 never uses software interrupts."
      - label: Can a timer interrupt be taken in main right after mret?
        options: ["no", "yes"]
        answer: "no"
        why: "`sie` holds only the individual switches. In supervisor mode an interrupt is also gated by `sstatus.SIE`, which is still 0 until the scheduler's first `intr_on()`."
    explain: |
      An interrupt is taken in S-mode only if it is pending (`sip`), individually enabled
      (`sie`), and globally enabled (`sstatus.SIE`). Line 33 sets two individual switches;
      the global one stays off throughout boot ([[g:csr:sie]], [[tour:46]]).

  - id: csr-10
    level: 2
    type: bits
    q: |
      After [[kvminithart]], gdb reads `satp = 0x8000000000087fff` on every hart. Decode it
      as an Sv39 `satp` (MODE in bits 63–60, ASID in bits 59–44, PPN in bits 43–0).
    code: kernel/riscv.h:245-248
    value: "0x8000000000087fff"
    fields:
      - label: MODE (bits 63-60)
        options: ["8 (Sv39 paging)", "0 (Bare: no translation)", "9 (Sv48 paging)"]
        answer: "8 (Sv39 paging)"
        why: "The top hex digit is 8: `SATP_SV39` is `8L << 60`."
      - label: ASID (bits 59-44)
        options: ["0", "0x87", "0x8000"]
        answer: "0"
        why: "Hex digits 2 to 5 from the left are all 0. xv6 never uses address-space identifiers."
      - label: Physical address of the root page table
        options: ["0x87fff000", "0x87fff", "0x87fff000000"]
        answer: "0x87fff000"
        why: "The PPN is `0x87fff`, a page number. A physical address is the page number times 4096, so shift it left by 12: `0x87fff000`."
    explain: |
      [[MAKE_SATP]] is `SATP_SV39 | (pagetable >> 12)`. The kernel's root page table is at
      `0x87fff000` in this build: the first page [[kalloc]] handed out, to [[kvmmake]]
      ([[g:csr:satp]], [[tour:3]]).

  - id: csr-11
    level: 2
    type: state
    q: |
      A user program has just executed `ecall`. The hart is about to run the first instruction
      of [[uservec]], line 32. Fill in its state. (For the stack, count it only if the code
      running here may push onto it; see [[concept:stacks#none]].)
    code: kernel/trampoline.S:22-37@32
    state:
      mode: S
      stack: none
      satp: user
      sie: "off"
    why:
      mode: |
        You may have thought `uservec` is still user code because it runs on the user page
        table. The `ecall` already switched the hart to supervisor mode; that is what lets it
        execute `csrw sscratch`.
      stack: |
        `sp` still holds the user's value. The kernel must not push anything through a pointer
        the user controls, and the kernel stack is not loaded until line 76 (and not usable
        until line 92).
      satp: |
        The trap does not touch `satp`. The kernel page table is installed only at line 92.
      sie: |
        Taking the trap copied `SIE` into `SPIE` and cleared `SIE`.
    why_wrong: Apply only what the hardware does on a trap; nothing else has run yet.
    explain: |
      Supervisor mode, user page table, no usable stack, interrupts off: a combination that
      exists only at the start of [[uservec]]. That is why it saves registers into the
      trapframe at a fixed virtual address instead of pushing them
      ([[concept:mode-stack-page-table#t1]]).

  - id: csr-12
    level: 2
    type: state
    q: |
      Hart 2 has just executed the `mret` at the end of [[kernel:start]] and is at the first
      instruction of [[kernel:main]]. Fill in its state.
    code: kernel/main.c:9-13
    state:
      mode: S
      stack: boot
      satp: bare
      sie: "off"
      noff: "0"
    why:
      mode: |
        `MPP` was set to `01` on line 20 of start.c, so `mret` entered supervisor mode.
      stack: |
        `mret` does not touch `sp`; RISC-V has only one `sp` per hart, so `main` runs on the
        same slice of [[stack0]] that `start` used.
      satp: |
        You may have thought paging is on in the kernel from the start. [[kernel:start]] wrote
        `satp = 0` (Bare); paging comes on only in [[kvminithart]].
      sie: |
        You may have thought `mret` turns interrupts on. It sets `MIE` from `MPIE` (both 0
        here) and does not touch `sstatus.SIE`, which is still 0.
      noff: |
        No spinlock has been taken yet on this hart, so no `push_off` is outstanding.
    why_wrong: "`mret` changes the mode and the `pc`, and a few `mstatus` bits; check which of these fields it touches."
    explain: |
      `mret` is T8: one privilege change (M → S), no stack switch, no page-table switch. gdb at
      `main` reads `$priv = 1` and `sstatus = 0x200000000`, so `SIE` is 0
      ([[concept:mode-stack-page-table#t8]], [[tour:2]]).

  - id: csr-13
    level: 2
    type: number
    q: |
      On entry to [[kernel:start]], gdb reads `mstatus = 0xa00000000`. What value is written
      to `mstatus` on line 21? Answer in hex.
    code: kernel/riscv.h:14-17
    answer: "0xa00000800"
    wrong:
      "0xa00001000": |
        You may have read "MPP = 1" as bit 12. `MPP` is the two-bit field at bits 12:11, and
        `MSTATUS_MPP_S` is `1L << 11` = `0x800`.
      "0xa00001800": |
        That is `MPP` = `11`, machine mode (`MSTATUS_MPP_M`). `mret` would then stay in machine
        mode.
      "0xa00000000": |
        You may have stopped after line 19, which clears `MPP` (already 0). Line 20 then sets
        bit 11.
    why_wrong: "Clear bits 12:11 (`& ~0x1800`), then OR in `MSTATUS_MPP_S` = `1L << 11`."
    explain: |
      `0xa00000000 & ~0x1800 = 0xa00000000`, then `| 0x800 = 0xa00000800`. gdb confirms this
      value at the `mret`; the `0xa00000000` part is `SXL`/`UXL`, saying that S and U mode are
      64-bit ([[tour:46]], [[g:csr:mstatus]]).

  - id: csr-14
    level: 2
    type: number
    q: |
      How many places in the kernel's source write `satp` (count each `w_satp(...)` call and
      each `csrw satp` instruction, not the helper's definition in riscv.h)?
    answer: 4
    wrong:
      2: |
        You may have counted only the trampoline's two switches (lines 92 and 111). Boot writes
        `satp` too: [[kernel:start]] sets it to 0 and [[kvminithart]] installs the kernel page
        table.
      3: |
        You may have missed [[kernel/start.c:28]], `w_satp(0)`, which turns paging off before
        `mret`. It counts as a write even though the value is 0.
      5: |
        You may have counted a write in [[swtch]] or the scheduler. A context switch never
        touches `satp`: every kernel thread uses the same kernel page table.
    why_wrong: "Look in start.c, vm.c and trampoline.S."
    explain: |
      [[kernel/start.c:28]] (0, before `mret`), [[kvminithart]] (the kernel page table, once
      per hart), [[kernel/trampoline.S:92]] (kernel table, on every trap from user mode) and
      [[kernel/trampoline.S:111]] (user table, on every return to user mode)
      ([[concept:mode-stack-page-table#who]]).

  - id: csr-15
    level: 2
    type: multi
    q: |
      Hart 0 executes each of these. Which ones can affect what **hart 1** sees or does?
      Choose all that apply.
    options:
      - text: "[[plicinit]] writing the UART's priority register in the PLIC"
        correct: true
        why: "The PLIC's priority registers are memory-mapped device registers shared by the whole machine; a priority of 0 would stop the device from interrupting any hart."
      - text: "[[kfree]] pushing a page onto `kmem.freelist`"
        correct: true
        why: "The free list is ordinary shared memory; hart 1's next [[kalloc]] may hand out that very page. That is why `kmem.lock` exists."
      - text: "`csrw satp` in [[kvminithart]]"
        why: |
          You may have thought paging is machine-wide. `satp` is per hart; hart 1 keeps its own
          value until it writes its own.
      - text: "`w_stvec` in [[trapinithart]]"
        why: |
          You may have thought the trap vector is global. Each hart has its own `stvec`, which is
          why harts 1 and 2 call `trapinithart` too.
      - text: "`w_stimecmp` in [[clockintr]]"
        why: |
          You may have thought there is one timer for the machine. The `time` counter is shared,
          but each hart has its own `stimecmp`, so each schedules only its own interrupts.
      - text: "`sfence.vma` in [[kvminithart]]"
        why: |
          You may have thought a TLB flush is broadcast. It acts only on the executing hart's
          TLB; hart 1 must run its own.
    explain: |
      CSRs are private: one copy per hart, accessible only by that hart, so writing them needs
      no lock. Memory and memory-mapped devices are shared, and that is where harts can
      affect each other ([[tour:2]], [[tour:3]]).

  - id: csr-16
    level: 2
    type: choice
    q: |
      [[usertrap]] panics on line 43 if the trap did not come from user mode. How does it know
      where the trap came from?
    code: kernel/trap.c:37-47@42-43
    options:
      - text: "It reads `sstatus.SPP`, the previous mode that the hardware recorded when it took the trap: 0 means user, 1 means supervisor."
        correct: true
        why: |
          The hardware writes `SPP` on every trap into S-mode. No CSR reports the *current*
          mode, only the previous one; the current mode is known because this code is running.
      - text: It reads `scause`, whose value says which mode the trap came from.
        why: |
          You may have generalized from `ecall`, whose cause (8, 9 or 11) does depend on the
          mode. For interrupts and most exceptions it does not; `SPP` is the general answer.
      - text: It checks whether `sepc` is a user address (below `MAXVA`).
        why: |
          You may have thought addresses identify modes. Kernel addresses such as `0x80000000`
          are also below `MAXVA`, so this test could not tell them apart; the hardware gives a
          direct answer in `SPP`.
      - text: It reads a CSR that holds the current privilege mode.
        why: |
          You may have expected such a register. RISC-V has none that software can read; gdb's
          `$priv` is a debugger feature.
    explain: |
      The trap's record of where it came from lives in `sstatus.SPP` (and `MPP` for machine
      mode). [[kerneltrap]] makes the mirror-image check on line 144
      ([[g:csr:sstatus]], [[tour:43]]).

  - id: csr-17
    level: 2
    type: order
    q: |
      Put the steps of a return to user mode in order, from [[prepare_return]] to the `sret`.
    items:
      - text: "`intr_off()`: clear `sstatus.SIE`"
        why: Interrupts must be off before stvec points at user-trap code, so this is first.
      - text: "`stvec` = `uservec` in the trampoline"
        why: Line 112, right after interrupts go off.
      - text: "fill the trapframe's `kernel_satp`, `kernel_sp`, `kernel_trap`, `kernel_hartid`"
        why: "Lines 116–119: memory writes for the next trap, after stvec."
      - text: "write `sstatus` with `SPP` = 0 and `SPIE` = 1"
        why: "Lines 125–128 arm sret's mode and interrupt state."
      - text: "`sepc` = `p->trapframe->epc`"
        why: Line 131 is the last line of prepare_return.
      - text: "`csrw satp, a0`: user page table"
        why: "In userret, `satp` switches first because the loads that follow, including `ld sp, 48(a0)`, read the trapframe at `TRAPFRAME`, which only the user page table maps."
      - text: "`ld sp, 48(a0)`: the user's `sp`"
        why: "Line 118 of trampoline.S, after the page table switch and before the other register loads end."
      - text: "`sret`"
        why: The last instruction; it changes the mode and jumps to sepc.
    why_wrong: Read prepare_return from top to bottom, then userret.
    explain: |
      Interrupts off first, then the trap vector, then the values `sret` will consume, then the
      page table and `sp`, and only then the mode change, which is what makes the user stack
      usable. `sret` sets `pc = sepc`, mode
      from `SPP`, and `SIE = SPIE` ([[concept:mode-stack-page-table#t5]], [[tour:43]]).

  - id: csr-18
    level: 2
    type: choice
    q: |
      [[timerinit]] asks for the first timer interrupt 0.1 s after boot. Hart 0 spends about
      1.5 s in [[kernel:main]] building the kernel. When is hart 0's first timer interrupt
      actually taken?
    code: kernel/start.c:54-66@64-65
    options:
      - text: At the scheduler's first `intr_on()` (proc.c line 441); until then it stays pending.
        correct: true
        why: |
          In supervisor mode an interrupt is taken only when `sstatus.SIE` is 1. Nothing sets
          it before [[kernel/proc.c:441]]; every `pop_off` in `main` finds `intena` 0 and leaves
          it off.
      - text: In the middle of `main`, 0.1 s after `timerinit`, because line 33 enabled timer interrupts in `sie`.
        why: |
          You may have treated `sie.STIE` as the only switch. It is the individual enable; the
          global switch `sstatus.SIE` is still 0.
      - text: Never; a timer interrupt that arrives while interrupts are off is lost, and `clockintr` must re-arm it.
        why: |
          You may have thought interrupts are events that can be missed. The timer interrupt is
          a level: it stays pending as long as `time >= stimecmp`, until [[clockintr]] writes a
          new `stimecmp`.
      - text: Immediately, while still in `start`, because machine mode always takes interrupts.
        why: |
          You may have thought machine mode takes every interrupt. A supervisor-level interrupt
          delegated to S-mode is never taken while the hart is in machine mode.
    explain: |
      Pending, individually enabled, and globally enabled: all three are needed. The first two
      are true long before the third, which is why every hart's first tick lands right at the
      scheduler's `intr_on` ([[tour:46]], [[tour:44]]).

  - id: csr-19
    level: 2
    type: choice
    q: |
      For a system call, [[usertrap]] adds 4 to the saved `epc` (line 62). For a page fault
      that [[vmfault]] fixes, it does not. Why the difference?
    code: kernel/trap.c:51-74@62
    options:
      - text: "`sepc` holds the address of the instruction that trapped. After a page fault the program must retry that same load or store; after an `ecall` it must continue with the next instruction, 4 bytes later."
        correct: true
        why: |
          The hardware treats every exception alike: `sepc` points at the faulting instruction so
          that it can be retried. Skipping it is a decision only the kernel can make.
      - text: "For a page fault the hardware has already advanced `sepc`, but for `ecall` it has not."
        why: |
          You may have thought the hardware treats the two differently. For both, `sepc` is the
          address of the instruction that caused the exception.
      - text: The 4 skips the `ret` in the system-call stub, which the kernel performs on the program's behalf.
        why: |
          You may have looked at the stub `li a7, N; ecall; ret`. The kernel does not perform the
          `ret`: `epc + 4` *is* the `ret`, and the program executes it after `sret`.
      - text: Page faults are interrupts, and interrupts never need `epc` adjusted.
        why: |
          You may have mixed up interrupts and exceptions. A page fault is an exception (the top
          bit of `scause` is 0), caused by the instruction itself.
    explain: |
      An `ecall` is 4 bytes (it has no compressed form), so `epc + 4` is the instruction after
      it. A retried load or store after [[vmfault]] maps the page simply works the second time
      ([[tour:43]], [[g:csr:sepc]]).

  - id: csr-20
    level: 3
    type: choice
    q: |
      xv6 has no machine-mode trap handler. [[timerinit]] therefore enables the Sstc extension
      (`menvcfg.STCE`) and uses `stimecmp`. Why couldn't xv6 just use the classic machine
      timer (`mtimecmp`) and rely on `mideleg = 0xffff`?
    code: kernel/start.c:54-66@58-59
    options:
      - text: "The machine timer raises a machine-level interrupt (MTIP), which is taken in machine mode; its mideleg bit does not stick on this machine (gdb reads mideleg = 0x3666). Sstc's stimecmp raises a supervisor-level interrupt (STIP), which is delegated."
        correct: true
        why: |
          With no M-mode handler (`mtvec` is never set), a machine timer interrupt would have
          nowhere to go. Older xv6 versions had a small machine-mode handler that passed each
          tick down; this one avoids machine mode entirely.
      - text: It could; `mideleg = 0xffff` delegates the machine timer too, and Sstc only saves a few instructions.
        why: |
          You may have assumed every bit of `mideleg` is writable. Machine-level interrupt bits
          (3, 7, 11) read back 0 on QEMU, so the machine timer interrupt always goes to machine
          mode.
      - text: Without Sstc, supervisor mode cannot read the `time` CSR.
        why: |
          You may be thinking of `mcounteren` (line 62), which grants supervisor access to
          `time`. That is a separate permission from having a supervisor timer comparator.
      - text: "`mtimecmp` does not exist on QEMU's virt machine."
        why: |
          It does: the CLINT at `0x02000000` provides it ([[kernel/memlayout.h:29]]). The issue
          is which mode its interrupt goes to, not whether it exists.
    explain: |
      An interrupt's level decides which mode can handle it. Sstc gives S-mode its own
      comparator whose interrupt is delegable, so every tick goes straight to [[kernelvec]] or
      [[uservec]] ([[g:sstc]], [[tour:46]]).

  - id: csr-21
    level: 3
    type: choice
    q: |
      In a scratch copy of xv6, line 62 (`w_mcounteren(r_mcounteren() | 2)`) is deleted. The
      kernel finishes `main` on hart 0 and enters the scheduler. What happens next?
    code: kernel/start.c:54-66@61-62
    options:
      - text: "At the first `intr_on()`, the pending timer interrupt reaches [[clockintr]], whose read of `time` is an illegal instruction in supervisor mode: `kerneltrap` prints `scause=0x2` and panics."
        correct: true
        why: |
          `mcounteren.TM` (bit 1) is what lets supervisor mode read `time` (and, with Sstc,
          access `stimecmp`). Without it, `rdtime` in [[kernel/trap.c:179]] raises cause 2, and
          [[kerneltrap]] panics on an exception. This is what the experiment in [[tour:46]]
          showed.
      - text: No timer interrupt is ever raised, so the kernel runs without preemption.
        why: |
          You may have thought `mcounteren` enables the timer. The interrupt is still raised
          when `time` reaches `stimecmp` (set in machine mode by [[timerinit]]); the failure is
          in the handler.
      - text: Nothing changes; `time` is a user-readable counter that any mode can read.
        why: |
          You may have thought counters are always readable. Access to `time` from S-mode is
          controlled by machine mode through `mcounteren`.
      - text: "`timerinit` itself traps on `r_time()` and the boot hangs in machine mode."
        why: |
          `timerinit` runs in machine mode, which can always read `time`. The permission only
          matters once the hart is in supervisor mode.
    explain: |
      Machine-mode CSRs such as `mcounteren` and `menvcfg` grant permissions that supervisor
      mode cannot see or change. Forgetting one shows up much later, far from the cause, as an
      illegal-instruction trap in ordinary kernel code ([[g:csr:mcounteren]], [[tour:46]]).

  - id: csr-22
    level: 3
    type: choice
    q: |
      xv6's PTEs never set the A (accessed) and D (dirty) bits. Line 41 sets `menvcfg.ADUE`
      (QEMU happens to set it already at reset). On a machine where it starts at 0, what would
      happen if line 41 were missing?
    code: kernel/start.c:40-41
    options:
      - text: "Right after [[kvminithart]] turns on paging, the next instruction fetch raises a page fault (A = 0), and since `stvec` is not set yet the hart traps to address 0 and keeps faulting, with no message."
        correct: true
        why: |
          With `menvcfg.ADUE` = 0 the hart behaves as Svade: it faults on any access through a
          PTE with A = 0 (and on a store with D = 0), leaving it to software to set the bits. xv6 has no code
          for that. A scratch-copy experiment showed exactly this: `scause = 0xc`, `pc = 0`.
      - text: Nothing; A and D are only hints that xv6 ignores.
        why: |
          You may have thought the hardware simply leaves them clear. Without `ADUE`, it does not
          proceed with A = 0: it raises a page fault so that software can set the bit.
      - text: Only user programs would fault, on their first access to each page; the kernel would boot normally.
        why: |
          You may have thought only user pages are affected. Every kernel PTE also has A = 0, so
          the very first fetch after paging is turned on faults.
      - text: The kernel would panic with `kerneltrap` and print scause.
        why: |
          That needs `stvec` = [[kernelvec]], set by [[trapinithart]] on line 24 of `main`, three
          lines *after* paging goes on. At the moment of the fault `stvec` is still its reset value.
    explain: |
      Svadu (`menvcfg.ADUE`) makes the hardware set A and D itself. `menvcfg` is a machine CSR,
      so [[kernel:start]] must set it before `mret`; supervisor mode could never fix it later
      ([[g:svadu]], [[tour:46]]).

  - id: csr-23
    level: 3
    type: tf
    q: |
      True or false: if [[prepare_return]] left `sstatus.SPIE` at 0 (so that `sret` sets
      `SIE` to 0), a user program spinning in an infinite loop could never be preempted by the
      timer.
    code: kernel/trap.c:124-128@127
    answer: false
    why_tf: |
      You may have thought `SIE` controls interrupts in every mode. It is the global enable for
      supervisor mode only.
    reasons:
      - text: "While the hart runs in user mode, supervisor-level interrupts that are enabled in `sie` are taken whatever `sstatus.SIE` says; `SIE` only gates interrupts while the hart is in supervisor mode."
        correct: true
        why: |
          The privileged spec says interrupts for a more privileged mode are always globally
          enabled while running in a less privileged one. A kernel built with `SPIE` cleared here
          still passed `usertests preempt` ([[tour:43]]).
      - text: The timer interrupt goes to machine mode, which re-enables SIE before passing it on.
        why: |
          You may be remembering older xv6 versions with a machine-mode timer handler. This one
          uses Sstc, and machine mode is never entered after boot.
      - text: "`usertrap` calls `intr_on()` on every trap, so `SIE` comes back anyway."
        why: |
          `intr_on()` on line 66 runs only for system calls, and only *after* the trap has
          already been taken; it cannot be what lets a spinning program be interrupted.
    explain: |
      Global interrupt enables work per mode: in U-mode, S-level interrupts are always
      globally enabled, and only `sie` decides which ones. `SPIE = 1` matters for what `SIE`
      will be the next time the hart is in S-mode ([[concept:mode-stack-page-table#t5]]).

  - id: csr-24
    level: 3
    type: choice
    q: |
      A trap from user mode always sets `sstatus.SPP` to 0. Yet [[prepare_return]] clears
      `SPP` explicitly on line 126 before every return to user mode. Why is that necessary?
    code: kernel/trap.c:121-131@124-128
    options:
      - text: "`sstatus` belongs to the hart, not the process. Since this process's trap, the hart may have run other threads, one of which yielded from inside a kernel trap (leaving `SPP` = 1); and a new process in `forkret` never trapped from user mode at all."
        correct: true
        why: |
          A trap taken in the kernel sets `SPP` = 1. If that thread yields from inside
          [[kerneltrap]], the bit stays 1 on the hart while another thread runs. Without line
          126, that thread's `sret` would enter supervisor mode at a user address.
      - text: "Because `intr_on()` in usertrap sets `SPP` back to 1."
        why: |
          You may have thought `SIE` and `SPP` are linked. `intr_on()` sets only bit 1 (`SIE`);
          `SPP` is bit 8.
      - text: Because `sret` ignores `SPP` unless it was written by software since the last trap.
        why: |
          You may have imagined a "valid" flag. `sret` always uses whatever `SPP` holds at that
          moment.
      - text: It is not necessary; the line is only documentation of the intended value.
        why: |
          You may have reasoned only about the simple path: trap from user, return to user, no
          other thread in between. Any context switch in the middle breaks that assumption.
    explain: |
      Every CSR value that a process needs must be either saved per process (like `epc` in the
      trapframe) or recomputed before use (like `SPP`, `SPIE`, `sepc` and `stvec` in
      [[prepare_return]]). [[kerneltrap]] does the same by restoring its saved `sstatus`
      ([[tour:43]], [[tour:44]]).

  - id: csr-25
    level: 3
    type: multi
    q: |
      A kernel thread is preempted by a timer interrupt (it calls [[yield]] from
      [[kerneltrap]]) and is later resumed by a scheduler, possibly on another hart. When it
      runs again, which of these may hold a different value from the moment before it yielded?
      Choose all that apply.
    options:
      - text: "`sepc`"
        correct: true
        why: "Every trap on the hart in between overwrites it. That is why [[kerneltrap]] saved it in a local variable and writes it back on line 162."
      - text: "`scause`"
        correct: true
        why: "Same reason: it describes the most recent trap on whatever hart the thread is on now. `kerneltrap` reads it at the start and never relies on it afterwards."
      - text: "`tp`"
        correct: true
        why: "`tp` holds the ID of the hart the thread is running on. If it resumed on another hart, `tp` is that hart's ID; [[kernelvec]] deliberately does not restore it."
      - text: "`satp`"
        why: |
          You may have thought each thread has its own page table in the kernel. Every hart
          running kernel code uses the same kernel page table, so `satp` is the same wherever the
          thread resumes.
      - text: "`stvec`"
        why: |
          You may have thought a previous user-mode process leaves `uservec` behind. Any hart
          running kernel code outside the return path has `stvec` = [[kernelvec]]: [[usertrap]]
          sets it at once, and a hart's scheduler never runs between `prepare_return` and `sret`.
      - text: "`p->trapframe->epc`"
        why: |
          You may have grouped it with `sepc`. The trapframe is per-process memory, untouched by
          other threads' traps; that is exactly why [[usertrap]] copies `sepc` into it.
    explain: |
      CSRs and `tp` describe the *hart*; memory such as the trapframe and the kernel stack
      describes the *thread*. Anything a thread needs across a possible switch must live in
      memory, or be recomputed afterwards ([[tour:44]], [[concept:stacks#same]]).
