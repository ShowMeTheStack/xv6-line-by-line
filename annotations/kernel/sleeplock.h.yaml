summary: |
  The definition of the [[g:sleeplock]], xv6's lock for long waits. A process that finds a
  sleep lock taken gives up the CPU instead of spinning, so the lock can be held across slow
  operations such as reading a disk block. xv6 uses sleep locks for disk buffers
  ([[kernel/buf.h]]), in-memory inodes ([[kernel/file.h]]) and the UART's transmit side
  ([[kernel/uart.c]]).

  **Read before:** [[kernel/spinlock.h]]. **Read next:** [[kernel/sleeplock.c]].

blocks:
  - lines: 1-9
    title: A held flag, guarded by a spinlock
    note: |
      `locked` plays the same role as in a [[g:spinlock]], but it is an ordinary variable,
      not changed with atomic instructions. Instead, every read and write of `locked` (and
      `pid`) happens while holding the small spinlock `lk`. That spinlock is held only for
      a few instructions at a time, inside [[acquiresleep]], [[releasesleep]] and
      [[holdingsleep]]; the sleep lock itself can be held for as long as the holder likes,
      including while it sleeps.

      `name` and `pid` are for debugging, like `name` and `cpu` in a spinlock. Recording the
      holder by [[g:pid]] rather than by CPU makes sense here: a process that holds a sleep
      lock may sleep and later continue on a different CPU, but it stays the same process.

lines:
  3: |
    1 while some process holds the lock. Protected by `lk`.
  4: |
    The [[g:spinlock]] that makes checking and setting `locked` one atomic step. (Waiters
    use the address of the whole `struct sleeplock` as their
    [[g:sleep-wakeup|wait channel]].)
  7: |
    The lock's name, for debugging.
  8: |
    PID of the holding process, or 0. [[holdingsleep]] compares it with the caller's PID.
