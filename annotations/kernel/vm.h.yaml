summary: |
  Two constants that select how the `sbrk` system call grows a process's memory. They are
  shared by both sides of the system call: the user library ([[user/ulib.c]]) passes one
  of them as the second argument of the `sbrk` system call, and the kernel's [[sys_sbrk]]
  ([[kernel/sysproc.c]]) checks which one it received.

  - **Eager** growth allocates and maps the new pages right away ([[growproc]] →
    [[uvmalloc]]).
  - **Lazy** growth only raises the process's size `p->sz`. Each new page is allocated
    the first time the program touches it, when the resulting [[g:page-fault]] reaches
    [[vmfault]] in [[kernel/vm.c]].

  **Read next:** [[vmfault]].

blocks:
  - lines: 1-2
    title: Eager or lazy sbrk
    note: |
      [[user:sbrk]] passes [[SBRK_EAGER]] and [[user:sbrklazy]] passes [[SBRK_LAZY]]. In
      [[sys_sbrk]] only `SBRK_EAGER` is tested: any other value means lazy, except that
      shrinking (a negative size) is always done eagerly, freeing the pages at once.
