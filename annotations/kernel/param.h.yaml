summary: |
  The kernel's fixed limits. xv6 allocates almost all of its tables (processes, open
  files, inodes, disk buffers) as fixed-size arrays at compile time instead of growing
  them at run time, and these constants set their sizes. Changing one means recompiling
  the kernel, and for [[FSSIZE]] and [[LOGBLOCKS]] also rebuilding the disk image with
  `mkfs`, which includes this file too.

  Each line is a `#define`: the [[g:preprocessor]] replaces the name with its value
  wherever it appears. The parentheses around the computed values keep them correct
  inside larger expressions.

blocks:
  - lines: 1-14
    title: Compile-time limits
    note: |
      Most of these are maximums: exceeding one makes the operation fail (for example
      `fork` fails when all [[NPROC]] process slots are in use) rather than allocating
      more. The line notes say where each one is used.

lines:
  1: |
    Size of the process table [[proc]] in [[kernel/proc.c]]. It also fixes how many kernel
    stacks [[proc_mapstacks]] maps at boot: one per slot, 64.
  2: |
    The most harts xv6 supports: it sizes the per-CPU array [[cpus]] and the boot stacks
    [[stack0]]. QEMU starts `CPUS` harts (3 by default, see the Makefile), which must not
    exceed this.
  3: |
    Size of each process's file-descriptor array (`ofile` in `struct proc`, [[kernel/proc.h]]), so a process
    can have at most 16 files open at once.
  4: |
    Size of the system-wide table of open files ([[ftable]] in [[kernel/file.c]]), shared
    by all processes.
  5: |
    Size of the in-memory inode table ([[itable]] in [[kernel/fs.c]]): at most 50 files can
    be in use at once.
  6: |
    Size of the device-switch table [[devsw]]: device files may have major numbers 0–9.
  7: |
    The device number of the disk holding the root file system, passed to [[fsinit]] and
    used to look up `/` ([[kernel/fs.c:697]]).
  8: |
    The most arguments `exec` accepts, including the terminating null pointer; it sizes
    the `argv` arrays in [[sys_exec]] and [[kexec]].
  9: |
    An upper bound on the number of blocks one file-system operation (one system call) may
    write. The log reserves this much space for each operation in progress
    ([[begin_op]]), and [[filewrite]] splits large writes so that each piece stays under
    it.
  10: |
    Room in the on-disk log for three operations' worth of blocks (30). `mkfs` uses it to
    lay out the log area on disk; [[kernel/log.c]] uses it as the log's capacity.
  11: |
    Number of buffers in the disk block cache ([[bcache]] in [[kernel/bio.c]]), also 30.
  12: |
    Total size of the file system, in blocks (2000 blocks of 1024 bytes). Only `mkfs`
    uses it, to create `fs.img`; the kernel reads the size from the superblock instead.
  13: |
    The longest path name the kernel accepts from a user program; it sizes the kernel
    buffers that [[argstr]] copies paths into.
  14: |
    Number of pages of user stack that [[kexec]] allocates for a new program: one page
    (4096 bytes), with a [[g:guard-page]] below it. The stack does not grow.
