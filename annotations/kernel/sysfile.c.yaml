    The removed directory's `..` no longer refers to `dp`.
  244: |
    One name fewer. If it reaches 0, the inode will be freed once no one holds a reference.
  246: |
    Unlock and drop this call's reference; frees the inode if this was the last reference
    and `nlink` is 0.
  264: |
    Find the directory that will hold the new name; `name` receives the last element.
  280: |
    Is the name already taken? [[dirlookup]] returns its inode referenced, not locked.
  283: |
    Only `open` asks for `T_FILE`, and it accepts an existing file or device.
  289: |
    Allocate a free inode on the same device as the parent.
  302: |
    `.` names the new directory itself, `..` names the parent. Both entries are written into
    the new directory's first data block.
  306: |
    Add the new name to the parent. Fails if the name appeared meanwhile (it cannot, as
    `dp` has been locked since the lookup) or the disk is full.
  311: |
    The child's `..` is a new link to the parent.
  338: |
    Copy the path into the kernel. `argstr` returns its length, or -1.
  343: |
    `O_CREATE` is bit 9 (`0x200`).
  355: |
    A directory may be opened, but only read-only.
  362: |
