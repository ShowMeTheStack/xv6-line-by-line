summary: |
  One header that declares (almost) every kernel function that is called from a file other
  than the one defining it. Nearly every kernel `.c` file includes it, so any kernel code
  can call, say, [[kalloc]] or [[acquire]] without including a header per subsystem.

  It is organized as one section per source file, each headed by a comment naming the file,
  which makes it a handy index of the kernel: to find where a function lives, find its
  section here. The sections are in rough alphabetical order, with `plic.c` and
  `virtio_disk.c` added at the end.

  `defs.h` has no include guard and includes nothing itself. It uses types defined
  elsewhere (`uint` and `uint64` from [[kernel/types.h]], `pagetable_t` and `pte_t` from
  [[kernel/riscv.h]]), so every file includes those headers *before* `defs.h`.

  Not everything is here. Functions used only inside their own file are usually `static`
  and absent; the `sys_*` handlers are declared in [[kernel/syscall.c]], their only user;
  and a few cross-file names are declared where they are used (for example [[forkret]]
  refers to `userret` with its own `extern`).

  **Read alongside:** any kernel `.c` file.

blocks:
  - lines: 1-11
    title: Struct names used in the prototypes
    note: |
      These lines declare struct *tags* without their contents (incomplete types). That is
      all a prototype needs to mention a pointer such as `struct buf*`: the compiler does
      not need to know a struct's size or fields to pass a pointer to it. Each full
      definition lives in its own header ([[kernel/buf.h]], [[kernel/proc.h]],
      [[kernel/file.h]], ...), which only the files that look inside the struct include.
      Without these lines, a tag first seen inside a prototype's parameter list would be
      a different, local type in each prototype, and calls would not type-check.

      `struct cpu` is not in the list but is used on line 92. That one is safe because it
      appears in a return type at file scope, which declares the tag for the whole file.

      Line 1, `// clang-format off`, tells the code formatter not to re-flow the aligned
      columns below. There is no matching `clang-format on`; it stays off to the end of
      the file.

  - lines: 13-19
    title: "bio.c: the buffer cache"
    note: |
      [[kernel/bio.c]] keeps in-memory copies of disk blocks, the [[g:buffer-cache]].
      [[bread]] returns a locked buffer holding a block's contents, [[bwrite]] writes it to
      disk, and [[brelse]] releases it. [[bpin]] and [[bunpin]] keep a buffer in the cache
      while the log needs it. [[binit]] runs once at boot.

  - lines: 21-24
    title: "console.c: the console device"
    note: |
      [[kernel/console.c]] turns the UART into the [[g:console]]: [[consoleintr]] receives
      each typed character from [[uartintr]] and does [[g:line-editing]]; [[consputc]]
      outputs one character for [[printk]]. [[consoleinit]] is called from [[main]].

  - lines: 26-27
    title: "exec.c: load a program"
    note: |
      [[kexec]] replaces the current process's memory with a program loaded from a file
      ([[g:exec]]). The kernel versions carry a `k` prefix ([[kexec]], [[kexit]],
      [[kfork]], [[kwait]], [[kkill]]), which keeps them apart from the user-level
      functions of the same name.

  - lines: 29-36
    title: "file.c: open files"
    note: |
      [[kernel/file.c]] manages the table of [[g:open-file|open files]], the objects that
      [[g:file-descriptor|file descriptors]] refer to. [[filealloc]], [[filedup]] and
      [[fileclose]] manage their [[g:reference-count|reference counts]];
      [[fileread]], [[filewrite]] and [[filestat]] dispatch to pipes, devices or inodes.
      Their `uint64` arguments are user addresses, as passed to the system call.

  - lines: 38-57
    title: "fs.c: inodes and directories"
    note: |
      [[kernel/fs.c]] is the file system proper: [[g:inode|inodes]] ([[ialloc]],
      [[ilock]], [[iput]], [[readi]], [[writei]]...), [[g:directory|directories]]
      ([[dirlookup]], [[dirlink]]) and [[g:path-name]] lookup ([[namei]],
      [[nameiparent]]). [[fsinit]] reads the superblock and recovers the log; it is
      called by the first process ([[forkret]]), not by `main`, because it may sleep.

  - lines: 59-62
    title: "kalloc.c: physical pages"
    note: |
      [[kernel/kalloc.c]] is the [[g:page-allocator]]: [[kalloc]] returns one free
      4096-byte page of physical memory (or 0), and [[kfree]] gives one back. [[kinit]]
      fills the free list at boot.

  - lines: 64-68
    title: "log.c: crash-safe transactions"
    note: |
      [[kernel/log.c]] implements the [[g:write-ahead-log]]. File system code brackets each
      operation with [[begin_op]] and [[end_op]], and writes modified blocks with
      [[log_write]] instead of [[bwrite]], so that an operation either happens completely
      or not at all, even if the machine crashes. [[initlog]] runs from [[fsinit]].

  - lines: 70-74
    title: "pipe.c: pipes"
    note: |
      [[kernel/pipe.c]] implements [[g:pipe|pipes]]: [[pipealloc]] creates a pipe and the
      two open files for its ends; [[piperead]] and [[pipewrite]] move data, sleeping
      when the pipe is empty or full.

  - lines: 76-79
    title: "printk.c: kernel printing"
    note: |
      [[printk]] is the kernel's `printf`, writing to the console; [[panic]] prints a
      message and stops the kernel; [[printkinit]] sets up the lock that keeps lines from
      different harts apart. Both prototypes carry an [[g:attribute|__attribute__]]; see
      the line notes.

  - lines: 81-105
    title: "proc.c: processes and scheduling"
    note: |
      [[kernel/proc.c]] owns the process table. The groups:

      - identity: [[cpuid]], [[mycpu]], [[myproc]];
      - the process life cycle behind system calls: [[kfork]], [[kexit]], [[kwait]],
        [[kkill]], [[killed]], [[setkilled]], [[growproc]];
      - page tables for a process: [[proc_pagetable]], [[proc_freepagetable]], and
        [[proc_mapstacks]] for the kernel stacks;
      - scheduling: [[scheduler]], [[sched]], [[yield]], and the
        [[g:sleep-wakeup]] functions [[sleep_prepare]], [[sleep]] and [[wakeup]];
      - boot: [[procinit]] and [[userinit]];
      - helpers for code that may copy to either user or kernel memory
        ([[either_copyout]], [[either_copyin]]), and [[procdump]] for debugging (Ctrl-P).

      Note the split sleep: in this version a sleeper calls `sleep_prepare(chan)` while
      holding its own lock, releases that lock, and then calls `sleep()`, as in
      [[sys_pause]]. Older xv6 versions had a single `sleep(chan, lock)`.

  - lines: 107-108
    title: "swtch.S: the context switch"
    note: |
      [[swtch]] saves the current kernel thread's callee-saved registers into one
      `struct context` and loads another, switching between a process's kernel thread
      and the scheduler ([[g:context-switch]]). It is written in assembly in
      [[kernel/swtch.S]]; this prototype lets C code call it.

  - lines: 110-116
    title: "spinlock.c: spinlocks"
    note: |
      [[g:spinlock|Spinlocks]]: [[acquire]] waits in a loop until the lock is free,
      [[release]] frees it, [[holding]] checks whether this CPU holds it.
      [[push_off]] and [[pop_off]] disable and re-enable interrupts in a nested way;
      `acquire` and `release` use them so that an interrupt handler on the same CPU can
      never wait for a lock its own CPU holds.

  - lines: 118-122
    title: "sleeplock.c: sleep locks"
    note: |
      [[g:sleeplock|Sleep locks]] can be held for a long time, such as across a disk read,
      because a process waiting for one sleeps instead of spinning. Used for inodes and
      buffers.

  - lines: 124-131
    title: "string.c: memory and string helpers"
    note: |
      The kernel has no C library, so [[kernel/string.c]] supplies the few functions it
      needs. [[safestrcpy]] is xv6's own: unlike [[strncpy]], it always NUL-terminates
      the destination. The size parameters are `uint` or `int` rather than the standard
      `size_t`.

  - lines: 133-139
    title: "syscall.c: argument fetching and dispatch"
    note: |
      The helpers that read [[g:syscall-arguments]] ([[argint]], [[argaddr]],
      [[argstr]]) and copy from user addresses ([[fetchaddr]], [[fetchstr]]), used by
      the `sys_*` functions in [[kernel/sysproc.c]] and [[kernel/sysfile.c]]; and
      [[syscall]] itself, called by [[usertrap]]. Note that [[argint]] and [[argaddr]]
      return `void`: they cannot fail.

  - lines: 141-146
    title: "trap.c: the clock and trap setup"
    note: |
      Two variables and three functions. [[ticks]] and [[tickslock]] are shared with
      [[kernel/sysproc.c]] ([[sys_pause]], [[sys_uptime]]). [[trapinit]] and
      [[trapinithart]] are called from [[main]]; [[prepare_return]] is called from
      [[forkret]] in [[kernel/proc.c]] as well as from [[usertrap]].

      [[usertrap]], [[kerneltrap]] and [[devintr]] are not declared here: they are only
      called from assembly or from `trap.c` itself.

  - lines: 148-152
    title: "uart.c: the serial port"
    note: |
      The [[g:uart]] driver in [[kernel/uart.c]]: [[uartinit]] configures the chip,
      [[uartintr]] handles its interrupts (called from [[devintr]]), [[uartwrite]] sends a
      buffer of characters (sleeping while the UART is busy), and [[uartputc_sync]] sends
      one character by busy-waiting, which works even with interrupts off; [[consputc]]
      uses it, so [[printk]] and [[panic]] can always print.

  - lines: 154-172
    title: "vm.c: page tables"
    note: |
      [[kernel/vm.c]] manages [[g:page-table|page tables]]:

      - the kernel's: [[kvminit]], [[kvminithart]], [[kvmmap]];
      - building and walking any page table: [[mappages]], [[walk]], [[walkaddr]],
        [[ismapped]];
      - a process's user memory: [[uvmcreate]], [[uvmalloc]], [[uvmdealloc]],
        [[uvmcopy]] (for `fork`), [[uvmfree]], [[uvmunmap]], [[uvmclear]] (for the stack
        guard page);
      - copying between kernel and user memory: [[copyout]], [[copyin]],
        [[copyinstr]];
      - [[vmfault]], which maps a lazily allocated page on first use.

      In this version the copy functions take an extra `uint64` after the page table: the
      process size `p->sz`, which they pass to `vmfault` so it can tell valid lazy
      addresses from bad ones.

  - lines: 174-178
    title: "plic.c: the interrupt controller"
    note: |
      The [[g:plic|PLIC]] driver in [[kernel/plic.c]]: [[plicinit]] and [[plicinithart]]
      at boot, [[plic_claim]] and [[plic_complete]] around each device interrupt in
      [[devintr]].

  - lines: 180-183
    title: "virtio_disk.c: the disk"
    note: |
      The [[g:virtio]] disk driver in [[kernel/virtio_disk.c]]: [[virtio_disk_init]] at
      boot, [[virtio_disk_rw]] to read or write one buffer (called by the buffer cache;
      it sleeps until the disk finishes), and [[virtio_disk_intr]], called from
      [[devintr]] when the disk signals completion.

  - lines: 185-186
    title: Number of elements in an array
    note: |
      [[NELEM]] gives the number of elements of an array: its total size in bytes divided
      by the size of one element. It is evaluated at compile time. It only works on a real
      array, not on a pointer: for a pointer, `sizeof(x)` is 8, the size of the pointer.
      [[syscall]] uses it to bounds-check the system call number, and [[sys_exec]] to
      bound the `argv` array.

lines:
  1: |
    Disable automatic formatting for the rest of this file, to keep the columns aligned.
  44: |
    `iinit()` with empty parentheses is an [[g:old-style-decl|old-style declaration]]
    (it does not say "no parameters"); [[iinit]] in fact takes none.
  77: |
    `format(printf, 1, 2)` tells GCC that argument 1 is a `printf`-style
    [[g:format-string]] and the values start at argument 2, so the compiler checks every
    [[printk]] call's arguments against its format, like it does for `printf`. The `...`
    makes it a [[g:variadic-function]].
  78: |
    `noreturn` promises that [[panic]] never returns. The compiler can then omit code
    after a call to it, and does not warn about a missing return value in a function that
    ends with `panic`.
  93: |
    Another old-style declaration with `()`; [[myproc]] takes no arguments.
  95: |
    [[scheduler]] never returns either; every hart enters it at the end of [[main]].
  103-104: |
    The `user_dst`/`user_src` flag says whether the other address is a user virtual
    address (copy through the process's page table) or a kernel address (plain
    `memmove`). Used by code that serves both kinds of caller: the console
    ([[kernel/console.c]]) and [[readi]]/[[writei]] in [[kernel/fs.c]].
  139: |
    `syscall()`: old-style empty parentheses again.
  142: |
    `extern` declares the variable without defining it; the definition, `uint ticks;`,
    is in [[kernel/trap.c:10]].
  145: |
    Likewise for [[tickslock]], defined at [[kernel/trap.c:9]].
  146: |
    Declared here because [[forkret]] in [[kernel/proc.c]] calls it.
  166: |
    [[walk]] returns a pointer to the [[g:pte]] for a virtual address, allocating
    page-table pages if the last argument is non-zero.
  186: |
    The outer parentheses and the ones around `x` keep the macro correct when its
    argument or its use is part of a larger expression.
