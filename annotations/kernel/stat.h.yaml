summary: |
  The file metadata that user programs can ask for, shared by the kernel and user programs
  (many files in `user/` include it as `kernel/stat.h`). It defines the three inode type
  codes and `struct` [[stat]], which the `fstat` system call fills in through [[filestat]]
  and [[stati]].

  User programs such as [[user/ls.c]] use it to tell files from directories and to print
  sizes and [[g:inode-number|inode numbers]]; the user-library function [[user:stat]]
  opens a path and calls `fstat`. [[mkfs/mkfs.c]] includes it too, renaming the structure
  to avoid a clash with the host system's own `struct stat`.

  **Read next:** [[kernel/fs.c]] ([[stati]]), [[kernel/file.c]] ([[filestat]]).

blocks:
  - lines: 1-3
    title: Inode types
    note: |
      The values stored in an inode's `type` field, on disk and in memory. A
      [[g:directory]] holds name entries, a file holds bytes, and a device inode has no
      content at all: its `major` number picks a driver through [[devsw]].

      The value 0, which has no name here, means "free inode": [[ialloc]] looks for it and
      [[ifree]] writes it.

  - lines: 5-11
    title: "struct stat: what fstat reports"
    note: |
      Filled from the inode by [[stati]]:

      - `dev`: the device number of the disk holding the file (always [[ROOTDEV]], 1, in
        xv6).
      - `ino`: the [[g:inode-number]]. Two names with the same `dev` and `ino` are links to
        the same file.
      - `type`: one of the three codes above.
      - `nlink`: the [[g:link-count]].
      - `size`: the size in bytes, `uint64` here although the inode stores it as a 32-bit
        `uint`.

      This is a much smaller structure than the `struct stat` of Unix systems: there are
      no permissions, owners or timestamps, because xv6 inodes do not have them.

lines:
  1: |
    A directory.
  2: |
    An ordinary file.
  3: |
    A device file, such as `console`.
