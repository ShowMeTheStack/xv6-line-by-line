# Every instruction that moves sp to a different stack (see annotations/STACKS.md),
# plus the places where the stack's role changes without sp moving (main.c:44, the
# kernelvec push, and the trampoline lines where sp stops or starts being usable:
# 22 user->none, 92 none->kernel, 111 kernel->none, 153 sret none->user).
# The concept page annotations/concepts/01-stacks.md explains each one.
# Shown as a gutter marker and a box in the notes panel of the source view.
- file: kernel/entry.S
  line: 17
  from: ""
  to: boot
  note: >
    Each hart's first stack: `sp = stack0 + (hartid + 1) * 4096`, the top of this hart's
    4 KiB slice of [[stack0]] (`0x80008890`, `0x80009890` and `0x8000a890` for harts 0, 1
    and 2 in this build). Line 12 put `stack0`'s base in `sp` as a first step; only after this
    line does `sp` point at the top of a usable slice. All three harts run it at
    about the same time, each computing a different slice. The same memory later becomes this
    hart's scheduler stack. It has no guard page.
- file: kernel/main.c
  line: 44
  from: boot
  to: scheduler
  note: >
    `sp` does not move here: [[scheduler]] never returns, so the boot stack *becomes* this
    hart's scheduler stack, with the frames of `start` and `main` left at its top for good.
    From now on, [[swtch]] saves a pointer into it in `cpu->context.sp` (`0x80008810` on
    hart 0) every time the hart switches to a process.
- file: kernel/trampoline.S
  line: 22
  from: user
  to: none
  note: >
    Not a switch, a change of role: a trap from user mode arrives here in supervisor mode
    without touching `sp` or `satp`. `sp` still holds the user program's value, which the
    kernel must not use as a stack, so `uservec` uses none: it saves the user registers into
    the trapframe. Line 76 loads the kernel stack's address, but the stack becomes usable
    only at line 92.
- file: kernel/trampoline.S
  line: 76
  from: none
  to: none
  note: >
    `uservec` replaces the user's `sp` (saved in the trapframe on line 41) with
    `p->trapframe->kernel_sp`, the top of this process's kernel stack. The kernel stack is
    always empty at this point, because [[prepare_return]] always sets `kernel_sp` to
    `p->kstack + PGSIZE`. The address is loaded but not usable yet: the user page table does
    not map kernel stacks, so nothing is pushed until `csrw satp` on line 92.
- file: kernel/trampoline.S
  line: 92
  from: none
  to: kernel
  note: >
    `csrw satp` installs the kernel page table, so the kernel-stack address loaded on line 76
    now works; from here C code can run, starting with [[usertrap]] on line 98.
- file: kernel/trampoline.S
  line: 111
  from: kernel
  to: none
  note: >
    `sp` does not move, but the page table under it does: after this `csrw satp` the user page
    table is installed, and it does not map kernel stacks. From here to line 118 `sp` holds an
    address the hart cannot use, and the code uses no stack.
- file: kernel/trampoline.S
  line: 118
  from: none
  to: none
  note: >
    `userret` restores the user's `sp` from the trapframe (after an `exec`, the new program's
    `sp`, which [[kexec]] stored there). `sp` now holds the user's stack pointer, but the hart
    is still in supervisor mode, which cannot use user pages, so the code still uses no stack
    and nothing is pushed. The user stack becomes usable only after `sret` on line 153, just as
    the kernel-stack address loaded on line 76 becomes usable only at line 92. The kernel stack
    it leaves holds nothing that will be used again.
- file: kernel/trampoline.S
  line: 153
  from: none
  to: user
  note: >
    Not a switch, a change of role, the mirror of line 22: `sret` drops the hart to user mode
    and jumps to the user PC without touching `sp`. The user's stack pointer, loaded on line
    118, becomes a usable stack again, because user-mode code can access the user pages it
    points into.
- file: kernel/swtch.S
  line: 26
  from: kernel
  to: scheduler
  note: >
    The heart of a context switch: `sp` is loaded from the context being switched to. From a
    process ([[sched]]) this lands on the hart's scheduler stack; from [[scheduler]] it lands on
    the chosen process's kernel stack (at its top, for a process that has never run). xv6 never
    switches directly from one process's kernel stack to another's. The stack being left keeps
    its frames; line 11 saved where they end.
- file: kernel/kernelvec.S
  line: 14
  from: ""
  to: same
  note: >
    Not a switch: a trap taken in supervisor mode pushes a 256-byte register frame onto
    **whatever stack is current**, a process's kernel stack or the hart's scheduler stack.
    xv6 has no separate interrupt stack. If the handler yields, the frame stays in the middle
    of the process's kernel stack until the process is resumed, possibly on another hart.
