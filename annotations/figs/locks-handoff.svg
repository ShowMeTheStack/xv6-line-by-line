<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="lkho-t lkho-d">
<title id="lkho-t">p-&gt;lock handed across swtch</title>
<desc id="lkho-d">Two columns on one hart: the scheduler thread and process P&#x27;s kernel thread, with time going down. The scheduler acquires p-&gt;lock and calls swtch while holding it; P releases it. Later P acquires its own p-&gt;lock, changes its state and calls sched and swtch while holding it; the scheduler releases it. noff is 1 at both switches.</desc>
<style>

.lkho-cur { animation: lkho-move 21s steps(7, end) infinite; }
@keyframes lkho-move { from { transform: translateY(0px); } to { transform: translateY(392px); } }
@media (prefers-reduced-motion: reduce) { .lkho-anim { animation: none; display: none; } }

</style>
<defs><marker id="lkho-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/></marker></defs>
<text x="240.0" y="30" font-size="14" text-anchor="middle" fill="var(--st-s0)" font-weight="700">hart 1&#x27;s scheduler thread</text>
<text x="240.0" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)">on hart 1&#x27;s scheduler stack</text>
<text x="720.0" y="30" font-size="14" text-anchor="middle" fill="var(--st-kernel)" font-weight="700">process P&#x27;s kernel thread</text>
<text x="720.0" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)">on P&#x27;s kernel stack</text>
<g class="lkho-cur lkho-anim"><rect x="24" y="66" width="912" height="56" rx="8" fill="var(--accent)" stroke="none" stroke-width="1.5" fill-opacity=".10"/></g>
<rect x="40" y="70" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="52" y="89" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire(&amp;p-&gt;lock)</text>
<text x="52" y="107" font-size="12" text-anchor="start" fill="var(--fg-2)">proc.c:446; lk-&gt;cpu = &amp;cpus[1]</text>
<rect x="340" y="78" width="92" height="30" rx="15" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="386" y="98" font-size="12" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;lock</text>
<text x="470" y="98" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 1</text>
<rect x="40" y="126" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="52" y="145" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;state = RUNNING; swtch(...)</text>
<text x="52" y="163" font-size="12" text-anchor="start" fill="var(--fg-2)">proc.c:451–453, lock still held</text>
<rect x="340" y="134" width="92" height="30" rx="15" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="386" y="154" font-size="12" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;lock</text>
<text x="470" y="154" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 1</text>
<rect x="520" y="182" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="532" y="201" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">release(&amp;p-&gt;lock)</text>
<text x="532" y="219" font-size="12" text-anchor="start" fill="var(--fg-2)">forkret 520, or end of sleep 571 / yield 507</text>
<rect x="820" y="190" width="92" height="30" rx="15" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="866" y="210" font-size="12" text-anchor="middle" fill="var(--fg-3)">free</text>
<text x="470" y="210" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 0</text>
<rect x="520" y="238" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="532" y="257" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runs: system call, user mode …</text>
<text x="532" y="275" font-size="12" text-anchor="start" fill="var(--fg-2)">no p-&gt;lock; interrupts may be on</text>
<rect x="820" y="246" width="92" height="30" rx="15" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="866" y="266" font-size="12" text-anchor="middle" fill="var(--fg-3)">free</text>
<text x="470" y="266" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 0</text>
<rect x="520" y="294" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="532" y="313" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire(&amp;p-&gt;lock); change state; sched</text>
<text x="532" y="331" font-size="12" text-anchor="start" fill="var(--fg-2)">yield 504, sleep 566 or kexit 355</text>
<rect x="820" y="302" width="92" height="30" rx="15" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="866" y="322" font-size="12" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;lock</text>
<text x="470" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 1</text>
<rect x="520" y="350" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="532" y="369" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sched: swtch(&amp;p-&gt;context, ...)</text>
<text x="532" y="387" font-size="12" text-anchor="start" fill="var(--fg-2)">proc.c:495; noff must be exactly 1</text>
<rect x="820" y="358" width="92" height="30" rx="15" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="866" y="378" font-size="12" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;lock</text>
<text x="470" y="378" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 1</text>
<rect x="40" y="406" width="290" height="46" rx="6" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="52" y="425" font-size="12" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">release(&amp;p-&gt;lock)</text>
<text x="52" y="443" font-size="12" text-anchor="start" fill="var(--fg-2)">proc.c:463, after line 456 set intena = 0</text>
<rect x="340" y="414" width="92" height="30" rx="15" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="386" y="434" font-size="12" text-anchor="middle" fill="var(--fg-3)">free</text>
<text x="470" y="434" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">noff 0</text>
<path d="M438,176 L516,202" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lkho-arr)"/>
<path d="M516,400 L438,426" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lkho-arr)"/>
<text x="480" y="186" font-size="12" text-anchor="middle" fill="var(--fg)"></text>
<text x="480" y="488" font-size="13" text-anchor="middle" fill="var(--fg)">One hart throughout. holding() checks the hart, so the release on the other side of swtch is legal.</text>
<text x="480" y="508" font-size="12" text-anchor="middle" fill="var(--fg-2)">While the lock is held across the switch, no other hart&#x27;s scheduler can pick P.</text>
</svg>
