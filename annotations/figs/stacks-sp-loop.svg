<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="stacks-a-t stacks-a-d">
<title id="stacks-a-t">One hart's sp moving between stacks</title>
<desc id="stacks-a-d">Five stacks side by side: process A's user stack, A's kernel stack, the hart's scheduler stack, process B's kernel stack and B's user stack. The stack pointer moves from A's user stack to A's kernel stack (uservec), to the scheduler stack (swtch called by sched), to B's kernel stack (swtch called by scheduler), and to B's user stack (userret).</desc>
<style>
  .stacks-a-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .stacks-a-ptr { animation: stacks-a-move 24s ease-in-out infinite, stacks-a-fade 24s linear infinite; }
  .stacks-a-hl { animation: stacks-a-hlmove 24s ease-in-out infinite, stacks-a-fade 24s linear infinite; }
  .stacks-a-ak1 { animation: stacks-a-ak1 24s linear infinite; }
  .stacks-a-ak2 { animation: stacks-a-ak2 24s linear infinite; }
  .stacks-a-ak3 { animation: stacks-a-ak3 24s linear infinite; }
  .stacks-a-bk1 { animation: stacks-a-bk1 24s linear infinite; }
  .stacks-a-bk2 { animation: stacks-a-bk2 24s linear infinite; }
  .stacks-a-bk3 { animation: stacks-a-bk3 24s linear infinite; }
  .stacks-a-cap { opacity: 0; }
  .stacks-a-c1 { animation: stacks-a-c1 24s linear infinite; }
  .stacks-a-c2 { animation: stacks-a-c2 24s linear infinite; }
  .stacks-a-c3 { animation: stacks-a-c3 24s linear infinite; }
  .stacks-a-c4 { animation: stacks-a-c4 24s linear infinite; }
  .stacks-a-c5 { animation: stacks-a-c5 24s linear infinite; }
  .stacks-a-c6 { animation: stacks-a-c6 24s linear infinite; }
  .stacks-a-static { display: none; }
  @keyframes stacks-a-move {
    0%, 12% { transform: translate(40px, 166px); }
    14%, 26% { transform: translate(220px, 88px); }
    28% { transform: translate(220px, 114px); }
    32% { transform: translate(220px, 140px); }
    36%, 40% { transform: translate(220px, 166px); }
    43%, 56% { transform: translate(400px, 166px); }
    59%, 63% { transform: translate(580px, 166px); }
    65%, 67% { transform: translate(580px, 140px); }
    69%, 71% { transform: translate(580px, 114px); }
    73%, 76% { transform: translate(580px, 88px); }
    79%, 97% { transform: translate(760px, 140px); }
    99%, 100% { transform: translate(40px, 166px); }
  }
  @keyframes stacks-a-hlmove {
    0%, 12% { transform: translate(40px, 0px); }
    14%, 40% { transform: translate(220px, 0px); }
    43%, 56% { transform: translate(400px, 0px); }
    59%, 76% { transform: translate(580px, 0px); }
    79%, 97% { transform: translate(760px, 0px); }
    99%, 100% { transform: translate(40px, 0px); }
  }
  @keyframes stacks-a-fade { 0%, 96% { opacity: 1; } 97%, 99% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes stacks-a-ak1 { 0%, 26.5% { opacity: 0; } 27.5%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes stacks-a-ak2 { 0%, 30.5% { opacity: 0; } 31.5%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes stacks-a-ak3 { 0%, 34.5% { opacity: 0; } 35.5%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes stacks-a-bk3 { 0%, 63.5% { opacity: 1; } 64.5%, 98% { opacity: 0; } 99%, 100% { opacity: 1; } }
  @keyframes stacks-a-bk2 { 0%, 67.5% { opacity: 1; } 68.5%, 98% { opacity: 0; } 99%, 100% { opacity: 1; } }
  @keyframes stacks-a-bk1 { 0%, 71.5% { opacity: 1; } 72.5%, 98% { opacity: 0; } 99%, 100% { opacity: 1; } }
  @keyframes stacks-a-c1 { 0%, 12% { opacity: 1; } 13%, 99% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes stacks-a-c2 { 0%, 12.5% { opacity: 0; } 13.5%, 26% { opacity: 1; } 27%, 100% { opacity: 0; } }
  @keyframes stacks-a-c3 { 0%, 26.5% { opacity: 0; } 27.5%, 40% { opacity: 1; } 41%, 100% { opacity: 0; } }
  @keyframes stacks-a-c4 { 0%, 40.5% { opacity: 0; } 41.5%, 57% { opacity: 1; } 58%, 100% { opacity: 0; } }
  @keyframes stacks-a-c5 { 0%, 57.5% { opacity: 0; } 58.5%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
  @keyframes stacks-a-c6 { 0%, 76.5% { opacity: 0; } 77.5%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .stacks-a-ptr, .stacks-a-hl, .stacks-a-cap { display: none; }
    .stacks-a-ak1, .stacks-a-ak2, .stacks-a-ak3, .stacks-a-bk1, .stacks-a-bk2, .stacks-a-bk3 { animation: none; }
    .stacks-a-ak1, .stacks-a-ak2, .stacks-a-ak3 { opacity: 0; }
    .stacks-a-static { display: inline; }
  }
</style>
<defs>
  <marker id="stacks-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/>
  </marker>
</defs>

<!-- left margin: growth direction -->
<text x="22" y="200" font-size="12" fill="var(--fg-3)" text-anchor="middle" transform="rotate(-90 22 200)">high addresses at the top; stacks grow down</text>

<!-- highlight of the active column -->
<g class="stacks-a-hl" transform="translate(40 0)">
  <rect x="-5" y="81" width="160" height="240" rx="10" fill="none" stroke="var(--accent)" stroke-width="3" stroke-opacity=".75"/>
</g>

<!-- column 0: A's user stack -->
<g>
  <text x="115" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="var(--st-user)">A's user stack</text>
  <text x="115" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)">user page table</text>
  <text x="115" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="var(--m-U)">U-mode</text>
  <rect x="40" y="86" width="150" height="230" rx="6" fill="var(--st-user)" fill-opacity=".10" stroke="var(--st-user)" stroke-width="1.5"/>
  <g class="stacks-a-mono" font-size="12" text-anchor="middle" fill="var(--fg)">
    <rect x="48" y="90" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-user)"/><text x="115" y="106">main</text>
    <rect x="48" y="116" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-user)"/><text x="115" y="132">f</text>
    <rect x="48" y="142" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-user)"/><text x="115" y="158">g</text>
  </g>
  <text x="115" y="306" font-size="12" text-anchor="middle" fill="var(--fg-3)">(frames illustrative)</text>
</g>

<!-- column 1: A's kernel stack -->
<g>
  <text x="295" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="var(--st-kernel)">A's kernel stack</text>
  <text x="295" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)" class="stacks-a-mono">KSTACK(A's slot)</text>
  <text x="295" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="var(--m-S)">S-mode</text>
  <rect x="220" y="86" width="150" height="230" rx="6" fill="var(--st-kernel)" fill-opacity=".10" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <g class="stacks-a-mono" font-size="12" text-anchor="middle" fill="var(--fg)">
    <g class="stacks-a-ak1"><rect x="228" y="90" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="295" y="106">usertrap</text></g>
    <g class="stacks-a-ak2"><rect x="228" y="116" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="295" y="132">yield</text></g>
    <g class="stacks-a-ak3"><rect x="228" y="142" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="295" y="158">sched</text></g>
  </g>
  <text x="295" y="306" font-size="12" text-anchor="middle" fill="var(--fg-3)">empty in user mode</text>
</g>

<!-- column 2: scheduler stack -->
<g>
  <text x="475" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="var(--st-s0)">scheduler stack</text>
  <text x="475" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)">this hart's slice of <tspan class="stacks-a-mono">stack0</tspan></text>
  <text x="475" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="var(--m-S)">S-mode</text>
  <rect x="400" y="86" width="150" height="230" rx="6" fill="var(--st-s0)" fill-opacity=".10" stroke="var(--st-s0)" stroke-width="1.5"/>
  <g class="stacks-a-mono" font-size="12" text-anchor="middle" fill="var(--fg)">
    <rect x="408" y="90" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-s0)"/><text x="475" y="106">start</text>
    <rect x="408" y="116" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-s0)"/><text x="475" y="132">main</text>
    <rect x="408" y="142" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-s0)"/><text x="475" y="158">scheduler</text>
  </g>
  <text x="475" y="290" font-size="12" text-anchor="middle" fill="var(--fg-3)">the same three frames</text>
  <text x="475" y="306" font-size="12" text-anchor="middle" fill="var(--fg-3)">since boot</text>
</g>

<!-- column 3: B's kernel stack -->
<g>
  <text x="655" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="var(--st-kernel)">B's kernel stack</text>
  <text x="655" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)" class="stacks-a-mono">KSTACK(B's slot)</text>
  <text x="655" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="var(--m-S)">S-mode</text>
  <rect x="580" y="86" width="150" height="230" rx="6" fill="var(--st-kernel)" fill-opacity=".10" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <g class="stacks-a-mono" font-size="12" text-anchor="middle" fill="var(--fg)">
    <g class="stacks-a-bk1"><rect x="588" y="90" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="655" y="106">usertrap</text></g>
    <g class="stacks-a-bk2"><rect x="588" y="116" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="655" y="132">yield</text></g>
    <g class="stacks-a-bk3"><rect x="588" y="142" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-kernel)"/><text x="655" y="158">sched</text></g>
  </g>
  <text x="655" y="290" font-size="12" text-anchor="middle" fill="var(--fg-3)">B was preempted earlier;</text>
  <text x="655" y="306" font-size="12" text-anchor="middle" fill="var(--fg-3)">its frames waited here</text>
</g>

<!-- column 4: B's user stack -->
<g>
  <text x="835" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="var(--st-user)">B's user stack</text>
  <text x="835" y="48" font-size="12" text-anchor="middle" fill="var(--fg-2)">B's user page table</text>
  <text x="835" y="68" font-size="12" font-weight="700" text-anchor="middle" fill="var(--m-U)">U-mode</text>
  <rect x="760" y="86" width="150" height="230" rx="6" fill="var(--st-user)" fill-opacity=".10" stroke="var(--st-user)" stroke-width="1.5"/>
  <g class="stacks-a-mono" font-size="12" text-anchor="middle" fill="var(--fg)">
    <rect x="768" y="90" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-user)"/><text x="835" y="106">main</text>
    <rect x="768" y="116" width="134" height="24" rx="4" fill="var(--bg)" stroke="var(--st-user)"/><text x="835" y="132">h</text>
  </g>
  <text x="835" y="306" font-size="12" text-anchor="middle" fill="var(--fg-3)">(frames illustrative)</text>
</g>

<!-- the four switches, in the gaps -->
<g font-size="12" text-anchor="middle">
  <g>
    <line x1="192" y1="230" x2="217" y2="230" stroke="var(--fg-2)" stroke-width="1.5" marker-end="url(#stacks-a-arrow)"/>
    <circle cx="205" cy="205" r="11" fill="var(--bg)" stroke="var(--fg-2)"/><text x="205" y="209" font-weight="700" fill="var(--fg)">1</text>
  </g>
  <g>
    <line x1="372" y1="230" x2="397" y2="230" stroke="var(--fg-2)" stroke-width="1.5" marker-end="url(#stacks-a-arrow)"/>
    <circle cx="385" cy="205" r="11" fill="var(--bg)" stroke="var(--fg-2)"/><text x="385" y="209" font-weight="700" fill="var(--fg)">2</text>
  </g>
  <g>
    <line x1="552" y1="230" x2="577" y2="230" stroke="var(--fg-2)" stroke-width="1.5" marker-end="url(#stacks-a-arrow)"/>
    <circle cx="565" cy="205" r="11" fill="var(--bg)" stroke="var(--fg-2)"/><text x="565" y="209" font-weight="700" fill="var(--fg)">3</text>
  </g>
  <g>
    <line x1="732" y1="230" x2="757" y2="230" stroke="var(--fg-2)" stroke-width="1.5" marker-end="url(#stacks-a-arrow)"/>
    <circle cx="745" cy="205" r="11" fill="var(--bg)" stroke="var(--fg-2)"/><text x="745" y="209" font-weight="700" fill="var(--fg)">4</text>
  </g>
</g>

<!-- labels for the four instructions -->
<g font-size="12" text-anchor="middle">
  <rect x="122" y="334" width="166" height="62" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <text x="205" y="352" font-weight="700" fill="var(--fg)">1 · uservec (trap)</text>
  <text x="205" y="369" class="stacks-a-mono" fill="var(--st-kernel)">ld sp, 8(a0)</text>
  <text x="205" y="386" fill="var(--fg-2)">trampoline.S:76</text>

  <rect x="302" y="334" width="166" height="62" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <text x="385" y="352" font-weight="700" fill="var(--fg)">2 · swtch from sched</text>
  <text x="385" y="369" class="stacks-a-mono" fill="var(--st-s0)">ld sp, 8(a1)</text>
  <text x="385" y="386" fill="var(--fg-2)">swtch.S:26</text>

  <rect x="482" y="334" width="166" height="62" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <text x="565" y="352" font-weight="700" fill="var(--fg)">3 · swtch from scheduler</text>
  <text x="565" y="369" class="stacks-a-mono" fill="var(--st-kernel)">ld sp, 8(a1)</text>
  <text x="565" y="386" fill="var(--fg-2)">swtch.S:26</text>

  <rect x="662" y="334" width="166" height="62" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <text x="745" y="352" font-weight="700" fill="var(--fg)">4 · userret</text>
  <text x="745" y="369" class="stacks-a-mono" fill="var(--st-user)">ld sp, 48(a0)</text>
  <text x="745" y="386" fill="var(--fg-2)">trampoline.S:118</text>
</g>

<!-- the moving stack pointer -->
<g class="stacks-a-ptr" transform="translate(40 166)">
  <line x1="-6" y1="0" x2="156" y2="0" stroke="var(--accent)" stroke-width="3"/>
  <rect x="112" y="3" width="40" height="19" rx="5" fill="var(--accent)"/>
  <text x="132" y="17" font-size="13" font-weight="700" text-anchor="middle" fill="var(--bg)" class="stacks-a-mono">sp</text>
</g>

<!-- captions: one visible at a time -->
<g font-size="14" text-anchor="middle" fill="var(--fg)">
  <text x="480" y="432" class="stacks-a-cap stacks-a-c1">A runs in user mode. sp points into A's user stack.</text>
  <text x="480" y="432" class="stacks-a-cap stacks-a-c2">Timer interrupt. uservec saves A's sp in the trapframe and loads the top of A's empty kernel stack.</text>
  <text x="480" y="432" class="stacks-a-cap stacks-a-c3">usertrap, then yield, then sched: ordinary C calls push frames onto A's kernel stack.</text>
  <text x="480" y="432" class="stacks-a-cap stacks-a-c4">swtch loads sp from cpu-&gt;context: the hart is on its scheduler stack. A's frames stay behind.</text>
  <text x="480" y="432" class="stacks-a-cap stacks-a-c5">The scheduler picks B. swtch loads B's saved sp; sched, yield and usertrap return, popping B's frames.</text>
  <text x="480" y="432" class="stacks-a-cap stacks-a-c6">userret loads B's user sp from B's trapframe; sret returns to user mode, making it usable.</text>
  <text x="480" y="432" class="stacks-a-static">One round uses three of the four stack-switching instructions (swtch's twice); the fourth runs once, at power-on.</text>
  <text x="480" y="456" font-size="12" fill="var(--fg-3)">One hart. A and B are any two processes; both kernel stacks belong to their proc slots.</text>
</g>
</svg>
