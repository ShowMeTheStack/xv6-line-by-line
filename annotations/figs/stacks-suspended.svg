<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="stacks-c-t stacks-c-d">
<title id="stacks-c-t">Where a sleeping shell lives</title>
<desc id="stacks-c-d">The shell, pid 2 in proc slot 1, asleep inside read. Left: its struct proc, whose context.sp points at 0x3fffffbeb0 in its kernel stack. Middle: the kernel stack page KSTACK(1), holding the frames usertrap, syscall, sys_read, fileread, consoleread, sleep and sched, with the rest of the page unused and an unmapped guard page below. Right: the trapframe page, whose kernel_sp points at the top of the kernel stack and whose sp field points into the user stack at 0x4f10.</desc>
<style>
  .stacks-c-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<defs>
  <pattern id="stacks-c-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--fg-3)" stroke-width="1.2" stroke-opacity=".55"/>
  </pattern>
  <marker id="stacks-c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
</defs>

<!-- ============ headers ============ -->
<g text-anchor="middle">
  <text x="155" y="26" font-size="14" font-weight="700" fill="var(--fg)">proc[1]: struct proc</text>
  <text x="155" y="44" font-size="12" fill="var(--fg-2)">in the proc table (kernel .bss)</text>
  <text x="480" y="26" font-size="14" font-weight="700" fill="var(--st-kernel)">kernel stack KSTACK(1)</text>
  <text x="480" y="44" font-size="12" fill="var(--fg-2)">one page in the kernel page table</text>
  <text x="805" y="26" font-size="14" font-weight="700" fill="var(--fg)">trapframe page</text>
  <text x="805" y="44" font-size="12" fill="var(--fg-2)">TRAPFRAME in sh's page table</text>
</g>

<!-- ============ left: struct proc ============ -->
<g font-size="12">
  <rect x="20" y="62" width="270" height="296" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <g class="stacks-c-mono" fill="var(--fg)">
    <text x="34" y="86">state     = SLEEPING</text>
    <text x="34" y="106">pid       = 2, name = "sh"</text>
    <text x="34" y="126">chan      = &amp;cons.r</text>
    <text x="34" y="146">kstack    = 0x3fffffb000</text>
    <text x="34" y="166">pagetable = sh's user table</text>
    <text x="34" y="186">trapframe = its page (PA)</text>
  </g>
  <rect x="30" y="200" width="250" height="148" rx="6" fill="var(--st-kernel)" fill-opacity=".08" stroke="var(--st-kernel)"/>
  <text x="40" y="220" font-weight="700" fill="var(--fg)">context: saved by swtch</text>
  <g class="stacks-c-mono" fill="var(--fg)">
    <text x="40" y="244">ra = sched+114</text>
    <text x="40" y="266" font-weight="700" fill="var(--accent)">sp = 0x3fffffbeb0</text>
    <text x="40" y="288">s0 … s11</text>
  </g>
  <text x="40" y="314" fill="var(--fg-2)">Not a stack: 14 registers.</text>
  <text x="40" y="332" fill="var(--fg-2)">sp is a pointer into the stack.</text>
</g>

<!-- ============ middle: kernel stack ============ -->
<g font-size="12">
  <text x="340" y="70" class="stacks-c-mono" fill="var(--fg-2)">0x3fffffc000</text>
  <text x="620" y="70" text-anchor="end" fill="var(--fg-2)">top (empty stack starts here)</text>
  <rect x="340" y="76" width="280" height="384" rx="4" fill="var(--st-kernel)" fill-opacity=".08" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <g class="stacks-c-mono" fill="var(--fg)">
    <rect x="348" y="80" width="264" height="24" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="96">usertrap</text><text x="604" y="96" text-anchor="end" fill="var(--fg-2)">32 B</text>
    <rect x="348" y="106" width="264" height="24" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="122">syscall</text><text x="604" y="122" text-anchor="end" fill="var(--fg-2)">32 B</text>
    <rect x="348" y="132" width="264" height="28" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="150">sys_read</text><text x="604" y="150" text-anchor="end" fill="var(--fg-2)">48 B</text>
    <rect x="348" y="162" width="264" height="28" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="180">fileread</text><text x="604" y="180" text-anchor="end" fill="var(--fg-2)">48 B</text>
    <rect x="348" y="192" width="264" height="38" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="215">consoleread</text><text x="604" y="215" text-anchor="end" fill="var(--fg-2)">96 B</text>
    <rect x="348" y="232" width="264" height="24" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="248">sleep</text><text x="604" y="248" text-anchor="end" fill="var(--fg-2)">32 B</text>
    <rect x="348" y="258" width="264" height="28" rx="3" fill="var(--bg)" stroke="var(--st-kernel)"/>
    <text x="356" y="276">sched</text><text x="604" y="276" text-anchor="end" fill="var(--fg-2)">48 B</text>
  </g>
  <line x1="340" y1="289" x2="620" y2="289" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="612" y="304" text-anchor="end" class="stacks-c-mono" font-weight="700" fill="var(--accent)">0x3fffffbeb0</text>
  <text x="480" y="368" text-anchor="middle" fill="var(--fg-2)">unused: 3760 of 4096 bytes</text>
  <text x="480" y="386" text-anchor="middle" fill="var(--fg-3)">(swtch has no frame of its own)</text>
  <text x="340" y="476" class="stacks-c-mono" fill="var(--fg-2)">0x3fffffb000</text>
  <text x="620" y="476" text-anchor="end" fill="var(--fg-2)">bottom of the page</text>
  <rect x="340" y="484" width="280" height="40" rx="4" fill="url(#stacks-c-hatch)" stroke="var(--fg-3)"/>
  <rect x="340" y="484" width="280" height="40" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="480" y="502" text-anchor="middle" font-weight="700" fill="var(--fg)">guard page, unmapped</text>
  <text x="480" y="518" text-anchor="middle" class="stacks-c-mono" fill="var(--fg-2)">0x3fffffa000</text>
</g>

<!-- ============ right: trapframe + user stack ============ -->
<g font-size="12">
  <rect x="670" y="62" width="270" height="228" rx="8" fill="var(--bg)" stroke="var(--line)"/>
  <g class="stacks-c-mono" fill="var(--fg)">
    <text x="684" y="86">kernel_satp   = kernel table</text>
    <text x="684" y="106" font-weight="700" fill="var(--accent)">kernel_sp     = 0x3fffffc000</text>
    <text x="684" y="126">kernel_trap   = usertrap</text>
    <text x="684" y="146">epc           = after the ecall</text>
    <text x="684" y="166">kernel_hartid = last hart</text>
    <text x="684" y="192" font-weight="700" fill="var(--st-user)">sp            = 0x4f10</text>
    <text x="684" y="212">a0, a1, a2    = 0, &amp;c, 1</text>
    <text x="684" y="232">a7            = 5 (SYS_read)</text>
    <text x="684" y="252">… all 31 user registers</text>
  </g>
  <text x="684" y="276" fill="var(--fg-2)">A save area, not a stack.</text>

  <text x="670" y="320" class="stacks-c-mono" fill="var(--fg-2)">0x5000</text>
  <text x="940" y="320" text-anchor="end" font-weight="700" fill="var(--st-user)">sh's user stack</text>
  <rect x="670" y="326" width="270" height="134" rx="4" fill="var(--st-user)" fill-opacity=".10" stroke="var(--st-user)" stroke-width="1.5"/>
  <g class="stacks-c-mono" fill="var(--fg)">
    <rect x="678" y="330" width="254" height="22" rx="3" fill="var(--bg)" stroke="var(--st-user)"/><text x="686" y="345">argv for sh</text>
    <rect x="678" y="354" width="254" height="22" rx="3" fill="var(--bg)" stroke="var(--st-user)"/><text x="686" y="369">start, main</text>
    <rect x="678" y="378" width="254" height="22" rx="3" fill="var(--bg)" stroke="var(--st-user)"/><text x="686" y="393">getcmd, gets</text>
  </g>
  <line x1="670" y1="404" x2="940" y2="404" stroke="var(--st-user)" stroke-width="2.5"/>
  <text x="932" y="420" text-anchor="end" class="stacks-c-mono" font-weight="700" fill="var(--st-user)">0x4f10</text>
  <text x="670" y="476" class="stacks-c-mono" fill="var(--fg-2)">0x4000</text>
  <rect x="670" y="484" width="270" height="40" rx="4" fill="url(#stacks-c-hatch)" stroke="var(--fg-3)"/>
  <rect x="670" y="484" width="270" height="40" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="805" y="502" text-anchor="middle" font-weight="700" fill="var(--fg)">guard page, PTE_U cleared</text>
  <text x="805" y="518" text-anchor="middle" class="stacks-c-mono" fill="var(--fg-2)">0x3000</text>
</g>

<!-- ============ pointers ============ -->
<g fill="none" stroke-width="1.6">
  <path d="M232,262 C300,262 300,289 336,289" stroke="var(--accent)" marker-end="url(#stacks-c-arrow)"/>
  <path d="M672,102 C645,102 650,76 624,76" stroke="var(--accent)" marker-end="url(#stacks-c-arrow)"/>
  <path d="M866,196 C952,196 952,404 944,404" stroke="var(--st-user)"/>
</g>
<text x="300" y="250" font-size="12" text-anchor="middle" fill="var(--fg-2)">swtch</text>

<!-- ============ notes ============ -->
<g font-size="12" fill="var(--fg-2)">
  <text x="20" y="384">usertrap's saved return address is</text>
  <text x="20" y="400"><tspan class="stacks-c-mono">0x3ffffff09c</tspan>: userret, in the</text>
  <text x="20" y="416">trampoline. uservec called usertrap</text>
  <text x="20" y="432">with <tspan class="stacks-c-mono">jalr</tspan>, so its <tspan class="stacks-c-mono">ret</tspan> lands there.</text>
</g>
<text x="480" y="560" font-size="13" text-anchor="middle" fill="var(--fg)">No hart is running the shell. To resume it, any hart's scheduler loads context.sp (swtch.S:26);</text>
<text x="480" y="580" font-size="13" text-anchor="middle" fill="var(--fg)">sched, sleep, consoleread … return up this stack, and userret later reloads sp = 0x4f10 from the trapframe.</text>
<text x="480" y="602" font-size="12" text-anchor="middle" fill="var(--fg-3)">Values read with gdb from one boot of this build (3 harts), shell idle at the prompt. Physical addresses omitted; they vary.</text>
</svg>
