<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="transitions-map-t transitions-map-d">
<title id="transitions-map-t">Every transition in xv6</title>
<desc id="transitions-map-d">A map of the places a hart can be, grouped by privilege mode, with arrows for the eight kinds of transition. U-mode: the user program. S-mode: uservec, userret, a process's kernel thread, the scheduler loop and main. M-mode: _entry and start. T1 to T4 are traps from user mode into uservec, which continues into the kernel thread. T5 returns through userret; the user stack it loads becomes usable only at sret. T6 is swtch between a kernel thread and the scheduler. T7 is a trap taken in S-mode through kernelvec, which stays on the current stack. T8 is boot: mret from start into main, which then becomes the scheduler.</desc>
<style>
  .transitions-map-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .transitions-map-flow { stroke-dasharray: 7 5; animation: transitions-map-dash 1.6s linear infinite; }
  @keyframes transitions-map-dash { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .transitions-map-flow { animation: none; } }
</style>
<defs>
  <marker id="transitions-map-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
  </marker>
  <marker id="transitions-map-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--m-U)"/>
  </marker>
  <marker id="transitions-map-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--st-s0)"/>
  </marker>
  <marker id="transitions-map-a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--m-M)"/>
  </marker>
  <marker id="transitions-map-a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/>
  </marker>
</defs>

<!-- ============ mode bands ============ -->
<rect x="8" y="10" width="944" height="116" rx="12" fill="var(--m-U)" fill-opacity=".07" stroke="var(--m-U)" stroke-opacity=".45"/>
<text x="24" y="34" font-size="14" font-weight="700" fill="var(--m-U)">U-mode</text>
<rect x="8" y="134" width="944" height="368" rx="12" fill="var(--m-S)" fill-opacity=".06" stroke="var(--m-S)" stroke-opacity=".45"/>
<text x="24" y="158" font-size="14" font-weight="700" fill="var(--m-S)">S-mode</text>
<rect x="8" y="510" width="944" height="122" rx="12" fill="var(--m-M)" fill-opacity=".06" stroke="var(--m-M)" stroke-opacity=".45"/>
<text x="24" y="534" font-size="14" font-weight="700" fill="var(--m-M)">M-mode</text>
<text x="24" y="552" font-size="12" fill="var(--fg-2)">boot only</text>

<!-- ============ nodes ============ -->
<g font-size="12" text-anchor="middle">
  <!-- user program -->
  <rect x="350" y="32" width="260" height="78" rx="10" fill="var(--bg)" stroke="var(--st-user)" stroke-width="2"/>
  <text x="480" y="54" font-size="14" font-weight="700" fill="var(--fg)">user program</text>
  <text x="480" y="76" fill="var(--st-user)" font-weight="700">sp: its user stack</text>
  <text x="480" y="96" fill="var(--fg-2)">satp: its user page table</text>

  <!-- uservec -->
  <rect x="36" y="176" width="270" height="84" rx="10" fill="var(--bg)" stroke="var(--st-none)" stroke-width="2"/>
  <text x="171" y="198" font-size="14" font-weight="700" fill="var(--fg)">uservec <tspan font-size="12" font-weight="400" fill="var(--fg-2)">(trampoline)</tspan></text>
  <text x="171" y="220" fill="var(--fg)">sp: user's value → kernel stack <tspan class="transitions-map-mono" fill="var(--fg-2)">:76</tspan></text>
  <text x="171" y="242" fill="var(--fg)">satp: user → kernel <tspan class="transitions-map-mono" fill="var(--fg-2)">:92</tspan></text>

  <!-- userret -->
  <rect x="654" y="176" width="270" height="84" rx="10" fill="var(--bg)" stroke="var(--st-none)" stroke-width="2"/>
  <text x="789" y="198" font-size="14" font-weight="700" fill="var(--fg)">userret <tspan font-size="12" font-weight="400" fill="var(--fg-2)">(trampoline)</tspan></text>
  <text x="789" y="220" fill="var(--fg)">satp: kernel → user <tspan class="transitions-map-mono" fill="var(--fg-2)">:111</tspan></text>
  <text x="789" y="242" fill="var(--fg)">sp: kernel stack → user's value <tspan class="transitions-map-mono" fill="var(--fg-2)">:118</tspan></text>

  <!-- kernel thread -->
  <rect x="190" y="312" width="280" height="86" rx="10" fill="var(--bg)" stroke="var(--st-kernel)" stroke-width="2"/>
  <text x="330" y="334" font-size="14" font-weight="700" fill="var(--fg)">a process's kernel thread</text>
  <text x="330" y="355" fill="var(--fg-2)">usertrap, system calls, forkret, kexit</text>
  <text x="330" y="377" fill="var(--st-kernel)" font-weight="700">sp: its kernel stack</text>
  <text x="330" y="392" fill="var(--fg-2)">satp: kernel page table</text>

  <!-- scheduler -->
  <rect x="620" y="312" width="260" height="86" rx="10" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="2"/>
  <text x="750" y="334" font-size="14" font-weight="700" fill="var(--fg)">scheduler loop</text>
  <text x="750" y="355" fill="var(--fg-2)">one per hart, never returns</text>
  <text x="750" y="377" fill="var(--st-s0)" font-weight="700">sp: this hart's scheduler stack</text>
  <text x="750" y="392" fill="var(--fg-2)">satp: kernel page table</text>

  <!-- main -->
  <rect x="620" y="428" width="260" height="62" rx="10" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="750" y="450" font-size="14" font-weight="700" fill="var(--fg)">main</text>
  <text x="750" y="472" fill="var(--st-s0)" font-weight="700">sp: boot stack</text>
  <text x="750" y="486" fill="var(--fg-2)">satp: 0, then kernel (kvminithart)</text>

  <!-- start -->
  <rect x="620" y="546" width="260" height="70" rx="10" fill="var(--bg)" stroke="var(--st-s0)" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="750" y="568" font-size="14" font-weight="700" fill="var(--fg)">_entry, start</text>
  <text x="750" y="590" fill="var(--st-s0)" font-weight="700">sp: boot stack (entry.S:17)</text>
  <text x="750" y="606" fill="var(--fg-2)">satp: 0, paging off</text>
</g>

<!-- ============ edges ============ -->
<g fill="none" stroke-width="2">
  <!-- T1-T4: user -> uservec -->
  <path class="transitions-map-flow" d="M350,80 C250,80 190,110 175,172" stroke="var(--accent)" marker-end="url(#transitions-map-a1)"/>
  <!-- uservec -> kernel thread -->
  <path class="transitions-map-flow" d="M171,262 C171,300 200,310 228,312" stroke="var(--accent)" marker-end="url(#transitions-map-a1)"/>
  <!-- T5: kernel thread -> userret -->
  <path d="M440,312 C520,250 600,240 650,236" stroke="var(--m-U)" marker-end="url(#transitions-map-a2)"/>
  <!-- T5: userret -> user -->
  <path d="M789,174 C789,110 700,80 614,76" stroke="var(--m-U)" marker-end="url(#transitions-map-a2)"/>
  <!-- T6: kernel thread <-> scheduler -->
  <path d="M472,338 L616,338" stroke="var(--st-s0)" stroke-dasharray="6 4" marker-end="url(#transitions-map-a3)"/>
  <path d="M618,372 L474,372" stroke="var(--st-s0)" stroke-dasharray="6 4" marker-end="url(#transitions-map-a3)"/>
  <!-- role change main -> scheduler -->
  <path d="M750,426 L750,402" stroke="var(--fg-2)" stroke-dasharray="2 4" marker-end="url(#transitions-map-a5)"/>
  <!-- T8: start -> main -->
  <path d="M750,544 L750,494" stroke="var(--m-M)" marker-end="url(#transitions-map-a4)"/>
  <!-- T7 loops -->
  <path d="M190,338 C130,330 130,380 186,374" stroke="var(--accent)" marker-end="url(#transitions-map-a1)"/>
  <path d="M880,338 C940,330 940,380 884,374" stroke="var(--accent)" marker-end="url(#transitions-map-a1)"/>
</g>

<!-- ============ edge labels ============ -->
<g font-size="12">
  <text x="40" y="70" font-weight="700" fill="var(--accent)">T1–T4 trap</text>
  <text x="40" y="86" fill="var(--fg-2)">ecall, exception,</text>
  <text x="40" y="102" fill="var(--fg-2)">device or timer interrupt</text>
  <text x="44" y="292" fill="var(--fg-2)" class="transitions-map-mono">jalr usertrap</text>
  <text x="44" y="306" fill="var(--fg-2)">:98</text>

  <text x="540" y="230" font-weight="700" fill="var(--m-U)">T5 return</text>
  <text x="478" y="296" fill="var(--fg-2)">usertrap returns,</text>
  <text x="478" y="310" fill="var(--fg-2)">or forkret calls userret</text>
  <text x="800" y="128" font-weight="700" fill="var(--m-U)">T5 <tspan class="transitions-map-mono" font-weight="400" fill="var(--fg-2)">sret :153</tspan></text>

  <text x="544" y="330" text-anchor="middle" font-weight="700" fill="var(--st-s0)">T6 sched</text>
  <text x="544" y="390" text-anchor="middle" font-weight="700" fill="var(--st-s0)">T6 scheduler</text>
  <text x="544" y="406" text-anchor="middle" fill="var(--fg-2)" class="transitions-map-mono">swtch.S:26</text>

  <text x="118" y="350" text-anchor="end" font-weight="700" fill="var(--accent)">T7</text>
  <text x="118" y="366" text-anchor="end" fill="var(--fg-2)">kernelvec</text>
  <text x="944" y="300" text-anchor="end" font-weight="700" fill="var(--accent)">T7</text>
  <text x="944" y="316" text-anchor="end" fill="var(--fg-2)">kernelvec</text>

  <text x="734" y="421" text-anchor="end" fill="var(--fg-2)">main calls scheduler(): same sp</text>
  <text x="760" y="522" font-weight="700" fill="var(--m-M)">T8 <tspan class="transitions-map-mono" font-weight="400" fill="var(--fg-2)">mret, start.c:51</tspan></text>
</g>

<!-- ============ legend ============ -->
<g font-size="12">
  <line x1="120" y1="570" x2="160" y2="570" stroke="var(--accent)" stroke-width="2"/>
  <text x="168" y="574" fill="var(--fg)">trap: hardware jumps to stvec; sp untouched</text>
  <line x1="120" y1="590" x2="160" y2="590" stroke="var(--m-U)" stroke-width="2"/>
  <text x="168" y="594" fill="var(--fg)">return to user mode</text>
  <line x1="120" y1="610" x2="160" y2="610" stroke="var(--st-s0)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="168" y="614" fill="var(--fg)">swtch: S to S, kernel page table throughout</text>
  <text x="420" y="594" fill="var(--fg-2)">Borders: the stack in use there.</text>
  <text x="420" y="614" fill="var(--fg-2)">Grey: no usable stack.</text>
</g>
</svg>
