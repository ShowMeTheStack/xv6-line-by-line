<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="t44-three-sites-t t44-three-sites-d">
<title id="t44-three-sites-t">One tick, three landing sites</title>
<desc id="t44-three-sites-d">A timer tick fans out to three panels. Site A, user mode: stvec is uservec; the user stack is untouched, 31 registers go to the trapframe, the page table switches, and the empty kernel stack of slot 4 receives usertrap, yield, sched and swtch; sepc is the user address 0x3a7a. Site B, a process in the kernel: stvec is kernelvec; a 256-byte kernelvec frame is pushed on usertests' kernel stack below usertrap's frame, then kerneltrap, yield, sched, swtch; sepc is 0x8000266c. Site C, the scheduler: the kernelvec frame is pushed on hart 2's slice of stack0 below the scheduler's frame, kerneltrap does not yield because no process is running; sepc is 0x80001e10.</desc>
<style>
  .t44-three-sites-tick { animation: t44-three-sites-pulse 4s ease-in-out infinite; transform-origin: 480px 30px; }
  .t44-three-sites-ray { animation: t44-three-sites-dash 1.6s linear infinite; }
  .t44-three-sites-fr { animation: t44-three-sites-glow 4s ease-in-out infinite; }
  @keyframes t44-three-sites-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes t44-three-sites-dash { to { stroke-dashoffset: -16; } }
  @keyframes t44-three-sites-glow { 0%, 100% { fill-opacity: .2; } 50% { fill-opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .t44-three-sites-tick, .t44-three-sites-ray, .t44-three-sites-fr { animation: none; } }
</style>
<rect x="20" y="70" width="290" height="360" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="165.0" y="96" font-size="14" fill="var(--fg)" text-anchor="middle" font-weight="700" >Site A: user mode</text>
<text x="165.0" y="116" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >stvec = uservec</text>
<text x="165.0" y="134" font-size="12" fill="var(--fg-3)" text-anchor="middle" >hart 0, child pid 5</text>
<rect x="335" y="70" width="290" height="360" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="480.0" y="96" font-size="14" fill="var(--fg)" text-anchor="middle" font-weight="700" >Site B: process in kernel</text>
<text x="480.0" y="116" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >stvec = kernelvec</text>
<text x="480.0" y="134" font-size="12" fill="var(--fg-3)" text-anchor="middle" >hart 1, usertests pid 3</text>
<rect x="650" y="70" width="290" height="360" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="795.0" y="96" font-size="14" fill="var(--fg)" text-anchor="middle" font-weight="700" >Site C: scheduler</text>
<text x="795.0" y="116" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >stvec = kernelvec</text>
<text x="795.0" y="134" font-size="12" fill="var(--fg-3)" text-anchor="middle" >hart 2, no process</text>
<circle class="t44-three-sites-tick" cx="480" cy="30" r="14" fill="var(--fxbar)" fill-opacity=".5" stroke="var(--fxbar)" stroke-width="2"/>
<text x="480" y="35" font-size="12" fill="var(--fg)" text-anchor="middle" font-weight="600" >tick</text>
<text x="510" y="35" font-size="12" fill="var(--fg-2)" text-anchor="start" >time ≥ stimecmp: the same event on any hart</text>
<line class="t44-three-sites-ray" x1="480" y1="44" x2="165.0" y2="68" stroke="var(--fxbar)" stroke-width="2" stroke-dasharray="4 4"/>
<line class="t44-three-sites-ray" x1="480" y1="44" x2="480.0" y2="68" stroke="var(--fxbar)" stroke-width="2" stroke-dasharray="4 4"/>
<line class="t44-three-sites-ray" x1="480" y1="44" x2="795.0" y2="68" stroke="var(--fxbar)" stroke-width="2" stroke-dasharray="4 4"/>
<text x="165" y="154" font-size="12" fill="var(--fg-2)" text-anchor="middle" >user stack (untouched)</text>
<rect x="45" y="162" width="240" height="24" rx="3" fill="var(--st-user)" fill-opacity="0.2" stroke="var(--st-user)" stroke-width="1.5" />
<text x="165" y="178.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >child's frames … sp = 0x11e80</text>
<text x="165" y="214" font-size="12" fill="var(--fxbar)" text-anchor="middle" font-weight="600" >31 registers → trapframe</text>
<text x="165" y="230" font-size="12" fill="var(--fg-2)" text-anchor="middle" >csrw satp: page table switch</text>
<text x="165" y="254" font-size="12" fill="var(--fg-2)" text-anchor="middle" >KSTACK(4), top 0x3fffff6000: was empty</text>
<rect x="45" y="262" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="165" y="277.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >usertrap</text>
<rect x="45" y="284" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="165" y="299.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >yield</text>
<rect x="45" y="306" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="165" y="321.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >sched → swtch</text>
<rect x="45" y="328" width="240" height="40" rx="3" fill="var(--st-kernel)" fill-opacity="0.06" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="165" y="352.0" font-size="12" fill="var(--fg)" text-anchor="middle" >(rest of the page)</text>
<text x="165" y="386" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >satp switched, trapframe filled</text>
<text x="165" y="410" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >sepc = 0x3a7a (user)</text>
<text x="480" y="154" font-size="12" fill="var(--fg-2)" text-anchor="middle" >KSTACK(2), slot of usertests</text>
<rect x="360" y="162" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="480" y="177.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >usertrap  (0x3fffff9fe0)</text>
<rect x="360" y="184" width="240" height="38" rx="3" fill="var(--fxbar)" fill-opacity="0.35" stroke="var(--fxbar)" stroke-width="1.5" class="t44-three-sites-fr"/>
<text x="480" y="207.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >kernelvec frame, 256 B</text>
<rect x="360" y="222" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="480" y="237.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >kerneltrap (0x3fffff9eb0)</text>
<rect x="360" y="244" width="240" height="22" rx="3" fill="var(--st-kernel)" fill-opacity="0.2" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="480" y="259.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >yield → sched → swtch</text>
<rect x="360" y="266" width="240" height="40" rx="3" fill="var(--st-kernel)" fill-opacity="0.06" stroke="var(--st-kernel)" stroke-width="1.5" />
<text x="480" y="290.0" font-size="12" fill="var(--fg)" text-anchor="middle" >(free)</text>
<text x="480" y="324" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >no satp switch, no trapframe</text>
<text x="480" y="410" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >sepc = 0x8000266c (kernel)</text>
<text x="795" y="154" font-size="12" fill="var(--fg-2)" text-anchor="middle" >hart 2's slice of stack0</text>
<rect x="675" y="162" width="240" height="20" rx="3" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="795" y="176.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >dead start, main frames</text>
<rect x="675" y="182" width="240" height="26" rx="3" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="795" y="199.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >scheduler (0x8000a810)</text>
<rect x="675" y="208" width="240" height="38" rx="3" fill="var(--fxbar)" fill-opacity="0.35" stroke="var(--fxbar)" stroke-width="1.5" class="t44-three-sites-fr"/>
<text x="795" y="231.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >kernelvec frame, 256 B</text>
<rect x="675" y="246" width="240" height="22" rx="3" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="795" y="261.0" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >kerneltrap: no yield</text>
<rect x="675" y="268" width="240" height="40" rx="3" fill="var(--st-s0)" fill-opacity="0.06" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="795" y="292.0" font-size="12" fill="var(--fg)" text-anchor="middle" >(free, no guard page)</text>
<text x="795" y="326" font-size="12" fill="var(--fg-2)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >myproc() == 0</text>
<text x="795" y="410" font-size="12" fill="var(--fg)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >sepc = 0x80001e10 (scheduler)</text>
</svg>
