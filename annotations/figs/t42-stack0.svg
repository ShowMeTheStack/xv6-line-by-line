<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t42-stack0-t t42-stack0-d">
<title id="t42-stack0-t">stack0 and its neighbours in this build</title>
<desc id="t42-stack0-d">stack0 at 0x80007890 is 32 KiB, eight 4 KiB slices. Hart 0's slice runs from 0x80007890 to 0x80008890, hart 1's to 0x80009890, hart 2's to 0x8000a890; slices 3 to 7 are unused. Hart 0's slice holds the dead frames of start and main and the scheduler's 96-byte frame, with sp at 0x80008810. There are no guard pages: hart 1 overflowing would write into hart 0's frames, and hart 0 overflowing would write into the globals ticks, initproc and kernel_pagetable just below.</desc>
<style>
  .t42-stack0-ov { animation: t42-stack0-dash 2.4s linear infinite; }
  @keyframes t42-stack0-dash { to { stroke-dashoffset: -18; } }
  @media (prefers-reduced-motion: reduce) { .t42-stack0-ov { animation: none; } }
</style>
<rect x="330" y="40" width="260" height="30" rx="0" fill="var(--bg-3)" fill-opacity="1" stroke="var(--line)" stroke-width="1.5" />
<text x="460.0" y="60.0" font-size="12" fill="var(--fg)" text-anchor="middle" >cons, pr, tx_lock … (next globals)</text>
<rect x="330" y="70" width="260" height="50" rx="0" fill="var(--st-s0)" fill-opacity="0.08" stroke="var(--line)" stroke-width="1.5" />
<text x="460.0" y="100.0" font-size="12" fill="var(--fg)" text-anchor="middle" >slices 3–7: unused on 3 harts (20 KiB)</text>
<text x="320" y="75" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x8000f890</text>
<rect x="330" y="120" width="260" height="60" rx="0" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--line)" stroke-width="1.5" />
<text x="460.0" y="155.0" font-size="12" fill="var(--fg)" text-anchor="middle" >hart 2's slice</text>
<text x="320" y="125" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x8000a890</text>
<rect x="330" y="180" width="260" height="60" rx="0" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--line)" stroke-width="1.5" />
<text x="460.0" y="215.0" font-size="12" fill="var(--fg)" text-anchor="middle" >hart 1's slice</text>
<text x="320" y="185" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x80009890</text>
<rect x="330" y="240" width="260" height="90" rx="0" fill="var(--st-s0)" fill-opacity="0.2" stroke="var(--line)" stroke-width="1.5" />
<text x="320" y="245" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x80008890</text>
<rect x="330" y="330" width="260" height="40" rx="0" fill="var(--bg-3)" fill-opacity="1" stroke="var(--line)" stroke-width="1.5" />
<text x="460.0" y="355.0" font-size="12" fill="var(--fg)" text-anchor="middle" >ticks · initproc · kernel_pagetable …</text>
<text x="320" y="335" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x80007890</text>
<text x="320" y="335" font-size="12" fill="var(--fg-2)" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >0x80007890</text>
<text x="320" y="75" font-size="12" fill="var(--fg)" text-anchor="middle" ></text>
<rect x="336" y="242" width="248" height="10" rx="2" fill="var(--fg-3)" fill-opacity="0.25" />
<rect x="336" y="254" width="248" height="10" rx="2" fill="var(--fg-3)" fill-opacity="0.25" />
<rect x="336" y="266" width="248" height="26" rx="2" fill="var(--st-s0)" fill-opacity="0.45" stroke="var(--st-s0)" stroke-width="1.5" />
<text x="460.0" y="284" font-size="12" fill="var(--fg)" text-anchor="middle" >scheduler's frame (96 B)</text>
<text x="460.0" y="316" font-size="12" fill="var(--fg-2)" text-anchor="middle" >hart 0's slice: free below</text>
<text x="602" y="251" font-size="12" fill="var(--fg-2)" text-anchor="start" >start, main frames (dead) 0x80008880, 0x80008870</text>
<text x="602" y="283" font-size="12" fill="var(--fg-2)" text-anchor="start" >sp = 0x80008810 while scheduling</text>
<line x1="600" y1="120" x2="592" y2="120" stroke="var(--st-s0)" stroke-width="2"/>
<line x1="600" y1="180" x2="592" y2="180" stroke="var(--st-s0)" stroke-width="2"/>
<line x1="600" y1="240" x2="592" y2="240" stroke="var(--st-s0)" stroke-width="2"/>
<text x="602" y="124" font-size="12" fill="var(--fg-2)" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >hart 2: sp = 0x8000a890</text>
<text x="602" y="184" font-size="12" fill="var(--fg-2)" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >hart 1: sp = 0x80009890</text>
<text x="602" y="232" font-size="12" fill="var(--fg-2)" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" >hart 0: sp = 0x80008890</text>
<defs><marker id="t42-stack0-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--m-M)"/></marker></defs>
<path class="t42-stack0-ov" d="M210,215 C310,215 340,222 346,246" fill="none" stroke="var(--m-M)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#t42-stack0-a)"/>
<text x="205" y="197" font-size="12" fill="var(--m-M)" text-anchor="end" >hart 1 overflowing lands</text>
<text x="205" y="213" font-size="12" fill="var(--m-M)" text-anchor="end" >on hart 0's scheduler frame</text>
<text x="205" y="229" font-size="12" fill="var(--m-M)" text-anchor="end" >(and any call below it)</text>
<path class="t42-stack0-ov" d="M210,300 C300,300 340,318 346,344" fill="none" stroke="var(--m-M)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#t42-stack0-a)"/>
<text x="205" y="290" font-size="12" fill="var(--m-M)" text-anchor="end" >hart 0 overflowing lands</text>
<text x="205" y="306" font-size="12" fill="var(--m-M)" text-anchor="end" >on ticks, initproc …</text>
<text x="460.0" y="26" font-size="13" fill="var(--fg)" text-anchor="middle" font-weight="600" >stack0: 4096 × NCPU (8) bytes, no guard pages</text>
<text x="26" y="200" font-size="12" fill="var(--fg-3)" text-anchor="middle" transform="rotate(-90 26 200)">addresses grow upward; stacks grow down</text>
</svg>
