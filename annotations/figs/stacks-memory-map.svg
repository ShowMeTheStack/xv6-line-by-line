<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="stacks-b-t stacks-b-d">
<title id="stacks-b-t">Where the stacks live</title>
<desc id="stacks-b-d">Three columns. Left: init's user address space, with the user stack page at 0x3000 and a guard page at 0x2000. Middle: physical RAM, with stack0 inside the kernel's bss, the 64 kernel-stack pages side by side near the top of RAM, and init's user stack page. Right: the kernel page table, with the trampoline, kernel stacks at KSTACK(0) to KSTACK(63) separated by unmapped guard pages, and the direct map of all RAM.</desc>
<style>
  .stacks-b-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<defs>
  <pattern id="stacks-b-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--fg-3)" stroke-width="1.2" stroke-opacity=".55"/>
  </pattern>
  <marker id="stacks-b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/>
  </marker>
</defs>

<!-- ============ column headers ============ -->
<g text-anchor="middle">
  <text x="155" y="26" font-size="14" font-weight="700" fill="var(--fg)">init's user page table</text>
  <text x="155" y="44" font-size="12" fill="var(--fg-2)">virtual addresses (one process)</text>
  <text x="480" y="26" font-size="14" font-weight="700" fill="var(--fg)">physical RAM</text>
  <text x="480" y="44" font-size="12" fill="var(--fg-2)">128 MiB from 0x80000000</text>
  <text x="805" y="26" font-size="14" font-weight="700" fill="var(--fg)">kernel page table</text>
  <text x="805" y="44" font-size="12" fill="var(--fg-2)">virtual addresses (shared by all harts)</text>
</g>

<!-- ============ left: user address space ============ -->
<g font-size="12">
  <rect x="20" y="62" width="270" height="34" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="30" y="83" class="stacks-b-mono" fill="var(--fg-2)">0x3ffffff000</text>
  <text x="280" y="83" text-anchor="end" fill="var(--fg)">trampoline (code)</text>

  <rect x="20" y="98" width="270" height="34" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="30" y="119" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffe000</text>
  <text x="280" y="119" text-anchor="end" fill="var(--fg)">trapframe (save area)</text>

  <rect x="20" y="134" width="270" height="128" rx="4" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
  <text x="155" y="196" text-anchor="middle" fill="var(--fg-3)">unmapped</text>
  <text x="155" y="214" text-anchor="middle" fill="var(--fg-3)">(heap would grow up into here)</text>

  <rect x="20" y="264" width="270" height="78" rx="4" fill="var(--st-user)" fill-opacity=".16" stroke="var(--st-user)" stroke-width="1.5"/>
  <text x="30" y="282" class="stacks-b-mono" fill="var(--fg-2)">0x3000</text>
  <text x="280" y="282" text-anchor="end" font-weight="700" fill="var(--st-user)">user stack, 1 page</text>
  <text x="280" y="302" text-anchor="end" fill="var(--fg)">"/init" and argv[] at the top</text>
  <text x="280" y="322" text-anchor="end" fill="var(--fg)">first <tspan class="stacks-b-mono">sp</tspan> = <tspan class="stacks-b-mono">0x3fe0</tspan></text>

  <rect x="20" y="344" width="270" height="44" rx="4" fill="url(#stacks-b-hatch)" stroke="var(--fg-3)"/>
  <rect x="20" y="344" width="270" height="44" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="30" y="362" class="stacks-b-mono" fill="var(--fg-2)">0x2000</text>
  <text x="280" y="362" text-anchor="end" font-weight="700" fill="var(--fg)">guard page</text>
  <text x="280" y="380" text-anchor="end" fill="var(--fg-2)">mapped, but PTE_U cleared</text>

  <rect x="20" y="390" width="270" height="30" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="30" y="410" class="stacks-b-mono" fill="var(--fg-2)">0x1000</text>
  <text x="280" y="410" text-anchor="end" fill="var(--fg)">data</text>
  <rect x="20" y="422" width="270" height="30" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="30" y="442" class="stacks-b-mono" fill="var(--fg-2)">0x0</text>
  <text x="280" y="442" text-anchor="end" fill="var(--fg)">text</text>

  <text x="155" y="474" text-anchor="middle" fill="var(--fg-2)">init's size: <tspan class="stacks-b-mono">sz = 0x4000</tspan></text>
  <text x="155" y="492" text-anchor="middle" fill="var(--fg-2)">No kernel stack appears here:</text>
  <text x="155" y="508" text-anchor="middle" fill="var(--fg-2)">user page tables never map one.</text>
</g>

<!-- ============ middle: physical RAM ============ -->
<g font-size="12">
  <text x="355" y="68" class="stacks-b-mono" fill="var(--fg-2)">0x88000000 (PHYSTOP)</text>
  <line x1="345" y1="72" x2="615" y2="72" stroke="var(--fg-2)"/>
  <rect x="345" y="74" width="270" height="22" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
  <text x="480" y="89" text-anchor="middle" fill="var(--fg-3)">page tables, other pages</text>

  <rect x="345" y="98" width="270" height="92" rx="4" fill="var(--st-kernel)" fill-opacity=".16" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <rect x="352" y="126" width="256" height="36" fill="var(--bg)" fill-opacity=".85"/>
  <text x="480" y="141" text-anchor="middle" font-weight="700" fill="var(--st-kernel)">64 kernel-stack pages, side by side</text>
  <text x="480" y="157" text-anchor="middle" fill="var(--fg)">no gaps here: guards exist only virtually</text>
  <text x="480" y="118" text-anchor="middle" class="stacks-b-mono" font-size="12" fill="var(--fg)">top: 0x87f99000 = slot 0</text>
  <text x="480" y="186" text-anchor="middle" class="stacks-b-mono" font-size="12" fill="var(--fg)">bottom: 0x87f5a000 = slot 63</text>

  <rect x="345" y="192" width="270" height="22" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
  <text x="480" y="207" text-anchor="middle" fill="var(--fg-3)">free and allocated pages</text>

  <rect x="345" y="216" width="270" height="30" rx="4" fill="var(--st-user)" fill-opacity=".16" stroke="var(--st-user)" stroke-width="1.5"/>
  <text x="355" y="236" class="stacks-b-mono" fill="var(--fg-2)">0x87f4a000</text>
  <text x="605" y="236" text-anchor="end" font-weight="700" fill="var(--st-user)">init's stack page</text>

  <rect x="345" y="248" width="270" height="62" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
  <text x="480" y="276" text-anchor="middle" fill="var(--fg-3)">free and allocated pages</text>
  <text x="480" y="294" text-anchor="middle" fill="var(--fg-3)">(at boot, kalloc hands out the top first)</text>
  <text x="355" y="324" class="stacks-b-mono" fill="var(--fg-2)">0x80020bb0 (end)</text>
  <line x1="345" y1="312" x2="615" y2="312" stroke="var(--fg-2)"/>

  <rect x="345" y="330" width="270" height="24" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="480" y="347" text-anchor="middle" fill="var(--fg)">rest of .bss: cons, kmem, cpus, proc[] ...</text>

  <!-- stack0 -->
  <rect x="345" y="356" width="270" height="144" rx="4" fill="var(--st-s0)" fill-opacity=".10" stroke="var(--st-s0)" stroke-width="1.5"/>
    <text x="480" y="372" text-anchor="middle" font-weight="700" fill="var(--st-s0)">stack0: <tspan class="stacks-b-mono">0x80007890–0x8000f890</tspan></text>
  <rect x="353" y="378" width="254" height="28" rx="3" fill="var(--bg)" fill-opacity=".7" stroke="var(--st-s0)" stroke-dasharray="3 3"/>
  <text x="480" y="396" text-anchor="middle" fill="var(--fg-2)">slices 3–7: unused with 3 harts</text>
  <rect x="353" y="408" width="254" height="28" rx="3" fill="var(--st-s0)" fill-opacity=".22" stroke="var(--st-s0)"/>
  <text x="361" y="426" class="stacks-b-mono" fill="var(--fg)">0x80009890–0x8000a890</text>
  <text x="599" y="426" text-anchor="end" fill="var(--fg)">hart 2</text>
  <rect x="353" y="438" width="254" height="28" rx="3" fill="var(--st-s0)" fill-opacity=".22" stroke="var(--st-s0)"/>
  <text x="361" y="456" class="stacks-b-mono" fill="var(--fg)">0x80008890–0x80009890</text>
  <text x="599" y="456" text-anchor="end" fill="var(--fg)">hart 1</text>
  <rect x="353" y="468" width="254" height="28" rx="3" fill="var(--st-s0)" fill-opacity=".22" stroke="var(--st-s0)"/>
  <text x="361" y="486" class="stacks-b-mono" fill="var(--fg)">0x80007890–0x80008890</text>
  <text x="599" y="486" text-anchor="end" fill="var(--fg)">hart 0</text>

  <rect x="345" y="502" width="270" height="40" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="480" y="518" text-anchor="middle" fill="var(--fg)">ticks, initproc, kernel_pagetable ...</text>
  <text x="480" y="534" text-anchor="middle" fill="var(--fg-2)">.rodata and .data from 0x80007000</text>
  <rect x="345" y="544" width="270" height="30" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="355" y="564" class="stacks-b-mono" fill="var(--fg-2)">0x80000000</text>
  <text x="605" y="564" text-anchor="end" fill="var(--fg)">kernel text</text>
</g>

<!-- ============ right: kernel address space ============ -->
<g font-size="12">
  <rect x="670" y="62" width="270" height="28" rx="4" fill="var(--bg-3)" stroke="var(--line)"/>
  <text x="680" y="81" class="stacks-b-mono" fill="var(--fg-2)">0x3ffffff000</text>
  <text x="930" y="81" text-anchor="end" fill="var(--fg)">trampoline</text>

  <rect x="670" y="92" width="270" height="22" rx="4" fill="url(#stacks-b-hatch)" stroke="var(--fg-3)"/>
  <rect x="670" y="92" width="270" height="22" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="680" y="108" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffe000</text>
  <text x="930" y="108" text-anchor="end" fill="var(--fg-2)">unmapped</text>

  <rect x="670" y="116" width="270" height="28" rx="4" fill="var(--st-kernel)" fill-opacity=".16" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <text x="680" y="135" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffd000</text>
  <text x="930" y="135" text-anchor="end" font-weight="700" fill="var(--st-kernel)">KSTACK(0)</text>
  <rect x="670" y="146" width="270" height="22" rx="4" fill="url(#stacks-b-hatch)" stroke="var(--fg-3)"/>
  <rect x="670" y="146" width="270" height="22" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="680" y="162" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffc000</text>
  <text x="930" y="162" text-anchor="end" fill="var(--fg)">guard (unmapped)</text>

  <rect x="670" y="170" width="270" height="28" rx="4" fill="var(--st-kernel)" fill-opacity=".16" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <text x="680" y="189" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffb000</text>
  <text x="930" y="189" text-anchor="end" font-weight="700" fill="var(--st-kernel)">KSTACK(1)</text>
  <rect x="670" y="200" width="270" height="22" rx="4" fill="url(#stacks-b-hatch)" stroke="var(--fg-3)"/>
  <rect x="670" y="200" width="270" height="22" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="680" y="216" class="stacks-b-mono" fill="var(--fg-2)">0x3fffffa000</text>
  <text x="930" y="216" text-anchor="end" fill="var(--fg)">guard (unmapped)</text>

  <text x="805" y="240" text-anchor="middle" font-size="14" fill="var(--fg-2)">⋮  every slot: one stack page, one guard</text>

  <rect x="670" y="250" width="270" height="28" rx="4" fill="var(--st-kernel)" fill-opacity=".16" stroke="var(--st-kernel)" stroke-width="1.5"/>
  <text x="680" y="269" class="stacks-b-mono" fill="var(--fg-2)">0x3ffff7f000</text>
  <text x="930" y="269" text-anchor="end" font-weight="700" fill="var(--st-kernel)">KSTACK(63)</text>
  <rect x="670" y="280" width="270" height="22" rx="4" fill="url(#stacks-b-hatch)" stroke="var(--fg-3)"/>
  <rect x="670" y="280" width="270" height="22" rx="4" fill="var(--bg)" fill-opacity=".55"/>
  <text x="680" y="296" class="stacks-b-mono" fill="var(--fg-2)">0x3ffff7e000</text>
  <text x="930" y="296" text-anchor="end" fill="var(--fg)">guard (unmapped)</text>

  <rect x="670" y="304" width="270" height="22" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
  <text x="805" y="319" text-anchor="middle" fill="var(--fg-3)">unmapped</text>

  <rect x="670" y="330" width="270" height="244" rx="4" fill="var(--bg-3)" fill-opacity=".6" stroke="var(--fg-2)"/>
  <text x="805" y="350" text-anchor="middle" font-weight="700" fill="var(--fg)">direct map: virtual = physical</text>
  <text x="805" y="368" text-anchor="middle" fill="var(--fg-2)" class="stacks-b-mono">0x80000000 – 0x88000000</text>
  <rect x="680" y="380" width="250" height="44" rx="3" fill="var(--bg)" stroke="var(--line)"/>
  <text x="805" y="398" text-anchor="middle" fill="var(--fg)">every RAM page again, including</text>
  <text x="805" y="414" text-anchor="middle" fill="var(--fg)">the kernel-stack pages (no guards)</text>
  <rect x="680" y="430" width="250" height="62" rx="3" fill="var(--st-s0)" fill-opacity=".16" stroke="var(--st-s0)" stroke-width="1.5"/>
  <text x="805" y="450" text-anchor="middle" font-weight="700" fill="var(--st-s0)">stack0, at its own address</text>
  <text x="805" y="468" text-anchor="middle" fill="var(--fg)">boot and scheduler stacks</text>
  <text x="805" y="484" text-anchor="middle" fill="var(--fg)">no guard pages (R W)</text>
  <rect x="680" y="498" width="250" height="28" rx="3" fill="var(--bg)" stroke="var(--line)"/>
  <text x="805" y="517" text-anchor="middle" fill="var(--fg)">kernel text (R X)</text>
  <text x="805" y="548" text-anchor="middle" fill="var(--fg-2)">below it: UART, virtio, PLIC</text>
  <text x="805" y="564" text-anchor="middle" fill="var(--fg-2)">registers, also direct-mapped</text>
</g>

<!-- ============ connections ============ -->
<g fill="none" stroke="var(--fg-2)" stroke-width="1.4">
  <!-- init's user stack VA -> PA -->
  <path d="M290,300 C320,300 318,231 343,231" stroke="var(--st-user)" marker-end="url(#stacks-b-arrow)"/>
  <!-- KSTACK(0) -> top of the 64 pages -->
  <path d="M670,130 C640,130 645,104 617,104" stroke="var(--st-kernel)" marker-end="url(#stacks-b-arrow)"/>
  <!-- KSTACK(63) -> bottom of the 64 pages -->
  <path d="M670,264 C640,264 645,184 617,184" stroke="var(--st-kernel)" marker-end="url(#stacks-b-arrow)"/>
  <!-- direct map -> stack0 -->
  <path d="M680,461 C650,461 645,430 617,430" stroke="var(--st-s0)" marker-end="url(#stacks-b-arrow)"/>
</g>
<g font-size="12">
</g>

<!-- footnote -->
<text x="480" y="628" font-size="12" text-anchor="middle" fill="var(--fg-3)">Not to scale. stack0 and the KSTACK addresses are fixed by this build (kernel.sym, memlayout.h).</text>
<text x="480" y="646" font-size="12" text-anchor="middle" fill="var(--fg-3)">Physical pages handed out by kalloc are from one boot of this build under QEMU; they can differ.</text>
</svg>
