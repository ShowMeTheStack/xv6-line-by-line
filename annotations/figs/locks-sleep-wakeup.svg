<rect x="428" y="156" width="96" height="54" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" />
<text x="476.0" y="187.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">spins</text>
