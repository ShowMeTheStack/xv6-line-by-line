<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="lksw-t lksw-d">
<title id="lksw-t">A wakeup landing in the sleep window</title>
<desc id="lksw-d">Eight steps on two harts. The sleeper takes lk, finds the condition false, records chan with sleep_prepare and releases lk. In the window before sleep(), the waker takes lk, makes the condition true and calls wakeup, which clears p-&gt;chan. sleep() then finds p-&gt;chan 0 and returns immediately; the loop re-checks and finds the condition true.</desc>
<style>
.lksw-ph { opacity: 0; }
@keyframes lksw-k1 { 0% { opacity: 1; } 11.90% { opacity: 1; } 12.50% { opacity: 0; } 99.4% { opacity: 0; } 100% { opacity: 1; } }
.lksw-p1 { animation: lksw-k1 32s linear infinite; }
@keyframes lksw-k2 { 0%, 12.50% { opacity: 0; } 13.10% { opacity: 1; } 24.40% { opacity: 1; } 25.00%, 100% { opacity: 0; } }
.lksw-p2 { animation: lksw-k2 32s linear infinite; }
@keyframes lksw-k3 { 0%, 25.00% { opacity: 0; } 25.60% { opacity: 1; } 36.90% { opacity: 1; } 37.50%, 100% { opacity: 0; } }
.lksw-p3 { animation: lksw-k3 32s linear infinite; }
@keyframes lksw-k4 { 0%, 37.50% { opacity: 0; } 38.10% { opacity: 1; } 49.40% { opacity: 1; } 50.00%, 100% { opacity: 0; } }
.lksw-p4 { animation: lksw-k4 32s linear infinite; }
@keyframes lksw-k5 { 0%, 50.00% { opacity: 0; } 50.60% { opacity: 1; } 61.90% { opacity: 1; } 62.50%, 100% { opacity: 0; } }
.lksw-p5 { animation: lksw-k5 32s linear infinite; }
@keyframes lksw-k6 { 0%, 62.50% { opacity: 0; } 63.10% { opacity: 1; } 74.40% { opacity: 1; } 75.00%, 100% { opacity: 0; } }
.lksw-p6 { animation: lksw-k6 32s linear infinite; }
@keyframes lksw-k7 { 0%, 75.00% { opacity: 0; } 75.60% { opacity: 1; } 86.90% { opacity: 1; } 87.50%, 100% { opacity: 0; } }
.lksw-p7 { animation: lksw-k7 32s linear infinite; }
@keyframes lksw-k8 { 0%, 87.50% { opacity: 0; } 88.10% { opacity: 1; } 99.40% { opacity: 1; } 100.00%, 100% { opacity: 0; } }
.lksw-p8 { animation: lksw-k8 32s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .lksw-ph { animation: none !important; opacity: 0; }
  .lksw-p1 { opacity: 1; }
  .lksw-anim { animation: none !important; display: none; }
  .lksw-static { display: inline; }
}
.lksw-static { display: none; }

.lksw-cur { animation: lksw-move 32s steps(8, end) infinite; }
@keyframes lksw-move { from { transform: translateX(0px); } to { transform: translateX(832px); } }
.lksw-pulse { animation: lksw-pk 2.4s ease-in-out infinite; }
@keyframes lksw-pk { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lksw-pulse { animation: none; } }

</style>
