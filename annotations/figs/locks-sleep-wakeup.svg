<rect x="532" y="246" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="580.0" y="269" font-size="13" text-anchor="middle" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<rect x="532" y="292" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="580.0" y="315" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RUNNING</text>
<rect x="636" y="66" width="96" height="54" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="684.0" y="82.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sleep():</text><text x="684.0" y="97.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire</text><text x="684.0" y="112.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;lock</text>
<rect x="636" y="156" width="96" height="54" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="684.0" y="187.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">release(lk)</text>
<rect x="636" y="246" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="684.0" y="269" font-size="13" text-anchor="middle" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<rect x="636" y="292" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="684.0" y="315" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RUNNING</text>
<rect x="740" y="66" width="96" height="54" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="788.0" y="82.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p-&gt;chan</text><text x="788.0" y="97.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">is 0:</text><text x="788.0" y="112.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">return</text>
<rect x="740" y="246" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="788.0" y="269" font-size="13" text-anchor="middle" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<rect x="740" y="292" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="788.0" y="315" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RUNNING</text>
<rect x="844" y="66" width="96" height="54" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="892.0" y="82.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire(lk);</text><text x="892.0" y="97.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">condition</text><text x="892.0" y="112.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">is true</text>
<rect x="844" y="246" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="892.0" y="269" font-size="13" text-anchor="middle" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<rect x="844" y="292" width="96" height="36" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="892.0" y="315" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RUNNING</text>
<rect x="532" y="140" width="96" height="86" rx="6" fill="var(--lockbg)" stroke="var(--accent)" stroke-width="2" />
<text x="580.0" y="164.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gets lk;</text><text x="580.0" y="179.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">condition</text><text x="580.0" y="194.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= true;</text><text x="580.0" y="209.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">wakeup(chan)</text>
<line class="lksw-pulse" x1="580.0" y1="228" x2="580.0" y2="244" stroke="var(--accent)" stroke-width="3" marker-end="url(#lksw-arra)"/>
<text x="574.0" y="242" font-size="12" text-anchor="middle" fill="var(--fg)"></text>
<g class="lksw-ph lksw-p1"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">1. The sleeper takes the condition lock lk. The waker wants lk too and spins.</text></g>
<g class="lksw-ph lksw-p2"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">2. The condition is false, so the sleeper must wait.</text></g>
<g class="lksw-ph lksw-p3"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">3. sleep_prepare records chan in p-&gt;chan, under p-&gt;lock, while lk is still held.</text></g>
<g class="lksw-ph lksw-p4"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">4. The sleeper releases lk. It is still RUNNING: not asleep yet.</text></g>
<g class="lksw-ph lksw-p5"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">5. In the window, the waker gets lk, makes the condition true, and wakeup clears p-&gt;chan.</text></g>
<g class="lksw-ph lksw-p6"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">6. sleep() takes p-&gt;lock and finds p-&gt;chan already 0.</text></g>
<g class="lksw-ph lksw-p7"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">7. So sleep() returns at once, without ever becoming SLEEPING.</text></g>
<g class="lksw-ph lksw-p8"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">8. The loop re-checks under lk and finds the condition true. No wakeup was lost.</text></g>
<text x="480.0" y="404" font-size="12" text-anchor="middle" fill="var(--fg-2)">Had the wakeup come after sleep() set SLEEPING, the same wakeup would have made the sleeper RUNNABLE.</text>
<text x="480.0" y="424" font-size="12" text-anchor="middle" fill="var(--fg-2)">Either way p-&gt;chan and p-&gt;state change only under p-&gt;lock, and no lock is passed to sleep().</text>
</svg>
