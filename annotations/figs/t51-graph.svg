<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="t51-graph-t t51-graph-d">
<title id="t51-graph-t">The measured lock-order graph of xv6 at 06aad25</title>
<desc id="t51-graph-d">Four rows. Top: the sleep-locks (inode, buffer, tx_lock) and begin_op, which is not a lock but is ordered before every inode. Second row: the condition spinlocks wait_lock, pi->lock, tickslock, disk.vdisk_lock, a sleep-lock's lk->lk, log.lock and cons.lock, each with an arrow down to p->lock. Third row: p->lock, with arrows down to pid_lock, kmem.lock, ftable.lock and itable.lock. Bottom row: the leaves pid_lock, kmem.lock, ftable.lock, itable.lock, bcache.lock and pr.lock. Extra arrows: wait_lock to kmem.lock, log.lock to bcache.lock, cons.lock to pr.lock. One dashed arrow goes upward from itable.lock to lk->lk (iput, only when ref is 1); it closes the single cycle among spinlock classes. The self-loops on ip->lock and b->lock are cycles among sleep-lock classes, ordered by instance. Dotted arrows from pi->lock and cons.lock to kmem.lock were seen only in a targeted run.</desc>
<style>
  .t51-graph-cyc { animation: t51-graph-p 5s ease-in-out infinite; }
  @keyframes t51-graph-p { 0%, 100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .t51-graph-cyc { animation: none; } }
</style>
<defs>
  <marker id="t51-graph-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/></marker>
  <marker id="t51-graph-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
</defs>
<rect width="960" height="670" fill="var(--bg)"/>

<!-- row labels -->
<text x="944" y="24" font-size="12.5" text-anchor="end" fill="var(--fg-3)" font-family="inherit">sleep-locks (held across sleeps; per process)</text>
<text x="16" y="196" font-size="12.5" fill="var(--fg-3)" font-family="inherit">condition spinlocks (released before sleep())</text>
<text x="572" y="407" font-size="12.5" fill="var(--fg-3)" font-family="inherit">one per process slot</text>
<text x="16" y="596" font-size="12.5" fill="var(--fg-3)" font-family="inherit">leaves (nothing taken under them, except itable in iput)</text>

<!-- band: sleep-locks may be held while taking anything below -->
<rect x="150" y="122" width="660" height="34" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-dasharray="4 3"/>
<text x="480" y="144" font-size="13" text-anchor="middle" fill="var(--fg)" font-family="inherit">a process holding sleep-locks may take any spinlock below (sleep-lock outside, spinlock inside)</text>
<line x1="480" y1="156" x2="480" y2="186" stroke="var(--fg-2)" stroke-width="1.6" marker-end="url(#t51-graph-a)"/>

<!-- top row -->
<rect x="40" y="44" width="120" height="44" rx="6" fill="var(--bg-2)" stroke="var(--fg-3)" stroke-dasharray="5 4"/>
<text x="100" y="64" font-size="13" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, monospace">begin_op</text>
<text x="100" y="80" font-size="11.5" text-anchor="middle" fill="var(--fg-2)" font-family="inherit">log space, not a lock</text>
<line x1="160" y1="66" x2="228" y2="66" stroke="var(--fg-2)" stroke-width="1.6" marker-end="url(#t51-graph-a)"/>

<rect x="230" y="44" width="150" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)"/>
<text x="305" y="64" font-size="13" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, monospace">ip->lock</text>
<text x="305" y="80" font-size="11.5" text-anchor="middle" fill="var(--fg-2)" font-family="inherit">inode; parent before child</text>
<path d="M260,44 C250,10 330,10 320,42" fill="none" stroke="var(--fg-2)" stroke-width="1.4" marker-end="url(#t51-graph-a)"/>

<line x1="380" y1="66" x2="478" y2="66" stroke="var(--fg-2)" stroke-width="1.6" marker-end="url(#t51-graph-a)"/>
<rect x="480" y="44" width="150" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)"/>
<text x="555" y="64" font-size="13" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, monospace">b->lock</text>
<text x="555" y="80" font-size="11.5" text-anchor="middle" fill="var(--fg-2)" font-family="inherit">buffer; up to 2 at once</text>
<path d="M510,44 C500,10 580,10 570,42" fill="none" stroke="var(--fg-2)" stroke-width="1.4" marker-end="url(#t51-graph-a)"/>

<rect x="700" y="44" width="150" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)"/>
<text x="775" y="64" font-size="13" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, monospace">tx_lock</text>
<text x="775" y="80" font-size="11.5" text-anchor="middle" fill="var(--fg-2)" font-family="inherit">UART output</text>

<!-- second row: condition spinlocks -->
<g font-family="ui-monospace, monospace" font-size="12.5" text-anchor="middle" fill="var(--fg)">
  <rect x="22" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="80" y="229">wait_lock</text>
  <rect x="152" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="210" y="229">pi->lock</text>
  <rect x="282" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="340" y="229">tickslock</text>
  <rect x="412" y="206" width="136" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="480" y="229">vdisk_lock</text>
  <rect x="562" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="620" y="229">lk->lk</text>
  <rect x="692" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="750" y="229">log.lock</text>
  <rect x="822" y="206" width="116" height="36" rx="6" fill="var(--bg-2)" stroke="var(--lockc)"/><text x="880" y="229">cons.lock</text>
</g>
<text x="620" y="258" font-size="11" text-anchor="middle" fill="var(--fg-3)" font-family="inherit">inside every sleep-lock</text>

<!-- p->lock -->
<rect x="400" y="380" width="160" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="2"/>
<text x="480" y="407" font-size="14" font-weight="600" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, monospace">p->lock</text>

<!-- condition -> p->lock -->
<g stroke="var(--fg-2)" stroke-width="1.5" fill="none" marker-end="url(#t51-graph-a)">
  <line x1="80" y1="242" x2="420" y2="380"/>
  <line x1="210" y1="242" x2="440" y2="380"/>
  <line x1="340" y1="242" x2="460" y2="380"/>
  <line x1="480" y1="242" x2="480" y2="378"/>
  <line x1="620" y1="262" x2="500" y2="380"/>
  <line x1="750" y1="242" x2="520" y2="380"/>
  <line x1="880" y1="242" x2="540" y2="380"/>
</g>

<!-- leaves -->
<g font-family="ui-monospace, monospace" font-size="12.5" text-anchor="middle" fill="var(--fg)">
  <rect x="40" y="540" width="120" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="100" y="563">pid_lock</text>
  <rect x="190" y="540" width="120" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="250" y="563">kmem.lock</text>
  <rect x="340" y="540" width="120" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="400" y="563">ftable.lock</text>
  <rect x="490" y="540" width="120" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="550" y="563">itable.lock</text>
  <rect x="660" y="540" width="130" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="725" y="563">bcache.lock</text>
  <rect x="820" y="540" width="120" height="36" rx="6" fill="var(--bg-3)" stroke="var(--lockc)"/><text x="880" y="563">pr.lock</text>
</g>

<!-- p->lock -> leaves (slot under construction, or a zombie being freed) -->
<g stroke="var(--fg-2)" stroke-width="1.5" fill="none" marker-end="url(#t51-graph-a)">
  <line x1="420" y1="424" x2="110" y2="538"/>
  <line x1="440" y1="424" x2="260" y2="538"/>
  <line x1="470" y1="424" x2="410" y2="538"/>
  <line x1="500" y1="424" x2="545" y2="538"/>
</g>

<!-- other spin -> leaf edges -->
<g stroke="var(--fg-2)" stroke-width="1.5" fill="none" marker-end="url(#t51-graph-a)">
  <path d="M60,242 C40,400 140,480 230,538"/>
  <path d="M770,242 C790,380 740,470 728,538"/>
  <path d="M900,242 C920,380 900,470 885,538"/>
</g>
<!-- targeted-run-only edges -->
<g stroke="var(--fg-3)" stroke-width="1.3" stroke-dasharray="2 4" fill="none" marker-end="url(#t51-graph-a)">
  <path d="M190,242 C170,360 230,460 245,538"/>
  <path d="M860,242 C700,330 420,470 290,540"/>
</g>

<!-- the cycle edge: itable -> lk->lk -->
<path class="t51-graph-cyc" d="M600,540 C700,470 690,320 640,264" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#t51-graph-ac)"/>
<text x="700" y="440" font-size="12" fill="var(--accent)" font-family="inherit">iput, only when ref == 1</text>
<text x="700" y="456" font-size="12" fill="var(--accent)" font-family="inherit">(closes the one spinlock-class cycle)</text>

<!-- legend -->
<g font-size="12" fill="var(--fg-2)" font-family="inherit">
  <line x1="40" y1="626" x2="80" y2="626" stroke="var(--fg-2)" stroke-width="1.5" marker-end="url(#t51-graph-a)"/>
  <text x="88" y="630">A → B: B acquired while A held (main run)</text>
  <line x1="390" y1="626" x2="430" y2="626" stroke="var(--fg-3)" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#t51-graph-a)"/>
  <text x="438" y="630">seen only in a targeted run</text>
  <line x1="640" y1="626" x2="680" y2="626" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#t51-graph-ac)"/>
  <text x="688" y="630">the upward edge</text>
  <text x="40" y="654">Sleep-lock → spinlock edges are summarized by the band; arrows within the top row are sleep-lock → sleep-lock.</text>
</g>
</svg>
