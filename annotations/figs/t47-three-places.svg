<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t47-three-places-t t47-three-places-d">
<title id="t47-three-places-t">Pid 5 suspended: trapframe, kernel stack and context, as dumped by gdb</title>
<desc id="t47-three-places-d">Three columns. Left, the trapframe: epc 0x3a7a, ra 0x3a72, sp 0x11e80 and the user registers s0 to s11. Middle, the 112 bytes in use on kernel stack KSTACK(4): usertrap's frame holding the return address into userret and the user's s0, s1 and s2; yield's frame; sched's frame, which holds the user's s3. Right, p->context: ra 0x80001e9c, sp 0x3fffff5f90, s0 to s11. s0 to s2 differ between trapframe and context; s3 in the context is sched's intena (0, equal to the user's s3 by coincidence); s4 to s11 hold the same values in both.</desc>
<style>
  .t47-three-places-hl { animation: t47-three-places-p 6s ease-in-out infinite; }
  @keyframes t47-three-places-p { 0%, 100% { fill-opacity: .10; } 50% { fill-opacity: .30; } }
  @media (prefers-reduced-motion: reduce) { .t47-three-places-hl { animation: none; fill-opacity: .2; } }
</style>
