<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="lkar-t lkar-d">
<title id="lkar-t">Three harts racing for one spinlock</title>
<desc id="lkar-d">Three rows, one per hart, and a row for the lock word over six steps. Hart 0&#x27;s atomic swap returns 0 and it holds the lock; harts 1 and 2 swap 1 over 1 repeatedly. Hart 0 releases with fence rw,w and a store of 0; hart 2&#x27;s next swap returns 0 and it takes the lock while hart 1 keeps spinning.</desc>
<style>
.lkar-ph { opacity: 0; }
@keyframes lkar-k1 { 0% { opacity: 1; } 16.07% { opacity: 1; } 16.67% { opacity: 0; } 99.4% { opacity: 0; } 100% { opacity: 1; } }
.lkar-p1 { animation: lkar-k1 24s linear infinite; }
@keyframes lkar-k2 { 0%, 16.67% { opacity: 0; } 17.27% { opacity: 1; } 32.73% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
.lkar-p2 { animation: lkar-k2 24s linear infinite; }
@keyframes lkar-k3 { 0%, 33.33% { opacity: 0; } 33.93% { opacity: 1; } 49.40% { opacity: 1; } 50.00%, 100% { opacity: 0; } }
.lkar-p3 { animation: lkar-k3 24s linear infinite; }
@keyframes lkar-k4 { 0%, 50.00% { opacity: 0; } 50.60% { opacity: 1; } 66.07% { opacity: 1; } 66.67%, 100% { opacity: 0; } }
.lkar-p4 { animation: lkar-k4 24s linear infinite; }
@keyframes lkar-k5 { 0%, 66.67% { opacity: 0; } 67.27% { opacity: 1; } 82.73% { opacity: 1; } 83.33%, 100% { opacity: 0; } }
.lkar-p5 { animation: lkar-k5 24s linear infinite; }
@keyframes lkar-k6 { 0%, 83.33% { opacity: 0; } 83.93% { opacity: 1; } 99.40% { opacity: 1; } 100.00%, 100% { opacity: 0; } }
.lkar-p6 { animation: lkar-k6 24s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .lkar-ph { animation: none !important; opacity: 0; }
  .lkar-p1 { opacity: 1; }
  .lkar-anim { animation: none !important; display: none; }
  .lkar-static { display: inline; }
}
.lkar-static { display: none; }

.lkar-cur { animation: lkar-move 24s steps(6, end) infinite; }
@keyframes lkar-move { from { transform: translateX(0px); } to { transform: translateX(780px); } }

</style>
<defs><marker id="lkar-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/></marker></defs>
<text x="540" y="24" font-size="12" text-anchor="middle" fill="var(--fg-3)">time →  (one column per step; the order of events is illustrative)</text>
<g class="lkar-cur lkar-anim"><rect x="152" y="40" width="126" height="290" rx="8" fill="var(--accent)" stroke="none" stroke-width="1.5" fill-opacity=".10"/></g>
<text x="24" y="95" font-size="14" text-anchor="start" fill="var(--fg)" font-weight="700">hart 0</text>
<text x="24" y="111" font-size="12" text-anchor="start" fill="var(--fg-3)">acquire, release</text>
<rect x="155" y="70" width="120" height="50" rx="6" fill="var(--lk-spin)" stroke="var(--lk-spin)" stroke-width="1.5" fill-opacity=".22"/><text x="215.0" y="91.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 0</text><text x="215.0" y="106.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">wins</text>
<rect x="285" y="70" width="120" height="50" rx="6" fill="var(--lk-spin)" stroke="var(--lk-spin)" stroke-width="1.5" fill-opacity=".10" stroke-dasharray="4 3"/><text x="345.0" y="91.7" font-size="12" text-anchor="middle" fill="var(--fg)">critical</text><text x="345.0" y="106.7" font-size="12" text-anchor="middle" fill="var(--fg)">section</text>
<rect x="415" y="70" width="120" height="50" rx="6" fill="var(--bg)" stroke="var(--fg-2)" stroke-width="1.5" /><text x="475.0" y="99.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fence rw,w</text>
<rect x="545" y="70" width="120" height="50" rx="6" fill="var(--bg)" stroke="var(--fg-2)" stroke-width="1.5" /><text x="605.0" y="99.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sw zero,0(s1)</text>
<rect x="675" y="70" width="120" height="50" rx="6" fill="var(--bg)" stroke="var(--fg-2)" stroke-width="1.5" /><text x="735.0" y="99.2" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pop_off()</text>
<text x="865.0" y="99.2" font-size="12" text-anchor="middle" fill="var(--fg-3)">…</text>
<text x="24" y="165" font-size="14" text-anchor="start" fill="var(--fg)" font-weight="700">hart 1</text>
<text x="24" y="181" font-size="12" text-anchor="start" fill="var(--fg-3)">S-mode, in acquire</text>
<rect x="155" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="215.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="285" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="345.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="415" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="475.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="545" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="605.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="675" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="735.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="805" y="140" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="865.0" y="169.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<text x="24" y="235" font-size="14" text-anchor="start" fill="var(--fg)" font-weight="700">hart 2</text>
<text x="24" y="251" font-size="12" text-anchor="start" fill="var(--fg-3)">S-mode, in acquire</text>
<rect x="155" y="210" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="215.0" y="239.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="285" y="210" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="345.0" y="239.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="415" y="210" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="475.0" y="239.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="545" y="210" width="120" height="50" rx="6" fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5" /><text x="605.0" y="239.2" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 1</text>
<rect x="675" y="210" width="120" height="50" rx="6" fill="var(--lk-spin)" stroke="var(--lk-spin)" stroke-width="1.5" fill-opacity=".22"/><text x="735.0" y="231.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">amoswap → 0</text><text x="735.0" y="246.7" font-size="12" text-anchor="middle" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">wins</text>
<rect x="805" y="210" width="120" height="50" rx="6" fill="var(--lk-spin)" stroke="var(--lk-spin)" stroke-width="1.5" fill-opacity=".10" stroke-dasharray="4 3"/><text x="865.0" y="231.7" font-size="12" text-anchor="middle" fill="var(--fg)">critical</text><text x="865.0" y="246.7" font-size="12" text-anchor="middle" fill="var(--fg)">section</text>
<text x="24" y="307" font-size="14" text-anchor="start" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lk-&gt;locked</text>
<text x="24" y="323" font-size="12" text-anchor="start" fill="var(--fg-3)">one word in memory</text>
<rect x="155" y="285" width="120" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="215.0" y="305" font-size="16" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="215.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">held by hart 0</text>
<rect x="285" y="285" width="120" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="345.0" y="305" font-size="16" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="345.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">held by hart 0</text>
<rect x="415" y="285" width="120" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="475.0" y="305" font-size="16" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="475.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">held by hart 0</text>
<rect x="545" y="285" width="120" height="44" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5" />
<text x="605.0" y="305" font-size="16" text-anchor="middle" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<text x="605.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">free</text>
<rect x="675" y="285" width="120" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="735.0" y="305" font-size="16" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="735.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">held by hart 2</text>
<rect x="805" y="285" width="120" height="44" rx="6" fill="var(--lockbg)" stroke="var(--lockc)" stroke-width="1.5" />
<text x="865.0" y="305" font-size="16" text-anchor="middle" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="865.0" y="322" font-size="12" text-anchor="middle" fill="var(--fg-2)">held by hart 2</text>
<g class="lkar-ph lkar-p1"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">1. All three harts swap at once. The memory system orders the swaps: hart 0&#x27;s finds 0 and takes the lock.</text></g>
<g class="lkar-ph lkar-p2"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">2. Hart 0 runs its critical section. Harts 1 and 2 keep swapping 1 over 1: every try is an atomic write.</text></g>
<g class="lkar-ph lkar-p3"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">3. release: fence rw,w orders every load and store of the critical section before the next store.</text></g>
<g class="lkar-ph lkar-p4"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">4. sw zero,0(s1) frees the lock. Hart 1&#x27;s swap landed just before the store, so it still saw 1.</text></g>
<g class="lkar-ph lkar-p5"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">5. Hart 2&#x27;s next swap finds 0 and wins. Which waiter wins is a matter of timing, not of who waited longest.</text></g>
<g class="lkar-ph lkar-p6"><text x="480.0" y="372" font-size="13" text-anchor="middle" fill="var(--fg)">6. Hart 2 holds the lock. Hart 1 spins on, with interrupts off, until hart 2 releases it.</text></g>
<text x="480.0" y="404" font-size="12" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire = amoswap.w.aq a5,a5,(s1) at 0x80000c04;  release = fence rw,w; sw zero,0(s1) at 0x80000c86</text>
</svg>
