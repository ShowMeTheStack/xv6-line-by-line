<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t45-timeline-t t45-timeline-d">
<title id="t45-timeline-t">One time slice on three harts: privilege level and stack over time</title>
<desc id="t45-timeline-d">Three lanes, one per hart. Harts 0 and 1 stay in user mode on the user stacks of pid 7 and pid 6 for the whole slice. Hart 2 goes: A (pid 5) in user mode; a timer trap (T4) to A's kernel stack; swtch (T6) to hart 2's scheduler stack; swtch (T6) to B (pid 4)'s kernel stack; sret (T5) to B's user stack; twenty system calls, each a short trip up to B's kernel stack and back, with sixteen UART traps (T7) inside them; a final wait system call (T1) that sleeps; swtch (T6) to the scheduler stack; swtch (T6) to A's kernel stack; sret (T5) to A's user stack. Schematic, not to scale.</desc>
<style>
  .t45-timeline-ph { animation: t45-timeline-mv 26s linear infinite; }
  @keyframes t45-timeline-mv { 0% { transform: translateX(0px); } 92% { transform: translateX(810px); } 100% { transform: translateX(810px); } }
  @media (prefers-reduced-motion: reduce) { .t45-timeline-ph { animation: none; opacity: 0; } }
</style>
