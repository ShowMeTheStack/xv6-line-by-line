<g class="lkog-ph lkog-p3" stroke-opacity=".55"><line x1="865.0" y1="208.0" x2="865.0" y2="262.0" stroke="var(--accent)" stroke-width="4"/><line x1="825.0" y1="294.0" x2="760.0" y2="360.0" stroke="var(--accent)" stroke-width="4"/><path d="M760,376 C 952,376 956,300 950,230 C 948,205 942,195 932,192" fill="none" stroke="var(--accent)" stroke-width="4"/></g>
<g class="lkog-ph lkog-p2" stroke-opacity=".55"><line x1="209.0" y1="208.0" x2="209.0" y2="350.0" stroke="var(--accent)" stroke-width="4"/><line x1="350.0" y1="208.0" x2="350.0" y2="350.0" stroke="var(--accent)" stroke-width="4"/><line x1="516.0" y1="208.0" x2="516.0" y2="350.0" stroke="var(--accent)" stroke-width="4"/><line x1="466.0" y1="208.0" x2="466.0" y2="262.0" stroke="var(--accent)" stroke-width="4"/></g>
<g class="lkog-ph lkog-p1" stroke-opacity=".55"><line x1="79.0" y1="208.0" x2="79.0" y2="350.0" stroke="var(--accent)" stroke-width="4"/><line x1="280.0" y1="382.0" x2="280.0" y2="466.0" stroke="var(--accent)" stroke-width="4"/><path d="M34,208 L34,482 L218,482" fill="none" stroke="var(--accent)" stroke-width="4"/></g>
<rect x="14" y="22" width="932" height="92" rx="10" fill="var(--lk-sleep)" stroke="var(--lk-sleep)" stroke-width="1.5" fill-opacity=".07" stroke-opacity=".5"/>
<text x="26" y="44" font-size="14" text-anchor="start" fill="var(--lk-sleep)" font-weight="700">sleep-locks</text>
<text x="26" y="62" font-size="12" text-anchor="start" fill="var(--fg-2)">held by a process,</text>
<text x="26" y="78" font-size="12" text-anchor="start" fill="var(--fg-2)">may sleep holding them;</text>
<text x="26" y="94" font-size="12" text-anchor="start" fill="var(--fg-2)">taken before spinlocks</text>
<text x="26" y="150" font-size="12" text-anchor="start" fill="var(--fg-3)">spinlocks taken first</text>
<text x="26" y="166" font-size="12" text-anchor="start" fill="var(--fg-3)">(arrows: A held while B taken)</text>
