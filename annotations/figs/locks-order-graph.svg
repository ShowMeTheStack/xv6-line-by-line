<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="lkog-t lkog-d">
<title id="lkog-t">The measured lock-order graph</title>
<desc id="lkog-d">Sleep-locks (inode, buffer, tx_lock) in a band at the top. Below them the spinlocks taken first: wait_lock, tickslock, disk.vdisk_lock, cons.lock, log.lock, pi-&gt;lock, itable.lock; then pr.lock, bcache.lock and the inner spinlock of each sleep-lock; then p-&gt;lock, which nearly every lock points to; and at the bottom the leaves kmem.lock, pid_lock and ftable.lock, taken while holding p-&gt;lock (for a process slot being built, and kmem.lock also when kwait frees a zombie child). A dashed arrow from p-&gt;lock back up to itable.lock closes one of the class-level cycles; every such cycle passes through iput, which cannot wait there because the inode&#x27;s reference count is 1.</desc>
<style>
.lkog-ph { opacity: 0; }
@keyframes lkog-k1 { 0% { opacity: 1; } 32.73% { opacity: 1; } 33.33% { opacity: 0; } 99.4% { opacity: 0; } 100% { opacity: 1; } }
.lkog-p1 { animation: lkog-k1 21s linear infinite; }
@keyframes lkog-k2 { 0%, 33.33% { opacity: 0; } 33.93% { opacity: 1; } 66.07% { opacity: 1; } 66.67%, 100% { opacity: 0; } }
.lkog-p2 { animation: lkog-k2 21s linear infinite; }
@keyframes lkog-k3 { 0%, 66.67% { opacity: 0; } 67.27% { opacity: 1; } 99.40% { opacity: 1; } 100.00%, 100% { opacity: 0; } }
.lkog-p3 { animation: lkog-k3 21s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .lkog-ph { animation: none !important; opacity: 0; }
  .lkog-p1 { opacity: 1; }
  .lkog-anim { animation: none !important; display: none; }
  .lkog-static { display: inline; }
}
.lkog-static { display: none; }

</style>
