<g class="lkog-ph lkog-p1"><text x="480.0" y="552" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">kwait: wait_lock, then a child&#x27;s p-&gt;lock, then kmem.lock in freeproc: noff 3 (227,333 times).</text></g>
<g class="lkog-ph lkog-p2"><text x="480.0" y="552" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">In interrupt handlers: tickslock, disk.vdisk_lock and cons.lock, each then p-&gt;lock in wakeup; pr.lock on Ctrl-P.</text></g>
<g class="lkog-ph lkog-p3"><text x="480.0" y="552" font-size="13" text-anchor="middle" fill="var(--fg)" font-weight="700">One of the class-level cycles, all through iput: it takes the inode lock only when ip-&gt;ref == 1, so it never waits.</text></g>
</svg>
