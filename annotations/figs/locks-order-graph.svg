<text x="410" y="400" font-size="12" text-anchor="middle" fill="var(--fg-2)">taken after almost everything; in interrupt handlers via wakeup</text>
<text x="140" y="522" font-size="12" text-anchor="start" fill="var(--fg-3)">leaves: nothing is taken while holding them</text>
<circle cx="262" cy="182" r="5" fill="var(--irq-off)"/>
<circle cx="414" cy="182" r="5" fill="var(--irq-off)"/>
