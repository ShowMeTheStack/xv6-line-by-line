<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t46-mret-t t46-mret-d">
<title id="t46-mret-t">What mret does, measured on hart 0</title>
<desc id="t46-mret-d">Before mret, in machine mode: mstatus.MPP = 01 (S), MPIE = 0, MIE = 0, pc = 0x800000ca, mepc = 0x80000e5e. mret makes MPP the current mode (S), copies MPIE into MIE (0), refills MPIE with 1 and MPP with 00 (U), and copies mepc into pc. After: supervisor mode, mstatus = 0xa00000080, pc = 0x80000e5e (main). sp, satp, tp and the other registers are unchanged.</desc>
<style>
  .t46-mret-a0 { animation: t46-mret-k0 12s ease-in-out infinite; }
  @keyframes t46-mret-k0 { 0%, 5% { stroke-opacity: .3; } 9%, 29% { stroke-opacity: 1; } 33%, 100% { stroke-opacity: .3; } }
  .t46-mret-a1 { animation: t46-mret-k1 12s ease-in-out infinite; }
  @keyframes t46-mret-k1 { 0%, 35% { stroke-opacity: .3; } 39%, 59% { stroke-opacity: 1; } 63%, 100% { stroke-opacity: .3; } }
  .t46-mret-a2 { animation: t46-mret-k2 12s ease-in-out infinite; }
  @keyframes t46-mret-k2 { 0%, 65% { stroke-opacity: .3; } 69%, 89% { stroke-opacity: 1; } 93%, 100% { stroke-opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .t46-mret-a0, .t46-mret-a1, .t46-mret-a2 { animation: none; stroke-opacity: 1; } }
</style>
<defs><marker id="t46-mret-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
<rect width="900" height="470" fill="var(--bg)"/>
<rect x="30" y="20" width="300" height="320" rx="8" fill="var(--m-M)" fill-opacity=".10" stroke="var(--m-M)" stroke-width="1.5"/>
<text x="46" y="48" font-size="16" font-weight="600" fill="var(--fg)" font-family="inherit">before mret</text>
<rect x="46" y="66" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="87" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">mode</text>
<text x="302" y="87" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">M</text>
<rect x="46" y="108" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="129" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MPP</text>
<text x="302" y="129" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">01 (S)</text>
<rect x="46" y="150" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="171" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MPIE</text>
<text x="302" y="171" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0</text>
<rect x="46" y="192" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="213" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MIE</text>
<text x="302" y="213" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0</text>
<rect x="46" y="234" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="255" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">pc</text>
<text x="302" y="255" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0x800000ca</text>
<rect x="46" y="276" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="58" y="297" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">mepc</text>
<text x="302" y="297" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0x80000e5e</text>
<rect x="570" y="20" width="300" height="320" rx="8" fill="var(--m-S)" fill-opacity=".10" stroke="var(--m-S)" stroke-width="1.5"/>
<text x="586" y="48" font-size="16" font-weight="600" fill="var(--fg)" font-family="inherit">after mret</text>
<rect x="586" y="66" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="87" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">mode</text>
<text x="842" y="87" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">S</text>
<rect x="586" y="108" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="129" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MPP</text>
<text x="842" y="129" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">00 (U)</text>
<text x="720" y="129" font-size="12" text-anchor="middle" fill="var(--fg-3)" font-family="inherit">refilled</text>
<rect x="586" y="150" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="171" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MPIE</text>
<text x="842" y="171" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">1</text>
<text x="720" y="171" font-size="12" text-anchor="middle" fill="var(--fg-3)" font-family="inherit">refilled</text>
<rect x="586" y="192" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="213" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">MIE</text>
<text x="842" y="213" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0</text>
<rect x="586" y="234" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="255" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">pc</text>
<text x="842" y="255" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0x80000e5e</text>
<text x="720" y="255" font-size="12" text-anchor="middle" fill="var(--fg-3)" font-family="inherit">= main</text>
<rect x="586" y="276" width="268" height="32" rx="4" fill="var(--bg-2)" stroke="var(--line)"/>
<text x="598" y="297" font-size="14" fill="var(--fg-2)" font-family="ui-monospace, monospace">mepc</text>
<text x="842" y="297" font-size="14" text-anchor="end" fill="var(--fg)" font-family="ui-monospace, monospace">0x80000e5e</text>
<path class="t46-mret-a0" d="M316,124 C426,124 472,82 582,82" fill="none" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#t46-mret-ah)"/>
<text x="450" y="93.0" font-size="13.5" text-anchor="middle" fill="var(--fg)" font-family="inherit">MPP becomes the mode</text>
<path class="t46-mret-a1" d="M316,166 C426,166 472,208 582,208" fill="none" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#t46-mret-ah)"/>
<text x="450" y="177.0" font-size="13.5" text-anchor="middle" fill="var(--fg)" font-family="inherit">MIE ← MPIE</text>
<path class="t46-mret-a2" d="M316,292 C426,292 472,250 582,250" fill="none" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#t46-mret-ah)"/>
<text x="450" y="261.0" font-size="13.5" text-anchor="middle" fill="var(--fg)" font-family="inherit">pc ← mepc</text>
<text x="450" y="362" font-size="13.5" text-anchor="middle" fill="var(--fg-2)" font-family="ui-monospace, monospace">mstatus 0xa00000800 → 0xa00000080</text>
<rect x="30" y="378" width="840" height="78" rx="8" fill="var(--st-s0)" fill-opacity=".10" stroke="var(--st-s0)"/>
<text x="48" y="402" font-size="14" font-weight="600" fill="var(--fg)" font-family="inherit">Not part of the transition (gdb: the same before and after)</text>
<text x="48" y="424" font-size="13.5" fill="var(--fg-2)" font-family="ui-monospace, monospace">sp: 0x80008880 / 0x80009880 / 0x8000a880 on harts 0 / 1 / 2 (boot stack)</text>
<text x="48" y="444" font-size="13.5" fill="var(--fg-2)" font-family="ui-monospace, monospace">satp: 0 (Bare) · tp: the hart number · all other registers</text>
</svg>
