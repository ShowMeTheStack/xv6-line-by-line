<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t42-sp-journey-t t42-sp-journey-d">
<title id="t42-sp-journey-t">sp from power-on to init's first instruction</title>
<desc id="t42-sp-journey-d">Four columns: no stack (sp = 0), hart 0's slice of stack0, init's kernel stack in slot 0, and init's user stack. Eleven numbered points trace sp: 0 at power-on; 0x80008890 after entry.S line 17; 0x80008880 in start; 0x80008810 in the scheduler; 0x3fffffe000 after swtch into forkret; 0x3fffffdf00 when init sleeps in fsinit; hart 0 back on 0x80008810; then, on hart 1, kexec at 0x3fffffddb0, prepare_return at 0x3fffffdfd0, 0x3fe0, the user stack pointer, after trampoline line 118 (usable only once sret returns to user mode), and 0x3fd0 in start.</desc>
