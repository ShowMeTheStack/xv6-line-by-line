<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="t41-itinerary-t t41-itinerary-d">
<title id="t41-itinerary-t">One hart's itinerary through the transitions</title>
<desc id="t41-itinerary-d">Three horizontal tracks show, over time, the privilege mode, the stack sp points into, and the page table in satp. Boot runs in M-mode on the boot stack with paging off; mret (T8) enters S-mode; kvminithart turns on the kernel page table; main becomes the scheduler; swtch (T6) moves to a process kernel stack; userret switches the page table, then loads the user sp (still no usable stack in S-mode), then sret (T5) enters U-mode, where the user stack becomes usable; ecall (T1) enters S-mode with the user page table and no usable stack until uservec loads sp and writes satp; a tick in the kernel (T7) pushes a kernelvec frame, kerneltrap yields (T6) to the scheduler stack, and the thread later switches back and returns with sret.</desc>
<style>
  .t41-itinerary-cur { animation: t41-itinerary-run 30s linear infinite; }
  @keyframes t41-itinerary-run { 0% { transform: translateX(150px); } 96% { transform: translateX(960px); opacity: 1; } 97%, 100% { transform: translateX(960px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .t41-itinerary-cur { display: none; } }
</style>
