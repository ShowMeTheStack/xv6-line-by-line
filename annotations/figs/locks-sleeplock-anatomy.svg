<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="lksa-t lksa-d">
<title id="lksa-t">Inside a sleep-lock</title>
<desc id="lksa-d">A struct sleeplock: locked at offset 0, a whole spinlock at offset 8, a name at 32 and the holder&#x27;s pid at 40. Process A (pid 7) holds it during a disk read. Process B takes the inner spinlock, sees the lock held, registers on the lock&#x27;s address, releases the inner spinlock and sleeps. A&#x27;s releasesleep clears locked and pid and wakes B, which then takes the lock and records pid 9.</desc>
<style>
.lksa-ph { opacity: 0; }
@keyframes lksa-k1 { 0% { opacity: 1; } 24.40% { opacity: 1; } 25.00% { opacity: 0; } 99.4% { opacity: 0; } 100% { opacity: 1; } }
.lksa-p1 { animation: lksa-k1 24s linear infinite; }
@keyframes lksa-k2 { 0%, 25.00% { opacity: 0; } 25.60% { opacity: 1; } 49.40% { opacity: 1; } 50.00%, 100% { opacity: 0; } }
.lksa-p2 { animation: lksa-k2 24s linear infinite; }
@keyframes lksa-k3 { 0%, 50.00% { opacity: 0; } 50.60% { opacity: 1; } 74.40% { opacity: 1; } 75.00%, 100% { opacity: 0; } }
.lksa-p3 { animation: lksa-k3 24s linear infinite; }
@keyframes lksa-k4 { 0%, 75.00% { opacity: 0; } 75.60% { opacity: 1; } 99.40% { opacity: 1; } 100.00%, 100% { opacity: 0; } }
.lksa-p4 { animation: lksa-k4 24s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .lksa-ph { animation: none !important; opacity: 0; }
  .lksa-p1 { opacity: 1; }
  .lksa-anim { animation: none !important; display: none; }
  .lksa-static { display: inline; }
}
.lksa-static { display: none; }

</style>
<defs><marker id="lksa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fg-2)"/></marker></defs>
<rect x="24" y="30" width="360" height="330" rx="10" fill="var(--lk-sleep)" stroke="var(--lk-sleep)" stroke-width="1.5" fill-opacity=".06"/>
<text x="40" y="56" font-size="14" text-anchor="start" fill="var(--lk-sleep)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">struct sleeplock  (48 bytes)</text>
<text x="40" y="100" font-size="12" text-anchor="start" fill="var(--fg-3)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+0</text>
<text x="80" y="100" font-size="13" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">uint locked</text>
<text x="40" y="152" font-size="12" text-anchor="start" fill="var(--fg-3)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+8</text>
<text x="80" y="152" font-size="13" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">struct spinlock lk</text>
<text x="40" y="294" font-size="12" text-anchor="start" fill="var(--fg-3)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+32</text>
<text x="80" y="294" font-size="13" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">char *name</text>
<text x="40" y="338" font-size="12" text-anchor="start" fill="var(--fg-3)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+40</text>
<text x="80" y="338" font-size="13" text-anchor="start" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">int pid</text>
<rect x="70" y="160" width="300" height="100" rx="8" fill="var(--lockbg)" stroke="var(--lk-spin)" stroke-width="1.5" />
<text x="86" y="186" font-size="12" text-anchor="start" fill="var(--lockc)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">uint locked</text>
<text x="86" y="212" font-size="12" text-anchor="start" fill="var(--lockc)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">char *name</text>
<text x="86" y="238" font-size="12" text-anchor="start" fill="var(--lockc)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">struct cpu *cpu</text>
<text x="250" y="250" font-size="12" text-anchor="middle" fill="var(--fg)"></text>
<text x="356" y="300" font-size="13" text-anchor="end" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&quot;buffer&quot;</text>
<text x="356" y="212" font-size="12" text-anchor="end" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&quot;sleep lock&quot;</text>
<g class="lksa-ph lksa-p1"><text x="356" y="100" font-size="15" text-anchor="end" fill="var(--lk-sleep)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="356" y="186" font-size="13" text-anchor="end" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="356" y="238" font-size="12" text-anchor="end" fill="var(--lockc)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&amp;cpus[2]</text><text x="356" y="338" font-size="15" text-anchor="end" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7</text></g>
<g class="lksa-ph lksa-p2"><text x="356" y="100" font-size="15" text-anchor="end" fill="var(--lk-sleep)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="356" y="186" font-size="13" text-anchor="end" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><text x="356" y="238" font-size="12" text-anchor="end" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><text x="356" y="338" font-size="15" text-anchor="end" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7</text></g>
<g class="lksa-ph lksa-p3"><text x="356" y="100" font-size="15" text-anchor="end" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><text x="356" y="186" font-size="13" text-anchor="end" fill="var(--lockc)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="356" y="238" font-size="12" text-anchor="end" fill="var(--lockc)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&amp;cpus[0]</text><text x="356" y="338" font-size="15" text-anchor="end" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text></g>
<g class="lksa-ph lksa-p4"><text x="356" y="100" font-size="15" text-anchor="end" fill="var(--lk-sleep)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="356" y="186" font-size="13" text-anchor="end" fill="var(--fg-2)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><text x="356" y="238" font-size="12" text-anchor="end" fill="var(--fg-2)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text><text x="356" y="338" font-size="15" text-anchor="end" fill="var(--fg)" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">9</text></g>
<rect x="690" y="30" width="240" height="210" rx="10" fill="var(--st-kernel)" stroke="var(--st-kernel)" stroke-width="1.5" fill-opacity=".06"/>
<text x="810" y="54" font-size="13" text-anchor="middle" fill="var(--st-kernel)" font-weight="700">process A (pid 7), on hart 0</text>
<rect x="430" y="30" width="240" height="210" rx="10" fill="var(--st-kernel)" stroke="var(--st-kernel)" stroke-width="1.5" fill-opacity=".06"/>
<text x="550" y="54" font-size="13" text-anchor="middle" fill="var(--st-kernel)" font-weight="700">process B (pid 9), on hart 2</text>
<g class="lksa-ph lksa-p1"><text x="810" y="92" font-size="12" text-anchor="middle" fill="var(--fg)">holds the sleep-lock</text><text x="810" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">asleep in virtio_disk_rw</text><text x="810" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">waiting for the disk</text><text x="810" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">noff 0</text><text x="550" y="92" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquiresleep(lk):</text><text x="550" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire(&amp;lk-&gt;lk)</text><text x="550" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sees locked = 1</text><text x="550" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">noff 1</text></g>
<g class="lksa-ph lksa-p2"><text x="810" y="92" font-size="12" text-anchor="middle" fill="var(--fg)">holds the sleep-lock</text><text x="810" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">still asleep: the disk</text><text x="810" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">has not finished</text><text x="810" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">noff 0</text><text x="550" y="92" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sleep_prepare(lk): chan = lk</text><text x="550" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">release(&amp;lk-&gt;lk)</text><text x="550" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sleep(): SLEEPING</text><text x="550" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">no spinlock held across the sleep</text></g>
<g class="lksa-ph lksa-p3"><text x="810" y="92" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">releasesleep(lk):</text><text x="810" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">under lk-&gt;lk: locked = 0,</text><text x="810" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pid = 0, wakeup(lk)</text><text x="810" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">noff 1 (lk-&gt;lk), then 2 in wakeup</text><text x="550" y="92" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">woken: chan = 0,</text><text x="550" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">state RUNNABLE</text><text x="550" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"></text><text x="550" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">waits for a hart</text></g>
<g class="lksa-ph lksa-p4"><text x="810" y="92" font-size="12" text-anchor="middle" fill="var(--fg)">done with the buffer</text><text x="810" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">running, holding</text><text x="810" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no lock</text><text x="810" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">noff 0</text><text x="550" y="92" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acquire(&amp;lk-&gt;lk): locked is 0</text><text x="550" y="116" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">locked = 1, pid = 9</text><text x="550" y="140" font-size="12" text-anchor="middle" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">release(&amp;lk-&gt;lk)</text><text x="550" y="200" font-size="12" text-anchor="middle" fill="var(--fg-2)">holds the sleep-lock</text></g>
<g class="lksa-ph lksa-p1"><path d="M430,150 L376,180" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lksa-arr)"/><text x="480.0" y="400" font-size="13" text-anchor="middle" fill="var(--fg)">1. B calls acquiresleep. Its inner spinlock is free, so B takes it (noff 1) and finds the sleep-lock held by pid 7.</text></g>
<g class="lksa-ph lksa-p2"><path d="M430,110 L388,98" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lksa-arr)" stroke-dasharray="5 4"/><text x="480.0" y="400" font-size="13" text-anchor="middle" fill="var(--fg)">2. B registers on the lock&#x27;s address, releases the inner spinlock and sleeps. A still holds the lock across its disk read.</text></g>
<g class="lksa-ph lksa-p3"><path d="M810,240 C810,290 430,290 388,300" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lksa-arr)"/><path d="M690,120 L674,120" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lksa-arr)"/><text x="480.0" y="400" font-size="13" text-anchor="middle" fill="var(--fg)">3. A&#x27;s disk read is done. releasesleep, under the inner spinlock, clears locked and pid and wakes every process on lk.</text></g>
<g class="lksa-ph lksa-p4"><path d="M430,200 L388,316" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#lksa-arr)"/><text x="480.0" y="400" font-size="13" text-anchor="middle" fill="var(--fg)">4. B runs again, retakes the inner spinlock, sees locked = 0 and takes the sleep-lock for itself.</text></g>
<text x="480.0" y="426" font-size="12" text-anchor="middle" fill="var(--fg-2)">The inner spinlock is held for a few instructions; the sleep-lock itself can be held for milliseconds.</text>
<text x="680" y="336" font-size="12" text-anchor="middle" fill="var(--fg-2)">acquiresleep, releasesleep and holdingsleep</text>
<text x="680" y="352" font-size="12" text-anchor="middle" fill="var(--fg-2)">are the only code that touches these fields</text>
</svg>
