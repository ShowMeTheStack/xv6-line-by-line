<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t43-who-changes-what-t t43-who-changes-what-d">
<title id="t43-who-changes-what-t">Who changes which register in one system call</title>
<desc id="t43-who-changes-what-d">A grid with one row per register (mode, pc, sp, satp, stvec, sepc, scause, SIE, sscratch) and one column per event in echo's write system call, from ecall to sret. Only the ecall and sret columns are hardware: they change mode, pc, sepc, scause and SIE. Every other change is an xv6 instruction: csrw sscratch, ld sp, csrw satp, csrw stvec, intr_on, intr_off, csrw sstatus, csrw sepc, a second csrw satp and ld sp. Kernel traps during the call overwrite sepc and scause.</desc>
<style>
  .t43-who-changes-what-cur { animation: t43-who-changes-what-mv 28s step-end infinite; }
  @keyframes t43-who-changes-what-mv { 0.00%, 7.13% { transform: translateX(200px); } 7.14%, 14.28% { transform: translateX(252px); } 14.29%, 21.42% { transform: translateX(304px); } 21.43%, 28.56% { transform: translateX(356px); } 28.57%, 35.70% { transform: translateX(408px); } 35.71%, 42.85% { transform: translateX(460px); } 42.86%, 49.99% { transform: translateX(512px); } 50.00%, 57.13% { transform: translateX(564px); } 57.14%, 64.28% { transform: translateX(616px); } 64.29%, 71.42% { transform: translateX(668px); } 71.43%, 78.56% { transform: translateX(720px); } 78.57%, 85.70% { transform: translateX(772px); } 85.71%, 92.85% { transform: translateX(824px); } 92.86%, 99.99% { transform: translateX(876px); } }
  @media (prefers-reduced-motion: reduce) { .t43-who-changes-what-cur { display: none; } }
</style>
