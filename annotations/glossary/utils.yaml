# Glossary entries owned by the `utils` batch (cat, echo, grep, ls, wc, mkdir, rm, ln, kill,
# sync, zombie). See STYLE.md for the format.

exit-status:
  term: exit status
  kind: Concept
  keys: []
  short: >
    The integer a process hands back when it ends, by calling `exit(status)`. Its parent can
    collect it with `wait`. By convention 0 means "success" and any other value means
    "something went wrong".
  body: |
    In xv6, [[kexit]] stores the status in the dying process's `p->xstate` and the process
    becomes a [[g:zombie]] until its parent calls `wait(&status)`; [[kwait]] then copies
    `xstate` out to the parent. A user program that returns from `main` exits with
    `main`'s return value, because the library's `start` function calls `exit(main(...))`
    ([[user/ulib.c]]).

    The convention is only a convention. Nothing in the kernel treats 0 specially, and
    xv6's own shell ([[user/sh.c]]) passes 0 to `wait` and so never looks at the status at
    all. Several xv6 utilities (`mkdir`, `rm`, `ln`, `kill`) exit with 0 even when the
    operation failed. On Unix systems whose shells do test the status (`make`, `&&`,
    `if`), that would hide errors; in xv6 nobody checks.

standard-streams:
  term: standard input, output and error
  kind: Concept
  keys: []
  short: >
    The Unix convention that every program starts with three open
    [[g:file-descriptor|file descriptors]]: 0 (standard input) to read from, 1 (standard
    output) for normal results, and 2 (standard error) for error messages.
  body: |
    The program does not open them; it inherits them. In xv6, `init` opens the
    [[g:console]] as descriptor 0 and duplicates it into 1 and 2 ([[user/init.c]]), and
    every later process inherits these through `fork` and `exec`. The shell can replace any
    of them before running a program: `cat < f` makes descriptor 0 the file `f`,
    `ls > out` makes descriptor 1 the file `out`, and `ls | wc` connects descriptor 1 of
    `ls` to descriptor 0 of `wc` through a [[g:pipe]].

    Keeping errors on a separate descriptor matters when output is redirected: `cat a b >
    out` should put the contents in `out` but still show "cannot open b" on the screen.
    That only works if the message goes to descriptor 2 (`fprintf(2, ...)`), not to
    descriptor 1 (`printf(...)`). Some xv6 utilities get this wrong.

    A program that reads its input from descriptor 0 when given no file names, and writes
    its results to descriptor 1, works as a *filter*: it can sit anywhere in a pipeline.
    `cat`, `grep` and `wc` are filters in this sense.

hard-link:
  term: hard link
  kind: Concept
  keys: []
  short: >
    A [[g:directory]] entry: a name that leads to an [[g:inode]]. A file can have several
    hard links, all equal; none of them is the "real" name. The `link` system call adds one,
    `unlink` removes one.
  body: |
    After `ln a b`, the names `a` and `b` refer to the same inode: the same data, the same
    size, the same [[g:inode-number]] (`ls` shows it in the third column). Writing through
    one name changes what you read through the other. The inode's [[g:link-count]] counts
    the names; `rm a` removes only the name `a` and decrements the count, and the file's
    blocks are freed only when the count reaches zero and no process has it open.

    Hard links only work inside one file system (an entry stores an inode number, which is
    only meaningful on its own disk), and xv6 refuses to make one to a directory
    ([[sys_link]]), because a second name for a directory could create a cycle in the
    tree. Many Unix systems also have *symbolic* links, files that contain another path;
    xv6 does not.

regular-expression:
  term: regular expression
  kind: Concept
  keys: []
  short: >
    A small pattern language for describing sets of strings. In the version `grep` uses in
    xv6, an ordinary character matches itself, `.` matches any one character, `c*` matches
    zero or more `c`s, `^` anchors the pattern to the start of the line and `$` to the end.
  body: |
    Some examples, with the meanings they have in [[user/grep.c]]:

    - `xv6` matches any line containing the three characters `xv6`.
    - `^xv6` matches lines that start with `xv6`.
    - `v6.$` matches lines whose last three characters are `v6` followed by any one character.
    - `a.*c` matches lines containing an `a` followed, anywhere later, by a `c`.
    - `ab*c` matches `ac`, `abc`, `abbc`, ...

    Full regular-expression languages (POSIX, Perl) add character classes `[a-z]`,
    alternation `a|b`, grouping `( )`, `+`, `?` and escapes such as `\.`. xv6's matcher has
    none of these: it cannot search for only a literal `.` (a `.` always matches any
    character), and a `*` is literal only where it has nothing to repeat, at the start of
    the pattern or right after another `c*`. Its whole implementation is
    three short recursive functions, from Kernighan and Pike's *The Practice of
    Programming*.
