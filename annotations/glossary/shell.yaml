# Glossary entries owned by the `shell` batch (user/sh.c, user/init.c).

shell:
  term: shell
  kind: Concept
  keys: []
  short: >
    The ordinary user program that reads command lines (from the keyboard or a file), turns
    each into processes, and waits for them. In xv6 it is `/sh`, built from [[user/sh.c]] and
    started by `/init`.
  body: |
    A shell has no special privileges. Everything it does goes through the same system calls
    any program can use: [[g:fork-exec|`fork` and `exec`]] to start programs, `wait` to wait
    for them, `open`, `close`, `dup` and `pipe` to arrange their
    [[g:file-descriptor|file descriptors]] ([[g:io-redirection]], [[g:shell-pipeline]]).
    That a useful shell fits in about 500 lines of C is a demonstration of how well these
    few Unix system calls fit together.

    A few commands cannot be ordinary programs because they must change the shell's own
    process state. In xv6 the only one is `cd`: the current directory belongs to a process,
    so a child that changed directory and exited would leave the shell where it was.

    If the shell exits (for example when you type Ctrl-D at the prompt), `/init`
    ([[user/init.c]]) starts a new one.

io-redirection:
  term: I/O redirection
  kind: Concept
  keys: []
  short: >
    Making a program read from or write to a file instead of the terminal, written `<
    file` (standard input) or `> file` (standard output) on a command line. The shell does
    it by replacing descriptor 0 or 1 before running the program, which never notices.
  body: |
    The trick depends on one rule: a new [[g:file-descriptor]] always gets the lowest
    free number ([[kernel:fdalloc]]). For `wc > out`, the child process that will run `wc`
    does `close(1)` and then `open("out", ...)`. Descriptor 1 is now the lowest free slot,
    so the file lands there. Then it calls `exec`; descriptors survive `exec`, so `wc`
    writes "to standard output" as always, and the bytes go into `out` ([[user/sh.c]]).

    Because the change happens in the child after `fork`, the shell's own descriptors are
    untouched, and its next prompt still goes to the console.

    In xv6, `>` opens the file with `O_TRUNC` (empty it first). `>>` exists in the parser
    but xv6 has no append mode, so it writes from the beginning of the file without
    truncating it, overwriting the old bytes instead of adding after them.

shell-pipeline:
  term: pipeline (a | b)
  kind: Concept
  keys: []
  short: >
    A command line such as `echo hi | wc` that connects the standard output of one
    program to the standard input of the next through a [[g:pipe]], so the programs run at
    the same time and data flows between them without a temporary file.
  body: |
    The shell creates the pipe, then forks one child per side. The left child moves the
    pipe's write end onto descriptor 1, the right child moves the read end onto
    descriptor 0, both close the original pipe descriptors, and both `exec` their
    programs ([[g:io-redirection|the same trick as redirection]]). The shell itself closes
    both ends and waits for the two children.

    Closing every unused end matters. The reader sees end-of-file only when *every* write
    end is closed; one forgotten copy of the write end (in the shell, or in the reading
    child itself) would make `wc` wait for more input forever.

    In xv6, `a | b | c` is parsed as `a | (b | c)`: the right child of the first pipe is
    itself a pipeline and forks two children of its own ([[user/sh.c]]).

background-job:
  term: background job (&)
  kind: Concept
  keys: []
  short: >
    A command ending in `&`, which the shell starts without waiting for it to finish, so
    the next prompt appears at once while the command keeps running.
  body: |
    xv6's shell gets this effect with an extra process. The child it forks for the command
    line forks again, lets the grandchild run the command, and exits immediately. The
    shell's `wait` returns right away and it prints the next prompt.

    The grandchild is now an orphan: its parent has exited. The kernel hands it to `init`
    ([[kernel:reparent]]), whose endless `wait` loop ([[user/init.c]]) collects it when it
    finishes, so it does not stay a [[g:zombie]] forever. xv6 has no job control: you
    cannot list, stop or bring back background jobs, and their output can appear in the
    middle of your next command line.

parse-tree:
  term: parse tree
  kind: Concept
  keys: []
  short: >
    A tree of structures that records the grammatical structure of some text: which parts
    belong together and in what order they apply. xv6's shell turns each command line into
    one before running it.
  body: |
    For `echo hi | wc > out &` the shell builds:

    ```
    BACK
     └─ PIPE
         ├─ EXEC  echo hi
         └─ REDIR  fd 1 → out
             └─ EXEC  wc
    ```

    Each node is a small `struct` whose first field says what kind of node it is
    (`EXEC`, `REDIR`, `PIPE`, `LIST`, `BACK`). The tree is built by a
    [[g:recursive-descent|recursive-descent parser]] ([[parseline]] and friends in
    [[user/sh.c]]) and executed by walking it recursively ([[runcmd]]).

    Separating parsing from running keeps both simple: the runner never deals with
    characters, and the parser never deals with processes.

recursive-descent:
  term: recursive-descent parser
  kind: Concept
  keys: []
  short: >
    A way to write a parser by hand: one function per grammar rule, each reading the tokens
    for its rule and calling the functions for the smaller rules it contains. Nesting in
    the grammar becomes nesting of function calls.
  body: |
    The xv6 shell's grammar has four rules, each handled by one function (the `exec`
    rule gets help from [[user:parseredirs]] for its redirections):

    ```
    line  = pipe { "&" } [ ";" line ]          parseline
    pipe  = exec [ "|" pipe ]                   parsepipe
    exec  = block | redirs { word redirs }      parseexec, parseredirs
    block = "(" line ")" redirs                 parseblock
    ```

    `{ }` means "zero or more times", `[ ]` "optional". Because `block` contains a whole
    `line`, parentheses can nest to any depth: the recursion handles it. Each function
    looks at the next token without consuming it ([[peek]]) to decide which way to go, and
    consumes it with [[gettoken]] ([[user/sh.c]]).

fork-exec:
  term: fork and exec
  kind: Concept
  keys: []
  short: >
    The Unix way to run a new program: `fork` makes a copy of the current process, and the
    copy (the child) calls `exec` to replace itself with the new program, while the
    original (the parent) usually calls `wait` until the child exits.
  body: |
    Splitting "make a process" from "load a program" looks wasteful but gives the child a
    window to adjust its own state between the two calls: close and reopen descriptors
    ([[g:io-redirection]]), connect [[g:pipe|pipes]] ([[g:shell-pipeline]]), change
    directory. `exec` keeps open descriptors, so the new program inherits the result
    without knowing anything about it. The shell ([[user/sh.c]]) is built on this pattern.

    The path through xv6: user `fork()` is a stub in [[user/usys.S]] that executes
    [[g:insn:ecall|ecall]]; the kernel dispatches to [[kernel:sys_fork]], which calls
    [[kernel:kfork]]. `exec()` reaches [[kernel:sys_exec]] and then [[kernel:kexec]];
    `wait()` reaches [[kernel:kwait]].
