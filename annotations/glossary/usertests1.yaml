# Glossary entries owned by the `usertests1` batch (user/usertests.c, part 1).
# See STYLE.md for the format.

regression-test:
  term: regression test
  kind: Concept
  short: >
    A test written after a bug was found and fixed, which recreates the situation that
    triggered the bug, so that a later change cannot quietly bring it back (a
    "regression").
  body: |
    A regression test usually looks odd out of context: it does something no ordinary
    program would do, because that is exactly what once broke the system. Its comment
    often names the bug, and `git log -S` on the test's name usually finds the fix that
    came with it.

    Much of `usertests` ([[user/usertests.c]]) is of this kind. For example,
    [[killzero]] calls `kill(0)` and then forks, because `kill(0)` once marked an unused
    process slot as killed and the next process created in that slot died at once.
    [[reparent2]] forks orphans 800 times because the code that hands orphans to `init`
    once deadlocked. Running the whole suite after every change to the kernel checks
    that none of these bugs has returned.
