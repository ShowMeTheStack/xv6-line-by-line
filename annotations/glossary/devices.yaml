# Glossary entries owned by the `devices` batch (console.c, uart.c, printk.c, string.c).

console:
  term: console
  kind: Concept
  keys: []
  short: >
    The text terminal through which a user talks to the system: what you type goes in,
    what programs print comes out. In xv6 it is the [[g:uart|UART]], wired by QEMU to the
    terminal you started it from, and programs reach it through the device file `/console`.
  body: |
    The first user program, `init`, creates `/console` with `mknod` (device number
    [[CONSOLE]] = 1) and opens it as file descriptors 0, 1 and 2 (standard input, output and
    error). Every process it starts inherits them, so the shell and the programs it runs
    read and write the console without opening anything.

    A `read` or `write` on such a descriptor goes through the device table [[devsw]] to
    [[consoleread]] or [[consolewrite]] in [[kernel/console.c]]. Kernel messages bypass the
    file layer and go straight to the UART through [[printk]] and [[consputc]].

line-editing:
  term: line editing (cooked input)
  kind: Concept
  keys: []
  short: >
    Processing the kernel applies to typed input before any program sees it: echoing each
    key to the screen, letting backspace and control-U erase, and holding the text back
    until Enter completes a line.
  body: |
    Unix systems call this "canonical" or "cooked" mode, as opposed to "raw" mode, in which
    a program receives every key the moment it is pressed. xv6 has only the cooked mode,
    implemented in [[consoleintr]]:

    | Key | Byte | Effect |
    |---|---|---|
    | Enter | `'\r'` (13), stored as `'\n'` | completes the line; a waiting `read` returns it |
    | Backspace / Ctrl+H | 127 / 8 | erases the last character of the line being typed |
    | Ctrl+U | 21 | erases the whole line being typed |
    | Ctrl+D | 4 | end of file: completes the line; a `read` with nothing before it returns 0 |
    | Ctrl+P | 16 | prints the process list ([[procdump]]); not stored |

    Because editing happens in the kernel, a program such as the shell needs no code of its
    own for backspace: by the time its `read` returns, the line is already final.

uart-registers:
  term: 16550 UART registers
  kind: Concept
  keys: []
  short: >
    The eight byte-wide registers through which software controls a 16550-compatible
    [[g:uart|UART]]. Some offsets mean one register when read and another when written,
    and two change meaning while the divisor-latch bit is set.
  body: |
    On QEMU's `virt` machine they sit at [[UART0]] = `0x10000000` (register *n* at
    `0x10000000 + n`), accessed with [[g:mmio|memory-mapped I/O]]. The ones xv6 uses, and
    the bits it uses:

    | Offset | Read | Write | Bits xv6 uses |
    |---|---|---|---|
    | 0 | RHR, receive holding: next received byte | THR, transmit holding: byte to send | |
    | 1 | IER, interrupt enable | IER | bit 0 received data; bit 1 transmitter empty |
    | 2 | ISR (also called IIR), interrupt status | FCR, FIFO control | FCR bit 0 enable FIFOs; bits 1, 2 reset them |
    | 3 | LCR, line control | LCR | bits 1–0 word length (`11` = 8 bits); bit 7 divisor latch access (DLAB) |
    | 5 | LSR, line status | (not written) | bit 0 data ready; bit 5 transmit holding register empty |

    While LCR bit 7 (DLAB) is 1, offsets 0 and 1 instead reach the low (DLL) and high (DLM)
    bytes of the baud-rate divisor; the bit rate is the input clock divided by 16 × divisor.
    xv6 sets the divisor in [[uartinit]] and then clears DLAB.

    With the FIFOs enabled, the chip queues up to 16 bytes in each direction; LSR bit 0
    then means "the receive FIFO is not empty" and bit 5 means "the transmit FIFO is
    empty". Offsets 4, 6 and 7 (modem control, modem status, scratch) exist but xv6 never
    touches them. See [[kernel/uart.c]].

variadic-function:
  term: variadic function
  kind: C
  keys: []
  short: >
    A C function that accepts a variable number of arguments, declared with `...` after
    its fixed parameters, like `printk(char *fmt, ...)`. It reads the extra arguments one by
    one with `va_start`, `va_arg` and `va_end` from `<stdarg.h>`.
  body: |
    The function itself cannot find out how many extra arguments there are or what their
    types are; the caller must tell it some other way. [[printk]] learns both from its
    [[g:format-string]]: each `%d` means "the next argument is an `int`".

    ```c
    va_list ap;            // cursor over the extra arguments
    va_start(ap, fmt);     // start after the last named parameter
    int x = va_arg(ap, int);  // take the next one, as an int
    va_end(ap);            // finish
    ```

    Arguments smaller than `int` (such as `char`) are promoted to `int` when passed, and
    `float` to `double`. Calling `va_arg` with a type that does not match what was passed,
    or reading more arguments than were passed, is undefined behavior: the compiler does
    not check it. That is why xv6 marks `printk` with `__attribute__((format(printf, 1, 2)))`,
    which makes the compiler check calls against the format string.

format-string:
  term: format string
  kind: C
  keys: []
  short: >
    The first argument of a `printf`-style function: text printed as is, with `%`
    directives such as `%d` or `%s`, each of which consumes the next argument and prints it
    in the stated form.
  body: |
    In `printk("hart %d starting\n", cpuid())`, the text `hart `, ` starting` and the
    newline are printed literally, and `%d` is replaced by the next argument in decimal.
    `%%` prints a single `%`.

    Kernel [[printk]] understands `%d`, `%ld`, `%lld`, `%u`, `%lu`, `%llu`, `%x`, `%lx`,
    `%llx`, `%p`, `%c`, `%s` and `%%`, with no widths, padding or precision; see
    [[kernel/printk.c]]. User-space [[user:printf]] ([[user/printf.c]]) has its own,
    similar set.
