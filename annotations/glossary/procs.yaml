# Glossary entries owned by the `procs` batch (proc.c, proc.h, swtch.S, spinlock.c/h,
# sleeplock.c/h). See STYLE.md for the format.

race-condition:
  term: race condition
  kind: Concept
  short: >
    A bug in which the result depends on the exact timing of two or more CPUs (or a CPU and
    an interrupt handler) touching the same memory, so the program usually works and
    occasionally does not.
  body: |
    The classic example is two harts incrementing a shared counter. `count = count + 1`
    compiles to a load, an add and a store. If both harts load the old value before either
    stores, both store the same new value and one increment is lost. Nothing crashes; the
    count is quietly wrong, and only under the right timing.

    The cure is to make the load–modify–store sequence a [[g:critical-section]] that only one
    hart can be in at a time, usually with a [[g:spinlock]].

critical-section:
  term: critical section
  kind: Concept
  short: >
    A stretch of code that reads or updates shared data and must not run on two CPUs at
    once. In xv6 it is the code between `acquire(&lk)` and `release(&lk)`.
  body: |
    A lock does not protect code; it protects *data*. Every piece of code that touches the
    data must hold the same lock, or the lock protects nothing. That is why xv6 writes, next
    to each shared variable, which lock guards it (for example the comments in
    `struct proc`, [[kernel/proc.h:85]]).

    Keeping critical sections short matters: other CPUs that want the same lock spin,
    doing no useful work, until it is released.

spinlock:
  term: spinlock
  kind: Concept
  short: >
    A lock that a CPU waits for by looping ("spinning") until it is free. xv6's
    `struct spinlock` is taken with [[acquire]] and given back with [[release]]; while a CPU
    holds one, interrupts on that CPU are off.
  body: |
    The lock is one word, `locked`: 0 means free, 1 means held. [[acquire]] uses an atomic
    swap ([[g:insn:amoswap|amoswap]]) to write 1 and get the old value back in one
    indivisible step; if the old value was 0, this CPU now holds the lock, otherwise it tries
    again. [[release]] stores 0. Both include a [[g:memory-barrier]] so that the protected
    data is never read or written outside the lock.

    Spinning wastes the CPU, so spinlocks suit short [[g:critical-section|critical sections]].
    A process must not sleep or give up the CPU while holding one (only the process's own
    `p->lock`, which [[sched]] requires, is allowed). For long waits, such as disk I/O, xv6 uses a [[g:sleeplock]].
    See also [[g:interrupts-and-locks]], [[g:deadlock]] and [[concept:locks#spinlock]].

sleeplock:
  term: sleep lock
  kind: Concept
  short: >
    A lock whose waiters give up the CPU (sleep) instead of spinning. xv6 uses it for
    things held for a long time, such as a disk buffer or an inode during disk I/O. Taken
    with [[acquiresleep]], released with [[releasesleep]].
  body: |
    A `struct sleeplock` ([[kernel/sleeplock.h]]) is a `locked` flag guarded by a small
    [[g:spinlock]]. A process that finds it held calls [[sleep]] and is woken by
    [[releasesleep]] (see [[g:sleep-wakeup]]).

    Differences from a spinlock: a process may hold a sleep lock while it sleeps or is
    switched out, and holding a sleep lock does not by itself turn interrupts off. In exchange, only a
    process can use one: an interrupt handler cannot sleep, so it can never take a sleep
    lock.

    Ownership is by process: [[holdingsleep]] compares the holder's PID, because a holder can
    sleep and resume on another hart. See [[concept:locks#sleep-locks]].

deadlock:
  term: deadlock
  kind: Concept
  short: >
    A state in which two or more CPUs (or processes) each wait forever for something the
    other holds, so none of them can continue.
  body: |
    Two ways it happens in a kernel like xv6:

    - **Lock ordering.** CPU 1 holds lock A and waits for B; CPU 2 holds B and waits for A.
      xv6 prevents this by always acquiring locks in a fixed global order. For processes:
      `wait_lock` before any `p->lock` ([[kernel/proc.c:23]]).
    - **Interrupt on the same CPU.** Code holds lock A; an interrupt arrives on the same CPU
      and its handler tries to acquire A. The handler spins forever, because the code that
      would release A cannot run until the handler returns. xv6 prevents this by turning
      interrupts off while any spinlock is held; see [[g:interrupts-and-locks]].

    [[acquire]] also panics if a CPU tries to take a lock it already holds, which would
    otherwise deadlock the CPU with itself.

    The measured order of every lock in the kernel is on [[concept:locks#order]]; see also
    [[g:lock-order]].

interrupts-and-locks:
  term: interrupts and spinlocks (push_off / pop_off)
  kind: Concept
  short: >
    xv6 turns interrupts off on a CPU for as long as that CPU holds any spinlock, so that
    an interrupt handler can never spin on a lock that the interrupted code holds.
    [[push_off]] and [[pop_off]] count how many locks are held and restore the original
    interrupt state when the count returns to zero.
  body: |
    Example: [[sys_pause]] holds `tickslock`. If a timer interrupt arrived on the same CPU (on hart 0,
    which counts ticks), [[clockintr]] would try to acquire `tickslock` and spin forever, since the code that
    holds it is the code the interrupt paused. With interrupts off the timer interrupt
    stays pending and is taken right after the release.

    Locks nest, so a plain "off on acquire, on on release" would turn interrupts back on
    when the *inner* lock is released while the outer one is still held. Instead each CPU
    keeps two fields in its `struct cpu`: `noff`, the nesting depth, and `intena`, whether
    interrupts were on before the outermost [[push_off]]. Only the [[pop_off]] that brings
    `noff` back to 0 may turn interrupts on, and only if `intena` says they were on.

    `intena` belongs to the kernel *thread*, not the hart: other threads (the scheduler,
    other processes) overwrite `mycpu()->intena` while a process is switched out. So [[sched]]
    keeps the process's value in a local variable across [[swtch]] and puts it back, and the
    [[scheduler]] sets it to 0 after every switch back to itself ([[kernel/proc.c:456]]).
    See [[concept:locks#noff]] and [[concept:locks#sched-intena]].

memory-barrier:
  term: memory barrier (fence)
  kind: Concept
  short: >
    An instruction, or a compiler directive, that stops memory reads and writes from being
    reordered across it. Locks need barriers so that the protected data is read and written
    only while the lock is held.
  body: |
    Both the compiler and the hardware may reorder memory operations that look independent:
    the compiler to make code faster, a RISC-V hart because its memory model allows other
    harts to observe its loads and stores in a different order than the program wrote them.
    Within one hart this is invisible; between harts it is not.

    In xv6 the barriers come from the [[g:atomic|`__atomic` built-ins]] in
    [[kernel/spinlock.c]]:

    - [[acquire]]'s `__ATOMIC_ACQUIRE` exchange compiles to `amoswap.w.aq`. The `aq` bit
      means no later load or store of this hart can be seen by others before the swap.
    - [[release]]'s `__ATOMIC_RELEASE` store compiles to `fence rw,w` followed by
      `sw zero`. The [[g:insn:fence|fence]] makes every earlier load and store complete
      before the store that frees the lock.

    Both also restrict the compiler: nothing after the acquire may move above it, and
    nothing before the release may move below it.

context-switch:
  term: context switch
  kind: Concept
  short: >
    Stopping one thread of execution on a CPU and resuming another, by saving the first
    one's registers and loading the second one's. In the xv6 kernel this is [[swtch]],
    which always switches between a process's kernel thread and the CPU's scheduler.
  body: |
    Every xv6 process has a kernel thread: its [[g:kernel-stack]] plus the registers saved
    in `p->context`. Each CPU's [[scheduler]] is a thread too, with its registers in
    `cpus[i].context`. A switch from process A to process B is two switches: A to the
    scheduler (in [[sched]]) and the scheduler to B (in [[scheduler]]).

    [[swtch]] saves only `ra`, `sp` and the callee-saved registers `s0`–`s11`. The rest are
    either already saved by the C code that called `swtch` (because the
    [[g:calling-convention]] lets a call destroy them) or belong to the CPU rather than the
    thread (such as [[g:reg:tp|tp]]). The *user* registers are not involved: they were saved
    in the [[g:trapframe]] when the process entered the kernel.

kernel-stack:
  term: kernel stack
  kind: Concept
  short: >
    The [[g:stack]] a process uses while it runs kernel code (during a system call or an
    interrupt). There is one 4096-byte kernel stack per slot of the process table, at the
    virtual address `p->kstack`, separate from the process's user stack; all 64 are allocated
    once at boot and never freed.
  body: |
    The kernel cannot run on the user stack: user code controls `sp` and could point it
    anywhere. So each process slot gets a page of kernel memory, allocated and mapped in the
    kernel page table at [[KSTACK]]`(i)` for slot `i` by [[proc_mapstacks]] while the
    kernel boots. The stack belongs to the slot, not to a process: [[allocproc]] and
    [[freeproc]] never touch it, and whichever process occupies the slot runs on it. No user
    page table maps it. The page below each stack is left unmapped as a [[g:guard-page]], so
    an overflow causes a page fault instead of silently overwriting a neighbor.

    On every trap from user mode, `sp` holds the kernel stack's address from
    [[kernel/trampoline.S:76]] to [[kernel/trampoline.S:118]], and the stack is usable from
    [[kernel/trampoline.S:92]] (kernel page table) until [[kernel/trampoline.S:111]] (user
    page table). It always starts at the top: the stack is empty whenever the process is in
    user mode. A process is also back on its kernel stack whenever [[swtch]] resumes it. A kernel stack is also where a sleeping or preempted process's kernel state lives:
    the call chain that led to [[sched]] stays on it until the process runs again, on any
    hart. A forked child starts with an empty one, not a copy of its parent's. The
    scheduler does *not* run on a kernel stack; it has the hart's [[g:scheduler-stack]].
    See [[concept:stacks#kernel]].

process-state:
  term: process state
  kind: Concept
  short: >
    Where a process is in its life, stored in `p->state`: `UNUSED`, `USED`, `RUNNABLE`,
    `RUNNING`, `SLEEPING` or `ZOMBIE`. Changing it requires holding `p->lock`.
  body: |
    | State | Meaning | Left by |
    |---|---|---|
    | `UNUSED` | the slot in [[proc]] is free | [[allocproc]] → `USED` |
    | `USED` | slot taken, process being built | [[userinit]] or [[kfork]] → `RUNNABLE`; failure → `UNUSED` |
    | `RUNNABLE` | ready, waiting for a CPU | [[scheduler]] → `RUNNING` |
    | `RUNNING` | executing on some CPU | [[yield]] → `RUNNABLE`; [[sleep]] → `SLEEPING`; [[kexit]] → `ZOMBIE` |
    | `SLEEPING` | waiting for an event | [[wakeup]] or [[kkill]] → `RUNNABLE` |
    | `ZOMBIE` | exited, waiting for the parent | [[kwait]] via [[freeproc]] → `UNUSED` |

    The [[scheduler]] only ever looks for `RUNNABLE`.

zombie:
  term: zombie
  kind: Concept
  short: >
    A process that has exited but whose slot in the process table is not yet free, because
    its parent has not yet collected its exit status with `wait`.
  body: |
    [[kexit]] cannot mark its own slot `UNUSED`: another CPU could then reuse the slot,
    [[g:kernel-stack]] included, while it is still running on it. It also must keep its exit
    status somewhere until the parent asks. So it
    stores the status in `p->xstate`, sets `p->state = ZOMBIE` and switches away for good.
    The parent's [[kwait]] later copies out the status and calls [[freeproc]]. If the parent
    exits first, the zombie is handed to `init` ([[reparent]]), whose endless `wait` loop
    ([[user/init.c]]) collects it.

pid:
  term: PID (process ID)
  kind: Concept
  short: >
    The number that names a process in system calls such as `kill` and `wait`. xv6 hands
    out 1, 2, 3, ... from the counter [[nextpid]] and does not reuse numbers (short of the
    `int` counter overflowing after about two billion processes).
  body: |
    The first process (`init`) gets PID 1. A PID stays attached to its process until the
    parent's [[kwait]] frees the slot; [[freeproc]] then sets the slot's `pid` to 0, which
    is why [[kkill]] refuses PID 0.

sleep-wakeup:
  term: sleep and wakeup
  kind: Concept
  short: >
    xv6's way for a process to wait for an event without spinning: it registers interest
    in a "channel" (any address) with [[sleep_prepare]], gives up the CPU with [[sleep]],
    and becomes runnable again when someone calls [[wakeup]] on the same channel.
  body: |
    The usual pattern, with `lk` the lock protecting the condition:

    ```c
    acquire(&lk);
    while (!condition) {
      sleep_prepare(chan);
      release(&lk);
      sleep();
      acquire(&lk);
    }
    ```

    and on the other side `acquire(&lk); make condition true; wakeup(chan); release(&lk);`.
    [[uartwrite]] uses a variant without a condition lock: it registers first and then
    tests the device; a wakeup arriving after the registration clears `p->chan`, so
    [[sleep]] returns at once.

    **The lost-wakeup problem.** If a process checked the condition, released the lock and
    only *then* registered on the channel, the event could happen in between: the waker
    calls `wakeup`, finds nobody on the channel, and the process then sleeps forever.

    xv6 closes the gap in two halves. [[sleep_prepare]] records the channel in `p->chan`
    *while the condition lock is still held*, so any wakeup that happens after the check
    finds the process registered. [[wakeup]] clears `p->chan`, even if the process has not
    gone to sleep yet, and [[sleep]] only sleeps if `p->chan` is still set. So a wakeup that
    arrives between `release(&lk)` and `sleep()` makes `sleep()` return at once instead of
    being lost.

    A wakeup means "something changed", not "the condition is true": several processes may
    be woken and only one may get the resource, and [[kkill]] wakes sleepers too. That is
    why callers re-check the condition in a `while` loop.

    This differs from the MIT xv6 book and older trees, where `sleep(chan, lk)` takes the
    condition lock as an argument. See [[concept:locks#sleep-wakeup]] and [[g:lost-wakeup]].

insn-amoswap:
  term: amoswap.w (atomic swap)
  kind: RISC-V instruction
  keys: [insn:amoswap.w, insn:amoswap.w.aq, insn:amoswap]
  short: >
    `amoswap.w rd, rs2, (rs1)` atomically loads the 32-bit word at address `rs1` into `rd`
    and stores `rs2` there, as one indivisible operation that no other hart can interleave
    with. The `.aq` suffix adds acquire ordering.
  body: |
    It belongs to the "A" (atomic) extension, included in `rv64gc`. xv6's [[acquire]] is the
    only place in the kernel that uses it (`amoswap.w.aq a5,a5,(s1)` in `kernel/kernel.asm`).
    With the `aq` bit set, no later memory operation of the same hart can be observed by
    other harts before the swap; see [[g:memory-barrier]].

compound-literal:
  term: compound literal
  kind: C
  short: >
    A C99 expression that creates an unnamed object on the spot: a type in parentheses
    followed by an initializer list, such as `(char *[]){"/init", 0}`, an array of two
    `char *` values.
  body: |
    It behaves like a variable you never had to name. Inside a function it has automatic
    storage, like a local variable: it exists until the enclosing block ends. xv6 uses one in
    [[forkret]] to build the `argv` array for [[kexec]] without declaring a separate array.

noff:
  term: noff
  kind: Concept
  short: >
    `mycpu()->noff`: how many [[push_off]] calls this hart has not yet undone with
    [[pop_off]]. Every spinlock held adds one, and [[myproc]] adds one for a moment. While it
    is above 0, interrupts on this hart are off.
  body: |
    It lives in `struct cpu` ([[kernel/proc.h:25]], offset 120), one per hart. Only the
    [[pop_off]] that brings it back to 0 may turn interrupts on, and only if [[g:intena]] says
    they were on before. [[sched]] insists it is exactly 1 (the process's own `p->lock`) at
    every context switch, and panics `sched locks` otherwise. The deepest value measured in
    this tree is 3. See [[concept:locks#noff]].

intena:
  term: intena
  kind: Concept
  short: >
    `mycpu()->intena`: whether interrupts (the `SIE` bit) were on just before this hart's
    outermost [[push_off]]. The last [[pop_off]] turns them back on only if it is 1.
  body: |
    It is recorded only when [[g:noff]] goes from 0 to 1, so it is 1 in a system call (after
    [[usertrap]] enabled interrupts) and 0 in interrupt handlers, in the scheduler and at
    boot. It belongs to the kernel thread, not to the hart: [[sched]] saves it across
    [[swtch]] and restores it, and the [[scheduler]] sets it to 0 after each switch back.
    When `noff` is 0 its value is stale and unused. See [[concept:locks#intena]] and
    [[concept:locks#sched-intena]].

push-off-pop-off:
  term: push_off / pop_off
  kind: Concept
  short: >
    The matched pair that turns interrupts off on this hart and counts how many times
    ([[push_off]]), and undoes one level, turning interrupts back on only at the outermost
    level and only if they were on before ([[pop_off]]). [[acquire]] and [[release]] call
    them.
  body: |
    [[push_off]] reads and clears `sstatus.SIE` in one `csrrci`, records the old value in
    [[g:intena]] if [[g:noff]] was 0, and increments `noff`. [[pop_off]] panics if
    interrupts are on (`pop_off - interruptible`) or `noff` is already 0 (`pop_off`),
    decrements `noff`, and sets SIE if it reached 0 and `intena` is 1. Besides the lock code,
    [[myproc]] and [[uartputc_sync]] call them. See [[g:interrupts-and-locks]] and
    [[concept:locks#noff]].

lock-order:
  term: lock order
  kind: Concept
  short: >
    The rule that locks are always acquired in one global order. "A before B" means some code
    holds A while acquiring B; if any other code held B while acquiring A, two harts could
    [[g:deadlock]].
  body: |
    In xv6: sleep-locks before spinlocks, a condition lock (`cons.lock`, `pi->lock`,
    `tickslock`, `log.lock`, `disk.vdisk_lock`, a sleep-lock's inner spinlock) before
    `p->lock`, and `wait_lock` before any `p->lock` (the comment at [[kernel/proc.c:23]]).
    `p->lock` is taken after almost everything; only `pid_lock`, `kmem.lock`, `ftable.lock`
    and `itable.lock` are ever taken while holding it: for a process slot being built, and
    (`kmem.lock` only) when [[kwait]] frees a zombie child under the child's lock. The graph, measured on a running system, is on
    [[concept:locks#order]].

sstatus-sie:
  term: SIE (sstatus bit 1)
  kind: RISC-V CSR
  short: >
    The global supervisor interrupt-enable bit, bit 1 of [[g:csr:sstatus|sstatus]]. With it
    0, a hart in supervisor mode takes no interrupts; they stay pending. Tours show it as
    `intr: on/off`.
  body: |
    A trap clears it (saving the old value in `SPIE`) and `sret` restores it. In xv6 it is
    cleared by [[push_off]]'s `csrrci` and by [[intr_off]], and set by [[pop_off]] (only at
    [[g:noff]] 0), [[usertrap]]'s [[intr_on]] for a system call, and the [[scheduler]]'s
    one-instruction window. Whenever `noff` is above 0, SIE is 0. In user mode, supervisor
    interrupts are taken whatever SIE says, and `wfi` wakes on a pending interrupt even with
    SIE 0. See [[concept:locks#sie]] and [[concept:locks#invariant]].

lost-wakeup:
  term: lost wakeup
  kind: Concept
  short: >
    The bug where a process decides to sleep because a condition is false, the event that
    makes it true happens before the process is actually asleep, and the [[wakeup]] finds
    nobody to wake, so the process sleeps forever.
  body: |
    xv6 prevents it with [[sleep_prepare]], which records the channel in `p->chan` while the
    caller still holds the lock that protects the condition, and with [[wakeup]], which clears
    `p->chan` even if the process has not gone to sleep yet. [[sleep]] only sleeps if
    `p->chan` is still set, so a wakeup that lands between `release` and `sleep()` makes
    `sleep()` return at once. See [[g:sleep-wakeup]] and [[concept:locks#sleep-wakeup]].
