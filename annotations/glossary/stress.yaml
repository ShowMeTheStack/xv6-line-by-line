# Glossary entries owned by the `stress` batch (grind.c, forktest.c, stressfs.c, logstress.c,
# forphan.c, dorphan.c). See STYLE.md for the format.

stress-test:
  term: stress test
  kind: Concept
  keys: []
  short: >
    A test that pushes the system hard (many processes at once, a full table, a long
    stream of operations) to expose bugs that ordinary use rarely triggers, such as races,
    leaks and exhausted limits. It usually checks that the system survives, not exact
    results.
  body: |
    Most kernel bugs that survive careful reading are timing bugs: a
    [[g:race-condition]] that needs two CPUs to be in exactly the wrong place, or a leak
    that matters only after thousands of operations. A stress test makes such events
    likely by running many operations concurrently and for a long time.

    Its success criterion is usually weak: the kernel did not [[panic]], did not hang,
    and a few simple invariants still hold (a newly created file can be written and has
    size 1, `wait` returns the right number of children). xv6's stress tests are
    [[user/grind.c]] (random system calls, forever), [[user/forktest.c]] (fill the
    process table), [[user/stressfs.c]] and [[user/logstress.c]] (concurrent file
    writers), and many tests in [[user/usertests.c]].

orphan-inode:
  term: orphaned inode
  kind: Concept
  keys: []
  short: >
    An inode that is still allocated on disk (its type is not 0) but has a link count of 0,
    so no directory entry leads to it. It is normal while a process still has the file
    open or as its current directory; after a crash it is garbage that
    [[ireclaim]] frees at the next boot.
  body: |
    Unix lets you delete (unlink) a file that is still open. Unlinking removes the name
    and drops the [[g:link-count]] to 0, but the [[g:inode]] and its data must stay until
    the last open [[g:file-descriptor]] or current-directory reference goes away, because
    a process may still read and write it. In xv6 the final [[iput]] (on `close`, on
    `exit`, or on `chdir` away) sees `nlink == 0` and `ref == 1`, truncates the file and
    marks the inode free.

    If the machine crashes, or QEMU is killed, before that final `iput`, the unlink is
    already safely on disk but the free never happens. The inode is then allocated but
    unreachable: an orphan, leaking an inode and its blocks forever. At boot,
    [[fsinit]] calls [[ireclaim]], which scans every on-disk inode for `type != 0` and
    `nlink == 0` and frees each one it finds. [[user/forphan.c]] (a file) and
    [[user/dorphan.c]] (a directory) create orphans on purpose so that
    [[test-xv6.py]] can crash xv6 and check that the next boot reclaims them.

randomized-testing:
  term: randomized testing
  kind: Concept
  keys: []
  short: >
    Testing by choosing operations (or their arguments) with a pseudo-random number
    generator instead of writing each case by hand, so that a long run tries many
    combinations and orders nobody thought to write down.
  body: |
    A hand-written test checks the situations its author imagined. A randomized test
    picks, at every step, one of many operations at random and runs millions of steps,
    so it also reaches odd sequences such as "unlink the file another process is writing,
    then create a directory with the same name". Because the generator is
    *pseudo*-random, a run is determined by its starting value (the seed): changing the
    seed gives a different sequence, and in principle reusing a seed repeats a run,
    although with several processes the interleaving of their calls still depends on
    timing.

    [[user/grind.c]] is xv6's randomized test: two processes each draw a number from a
    Park–Miller generator ([[do_rand]]) and perform one of 22 file-system, process or
    memory operations, forever. Randomized testing that feeds random or malformed
    *inputs* rather than random *operations* is usually called fuzzing.
