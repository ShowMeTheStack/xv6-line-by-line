# Glossary entries owned by the `memory` batch (riscv.h, memlayout.h, vm.c, vm.h, kalloc.c,
# types.h, param.h). See STYLE.md for the format.

# ============================================================ OS and hardware concepts

page:
  term: page
  kind: Concept
  short: >
    The unit in which xv6 manages memory: a block of 4096 bytes ([[PGSIZE]]) whose address
    is a multiple of 4096. The hardware translates addresses one page at a time, and the
    kernel allocates physical memory one page at a time.
  body: |
    Because a page starts on a multiple of 4096 (2^12), the low 12 bits of an address are
    the *offset* within its page and the remaining bits name the page. RISC-V calls the
    page number of a physical address its PPN (physical page number): the address shifted
    right by 12.

    [[PGROUNDDOWN]] gives the start of the page containing an address; [[PGROUNDUP]]
    rounds a size up to a whole number of pages. The physical pages that hold memory are
    handed out by the [[g:page-allocator]].

pte:
  term: PTE (page-table entry)
  kind: Concept
  short: >
    One 64-bit entry of a [[g:page-table]]. It holds a physical page number and permission
    flags; a *leaf* PTE maps one virtual page to one physical page, a non-leaf PTE points to
    the next-level page-table page.
  body: |
    Layout of an [[g:sv39|Sv39]] PTE (xv6's macros in [[kernel/riscv.h]]):

    | Bits | Name | Meaning |
    |---|---|---|
    | 0 | V ([[PTE_V]]) | valid: if 0, the hardware ignores the rest and any access faults |
    | 1 | R ([[PTE_R]]) | the page may be read |
    | 2 | W ([[PTE_W]]) | the page may be written |
    | 3 | X ([[PTE_X]]) | instructions may be fetched from the page |
    | 4 | U ([[PTE_U]]) | user mode may access the page (and supervisor mode, by default, may not) |
    | 5 | G | global mapping (xv6 never sets it) |
    | 6 | A | accessed (set by hardware, see [[g:svadu]]) |
    | 7 | D | dirty: written (set by hardware) |
    | 9–8 | RSW | reserved for the operating system's own use (xv6 does not use them) |
    | 53–10 | PPN | physical page number: the physical address shifted right by 12 |
    | 63–54 | | reserved for extensions; xv6 leaves them 0 |

    A PTE with V = 1 and R = W = X = 0 is not a mapping at all: it points to the next level
    of the page table. Any of R, W, X set makes it a leaf. [[PA2PTE]] and [[PTE2PA]] convert
    between a physical address and the PPN field; [[PTE_FLAGS]] extracts bits 9–0.

sv39:
  term: Sv39
  kind: Concept
  short: >
    The RISC-V paging scheme xv6 uses: 39-bit virtual addresses translated through a
    three-level tree of [[g:page-table]] pages, each a 4096-byte array of 512 [[g:pte|PTEs]].
  body: |
    A virtual address is split into five fields:

    ```
     63      39 38    30 29    21 20    12 11         0
    +----------+--------+--------+--------+------------+
    |  unused  | L2 idx | L1 idx | L0 idx |   offset   |
    +----------+--------+--------+--------+------------+
       25 bits   9 bits   9 bits   9 bits    12 bits
    ```

    Bits 63–39 must be copies of bit 38; xv6 keeps bit 38 at 0 ([[MAXVA]]), so they are 0.
    To translate, the hardware:

    1. takes the root page-table page from [[g:csr:satp|satp]] and reads entry *L2 idx*;
    2. if that PTE is valid and not a leaf, reads entry *L1 idx* of the page it points to;
    3. does the same with *L0 idx* at the last level, which yields a leaf PTE;
    4. checks the leaf's permission bits against the access, and forms the physical address
       as the leaf's PPN × 4096 + offset.

    An invalid PTE at any level, or a permission mismatch, raises a [[g:page-fault]]. Each
    index is 9 bits because 2^9 = 512 eight-byte PTEs fill exactly one page. Sv39 also
    allows leaves at the upper levels (2 MiB and 1 GiB "superpages"); xv6 never creates
    them. The translated results are cached in the [[g:tlb]]. xv6's [[walk]] performs the
    same steps in software.

page-fault:
  term: page fault
  kind: Concept
  short: >
    An [[g:exception]] raised when an address cannot be translated, or its [[g:pte]] forbids
    the access. RISC-V has three kinds: instruction (cause 12), load (13) and store/AMO (15);
    [[g:csr:stval|stval]] holds the faulting virtual address.
  body: |
    In xv6, [[usertrap]] handles load and store page faults from user programs by calling
    [[vmfault]], which allocates the page if it belongs to memory the process grew lazily
    (with `sbrklazy`). Any other user page fault kills the process. A page fault inside the
    kernel is a bug: [[kerneltrap]] panics.

direct-map:
  term: direct map
  kind: Concept
  short: >
    xv6's kernel page table maps RAM and device registers at virtual addresses equal to
    their physical addresses. So with paging on, the kernel can still use a physical
    address (from [[kalloc]], or found in a [[g:pte]]) directly as a pointer.
  body: |
    [[kvmmake]] builds the direct map: everything from [[KERNBASE]] (`0x80000000`) to
    [[PHYSTOP]], plus the UART, virtio and PLIC registers. The exceptions are the
    [[TRAMPOLINE]] page and the per-process kernel stacks, mapped at high virtual addresses
    that do not match their physical ones.

    This is what lets [[walk]] follow page-table pointers, which are physical addresses,
    and what lets [[copyin]] and [[copyout]] reach a user page through its physical
    address.

guard-page:
  term: guard page
  kind: Concept
  short: >
    A page left inaccessible next to a stack, so that a stack that grows too far causes a
    [[g:page-fault]] instead of silently overwriting whatever lies beyond it.
  body: |
    xv6 has two kinds. Each kernel stack ([[KSTACK]]) has an *unmapped* page below it in the
    kernel page table; overflowing into it makes the kernel fault and eventually panic
    (not cleanly: the trap handler's own register saves spill into the next stack down
    first). Each user stack has a
    page below it whose [[g:pte]] is valid but has the U bit cleared ([[uvmclear]] in
    [[kexec]]), so a user-mode access faults and the process is killed.

page-allocator:
  term: page allocator
  kind: Concept
  short: >
    The part of the kernel that hands out free physical [[g:page|pages]] and takes them
    back: [[kalloc]] and [[kfree]] in [[kernel/kalloc.c]]. Every page table, user page,
    kernel stack, trapframe and pipe buffer comes from it.

address-space:
  term: address space
  kind: Concept
  short: >
    The set of virtual addresses a piece of code can use and what each one maps to, as
    defined by one [[g:page-table]]. Each xv6 process has its own; the kernel has one more,
    shared by all CPUs.
  body: |
    Switching [[g:csr:satp|satp]] switches the address space. The kernel runs on
    [[kernel_pagetable]]; the trampoline code in [[kernel/trampoline.S]] switches to a
    process's page table on the way to user mode and back to the kernel's on every trap.
    Because user memory is not mapped in the kernel's address space, the kernel reaches it
    by translating user addresses in software ([[copyin]], [[copyout]]).

user-memory-layout:
  term: user memory layout
  kind: Concept
  short: >
    How a process's virtual addresses are arranged: program text at 0, then data, a guard
    page, the stack and the heap; at the very top, the trapframe and trampoline pages.
  body: |
    ```
    MAXVA       0x4000000000  +---------------------------+
    TRAMPOLINE  0x3ffffff000  | trampoline code    R X    |  (not user-accessible)
    TRAPFRAME   0x3fffffe000  | trapframe          R W    |  (not user-accessible)
                              +---------------------------+
                              |        unmapped           |
                p->sz  ---->  +---------------------------+
                              | heap (sbrk)        R W U  |
                              +---------------------------+
                              | stack (USERSTACK)  R W U  |
                              | guard page         R W    |  (U cleared)
                              +---------------------------+
                              | data, bss          R W U  |
                              | text, rodata       R X U  |
                0             +---------------------------+
    ```

    `p->sz` is the size of everything from 0 up to the top of the heap. [[kexec]] builds
    the lower part; [[proc_pagetable]] maps the top two pages. See
    [[kernel/memlayout.h]].

# ============================================================ RISC-V instructions

insn-csrs:
  term: csrs / csrc (set / clear CSR bits)
  kind: RISC-V instruction
  keys: [insn:csrs, insn:csrc, insn:csrsi, insn:csrci]
  short: >
    `csrs csr, rs` sets in a [[g:csr]] the bits that are 1 in `rs`; `csrc csr, rs` clears
    them. Other bits are unchanged. The `i` forms (`csrsi`, `csrci`) take a 5-bit constant
    instead of a register.

insn-csrrc:
  term: csrrc (read and clear CSR bits)
  kind: RISC-V instruction
  keys: [insn:csrrc, insn:csrrci]
  short: >
    `csrrc rd, csr, rs` copies the old value of a [[g:csr]] into `rd` and clears the bits
    that are 1 in `rs`, as one instruction. `csrrci` takes a 5-bit constant instead of
    `rs`.

insn-fence:
  term: fence
  kind: RISC-V instruction
  keys: [insn:fence]
  short: >
    Orders memory and device accesses: every access of the kinds named before the comma
    that comes earlier in the program is seen by other harts and devices before every
    access of the kinds named after it that comes later. `fence iorw, iorw` orders all
    of them.

# ============================================================ C

static-inline:
  term: static inline
  kind: C
  short: >
    A function defined `static inline` in a header gets a private copy in every file that
    includes it, and the compiler is invited to paste its body into each caller instead of
    making a call. For xv6's one-instruction wrappers, a call becomes that one instruction.
