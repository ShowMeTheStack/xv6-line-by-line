# Glossary entries owned by the `usertests2` batch (user/usertests.c, second half).

test-harness:
  term: test harness
  kind: Concept
  keys: []
  short: >
    The code that runs a collection of tests: it picks which tests to run, runs each one in a
    controlled way, decides whether it passed, and reports the results. In xv6 the harness is
    the end of [[user/usertests.c]]: a table of test functions plus [[runtests]],
    [[drivetests]] and `main`.
  body: |
    A harness separates *what* is tested (the individual test functions) from *how* tests
    are run. That lets the same tests be run all at once, one at a time by name, or over
    and over, without changing the tests themselves.

    usertests's harness runs every test in a child process created with `fork`, so a test
    that crashes, is killed by the kernel, or deliberately ruins its own memory cannot
    take the harness down with it. The child's [[g:exit-status]] is the verdict: 0 means
    the test passed, anything else (1 from the test itself, or -1 when the kernel killed
    it) means it failed. Before and after the whole run, the harness also counts free
    memory pages ([[countfree]]), so a kernel that leaks memory fails even if every
    individual test passed.

    One level up, `test-xv6.py` is a harness for the harness: it boots xv6 in QEMU, types
    `usertests` at the shell and waits for the line `ALL TESTS PASSED`. The project's
    [[g:continuous-integration]] job runs it on every change.
