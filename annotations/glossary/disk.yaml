# Glossary entries owned by the `disk` batch (virtio_disk.c, virtio.h, bio.c, buf.h, log.c, fs.h).

block:
  term: block
  kind: Concept
  short: >
    The unit in which xv6's file system reads and writes the disk: 1024 bytes ([[BSIZE]]).
    Blocks are numbered from 0 at the start of the disk; block 1 is the superblock.
  body: |
    The disk device itself works in 512-byte *sectors*, so one xv6 block is two sectors;
    [[virtio_disk_rw]] converts a block number into a sector number by multiplying by 2.
    Everything above the driver (the [[g:buffer-cache]], the [[g:write-ahead-log|log]], the
    file system in [[kernel/fs.c]]) thinks only in blocks. How the 2000 blocks of `fs.img`
    are used is described under [[g:disk-layout]].

buffer-cache:
  term: buffer cache
  kind: Concept
  short: >
    A fixed set of in-memory copies of disk [[g:block|blocks]] ([[kernel/bio.c]]). Code that
    wants a block calls [[bread]], gets a locked [[buf]], uses it, and gives it back with
    [[brelse]]. A block is cached at most once, so the buffer's lock also serializes all
    processes that use that block.
  body: |
    xv6 has [[NBUF]] (30) buffers. They are kept on a list ordered by how recently they were
    released, so that when a new block is needed the least recently used free buffer is
    recycled. A buffer that the [[g:write-ahead-log|log]] has modified but not yet written
    home is *pinned* ([[bpin]]) so that it cannot be recycled and lose the change.

write-ahead-log:
  term: write-ahead log
  kind: Concept
  short: >
    A crash-safety technique: before changing any block in its real place on the disk, first
    write all the new block contents to a separate log area, then write a record saying "these
    changes are complete". Only then copy them to their real places. xv6's log is in
    [[kernel/log.c]].
  body: |
    After a crash, the recovery code looks at the log. If the "complete" record (xv6's log
    header with a non-zero count) is there, it copies the logged blocks to their places
    again, finishing the job; if not, it ignores the log, and none of the changes happened.
    Either way the disk ends up with all of a [[g:transaction]]'s changes or none of them.
    xv6's log is a *redo* log of whole blocks: it records new block contents, never old
    ones, and replaying it twice gives the same result as replaying it once.

transaction:
  term: transaction
  kind: Concept
  short: >
    A group of disk writes that must happen all together or not at all. In xv6 each file
    system operation that may modify the disk (usually one [[g:system-call|system call]])
    runs between [[begin_op]] and [[end_op]], and the writes of all such operations that
    overlap in time are committed to disk as one
    transaction.

crash-recovery:
  term: crash recovery
  kind: Concept
  short: >
    The work done at boot to bring the disk back to a consistent state after the machine
    stopped in the middle of updating it. In xv6 it is [[recover_from_log]], called from
    [[initlog]] before any file system call runs: it replays a committed but not yet
    installed [[g:transaction]] from the [[g:write-ahead-log|log]].

virtqueue:
  term: virtqueue
  kind: Concept
  short: >
    The shared-memory mechanism a [[g:virtio]] driver and device use to exchange requests:
    a table of descriptors (each naming a buffer in memory), an "available" ring where the
    driver lists requests for the device, and a "used" ring where the device lists the ones
    it has finished.
  body: |
    All three parts live in ordinary RAM that the driver allocates; the driver tells the
    device their physical addresses once, at initialization. After that, submitting a
    request is a matter of writing memory plus one write to a notify register, and
    completion is signalled by the device writing the used ring and raising an
    [[g:interrupt]]. This is the "split virtqueue" layout of the virtio 1.x specification.
    See [[kernel/virtio.h]] and [[kernel/virtio_disk.c]].

dma:
  term: DMA (direct memory access)
  kind: Concept
  short: >
    A device reading or writing RAM by itself, without the CPU copying each byte. The driver
    gives the device a *physical* address and a length; the device transfers the data and
    reports when it is done.
  body: |
    Because the device uses physical addresses and knows nothing of page tables, a driver
    must hand it physical addresses. In xv6 the kernel's own memory is mapped at virtual
    addresses equal to physical ones, so [[virtio_disk_rw]] can pass kernel pointers such as
    `b->data` directly. (On QEMU the "device" is software in QEMU that accesses the guest's
    RAM, but the driver sees the same behavior as with real DMA.)

disk-layout:
  term: disk layout (xv6 file system)
  kind: Concept
  short: >
    How xv6 divides the disk into regions: boot block, superblock, log, inode blocks, free
    bitmap, data blocks, in that order. [[mkfs:main|mkfs]] chooses the sizes and records them
    in the superblock; see [[kernel/fs.h]].
  body: |
    For the default `fs.img` ([[FSSIZE]] = 2000 blocks of 1024 bytes):

    | Blocks | Region |
    |---|---|
    | 0 | boot block (unused by xv6) |
    | 1 | superblock |
    | 2–32 | log: 1 header block + 30 data blocks |
    | 33–45 | inodes: 13 blocks, 16 inodes each |
    | 46 | free bitmap: 1 block, one bit per disk block |
    | 47–1999 | data blocks (1953) |
