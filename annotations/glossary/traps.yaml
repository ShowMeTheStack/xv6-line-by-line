# Glossary entries owned by the `traps` batch (trampoline.S, kernelvec.S, trap.c, syscall.c/h,
# sysproc.c, plic.c, defs.h). See STYLE.md for the format.

# ============================================================ OS and hardware concepts

trapframe:
  term: trapframe
  kind: Concept
  short: >
    A per-process page where the trap entry code saves all of a user program's registers
    when it enters the kernel, and from which they are restored on the way back. It also
    holds the few kernel values the entry code needs (kernel stack, page table, handler).
  body: |
    Each process has one, allocated by [[allocproc]] and pointed to by `p->trapframe`. The
    same physical page is visible at two addresses:

    - at [[TRAPFRAME]] (just below the [[g:trampoline]] page) in the process's own page
      table, which is where [[uservec]] and [[userret]] use it, because they run while the
      user page table is still (or already) installed;
    - at its ordinary [[g:direct-map|direct-mapped]] physical address in the kernel, which
      is how C code reaches it through `p->trapframe`.

    Its layout is [[kernel/proc.h:40|struct trapframe]]: four kernel fields (`kernel_satp`,
    `kernel_sp`, `kernel_trap`, `kernel_hartid`) plus `epc`, the saved user PC, followed by
    31 user registers. The
    assembly in [[kernel/trampoline.S]] uses the byte offsets written in the comments
    there, so the struct and the assembly must be changed together.

    The kernel also uses the trapframe to *talk to* the user program: system call arguments
    are read from its `a0`–`a5` slots, the call number from `a7`, and the return value is
    written into its `a0` slot ([[syscall]]).

trampoline:
  term: trampoline page
  kind: Concept
  short: >
    The one page of code ([[kernel/trampoline.S]]) that switches between a user page table
    and the kernel page table on every trap. It is mapped at the same virtual address,
    [[TRAMPOLINE]], in every page table, so the code keeps running while `satp` changes
    under it.
  body: |
    RISC-V's trap hardware does not change [[g:csr:satp|satp]]: a trap from user mode lands
    in the kernel with the *user* page table still installed. The handler's first
    instructions must therefore be mapped in the user page table, and after the instruction
    that switches to the kernel page table, the next instruction must be found at the same
    address in the kernel page table. Mapping one physical page at the same virtual address
    in both solves this.

    The page is mapped without `PTE_U`, so user code cannot read or run it; supervisor mode
    can. It sits at the very top of the usable virtual address range,
    `TRAMPOLINE = MAXVA - PGSIZE` = `0x3ffffff000`, so it never collides with user memory
    that grows up from address 0. The kernel maps it in [[kvmmake]]
    ([[kernel/vm.c:47]]); each process's page table gets it in [[proc_pagetable]]
    ([[kernel/proc.c:189]]).

syscall-number:
  term: system call number
  kind: Concept
  short: >
    The small integer that names which [[g:system-call]] a user program wants (1 = `fork`,
    5 = `read`, ...). The user stub puts it in register `a7` before `ecall`; the kernel
    uses it as an index into the table [[syscalls]].
  body: |
    The numbers are defined once, in [[kernel/syscall.h]], and that header is included by
    both sides: by [[kernel/syscall.c]] to build the dispatch table, and by the generated
    user stubs in `user/usys.S` ([[user/usys.pl]]), each of which is three instructions:

    ```
    li a7, SYS_fork
    ecall
    ret
    ```

    Because the number is the only thing that connects the two sides, user programs and
    the kernel must be built from the same `syscall.h`.

syscall-arguments:
  term: system call arguments
  kind: Concept
  short: >
    The values a user program passes to a [[g:system-call]]. They travel in registers
    `a0`–`a5`, are saved into the [[g:trapframe]] on entry, and the kernel reads them back
    with [[argint]], [[argaddr]] and [[argstr]]. The result goes back in `a0`.
  body: |
    A user program calls a system call stub like an ordinary C function, so the
    [[g:calling-convention]] has already put the arguments in `a0`, `a1`, ... The stub
    executes `ecall` without touching them; [[uservec]] saves them into the trapframe.

    Everything that arrives this way is untrusted. Integers can be anything, and pointers
    may point at memory the process does not own, at kernel memory, or nowhere. The kernel
    therefore never dereferences a user pointer directly: it copies data in and out with
    [[copyin]], [[copyinstr]] and [[copyout]], which translate the address through the
    process's own page table and fail if the address is not valid user memory.

device-interrupt:
  term: device interrupt
  kind: Concept
  short: >
    An [[g:interrupt]] raised by a device (the [[g:uart]] when a key is pressed, the disk
    when a request completes). On RISC-V it reaches the kernel as a *supervisor external
    interrupt* through the [[g:plic|PLIC]], which tells the kernel which device it was.
  body: |
    The path through xv6:

    1. The device signals the [[g:plic|PLIC]]. If that source is enabled for a hart's
       supervisor mode and its priority is above the hart's threshold ([[plicinithart]]),
       the PLIC raises the hart's external-interrupt line.
    2. The hart takes a [[g:trap]] with `scause` = `0x8000000000000009` once interrupts are
       enabled (see [[g:trap-cause]]).
    3. [[devintr]] asks the PLIC which device it was ([[plic_claim]]), calls that driver's
       handler ([[uartintr]] or [[virtio_disk_intr]]), then tells the PLIC it is done
       ([[plic_complete]]).

    Timer interrupts are not device interrupts in this sense: they come from the hart's
    own timer ([[g:sstc|Sstc]]), not through the PLIC.

trap-cause:
  term: trap cause (scause values)
  kind: Concept
  short: >
    The number the hardware writes into [[g:csr:scause|scause]] to say why a
    [[g:trap]] happened. Bit 63 is 1 for an [[g:interrupt]] and 0 for an
    [[g:exception]]; the low bits are the cause code.
  body: |
    The values xv6 tests for:

    | `scause` | Kind | Meaning | Handled in |
    |---|---|---|---|
    | `8` | exception | `ecall` from user mode (a system call) | [[usertrap]] |
    | `13` | exception | load page fault | [[usertrap]] (lazy allocation) |
    | `15` | exception | store/AMO page fault | [[usertrap]] (lazy allocation) |
    | `0x8000000000000005` | interrupt | supervisor timer interrupt | [[devintr]] |
    | `0x8000000000000009` | interrupt | supervisor external interrupt (from the PLIC) | [[devintr]] |

    Other exception codes include 2 (illegal instruction), 5 (load access fault),
    7 (store/AMO access fault) and 12 (instruction page fault). xv6 handles none of them:
    from user mode the process is killed, and in the kernel [[kerneltrap]] panics.

# ============================================================ RISC-V instructions

insn-sret:
  term: sret (return from supervisor mode)
  kind: RISC-V instruction
  keys: [insn:sret]
  short: >
    Returns from a [[g:trap]] handled in supervisor mode: the hart switches to the mode
    recorded in `sstatus.SPP` (user or supervisor) and jumps to the address in
    [[g:csr:sepc|sepc]].
  body: |
    In detail, `sret`:

    1. sets the privilege mode to `sstatus.SPP` (0 = user, 1 = supervisor), then sets `SPP`
       to 0 (user);
    2. copies `sstatus.SPIE` into `sstatus.SIE` (restoring the interrupt enable that was in
       force before the trap) and sets `SPIE` to 1;
    3. sets the program counter to `sepc`.

    It is the mirror image of what the hardware does on trap entry (save the mode in `SPP`,
    save `SIE` in `SPIE`, clear `SIE`, save the PC in `sepc`). xv6 also uses it to enter
    user mode for the first time, by filling `SPP`, `SPIE` and `sepc` itself
    ([[prepare_return]]).

insn-fence-i:
  term: fence.i
  kind: RISC-V instruction
  keys: [insn:fence.i]
  short: >
    Makes this hart's later instruction fetches see every store to memory that is already
    visible to this hart. Needed after writing code into memory (for example, after
    loading a program) and before running it.

insn-jalr:
  term: jalr (jump and link register)
  kind: RISC-V instruction
  keys: [insn:jalr]
  short: >
    `jalr rd, off(rs)` jumps to the address in register `rs` (plus `off`) and stores the
    address of the next instruction in `rd`. Written `jalr rs` alone, it uses `ra` as `rd`,
    so it is a call through a register.

# ============================================================ C idioms

function-pointer:
  term: function pointer
  kind: C idiom
  short: >
    A variable holding the address of a function, so that which function runs can be
    decided at run time. Declared like `uint64 (*f)(void)` ("f is a pointer to a function
    taking no arguments and returning uint64") and called as `f()`.
  body: |
    A function's name used without parentheses is its address, so `f = sys_fork;` stores a
    pointer and `f()` calls `sys_fork`. An array of function pointers is a common way to
    dispatch on a number, as [[syscalls]] does:

    ```c
    static uint64 (*syscalls[])(void) = { [SYS_fork] = sys_fork, ... };
    p->trapframe->a0 = syscalls[num]();
    ```

    A cast can turn an integer address into a function pointer, as
    [[forkret]] does to call [[userret]] at its [[g:trampoline]] address.

designated-initializer:
  term: designated initializer
  kind: C idiom
  short: >
    An array or struct initializer that names the element it sets, as in
    `[SYS_fork] = sys_fork` or `.x = 1`. Elements not named are set to zero, and the array
    is made long enough for the largest index given.
  body: |
    Designated initializers come from C99. They let a table be written in terms of
    symbolic indices, so that the order of the lines does not matter and a gap in the
    numbering leaves a zero (null) entry instead of shifting everything after it:

    ```c
    static char *names[] = { [3] = "three", [1] = "one" };  // names[0] and names[2] are 0
    ```
