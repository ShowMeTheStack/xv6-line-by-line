# Glossary entries for the stacks concept pages (annotations/concepts/01-stacks.md and
# 02-mode-stack-page-table.md). See STYLE.md for the format.

stack-pointer:
  term: stack pointer and the active stack
  kind: Concept
  short: >
    The address in a hart's [[g:reg:sp|sp]] register: the current top of the stack it is
    running on. Whichever memory `sp` points into is the hart's *active stack*. Function
    calls move `sp` within that stack; in xv6 only four instructions move it to a different
    one.
  body: |
    Each [[g:hart]] has its own `sp`. Apart from a few instructions at power-on and two short
    stretches in the trampoline ([[concept:stacks#none]]), each hart is on exactly one stack,
    and with three harts up to three stacks are in use at once. The four instructions that move
    `sp` to another stack are:

    | Instruction | Where | Switch |
    |---|---|---|
    | `add sp, sp, a0` | [[kernel/entry.S:17]] | nothing → [[g:boot-stack]], once per hart |
    | `ld sp, 8(a0)` | [[kernel/trampoline.S:76]] | user stack → [[g:kernel-stack]] (usable from line 92) |
    | `ld sp, 8(a1)` | [[kernel/swtch.S:26]] | kernel stack ↔ [[g:scheduler-stack]] |
    | `ld sp, 48(a0)` | [[kernel/trampoline.S:118]] | kernel stack → [[g:user-stack]] (usable once `sret`, line 153, returns to user mode) |

    Traps, `sret` and `mret` never change `sp`. Neither does [[kernelvec]], which pushes its
    frame onto the stack that is already active. See [[concept:stacks#switches]].

scheduler-stack:
  term: scheduler stack
  kind: Concept
  short: >
    The stack a hart's [[scheduler]] loop runs on. It is that hart's slice of [[stack0]], the
    same memory as its [[g:boot-stack]]: [[kernel:main]] calls `scheduler()`, which never
    returns, so the boot stack simply takes on a new role. It has no guard page.
  body: |
    Inside the loop, `sp` sits just below the frames of [[kernel:start]], [[kernel:main]] and
    [[scheduler]]: `0x80008810` on hart 0 in this build (`0x80009810` on hart 1, `0x8000a810`
    on hart 2). [[swtch]] saves that value in `cpus[i].context.sp` when the hart switches to
    a process, and loads it again when the process calls [[sched]]. `struct cpu` holds only
    this saved pointer, not the stack itself.

    Each hart only ever switches to its own scheduler stack, so no two harts share one. An
    interrupt taken in the loop's short interrupt window pushes a [[g:kernelvec-frame]] onto
    it; [[kerneltrap]] never yields there, because the hart has no current process.
    See [[concept:stacks#scheduler]].

boot-stack:
  term: boot stack (stack0)
  kind: Concept
  short: >
    The first stack each hart uses: its own 4096-byte slice of the array [[stack0]]
    ([[kernel/start.c:11]]), selected by [[kernel/entry.S:17]]. [[_entry]], [[kernel:start]]
    and [[kernel:main]] run on it, and it then becomes the hart's [[g:scheduler-stack]].
  body: |
    `stack0` is `4096 * NCPU` bytes in the kernel's `.bss`, at `0x80007890` in this build. Hart
    *h* starts with `sp = stack0 + (h + 1) * 4096`, the top of its slice: `0x80008890` for hart
    0, `0x80009890` for hart 1, `0x8000a890` for hart 2. The address is physical while paging
    is off, and stays valid after [[kvminithart]] turns paging on, because the kernel maps its
    data at the same virtual address ([[g:direct-map]]).

    There are no guard pages between or around the slices. A hart that overflowed its slice
    would silently overwrite the top of the slice below (where that hart keeps its
    `start`, `main` and `scheduler` frames) or, for hart 0, kernel variables such as
    [[ticks]]. See [[concept:stacks#boot]].

kernelvec-frame:
  term: kernelvec frame
  kind: Concept
  short: >
    The 256 bytes that [[kernelvec]] pushes onto the *current* stack when a trap happens in
    supervisor mode, holding 17 registers (`ra`, `gp`, and the temporary and argument registers) while
    [[kerneltrap]] runs. xv6 has no
    separate interrupt stack.
  body: |
    The frame lands on whatever stack was active: a process's [[g:kernel-stack]] (an
    interrupt during a system call) or the hart's [[g:scheduler-stack]] (an interrupt in the
    scheduler's interrupt window). It holds `ra`, `gp`, `t0`–`t2`, `a0`–`a7` and `t3`–`t6`;
    the slots for `sp`, `tp` and `s0`–`s11` stay unused.

    If the trap was a timer interrupt and the hart has a current process, [[kerneltrap]]
    calls [[yield]], and the process is suspended with the frame in the middle of its kernel
    stack. It may be resumed on another hart, which is why `kernelvec` does not restore `tp`
    ([[kernel/kernelvec.S:44]]). Handlers run with interrupts off, so in normal operation a
    stack holds at most one such frame. See [[concept:stacks#same]].

save-area:
  term: save area
  kind: Concept
  short: >
    A fixed place where registers are kept while their owner is not running: the
    [[g:trapframe]], `p->context`, `cpus[i].context` and the `sscratch` register. Unlike a
    stack it has no frames and nothing is pushed or popped; each save overwrites the last.
  body: |
    | Save area | Holds | Saved by | Restored by |
    |---|---|---|---|
    | trapframe | a user program's registers and `pc` | [[uservec]], [[usertrap]] | [[userret]] |
    | `p->context` | a suspended kernel thread's `ra`, `sp`, `s0`–`s11` | [[swtch]] in [[sched]] | [[swtch]] in [[scheduler]] |
    | `cpus[i].context` | the scheduler's `ra`, `sp`, `s0`–`s11` | [[swtch]] in [[scheduler]] | [[swtch]] in [[sched]] |
    | [[g:csr:sscratch|sscratch]] | the user's `a0`, briefly | [[kernel/trampoline.S:32]] | [[kernel/trampoline.S:72]] |

    Some of them hold a value of `sp` (a pointer *into* a stack), but none of them is one.
    See [[concept:stacks#save-areas]].
