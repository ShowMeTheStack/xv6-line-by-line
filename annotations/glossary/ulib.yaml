# Glossary entries owned by the `ulib` batch (ulib.c, printf.c, umalloc.c, user.h, usys.pl,
# usys.S, user.ld). See STYLE.md for the format.

syscall-stub:
  term: system call stub
  kind: Concept
  keys: []
  short: >
    A tiny assembly function, one per [[g:system-call]], that a user program calls like any
    C function. In xv6 each stub is three instructions: put the
    [[g:syscall-number|system call number]] in `a7`, execute `ecall` to enter the kernel,
    and `ret` to the caller with the kernel's result in `a0`.
  body: |
    C cannot express "trap into the kernel", so the boundary between a user program and the
    kernel is crossed in assembly. xv6 generates all its stubs with the Perl script
    [[user/usys.pl]]; the output is `user/usys.S`, for example:

    ```
    write:
     li a7, SYS_write   # 16, from kernel/syscall.h
     ecall              # trap into the kernel
     ret                # back to the C caller; a0 holds the result
    ```

    The stub does not touch the arguments. The C [[g:calling-convention]] has already put
    them in `a0`, `a1`, ... before the call, and that is exactly where the kernel looks for
    them ([[g:syscall-arguments]]). On the kernel side, [[kernel:syscall]] reads `a7` from
    the [[g:trapframe]], calls the matching `sys_` function, and stores its return value in
    the saved `a0`, which the stub's `ret` hands back to the caller.

    Real C libraries work the same way, though their stubs usually also convert the
    kernel's error return into the `errno` variable. xv6 has no `errno`: a failing call
    returns -1 and the program learns nothing more.

c-runtime-start:
  term: C runtime start-up code
  kind: Toolchain
  keys: []
  short: >
    The code that runs before `main` in a user program and calls it. It receives the
    arguments the kernel set up, calls `main(argc, argv)`, and passes `main`'s return value
    to `exit`. In xv6 this is the function [[user:start]] in [[user/ulib.c]].
  body: |
    A C program's life does not begin in `main`. The operating system starts a program at
    its [[g:entry-point]], an address recorded in the [[g:elf]] header, and something there
    has to turn the raw starting state (registers, a stack) into an ordinary call to `main`,
    and has to deal with `main` returning, which the kernel knows nothing about.

    On Linux this is the file `crt0.o` or `crt1.o` ("C runtime"), whose entry symbol is
    `_start`, and it does much more: it sets up the C library, the environment variables
    and `atexit` handlers. xv6 needs only the essentials, written in C:

    ```c
    void start(int argc, char **argv) { exit(main(argc, argv)); }
    ```

    [[kernel:kexec]] puts `argc` in `a0` and `argv` in `a1`, so by the
    [[g:calling-convention]] they arrive as `start`'s two parameters. [[user/user.ld]] names
    no entry symbol, and GNU `ld` then picks the symbol called `start`.

heap:
  term: heap
  kind: Concept
  keys: []
  short: >
    The region of a process's memory from which `malloc` hands out blocks whose lifetime
    the program controls (until `free`). In xv6 it lies above the stack and grows upward
    when [[user:malloc]] asks the kernel for more with `sbrk`.
  body: |
    A program's memory has three kinds of storage: global variables (fixed size, decided
    when the program is linked), local variables on the [[g:stack]] (released when the
    function returns), and the heap, for data whose size or lifetime is known only while
    the program runs, such as the parse tree that [[user/sh.c]] builds for each command.

    The kernel knows nothing about individual heap blocks. It only tracks one number per
    process, its size `p->sz`; everything between the end of the stack and `p->sz` is the
    heap (see [[g:user-memory-layout]]). `sbrk(n)` moves that end up by `n` bytes and
    returns the old end. The user-level allocator in [[user/umalloc.c]] carves those bytes
    into blocks, keeps freed blocks on a [[g:free-list-allocator|free list]] for reuse,
    and never gives memory back to the kernel.

free-list-allocator:
  term: free-list allocator
  kind: Concept
  keys: []
  short: >
    A memory allocator that keeps the unused blocks of its memory on a linked list, with
    the list's links and each block's size stored in a small header inside the free blocks
    themselves. `malloc` searches the list for a big enough block; `free` puts a block back.
  body: |
    xv6 has two:

    - The kernel's [[g:page-allocator]] ([[kernel/kalloc.c]]) is the simplest possible
      case: every block is one 4096-byte [[g:page]], so any free block fits any request and
      the list needs no sizes and no ordering.
    - The user library's [[user:malloc]] ([[user/umalloc.c]]) is the classic allocator from
      Kernighan and Ritchie's *The C Programming Language*. Blocks have any size (in 16-byte
      units). The list is circular and sorted by address. `malloc` takes the first block
      that is big enough, cutting the request off its end if it is bigger; `free` puts the
      block back in address order and merges it with a free neighbor directly before or
      after it, so that freed memory does not stay split into ever smaller pieces
      (*fragmentation*). When nothing fits, the allocator asks the kernel for more memory
      with `sbrk`.

    Because the bookkeeping lives inside the memory it manages, a program that writes past
    the end of a `malloc`ed block, or frees a block twice, damages the list, and the
    failure usually shows up much later, somewhere else.
