# Glossary entries owned by the `files` batch (sysfile.c, exec.c, elf.h, pipe.c).

file-descriptor:
  term: file descriptor
  kind: Concept
  keys: []
  short: >
    A small non-negative integer that a process uses to name one of its open files: the `fd`
    in `read(fd, buf, n)`. It is an index into the process's own table of
    [[g:open-file|open files]], `p->ofile`, which has 16 slots in xv6 ([[NOFILE]]).
  body: |
    Descriptors are per process: descriptor 3 in one process and descriptor 3 in another can
    name entirely different files. By convention 0 is standard input, 1 standard output and
    2 standard error; in xv6 all three start out as the [[g:console]], opened by `/init` and
    inherited by every process after it.

    A new descriptor is always the lowest free number ([[fdalloc]]). `fork` copies the
    whole table, so parent and child share the same open files ([[filedup]]); `exec` keeps
    it unchanged, so a program inherits the descriptors of the program that ran it. The
    shell builds redirections and pipelines from these rules: close descriptor 1, then
    `open` or `dup` something, and it lands in slot 1.

    The same descriptor can refer to a file on disk, a device such as the console, or one
    end of a [[g:pipe]]; `read` and `write` work the same way on all of them.

open-file:
  term: open file (struct file)
  kind: Concept
  keys: []
  short: >
    The kernel's record of one opening of a file, pipe or device: what it refers to, whether
    it may be read or written, and the current read/write offset. In xv6 it is a
    `struct file` in the system-wide table `ftable` ([[NFILE]] = 100 entries).
  body: |
    A [[g:file-descriptor]] points at an open file, and several descriptors can point at the
    same one: after `dup`, or in a parent and child after `fork`. They then share one offset.
    Each write to a file reads and advances that offset while holding the file's inode
    lock, so a parent and child writing through the same inherited descriptor append after
    each other instead of overwriting each other. (A very large write is split into pieces
    of about 3 KB, which may interleave.) The open file's `ref` field counts these pointers
    ([[g:reference-count]]); [[fileclose]] really closes it only when the count drops to
    zero.

    `type` says what kind of object is behind it: `FD_INODE` (a file or directory on disk,
    with an [[g:inode]] and an `off`set), `FD_DEVICE` (a device, with a `major` number that
    selects the driver in [[devsw]]), or `FD_PIPE` (one end of a [[g:pipe]]). See
    [[kernel/file.h]] and [[kernel/file.c]].

pipe:
  term: pipe
  kind: Concept
  keys: []
  short: >
    A one-way channel for bytes between processes: what one process writes into one end,
    another reads from the other end, in the same order. Created by the `pipe` system call,
    which returns two [[g:file-descriptor|file descriptors]], one per end.
  body: |
    In xv6 a pipe is a 512-byte buffer inside the kernel ([[kernel/pipe.c]]). A writer that
    finds it full sleeps until a reader makes room; a reader that finds it empty sleeps
    until a writer adds data. When every write end has been closed, a reader that has
    drained the buffer gets end-of-file (`read` returns 0); when every read end has been
    closed, `write` fails.

    The shell uses pipes for `a | b`: it creates a pipe, forks twice, and in each child
    moves one end onto standard output (for `a`) or standard input (for `b`) before
    `exec`, so neither program needs to know it is talking to a pipe ([[user/sh.c]]).

program-header:
  term: program header (segment)
  kind: Toolchain
  keys: []
  short: >
    An entry in an [[g:elf]] executable's table of *segments*. Each one says: take `filesz`
    bytes from this offset in the file, place them at this virtual address, reserve `memsz`
    bytes of memory in total (the rest zero-filled), with these permissions. In xv6 it is
    [[proghdr]].
  body: |
    The loader ([[kexec]] in xv6) only needs the program headers, not the finer-grained
    *section* headers that linkers and debuggers use. An xv6 user program has two loadable
    segments: code plus read-only data (readable and executable) at address 0, and data
    plus bss (readable and writable) at the next page boundary (all except `_forktest`,
    which is linked without `user.ld` and has a single read-write-execute segment). You can list them with
    `${TOOLPREFIX}readelf -l user/_cat` (`TOOLPREFIX` is your RISC-V toolchain's prefix; see [[tour:1]]).

exec:
  term: exec
  kind: Concept
  keys: []
  short: >
    The system call that replaces the calling process's program with a new one read from a
    file. The process keeps its PID, its open files and its current directory; its memory,
    registers and name are replaced, and it starts running the new program from the
    beginning.
  body: |
    `exec(path, argv)` does not return if it succeeds: the code that called it no longer
    exists. If it fails (no such file, not an executable, out of memory), it returns -1 and
    the old program continues. Unix creates new programs by combining `fork`, which
    duplicates a process, with `exec` in the child; the gap between the two is where the
    shell sets up redirections and pipes.

    In xv6 the work is split between [[sys_exec]], which copies the arguments into the
    kernel, and [[kexec]] in [[kernel/exec.c]], which builds the new memory image.

argv:
  term: argc and argv (program arguments)
  kind: Concept
  keys: []
  short: >
    The arguments a program receives in `main(int argc, char *argv[])`: `argc` is how many
    there are and `argv` an array of pointers to the argument strings, ended by a null
    pointer. By convention `argv[0]` is the program's own name.
  body: |
    When you type `echo hi`, the shell calls `exec("echo", argv)` with `argv` = `{"echo",
    "hi", 0}`. The kernel ([[kexec]]) copies the strings and the pointer array onto the new
    program's [[g:user-stack]] and starts the program with `argc` in register `a0` and the
    address of the array in `a1`, which is exactly where the RISC-V
    [[g:calling-convention]] puts the first two arguments of a function. xv6 allows at most
    [[MAXARG]] - 1 = 31 arguments.

user-stack:
  term: user stack
  kind: Concept
  keys: []
  short: >
    The [[g:stack]] a user program runs on, in its own memory. In xv6 it is [[USERSTACK]]
    (1) page of 4096 bytes, placed right above the program's code and data, with an
    inaccessible [[g:guard-page]] below it to catch overflow.
  body: |
    [[kexec]] creates it, copies the program's argument strings and [[g:argv]] array to its
    top, and sets the saved `sp` to point at `argv`. The stack does not grow: a program
    whose stack needs more than the page runs into the guard page and is killed. (The
    guard is only one page: a single stack frame larger than 4 KiB can jump over it and
    land in the program's data.) It is
    separate from the [[g:kernel-stack]] the kernel uses while handling the process's
    system calls and traps. See [[g:user-memory-layout]].

    The stack is mapped only in the process's own page table. A single instruction moves `sp`
    onto it, [[userret]]'s `ld sp, 48(a0)` ([[kernel/trampoline.S:118]]), but the hart can use
    it only from the `sret` at [[kernel/trampoline.S:153]], when the mode becomes user
    (supervisor code cannot use user pages). It stops being usable at the next trap, which
    returns to supervisor mode, and [[uservec]] then saves the user's `sp` in the trapframe
    and loads the kernel stack's address ([[kernel/trampoline.S:76]]). [[kfork]] copies it along
    with the rest of user memory ([[uvmcopy]]); it is freed by [[freeproc]] when the
    parent's [[kwait]] collects the process. See [[concept:stacks#user]].
