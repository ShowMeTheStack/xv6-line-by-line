# Glossary entries owned by the `fs` batch (fs.c, file.c, file.h, stat.h, fcntl.h).

inode:
  term: inode
  kind: Concept
  short: >
    The file system's record for one file, directory or device: its type, size,
    [[g:link-count|link count]] and the list of disk blocks holding its content. An inode
    has a number but no name; names live in [[g:directory|directories]].
  body: |
    xv6 has two forms of every inode. The on-disk form, [[g:dinode]], sits in the inode
    blocks of the disk. The in-memory form, `struct` [[inode@kernel/file.h]], is a copy the
    kernel keeps in [[itable]] while the inode is in use, with extra bookkeeping: a
    [[g:reference-count]] (`ref`), a `valid` flag saying whether the copy has been read
    from disk, and a [[g:sleeplock]].

    The usual way to use one is

        ip = iget(dev, inum);   // or namei(path), dirlookup(...)
        ilock(ip);              // lock, and read from disk if needed
        ... use or change ip->size, ip->type, the content ...
        iunlock(ip);
        iput(ip);               // drop the reference

    See [[kernel/fs.c]] for the functions and the rules about which lock protects what.

dinode:
  term: dinode (on-disk inode)
  kind: Concept
  short: >
    The 64-byte form in which an [[g:inode]] is stored on the disk: type, device numbers,
    link count, size, and 13 block addresses. 16 of them fit in one 1024-byte block.
  body: |
    Defined as `struct` [[dinode]] in [[kernel/fs.h]]. Inode number *i* lives in block
    `i / 16 + sb.inodestart` ([[IBLOCK]]), at slot `i % 16`. A `type` of 0 means the
    inode is free. The kernel copies a dinode into the in-memory `struct inode` in
    [[ilock]] and back out in [[iupdate]].

superblock:
  term: superblock
  kind: Concept
  short: >
    Block 1 of the disk, which describes the file system as a whole: its size in blocks,
    the number of inodes, and where the log, the inode blocks and the
    [[g:free-bitmap]] start. It also holds a magic number identifying an xv6 file system.
  body: |
    Written once by [[mkfs/mkfs.c]] when `fs.img` is built, read once at boot by
    [[readsb]] into the global [[sb]], and never changed. See [[g:disk-layout]] for the
    values on the default disk.

free-bitmap:
  term: free bitmap
  kind: Concept
  short: >
    A region of the disk with one bit per [[g:block]]: 1 if the block is in use, 0 if it is
    free. [[balloc]] finds a 0 bit and sets it to allocate a block; [[bfree]] clears it.
  body: |
    One 1024-byte bitmap block has 8192 bits ([[BPB]]), so the 2000-block default disk
    needs a single bitmap block. Block *b*'s bit is bit `b % 8` of byte `(b % 8192) / 8` in
    bitmap block `b / 8192 + sb.bmapstart` ([[BBLOCK]]). The bits for the boot block,
    superblock, log, inode blocks and the bitmap itself are set by [[mkfs/mkfs.c]], so they
    are never allocated.

directory:
  term: directory
  kind: Concept
  short: >
    An [[g:inode]] of type `T_DIR` whose content is a list of 16-byte entries, each pairing
    a name (up to 14 characters) with an [[g:inode-number]]. Looking a name up in a
    directory gives the number of the inode it names.
  body: |
    The entry format is `struct` [[dirent]] in [[kernel/fs.h]]. An entry whose inode
    number is 0 is an unused slot. Every directory contains `.` (itself) and `..` (its
    parent); in the root directory both refer to the root, inode 1. [[dirlookup]] searches
    a directory and [[dirlink]] adds an entry.

path-name:
  term: path name
  kind: Concept
  short: >
    A string such as `/a/b/c` or `b/c` naming a file by the [[g:directory|directories]]
    that lead to it. A leading `/` starts the search at the root directory; otherwise it
    starts at the process's current directory.
  body: |
    Each piece between slashes is an *element*. [[namex]] resolves a path by looking up
    each element in turn, using [[skipelem]] to split it. Repeated and trailing slashes are
    ignored, and elements longer than 14 characters are cut to their first 14.

indirect-block:
  term: indirect block
  kind: Concept
  short: >
    A disk block that holds no file data, only a list of 256 more block numbers. It lets an
    inode, which has room for 12 block addresses, describe files of up to 268 blocks.
  body: |
    The 13th address in an inode, `addrs[12]` (index [[NDIRECT]]), points to the indirect
    block. Its 1024 bytes are read as 256 `uint` block numbers ([[NINDIRECT]]), for the
    file's blocks 12 to 267. [[bmap]] allocates it the first time a file grows past 12
    blocks, and [[itrunc]] frees it.

link-count:
  term: link count (nlink)
  kind: Concept
  short: >
    The number of [[g:directory]] entries that name an [[g:inode]], stored on disk in the
    inode's `nlink` field. A file created once has 1; the `link` system call adds names,
    `unlink` removes them.
  body: |
    It is a different count from the in-memory [[g:reference-count]]. A file's space is
    freed only when *both* are zero: no name leads to it and no one has it open. That is
    why a file removed with `rm` while another process reads it keeps working until it is
    closed. In xv6, a directory's `nlink` also counts the `..` entries of its
    subdirectories (but not its own `.`).

inode-number:
  term: inode number
  kind: Concept
  short: >
    The index of an [[g:inode]] in the disk's inode area, which identifies a file within
    the file system. Directory entries store inode numbers; inode 1 is the root directory
    and inode 0 is never used.
  body: |
    Called `inum` in the code. Given the number, the kernel can compute where the inode
    lives on disk with [[IBLOCK]]. `fstat` reports it to user programs as `ino` in
    `struct stat`.

reference-count:
  term: reference count
  kind: Concept
  short: >
    A counter of how many pointers to a shared object exist; the object can be reused or
    freed only when the count drops to zero. xv6 counts references to in-memory inodes
    (`ip->ref`), to open files (`f->ref`) and to cached blocks.
  body: |
    The pattern always has three parts: something that takes a reference and increments
    the count ([[iget]], [[idup]], [[filedup]]), something that drops one and decrements
    it ([[iput]], [[fileclose]]), and a lock that makes the count's updates atomic. Forgetting
    a decrement leaks the object; an extra decrement frees it while it is still in use.
