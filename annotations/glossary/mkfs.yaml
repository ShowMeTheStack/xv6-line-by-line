# Glossary entries owned by the `mkfs` batch (mkfs/mkfs.c, README, LICENSE, test-xv6.py,
# .gdbinit.tmpl-riscv, .github/workflows/test.yml and the editor dotfiles).

byte-order:
  term: byte order (endianness)
  kind: Concept
  short: >
    The order in which the bytes of a multi-byte number are stored in memory or on disk.
    *Little-endian* machines store the least significant byte first (at the lowest
    address); *big-endian* machines store the most significant byte first. xv6 on RISC-V is
    little-endian.
  body: |
    The 4-byte number `0x10203040` is stored as the bytes `40 30 20 10` on a little-endian
    machine and `10 20 30 40` on a big-endian one. Inside one program this never matters:
    the CPU reads back what it wrote. It matters as soon as bytes travel between machines,
    for example a disk image written by one computer and read by another.

    [[mkfs/mkfs.c]] runs on your computer but writes numbers that the RISC-V kernel will
    read, so it converts them with [[mkfs:xint]] and [[mkfs:xshort]], which always produce
    the little-endian layout. Almost every computer you are likely to build on (x86-64,
    64-bit ARM) is little-endian too, so on them these functions change nothing.

continuous-integration:
  term: continuous integration (CI)
  kind: Toolchain
  short: >
    A service that automatically builds and tests a project every time someone pushes a
    change, on fresh machines, so that a change that breaks the build or a test is noticed
    at once. xv6 uses GitHub Actions, configured in [[.github/workflows/test.yml]].
  body: |
    A CI configuration lists *jobs*; each job names a kind of machine to run on and a
    sequence of steps (shell commands). If any command exits with a non-zero status the
    job fails, and GitHub marks the commit or pull request with a red cross. xv6's jobs
    build the kernel and `fs.img` on Linux and macOS, check the formatting, and on Linux run
    [[test-xv6.py]], which boots xv6 in QEMU and runs `usertests` and the crash tests.

gdb:
  term: gdb (the GNU debugger)
  kind: Toolchain
  short: >
    A debugger: a program that lets you stop another program, step through it line by line
    or instruction by instruction, set breakpoints, and inspect registers and memory. For
    xv6 you run a RISC-V-capable gdb (`${TOOLPREFIX}gdb`, with your RISC-V
    toolchain's prefix, or `gdb-multiarch`) on your
    computer and connect it to QEMU with `make qemu-gdb`.
  body: |
    QEMU contains a small *gdb stub*: with the `-gdb tcp::PORT` option it listens on a TCP
    port and lets gdb control the emulated machine through gdb's remote protocol. gdb then
    sees the emulated harts as threads, can stop them anywhere, even in the kernel's first
    instruction, and uses the symbols and line numbers in `kernel/kernel` (compiled with
    `-ggdb`) to show you C source. The commands gdb runs at start-up come from `.gdbinit`,
    generated from [[.gdbinit.tmpl-riscv]] by the Makefile ([[Makefile:185]]).

    A few commands to start with: `b kvminithart` (breakpoint on a function), `c`
    (continue), `si` (step one instruction), `n` (next C line), `info registers`, `x/4x
    ADDR` (show memory), `bt` (stack backtrace).

static-assert:
  term: static_assert
  kind: C
  short: >
    A check done by the compiler, not at run time: `static_assert(condition, "message")`
    stops the compilation with the message if the constant condition is false. Standard
    since C11 (as `_Static_assert`; `<assert.h>` defines the name `static_assert`). Since
    C23, `static_assert` is itself a keyword.
  body: |
    Compare `assert(condition)` from `<assert.h>`, which checks when the program runs and
    aborts it if the condition is false. A static assertion costs nothing at run time and
    catches the problem before the program can produce wrong output, but it only works for
    conditions the compiler can evaluate, such as `sizeof(int) == 4`.
    [[mkfs/mkfs.c]] uses one, and carries a fallback macro that is used wherever
    `static_assert` is not already defined as a macro: with pre-C11 compilers, and with
    GCC in C23 mode on glibc, where it is a keyword and not a macro.
