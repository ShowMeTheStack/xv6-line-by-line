published: true
title: Atomic rename
area: File system
stars: 4
branch: ext/24-rename
prerequisites: {tours: [17, 18, 31, 32, 33, 34, 35, 51], concepts: [locks]}
summary: |
  xv6 has no way to rename a file. You can `ln old new` and then `rm old`, which is how
  early Unix `mv` worked, but that is two system calls and two [[g:transaction|transactions]],
  and it cannot move a directory at all. In this lab you add `rename(old, new)`: one system
  call that moves a name within a directory or between directories, replaces an existing
  file in the same step, and moves whole directories, all inside one transaction of the
  [[g:write-ahead-log|log]].

  Each piece of the job looks small: write one directory entry, clear another, fix a link
  count. The questions come from doing them together. A crash between two steps must not
  leave both names, or neither. Two directories must be locked at once, and the tree's
  existing rule, parent before child, says nothing about two directories that are not
  related: what order do you pick, and what does your choice do to the code that already
  locks inodes? How do you notice that someone is moving a directory into its own subtree,
  when xv6 keeps no parent pointers in memory? And does all of it fit in the ten blocks a
  transaction may write?

  The reference solution is six commits. It survived 30 random kills of QEMU in the middle
  of renaming, with the file system consistent every time, and it never deadlocked on three
  harts under a load that, with the race window widened, deadlocked both obvious
  alternatives.
learn:
  - "Why one transaction is the unit of atomicity on disk, what it costs (the number of distinct blocks one rename can dirty), and how to check that against `MAXOPBLOCKS` by counting rather than guessing."
  - "How to order locks that the existing order does not cover, and how to check a proposed order against every piece of code that already nests the same locks, including code you did not touch."
  - "How to ask a question about the shape of the directory tree (is this directory above that one?) without breaking the lock order, and what has to stay frozen while you ask it."
  - "Why work done without a lock must be checked again once the lock is held, and what the check has to compare."
  - "What a directory carries besides its name: its `..` entry and the link it adds to its parent, and what breaks, sometimes much later, when one of them is wrong."
  - "How a sleep-lock deadlock looks on a live machine: processes asleep holding each other's locks, idle harts, and a file system that soon stops for everyone."
spec: |
  **The system call.** `int rename(const char *old, const char *new)` gives the file or
  directory named `old` the name `new` and returns 0, or returns -1 and changes nothing.

  - `old` and `new` may be in the same directory or in different directories.
  - If `new` exists and is not a directory, it is replaced: its directory entry now names
    `old`'s inode and it loses one link, in the same transaction. If that was its last link
    and nobody has it open, it is freed.
  - If `old` and `new` are already names for the same inode (two [[g:hard-link|hard links]],
    or the same name twice), `rename` does nothing and returns 0, as POSIX says.
  - Moving a directory to another parent updates its `..` entry and both parents' link
    counts.
  - `rename` fails, changing nothing, if: `old` does not exist; either last path element is
    `.` or `..`; `new` is an existing directory (simplification: POSIX allows replacing an
    empty one); `old` is a directory and `new` exists; the move would put a directory inside
    itself or below itself; the new parent has been removed, or a directory move would push
    its link count past `NLINK_MAX`; the new parent has no room and no free block; or a
    concurrent create, unlink or rename changed either name between the rename's first
    look and the moment it holds the locks (it does not retry, even where POSIX would
    succeed).
  - "Changes nothing" has one exception inherited from base xv6: on a disk with exactly one
    free block left, [[bmap]] can allocate a directory's indirect block and then fail on
    the data block; the empty indirect block stays allocated. The disk stays consistent.
  - The two names must be on the same device (xv6 has only one, so this never fails).

  **Atomicity.** The whole rename is one transaction. After a crash and recovery, exactly
  one of the two outcomes is on disk: the state before the rename or the state after it.

  **What must not change.** Every existing system call behaves as before, and **`usertests
  -q` prints `ALL TESTS PASSED` on 3 harts.**

  **The programs.** `mv old new` calls `rename` once; if `new` is an existing directory it
  moves `old` into it, as Unix `mv` does. `renametest` checks everything above:

  ```text
  $ renametest
  renametest: same directory: OK
  renametest: across directories: OK
  renametest: replace a file: OK
  renametest: move a directory: OK
  renametest: refuse a cycle: OK
  renametest: refusals: OK
  renametest: concurrent: 1600 renames, 400 refused cycles in 110 ticks
  renametest: concurrent: OK
  renametest: ALL OK (crash consistency: see renametest crash)
  ```

  - **same directory**, **across directories**: the inode keeps its number, link count and
    content; the old name is gone. Across directories is tried with the new parent below,
    beside and above the old one.
  - **replace a file**: the replaced file, still open, reports 0 links and is still
    readable through its file descriptor; a rename between two hard links to one file
    changes nothing.
  - **move a directory**: its subtree moves along, its `..` names the new parent, and the
    parents' link counts move by one.
  - **refuse a cycle**, **refusals**: every refused rename returns -1 and changes nothing.
  - **concurrent**: seven processes on three harts. Two rename files between `ct/a` and
    `ct/b` in opposite directions (`ct/a/x ↔ ct/b/y`, `ct/b/z ↔ ct/a/w`), one between
    `ct/a/s` and `ct/a` (`ct/a/s/q ↔ ct/a/q`), and one moves the directory `m` between
    `ct/a` and `ct/b`, each time also trying to move `m`'s parent into `m` (which must
    fail). Meanwhile one keeps trying to `unlink("ct/a/s")`, which must always fail because
    `ct/a/s` is not empty, and two churn names (`t`, `u`) in `ct/a` and `ct/b`. The setup
    is chosen to catch one tempting lock order (think question 3 says which). Afterwards
    every name, `m`'s `..` and every link count is checked. A watchdog prints
    `not finished after 60 seconds` if the workers hang.

  **Crash consistency** cannot be checked from inside: `renametest crash` moves a file
  `f` and a directory `d` between `cr/a` and `cr/b` until the machine dies, and
  `renametest check`, after a reboot, checks that each has exactly one name, that `d`'s
  `..` and both parents' link counts agree with where `d` is, and that `f` still holds its
  content. A driver outside xv6 kills QEMU at a random moment; this lab's runs did it 30
  times, and also ran an fsck-style checker on the disk image afterwards.
think:
  - title: Why does rename need the kernel at all?
    q: |
      Early Unix had no `rename`. `mv old new` was a user program that called `link(old,
      new)` and then `unlink(old)`. In this tree you could write that `mv` today. What can
      go wrong with it? Think about three things: what is on the disk if the machine dies
      between the two calls, what another process sees between them, and what `mv` does
      when `old` is a directory. Commit to an answer before reading the hints.
    hints:
      - "Read [[sys_link]] and [[sys_unlink]]. Where does each one begin and end its transaction? What does [[sys_link]] do with a directory ([[kernel/sysfile.c:139]])?"
      - "A [[g:transaction]] is all or nothing ([[tour:31]], [[tour:32]]). Two system calls are two transactions: the log guarantees each of them, never the pair."
      - "A rename has to be one transaction that removes one directory entry and adds another, so it has to live in the kernel, between one [[begin_op]] and one [[end_op]]."
    answer: |
      Three things go wrong.

      - **A crash between the calls** leaves both names. The `link` transaction committed,
        the `unlink` one never started. The file system is consistent (the inode has two
        entries and `nlink` 2), but the rename has half happened, and a program that
        expected exactly one of the names to exist can find both.
      - **Another process sees the half-done state** even without a crash: between the two
        calls both names exist. Worse, to replace an existing `new`, the user-space `mv`
        must first `unlink(new)` (`link` refuses an existing name), and then there is a moment
        with *no* file named `new` at all. A program that reopens a configuration file by
        name can fail in that moment.
      - **Directories cannot move at all.** [[sys_link]] refuses `T_DIR`
        ([[kernel/sysfile.c:139]]): hard links to directories would turn the tree into a
        graph. And even if it allowed them, the directory's `..` entry would still name the
        old parent.

      So `rename` is a system call whose whole body sits inside one transaction: one
      [[begin_op]], every directory and inode change, one [[end_op]]. The log then
      guarantees what no sequence of user-level calls can: after a crash, the disk shows
      the state before the rename or the state after it. Inside the kernel the half-done
      state is also invisible to other processes, as long as the right inode locks are held
      while it exists.

      Note what "inside one transaction" does *not* mean: it does not order the writes for
      crash safety. All of a transaction's blocks reach their home locations only after the
      commit record is on disk ([[kernel/log.c:207]]), so the order in which the rename
      writes its blocks into the buffer cache does not matter for crashes. (It does matter
      for *failures*, the next question.)
    checks:
      - id: lab24-01
        level: 1
        type: choice
        q: |
          A user-space `mv` does `link("a/f", "b/f")` and then `unlink("a/f")`. The machine
          loses power after `link` returned and before `unlink` began. After the reboot and
          log recovery, what is on the disk?
        options:
          - text: "Both a/f and b/f exist, naming the same inode, whose nlink is 2."
            correct: true
            why: |
              The `link` transaction committed: a new entry and `nlink` 2. The `unlink`
              transaction never began, so nothing undoes the first. The disk is consistent;
              the rename is half done.
          - text: "Only a/f exists, because recovery rolls back the incomplete rename."
            why: |
              You may have thought the log knows about the rename as a whole. It only knows
              transactions, and here there were two. The first one is complete and stays.
          - text: "Both names exist, but nlink is 1, so the file system is corrupt."
            why: |
              That is what a *kernel* rename split into two transactions without touching
              `nlink` leaves behind (clinic 4). `link` raises `nlink` in the same
              transaction that adds the entry, so here the count is right.
          - text: "Neither name exists, because the inode was being moved."
            why: |
              You may be picturing the inode as moving. Nothing moves: entries name inodes,
              and the first transaction only added a name.
        explain: |
          Each system call is its own transaction ([[sys_link]] and [[sys_unlink]] each call
          [[begin_op]] and [[end_op]]). Recovery replays committed transactions and ignores
          the rest ([[tour:32]]); it never combines two. A rename needs both changes in one
          transaction, which only the kernel can arrange.
      - id: lab24-02
        level: 2
        type: tf
        q: |
          True or false: a user-space `mv` built from `link` and `unlink` can move a
          directory, as long as it also fixes the directory's `..` entry afterwards.
        answer: false
        why_tf: |
          You may have assumed `link` works on any inode. In this kernel it refuses
          directories outright, before any `..` question arises.
        reasons:
          - text: "sys_link refuses to link a directory (kernel/sysfile.c:139), so the first step already fails."
            correct: true
            why: Right. Directory hard links would let the tree become a graph with cycles.
          - text: "A user program cannot write a directory's entries, so it cannot fix `..`."
            why: |
              True as far as it goes (user programs only read directories), but it is not
              the first obstacle: `link` already fails.
          - text: "It can; this is how mv worked on early Unix."
            why: |
              Early Unix `mv` used `link` and `unlink` for files. Moving directories needed
              privileged tricks, and the race and crash windows are exactly why `rename`
              became a system call.
        explain: |
          [[sys_link]] returns -1 for a `T_DIR` inode ([[kernel/sysfile.c:139]]). Moving a
          directory needs the kernel: it must rewrite the directory's `..` entry and move a
          link from one parent's count to the other's, all with the entry changes, in one
          transaction.
  - title: What has to change on disk, and in which order?
    q: |
      Start with the easy case: both names in one directory, `rename("a/x", "a/y")`. List
      every on-disk change. Then: `a/y` already exists and is a file. What else changes, and
      what if some process has `a/y` open? Which of your steps can fail after the
      transaction has begun, and what must the order of your steps be so that a failure
      leaves nothing changed? Finally, which inode locks do you need, and in what order?
    hints:
      - "Look at what [[dirlink]] ([[kernel/fs.c:620]]) and [[sys_unlink]] ([[kernel/sysfile.c:235]]-[[kernel/sysfile.c:246]]) do to a directory, and which of their calls can fail. And look at [[iput]] ([[kernel/fs.c:349]]): when does an inode really get freed?"
      - "Within a transaction there is no undo: every change you have made will be committed. So arrange the steps so that only the first one can fail. A new entry may need a new block ([[bmap]] → [[balloc]]); clearing or rewriting an existing entry cannot run out of space."
      - "Write the new name first: if it does not exist, add an entry (this is the step that can fail); if it exists, rewrite its entry's inode number in place and drop the replaced file's link count. Then clear the old entry. Lock the directory, then a child, as [[sys_unlink]] does."
    answer: |
      For a same-directory rename of a file, the inode itself does not change at all: one
      name disappears and one appears, so its `nlink` stays the same. On disk:

      1. **The new name.** If `y` does not exist, a new entry `y → x's inode` is written into
         a free slot of `a`, which may need a new block for `a` if every slot is taken. If
         `y` exists and is a file, its entry is rewritten in place to name `x`'s inode, and
         the file that was `y` loses one link (`nlink--`, written back with [[iupdate]]).
      2. **The old name.** The entry for `x` is cleared (inode number 0), as [[sys_unlink]]
         does.
      3. **A freed file, maybe.** If the old `y` had no other links and nobody had it open,
         its last [[iput]] frees its blocks and its inode. That [[iput]] must come before
         [[end_op]], so the freeing is part of the same transaction. If someone has it open,
         `ref > 1`: it lives on with `nlink` 0 until the last `close`, whose [[iput]] frees it
         in that process's own transaction, exactly as for an unlinked open file
         ([[tour:33]]). After a crash before that close, [[ireclaim]] finds it at boot.

      **The order.** Step 1 is the only step that can fail: [[dirlink]] may need a block,
      and [[balloc]] may find none. Steps 2 and 3 only rewrite blocks that already exist. So
      the reference does step 1 first, and gives up with nothing changed if it fails. Done
      the other way round, a full disk would leave the file with no name at all, and its
      blocks unreachable for good.

      **Locks.** One directory lock covers both entries. The replaced file's lock is needed
      to change its `nlink`; take it after the directory's, parent before child, the order
      [[sys_unlink]] and [[create]] use ([[tour:18]]).

      **Two more cases** to decide before writing code: `rename(x, x)`, or two names that are
      hard links to the same inode, must do nothing and succeed (POSIX); naively you would
      decrement the link count of the inode you are renaming. And replacing a directory, or
      replacing a file *with* a directory, is refused in this lab.
    checks:
      - id: lab24-03
        level: 2
        type: order
        q: |
          Put the reference's steps for `rename("a/x", "a/y")`, where `a/y` exists and is a
          file nobody has open, in the order they happen.
        items:
          - text: "begin_op"
          - text: "lock a"
          - text: "point the entry y at x's inode and decrement the old y's nlink"
            why: "This is the step that might have failed if y had not existed (a new entry may need a block), so it goes first."
          - text: "clear the entry x"
            why: "Clearing an existing entry cannot fail, so it comes after the step that can."
          - text: "unlock a"
          - text: "iput the old y, which frees it"
            why: "The free must happen inside the transaction, before end_op, or a crash could leave an inode with nlink 0 and blocks still allocated until the next boot's ireclaim."
          - text: "end_op"
        why_wrong: |
          Think about which steps can fail (only the new name can) and which must be inside
          the transaction (all of them, including the free in iput).
        explain: |
          Everything between [[begin_op]] and [[end_op]] commits together, so the order
          inside does not matter for crashes. It matters for failures: the only fallible
          step goes first, so a failure leaves nothing to undo. [[iput]] frees an inode with
          `nlink` 0 and `ref` 1, and must run inside a transaction ([[kernel/fs.c:347]]).
      - id: lab24-04
        level: 2
        type: choice
        q: |
          Process A has `a/y` open for reading. Process B runs `rename("a/x", "a/y")`. What
          happens to the file that used to be `a/y`?
        options:
          - text: "Its nlink drops to 0, A keeps reading it, and it is freed when A closes it."
            correct: true
            why: |
              `ref` is still 1 for A's open file after B's [[iput]], so nothing is freed yet.
              A's final `close` drops the last reference, and that [[iput]] frees it.
          - text: "rename fails, because a file that is open cannot be replaced."
            why: |
              You may be thinking of other operating systems. In Unix (and xv6) names and
              open files are independent; [[sys_unlink]] works on open files too.
          - text: "It is freed at once, and A's next read returns garbage."
            why: |
              That would happen if [[iput]] freed on `nlink == 0` alone. It also requires
              `ref == 1` ([[kernel/fs.c:357]]).
          - text: "It is freed at once, but A's reads still work because the data is cached."
            why: |
              Nothing is freed at once. Relying on the cache would be a bug: the blocks could
              be reallocated and overwritten.
        explain: |
          This is the unlink-while-open behaviour of [[tour:33]]. `renametest replace a file`
          checks it: through the old file descriptor, `fstat` reports `nlink` 0 and `read`
          still returns the old content.
      - id: lab24-05
        level: 1
        type: line
        q: |
          [[sys_unlink]] holds two inode locks at once when it removes a directory. Click the
          line where it takes the second one.
        code: kernel/sysfile.c:212-233
        answer: 226
        lines:
          218: |
            You may have picked the first lock. Line 218 locks the parent directory `dp`;
            the child comes later.
          224: |
            You may have thought [[dirlookup]] locks what it finds. It returns the inode
            referenced but unlocked ([[kernel/fs.c:610]]); line 226 locks it.
        why_wrong: |
          Look for the second [[ilock]]: the parent `dp` is locked first, the child `ip`
          after it is found.
        explain: |
          Parent first (line 218), then child (line 226): the inode order for the whole file
          system ([[tour:18]], rule 3). A rename within one directory follows it too: the
          directory, then the file being replaced.
  - title: Two directories, two locks. In what order?
    q: |
      Now `rename("a/x", "b/y")`: both `a` and `b` must be locked while the two entries
      change, or another process could see neither name or both. Suppose every rename locks
      the old parent, then the new parent. On another hart, at the same moment, someone runs
      `rename("b/z", "a/w")`. What happens? The file system already has an order for inode
      locks: what is it, and does it say anything about `a` and `b`? Propose a rule that
      works for every pair of directories, and check it against the code that already
      holds two inode locks. One more pair to check it against: `rename("a/s/q", "a/q")`
      on one hart while [[sys_unlink]] tries to remove the directory `a/s` on another.
    hints:
      - "The existing rule is in [[tour:18]] (rule 3): [[sys_unlink]] and [[create]] lock the parent, then the child. Which pairs of directories does that rule order?"
      - "A lock order has to be one order that every path agrees with. \"Higher in the tree first\" agrees with parent-before-child. It says nothing about two directories where neither is above the other, and it is only well defined if the tree cannot change while you use it."
      - "Something must stop the tree from changing while you decide an order, and the order itself must agree with parent-before-child wherever the two directories are related. Then ask what is left for two unrelated directories, and who else could ever hold two of those."
    answer: |
      **The naive order deadlocks.** One rename locks `a` then `b`; the other locks `b` then
      `a`:

      | time | hart 0: `rename(a/x, b/y)` | hart 1: `rename(b/z, a/w)` |
      |---|---|---|
      | 1 | locks `a` | locks `b` |
      | 2 | `ilock(b)`: sleeps, held by hart 1's process | `ilock(a)`: sleeps, held by hart 0's process |
      | 3 | asleep forever | asleep forever |

      Inode locks are [[g:sleeplock|sleep-locks]], so neither hart spins: both processes are
      `SLEEPING` in [[acquiresleep]] and the harts go idle. Soon the whole file system stops:
      both processes are inside a transaction, so no commit can happen, and every other
      process blocks in [[begin_op]]. Clinic 1 shows exactly this, recorded with gdb (with a
      delay loop added between the two locks: without it the window is a few instructions
      wide and our runs did not hit it).

      The naive order also breaks the existing rule. `rename("a/s/q", "a/q")` locks `a/s`
      (old parent) then `a` (new parent): **child before parent**. [[sys_unlink]] of `a/s`
      locks `a`, then `a/s` ([[kernel/sysfile.c:218]], [[kernel/sysfile.c:226]]). That pair
      deadlocks too; clinic 1 caught it once.

      **What the tree gives you.** "Lock the directory higher in the tree first" agrees with
      every existing path: [[sys_unlink]] and [[create]] hold a parent and its child,
      [[namex]] holds one directory at a time, [[sys_link]] never holds two
      ([[kernel/sysfile.c:153]]). So for renames where one parent is above the other, lock
      that one first. That leaves two problems.

      1. *Unrelated directories*, like `a` and `b`: neither is above the other.
      2. *The tree changes*: a rename on another hart can move `a` under `b` while you are
         deciding.

      **The reference's rule.** A global sleep-lock, `renamelock`, is taken by every rename
      between two directories, after [[begin_op]] and before any inode lock, and held to
      the end. Under it:

      - The tree's shape is frozen: only a two-directory rename can change which directory
        is above which ([[sys_unlink]] removes only empty directories, [[create]] adds only
        new, empty ones, a rename within one directory does not change a `..`).
      - If one parent is above the other, it is locked first: consistent with
        parent-before-child.
      - If they are unrelated, the old parent is locked first. That is safe because the only
        code that ever holds two *unrelated* directories is a two-directory rename, and there
        is only one of those at a time. A cycle in the waits-for graph would need someone
        else holding `b` while waiting (directly or not) for `a`; every other path only waits
        downwards, and nothing below `b` is `a` or above it.

      This is what Linux does: renames between directories take a per-file-system mutex
      (`s_vfs_rename_mutex`) and lock the ancestor first.

      **Why not inode-number order?** It is the textbook answer for unrelated locks, and it
      fails here. `ct/a/s` can have a lower inode number than its parent `ct/a` (create
      `s` first, then move it under `a`; `renametest` does exactly that). Then
      `rename("ct/a/s/q", "ct/a/q")` locks `s` then `a`, while [[sys_unlink]] of `ct/a/s`
      locks `a` then `s`. A rule for renames must agree with the order the rest of the file
      system already uses, and inode numbers know nothing about the tree. Clinic 2 records
      this deadlock.

      **Why a sleep-lock, and why after [[begin_op]]?** It is held across disk reads (directory
      lookups, the walk of the next question), so it cannot be a spinlock. It is taken after
      [[begin_op]] because only [[nameiparent]] tells the rename whether two directories are
      involved, and [[nameiparent]] must run inside a transaction (its [[iput]] may free an
      inode). That position is safe: nobody holding an inode lock ever waits for
      `renamelock`, and its holder never waits for log space or a commit before releasing
      it. (Taking it before [[begin_op]] in every rename would also be deadlock-free; a
      variant that did that passed `renametest`, `usertests -q` and two runs of
      `renametest concurrent 1000`.) The price of the reference's order: a rename waiting
      for `renamelock` already holds a log reservation. The log admits at most three
      operations at once (30 log blocks, 10 reserved each), so two renames queued on the
      lock can occupy two of the three slots while other file-system calls wait in
      [[begin_op]].
    checks:
      - id: lab24-06
        level: 2
        type: choice
        q: |
          With the naive order (old parent, then new parent), `rename(ct/a/x, ct/b/y)` and
          `rename(ct/b/z, ct/a/w)` deadlock on two harts. What does gdb show when attached a
          minute later?
        options:
          - text: "Both processes SLEEPING in acquiresleep, each holding one directory's sleep-lock; all three harts idle; other file-system processes asleep in begin_op."
            correct: true
            why: |
              Sleep-locks put waiters to sleep, so the harts have nothing to run. The two
              processes are inside their transactions, so the log can never commit and every
              later [[begin_op]] waits.
          - text: "Two harts spinning in acquire at 100% CPU, the third running other processes."
            why: |
              That is a spinlock deadlock. Inode locks are sleep-locks: [[acquiresleep]]
              calls `sleep()` while the lock is taken, and a sleeping process uses no hart.
          - text: "panic: sched locks"
            why: |
              You may have thought sleeping while holding a lock is forbidden. It is for
              spinlocks; sleep-locks are held across sleeps all the time
              ([[concept:locks#sleep-locks]]).
          - text: "Both renames fail with -1 after a timeout."
            why: |
              Nothing in xv6 times out a lock. A deadlock lasts forever.
        explain: |
          Clinic 1 has the recorded dump. Notice the second-order effect: because the two
          processes are inside transactions, [[end_op]] never runs for them, the outstanding
          count never reaches 0, and [[begin_op]] blocks everybody else. A sleep-lock
          deadlock in the file system freezes the file system, not the CPUs.
      - id: lab24-07
        level: 3
        type: choice
        q: |
          A classmate proposes: "lock the two parents in inode-number order, lower first,
          with the global rename lock as well". Which existing operation can deadlock with
          such a rename?
        options:
          - text: "unlink of a directory, which locks the parent and then the child, when the child has the lower inode number."
            correct: true
            why: |
              Inode numbers are not related to tree position. A rename between `a/s` and `a`
              would lock `s` first; unlink of `a/s` locks `a` first.
          - text: "None: the global rename lock serializes everything that holds two directories."
            why: |
              It serializes renames only. [[sys_unlink]] and [[create]] hold two inodes
              without it.
          - text: "Another rename between the same two directories."
            why: |
              Two renames cannot both hold directories: they are serialized by the global
              lock, and both would use the same numeric order anyway.
          - text: "Path lookup, which locks each directory on the path in turn."
            why: |
              [[namex]] holds one directory at a time: it unlocks each before locking the
              next ([[kernel/fs.c:720]]).
        explain: |
          A new lock order has to be consistent with every place that already nests the same
          locks. Inode locks are already ordered by the tree (parent before child), so
          "higher in the tree first" is the only rule that cannot contradict it.
      - id: lab24-08
        level: 1
        type: tf
        q: |
          True or false: while two processes are deadlocked on two inode sleep-locks, the
          harts they ran on are spinning at full speed.
        answer: false
        why_tf: |
          You may be thinking of spinlocks. A process that cannot get a sleep-lock calls
          `sleep()` and gives up its hart.
        reasons:
          - text: "acquiresleep sleeps while the lock is held, so the harts run other processes or wait for interrupts in the scheduler."
            correct: true
            why: Right. gdb shows every hart `[halted]` in the scheduler's idle loop.
          - text: "Interrupts are off while a sleep-lock is held, so the harts stop."
            why: |
              Holding a sleep-lock leaves interrupts on (noff is 0); only its inner
              spinlock, held for a few instructions, turns them off.
          - text: "The harts run the deadlock detector."
            why: "xv6 has none."
        explain: |
          See [[acquiresleep]]: `sleep_prepare`, release the inner spinlock, `sleep()`. In
          clinic 1's dump all three harts are `halted`, the scheduler's idle state.
  - title: Which directory is above which?
    q: |
      Your rule needs one fact: is `b` above `a` in the tree (or the other way round)? xv6
      keeps no parent pointers in memory. How do you find out, which locks may you hold while
      you do, and why is the answer still true a moment later when you use it? And since the
      answer must be known *before* the parents are locked: what about the lookups of `x`
      and `y` themselves, which also need a directory lock?
    hints:
      - "Every directory has a `..` entry ([[kernel/sysfile.c:302]]), and [[namex]] follows `..` like any other name, holding one directory lock at a time ([[kernel/fs.c:702]]-[[kernel/fs.c:720]])."
      - "Locking an ancestor while holding one of its descendants is the reverse of parent-before-child. So whatever walks up the tree may hold no other inode lock; and only a two-directory rename changes which directory is inside which."
      - "The question has to be answered before the parents are locked, with as little held as possible. Anything you learned while not holding a lock may be stale once you do hold it."
    answer: |
      **Walk up.** Starting from `b`, read its `..` entry, then that directory's `..`, and so
      on, until you reach `a` (so `a` is above `b`) or the root (it is not). The reference's
      `isancestor(a, b)` does that. It locks each directory only while reading its `..`, like
      [[namex]]. It must not run while the rename holds the parents' locks: walking up from
      `b` while holding `b` locks `b`'s parent while holding `b`, child before parent, and
      [[sys_unlink]] of `b` (parent, then `b`) would deadlock with it.

      **Why the answer stays true.** The walk's result describes the tree at the moment of
      the walk. It is still true when the parents are locked only because `renamelock` is
      held the whole time: no other two-directory rename can move a directory, and nothing
      else changes the chain of `..` entries above a live directory. (A directory with
      `nlink` 0 has been removed; the walk stops there, and the rename fails later, at its
      checks under the locks.)

      **The names, again.** The walk happens before the parents are locked, and the cycle
      check of the next question needs to know which inode `x` is. So the reference looks
      up both names first, each with only its directory locked for a moment, decides
      everything about the tree, and only then locks the parents. Between the lookup and
      the lock, another process may have changed a name: `unlink(a/x)`, or `create(b/y)`.
      So, with the parents locked, it looks both names up again and compares the results
      with what it decided on (`samename`). If either name now leads somewhere else, the
      rename returns -1.

      The comparison is by in-memory inode pointer, and that is safe: the rename holds a
      reference to each inode it looked up, so neither can be freed and its inode number
      reused in the meantime ([[iput]] frees only at `ref` 1).

      Also note what the lookup does *not* do: it never holds `a` while locking `x`. To learn
      `x`'s type it locks `x` alone, for a moment (`itype`): an inode's type never changes
      while someone holds a reference to it. So the rename never holds two *files* at once,
      which matters because hard links can make the same two files siblings in two
      directories, in opposite roles. It does hold one parent and then a child of the other
      parent (`dp2`, then the moved directory, in a later step), and those can be siblings
      with no tree order between them: that, too, is safe only because `renamelock` keeps
      every other two-directory rename out.
    checks:
      - id: lab24-09
        level: 2
        type: tf
        q: |
          True or false: it would be fine to walk up through `..` while holding the locks of
          both parents, since the walk only reads directories.
        answer: false
        why_tf: |
          You may have thought read-only code cannot deadlock. Reading a directory requires
          its lock, and taking that lock is what can deadlock.
        reasons:
          - text: "Walking up locks an ancestor while holding its descendant, the reverse of the parent-before-child order that unlink and create use."
            correct: true
            why: Right. With [[sys_unlink]] holding the ancestor and waiting for the descendant, both would sleep forever.
          - text: "dirlookup would panic on a locked directory."
            why: |
              [[dirlookup]] requires the directory to be locked by the caller; nothing
              panics.
          - text: "The walk would return a wrong answer because the parents are locked."
            why: |
              The answer would be right, if the walk ever finished. The problem is that it
              may not.
        explain: |
          Lock order is about acquiring, not about what you do once you hold the lock. The
          reference walks with only `renamelock` and one directory at a time held, then
          locks the parents.
      - id: lab24-10
        level: 3
        type: choice
        q: |
          After locking both parents, the reference looks up `old` and `new` again and gives
          up if either now names a different inode than in its first lookup. Which
          interleaving is this check for?
        options:
          - text: "Another process unlinked or replaced one of the names (or created new) after the first lookup, while neither parent was locked."
            correct: true
            why: |
              The first lookups held each directory only briefly. Same-directory renames,
              unlinks and creates do not take the global rename lock.
          - text: "Another two-directory rename moved one of the parents."
            why: |
              That cannot happen: the global rename lock is held from before the first
              lookup to the end.
          - text: "The inode was freed and its number reused for a new file with the same name."
            why: |
              The rename holds a reference to the inode it looked up, so it cannot be freed;
              its number cannot be reused while that reference exists.
          - text: "None; it is only a sanity check."
            why: |
              It is the only thing that makes unlocked lookups safe to act on.
        explain: |
          Anything decided without a lock must be re-checked under the lock, and the check
          must compare the thing the decision was about: here, which inode each name leads
          to.
  - title: Moving a directory into itself
    q: |
      `mv a a/c/b`: the directory `a` would become an entry inside its own subdirectory.
      Suppose nothing stops it. Work out what the tree looks like afterwards: what can `ls`
      reach, what are the link counts of `a` and `a/c`, and can xv6 ever reclaim those
      inodes? Then: how do you detect such a move, and what about `mv a a/b`, where the
      new parent *is* `a`?
    hints:
      - "You already have a way to ask whether one directory is above another."
      - "The move is bad exactly when the directory being moved is the new parent, or above it. Think about which inode locks a rename would try to take in the `mv a a/b` case if nothing refused it."
      - "It is a question about the tree, so it belongs with the other tree questions, before any parent is locked."
    answer: |
      Unchecked, `mv a a/c/b` does exactly what it is told. The entry `b → a` goes into
      `a/c`, the root's entry `a` is cleared, and `a`'s `..` is pointed at `a/c`. Now `a`
      and `a/c` form a loop that nothing outside reaches: `ls` shows no `a`, and `ls a/c/b`
      fails, because the path starts at the root. Their link counts stay positive: `a` is
      named by the entry `b` in `a/c` and by `a/c`'s `..` (`nlink` 2), and `a/c` by its
      entry in `a` and by `a`'s new `..` (`nlink` 2). Neither can ever reach 0, since no path
      leads to them to unlink anything, and [[ireclaim]] at boot only looks at `nlink == 0`.
      The inodes and their blocks are lost for good. Clinic 3 shows it: an fsck-style
      checker reports three unreachable inodes with positive link counts.

      `mv a a/b` is worse in a different way: the new parent *is* `a`, so the rename locks
      the root, then `a` as the new parent, and then `a` again to rewrite its `..`. A
      sleep-lock has no owner check in [[acquiresleep]]: the process sleeps waiting for
      itself, forever (clinic 3 again).

      **Detection** is the walk from the previous question: refuse if `isancestor(ip, dp2)`,
      that is, if the moved directory is the new parent or above it. That covers both
      cases. It needs `renamelock` for the same reason as before: two renames each passing
      the check on their own, `rename(a, b/a2)` and `rename(b, a/b2)`, would together make
      the loop. Under the lock, the second one sees the first one's result.

      Files cannot form cycles, so the check runs only for directories, and only when the
      parents differ (within one directory a directory keeps its parent).
    checks:
      - id: lab24-11
        level: 2
        type: choice
        q: |
          A kernel without the cycle check runs `mkdir a; mkdir a/c; echo hi > a/c/f; mv a
          a/c/b`. What does an fsck-style check of the disk report afterwards?
        options:
          - text: "a, a/c and a/c/f are allocated, have positive link counts, and are not reachable from /."
            correct: true
            why: |
              The loop keeps every link count above 0, and no path from the root leads into
              it. They are leaked for good.
          - text: "Nothing: the disk is consistent, a has just moved."
            why: |
              Every entry and every count is internally consistent, which is what makes it
              nasty, but a checker that walks from the root finds three inodes it cannot
              reach.
          - text: "a's link count is 0, so ireclaim frees it at the next boot."
            why: |
              You may have expected the moved directory to lose its link. It gains one in
              `a/c` (the entry `b`) and keeps one from `c`'s `..`.
          - text: "The kernel panics during the rename."
            why: |
              Nothing panics. (The shallower `mv a a/b` does go wrong in a different way: it
              hangs, sleeping on its own lock.) This deeper move completes and returns 0.
        explain: |
          Clinic 3 has the recorded run and the checker's output. [[ireclaim]] only frees
          inodes with `nlink` 0, so nothing in xv6 recovers these.
  - title: What else moves with a directory?
    q: |
      `mv a/d b/d`, where `d` is a directory. Its entry moves, as for a file. What else on
      disk names `a` because of `d`, and must now name `b`? How do the link counts of `a`
      and `b` change, and why? What limit applies to `b`? Finally, suppose you forget one of
      these: which later operations go wrong, and is one of them a check you wrote yourself?
    hints:
      - "Look at what [[create]] does for a new directory ([[kernel/sysfile.c:300]]-[[kernel/sysfile.c:313]]) and what [[sys_unlink]] undoes ([[kernel/sysfile.c:238]]-[[kernel/sysfile.c:241]])."
      - "A directory's `nlink` counts its entry in its parent plus one for each subdirectory's `..`. And the upward walk you wrote reads `..` entries."
      - "Three things change besides the entries, and one of them has an upper limit. All of them belong in the same transaction, under locks taken in an order you can justify."
    answer: |
      `d`'s `..` entry names `a`, and that entry is also one of `a`'s links: in xv6, a
      directory's `nlink` is 1 (its entry in its parent) plus one for each subdirectory,
      whose `..` names it ([[create]] does `dp->nlink++` for that reason). So a directory
      move does three more things than a file move:

      - rewrite `d`'s `..` to name `b`;
      - `a->nlink--`, `b->nlink++`, both written back with [[iupdate]];
      - refuse first if `b->nlink` is already `NLINK_MAX` (the same guard as
        [[kernel/sysfile.c:274]]).

      Rewriting `..` needs `d`'s lock, taken after both parents. That is safe: anyone holding
      `d` waits only for `d`'s descendants, and by the cycle check neither parent is below
      `d`. `d` and `b` are often unrelated (in `rename("a/d", "a/e/d")` the rename holds `a/e`
      and then locks its sibling `a/d`); that is safe only because `renamelock` keeps every
      other two-directory rename out. The moved directory's own `nlink` does not change.

      **Forgetting `..`** is the instructive bug (clinic 5). At first everything looks fine:
      `ls b/d` works. But:

      - `cd b/d; cd ..` lands in `a`.
      - The link was moved but the `..` was not: `a`'s `nlink` no longer counts `d`'s `..`,
        which still names it. When `a` is empty it can be removed, and `d`'s `..` then names
        a freed inode. The next lookup of `b/d/..` panics with `ilock: no type`.
      - **Your own cycle check breaks.** It walks `..` entries. With `d`'s `..` still naming
        `a`, the walk from inside `b/d` goes to `a` and never meets `b`, so `mv b b/d/x` is
        allowed, and `b` disappears into a loop. In the clinic run, `renametest` reports
        `refuse a cycle: FAIL` for exactly this reason.

      All of it is in the same transaction as the entry changes, so a crash cannot separate
      the new entry from the new `..` or the counts.
    checks:
      - id: lab24-12
        level: 2
        type: match
        q: |
          `rename("a/d", "b/d")` where `d` is a directory with no subdirectories. Match each
          inode to what happens to its `nlink`.
        pairs:
          - left: "a"
            right: "decreases by 1"
            why: "d's `..` no longer names a."
          - left: "b"
            right: "increases by 1"
            why: "d's `..` now names b."
          - left: "d"
            right: "does not change"
            why: "d loses one entry (in a) and gains one (in b); its own `..`s are its subdirectories'."
        explain: |
          A directory's link count is its entry in its parent plus its subdirectories' `..`
          entries. `renametest move a directory` checks all three numbers.
      - id: lab24-13
        level: 3
        type: tf
        q: |
          True or false: if a rename forgets to rewrite a moved directory's `..` (but fixes
          the link counts), the only symptom is that `cd ..` from inside it goes to the wrong
          place.
        answer: false
        why_tf: |
          You may have thought `..` is only used by `cd`. The kernel itself reads it: path
          lookup, and the rename's own cycle check.
        reasons:
          - text: "The cycle check walks `..` entries, so it can be fooled into allowing a move that creates a loop; and the old parent can be removed while `..` still names it."
            correct: true
            why: "Right. Clinic 5 shows both, ending in `panic: ilock: no type`."
          - text: "It is harmless, because fsck would repair it at the next boot."
            why: "xv6 has no fsck; only ireclaim, which looks at nlink 0 only."
          - text: "The kernel panics with rename: .. at once."
            why: |
              That panic is a sanity check in the reference, inside the code that rewrites
              `..`. Forget the rewrite and you have probably forgotten the check too.
        explain: |
          A redundant structure (`..` duplicates information that the parent's entry already
          holds) must be kept consistent everywhere, because some code will trust it.
  - title: Does one rename fit in one transaction?
    q: |
      A transaction may write at most `MAXOPBLOCKS` distinct blocks ([[kernel/param.h:9]]).
      Count them for the most expensive rename you can construct: moving a directory from one
      parent to another. Which blocks get written? Can the new parent grow? Can the count
      ever exceed 10? Count, don't guess.
    hints:
      - "Read how [[begin_op]] reserves space ([[kernel/log.c:138]]) and how [[log_write]] counts blocks ([[kernel/log.c:234]]-[[kernel/log.c:238]]): a block written twice in one transaction is logged once."
      - "Follow every write: an entry write is [[writei]], which may call [[bmap]] → [[balloc]] (the bitmap block, and the new block itself through `bzero`) and always ends with [[iupdate]] of the directory ([[kernel/fs.c:576]]). Inodes live 16 to a block. The whole bitmap of this 2000-block disk is one block."
      - "Worst case for a directory move: the new parent's entry needs a new data block and, beyond 12 blocks, the indirect block too; plus the bitmap, the old parent's data block, the moved directory's first block (for `..`), and the inode blocks of the three directories, if they are all different."
    answer: |
      The blocks a directory move can dirty, each logged once however often it is written:

      | block | when |
      |---|---|
      | the new parent's data block that receives the entry | always: a block with a free slot, or a new block if every slot is in use |
      | the new parent's indirect block | only if the new block lies beyond the 12 direct blocks (allocated first if it is the 13th) |
      | the bitmap block | only if a block was allocated (one bitmap block covers all 2000 blocks) |
      | the old parent's data block | always: the cleared entry |
      | the moved directory's first data block | always: its `..` entry |
      | the new parent's inode block | always: [[writei]] rewrites the inode, and `nlink + 1` |
      | the old parent's inode block | always: [[writei]] and `nlink - 1` |
      | the moved directory's inode block | always: [[writei]] rewrites it after the `..` change |

      At most 8, and fewer when blocks coincide: the three inode blocks are distinct only if
      the three inode numbers fall in three different groups of 16. A counting copy of the
      kernel printed the logged blocks for each rename at its [[end_op]]:

      | rename | blocks logged |
      |---|---|
      | a file, within one directory | 2 |
      | a file, to another directory | 3 |
      | replacing a 3-block file in another directory | 5 |
      | a directory, to another parent | 5 |
      | a directory, into a parent whose last block is full | 5 |
      | a directory, into a parent with 12 full blocks, three inodes in three inode blocks | **8** |

      The last line is the worst case: new data block, indirect block, bitmap, three inode
      blocks, the old parent's block and the moved directory's block. 8 ≤ 10: it fits, and
      [[begin_op]]'s reservation of 10 per operation is never exceeded. A file replacement
      can dirty at most 6 (two directories' data and inode blocks, the replaced file's inode
      block, the bitmap block for its freed blocks; the replaced file's indirect block is
      only read).

      Two things make the count small: absorption (the three directories' inodes often
      share an inode block, which is why ordinary moves cost 3 to 5), and the fact that the
      replaced file's blocks are freed by clearing bits in one bitmap block, not by writing
      the blocks themselves.
    checks:
      - id: lab24-14
        level: 2
        type: number
        q: |
          On the counting kernel, what is the largest number of distinct blocks one rename
          logged (a directory moved into a parent that needed its indirect block, with the
          three directories' inodes in three different inode blocks)?
        answer: 8
        wrong:
          10: |
            You may have assumed the worst case is exactly `MAXOPBLOCKS`. That constant is a
            budget, not a measurement; the rename stays below it.
          9: |
            You may have counted the new parent's last, full block as well as the new block.
            [[dirlink]] only reads the full block while it searches for a free slot; the
            entry is written into the new block. And the bitmap is one block for both
            allocations.
          6: |
            That is the worst case for replacing a file, which never allocates a block in
            the new parent.
        why_wrong: |
          Count: new data block, indirect block, bitmap block, three inode blocks, the old
          parent's data block and the moved directory's data block.
        explain: |
          Log absorption ([[kernel/log.c:234]]-[[kernel/log.c:238]]) makes repeated writes
          to one block free. The measured worst case is 8 of the 10 that [[begin_op]]
          reserves per operation ([[kernel/log.c:138]]).
      - id: lab24-15
        level: 2
        type: multi
        q: |
          The counting kernel logged 3 blocks for `rename("m/g", "m/a/g")`, a file moving
          from `m` to `m/a`, where the inodes of `m` and `m/a` are in the same inode block.
          Which blocks were they?
        options:
          - text: "m's data block (the cleared entry)"
            correct: true
            why: "The old entry is set to inode 0."
          - text: "m/a's data block (the new entry)"
            correct: true
            why: "The new entry is written into a free slot of an existing block."
          - text: "the inode block holding m and m/a"
            correct: true
            why: "Each writei to a directory ends with iupdate of that directory."
          - text: "g's data block"
            why: |
              You may have thought the file moves. Its data never changes; only names do.
          - text: "the bitmap block"
            why: |
              Nothing was allocated (m/a had a free slot) and nothing was freed.
        explain: |
          The logged block numbers were 1160, 34 and 1157: `m/a`'s data block, the inode
          block (inodes 16 to 31), and `m`'s data block. `g`'s own inode is in block 34 too,
          but rename never writes it: its `nlink` does not change.
build: |
  **Start.**

  ```text
  git checkout -b my-rename 06aad25
  ```

  Add the test program first: copy the spec's checks into `user/renametest.c`, add
  `$U/_renametest\` and `$U/_mv\` to `UPROGS` in the `Makefile`. It will not compile until
  `rename` exists, which is milestone 1.

  **Milestones, in an order that keeps the system bootable after each one.**

  1. **The plumbing.** `SYS_rename` in [[kernel/syscall.h]], the table entry in
     [[kernel/syscall.c]], `entry("rename")` in [[user/usys.pl]], the prototype in
     [[user/user.h]], and a `sys_rename` in `sysfile.c` that fetches both strings with
     [[argstr]] and returns -1. Test: `usertests -q`; `renametest` prints `FAIL` lines.
  2. **One directory.** Same parent only (return -1 otherwise). Lock the directory, look up
     both names, handle the "same inode" case, write the new name first, then clear the old
     one. A small helper that rewrites one existing entry in place (by offset) serves both
     the replace case and, later, `..`. Test: `renametest`'s first test, `usertests -q`.
  3. **Two directories, files only.** The global sleep-lock (initialize it at boot, after
     [[iinit]]), the upward walk, lookups before locking, the parent order, the re-check
     under the locks. Refuse directories across parents for now. Test: `renametest`'s first
     three tests and `concurrent`, then `usertests -q`.
  4. **Directories.** The cycle check, `..`, the two link counts. Test: all of
     `renametest`, then `usertests -q`, then `renametest` again.
  5. **Crash consistency.** Run `renametest crash`, then kill QEMU from another terminal on
     the host: `pkill -KILL -f qemu-system-riscv64` works on Linux, macOS and WSL alike.
     Boot the same `fs.img` again (`make qemu` does not rebuild it when nothing changed) and
     run `renametest check`. Repeat with random delays; a small `python3` script using only
     the standard library (`subprocess`, `random`, `time`) can start QEMU, type the command,
     sleep a random time and call `Popen.kill()`, on any of the three.

  **Debugging advice.**

  - **A hang** in `concurrent`: the watchdog prints `not finished after 60 seconds`. Attach
    gdb to the running QEMU and dump the process table (`state`, `chan`) and every inode
    whose `lock.locked` is set, with `lock.pid`. A process sleeping on an inode lock's
    address holds another lock that someone else wants: you have a cycle, and the dump
    names it. The kernel stack of a sleeping process can be walked from `p->context.s0`
    with the frame pointers (`*(fp-8)` is the return address, `*(fp-16)` the caller's
    `fp`).
  - **Rare deadlocks** need volume: `renametest concurrent 1000` runs only the concurrent
    part, 1000 rounds. Several QEMUs in parallel help more than one long run.
  - **Crashes at a chosen moment**: start QEMU halted (`make qemu-gdb`), `break sys_rename`,
    `continue`, then a breakpoint in [[commit]] before or after [[write_head]]
    ([[kernel/log.c:207]]), and gdb's `kill` ends QEMU on the spot.
  - **Checking a disk image**: an fsck-style script on the host (walk from inode 1,
    compare link counts with the entries found, check `..`, compare the bitmap with the
    blocks in use) finds what `ls` cannot: unreachable loops and wrong counts. Written in
    `python3` with only the standard library (`struct` to decode `fs.img`), it runs the
    same on Linux, macOS and WSL.
  - `panic: rename: ..` (the reference's sanity check) means a directory's `..` did not
    name its old parent when you went to rewrite it: an earlier bug left it wrong.
clinic:
  - bug: The naive order, old parent then new parent
    change: |
      No global lock and no tree order: lock the parent of `old`, then the parent of `new`
      (everything else as in the reference). The recorded runs also had a delay loop between
      the two locks, an experiment to make the race likely (see why):

      ```diff
         twodirs = (dp1 != dp2);
      -  if (twodirs)
      -    acquiresleep(&renamelock);
      ...
