      into kernel arrays of `MAXPATH` bytes, and fails. Two paths cost 256 bytes of
      kernel stack, out of 4096.

      The state is pid 7's, recorded at the start of `sys_rename` on the finished branch:
      hart 0, no lock held, interrupts on (as for every system call after [[usertrap]]'s
      `intr_on`), noff 0.
  - title: Rewriting one directory entry in place
    commit: 2
    file: kernel/fs.c
    lines: 617-664
    focus: 648-664
    diff: true
    state:
      hart: 0
      mode: S
      proc: mv (pid 7)
      intr: "on"
      satp: kernel
      locks: ["a's inode lock (inode 26, sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_rename, dirset]
      sp: {"on": kernel}
    note: |
      Commit 2 adds one helper next to [[dirlink]]. `dirset(dp, off, inum)` reads the entry
      at byte offset `off`, changes its inode number, and writes it back: inode 0 frees the
      entry (zeroing the name too, exactly as [[sys_unlink]] does,
      [[kernel/sysfile.c:235]]-[[kernel/sysfile.c:237]]); any other number makes the same
      name refer to another inode.

      Compare it with [[dirlink]] just above. [[dirlink]] looks for a free slot and may
      extend the directory, which can need a new block and fail. `dirset` only touches an
      entry that exists, inside the directory's size, so [[writei]]'s [[bmap]] finds a
      block already allocated: it cannot run out of space, and a short write is a kernel
      bug, hence `panic`. That difference decides the order of the rename's steps.

      The caller holds the directory's lock, as [[readi]] and [[writei]] require. In the
      recorded `mv a/x a/y`, pid 7 held `a` (inode 26) when it cleared the old entry at
      offset 48: `x` was the fourth entry, after `.`, `..` and `d`. Holding a sleep-lock
      does not turn interrupts off: noff stayed 0 and SIE 1 ([[concept:locks#sleep-locks]]).
