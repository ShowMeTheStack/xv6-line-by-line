      The whole body is one transaction: [[begin_op]] on line 291, [[end_op]] at the end.
      Inside, [[nameiparent]] resolves both paths to their parent directories and last
      names. Line 295 refuses `.` and `..` as either last name, as [[sys_unlink]] does
      ([[kernel/sysfile.c:221]]): renaming `a/.` would mean locking `a` twice. Line 297
      refuses two directories for now.

      Line 300 locks the directory, and the rest of this step happens under that one lock,
      so no other process can see a moment where `x` is gone and `y` is not there yet.

      - [[dirlookup]] finds `x` and its offset (`off1`), and `y` if it exists (`off2`).
        Both come back referenced but unlocked.
      - `tp == ip`: the two names already lead to the same inode (`mv a/x a/x`, or two hard
