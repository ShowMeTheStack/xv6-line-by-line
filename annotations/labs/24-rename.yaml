      At the breakpoint the first transaction has committed and been installed: `log.lh.n`
      is 0 and nothing is outstanding, so the disk already holds the entry `cr/b/f → 29`.
      The second transaction, which would clear `cr/a/f`, never begins. After the reboot both
      names exist (`ls` shows inode 29 in both directories), and `renametest check` says so.

      Unlike the user-space `link` + `unlink` of the first question, this is not just a
      half-done rename: **the link count is wrong.** A rename does not touch the inode's
      `nlink`, because it removes one name for every name it adds; split in two, the first
      half adds a name without counting it. Inode 29 has two entries and `nlink` 1, which
      the host checker reports.

      The damage shows up later and somewhere else. `rm cr/a/f` drops `nlink` to 0, and
      [[iput]] frees the inode and its blocks: the file system believes the file is gone.
      `cr/b/f` still names inode 29. `cat cr/b/f` looks it up, [[ilock]] reads the on-disk
      inode, finds type 0 (free), and panics with `ilock: no type`
      ([[kernel/fs.c:316]]). Had another file been created first, inode 29 would have been
      reused, and `cr/b/f` would silently have become someone else's file.

      The same crash test against the reference's single transaction: 30 kills at random
      moments, 30 consistent disks (see verify). Holding the locks across the gap does not
      help: locks protect against other processes, not against a crash. Only the log does,
      and only within one transaction. (Calling [[begin_op]] with inode locks held also
      breaks rule 2 of [[tour:18]]: with other file-system activity it can deadlock.)
