      $ renametest check
      renametest: failed: f has not exactly one name
      renametest: check: f in cr/a (2 names), d in cr/a (1 name)
      renametest: check: FAIL
      $ ls cr/a
      .              1 27 64
      ..             1 26 64
      f              2 29 5
      d              1 30 32
      $ ls cr/b
      .              1 28 48
      ..             1 26 64
      f              2 29 5
