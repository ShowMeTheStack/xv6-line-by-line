  record and before the log was cleared, and the reboot finished that rename (3 blocks for
  a file move, 4 for a directory move); the other 16 found an empty log. The two
  gdb-controlled kills of the reveal (just before and just after [[write_head]]) gave the
  old state and the new state respectively, each with exactly one name.

  What this shows: the rename is all-or-nothing on disk; the `..` entry and both link
  counts always agree with where the directory is, also after concurrent directory moves
  and refused cycles; nothing that `usertests` exercises changed; and seven processes on
  three harts finish. What it does not show: `renametest`'s concurrent part would not have
  caught the naive or the inode-number order without help (clinics 1 and 2). The argument
  that the reference cannot deadlock is the lock order, not the test.

measure: |
  **Blocks per rename.** A copy of the kernel printed `log.lh.n` and the logged block
  numbers at each rename's [[end_op]], with a scratch program (not on the branch) that
  sets up each case:

  | rename | dp1, dp2, moved inode | blocks logged | which |
  |---|---|---|---|
  | file, same directory | 27, 27, 30 | 2 | 1157 (`m` data), 34 (inodes 16 to 31) |
  | file, `m` → `m/a` | 27, 31, 30 | 3 | 1160, 34, 1157 |
  | file replacing a 3-block file, `m/a` → `m/b` | 31, 32, 30 (replaced: 33) | 5 | 1161, 35, 1160, 34, 46 (bitmap) |
  | directory, `m/a` → `m/b` | 31, 32, 33 | 5 | 1161, 35, 1160, 34, 1162 (its `..`) |
  | directory into a parent with one full block | 32, 34, 33 | 5 | 46, 1164 (new block), 35, 1161, 1162 |
  | directory into a parent with 12 full blocks, inodes in 3 inode blocks | 51, 85, 68 | **8** | 46, 1179 (indirect), 1180 (new block), 38, 1165, 36, 1166, 37 |

  In this image the inode blocks start at block 33 (16 inodes each) and the bitmap is
  block 46. The worst case is 8 of the 10 blocks [[begin_op]] reserves. The replaced
  file's three data blocks cost one block (46): freeing clears bits in the bitmap.

  **What a split transaction costs.** The same 30-kill crash test against clinic 4's
  kernel (new entry committed, then the old one removed in a second transaction): 17 of
  30 checks failed, every time with one inode under two names and a link count of 1
  (`f in cr/a (2 names)` or `d in cr/a (2 names)`); the host checker flagged each of
  those 17 images (1 to 3 problems: a wrong link count, a directory reached twice, a
  wrong `..`). The single transaction: 0 of 30.

  **Deadlocks found** (all on 3 harts, final `renametest`):

  | kernel | runs | deadlocked |
  |---|---|---|
  | naive order | 4 × `concurrent 1000` | 0 |
  | naive order, delay after the first lock | 6 × `concurrent 1000` | 4 (2 file mover vs file mover, 2 file mover vs directory mover) |
  | inode-number order | 4 × `concurrent 1000` | 0 |
  | inode-number order, delay after the first lock | 2 × `renametest`, 4 × `concurrent 1000` | 2 (rename vs unlink, both in `concurrent 1000`) |
  | reference, delay after the first lock | 2 × `concurrent 1000` | 0 |

  **Time.** The 200-round concurrent part (1600 renames, 400 refused cycles) took 110 and
  121 ticks in the two verify runs, and `renametest concurrent 1000` 471 ticks; across the
  other runs above, `concurrent 1000` took between 371 and 790 ticks (measured while the
  computer was busy with other work; your times will differ).
  These numbers vary too much to compare the lock orders by speed; correctness is the
  point here.
further: |
  - **Replace an empty directory.** POSIX allows `rename(dir1, dir2)` when `dir2` is an
    empty directory. You must lock `dir2` (a child of the new parent) and check it is empty
    under its lock, as [[sys_unlink]] does, and `nlink` bookkeeping now involves four
    inodes. It also teaches why `isdirempty` must be checked with the lock held.
  - **Atomic replace for applications.** Write a small "save" program: write a new file
    `x.tmp`, then `rename("x.tmp", "x")`. Kill QEMU at random moments and show that `x` is
    always the complete old or the complete new content. This is how real editors save.
    (Which ordering guarantee does xv6's log give between the data writes and the rename?)
  - **A finer lock.** `renamelock` serializes all two-directory renames in the file
    system. Measure how often `concurrent` waits for it (count sleeps in [[acquiresleep]]
    on it), then think about what a per-subtree scheme would need, and why Linux kept a
    single per-file-system mutex.
  - **Lockdep for sleep-locks.** Lab 21's lock-order checker records orders between inode
    sleep-locks too. Combine it with this lab, run `renametest concurrent` with the naive
    order, and see it report the cycle *before* the deadlock happens.
  - **An in-kernel fsck.** Port the host checker's ideas into a boot-time check that
    walks from the root and reports unreachable inodes and wrong link counts, like
    [[ireclaim]] but for more than `nlink == 0`.
