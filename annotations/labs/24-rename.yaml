      ([[tour:5]]): `SYS_rename` is 23 in [[kernel/syscall.h]], the table in
      [[kernel/syscall.c]] gets `[SYS_rename] = sys_rename`, [[user/usys.pl]] emits the
      `li a7, SYS_rename; ecall` stub, and [[user/user.h]] declares
      `int rename(const char *, const char *)`.

