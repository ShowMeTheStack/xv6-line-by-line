      [[argint]] reads the interval from the saved `a0`; [[argaddr]] reads the handler from
      the saved `a1`, as a plain 64-bit number. Neither checks anything, and nothing needs
      checking: the kernel never dereferences the handler. It will only ever copy it into the
      saved program counter, so if it is garbage, the process jumps to garbage in user mode,
      and the hardware handles that like any other bad jump.

      `sigalarm(0, 0)` stores interval 0, which is what "off" means; a negative interval is
      refused. Resetting `alarmticks` makes every `sigalarm` start a fresh interval.

      `sys_sigreturn` is a placeholder at this commit. It returns -1, and [[syscall]] will
      put that in `a0`.
    others: |
      Hart 0 and hart 1 have nothing to run: their schedulers scan the process table, taking
      and releasing each `p->lock`, and wait for interrupts. They never look at pid 3's alarm
      fields; only pid 3 does, on whichever hart it runs.
