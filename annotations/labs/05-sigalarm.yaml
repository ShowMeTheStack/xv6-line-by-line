      `alarmframe` is a whole `struct trapframe` embedded in `struct proc`, at offset 376 at
      this commit (`addi a4,s1,376` in the inlined copy; 384 at the branch head, after
      `alarmactive` is added). The real trapframe is a separate
      page, because the trampoline must reach it at the fixed address `TRAPFRAME` in every
      user page table. The copy is never touched by the trampoline, so ordinary kernel
      memory will do. Embedding it means no allocation and no failure path; each of the 64
      slots grows by 304 bytes at this commit (360 to 664), and by 312 at the head (360 to
      672).

