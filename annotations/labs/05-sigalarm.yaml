  - title: Why not next to ticks++?
    commit: 2
    file: kernel/trap.c
    lines: 180-194
    focus: 183-188
    state:
      hart: 2
      mode: S
      proc: alarmtest (pid 3)
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap, devintr, clockintr]
      sp: kernel
      irq: 0
    note: |
      A moment earlier on the same path, `devintr` called [[clockintr]]. On hart 2,
      `cpuid() == 0` is false, so the whole block is skipped: `ticks` is not touched. The
      only thing every hart does is re-arm its own timer, `stimecmp = time + 1000000`, a tenth
      of a second ahead at QEMU's 10 MHz timebase ([[g:sstc]]).

      So `ticks` is hart 0's wall clock, protected by `tickslock` because `sys_uptime` and
      `sys_pause` read it from any hart. It cannot tell you how much CPU time pid 3 used: it
      advances while pid 3 sleeps, and it never advances because of anything pid 3's hart
      does. Clinic 5 put the count inside this `if`: a lone process got 28 handler calls in 100
      ticks instead of about 100, and with three processes the one that sat on hart 0 got
      nearly all of them.
    others: |
      This is the step to picture three timers. Each hart's `stimecmp` fires on its own
      schedule. Hart 0's interrupt increments `ticks` and wakes sleepers in `pause`; hart 1's
      and hart 2's only re-arm. A process gets a tick from whichever hart it is running on.
