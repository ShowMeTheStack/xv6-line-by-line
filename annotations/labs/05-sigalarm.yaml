    note: |
      [[usertrap]] returned the user `satp` to [[uservec]]'s `jalr`, which falls into
      [[userret]]. It installed pid 3's page table (line 111), reloaded every register from
      the trapframe, `a0` last (line 149), and executes `sret`: user mode, interrupts on, and
      the program counter from `sepc`, which is 0.

      So the first user instruction is `addi sp,sp,-16` at address 0, the start of `periodic`.
      Every register holds what the interrupted `waitfor` had. `periodic` was never called,
      so its `ra` is `waitfor`'s `ra` (`0x136`), and if it ever executed `ret` it would
      "return" into the middle of `waitfor`. That is why a handler must end with
      `sigreturn()`.

      The handler's frame goes on the same user stack, just below `waitfor`'s `sp`: at
      `0x4f20`. The RISC-V calling convention says procedures "must not rely upon the
      persistence of stack-allocated data whose addresses lie below the stack pointer" (it
      defines no red zone), so `periodic` can be dropped onto the stack at any instruction
      without harming `waitfor`.
