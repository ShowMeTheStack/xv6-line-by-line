      stack: [main, test_called, waitfor, periodic]
      sp: {"on": user, switched: "`sret` in [[userret]] ([[kernel/trampoline.S:153]])", detail: "periodic's frame at 0x4f20, just below waitfor's sp 0x4f30"}
    note: |
      This is the code that ran after the `sret` three steps back. `periodic` is the first
      function in the file, and `alarmtest.asm` shows `0000000000000000 <periodic>:`; the
      test prints the address, so a reader can see that 0 is real code.

      The stack list above is an honest oddity: `waitfor` never called `periodic`. The
      kernel dropped it on top of `waitfor`'s frame, so its saved `ra` is `waitfor`'s `ra`
      (`0x136`), and only `sigreturn()` gets the process back. `count` is `volatile` because
      `main`'s loop reads it while the handler changes it behind the compiler's back.

      `slow` (from line 21) is the long handler for the re-entry test: it records its nesting
      depth and prints a line if it is ever entered twice. In clinic 2 that line appeared 56
      times.
  - title: Checking 26 registers at once
    commit: 7
    file: user/alarmtest.c
    lines: 83-150
    focus: 94-104
    state:
      hart: 2
      mode: U
      proc: alarmtest (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main, test_registers, fillspin]
      sp: user
    note: |
      `fillspin` is [[g:inline-asm]]: it loads 26 registers with recognizable patterns
      (`x11` gets `0x1111111111111111`), spins 20 million times with the counter in `a0`, then
      stores all 26 into `regs[]`. The clobber list tells the compiler that every one of them
      changes, so it saves `s1`-`s11` and `ra` in the prologue. `sp`, `s0`, `gp`, `tp` and `a0`
      are not compared; `a0` gets its own test.

      gdb caught the deliveries: every one interrupted the loop at `0x52e` (`addi a0,a0,-1`),
      with `ra` = `0x0101010101010101`, `a7` = `0x1717171717171717`, `sp` = `0x4ed0`, and `a0`
      a counter such as `0xd049b3`. At the matching `sigreturn`, the trapframe held the
      handler's `ra` = `0x1e` and `sp` = `0x4ec0`; after the copy, the patterns were back.

      During this test the process moved: timer interrupts 18 and 19 of the gdb run landed on
      hart 2 and then on hart 1, and the trapframe's `kernel_hartid` changed from 2 to 1.
      `alarmframe` and the trapframe moved with the process, and the test passed.
    others: |
      A move between harts happens at a `yield()`: pid 3 becomes RUNNABLE, and the scheduler
      that next finds it, on hart 1 here, runs it. Nothing about the alarm cares which hart:
      [[prepare_return]] writes `kernel_hartid` fresh before every return, and everything else
      is per process.
  - title: Keeping a0 live on purpose
    commit: 7
    file: user/alarmtest.c
    lines: 167-208
    focus: 173-180
    state:
      hart: 1
      mode: U
      proc: alarmtest (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main, test_a0, a0spin]
      sp: user
    note: |
      `a0spin` puts a pattern in `a0` and spins with the counter in `t0`, so `a0` is live at
      every instruction of the loop. gdb saw the timer interrupts land at `0x7b8`
      (`addi t0,t0,-1`) on hart 1, with the trapframe's `a0` = `0x0a0a0a0a0a0a0a0a`, the value
      `alarmframe` then preserved.

      This is the check that catches the `sigreturn`-returns-0 bug. Elsewhere `a0` is often
      dead at the interrupted instruction, so a clobbered `a0` changes nothing. A good test
      makes the value you are worried about matter.
  - title: Measuring the rate
    commit: 8
    file: user/alarmrate.c
    lines: 1-56
    focus: 35-55
    diff: true
    state:
      mode: U
      proc: alarmrate
      intr: "on"
      satp: user
      locks: []
      stack: [main]
      sp: user
    note: |
      `alarmtest` checks behaviour with generous time limits; it cannot tell a correct rate
      from a wrong one (clinic 5 passed all six checks). `alarmrate INTERVAL SECONDS NPROC`
      forks `NPROC` spinners, each with `sigalarm(INTERVAL, tick)`, and lets them burn user
      time for `SECONDS` of wall-clock time measured with `uptime()`. Each child reports its
      handler count through its [[g:exit-status]], so the parent prints whole lines that
      cannot interleave.

      With the reference kernel on three harts: one spinner, interval 1, 10 seconds: 97
      calls; three spinners: 91, 96, 94; six spinners: 45 to 49 each. The alarm follows the
      CPU time each process actually gets, not the clock on the wall. The full numbers are
      under Measure.
verify: |
  On the branch head, on three harts (QEMU `-smp 3`), `alarmtest` passes, `usertests -q`
  passes, and `alarmtest` passes again afterwards:

  ```text
  $ alarmtest
  alarmtest: periodic is at address 0x0000000000000000
  alarmtest: 5 calls; 0 more in 10 ticks after sigalarm(0, 0)
  alarmtest: handler called, then stopped: OK
  alarmtest: sigreturn outside a handler fails: OK
  alarmtest: the handler ran during 10 fillspin runs (10 calls)
  alarmtest: registers preserved: OK
  alarmtest: slow ran 3 times, nested at most 1 deep
  alarmtest: no re-entry: OK
  alarmtest: the handler ran during 10 a0spin runs (10 calls)
  alarmtest: sigreturn restores a0: OK
  alarmtest: handler calls in the forked child: 0, after exec: 0
  alarmtest: fork and exec start with the alarm off: OK
  alarmtest: 6 of 6 checks OK
  $ usertests -q
  usertests starting
  [...]
  test lazy_sbrk: OK
  test partial_write: OK
  test unlinkcwd: OK
  ALL TESTS PASSED
  $ alarmtest
  alarmtest: periodic is at address 0x0000000000000000
  [...]
  alarmtest: 6 of 6 checks OK
  ```

  What this shows: the handler is called and stopped; all 26 compared registers and `a0`
  survive ten interrupted runs each; a long handler is never nested; a forked child and an
  exec'd program start with the alarm off. No program in `usertests` calls `sigalarm`, so
  for every other process the only cost is one load and compare per user-mode timer
  interrupt (`alarminterval == 0`), and 312 more bytes in each of the 64 `struct proc`
  slots (`struct proc` grows from 360 to 672 bytes in this build).

  Every commit on the branch was built from clean (`make clean; make kernel/kernel fs.img`).
measure: |
  **Handler calls versus the requested interval, on three harts.** `alarmrate INTERVAL 10
  NPROC` (each process spins for 100 ticks of `ticks`, ten seconds), reference kernel, one
  boot:

  | interval | processes | handler calls per process | with a hart to itself |
  |---|---|---|---|
  | 1 | 1 | 97 | about 100 |
  | 1 | 3 | 91, 96, 94 | about 100 |
  | 1 | 6 | 45, 46, 49, 45, 49, 47 | about 100 |
  | 5 | 1 | 18 | about 20 |
  | 5 | 6 | 10, 9, 9, 9, 9, 9 | about 20 |
  | 1 | 1 (again, at the end) | 89 | about 100 |

  - Up to three processes, each gets a hart of its own and close to the full rate. The few
    missing calls are ticks that landed while the process was in the kernel: its `uptime()`
    calls, the `yield()` after every tick and the trip through the scheduler. Those go to
    [[kerneltrap]] and are not user time.
  - Six processes on three harts get about half each (45 to 49 instead of about 95): the alarm
    measures CPU time, and each had a hart about half the time.
  - Interval 5 gives a fifth of the calls, as it should (18 instead of 97; 9 or 10 instead of
    about 47).

  **The same measurement with ticks counted next to `ticks++`** (clinic 5), same machine:
  one process, interval 1, 10 seconds: **28** calls on one run and **83** on another; three
  processes: **89, 7 and 0**. In a 30-second run with gdb sampling the harts, pid 6 was on
  hart 0 in all 8 samples and got 251 calls; pids 4 and 5, on harts 1 and 2, got 6 and 23.
  The reference kernel gave the three processes 91, 96 and 94. The difference is the whole
  point of the second think question: a process's ticks must be counted on the hart it runs
  on, and only hart 0 advances `ticks`.

  **Cost of a delivery.** One extra trip through the kernel (the `sigreturn` system call; the
  timer interrupt that redirects would have happened anyway), plus two 288-byte copies.
further: |
  - **Count kernel time too.** Count timer interrupts in [[kerneltrap]] when `myproc()` is
    not 0, and deliver at the next return to user space. Teaches the difference between
    `ITIMER_VIRTUAL` and `ITIMER_PROF`, and why the delivery must still happen in
    [[usertrap]].
  - **Pass an argument.** Call the handler as `handler(ticks)` by setting `a0` in the
    trapframe before the return. Teaches the calling convention from the callee's side, and
    why `alarmframe` must be taken before `a0` is changed.
  - **Let the handler return normally.** Set the handler's `ra` to a small piece of code
    (a "trampoline" in the user's memory) that calls `sigreturn`, as Unix kernels do. Teaches
    where that code can live and who maps it.
  - **Nested signals.** Allow a second, different signal while a handler runs, by keeping a
    stack of saved frames on the user stack. Teaches why real kernels save the frame in user
    memory, and what they must check when they read it back.
  - **Ctrl-C as a signal.** Lab 6 delivers an interrupt from the console to the foreground
    job; with this lab's delivery path you could let a program catch it instead of dying.
