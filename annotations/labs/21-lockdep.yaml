      #7  order (h=h@entry=0x80020268 <held>, c=c@entry=8, pc=pc@entry=0x3fffffded8) at kernel/lockdep.c:310
      [...]
      #11 0x00000000800038d6 in kwait (addr=0) at kernel/proc.c:381
      $1 = 1
      $2 = 1
    why: |
      Two boots, the same freeze, with not one character of the report printed. Hart 0 is
      `init` in [[kwait]]: the checker found the cycle (frame 7, holding `ldlock`) and called
      `report()`, whose first [[printk]] acquires `pr.lock`. That acquisition goes through the
      checker too; hart 0 holds `wait_lock`, the order `wait_lock -> pr` is new, and the slow
      path wants `ldlock`, which hart 0 itself holds (`$1 = 1`). `ldlock` has no owner check,
      so instead of `panic: acquire` the hart spins on itself, with interrupts off, forever.
      Hart 2 (the shell, in [[consoleread]] → [[killed]]) then needed `ldlock` for a new order
      of its own and joined it; hart 1 was idle in its scheduler.

      The checker had found exactly the bug it was built for, and the machine froze silently,
      as the bug itself would have. Anything the checker does while holding its lock must not
      come back into the checker: the reference marks the hart `busy` while it prints, and
      Linux's lockdep does the same with its recursion counter.
  - bug: The sleep-lock hook does not turn interrupts off
    change: |
      `lockdep_acquiresleep` without its `push_off`/`pop_off`. Its callers run with
      interrupts on (a sleep-lock is taken in a system call), so the hook now uses the hart's
      lists and may take `ldlock` with interrupts on:

      ```diff
      -  push_off(); // stay on this hart while using its list
         p = mycpu()->proc;
         if (lockdep_on && !busy[cpuid()]) {
      [...]
             push(&sheld[s][nsheld[s]++], lk, c, pc);
         }
      -  pop_off();
       }
      ```
    symptom: |
      $ echo hi > x
      $ rm x
      $ usertests -q
      usertests starting
      [...]
      ALL TESTS PASSED

      (a second boot, `usertests -q` twice: both ALL TESTS PASSED, no report, no panic)
    why: |
      Two boots, three runs of `usertests -q`, nothing. The bug is real; it just needs timing
      that these runs never produced. Reasoned from the code:

      - **`ldlock` with interrupts on.** The slow path of the sleep-lock hook (a new order,
        or a class's first use) takes `ldlock`. A timer or device interrupt arriving then, on
        this hart, runs a handler whose `acquire` also calls the checker. If that acquisition
        needs `ldlock` too (a new order in the handler, or the first use of a class in a
        handler), the handler spins on a lock held by the code it interrupted: the same-hart
        deadlock that `acquire`'s own [[push_off]] prevents for every spinlock.
      - **The hart can change under it.** With interrupts on, a timer interrupt can make the
        process [[yield]] in the middle of the hook and resume on another hart. Then
        `cpuid()`, `busy[]` and `nchecks[]` refer to a hart the code is no longer on.

      Why it stayed hidden: the checker's slow path ran 46 times in a whole `usertests -q`
      run, mostly early, and by then the handlers' own orders are long known, so a handler hardly ever needs
      `ldlock`. The window is real and narrow. This is the clinic of tour 52's break 7 in
      another form: a test that passes says nothing about a race the test cannot hit, and the
      rule ("whoever holds this lock has interrupts off") has to come from reasoning.
  - bug: "Not a bug: the iput cycle, reported as one"
    change: |
      The reference with [[iput]] taking the lock with [[acquiresleep]] again, as in the
      original tree:

      ```diff
      -    if (!tryacquiresleep(&ip->lock))
      -      panic("iput: inode locked");
      +    acquiresleep(&ip->lock);
      ```
    symptom: |
      $ echo hi > x
      $ rm x
      lockdep: acquiring inode while holding itable may deadlock
      hart 0, pid 4 (rm):
        holds itable at 0x80004aba 0x80004b8a 0x80006812 0x80003f9c 0x80003d22
        wants inode at 0x80005722 0x80004b00 0x80004b8a 0x80006812 0x80003f9c
      but this order has been seen before:
      hart 0, pid 1:
        holds inode at 0x80004924 0x800049c6 0x8000507a 0x800051be 0x80005f94
        wants itable at 0x80004478 0x80004f9a 0x8000509c 0x800051be 0x80005f94
      panic: lockdep

      (the addresses, each decoded at address - 2 with ${TOOLPREFIX}addr2line -f -i:)
      holds itable:  iput fs.c:363, iunlockput fs.c:400, sys_unlink sysfile.c:246, syscall, usertrap
      wants inode:   acquiresleep sleeplock.c:25, iput fs.c:377, iunlockput, sys_unlink, syscall
      holds inode:   ilock_nested fs.c:314, ilock fs.c:300, namex fs.c:717, namei fs.c:749, kexec exec.c:42
      wants itable:  iget fs.c:256, dirlookup fs.c:625, namex fs.c:731, namei, kexec
    why: |
      The first `rm` of a file panics. `rm x` drops the last reference to an unlinked inode,
      so [[iput]] takes the inode's sleep-lock while holding `itable.lock` (line 377 here):
      `itable -> inode`. The other order was learned at boot, by pid 1 running
      [[kexec]]`("/init")`: [[namex]] holds the root directory's lock and [[dirlookup]] calls
      [[iget]], which takes `itable.lock`: `inode -> itable`.

      Both orders are real, but they cannot meet. `iput` takes the lock only when `ip->ref ==
      1`, and the reference it holds is the only one, so no process holds that inode's lock or
      waits for it, and the `acquiresleep` never waits. The `inode` held by namex is always one
      somebody references (namex does), so it is never the inode `iput` is freeing. The
      checker cannot know that `ref == 1` makes the second order happen only on unreferenced
      inodes: it sees classes.

      The temptation is to exempt `itable` from checking, or to delete the edge. Both would also
      hide a real bug that someday takes a referenced inode under `itable.lock`. The
      reference's answer is to say what is true in code: the acquisition is a try, a try
      records no order, and `iput` panics if the try ever fails, so the claim is checked on
      every call. With the trylock this kernel passed `usertests -q` with no report, and the
      panic never fired.
reveal:
  - title: A class number in the lock's padding
    commit: 1
    file: kernel/spinlock.h
    lines: 1-9
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: []
      stack: [main, consoleinit, initlock, lockdep_class]
      sp: boot
      irq: 0
    note: |
      The checker reasons about classes, so every lock carries its class number. `locked` is
      a 4-byte `uint` followed by 4 bytes of padding before the 8-byte `name` pointer; `cls`
      fills the padding. `struct spinlock` stays 24 bytes, `struct sleeplock` (the same change)
      stays 48, and nothing that embeds a lock (`struct proc`, `struct pipe`, every buffer and
      inode) moves.

      [[initlock]] now ends with `lk->cls = lockdep_class(name, 0)`, and [[initsleeplock]] with
      `lockdep_class(name, 1)`. gdb, stopped at the first call on the finished branch: hart 0,
      in [[main]] → [[consoleinit]] → `initlock(&cons.lock, "cons")`, with no lock held and
      `sstatus = 0x200000000` (SIE clear). So `cons` is class 1.
    others: |
      Harts 1 and 2 are spinning in [[main]] waiting for `started`; they create no locks. Later,
      any hart can create a class: every [[pipealloc]] calls `initlock(&pi->lock, "pipe")`.
  - title: The class table and a lock the checker can use
    commit: 1
    file: kernel/lockdep.c
    lines: 19-71
    focus: 29-47
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: []
      stack: [main, consoleinit, initlock, lockdep_class]
      sp: boot
      irq: {noff: 1, intena: 0, note: "lockdep_class's own push_off (line 56); SIE was already off at boot. ldlock is not a spinlock and is not counted"}
    note: |
      The table maps a class number to its name; class 0 means "none", so a lock never passed
      to `initlock` is noticed. Lookup compares the strings, so every `initlock(&p->lock,
      "proc")` in [[procinit]] gets the same class.

      The table needs a lock: pipes create classes at any time, on any hart. It cannot be a
      `struct spinlock`. The next commit makes [[acquire]] call the checker, and a checker that
      called `acquire` would recurse (clinic 1 recorded the result). `ldlock` is a bare word:
      `ldlk()` is the swap loop that `acquire` uses, `ldunlk()` the release store, with nothing
      else.

      What it keeps from a spinlock is the rule about interrupts: whoever holds `ldlock` must
      have them off, or a handler on the same hart could need it and spin forever. Here
      `lockdep_class` calls [[push_off]] itself (line 56), because [[pipealloc]] calls
      `initlock` with interrupts on.
