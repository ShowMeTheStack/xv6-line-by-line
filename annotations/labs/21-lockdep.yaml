measure: |
  **Run time.** `usertests -q` on three harts, wall-clock time measured by the script that
  drives QEMU (measured while the computer was busy with other work; your times will
  differ, since timings on QEMU depend on what else the computer is doing). To make the
  comparison fair, the kernels of each round started at the same moment, so they shared
  whatever else the computer was doing:

  | round | original kernel | branch head | head / original |
  |---|---|---|---|
  | 1 | 80.3 s | 93.2 s | 1.16 |
  | 2 | 60.1 s | 81.7 s | 1.36 |
  | 3 | 54.3 s | 65.4 s | 1.20 |
  | 4 | 55.2 s | 72.3 s | 1.31 |
  | 5 | 49.4 s | 68.4 s | 1.38 |
  | 6 | 54.6 s | 66.3 s | 1.21 |
  | 7 | 50.6 s | 62.6 s | 1.24 |
  | 8 | 50.9 s | 59.7 s | 1.17 |
  | 9 | 60.6 s | 71.5 s | 1.18 |

  With the checker, `usertests -q` took 16 to 38 percent longer (median 21 percent). How much
  of the spread is noise? In rounds 1 to 6 a second copy of the *same* head kernel ran
  alongside; the two copies differed by 0 to 4.3 percent (97.2 against 93.2 s in round 1).

  **What the time goes on.** The checker examined 25.7 to 28.9 million acquisitions per run
  and took its own lock 46 times. So the cost is the per-acquisition bookkeeping, not the
  graph: a call, the five-frame trace, the push on a held list, and the search on release.
  To see what the lock-free fast path is worth, a scratch copy took `ldlock` on every call to
  `order()` (rounds 7 to 9 ran it alongside the other two): it took the lock 39.7 to 42.0
  million times per run (more than the acquisitions: an acquisition with two locks held makes
  two calls) and was 7 to 11 percent slower than the head (69.1, 64.1 and 79.6 s against
  62.6, 59.7 and 71.5 s). Worth having, but most of the checker's cost is elsewhere.

  **What it learned.** After boot, `ls` and `usertests -q`: 19 classes (including the
  subclasses `inode/1` and `buffer/1`) and 46 orders, close to [[tour:51]]'s measured graph.
  Ctrl-P prints them; for example `lockdep: proc -> kmem nextpid itable ftable` and `lockdep:
  inode -> sleep lock kmem proc bcache buffer itable ftable virtio_disk log inode/1 buffer/1`.

  **What QEMU hides.** The times are QEMU's, on a busy computer; they say "about a
  fifth slower", not a cycle count. On real hardware the shared `after[]` words would be read
  by every hart and almost never written, which caches handle well. The per-hart arrays are
  another matter: `nheld`, `nchecks`, `inirq` and `busy` are small arrays indexed by hart,
  written on every acquisition, so neighbouring harts' entries share cache lines.
further: |
  - **The log as a lock.** [[begin_op]] can make a process wait for a commit, and the
    committing process holds buffers: it behaves like a lock the checker cannot see
    ([[tour:51]] makes the same point). Give it a class of its own (Linux does this for its
    journal with a `lockdep_map`) and see which orders appear.
  - **Check the buffer roles.** `SUB_INNER` is a claim. Add a check that a `SUB_INNER` read
    really happens while a buffer is held, or make the roles per block type (log, bitmap,
    indirect, data) and let the checker learn their order.
  - **Irq-safe before irq-unsafe.** Linux also reports an edge from a class used in a handler
    to a class held with interrupts on, through any path. In xv6 only sleep-locks can be the
    second; add the check and explain why it never fires.
  - **Hold times.** Record how long each class is held (the `time` CSR at acquire and
    release) and print the longest, per class. Which spinlock is held longest, and is it
    one a handler waits for?
  - **Sleeping holding a spinlock, by name.** [[sched]] panics `sched locks` without saying
    which lock. Make it print the hart's held list first.
