    note: |
      A report is useless without "where". xv6 is compiled with `-fno-omit-frame-pointer`, so
      every function keeps `s0` pointing at the top of its frame, with its return address at
      `s0-8` and the caller's `s0` at `s0-16`. `trace()` starts from the checker's own frame,
      skips `acquire`'s, and copies up to five return addresses (`NTRACE`): the function that
      called `acquire`, its caller, and so on. It stops at the edge of the current stack page.
      For a process's kernel stack (one page) that is the stack's edge; the boot stacks in
      `stack0` are not page-aligned (`stack0` is at `0x80009be0` in this build), so there a
      walk may read a few words of a neighbouring slice, which is harmless. (Lab 2, the kernel backtrace, builds the
      same walk.)

      gdb printed the entry for `proc[0].lock` on hart 0's list: `pc0 0x800031e2 pc1
      0x80003274`, which `addr2line` turns into [[allocproc]] ([[kernel/proc.c:115]]) and
      [[userinit]]. Each entry is the lock, its class and five addresses: 56 bytes, up to eight
      per hart (`MAXHELD`; the deepest real nesting is three).
