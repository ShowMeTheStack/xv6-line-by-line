  - title: Where was it acquired? Walking the frame pointers
    commit: 2
    file: kernel/lockdep.c
    lines: 88-126
    focus: 90-107
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: ["p->lock (proc[0], being built)"]
      stack: [main, userinit, allocproc, allocpid, acquire, lockdep_acquire]
