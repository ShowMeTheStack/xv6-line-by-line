    note: |
      `tryacquire()` makes one attempt and never spins. If it gets the lock it tells the checker
      with `try = 1`: the lock goes on the held list (so what is taken under it is still
      checked) but no order is recorded *for* it. A lock that is never waited for cannot be one
      of the waits in a deadlock. `tryacquiresleep()` does the same for a sleep-lock: a try on
      the inner lock, give up if the sleep-lock is taken, and never sleep.
