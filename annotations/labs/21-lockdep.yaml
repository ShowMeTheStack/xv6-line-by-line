published: true
title: "Lockdep-lite: a runtime lock-order checker"
area: Concurrency
stars: 4
branch: ext/21-lockdep
prerequisites: {tours: [13, 18, 51, 52], concepts: [locks]}
summary: |
  Two harts deadlock when each holds a lock the other wants. [[tour:52]] built one on
  purpose: a copy of the kernel whose [[kfork]] takes `wait_lock` while it still holds the new
  child's `p->lock`. The bug froze the machine, but only under a stress test, and when it froze
  all three harts spun with interrupts off and printed nothing. In this lab you build a
  checker that finds that bug **at boot, on the first run, before any deadlock**, and prints
  the two code paths that disagree.

  The idea is Linux's *lockdep*, cut down to fit xv6. Every time a lock is acquired, note
  which locks are already held: an order "this before that", an edge in a graph. A deadlock
  needs two paths that take the same two locks in opposite orders (or a longer ring of them),
  so the first acquisition that would close a cycle in that graph is a warning, even if the
  two paths have never run at the same time. The checker does not wait for the unlucky timing. It needs the paths only
  to run once each, in any order.

  Every design decision is a question about xv6's locks. What *is* a class, and what does a
  class graph get wrong? Whose locks are "held": a hart's or a process's, when `p->lock` is
  acquired by the scheduler and released by the process on the other side of [[swtch]], and a
  sleep-lock's holder may wake up on another hart? How can the checker protect its own graph
  when it runs *inside* [[acquire]]? What about interrupt handlers? And what do you do when
  the checker, on its first real run, reports cycles in code that has never deadlocked and
  never will? This tree has three of them, all of them known (the concept page measured them),
  and the lab handles each one honestly: by writing down, in code the checker can use, the
  rule that makes it safe, and checking that rule at run time where possible.

  The reference solution is twelve commits. With it, boot and `usertests -q` run with no
  report while the checker examines about 27 million acquisitions, at a cost of 16 to 38
  percent in run time (measured while the computer was busy with other work; your times
  will differ).
learn:
  - "Why a deadlock between two locks needs two code paths that take them in opposite orders, and why a graph of lock *classes* can report that from one run of each path, before the deadlock ever happens."
  - "What a class graph over-approximates: why `iput`'s inode lock under `itable.lock`, a directory and a file in it, and a log block and its home block all look like cycles to a class graph, and what knowledge of the code makes each one safe."
  - "How can knowledge that only the code has (which instance, which role) be written into the code so that a checker can use it, and how can such an annotation fail loudly when it is wrong?"
  - "What must \"held\" mean when `p->lock` is acquired by one thread and released by another across `swtch`, and when a sleep-lock's holder wakes up on another hart?"
  - "How can a checker that runs inside `acquire` protect its own data, and what must it still have in common with a spinlock?"
  - "What is the interrupt rule for locks, and does xv6 need a checker for it?"
  - "What run-time checking costs, and which part of it is worth optimising."
spec: |
  **The checker.** Add `kernel/lockdep.c`, a lock-order checker that runs from boot and is
  called by every [[acquire]], [[release]], [[acquiresleep]] and [[releasesleep]].

  - Locks that play the same part must be treated alike: the 64 `p->lock`s created by one
    loop in [[procinit]], the 50 inodes, every pipe's lock.
  - For every acquisition the checker learns what the acquirer already holds, and keeps the
    order "held before new" in a graph.
  - An acquisition whose order would close a cycle in that graph is reported, whether or not
    a deadlock happens, with both orders: where each of the two (or more)
    locks on each path was acquired, on which hart, by which process.
  - It also checks the interrupt rule: a lock class used inside an interrupt handler must
    never be held with interrupts on.
  - It must handle what this tree really does: `p->lock` acquired by the [[scheduler]] and
    released by a process on the same hart, sleep-locks held across [[sleep]] and released on
    another hart, and locks taken inside interrupt handlers.
  - After a report it panics (a kernel option may let it print the report and switch itself
    off instead).

  **What must not change.** No struct that embeds a lock changes size. Every existing lock
  rule and check stays. **Boot and `usertests -q` must run on three harts with the checker on
  and silent, and print `ALL TESTS PASSED`.** Where the checker reports a cycle that cannot
  deadlock, the fix is an annotation in the code that explains why, not a switch that turns
  the checker off.

  **The test program**, `lockdeptest`, uses a new system call `lockdep(int cmd, struct ldstat
  *st)`: `lockdep(0, &st)` copies out the checker's statistics, and `lockdep(n, 0)` runs
  kernel self-test `n` (locks of its own, acquired in a right or a wrong order) and returns how
  many reports it caused. The program checks each count, and that the kernel's own locks have
  caused no report:

  ```text
  $ lockdeptest
  lockdeptest: 18 classes, 39 orders, 101086 acquisitions checked, 39 of them slowly
  lockdeptest: test 1: A then B; later B then A
  lockdep: acquiring test A while holding test B may deadlock
  [... the kernel's report ...]
  lockdeptest: test 1: 1 report(s), as expected: OK
  [... tests 2 to 6 ...]
  lockdeptest: checker on, no report about the kernel's locks: OK
  lockdeptest: 7 of 7 checks OK; read the reports above to see that each names both orders
  ```

  The program counts reports; it does not check what they say. The last line says so.
think:
  - title: What does the checker reason about, a lock or a kind of lock?
    q: |
      There are 64 `p->lock`s, 30 buffer locks, 50 inode locks, and a new lock for every pipe.
      The checker will remember "B was acquired while A was held" and look for cycles. Should
      A and B be individual locks, or groups of locks? If groups, how would you decide which
      lock belongs to which group, using only what xv6 already has? What would each choice
      catch, and what would it get wrong? Commit to an answer before the hints.
    hints:
      - |
        Look at the deadlock in [[tour:52]], break 6. [[kfork]] held one particular child's
        `p->lock`; [[kexit]]'s [[wakeup]] went for that same slot. Would the same deadlock
        need the same slot next time? And look at what [[initlock]] is given besides the lock.
      - |
        A deadlock needs two paths with opposite orders. If they are judged only lock by lock,
        both paths must have touched the *same* instances. How many instances are there of
        `p->lock`, and how many runs would that take?
      - |
        Groups. What does every lock already carry, from the moment it is created, that is
        the same for all `p->lock`s and different for `wait_lock`? Then check whether that
        ever puts locks with different roles in one group.
    answer: |
      **Groups, called classes.** A class is the name given to [[initlock]] or
      [[initsleeplock]]: `proc` for all 64 `p->lock`s (one call in [[procinit]]), `inode` for all
      50 inode sleep-locks, `pipe` for every pipe ever created. The reference keeps the class
      number in the lock itself, in the four bytes of padding after `locked`, so no struct
      changes size.

      Classes are what make the checker useful. The kfork bug is "some `p->lock`, then
      `wait_lock`" against "`wait_lock`, then some `p->lock`". With classes, one fork and one
      `wait` are enough to see both orders, whichever slots they used. Lock by lock, the checker
      would need both paths to touch the same slot, and would also need a graph node for each of
      156 spinlocks and 81 sleep-locks at boot, plus one for every pipe. Clinic 2 tried it: the
      class table overflowed in [[procinit]].

      The price is **over-approximation**. A class graph says "inode before inode" when
      [[create]] locks a directory and then a file in it; it cannot see that the two are always
      a parent and its child. It says "itable before inode" for [[iput]] and "inode before
      itable" for [[namex]], and cannot see that `iput` only does this when no one else holds a
      reference. Lock order is a property of instances; class graphs see less and report more.
      Most of this lab is about what to do with those reports.

      One more thing to notice: every sleep-lock's inner spinlock is created by the *same*
      `initlock(&lk->lk, "sleep lock")` call inside `initsleeplock`, so buffers, inodes and the
      UART's `tx_lock` share one inner class, `sleep lock`. Linux has the same issue with locks
      initialised inside a helper, and fixes it by passing a class key in from the caller. In
      this tree it causes no false report, so the reference leaves it.
    checks:
      - id: lab21-01
        level: 1
        type: choice
        q: |
          The reference checker groups locks by the name passed to [[initlock]]. Which pair of
          acquisitions would it treat as the *same* edge "proc before wait_lock"?
        options:
          - text: "kfork holding proc[8].lock takes wait_lock; another kfork holding proc[3].lock takes wait_lock."
            correct: true
            why: |
              Both `p->lock`s were created by the same `initlock(&p->lock, "proc")` call in
              [[procinit]], so they are one class; one edge covers every slot.
          - text: "None: each slot's lock is a separate node, so these are two different edges."
            why: |
              You may have pictured a graph of lock instances. That graph would need both
              paths to collide on the same slot before it could see the cycle; classes do not.
          - text: "Only if both forks ran on the same hart."
            why: |
              You may have mixed up classes with the per-hart list of held locks. Edges are
              global: an order seen on hart 0 and its reverse seen on hart 2 still close a cycle.
          - text: "Only if both forks were made by the same process."
            why: |
              You may have thought the graph is per process. It is one graph for the whole
              kernel; that is how it can relate code that ran at different times.
        explain: |
          A class is the set of locks that play the same part in the code. Learning orders per
          class turns "these two slots happened to collide" into "these two code paths disagree",
          which one run can show. See [[concept:locks#order]].
      - id: lab21-02
        level: 2
        type: tf
        q: |
          True or false: a graph of lock classes can report a cycle that can never deadlock.
        answer: true
        why_tf: |
          You may have thought every class cycle is a real bug. The class graph forgets which
          instance was locked, and some code is safe only because of which instance it locks.
        reasons:
          - text: "True: iput takes an inode lock under itable.lock only when no one else can hold that inode, but the graph sees only 'itable before inode'."
            correct: true
            why: That is the over-approximation this tree really has, and the one the concept page measured.
          - text: "True: the graph is updated without a lock, so it can contain edges that never happened."
            why: |
              You may have thought the fast path is unsafe. Edges are added only under the
              checker's lock; the lock-free part only *reads* bits that are never cleared.
          - text: "False: a cycle among classes always contains a cycle among instances."
            why: |
              You may have reasoned that classes just merge nodes. Merging nodes merges edges from
              different instances into one path, which can form a ring no instances ever form.
          - text: "False: the checker only records orders that happened, so any cycle it finds has happened."
            why: |
              You may have thought a cycle means a deadlock occurred. Each edge happened, but at
              different times and on different instances; the ring as a whole may be impossible.
        explain: |
          Class graphs over-approximate. A report is a question ("can these two paths really
          meet?") that only the code can answer. See [[concept:locks#order]] and [[tour:51]].
  - title: Whose locks are "held"?
    q: |
      When a lock is acquired, the checker must know what is already held, to record the
      edges. Is that a property of a hart, of a process, or of a thread? Think about two cases
      before you answer: the [[scheduler]] acquires a process's `p->lock` and switches to it,
      and the process releases it; and a process holding a buffer's sleep-lock sleeps in
      [[virtio_disk_rw]] and later wakes up on another hart. What must your bookkeeping do in
      each case?
    hints:
      - |
        Read [[concept:locks#handoff]] and [[holding]]: who does xv6 itself think holds a
        spinlock? Then read [[holdingsleep]]: who holds a sleep-lock?
      - |
        A spinlock is never held across a switch except `p->lock`, and that one stays on the
        same hart ([[sched]] checks noff 1). A sleep-lock is held across sleeps.
      - |
        Two lists: one kind per hart, one kind per process. Releasing must not assume that the
        lock being released is the last one pushed.
    answer: |
      **Spinlocks per hart, sleep-locks per process**, exactly as xv6 itself counts them:
      [[holding]] compares `lk->cpu` with this hart, [[holdingsleep]] compares the pid.

      - A spinlock list per hart handles the handoff for free. The scheduler's acquire pushes
        `p->lock` on the hart's list; after [[swtch]] the process, on the same hart, releases it
        and the release finds it there. The release must **search** the list rather than pop
        the top, because releases are not always in reverse order ([[kexit]] releases
        `wait_lock` while it still holds its own `p->lock`).
      - Sleep-locks are listed per process (per `proc[]` slot): a process sleeps holding a
        buffer and may resume on another hart, and only that process ever changes its list.
      - An acquisition is ordered after both: every spinlock on this hart's list and every
        sleep-lock of the running process (if there is one).

      A list per *thread* for spinlocks, which is what Linux keeps, breaks on the handoff: the
      scheduler's acquire goes to one list and the process's release looks in another. Linux
      handles its runqueue lock, which crosses the switch the same way, with explicit
      annotations that hand the lock over. Clinic 3 shows what happens without them: a panic at
      the very first [[forkret]].
    checks:
      - id: lab21-03
        level: 2
        type: state
        q: |
          The reference checker, at the moment [[forkret]] (its line 520) is about to release
          `p->lock` for the first process. gdb recorded this on hart 2. Fill in that hart's
          state.
        state: {mode: S, stack: kernel, sie: "off", noff: "1", intena: "0"}
        why:
          mode: You may have thought forkret runs in user mode because it leads to user space. It is kernel code, entered by swtch.
          stack: You may have thought the scheduler's stack is still in use. swtch loaded the process's context, so sp is on its kernel stack.
          sie: You may have thought interrupts are on in a new process. The scheduler acquired p->lock with them off, and they stay off until this release's pop_off decides.
          noff: You may have thought the lock does not count for the process. noff is per hart, and the scheduler's acquire is still counted until this release.
          intena: You may have thought intena is 1 here. The scheduler acquired the lock with interrupts off (intena 0), so this release leaves them off.
        why_wrong: |
          The process is running on the lock the scheduler took for it: noff 1, intena 0, and
          the hart's checker list holds one entry, pushed from inside [[scheduler]].
        explain: |
          gdb read `cpus[2].noff = 1`, `intena = 0`, and the hart's single list entry with its
          first return address at `scheduler + 98`. The process releases a lock it never
          acquired, and the per-hart list handles it. See [[concept:locks#handoff]].
  - title: When does the checker run, and what must it cost?
    q: |
      [[acquire]] is called tens of millions of times in `usertests`. Where in `acquire` should
      the checker look at the order: before the spin, or once the lock is held? And what must
      the common case cost, given that almost every order it will ever see, it has seen before?
    hints:
      - |
        The point of the checker is to speak before a deadlock. Where does a deadlocked hart
        stop executing?
      - |
        The set of orders is small and only grows: it never forgets one. What is the cheapest
        way to ask "have I seen A before B?" without taking any lock?
      - |
        Where does a deadlocked hart still execute code, and where does it never arrive? For
        the cost: a "yes or no" that only ever changes from no to yes can be read without a
        lock; how small can the table of such answers be, with at most 64 groups?
    answer: |
      **Before the spin.** A hart that deadlocks stops inside the spin loop, so a checker
      called after it would never run. The reference calls `lockdep_acquire()` right after the
      [[holding]] check, before the `amoswap` loop; [[acquiresleep]] calls the checker before it
      can sleep. The lock is pushed on the held list at that point too, as Linux does.

      **The common case is one load.** With at most 64 classes, the edges fit in one 64-bit
      word per class: bit `b` of `after[a]` means "a before b". Bits are only ever set, so a
      set bit read without any lock is still true, and the acquisition goes on. Only a clear
      bit takes the checker's lock, checks again, looks for a cycle, and sets the bit. In our
      `usertests -q` runs the checker examined 25.7 to 28.9 million acquisitions and took its
      lock 46 times: once for each order it learned.

      About three quarters of acquisitions happen with something already held (in a run of a
      copy of the kernel with counters added, 21.5 million of 28.1 million, making 42 million calls to `order()`;
      a copy that took the lock on every call took it 39.7 to 42.0 million times), and nearly
      all of those calls find their bit set. What every acquisition also pays is the bookkeeping: a
      return-address trace (five frames, found by following the frame pointers, as a
      backtrace does) and a push on the held list. Measure shows how much that is.
    checks:
      - id: lab21-04
        level: 2
        type: choice
        q: |
          A learner calls the checker at the end of [[acquire]], after the spin loop and after
          `lk->cpu = mycpu()`. Now inject the kfork bug from [[tour:52]] and run a stress test
          until the two harts collide. What does the learner's checker print at that moment?
        options:
          - text: "Nothing: both harts are spinning in acquire and never reach the check."
            correct: true
            why: |
              The deadlocked acquisitions never complete, so the code after the loop never runs.
              (It may still have reported the cycle earlier, from acquisitions that did not
              collide; but in the collision itself it is silent.)
          - text: "A report with both chains, just before the freeze."
            why: |
              You may have thought the check runs on every call. It runs only when the loop
              exits, and in a deadlock it does not.
          - text: "panic: acquire, because the checker notices the lock is held."
            why: |
              You may have confused this with the holding() check, which only fires for a lock
              the same hart already holds.
          - text: "A report from the third hart, which is not deadlocked."
            why: |
              You may have hoped another hart would notice. The checker only examines the
              acquisitions its own hart makes, and the third hart soon spins on the same locks.
        explain: |
          Check before waiting. Then the first time the two orders ever both appear, in any run,
          the checker reports it, whether or not the timing was unlucky. The verify section shows
          the reference catching this bug at boot.
      - id: lab21-05
        level: 2
        type: number
        q: |
          In one of our runs of `usertests -q` with the reference checker, `lockdeptest` (run
          right after it) reported `19 classes, 46 orders, 27161729 acquisitions checked, N of
          them slowly`. What was N? (The slow path is the one that takes the checker's lock.)
        answer: 46
        wrong:
          27161729: |
            You may have thought every acquisition takes the checker's lock. Only an order not
            yet known does; known orders are a set bit, read without a lock.
          0: |
            You may have thought the slow path is only for reports. Every new order takes it
            once, to set its bit and to look for a cycle first.
          19: |
            You may have counted classes. The slow path runs once per new order (edge), not once
            per class.
        why_wrong: |
          The slow path runs when an order is not yet known: once per edge learned, if no two
          harts race for the same new edge.
        explain: |
          46 orders, 46 slow paths, in each of our nine runs. Everything else was a bit test or
          nothing at all. See Measure for what the remaining bookkeeping costs.
  - title: How does the checker protect its own graph?
    q: |
      The class table and the edge bitmaps are shared by all three harts, and pipes create
      classes at any time. They need a lock. Can it be a `struct spinlock` taken with
      [[acquire]]? If not, what exactly goes wrong, and what must the replacement still do
      that `acquire` does?
    hints:
      - |
        Follow a call: `acquire(&pid_lock)` while holding a `p->lock`. The checker needs its
        lock to add the edge. Which function does it call to take that lock, and what does
        that function call first?
      - |
        And the report: it calls [[printk]], which acquires `pr.lock`. Where is the checker at
        that moment, and what does it hold?
      - |
        Something with the spinlock's atomic swap but without the call into the checker; and
        ask which of the spinlock's other duties (interrupts, the owner check) it still needs.
        Then ask how the report can print without recursing.
    answer: |
      **Not a spinlock.** `acquire(&lock)` calls the checker, which needs its lock, which calls
      `acquire`, which calls the checker... The checker runs before the spin, so the inner
      acquisition is never even attempted: the recursion goes on until the stack runs out.
      Clinic 1 did exactly this. The first nested acquisition at boot (`pid_lock` under a
      `p->lock` in [[userinit]]) recursed through 40 frames to the bottom of hart 0's boot stack,
      went on past it, and the machine died without a message.

      The reference uses `ldlock`, a word taken with `__atomic_exchange_n` and released with an
      `__ATOMIC_RELEASE` store: the same two instructions as a spinlock, minus the checker,
      [[push_off]] and [[holding]]. It must still be held with **interrupts off**: if an
      interrupt arrived while this hart held it, and the handler acquired any lock, the
      handler's checker would spin on `ldlock` forever, on the hart that holds it. Inside
      `acquire` interrupts are already off; the sleep-lock hooks and the class registration call
      [[push_off]] first (clinic 5 leaves that out of one hook).

      The report has the same problem one level up: it calls [[printk]], which calls `acquire(&pr.lock)`,
      while the checker holds `ldlock`. A per-hart `busy` flag makes the checker ignore every
      acquisition on this hart while it prints. Linux's lockdep has the same guard
      (`lockdep_recursion`). Clinic 4 removed it: the checker found its cycle and the machine
      froze without printing a word.
    checks:
      - id: lab21-06
        level: 2
        type: choice
        q: |
          Why must `ldlock` be taken with interrupts off, even though it is not a `struct
          spinlock`?
        options:
          - text: "An interrupt handler on this hart would call the checker for its own locks and spin on ldlock, which this hart holds."
            correct: true
            why: |
              Every handler acquires locks (`tickslock`, `p->lock`s in [[wakeup]]), and every
              acquisition can need `ldlock`. The same reason makes `acquire` turn them off.
          - text: "Because amoswap only works with interrupts off."
            why: |
              You may have thought the atomic swap needs it. An AMO is atomic regardless of
              interrupts; interrupts matter for who else can run on this hart.
          - text: "To keep other harts out while the graph changes."
            why: |
              You may have mixed up the two jobs. The swap keeps other harts out; turning off
              interrupts keeps this hart's own handlers out.
          - text: "It need not be: the checker is only called with interrupts off anyway."
            why: |
              You may have thought only [[acquire]] calls it. [[acquiresleep]] runs with
              interrupts on and calls the checker, so the hook turns them off itself.
        explain: |
          The rule "interrupts off while holding a lock that a handler may want" applies to
          every lock, including the checker's own. See [[concept:locks#invariant]].
  - title: What is a cycle, and when do you look for one?
    q: |
      A new edge `a -> b` has just appeared. How do you decide whether it closes a cycle, and
      how much work may that take? And when the answer is yes, what should the report contain
      so that a person can act on it? What about `a -> a`, a lock acquired while another lock
      of the same class is held?
    hints:
      - |
        A cycle through the new edge exists exactly when `b` can already reach `a`.
      - |
        The graph has at most 64 nodes, and new edges are rare (dozens per boot). Keep enough
        about each edge to explain it later.
      - |
        A depth-first search from `b`, run only for a new edge, remembering how it reached each
        class. `a -> a` is a cycle of length one.
    answer: |
      **Search only when an edge is new.** `a -> b` closes a cycle exactly when `b` already
      reaches `a`. The reference runs a depth-first search from `b` over the bitmaps (at most 64
      nodes), keeping in `prev[]` the class it came from, so that the path can be printed. It
      runs once per new edge, under `ldlock`, so its cost does not matter.

      **The report names both orders.** First the acquisition that would close the cycle:
      hart, process, the class held and where it was acquired, the class wanted and where.
      Then every edge of the existing path from `b` back to `a`, each with the hart, process
      and return addresses saved when that edge was first seen. "Where" is five return
      addresses found by walking the frame pointers up the stack, which you turn into function
      names and lines with `${TOOLPREFIX}addr2line -f -i -e kernel/kernel`. The new edge is not added.
      `TOOLPREFIX` is your RISC-V toolchain's prefix, the same one xv6's Makefile detects
      (`riscv64-unknown-elf-`, `riscv64-linux-gnu-` or `riscv64-elf-`); set it with
      `export TOOLPREFIX=riscv64-unknown-elf-` or whichever you have. On Debian/Ubuntu/WSL,
      `gdb-multiarch` also works as the debugger.

      **`a -> a` is a cycle of length one**: two locks of one class nested. Two harts doing
      that to two inodes in opposite orders would deadlock, and the class graph cannot tell
      which order is which, so it must report it. This is what the reference's first run with
      sleep-locks reported, for a directory and a file in it ([[create]]).

      **After a report**: Linux's lockdep prints and then turns itself off (once the graph has
      a cycle, later reports are mostly echoes). The reference does that while xv6 still has
      false reports, and panics once they are fixed (`LOCKDEP_PANIC` in `param.h`), so that a
      new report stops the machine where gdb can look.
    checks:
      - id: lab21-07
        level: 2
        type: order
        q: |
          Put in order what the reference does in `order()` when a hart that holds `wait_lock`
          acquires a `p->lock`, and the edge `wait_lock -> proc` is not known yet.
        items:
          - "load after[wait_lock] without a lock; the proc bit is clear"
          - "take ldlock"
          - "check the bit again under ldlock"
          - "search from proc for a path back to wait_lock"
          - "no path: record the edge with both traces and set the bit"
          - "release ldlock"
        why_wrong: |
          You may have put the search before taking the lock, or recorded the edge before
          searching. The bit is read twice (once cheaply, once under the lock), and the edge is
          added only after the search found no cycle.
        explain: |
          Another hart may have added the same edge between the first load and taking the lock;
          the second check covers that. Adding the edge before searching would make every new
          edge look like part of a cycle with itself.
  - title: What do interrupt handlers change?
    q: |
      A disk interrupt arrives on hart 0 while process 7 is in the kernel holding an inode's
      sleep-lock. [[virtio_disk_intr]] takes `disk.vdisk_lock` and wakes a process (taking
      `p->lock`s). Should the checker record "inode before virtio_disk"? And Linux's lockdep
      checks a second rule: a lock taken in an interrupt handler must never be held with
      interrupts on. Why is that rule needed, can xv6 break it, and where would you check it?
    hints:
      - |
        Is the handler acting for process 7? Would process 7 ever wait for `vdisk_lock` because
        of that inode? And when a handler runs on a hart, how many spinlocks does that hart
        hold? Read [[concept:locks#invariant]].
      - |
        The second rule fails like this: code holds lock L with interrupts on; a handler on the
        same hart wants L. Which instruction in [[acquire]] prevents that for every spinlock?
      - |
        Count handler depth per hart. Inside a handler, only the hart's spinlocks are held.
        Record, per class, "used in a handler" and "held with interrupts on".
    answer: |
      **The process's sleep-locks are left out inside a handler.** The order "inode, then
      `vdisk_lock`" is real in a sense: process 7 cannot let go of its inode until the handler
      returns, and the handler may wait for `vdisk_lock`. But it can never be part of a cycle.
      A handler only ever waits for spinlocks, and a spinlock holder can never wait for a
      sleep-lock: it would have to sleep holding a spinlock, and [[sched]] panics `sched locks`
      (noff above 1). So no chain of waits that starts in the handler can come back to process
      7's sleep-locks; and a sleep-lock taken *in* a handler is caught by the interrupt rule
      below. Recording such edges would add nothing (the same orders are learned from process
      context anyway: Ctrl-P shows `inode -> ... virtio_disk`). The reference brackets every handler in [[devintr]] with
      `lockdep_irq_enter()`/`lockdep_irq_exit()`, and inside a handler only the hart's own
      spinlocks count. That list is empty when the handler starts: an interrupt is taken only at
      noff 0 ([[concept:locks#invariant]]). gdb caught exactly this case: hart 0 interrupted
      `init` while it held an inode's lock, and [[clockintr]] acquired
      `tickslock` with `inirq[0] = 1` and an empty list.

      **The interrupt rule.** If code held lock L with interrupts on and a handler on the same
      hart wanted L, the handler would spin forever on a lock whose holder cannot run until
      the handler returns. Linux allows spinlocks with interrupts on (`spin_lock` versus
      `spin_lock_irqsave`), so its lockdep records, per class, "taken in a handler" and "held
      with interrupts on", and reports a class that is both. In xv6 **[[acquire]] turns
      interrupts off before anything else** ([[push_off]], [[kernel/spinlock.c:24]]), and
      [[pop_off]] and [[sched]] panic if they find interrupts on while a lock is held, so no
      spinlock is ever held with interrupts on. The rule is satisfied by construction.

      The reference still records both uses, because one kind of lock *is* held with
      interrupts on: a sleep-lock. Taking one in a handler would be the bug (and would try to
      sleep in a handler). To see the check work on spinlocks, we called the checker *before*
      `push_off` in a scratch copy: the first boot reported `proc is taken in interrupt
      handlers and held with interrupts on`, from [[wakeup]] in [[clockintr]] and from
      [[killed]] in [[usertrap]] (which runs after `intr_on`).
    checks:
      - id: lab21-08
        level: 2
        type: tf
        q: |
          True or false: in the reference kernel (unmodified), the interrupt-rule check can fire
          for a spinlock class.
        answer: false
        why_tf: |
          You may have thought some xv6 path holds a spinlock with interrupts on. None does:
          acquire disables them first, and pop_off and sched panic if they come back on.
        reasons:
          - text: "False: acquire calls push_off, which clears SIE, before the checker runs, so the checker never sees a spinlock acquired with interrupts on."
            correct: true
            why: That is why the `intr_get()` test in `lockdep_acquire` is commented "never". It fired only in the copy that called the checker before push_off.
          - text: "False: the checker skips interrupt handlers entirely."
            why: |
              You may have thought handlers are invisible to it. The checker sees every
              acquisition in a handler and marks the class "used in a handler"; it only leaves
              out the interrupted process's sleep-locks.
          - text: "True: tickslock is taken both in clockintr and in sys_uptime, which runs with interrupts on."
            why: |
              You may have looked at where the caller runs. `sys_uptime` runs with interrupts
              on, but its `acquire` turns them off before the lock is taken.
          - text: "True: every p->lock is taken in wakeup from handlers and in system calls."
            why: |
              You may have thought "in system calls" means "with interrupts on". The lock is
              always taken after push_off, so it is never held with interrupts on.
        explain: |
          The Linux rule exists because Linux lets a spinlock be held with interrupts on. xv6
          does not, so for spinlocks the rule holds by construction; only sleep-locks remain to
          check. See [[concept:locks#handlers]].
  - title: The first real run reports cycles that are not bugs. Now what?
    q: |
      With sleep-locks tracked, the checker's first boot reports "inode while holding inode"
      ([[create]] locks a directory, then the file it is creating). Fix that, and the next run
      reports "buffer while holding buffer" ([[write_log]]). Fix that, and `rm` of any file
      reports "inode while holding itable" ([[iput]]) against "itable while holding inode"
      ([[namex]]). None of these has ever deadlocked. What do you change? (Deleting the check,
      or ignoring a class, is not an answer.)
    hints:
      - |
        For each report, find the rule that makes it safe. [[concept:locks#order]] states two of
        them. For iput, read the comment on [[kernel/fs.c:361]] and ask: can that
        `acquiresleep` ever wait?
      - |
        A lock acquisition that can never wait can never be one of the waits in a deadlock. And
        "a directory before a file in it" is an order between two *roles* of one class.
      - |
        Give a nested acquisition a role that becomes a class of its own (Linux calls it a
        subclass), and give acquisitions that cannot wait a trylock that records no order but
        checks that it really did not have to wait.
    answer: |
      **Write the rule into the code, in a form the checker can use.**

      - **Nesting within one class: subclasses.** `acquiresleep_nested(lk, sub)` and
        `ilock_nested(ip, sub)` take a role; the checker gives each role a class of its own
        (`inode/1`). [[create]] and [[sys_unlink]] lock the file as `SUB_CHILD`, so the graph learns
        `inode -> inode/1`, an order it can check. Code that locked a file and then a directory
        would close a cycle (`inode/1 -> inode`) or nest `inode` in `inode` again: both are
        reported (verify). Buffers nest in fixed ways too (an indirect block, then a bitmap
        block or a new block; a log block, then its home copy), so five reads become
        `bread_nested(..., SUB_INNER)`. This is Linux's `mutex_lock_nested(&inode->i_mutex,
        I_MUTEX_CHILD)`.
      - **Acquisitions that cannot wait: trylocks.** [[iput]] takes the inode's lock only when
        `ip->ref == 1`: nobody else references the inode, so nobody can hold its lock or be
        inside `acquiresleep`/`releasesleep` on it. That acquisition never waits. A lock never
        waited for cannot be part of a deadlock, so the checker records no order for a trylock
        (Linux does the same) but still adds it to the held list, so what is taken *under* it is
        checked. The reference adds `tryacquire()` and `tryacquiresleep()`, and `iput` panics if
        the try ever fails. The original kernel already could not wait there silently (an
        `acquiresleep` that slept with `itable.lock` held would panic `sched locks`); what the
        trylock adds is that the *checker* can see this acquisition never waits, and a panic
        that names the broken assumption.

      Each annotation is a claim. A wrong one hides a real bug: had [[create]] been annotated
      the other way round, the checker would learn a wrong order and stay silent. That is why
      the reference keeps them few, puts the reason next to each, and makes the iput claim fail
      loudly if it is ever wrong. With these three changes, boot and `usertests -q` run without a report.
    checks:
      - id: lab21-09
        level: 3
        type: choice
        q: |
          Why is a trylock that records no order a *correct* way to silence the [[iput]] report,
          and not merely a convenient one?
        options:
          - text: "A deadlock is a ring of harts each waiting; an acquisition that never waits cannot be one of the waits, and iput's try panics if it would have to."
            correct: true
            why: |
              The ring needs every member to be waiting for the next. Remove the possibility of
              waiting at one edge and that edge cannot be in any ring. The panic names the
              assumption if it is ever broken.
          - text: "Because iput runs rarely, so a deadlock there is unlikely."
            why: |
              You may be thinking in probabilities. A checker exists precisely because rare
              paths deadlock too; the argument must be that it cannot happen at all.
          - text: "Because itable.lock is a spinlock and the inode lock is a sleep-lock, so they cannot deadlock."
            why: |
              You may have thought mixing kinds is safe. A spinlock holder waiting for a
              sleep-lock can deadlock just as well (and would also panic in sched).
          - text: "Because a trylock is faster."
            why: |
              You may be thinking of performance. Speed has nothing to do with whether the order
              can close a cycle.
        explain: |
          Annotations are only as good as the reasoning behind them; this one fails loudly if
          the reasoning is ever wrong. See [[concept:locks#unusual]].
      - id: lab21-10
        level: 2
        type: match
        q: |
          Match each report from the reference's development runs with what made it safe.
        pairs:
          - left: "inode while holding inode (create)"
            right: a directory is always locked before a file in it
            why: |
              You may have thought this needs a trylock. The second lock can wait (another
              process may hold the file); what makes it safe is the fixed parent-then-child order.
          - left: "buffer while holding buffer (write_log)"
            right: a log block is always locked before the home copy of a block
            why: |
              You may have thought buffers are never nested. The log holds its own block while
              reading the home copy; the roles are fixed, so no reverse order exists.
          - left: "inode while holding itable (iput)"
            right: the inode's last reference means its lock is free
            why: |
              You may have thought this is a parent-child nesting. It is a different class pair,
              safe only because ref == 1 rules out every other holder.
        explain: |
          Two rules about roles and one about instances: subclasses express the first two, a
          checked trylock the third. See [[concept:locks#order]].
build: |
  **Start from the frozen commit**, in your own clone of xv6:

  ```text
  git checkout -b my-lockdep 06aad25
  ```

  **Milestones**, each one booting:

  1. **Classes.** A class table in a new `kernel/lockdep.c` (add `$K/lockdep.o` to `OBJS`),
     a `cls` field in `struct spinlock` and `struct sleeplock` (in the padding after
     `locked`: check with `sizeof` that nothing grew), set by [[initlock]] and
     [[initsleeplock]]. Its lock is a bare word with an atomic swap, taken with interrupts
     off.
  2. **Held lists.** Hook [[acquire]] (after the `holding` check, before the spin) and
     [[release]]. Per-hart lists; release searches. Run `usertests -q`: if the handoff is
     wrong you will know at the first [[forkret]].
  3. **Edges.** A bitmap per class; Ctrl-P prints them (from [[procdump]]). Compare what you
     see after `ls` with [[tour:51]]'s graph.
  4. **Cycles and reports.** Search on new edges only, print both orders, turn off after one
     report. Run `echo hi > x` then `rm x`: you should get your first report (the iput one,
     already visible with spinlocks alone).
  5. **Sleep-locks**, per process, then **interrupt handlers**.
  6. **Annotations**, one report at a time, until boot and `usertests -q` are silent.
  7. **Panic on a report**, the system call, the self-tests and `lockdeptest`.

  **Reading a report.** It prints return addresses. On the host, in your xv6 directory:

  ```text
  ${TOOLPREFIX}addr2line -f -i -e kernel/kernel 0x80003d66
  ```

  A return address points just after the call, so decoding it as is can print a line well
  after the call (in one report, five lines later). Subtract 2 to land inside the call
  instruction: `addr2line ... 0x80003d64`. `-i` also shows functions that were inlined there.

  **Debugging** (QEMU with `-smp 3`, and gdb). Break on [[panic]] and look at the
  checker's state: `p nheld`, `p held[$tp]`, `p cls[3]`, `p/x after`. `$tp` is the hart number
  in the kernel. A conditional breakpoint on a hot function (`lockdep_acquire`) slows QEMU a
  lot; put it on something rarer (`newedge`, `lockdep_irq_enter`, a line in [[forkret]]) and
  set the hot one from there. Test your checker on wrong orders you write on purpose
  (the self-tests), not only on xv6: a checker that never reports is easy to write.
clinic:
  - bug: The checker's lock is an ordinary spinlock
    change: |
      `ldlock` becomes a `struct spinlock` (never given a class) and the "lock without a
      class" panic is deleted:

      ```diff
      -static uint ldlock;
      +static struct spinlock ldlock;

       static void
       ldlk(void)
       {
      -  while (__atomic_exchange_n(&ldlock, 1, __ATOMIC_ACQUIRE) != 0)
      -    ;
      +  acquire(&ldlock);
       }
       [... ldunlk: release(&ldlock) ...]
      -  if (lk->cls == 0)
      -    panic("lockdep: lock without a class");
      ```
    symptom: |
      xv6 kernel is booting

      hart 2 starting
      hart 1 starting

      (nothing more; gdb attached 25 seconds after boot:)
        Id   Target Id                    Frame
      * 1    Thread 1.1 (CPU#0 [running]) kernelvec () at kernel/kernelvec.S:14
        2    Thread 1.2 (CPU#1 [running]) 0x0000000000000000 in ?? ()
        3    Thread 1.3 (CPU#2 [running]) 0x0000000000000000 in ?? ()
      [...]
      $1 = 0xfffffffe87c9dbb0
      [...]
      $2 = (char (*)[32768]) 0x80009bc0 <stack0>

      (another boot, gdb from reset, breakpoint on lockdep_acquire if $sp < 0x80009d00:)
      Thread 1 hit Breakpoint 1, lockdep_acquire (lk=lk@entry=0x80011cd0 <ldlock>, try=try@entry=0) at kernel/lockdep.c:384
      [...]
      $1 = 0x80009bd0
      $2 = 1
      #0  lockdep_acquire (lk=lk@entry=0x80011cd0 <ldlock>, try=try@entry=0) at kernel/lockdep.c:384
      #1  0x0000000080000c18 in acquire (lk=lk@entry=0x80011cd0 <ldlock>) at kernel/spinlock.c:28
      #2  0x0000000080000d90 in ldlk () at kernel/lockdep.c:53
      #3  0x0000000080001020 in order (h=h@entry=0x80020260 <held>, c=c@entry=0, pc=pc@entry=0x80009da8 <stack0+488>) at kernel/lockdep.c:305
      #4  0x0000000080001484 in orderall (c=0, pc=pc@entry=0x80009da8 <stack0+488>) at kernel/lockdep.c:335
      #5  0x0000000080001794 in lockdep_acquire (lk=lk@entry=0x80011cd0 <ldlock>, try=try@entry=0) at kernel/lockdep.c:397
      #6  0x0000000080000c18 in acquire (lk=lk@entry=0x80011cd0 <ldlock>) at kernel/spinlock.c:28
      #7  0x0000000080000d90 in ldlk () at kernel/lockdep.c:53
      #8  0x0000000080001020 in order (h=h@entry=0x80020260 <held>, c=c@entry=0, pc=pc@entry=0x80009fd8 <stack0+1048>) at kernel/lockdep.c:305
      [...]
      #33 0x0000000080001020 in order (h=h@entry=0x80020260 <held>, c=c@entry=6, pc=pc@entry=0x8000aac8 <stack0+3848>) at kernel/lockdep.c:305
      #34 0x0000000080001484 in orderall (c=6, pc=pc@entry=0x8000aac8 <stack0+3848>) at kernel/lockdep.c:335
      #35 0x0000000080001794 in lockdep_acquire (lk=lk@entry=0x80023460 <pid_lock>, try=try@entry=0) at kernel/lockdep.c:397
      #36 0x0000000080000c18 in acquire (lk=lk@entry=0x80023460 <pid_lock>) at kernel/spinlock.c:28
      #37 0x0000000080003062 in allocpid () at kernel/proc.c:97
      #38 0x00000000800031dc in allocproc () at kernel/proc.c:125
      #39 0x0000000080003254 in userinit () at kernel/proc.c:223
      #40 0x000000008000257c in main () at kernel/main.c:31
    why: |
      Two boots stopped silently after `hart 1 starting` (the second with gdb attached
      later); a third, with gdb from reset and the breakpoint above, shows why. The first acquisition with something already held is [[userinit]] →
      [[allocproc]] → [[allocpid]], which takes `pid_lock` while holding the new process's
      `p->lock` (frames 35 to 40). The edge `proc -> nextpid` is new, so `order()` takes the
      checker's lock: `ldlk()` → `acquire(&ldlock)` → the checker again (frames 5 to 7). The
      checker runs *before* the spin, so `ldlock` is never actually taken and `holding()` never
      objects; this hart still holds the `p->lock`, so `order()` needs `ldlock` again (now for
      `proc -> class 0`), and so on. Each round costs 560 bytes of stack (`stack0+1048` to
      `stack0+488`). The breakpoint caught hart 0 at `sp = 0x80009bd0`, 16 bytes above the
      bottom of `stack0`.

      Hart 0 boots on its 4 KB slice of `stack0`, which has no guard page below it, so the
      recursion went on writing below `stack0` into whatever the linker put there. In the first
      session, 25 seconds later, hart 0 was in [[kernelvec]] with a nonsense stack pointer and
      harts 1 and 2 had jumped to address 0 right after `main.c:39`. We did not track down which
      overwritten word did that; the point is that nothing ever printed.

      On a process's kernel stack the guard page would have turned the same recursion into a
      page fault and `panic: kerneltrap`. Either way, the fix is a lock that the checker does not
      check: Linux uses a raw `arch_spinlock_t` for the same reason.
  - bug: One class per lock instead of one per name
    change: |
      `lockdep_class()` makes a new class on every call instead of looking the name up:

      ```diff
      -  for (c = 1; c < nclass; c++)
      -    if (cls[c].sleep == sleep && strncmp(cls[c].name, name, 32) == 0)
      -      break;
      +  c = nclass; // every lock its own class
         if (c == nclass) {
      ```
    symptom: |
      xv6 kernel is booting

      panic: lockdep: too many classes

      (gdb from reset, at the panic:)
      #0  panic (s=s@entry=0x800091f0 "lockdep: too many classes") at kernel/printk.c:139
      #1  0x0000000080001606 in lockdep_class (name=name@entry=0x80009470 "proc", sleep=sleep@entry=0) at kernel/lockdep.c:75
      #2  0x0000000080000b86 in initlock (lk=lk@entry=0x80028758 <proc+20160>, name=name@entry=0x80009470 "proc") at kernel/spinlock.c:17
      #3  0x0000000080002ece in procinit () at kernel/proc.c:55
      #4  0x000000008000250c in main () at kernel/main.c:22
      $1 = 64
    why: |
      Two boots, the same panic, before the other harts printed anything. The class table has
      64 entries (one bit each in a `uint64` row of the edge matrix), and [[procinit]] alone asks
      for 64 `p->lock`s. The classes before them and the first `p->lock`s filled all 63 usable
      entries (`nclass` = 64), and the call for the `p->lock` at `proc+20160` found the table
      full.

      A bigger table would not save the idea. It would need a node for each of the 156
      spinlocks and 81 sleep-locks that exist at boot, plus one for every pipe ever created. And
      it would find less: the kfork bug of the verify section is "some `p->lock` then
      `wait_lock`" against "`wait_lock` then some `p->lock`". Per instance, both orders must
      happen on the same slot before the cycle is visible. With classes, init's first `fork`
      and first `wait` are enough, whatever slots they use. (This part is reasoned from the
      code; the copy never got that far.)
  - bug: Spinlocks listed per process instead of per hart
    change: |
      A per-thread list, as Linux keeps: the running process's list if there is one,
      otherwise (scheduler, boot) the hart's:

      ```diff
      +static struct ldheld pheld[NPROC][MAXHELD]; // per process
      +static int npheld[NPROC];
      +
      +static struct ldheld *
      +mylist(int **n)
      +{
      +  struct proc *p = mycpu()->proc;
      +
      +  if (p) {
      +    *n = &npheld[p - proc];
      +    return pheld[p - proc];
      +  }
      +  *n = &nheld[cpuid()];
      +  return held[cpuid()];
