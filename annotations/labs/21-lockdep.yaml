      stack: [kernelvec, kerneltrap, devintr, clockintr, acquire, lockdep_acquire, use]
      sp: {"on": kernel, detail: "init's kernel stack, a kernelvec frame on top"}
      irq: {noff: 1, intena: 0}
    note: |
      `use()` records per class "taken in an interrupt handler" (`USE_IRQ`) and "held with
      interrupts on" (`USE_IRQON`), with where each was first seen, and reports a class that
      has both. Such a lock could be held by code that a handler interrupts on its own hart,
      and the handler would spin forever.

      For spinlocks the test on line 335 can never be true: [[acquire]] calls [[push_off]]
      before the checker, so SIE is always clear here. Linux needs the check because Linux lets
      a spinlock be held with interrupts on; xv6 does not. For sleep-locks (this commit adds the
      same call to the previous commit's hook) `USE_IRQON` is recorded on every acquisition, because a sleep-lock's holder runs
      with interrupts on; a sleep-lock taken in a handler would be reported.

      We checked that the test works by breaking the order in a scratch copy: `acquire` calling
      the checker *before* `push_off`. Both boots stopped at once:

      ```text
