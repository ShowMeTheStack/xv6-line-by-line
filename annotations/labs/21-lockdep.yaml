      -    panic("lockdep: release of a lock this hart does not hold");
      +    panic("lockdep: release of a lock this thread does not hold");
      ```
    symptom: |
      xv6 kernel is booting

      hart 2 starting
      hart 1 starting
      panic: lockdep: release of a lock this thread does not hold

      (gdb from reset, at the panic:)
      Thread 2 hit Breakpoint 1, panic (s=s@entry=0x80009250 "lockdep: release of a lock this thread does not hold") at kernel/printk.c:139
      [...]
      #0  panic (s=s@entry=0x80009250 "lockdep: release of a lock this thread does not hold") at kernel/printk.c:139
      #1  0x0000000080001882 in lockdep_release (lk=lk@entry=0x8002a998 <proc>) at kernel/lockdep.c:445
      #2  0x0000000080000cf6 in release (lk=lk@entry=0x8002a998 <proc>) at kernel/spinlock.c:69
      #3  0x0000000080002ffc in forkret () at kernel/proc.c:520
      #4  0x0000000080002fe8 in myproc () at kernel/proc.c:90
      Backtrace stopped: frame did not save the PC
      [...]
      $4 = {1, 1, 1, 0, 0, 0, 0, 0}
    why: |
      Two boots, the same panic, before `init` printed anything. The first process (pid 1,
      `proc[0]`) runs for the first time. Hart 1's [[scheduler]] acquired `proc[0].lock` with
      no process running, so the checker put it on **hart 1's** list (`nheld` shows one entry
      on each hart's list: every scheduler holds the lock of the slot it is looking at).
      [[swtch]] then switched to the process, whose first act in [[forkret]] is to release that
      lock. Now a process is running, so the checker looked in **the process's** list, which
      is empty, and panicked. (Frame 4 is not a real caller: forkret was entered by `swtch`,
      not called.)

      The kernel itself had no problem: [[holding]] checks the hart, and the hart does hold
      it. A per-thread list needs to be told about the handoff: Linux does that for its
      runqueue lock with explicit "release here, acquire there" annotations around the context
      switch. A per-hart list matches what xv6 already means by "held", and needs nothing.
      Without the panic (if the release simply did nothing when the lock is missing), the
      scheduler's list would keep the stale entry and the next acquisition on that hart would
      record a false `proc -> ...` edge (reasoned from the code, not run).
