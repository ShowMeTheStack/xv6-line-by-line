      sp: {"on": kernel, switched: "`ld sp, 8(a1)` in [[swtch]], from hart 2's scheduler"}
      irq: {noff: 1, intena: 0, note: "the scheduler's acquire of this p->lock; recorded by gdb at forkret line 520"}
    note: |
      gdb stopped hart 2 at [[forkret]]'s `release(&p->lock)` ([[kernel/proc.c:520]]), pid 1's
      first moment as a process, on the finished branch:

      ```text
      hart 2 noff 1 intena 0 sstatus 0x200000020
      proc pid 1 name
      nheld[2] = 1
        held[0]: lk 0x80023898 cls 8 (proc) pc0 0x80003474 pc1 0x8000253c
      (gdb) info symbol held[$tp][0].pc[0]
      scheduler + 98 in section .text
      ```

      The process is about to release a lock that the [[scheduler]] acquired, a different
      thread on the same hart ([[concept:locks#handoff]]). The entry is on **hart 2's** list,
      and `lockdep_release` searches that list for the lock, finds it and removes it. The
      search matters for a second reason: locks are not always released in reverse order
      ([[kexit]] releases `wait_lock` before its own `p->lock`).

      This is why the list is per hart. A list per thread would have the scheduler's acquire on
      one list and this release on another (clinic 3).
    others: |
      Harts 0 and 1 run their own schedulers, each holding the `p->lock` of the slot it is
      looking at, each on its own list. When pid 1 later gives up hart 2, it acquires its own
      `p->lock` in [[yield]] or [[sleep]] (pushed on hart 2's list) and the scheduler releases
      it: the same handoff the other way round.
  - title: Edges, and a fast path of one load
    commit: 3
    file: kernel/lockdep.c
    lines: 110-180
    focus: 119-154
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: ["p->lock (proc[0], being built)"]
      stack: [main, userinit, allocproc, allocpid, acquire, lockdep_acquire, order, newedge]
      sp: boot
      irq: {noff: 2, intena: 0, note: "recorded by gdb in newedge on the finished branch: cpus[0].noff = 2, intena = 0"}
    note: |
      `lockdep_acquire` now calls `order(h, c)` for every lock `h` the hart holds. An edge "a
      before b" is bit `b` of `after[a]`. **Fast path:** load `after[h->cls]` without any lock;
      if the bit is set, this order is known, and that is all. Bits are only ever set, so a set
      bit read without the lock is still true. **Slow path:** take `ldlock`, test again (another
      hart may have just added it), and add the edge: the bit, plus a record in `edges[]` with
      the hart, the pid, and the traces of both acquisitions, for the report later.

      gdb stopped the first `newedge` of the boot, the acquisition of the previous steps:
      `h->cls = 8` (`proc`), `c = 6` (`nextpid`), with 15 classes registered so far. Ctrl-P
      now prints the graph from [[procdump]]; after `usertests -q` it had 46 edges, close to
      [[tour:51]]'s measured graph.

      How fast is fast? In our runs of `usertests -q` the checker examined about 27 million
      acquisitions and took the slow path 46 times. About three quarters of those acquisitions
      had something else held, so they made about 42 million `order()` calls; all but 46 ended
      at the bit test.
