      `big[]` is 16 pages of initialized data, written with GCC's range [[g:designated-initializer]]:
      every int `0x5a5a5a5a`, except the first of each page, which is 1000 plus the page number.
      Because it is initialized, it is in the file (`.data`, `filesz` `0x11000`), and every page
      has a value that only the right file offset can supply: a load from the wrong place shows.
      Each check touches its own pages first, so each one exercises a real load.

      `lazytest` counts free pages twice around two reads of untouched pages: this branch prints
      `touching 2 data pages took 2 free pages`; the original kernel took 0, because it had
      loaded them at exec, and the check fails there. `truncate` and `modify` fail there as well:
      the helper's pages were all in memory before its file changed. The other checks pass on
      both kernels, which is the point of them: they describe behaviour that must not change,
      and each guards one mistake from this lab. `fork` panicked on clinic 4's kernel, `locked`
      and `selfread` on clinic 6's (`locked` also with only [[sys_write]]'s prefault removed: its
      first copy is a pipe write from an untouched page), `unlink` on clinic 5's, and `shrink`
      failed without `segtrim`; `content` checks the bytes of every loaded page directly.
