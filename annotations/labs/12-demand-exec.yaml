    why: |
      Two different failures from one missing rule, "load before you lock".

      **`dexectest locked`: a sleep under a spinlock.** The parent's first copy is a `write` into
      a pipe from page 8 of `big[]` (`va` 57344 = `0xe000`), which it has never touched.
      [[pipewrite]] holds `pi->lock` and copies byte by byte with [[copyin]]
      ([[kernel/pipe.c:96]]). The first byte finds the page missing, [[vmfault]] calls
      `loadpage`, [[readi]] needs block 1068 (file offset `0xf000`), which is not in the buffer
      cache, and [[virtio_disk_rw]] goes to [[sleep]]. [[sleep]] takes `p->lock`; [[sched]]
      counts noff 2 (`pi->lock` and `p->lock`) and panics. The other two harts are stuck in
      [[acquire]] on `proc+1072`, this process's `p->lock`, which the panicking hart will never
      release. Had the block been in the cache, nothing would have slept and the write would
      have worked: a bug that depends on the cache. The `read` from the pipe and the `wait`
      that follow in the same check would fail the same way ([[piperead]] holds `pi->lock`,
      [[kwait]] holds two spinlocks); a kernel with only [[sys_write]]'s prefault removed also
      printed `panic: sched locks` for this check.

      **`dexectest selfread`: a process waiting for itself.** `dexectest` reads its own file
      into page 6 of `big[]` (`va` 49152 = `0xc000`). [[fileread]] locks inode 23, the program's
      own file, and [[readi]] copies the first block with [[either_copyout]], holding that
      block's buffer (its first bytes, `\177ELF`, are visible in `src`). The copy needs the
      page; `loadpage` calls [[ilock]] on `p->exe`, the same inode 23, and [[acquiresleep]]
      sleeps until the holder lets go. The holder is pid 3 itself: `lock.pid 3`, and the
      process's `chan` is the address of that lock. It will sleep forever. No panic, no message;
      the harts sit idle in the scheduler and the shell never prints another prompt.

      (In both backtraces some argument values of `vmfault` and `copyout` are stale registers
      in this optimized build, for example `pagetable=0x1`; the addresses and line numbers are
      what matter. The selfread stack was reconstructed by setting a halted hart's `sp`, `s0`
      and `pc` from the sleeping process's saved context, which is why its top frames are
      `sched` and `mycpu`.)

      Both are fixed by the same three call sites: [[sys_read]], [[sys_write]] and
      [[sys_wait]] load the program pages of the user buffer before any lock is taken.
reveal:
  - title: exec keeps the file it read
    commit: 1
    file: kernel/exec.c
    lines: 120-156
    focus: 131-139
    diff: true
    state:
      hart: 2
      mode: S
      proc: echo (pid 3)
      intr: "on"
      satp: kernel
      locks: ["echo's inode lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_exec, kexec]
      sp: {"on": kernel, detail: "pid 3's kernel stack, `sp` = `0x3fffff9b30`"}
    note: |
      The story of this tour, recorded with gdb on the branch, three harts (the recording
      predates one bound check in [[kexec]] and one pipe write in `dexectest`, so kernel
      addresses in `exec.c` differ from the branch's by a few bytes): the
      machine boots, `init` and the shell load their pages as they run, you type `echo hi`, and
      the shell's child (pid 3) calls `exec("echo")`. Later steps follow `dexectest` reading its
      own file, and a helper whose file is deleted while it runs.

      Commit 1 changes what [[kexec]] does with the inode [[namei]] gave it. The original kernel
      dropped it as soon as the segments were read (`iunlockput`, then `end_op`). Now the image
      will be read *later*, so the process keeps that reference in `p->exe` (a new field in
      `struct proc`). Keeping the one [[namei]] already counted costs nothing: no [[idup]], no
      extra lock.

      Two things moved to make this possible. The inode stays locked, and the transaction open,
      until the image is committed (the comment at line 79): the commit is where the new
      reference replaces the old one, and the old one must be dropped inside a transaction. The
      error path is unchanged: every `goto bad` still happens with `ip` locked and the
      transaction open, exactly what `bad:` (line 148) undoes.

      At the focus lines gdb saw pid 3 on hart 2 holding the inode lock of `echo` (inode 4,
      `lock.pid` 3), and `log.outstanding` = 1: this exec's transaction. The old image's file,
      the shell's (inode 13), had `ref` 2: the shell's reference and this child's.
    others: |
      The shell (pid 2) is asleep in `wait`. Another hart could be loading a page of `sh`
      for another process at this moment; that would lock inode 13, not 4, and nothing here
