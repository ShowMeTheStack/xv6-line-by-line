  The `usertrap()` lines are the expected kills. In `dexectest truncate` the helper touches page
  7 of `big[]` (`stval=0xd000`) after its file was truncated, and the test checks that its exit
  status is -1; in `usertests nowrite` a child stores to text. `usertests -q` passing shows
  that what the original kernel did still works: `copyout` into text still fails (the page is
  mapped without `PTE_W` and [[copyout]] refuses it), stores to text still kill, the stack guard
  still faults, the lazy heap still works, and no page is lost.

  Every commit builds with `make kernel/kernel fs.img`, and `usertests -q` printed `ALL TESTS
  PASSED` on 3 harts at each of the 11 commits.

  Crafted ELF files (copies of `echo` with patched program headers) on the same
  branch: a data segment ending past `MAXVA`, one ending where the stack would cover the
  trampoline, and a text segment longer than the file all make `exec` return -1, as on the
  original kernel, with no panic. A 4 GiB bss segment execs (`exec-succeeded`), where the
