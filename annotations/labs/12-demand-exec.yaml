published: true
title: Demand-paged exec
area: Memory
stars: 4
branch: ext/12-demand-exec
prerequisites: {tours: [10, 17, 22, 26, 28, 33, 36], concepts: [stacks, locks]}
summary: |
  In this tree [[kexec]] reads a whole program into memory before the program runs its first
  instruction. For each loadable segment of the [[g:elf]] file it allocates every page and
  fills it with [[readi]] ([[loadseg]]). `usertests` is 16 pages; `echo` is 2, and the second,
  its bss, is never touched when you type `echo hi`. In this lab exec only *records* where
  each segment lives in the file, keeps the file, and lets the program start with no text and
  no data at all. Each page is read from the file the first time something touches it.

  The idea is old (it is how Unix has run programs since the late 1970s), and it touches more
  of the kernel than you might expect. Who notices the first touch of a page, and what does
  that have to do with the lazy heap this tree already has? Reading a file means locking an
  inode and waiting for the disk, from inside a fault handler: where can such a fault happen,
  and what does the kernel hold at that moment? What happens when a program reads its *own*
  file into a page of itself that is not there yet? What keeps the file alive while it runs,
  and what does a running program see when someone deletes, truncates or rewrites it? The
  think section asks these questions in the order a designer meets them.

  The reference solution is eleven small commits. With it, `dexectest lazy` loads 8 of the 25
  pages of its image, and each page it touches later costs exactly one page of memory.
learn:
  - "How an instruction fetch from a page that is not mapped reaches the kernel, and how a new kind of page fault has to share [[usertrap]] and [[vmfault]] with the lazy heap this tree already has."
  - "What a freshly loaded page must contain, byte by byte, and which PTE bits it gets, so that the program cannot tell it was loaded late."
  - "What a fault handler may do when it has to wait for the disk: which locks are held and what the interrupt state is on each path that can reach it, and what the rule \"never sleep holding a spinlock\" means for the kernel's own copies into user memory."
  - "What can go wrong when a system call that already holds locks touches a page that is not there yet, and how to rule it out by construction instead of detecting it."
  - "Why a running program needs a counted reference to its file, why dropping that reference needs a transaction, and what a running program sees when its file is removed, truncated or rewritten."
  - "What a trap handler can lose when it sleeps, and why a test that counts free pages has to change its idea of what is free."
spec: |
  **Behaviour.** `exec` reads the ELF header and the program headers, checks them at least as
  strictly as before (a segment that could not have been loaded must still make `exec` fail),
  and records each loadable segment: where it starts in memory, its size in memory, where its
  bytes are in the file, how many bytes the file supplies, and its permissions. It maps no
  page of text or data. The stack and the argument strings are still built by `exec`, as
  before. When the program, or the kernel on its behalf, first touches a page of a segment,
  that one page is allocated, filled from the file (bytes the file does not supply are zero),
  and mapped with the segment's permissions. A page outside every segment and outside the
  heap is still a fatal fault.

  Every way of touching memory must work: instruction fetches, loads, stores, and the
  kernel's own copies for system calls (`read` into a buffer, `write` from one, `wait(&status)`,
  `exec`'s argument strings, path names).

  **The file.** A running program keeps its file alive. If the file is unlinked while the
  program runs, the program keeps running, and the file's inode and blocks are freed when the
  last process running it exits or calls `exec`. If the file is truncated, a page that is not
  loaded yet cannot be read, and the process is killed when it needs that page. If the file
  is rewritten, pages loaded after the change come from the new contents. (The think section
  discusses why this lab allows that.)

  **What must not change.**

  - Text stays read-only and executable, data writable and not executable: a store to text
    must still kill the process (`usertests nowrite`), and `read` into text must still fail
    (`usertests copyout`).
  - The lazy heap (`sbrklazy`) keeps working, and memory obtained after `sbrk(-n)` is zero.
  - No kernel panic or hang, whatever the program does with its own file, and whatever program
    headers a crafted ELF file contains.
  - **`usertests -q` must print `ALL TESTS PASSED` on 3 harts.** A small change to `usertests`
    turns out to be needed; the think section finds which, and why.

  **The test program**, `dexectest`, prints one line per check (`dexectest NAME` runs one):

  ```text
  $ dexectest
  dexectest: lazy: touching 2 data pages took 2 free pages
  dexectest: lazy: OK
  dexectest: fork: OK
  dexectest: locked: OK
  dexectest: selfread: OK
  dexectest: unlink: OK
  usertrap(): unexpected scause 0xd pid=7
              sepc=0xd52 stval=0xd000
  dexectest: truncate: OK
  dexectest: modify: OK
  dexectest: shrink: OK
  dexectest: content: OK
  dexectest: ALL OK
  ```

  The program carries a 16-page initialized array, `big[]`, so it has data pages that come
  from the file; each check touches its own pages of it first.

  - **lazy**: count free pages, touch two untouched pages of `big[]`, count again: exactly 2
    pages must be gone, and both pages must hold the file's values.
  - **fork**: a child forked before page 3 was touched reads it; so does the parent.
  - **locked**: `write` to a pipe from an untouched page, `read` from the pipe into another,
    and `wait(&status)` with `status` in a third: each must work.
  - **selfread**: `read` the program's own file into an untouched data page (must succeed and
    show `\x7fELF`), and into a page of read-only data (must fail).
  - **unlink**, **truncate**, **modify**: a copy of the program, started as a helper, has its
    file unlinked (it must finish normally), truncated to nothing (it must be killed: the
    `usertrap()` lines above are that kill, expected), or overwritten in one place (it must
    see the new value).
  - **shrink**: a child gives back memory below the end of its image with `sbrk` and takes the
    addresses back with `sbrklazy`: they must read as zero.
  - **content**: every byte of the text equals the file, the rest of its last page is zero,
    and a bss array is all zeros.
think:
  - title: What must exec remember, and for how long?
    q: |
      Today [[kexec]] loads every segment with [[loadseg]] and then lets go of the file
      ([[kernel/exec.c:79]]). If a page is to be read only when it is first touched,
      possibly minutes later, what must the kernel keep, and where? What guarantees that the
      file is still there, and still the same file, when that moment comes? Which other
      events in a process's life have to know about what you keep?
    hints:
      - "Read [[kexec]]'s loop ([[kernel/exec.c:60]]-[[kernel/exec.c:78]]) and [[loadseg]], and list every value they use to fill one page. Then read [[iput]] ([[kernel/fs.c:349]]) and [[iget]] ([[kernel/fs.c:249]]): what happens to an in-memory inode whose reference count drops to 0?"
      - "An inode with `ref` 0 stays in the table only until [[iget]] needs a slot ([[kernel/fs.c:263]]); then the same `struct inode` describes another file. A pointer to an inode is only safe while you hold a counted reference. And whatever a process keeps must follow it through [[kfork]], [[kexit]] and the next exec, the way `p->cwd` does."
      - "A small per-process table with one entry per loadable segment, plus one counted inode reference, kept like the current directory: taken in exec, duplicated in fork, dropped in exit and in the next exec."
    answer: |
      For each loadable segment the kernel needs exactly what [[loadseg]] and [[uvmalloc]]
      used: the virtual address where it starts (`vaddr`), its size in memory (`memsz`, which
      says where the segment ends), the offset of its bytes in the file (`off`), how many of
      them the file supplies (`filesz`; the rest is zero, the [[g:bss]]), and its permissions
      (`flags`, turned into PTE bits by [[flags2perm]]). The reference puts these in a
      `struct seg` array in `struct proc`, `p->seg[NSEG]` with `NSEG` 4, plus `p->nseg`.

      It also needs the file. A pointer alone is not enough: [[kexec]] used to drop its
      reference with `iunlockput`, and an inode with no references can be recycled by the
      next [[iget]] for a different file. Then a later fault would read *another file's*
      blocks into the program's text. So the process keeps a counted reference, `p->exe`.
      The cheapest one is the reference [[namei]] already gave [[kexec]]: keep it instead of
      dropping it.

      That reference has the lifetime of the image, not of the system call:

      - [[kfork]]: the child runs the same program, and the pages its parent never touched are
        not mapped in the child either ([[uvmcopy]] skips unmapped pages,
        [[kernel/vm.c:309]]). It needs its own copy of the table and its own reference
        (`idup`), exactly like `p->cwd` ([[kernel/proc.c:288]]).
      - the next exec replaces the image: drop the old reference, take the new one.
      - [[kexit]]: drop it.

      Dropping is an [[iput]], and [[iput]] can free the inode and its blocks when this was
      the last reference to a file that has been unlinked meanwhile. Freeing writes to the
      disk, so every such [[iput]] must run inside a [[g:transaction]], between [[begin_op]]
      and [[end_op]]. [[kexit]] already has one for `p->cwd` ([[kernel/proc.c:342]]); in
      [[kexec]], the reference keeps the transaction open until the new image is committed,
      and drops the old program's reference inside it.
    checks:
      - id: lab12-01
        level: 1
        type: multi
        q: |
          A page of a segment will be filled at fault time instead of in [[kexec]]. Which values
          from the segment's [[g:program-header]] must be kept so that the fault can build the
          page exactly as [[kexec]] would have?
        code: kernel/exec.c:60-78
        options:
          - text: "ph.vaddr, where the segment starts in memory"
            correct: true
            why: "The fault gives a virtual address; the kernel must find the segment that contains it and the offset within it."
          - text: "ph.off, where the segment's bytes are in the file"
            correct: true
            why: "The page's bytes are read from `off` plus the offset of the page within the segment."
          - text: "ph.filesz, how many bytes come from the file"
            correct: true
            why: "Bytes past `filesz` are not in the file; they must be zero."
          - text: "ph.memsz, the segment's size in memory"
            correct: true
            why: "It says where the segment ends, so that an address past its end is not mistaken for part of it."
          - text: "ph.flags, the segment's permissions"
            correct: true
            why: "Text must be mapped executable and read-only, data writable."
          - text: "elf.entry, the program's entry point"
            why: |
              You may have thought the entry point matters to loading. [[kexec]] uses it once,
              to set the first `epc` ([[kernel/exec.c:136]]); a page fault never needs it.
        explain: |
          [[loadseg]] uses `vaddr`, `off` and `filesz`; [[uvmalloc]], called right before it,
          uses `memsz` and the permissions from `flags`. Those five values describe one
          segment completely. The reference stores them in `struct seg`.
      - id: lab12-02
        level: 2
        type: tf
        q: |
          True or false: with the running program's reference kept in `p->exe`, `rm` of the
          program's file (while it runs) frees the file's data blocks at once.
        answer: false
        why_tf: |
          You may have thought `rm` frees a file. It only removes a name: [[sys_unlink]]
          decrements `nlink`. The blocks are freed by the [[iput]] that drops the *last*
          reference to an inode with `nlink` 0 ([[kernel/fs.c:357]]).
        reasons:
          - text: "The blocks are freed only when the last reference goes, which is the exit (or exec) of the last process running the program."
            correct: true
            why: "Right. Until then the process can keep loading pages from the unlinked file."
          - text: "Unlinking a running program fails in xv6, as it does on some Unix systems."
            why: |
              You may be thinking of `ETXTBSY`, which some systems return when a running
              program is *written*. xv6 has no such check, and unlinking is allowed everywhere.
          - text: "The blocks are freed, but the process keeps its pages, so nothing is lost."
            why: |
              With demand paging the process does *not* have all its pages; the ones it has not
              touched are still only in the file. Freeing the blocks would lose them.
        explain: |
          A name and a reference are different things. `dexectest unlink` checks this: the
          helper keeps running from the unlinked file, and the file disappears when it exits.
  - title: Which fault, and whose fault is it?
    q: |
      With nothing mapped, the very first instruction of a new program cannot be fetched.
      What does the hart report, and does [[usertrap]] handle it today? This tree already
      fills some missing pages on demand: [[vmfault]] gives the lazy heap fresh zero pages
      ([[kernel/trap.c:71]]). Now a missing page below `p->sz` can be a page of the program,
      a lazy heap page, or something that should never be touched. How does the kernel tell
      them apart?
    hints:
      - "Look at the condition in [[usertrap]]'s page-fault branch ([[kernel/trap.c:71]]) and at the RISC-V exception codes in `scause`: 12, 13 and 15. Then look at where [[kexec]] puts the stack ([[kernel/exec.c:89]]-[[kernel/exec.c:97]]) and where `sbrk` grows the heap."
      - "The layout is fixed by exec: the segments from address 0 up to the end of the last segment, then the guard page and the stack (both mapped by exec), then the heap. An unmapped page below the end of the last segment can only be program; above it, only heap."
      - "Let the same branch handle all three fault codes, and give [[vmfault]] one more comparison: below the end of the image, fill the page from the file; above it, as before."
    answer: |
      The first fetch raises an **instruction page fault**, `scause` 12. [[usertrap]] today
      sends only 13 (load) and 15 (store) to [[vmfault]]; 12 falls into the `else` branch,
      which kills the process. Since the first program is `init`, the kernel then panics with
      `init exiting` (clinic 1). Add 12 to the condition and treat it as a read.

      The three kinds of missing page are separated by address alone, because [[kexec]] lays
      out every address space the same way:

      | address | what it is | who maps it |
      |---|---|---|
      | below the end of the last segment, inside a segment | program text or data | fault: read from the file |
      | below the end, between two segments | a hole | nobody: fatal |
      | guard page and stack | the stack | [[kexec]], eagerly |
      | above the stack, below `p->sz` | the lazy heap | fault: zero page ([[vmfault]]) |

      So [[vmfault]] keeps its checks (below `p->sz`, not mapped) and asks one more question
      before allocating a zero page: is the page below the end of the image? The reference
      computes that end from the last recorded segment (`imgend`) and sends such pages to a
      new function, `loadpage`. Nothing changes for the heap.

      One more caller is easy to miss: the kernel's own copies. [[copyin]], [[copyout]] and
      [[copyinstr]] call [[vmfault]] for a missing page ([[kernel/vm.c:357]]), and they run
      with the process's page table in hand, so a system call can be the first to touch a page
      of the program. In the recorded boot, the data page of `init`'s image was first touched
      by the kernel: `init`'s child (pid 2, about to become the shell) called `exec("sh",
      argv)`, and [[sys_exec]] fetched the global `argv` array with [[copyin]].
    checks:
      - id: lab12-03
        level: 1
        type: match
        q: |
          Match each `scause` value that can reach [[usertrap]] from user mode with what
          happened.
        pairs:
          - left: "12"
            right: "an instruction fetch from a page the hart may not execute from"
            why: "12 is the instruction page fault: the very first fetch of a demand-paged program raises it."
          - left: "13"
            right: "a load from a page the hart may not read"
            why: "13 is the load page fault, the one a read of a lazy heap page raises."
          - left: "15"
            right: "a store or atomic operation to a page the hart may not write"
            why: "15 is the store/AMO page fault: a write to a lazy page, or to read-only text."
          - left: "8"
            right: "an ecall from user mode, a system call"
            why: "8 is not a fault at all; [[usertrap]] handles it first ([[kernel/trap.c:54]])."
        explain: |
          The access type decides the code: fetch 12, load 13, store 15. All three can now mean
          "a page of the program that is not loaded yet". See [[tour:10]] for how [[usertrap]]
          reads `scause` and [[g:trap-cause]] for the full list.
      - id: lab12-04
        level: 2
        type: choice
        q: |
          You have made [[kexec]] map nothing and taught [[vmfault]] to load program pages,
          but left [[usertrap]]'s condition as `scause == 15 || scause == 13`. You boot. What
          do you see?
        code: kernel/trap.c:69-79
        options:
          - text: "usertrap(): unexpected scause 0xc pid=1, then panic: init exiting"
            correct: true
            why: |
              `init`'s first instruction fetch faults with 12, the `else` branch kills it,
              and [[kexit]] panics because `init` may not exit.
          - text: "init: starting sh, and then the shell dies at its first instruction"
            why: |
              You may have thought only later programs are affected. `init` is loaded by
              [[kexec]] too ([[forkret]] calls it), so it is the first to fault.
          - text: "A hang: the fault is retried forever."
            why: |
              That would happen if the handler returned success without mapping the page. Here
              no handler accepts the fault, so [[usertrap]] kills the process.
          - text: "usertrap(): unexpected scause 0xd pid=1, because the fetch is a load"
            why: |
              You may have thought a fetch counts as a read. RISC-V reports fetches
              separately, with code 12; that is exactly why the condition needs it.
        explain: |
          Clinic 1 is this run, verbatim: `sepc=0xbc stval=0xbc`, `init`'s entry point. A
          fetch fault reports the address of the instruction in both registers.
  - title: What goes into the page?
    q: |
      A page of a segment is about to be loaded. Which of its 4096 bytes come from the file,
      and from where in the file? Which must be zero? Take two real cases: `sh`'s data segment
      starts at `0x2000` with `filesz` `0x10` and `memsz` `0x98`; in the original tree,
      `usertests`' text ends at `0x8739`, in the middle of page `0x8000`. And which PTE bits does each page get?
    hints:
      - "[[loadseg]] reads `min(PGSIZE, filesz - i)` bytes into a page that [[uvmalloc]] has already zeroed ([[kernel/vm.c:233]]). And [[kalloc]] does not return a zeroed page: it fills it with junk ([[kernel/kalloc.c:80]])."
      - "The page must look exactly as eager exec would have made it: the file's bytes for the part of the page below `filesz`, zeros for everything else, including the part of the last page past `memsz`, which the program can still read. And the bits: `PTE_R | PTE_U` plus what [[flags2perm]] gives."
      - "Allocate, zero the whole page, read the file's part into the front of it, map it."
    answer: |
      For a page at offset `o` into a segment (`o` = page address minus `vaddr`):

      - if `o < filesz`, the first `min(4096, filesz - o)` bytes come from the file, starting
        at file offset `off + o`;
      - every other byte is zero: the rest of a page that the file only partly fills, a page
        entirely past `filesz` (pure bss), and the tail of the last page past `memsz`.

      For `sh`'s data page `0x2000`: 16 bytes from the file (two initialized pointers,
      `symbols` and `whitespace`), then zeros, including `freep` at `0x2010`, which [[malloc]]
      tests for 0 the first time it runs. For `usertests`' last text page in the original
      tree: `0x739` bytes from the file, then zeros, the same as eager exec gave.

      The order matters. Zero the page first, then read: zeroing after the read wipes out the
      file's bytes (clinic 2: `init` executes zeros and dies with an illegal instruction), and
      not zeroing at all leaves [[kalloc]]'s `0x05` junk in the bss (clinic 3: every command
      the shell forks dies in [[malloc]] at `freep = 0x0505050505050505`).

      The PTE gets `PTE_R | PTE_U` plus [[flags2perm]] of the segment's flags: `X` for text,
      `W` for data. gdb read the PTE of `init`'s first text page right after it was mapped:
      `0x21fd541b`, flags `0x1b` = `V|R|X|U`; a data page of `dexectest`: `0x21fc8c17`,
      flags `0x17` = `V|R|W|U`. A store to text therefore still faults, and since the page is
      now mapped, [[vmfault]] refuses it and the process dies, as `usertests nowrite` expects.

      A page that lies entirely past `filesz` needs no file at all: zero it and map it. In the
      recorded runs, `dexectest`'s bss page `0x16000` was loaded that way, without touching
      the inode.
    checks:
      - id: lab12-05
        level: 2
        type: number
        q: |
          `usertests`' data segment: `vaddr` `0x9000`, `off` `0xa000`, `filesz` `0x4d0`,
          `memsz` `0x6d08`. When page `0x9000` is loaded, how many bytes are read from the file?
        answer: 1232
        accept: ["0x4d0"]
        wrong:
          4096: |
            You may have thought a page is always read whole. The file supplies only `filesz`
            bytes of this segment; reading 4096 would copy whatever follows the segment in the
            file into the bss.
          0: |
            You may have thought data pages are bss. Only the part past `filesz` is; this page
            starts with the segment's 1232 bytes of initialized data.
          27912: |
            You may have used `memsz` (`0x6d08`). That is the size in memory, which includes
            the bss; and no single page can take more than 4096 bytes anyway.
        why_wrong: "The page is at offset 0 of the segment; the file supplies min(4096, filesz - 0) bytes."
        explain: |
          `min(0x1000, 0x4d0 - 0)` = `0x4d0` = 1232 bytes, read from file offset `0xa000`. The
          remaining 2864 bytes of the page are bss and must be zeroed; pages `0xa000` to
          `0xf000` are all bss and need no read at all.
      - id: lab12-06
        level: 2
        type: bits
        q: |
          gdb read this PTE right after the reference mapped `init`'s page `0x0`. Decode it.
        value: "0x21fd541b"
        fields:
          - label: "V (bit 0)"
            options: ["0", "1"]
            answer: "1"
            why: "0x1b = 1 1011 in binary: bit 0 is set, the mapping is valid."
          - label: "W (bit 2)"
            options: ["0", "1"]
            answer: "0"
            why: "Bit 2 (0x4) is clear in 0x1b: text is not writable, so a store to it still faults and kills the process."
          - label: "X (bit 3)"
            options: ["0", "1"]
            answer: "1"
            why: "0x8 is set: the hart may fetch instructions from this page. Without it the retried fetch would fault again."
          - label: "U (bit 4)"
            options: ["0", "1"]
            answer: "1"
            why: "0x10 is set: user mode may use the page."
          - label: "A (bit 6)"
            options: ["0", "1"]
            answer: "0"
            why: "0x40 is clear. You may have expected A to be set, but this value was read before `init` returned to user mode; nothing had used the mapping yet."
        explain: |
          `0x1b` = `V` (1) + `R` (2) + `X` (8) + `U` (0x10): [[flags2perm]] gave `PTE_X` for
          the text segment and `loadpage` added `PTE_R | PTE_U`. `0x21fd541b >> 10` =
          `0x87f55`, the physical page `0x87f55000` that [[kalloc]] returned. See [[g:pte]].
  - title: Where does a load run, and what may it do there?
    q: |
      Loading a page now locks the executable's inode ([[ilock]], a [[g:sleeplock]]) and
      calls [[readi]], which calls [[bread]], which may wait for the disk. Find every path
      that can reach the load. On each, are interrupts on or off, and which locks does the
      thread hold at that moment? Which paths break a rule of this kernel, what would happen,
      and what will you do about it?
    hints:
      - "Start from every caller of [[vmfault]]: [[usertrap]]'s fault branch ([[kernel/trap.c:71]]; does it ever reach `intr_on` at [[kernel/trap.c:66]]?) and [[copyout]]/[[copyin]]/[[copyinstr]]. For the copy functions, list their callers, and for each caller what it holds at the call."
      - "[[sched]] panics with `sched locks` if a process gives up the CPU holding any spinlock besides its own `p->lock` ([[kernel/proc.c:488]]). Interrupts being off is fine: sched wants them off. Whether a load sleeps depends on the buffer cache, so a wrong path may work for a long time and then panic."
      - "Make sure a copy made under a lock never needs a load: before a system call takes its locks, load the program pages of its user buffer. Ask yourself who could unmap such a page again before the copy happens."
    answer: |
      The paths, with the state observed by gdb on the reference branch:

      | path | interrupts | locks held when the load starts | may it sleep? |
      |---|---|---|---|
      | [[usertrap]] → [[vmfault]] (a fault from user code) | off | none | yes |
      | system call → [[copyinstr]] in [[argstr]] (e.g. [[sys_open]]) | on | none | yes |
      | [[sys_mkdir]], [[sys_mknod]], [[sys_chdir]]: [[argstr]] after [[begin_op]] | on | none (a transaction is not a lock) | yes |
      | [[piperead]] / [[pipewrite]] → [[copyout]]/[[copyin]] | off | `pi->lock` | **no** |
      | [[consoleread]] → [[copyout]] | off | `cons.lock` | **no** |
      | [[kwait]] → [[copyout]] of the status | off | `wait_lock`, the child's `p->lock` | **no** |
      | [[fileread]]/[[filewrite]] → [[readi]]/[[writei]] → copy | on | the file's inode lock and a buffer's lock (sleep-locks) | see the next question |

      A sleep from a page fault is legal even though interrupts are off: [[sleep]] takes
      `p->lock`, [[sched]] checks that `noff` is exactly 1 and that interrupts are off, and the
      scheduler on this hart turns them back on. gdb saw the first load of the system do it:
      `init`'s text page needed three disk reads, and `init` slept three times inside
      [[virtio_disk_rw]] with `noff` 1, `intena` 0 (gdb stopped three times in the disk
      driver's wait loop), and came back on another hart in between.

      The three spinlock paths are bugs waiting for a cache miss. [[piperead]] and
      [[pipewrite]] hold `pi->lock` (noff 1) while they copy; if the copy loads a page and
      [[bread]] has to wait for the disk, [[sched]] sees noff 2 and panics. Clinic 6 shows
      exactly that, with `dexectest locked` (there, the pipe write). If the blocks happen to be cached, nothing sleeps and nothing
      happens, which is why such a bug can survive testing.

      The fix used here: **load first, then lock.** [[sys_read]], [[sys_write]] and
      [[sys_wait]] call a new function, `uvmprefault`, before they take any lock. It walks the
      pages of the user buffer that lie below the end of the image and loads the missing ones.
      A loaded page stays loaded for the rest of the system call: only this process could unmap
      it (with `sbrk`, `exec` or `exit`), and it is busy in this system call; xv6 processes have
      one thread. So the copy, later, under the lock, finds every program page present. Lazy
      heap pages need nothing: allocating one takes only [[kalloc]]'s spinlock and never
      sleeps, as before.

      Alternatives, and why not: loading in a kernel thread (xv6 has none), making the copies
      fail under a lock (a `read` from a pipe into a global buffer would fail at random), or
      copying through a bounce buffer outside the lock in every driver (many changes; the
      prefault is one rule in three places).
    checks:
      - id: lab12-07
        level: 2
        type: state
        q: |
          `sh` takes an instruction page fault on its first text page. The load reads a block
          that is not in the buffer cache, so [[virtio_disk_rw]] has queued the request and is
          about to sleep, inside its own critical section ([[kernel/virtio_disk.c:288]]). Fill in
          the hart's state at that line.
        code: kernel/virtio_disk.c:280-295@288
        state:
          mode: S
          stack: kernel
          satp: kernel
          sie: "off"
          noff: 1
          intena: 0
        why:
          noff: |
            One spinlock is held: `disk.vdisk_lock`, taken by [[virtio_disk_rw]]. The
            inode's sleep-lock and the buffer's sleep-lock are not counted in noff.
          intena: |
            intena records SIE before the outermost push_off. This is a page fault, and
            [[usertrap]] never turned interrupts on, so the acquire saw SIE 0. (A load
            reached from a system call shows intena 1.)
          sie: |
            A spinlock is held, so interrupts are off; and on the fault path they were off
            before anything was acquired.
          stack: |
            A fault runs on the process's kernel stack: `usertrap → vmfault → loadpage →
            readi → bread → virtio_disk_rw`.
          satp: |
            [[uservec]] switched to the kernel page table before [[usertrap]] ran.
        why_wrong: Follow the fault through uservec (kernel page table, kernel stack, SIE off) into usertrap, which does not call intr_on for a fault, and count the spinlocks held at the line.
        explain: |
          gdb recorded exactly this on the reference branch: `sh` (pid 2) at
          [[kernel/virtio_disk.c:288]], noff 1, intena 0, SIE 0, four times for its first text
          page, twice on hart 0, once on hart 1, once more on hart 0, and it finished the load
          on hart 2. Then [[virtio_disk_rw]] releases `vdisk_lock` itself (line 289) and calls
          [[sleep]], which takes no argument in this tree and acquires `p->lock`, so [[sched]]
          sees noff 1 and is satisfied.
      - id: lab12-08
        level: 2
        type: choice
        q: |
          The prefault is missing from [[sys_read]]. `dexectest locked` reads from a pipe into
          a data page that is not loaded yet. Its blocks are not in the buffer cache. What
          happens?
        options:
          - text: "panic: sched locks"
            correct: true
            why: |
              [[piperead]] holds `pi->lock`; the copy loads the page; [[bread]] waits for the
              disk; [[sleep]] adds `p->lock`; [[sched]] sees noff 2 and panics.
          - text: "The read works, a little slower."
            why: |
              It would, if the blocks were cached: nothing would sleep. Here they are not, and
              a sleep under a spinlock is fatal.
          - text: "The read returns -1."
            why: |
              You may have thought [[copyout]] refuses pages that need loading. Without the
              prefault it calls [[vmfault]], which loads.
          - text: "panic: acquire, because ilock takes a lock already held"
            why: |
              The inode is not locked by anyone here; [[ilock]] succeeds. The problem is the
              sleep that follows, not a second acquire.
        explain: |
          Clinic 6 shows the same failure one copy earlier, in the pipe *write* that `locked`
          now makes first (all prefaults removed there): `pipewrite → copyin → vmfault →
          loadpage → readi → bread → virtio_disk_rw → sleep → sched`, `noff` 2. The other two
          harts spin in [[acquire]] on the panicking process's `p->lock`. The read path is the
          same chain with [[piperead]] and [[copyout]], which was recorded too, with the
          read as the check's first copy.
  - title: A program reads its own file
    q: |
      A program opens its own executable and calls `read(fd, buf, 4096)`, where `buf` is in a
      data page it has not touched yet. Follow the call through [[fileread]] and [[readi]] in
      a kernel that loads pages inside [[copyout]] and has no prefault. Which locks does the
      process hold when the copy needs the page, and what does the load then try to take?
      What about two programs, each reading the other's file?
    hints:
      - "[[fileread]] locks the file's inode ([[kernel/file.c:121]]) and [[readi]] holds a buffer while it copies the block out ([[kernel/fs.c:524]]-[[kernel/fs.c:526]]). Which inode is the file here, and which inode does the load lock?"
      - "[[acquiresleep]] ([[kernel/sleeplock.c:22]]) does not check *who* holds the lock: a process that asks for a sleep-lock it already holds sleeps until it releases it, that is, forever, with no panic and no message."
      - "The rule from the previous question covers this too: no load may start while the system call holds a lock of any kind, sleep-locks included. The same call, made earlier, removes the problem."
    answer: |
      [[fileread]] holds the inode lock of the file being read, which here is the program's own
      file, and [[readi]] holds the lock of the buffer it is copying from. The copy reaches
      [[vmfault]], the load calls [[ilock]] on `p->exe`, the very same inode, and
      [[acquiresleep]] waits for the lock to be released, by itself. The process sleeps
      forever. Nothing panics, `kill` cannot help (it makes the process runnable, and
      [[acquiresleep]] goes back to sleep), and anyone else who needs that file waits behind it.
      If the inode lock were somehow skipped, the buffer lock would deadlock only when the
      block being copied from is the block the load needs (a read into the page that holds that
      very part of the file). In `selfread` they differ: the copy holds the block at file offset
      0, and the load of `0xc000` needs file offset `0x6000 + 0x7000` = `0xd000`. Clinic 6 shows
      the hang and the sleeping process's stack.

      Two programs that read each other's files deadlock the same way, in a cycle: process A
      reads B's program file, so it holds that inode's lock, and its copy needs a page of A's
      own program, so it waits for A's file's lock; process B does the mirror image. Each holds
      what the other needs, an ABBA deadlock between two sleep-locks. A run on a kernel
      without the prefault, with two copies of one program (`abA`, `abB`), each reading the
      other's file into its own untouched data, hung in the first round;
      gdb showed `abA` (pid 4) sleeping on inode 28's lock, held by pid 5, and `abB` (pid 5)
      sleeping on inode 29's lock, held by pid 4. On the reference branch the same program ran
      10 rounds without trouble.

      The prefault from the previous question removes every case at once: [[sys_read]] loads
      the buffer's program pages before [[fileread]] takes any lock, so the copy never loads.
      That is why the reference calls it from the system-call layer and not inside the pipe
      or console code: it is the last point before *any* lock, spinlock or sleep-lock.
      Detecting the self-deadlock instead (a check in [[acquiresleep]] for `lk->pid ==
      myproc()->pid`) would only turn a hang into a panic; the `read` is legitimate and must
      work.

      (Linux meets the same problem when `write()` copies from a buffer that is memory-mapped
      from the file being written, and solves it the same way: fault the user pages in before
      taking the locks, then copy.)
    checks:
      - id: lab12-09
        level: 2
        type: choice
        q: |
          Without the prefault, `dexectest selfread` reads its own file into a data page it has
          not touched. What does the console show?
        options:
          - text: "Nothing more: dexectest never finishes, and the prompt never comes back."
            correct: true
            why: |
              The process sleeps in [[acquiresleep]] on its own inode lock, forever. The harts
              are idle in the scheduler.
          - text: "panic: acquire"
            why: |
              That panic is for spinlocks ([[holding]]). A sleep-lock records a pid, and
              [[acquiresleep]] never checks it; it sleeps.
          - text: "panic: sched locks"
            why: |
              You may be thinking of the pipe case. Here no spinlock is held when the process
              sleeps: [[acquiresleep]] releases `lk->lk` before [[sleep]].
          - text: "dexectest: selfread: FAIL, because read returns -1"
            why: |
              Nothing makes the copy fail: the load is attempted and blocks.
        explain: |
          A hang is the worst kind of failure: no message, and a test runner that only checks
          output waits forever. gdb, attached to the hung kernel, found `dexectest` SLEEPING with
          `chan` equal to the address of its own executable's inode lock, whose `pid` field was
          the process's own pid.
      - id: lab12-10
        level: 3
        type: tf
        q: |
          True or false: after [[sys_read]] has loaded the buffer's program pages, one of them
          could be unmapped again before [[fileread]] copies into it, so the copy still needs
          the load path as a fallback.
        answer: false
        why_tf: |
          You may be thinking of a multithreaded kernel, where another thread of the process
          could unmap memory meanwhile. In xv6 a process has one thread, and that thread is
          inside this system call.
        reasons:
          - text: "Only the process itself can unmap its pages (sbrk, exec, exit), and it is busy in this system call."
            correct: true
            why: "Right. Nothing pages memory out in xv6 either, so a loaded page stays loaded until the process itself changes its address space."
          - text: "Interrupts are off during the copy, so nothing can run."
            why: |
              Interrupts off only affects this hart; the other harts keep running. The argument
              is about who *could* unmap the page, not about who runs.
          - text: "The page is locked in memory by the prefault."
            why: |
              There is no page locking in xv6. The guarantee is structural: no other code
              unmaps another process's pages.
        explain: |
          The prefault is sound only because of that structure. With threads (lab 9) or
          swapping (lab 16) it would need help: a page could vanish between the prefault and the
          copy, and the copy would have to fail or retry instead of loading under the lock.
  - title: The file changes under a running program
    q: |
      The program's file is unlinked while it runs. Or truncated. Or rewritten. What happens
      in each case, with the design so far, and what should happen? And look again at
      [[kexit]] dropping `p->exe`: what is special about that particular [[iput]]?
    hints:
      - "[[sys_unlink]] only lowers `nlink`. [[iput]] frees the inode's blocks when the last reference goes and `nlink` is 0 ([[kernel/fs.c:357]]-[[kernel/fs.c:377]]); [[itrunc]] writes to the disk. [[log_write]] refuses to run outside a transaction ([[kernel/log.c:231]])."
      - "[[readi]] returns fewer bytes than asked when the file is shorter ([[kernel/fs.c:510]]). Nothing in xv6 stops anyone from opening a running program's file for writing."
      - "A short read means the page cannot be built: fail the load and let the fault kill the process. Rewrites are visible; decide that it is acceptable for this lab, and say so. And keep every `iput` of `p->exe` inside `begin_op`/`end_op`."
    answer: |
      **Unlinked**: the process holds a reference, so [[iput]] does not free anything until
      that reference goes. Pages keep loading from the unlinked file. When the last process
      running it exits, its [[iput]] in [[kexit]] is the last one, the inode has `nlink` 0, and
      [[iput]] truncates and frees it: [[itrunc]] → [[bfree]] → [[log_write]]. That is the
      special case: the only time the [[iput]] of `p->exe` writes to the disk, and the reason it must
      be inside the transaction. Outside one, [[log_write]] panics with `log_write outside of
      trans` (clinic 5). A bug that only shows when a running program's file was deleted is
      invisible to `usertests`.

      **Truncated** (`open` with `O_TRUNC`): the next load of a page that is not loaded yet asks
      [[readi]] for bytes the file no longer has and gets fewer. The page cannot be built, so
      `loadpage` frees it and fails, [[vmfault]] returns 0, and [[usertrap]] kills the process.
      (A system call that needed that page fails instead.) Truncation never makes a process read
      *another* file's data: the blocks were freed through the inode, so the inode no longer
      points at them. `dexectest truncate` checks the kill.

      **Rewritten**: pages already loaded keep their old contents, pages loaded later come from
      the new contents. A program can end up running a mix of two versions. The reference
      accepts this and documents it; `dexectest modify` checks that a running helper sees a
      value written into its file after it started. Real systems close the hole by refusing to
      open a running program's file for writing (`ETXTBSY`), or by giving each executable
      mapping a private copy of a page when the file changes; both are stretch goals.

      Two checks move into [[kexec]], because [[uvmalloc]] and [[loadseg]] used to make them
      without saying so. The original kernel noticed a truncated or corrupt program when
      [[loadseg]]'s [[readi]] came up short, and `exec` failed; the reference checks, while the
      inode is locked, that the file is long enough to hold every segment's bytes
      (`ph.off + ph.filesz <= ip->size`). And the original kernel could never accept a segment
      that ends absurdly high: [[uvmalloc]] ran out of memory long before, and `exec` returned
      -1. Without that implicit limit a crafted ELF whose data segment ends past `MAXVA` makes
      the stack setup panic in [[walk]], and one whose segment ends just below the trampoline
      makes it panic with `mappages: remap`. The reference refuses any segment that ends above `TRAPFRAME -
      (USERSTACK + 1) * PGSIZE`, which leaves room for the guard page and the stack. One
      difference remains, by design: a segment with a huge bss that does fit (4 GiB, say) now
      execs, since nothing is allocated until it is touched; the original kernel refused it for
      lack of memory.
    checks:
      - id: lab12-11
        level: 2
        type: choice
        q: |
          A kernel has every other part of this lab right, but [[kexit]] drops `p->exe` after
          [[end_op]] instead of before it. When does it go wrong?
        options:
          - text: "Only when the exiting process holds the last reference to a program file that was unlinked while it ran: panic: log_write outside of trans."
            correct: true
            why: |
              Only that [[iput]] frees blocks, and freeing them calls [[log_write]], which
              checks that a transaction is open.
          - text: "At every exit, with panic: log_write outside of trans."
            why: |
              You may have thought every [[iput]] writes. An [[iput]] that only lowers `ref`
              writes nothing; most exits drop a reference that others still hold, or that has
              `nlink` > 0.
          - text: "Never: iput takes care of its own transaction."
            why: |
              It does not; the comment above it says every caller must be inside a
              transaction ([[kernel/fs.c:347]]).
          - text: "At the next boot: the file system is corrupt because the free was not logged."
            why: |
              The kernel does not get that far: [[log_write]] checks `log.outstanding` and
              panics at once.
        explain: |
          Clinic 5 is this kernel: `usertests -q` passed, then `dexectest unlink` panicked in
          `kexit → iput → itrunc → bfree → log_write`.
      - id: lab12-12
        level: 2
        type: match
        q: |
          A helper program is running from file `dxcopy` and has not yet touched page 7 of
          its data. Match what happens to the file with what the helper sees when it then
          touches page 7, on the reference branch.
        pairs:
          - left: "dxcopy is unlinked"
            right: "page 7 loads normally; the file disappears when the helper exits"
            why: "The helper's reference keeps the inode and its blocks alive."
          - left: "dxcopy is truncated to 0 bytes"
            right: "the helper is killed (unexpected scause 0xd)"
            why: "readi returns 0 bytes, the load fails, and the load fault is fatal."
          - left: "a new value is written into page 7's bytes in dxcopy"
            right: "the helper reads the new value"
            why: "The page is read from the file as it is at fault time."
          - left: "the same three, on the original kernel"
            right: "the helper sees the old contents and runs normally"
            why: "The original kernel read every page at exec, before any change."
        explain: |
          `dexectest unlink`, `truncate` and `modify` run these three cases; on the original
          kernel `truncate` and `modify` report FAIL because nothing changes for the helper.
  - title: What else has to learn about the new state?
    q: |
      Three more places see the new state of a process. [[kfork]]: a child of a demand-paged
      process. [[growproc]] with a negative size: `sbrk(-n)` below the end of the image, then
      `sbrklazy(n)` to take the addresses back. And [[usertrap]] itself, which reads `scause`,
      `sepc` and `stval` several times: is that still safe now that the fault handler can
      sleep?
    hints:
      - "[[uvmcopy]] copies mapped pages only ([[kernel/vm.c:309]]). [[growproc]] ([[kernel/proc.c:249]]-[[kernel/proc.c:251]]) unmaps pages but knows nothing about segments. [[usertrap]] calls `r_scause()` and `r_stval()` in its condition and again in its error message ([[kernel/trap.c:71]]-[[kernel/trap.c:77]])."
      - "CSRs belong to the hart, not to the process. While a process sleeps, its hart runs other code and takes other traps; and the process may wake on another hart."
      - "Fork copies the table and takes a reference. Shrinking cuts the table at the new size. usertrap reads the trap registers once, into locals, before anything can sleep."
    answer: |
      **fork.** Pages the parent loaded are copied by [[uvmcopy]] like any other page; pages it
      never touched are unmapped in the child too, so the child loads them itself, from the same
      file through its own reference (first question). `dexectest fork` checks a page that
      neither had touched.

      **sbrk(-n) below the image.** [[uvmdealloc]] frees the pages, but the segment table still
      covers those addresses. If the process grows again lazily and touches one of them,
      [[vmfault]] would load the *program's* bytes there, where the original kernel gives a zero
      page. The reference adds `segtrim`, called from [[growproc]]: it cuts each segment at the
      new size (rounded up to a page, as [[uvmdealloc]] does) and drops segments entirely above
      it, so the end of the image moves down with the process. Only a program that gives back
      its own stack can get there; `dexectest shrink` does it in a child that, from then on,
      calls only system-call stubs, which use no stack.

      **The trap registers.** Before this lab nothing between [[usertrap]]'s first `r_scause()`
      and its error message could sleep, so reading the CSRs again was harmless. Now [[vmfault]]
      can sleep in the load, and while the process sleeps, its hart takes other traps: gdb saw
      `scause` read `0x8000000000000009` (a supervisor external interrupt, the disk) right after
      `init`'s first load returned, where it had read 12 before. A load that then *fails*, after
      sleeping, would be reported with some other trap's cause and address, possibly from
      another hart. The reference reads `scause` and `stval` once, into locals, at the top of
      [[usertrap]], and prints the saved `epc` instead of `sepc`. (`epc` was already saved,
      [[kernel/trap.c:52]], which is why returning to user mode was never affected.)
    checks:
      - id: lab12-13
        level: 3
        type: choice
        q: |
          `init` (pid 1) takes its first instruction page fault on hart 1, with `scause` 12 and
          `stval` `0xbc`. The load reads three blocks from the disk, and `init` waits for each.
          Right after the read, back on hart 1, what did gdb read from the `scause` CSR?
        options:
          - text: "0x8000000000000009, a supervisor external interrupt"
            correct: true
            why: |
              The disk's completion interrupts were taken while `init` slept, on whatever hart
              they arrived at; the CSR holds the last trap taken on this hart.
          - text: "12, because the CSR belongs to the process"
            why: |
              You may have thought CSRs are saved and restored with the process, like the
              registers in the trapframe or the context. `scause` is never saved by [[swtch]] or
              the trampoline; it belongs to the hart.
          - text: "12, because interrupts are off in the fault handler"
            why: |
              They are off on this hart while the handler runs, but [[sleep]] gives the hart to
              the scheduler, which turns them on.
          - text: "0, because the hart was idle"
            why: |
              An idle hart in the scheduler still takes interrupts, and each one writes `scause`.
        explain: |
          That is why [[usertrap]] now copies `scause` and `stval` into locals before calling
          [[vmfault]]. The process even finished the load on a different hart from the one
          that took the fault in some runs (`sh`: hart 0, then 1, then 0, then 2).
      - id: lab12-14
        level: 2
        type: tf
        q: |
          True or false: a child forked before its parent touched page 3 of `big[]` gets page
          3 from its parent when it touches it.
        answer: false
        why_tf: |
          You may have thought fork shares unloaded pages. [[uvmcopy]] copies only mapped
          pages; page 3 is unmapped in both, and the child loads it from the file.
        reasons:
          - text: "The child loads it from the file through its own reference to the executable."
            correct: true
            why: "Right: that is why fork must duplicate the reference and copy the segment table."
          - text: "The parent is asked to load it and share it."
            why: |
              Nothing in xv6 shares pages between processes (that is lab 11's copy-on-write,
              not this branch).
          - text: "The child gets a zero page from the lazy heap code."
            why: |
              That would be a bug: the child's segment table says page 3 belongs to the
              program, so [[vmfault]] loads it.
        explain: |
          Each process loads its own copy of a page it needs. In the measured run of
          `usertests` without its warm-up, the 16 pages of its image were loaded 136 times over
          all its processes: forks inherit only what the parent had loaded.
  - title: How do you know it works, and what does usertests think?
    q: |
      `usertests` counts the free pages before its tests and after, and fails if pages were
      lost ([[user/usertests.c:3476]], [[user/usertests.c:3500]]). What will it report on the
      demand-paged kernel, and is it right? And how can a test program show, from user space,
      that a page is loaded only when touched?
    hints:
      - "Between the two counts the usertests process itself keeps running code and reading data it never touched before: the functions of later tests, the test table, strings."
      - "On this kernel, touching a page of your own image for the first time allocates a page, which is then no longer free. That is not a leak."
      - "Load the whole image before the first count, so the two counts compare the same thing. And measure with the same counter: count, touch two pages, count."
    answer: |
      It reports a leak that is not one. A run of the branch without the fix ended with
      `FAILED -- lost some free pages 32467 (out of 32470)`: three pages of `usertests` itself
      were loaded during the tests. The check compares "free" before and after, and on this
      kernel "free" also shrinks when a program grows into its own image.

      The reference keeps the check and changes what it measures: a new function, `touchimage`,
      reads one byte of every page from address 0 up to the linker's `end` before the first
      count, so the whole image is loaded and both counts see the same program. On the original
      kernel it changes nothing. This is the only change to `usertests`.

      The same counter makes the lab's own measurement. `dexectest lazy` counts free pages
      (after one warm-up count, which allocates page-table pages for the heap once), touches two
      untouched pages of `big[]`, and counts again: exactly 2 on this branch, 0 on the original
      kernel, which had loaded them at exec.
    checks:
      - id: lab12-15
        level: 1
        type: number
        q: |
          On the reference branch, `dexectest lazy` counts free pages, reads one int from each of
          two untouched pages of `big[]`, and counts again. How many free pages did the two
          reads cost?
        answer: 2
        wrong:
          0: |
            That is the original kernel, which had loaded every page of `big[]` at exec.
          8: |
            You may have counted disk blocks (4 per page). The cost in memory is one page per
            page touched; the blocks go through the buffer cache, which has a fixed size.
          1: |
            You may have thought the second page comes for free with the first. Each page is
            loaded separately, when it is first touched.
        why_wrong: "One page of memory is allocated for each page of the image that is touched for the first time."
        explain: |
          The recorded run printed `dexectest: lazy: touching 2 data pages took 2 free pages`.
          No page-table page is needed: both pages lie in the first 2 MiB of the address space,
          under the level-0 page table that already maps the stack, which exec built.
build: |
  **Start.**

  ```text
  git checkout -b my-12 06aad25
  ```

  Add the test program first: copy the spec's list of checks into `user/dexectest.c` and add
  `$U/_dexectest\` to `UPROGS` in the `Makefile`. On the unmodified kernel `lazy`, `truncate`
  and `modify` print `FAIL` (it loads everything at exec, so nothing that happens later can
  matter) and the rest print `OK`: that is the test working.

  **Milestones, in an order that keeps the system bootable after each one.** Until the
  switch in milestone 7, exec still loads everything, so every new piece can be tested by the
  existing suite before it carries any weight.

  1. **Keep the file.** `p->exe` in `struct proc`; [[kexec]] keeps [[namei]]'s reference and
     drops the old program's inside its transaction; [[kfork]] duplicates it; [[kexit]] drops
     it inside the transaction it already has. Test: `usertests -q`.
  2. **Record the segments.** A small table in `struct proc`, filled by [[kexec]], copied by
     [[kfork]]. Test: it boots.
  3. **The loader.** A function that, given a process and a page address, finds the segment,
     allocates and zeroes a page, reads the file's part of it with [[readi]] under [[ilock]],
     and maps it. Nothing calls it yet. Test: it compiles.
  4. **Route faults to it.** In [[vmfault]], before the zero-page code: below the end of the
     image, call the loader. Then make [[usertrap]] read `scause` and `stval` once, into
     locals, and accept `scause` 12 as well. Test: `usertests -q` (no program page is ever
     missing yet, so nothing changes).
  5. **Load before locking.** A function that loads the program pages of a user range, called
     from [[sys_read]], [[sys_write]] and [[sys_wait]] before they take any lock. Test:
     `usertests -q`.
  6. **Fix `usertests`' leak check** so that it loads its own image before the first count.
  7. **Flip the switch.** [[kexec]] stops calling [[uvmalloc]] and [[loadseg]] for segments and
     checks that the file holds each segment's bytes instead. Test: `dexectest`, then
     `usertests -q`, then `dexectest` again.
  8. **sbrk below the image.** Cut the segment table in [[growproc]] when the process shrinks.
     Test: `dexectest shrink`.

  **Debugging advice.** For the first faults of the system (`init`'s), start QEMU halted with
  `make qemu-gdb` (it adds `-S` and a gdb port of its own, which it writes into `.gdbinit`),
  run `${TOOLPREFIX}gdb kernel/kernel` in another terminal, and set breakpoints before the
  first `continue`; for later events, continue and interrupt with Ctrl-C when you need to.
  `TOOLPREFIX` is your RISC-V toolchain's prefix, the same one xv6's Makefile detects
  (`riscv64-unknown-elf-`, `riscv64-linux-gnu-` or `riscv64-elf-`); set it with `export
  TOOLPREFIX=riscv64-unknown-elf-` or whichever you have. On Debian/Ubuntu/WSL,
  `gdb-multiarch` also works as the debugger. `${TOOLPREFIX}readelf -l user/_NAME` shows a
  program's segments.

  - A panic at boot right after `hart 2 starting` means `init` died: look at the `usertrap()`
    line. `scause` 0xc is a fetch nobody handled; 0x2 at `sepc` = the entry point means the
    page was mapped but its bytes are wrong.
  - Print every load while you build it: `printk("load %s %d va %p\n", p->name, p->pid, va)`.
    The first lines of a boot should be `init` loading `0x0`, then `init`'s child loading
    `0x1000` inside `exec`.
  - A hang with idle harts: attach gdb, list `proc[]` with their `state` and `chan`, and
    compare a SLEEPING process's `chan` with the addresses of inode and buffer locks. To see
    a sleeping process's kernel stack, set `$sp`, `$s0` and `$pc` from its `p->context`
    (`sp`, `s0`, `ra`) on a halted hart, run `bt`, and put the registers back.
  - `panic: sched locks`: break on `panic` and run `bt`; look for a lock-holding function
    (`piperead`, `consoleread`, `kwait`) above `copyout`/`copyin` and a disk wait below.
clinic:
  - bug: usertrap does not handle instruction page faults
    change: |
      Everything else is in place, but the fault branch in [[usertrap]] still accepts only
      loads and stores:

      ```diff
      -  } else if ((scause == 15 || scause == 13 || scause == 12) &&
      +  } else if ((scause == 15 || scause == 13) &&
                    vmfault(p->pagetable, p->sz, stval, (scause == 15) ? 0 : 1) != 0) {
      ```
    symptom: |
      xv6 kernel is booting

      hart 2 starting
      hart 1 starting
      usertrap(): unexpected scause 0xc pid=1
                  sepc=0xbc stval=0xbc
      panic: init exiting
    why: |
      The first process runs [[kexec]] from [[forkret]] and returns to user mode at `init`'s
      entry point, `0xbc` (`${TOOLPREFIX}readelf -h user/_init`). Nothing is mapped there any more, so the
      hart cannot fetch the instruction and raises an instruction page fault: `scause` 12, with
      the address in both `sepc` and `stval`. Loads and stores into unloaded pages (string
      constants, data) go through the existing branch and would work; but the very first thing
      every program does is fetch an instruction.

      Neither branch accepts cause 12, so the `else` branch prints the message and kills the
      process. The process is `init`, and [[kexit]] refuses to let it go: `panic: init
      exiting`. The machine never reaches the shell. On the original kernel this branch did not
      need 12: exec mapped every text page, so a fetch could only fault on an address outside
      the program, and killing was right.
  - bug: The page is zeroed after the file data is read
    change: |
      The `memset` moves below the read, as if zeroing were a final cleanup:

      ```diff
         if ((mem = kalloc()) == 0)
           return 0;
      -  memset(mem, 0, PGSIZE);
         off = va - s->va;
         if (off < s->filesz) {
           [...]
           iunlock(p->exe);
         }
      +  memset(mem, 0, PGSIZE);
         if (mappages(p->pagetable, va, PGSIZE, (uint64)mem,
      ```
    symptom: |
      xv6 kernel is booting

      hart 2 starting
      hart 1 starting
      usertrap(): unexpected scause 0x2 pid=1
                  sepc=0xbc stval=0x0
      panic: init exiting
    why: |
      Every load now reads the file correctly and then wipes the page: every page of every
      program is all zeros. `init`'s first fetch at `0xbc` faults, the handler loads page 0,
      and the retried fetch finds the bytes `00 00`. In RISC-V an all-zero 16-bit instruction
      is defined to be illegal (so that running into zeroed memory stops at once), so the hart
      raises an illegal-instruction exception, `scause` 2, with `stval` 0. [[usertrap]] kills
      `init` and the kernel panics as in clinic 1, but with a
      different cause: this time the page *was* mapped.

      The rule is that zeroing provides the background and the file overwrites part of it, so
      the zeroing must come first. The next clinic is the opposite mistake.
  - bug: The page is not zeroed at all
    change: |
      The `memset` is gone: [[readi]] fills the part of the page the file supplies, and the
      rest keeps whatever [[kalloc]] left there.

      ```diff
         if ((mem = kalloc()) == 0)
           return 0;
      -  // zero first: what the file does not supply (the bss, the end
      -  // of the last page) must read as 0, not as kalloc's junk.
      -  memset(mem, 0, PGSIZE);
         off = va - s->va;
      ```
    symptom: |
      xv6 kernel is booting

      hart 1 starting
      hart 2 starting
      init: starting sh
      $ echo hi
      usertrap(): unexpected scause 0xd pid=3
                  sepc=0x11b4 stval=0x505050505050505
      $ dexectest
      usertrap(): unexpected scause 0xd pid=4
                  sepc=0x11b4 stval=0x505050505050505
      $ usertests -q
      usertrap(): unexpected scause 0xd pid=5
                  sepc=0x11b4 stval=0x505050505050505
      $
    why: |
      [[kalloc]] does not return zeroed pages; it fills every page with the byte `0x05`
      ([[kernel/kalloc.c:80]]) precisely so that code which forgets to initialize memory fails
      visibly. Text pages are almost full of file data, and `init` and the shell start and
      print their prompts. The damage is in the [[g:bss]].

      `sh`'s data page `0x2000` holds 16 bytes from the file (`symbols` and `whitespace`) and
      then the bss, which begins with `freep` at `0x2010`, the head of [[malloc]]'s free list.
      It must start as 0. Here it is `0x0505050505050505`. The parent shell never calls
      [[malloc]], so it survives; but for every command line it forks a child that parses the
      line, and the parser allocates. [[malloc]] sees `freep` is not 0, follows it, and the load
      `ld a5,0(a0)` at `0x11b4` faults on address `0x0505050505050505`, cause 13. Every command
      dies in the shell's child before it reaches `exec`, which is why `echo`, `dexectest` and
      `usertests` all fail at the same `sepc`, with pids 3, 4 and 5.

      A program whose bss happened to be used only after being written would have run fine.
      The original kernel never had this problem because [[uvmalloc]] zeroed every page before
      [[loadseg]] read into it ([[kernel/vm.c:233]]).
  - bug: fork shares the executable without taking a reference
    change: |
      [[kfork]] copies the pointer, as if the child could borrow the parent's reference:

      ```diff
         np->cwd = idup(p->cwd);
      -  np->exe = idup(p->exe); // the child runs the same program
      +  np->exe = p->exe;
      ```
