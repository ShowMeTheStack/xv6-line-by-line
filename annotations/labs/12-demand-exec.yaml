    why: |
      All of `usertests` passes: no test in it deletes a program while the program runs. Almost
      every [[iput]] only lowers a reference count and writes nothing, and for those the missing
      transaction does not matter.

      `dexectest unlink` starts a copy of itself as a helper from the file `dxcopy`, unlinks
      `dxcopy` while the helper runs, then lets it finish. The helper (pid 4, `dxcopy`) holds the
      last reference to an inode whose `nlink` is now 0. Its [[kexit]]'s [[iput]] therefore frees
      the file: [[itrunc]] gives each data block back with [[bfree]], which clears the block's bit
      in the free bitmap and records the change with [[log_write]]. [[log_write]] checks that the
      caller is inside a transaction (`log.outstanding < 1`, [[kernel/log.c:231]]) and panics.
      gdb shows the chain and `noff` 1: `log.lock`, taken by [[log_write]] right before the check.

      Without that check the bitmap block would be changed outside the log, and a crash in the
      next moments could leave the bitmap and the inode disagreeing. The rule "every [[iput]]
      inside a transaction" ([[kernel/fs.c:347]]) exists for this one case, which a test suite
      that never deletes a running program will never exercise.
