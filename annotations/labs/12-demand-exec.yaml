measure: |
  (These counts were made with a `dexectest` whose `locked` check had no pipe write yet; the
  kernel's loading code is the same.)

  **Pages loaded against the size of the image.** A scratch copy of the branch counted, per
  program file, the execs, the pages of the image, and the pages loaded (and which ones); a
  scratch copy of the original kernel counted the pages its exec allocated for segments. Both
  printed the counters on Ctrl-P (instrumentation not on the branch). Same commands, one boot
  each, except the `dexectest lazy` row, which comes from a separate boot of the counting
  branch:

  | program (image pages) | event | original kernel: pages loaded | demand paging: pages loaded |
  |---|---|---|---|
  | `init` (2) | boot | 2 | 2 |
  | `sh` (3) | boot and three command lines | 3 | 3 |
  | `echo` (2) | `echo hi` | 2 | 1 (its bss page is never touched) |
  | `ls`, `cat`, `grep`, `wc` (2 each) | `ls`, `cat README \| grep the \| wc` | 8 | 8 |
  | `dexectest` (25) | `dexectest lazy` alone | 25 | 8 (text pages 0, 1, 2 and 4, data page `0x5000`, `big[]` pages 1 and 2, one bss page) |
  | `dexectest` (25) | full `dexectest` | 25 | 26 (all 25, one of them twice: page 3 of `big[]`, which the `fork` check makes both the child and the parent load) |
  | `dxcopy` helpers (25) | 3 runs inside `dexectest` | 75 | 22 (13 different pages) |
  | `echo` (2) | in `usertests -q` | 4 (2 execs; one of them, `bigargtest`'s, then fails) | 1 (1 exec succeeds) |
  | `usertests` (16) | `usertests -q` | 16 | 16 (the `touchimage` warm-up) |

  The small programs touch almost everything they have, and demand paging saves little there:
  a 2-page program cannot save more than a page. The gain grows with the part of a program a
  run does not need: the helpers in `dexectest` used 22 of 75 pages. Notice also the failed
  exec: the original kernel read `echo` twice for `bigargtest`, whose exec is built to fail
  when it copies the arguments; the demand-paged kernel read nothing for it.

  **How much of `usertests` is ever touched?** All of it. With the `touchimage` warm-up removed
  (and its leak check failing, as expected: `lost some free pages 32466 (out of 32469)`), the
  16 pages of `usertests` (9 text, 7 data and bss) were loaded 136 times across all its
  processes, and every one of the 16 at least once. A test suite runs every test; that is
  what it is for. The 136 loads are the price of forking before touching: a child inherits
  only the pages its parent had loaded, and loads the rest again from the file (through the
  buffer cache), each child for itself.

  **One page per touch.** `dexectest lazy`: `touching 2 data pages took 2 free pages` on this
  branch, `0` on the original kernel.

  **Where loads happen.** In the gdb runs of the finished branch (boot, `echo hi`, `dexectest
  selfread`, `locked`, `unlink`, `truncate`), loads came from page faults with interrupts off
  and from three system-call paths with interrupts on: [[sys_exec]]'s [[copyin]] of `argv`,
  [[sys_open]]'s [[copyinstr]] of a path (the shell opening `console`: the string is in
  `sh`'s second text page), and the prefaults of [[sys_read]] and [[sys_wait]]. Every load
  that read a block not in the cache slept, and processes regularly finished a load on a
  different hart from the one that started it.
further: |
  - **Make the latent bug fail every time.** A sleep under a spinlock only panics when the load
    misses the buffer cache. A check at the top of `loadpage`, `panic` if this hart's `noff` is
    not 0 (read with interrupts off, so the hart cannot change under you), turns clinic 6's
    pipe case into a panic on every run. Why does it not catch the self-deadlock, and what
    would you need to catch that (a per-process count of held sleep-locks)?
  - **Text busy.** Refuse to open a running program's file for writing (and refuse to exec a
    file open for writing), as Unix does with `ETXTBSY`. You will need a count of executing
    processes per inode that [[kfork]] can update without sleeping, and you will meet the
    question of which lock protects it.
  - **Share text pages between processes.** Every process loads its own copy of a text page,
    even when ten processes run the same program. Keep loaded pages in a per-inode cache and map
    the same physical page read-only into each process: a first page cache, and the reason
    real kernels count references to pages (lab 11).
  - **Fault-around.** Load the neighbours of a faulting page too, if they are cheap (already in
    the buffer cache). Measure faults and disk reads per program before and after.
  - **Drop clean pages under memory pressure.** A text page that was never written can be
    unmapped and freed when memory runs out, and loaded again from the file on the next touch:
    no swap space needed. What must the kernel know about a page to decide it may do that?
    (Lab 16 builds on this.)
  - **mmap.** The segment table is a special case of a list of file-backed mappings. Generalize
    it into `mmap` and `munmap` of any file (lab 15).
