      #0  panic (s=s@entry=0x80007468 "ilock") at kernel/printk.c:139
      #1  0x000000008000336a in ilock (ip=<optimized out>) at kernel/fs.c:301
      #2  0x0000000080004d42 in loadpage (p=p@entry=0x800101e0 <proc+1072>, va=va@entry=36864) at kernel/exec.c:232
      #3  0x0000000080001554 in vmfault (pagetable=0x87f25000, psz=<optimized out>, va=va@entry=36864, read=read@entry=1) at kernel/vm.c:473
      #4  0x000000008000279e in usertrap () at kernel/trap.c:77
      #5  0x0000003ffffff09c in ?? ()
      $1 = 3
      $2 = "dexectest\000\000\000\000\000\000"
      $3 = {dev = 1, inum = 23, ref = 0, lock = {locked = 0, lk = {locked = 0, name = 0x80007568 "sleep lock", cpu = 0x0}, name = 0x80007448 "inode", pid = 0}, valid = 1, type = 2, major = 0, minor = 0, nlink = 1, size = 147072, addrs = {1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019}}

      # a third boot: usertests -q
      [...]
      ALL TESTS PASSED
    why: |
      Each [[iput]] must match a reference that was taken. With this change two processes
      drop a reference that was counted once. In `dexectest fork`, `dexectest` (pid 3) holds
      the only reference to its file, from [[namei]] in its exec: `ref` 1. Its child shares the
      pointer, reads page 3 of `big[]`, and exits; [[kexit]]'s [[iput]] brings `ref` to 0. The
      parent then touches page 3 itself (`va` 36864 = `0x9000`): `loadpage` calls [[ilock]],
      which refuses an inode with no references ([[kernel/fs.c:300]]): `panic: ilock`. gdb shows
      the parent's `p->exe` with `ref = 0`, still valid, still inode 23.

      The panic is the lucky outcome. An inode with `ref` 0 is a free slot for [[iget]]
      ([[kernel/fs.c:263]]). Had any file been opened between the child's exit and the parent's
      fault, that slot could have been given to another file, with `ref` 1; [[ilock]] would have
      been satisfied, and `loadpage` would have read *that* file's blocks into the program's
      memory: garbage code or data, and no message at all. (Reasoned from the code; not seen in
      these runs.)

      `echo hi` and `ls` worked, and `usertests -q` passed on a third boot. The reference count
      went wrong there too (the shell's own count dropped to 0 at the first command, when the
      child's exec dropped a reference it had never taken), but nobody needed the inode again:
      the shell had already loaded the few pages it uses, and `usertests` loads its whole image
      before its first test (the `touchimage` change). A missing reference is invisible until
      someone loads a page through it.

      A second variant, kexec storing `p->exe = ip` but still dropping [[namei]]'s reference
      with `iunlockput`, fails at once: the first load in the system, `init`'s page 0, finds
      `ref` 0, and the console shows `panic: ilock` right after `hart 1 starting`.
