      fourth step (intena 1). The difference is [[usertrap]]: it turns interrupts on only for
      a system call ([[kernel/trap.c:66]]); for a fault, SIE is still 0 from the trap entry.
      So in a fault, [[kalloc]]'s [[push_off]] is the outermost level and records 0, and its
      [[pop_off]] at line 103 leaves interrupts off, as the rest of the fault handling
      expects. In a system call the same [[pop_off]] turns them back on.

      This is the reason the allocator must use the counting pair: it cannot know whether its
      caller had interrupts on, and it must leave them exactly as it found them.
