measure: |
  **How it was measured.** A scratch copy of each kernel (never the branch) counted, in
  [[acquire]], the failed `amoswap` attempts ("spins") before each acquisition succeeded, in
  per-hart tables keyed by the lock's name (per-hart, so that the counter itself adds no
  lock), and printed and reset them on Ctrl-P. Three boots per kernel, 3 harts each; between
  Ctrl-Ps: `kchurn` (the churn phase of `kalloctest` on its own: 3 processes × 2,000 rounds
  × 64 pages), then `kalloctest`, then `usertests -q`. "Remote" means an acquisition of
  another hart's list; "contended" means at least one failed `amoswap`. Ranges are over the
  three boots.

  | workload | kernel | kmem acquisitions | contended | spins | remote |
  |---|---|---|---|---|---|
  | `kchurn` | original (one `kmem`) | 768,134 | **43,429-49,770** | 617,603-683,545 | — |
  | `kchurn` | per-CPU, `STEAL` 64 | 768,159-768,163 | **2-5** | 2,211-15,351 | 20-25 |
  | `kalloctest` | original | 1,028,002 | 42,574-51,664 | 661,559-718,654 | — |
  | `kalloctest` | per-CPU | 1,032,020-1,036,044 | 243-249 | 154,412-195,470 | 3,220-6,423 |
  | `usertests -q` | original | 1,003,854 | 30-33 | 455-488 | — |
  | `usertests -q` | per-CPU | 1,014,352-1,018,373 | 0 | 0 | 8,367-11,819 |

  - **The point of the lab**: under concurrent allocation (`kchurn`), contention on the
    allocator drops by four orders of magnitude, from about one acquisition in sixteen to a
    handful in 768,000. The few that remain are steals.
  - **Where per-CPU lists still contend**: `kalloctest`'s `exhaust` phase, where all three
    lists run dry together and every hart steals. Fewer collisions than the original (about
    245 against about 47,000) but more spins per collision (about 640-790 on average, against
    about 14 in the original). Our inference is that a stealer holds the victim's lock for a
    walk of up to 64 nodes; the data does not separate that from host scheduling, since the
    largest single waits are QEMU vCPU threads descheduled by the host (the original's
    few-instruction section once reached 3,034 spins, and the reference's `kchurn` 11,827).
  - **`usertests -q`** runs one test at a time, so even the original lock is rarely contended
    (about 30 times in a million). The per-CPU version removes even those, at the price of
    about 1% remote acquisitions.
  - One-page stealing (clinic 3) has 3-10 times more contended acquisitions than the
    reference (870-1,418 against 243-249 in `kalloctest`, 14-50 against 2-5 in `kchurn`)
    but far fewer spins, and 1.6-1.8 million acquisitions in `usertests -q`, 38-44% of them
    remote.

  **Where the memory went** (Ctrl-P on the branch): after boot `kmem0 32483 kmem1 62 kmem2
  0`; after one `kalloctest` `kmem0 0 kmem1 0 kmem2 32545`; after `usertests -q` in one boot
  of the measurement copy `kmem0 19980 kmem2 12560`. Free memory sits wherever it was last freed.

  **Time, with a warning.** On QEMU the per-CPU allocator is not measurably faster: the
  churn phase took 15-22 ticks (1.5-2.2 s) on both kernels (one run of the original took 35). QEMU emulates the harts on host
  threads but does not model what makes contention expensive on real hardware (moving a
  lock's cache line between cores), and a spinning hart costs only host CPU time. The tick
  counts also depend on things that have nothing to do with the allocator: in one
  instrumented build, `memset`'s three-instruction loop happened to straddle a page boundary
  (`0x80000ffa`-`0x80001000`), and every `kalloctest` churn took 307-389 ticks in that build,
  about twenty times longer, although its allocator code was correct and uncontended. A
  control rebuilt that tree twice and ran both at the same time: unchanged, 376,
  377 and 406 ticks; with only `memset` moved off the page boundary
  (`__attribute__((aligned(32)))` on `memset`), 35, 39 and 42 ticks. Why a page-straddling
  loop is so slow is our inference, not something we measured: QEMU translates guest code
  in blocks, and a loop split across two guest pages appears to take a slower path from
  block to block on every iteration. The measurements above use `-falign-functions=64` for
  all kernels. Plain builds of the same commits gave anywhere from 15 to 45 ticks depending
  on what else the computer was doing (your times will differ), which is one more reason to trust counts over ticks. Count events (acquisitions, spins) to judge a locking change on QEMU; time it
  on real hardware.
further: |
  - **Rebalancing.** Give pages back: when a list holds far more than its share, a `kfree`
    could push the page to the poorest list instead. Measure whether the remote traffic of
    `usertests` goes down, and what the extra decision costs on every free.
  - **Avoid false sharing.** `struct kmem` is 48 bytes, so neighbouring CPUs' entries share
    64-byte cache lines. In this build `kmem` is at `0x8000f990`, so `kmem[1]`'s line
    (`0x8000f9c0`-`0x8000f9ff`) also holds the first 16 bytes of `kmem[2]`, including its
    lock word: hart 2 acquiring its own lock disturbs the line hart 1 needs for its own. Pad each entry to a cache line (`__attribute__((aligned(64)))`) and explain why
    this matters on real hardware and not at all on QEMU.
  - **A lock-free fast path.** Each CPU's own pops and pushes happen with interrupts off; only
    stealing needs the lock. Design a scheme where the owner's fast path takes no lock (for
    example, stealers request pages and the owner hands them over), and argue it correct on
    three harts. It teaches exactly what clinic 1 could not show: what a stale CPU number
    does when there is no lock to save you.
  - **Per-CPU everything.** Apply the same idea to `bcache` (lab 19 hashes it instead) or to
    the process table scan in [[scheduler]], and compare which data really is per-CPU.
  - **Steal half, with counts.** Use `nfree` to steal half of the richest list, and measure the
    walk length against the number of steals.
