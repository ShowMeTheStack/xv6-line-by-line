      Commit 4 moves the scan of other lists into `steal` and makes it take up to `STEAL` (64)
      pages. Under the victim's lock only: walk at most 63 `next` pointers to find the last
      page of the batch, and make the page after it the victim's new head. That is one lock
      round trip and a walk of at most 64 nodes, whatever the length of the victim's list.

      The recorded moment: you typed `kalloctest` at the shell; the shell's child (pid 4,
      still running `sh`'s code before its `exec`) grows its heap with `sbrk` on hart 1.
      `kmem1` is empty, so [[kalloc]] calls `steal(1)`, which finds `kmem2` to `kmem7` empty
      and cuts 64 pages off `kmem0` (`i` = 7). gdb: `kmem0` held, noff 2 ([[kalloc]]'s
      [[push_off]] and `kmem0`), intena 1 (a system call).

      The scan order `(id + i) % NCPU` gives each hart a different first victim: hart 0 looks
      at `kmem1` first, hart 1 at `kmem2`, hart 2 at `kmem3`. With 3 harts and `NCPU` 8, harts
      1 and 2 pass several lists that are always empty before they reach `kmem0`; that costs
      a few lock round trips per steal, once per 64 pages.
    others: |
      While hart 1 walks, hart 0 may want `kmem0` for its own allocation. It spins for at most
      64 pointer loads. This is the one place the reference holds a lock longer than before,
      and, we infer, part of why the reference's `kalloctest` shows a few hundred contended acquisitions,
      mostly in `exhaust` where all three harts steal at once (measure section).
  - title: "steal: keep one page, give the rest to your own list"
    commit: 4
    file: kernel/kalloc.c
    lines: 84-118
    focus: 105-115
    state:
      hart: 1
      mode: S
      proc: sh (pid 4)
      intr: "off"
      satp: kernel
      locks: [kmem1]
      irq: {noff: 2, intena: 1, note: "kmem1 plus kalloc's own push_off"}
      stack: [usertrap, syscall, sys_sbrk, growproc, uvmalloc, kalloc, steal]
      sp: {"on": kernel}
    note: |
      The victim's lock is released on line 105 **before** this CPU's own lock is taken on
      line 110. That ordering is the whole deadlock argument: no hart ever waits for a kmem
      lock while holding another, so no cycle of waiting harts can form. (Clinic 2 takes the
      own lock first and deadlocks on the second `kalloctest`.)

      Then the batch is spliced in front of the own list: `last->next` points at the old head,
      and the head becomes `first->next`. The first page is kept for the caller; the other 63
      are now on `kmem1`, and the next 63 allocations on hart 1 are local.

      Between line 105 and line 110 the batch is on *no* list: it is reachable only from
      `first` and `last`. Interrupts are off, so the window is a few instructions; but another
      hart that scans all lists in that window will not see these 63 pages (question 8). With
      the opposite rule (take two locks in CPU order) the batch would never be in transit, at
      the price of more complicated code.
