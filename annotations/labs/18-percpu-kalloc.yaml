      The same [[kfree]], called from a much deeper place. The shell (pid 2) has waited for
      `echo hi` (pid 3) and found it a `ZOMBIE`. [[kwait]] holds `wait_lock` and the child's
      `p->lock` ([[kernel/proc.c:376]], [[kernel/proc.c:384]]) and calls [[freeproc]]
      ([[kernel/proc.c:398]]), which frees the trapframe and every page of the child's address
