      gdb recorded noff 4 here, on hart 2: `wait_lock` (1), echo's `p->lock` (2), [[kfree]]'s
      [[push_off]] (3), `kmem2` (4). intena is 1, recorded by the outermost level, the
      `acquire(&wait_lock)` in a system call; the inner levels leave it alone. When [[kfree]]
      returns, its [[pop_off]] brings noff back to 2, and interrupts stay off because noff is
      not 0.

      In the original kernel this path is the deepest one measured, at noff 3
      ([[concept:locks#nesting]]). The new [[push_off]] adds a level to every path through
      the allocator. That is harmless (noff is an `int`, and [[sched]] only cares that it is
      exactly 1 at a switch), but it is the kind of change to a kernel-wide property that is
      worth noticing: here it is also why [[pop_off]] and not `intr_on` is the only correct
      way out.
    others: |
      The pages of `echo` go onto `kmem2` because the *shell* happens to run on hart 2, even if
      `echo` allocated them on hart 0. Pages follow the freeing hart, not the allocating one;
      the last reveal step and question 8 come back to what that does to the distribution of
      memory.
  - title: kalloc tries its own list, then the others, one lock at a time
    commit: 3
    file: kernel/kalloc.c
    lines: 82-108
    focus: 88-103
    diff: true
    state:
      hart: 1
      mode: S
      proc: "pid 1 (the first process, before exec names it init)"
      intr: "off"
      satp: kernel
      locks: [kmem0]
      irq: {noff: 2, intena: 0, note: "kmem0 plus kalloc's own push_off"}
      stack: [forkret, kexec, proc_pagetable, uvmcreate, kalloc]
      sp: {"on": kernel, detail: "pid 1's kernel stack, `0x3fffffd000`-`0x3fffffe000`"}
    note: |
      [[kalloc]] scans the lists starting with its own (`i` = 0) and takes one page from the
      first list that has one. Each list is locked, examined and unlocked before the next is
      locked: no hart ever holds two kmem locks, so two harts scanning each other's lists
      cannot deadlock (question 5).

      The first allocation on hart 1 in a recorded boot shows why the scan is needed at all.
      The first process (pid 1) was picked by hart 1's scheduler and in [[forkret]] calls
      [[kexec]] for `/init`, which needs a page table. `kmem1` is empty: every free page is on
      `kmem0`, where [[kinit]] put them. Hart 1 scans `kmem2` to `kmem7` (all empty) and
      takes its page from `kmem0` at `i` = 7. (Recorded on the finished branch, where the
      same scan happens in `steal`; gdb showed `kmem0` held, noff 2, intena 0.)

      intena is 0 because [[forkret]] runs with interrupts off: it releases the `p->lock` the
      scheduler acquired with interrupts off ([[kernel/proc.c:520]]), and nothing has turned
      them on since. So this [[kalloc]]'s [[pop_off]] will leave them off.

      This commit is complete and correct, and it passes `usertests -q`. It is also slow in a
      way the next commit fixes: a CPU with an empty list stays empty, and pays a scan of
      several locks for *every* page (clinic 3 measures it).
    others: |
      Hart 0 may be allocating from `kmem0` at the same moment, for example in [[kfork]]. It
      takes `kmem0`'s lock for its own list; hart 1 takes the same lock for a remote one. The
      two serialize on `kmem0` for a few instructions, which is the cross-hart contention the
      next commit makes rare.
