      order (never hold two kmem locks), and breaking it passed one full `kalloctest` before
      it deadlocked. The rule that the CPU number must not go stale cost nothing visible when
      broken, thanks to the per-list locks; it is kept because without those locks it would be
      a race rare enough that no test would catch it.
