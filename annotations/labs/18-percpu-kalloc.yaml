      Thread 1 (Thread 1.1 (CPU#0 [running])):
      #0  acquire (lk=lk@entry=0x8000f9f0 <kmem+96>) at kernel/spinlock.c:37
      #1  0x0000000080000c3a in steal (id=<optimized out>) at kernel/kalloc.c:98
      #2  kalloc () at kernel/kalloc.c:134
      #3  0x00000000800014fc in uvmalloc (pagetable=0x80cf8000, oldsz=43352064, newsz=43356160, xperm=xperm@entry=4) at kernel/vm.c:228
      #4  0x0000000080001e4c in growproc (n=4096) at kernel/proc.c:246
      #5  0x0000000080002bfc in sys_sbrk () at kernel/sysproc.c:51
      #6  0x0000000080002b02 in syscall () at kernel/syscall.c:146
      #7  0x0000000080002888 in usertrap () at kernel/trap.c:68
      #8  0x0000003ffffff09c in ?? ()
      kmem[0] kmem0 locked=1 held by hart 0 nfree=0 freelist=0x0
      kmem[1] kmem1 locked=0 held by - nfree=0 freelist=0x0
      kmem[2] kmem2 locked=1 held by hart 2 nfree=0 freelist=0x0
      kmem[3] kmem3 locked=0 held by - nfree=0 freelist=0x0
      [...]
      cpus[0]: noff 3 intena 1 proc kalloctest pid 16
      cpus[1]: noff 0 intena 0 proc none
      cpus[2]: noff 3 intena 1 proc kalloctest pid 14
      slot  0 pid   1 SLEEPING init
      slot  1 pid   2 SLEEPING sh
      slot  2 pid  10 SLEEPING kalloctest
      slot  3 pid  14 RUNNING  kalloctest
      slot  4 pid  15 SLEEPING kalloctest
      slot  5 pid  16 RUNNING  kalloctest
    why: |
      The first `kalloctest` passed, including `exhaust`; the second hung in `exhaust`, the
      phase where all three harts run out of pages at the same moment. gdb shows the cycle
      directly. In this build `struct kmem` is 48 bytes and `kmem` is at `0x8000f990`, so
      `kmem+96` is `kmem[2]`:

      - hart 0 (pid 16) holds `kmem0` (its own, empty) and spins in [[acquire]] for `kmem2`.
        Its scan order is `kmem1` (empty, taken and released), then `kmem2`.
      - hart 2 (pid 14) holds `kmem2` (its own, empty) and spins for `kmem0`. Its scan order
        is `kmem3` to `kmem7` (empty), then `kmem0`.

      Each holds what the other wants. Both have noff 3 (kalloc's [[push_off]], the own lock,
      and the spinning acquire's [[push_off]]), so both have interrupts off: no timer
      interrupt, no yield, forever. Every list is empty anyway; they deadlock while fighting
      over nothing.

      Hart 1 is not stuck: it sits in its idle [[scheduler]] loop (`intr_on` at
      [[kernel/proc.c:441]] is where gdb caught it). The third child, pid 15, is `SLEEPING`:
      for an `exhaust` child that means it already ran out of memory, wrote its byte to the
      parent and is waiting in `read` for the parent's go. The parent (pid 10) sleeps waiting
      for the other two, which never come. And the clock stops: only hart 0 advances `ticks`
      ([[kernel/trap.c:170]] runs on `cpuid() == 0` only), and hart 0 no longer takes
      interrupts.

      Another run of the same broken kernel hung on the *first* `kalloctest`, with
      all three harts caught: hart 1 holding `kmem1` and spinning on `kmem2`, hart 2 holding
      `kmem2` and spinning on `kmem1`, and hart 0, holding `kmem0`, queued behind them
      spinning on `kmem1`. All three had noff 3 and intena 1, and `ticks` was frozen.

      Why did the first run pass? The two harts must each have taken their own lock and found
      their own list empty before the other released, which needs both lists to run dry within
      a few instructions of each other. Most of the time one hart wins and the other's next
      steal finds pages; it took two runs here (one in the other run). A design whose correctness depends on that kind
      of luck is wrong, and the fix is the rule from question 5: release your own lock before
      you take anyone else's.
  - bug: Stealing one page at a time
    change: |
      The batch size is 1, so every allocation by a CPU with an empty list is a remote steal:

      ```diff
      -#define STEAL 64 // most pages taken from another CPU's list at once
      +#define STEAL 1  // most pages taken from another CPU's list at once
      ```

      (Commit 3 of the reference behaves like this too, before commit 4 adds batches; its own
      scan differs slightly, and its measured numbers are not the ones below.)
      Measured with the contention counter of the measure section, three boots, each running
      `kchurn` (the churn phase of `kalloctest` alone), `kalloctest` and `usertests -q`.
    symptom: |
      # STEAL 1, boot 1: the contention counter's Ctrl-P after usertests -q (trimmed)
      LS kmem0 acq 530711 contended 0 spins 0 maxspins 0
      LS kmem1 acq 372287 contended 0 spins 0 maxspins 0
      LS kmem2 acq 313524 contended 0 spins 0 maxspins 0
      LS kmem3 acq 82048 contended 0 spins 0 maxspins 0
      [...]
      LS kmem7 acq 82048 contended 0 spins 0 maxspins 0
      LSH hart 2 kmem2 acq 264176 contended 0 spins 0
      LSH hart 2 kmem3 acq 74173 contended 0 spins 0
      [...]
      LSH hart 2 kmem0 acq 74173 contended 0 spins 0
      LSH hart 2 kmem1 acq 44189 contended 0 spins 0

      # summary of all such dumps: kmem* acquisitions per workload, all eight lists added up
      # (3 boots each)
      #                    total acquisitions      of another CPU's list   contended
      # STEAL 1
      kchurn               769,456 - 770,396       1,322 - 2,262           14 - 50
      kalloctest           1,216,305 - 1,375,459   188,311 - 347,465       870 - 1,418
      usertests -q         1,626,762 - 1,783,300   622,936 - 779,474       0
      # STEAL 64 (the reference)
      kchurn               768,159 - 768,163       20 - 25                 2 - 5
      kalloctest           1,032,020 - 1,036,044   3,220 - 6,423           243 - 249
      usertests -q         1,014,352 - 1,018,373   8,367 - 11,819          0

      # every test passed in all six boots
    why: |
      Correct, and wasteful. With one-page stealing a CPU whose list is empty stays empty:
      every page it allocates is taken from another CPU's list, through a scan that locks
      every empty list on the way. `usertests` shows it most: it counts free pages at the
      start and the end by allocating *all* of memory in one process (`countfree`), and when
      that process runs on a hart whose list is empty, every one of the ~32,000 pages costs a
      scan of up to seven locks. `usertests -q` makes 60-75% more kmem acquisitions, and 38-44%
      of all of them are of other CPUs' locks, against about 1% with batches.

      The per-hart lines show the scan itself: during `usertests -q`, hart 2 locked each of
      `kmem3` to `kmem7`, lists no hart ever owns, 74,173 times, every time on its way to
      `kmem0`, and `kmem0` itself 74,173 times: one scan per page it tried to steal.

      Contention is not the problem here (one-page steals hold the victim's lock for a few
      instructions, so they rarely collide); traffic is. On QEMU the extra acquisitions cost
      little time, because QEMU does not model the cost of moving a cache line between cores.
      On real hardware every acquisition of another CPU's lock moves that lock's cache line,
      and the lock's whole point (keep each CPU on its own cache lines) is lost exactly for the
      CPUs that are short of memory.

      Note what batches cost in return. In `kalloctest`, the reference has fewer contended
      acquisitions than the one-page version (243-249 against 870-1,418 in the same
      measurement) but more spins (154,412-195,470 against 19,240-31,107), about 640-790 spins
      per contended acquisition. A plausible reading (our inference, not separated by the data)
      is that a stealer holds the victim's lock for a walk of up to 64 nodes. But spin counts
      on QEMU also include a vCPU's host thread being descheduled while it holds a lock: the
      original kernel's few-instruction critical section reached 3,034 spins in one run.
      That is the trade question 6 asks about, and why it should be timed on real hardware.
  - bug: Only the first lock is initialized
    change: |
      [[kinit]] keeps its original shape and initializes only list 0:

      ```diff
      -  for (int i = 0; i < NCPU; i++) {
      -    safestrcpy(kmem[i].name, "kmem0", sizeof(kmem[i].name));
      -    kmem[i].name[4] += i;
      -    initlock(&kmem[i].lock, kmem[i].name);
      -  }
      +  safestrcpy(kmem[0].name, "kmem0", sizeof(kmem[0].name));
      +  initlock(&kmem[0].lock, kmem[0].name);
      ```
    symptom: |
      # the branch with this change: kalloctest, Ctrl-P, usertests -q, kalloctest, Ctrl-P
      [...]
      kalloctest: ALL OK
      [...]
      free pages: kmem0 32545  0  0  0  0  0  0  0
      [...]
      ALL TESTS PASSED
      [...]
      kalloctest: ALL OK
      [...]
      free pages: kmem0 32545  0  0  0  0  0  0  0

      # gdb, breakpoint on userinit (after kinit):
      $1 = {locked = 0, name = 0x8000f9b4 <kmem+36> "kmem0", cpu = 0x0}
      $2 = {locked = 0, name = 0x0, cpu = 0x0}
      $3 = "\000\000\000\000\000\000\000"
      $4 = {lock = {locked = 0, name = 0x0, cpu = 0x0}, freelist = 0x0, nfree = 0, name = "\000\000\000\000\000\000\000"}

      # the same change with the contention counter, after one kalloctest (Ctrl-P, trimmed):
      LS kmem0 acq 362563 contended 172 spins 136346 maxspins 2527
      LS time acq 49904 contended 0 spins 0 maxspins 0
      LS cons acq 97500 contended 2 spins 2790 maxspins 1972
      LS pipe acq 558091 contended 88 spins 36378 maxspins 1479
      # (the reference over a kalloctest interval: time 65, cons 24, pipe 18 acquisitions)
    why: |
      The locks work anyway. `kmem` is a global array in `.bss`, which xv6 never clears
      itself: it relies on QEMU's loader, which fills the part of the kernel's segment beyond
      the file's contents with zeros, on memory that starts out zero. A zeroed spinlock is
      `locked = 0, cpu = 0`: an unlocked lock. [[acquire]], [[release]] and [[holding]] never
      read the name. So every test passes, and gdb shows the only difference: `name = 0x0`
      for locks 1 to 7, and the Ctrl-P line prints empty names (`kmem0 32545  0  0 ...`).

      Two things make this a real bug anyway. First, the program works only because the
      lock lives in zero-filled memory and is never reused: the same struct allocated with
      [[kalloc]] (which fills pages with junk bytes, `5`) or reset after use would start out
      `locked` = `0x05050505`, and the first [[acquire]] would spin forever.

      Second, everything that relies on the name breaks, quietly. The contention counter keys
      its per-hart tables by `lk->name` and treats a null name as "empty slot". The
      acquisitions of `kmem1` and `kmem2` went into such a slot, which the next new lock name
      on that hart then took over, counts and all: after one `kalloctest`, the report credits
      `pipe` with 558,091 acquisitions, `cons` with 97,500 and `time` (`tickslock`) with 49,904
      (the reference over a `kalloctest` interval: 18, 24 and 65), and `kmem1` and `kmem2` do
      not appear at all. A measurement that
      silently gives the wrong lock the credit is worse than no measurement; and lock names
      exist exactly for this kind of tool (the lab names the locks distinctly *so that*
      contention can be measured per list).
reveal:
  - title: "The test: three harts allocating at once"
    commit: 1
    file: user/kalloctest.c
    lines: 38-79
    focus: 40-55
    diff: true
    state:
      hart: any
      mode: U
      proc: kalloctest (one of three children)
      intr: "on"
      satp: user
      locks: []
      stack: [main, churntest, churn]
      sp: {"on": user}
    note: |
      The first commit adds the test, and it passes on the unmodified kernel: this lab
      changes speed, not behaviour.

      `churn` is the workload. Each of three children (one per hart, though the scheduler
      decides where each actually runs) grows by 64 pages with `sbrk`, writes a value into
      every page, checks them all, and shrinks again, 2,000 times. Each round costs the
      kernel 64 [[kalloc]] calls in [[uvmalloc]] and 64 [[kfree]] calls in [[uvmunmap]]:
      768,000 allocator calls in all, from three harts at once, for pages no two processes
      ever share.

      `sbrk` here is the eager kind ([[user:sbrk]] passes `SBRK_EAGER`), so the pages are
      allocated inside the system call, with interrupts on before the allocator's own locks
      turn them off. The writes check that each page really belongs to this process: a page
      handed out twice would show another process's value.

      `churntest` prints the tick count as information. It is not a check: on QEMU it says
      more about the emulator than about the allocator (see the measure section).
  - title: What a single process must still be able to do
    commit: 1
    file: user/kalloctest.c
    lines: 81-152
    focus: 125-147
    state:
      hart: any
      mode: U
      proc: kalloctest (the parent)
      intr: "on"
      satp: user
      locks: []
      stack: [main]
      sp: {"on": user}
    note: |
      The other three checks are about properties that per-CPU lists could break.

      - **gather** (line 135): after `churn`, the freed pages are wherever the three children
        freed them. `countfree` allocates page after page in one process until `sbrk`
        fails; it must get exactly as many pages as at the start. An allocator that looks
        only at its own CPU's list would stop early.
      - **exhaust** (lines 84-123): three children allocate one page at a time until `sbrk`
        fails, *at the same time*, and hold on to their pages (they block in `read` on the
        `go` pipe) until all three have failed. Between them they must get nearly all of
        memory: each child's own page tables, about one page per 512 heap pages, come out of
        the same pool, which is why the check allows 256 pages of slack. In practice they got
        32,378 of 32,472. This phase is where all three harts' lists run dry together, and
        where clinic 2's deadlock appeared.
      - **no leaks**: free pages at the end equal free pages at the start.

      Everything the test checks is visible from user space. Which list a page is on, and how
      often a lock was contended, are not; for those you use Ctrl-P (commit 5) and a
      contention counter.
  - title: One list and one named lock per CPU
    commit: 2
    file: kernel/kalloc.c
    lines: 17-48
    focus: 21-39
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: []
      irq: 0
      stack: [main, kinit]
      sp:
        "on": boot
        detail: "hart 0's slice of `stack0`; paging is still off"
    note: |
      The data structure first, with no change in behaviour: `kmem` becomes an array of
      `NCPU` (8) structures, each a lock and a list head. In this commit [[kalloc]] and
      [[kfree]] still use `kmem[0]` only (lines 67-71 and 82-86), so the system behaves exactly
      as before.

      Each lock gets its own name, and the name is stored *in the struct* (`name[8]`).
      [[initlock]] keeps only a pointer to the name ([[kernel/spinlock.c:14]]); a name built in
      a local array would be gone when [[kinit]] returns. `"kmem0"` is copied and its digit
      bumped by `i`, giving `kmem0` to `kmem7`. Nothing in the lock code reads the name; it
      exists for people and tools, here the contention counter that tells `kmem0` from
      `kmem1`. (Clinic 4 forgets this loop.)

      [[kinit]] runs on hart 0 only ([[kernel/main.c:19]]), with interrupts off and paging
      off, before harts 1 and 2 leave their wait on `started`: the locks are initialized
      before anyone can use them, and no lock is needed to do it.
    others: |
      Harts 1 and 2 are spinning in [[main]] on `started` ([[kernel/main.c:35]]), which hart 0
      sets only after [[userinit]]. Nobody else can touch the allocator yet.
  - title: kfree puts the page on this CPU's list
    commit: 3
    file: kernel/kalloc.c
    lines: 52-80
    focus: 70-79
    diff: true
    state:
      hart: 2
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: [kmem2]
      irq: {noff: 2, intena: 1, note: "kmem2 plus kfree's own push_off"}
      stack: [usertrap, syscall, sys_exec, kexec, proc_freepagetable, uvmfree, uvmunmap, kfree]
      sp: {"on": kernel, detail: "pid 2's kernel stack, `0x3fffffb000`-`0x3fffffc000`"}
    note: |
      Now the lists become per-CPU. [[kfree]] reads the CPU number and pushes the page on that
      CPU's list, under that list's lock.

      The recorded moment (gdb on the finished branch, whose [[kfree]] is this one plus a
      counter): the shell, pid 2, has just finished `exec("sh")` on hart 2 and [[kexec]] is
      freeing the old image's pages. Each goes on `kmem2`. noff is 2: [[kfree]]'s own
      [[push_off]] and the list lock. intena is 1: this is a system call, interrupts were on
      when the outer [[push_off]] ran, and the final [[pop_off]] will turn them back on.

      The [[push_off]] on line 73 comes *before* `cpuid()` and the [[pop_off]] on line 79
      after the release. Between them no timer interrupt can be taken on this hart, so the
      thread cannot be moved, and `id` names the hart it is running on for as long as it is
      used. The [[acquire]] on line 75 would turn interrupts off as well, but too late: `id`
      was read, and the lock chosen, before it.
    others: |
      Hart 0 and hart 1 can free and allocate at the same moment on `kmem0` and `kmem1`
      without touching `kmem2`'s lock at all. The only way another hart reaches `kmem2` is by
      taking pages from it (line 95's loop, in [[kalloc]]), and then it takes `kmem2`'s lock
      like everyone else.
  - title: Why cpuid() needs interrupts off
    commit: 3
    file: kernel/proc.c
    lines: 58-90
    focus: 61-69
    state:
      hart: 2
      mode: S
      proc: sh (pid 2)
      intr: "off"
      satp: kernel
      locks: []
      irq: {noff: 1, intena: 1, note: "the level is kfree's own push_off, taken just before cpuid()"}
      stack: [usertrap, syscall, sys_exec, kexec, proc_freepagetable, uvmfree, uvmunmap, kfree, cpuid]
      sp: {"on": kernel}
    note: |
      [[cpuid]] does one real thing, `mv a0, tp`: read `tp`. [[start]] put the hart's `mhartid` there
      ([[kernel/start.c:47]]-[[kernel/start.c:48]]), [[uservec]] reloads it from the trapframe
      on every entry from user space ([[kernel/trampoline.S:79]]), and the kernel never
      changes it. So `tp` is always the number of the hart executing the read.

      The comment on lines 61-63 is the rule this lab lives by. A thread can move to another
      hart only by giving up the CPU: [[sleep]], or a timer interrupt that makes
      [[kerneltrap]] call [[yield]] ([[kernel/trap.c:157]]). [[swtch]] does not save `tp`; it
      belongs to the hart, which is why [[kernelvec]] deliberately does not restore it
      ([[kernel/kernelvec.S:44]]: "in case we moved CPUs"). A thread resumed on hart 1 reads
      `tp` = 1 from then on, but any `id` it read on hart 2 still says 2.

      The allocator never sleeps, so turning interrupts off is enough. [[mycpu]] has the same
      requirement (line 72) and [[myproc]] shows the pattern in miniature: [[push_off]],
      read, [[pop_off]] (lines 85-88).
    others: |
      What the bracket prevents, on three harts:

      | time | hart 2 | hart 1 |
      |---|---|---|
      | 1 | `id = cpuid()` → 2 | running something else |
      | 2 | timer interrupt → [[yield]] | |
      | 3 | (sh is RUNNABLE) | [[scheduler]] picks sh |
      | 4 | | `acquire(&kmem[2].lock)` with `id` = 2 |

      With the per-list lock, step 4 is still correct: the page goes on `kmem2` under `kmem2`'s
      lock, merely not on hart 1's own list (clinic 1 measured how often this happens without
      the bracket: almost never). Without a per-list lock it would be a race on `kmem2`.
