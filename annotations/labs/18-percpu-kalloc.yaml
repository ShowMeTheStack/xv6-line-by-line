      section): during three processes churning memory on three harts, contended acquisitions
      of the allocator's locks fell from 43,429-49,770 to 2-5 out of about 768,000, and the
      spins from 617,603-683,545 to 2,211-15,351. What it cost: a [[push_off]] level on every
      allocator call (noff 4 in [[kwait]]), a scan of eight locks for every failed allocation,
      a short window in which a stolen batch is on no list, and memory that piles up on the
      hart that freed it.

