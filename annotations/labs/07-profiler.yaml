      try to take it again in the handler. Nothing that runs in interrupt context is
      acquired while holding it, so it cannot deadlock. It is not a leaf lock, though:
      `profget` holds it across a `copyout`, which may call [[kalloc]] (and `kmem.lock`)
      for a lazily allocated destination page. (`tickslock` is not a leaf either:
      `clockintr` calls `wakeup` under it.)

