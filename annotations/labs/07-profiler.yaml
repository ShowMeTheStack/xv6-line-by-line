      and `p->trapframe->epc` both `0x112`, `sstatus` `0x200000020` (SIE 0, SPIE 1, SPP 0),
      `noff` 0. `0x112` is the `mulw` at the top of `hot()`'s inner loop: the instruction
      that had not run yet when the interrupt arrived. (A loop head is a typical place for
      a sample under QEMU, which takes interrupts between blocks of translated code.)

      Why here: the branch runs exactly once per timer interrupt that found *some* process in
      user mode, on every hart, and `p` is that process. Why `trapframe->epc` and not
      `r_sepc()`: the saved copy belongs to the process; the register belongs to the hart,
      and after `yield()` it holds someone else's pc (clinic 2). Why before `yield()`: after
      it, the process may have been switched out for a long time, and the moment being
      sampled is now.

