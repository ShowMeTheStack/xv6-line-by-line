    note: |
      `proftest` calls `profile(0, 4096, 3)`: its own first page of text, 8-byte buckets,
      512 of them. `sys_profile` checks the arguments first: a non-empty range, a shift
      between 0 and 31 (user code computes the bucket size as `1 << shift`, an `int`), and at most
      `PROFBUCKETS` buckets. `(hi - lo - 1) >> shift` is the index of the last byte's bucket,
      so the test is exact even when the range is not a multiple of the bucket size.

      The page comes from [[kalloc]] (which takes and releases `kmem.lock`: `noff` 1 for a
      moment, back to 0), is zeroed, and gets its header. Then the old histogram, if any, is
      freed and the new one installed. `profile(0, 0, 0)` takes the same path with `pr = 0`:
      stop and free.

      No lock anywhere. At this commit only the process itself ever touches `p->prof`, and it
      is here, in a system call, so nothing else can be using the page being freed.
