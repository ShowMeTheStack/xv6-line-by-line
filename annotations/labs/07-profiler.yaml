      them spins in `acquire(&kproflock)` for the few instructions of `profsample`. At ten
      ticks a second per hart, contention is rare and short. Every kernel tick takes the
      lock even when no kernel profile exists, which costs an atomic swap and a fence per
      tick; checking `kprof` before locking would avoid that at the price of a racy read.
  - title: One kernel profile at a time
    commit: 8
    file: kernel/prof.c
    lines: 70-114
    focus: 102-110
    state:
      hart: 0
      mode: S
      proc: prof's child
      intr: "off"
      satp: kernel
      locks: [kproflock]
      stack: [usertrap, syscall, sys_profile]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      `sys_profile` now has two kinds of histogram. The old one is unhooked (`profdetach`)
      before it is freed. A new kernel histogram is published in `kprof` under the lock, and
      only if no other process owns one; the loser frees its page and gets -1 (`proftest`
      checks this with a forked child). A user histogram is installed exactly as before.

      The page still belongs to the process (`p->prof`), so the lifetime rules stay the same:
      `profget` copies it (now under `kproflock`, so the copy is a consistent snapshot while
      other harts add to it), [[kexit]] writes it (after `profdetach`), and [[freeproc]]
      frees it.

      State: inside the critical section (lines 102 to 110) during a system call, so `noff`
      1 and `intena` 1; interrupts come back on at the `release`. Reasoned from the code.
  - title: usertrap leaves a kernel profile alone
    commit: 8
    file: kernel/trap.c
    lines: 82-95
    focus: 85-92
    state:
      hart: 0
      mode: S
      proc: usertests
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: kernel
      irq: 0
    note: |
      One condition is added to the user sample: `p->prof->lo < KERNBASE`. Without it, the
      process that owns the kernel profile would add its own user pcs to the kernel
      histogram, without `kproflock`, at the same time as other harts' locked increments: a
      data race on `nsample`, and user addresses counted as "outside" in a kernel profile.

      With it, the two paths split cleanly: a user histogram is written only here, by its
      own process, without a lock; the kernel histogram only in [[kerneltrap]], by any hart,
      under the lock.
  - title: Where the critical sections went
    commit: 8
    file: kernel/spinlock.c
    lines: 88-116
    focus: 114-115
    state:
      hart: 1
      mode: S
      proc: usertests
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_sbrk, growproc, uvmalloc, kalloc, release, pop_off]
      sp: kernel
      irq: {noff: 0, note: "line 113 has just brought noff from 1 to 0; line 115 turns interrupts back on"}
    note: |
      The measurement that makes this lab worth doing: `prof -k 0x80000a26 0x80000ca8
      usertests -q` profiled, at 2-byte resolution, the 642 bytes holding [[kfree]],
      [[kalloc]], [[initlock]], [[holding]], [[push_off]], [[acquire]], [[pop_off]] and
      [[release]] for the whole of `usertests`. These functions run hundreds of thousands of
      times. Result: 242 samples, 240 of them on a single instruction, `0x80000c50`. That
      is the instruction after `csrsi sstatus,2`, which is line 115's `intr_on()` in this
      build. The other two were on the first instructions of `kalloc` and `push_off`, before
      interrupts go off. Not one sample landed between a `push_off` and its `pop_off`.

      The reason is the invariant from [[concept:locks#invariant]]: while `noff > 0`, SIE is
      0, so a timer interrupt that arrives in a critical section stays pending, and is taken
      the moment line 115 sets SIE. All the time spent inside critical sections, including
      every spin in `acquire` waiting for another hart, is billed to this one instruction. In
      the whole-kernel profile of `usertests` it was the hottest non-idle bucket: 265 of
      3,467 samples, with the instruction after [[usertrap]]'s `intr_on()` next (65:
      trap-entry time). The idle harts' time piles up at the matching instruction in
      [[scheduler]] (3,110).

      A profiler built on maskable interrupts sees only code that runs with interrupts on.
      On x86, Linux's `perf` delivers its samples as a non-maskable interrupt for exactly
      this reason. On RISC-V, the performance-counter overflow interrupt (Sscofpmf) is
      masked by SIE like any other, so a kernel sampling with it has the same blind spot.
    others: |
      The other two harts are in the same situation: each one's critical sections are
      invisible to its own timer, and each one's deferred ticks land on its own `pop_off`.
      Lock contention between harts (a hart spinning in `acquire`) is the most expensive
      thing this profiler cannot see.
verify: |
  On the branch (`ext/07-profiler`, 8 commits), built with the project toolchain and run on
  three harts (`-smp 3 -m 128M`), in one boot: `proftest` four times, `usertests -q`, then
  `proftest` four more times. All eight `proftest` runs printed `ALL OK`. The first one and
  the one right after `usertests`:

  ```text
  $ proftest
  proftest: arguments, and profile(0, 0, 0) stops: OK
  proftest: hot loop: 30 samples, 30 in range, 30 in hot()
  proftest: most samples in the hot loop: OK
  proftest: fork does not inherit the profile: OK
  proftest: exec keeps the profile: OK
  proftest: prof.out: 20 samples, 20 in range, 20 in hot()
  proftest: exit writes prof.out: OK
  proftest: only one kernel profile at a time: OK
  proftest: kernel: 30 samples, 0 outside [0x80000000, 0x8000FE00)
  proftest: kernel samples, none outside the profiled range: OK
  proftest: free pages 32470 before, 32470 after
  proftest: no leaks: OK
  proftest: ALL OK
  [...]
  $ usertests -q
  usertests starting
  [...]
  ALL TESTS PASSED
  $ proftest
  proftest: arguments, and profile(0, 0, 0) stops: OK
  proftest: hot loop: 30 samples, 30 in range, 30 in hot()
  proftest: most samples in the hot loop: OK
  proftest: fork does not inherit the profile: OK
  proftest: exec keeps the profile: OK
  proftest: prof.out: 20 samples, 20 in range, 19 in hot()
  proftest: exit writes prof.out: OK
  proftest: only one kernel profile at a time: OK
  proftest: kernel: 30 samples, 0 outside [0x80000000, 0x8000FE00)
  proftest: kernel samples, none outside the profiled range: OK
  proftest: free pages 32470 before, 32470 after
  proftest: no leaks: OK
  proftest: ALL OK
  ```

  Over the eight runs the 30-tick hot loop got 30 samples every time, all inside `hot()`,
  and the 20-tick child that leaves `prof.out` got 19 or 20. (A tick-driven count can
  always come out one short: a 10-tick child required to get at least 10 samples was seen
  to get 9, which is why this child spins for 20.) The idle second of
  the kernel gave 30 to 33 samples: three harts, ten ticks each. `usertests -q` passing (its
  `usertrap()` lines, trimmed here, are the expected kills of `kernmem` and friends) shows
  that processes that never profile are unaffected, and the equal free-page counts show
  that profiled processes leave no page behind. `usertests -q` also passed under `prof -k`
  (in both kernel runs of Measure), with the kernel profile active on all three harts
  throughout. In the same build, `/prof /grep .*.*.*z /README` and `/prof -k /echo hi` run
  from a subdirectory found their `.sym` files, which `prof` opens from `/`.

  Every commit builds on its own with `make kernel/kernel fs.img` (only the two existing
  warnings about RWX segments).
measure: |
  **User profiles of real programs.** `b1` is `README` eight times (19,528 bytes), `b2` is
  `b1` eight times (156,224 bytes), both made with `cat` inside xv6.

  ```text
  $ prof grep .*.*.*z b1 > o
  prof: 72 ticks
  prof: grep: 61 samples, 0 outside [0x0, 0xB71), 4-byte buckets
  by function:
    48	78%	matchstar
    13	21%	matchhere
  hottest buckets:
    42	68%	0x24	matchstar+0x24
    3	4%	0x4C	matchhere+0x0
    3	4%	0x50	matchhere+0x4
    3	4%	0x94	matchhere+0x48
  [...]
  ```

  The pattern makes `grep`'s recursive matcher backtrack, and the profile finds the loop:
  the bucket at `matchstar+0x24` holds one instruction, `bnez a0` at `0x26`, the first one
  after `matchstar`'s call to `matchhere` returns, inside its `do ... while`. Two thirds of
  all samples landed there. That concentration is partly QEMU's doing: QEMU executes
  guest code in translated blocks and takes pending interrupts between blocks, so samples
  land on block entry points such as this return address (and `proftest`'s `0x112`, a loop
  head). A test confirms it: with a loop whose body is about a hundred
  instructions with no branch inside, over three runs, 248 of 249 samples landed in the loop-head bucket,
  where an interrupt that could be taken anywhere would have spread them over the body. It
  also shifts time between functions: the time of a block of `matchhere` that ends in `ret`
  is charged to `matchstar`'s return address. On real hardware the samples would spread
  over the instructions actually executing, and the split between `matchstar` and
  `matchhere` could differ (reasoned, not measured). 61 samples in 72 ticks: `grep` was in
  user mode for most of its run.

  ```text
  $ prof wc b2 b2 b2 b2 b2 b2 > o
  prof: 55 ticks
  prof: wc: 1 samples, 0 outside [0x0, 0xA81), 4-byte buckets
  [...]
  $ prof -k wc b2 b2 b2 b2 b2 b2 > o
  prof: 53 ticks
  prof: kernel: 156 samples, 0 outside [0x80000000, 0x80007000), 32-byte buckets
  by function:
    151	96%	scheduler
    4	2%	pop_off
    1	0%	usertrap
  [...]
  ```

  `wc` on 937 KB took 5.5 seconds and got **one** user sample. The kernel profile of the same
  run explains it: 156 of the 159 hart-ticks (3 harts × 53) were kernel samples, and 151 of
  them were idle schedulers. `wc` spends its time asleep, waiting for the disk (the buffer
  cache holds 30 blocks, `b2` is 153). A sampling profiler measures where the CPU goes, and
  an I/O-bound program barely uses one.

  **Statistics.** Six runs of `prof grep .*.*.*z README` (the three that printed a tick count
  took 9 to 12 ticks) gave 7 to 10 samples each; `matchstar`'s share came out as 87%, 100%, 50%, 70%, 71% and 62%. Two runs
  on `b1` (60 and 61 samples) gave 65% and 78%. That is the spread `sqrt(p(1-p)/n)` predicts
  (16 points at n = 8, 6 at n = 60). The hot loop in `proftest` got 28 to 30 samples for 30
  ticks in every run on the branch, including one with three CPU-bound `grep`s competing for
  the three harts.

  **The kernel profile of `usertests -q`**, all of the kernel's text, 32-byte buckets:

  ```text
  $ prof -k usertests -q
  [...]
  ALL TESTS PASSED
  prof: 1173 ticks
  prof: kernel: 3467 samples, 0 outside [0x80000000, 0x80007000), 32-byte buckets
  by function:
    3110	89%	scheduler
    265	7%	pop_off
    65	1%	usertrap
    18	0%	release
    4	0%	walk
  [...]
  hottest buckets:
    3110	89%	0x80001E20	scheduler+0x98
    265	7%	0x80000C40	pop_off+0x18
    65	1%	0x80002680	usertrap+0x92
  [...]
  ```

  The `pop_off+0x18` bucket covers `0x80000c40`–`0x80000c5f`, which contains `0x80000c50`;
  the `usertrap+0x92` bucket contains `0x80002690`, the instruction after `usertrap`'s
  `csrsi sstatus,2`. In 1,173 ticks the three harts took about 3,519 timer
  interrupts (3 × 1,173, assuming one per hart per tick); 3,467 of them found the hart in the kernel, and 3,110 of those in the idle
  scheduler. Under QEMU, `usertests` mostly waits for its disk. Almost all the non-idle
  kernel samples are on three instructions, each the first after interrupts come back on:
  in [[pop_off]] (time spent in critical sections), in [[usertrap]] after `intr_on()` (trap
  entry), and in the scheduler (idle). The `release` bucket at `0x80000ca0` is really
  `memset`'s loop at `0x80000cbc`, which shares the 32-byte bucket.

  **The blind spot at instruction resolution**: the 642 bytes from [[kfree]] to the end of
  [[release]], 2-byte buckets, over another full `usertests -q` run:

  ```text
  $ prof -k 0x80000a26 0x80000ca8 usertests -q
  [...]
  ALL TESTS PASSED
  prof: 1351 ticks
  prof: kernel: 4003 samples, 3761 outside [0x80000A26, 0x80000CA8), 2-byte buckets
  by function:
    240	99%	pop_off
    1	0%	push_off
    1	0%	kalloc
  hottest buckets:
    240	99%	0x80000C50	pop_off+0x28
    1	0%	0x80000B0E	kalloc+0x0
    1	0%	0x80000BAE	push_off+0x0
  ```

  `kalloc`, `kfree`, `acquire` and `release` ran throughout, and no sample landed in any of
  their critical sections, nor in `acquire`'s spin loop: every interrupt that arrived there
  was delivered at `0x80000c50`.
further: |
  - **A profiler that sees critical sections.** Count, in `pop_off`, how many timer
    interrupts were pending when SIE came back on (`sip.STIP`), and attribute them to the
    lock just released (pass its name down from `release`). Teaches the difference between
    when an event happens and when the kernel notices it, and gives a crude lock-hold-time
    profile.
  - **Call stacks, not just pcs.** At each sample, walk the user stack's frame pointers
    (xv6 compiles with `-fno-omit-frame-pointer`) with `copyin` and count call chains.
    Teaches the user stack layout and why the kernel must not trust it.
  - **Profile across fork.** Give children a copy of the settings and merge their counts
    into the parent's histogram when [[kwait]] reaps them, so `prof sh` covers a whole
    pipeline. Teaches which `struct proc` fields a parent may touch, and when.
  - **Faster sampling.** Program a second, faster `stimecmp` deadline for profiled
    processes only, and measure what a 1 kHz profile costs in time and gains in precision.
    Teaches what `clockintr` really controls and why the scheduler quantum and the sampling
    period need not be the same.
