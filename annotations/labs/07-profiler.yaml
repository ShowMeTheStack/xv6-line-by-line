      `prof` reads the command's ELF program headers (`textrange`, above) and takes the
      loadable segment marked executable: for `grep`, `[0, 0xb71)`, its text and read-only
      data. The loop picks the smallest shift, starting at 1, for which the range fits in
      1016 buckets: 2-byte buckets would resolve every compressed instruction, but `grep`
      would need 1,465 of them, so it gets 4-byte buckets.

