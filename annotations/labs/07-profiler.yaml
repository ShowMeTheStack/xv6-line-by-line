      Hart 0 and hart 2 are idle in their schedulers, each waiting in `wfi` for its own next
      timer interrupt. Their ticks are unrelated to this one: every hart's `stimecmp` was set
      by its own [[timerinit]] and is re-armed by its own [[clockintr]]. They never touch
      `proftest`'s histogram.
  - title: Counting one sample
    commit: 3
    file: kernel/prof.c
    lines: 12-22
    focus: 14-21
    diff: true
    state:
      hart: 1
      mode: S
      proc: proftest (pid 3)
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap, profsample]
      sp: kernel
      irq: 0
    note: |
      `profsample` counts the sample, checks the range, and adds one to bucket
      `(pc - lo) >> shift`. In the observed stop, `pc` was `0x112`, the range `[0, 0x1000)`
      with `shift` 3, and `nsample` still 0: the first sample this histogram received. `0x112 >> 3` is bucket 34, which covers `0x110`–`0x117`.

      The range check is not optional. `pc - lo` is unsigned: for a pc below `lo` it wraps to
      a number near 2^64, and for a pc above `hi` the index runs past the buckets in use and
      soon past the page. Either way the increment can land in memory the profiler does not
      own. Clinic 3 removed these four lines: thousands of increments went into neighbouring
      pages of a running system without anyone noticing, and with a different bucket size
      the kernel faulted on an address near 2^63.

      No lock and no atomic instruction: a plain load, add and store. That is safe because
      this histogram is written only here, by the one hart running its process, with
      interrupts off; and read only by that same process in a system call, which cannot be
      running at the same time.
