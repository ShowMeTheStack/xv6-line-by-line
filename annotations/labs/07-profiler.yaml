  - title: A histogram that fills exactly one page
    commit: 1
    file: kernel/prof.h
    lines: 1-14
    focus: 5-14
    diff: true
    state:
      hart: 1
      mode: U
      proc: proftest (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main, hotloop, profile]
      sp: {"on": user, detail: "proftest's user stack"}
    note: |
      The story of this tour follows `proftest` (pid 3, which gdb found on hart 1 when it
      stopped at a sample) through the reference branch: it asks to be profiled, spins in a
      hot loop, reads its histogram, and later exits with a profile; at the end, `prof -k`
      profiles the kernel while `usertests` runs. Machine states marked as observed come from
      gdb stops in recorded runs; the others follow from the code.

      The first commit adds the two system calls (numbers 23 and 24, wired up exactly as in
      lab 1) and this header, which the kernel and user programs share, so `profget` can copy
      the page out byte for byte. A 32-byte header records the range `[lo, hi)`, the bucket
      size `1 << shift`, the number of buckets in use, and two counters: every sample, and
      the samples that fell outside the range. Then 1016 four-byte buckets: 32 + 4 × 1016 =
      4096. One page from [[kalloc]] holds the whole histogram, and nothing has to be
      allocated at interrupt time.

      Why `nout`: a sample outside the range is still information ("12% of the time the
      program was somewhere you did not ask about"), and counting it separately is what lets
      the sample path refuse an out-of-range index (clinic 3).
