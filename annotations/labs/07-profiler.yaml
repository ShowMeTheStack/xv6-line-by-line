      calls `profile` *for itself*, then `exec`s the command, which keeps the profile; the
      parent waits, prints the elapsed ticks, and reads `prof.out`, written by the child's
      [[kexit]]. Between `profile` returning and the `exec` system call, the child runs a
      handful of `prof`'s own instructions; a sample there would be counted at a `prof`
      address. That window is far shorter than a tick.

      The elapsed ticks are the yardstick for the report: in the recorded `grep .*.*.*z b1`,
      72 ticks and 61 samples. The difference is time `grep` did not spend in user mode:
      `exec`, reading its input, the write-out at exit.
