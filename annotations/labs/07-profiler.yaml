      #6  0x0000000080003b20 in nameiparent (path=path@entry=0x80007638 "prof.out", name=name@entry=0x3fffff9ec0 "prof.out") at kernel/fs.c:740
      #7  0x000000008000503a in create (path=path@entry=0x80007638 "prof.out", type=type@entry=2, major=major@entry=0, minor=minor@entry=0) at kernel/sysfile.c:264
      #8  0x0000000080005976 in profdump (p=p@entry=0x80010240 <proc+1104>) at kernel/prof.c:145
      #9  0x0000000080001b00 in freeproc (p=p@entry=0x80010240 <proc+1104>) at kernel/proc.c:162
      #10 0x0000000080002220 in kwait (addr=24492) at kernel/proc.c:403
      #11 0x00000000800029bc in sys_wait () at kernel/sysproc.c:36
      #12 0x000000008000292a in syscall () at kernel/syscall.c:150
      #13 0x000000008000268c in usertrap () at kernel/trap.c:69
      #14 0x0000003ffffff09c in ?? ()
      $1 = (void *) 0x1
      $2 = 4
      $3 = 1
      $4 = 3
      $5 = "proftest\000\000\000\000\000\000\000"
      [...]
    why: |
      The first profiled child to be reaped is the one `proftest` execs to check that `exec`
      keeps the profile. Its parent, `proftest` (pid 3, `$4`), reaps it in [[kwait]], which
      holds `wait_lock` and the zombie's `p->lock` (the slot at `proc+1104`), and calls
      [[freeproc]], which now calls `profdump`.

      `create` looks up `prof.out` in the *parent's* current directory, `/`. [[namex]] locks
      the directory inode and unlocks it again ([[iunlock]]), which is a sleep-lock release:
      [[releasesleep]] calls [[wakeup]] for anyone waiting on that inode. `wakeup` walks the
      whole process table and acquires each `p->lock` to look at the process. At
      `proc+1104` it reaches the zombie, whose lock this hart already holds, and [[acquire]]
      panics rather than spin forever (frame #1). `noff` was 4 (`$2`): `wait_lock`, the
      zombie's lock, the inode's inner spinlock, and the `push_off` that `acquire` does before
      it checks.

      Had it got past that, the first disk read would have slept with spinlocks held and
      [[sched]] would have panicked with `sched locks`. Any code that may sleep, and anything
      that releases a sleep-lock, must run with no spinlock held. The reference writes the
      file in [[kexit]], as the exiting process, before it takes `wait_lock`, and leaves
      [[freeproc]] only the `kfree`, which takes nothing but `kmem.lock`.
