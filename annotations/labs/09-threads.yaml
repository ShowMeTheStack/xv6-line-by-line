      locks: [vm->lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_exec, kexec]
      sp: {"on": kernel}
    note: |
      [[kexec]] builds a new page table and frees the old one ([[kernel/exec.c:138]]).
      With another thread still running in the old one, that thread's next instruction
      would fetch through freed memory. The reference refuses: `exec` fails with -1 while
      `ref > 1`. (Linux instead kills the other threads first; see "further".) The read of
      `ref` takes the lock for clarity; a count of 1 cannot change underneath, since only a
      thread of this address space could raise it, and this is the only one.

      This, with the refused shrink and `uvmgrow` in [[growproc]], is what makes the
      lock-free readers safe: while an address space is shared, nothing removes a user page. [[copyin]],
      [[copyout]] and the hardware walker may look at the page table at any moment and
      never find a page freed under them.

      [[kfork]] (same commit) holds the parent's `vm->lock` around [[uvmcopy]], so a fork
