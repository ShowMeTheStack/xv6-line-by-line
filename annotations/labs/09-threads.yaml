      Stacks come from `sbrk` (thread-safe since commit 6) and are reused after
      `thread_join`. The table is protected by the library's own futex mutex: any thread
      may create threads. There are no guard pages: a thread that overflows its 8 KiB
      writes into the next one's stack, silently (see "further").
