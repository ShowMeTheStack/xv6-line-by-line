measure: |
  **What a thread costs.** A scratch copy of the reference kernel counted [[kalloc]] calls
  inside [[kfork]] and inside `kclone`, and timed loops with `uptime` (one tick is about a
  tenth of a second). The program had a 1 MiB heap, written:

  | | `fork` | `clone` |
  |---|---|---|
  | pages allocated by the call | 266 (260 for the image, 1 trapframe page, 5 page-table pages) | 0 |
  | 2000 × create + reap | 69 ticks (`fork` + `wait`; the same in a second run) | 3 ticks (`thread_create` + `thread_join`, both runs) |

  (Tick counts on QEMU depend on what else the computer is doing; yours will differ, but
  the gap between the two columns will not close.)

  A thread needs a `struct proc` (which has its kernel stack since boot) and a slot in a
  page that already exists; its user stack (8 KiB from `sbrk`) is the library's and is
  reused.

  **How often the kernel is involved.** The same scratch copy counted futex calls
  (instrumentation not on the branch):

  | workload | `futex_wait` calls | went to sleep | `futex_wake` calls | threads woken |
  |---|---|---|---|---|
  | 1 thread, 140,000 lock/unlock pairs | 0 | 0 | 0 | 0 |
  | 7 threads × 20,000 pairs (run 1) | 2,289 | 0 | 3,812 | 215 |
  | 7 threads × 20,000 pairs (run 2) | 2,375 | 1 | 4,072 | 36 |
  | ping-pong, 2 threads × 5000 turns (run 1) | 5,204 | 4,835 | 10,000 | 4,837 |
  | ping-pong (run 2) | 2,856 | 2,756 | 10,000 | 2,757 |

  The mutex stays in user space unless there is contention, and even under contention the
  holder's critical section (a 200-iteration loop) is usually over before a waiter gets into
  the kernel, so few waiters actually sleep. "Woken" exceeds "went to sleep" because
  `futex_wake` counts threads that were registered but still on their way to [[sleep]]:
  exactly the window the register-then-look order protects. In ping-pong, where a thread
  can only wait for the other, most `futex_wait` calls do go to sleep; the rest find the
  turn already handed over.
further: |
  - **Share the descriptor table.** `clone` copies the open-file table as `fork` does, so a
    file one thread opens is invisible to the others. Move `ofile[]` and `cwd` into a
    refcounted structure like `struct vm`; you will meet the same "last one out" and
    locking questions for `open` and `close`.
  - **exec kills the other threads.** Instead of refusing, make `exec` from any thread kill
    its siblings, wait until they are gone (ref back to 1), and then replace the image. This
    is what Linux does; it needs a way to wait for threads that are not your children.
  - **Guard pages for thread stacks.** Allocate each stack with one extra page and clear its
    `PTE_U` (a new system call, or an `mprotect`-like one), so that an overflow faults
    instead of corrupting a neighbour.
  - **Wake an idle hart.** A RUNNABLE thread waits up to a timer tick for an idle hart in
    `wfi`. Send it a supervisor software interrupt from [[wakeup]] and measure how
    ping-pong and the mutex test change. The CLINT's `msip` will not do on its own: it
    raises a machine-level interrupt, which this tree neither delegates nor handles
    (`start` never sets `mtvec` or `mie.MSIE`). Either run QEMU with
    `-machine virt,aclint=on` and use the ACLINT's SSWI device, which sets `sip.SSIP` on the
    target hart, or add a small M-mode handler that turns MSIP into SSIP.
  - **Copy-on-write meets threads.** After lab 11, a page with reference count 1 may be
    "taken over" without copying. With threads, two threads of one process can fault on
    the same COW page at once. Work out which lock `cowfault` needs now.
