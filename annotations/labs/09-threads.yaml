      1 run in 9 failed; 8 printed `ALL OK`. `sepc=0x320` is the store `sb a3,0(a4)` in
      `lazyfn` (from `user/_threadtest`'s disassembly), and `stval` is the byte being
      stored: thread 1 writes offset 1 of each page (`0x25c001`), thread 4 offset 4
      (`0x268004`).

      - **The loser is killed.** Two threads fault on the same page. The first maps it;
        the second reaches [[ismapped]] ([[kernel/vm.c:466]]) a moment later, sees a valid
        PTE, and [[vmfault]] returns 0, so [[usertrap]] kills it ("unexpected scause 0xf").
        Nothing was wrong with the access: the page is there, and writable.
      - **Both map it.** If both pass [[ismapped]] before either maps, both allocate a page
        and the second [[mappages]] panics: `remap`. This run shows only the first mode;
        in other runs of this bug the second appeared, as `panic: mappages: remap`.

      The two kills mark threads `killed`, and their [[kexit]] kills the rest of the
      process, so the in-process tests stop; the later checks run in other processes and
      pass. On the reference, gdb caught the benign version of the same race in both runs
      where we looked: a thread finding its page "already mapped" under the lock, by a
      thread on another hart.
  - bug: join takes any child
    change: |
      The vm test is applied in one direction only: `wait` skips threads, but `join` accepts
      any child:

      ```diff
      -        if ((pp->vm == p->vm) != threads) {
      +        if (!threads && pp->vm == p->vm) {
      ```
    symptom: |
      $ threadtest
      threadtest: create and join: OK
      threadtest: registers: OK
      threadtest: mutex: 140000 of 140000
      threadtest: mutex: OK
      threadtest: without the mutex: 122186 of 140000 (not checked)
      threadtest: ping-pong: OK
      threadtest: sbrk: OK
      threadtest: lazy: OK
      threadtest: shared memory only grows: OK
      threadtest: wait and join: FAIL
      threadtest: stress: OK
      threadtest: exit ends all threads: OK
      threadtest: kill ends all threads: OK
      threadtest: free pages 32469 before, 32469 after
      threadtest: no leaks: OK
      threadtest: SOME TESTS FAILED
      $
    why: |
      Every run. In `wait and join` the test forks a child that exits at once with 42, then
      creates a thread that sleeps 3 ticks and returns 7. `thread_join` runs first: the
      zombie child process is the first child it finds, so it returns the *child's* pid with
      status 42. The thread is then reaped by the second `thread_join` (which should have
      returned -1), and `wait` finds no child process left.

      Notice what does *not* fail: everywhere else in the test, the caller has only one kind
      of child at a time, so a sloppy join looks correct. Only a test that mixes the two
      kinds on purpose sees it. The kernel stays consistent (each child is reaped exactly
      once); the bug is that statuses go to the wrong call, which in a real program means a
      thread library freeing the stack of a thread that is still running.
