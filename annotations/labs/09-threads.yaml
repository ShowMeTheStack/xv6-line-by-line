      $ threadtest
      threadtest: create and join: OK
      threadtest: registers: OK
      threadtest: mutex: 140000 of 140000
      threadtest: mutex: OK
      threadtest: without the mutex: 108025 of 140000 (not checked)
      threadtest: ping-pong: OK
      threadtest: sbrk: OK
      usertrap(): unexpected scause 0xf pid=44
                  sepc=0x320 stval=0x25c001
      usertrap(): unexpected scause 0xf pid=47
                  sepc=0x320 stval=0x268004
      threadtest: the process running the tests was killed
      threadtest: exit ends all threads: OK
      threadtest: kill ends all threads: OK
      threadtest: free pages 32469 before, 32469 after
      threadtest: no leaks: OK
      threadtest: SOME TESTS FAILED
