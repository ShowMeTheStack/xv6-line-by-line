      $ threadtest
      threadtest: create and join: OK
      threadtest: registers: OK
      threadtest: mutex: 140000 of 140000
      threadtest: mutex: OK
      threadtest: without the mutex: 140000 of 140000 (not checked)

      (nothing more for 240 s. gdb: all three harts idle in scheduler; the process table:)

      [...]
      slot 2 pid 3 state 2 chan 0x80011ee0 killed 0 thread 0 tslot 0 name threadtest vm 0x80010e70
         word at chan: 0
      slot 3 pid 4 state 2 chan 0x80012050 killed 0 thread 0 tslot 0 name threadtest vm 0x80010ea8
         word at chan: 0
      slot 4 pid 34 state 2 chan 0x8002b010 killed 0 thread 1 tslot 1 name threadtest vm 0x80010ea8
         word at chan: 1
      slot 5 pid 35 state 2 chan 0x8002b010 killed 0 thread 1 tslot 2 name threadtest vm 0x80010ea8
         word at chan: 1
    why: |
      Rare: this bug hung `threadtest` in 1 of 24 runs (the others printed `ALL OK`); in
      other runs of it we also saw it hang in the mutex test. gdb found nothing running:
      pids 34 and 35, the two ping-pong threads, are both SLEEPING (state 2) on channel
      `0x8002b010`, the physical address of `turn` (user address `0x2010`, in the page at
      `0x8002b000`). The word holds 1: it is thread 1's turn. Yet thread 1 (pid 35) sleeps
      in `futex_wait(&turn, 0)`, waiting for a value the word no longer has. (pid 4 sleeps
      in `join`, pid 3 in `wait`; their channels are kernel addresses, and the "word" gdb
      printed there means nothing.)

      The interleaving that produced it:

      | time | hart A: thread 1 (pid 35) | hart B: thread 0 (pid 34) |
      |---|---|---|
      | 1 | `futex_wait(&turn, 0)`: copyin reads `turn` = 0 | |
      | 2 | | stores `turn = 1`, calls `futex_wake(&turn, 1)` |
      | 3 | | scan finds no thread with `chan` = `0x8002b010`: wakes nobody |
      | 4 | `sleep_prepare(chan)`, `sleep()`: SLEEPING | |
      | 5 | | waits for `turn == 0`: `futex_wait(&turn, 1)` reads 1, sleeps |

      Each thread now waits for the other. In the mutex test the same lost wakeup is often
      repaired by luck: another contender writes 2 into the mutex word and a later unlock
      wakes the forgotten sleeper. That is why the hang is rare and why the test that hands
      a turn between exactly two threads is the one that catches it. With the reference
      order, step 4's registration comes before step 1's look, and step 3 would have found
      and cleared it ([[tour:16]] is the same story inside the kernel).
  - bug: sbrk without the address-space lock
    change: |
      [[growproc]] without `acquire(&vm->lock)` and its two `release`s; everything else as
      in the reference (so [[vmfault]] still locks).
    symptom: |
      $ threadtest
      threadtest: create and join: OK
      threadtest: registers: OK
      threadtest: mutex: 140000 of 140000
      threadtest: mutex: OK
      threadtest: without the mutex: 140000 of 140000 (not checked)
      threadtest: ping-pong: OK
      ppanic: amappages: remapnic: mappages: remap
    why: |
      6 runs in 48 failed this way; the other 42 printed `ALL OK`. The `sbrk` test runs 7
      threads that each call `sbrk(4096)` 50 times. Two threads read the same `vm->sz` = X.
      Each calls `uvmgrow(X, X + 4096)` (the address space is shared): the first maps page
      X; the next one finds the page-table page already there, takes a physical page, and
      its [[mappages]] finds the PTE already valid and panics. The garbled line is two
      panics from two harts (each the loser of such a race), interleaved character by
      character: once the first hart sets `panicking`, [[printk]] stops taking its lock
      ([[kernel/printk.c:70]]), so the second hart's message mixes with the first.

      With the *lazy* `sbrk` of the original code ([[kernel/sysproc.c:48]] and
      [[kernel/sysproc.c:62]], read then add, no lock) the same race returns the same address
      to two threads without any panic: silent sharing of memory that each believes is its
      own. The window there is a few instructions, which is why the reference moved both
      kinds of `sbrk` into [[growproc]] under one lock.
