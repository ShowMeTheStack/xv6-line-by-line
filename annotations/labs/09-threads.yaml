      up to `TRAPFRAME`: `usertests lazy_sbrk` grows a process to exactly that limit and
      writes the last page. Slots in the existing page need no new mapping, no unmapping
      when a thread dies, and no TLB thinking: the page is mapped once, in [[proc_pagetable]],
      for the life of the address space.

