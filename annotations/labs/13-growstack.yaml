  - title: Every teardown frees the stack region
    commit: 2
    file: kernel/proc.c
    lines: 207-217
    focus: 210-217
    diff: true
    state:
      hart: 0
      mode: S
      proc: growstack (pid 3), reaping pid 4
      intr: "off"
      satp: kernel
      locks: [wait_lock, "pid 4's p->lock"]
      irq: {noff: 2, intena: 1}
      stack: [usertrap, syscall, sys_wait, kwait, freeproc, proc_freepagetable]
      sp: {"on": kernel, detail: "pid 3's kernel stack, `sp` = `0x3fffff9f10`"}
    note: |
      [[uvmfree]] frees `[0, sz)` and then hands the page-table pages to [[freewalk]], which
      panics if it finds a page still mapped. Stack pages live above `sz`. One line before
      [[uvmfree]] unmaps and frees the whole region; [[uvmunmap]] skips pages that are not
      mapped, so it works for a stack of 1 page or 64.

      [[proc_freepagetable]] is the right place because every teardown goes through it:
      [[freeproc]] when a parent reaps a child, [[kexec]] when it drops the old image, and
      [[kexec]]'s error path when it drops a half-built new one. At this commit the region is
      always empty, so the line does nothing yet, and `usertests -q` passes.

      gdb stopped here as `growstack` (pid 3) reaped its `deep` child (pid 4): 18 stack pages
      mapped, `0x3ffffec000` to `0x3fffffd000`, all freed by this line. Two spinlocks are held:
      [[kwait]] took `wait_lock` and then the child's `p->lock` ([[kernel/proc.c:376]],
      [[kernel/proc.c:384]]) before calling [[freeproc]], so `noff` is 2 and interrupts are off;
      `intena` 1 records that they were on in the system call. Each [[kfree]] takes and releases
      `kmem.lock` inside that (noff 3 for a moment).
    others: |
      The child is a `ZOMBIE`: it will never run again, and its `p->lock` (held here) keeps
      the scheduler and [[kkill]] away from its slot while it is torn down. The pages go back
      to the free list under `kmem.lock`; a hart allocating at the same moment waits a few
      instructions for it.
