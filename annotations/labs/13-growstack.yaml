published: true
title: A growable user stack
area: Memory
stars: 3
branch: ext/13-growstack
prerequisites: {tours: [10, 20, 21, 22, 25, 26, 28], concepts: [stacks]}
summary: |
  In this tree every user program gets exactly one page of stack. [[kexec]] places a
  [[g:guard-page]] and a single stack page right after the program's data, and the heap grows
  from just above them. A recursive function that needs 5 KiB of stack is killed. In this lab
  the stack moves to the top of the user address space and grows down, one page at a time, as
  the program touches it, up to a fixed maximum. The heap keeps growing up from the end of the
  program, and an unmapped gap separates the two.

  The fault handler is the easy part. The lazy heap already fills missing pages on demand.
  What decides which addresses it will fill, and what else in the kernel decides the same
  thing its own way? Every one of those places has to be asked again: does it still see the
  whole process? Some of them fail loudly when they get it wrong, some quietly, and one only in a
  situation `usertests` never creates. And `usertests` has opinions about where the stack
  ends.

  The reference solution is seven small commits. With it, 65 recursive calls with 1 KiB of
  locals each use 70,944 bytes of stack (18 pages), and unbounded recursion is killed one
  frame above the limit.
learn:
  - "How the user address space is laid out, who decides it, and what it means to move one region of it: which code assumes the old layout without saying so."
  - "What happens when the kernel, not the program, is the first to touch a page of user memory, and where the kernel checks user addresses on its own."
  - "What a fixed-size, page-aligned region buys you compared with tracking a moving boundary per process."
  - "How a guard page works when it is not mapped at all, and what limits it has."
  - "What `fork`, `exec` and `exit` each do with the pages of an address space, and what goes wrong, and how visibly, when one of them overlooks a region."
spec: |
  **Behaviour.** A process's stack starts with one page at the top of user memory, just below
  the trapframe, and grows down by whole pages when the program, or the kernel on its behalf,
  touches an address below the pages it already has. It grows to at most `USERSTACK` pages
  (64, 256 KiB, in the reference). A touch below that limit kills the process, exactly as the
  guard page does today. The heap starts right after the program image and grows up with
  `sbrk` as before, eagerly or lazily, but never so far that it would reach the page just below
  the stack's lowest possible page: that page stays unmapped, as a guard between the two.

  - A new stack page is zero-filled and writable, like a lazy heap page.
  - `fork` gives the child its own copy of every stack page the parent has.
  - `exit` and `exec` free the stack pages along with the rest of the old image.
  - System calls that copy into a stack page nobody has touched yet (`read`, `pipe`,
    `wait(&status)` with a local `status`) succeed and grow the stack; they do not fail.
  - `exec`'s arguments must still fit in one page, as before.

  **What must not change.** Everything `usertests` checks about bad pointers, the trapframe,
  the trampoline, `MAXVA`, lazy and eager `sbrk`, and stack overflow. **`usertests -q` must
  print `ALL TESTS PASSED` on 3 harts.** A few tests know the old layout; the think section
  finds which, and decides for each one whether it still tests something true.

  **The test program**, `growstack`, runs five checks, each in a child process
  (`growstack NAME` runs one):

  ```text
  $ growstack
  growstack: deep: 65 calls used 70944 bytes of stack
  growstack: deep: OK
  growstack: fork: OK
  growstack: read: OK
  usertrap(): unexpected scause 0xf pid=8
              sepc=0x36a stval=0x3ffffbdef8
  growstack: overflow: status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000: OK
  usertrap(): unexpected scause 0xf pid=9
              sepc=0xce stval=0x3ffffbd000
  growstack: collide: OK
  growstack: ALL OK
  ```

  - **deep**: a recursive function with a 1 KiB local array calls itself 64 times (65
    frames), filling each array with its depth and checking all of them on the way back.
  - **fork**: the same recursion forks at the bottom. The child checks all 65 frames of its copy
    and scribbles over each one as it unwinds; after the child has exited, the parent checks
    its own frames.
  - **read**: `read()` from a pipe into a stack buffer that lies in pages nobody has touched,
    50 bytes before a page boundary, so the 100 bytes land in two such pages.
  - **overflow**: unbounded recursion, with every frame reporting its `sp` through a pipe. The
    child must be killed (exit status -1), and its deepest frame must be within one frame of
    the limit: not killed earlier, not allowed below.
  - **collide**: the heap grows (lazily) to exactly the highest address allowed and no
    further; its last byte works; a store to the guard page above it kills.

  The two `usertrap()` lines are the expected kills of the overflow and collide children. The
  program checks what the final line claims: each child's exit status (-1), how deep the
  overflow child got before it died (its last reported `sp` lies within one frame above the
  limit), and that the collide child passed its heap checks before its store into the guard.
  The `stval` values are shown for information; the line `ALL OK` does not depend on them.
think:
  - title: Where does a stack that grows have to live?
    q: |
      In this tree [[kexec]] places a guard page and one stack page (`USERSTACK` is 1) right after
      the program image, and the heap grows from just above them. Recursion that needs more than
      4 KiB dies. In this layout, where could a second stack page come from? Where would you put
      the stack instead, in which direction does it grow, what stops it, and what does your
      choice do to `p->sz`, which today covers everything a process owns?
    hints:
      - |
        Draw the user address space from 0 to `MAXVA` using [[kernel/exec.c:86]]-[[kernel/exec.c:97]],
        the comment at [[kernel/memlayout.h:54]] and the heap's ceiling in [[growproc]]
        ([[kernel/proc.c:243]]). A stack grows toward lower addresses: what lies directly below
        the stack page today, and what lies directly above it?
      - |
        Two regions that both grow must grow away from each other into free space, with something
        between them that neither can take. The heap is `[0, p->sz)` and grows up. Nothing lives
        between the top of the heap and the trapframe. And a region whose bounds are constants is
        the same for every process: no new per-process state.
      - |
        Fix the stack's top at a constant high address, give the stack a fixed maximum size,
        keep one unmapped page below the lowest page the stack may reach, and lower the heap's
        ceiling to just below that page. `p->sz` then describes the image and the heap only.
    answer: |
      In the original layout the stack is boxed in. Below its page is the guard page, a real
      page that [[uvmclear]] made inaccessible to user mode ([[kernel/exec.c:95]]), and below that
      the program's data. Above it is the first page of the heap ([[kernel/exec.c:96]] sets the
      initial `sp` to `sz`, which is also where `sbrk` starts). The stack cannot grow down
      without overwriting data, and it cannot move up because the heap is there.

      The reference moves the stack to the top of user memory, where nothing lives:

      | address | what |
      |---|---|
      | `0x3ffffff000` | TRAMPOLINE (not user-accessible) |
      | `0x3fffffe000` | TRAPFRAME (not user-accessible); also `USTACKTOP`, the stack's top (exclusive) |
      | `0x3ffffbe000` to `0x3fffffdfff` | the stack region: 64 pages, grown from the top down as needed (`USTACKBASE` is its bottom) |
      | `0x3ffffbd000` to `0x3ffffbdfff` | the guard page, never mapped |
      | up to `0x3ffffbd000` | `MAXHEAP`, the highest `p->sz` the heap may reach |
      | from `0` | text, data, bss, then the heap, growing up |

      Three constants describe it, in `memlayout.h`: `USTACKTOP` (= `TRAPFRAME`), `USTACKBASE`
      (`USTACKTOP - USERSTACK * PGSIZE`) and `MAXHEAP` (`USTACKBASE - PGSIZE`). `USERSTACK`
      keeps its name but changes its meaning, from "the stack's size" to "the most pages it may
      grow to" (64 here). Virtual addresses cost nothing: the region costs memory only for the
      pages a program actually touches.

      Why a fixed region instead of a per-process "lowest stack page" that moves? With constants,
      every question below ("is this address a stack address?", "which pages might the stack
      have?") has the same answer for every process, with no new field to keep correct across
      fork, exec and exit. The price is a fixed maximum. Putting the heap at the top growing
      down instead would have changed the meaning of `sbrk`'s return value for every program.

      What it does to `p->sz` is the real subject of this lab. The stack now lies *above*
      `p->sz`, so every piece of kernel code that means "all of this process's memory" when it
      says `[0, p->sz)` is now wrong about the stack. The next three questions find those
      places.

      The guard is now a page that is simply never mapped, rather than a mapped page with `PTE_U`
      cleared. The old guard used a page of physical memory in every process: on the branch,
      right after boot, 2 more pages are free than on the original kernel (32,547 against
      32,545; `init` and `sh` each saved one).
    checks:
      - id: lab13-01
        level: 1
        type: choice
        q: |
          On the original kernel, a program's stack needs a second page: the next function call
          stores below the stack page. What is at that address, and what happens?
        code: kernel/exec.c:86-97
        options:
          - text: "The guard page: a mapped page with PTE_U cleared. The store faults, vmfault refuses because the page is mapped, and the process is killed."
            correct: true
            why: |
              [[uvmclear]] clears `PTE_U` on the lower of the two pages [[uvmalloc]] mapped. The
              hart faults, and [[vmfault]]'s `ismapped` test ([[kernel/vm.c:466]]) refuses to
              map over a page that is already mapped.
          - text: "The first page of the heap, so the stack silently overwrites the heap."
            why: |
              You may have pictured the heap below the stack. In this tree the heap starts *above*
              the stack page, at the `sz` that [[kexec]] stores in `p->sz` ([[kernel/exec.c:135]]).
          - text: "An unmapped address below p->sz, so vmfault gives it a fresh zero page and the stack grows."
            why: |
              That would be true if the guard page were unmapped. It is mapped, without `PTE_U`,
              and [[vmfault]] refuses mapped pages; that is exactly why the guard works with a
              lazy heap in the same address range.
          - text: "Nothing: the hart lets the store through, because the page is below p->sz."
            why: |
              `p->sz` is a software notion; the hardware only reads the PTE. Without `PTE_U` a
              user-mode store faults, whatever `p->sz` says.
        explain: |
          The old stack is boxed in: guard and data below, heap above. That is why it cannot
          grow where it is, and why the lab moves it. `usertests stacktest` checks the guard: with
          the old layout (commit 1 of the branch) it faulted at `stval=0x10e90`, inside
          `usertests`' guard page at `0x10000`.
      - id: lab13-02
        level: 2
        type: number
        q: |
          With `USTACKTOP` = `TRAPFRAME` = `0x3fffffe000`, `USERSTACK` = 64 and one guard page,
          what is `MAXHEAP`, the highest value `p->sz` may reach? (Answer in hex.)
        answer: "0x3ffffbd000"
        wrong:
          "0x3ffffbe000": |
            That is `USTACKBASE`, the lowest stack page. A heap allowed to reach it would end
            right where the stack's lowest page begins, with no guard between them.
          "0x3fffffd000": |
            You may have counted one stack page, as in the original tree. With 64 pages the
            region starts `0x40000` below the top.
          "0x3fffffe000": |
            That was the old ceiling, `TRAPFRAME`, before the stack moved up there.
        why_wrong: "USTACKBASE = 0x3fffffe000 - 64 * 0x1000 = 0x3ffffbe000; MAXHEAP is one page lower."
        explain: |
          `0x3fffffe000 - 0x40000` = `0x3ffffbe000` (`USTACKBASE`), and one guard page below it
          is `0x3ffffbd000` (`MAXHEAP`). The page `[0x3ffffbd000, 0x3ffffbe000)` belongs to
          nobody. The kernel in this build compiles `MAXHEAP` as `0x3ffffbd << 12`.
  - title: Who grows the stack when the program touches a new page?
    q: |
      A function call stores a frame onto a page the stack has never used. What does the hart
      do, which kernel function decides what happens next, and on what test does it decide
      today? What must it learn, and how will it tell a stack page from a wild pointer?
    hints:
      - |
        Follow a store fault through [[usertrap]]'s fault branch ([[kernel/trap.c:71]]-[[kernel/trap.c:73]])
        into the function it calls there, and read that function's very first test.
      - |
        The new stack pages lie above `p->sz`; whatever [[vmfault]] refuses, [[usertrap]] kills.
        With a fixed region, "is this a stack address?" is a pair of comparisons with constants.
        Decide whether you also need to know where `sp` is.
      - |
        One more condition in front of the `p->sz` test: an address inside the region is legal
        even though it is above `p->sz`. Everything after that test (not mapped yet, a zeroed
        page, `PTE_R | PTE_W | PTE_U`) already does what a new stack page needs.
    answer: |
      The store raises a store page fault (`scause` 15; a load would raise 13), the trampoline
      takes it to [[usertrap]], and [[usertrap]] calls [[vmfault]] with the process's page table,
      `p->sz` and `stval`. Today [[vmfault]]'s first test, `va >= psz`, rejects every address at
      or above `p->sz`, and the process dies. In the new layout that would kill every program at
      its first deep call.

      The reference changes that one test:

      ```c
      if (va >= psz && (va < USTACKBASE || va >= USTACKTOP))
        return 0;
      ```

      An address below `p->sz` (the image and heap) or inside the stack region passes; the rest
      of [[vmfault]] is unchanged. It refuses a page that is already mapped, allocates a page,
      zeroes it, and maps it readable, writable and user-accessible. Zeroing matters here as it
      does for the heap: [[kalloc]] fills pages with junk (`0x05` bytes), and a page that
      another process freed must never show its old contents to a new owner.

      Any address in the region grows the stack, even one far below `sp`. Telling a real stack
      access from a wild pointer would need the faulting `sp`, and a program may legitimately
      address a local array whose low end lies far below its last touched page (the `read`
      check does exactly that). Inside a fixed region the cost of a wild pointer is bounded:
      at most the region's 64 pages, all freed at exit.

      gdb logged the first five store faults of `growstack deep` (pid 4, hart 0): the first
      with `stval=0x3fffffce28`, then `0x3fffffbd28`, `0x3fffffac28`, … each about 4 KiB lower,
      each one in [[vmfault]] called from [[usertrap]] with interrupts off and no lock held. A
      counting copy of the kernel counted 17 in all. The process ended with 18 stack pages: the
      17 grown by faults and the top one, inherited through fork (exec grew it in the parent,
      `growstack` itself).
    checks:
      - id: lab13-03
        level: 2
        type: state
        q: |
          `growstack deep` (pid 4) stores into a stack page it has never touched, and [[vmfault]],
          called from [[usertrap]], is about to allocate the page. Fill in the hart's state at
          that moment.
        code: kernel/vm.c:458-478@469
        state:
          mode: S
          stack: kernel
          satp: kernel
          sie: "off"
          noff: 0
        why:
          stack: |
            The trap switched to pid 4's kernel stack in [[uservec]]; [[usertrap]] and
            [[vmfault]] run on it. The user stack is the thing being grown, and S-mode code
            does not use it.
          satp: |
            [[uservec]] switched to the kernel page table before calling [[usertrap]];
            [[vmfault]] edits the user page table through its physical address.
          sie: |
            A fault from user mode never reaches `intr_on` ([[kernel/trap.c:66]] is only on the
            system-call path), so interrupts stay off from the trap until the return to user mode.
          noff: |
            No spinlock is held yet. [[kalloc]] will take `kmem.lock` in a moment, briefly.
        why_wrong: Follow the trap through uservec into usertrap's fault branch, which never turns interrupts on and takes no lock before calling vmfault.
        explain: |
          gdb recorded exactly this: hart 0, `noff` 0, `intena` 0, `SIE` 0, `sp` `0x3fffff7fb0`
          on pid 4's kernel stack (`0x3fffff7000`-`0x3fffff8000`), `stval` `0x3fffffce28`, and
          the page being mapped, `0x3fffffc000`.
      - id: lab13-04
        level: 1
        type: choice
        q: |
          On the reference branch, a program stores to `0x3ffffbd010`, with `p->sz` =
          `0x3000`. What does [[vmfault]] return, and what happens to the process?
        options:
          - text: "0; usertrap prints an unexpected scause 0xf and kills the process."
            correct: true
            why: |
              `0x3ffffbd010` is above `p->sz` and below `USTACKBASE` (`0x3ffffbe000`): it is in
              the guard page, which no rule allows.
          - text: "A new zeroed page, because the address is inside the stack's 64 pages."
            why: |
              You may have counted the guard page as part of the stack. The region is
              `[0x3ffffbe000, 0x3fffffe000)`; `0x3ffffbd010` is one page below it.
          - text: "A new zeroed page, because the stack grows down without a limit."
            why: |
              The limit is the point of the region's lower bound. Clinic 3 shows what an
              unbounded stack does to the kernel.
          - text: "0, and the kernel panics, because a user address faulted in the guard."
            why: |
              A user fault the kernel refuses only kills the process; nothing in the kernel is
              inconsistent.
        explain: |
          `growstack collide` does exactly this store (to `0x3ffffbd000`, the first byte of the
          guard page) after growing the heap to `MAXHEAP`, and is killed:
          `usertrap(): unexpected scause 0xf pid=9`, `stval=0x3ffffbd000`.
  - title: The kernel touches the stack too
    q: |
      Not every first touch of a stack page is made by user code. Which kernel paths read or
      write user memory, and what do they do when the page they need is not mapped yet? Which
      of them compare a user address with `p->sz` on their own, before they get that far? And
      who writes into a new process's stack before it has run a single instruction?
    hints:
      - |
        List the functions in `vm.c` and `syscall.c` that read or write user memory on the
        kernel's behalf, and follow what each does with an address it cannot find in the page
        table. Then follow one `exec` with a local `argv` array: how [[sys_exec]] collects the
        arguments ([[kernel/sysfile.c:465]]-[[kernel/sysfile.c:486]]), and how [[kexec]] puts
        them on the new stack ([[kernel/exec.c:99]]-[[kernel/exec.c:119]]).
      - |
        A kernel copy into an unmapped page raises no trap: the copy functions look the page up
        themselves and, if it is missing, call the same function a fault would. A test against
        `p->sz` that runs before that call is a second gate. Also ask what the calling code
        holds at that moment: a fault handler that could sleep would be a problem under a
        spinlock.
      - |
        The change from the previous question already serves every copy function. Find the
        one explicit `p->sz` test on the way and accept the region there as well. Let exec's
        first copy grow the new stack's first page.
    answer: |
      **The copy functions need nothing.** [[copyout]], [[copyin]] and [[copyinstr]] look a page
      up with [[walkaddr]] and, if it is missing, call [[vmfault]] with the page table and size
      they were given. Teaching [[vmfault]] the region taught all three. `growstack read` relies
      on it: its buffer lies in pages the child never touched, and gdb saw [[copyout]] grow
      them, `0x3fffffa000` and then `0x3fffffb000`, for [[piperead]] in pid 7.

      That path holds a spinlock: [[piperead]] copies byte by byte under `pi->lock`
      ([[kernel/pipe.c:133]]). gdb recorded `noff` 1, `intena` 1, interrupts off at the
      allocation. That is safe because growing a stack page never sleeps: [[vmfault]] calls
      [[kalloc]], which takes `kmem.lock` for a few instructions, and [[mappages]], which may
      allocate a page-table page the same way. Neither waits for anything. (Compare lab 12, where
      the fault handler reads from disk and every copy under a lock became a hazard.) The same
      holds for [[kwait]]'s copyout of the exit status under `wait_lock` and the child's
      `p->lock`.

      **[[fetchaddr]] needs a change.** It refuses any address at or above `p->sz` before it
      copies ([[kernel/syscall.c:15]]-[[kernel/syscall.c:16]]). [[sys_exec]] fetches each
      `argv[i]` pointer with it, and a program that builds `argv` in a local array, like
      `usertests exectest` (`char *echoargv[] = {"echo", "OK", 0};`), would have its `exec`
      refused. The reference accepts the 8 bytes if they lie below `p->sz` *or* inside the stack
      region. gdb saw the three fetches for `exectest`: `0x3fffffde70`, `0x3fffffde78`,
      `0x3fffffde80`. [[fetchstr]] needs nothing: it has no bound of its own and goes straight
      to [[copyinstr]].

      **exec writes the first stack page.** [[kexec]] copies the argument strings and the
      `argv` array onto the new stack with [[copyout]] *into the new page table*, before the
      process has ever run on it. The reference no longer maps a stack page in [[kexec]] at all:
      the first [[copyout]] finds `USTACKTOP - 4096` unmapped and [[vmfault]] grows it. This
      works because [[vmfault]] receives a page table and a size, not a process: it does not
      care that this page table is not installed yet. The arguments must still fit in that one
      page (the `sp < stackbase` test stays, with `stackbase = USTACKTOP - PGSIZE`).

      One of those execs runs with interrupts off: the very first, `init`'s, called from
      [[forkret]]. gdb saw pid 1's [[copyout]] → [[vmfault]] at `0x3fffffd000` with `SIE` 0 and
      `intena` 0. Every later exec, from [[sys_exec]], ran with interrupts on. Neither matters
      to [[vmfault]], which never sleeps.
    checks:
      - id: lab13-05
        level: 2
        type: multi
        q: |
          The stack now lives above `p->sz`. Which of these functions must change so that a
          system call can use a pointer into the stack, including a stack page not grown yet?
        options:
          - text: "vmfault"
            correct: true
            why: "Its `va >= psz` test refuses every stack address; every lazy path ends here."
          - text: "fetchaddr"
            correct: true
            why: "It tests `addr` against `p->sz` itself, before any copy: `exec` with a local `argv` would fail."
          - text: "copyout"
            why: |
              You may have thought [[copyout]] knows about `p->sz`. It only passes `psz` on to
              [[vmfault]]; once [[vmfault]] accepts the region, [[copyout]] grows stack pages.
          - text: "copyinstr"
            why: |
              Same as [[copyout]]: it calls [[vmfault]] for a missing page and has no bound of
              its own.
          - text: "fetchstr"
            why: |
              It has no `p->sz` test; it calls [[copyinstr]] directly.
          - text: "usertrap"
            why: |
              [[usertrap]] already sends load and store faults to [[vmfault]] with `stval`;
              the decision is entirely inside [[vmfault]].
        explain: |
          One function decides, for faults and for copies alike: [[vmfault]]. The only other
          gate is [[fetchaddr]]'s explicit test. Clinic 6 removes the [[fetchaddr]] change:
          `usertests -q` then fails `exectest: exec echo failed`.
      - id: lab13-06
        level: 3
        type: choice
        q: |
          A learner grows the stack in [[usertrap]] instead (an extra branch that maps a page
          when `stval` is in the region), leaves [[vmfault]] as it was, and makes [[kexec]] map
          the first stack page itself. They run `growstack`, then `usertests -q`. What do they see?
        options:
          - text: "growstack: read: FAIL, and every other check OK; usertests prints ALL TESTS PASSED."
            correct: true
            why: |
              `read` asks [[copyout]] to write into an unmapped stack page. No trap happens, so
              the new branch never runs; [[copyout]] calls the unchanged [[vmfault]], which
              refuses, and `read` returns -1. Nothing in `usertests` writes into an untouched
              stack page from the kernel.
          - text: "growstack: ALL OK, because usertrap sees every page fault."
            why: |
              You may have thought a kernel copy faults like a user access. [[copyout]] looks
              the page up with [[walkaddr]] and handles a missing page itself; no trap happens.
          - text: "panic at boot, because exec cannot copy the arguments."
            why: |
              That is what happens if [[kexec]] does *not* map the first page itself (the variant
              in clinic 4's `why`: `panic: exec`). This learner's [[kexec]] maps it.
          - text: "growstack: deep: FAIL, because the recursion is too deep for usertrap."
            why: |
              The recursion faults from user mode, page by page; the new branch handles each
              fault. `deep`, `fork` and `overflow` all pass.
        explain: |
          Clinic 4 is this kernel, run on 3 harts. The bug is invisible to `usertests`, which is
          why `growstack` has a `read` check.
  - title: Fork, exec and exit walk the address space too
    q: |
      Which kernel functions copy, walk or free "the process's memory" by a size? What happens
      to the stack pages at `fork`, at `exit`, at the end of `exec` (the old image), and on
      `exec`'s error path? For each, what exactly would go wrong if you missed it, and
      how would you notice?
    hints:
      - |
        [[kfork]] ([[kernel/proc.c:271]]) and the loop in [[uvmcopy]] ([[kernel/vm.c:306]]);
        [[uvmfree]] ([[kernel/vm.c:288]]) and what [[freewalk]] does with a leaf it finds
        ([[kernel/vm.c:276]]); the three callers of [[proc_freepagetable]]: [[freeproc]]
        ([[kernel/proc.c:162]]) and [[kexec]] ([[kernel/exec.c:138]], [[kernel/exec.c:144]]).
      - |
        [[uvmcopy]] and [[uvmunmap]] already skip pages that are not mapped, so a whole
        region can be walked even if only a few of its pages exist. And think about what
        [[freeproc]] frees if a fork fails halfway, after one copy succeeded.
      - |
        Give [[uvmcopy]] a range and let [[kfork]] copy two; unmap and free the whole stack
        region in [[proc_freepagetable]], the one function every teardown passes through; set
        the child's `sz` before anything can fail.
    answer: |
      **fork.** [[uvmcopy]] copied `[0, sz)`. The reference gives it a start and an end
      (`start` page-aligned, the error path unmapping only `[start, i)`), and [[kfork]] calls it
      twice: `0` to `p->sz`, then `USTACKBASE` to `USTACKTOP`. Unmapped pages are skipped, so
      the second call copies exactly the pages the parent's stack has grown into. gdb saw the
      `growstack fork` process (pid 5, at the bottom of its 65 frames, user `sp` `0x3ffffecad0`)
      fork with 18 stack pages, `0x3ffffec000` to `0x3fffffd000`. A fork from the shell copies
      one.

      The child's `np->sz` is now set *before* the copies. If the first copy succeeds and the
      second fails, [[freeproc]] frees the child's page table with [[proc_freepagetable]] and
      `np->sz`; with `np->sz` still 0 it would leave the first copy's pages mapped, and
      [[freewalk]] would panic.

      Forget the stack copy and the child gets an *empty* stack region. Its first stack access
      does not fail: [[vmfault]] hands it a zero page. So the child reads zeros where its
      frames should be, and returns to address 0 (clinic 1: every command the shell forks
      prints a second prompt and dies).

      **exit and exec.** [[uvmfree]] unmaps `[0, sz)` and then [[freewalk]] frees the
      page-table pages, panicking with `freewalk: leaf` if any page is still mapped. Stack pages
      above `sz` are such leaves. All three teardown paths go through [[proc_freepagetable]]:
      [[freeproc]] (when a parent reaps its child in [[kwait]]), the end of [[kexec]] (the old
      image) and [[kexec]]'s `bad:` path (a half-built new image, which may already have its
      first stack page). The reference adds one line there:
      `uvmunmap(pagetable, USTACKBASE, USERSTACK, 1)`, which frees whatever is mapped in the
      region and skips the rest. gdb saw it free 18 pages for the `deep` child, 3 for the `read`
      child and 64 for the `overflow` child.

      Forget it entirely and the kernel panics with `freewalk: leaf` at the first exec of a
      process that has a stack page (clinic 2's `why`: `init`'s child exec'ing `sh`). Unmap the
      region without freeing it (`do_free` 0) and nothing panics: the pages are simply lost
      (clinic 2).
    checks:
      - id: lab13-07
        level: 2
        type: number
        q: |
          `growstack fork` forks at the bottom of 65 frames of 1,088 bytes each (the frame
          `dive` allocates), which started near the top of the stack. How many stack pages did
          [[uvmcopy]] copy for that fork?
        answer: 18
        wrong:
          64: |
            You may have thought fork copies the whole region. [[uvmcopy]] skips pages that are
            not mapped; only the 18 pages the stack has grown into are copied.
          17: |
            You may have counted only the pages the faults grew. The top page, which pid 5
            inherited through fork (exec grew it in `growstack` itself), is copied too.
          1: |
            That is a fork from the shell, whose stack never grew. Here the parent is deep in
            its recursion.
        why_wrong: "65 frames of 1,088 bytes is 70,720 bytes plus a little for main and fork1: a bit over 17 pages, so 18 pages are mapped."
        explain: |
          gdb read the parent's page table at the call: 18 valid PTEs from `0x3ffffec000` to
          `0x3fffffd000`. The `deep` check, which recurses the same way without forking, printed
          `65 calls used 70944 bytes of stack`, and its address space was freed with 18 stack
          pages.
      - id: lab13-08
        level: 2
        type: choice
        q: |
          A kernel has everything right except that [[kfork]] still copies only `[0, p->sz)`.
          It boots to the shell prompt. You type `growstack`. What do you see?
        options:
          - text: "Another \"$ \" prompt, then usertrap(): unexpected scause 0xf with stval=0x0, then the next prompt; growstack never runs."
            correct: true
            why: |
              The shell's child returns from `fork1` with a return address loaded from its
              empty, zero-filled stack, jumps to address 0 (which is `getcmd` in `sh`), prints
              a prompt, and dies storing to address 0, which is read-only text.
          - text: "growstack: fork: FAIL, and the other checks pass."
            why: |
              You may have expected the test to catch it. The bug strikes earlier: every fork
              loses the stack, including the shell's fork that would have run `growstack`.
          - text: "panic: freewalk: leaf"
            why: |
              That is the bug of not *freeing* the stack. Here every page that is mapped is also
              freed; the child simply never got the stack pages.
          - text: "Nothing: the child faults on its stack and is killed silently."
            why: |
              The child's stack accesses do not fault fatally: [[vmfault]] grows zero pages
              for them. The child runs on, with zeros for its saved registers.
        explain: |
          Clinic 1 is this run. The machine still boots because `init`'s child calls `exec`
          without returning from any function first, and `exec` builds a fresh stack.
  - title: Where exactly does the stack stop?
    q: |
      Name every limit and what enforces it: how far down the stack may grow, what happens one
      byte below that, how the heap is kept out of the gap, and how much of the stack `exec` may
      fill with arguments. At each boundary, check the comparison for an off-by-one.
    hints:
      - |
        Three numbers: the lowest stack address, the highest heap address, and the room for
        arguments ([[kernel/exec.c:97]], [[kernel/exec.c:104]]; and [[user:bigargtest]]). The
        heap has two ways to grow: [[growproc]] ([[kernel/proc.c:243]]) and the lazy path in
        [[sys_sbrk]] ([[kernel/sysproc.c:60]]).
      - |
        A guard works only if nobody can map it: not the stack (its lower bound in [[vmfault]]),
        and not the heap (both `sbrk` paths). And a guard of one page stops a stack that grows
        a few bytes at a time; think about a single frame larger than a page.
      - |
        The stack: `[USTACKBASE, USTACKTOP)` in [[vmfault]]. The heap: `sz + n > MAXHEAP`
        refused in both `sbrk` paths. Arguments: `stackbase = USTACKTOP - PGSIZE`, unchanged
        in spirit.
    answer: |
      | limit | value | enforced by | one past it |
      |---|---|---|---|
      | lowest stack address | `USTACKBASE` = `0x3ffffbe000` | [[vmfault]]: `va < USTACKBASE` is not a stack address | a touch at `0x3ffffbdfff` is in the guard: killed |
      | highest heap end | `MAXHEAP` = `0x3ffffbd000` | [[growproc]] and the lazy path of [[sys_sbrk]]: `sz + n > MAXHEAP` → -1 | `sbrk` refuses; `p->sz` never covers the guard |
      | arguments | one page below `USTACKTOP` | [[kexec]]: `sp < stackbase` → fail | `exec` returns -1, as `bigargtest` expects |

      gdb saw both `sbrk` refusals in `growstack collide` (pid 6, heap at `0x3ffffbd000`):
      [[sys_sbrk]]'s lazy path with `addr + n` = `0x3ffffbd001`, and [[growproc]] with `sz` =
      `0x3ffffbd000`, `n` = `0x1000`. The one-byte case matters: `MAXHEAP` itself is allowed as
      the end (the heap's last byte is `0x3ffffbcfff`), and one byte more is not.

      `growstack overflow` shows the stack's limit from the other side. Each frame of `dive` is
      1,088 bytes; the deepest frame that reported its `sp` had `sp` = `0x3ffffbe330`, 816 bytes above
      `USTACKBASE`. The next frame's first store below `USTACKBASE` (`stval=0x3ffffbdef8`, in
      the guard page) was refused and the child was killed, with exactly 64 stack pages mapped.

      The guard has a known hole: it is one page. A function whose frame is larger than a page
      can move `sp` past the guard in one step, and its first store can land in a heap page that
      is already mapped, with no fault at all. The same was true of the original guard page. (Not
      run here; real systems add a larger gap, or make the compiler touch every page of a large
      frame in order, which is called stack probing.)

      Off by one page in either direction is a real bug. A heap ceiling of `USTACKBASE`
      instead of `MAXHEAP` leaves no guard (clinic 5). A stack test of `va >= USTACKTOP` alone,
      with no lower bound, lets the stack grow over anything above `p->sz` (clinic 3).
    checks:
      - id: lab13-09
        level: 3
        type: tf
        q: |
          True or false: on the reference branch, with the heap grown to `MAXHEAP` and the stack
          grown to its limit, any further stack growth is caught by the guard page and kills the
          process.
        answer: false
        why_tf: |
          You may have thought a guard page catches every overflow. It catches every access
          *inside* it; an access that skips over it is not caught.
        reasons:
          - text: "A single frame larger than 4 KiB can move sp past the guard, and its first store can land in a mapped heap page without any fault."
            correct: true
            why: "Right. The guard is one page wide, so it only stops growth that touches it."
          - text: "vmfault grows the stack into the guard page when the heap has not reached it."
            why: |
              [[vmfault]] never accepts an address below `USTACKBASE` as a stack address; the
              guard page is never mapped by anyone.
          - text: "sbrk can always map the guard page later, so the guard is not reliable."
            why: |
              Both `sbrk` paths refuse to move `p->sz` past `MAXHEAP`, which is the guard's
              lower edge.
        explain: |
          The same limit applies to the original guard page, and to every one-page guard,
          including the kernel stacks' ([[kernel/memlayout.h:50]]). See [[g:guard-page]].
      - id: lab13-10
        level: 2
        type: number
        q: |
          `growstack overflow` recurses until it is killed. How many stack pages does the child
          have when its address space is freed?
        answer: 64
        wrong:
          65: |
            You may have counted the guard page. It is never mapped; the store into it is what
            killed the child.
          63: |
            You may have left out the top page, which the child inherited through fork (exec
            grew it in the parent) rather than grew by a fault. It is part of the region and is
            freed with it.
          18: |
            That is the `deep` and `fork` checks, which stop after 65 frames.
        why_wrong: "The stack grows until every page of the 64-page region is mapped; the next frame's store is in the guard."
        explain: |
          gdb read the child's page table in [[proc_freepagetable]], called from [[freeproc]] in
          the parent's [[kwait]]: 64 valid PTEs, `0x3ffffbe000` to `0x3fffffd000`. 63 of them
          were grown by page faults; 1, the top page, came through fork (exec grew it in the
          parent).
  - title: What does usertests think?
    q: |
      Some tests in `usertests` know the old layout. Find each test that depends on where the
      stack, its guard or the heap's ceiling is. For each one, decide: does the property it
      checks still hold (then it must pass unchanged), or did this lab change that property on
      purpose (then change the expectation, as little as possible, and say why)?
    hints:
      - |
        Search `user/usertests.c` for `USERSTACK`, `TRAPFRAME`, `r_sp` and literal addresses
        near `0x3fffff…`; also find the test that checks exec's argument limit.
      - |
        `stacktest` reads `USERSTACK` pages below its `sp`; what is there on the branch, given
        what `USERSTACK` now means? Which of `lazy_copy`'s "must fail" addresses are now legal?
      - |
        One test passes untouched because of what `USERSTACK` means now; one changes its
        ceiling from `TRAPFRAME` to `MAXHEAP`; one replaces two addresses that are now stack
        pages with two that must still fail; one keeps passing because exec's argument limit
        stayed one page.
    answer: |
      | test | what it assumed | on the branch |
      |---|---|---|
      | `stacktest` | the page below the stack is a guard | reads `USERSTACK * PGSIZE` (256 KiB) below `sp`: below `USTACKBASE`, in the guard. Still killed, **unchanged** |
      | `lazy_sbrk` | the heap may grow up to `TRAPFRAME` | ceiling is `MAXHEAP` now: `TRAPFRAME` → `MAXHEAP` in two places, **changed** |
      | `lazy_copy` | `read`/`write` at `0x3fffffc000` and `0x3fffffd000` must fail | those are stack pages now (`0x3fffffd000` is the one every process has); probes replaced by `MAXHEAP - PGSIZE` and `MAXHEAP` (the guard), which must fail, **changed** |
      | `bigargtest` | arguments larger than a page make `exec` fail | the argument area is still one page, **unchanged** |
      | `copyin`, `copyout`, `copyinstr1`, `nowrite` | `0x3fffffe000` (`TRAPFRAME`) is not user memory | `USTACKTOP` is exclusive, and the page is mapped without `PTE_U`; still refused, **unchanged** |

      `stacktest` is the nicest case. It was written as "read one stack's worth below `sp`", with
      `USERSTACK` meaning the stack's size. With `USERSTACK` meaning the maximum, the same
      expression lands just below the maximum, which is exactly the overflow the new guard must
      catch. On the branch it faulted at `stval=0x3ffffbde90`, in the guard page; with the old
      layout (commit 1) at `stval=0x10e90`.

      The `lazy_copy` change is the one to defend. The test wants "addresses that are not this
      process's memory". `0x3fffffd000` was such an address and is now the top stack page of
      every process: a `read` into it succeeds (it would write into the test's own unused stack
      space). The replacements keep the intent: the last page the heap could have but does not,
      and the guard. Keeping the old addresses would have meant putting the stack somewhere
      other than the top for no reason except the test.
    checks:
      - id: lab13-11
        level: 2
        type: match
        q: |
          Match each `usertests` test with what the branch does about it.
        pairs:
          - left: "stacktest"
            right: "passes unchanged: USERSTACK pages below sp is now the guard below the limit"
            why: "With USERSTACK the maximum, `sp - USERSTACK * PGSIZE` is below `USTACKBASE`."
          - left: "lazy_sbrk"
            right: "expects MAXHEAP instead of TRAPFRAME as the heap's ceiling"
            why: "sbrk refuses to grow past MAXHEAP; the test walks the heap up to its ceiling."
          - left: "lazy_copy"
            right: "probes MAXHEAP - PGSIZE and MAXHEAP instead of two addresses that are now stack"
            why: "`0x3fffffd000` is the top stack page now; a read into it succeeds."
          - left: "bigargtest"
            right: "passes because exec's arguments must still fit in one page"
            why: "31 arguments of 400 bytes need 12,400 bytes; exec refuses at `sp < stackbase`."
        explain: |
          Two tests change their expectations, each because the lab changed the property on
          purpose; the others still test something true and pass unchanged. `usertests -q`
          printed `ALL TESTS PASSED` on 3 harts at every one of the branch's seven commits.
      - id: lab13-12
        level: 1
        type: choice
        q: |
          `stacktest`'s child reads at `sp - USERSTACK * PGSIZE`. On the branch, where is that?
        code: user/usertests.c:2442-2461@2449-2452
        options:
          - text: "In the guard page below USTACKBASE, so the read faults and the child is killed."
            correct: true
            why: |
              `sp` is in the top stack page; 64 pages below it is the page below the region,
              which nothing maps.
          - text: "In an ungrown stack page, so the read returns 0 and the test fails."
            why: |
              You may be thinking of `USERSTACK` as 1, the old value. With 64 the address
              is past the whole region.
          - text: "In the heap, so the read succeeds."
            why: |
              The heap of `usertests` ends far below; between its end and the guard nothing is
              mapped, and the address is in the guard anyway.
          - text: "Below MAXVA's user half, so the kernel panics."
            why: |
              The address is an ordinary user address (`0x3ffffbde90` in the recorded run). A
