    note: |
      [[usertrap]] did not change in this lab. The fault (`scause` 15, `stval` `0x3ffffbdef8`)
      goes to [[vmfault]] as always; `0x3ffffbdef8` is above `p->sz` (`0x3000`) and below
      `USTACKBASE`, so [[vmfault]] returns 0, and the `else` branch prints the two lines and
      marks the process killed. gdb stopped at the `setkilled` call (line 78), right after
      the two lines were printed, and read exactly these values from `scause` and `stval`.

      The child exits, and its parent reaps it in [[kwait]]. gdb read the child's page table in
      [[proc_freepagetable]] at that moment: 64 valid stack PTEs, `0x3ffffbe000` to
      `0x3fffffd000`, the whole region, all freed by commit 2's line. 63 were grown by page
      faults; the top one came through fork (exec grew it in the parent).

      What did the lab cost? Seven commits: three constants, one condition in [[vmfault]], a
      range for [[uvmcopy]], one line in [[proc_freepagetable]], a widened test in
      [[fetchaddr]], a shorter [[kexec]], and two changed expectations in `usertests`. What
      it took to find them: every place the kernel says "the process's memory" by `[0, p->sz)`,
      found by asking, for each one, whether it still sees the whole process.
    others: |
      The kill only marks this process; the other harts are unaffected. Its parent (pid 3) is
      reading the pipe. When the child's [[kexit]] closes the write end, [[pipeclose]] wakes it,
      `read` returns 0, and the parent then calls `wait` and reaps the zombie; the 64 stack pages
      return to the free list then, under `wait_lock` and the child's `p->lock`, as in the step
      "Every teardown frees the stack region".
verify: |
  On the branch (`ext/13-growstack`, 7 commits), built with the project toolchain and run on
  3 harts (`-smp 3 -m 128M`), one boot:

  ```text
  $ growstack
  growstack: deep: 65 calls used 70944 bytes of stack
  growstack: deep: OK
  growstack: fork: OK
  growstack: read: OK
  usertrap(): unexpected scause 0xf pid=8
              sepc=0x36a stval=0x3ffffbdef8
  growstack: overflow: status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000: OK
  usertrap(): unexpected scause 0xf pid=9
              sepc=0xce stval=0x3ffffbd000
  growstack: collide: OK
  growstack: ALL OK
  $ usertests -q
  usertests starting
  test copyin: OK
  [...]
  test stacktest: usertrap(): unexpected scause 0xd pid=6569
              sepc=0x1c40 stval=0x3ffffbde90
  OK
  [...]
  test lazy_copy: OK
  test lazy_copyinstr: OK
  test lazy_sbrk: OK
  test partial_write: OK
  test unlinkcwd: OK
  ALL TESTS PASSED
  $ growstack
  growstack: deep: 65 calls used 70944 bytes of stack
  growstack: deep: OK
  growstack: fork: OK
  growstack: read: OK
  usertrap(): unexpected scause 0xf pid=6661
              sepc=0x36a stval=0x3ffffbdef8
  growstack: overflow: status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000: OK
  usertrap(): unexpected scause 0xf pid=6662
              sepc=0xce stval=0x3ffffbd000
  growstack: collide: OK
  growstack: ALL OK
  ```

  The two `usertrap()` lines in each `growstack` run are the expected kills: the `overflow`
  child's store into the guard page below the stack (`stval` `0x3ffffbdef8`), and the
  `collide` child's store into the guard page above the heap (`0x3ffffbd000`, its first byte).
  Both are the same page, seen from two sides. In `usertests`, `stacktest`'s kill is the guard
  doing its job; `usertests -q` passing shows that bad pointers, the trapframe, the trampoline,
  `MAXVA`, lazy and eager `sbrk`, `exec`'s argument limit and memory accounting all still work.

  Every commit builds with `make kernel/kernel fs.img`, and `usertests -q` printed `ALL TESTS
  PASSED` on 3 harts at each of the 7 commits. At commits 1-5 (old layout, with `growstack`
  added to the tree) `growstack` printed `deep`, `fork`, `read` and `overflow` `FAIL` and
  `collide` `OK`; from commit 6 on, `ALL OK`.
measure: |
  A counting copy of the branch (instrumentation not on the branch) counted every stack page
  grown, and how many of them came from page faults, and recorded, for every address space
  freed, how many stack pages it had. A counting copy of the original kernel printed only free
  pages. Both printed their counters on Ctrl-P; one boot each.

  **Who uses how much stack.**

  | command | stack growths (by page faults) | address spaces freed, by stack pages |
  |---|---|---|
  | boot and `echo hi` | 3 (0) | 1 page: 3 (and one empty: the first process's, before its exec) |
  | `growstack deep` | 18 (17) | 1 page: 2, 18 pages: 1 |
  | `growstack` (all five checks) | 100 (97) | 1 page: 3, 3 pages: 1, 18 pages: 3, 64 pages: 1 |
  | `usertests -q` | 3 (0) | 1 page: 6,649 |

  Every growth that did not come from a page fault came from a kernel copy: one for each
  `exec` that got as far as copying its arguments ([[copyout]] into the new page table), and
  two in `growstack read` ([[copyout]] from [[piperead]]).
  `growstack`'s 97 faults are 17 (deep) + 17 (fork) + 63 (overflow). The forked grandchild in
  the `fork` check grew nothing: [[uvmcopy]] gave it all 18 pages.

  The `usertests -q` row is the interesting one. 6,649 address spaces were torn down during the
  run, and every one had exactly one stack page: no test in `usertests` ever needed more than
  4 KiB of stack. That is why the original layout was enough for xv6's own programs, and why a
  growable stack costs them nothing. Each of them uses one stack page, as before, and no guard
  page.

  **Memory.** Free pages after boot, with `init` and `sh` running: 32,545 on the original
  kernel, 32,547 on the branch. The 2 pages are the two old guard pages, which [[uvmalloc]]
  allocated and [[uvmclear]] only hid from user mode. The same page was also copied by every
  `fork`, since it lies below `sz`: on the original kernel each of `usertests`' thousands of
  forks copied two pages of stack (the guard and the stack), on the branch one. (That last
  point is reasoned from [[uvmcopy]], not counted.)
further: |
  - **Shrink the stack.** Pages the stack grew into stay mapped until exit, even after the
    recursion returns. Free pages below `sp` on some event (a system call, a timer tick), and
    think about what makes it safe: can the program still use memory below its own `sp`?
    (RISC-V's calling convention has no "red zone", but check what the compiler does.)
  - **Close the guard's hole.** A frame larger than a page can jump over a one-page guard. Make
    the gap larger, or check at fault time that the address is not far below the faulting
    `sp`, and write a test with a 64 KiB local array near the limit.
  - **A per-process limit.** Replace the constant with a field set by a new system call
    (`setstacklimit`), as Unix does with `RLIMIT_STACK`. Which of the places you changed now
    need the process instead of a constant, and how does fork inherit the limit?
  - **Randomize the top.** Start the stack a random number of pages below `USTACKTOP` at each
    exec. What does that defend against, and what in this lab would have to learn the
    per-process top?
  - **Copy-on-write stacks.** With lab 11, fork would share the stack pages instead of copying
    them. The `fork` check here scribbles over every frame in the child: what does that cost
    under copy-on-write, page by page?
