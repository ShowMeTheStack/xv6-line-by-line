      [[growproc]] used to refuse growth past `TRAPFRAME`; now the ceiling is `MAXHEAP`. If it
      did not, [[uvmalloc]] would map pages over the guard and then over the stack region, and
      the two would meet.

      gdb stopped at the refusal (`return -1` on line 244, address `0x80001c70` in this build)
      in the `collide` child, which had already grown its heap lazily to the ceiling: `sz` =
      `0x3ffffbd000`, `n` = `0x1000`, `sz + n` = `0x3ffffbe000`, which is `USTACKBASE`. One page
      more would have been the guard. `MAXHEAP` itself is an allowed end: the heap's last byte
      is then `0x3ffffbcfff`.

      No lock is taken: `p->sz` and the page table are private to the process (the comment in
      `struct proc` says so, [[kernel/proc.h:95]]), and a process has one thread, which is here.
      Interrupts are on, because this is a system call, and [[usertrap]] turned them on before
      calling [[syscall]].
    others: |
      The other harts run other processes. If this call had succeeded, [[uvmalloc]] would take
      pages from [[kalloc]] under `kmem.lock`, the only shared state on this path; the page
      table being edited belongs to pid 6 alone.
