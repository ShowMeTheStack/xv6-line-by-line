build: |
  **Start.**

  ```text
  git checkout -b my-13 06aad25
  ```

  **Milestones, in an order that keeps `usertests -q` passing after each one.** The trick is
  to prepare every piece of code that will have to know about the stack region *before* the
  stack moves there; until the last kernel milestone the region is empty, so each new piece is
  tested by the existing suite while it carries no weight. (The reference branch has the same
  changes, with the test program committed last; `usertests -q` passed on 3 harts at every one
  of its commits.)

  1. **Name the layout.** Three constants in `memlayout.h` for the stack's top, its lowest
     page and the heap's ceiling (leave `USERSTACK` at 1 for now). Lower the ceiling in
     [[growproc]] and in [[sys_sbrk]]'s lazy path, and update the one test that walks the heap
     up to its ceiling. Test: `usertests -q`.
  2. **Write the test program now**, `user/growstack.c` with the spec's five checks, and add
     `$U/_growstack\` to `UPROGS`. On this kernel `deep`, `fork`, `read` and `overflow` print
     `FAIL` and `collide` prints `OK`: that is the test working.
  3. **Free the region.** One line in [[proc_freepagetable]]. Test: `usertests -q`.
  4. **Copy the region in fork.** A range for [[uvmcopy]], two calls in [[kfork]], and the
     child's `sz` set before anything can fail. Test: `usertests -q`.
  5. **Grow on demand.** The region test in [[vmfault]]. One of `lazy_copy`'s probes
     (`0x3fffffd000`) now points into the one-page region and will succeed; the other
     (`0x3fffffc000`) joins the region at milestone 7. Replace both with `MAXHEAP - PGSIZE` and
     `MAXHEAP`. Test: `usertests -q`.
  6. **Let `exec` find arguments on the stack**: [[fetchaddr]]. Test: `usertests -q`.
  7. **Move the stack.** [[kexec]] stops mapping a guard and a stack page after the image and
     starts `sp` at the top; `USERSTACK` becomes the maximum. Test: `growstack`, then
     `usertests -q`, then `growstack` again.

  **Debugging advice.**

  - A process killed with `stval` in the region (`0x3ffffbe000`-`0x3fffffdfff`) means
    [[vmfault]] refused a stack address; one killed with `stval` 0 and a `sepc` in a function
    such as `memset` or sh's `getcmd` usually means it returned through a zeroed frame: look at the
    fork path.
  - `panic: freewalk: leaf`: break on `panic`, run `bt`, and read the leaf's page table. With
    gdb attached, a small Python helper that walks the three levels of a page table from a
    `pagetable_t` (reading physical memory, which the kernel maps one to one) lists which
    pages are still mapped; for a stack bug they are in `0x3ffffbe000`-`0x3fffffd000`.
  - To watch growth, break on the [[kalloc]] call in [[vmfault]] with a condition on `va`
    (`va >= 0x3ffffbe000 && va < 0x3fffffe000`) and print `bt`: the second frame tells you
    whether a fault ([[usertrap]]) or a kernel copy ([[copyout]] from [[piperead]],
    [[kexec]], …) grew the page.
  - The kernel's `printk` prints hex in lower case and user `printf` in upper case, so the
    same address appears as `0x3ffffbe000` and `0x3FFFFBE000`.
clinic:
  - bug: fork copies only the pages below p->sz
    change: |
      Milestone 4 is skipped: [[kfork]] still copies one range.

      ```diff
      -  if (uvmcopy(p->pagetable, np->pagetable, 0, p->sz) < 0 ||
      -      uvmcopy(p->pagetable, np->pagetable, USTACKBASE, USTACKTOP) < 0) {
      +  if (uvmcopy(p->pagetable, np->pagetable, 0, p->sz) < 0) {
      ```
    symptom: |
      xv6 kernel is booting

      hart 1 starting
      hart 2 starting
      init: starting sh
      $ growstack
      $ usertrap(): unexpected scause 0xf pid=3
                  sepc=0xa70 stval=0x0
      $ usertests -q
      $ usertrap(): unexpected scause 0xf pid=4
                  sepc=0xa70 stval=0x0
      $
    why: |
      The child gets no stack pages at all, and it does not notice at first. When it
      returns from `fork`, its first access to the stack is a load, which faults; [[vmfault]]
      sees an address in the stack region and hands it a fresh *zero* page. The child carries
      on, with zeros where its frames were.

      In `sh` the fork is wrapped in `fork1`, which ends `ld ra,8(sp)` / `ret` (`user/sh.asm`,
      `0x7a`-`0x80`). The child loads `ra` = 0 and returns to address 0, which is `getcmd`, the
      first function in `sh`. `getcmd` prints `$ ` (the second prompt on each line above) and
      calls `memset(buf, 0, nbuf)` with `buf` = `a0` = 0, the child's return value from `fork`.
      `memset`'s store at `0xa70` (`sb a1,0(a5)`) writes to address 0, which is read-only text:
      store page fault, `stval=0x0`, killed. The parent shell then prints its own prompt. (This
      chain is read from `sh.asm`; the console lines are the recorded run.)

      Every command dies this way, so `growstack` never runs. The machine still boots because
      `init`'s child goes from `fork` straight to `exec("sh", argv)` in `main`, and `main` loads
      nothing from its stack on that path (`user/init.asm`, `0x38`-`0xa6`); `exec` builds a new
      stack. A missing stack copy does not crash the kernel: the zero page makes it a quiet
      corruption of the child, which is worse.
  - bug: Stack pages are unmapped but not freed
    change: |
      Milestone 3 with the wrong last argument: the pages leave the page table but are never
      given back to [[kalloc]].

      ```diff
      -  uvmunmap(pagetable, USTACKBASE, USERSTACK, 1);
      +  uvmunmap(pagetable, USTACKBASE, USERSTACK, 0);
      ```
    symptom: |
      $ growstack
      growstack: deep: 65 calls used 70944 bytes of stack
      [...]
      growstack: ALL OK
      $ usertests -q
      usertests starting
      test copyin: OK
      [...]
      test sbrkfail: sbrkfail: failed sbrk leaked memory
      FAILED
      SOME TESTS FAILED
    why: |
      Nothing panics, because the PTEs are cleared, so [[freewalk]] finds no leaf. But every
      exit and every exec loses at least one physical page (the top stack page every process
      has), and every page a deep recursion grew: `growstack`'s `overflow` child alone takes 64
      with it. `usertests` forks thousands of processes, and memory runs out quietly. `sbrkfail` noticed first: it forks ten children that each try to take 100 MB; a
      child whose `sbrk` fails gives back what it got. While they all still sit there, the
      parent asks for one page ([[user/usertests.c:2241]]). With thousands of pages leaked
      there is none left.
      In another boot of the same kernel, `sbrkfail` happened to pass, and `usertests` caught the leak at its final
      count instead: `FAILED -- lost some free pages 25710 (out of 32353)`.

      Leaving the line out entirely is louder. That kernel (also run) panics at boot, right
      after `init: starting sh`, with `panic: freewalk: leaf`; gdb's backtrace:
      `freewalk ← freewalk ← freewalk ← uvmfree (sz=8192) ← proc_freepagetable ← kexec
      (path "sh") ← sys_exec`. `init`'s child (pid 2) is exec'ing the shell, and the old image
      it frees, a copy of `init`'s, has one stack page that nobody unmapped. [[freewalk]] only
      frees page-table pages and panics on any leaf it finds ([[kernel/vm.c:276]]): a leak
      check built into the code.
  - bug: The stack has no lower limit
    change: |
      The region test in [[vmfault]] only checks the top:

      ```diff
      -  if (va >= psz && (va < USTACKBASE || va >= USTACKTOP))
      +  if (va >= psz && va >= USTACKTOP)
           return 0;
      ```
    symptom: |
      $ usertests -q
      usertests starting
      test copyin: write(fd, 0x0000000080000000, 8192) returned 8192, not -1
      panic: freewalk: leaf

      # another boot of the same kernel
      $ growstack
      growstack: deep: 65 calls used 70944 bytes of stack
      growstack: deep: OK
      growstack: fork: OK
      growstack: read: OK
      usertrap(): unexpected scause 0xf pid=8
                  sepc=0x36a stval=0x3ff812dcb8
      panic: freewalk: leaf
    why: |
      Now *every* unmapped address between `p->sz` and the trapframe is a "stack" address.
      `usertests copyin` passes `0x80000000` to `write` and expects -1. [[copyin]] finds the
      page missing, [[vmfault]] maps a zero page there, and `write` writes 8,192 zeros to the
      file. The test fails and its process exits. When `usertests` reaps it, gdb's backtrace
      reads `freewalk ← freewalk ← freewalk ← uvmfree (sz=65536) ← proc_freepagetable ←
      freeproc ← kwait ← sys_wait`: [[proc_freepagetable]] freed the stack region and
      `[0, sz)`, but the pages at `0x80000000` are in neither, so [[freewalk]] finds them and
      panics.

      `growstack overflow` shows the other half. The recursion never meets a limit; it grows
      the stack page by page, far below `USTACKBASE`, until [[kalloc]] runs out of memory:
      `stval=0x3ff812dcb8` is about 127 MiB below the top (32,464 pages), nearly all of the
      machine's free memory (32,547 pages are free after boot). Only then does [[vmfault]] return 0 and the process die, and again the pages
      below the region are never freed.

      In a program with a big heap the stack would also grow straight into it: a heap page
      that is mapped never faults, so a deep recursion would silently overwrite heap data,
      and an eager `sbrk` into a page the stack had taken would panic with `mappages: remap`.
      (Reasoned from the code, not run.) A limit is not a nicety: the kernel's own bookkeeping
      (what to copy, what to free) depends on knowing where the stack can be.
  - bug: The stack grows only in usertrap
    change: |
      The learner adds a branch to [[usertrap]] that maps a page when `stval` is in the
      region, leaves [[vmfault]] unchanged, and lets [[kexec]] map the first stack page itself
      (it can no longer rely on [[copyout]] to grow it):

      ```diff
         } else if ((r_scause() == 15 || r_scause() == 13) &&
      +             r_stval() >= USTACKBASE && r_stval() < USTACKTOP &&
      +             uvmalloc(p->pagetable, PGROUNDDOWN(r_stval()),
      +                      PGROUNDDOWN(r_stval()) + PGSIZE, PTE_W) != 0) {
      +    // grew the stack
      +  } else if ((r_scause() == 15 || r_scause() == 13) &&
                    vmfault(p->pagetable, p->sz, r_stval(),
      ```

      ```diff
         sz = PGROUNDUP(sz);
      +  if (uvmalloc(pagetable, USTACKTOP - PGSIZE, USTACKTOP, PTE_W) == 0)
      +    goto bad;
         sp = USTACKTOP;
      ```
    symptom: |
      $ growstack
      growstack: deep: 65 calls used 70944 bytes of stack
      growstack: deep: OK
      growstack: fork: OK
      growstack: read: FAIL
      usertrap(): unexpected scause 0xf pid=8
                  sepc=0x36a stval=0x3ffffbdef8
      growstack: overflow: status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000: OK
      usertrap(): unexpected scause 0xf pid=9
                  sepc=0xce stval=0x3ffffbd000
      growstack: collide: OK
      growstack: SOME FAILED
      $ usertests -q
      usertests starting
      [...]
      ALL TESTS PASSED
    why: |
      Every stack access *by the program* works: each one that misses traps into [[usertrap]],
      which grows the page. But `read` does not trap. [[piperead]] calls [[copyout]], which
      looks the page up with [[walkaddr]], finds it missing and asks the unchanged [[vmfault]],
      which refuses an address above `p->sz`. [[copyout]] returns -1, [[piperead]] returns -1
      for the first byte ([[kernel/pipe.c:133]]), and `read` fails. A real program sees a
      system call fail on a perfectly good local buffer, and only when the buffer happens to lie
      in a page the program has not touched yet.

      `usertests` passes: none of its system calls writes into a stack page that has not been
      touched. That is why the lab's test has a `read` check with an untouched buffer.

      Without the [[kexec]] change the same learner gets a louder failure (also run): the
      boot stops at `panic: exec`, because the very first [[kexec]], `init`'s from [[forkret]],
      cannot copy `"/init"` onto a stack with no page, and [[forkret]] panics when it fails.
  - bug: No gap between heap and stack
    change: |
      An off-by-one page at the guard: the heap may grow right up to the stack's lowest page.

      ```diff
      -#define MAXHEAP    (USTACKBASE - PGSIZE)
      +#define MAXHEAP    USTACKBASE
      ```
    symptom: |
      $ growstack
      [...]
      growstack: overflow: status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000: OK
      growstack: collide: FAIL
      growstack: collide: heap checks passed, exit status 4
      growstack: SOME FAILED
      $ usertests -q
      usertests starting
      [...]
      test lazy_copy: read succeeded
      FAILED
      SOME TESTS FAILED
    why: |
      `growstack` and `usertests` are compiled with the same `memlayout.h`, so they see the
      wrong `MAXHEAP` too. `collide` grows the heap to it (`0x3ffffbe000`), finds that the next
      `sbrk` fails and that the heap's last byte works, and then stores to `MAXHEAP`, which it
      believes is the guard. But `0x3ffffbe000` is `USTACKBASE`, a legal stack page: [[vmfault]]
      grows it, the store succeeds, and the child exits with 4 instead of being killed. There is
      no guard any more. `lazy_copy` fails the same way: its probe at `MAXHEAP` is a stack page,
      and `read` into it succeeds.

      What it would do to a real program (reasoned): a process whose heap has reached the
      ceiling and whose stack overflows its limit writes into the heap's top page, which is
      mapped, so nothing faults and heap data is silently overwritten. The guard page exists so
      that the overflow lands in a page that nobody can map.
  - bug: fetchaddr still checks only p->sz
    change: |
      Milestone 6 is skipped:

      ```diff
      -  int inmem = addr < p->sz && addr + sizeof(uint64) <= p->sz;
      -  int instack = addr >= USTACKBASE && addr < USTACKTOP &&
      -                addr + sizeof(uint64) <= USTACKTOP;
      -  if (!inmem && !instack)
      +  if (addr >= p->sz ||
      +      addr + sizeof(uint64) > p->sz) // both tests needed, in case of overflow
           return -1;
      ```
    symptom: |
      $ growstack
      [...]
      growstack: ALL OK
      $ usertests -q
      usertests starting
      test copyin: OK
      [...]
      test exectest: exectest: exec echo failed
      exectest: nonzero wait status 1
      FAILED
      SOME TESTS FAILED
    why: |
      `exectest` builds its argument vector on its stack (`char *echoargv[] = {"echo", "OK",
      0};`, [[user/usertests.c:686]]) and calls `exec("echo", echoargv)`. [[sys_exec]] fetches
      each pointer with [[fetchaddr]] ([[kernel/sysfile.c:474]]), which compares the address
      (a stack address such as `0x3fffffde70`, where gdb found `echoargv` on the reference
      branch) with `p->sz` and refuses it. `exec` returns -1
      before it has opened `echo`.

      `growstack` passes because it never calls `exec`, and the shell passes because it builds
      `argv` inside a heap-allocated command structure. [[fetchstr]] would have worked: it has
      no bound of its own. Two functions with the same job, one with an extra check, is
      exactly the kind of code this lab makes you hunt for.
reveal:
  - title: Three constants describe the new layout
    commit: 1
    file: kernel/memlayout.h
    lines: 54-72
    focus: 65-72
    diff: true
    state:
      hart: any
      proc: "(definitions: used by sbrk now, and by vmfault, fork, exec and exit in later commits)"
      locks: []
    note: |
      The story of this tour was recorded with gdb on the finished branch, three harts: the
      machine boots, the shell runs `growstack`, whose children recurse, fork, read into
      untouched stack pages, overflow and collide, and later `usertests exectest`. Where a step
      shows code from an early commit, the machine state comes from those runs of the finished
      branch, where the same lines are executing.

      Commit 1 only names things. The stack region is the top `USERSTACK` pages below
      `TRAPFRAME`: `USTACKTOP` is its top (exclusive), `USTACKBASE` its lowest page, and
      `MAXHEAP`, one page lower still, is the highest end the heap may have. The page between
      `MAXHEAP` and `USTACKBASE` belongs to nobody: the guard.

      `USERSTACK` is still 1 here, so the region is the single page `0x3fffffd000` and
      `MAXHEAP` is `0x3fffffc000`. Nothing uses the region yet. Commit 6 raises `USERSTACK` to
      64, and the same three lines then give `0x3ffffbe000` and `0x3ffffbd000`.

      Why right under the trapframe? It is the highest address user code could use: the
      trapframe and the trampoline above it are mapped without `PTE_U`, so the stack's top page
      sits directly under a page the program cannot touch. And it is as far as possible from the
      heap, which starts near 0 and grows up. Because these are constants, every later question
      ("is this a stack address?", "which pages might the stack have?") is answered the same way
      for every process, with no new field in `struct proc`.
  - title: The eager heap stops below the guard
    commit: 1
    file: kernel/proc.c
    lines: 233-254
    focus: 242-245
    diff: true
    state:
