  - title: USERSTACK becomes a maximum
    commit: 6
    file: kernel/memlayout.h
    lines: 54-73
    focus: 54-73
    diff: true
    state:
      hart: any
      proc: "(definitions)"
      locks: []
    note: |
      `param.h` changes in the same commit: `#define USERSTACK 64 // max user stack pages`. The
      name stays and the meaning changes, from "the stack's size" to "the most it may grow to",
      256 KiB. With it the constants become `USTACKBASE` = `0x3ffffbe000` and `MAXHEAP` =
      `0x3ffffbd000`, and the layout comment now tells the truth: heap up to `MAXHEAP`, a guard
      page, then the stack, growing down from `USTACKTOP`.

      [[uvmclear]] is gone from `vm.c` and `defs.h`: it existed only to make the old guard page
      inaccessible. The new guard is a page that is never mapped at all, so it costs no memory.
      Right after boot the branch has 2 more free pages than the original kernel (32,547 against
      32,545): the guard pages of `init` and `sh`. Every fork also copies one page less, since
      [[uvmcopy]] used to copy the old guard page along with everything else below `sz`.

      Keeping the name was deliberate: `usertests stacktest` uses it (next step).
