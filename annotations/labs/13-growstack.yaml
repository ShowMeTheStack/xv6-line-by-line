      [[kfork]] copies the image and heap, `[0, p->sz)`, and then the stack region. The child
      inherits exactly the parent's stack pages; pages the parent never touched stay unmapped in
      the child too, and the child grows them on demand, as the parent would have.

      `np->sz = p->sz` moved *above* the copies. If the first copy succeeds and the second runs
      out of memory, [[freeproc]] frees the child's page table with [[proc_freepagetable]] and
      `np->sz`: with the old order `np->sz` would still be 0, the image pages would stay mapped,
      and [[freewalk]] would panic. The second [[uvmcopy]] has already cleaned up after itself,
      and [[proc_freepagetable]] frees the stack region whatever `sz` is.

      Without the second copy (clinic 1) nothing fails here. The child returns from `fork` with
      an empty stack region, [[vmfault]] gives it zero pages, and it runs on with zeros in place
      of its saved registers.
    others: |
      The parent is the only thread of its process and is busy here, so its stack cannot
      change during the copy: there is no race between copying page 3 and the program pushing
      a frame onto page 4. That argument depends on xv6 processes having one thread; with
      user threads (lab 9) a fork would have to stop or account for the other threads.
