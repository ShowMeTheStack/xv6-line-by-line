  - title: The test recurses through 18 pages
    commit: 7
    file: user/growstack.c
    lines: 20-88
    focus: 24-50
    diff: true
    state:
      hart: 0
      mode: U
      proc: growstack (pid 4, the deep check)
      intr: "on"
      satp: user
      locks: []
      stack: [main, deep, inchild, deep1, dive]
      sp: {"on": user, detail: "`0x3ffffecae0` at the deepest of 65 frames"}
    note: |
      `dive` has a 1 KiB `volatile` array, so the compiler must keep it in memory and write
      every byte; its frame is 1,088 bytes (`addi sp,sp,-1088` in `growstack.asm`). It fills its
      array with its depth, recurses, and on the way back checks the array and scribbles over it.
      Sixty-five frames are about 69 KiB, so the stack must grow by 17 pages beyond the top page
      the child inherited through fork (exec grew that one in `growstack` itself).

      The recorded run: `65 calls used 70944 bytes of stack`. The deepest `sp` was
      `0x3fffffe000 - 70944` = `0x3ffffecae0`, in page `0x3ffffec000`; the child's address
      space was freed with 18 stack pages. A counting copy of the kernel (instrumentation not on
      the branch) counted 18 stack growths for this command: 17 from the child's page faults, plus the
      one from `growstack`'s exec.

      Each check runs in its own child (`inchild`), so `growstack` itself keeps a one-page stack.
      That matters for `read` (its buffer must lie in pages *nobody* has touched, and a child
      inherits its parent's stack pages) and for `overflow` and `collide`, which are supposed to
      die.

      On the original layout (commit 1) this check dies at the first frame past the page:
      `usertrap(): unexpected scause 0xf pid=4`, `stval=0x3e28`, in `growstack`'s old guard page
      `0x3000`, and the line reads `deep: FAIL`.
  - title: Overflow, killed one frame above the limit
    commit: 7
    file: user/growstack.c
    lines: 175-214
    focus: 194-211
    diff: false
    state:
      hart: 0
      mode: U
      proc: growstack (pid 8, the overflow child)
      intr: "on"
      satp: user
      locks: []
      stack: [main, overflow, forever, dive]
      sp: {"on": user, detail: "`0x3ffffbe330`, the deepest frame that reported its `sp`"}
    note: |
      The child recurses without end and writes each frame's `sp` into a pipe; the parent keeps
      the last value it reads. When the child dies, the pipe's write end closes, `read` returns
      0, and the parent checks three things: the child was killed (status -1), its deepest frame
      is not below `USTACKBASE`, and it is within one frame (plus a little) of it, so the kill
      came at the limit and not earlier.

      Recorded: `status -1, deepest sp 0x3FFFFBE330, limit 0x3FFFFBE000` (user `printf` prints
      hex in upper case). `0x3ffffbe330` is 816 bytes above `USTACKBASE`; the next frame starts
      1,088 bytes lower, at `0x3ffffbdef0`, and its first store, at `sp + 8` = `0x3ffffbdef8`,
      is in the guard page. That is exactly the `stval` on the console.

      The program does not read `stval`; its `sp` window already pins the kill to the first frame
      below the limit. The next step is the kernel's side of that moment.
