      interrupts off (gdb: pid 1, `SIE` 0, `intena` 0); every later exec comes from
      [[sys_exec]] with interrupts on, as here. [[vmfault]] works either way: it never sleeps.
      If the page cannot be allocated, [[copyout]] fails and [[kexec]] goes to `bad:`.
    others: |
      `init` (pid 1) is, or will shortly be, waiting for this child in [[kwait]]. The new page table is not
      installed anywhere yet, so no hart can be using it; the only shared resource touched is
      the free list.
