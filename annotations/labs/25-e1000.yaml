  - title: Headers and byte order
    commit: 5
    file: kernel/net.h
    lines: 1-46
    focus: 5-21
    diff: true
    state:
      hart: any
      proc: "(the definitions)"
      locks: []
    note: |
      Every multi-byte field on the wire is big-endian; RISC-V is little-endian.
      `htons`/`htonl` reverse the bytes; `ntohs` and `ntohl` are the same operations under
      the names that say which way the value travels.

      The structs are `packed`: an IP header starts 14 bytes into the frame, so its
      32-bit addresses sit at offsets 26 and 30, not multiples of 4. Packed tells the
      compiler to assume nothing about alignment and to access them a byte at a time.

      gdb shows what byte order means in practice. In the recorded `net_tx_udp`, `print
      *udp` gave `sport = 53511, dport = 44904`: 53511 is `0xd107`, the bytes `07 d1` of
      port 2001 read back as a little-endian number; 44904 is the echo port (`ECHOPORT`) the
      same way.
      `ip_len = 7424` is `0x1d00`, 29 bytes. The fields are right; it is the debugger that
      reads them in the host's order.
