      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_send, net_tx_udp, e1000_transmit]
      sp: {"on": kernel, detail: "pid 4's kernel stack, `sp` = `0x3fffff7ef0`"}
    note: |
      The callers `sys_send` and `net_tx_udp` arrive in commits 6 and 5; this state was
      recorded at commit 7, where the function is the same, 4 lines further down. pid 4
      sends its one byte: at the "full?" test (line 116 here), `i` = TDT = 0, TDH = 0,
      `tx[0].status` = 1.

      The test has two halves, and both matter:

      - **The slot after TDT must not be TDH.** The card sends the slots from TDH up to,
        but not including, TDT, so TDT equal to TDH means "nothing to send". If the driver
        filled the 16th slot, TDT would move onto TDH and the card would see an empty ring
        holding 16 packets: it would send none of them, and no DD bit would ever come back.
        So one slot always stays empty, as on the receive ring. Clinic 6 shows the lock-up
        when this half is missing.
      - **The slot must be done (DD).** The card may have fetched the descriptor but not
        yet finished reading the packet; DD is its promise that it has.

      `e1000.lock` is the only lock here, taken in a system call after [[usertrap]] turned
      interrupts on: noff 1, intena 1, SIE 0 (gdb read `sstatus` = `0x200000020`). It
      serializes the harts that transmit; the card itself never sees it.

      In six measured runs of `nettest` (2,003 packets each) the test never refused: QEMU's
      card sends during the TDT write itself, so by the next call TDH has caught up (next
      step). The -1 path is for real hardware, where the card runs in parallel.

      Line 122, `io_fence()` after the test, keeps the reads and writes of the old slot
      from moving above the read of DD; the old page is freed only now (125-126).
    others: |
      Another hart may want the same lock at this moment: an ARP reply is sent from inside
      the e1000 interrupt ([[tour:44]]). It spins with interrupts off until pid 4 releases.
      In the measurement copy `e1000.lock` was contended 176 to 196 times per run of
      `nettest`, 26 to 44 of them by the interrupt handler.
