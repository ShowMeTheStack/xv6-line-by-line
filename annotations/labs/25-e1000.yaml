    commit: 6
    file: kernel/socket.c
    lines: 63-96
    focus: 68-95
    diff: true
    state:
      hart: 1
      mode: S
      proc: none (interrupt on an idle hart)
      intr: "off"
      satp: kernel
      locks: ["socket 2001's s->lock"]
      irq: {noff: 1, intena: 0}
      stack: [scheduler, kernelvec, kerneltrap, devintr, e1000_intr, net_rx, ip_rx, sock_rx]
      sp: {"on": scheduler, detail: "`sp` = `0x8000a600`, hart 1's slice of `stack0`"}
    note: |
      Recorded at line 94, the second e1000 interrupt of the run, on hart 1, which was
      idle: the echo of pid 4's byte (`sport` `ECHOPORT`, `len` 1) has been queued on port
      2001's socket (`n` = 1), and [[wakeup]] is next. noff 1: `socktab.lock` was released
      at line 76.

      [[wakeup]] runs with `s->lock` held and takes each process's `p->lock` in turn
      (noff 2 inside). It finds pid 4 with `chan` = `s` and makes it RUNNABLE. Because the
      append and the wakeup happen under the lock that `recv` holds while it checks the
      queue and registers on the channel (next step), the wakeup cannot fall between the
      two. Clinic 3 removes this lock and loses wakeups.

      A full queue drops the packet: the handler must not wait. No packet was dropped in
      the measured runs; every socket there had one packet in flight at a time.
    others: |
      The cost of waking under the lock, measured: about 1,500 contended acquisitions of
      socket locks per `nettest` run; in about 80% of them the waiter was a process, not
      the handler. In two boots, 42% and 26% came right after `sleep()` returned (the
      re-acquire, line 224 here): the woken process got a hart quickly and found `s->lock`
      still held, most likely by the handler still inside [[wakeup]]'s scan of all 64
      process slots. (Measured on a kernel without three of the branch's fixes, listed in
      Verify; the locking is the same.)
  - title: recv sleeps without losing the wakeup
    commit: 6
    file: kernel/socket.c
    lines: 185-247
    focus: 203-225
    diff: true
    state:
      hart: 2
      mode: S
      proc: nettest (pid 4)
      intr: "off"
      satp: kernel
      locks: ["socket 2001's s->lock"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_recv]
      sp: {"on": kernel, detail: "`sp` = `0x3fffff7f50`"}
    note: |
      Recorded at line 221, just before the interrupt of the "devintr" step: pid 4 on hart
      2, port 2001, `n` = 0, holding only its socket's lock (noff 1, intena 1: a system
      call).

      The loop is [[virtio_disk_rw]]'s, with `s` as the channel:

      1. give up if the port was unbound (and perhaps bound to another port) or the process
         killed (215-218): [[kkill]] makes a sleeper runnable but does not clear its
         channel, so the loop must look, also when packets are queued;
      2. stop waiting if a packet is queued (219-220);
      3. `sleep_prepare(s)` *while holding `s->lock`* (221);
      4. release, [[sleep]], re-acquire, around again (222-224).

      Any `sock_rx` for this socket either finished before the check (the queue is not
      empty) or waits for `s->lock` until step 3 is done, so its [[wakeup]] finds `p->chan`
      = `s` and clears it. [[sleep]] then returns at once, or wakes from SLEEPING. In this
      run the ARP interrupt hit pid 4's hart between line 222 and the
      `acquire` inside [[sleep]]; the echo came on hart 1.

      One window stays open, the same as in [[piperead]]: a `kill` after the `killed(p)`
      check and before [[sleep]] finds the process not yet SLEEPING, so it only sets
      `killed`; the process then sleeps until the next wakeup.

      After the loop the packet comes off the queue under the lock, and the copy to user
      space happens with no lock held (236-246): [[copyout]] may fault in a lazily
      allocated heap page, and there is no reason to make the interrupt handler wait for
      it.
  - title: The test, with a watchdog
    commit: 7
    file: user/nettest.c
    lines: 66-134
    focus: 117-134
    diff: true
    state:
      hart: any
      mode: U
      proc: nettest (pid 3) and its children
      intr: "on"
      satp: user
      locks: []
      stack: [main, run, parallel]
      sp: {"on": user}
    note: |
      The three-process check: three children, one per hart if the scheduler places them
      so, each with its own port (2010-2012), each doing 300 round trips with lengths from
      1 to 1472 bytes. Every byte of every echo is compared with what was sent, and
      the pattern depends on the child's number, so a packet delivered to the wrong
      socket fails the comparison.

      `run` (lines 69-90) forks the check and a watchdog that kills it after a time limit;
      a lost packet becomes `FAIL (timed out)` instead of a hang, and the next check still
      runs. This mattered: in Clinics 1, 3 and 5 the watchdog turned every stall into a
      line of output.

      Every check first calls `unbind` on its ports. A process left over from an earlier,
      failed run may still sleep in `recv` there; `unbind` wakes it and frees the port.
      Without that, one failure would make every later run fail at `bind`, which is a false
      claim of its own.

      The host side is `nettest.py` at the top of the tree: `echo PORT` sends every
      packet back; `ping FWDPORT N` times round trips to `nettest server N`.
verify: |
  On the branch (`ext/25-e1000`, 7 commits), built with the project toolchain and run on 3
  harts (`-smp 3 -m 128M`), with `python3 nettest.py echo ECHOPORT 600` on the host:

  ```text
  $ nettest ECHOPORT
  nettest: one round trip: OK
  nettest: 100 round trips: OK
  nettest: 3 processes x 300 round trips: OK
  nettest: kill wakes recv: OK
  nettest: dns: pdos.csail.mit.edu is 128.52.129.126
  nettest: dns query to 10.0.2.3: OK
  nettest: 1000 round trips of 64 bytes took 3 ticks
  nettest: ALL OK
  $ usertests -q
  usertests starting
  ALL TESTS PASSED
  $ nettest ECHOPORT
  nettest: one round trip: OK
  nettest: 100 round trips: OK
  nettest: 3 processes x 300 round trips: OK
  nettest: kill wakes recv: OK
  nettest: dns: pdos.csail.mit.edu is 128.52.129.126
  nettest: dns query to 10.0.2.3: OK
  nettest: 1000 round trips of 64 bytes took 1 ticks
  nettest: ALL OK
  ```

  And the host-side ping against `nettest server 1000`:

  ```text
  $ nettest server 1000
  nettest server: echoing 1000 packets on port 2000
  nettest server: done
  # on the host:
  nettest.py: 1000 round trips: OK
  ```

  Every commit was built on its own, and `usertests -q` printed `ALL TESTS PASSED` on 3
  harts at each of commits 1 to 6 as well. `nettest` printed `ALL OK` on all three boots
  of the head that ran it (the run above and two gdb traces). A kernel without three of
  the branch's fixes (the transmit "full" test, port 0, the port re-check in `recv`)
  passed the same sequence, and `nettest` on all 8 boots of its measurement copies.

  The fixes themselves were checked with scratch copies: Clinic 6's run for the
  transmit ring, and the port-0 frames described in the reveal step on sockets. Clinics 1
  to 5 were run on a kernel without those fixes; none of the fixes touches the code those
  clinics change.

  **DNS**: slirp's DNS server at `10.0.2.3` forwards queries to the DNS resolver the host
  itself uses, and every recorded run got an answer. On a host without a working
  resolver this check fails and the test says so (`ALL OK except dns`).

  What this demonstrates: packets go both ways through both rings, many times around;
  three processes on three harts send and receive at once without a packet reaching the
  wrong socket or a byte changing; `kill` ends a `recv`; and the rest of the kernel is
  unaffected. It does not demonstrate the absence of races: Clinic 3's lost wakeup passed
  9 of 9 runs without help, and Clinic 2's missing fences cannot fail on QEMU at all.
measure: |
  **Round-trip latency, from the host.** `nettest server 1000` in xv6, `nettest.py ping
  FWDPORT 1000` on the host, which times each round trip with `time.perf_counter`. The
  head and a kernel without the three fixes listed in Verify, booted alternately, three
  times each (measured while the computer was busy with other work; timings on QEMU
  depend on what else the computer is doing, so yours will differ):

  | kernel | boot | min | median | 99th percentile | max |
  |---|---|---|---|---|---|
  | before the fixes | 1 | 166 µs | 253 µs | 925 µs | 96,946 µs |
  | head | 1 | 131 µs | 243 µs | 345 µs | 19,155 µs |
  | before the fixes | 2 | 132 µs | 217 µs | 815 µs | 19,546 µs |
  | head | 2 | 137 µs | 219 µs | 848 µs | 38,970 µs |
  | before the fixes | 3 | 157 µs | 229 µs | 375 µs | 11,400 µs |
  | head | 3 | 122 µs | 149 µs | 275 µs | 40,566 µs |

  The extra register read of TDH in every transmit makes no difference that this
  measurement can see; the spread between boots of the same kernel is larger. On a
  quieter computer, three boots of the kernel without the fixes gave medians of 142, 163
  and 202 µs.

  A round trip crosses the host's kernel twice, slirp twice, the e1000 model twice, one
  xv6 interrupt, a wakeup, a context switch into the server, and two system calls. The
  rare maxima of 10-100 ms are host scheduling delays (QEMU's threads share the
  computer with other work). Inside xv6, `nettest`'s 1000 round trips of 64 bytes took 1
  to 4 ticks of about 0.1 s in the runs without gdb, which agrees within the clock's
  resolution.

  **Where the work and the waiting go.** A measurement copy (not on the branch, built
  without the three fixes, which change nothing these counters see) counts,
  per hart, e1000 interrupts, packets per interrupt, transmits, full transmit rings,
  dropped packets, and contended spinlock acquisitions (an [[acquire]] whose first
  `amoswap` failed); Ctrl-P prints and resets the counters. One run of `nettest` per
  boot, six boots:

  | per run | values |
  |---|---|
  | packets received / sent | 2,003 / 2,003 every run (2,001 echoes, 1 ARP, 1 DNS) |
  | e1000 interrupts | 1,803 to 1,838 |
  | interrupts per hart | between 424 and 869; every hart took a share in every run |
  | packets per interrupt: 0 / 1 / 2 / 3 | about 30 / 1,600 / 165 / 20 |
  | full transmit ring | 0 |
  | packets dropped by a full socket queue | 0 |
  | `recv` calls that had to sleep | 641 to 923 of about 2,000 |

  Contended acquisitions per run (the last three boots also recorded whether the waiter
  was the interrupt handler):

  | lock | contended | of which the handler waited |
  |---|---|---|
  | `e1000.lock` | 176 to 196 | 26 to 44 |
  | `socktab.lock` | 175 to 226 | 119 to 154 |
  | the socket locks | 1,450 to 1,561 | 257 to 303 |
  | for scale: `kmem.lock` | 18 to 29 | |

  - **Interrupts spread over all harts.** The PLIC offers IRQ 33 to every hart and the
    first to claim wins; in the trace that was always a hart idle in its scheduler.
  - **The ring never filled.** QEMU's card sends during the TDT write, so a transmit
    always finds TDH right behind TDT. On real hardware, with a card that runs in
    parallel, a burst from three harts can get 15 packets ahead of it, and then the -1
    path is taken; without the "slot after TDT is TDH" test the 16th packet would lock
    the ring up for good (Clinic 6).
  - **The busiest locks are the sockets', and the waiters are mostly processes.** Two more
    boots recorded where each contended socket-lock acquisition came from: 1,379 and
    1,503 in all, of which 797 and 1,107 in `sockfind` (both `recv`'s lookup and the
    handler's) and 582 and 396 in `recv`'s re-acquire right after `sleep()` returned. A
    process woken by `sock_rx` is runnable *before* `sock_rx` releases `s->lock`, because
    [[wakeup]] continues through all 64 process slots, each under its `p->lock`. If an
    idle hart picks the process up quickly, it spins on the lock its waker still holds.
    That explanation is reasoned from the code; the counts are measured. Waking after the
    release, or remembering the one waiting process instead of scanning all of them,
    would shorten it (see "Further").
  - **The cost of the network for the rest of the kernel is small.** `kmem.lock`, shared
    with everything, was waited for 18 to 29 times per run.
further: |
  - **Wake without scanning.** Store the waiting process in the socket and wake only it,
    or call `wakeup` after releasing `s->lock` (and argue why that is still safe with
    `sleep_prepare`). Measure the socket-lock contention again.
  - **A real ARP cache.** Send ARP requests for the next hop, keep a small table with
    timeouts, and queue packets while a request is outstanding. This is what makes the
    stack work on a network that is not slirp.
  - **Transmit back-pressure.** When the transmit ring is full (15 packets in flight),
    `send` returns -1. Make it sleep instead, enable the card's transmit-done interrupt
    (TXDW), and wake senders from the handler. Test it with Clinic 6's switch that stops
    the card. Then think about who frees transmitted pages when no one sends for a while.
  - **ICMP.** Answer pings (`ping 10.0.2.15` does not reach the guest through slirp, but
    `hostfwd` and a small host script can deliver an echo request), and turn "port
    unreachable" into an error that `recv` reports instead of waiting forever, as Clinic 5
    would have wanted.
  - **Sockets as file descriptors.** Make `bind` return a file descriptor so that `read`,
    `write`, `close` and `exit` handle sockets, and a process that dies frees its port
    automatically.
