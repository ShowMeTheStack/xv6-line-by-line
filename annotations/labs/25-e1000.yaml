    note: |
      gdb stopped here in the recorded boot: hart 0, building the kernel page table
      (`kpgtbl` = `0x87fff000`, the first page [[kalloc]] handed out, from the top of RAM).
      Paging is still off: [[kvminithart]] turns it on only after [[kvmmake]] returns.

      Two mappings join the UART, the disk and the PLIC, all identity-mapped and
      readable and writable, never executable:

      - **`0x30000000`, 1 MiB**: the PCIe configuration space of bus 0 (ECAM), one 4 KiB
        header for each of 32 devices × 8 functions. QEMU's virt machine reserves 256 MiB
        there for 256 buses; xv6 only needs bus 0.
      - **`0x40000000`, 128 KiB**: where the next step will tell the e1000 to put its
        registers. It is inside the window QEMU reserves for PCIe memory (`0x40000000` up to
        the start of RAM at `0x80000000`), so it collides with nothing.

      Both lie below `KERNBASE`, like every device in xv6, and both are mapped once at boot
      and never changed: [[kvmmap]] panics if a mapping fails.
  - title: Find the card and choose its address
    commit: 1
    file: kernel/pci.c
    lines: 29-55
    focus: 32-52
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: kernel
      locks: []
      irq: 0
      stack: [main, pci_init]
      sp: {"on": boot, detail: "`sp` = `0x80009920`"}
    note: |
      Recorded at line 39 (at commit 7; the lines are the same here): `dev` = 1, `h` =
      `0x30008000`, `h[0]` = 269385862 = `0x100e8086`, the e1000's device and vendor IDs.
      Device 0, the host bridge, was skipped. Then at line 46: `size` = 131072.

      Three steps make the card usable:

      1. **Size BAR 0.** Writing all ones and reading back tells the kernel how many
         address bits the card ignores: `~(0xfffe0000 & ~0xf) + 1` = `0x20000`.
      2. **Place it.** Writing `0x40000000` to BAR 0 is a request: "answer the 128 KiB from
         here". The card does not choose; the kernel does.
      3. **Enable it.** Memory space (bit 1) lets the card answer accesses to its BAR; bus
         master (bit 2) lets it read and write RAM by DMA, which the descriptor rings need.

      Word 15 of the header holds the interrupt pin: gdb read `h[15]` = 256 = `0x100`, so
      the pin byte (bits 8-15) is 1, INTA, and the line byte is 0 (nobody routed it; there
      is no firmware). The boot line follows:

      ```text
      pci: e1000 at 0:1.0, 131072 bytes of registers at 0x40000000, INTA
      ```

      `pci_init` runs only on hart 0, from [[main]], before the other harts are released,
      so it needs no lock. Paging is on by now (`satp: kernel`): the two mappings from the
      last step are what make these accesses legal.
  - title: Two rings, each in a page of RAM
    commit: 2
    file: kernel/e1000.c
    lines: 15-36
    focus: 18-33
    diff: true
    state:
      hart: any
      proc: "(the definitions)"
      locks: []
    note: |
      The driver's state. Each ring is an array of 16-byte descriptors (layouts in
      `kernel/e1000_dev.h`: an address, a length, a command byte for transmit, a status
      byte with the DD bit for both). 16 slots × 16 bytes = 256 bytes, so one [[kalloc]]
      page holds a ring with room to spare. The card requires the ring length to be a
      multiple of 128 bytes and the base address to be 16-byte aligned; a page satisfies
      both.

      The comment at lines 22-24 is the reason DMA is easy in xv6: the kernel maps RAM
      one-to-one ([[g:direct-map]]), so the kernel address of a descriptor *is* the physical
      address the card needs. Real kernels with a different layout must translate.

      `tx_bufs` and `rx_bufs` remember which page each slot holds, so that the driver can
      free a transmitted page later and hand a received one up. `lock` is for harts, not for
      the card: think question 2.
