      works for the DNS server too, although slirp answers ARP for `10.0.2.3` with
      `52:55:0a:00:02:03`: slirp accepts IP frames whatever their destination MAC. So xv6
      needs no ARP requests of its own (a real network would; see "Further"). The UDP
      checksum 0 means "none", which IPv4 allows; the IP header checksum is required, and
      slirp checks it.
  - title: Sockets, and the locks that guard them
    commit: 6
    file: kernel/socket.c
    lines: 15-61
    focus: 18-40
    diff: true
    state:
      hart: any
      proc: "(the definitions)"
      locks: []
    note: |
      A socket is a port and a bounded queue of arrived packets. Two kinds of lock:

      - `socktab.lock` protects *which socket has which port*: `bind` checks for a duplicate
        and claims a free socket in one critical section.
      - each `s->lock` protects that socket's queue (`head`, `n`, `q[]`); the `port` field
        changes only with both locks held, so reading it under either is safe.

      Port 0 means "free", which is why `sock_rx` drops packets for port 0 before it looks
      (next step): otherwise they would be queued on a free socket, and the `bind` that
      later takes it would start with `n = 0` and lose those pages. We sent 40 raw frames
      to port 0 into a copy without that test (through QEMU's `-netdev dgram`, since
      slirp's forwarding cannot produce port 0): free pages went from 32447 to 32431, a
      bind/unbind of all 16 ports left 32431, and 40 more frames took it to 32415. With the
      test, 32447 throughout.

      `sockfind` returns the socket *locked*, while the caller still holds `socktab.lock`:
      the order is `socktab.lock` → `s->lock` → `p->lock` (in [[wakeup]],
      [[sleep_prepare]], [[killed]]). No path takes them in another order, and none of them
      is taken while `e1000.lock` is held, so the network adds no cycle to the lock-order
      graph of [[tour:51]].
