      the invariant everything else leans on: **a buffer is always in the bucket of its
      current `blockno`.**

      [[binit]] puts all 30 buffers into bucket 0, which is right because their `blockno`
      starts at 0 (`bcache` is a global, zeroed at boot). Over time, recycling moves them
      where their blocks hash.

