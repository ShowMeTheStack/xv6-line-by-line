      The six lines that moved the buffer to the front of the list are gone; when `refcnt`
      reaches 0, [[brelse]] stores the time instead. (State reasoned from the code: this
      commit was not traced, but the recorded run at commit 5 passes through this same
      `brelse` from the same call, a [[dirlookup]] inside [[create]].)

      Two locks are taken one after the other, never nested: `tickslock` for three lines to
      read `ticks` ([[kernel/trap.c:10]]), as [[sys_uptime]] does, then `bcache.lock` for the
