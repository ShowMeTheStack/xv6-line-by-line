      just acquired. `cpus[2].noff` = 3, intena 1, SIE 0. That ties the deepest nesting this
      kernel had before (3, in [[kwait]]; [[tour:51]]), and now it happens on most misses.

      The loop's discipline:

      - buckets are visited in increasing order, so a hart holding bucket `vi` only ever
        waits for a bucket with a higher index;
      - at most two bucket locks are held: `vi` and `i`;
      - a better candidate in bucket `i` makes `i` the new `vi` and releases the old one;
        otherwise `i` is released at once.

      Holding `vi` is not optional. Without it, a hit on another hart could take the
      candidate between "its `refcnt` is 0" and the unlink below.
    others: |
      What the other harts can do meanwhile: hit, release or pin in any bucket pid 5 does not
      hold right now (all but two). A second miss spins on `evict` with interrupts off; the
      measurement shows that such waits are rare (about 30 per run) but each lasts a whole
      search (see "Measure").
