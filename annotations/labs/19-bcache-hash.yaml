  - title: The lock graph after the split
    commit: 5
    file: kernel/bio.c
    lines: 25-40
    focus: 27-40
    state:
      hart: any
      proc: "(the definitions)"
      locks: []
    note: |
      What the lock-order recorder from [[tour:51]] measured on this branch (boot,
      `bcachetest`, `usertests -q`, on 3 harts), compared with the same workload on the
      original kernel:

      | edge (A held while B acquired) | original | branch |
      |---|---|---|
      | `log.lock` → `bcache.lock` / a bucket ([[bpin]]) | 7,797 | 8,741 |
      | inode sleep-lock → `bcache.lock` / a bucket | 728,225 | 809,134 |
      | buffer sleep-lock → `bcache.lock` / a bucket | 61,446 | 82,023 |
      | `bcache.evict` → a bucket (`bget`, lines 114, 131 and 156) | | 121,905 |
      | a bucket → a higher bucket (line 131 only) | | 81,822 |
      | inode / buffer sleep-lock → `bcache.evict` | | 6,259 / 932 |

      (All bucket locks share one name, so the recorder sees "bucket → bucket"; the code
      guarantees the second index is higher.) The recorder found 41 distinct edges, against
      37 on the original kernel: the four new ones are the last three rows.

      Every new edge points from `evict` into a bucket, from a bucket into a higher bucket,
      or from something that already preceded `bcache.lock` into a bucket or into `evict`.
      No bucket lock is
      ever held while anything other than a higher bucket is acquired, so no cycle can pass
      through them.

      The deepest spinlock nesting is still 3, but there is a new path to it: `evict` → bucket
      → bucket, 81,822 times in the run, every one of them in the search loop.
