  bcachetest: allocating together: OK
  bcachetest: ALL OK
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  [...]
  test kernmem: usertrap(): unexpected scause 0xd pid=6489
  [...]
  ALL TESTS PASSED
  $ bcachetest
  bcachetest: private files: OK
  bcachetest: one shared file: OK
  bcachetest: small files: OK
  bcachetest: allocating together: OK
  bcachetest: ALL OK
  ```

  The `usertrap()` lines are `usertests` checking that bad accesses kill the process, as on
  the original kernel. The same sequence (`bcachetest`, `usertests -q`, `bcachetest`)
  passed at every commit of the branch, each built on its own, and the original kernel with
  only commit 1's test passes it too. Instrumented copies of the head passed the same
  `bcachetest` and `usertests -q` on the 4 boots used for "Measure" and the lock-order run,
  and `bcachetest 1` on the 2 boots traced with gdb for the reveal.

  What this demonstrates: the cache still returns the right bytes for every block under
  heavy concurrent use (every block of every file is compared), `usertests -q` sees no
  difference, and nothing leaks (`usertests` checks free pages; a leaked `refcnt` would end
  in `bget: no buffers`). It does not demonstrate the absence of races: Clinic 2 shows the
  test missing a real race in most runs. The lock-order argument and the measurements below
  carry that part.
measure: |
  **How.** A measurement copy of each kernel (not on the branch) counts, in [[acquire]], how
  many times `amoswap` found the lock taken before it got it, per lock and per hart, in
  per-hart tables that need no lock of their own. Ctrl-P prints the totals and resets them.
  The same copy counts [[bread]] calls and disk reads. Each kernel was booted three times,
  three harts each, on a computer busy with other work (your numbers will differ). Workload:
  boot plus one `bcachetest`, then `usertests -q`. "Contended" counts acquisitions that had
  to spin at least once; total spins are dominated by a few long waits (a holder whose
  QEMU thread the host paused), so they are given only for comparison within a run.

  **Lock waits during boot + `bcachetest`** (contended acquisitions, three boots):

  | lock | original | commit 4 | branch (commit 5) |
  |---|---|---|---|
  | `bcache.lock` | 387, 286, 397 | | |
  | the 13 bucket locks | | 71, 63, 78 | 75, 84, 70 |
  | `bcache.evict` | | 22, 33, 33 | 30, 29, 28 |
  | `tickslock` (`time`) | 19, 19, 0 | 145, 153, 195 | 12, 8, 11 |
  | for scale: `disk.vdisk_lock` | 8,810, 9,215, 9,492 | 9,701, 10,161, 9,491 | 9,367, 9,316, 9,208 |

  - **The split works.** Waits on the cache's own locks fell from about 360 per run to about
    105 (bucket locks plus `evict`), although the locks are taken more often: about 357,000
    bucket and 7,500 `evict` acquisitions against 244,000 of `bcache.lock`, because every
    miss now locks all 13 buckets in turn.
  - **Waits moved, they did not vanish.** Bucket waits are short (about 5,000 spins per run
    against 14,000 to 19,000 for `bcache.lock`), but a miss that waits on `evict` waits for
    another miss's whole search: about 20,000 spins per run over only about 30 waits.
  - **Commit 4 created a new hot lock.** `tickslock`, taken by every `brelse`, was waited
    for more often than all bucket locks together. Commit 5 removed `tickslock` from that read, and
    `tickslock` went back to what the original kernel shows.
  - **Hashing spreads blocks, not accesses.** Bucket 8 alone took 161,533, 166,769 and
    162,816 of the bucket acquisitions (about 46%) and 50, 64 and 54 of the waits (about
    70%). Two of the hottest blocks hash there: block 47, the root directory's data, read
    by every lookup of a name in the root directory, and block 34, the inode block that holds
    the test's first new files (inodes 16 to 31). They share bucket 8
    only because of the modulus (with 17 buckets they would land in 13 and 0), so more
    buckets or another hash could separate them, but not the waits on block 47 itself: a
    block that everybody wants needs a different idea (see "Further").
  - **The cache was never the bottleneck here.** The disk lock is waited for about 9,000
    times per run in every kernel, roughly 25 times more than `bcache.lock` was. On three
    QEMU harts with a RAM-backed disk, splitting `bcache.lock` removes a real but small
    queue; we did not measure a change in run time.

  **During `usertests -q`** there is little to remove: its tests mostly run one at a time.
  `bcache.lock` was waited for 2, 4 and 11 times; the bucket locks 1, 0 and 11 times, and
  `evict` never.

  **Hit rate.** The time-stamp LRU behaves like the original list: disk reads were 7,538 to
  7,599 (original) and 7,489 to 7,606 (branch) for boot + `bcachetest`, out of about 120,000
  [[bread]] calls, and 1,082 to 1,091 against 1,075 to 1,115 for `usertests -q`, out of about
  210,000. Without the stamp (Clinic 4) the same workloads needed 12,202 to 13,050 and 15,418
  to 18,497 reads.

  **Lock order.** The recorder from [[tour:51]] on the same workload: every new edge goes
  from `evict` into a bucket, from a bucket into a higher bucket (81,822 times, all in the
  search loop), or from something that already came before `bcache.lock` into a bucket or
  `evict`. Maximum spinlock nesting is still 3, with one new path to it (`evict` → bucket →
  bucket); maximum sleep-locks held at once is still 3. The last reveal step has the table.
further: |
  - **A finer clock.** `ticks` advances 10 times a second, so most stamps tie. The `time`
    register is readable from S-mode in this tree (`start` sets `mcounteren`, and
    [[clockintr]] reads it with `r_time()`), ticks at 10 MHz and needs no lock at all.
    Use it for `lastuse` and measure the hit rate again: does real LRU beat "first in
    bucket order within a tick" on these workloads?
  - **Misses in parallel.** `bcache.evict` makes misses wait for each other's whole search.
    Remove it: lock the victim's bucket and the destination bucket in index order, look
    again, and start over if the victim was taken meanwhile. Then argue that duplicates and
    deadlock are still impossible, and measure whether the extra complexity buys anything.
  - **Hot buckets.** Bucket 8 took 70% of the bucket waits because two hot blocks live there.
    Try a different hash, more buckets, or caching the root directory's block outside the
    table, and measure which helps; then explain which part of the waiting none of them can
    remove.
  - **False sharing.** The 13 bucket locks are 32 bytes apart, two per 64-byte cache line.
    Pad each bucket to a full line and measure whether a hart spinning on one lock slows
    the hart that owns its neighbour (on QEMU, perhaps not; on real hardware, yes).
  - **Wait instead of panic.** When every buffer is in use, `bget` still panics. Make a miss
    sleep until some buffer's `refcnt` drops to 0, and find the lock and the channel that
    make the wakeup impossible to lose.
