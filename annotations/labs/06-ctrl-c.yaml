      `ls | wc` prints `0 0 0`: `wc` saw an empty pipe, because `ls` never ran. The chain:

      1. `echo hi; cat` is job 3 (the shell's child, pid 3, in slot 2; gdb saw `cat` die as
         pid 3 in slot 2). It forks `echo` (pid 4, in the first free slot, 3), waits for it
         and reaps it: slot 3 is free again, but still says `pgid 3`.
      2. pid 3 execs `cat`. Ctrl-C kills group 3: `cat` in slot 2, **and the free slot 3**,
         whose `killed` becomes 1. [[freeproc]] already ran for slot 3 and will not run again
         until it is reused.
      3. The shell reaps `cat` (slot 2 is freed and cleaned) and runs `ls | wc`: its child
         pid 5 takes slot 2, and pid 5 forks the left side of the pipe, pid 6, into slot 3
         (gdb: pid 6, slot 3, group 5, `killed` 1).
         [[allocproc]] sets `pid` and `state` but never touches `killed`, so pid 6 is born
         killed.
      4. pid 6 returns from `fork` into user mode (no check on that path), runs
         [[user/sh.c:106]], `close(1)`, and the system-call entry check in [[usertrap]]
         ([[kernel/trap.c:57]]) kills it. gdb shows it: pid 6 in slot 3, `a7` = 21, which is
         `SYS_close`. `ls` was never exec'd; `wc` read end-of-file and printed zeros.

      The original kernel has the same assumption: [[freeproc]] clears `killed` and
      [[allocproc]] relies on that. It was safe because [[kkill]] matches on `pid`, which
      [[freeproc]] sets to 0. Any new field that a kill can match on must be cleared too.
      Only the line in [[freeproc]] is needed; a test of `p->state != UNUSED` in the kill loop
      would also work.
