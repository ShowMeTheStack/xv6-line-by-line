      [[kexit]] closes the files, wakes the parent and becomes a zombie; the shell (pid 2),
      asleep in `wait`, reaps it. Its exit status is -1, the same value a process killed for
      a bad memory access gets, which is why the shell does not try to print "interrupted".

      The last of the kernel commits is done. Up to here the shell never sets a group, so
      every Ctrl-C finds nobody and only gives an empty line. The next commit lets it say
      which job is in front.
