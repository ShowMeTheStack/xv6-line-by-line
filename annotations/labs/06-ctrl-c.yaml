      `p->parent` at all.
  - bug: The kill only sets the flag
    change: |
      The learner reasons that "kill means `killed = 1`" and writes the loop like
      [[setkilled]]: no `SLEEPING` → `RUNNABLE`, and no `wakeup(&cons.r)` in [[consoleintr]]:

      ```diff
