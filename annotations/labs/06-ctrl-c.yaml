    commit: 5
    file: kernel/trap.c
    lines: 49-95
    focus: 81-82
    state:
      hart: 0
      mode: S
      proc: cat (pid 4)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap]
      sp: {"on": kernel, detail: "pid 4's kernel stack, `sp` = `0x3fffff9fe0`: only usertrap's frame is left"}
    note: |
      The system call has returned into [[usertrap]], and before going back to user space it
      checks `killed` again ([[kernel/trap.c:81]], unchanged by the branch). `cat` calls
      `kexit(-1)` here, on hart 0. Every killed process in the recording died at this line:
      `cat` 4, `pause` 5, the pipeline's `sh` 6, `cat` 7, `grep` 8 and the last `cat`, 12. `pause` and `grep`
