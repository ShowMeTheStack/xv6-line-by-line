published: true
title: "Ctrl-C: interrupting the foreground job"
area: Traps and control flow
stars: 3
branch: ext/06-ctrl-c
prerequisites: {tours: [9, 16, 21, 23, 37, 40, 44, 51], concepts: [locks, stacks]}
summary: |
  In this tree, Ctrl-C is just a byte. Type `cat`, press Ctrl-C, and the [[g:uart|UART]]
  delivers `0x03` to [[consoleintr]], which stores it in the input buffer like any letter.
  `cat` keeps waiting. A program that computes forever can only be stopped by rebooting. In
  this lab you make Ctrl-C kill the shell's current foreground job, every process of a
  pipeline, while the shell itself survives and prints a new prompt.

  The keystroke arrives in an interrupt handler, on whichever [[g:hart]] the PLIC picked,
  usually while some unrelated process or nobody at all is running there. That raises the
  questions this lab is about. The console is shared by `init`, the shell and every job: who
  is "in front", and who tells the console? What does "kill" mean in a kernel where a victim
  can only die at certain checkpoints, and how long can it take for a process asleep in the
  kernel, or one that never makes a system call? What may an interrupt handler do with a
  [[g:spinlock]] already held, and which locks may it never take? A process asleep in
  [[consoleread]] is waiting for exactly the device that is now interrupting it: does it wake?
  And what happens at the edges: a `^C` at an empty prompt, a job that exits just as the key
  is pressed, a job that forks at that very moment?

  The reference solution is nine small commits: three small system calls, one new `case`
  in [[consoleintr]], six lines in the shell, a `pause` command, an in-kernel test program
  and a QEMU driver that types Ctrl-C from outside the machine.
learn:
  - "Can the console tell by itself which processes are \"in front\"? If not, who knows, and what is the smallest piece of state that describes a whole pipeline?"
  - "What does `kill` actually do to a process in this kernel, and where does each kind of victim (asleep in the kernel, running in user mode) finally notice it?"
  - "What may code running in an interrupt handler do: which locks may it take, in which order, and what happens on three harts if it gets the order wrong?"
  - "Can a process be killed in the instant between deciding to sleep and actually sleeping, and what does it take for the kill to reach it anyway?"
  - "How do `init` and the shell stay out of harm's way, and what can a field left behind in a freed process slot do to the next process born there?"
  - "How do you test a feature that starts with a keystroke no program can type?"
spec: |
  **Behaviour.** Typing Ctrl-C at the console kills every process of the shell's current
  foreground job: a single command, every process of a pipeline, a list. The shell itself
  is not killed; as soon as the job's processes have exited it prints a new prompt.

  - The console echoes `^C` (the two characters `^` and `C`) and a newline, and throws away
    a half-typed line.
  - A job asleep in the kernel (reading the console, reading a pipe, in `pause`, in `wait`)
    must die promptly, without anyone pressing another key.
  - A background job started with `&` is not killed, neither by a `^C` for the job that
    started it nor by one for any later job.
  - Ctrl-C at the prompt, with no job running, kills nothing and gives a fresh prompt.

  ```text
  $ cat
  ^C
  $ pause 1000
  ^C
  $ cat | grep x
  ^C
  $ (pause 30; echo survived) &
  $ cat
  ^C
  $ survived
  ^C
  $ echo jun^C
  $ echo clean
  clean
  ```

  (`pause N` is a new command that sleeps for N ticks of 1/10 s, so `pause 1000` would take
  100 seconds. In the line `echo jun^C`, `^C` is the kernel's echo; the half-typed
  `echo jun` never reaches the shell.)

  **Three new system calls**, which the shell and the test use:

  - `int setpgid(int pid, int pgid)`: put process `pid` (0: the caller), which must be the
    caller or one of its children, into process group `pgid` (0: a new group numbered
    `pid`). Returns 0, or -1.
  - `int killpg(int pgid)`: kill every process in group `pgid`. Returns 0, or -1 if the
    group has no process or `pgid` is 0.
  - `int setfg(int pgid)`: make `pgid` the console's foreground group, the one Ctrl-C kills
    (0: none).

  **What must not change.** `kill(pid)` and every existing program behave as before; `init`
  is never killed by Ctrl-C (the kernel panics if `init` exits). **`usertests -q` must print
  `ALL TESTS PASSED` on 3 harts.**

  **The tests.** A Ctrl-C is a byte arriving at the UART, which no program inside xv6 can
  produce, so there are two:

  - `pgtest`, a user program, tests the kernel half through `killpg`: a group of four
    processes asleep in four different places (in `wait`, in a pipe read, in `pause` and in
    a console read) must all be gone within 3 seconds of one `killpg`, and a process in
    another group must survive. Its last line says what it did not test:

    ```text
    $ pgtest
    pgtest: setpgid on a process that is not our child fails: OK
    pgtest: killpg(0), the group of init and the shell, is refused: OK
    pgtest: killpg finds the group (wait, pipe read, pause, console read): OK
    pgtest: every member exited: OK
    pgtest: ...within 3 seconds, without the watchdog's kill(): OK
    pgtest: the leader exited with status -1, like any killed process: OK
    pgtest: a process in another group survives: OK
    pgtest: ALL OK (the Ctrl-C keystroke itself is tested by ctrlc-test.py)
    ```

  - `ctrlc-test.py`, a Python driver run on the host, boots QEMU on 3 harts, types commands
    and `\x03` bytes on its standard input (the UART), and checks the console for the
    transcript above: 10 checks.
think:
  - title: Who should receive the Ctrl-C?
    q: |
      Ctrl-C arrives as one byte, `0x03`, in [[consoleintr]] ([[kernel/console.c:147]]),
      called from an interrupt handler. You want it to kill "the program the user is
      running". The spec has the shell call `setfg` to tell the console which processes
      those are. Why must the kernel be told at all? While `cat | grep x` runs, which
      processes have the console open, and which of them should die? Try every rule the
      kernel could apply with what it already knows (open files, parent pointers, who is
      reading the console) and find the case each one gets wrong. Then: what must the thing
      the shell passes to `setfg` name, so that one call covers a whole pipeline?
    hints:
      - "Read [[user/init.c]] (it opens the console as fds 0, 1 and 2) and the shell's `main` and `runcmd` in [[user/sh.c]]: who forks whom for `cat | grep x`, and which fds does each process inherit?"
      - "Every process descends from `init`, and every one of them has the console open unless it closed it. \"Has the console open\" and \"is reading the console\" both pick the wrong set: the first includes `init` and the shell, the second misses `grep` (reading a pipe) and anything that computes without reading. Only the shell knows where a job starts and ends."
      - "Look for a label that every process of a job would carry without the shell having to visit each one, and that `init` and the shell themselves do not carry."
    answer: |
      For `cat | grep x` the shell (pid 2) forks one child for the whole command line; that
      child runs `runcmd` for the pipe, creates the pipe and forks `cat` and `grep`, then
      waits for both ([[user/sh.c:101]]-[[user/sh.c:123]]). So five processes have the
      console open: `init`, the shell, the job's leader (a copy of the shell, asleep in
      `wait`), `cat` (fd 0 and 2) and `grep` (fd 1 and 2). The right victims are exactly the
      last three, the processes that descend from the shell's child.

      The kernel cannot find that set from what it has:

      - *Everyone with the console open* kills `init` and the shell: `panic: init exiting`.
      - *Whoever is reading the console* is only `cat`; `grep` and its waiting parent would
        survive, and a job that computes without reading could never be stopped.
      - *The descendants of some process* needs the parent pointers, which are protected by
        `wait_lock`. Walking them from an interrupt handler is the subject of a later
        question (and of clinic 2).
      - *Everyone but `init`* kills the shell too (clinic 1).

      The design used by Unix, and by the reference, is a **process group**: a number in
      every `struct proc`, copied by `fork`, so a job's processes share it automatically
      however many times they fork. The shell creates a new group for each job and tells the
      console which group is in front with a new system call; the console stores that one
      number, the **foreground group**. Ctrl-C kills the processes of the foreground group.
      `init` and the shell are in group 0, which means "no group", and the kernel refuses to
      kill group 0.

      A simpler model, a single "console owner" pid, works for one command but not for a
      pipeline: the owner would have to be killed and then its children found some other way.
    checks:
      - id: lab06-01
        level: 1
        type: number
        q: |
          In the unmodified tree, you type `cat | grep x` and both programs are running. How
          many processes have the console open on at least one file descriptor?
        answer: 5
        wrong:
          2: |
            You may have counted only `cat` and `grep`. Their parent, the shell's child that
            ran `runcmd` for the pipe, still has fds 0, 1 and 2 open while it waits, and so do
            the shell and `init`.
          3: |
            You may have counted the job (the pipe's parent, `cat`, `grep`) and forgotten
            the shell and `init`, which keep the console open for their whole lives.
          4: |
            You may have forgotten either `init` (it opened the console first) or the
            invisible copy of the shell that waits for `cat` and `grep`. All five hold it.
        why_wrong: "Count init, the shell, the shell's child for the command line, cat and grep. Each has the console on at least one of fds 0-2."
        explain: |
          `init` opens the console as fd 0 and dups it to 1 and 2 ([[user/init.c]]); every
          process after it inherits those through `fork`. The pipe replaces only `cat`'s fd 1
          and `grep`'s fd 0. "Has the console open" therefore includes `init` and the shell:
          it cannot be the rule for Ctrl-C.
      - id: lab06-02
        level: 2
        type: choice
        q: |
          Suppose Ctrl-C killed every process whose file table contains the console. You type
          `cat` and press Ctrl-C. What happens?
        options:
          - text: "init is killed with the others, and the kernel panics with init exiting."
            correct: true
            why: |
              `init` has the console open, so it is marked killed. It is asleep in `wait`;
              the kill wakes it, [[kwait]] returns -1, and on its way back to user space
              [[usertrap]] calls [[kexit]], which panics for `init` ([[kernel/proc.c:330]]).
          - text: "cat dies and the shell prints a new prompt."
            why: |
              You may have thought only the reader is affected. The shell and `init` also
              have the console open and would be killed by this rule.
          - text: "cat and the shell die; init starts a new shell."
            why: |
              That is what happens if `init` is spared (clinic 1). With this rule `init` is
              not spared: it has the console open too.
          - text: "Nothing, because a killed process only dies when it returns to user space, and init never does."
            why: |
              `init` is asleep in `wait`. A kill makes a sleeping process runnable, `kwait`
              notices `killed` and returns, and the return to user space ends in [[kexit]].
        explain: |
          The console is shared by every process, so "has it open" is the wrong set. Clinic 4
          shows the same panic from a different mistake: killing group 0, where `init` and the
          shell live, with `panic: init exiting` on the console right after `^C`.
  - title: How does a job get its group, and who decides?
    q: |
      You have decided on process groups and a foreground group. Now the mechanics. When does
      a process get its group number? The shell forks one child per command line, and that
      child may fork again (a pipeline) before or after the shell gets to run again: on three
      harts the order is not fixed. Who should call your "set the group" system call, the
      shell, the child, or both, so that every process of the job is in the group *before*
      the shell makes that group the foreground one? What about a background job, `cmd &`?
      And what should `init` and the shell's own group be?
    hints:
      - "[[kfork]] copies some fields of the parent into the child ([[kernel/proc.c:276]]-[[kernel/proc.c:290]]). A group number copied there reaches every descendant, so the job only needs to be put into its group once, at the top."
      - "After `fork` returns, the parent and the child run in either order, possibly at the same time on two harts. If only the child sets the group, the shell may announce the group before it has a member. If only the shell does, the child may already have forked `cat` with the old group."
      - "There are two windows: one before the group has a member, one before the job's first fork. Which two processes can each close one of them, and in what order must the shell's calls come relative to its `wait`?"
    answer: |
      The reference adds `int pgid` to `struct proc`, next to `pid` and `killed` (protected
      by `p->lock`), and [[kfork]] copies the parent's value into the child just before
      making it `RUNNABLE`. Then a job only has to be placed in its group at the top: every
      `fork` below inherits it.

      The shell does this for every command line:

      ```c
      pid = fork1();
      if (pid == 0) {
        setpgid(0, 0);       // the job gets a group of its own
        runcmd(parsecmd(cmd));
      }
      setpgid(pid, pid);     // here too: whichever runs first
      setfg(pid);            // ^C now interrupts this job
      wait(0);
      setfg(0);              // back at the prompt: no foreground job
      ```

      Why both calls: on three harts the child may run first and fork `cat` and `grep`
      before the shell's `setpgid` runs; if the child did not set its own group first, they
      would inherit group 0 and survive a Ctrl-C. And if only the child set it, the shell's
      `setfg(pid)` could run before the child had run at all: a Ctrl-C in between would find
      an empty group. With both, the group exists and contains the child before `setfg`, and
      contains every process the child ever forks. (In the recorded run below, the shell's
      call came first: pid 3 was still `RUNNABLE` when the shell set its group.)

      One window remains, by design: between `fork1()` and `setfg(pid)` the foreground group
      is still 0. A Ctrl-C there kills nothing and hands the reader an empty line, which the
      new job (say `cat`) may then read. (Reasoned from the code, not observed.)

      A group is named after its first member, the job's leader. Pids are never reused in
      this tree ([[allocpid]] only counts up), so a group number never comes back.

      `init` and the shell stay in group 0, which no job is ever in, and the kernel refuses
      to kill group 0: Ctrl-C can never reach them. `setfg(0)` after `wait` means that at the
      prompt there is no foreground job at all.

      A background command `cmd &` is run by the job's leader, which forks the command and
      exits at once ([[user/sh.c:125]]-[[user/sh.c:129]]). The forked process calls
      `setpgid(0, 0)` first thing, leaving the job's group for one of its own that will never
      be in front. (A Ctrl-C in the few microseconds before that call would still reach it.)
    checks:
      - id: lab06-03
        level: 2
        type: order
        q: |
          Put the shell's own steps (the parent side) for one command line in the order the
          reference uses.
        items:
          - text: "fork1() creates the job's leader"
          - text: "setpgid(pid, pid) puts the leader in a new group"
            why: "The group must have a member before it becomes the foreground group, so this comes before setfg."
          - text: "setfg(pid) makes that group the foreground one"
            why: "Only after the group exists; a setfg first would let a Ctrl-C find an empty group."
          - text: "wait(0) until the leader exits"
          - text: "setfg(0): no foreground job at the prompt"
            why: "If this came before wait, Ctrl-C would not reach the job while it runs."
        why_wrong: "The group must exist before it is announced, and stay announced exactly as long as the shell is waiting."
        explain: |
          The child does its own `setpgid(0, 0)` independently; on three harts either call
          may come first, and both set the same value.
      - id: lab06-04
        level: 3
        type: tf
        q: |
          True or false: it would be enough for the shell's child to call `setpgid(0, 0)`
          as its first action; the shell's own `setpgid(pid, pid)` is redundant.
        answer: false
        why_tf: |
          You may have reasoned that the child's call alone covers all its descendants. It
          does, but timing still matters for the shell's next step.
        reasons:
          - text: "The shell may reach setfg(pid) before the child has run at all; a Ctrl-C in that gap finds an empty group and the job escapes."
            correct: true
            why: |
              Right. Without the shell's call there is a moment where the console's
              foreground group has no member yet.
          - text: "The child's call fails because a process may not change its own group."
            why: |
              `setpgid(0, 0)` changes the caller's own group, which is always allowed.
          - text: "Children forked by the job would not inherit the group."
            why: |
              They do inherit it, as long as they are forked after the child's call, and the
              child makes the call before it forks anything.
        explain: |
          Each call closes one window: the child's keeps the job's descendants in the group,
          the shell's makes the group non-empty before it becomes the foreground group.
  - title: What does "kill" mean here, and when does the victim notice?
    q: |
      You will mark the processes of the foreground group as killed from the interrupt
      handler. Look at how this tree kills one process with `kill(pid)`. What exactly does it
      change in the victim, and when does the victim actually stop running? Go through the
      victims of a Ctrl-C one by one: `cat` asleep reading the console, `pause 1000` asleep
      for 100 seconds, `grep` asleep reading an empty pipe, the pipeline's parent asleep in
      `wait`, and a program that loops in user mode without ever making a system call. For
      each one, where does it notice?
    hints:
      - "Read [[kkill]] ([[kernel/proc.c:600]]) and the comment above it, then every caller of [[killed]]: [[usertrap]] ([[kernel/trap.c:57]], [[kernel/trap.c:81]]), [[consoleread]], [[piperead]], [[sys_pause]], [[kwait]]."
      - "A kill cannot stop a process in the middle of kernel code: it may hold locks or be halfway through updating something. So the kernel only marks it, and the victim checks the mark at safe points. A sleeping victim must also be made runnable, or it would never reach a check."
      - "Whatever kills one process can be applied to every process that carries the job's label. For each victim in the list, find the loop or the return path that will look at the mark."
    answer: |
      [[kkill]] does two things under the victim's `p->lock`: it sets `p->killed = 1`, and if
      the victim is `SLEEPING` it makes it `RUNNABLE` ([[kernel/proc.c:611]]-[[kernel/proc.c:615]]).
      It never stops anything itself. The victim dies only when *it* runs into a check:

      | victim | asleep in | notices at |
      |---|---|---|
      | `cat` | [[consoleread]], on `&cons.r` | the `killed` test at the top of its wait loop ([[kernel/console.c:100]]), returns -1 |
      | `pause 1000` | [[sys_pause]], on `&ticks` | the loop's test ([[kernel/sysproc.c:79]]), returns -1 |
      | `grep` | [[piperead]], on `&pi->nread` | the loop's test ([[kernel/pipe.c:120]]), returns -1 |
      | the pipe's parent | [[kwait]], on itself | the `killed(p)` test before it sleeps again ([[kernel/proc.c:408]]), returns -1 |
      | a loop in user mode | nowhere: it is running | [[usertrap]]'s test after its next trap of any kind ([[kernel/trap.c:81]]) |

      In every case the system call then returns, and on the way back to user space
      [[usertrap]] finds `killed` set and calls `kexit(-1)` ([[kernel/trap.c:81]]-[[kernel/trap.c:82]]).
      So every killed process exits with status -1, from its own kernel stack, holding no
      locks: that is why the kill is deferred.

      A process that is running in user mode on another hart is not interrupted by the kill.
      It is only flagged; it exits at its next trap, a timer interrupt at the latest (every
      hart has its own timer), or sooner if any other trap comes first. In the measured runs a
      looping program died within a millisecond of the Ctrl-C, at an external-interrupt trap:
      the PLIC signals every hart, its own claim returned 0 because another hart handled the
      UART, but the trap alone brought it to [[usertrap]]'s `killed` test (see the
      measurements).

      A process that is asleep in a **sleep-lock** ([[acquiresleep]], for disk I/O) is not
      woken early: that loop never checks `killed`. It dies when the I/O finishes and its
      system call returns. A **zombie** can be marked killed harmlessly.

      The reference therefore adds a group version of [[kkill]], `killpgrp(pgid)`, that
      loops over the process table and does exactly the two things above for every process
      whose `pgid` matches, and returns how many it found. The `killpg` system call exposes
      it to user programs (and to `pgtest`).
    checks:
      - id: lab06-05
        level: 2
        type: match
        q: |
          Match each victim of a Ctrl-C with the place where it first notices that it was
          killed.
        pairs:
          - left: "cat, asleep waiting for a line"
            right: "the killed test in consoleread's wait loop"
            why: "cat sleeps on &cons.r inside consoleread; after being made RUNNABLE it goes round the loop and tests killed first."
          - left: "pause 1000"
            right: "the killed test in sys_pause's loop"
            why: "pause sleeps on &ticks inside sys_pause; the loop tests killed before sleeping again."
          - left: "grep, waiting for the pipe"
            right: "the killed test in piperead's loop"
            why: "grep sleeps on &pi->nread inside piperead, whose loop tests killed(pr)."
          - left: "the pipeline's parent, in wait"
            right: "kwait's !havekids || killed(p) test"
            why: "The shell's child for the pipe sleeps in kwait waiting for cat and grep."
          - left: "a program looping in user mode"
            right: "usertrap's killed test after its next trap"
            why: "It is never asleep and makes no system call; only a trap (an interrupt) brings it into the kernel."
        explain: |
          The kill only sets a flag (and wakes a sleeper); each kind of victim notices at its
          own checkpoint, and then [[usertrap]] calls `kexit(-1)` on the way back to user
          space. See [[tour:23]] for one `kill` followed all the way.
      - id: lab06-06
        level: 3
        type: choice
        q: |
          A Ctrl-C arrives on hart 0 while `spin`, a program that loops forever in user mode
          and never makes a system call, is running on hart 1. The handler sets `spin`'s
          `killed` flag. What happens next?
        options:
          - text: "spin keeps running until hart 1 takes its next trap (a timer or device interrupt); usertrap then sees killed and calls kexit(-1)."
            correct: true
            why: |
              Right. Nothing reaches into hart 1. The flag is read only when `spin` enters the
              kernel, and an interrupt is the only way it does.
          - text: "hart 0 sends hart 1 an interrupt so that spin stops at once."
            why: |
              You may be thinking of real kernels' inter-processor interrupts. This tree never
              sends one; the kill only writes `p->killed`.
          - text: "spin runs forever, because only a system call checks killed."
            why: |
              [[usertrap]] also checks `killed` after *any* trap from user mode, including
              interrupts ([[kernel/trap.c:81]]), and every hart takes a timer interrupt
              every tick.
          - text: "hart 0 calls kexit on spin's behalf."
            why: |
              [[kexit]] must run on the dying process's own kernel stack, as that process; it
              ends with `sched()`. No other hart can call it for `spin`.
        explain: |
          Killing is cooperative in this kernel. A running victim is bounded by its hart's
          next timer interrupt (about 1/10 s). In the measured runs `spin` died sooner, within
          a millisecond, at an external-interrupt trap on its own hart whose PLIC claim
          returned 0 (another hart had handled the UART). Only the timer is guaranteed.
  - title: The kill runs in an interrupt handler. What may it do there?
    q: |
      Your kill loop will be called from [[consoleintr]]. Trace how [[consoleintr]] is
      reached and what is true at that moment: which locks are held, whether interrupts are
      on, which stack, and which process (if any) is "current" on that hart. Then decide what
      your loop may lock. It must look at every process's group number. Which lock protects
      that field? Could it also take `wait_lock` (say, to walk parent pointers instead of
      using groups)? Could it sleep, or wait for the victims to die?
    hints:
      - "Follow [[devintr]] → [[uartintr]] → [[consoleintr]] ([[kernel/uart.c:153]], [[kernel/console.c:149]]). Then read the lock-order rule written above `wait_lock` ([[kernel/proc.c:23]]-[[kernel/proc.c:27]]) and look at the order [[kwait]] takes its locks in."
      - "In a trap handler SIE is off, and `cons.lock` is held from the top of [[consoleintr]]: noff 1, intena 0. Nothing here may sleep ([[sched]] would panic) or wait for something that needs this hart. [[consoleintr]] already calls [[wakeup]], which takes every `p->lock` one at a time: `cons.lock` → `p->lock` is an edge the kernel already has."
      - "Take each `p->lock` alone, as [[wakeup]] does, read the group under it, mark and maybe wake, release. Never take `wait_lock` while holding a `p->lock`; the rest of the kernel takes them in the other order."
    answer: |
      The path is: UART receive interrupt → PLIC → whichever hart claims it → `kernelvec`
      and [[kerneltrap]] (or [[uservec]] and [[usertrap]], if that hart was in user mode) →
      [[devintr]] → [[uartintr]] → [[consoleintr]], which acquires `cons.lock` first. So the
      handler runs with SIE off, noff 1 and intena 0, on whatever stack the interrupted code
      was using. In the recorded runs, all five Ctrl-Cs landed on a hart that was idle in
      [[scheduler]]: no current process, and the handler's frames sat on that hart's
      scheduler stack on top of a `kernelvec` frame.

      What follows from that:

      - **No sleeping, no waiting for the victims.** There may be no process to put to
        sleep, and holding `cons.lock` would make [[sched]] panic anyway. The handler marks
        and returns; the victims die later, each on its own.
      - **Locks.** The group number lives in `struct proc` and is protected by `p->lock`, like
        `killed` and `state`. Taking each `p->lock` in turn under `cons.lock` adds no new
        lock-order edge: [[consoleintr]] already does it through [[wakeup]]
        ([[kernel/console.c:183]]), and [[tour:51]] measured `cons.lock` → `p->lock`. While a
        `p->lock` is held, noff is 2 and intena still 0.
      - **No `wait_lock` inside the loop.** The kernel's rule is `wait_lock` before any
        `p->lock` ([[kernel/proc.c:26]]); [[kwait]] holds `wait_lock` and then takes each
        child's `p->lock`. A handler that holds a `p->lock` and then asks for `wait_lock`
        reverses that order, and two harts can deadlock. Clinic 2 does exactly that and hangs
        6 of 9 boots at the first Ctrl-C. Taking `wait_lock` *before* the loop, in the
        legal order, worked in 20 out of 20 tries: being in an interrupt handler is not the
        problem, the order is. (It is still a poor idea: `wait_lock` is held for long scans in
        [[kwait]], and the handler would spin with interrupts off.)

      Is taking a `p->lock` in an interrupt handler safe on *this* hart? The handler can only
      have been entered at noff 0 (interrupts are off whenever a spinlock is held,
      [[concept:locks#invariant]]), so the interrupted code holds no `p->lock`, and the
      handler cannot spin on a lock its own hart holds.
    checks:
      - id: lab06-07
        level: 2
        type: state
        q: |
          Hart 1 is idle in [[scheduler]] when you press Ctrl-C. It takes the UART interrupt,
          and the reference's kill loop has just acquired the `p->lock` of the first victim.
          Fill in the hart's state.
        code: kernel/console.c:147-154
        state:
          mode: S
          stack: scheduler
          satp: kernel
          sie: "off"
          noff: 2
          intena: 0
        why:
          stack: |
            The interrupt arrived while the scheduler was running, so `kernelvec` pushed its
            frame on the scheduler stack (this hart's slice of `stack0`) and everything
            above it runs there. There is no current process, hence no kernel stack in use.
          noff: |
            Two spinlocks are held: `cons.lock` from [[consoleintr]] and the victim's
            `p->lock`. gdb recorded noff 2 at this line in every kill.
          intena: |
            The outermost acquire (`cons.lock`) happened in a trap handler, with SIE already
            off, so intena recorded 0.
          sie: |
            Off since the trap was taken; a held spinlock means off in any case.
          satp: |
            The scheduler runs on the kernel page table; so does every trap handler.
        why_wrong: Follow scheduler → kernelvec → kerneltrap → devintr → uartintr → consoleintr (acquire cons.lock) → the kill loop (acquire p->lock).
        explain: |
          Recorded with gdb on the reference branch: hart 1, no current process, `sp` =
          `0x80009640` inside hart 1's slice of `stack0`, noff 2, intena 0, SIE 0. See
          [[tour:44]] for the three places an interrupt can land.
      - id: lab06-08
        level: 3
        type: choice
        q: |
          Instead of groups, a learner kills "the foreground leader and all its
          descendants": for each process it acquires `p->lock`, then `wait_lock` to follow the
          `parent` pointers up, releases `wait_lock`, marks the process if the leader was
          found, and releases `p->lock`. Run on 3 harts while the job forks and waits a lot,
          what is the risk?
        options:
          - text: "A deadlock: the handler holds a p->lock and waits for wait_lock, while kwait on another hart holds wait_lock and waits for that p->lock."
            correct: true
            why: |
              Right: the two orders are reversed. Clinic 2 shows it on a real run, with a
              third hart stuck behind them.
          - text: "A panic, because an interrupt handler may not take wait_lock."
            why: |
              Nothing in the kernel forbids it; [[acquire]] does not know it is in an
              interrupt handler. Taking `wait_lock` first, before any `p->lock`, worked in all
              20 tries.
          - text: "None: interrupts are off, so no other hart can hold wait_lock."
            why: |
              Turning off SIE affects only this hart. The other two keep running and taking
              locks.
          - text: "A deadlock on this hart, because the interrupted code may hold wait_lock."
            why: |
              If this hart held any spinlock, its interrupts would be off and the interrupt
              could not have been taken here ([[concept:locks#invariant]]).
        explain: |
          The lock-order rule is about pairs of harts, not about interrupt context:
          `wait_lock` → `p->lock` everywhere, so taking them the other way round can close a
          cycle with [[kwait]]. See [[tour:18]] and [[concept:locks#order]].
  - title: Does the console reader wake up?
    q: |
      Now look at the victim that is waiting for this very device: `cat` in [[consoleread]].
      Your kill loop does what [[kkill]] does: under `p->lock`, set `killed`, and make a
      `SLEEPING` process `RUNNABLE`. Is that enough for a reader of the console? Look closely
      at the steps between the reader's `killed` test and the moment it is really asleep.
      Which locks does it hold at each step, and can your handler run in between? What does
      the reader's state look like then, and what will it do next?
    hints:
      - "The reader's loop is [[kernel/console.c:99]]-[[kernel/console.c:108]]: test `killed`, [[sleep_prepare]], release `cons.lock`, [[sleep]]. Your handler holds `cons.lock`, so it runs either before the test or after the release."
      - "After the release and before [[sleep]] takes `p->lock` again, the reader is still `RUNNING`, with `p->chan` = `&cons.r`. Marking it killed does not change its state, and [[sleep]] only skips sleeping when `p->chan` is 0 ([[kernel/proc.c:567]])."
      - "What does [[sleep]] look at to decide whether to sleep, and which code, already in the kernel, changes that field from outside the process?"
    answer: |
      A reader fully asleep in [[consoleread]] is woken by the kill loop's `SLEEPING` →
      `RUNNABLE`, and its loop then sees `killed`. That is the common case, and the recorded
      runs all looked like it.

      But there is a window. The reader tests `killed` under `cons.lock`, calls
      [[sleep_prepare]] (`p->chan = &cons.r`), releases `cons.lock`, and only then calls
      [[sleep]], which takes `p->lock` and goes to sleep if `p->chan` is still set. Because the
      handler holds `cons.lock`, it can only run before the test (fine: the reader sees
      `killed`) or after the release. In the second case:

      | time | hart 0: `cat` in consoleread | hart 1: the Ctrl-C handler |
      |---|---|---|
      | 1 | `killed`? no; `sleep_prepare(&cons.r)`; release `cons.lock` | |
      | 2 | | acquire `cons.lock`; kill loop: `cat` is `RUNNING`, so only `killed = 1` |
      | 3 | [[sleep]]: `p->chan` is still `&cons.r`, so `SLEEPING`, [[sched]] | |
      | 4 | asleep, killed, and nobody will wake it until a newline arrives | release `cons.lock` |

      That is a lost wakeup ([[g:lost-wakeup]]), and a kill that only touches `killed` and
      `state` cannot prevent it. What can is the mechanism the reader already relies on:
      [[wakeup]] on its channel clears `p->chan`. So the reference calls `wakeup(&cons.r)`
      after the kill loop, still under `cons.lock`. A reader in the window then finds `chan`
      0 in [[sleep]] and returns at once; a reader fully asleep becomes `RUNNABLE` (a second
      time, harmlessly). Either way it goes round the loop and returns -1.

      Why keep the `RUNNABLE` in the kill loop too, then? Because the console reader is not
      the only victim: `grep` in [[piperead]] or a parent in [[kwait]] sleep on other channels
      that nobody may wake for a long time. `pgtest` checks a pipe reader and a console
      reader woken by `killpg` alone; clinic 3 removes both wakeups and shows who gets stuck.
      (The window itself was not caught in a recorded run; the table is reasoned from the
      code. The same window exists for `kill(pid)` in the original kernel, where nothing closes
      it.)

      Be clear about what `wakeup(&cons.r)` does *not* fix: the same window exists for the
      other victims. A `grep` killed between [[sleep_prepare]] and [[sleep]] in [[piperead]]
      goes to sleep with `killed` set. In the cases tested it is rescued anyway (`cat`'s exit
      closes the pipe, a child's exit wakes a parent in `wait`, ticks wake `pause`), but a
      pipe reader whose writer is outside the job would stay asleep. A more general fix is
      for the kill loop itself to clear `p->chan` under `p->lock`, which makes any
      not-yet-begun [[sleep]] return at once; every sleep loop in this tree re-checks its
      condition, so an early return is harmless. That variant was tried too
      (with `wakeup(&cons.r)` kept only for the empty-line case): `ctrlc-test` 10 of 10,
      `pgtest` OK twice, `usertests -q` passed. The reference keeps the narrower fix; the
      general one is in "further".
    checks:
      - id: lab06-09
        level: 3
        type: choice
        q: |
          The handler's kill loop sets `killed` on `cat` while `cat` is between
          `release(&cons.lock)` and `sleep()` in [[consoleread]]. Without the extra
          `wakeup(&cons.r)`, what happens to `cat`?
        code: kernel/console.c:96-108@104-106
        options:
          - text: "It goes to sleep anyway, because its chan is still set, and stays asleep with killed = 1 until the next line is typed."
            correct: true
            why: |
              Right. Its state was `RUNNING`, so the kill loop changed only `killed`; [[sleep]]
              looks only at `p->chan`.
          - text: "It returns -1 at once, because sleep() checks killed."
            why: |
              You may have expected [[sleep]] to check `killed`. It does not
              ([[kernel/proc.c:561]]-[[kernel/proc.c:572]]); only the callers' loops do.
          - text: "The kill loop made it RUNNABLE, so it never sleeps."
            why: |
              The loop makes only `SLEEPING` processes `RUNNABLE`. At this moment `cat` is
              `RUNNING` (it is executing these very lines).
          - text: "It cannot happen, because the handler holds cons.lock and so does cat."
            why: |
              `cat` released `cons.lock` just before calling [[sleep]] (line 105). That
              release is exactly what opens the window.
        explain: |
          The kill flag and the wait channel are separate. Clearing the channel with
          [[wakeup]] is what makes [[sleep]] return early ([[tour:16]]); that is why the
          reference calls `wakeup(&cons.r)` after the kill loop.
      - id: lab06-10
        level: 2
        type: tf
        q: |
          True or false: if the kill loop only set `killed` (no `RUNNABLE`, no
          `wakeup(&cons.r)`), a Ctrl-C would leave `pause 1000` running for the full 100
          seconds.
        answer: false
        why_tf: |
          You may have thought every sleeper needs the kill to wake it. `pause` is woken
          anyway, ten times a second.
        reasons:
          - text: "clockintr calls wakeup(&ticks) every tick; sys_pause's loop then sees killed and returns -1 within a tick."
            correct: true
            why: |
              Right. Clinic 3 shows it: with no wakeups at all, `pause 1000` still died without
              anyone pressing a key, while `cat` stayed until Enter.
          - text: "pause is not asleep; it polls killed in user mode."
            why: |
              `pause` sleeps in the kernel, in [[sys_pause]], on `&ticks`.
          - text: "pause has no console open, so Ctrl-C reaches it differently."
            why: |
              The kill reaches it through its group, like any member; how it wakes is the
              question.
        explain: |
          A sleeper whose channel is woken regularly (ticks) notices the kill anyway; one
          waiting for an event that may never come (a line, a pipe write) needs the kill to
          wake it.
  - title: Keeping the shell and init alive, and Ctrl-C with no job
    q: |
      The shell must never die from a Ctrl-C, and `init` must not die at all. With the design
      so far, which group is the foreground group while the shell sits at its prompt? What
      should a Ctrl-C do then, and what should happen to a half-typed command line? Who
      prints the newline and the next prompt after a job is killed: the kernel or the shell?
      Can the shell tell, from `wait`, that its job died from a Ctrl-C?
    hints:
      - "Look at what `wait` reports for a killed job (the exit status is set by [[usertrap]]'s `kexit(-1)`) and at what else exits with -1. Then read [[consoleintr]]'s `^U` case ([[kernel/console.c:155]]) for how the line being edited is represented (`cons.w` to `cons.e`)."
      - "Group 0 is where `init` and the shell are. The kill function must refuse it, and `setfg(0)` must mean \"nobody\". A shell that is blocked in `read` only prints a prompt after `read` returns something."
      - "How does `^U` forget a line, and how does Enter hand one over to a reader? What would the shell do with a line that has nothing in it?"
    answer: |
      At the prompt the foreground group is 0 (the shell's `setfg(0)` after `wait`), and
      group 0 is never killed: `killpgrp` returns 0 for it at once. That one test is all that
      protects `init` and the shell. Remove it, and a Ctrl-C at the prompt kills both:
      `panic: init exiting` (clinic 4).

      Who prints what:

      - The **kernel** echoes `^C` and a newline, as it echoes every other key, from the
        handler ([[consputc]] writes the UART directly and is safe in interrupt context). It
        also drops the line being edited: `cons.e = cons.w` forgets the characters typed since
        the last newline, so `echo jun` then Ctrl-C does not leave `jun` for the shell.
      - The **shell** needs no new code to print the prompt after a killed job: `wait`
        returns, the loop calls `getcmd`, which prints `$ `. It also could not reliably say
        "interrupted": a job killed by Ctrl-C and one killed by a bad memory access both exit
        with status -1.
      - With **no job** to kill, the kernel stores an empty line in the input buffer and
        publishes it (`cons.w = cons.e`). The shell's `read` returns `"\n"`, the shell skips the
        blank command ([[user/sh.c:164]]) and prints a new prompt: `$ ^C`, then `$ `.

      The test for "no job" is "the kill loop found nobody", not "fg is 0". That also covers
      a foreground group whose processes are all gone (see the last question), at the cost
      of an occasional doubled prompt.
    checks:
      - id: lab06-11
        level: 2
        type: choice
        q: |
          A learner's kill loop forgets to refuse group 0. The shell resets the foreground
          group to 0 after every job, as in the reference. You type `echo hi`, then press
          Ctrl-C at the empty prompt. What happens?
        options:
          - text: "init and the shell are both killed, and the kernel panics with init exiting."
            correct: true
            why: |
              Both have pgid 0, the foreground group is 0, so both are marked. `init` is
              asleep in `wait`; the kill wakes it and it exits: [[kexit]] panics
              ([[kernel/proc.c:330]]). Clinic 4 recorded exactly this.
          - text: "Nothing: the foreground group is 0, which matches no process."
            why: |
              It matches every process that never joined a group: `init` and the shell.
          - text: "Only the shell dies, and init starts a new one."
            why: |
              That would be the outcome if `init` were spared. Here `init` is in group 0 too.
          - text: "The shell prints a new prompt, as in the reference."
            why: |
              That needs the kill loop to find nobody, which is what the refusal of group 0
              guarantees.
        explain: |
          "0 means no group" only works if every user of the number agrees. One `if (pgid <= 0)`
          in the kill loop keeps `init` and the shell out of every Ctrl-C.
      - id: lab06-12
        level: 1
        type: multi
        q: |
          In the reference, what does a Ctrl-C typed at an empty prompt (no foreground job)
          do?
        options:
          - text: "echoes ^C and a newline"
            correct: true
            why: "The handler always echoes them, job or no job."
          - text: "drops the line being typed, if any"
            correct: true
            why: "cons.e = cons.w forgets the edited characters."
          - text: "stores an empty line for the reader, so the shell prompts again"
            correct: true
            why: "Only when the kill loop found nobody; the shell skips the blank line and prints $ ."
          - text: "kills the shell, which init then restarts"
            why: "The shell is in group 0, which is never killed."
          - text: "stores the byte 0x03 in the input buffer"
            why: "That is the original kernel's behaviour. The reference handles C('C') in its own case and never stores it."
        explain: |
          Recorded: `$ ^C` followed by a fresh `$ `, and `echo jun^C` followed by a working
          `echo clean`.
  - title: What happens at the edges of a job's life?
    q: |
      Two races remain. First: the job exits just as you press Ctrl-C. The shell has reaped
      it but not yet called `setfg(0)`, so the foreground group names a group whose processes
      are gone. Can that number now belong to someone else? What about the process-table
      slots those processes used, and the fields left in them? Second: the job's leader is in
      the middle of `fork` when the Ctrl-C arrives. The kill loop visits the slots one at a
      time. Can the new child escape?
    hints:
      - "Read [[allocpid]] (is a pid ever reused?), [[freeproc]] (which fields does it clear?) and [[allocproc]] (which does it set?). Which fields of a slot does the kill loop read?"
      - "A kill that sets `killed` on a free slot is not harmless if nothing clears `killed` before the slot's next process runs. And in [[kfork]], the child is in the process table, `USED`, long before it gets its group number."
      - "Which function already resets a slot for reuse? And for the fork: when exactly does the child become visible to the kill loop as a member, and what would have to be held so that the loop and the fork cannot interleave?"
    answer: |
      **The group number cannot come back.** Groups are named after pids, and [[allocpid]]
      only counts up (`nextpid` is never decremented, [[kernel/proc.c:98]]-[[kernel/proc.c:99]]).
      So "the foreground group" can at worst name a group that is empty or contains zombies;
      it never names a later job. A Ctrl-C in that window finds nobody (or only zombies), and
      the shell gets an empty line: a copy with the window artificially widened showed a
      doubled prompt, `$ $ `, and nothing worse.

      **The slots do come back.** If [[freeproc]] leaves the old `pgid` in a free slot, a
      Ctrl-C that names that group marks the *free* slot killed. [[freeproc]] clears `killed`
      only when a slot is freed, and [[allocproc]] does not clear it when the slot is reused,
      so the next process born in that slot starts life killed and dies at its first system
      call. Clinic 5 shows it: after `echo hi; cat` and a Ctrl-C, `ls | wc` prints `0 0 0`,
      because the process that should have become `ls` died at its first `close`. The
      reference clears `pgid` in [[freeproc]]; then a free slot (group 0) never matches.

      **A fork in flight can escape.** In [[kfork]] the child exists (`USED`, in the table)
      from [[allocproc]] on, but gets its group only at the end, just before `RUNNABLE` (line
      307 of the branch's `proc.c`). If the kill loop reaches the child's slot before line 307,
      the child is missed; the parent is killed whenever its own slot is visited, before or
      after. The child then lives on with the group number, unkilled, as an orphan. The window
      is all of [[kfork]] from [[allocproc]] to line 307: [[kfork]] holds the child's
      `p->lock` through the copy, so a kill loop that gets there early waits until the release
      at line 295 and then reads group 0. With the window made wide on purpose (a delay loop in
      [[kfork]] before the child joins its group, only for processes in a job), a Ctrl-C
      half a second after `cat | grep x` showed it: the job's leader died during its first
      `fork`, `grep` was never started, and `cat` (pid 4, slot 3; the leader was in slot 2,
      so the loop visited the parent first) survived and went on reading the console,
      competing with the shell for the next line. A second experiment reproduced it with
      the delay inside the locked part, before line 295. Without a delay it was never seen.

      Closing that window needs one lock held both across the whole kill loop and across
      "copy the parent's group, check whether the parent was killed" in [[kfork]], so that
      either the child already has the group when the loop runs, or the parent's kill is
      visible to the fork. The reference does not do this (it keeps the kill loop as simple as
      [[kkill]]); it is the first item in "further".
    checks:
      - id: lab06-13
        level: 2
        type: tf
        q: |
          True or false: in this tree, after the processes of group 7 have all exited and been
          reaped, a later job may also be given group number 7.
        answer: false
        why_tf: |
          You may be thinking of kernels that recycle pids. This one never does.
        reasons:
          - text: "Group numbers are the leaders' pids, and allocpid only counts up, so 7 is never handed out again."
            correct: true
            why: Right; the reuse to worry about is of process-table slots, not of numbers.
          - text: "freeproc clears pgid, so group 7 stops existing."
            why: |
              Clearing it stops free *slots* from matching group 7. It is not what prevents a
              new job from being numbered 7; [[allocpid]] is.
          - text: "setpgid refuses to create a group with a number that was used before."
            why: |
              `setpgid` checks nothing of the kind. The leader's pid is new, so the group
              number is new.
        explain: |
          `nextpid` grows by one per process ([[kernel/proc.c:98]]-[[kernel/proc.c:99]]). What
          *is* reused is the slot in `proc[]`, and with it every field [[freeproc]] forgets to
          clear: clinic 5.
      - id: lab06-14
        level: 3
        type: choice
        q: |
          The job's leader is inside [[kfork]], between [[allocproc]] and the line that copies
          its group into the child, when the Ctrl-C handler's loop runs over the table. What
          can happen in the reference?
        options:
          - text: "The leader is killed, but the child, which had no group yet when the loop passed its slot, survives with the job's group number."
            correct: true
            why: |
              Right. The loop takes one `p->lock` at a time, so it is not atomic with respect
              to `fork`. A widened-window experiment showed `cat` surviving this way.
          - text: "Both die, because the child inherits killed from its parent."
            why: |
              [[kfork]] copies the group, not `killed`. (Copying `killed` alone would not close
              the window either; the loop may visit the parent after the fork has read it.)
          - text: "The handler deadlocks on the child's p->lock, which kfork holds."
            why: |
              [[kfork]] holds the child's lock through the copy, so the handler may spin, but
              kfork releases it (line 295) without needing anything the handler holds. And
              when it does, the handler reads group 0, because line 307 has not run yet: that
              is the escape.
          - text: "Nothing, because a process in kfork is RUNNING and cannot be killed."
            why: |
              Running processes are killed the same way: the flag is set, and the leader dies
              when its `fork` system call returns.
        explain: |
          A scan that locks one slot at a time sees each slot at a different moment. For
          membership that changes during the scan (a fork), only a lock covering both the
          scan and the change makes the kill all-or-nothing.
build: |
  **Start.**

  ```text
  git checkout -b my-ctrl-c 06aad25
  ```

  Begin with the `pause` program (`user/pause.c`: `pause(atoi(argv[1]))`, add `$U/_pause\` to
  `UPROGS`) so that you have a job that sleeps without reading the console. On the original
  kernel, type `cat`, then Ctrl-C, then Enter, then Ctrl-D: `cat` prints the line holding the
  `0x03` byte, and only Ctrl-D ends it. That is the behaviour you are replacing.

  **Milestones, each one bootable.**

  1. **The group field.** `int pgid` in `struct proc` (under `p->lock`); [[kfork]] copies it
     from the parent into the child before making it `RUNNABLE`; [[freeproc]] clears it.
     Test: boot and run `usertests -q` (nothing uses groups yet).
  2. **`setpgid(pid, pgid)`.** The usual five places for a new system call (`syscall.h`,
     `syscall.c`, `sysproc.c`, `user.h`, `usys.pl`; see lab 1). The target must be the caller
     or a child: hold `wait_lock` to read `p->parent`, then the target's `p->lock`.
  3. **The kill loop and `killpg`.** A group version of [[kkill]], refusing group 0. Write
     `pgtest` now (four sleepers in four places, a watchdog, a survivor in another group) and
     make it pass: everything below the keystroke is tested here.
  4. **The foreground group.** A field in `cons` under `cons.lock`, and `setfg(pgid)`.
  5. **The keystroke.** A `case C('C')` in [[consoleintr]]: drop the edited line, echo, kill,
     `wakeup(&cons.r)`, and the empty line when nobody was found. Test by hand: Ctrl-C at the
     prompt must give a new prompt (the shell does not set a group yet, so this is the only
     case you can try).
  6. **The shell.** `setpgid` on both sides of the `fork` in `main`, `setfg` around `wait`, and
     `setpgid(0, 0)` in the background case. Now `cat`, `pause 1000` and `cat | grep x` can be
     interrupted.
  7. **The driver.** A script that boots QEMU with its standard input on a pipe and writes
     `\x03` there (the reference's `ctrlc-test.py`). Run it, then `pgtest`, `usertests -q`,
     `pgtest` again.

  **Typing Ctrl-C into QEMU.** With `-nographic` and a terminal, Ctrl-C reaches xv6 (QEMU's
  own escape key is Ctrl-A). From a script, write the byte `\x03` to QEMU's standard input.

  **Debugging advice.** For breakpoints at boot, start QEMU halted with
  `-S -gdb tcp::GDBPORT` (`GDBPORT` is any free port, e.g. 25501), or use `make qemu-gdb`,
  which picks its own port; for a Ctrl-C you can also attach later.

  - `break console.c:NNN` on your new `case` and look at `bt`: you will see whether the
    interrupt came through `kerneltrap` (the hart was in the kernel, often idle in
    [[scheduler]]) or [[usertrap]]. Print `cpus[i].noff` and `cpus[i].intena` for the hart
    `info threads` calls CPU#i (gdb numbers threads from 1: Thread 1.1 is CPU#0) to check
    your locking.
  - A Ctrl-C that seems to do nothing: type Ctrl-P. [[procdump]] lists every process and its
    state without taking any lock. A victim still `sleep` after the Ctrl-C was never woken.
  - A machine that stops answering after Ctrl-C (even Ctrl-P prints nothing): attach gdb and
    run `thread apply all bt`. Three harts spinning in [[acquire]] is a deadlock; look at
    which lock each one holds (`p wait_lock`, and `proc[i].lock.cpu` for every slot).
  - A command that silently prints nothing right after a Ctrl-C: suspect a process born
    killed. Break on `kexit` and print `p->pid` and the slot number `p - proc`.
clinic:
  - bug: Killing everything except init
    change: |
      No groups at all: Ctrl-C kills every process but `init`. In the reference kill loop:

      ```diff
      -  if (pgid <= 0)
      -    return 0; // group 0 is "no group": init and the shell
         for (p = proc; p < &proc[NPROC]; p++) {
