    commit: 5
    file: kernel/console.c
    lines: 146-192
    focus: 163-172
    state:
      hart: 2
      mode: S
      proc: none (scheduler)
      intr: "off"
      satp: kernel
      locks: [cons.lock]
      irq: {noff: 1, intena: 0}
      stack: [scheduler, kernelvec, kerneltrap, devintr, uartintr, consoleintr]
      sp: {"on": scheduler}
    note: |
      If the kill loop found nobody (at the prompt, or a group whose processes are gone), the
      reader gets an empty line: one `\n` stored and published by moving `cons.w`, exactly as
      a typed Enter would, minus the echo (the handler already echoed a newline). The shell's
      `read` returns it, the shell skips the blank command and prints a fresh `$ `. The test
      on line 163 also checks for room, as the default `case` does: a buffer full of
      unread lines gets nothing more.

      Line 171 is the subtle one, and it runs in both cases. A reader that was killed while
      fully asleep is already `RUNNABLE`. But a reader that had released `cons.lock` and not
      yet reached [[sleep]] is still `RUNNING`, with `p->chan` = `&cons.r`; the kill loop
      only set its `killed`. [[wakeup]] clears its `chan`, so [[sleep]] returns at once
      instead of sleeping until the next Enter. When nobody was killed, the same call wakes
      the shell for its empty line. (It helps only readers of the console; a victim in the
      same window in [[piperead]] or [[kwait]] is not covered, as the think section explains.)

      Recorded: the wakeup at line 171 ran on hart 2 with noff 1 still (each `p->lock` inside
      [[wakeup]] makes it 2 for a moment).
    others: |
      The window this line closes, as it would play out:

      | time | hart 0: `cat` | hart 2: this handler |
      |---|---|---|
      | 1 | `killed`? no; `sleep_prepare(&cons.r)`; `release(&cons.lock)` | spins on `cons.lock` |
      | 2 | | acquires; `cat` is `RUNNING`: `killed = 1` only |
      | 3 | | `wakeup(&cons.r)`: `cat`'s `chan` = 0 |
      | 4 | [[sleep]]: `chan` is 0, return at once | |
      | 5 | loop: `killed`? yes: return -1 | |

      Without line 171, step 4 would put `cat` to sleep with `killed` set, until the next
      line arrived.
