      The in-kernel test. A leader in a new group forks three members; together they are
      asleep in four different places: [[kwait]] (the leader), [[piperead]] on a pipe whose
      write end the member holds itself (so it never sees end-of-file), [[sys_pause]], and
      [[consoleread]]. Each writes its pid to `ready` just before blocking; `pgtest` waits
      half a second more so that all four are really asleep, then calls `killpg` once.

      How does a test know they all exited, without a way to ask? Every member inherited
      `done[1]` and `pgtest` closed its own copy (line 87), so the `read` on line 109 returns
      0 (end-of-file) only when all four have exited and closed it. If the kill failed to
      wake someone, that `read` would block forever, so a watchdog (lines 95-105) writes one
      byte to the pipe `wd`, then kills the members one by one with `kill()` after 3 seconds.
      `pgtest` reports `FAIL` if that byte is there once the watchdog has exited: clinic 3
      shows that line failing. (The byte, rather than the watchdog's exit status, is the
      evidence: a watchdog preempted right after its last `kill()` would be killed by `pgtest`
      itself and exit with -1 just like one that never acted.)

      A process in another group (forked first, line 59) must still answer on its pipe after
      the `killpg`. The last line of the output says what this program cannot test: the
      keystroke.
