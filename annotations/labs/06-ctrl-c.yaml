      - Line 180: only now is the group made the foreground one. It has a member, so a
        Ctrl-C from this moment on finds the job. (Before it, from `fork1()` on, the
        foreground group is still 0: a Ctrl-C there only produces an empty line, which the
        new job may read.)
      - Line 182: after `wait`, nobody is in front. A Ctrl-C at the prompt finds group 0,
        is refused, and gets an empty line.

      The shell itself never calls `setpgid` for itself: it stays in group 0 with `init`,
      the group no Ctrl-C can reach.

      The recorded sequence for `cat`: `fork` → pid 4; shell `setpgid(4, 4)`; shell
      `setfg(4)`; pid 4 `setpgid(0, 0)`; pid 4 execs `cat`; Ctrl-C; `wait` returns 4;
      `setfg(0)`.
