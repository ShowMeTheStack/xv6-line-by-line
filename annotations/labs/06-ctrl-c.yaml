      next `\x03` breaks. `echo` writes its argument and the newline with two separate
      `write` calls, so the kernel's `^C\n` can land between them and the next check sees
      `^C\n\n$ `. The test waits for `survived\n`. Output from three harts and a test
      driver interleaves at byte granularity; tests must wait for whole lines.

