      ```
    symptom: |
      $ cat
      ^C

      $ pause 1000
      ^C
      $ cat | grep x
      ^C

      $ pgtest
      pgtest: setpgid on a process that is not our child fails: OK
      pgtest: killpg(0), the group of init and the shell, is refused: OK
      pgtest: killpg finds the group (wait, pipe read, pause, console read): OK
      pgtest: every member exited: OK
      pgtest: ...within 3 seconds, without the watchdog's kill(): FAIL
      pgtest: the leader exited with status -1, like any killed process: OK
      pgtest: a process in another group survives: OK
      pgtest: SOME TESTS FAILED
      $
    why: |
      After each `^C` that is followed by an empty line, the console printed nothing for
      the 5 seconds the run waited; the empty line is the echo of the Enter pressed after that. After
      `pause 1000` the prompt came back with no key pressed.

      - **`cat`** is marked killed but stays asleep on `&cons.r`. Nothing wakes that channel
        until a whole line arrives. When Enter was pressed, the kernel echoed the newline
        (the empty line in the transcript) and woke `cat`; `cat` found the `\n` in the
        buffer, *read it* (the loop only tests `killed` while the buffer is empty), returned
        1 from `read`, and [[usertrap]] killed it on the way back. The shell prompted.
      - **`pause 1000`** died at once anyway: [[clockintr]] wakes `&ticks` ten times a second,
        and [[sys_pause]]'s loop checks `killed` every time. This is why the bug is easy to
        miss if you only test `pause`.
      - **`cat | grep x`**: `cat` is stuck as above, `grep` sleeps in [[piperead]] and the
        pipe's parent in [[kwait]]. After Enter, `cat` exits; its exit closes the pipe's
        write end, which wakes `grep` (it reads end-of-file, returns, and is killed), and
        wakes the parent through [[kexit]]'s `wakeup(p->parent)`.
      - **`pgtest`** catches it without anyone typing: its pipe reader and console reader
        never wake, and after 3 seconds the watchdog kills them one by one with `kill()`,
        whose [[kkill]] does wake them. The `pause` member and the leader die on their own.

      A second copy kept `wakeup(&cons.r)` and dropped only the `RUNNABLE`. All three
      interactive cases then worked (the console wakeup rescues `cat`, and the rest follow from
      its exit), but `pgtest` still failed the same check: its pipe reader and its console
      reader both stay asleep (`killpg` from a system call never runs the console's
      `wakeup(&cons.r)`, which only a keystroke triggers). That is why the reference keeps
      both.
  - bug: Group 0 is not refused
    change: |
      The kill loop forgets that 0 means "no group":

      ```diff
      -  if (pgid <= 0)
      -    return 0; // group 0 is "no group": init and the shell
         for (p = proc; p < &proc[NPROC]; p++) {
      ```
    symptom: |
      init: starting sh
      $ echo hi
      hi
      $ ^C
      panic: init exiting
    why: |
      At the prompt the foreground group is 0, the value the shell sets after every job.
      `init` (pid 1) and the shell (pid 2) never joined a group, so their `pgid` is 0 too: `init`
      got 0 from the zeroed process table, and the shell copied it from `init` in [[kfork]].
      The Ctrl-C marks both and wakes both: the shell from its `read` of the console, `init`
      from `wait`. [[kwait]] sees `killed` and returns -1, and on its way back to user space
      [[usertrap]] calls `kexit(-1)`; for `init`, [[kexit]] panics at its first line
      ([[kernel/proc.c:330]]). Whether the shell got there first does not matter.

      The fix is a single test, but the lesson is about sentinel values: the shell, the
      console and the kill loop all use 0 to mean "nobody", and the processes that never
      joined a group also hold 0. Every function that takes a group number must agree on
      what 0 means. The reference refuses it in the kill loop, and `killpg(0)` returns -1,
      which `pgtest` checks.
  - bug: A freed slot keeps its group number
    change: |
      [[freeproc]] resets every field it knows about, but the learner forgot the new one:

