      init: starting sh
      $ echo hi; cat
      hi
      ^C
      $ ls | wc
      0 0 0
      $ echo after
      after
      $

      # a second boot under gdb, same steps; one record from a breakpoint at
      # usertrap's kexit(-1) for a killed system call (trap.c:58):
      {"tag": "syscall-kexit", "n": 1, "hart": 2, "cur": {"pid": 6, "name": "sh", "state": "RUNNING", "pgid": 5, "slot": 3, "killed": 1, "kstack": "0x3fffff7000"}, "noff": 0, "intena": 0, "sie": 0, "sp": "0x3fffff7fe0", "satp": "0x8000000000087fff", "ticks": 14, "fg": 5, "bt": ["usertrap", "0x3ffffff09c"], "a7": 21}
