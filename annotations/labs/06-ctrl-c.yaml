verify: |
  On the branch (`ext/06-ctrl-c`, 9 commits), run on 3
  harts (`-smp 3 -m 128M`) by `ctrlc-test.py kernel fs.img -- pgtest "usertests -q" pgtest`,
  all in one boot:

  ```text
  $ cat
  ^C
  $
  ### ctrlc-test: cat waiting for input, then ^C: OK
  pause 1000
  ^C
  $
  ### ctrlc-test: pause 1000, then ^C (prompt after 0.001 s): OK
  cat | grep x
  ^C
  $
  ### ctrlc-test: cat | grep x, then ^C: OK
  [...]
  ### ctrlc-test: the shell was never restarted: OK
  pgtest
  pgtest: setpgid on a process that is not our child fails: OK
  [...]
  pgtest: ALL OK (the Ctrl-C keystroke itself is tested by ctrlc-test.py)
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  [...]
  ALL TESTS PASSED
  $ pgtest
  [...]
  pgtest: ALL OK (the Ctrl-C keystroke itself is tested by ctrlc-test.py)
  $
  ctrlc-test: 10 of 10 checks OK
  ctrlc-test: ALL OK
  ```

  (The `### ctrlc-test:` lines are the driver's own, printed between the console output it
  passes through.) Two more boots with the same commands gave the same result: 10 of 10,
  `pgtest` ALL OK twice, ALL TESTS PASSED.

  What it shows: Ctrl-C reaches a reader of the console, a sleeper in `pause`, and all
  three processes of a pipeline; a background job lives through it; at the prompt it only
  produces a new prompt; and the shell is never restarted. `pgtest` shows that `killpg` wakes
  sleepers in [[kwait]], [[piperead]], [[sys_pause]] and [[consoleread]] without help.
  `usertests -q` passing shows that nothing else changed, including `kill` itself
  (`killstatus`, `kill`-based tests) and every program that forks and waits, now through a
  shell that calls three new system calls per command.

  The same `ctrlc-test.py` against the original kernel: `ctrlc-test: 1 of 10 checks OK`
  (only "the shell was never restarted"). `^C` is stored as the byte `0x03` and the first
  `cat` is never interrupted, so it reads every line typed after it: the driver's
  `echo alive` came back twice, once as the console's echo and once printed by `cat`.

  Every commit builds on its own (`make kernel/kernel fs.img`, only the usual RWX link
  warning).
measure: |
  **How fast does a Ctrl-C take effect?** Time from writing `\x03` to QEMU's standard input
  until the next `$ ` came back, measured by the driver on the host (no gdb attached; QEMU
  10.2.1, 3 harts):

  | foreground job | where the victims were | prompt after |
  |---|---|---|
  | `cat` | asleep in [[consoleread]] | 0.001 s |
  | `pause 1000` | asleep in [[sys_pause]] (would have taken 100 s) | 0.001 s |
  | `cat \| grep x` | [[kwait]], [[consoleread]], [[piperead]] | 0.006 s |
  | `spin` (a loop in user mode, no system calls; not on the branch) | running on another hart | 0.001 s, three times |

  Everything is bounded by the time the victims need to be scheduled and exit, and the
  shell to be woken: a few milliseconds of emulated time. The surprise is `spin`. It is
  running when the kill arrives and only dies at its next trap; one would expect that to be
  its hart's next timer interrupt, up to 1/10 s later. gdb (four Ctrl-Cs) showed something
  else: the Ctrl-C was always taken by an idle hart, and `spin` died on another hart a moment
  later at an external-interrupt trap (`scause` `0x8000000000000009`), in the same tick.
  An instrumented [[devintr]] showed that in 5 of 5 kills, `spin`'s hart took that
  trap but its `plic_claim()` returned 0. The PLIC signals the interrupt to every hart,
  another hart claimed and handled the UART, and the empty trap was still enough to bring
  `spin` into [[usertrap]]'s `killed` test. Do not rely on it: the timer is the guarantee.

  **The original kernel.** The same keystroke on 06aad25 (control bytes shown as `cat -v`
  shows them; `^C` here is the single byte `0x03`, echoed back by the UART, not the two
  characters the branch prints):

  ```text
  $ cat
  ^C
  ^C
  ^D$ echo after
  after
  ```

  `cat` waits for Enter, then prints the line holding the `0x03` byte, and only Ctrl-D ends
  it. And with `spin` (added for this measurement), Ctrl-C changes nothing; five seconds
  later Ctrl-P still lists `3 run    spin`. There is no way back to the prompt but a reboot.

  **The windows, made wide on purpose** (scratch copies with an added delay, not the
  branch):

  - A `pause(20)` between the shell's `wait` and `setfg(0)`: a Ctrl-C pressed after `echo
    hi` finished found only a reaped group and produced an empty line, and the console
    showed `$ $ ` (two prompts). Nothing was killed; `ls | wc` afterwards printed `26 104
    660`.
  - A delay loop in [[kfork]] before the child joins its group (only for processes already
    in a job): Ctrl-C half a second after `cat | grep x` killed the leader in the middle of
    its first `fork`, and Ctrl-P showed `cat` (pid 4) still alive. The next line typed, `xx`, went to
    that orphan `cat`, not to the shell (`cat: write error`, since `grep` never existed).
further: |
  - **Close the fork window.** Add a spinlock (say `pgrp_lock`) held across the whole kill
    loop and across the moment in [[kfork]] when the child copies its parent's group; in that
    critical section also copy the parent's `killed`. Work out the new lock order
    (`cons.lock` → `pgrp_lock` → `p->lock`) and check it against every existing path. Note
    the side effect: copying `killed` also lets a plain `kill(pid)` of a forking parent kill
    its new child, which `kill` did not do before. The alternative is for [[kfork]] to free
    the child and return -1 when, under that lock, it finds the parent killed. (A
    `pgrp_lock` version was built and tested: no escape with the delay, all tests
    passing without it.)
  - **Close the sleep window for every victim.** Clear `p->chan` in the kill loop, under
    `p->lock`, so that any victim between [[sleep_prepare]] and [[sleep]] returns at once,
    whatever it waits for; `wakeup(&cons.r)` is then needed only for the empty line. Check
    that every sleep loop in the tree re-checks its condition (they do), and measure that
    nothing changes for the tests.
  - **Signals instead of kill.** Let a process choose what Ctrl-C does to it: a handler
    (as in lab 5's `sigalarm`) or ignore. `sh` would ignore it, and the kernel would no longer
    need group 0 to protect the shell. You will need a pending-signal bit and a check in
    [[usertrap]] alongside `killed`.
  - **Ctrl-Z and job control.** A `STOPPED` state that the scheduler skips, a `^Z` that stops
    the foreground group, and `fg`/`bg` in the shell. Teaches why a stopped process must still
    be reapable and killable, and why the shell must hear about stops through `wait`.
  - **Only the foreground job may read.** Make a background job that reads the console sleep
    (or fail) instead of stealing the shell's input, as Unix's `SIGTTIN` does. The orphaned
    `cat` in the fork-window experiment shows why this matters.
  - **An exit status that says why.** Make `wait` report "killed by Ctrl-C" distinctly from
    "killed for a fault", so the shell can print a newline or a message only when it should.
