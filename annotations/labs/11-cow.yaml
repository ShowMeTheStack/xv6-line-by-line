  cowtest: lazy: OK
  cowtest: copyout: OK
  cowtest: independence: OK
  usertrap(): unexpected scause 0xf pid=8
              sepc=0x55c stval=0x508
  cowtest: text: OK
  cowtest: forks: OK
  cowtest: free pages 32436 before, 32436 after
  cowtest: no leaks: OK
  cowtest: ALL OK
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  ...
  test nowrite: usertrap(): unexpected scause 0xf pid=6770
  ...
  OK
  ...
  ALL TESTS PASSED
  ```

  The `usertrap()` lines are the expected kills: `cowtest text` and `usertests nowrite` store to
  text and must die. `usertests -q` passing shows that everything the original kernel did
  still works: `copyout` into text still fails, the guard page still faults (`stacktest`),
  lazy allocation still works through `fork` (`lazy_*`), and the free-page count at the end
  equals the one at the start. `cowtest` run again after `usertests` and again after
  `ls | wc` (all in one boot) reports the same 32,436 free pages; since `cowtest` now
  requires the counts to be *equal*, a page freed while still mapped would fail it as surely
  as a leak.

  The same `cowtest` on the original kernel: `cowtest: fork failed`, `big: FAIL`, all other
  checks OK, 32,468 free pages. The 32-page difference is the reference-count array.
measure: |
  **Pages per `fork`.** A scratch copy of each kernel counted every [[kalloc]] against the
  process that made it, and printed the count for each `fork` and `exec` (instrumentation not
  on the branch):

  | event | original | copy-on-write |
  |---|---|---|
  | `fork` of `sh` (pid 2 → 3) | 11 pages: 4 [[allocproc]] + 5 copied + 2 page-table | 6 pages: 4 [[allocproc]] + 2 page-table |
  | the child's copies before `exec("echo")` | 0 | 2 (stack `0x4000`, data `0x2000`) |
  | `exec("echo")` | 9 | 9 |
  | the shell's next stores to `0x2000` and `0x4000` | 0 | 0 (two takeovers, no copy) |

  **`ls | wc`.** The shell forks a child (pid 4) that parses the line (allocating a 16-page
  heap with `malloc`), creates the pipe, and forks the two sides:

  | | original | copy-on-write |
  |---|---|---|
  | fork 2 → 4 | 11 | 6 |
  | fork 4 → 5 (`ls`) | 27 (its 16 heap pages copied too) | 6 |
  | fork 4 → 6 (`wc`) | 27 | 6 |
  | copy-on-write copies | 0 | 4 (3 in pid 4, 1 in pid 6) + 1 takeover in pid 5 |
  | `exec` of `ls` and `wc` | 9 + 9 | 9 + 9 |
  | **fork + exec total** | **83 pages** | **40 pages** |

  The pages that pid 4's heap occupies (16), the pipe (1) and `exec`'s argument pages are the
  same in both. Copy-on-write halves the cost of a pipeline of tiny programs; the bigger the
  forking process, the bigger the saving, up to the `cowtest big` case where the original
  kernel cannot fork at all.

  **What it costs.** 32 pages (128 KiB) of `.bss` for the counts, one spinlock round trip per
  page per `fork`, and one trap per first write to a shared page (a full [[uservec]] /
  [[userret]] round trip plus a 4096-byte copy, the same copy the original `fork` made
  eagerly).
further: |
  - **Share page-table pages too.** `fork` still allocates the child's page-table pages (2 for
    `sh`, about 40 for `cowtest big`). Sharing level-0 page-table pages read-only and copying
    them on demand is how real kernels make `fork` of a huge process cheap; it teaches how the
    walk itself can be copy-on-write.
  - **Per-page metadata instead of an array of ints.** Replace `kref.count` with a `struct
    page` per physical page (count, flags, a list link). This is how Linux organizes memory,
    and it prepares for swapping (lab 16) and `mmap` (lab 15).
  - **Atomic counts without a lock.** Use `__atomic_fetch_add` / `__atomic_sub_fetch` on the
    counters (RISC-V `amoadd.w`) and remove `kref.lock`. Work out why the decrement-and-test
    becomes one instruction's result, and measure lock contention before and after with the
    `refrace` program.
  - **vfork.** A `vfork` that lends the parent's page table to the child until it calls `exec`
    costs even less than copy-on-write. Find out what it forbids the child to do, and why.
  - **Threads break the takeover argument.** After lab 9 (`clone`), two threads share a page
    table, so a count of 1 can rise while the handler is deciding. Fix `cowfault` for that
    world.
