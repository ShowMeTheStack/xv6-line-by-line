      tries to give up the CPU with any spinlock other than its own `p->lock` held
      ([[concept:locks#rules]]). [[kalloc]] and [[kfree]] never sleep, so the rule holds; and
      if memory has run out, [[copyout]] just fails and `read` returns what it copied so far.

      The lock-order graph gains edges: `pi->lock` → `kmem.lock` and `pi->lock` →
      `kref.lock`. An edge into a lock that takes nothing else cannot close a cycle, since
      neither `kmem.lock` nor `kref.lock` is ever held while acquiring anything.
