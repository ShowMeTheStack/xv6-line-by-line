    symptom: |
      $ cowtest
      cowtest: big: OK
      cowtest: lazy: OK
      cowtest: copyout: OK
      cowtest: independence: OK
      cowtest: text: FAIL
      cowtest: forks: OK
      cowtest: free pages 32436 before, 32436 after
      cowtest: no leaks: OK
      cowtest: SOME TESTS FAILED
      $ usertests -q
      usertests starting
      test copyout: usertrap(): unexpected scause 0x2 pid=211
                  sepc=0x676 stval=0x2c61646b
      FAILED
      SOME TESTS FAILED
    why: |
      Text pages are mapped `R|X|U` with no `W` ([[flags2perm]], [[kernel/exec.c:72]]). After a
      `fork`, this kernel marks them `PTE_COW` as well, so a store to text is no longer fatal:
      the handler sees `V|U|COW`, copies the page, and *adds* `PTE_W`. In `cowtest text` the
      child's store to its own function succeeds and it exits with status 0: `FAIL`.

      `usertests` stops at its second test. `copyout` ([[user/usertests.c:79]]) runs in a
      forked child (every test does), so its text pages are COW. It calls `read(fd, 0, 8192)`
      on `README`: the kernel's [[copyout]] sees `PTE_COW` on page 0, gives the child a
      private writable copy of its code page, and writes 8192 bytes of README over it. When
      `read` returns, the child executes README as machine code. `sepc=0x676` is inside the
      test function, and `stval=0x2c61646b` is the illegal instruction it found there: the
      bytes `6b 64 61 2c`, the text `kda,`, which is exactly what README contains at byte
      offset 1654 = `0x676`. Cause 2, illegal instruction, kills the child, and the test fails.

      The `PTE_W` test in [[uvmcopy]] is the only thing that separates "shared for now" from
      "read-only for good"; bit 8 records that decision for the fault handler.
