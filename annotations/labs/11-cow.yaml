    change: |
      In [[uvmcopy]], the `PTE_W` test is dropped, so read-only pages are marked COW too:

      ```diff
      -    if (*pte & PTE_W) {
      -      // the parent must stop writing it too.
      -      *pte = (*pte & ~PTE_W) | PTE_COW;
