  - title: A PTE bit that the hardware ignores
    commit: 2
    file: kernel/riscv.h
    lines: 389-410
    focus: 395-400
    diff: true
    state:
      hart: any
      proc: "(a definition: used by every page-table operation below)"
      locks: []
    note: |
      A copy-on-write page and a text page look the same to the hardware: `V`, `R`, `U` set,
      `W` clear. The kernel needs to remember which is which, and the place to remember it is
      the PTE itself. Bits 0-7 are interpreted by the [[g:sv39]] walk (`V R W X U G A D`).
      Bits 8 and 9, the RSW field, are "reserved for supervisor software": the hardware
      ignores them. `PTE_COW` is bit 8.

      Two consequences worth seeing:

      - `PTE_FLAGS` keeps the low 10 bits (`0x3FF`), so it already carries bit 8 along when a
        PTE's flags are copied, and [[freewalk]]'s leaf test, which looks at `R|W|X` only, is
        unaffected.
      - A COW PTE observed with gdb on this branch: `0x21fcf1d3`, physical page `0x87f3c`,
        flags `0x1d3` = `V|R|U|A|D|COW` (QEMU sets the A and D bits as pages are used). A text
        page of `sh` has `X` set and never bit 8.
