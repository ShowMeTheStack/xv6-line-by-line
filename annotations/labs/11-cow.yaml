      | time | hart 0: pid 2 stores to `0x4000` | hart 2: pid 3 stores to `0x4000` |
      |---|---|---|
      | 1 | `krefcount` → 2 | `krefcount` → 2 |
      | 2 | [[kalloc]], copy, remap own PTE | [[kalloc]], copy, remap own PTE |
      | 3 | [[kfree]] old: 2 → 1, keep | |
      | 4 | | [[kfree]] old: 1 → 0, free |

