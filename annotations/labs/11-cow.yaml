      loop between the load and the store): `refrace` failed on its first run with `32441`
      and the same panic, yet `usertests -q` and `cowtest` still passed on that copy, because
      they rarely change the same counter from two harts at once.

      The lesson: a passing test suite says little about a missing lock. Reason it out from the
      interleaving table, then write a test that makes the interleaving likely.
