      The story of this tour, recorded on three harts with gdb attached and with a counting
      copy of the kernel: the machine boots, you type `echo hi`, the shell (pid 2) forks pid 3,
      pid 3 writes its stack and data pages, then calls `exec`. Later steps follow `cowtest`'s
      `read` into a shared buffer and `wait` reaping a child.

      Commit 1 prepares the allocator for pages with several owners. `kref.count` has one `int`
      per physical page from [[KERNBASE]] to [[PHYSTOP]]: 32,768 entries, 128 KiB in `.bss`.
      In this build `kref` sits at `0x8000f9c0`, right after `kmem`, and the array begins 24
      bytes later, after the spinlock. `PA2REF` turns a page's physical address into its index.

      The count means "how many page tables map this page", with one convention: a page that
      [[kalloc]] has handed out counts 1 even before it is mapped (page-table pages,
      trapframes and pipe buffers are never shared, so they stay at 1).

      `kref.lock` is a new spinlock, separate from `kmem.lock`. [[kinit]] runs on hart 0 before
      the other harts are released from their wait in [[main]], with interrupts off and
      paging off; initializing both locks here is the same pattern as before.
    others: |
      Harts 1 and 2 are spinning in [[main]] on `started`, which hart 0 sets only after
      [[userinit]]. Nobody else can touch the allocator yet.
