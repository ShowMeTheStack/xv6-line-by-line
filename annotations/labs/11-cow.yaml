      $ forkoom
      forkoom: 2 pages free: fork failed
      usertrap(): unexpected scause 0xc pid=3
                  sepc=0x1000 stval=0x1000
      panic: kfree: refcount

      # gdb, breakpoint on the new kfree in uvmcopy:
      uvmcopy (old=0x87f28000, new=0x80041000, sz=132874240) at kernel/vm.c:317
      #1 kfork () at kernel/proc.c:271  #2 sys_fork  #3 syscall  #4 usertrap
      i = 0x0, pa = 0x87f25000, kref.count[pa] = 1
      # after the kfree:
      kref.count[pa] = 0
      0x87f25000:  0x00000000  0x00000000  0x01010101  0x01010101
      # breakpoint on the panic:
      #0 kfree (pa=0x87f25000) at kernel/kalloc.c:72
      #1 uvmunmap (pagetable=0x87f28000, va=0, npages=32440, do_free=1)
      #2 uvmfree  #3 proc_freepagetable  #4 freeproc (p=<proc+720>)
      #5 kwait (addr=0)  #6 sys_wait  #7 syscall  #8 usertrap
      myproc()->name = "sh", pid 2, mycpu()->noff = 3

      # the reference branch, same program: "fork failed" for every k,
      # then cowtest: ALL OK.
    why: |
      With 2 pages given back, [[allocproc]] itself fails (it needs 4: the trapframe, the root
      page table and the two page-table pages under the trampoline); that is the `fork failed`
      line, and the buggy code is not reached. On the next round, 4 pages, [[allocproc]] takes
      all of them and the very first [[mappages]] in [[uvmcopy]] (page `i` = 0, which needs a
      new level-1 and level-0 page-table page) fails. That round never prints its line,
      because `forkoom` dies first. (An instrumented copy printed `allocproc failed`, then
      `uvmcopy failed`, then the kill.) The buggy path then calls [[kfree]] on page 0 of the **parent**, its only text
      page, whose count is 1 because nothing has been shared yet. The count goes to 0, and
      [[kfree]] does what it does with a free page: fills it with `0x01` bytes and stores the
      free-list link in its first 8 bytes (here 0, because memory was exhausted and the list
      was empty). gdb shows exactly that at `0x87f25000`.

      `fork` returns -1 to `forkoom`, but its code page is now junk while its PTE
      still maps it. The hart returns to the instruction after the `ecall`, inside page 0, and
      runs the junk: `0x0101` decodes as a compressed `addi sp, sp, 0`, a no-op, so it slides
      to the end of the page and fetches from `0x1000`. In `forkoom` that is the data page,
      mapped without `X`: instruction page fault, `scause 0xc`, and the process is killed.

      The panic comes later, on another process's stack: the shell (pid 2) reaps the zombie in
      [[kwait]] → [[freeproc]] → [[uvmunmap]], which drops page 0 again, finds count 0, and
      panics. noff is 3 at that moment: `wait_lock`, the zombie's `p->lock`, and `kref.lock`.

      This panic is the *lucky* outcome. Had the freed page been handed to another process in
      between, its count would have been 1 again, and this second drop would have freed a page
      that someone else is using, with no message at all. The error path must undo exactly
      what the loop did: the child's references for pages `0 .. i-1`, which
      `uvmunmap(new, 0, i / PGSIZE, 1)` already does.
