      +    if (flags & PTE_W)
      +      flags = (flags & ~PTE_W) | PTE_COW;
      ```
    symptom: |
      $ cowtest
      cowtest: big: OK
      cowtest: lazy: OK
      cowtest: copyout: OK
      cowtest: independence: FAIL
      usertrap(): unexpected scause 0xf pid=8
                  sepc=0x55c stval=0x508
      cowtest: text: OK
      cowtest: forks: OK
      cowtest: free pages 32436 before, 32436 after
      cowtest: no leaks: OK
      cowtest: SOME TESTS FAILED
      $ usertests -q
      usertests starting
      ...
      ALL TESTS PASSED
    why: |
      The child is protected: its PTE is read-only, its first store copies. The parent is not:
      its PTE still has `PTE_W`, so its stores go straight into the physical page that the
      child is also mapping, with no fault. `cowtest independence` makes the parent write
      `shared = 2` and only then lets the child look: the child reads 2 instead of 1 and exits
      with status 1, and the parent's `read` on the pipe returns 0 (the child's write end was
      closed by its exit): `FAIL`.

      (`cowtest` closes the unused pipe ends for this reason. With them left open, this bug
      makes the test hang instead: gdb showed the parent `SLEEPING` in [[piperead]] and the
      child a `ZOMBIE`.)

      **`usertests -q` passes.** Its tests check what a child sees right after `fork`, and
      parents mostly just `wait`. The parent's own stack writes do land in the child's stack
      page too, until the child's first store gives it a copy; in this run that never broke a
      test. A copy-on-write kernel with this bug passes the standard suite and corrupts
      memory between processes in real programs. "Both page tables" in the design is not a
      detail.
  - bug: Off by one in the reference-count index
    change: |
      The index macro adds one, a typical slip when thinking of "page numbers" as counting
      from 1:

      ```diff
      -#define PA2REF(pa) (((uint64)(pa) - KERNBASE) / PGSIZE)
      +#define PA2REF(pa) (((uint64)(pa) - KERNBASE) / PGSIZE + 1)
      ```
    symptom: |
      $ cowtest
      ...
      cowtest: free pages 32436 before, 32436 after
      cowtest: ALL OK
      $ usertests -q
      ...
      ALL TESTS PASSED

      # gdb, before kvminit (after kinit):
      p &kref.count[32768]      = (int *) 0x8002f9d8 <pid_lock>
      p &pid_lock               = (struct spinlock *) 0x8002f9d8 <pid_lock>
      p pid_lock.locked         = 0
      # after kvminit, before procinit:
      p/x kernel_pagetable      = 0x87fff000
      p pid_lock.locked         = 1
      # after procinit:
      p pid_lock.locked         = 0
    why: |
      Everything passes, and that is the lesson. Shifting every index by one is still a
      one-to-one mapping from pages to counters, so for every page but one the bug is
      invisible. The exception is the last page of RAM, `0x87fff000`, whose index becomes
      32,768: one past the end of the array. In this build the linker placed `pid_lock`
      right after `kref`, so that counter *is* `pid_lock.locked`.

      And that page is touched early: [[freerange]] frees pages in increasing order, so
      `0x87fff000` is the head of the free list, and the very first [[kalloc]], in
      [[kvmmake]], returns it for the kernel's root page table. Setting its count to 1 set
      `pid_lock.locked` to 1: the lock looked held, by no CPU (`pid_lock.cpu` was 0), and nobody would ever release it. It was saved by
      pure luck: [[procinit]] runs next and its [[initlock]] writes `locked = 0`. The kernel
      page table is never freed, so the count is never touched again.

      Move the array, or free that page later, and the first [[allocpid]] would spin forever
      on a lock nobody holds, or a decrement would silently unlock someone's lock. Index
      arithmetic needs a bounds check you can see: a `panic` if `PA2REF(pa)` is not below the
      array size, or a test that `PA2REF(PHYSTOP - PGSIZE)` is the last entry.
