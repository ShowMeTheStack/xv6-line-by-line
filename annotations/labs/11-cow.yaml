    change: |
      [[uvmcopy]] computes read-only COW flags for the child but leaves the parent's PTE
      writable:

      ```diff
      -    if (*pte & PTE_W) {
      -      // the parent must stop writing it too.
      -      *pte = (*pte & ~PTE_W) | PTE_COW;
      -    }
