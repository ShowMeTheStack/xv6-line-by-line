measure: |
  **Pages cost only when touched.** `mmaptest read` counts free pages around one touch of a
  3-page mapping: `touching 1 of 3 mapped pages took 1 free pages`, on every run. `mmap`
  itself allocates nothing, and no page-table page is needed either: the mapping lies in the
  same 2 MiB as the trapframe, under a level-0 page table that exists from the start.

  **Write back what changed.** A scratch benchmark (not on the branch) maps a 64-page file
  shared, reads one byte from every page, stores one byte into page 0, and unmaps, 10 times;
  a copy of each kernel printed how many pages each such `munmap` wrote back. Three runs each,
  one boot each:

  | kernel | pages written back per `munmap` | 10 rounds, ticks |
  |---|---|---|
  | reference (`D` bit) | 1 | 8, 8, 7 |
  | clinic 6 (every loaded page) | 64 | 60, 100, 53 |

  A tick is 1,000,000 timer cycles ([[kernel/trap.c:179]]), 0.1 s on QEMU's 10 MHz clock: about
  0.8 s against 5 to 10 s for the same ten rounds. Each extra page is a transaction, five
  blocks (4 data, 1 inode) copied into the log and back, and a disk write per block; the loads (64 per round)
  are the same in both. (The second row varies a lot from run to run; that was not
  investigated.)

  **Correctness, measured.** `mmaptest stress`: 10 of 10 `OK` on the reference; 1 of 6 `OK`
  with clean pages written back (5 `FAIL (file contents)`).

  **Where loads and write-backs happen.** In the gdb runs of the finished branch, loads came
  from user page faults (interrupts off, no locks) and from the three prefaults (interrupts on,
  no locks), never from a copy made under a lock. Write-backs came from `munmap`, from
  [[kexit]] and from [[kexec]]. In the stress run both happened on all three harts, loads slept
  on the disk, and write-backs slept in [[begin_op]] for log space: with `MAXOPBLOCKS` 10
  reserved per transaction and 30 log blocks, three write-backs fill the log's reservation
  although each logs only 5 blocks.
further: |
  - **A page cache.** Make every mapping of a file page share one physical page, kept in a
    per-inode table and reference-counted (lab 11's counts). Shared mappings become coherent
    between processes, `fork` can share pages instead of reloading them, and `read` and
    `write` could use the same pages. What lock protects the table, and what happens when the
    file is truncated under a mapping?
  - **Copy at fork.** Copy the parent's loaded mapped pages into the child (or share them
    copy-on-write) so that a private mapping's changes are inherited, as POSIX requires. Which
    function walks a range of addresses that is not `[0, sz)`?
  - **msync and holes.** Add `msync(addr, len)` to write dirty pages back without unmapping
    (clear `D` afterwards: what about the TLB?), and let `munmap` punch a hole by splitting a
    record in two.
  - **Make the latent bug fail every time.** A load under a pipe's lock only panics when the load
    sleeps (a cache miss, or a sleep-lock held by someone else). A check at the top of `mmapfault`, `panic` if this hart's `noff` is not 0, turns the
    whole class into a panic on every run. Why would it not catch the self-deadlock?
  - **Evict clean file pages.** Under memory pressure a clean page of a mapping can be freed
    and loaded again later from the file, with no swap space at all; a dirty shared one can be
    written back first. What must the kernel know to choose, and what does the `A` bit offer?
    (Lab 16 builds on this.)
