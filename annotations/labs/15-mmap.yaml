published: true
title: mmap and munmap of files
area: Memory
stars: 5
branch: ext/15-mmap
prerequisites: {tours: [20, 21, 22, 25, 26, 28, 31, 33, 36, 39], concepts: [stacks, locks]}
summary: |
  In this tree a process reaches a file's bytes only through `read` and `write`: the kernel
  copies them between the [[g:buffer-cache]] and a buffer the program owns. In this lab you
  add `mmap`, which puts part of a file *into the address space*: the program reads the file
  by loading from memory and changes it by storing to memory. `munmap` takes the mapping
  away again. Pages are read from the file only when they are first touched, and a shared
  mapping's changes go back to the file when it is unmapped.

  The system call is two lines in a man page; the kernel work touches almost every part of
  this tree. Where in the address space does a mapping go, when a heap already grows into
  the same empty space? How does a [[g:page-fault]] know which file and which bytes a
  missing page stands for? Which pages were changed, and who noticed: the hardware, the
  kernel, or neither? Writing a page back to a file is a file-system operation: what does
  that require, and how much may one page cost? What do [[kfork]], [[kexit]] and [[kexec]],
  which knew nothing about mappings, now get wrong? And the fault handler now reads a file:
  what happens when the fault comes from inside a system call that already holds locks,
  perhaps the lock of the very file being mapped? The think section asks these questions in
  the order a designer meets them.

  The reference solution is ten small commits. With it, touching 1 page of a 3-page mapping
  costs exactly 1 page of memory, and unmapping a 64-page mapping in which one page was
  changed writes one page back, not 64.
learn:
  - "What a kernel must remember about a mapping so that a page fault, possibly much later, can build the missing page byte for byte, and why that record has to hold a counted reference to an open file."
  - "How to fit a new region into an address space that already has a growing heap, and why the functions that copy and free address spaces in this tree do not see it."
  - "How a RISC-V PTE records that a page has been written, who sets that bit, and which writes into user memory do not set it."
  - "What it takes to write memory back into a file: which locks, which transaction, how many log blocks, and which bytes must never be written."
  - "How fork, exit and exec each have to learn about a new kind of per-process state, and what each one does wrong when it does not."
  - "Which kernel paths can reach a fault handler that sleeps and takes an inode's sleep-lock, and three different ways it fails when the path already holds a lock."
spec: |
  **Behaviour.** Two new system calls, in `user/user.h`:

  ```c
  void *mmap(void *addr, uint64 len, int prot, int flags, int fd, uint64 off);
  int munmap(void *addr, uint64 len);
  ```

  - `addr` must be 0: the kernel chooses where the mapping goes and returns its address, or
    `MAP_FAILED` (`(void *)-1`). `len` is rounded up to whole pages; `off` must be a
    multiple of the page size.
  - `prot` is `PROT_READ` or `PROT_READ | PROT_WRITE`. `flags` is `MAP_SHARED` (stores go
    to the file) or `MAP_PRIVATE` (stores stay in this process). The constants live in
    `kernel/fcntl.h`.
  - `fd` must be a file or a directory opened for reading (not a pipe, not a device): the
    reference accepts anything backed by an inode, and a directory's raw entries can be
    mapped read-only or private. A shared writable mapping of a file opened read-only must
    fail (and `open` never gives a writable descriptor for a directory).
  - The mapping stays valid after `close(fd)`, and keeps an unlinked file readable.
  - A page is read from the file when it is first touched, by the program or by the kernel on
    its behalf. Bytes past the end of the file read as 0; no page is allocated by `mmap`.
  - A store to a `PROT_READ` mapping kills the process, as a store to program text does.
  - `munmap(addr, len)` removes a whole mapping, or a part of it that starts at its start or
    ends at its end (unmapping a hole in the middle fails). Changed pages of a shared mapping
    are written back to the file. Pages of a private mapping never are. A mapping never
    makes its file longer.
  - `exit` and `exec` unmap everything, writing back as `munmap` does. A child created by
    `fork` has its parent's mappings.
  - Each process may have up to 16 mappings (`NVMA`).

  **What must not change.**

  - The heap still grows with `sbrk` (eager and lazy), and never into a mapping.
  - System calls must work with their user buffers inside a mapping, including a mapping of
    the very file being read or written (the test uses pipes, files and `wait`).
  - No leak of memory, files or inodes; no kernel panic or hang.
  - **`usertests -q` must print `ALL TESTS PASSED` on 3 harts.**

  **The test program**, `mmaptest`, prints one line per check (`mmaptest NAME` runs one):

  ```text
  $ mmaptest
  mmaptest: read: touching 1 of 3 mapped pages took 1 free pages
  usertrap(): unexpected scause 0xd pid=4
              sepc=0x1e stval=0x3fffffb000
  mmaptest: read: OK
  mmaptest: shared: OK
  usertrap(): unexpected scause 0xf pid=5
              sepc=0xa stval=0x3fffffc000
  mmaptest: private: OK
  usertrap(): unexpected scause 0xd pid=6
              sepc=0x1e stval=0x3fffffa000
  usertrap(): unexpected scause 0xd pid=7
              sepc=0x1e stval=0x3fffffd000
  mmaptest: partial: OK
  mmaptest: fork: OK
  mmaptest: exit: OK
  mmaptest: many: OK
  mmaptest: locked: OK
  mmaptest: self: OK
  mmaptest: stress: OK
  mmaptest: ALL OK
  ```

  The `usertrap()` lines are expected: each is a child the test starts on purpose to touch
  an address it must not touch, and the test checks that the child was killed.

  - **read**: a 2.5-page file mapped read-only and private, then closed; touching one page
    must cost exactly one free page; every byte must match the file, and the bytes past its
    end must be 0. After `munmap`, a child that loads from the address must be killed.
  - **shared**: stores through a shared writable mapping must be in the file after
    `munmap`, except one made past the end of the file (in its last page), which must not
    reach it; the file's size must not change; the page never touched must be unchanged.
  - **private**: a shared writable mapping of a read-only file must fail; a private one must
    work and never reach the file; a store to a read-only mapping must kill the process;
    `read` into a read-only mapping must fail; a pipe must not be mappable.
  - **partial**: a hole in the middle must be refused; the first and the last page unmapped
    on their own; the rest keeps its contents; everything written reaches the file.
  - **fork**: a child stores into a page its parent never touched and exits without
    `munmap`; the parent then sees the store through its own mapping.
  - **exit**: a child's stores reach the file when it exits, and when it calls `exec`.
  - **many**: 16 mappings work and a 17th fails; 300 rounds of open, map, close, unmap leave
    the number of free pages unchanged and never run out of files; a mapping keeps an
    unlinked file readable.
  - **locked**: `write` to a pipe from an unloaded mapped page, `read` from the pipe into
    another, `wait(&status)` into a third; what the kernel wrote must reach the file.
  - **self**: `read` of a file into an unloaded page of a mapping of the same file, and
    `write` to the file from another one.
  - **stress**: three processes, 30 rounds each, map one 12-page file shared, check that
    every page is uniform, fill their own 4 pages, unmap; the file must end with each
    process's last values, and no page may leak.
think:
  - title: What does mmap have to remember?
    q: |
      `mmap` maps no page. The first touch of a page might come seconds later, from user code
      or from inside a system call. At that moment the kernel must build the page exactly:
      which file, which bytes of it, which PTE bits. What does `mmap` have to record, and
      where? The program may `close(fd)` right after `mmap`, or even `unlink` the file. What
      keeps the file usable, and what kind of reference is the right one to keep?
    hints:
      - "Look at what [[sys_read]] needs to read a file: an entry in `p->ofile[]`, a `struct file` ([[kernel/file.h:1]]) with its own reference count, and the inode it points to. Then look at what [[sys_close]] does to them, and at [[iput]] ([[kernel/fs.c:350]])."
      - "A pointer is only safe while you hold a counted reference to what it points to. The file descriptor number is not a reference at all: after `close` the slot can hold another file. And the open mode (read-only, read-write) lives in the `struct file`, not in the inode."
      - "A small fixed table in `struct proc`, one entry per mapping: where it starts, how long it is, its protection and sharing mode, the offset in the file, and a counted reference to the open file, taken the way `dup` takes one."
    answer: |
      For each mapping the kernel needs: the first address and the length (to find the
      mapping that contains a faulting address), the protection (`PTE_W` or not), the sharing
      mode (whether changes go back), the offset in the file of the first byte, and the file.
      The reference keeps these in `struct vma` (for "virtual memory area", the name Linux
      uses), an array `p->vma[NVMA]` in `struct proc` with `NVMA` 16. A slot with `len` 0 is
      free.

      The file must be a counted reference, and the right one is a reference to the open file,
      `struct file`, taken with [[filedup]]: the same thing `dup(fd)` does. It keeps the file
      descriptor's `struct file` alive after `close(fd)`, and through it the inode after
      `unlink` (the `struct file` holds the inode's reference until [[fileclose]] drops it).
      Keeping the `struct file` rather than only the inode also keeps the open mode, which
      `mmap` checks: a shared writable mapping needs `f->writable`, and every mapping needs
      `f->readable`, because its pages are read from the file.

      Keeping the descriptor number instead would be wrong in two ways: `close(fd)` would
      leave the mapping with nothing, and a later `open` reusing that number would make the
      mapping read *another* file.

      The table needs no lock, for the same reason as `p->ofile`: only the process itself
      changes it (in its own `mmap`, `munmap`, `exec` and `exit`), and [[kfork]] reads the
      parent's while the parent is busy in `fork`. xv6 processes have one thread.
    checks:
      - id: lab15-01
        level: 1
        type: multi
        q: |
          A page of a mapping is first touched long after `mmap` returned. Which of these must
          `mmap` have recorded so that the fault can build the page?
        options:
          - text: "the first address and the length of the mapping"
            correct: true
            why: "The fault has an address; the kernel must find which mapping, if any, contains it."
          - text: "the offset in the file where the mapping starts"
            correct: true
            why: "The page at `start + k * 4096` holds the file's bytes from `off + k * 4096`."
          - text: "the protection and the sharing mode"
            correct: true
            why: "Protection gives the PTE bits and decides whether a store is allowed; the mode decides whether changes go back to the file."
          - text: "a counted reference to the open file"
            correct: true
            why: "Without a reference the file could be closed and its `struct file` reused for another file before the fault."
          - text: "the file descriptor number"
            why: |
              You may have thought the descriptor names the file. It names a slot in
              `p->ofile[]`; after `close(fd)` the slot is empty or holds another file.
          - text: "the physical address of each page"
            why: |
              You may have thought `mmap` allocates the pages. It allocates none; the page
              table records the physical page once a fault has loaded it.
        explain: |
          These five values are `struct vma` in the reference. The file reference is a
          `struct file *` taken with [[filedup]], like `dup`; see [[g:open-file]] and
          [[g:reference-count]].
      - id: lab15-02
        level: 2
        type: tf
        q: |
          True or false: a program that calls `close(fd)` right after `mmap(..., fd, 0)` can
          no longer use the mapping.
        answer: false
        why_tf: |
          You may have thought the mapping uses the descriptor. It holds its own reference to
          the `struct file`, so `close` only drops the descriptor's reference.
        reasons:
          - text: "The mapping took its own counted reference to the open file, so the file stays open until the mapping goes."
            correct: true
            why: "Right. `mmaptest read` closes the descriptor before touching any page, and every byte is still there."
          - text: "close() is refused while a mapping uses the file."
            why: |
              Nothing in this kernel looks for mappings in [[sys_close]]; it never fails for an
              open descriptor.
          - text: "The pages were read at mmap time, so the file is no longer needed."
            why: |
              No page is read at `mmap` time. Every page the program has not touched is still
              only in the file.
        explain: |
          `close(fd)` removes one reference: the descriptor's. [[fileclose]] frees the
          `struct file` (and drops the inode) only when the count reaches 0, which for a
          mapped file is when the last mapping of it goes.
  - title: Where does a mapping go?
    q: |
      Look at a user address space in this tree ([[kernel/memlayout.h:54]]): program text and
      data at 0, the guard page and the stack, then the heap growing up with `sbrk` toward
      `TRAPFRAME`. Where will you put a mapping? What stops the heap from growing into it
      later, eagerly or lazily, and what stops a mapping from landing on the heap? And which
      functions that walk or copy an address space will see mapped pages, and which will not?
    hints:
      - "Read [[growproc]] ([[kernel/proc.c:243]]) and [[sys_sbrk]]'s lazy branch ([[kernel/sysproc.c:60]]): what limit do they check? Then read [[uvmcopy]], [[uvmfree]] and [[vmfault]]: which range of addresses does each consider?"
      - "Both regions want to grow: the heap upward from `p->sz`, mappings wherever there is room. Whatever you choose, the heap's limit must move with the mappings, and a mapping must never start below `p->sz`. Almost everything in this tree that walks or checks an address space works on `[0, p->sz)`."
      - "Put mappings at the top, just below `TRAPFRAME`, each new one below those already there (or in a gap that fits). The heap's limit becomes the lowest mapping instead of `TRAPFRAME`."
    answer: |
      The reference puts mappings at the top of the address space and grows them downward:
      `vmaplace` looks for the highest free range below `TRAPFRAME` that is long enough,
      skipping down past any mapping in the way, and refuses to go below `PGROUNDUP(p->sz)`.
      The first 3-page mapping in `mmaptest` lands at `0x3fffffb000`: `TRAPFRAME`
      (`0x3fffffe000`) minus 3 pages. The heap and the mappings grow toward each other from the
      two ends of 256 GiB of address space.

      The heap had one limit, `TRAPFRAME`, in [[growproc]] and in [[sys_sbrk]]'s lazy branch.
      Both now use `vmabottom(p)`, the lowest mapped address (or `TRAPFRAME` with no
      mappings). Without that, an eager `sbrk` that starts just below a mapping (after lazy
      growth brought the heap there: one `sbrk` takes an `int`, far less than the 256 GiB gap)
      would call [[mappages]] on a loaded page and panic with `mappages: remap`, and lazy
      growth itself would stretch `p->sz` over
      the mapping, so that code walking `[0, sz)` ([[uvmcopy]] in `fork`, [[uvmdealloc]] when
      the heap shrinks) would copy or free the mapping's pages as if they were heap.

      Keeping mappings above `p->sz` has a consequence the rest of the lab depends on.
      [[uvmcopy]] copies `[0, sz)`, [[uvmfree]] frees `[0, sz)`, and [[vmfault]] refuses any
      address at or above `psz` ([[kernel/vm.c:463]]). None of them sees a mapped page. That
      is convenient for the fault path (it can ask "is this in a mapping?" before the `psz`
      test), and a trap for `exit`, `exec` and `fork`, which question 5 returns to. One more
      function bounds by `p->sz`: [[fetchaddr]] ([[kernel/syscall.c:15]]), so `exec` with its
      `argv` pointer array inside a mapping fails (a run printed `exec failed`), while
      path strings inside a mapping work, since [[fetchstr]] goes through [[copyinstr]].

      (An alternative is a fixed region, say from 128 GiB up. It works as well; it only moves
      the fence. Linux places mappings top-down below the stack, much as this design does.)
    checks:
      - id: lab15-03
        level: 2
        type: number
        q: |
          `mmaptest read` maps 3 pages when the process has no other mapping. `TRAPFRAME` is
          `0x3fffffe000` in this tree. At what address does the reference place the mapping?
        answer: "0x3fffffb000"
        wrong:
          "0x3fffffe000": |
            That is `TRAPFRAME` itself, the trapframe's page. The mapping must *end* at
            `TRAPFRAME`, so it starts 3 pages below it.
          "0x3fffffd000": |
            You may have subtracted one page. The mapping is 3 pages long, so it starts
            `0x3000` below `TRAPFRAME`.
          "0x7000": |
            That is `p->sz` in this run, where the heap ends. Placing the mapping there would
            leave the heap no room to grow; the reference starts at the top.
        why_wrong: "The mapping occupies [start, start + 3 pages) and its end is TRAPFRAME."
        explain: |
          `0x3fffffe000 - 0x3000 = 0x3fffffb000`. The child killed in `mmaptest read` faulted
          at exactly `stval=0x3fffffb000`: it touched the first page after `munmap`.
      - id: lab15-04
        level: 2
        type: choice
        q: |
          A kernel has the mapping table and `mmap`, but [[growproc]] and [[sys_sbrk]] still
          check against `TRAPFRAME`. A process maps a file and touches the mapping's first
          page, grows its heap *lazily* (`sbrklazy`, many calls) to one page below the mapping,
          then calls the eager `sbrk(8192)`. What happens?
        options:
          - text: "panic: mappages: remap"
            correct: true
            why: |
              [[uvmalloc]] maps a fresh page at every address up to the new size, and
              [[mappages]] panics when it finds the loaded page's valid PTE.
          - text: "sbrk returns -1"
            why: |
              That is what the reference does. Here nothing compares the new size with the
              mapping.
          - text: "The mapped page is silently replaced by a zero page"
            why: |
              [[mappages]] does not overwrite a valid PTE; it panics. (A *lazy* `sbrk` would
              touch no page at all: it only raises `p->sz`, and the damage comes later, from
              code that walks `[0, sz)`.)
          - text: "Nothing: the heap and the mapping share the page"
            why: |
              One virtual address has one PTE. Two owners for one address is exactly what the
              limit prevents.
        explain: |
          The limit is a fence between two regions that grow toward each other. A build of the
          branch with the old `TRAPFRAME` limit ran exactly this: the heap
          went from `0x7000` to `0x3fffffc000` by lazy steps, and the eager `sbrk` of two pages
          printed `panic: mappages: remap` ([[kernel/vm.c:167]]). A single eager `sbrk` from
          a small heap cannot get there: its argument is an `int`, and memory runs out long
          before 256 GiB.
  - title: What happens on the first touch?
    q: |
      A program loads from a page of a mapping that has not been touched. What does the hart
      report, which code in this tree sees it first, and what must change there so that the
      page comes from the file and the lazy heap keeps working? What must the new page
      contain, byte by byte, when the mapping extends past the end of the file? Which PTE bits
      does it get? And what must happen to a *store* to a read-only mapping, or to a page that
      is already loaded?
    hints:
      - "Follow `scause` 13 and 15 through [[usertrap]] ([[kernel/trap.c:71]]) into [[vmfault]] ([[kernel/vm.c:458]]). Note its first test, its `read` argument, and who else calls it: [[copyout]], [[copyin]] and [[copyinstr]] ([[kernel/vm.c:357]])."
      - "A mapped address is above `p->sz`, so the existing first test rejects it. [[kalloc]] fills a page with junk ([[kernel/kalloc.c:80]]); [[readi]] returns fewer bytes than asked at the end of the file, and nothing at all past it. A RISC-V PTE with `W` but without `R` is reserved."
      - "Give mapped addresses their own path in the fault handler, taken before anything that would reject them. On that path, decide which faults to refuse, and build the page so that every byte the file does not supply is defined."
    answer: |
      A load from an unmapped page raises a load page fault (`scause` 13), a store a store page
      fault (15); [[usertrap]] sends both to [[vmfault]], with `read` 1 for a load. The kernel's
      own copies reach [[vmfault]] the same way, from [[copyout]] (`read` 0) and [[copyin]]
      (`read` 1). So [[vmfault]] is the single place to teach, and the reference adds one test
      at its top: if the page table is the process's own and `vmalookup` finds a mapping that
      contains the address, the fault belongs to `mmapfault`. The existing `va >= psz` test
      would have rejected it, since mappings lie above `p->sz`. Everything below that line is
      the lazy heap, unchanged.

      `mmapfault` then:

      - refuses a store (`read` 0) to a mapping without `PROT_WRITE`: [[vmfault]] returns 0
        and [[usertrap]] kills the process (`mmaptest private`: `scause 0xf`);
      - refuses a page that is already mapped: a fault on a mapped page is about permissions,
        and mapping it again would panic in [[mappages]];
      - allocates a page and **zeroes it**, then, with the inode locked, reads
        `min(4096, size - off)` bytes from file offset `off = v->off + (va - v->start)`, if
        `off` is inside the file. The rest of the page stays zero: the tail of a last page
        that the file only partly fills, and whole pages past the end of the file;
      - maps it with `PTE_R | PTE_U`, plus `PTE_W` for a writable mapping. (`PROT_WRITE` alone
        is refused by `mmap`, because a PTE with `W` and no `R` is reserved in RISC-V.)

      gdb read the PTE of a page of a writable shared mapping when it was unmapped:
      `0x21fc94d7`, flags `0xd7` = `V|R|W|U|A|D`. `A` and `D` were set by the hart when the
      program used the page; the next question is about `D`.

      The page is read with the inode's [[g:sleeplock]] held and may wait for the disk: in the
      three-process stress run gdb stopped in [[virtio_disk_rw]]'s wait below `mmapfault` on
      all three harts (50 times before the recorder stopped counting). A fault from user code holds no lock, so that is legal; question 6 is about
      the faults that do not come from user code.
    checks:
      - id: lab15-05
        level: 2
        type: choice
        q: |
          `mmaptest private` maps a file `PROT_READ`, `MAP_SHARED`, and a child stores one
          byte into it. The page is not loaded yet. What happens, on the reference branch?
        options:
          - text: "usertrap() prints scause 0xf and the child is killed"
            correct: true
            why: |
              The store faults with 15; `mmapfault` refuses a store to a read-only mapping,
              [[vmfault]] returns 0, and [[usertrap]] kills the child.
          - text: "The page is loaded, and the store faults again: scause 0xf, killed"
            why: |
              You may have thought the page is loaded first and the permission checked by the
              hardware afterwards. That would also end in a kill, but the reference refuses
              before allocating anything: the first test in `mmapfault` looks at `read`.
          - text: "The store succeeds but never reaches the file"
            why: |
              That is `MAP_PRIVATE` with `PROT_WRITE`. Without `PROT_WRITE` there is no way to
              store into the mapping at all.
          - text: "scause 0xd, because the page is not loaded"
            why: |
              You may have thought a missing page always reports a load fault. The cause
              depends on the access, not on the page: a store reports 15.
        explain: |
          The recorded run: `usertrap(): unexpected scause 0xf pid=5`, `sepc=0xa
          stval=0x3fffffc000`. The test then checks that the child's exit status is -1.
      - id: lab15-06
        level: 2
        type: number
        q: |
          A file is 2 pages and 1000 bytes long (9192 bytes) and is mapped with `len` 3 pages
          at offset 0. When page 2 of the mapping is loaded, how many bytes does `mmapfault`
          read from the file?
        answer: 1000
        wrong:
          4096: |
            You may have thought a page is always read whole. [[readi]] would return only
            1000 bytes anyway, and treating that short read as an error would kill the
            program for a legal access.
          0: |
            You may have thought the last, partial page is not part of the file. Its first
            1000 bytes are; only the rest must be zero.
          3096: |
            That is the number of bytes that stay zero (4096 - 1000), not the number read.
        why_wrong: "The page starts at file offset 8192; the file has 9192 - 8192 bytes from there."
        explain: |
          `n = min(4096, size - off)` with `off` = `0x2000`. The remaining 3096 bytes of the page
          are zero because the page was zeroed *before* the read. `mmaptest read` checks every
          one of the 12288 bytes.
  - title: Which pages go back to the file, and how?
    q: |
      When a shared writable mapping is unmapped, its changes must reach the file. Which pages
      must be written: all loaded ones, or only some? How does the kernel know which? Remember
      that the kernel itself also writes into user pages (a `read` into a mapped buffer). How do
      you write one page into a file safely: which locks, which transaction, how many log blocks?
      And which bytes of the page must never be written?
    hints:
      - "Read the PTE format in the RISC-V privileged specification: bits 6 and 7, `A` and `D`. Then look at how [[copyout]] writes ([[kernel/vm.c:370]]): through which address? Then [[writei]] ([[kernel/fs.c:544]]) and [[log_write]] ([[kernel/log.c:231]])."
      - "The hart sets `D` in the PTE it used for a store. A write through the kernel's [[g:direct-map]] uses the kernel's PTE, not the user's. Every [[writei]] must be inside [[begin_op]]/[[end_op]], and a transaction may log at most `MAXOPBLOCKS` blocks ([[kernel/param.h:9]]). [[writei]] past the end of the file makes the file longer."
      - "Decide page by page from something the PTE records; remember the kernel's own writes; size one transaction for one page, and decide which bytes of it belong to the file."
    answer: |
      **Which pages: the dirty ones.** A RISC-V PTE has an `A` (accessed, bit 6) and a `D`
      (dirty, bit 7) bit. On QEMU the hart sets them itself in the PTE it used: `A` on any
      access, `D` on a store. (The specification also allows hardware that instead raises a
      page fault and leaves the update to the kernel; this tree, whose [[mappages]] never sets
      `A` or `D`, already relies on the first kind.) So at unmap time the reference walks the
      range and writes back each loaded page whose PTE has `D`. A page that was only read has
      `D` clear and is skipped.

      **The kernel's own writes.** [[copyout]] writes into a user page through the kernel's
      [[g:direct-map]] (`memmove` to `pa0`), using the kernel's PTE. The user PTE's `D` stays
      clear, and a `read()` into a shared mapping would be lost at `munmap`. So [[copyout]]
      sets `D` itself after its `PTE_W` check. gdb saw such a page in `mmaptest locked`: after
      a `read` from a pipe into page 1 the PTE was `0x21fcc497`, flags `0x97` =
      `V|R|W|U|D`: `D` from [[copyout]], and no `A`, because user code never touched that page.
      Without the line, `mmaptest locked` and `self` print `FAIL (file contents)` (a kernel
      built that way, run once).

      **Why not write back every loaded page?** It is slower, and with several processes it is
      wrong. Each process has its own copy of a page (this design has no shared page cache).
      If process A loaded a page that B later changed and wrote back, A's unmap would write its
      stale copy over B's change. Clinic 6 does this and `mmaptest stress` fails.

      **How to write.** `vmawrite` does [[begin_op]], [[ilock]], [[writei]] from the physical
      page (a kernel address, `user_src` 0), [[iunlock]], [[end_op]]. [[writei]] calls
      [[log_write]], which panics outside a transaction (clinic 1). One page per transaction
      is small enough: the reference writes only bytes inside the file, so no block is
      allocated; 4 data blocks plus the inode block that [[writei]]'s [[iupdate]] writes, 5
      log blocks, within `MAXOPBLOCKS` (10). [[filewrite]] uses a smaller chunk (3 blocks,
      [[kernel/file.c:153]]) because a write that grows a file also allocates blocks and
      updates the bitmap and the indirect block.

      **Which bytes never.** Only `min(4096, size - off)` bytes, and nothing for a page wholly
      past the end of the file. Writing the whole page would make the file longer, with the
      zeros (or whatever the program stored there) past its old end (clinic 2).

      A `MAP_PRIVATE` mapping, or a shared read-only one, is never written back.
    checks:
      - id: lab15-07
        level: 2
        type: bits
        q: |
          gdb read this PTE in `mmaptest locked`, when page 1 of a shared writable mapping was
          unmapped. Before that the program had called `read` from a pipe into the page, and
          had never touched it from user code. Decode the flags.
        value: "0x21fcc497"
        fields:
          - label: "W (bit 2)"
            options: ["0", "1"]
            answer: "1"
            why: "0x97 has bit 2 (0x4) set: the mapping is writable, so copyout accepted it."
          - label: "U (bit 4)"
            options: ["0", "1"]
            answer: "1"
            why: "0x10 is set: every page of a user mapping has PTE_U."
          - label: "A (bit 6)"
            options: ["0", "1"]
            answer: "0"
            why: "You may have expected A, since the page was written. It was written by the kernel through its direct map; the hart sets A only in the PTE it uses, and no user instruction used this one."
          - label: "D (bit 7)"
            options: ["0", "1"]
            answer: "1"
            why: "You may have thought only the hardware sets D. The reference's copyout sets it, precisely because the hardware did not."
        explain: |
          `0x97` = `V` (1) + `R` (2) + `W` (4) + `U` (0x10) + `D` (0x80). Because `D` is set, the
          unmap wrote the page back, and the test found the pipe's 8 bytes in the file. See
          [[g:pte]].
      - id: lab15-08
        level: 3
        type: number
        q: |
          `vmawrite` writes one page of a mapping back, inside a file whose size is a multiple of
          the page size and with blocks of 1024 bytes. How many blocks does that transaction log?
        answer: 5
        wrong:
          4: |
            You may have counted only the data blocks. [[writei]] ends with [[iupdate]], which
            logs the block holding the inode, even when the size did not change.
          10: |
            That is `MAXOPBLOCKS`, what [[begin_op]] *reserves* for every transaction, not what
            this one writes.
          7: |
            You may have added a bitmap block and an indirect block. Nothing is allocated: every
            block lies inside the file and already exists.
        why_wrong: "Count the blocks log_write is called on: the data blocks the page covers, and the inode."
        explain: |
          4 data blocks + 1 inode block = 5 ≤ `MAXOPBLOCKS`. [[begin_op]] still reserves 10 per
          transaction against `LOGBLOCKS` (30), so at most three write-backs can be in progress:
          in the stress run gdb caught [[begin_op]] putting write-backs to sleep for log space on
          all three harts (50 times before the recorder stopped counting).
  - title: What do fork, exit and exec now get wrong?
    q: |
      Three functions in this tree make, copy or destroy whole address spaces, and none of them
      knows about mappings: [[kfork]], [[kexit]] (with [[freeproc]] in the parent's `wait`)
      and [[kexec]]. For each one: what goes wrong if you leave it as it is, and what is the
      simplest correct change? For `fork`, decide what the child should see in a mapped page
      that the parent changed and has not yet written back.
    hints:
      - "Read [[uvmfree]] and [[freewalk]] ([[kernel/vm.c:276]]), and where [[kexec]] frees the old image ([[kernel/exec.c:138]]). Then [[kfork]]'s handling of `p->ofile` ([[kernel/proc.c:285]])."
      - "Mapped pages lie above `p->sz` (question 2). Whatever frees a page table must first remove every leaf in it. Each copy of a file reference must be counted. Changes reach the file only at unmap time."
      - "Unmap all mappings (with write-back) in `exit`, and in `exec` once the new image is committed. In `fork`, copy the table, take one more file reference per mapping, and copy no page: the child loads pages from the file."
    answer: |
      **exit.** [[freeproc]], run by the parent in [[kwait]], frees the user page table with
      [[uvmfree]], which unmaps `[0, sz)` and then calls [[freewalk]]. [[freewalk]] panics with
      `freewalk: leaf` on any valid leaf it still finds, and mapped pages are such leaves. A
      kernel built without the exit change printed `panic: freewalk: leaf` in `mmaptest fork`,
      on the parent's hart, inside `wait`. The reference unmaps every mapping at the top of
      [[kexit]], with write-back: that is what makes "exit writes back" true, and it drops the
      file references. The dying process can still sleep there (write-back takes the log and the
      inode lock); nothing is locked yet.

      **exec.** The same [[freewalk]] problem for the old page table ([[kernel/exec.c:138]]),
      and the same rule as POSIX: a new program starts with no mappings. The reference unmaps
      after the commit point, from the *old* page table: a failed `exec` returns to a program
      whose mappings are intact.

      **fork.** The child must have the mappings, or its first touch of one falls through to
      the heap code, which rejects an address above `sz`, and the child is killed (clinic 3).
      The reference copies the table and calls [[filedup]] for each mapping, as [[kfork]] does
      for `p->ofile`. No page is copied: [[uvmcopy]] copies `[0, sz)`, and the child loads each
      mapped page from the file when it touches it.

      That simple choice has a cost you should state. A change the parent made to a mapped page
      and has not written back is not in the child's copy, which comes from the file. For a
      private mapping, the child does not inherit the parent's private changes, which POSIX
      says it should. For a shared mapping, each process sees the other's stores only if it
      loads the page after the other's write-back, and if both store into the same page, the
      last unmap overwrites the other's changes to that page (a run showed exactly
      that: child `C` at byte 0, parent `P` at byte 1, parent unmapped first, file `C.`). Copying the parent's loaded pages in [[kfork]] would fix the
      private case; sharing the physical pages (and counting references to them, as in lab 11)
      would be needed for the shared case. `mmaptest fork` checks only what this design
      promises: a store the child made reaches the file at its exit, and the parent, loading
      the page after that, sees it.
    checks:
      - id: lab15-09
        level: 2
        type: choice
        q: |
          A kernel is complete except that [[kexit]] does not unmap the process's mappings. In
          `mmaptest fork` the child loads and changes page 1 of a mapping, then exits. What
          happens?
        options:
          - text: "panic: freewalk: leaf, in the parent's wait"
            correct: true
            why: |
              The parent's [[kwait]] frees the zombie with [[freeproc]]; [[uvmfree]] removes
              `[0, sz)` only, and [[freewalk]] finds the mapped page's leaf.
          - text: "panic: freewalk: leaf, in the child's exit"
            why: |
              You may have thought exit frees the page table. It cannot free the memory it is
              running on; the parent does that later, in `wait` ([[freeproc]]).
          - text: "The page leaks, but nothing else happens"
            why: |
              It would leak if [[freewalk]] skipped leaves. It does not; it panics on them,
              precisely to catch this.
          - text: "The child's store is written back by freeproc"
            why: |
              [[freeproc]] knows nothing of files and runs holding spinlocks, where writing a
              file (which sleeps) is not allowed.
        explain: |
          The recorded panic: `panic: freewalk: leaf`, with the backtrace `freewalk ← freewalk
          ← freewalk ← uvmfree ← proc_freepagetable ← freeproc ← kwait ← sys_wait`, on hart 2
          with `noff` 2 (`wait_lock` and the child's `p->lock`).
      - id: lab15-10
        level: 3
        type: tf
        q: |
          True or false: on the reference branch, if a parent stores into page 0 of a shared
          mapping and then forks, the child reading page 0 sees the parent's store.
        answer: false
        why_tf: |
          You may have thought fork copies mapped pages, or shares them. It copies neither: the
          child loads page 0 from the file, and the parent's store reaches the file only when
          the parent unmaps.
        reasons:
          - text: "The child's page comes from the file, and the parent's store is still only in the parent's page."
            correct: true
            why: "Right. That is the cost of the simple fork, stated in the answer above."
          - text: "uvmcopy copied the parent's page into the child."
            why: |
              [[uvmcopy]] copies `[0, sz)`; mapped pages lie above `sz`.
          - text: "The store is written back to the file at fork time."
            why: |
              Nothing writes back at fork. Only unmapping (by munmap, exit or exec) does.
        explain: |
          `mmaptest fork` makes the parent store into page 0 before the fork, and checks
          nothing about the child's view of page 0: the design does not promise it.
  - title: Where can a load run, and what may it hold?
    q: |
      Loading a mapped page takes the file's inode lock (a sleep-lock) and may wait for the
      disk. Which paths can reach the load? List them, and for each, which locks the thread
      already holds at that moment. What goes wrong on each path that holds a lock, and what will
      you do about it? Think in particular about a `read` from a file into a mapping of that
      same file.
    hints:
      - "Start from every caller of [[vmfault]]: [[usertrap]], and [[copyout]], [[copyin]] and [[copyinstr]]. For the three copy functions, find all their callers, and for each caller what it holds at the moment of the copy. Do not forget the callers that reach them through [[either_copyout]] and [[either_copyin]]."
      - "[[sched]] panics if a process gives up the CPU holding a spinlock other than its own `p->lock`. [[wakeup]] acquires *every* process's `p->lock` ([[kernel/proc.c:581]]), and releasing any sleep-lock calls it. [[acquiresleep]] does not check who holds the lock."
      - "Make sure no copy made under a lock ever needs a load: before a system call takes any lock, load the mapped pages of its user buffer. Ask who could unmap such a page again before the copy happens."
    answer: |
      The paths, with what gdb or the code shows held at the load:

      | path | interrupts | locks held when the load starts | what a load there does |
      |---|---|---|---|
      | user code → [[usertrap]] → [[vmfault]] | off | none | fine (may sleep) |
      | [[argstr]] → [[copyinstr]] (a path name) | on | none (in [[sys_mkdir]], [[sys_mknod]], [[sys_chdir]] a transaction is open, which is not a lock; a load writes nothing to the log) | fine |
      | [[pipewrite]] → [[copyin]], [[piperead]] → [[copyout]] | off | `pi->lock` | sleeps under a spinlock whenever the load must sleep (a cache miss, or a sleep-lock held by another process): `panic: sched locks` |
      | [[consoleread]] → [[copyout]] | off | `cons.lock` | the same |
      | [[kwait]] → [[copyout]] of the status | off | `wait_lock`, the child's `p->lock` | `panic: acquire`, every time |
      | [[fileread]] → [[readi]] → [[copyout]] | on | the file's inode lock, a buffer's lock (sleep-locks) | hangs forever if the file is the mapped one |
      | [[filewrite]] → [[writei]] → [[copyin]] | on | a transaction, the inode lock, a buffer's lock | the same |

      Three different failures, all observed on a kernel without the fix (clinic 5):

      - **`panic: acquire` in `wait`.** The load reads the page with [[readi]], which releases
        each buffer with [[brelse]] → [[releasesleep]] → [[wakeup]]. [[wakeup]] acquires every
        process's `p->lock`, including the zombie child's, which [[kwait]] already holds on this
        hart. This happens whether or not the disk is touched, so it fails every time.
      - **`panic: sched locks` in a pipe.** Only when the load has to sleep: a cache miss, or
        the inode's (or a buffer's) sleep-lock held by another process. Then [[sleep]] adds
        `p->lock` to `pi->lock` and [[sched]] sees `noff` 2. With the blocks cached and nobody
        else using the file, nothing sleeps and the bug hides. (A version of the test with a
        larger file panicked with `sched locks` on its first run; no backtrace was recorded
        for it.)
      - **A hang in `read` of the mapped file.** [[fileread]] holds the file's inode lock while
        [[readi]] copies into the user buffer; the copy needs the page; `mmapfault` calls
        [[ilock]] on the same inode, and [[acquiresleep]] waits for the holder, which is the
        process itself. No message, and `kill` cannot end it.

      **The fix: load before you lock.** [[sys_read]], [[sys_write]] and [[sys_wait]] call
      `vmaprefault` before they take any lock. It loads every unloaded page of the user buffer
      that lies in a mapping, holding nothing. A loaded page stays loaded for the rest of the
      call: only this process can unmap it, and it is busy in this call (one thread per
      process). Lab 12 met the same problem with pages of the program and solved it the same
      way. Lab 12 also had to make [[usertrap]] read `scause` and `stval` once, before the
      fault handler could sleep; this branch does not, so if a load fails after sleeping
      (only when [[mappages]] runs out of memory after the read), the `usertrap()` kill message
      may print another trap's registers from whichever hart the process resumed on. Only the
      message is affected, not the kill (reasoned from the code, not observed).

      The other copies hold no lock: [[filestat]] unlocks the inode before its [[copyout]],
      [[sys_pipe]]'s copy and [[argstr]] hold nothing, and [[kexec]] copies only into the new
      page table, which has no mappings. Lazy heap pages need no prefault: allocating one takes
      only [[kalloc]]'s spinlock and never sleeps.
    checks:
      - id: lab15-11
        level: 3
        type: state
        q: |
          Without the prefault, `mmaptest locked` calls `wait` with the status in an unloaded
          mapped page. [[kwait]]'s [[copyout]] loads the page; [[readi]] releases a buffer, and
          [[wakeup]] is about to acquire the zombie child's `p->lock`. Fill in the hart's state at
          that moment, as gdb recorded it at the resulting panic.
        code: kernel/proc.c:576-584
        state:
          mode: S
          stack: kernel
          satp: kernel
          sie: "off"
          noff: 4
          intena: 1
        why:
          noff: |
            Count the spinlocks: `wait_lock` and the child's `p->lock` from [[kwait]], the
            buffer sleep-lock's inner `lk` held by [[releasesleep]], and the [[push_off]] at the
            start of this very [[acquire]], before it checks [[holding]].
          intena: |
            `wait` is a system call: [[usertrap]] turned interrupts on before [[kwait]]'s first
            acquire, so that acquire recorded intena 1.
          sie: "Spinlocks are held, so interrupts are off on this hart."
          stack: "A system call runs on the process's kernel stack: usertrap → syscall → sys_wait → kwait → copyout → vmfault → mmapfault → readi → brelse → releasesleep → wakeup → acquire."
          satp: "uservec switched to the kernel page table before usertrap ran."
        why_wrong: Count every spinlock held at that point, including the inner spinlock of the sleep-lock being released, and remember that acquire pushes before it checks.
        explain: |
          gdb at `panic("acquire")`: hart 0, `noff 4 intena 1`, pid 3, the lock
          `proc+3000`, which is the child's. [[holding]] finds it held by this hart and
          [[acquire]] panics. Five boots of that kernel panicked the same way.
      - id: lab15-12
        level: 2
        type: choice
        q: |
          Without the prefault, `mmaptest self` reads its file into an unloaded page of a mapping
          of the same file. What does the console show?
        options:
          - text: "Nothing more: mmaptest never finishes, and the prompt never comes back."
            correct: true
            why: |
              The process sleeps in [[acquiresleep]] on its own file's inode lock, which it
              holds itself, forever.
          - text: "panic: acquire"
            why: |
              That needs a *spinlock* taken twice on one hart. A sleep-lock records a pid, and
              [[acquiresleep]] never checks it; it sleeps.
          - text: "panic: sched locks"
            why: |
              Only sleep-locks and no spinlock are held: [[acquiresleep]] releases its inner
              spinlock before [[sleep]], so [[sched]] sees `noff` 1.
          - text: "mmaptest: self: FAIL"
            why: |
              Nothing makes the `read` fail. It never returns.
        explain: |
          gdb, attached to the hung kernel, found the three harts idle and `mmaptest` (pid 3)
          SLEEPING on `itable+312`, the lock of inode 25, whose `pid` field was 3. Its kernel
          stack: `sys_read → fileread → readi → either_copyout → copyout → vmfault → mmapfault
          → ilock → acquiresleep → sleep`.
  - title: How do you know it works, and that nothing leaks?
    q: |
      Many of this lab's bugs leave the kernel running: a page goes to the wrong place, a file
      reference is never dropped, an update is lost when two processes write. What can a user
      program check, and how can it make such a bug visible? In particular, if `munmap` forgot
      to drop the mapping's file reference, what would a user program notice, and after how
      long?
    hints:
      - "There are `NFILE` (100) `struct file`s in the whole system ([[kernel/param.h:4]]); [[filealloc]] fails when none is free. The file's inode keeps its blocks while any reference remains."
      - "A leak that is small per operation becomes visible when the operation is repeated more times than the resource has slots. A lost update between processes needs several processes, several pages, and a final value that only the right interleaving of write-backs can produce."
      - "Repeat open, mmap, close, munmap more than `NFILE` times and require `open` to keep working; count free pages before and after; let three processes rewrite their own pages of one file many times and check the final contents."
    answer: |
      The test makes each kind of bug visible by repetition or by contents:

      - **File references.** `mmaptest many` runs 300 rounds of open, mmap, close, munmap. A
        `munmap` that forgot [[fileclose]] keeps every round's `struct file` alive; after
        about 100 rounds [[filealloc]] has none left and `open` fails. And the damage is
        system-wide: on such a kernel the next command could not even create a file, and `ls`
        printed `ls: cannot open .` (clinic 4).
      - **Pages.** The same test counts free pages before and after (the way `usertests`
        does), so a page that `munmap` forgot to free shows up as a difference.
      - **Write-back.** `shared`, `partial`, `fork`, `exit`, `locked` and `self` check the
        file's bytes with `read`, including bytes that must *not* have changed and the file's
        size.
      - **Lost updates.** `stress` runs three processes for 30 rounds each. Each maps the
        whole 12-page file shared, checks that every page is uniform (a page must never be
        half written), fills its own 4 pages with a round number, and unmaps. The file must end
        with each process's last round. A write-back of clean pages makes a process write its
        stale copy of the others' pages over their newer data, and the final contents are
        wrong (clinic 6).

      What a user program cannot check by itself, and the lab measured instead: that the
      processes really ran at once on different harts (gdb saw loads and write-backs of the
      stress run on all three harts), and how much a write-back costs (the measure section).
    checks:
      - id: lab15-13
        level: 2
        type: choice
        q: |
          A kernel's `munmap` frees the pages and clears the mapping but never calls
          [[fileclose]]. You run `mmaptest many`, then `mmaptest`, then `ls`. What do you see?
        options:
          - text: "many: FAIL (open failed: files leak); then mmaptest cannot create its first file; ls: cannot open ."
            correct: true
            why: |
              Each round leaks one `struct file`; once all 100 are in use, every `open` in
              the system fails, for every process.
          - text: "many: FAIL (pages leak), and everything else works"
            why: |
              You may have thought the leak is of memory. The pages are freed by [[uvmunmap]];
              the leak is of open files, which are a system-wide table.
          - text: "Only mmaptest is affected; ls works"
            why: |
              The file table, `ftable`, is shared by all processes. A leaked entry is lost for
              everyone until reboot.
          - text: "panic: fileclose"
            why: |
              That panic is for a reference dropped too often. Here one is never dropped, and
              nothing checks for that.
        explain: |
          Clinic 4 is this run. The leaked references also keep each file's inode, and with it
          its blocks, alive: an unlinked file mapped once would never be freed.
build: |
  **Start.**

  ```text
  git checkout -b my-15 06aad25
  ```

  Add the system calls first, with nothing behind them: numbers in `kernel/syscall.h`, entries
  in `kernel/syscall.c` and `user/usys.pl`, prototypes in `user/user.h`, the `PROT_` and
  `MAP_` constants in `kernel/fcntl.h`. A new file `kernel/mmap.c` (add `$K/mmap.o` to `OBJS`
  in the `Makefile`) keeps the mapping code in one place. Then write `user/mmaptest.c` from
  the spec's list of checks and add `$U/_mmaptest\` to `UPROGS`. Every check fails at first;
  that is the test working.

  **Milestones, in an order that keeps the system bootable after each one.** `usertests` never
  calls `mmap`, so `usertests -q` must pass after every milestone.

  1. **The table.** `struct vma` and `p->vma[NVMA]` in `kernel/proc.h`. Test: it boots.
  2. **mmap records.** Check the arguments, find a free slot and a place, take a reference
     to the file, record. Test: `mmap` returns an address near the top (print it).
  3. **The fence.** [[growproc]] and [[sys_sbrk]] stop at the lowest mapping. Test:
     `usertests -q` (its `sbrk` tests).
  4. **Load on fault.** The test at the top of [[vmfault]], and the loader. Test: the first
     check of `mmaptest read`. Until milestone 6, a process that exits with a loaded mapped
     page panics the kernel with `freewalk: leaf` (question 5), so expect that when the test
     exits.
  5. **munmap**, whole and at either end, without write-back. Test: `mmaptest read`, then
     `partial`.
  6. **exit and exec unmap everything.** Test: `mmaptest read`, `private`.
  7. **Write-back.** The `D` test, the transaction, the size limit, and [[copyout]] setting
     `D`. Test: `shared`, `partial`, `exit`.
  8. **fork.** Test: `fork`.
  9. **Load before you lock.** Test: `locked`, `self`, then the whole of `mmaptest` and
     `usertests -q`, and `mmaptest` once more.

  **Debugging advice.** Start QEMU with `make qemu-gdb` and attach gdb on the port it prints;
  mapping code runs only when your test runs, so let the system boot, set your breakpoints,
  then run the test.

  - Print every load while you build it: `printk("mmap load pid %d va %p off %d\n", p->pid,
    va, off)`, and every write-back. The first lines of `mmaptest read` should be one load at
    the page it touches, and none for the pages it never touches.
  - `panic: freewalk: leaf` means a mapped page was still in a page table being freed: look at
    `kexit` and `kexec`.
  - `panic: mappages: remap`: something mapped a page over a loaded one (the heap fence, or a
    missing `ismapped` test).
  - `panic: acquire` or `panic: sched locks` with `copyout` or `copyin` in the backtrace:
    a load under a lock (question 6). Break on `panic` and run `bt`.
  - A hang with idle harts: attach gdb, list `proc[]` with `state` and `chan`, and compare a
    sleeping process's `chan` with the address of the mapped file's inode lock
    (`p->vma[i].f->ip->lock`). To see the sleeping process's kernel stack, set `$sp`, `$s0`
    and `$pc` from its `p->context` on a halted hart and run `bt`.
  - To check a PTE, walk the page table in gdb from `p->pagetable` (three levels of 512
    entries, index bits 38-30, 29-21, 20-12 of the address) and print the leaf: look at
    bits 6 and 7.
clinic:
  - bug: The write-back runs outside a transaction
    change: |
      `vmawrite` locks the inode and calls [[writei]], but nobody opened a transaction: it
      looks like a plain write of kernel memory into a file.

      ```diff
      -  begin_op();
         ilock(ip);
         if (off < ip->size) {
           [...]
           writei(ip, 0, pa, off, n);
         }
         iunlock(ip);
      -  end_op();
      ```
    symptom: |
      xv6 kernel is booting

      hart 1 starting
      hart 2 starting
      init: starting sh
      $ mmaptest shared
      panic: log_write outside of trans

      # the same boot, gdb breakpoint on panic:
      #0  panic (s=s@entry=0x80008548 "log_write outside of trans") at kernel/printk.c:139
      #1  0x0000000080003f5a in log_write (b=b@entry=0x800274a8 <bcache+27824>) at kernel/log.c:232
      #2  0x00000000800037e8 in writei (ip=ip@entry=0x80029000 <itable+296>, user_src=user_src@entry=0, src=2280804352, off=off@entry=0, n=4096) at kernel/fs.c:566
