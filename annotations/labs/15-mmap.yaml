      [[either_copyout]]. The copy needs the page; `mmapfault` calls [[ilock]] on the mapping's
      file, inode 25 again, and [[acquiresleep]] sleeps until the holder releases it. The
      holder is pid 3 itself (`lock.pid 3`), and pid 3's `chan` is that lock's address. It will
      sleep forever: no panic, no message, the harts idle, `kill` useless. A `write` to the file
      from its own mapping would hang the same way inside [[filewrite]].

      (Some argument values in the hung backtrace, like `va=1` or `psz=0`, are stale registers
      in this optimized build; the `@entry` values are the real ones. The stack was read by
      loading the sleeping process's saved `sp`, `s0` and `ra` into a halted hart, which is why
      its top frames are `sched` and `mycpu`.)

      The reference's three call sites remove all of these at once: the pages are loaded before
      any lock is taken, so the copies under locks never load.
