      # pages, read every page, store into one, munmap
      $ mmapbench
      munmap: 64 pages written back
      [...]
      munmap: 64 pages written back
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 60 ticks
      $ mmapbench
      [...]
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 100 ticks
      $ mmapbench
      [...]
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 53 ticks

      # the same instrumentation on the reference branch, another boot:
      $ mmapbench
      munmap: 1 pages written back
      [...]
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 8 ticks
      [...]
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 8 ticks
      [...]
      mmapbench: 10 rounds of: map 64 pages, read all, write 1, munmap: 7 ticks
    why: |
      This looks like a performance bug, and it is one: 64 pages written back per `munmap`
      instead of 1, and the benchmark took 53 to 100 ticks instead of 7 or 8 (a tick is 1,000,000 timer cycles,
      [[kernel/trap.c:179]], 0.1 s on QEMU). Every page costs a transaction: [[begin_op]],
      5 blocks into the log (4 data blocks and the inode), the commit, the install. All other checks pass, since writing an
      unchanged page back changes nothing in the file, as long as only one process maps it.

      `stress` is where it is wrong. Each of three processes maps all 12 pages, reads them all
      (so all 12 are loaded, each a private copy of the file as it was *at load time*), changes
      its own 4, and unmaps. Suppose A loads page 5, B's page, while it holds round 10's value;
      B then writes round 11 into page 5 and unmaps, writing it back; A unmaps a moment later
      and writes back its stale copy of page 5: round 10 again. B's update is lost. Whether the
      final file is right depends on the order of the last write-backs, so the test failed 5
      times out of 6 here, and passed 10 times out of 10 on the reference.

      With the `D` test, a process writes back only pages it stored into, and in `stress` no two
      processes store into the same page. Two processes that do store into the same page of a
      shared mapping still overwrite each other at page granularity, because each has its own
      copy. Removing that would need one physical page per file page, shared by every mapping:
      a page cache (see "further").
reveal:
  - title: A record per mapping
    commit: 1
    file: kernel/proc.h
    lines: 79-115
    focus: 81-89
    diff: true
    state:
      hart: any
      proc: "(a definition: used by mmap, munmap, the fault path, fork, exit and exec)"
      locks: []
    note: |
      The story of this tour was recorded with gdb on the finished branch, three harts:
      `mmaptest shared` maps a file and changes it, `fork` hands a mapping to a child, `locked`
      and `self` call `read`, `write` and `wait` with buffers inside a mapping, and `stress`
      runs three processes against one file. Each step says which run its state comes from.

      Commit 1 adds the record that question 1 designed. `struct vma` (Linux's name, "virtual
      memory area") holds where the mapping starts and how long it is, `prot` and `flags`, the
      file's offset of `start`, and `f`, a counted reference to the open file. `struct proc`
      gets a fixed array of `NVMA` (16, in `param.h`) of them; a slot with `len` 0 is free.
      Each one is 40 bytes, so every `struct proc` grows by 640 bytes: gdb printed
      `sizeof(struct proc)` = 1000 in this build, which is why the third process slot shows up
      as `proc+2000` in the backtraces below.

      The array sits below the comment "these are private to the process, so p->lock need not
      be held", and that is where it belongs: only the process itself changes its mappings,
      and [[kfork]] reads the parent's while the parent is inside `fork`. That is also why the
      fault path, later, reads the table with no lock at all.
  - title: "mmap: check everything first"
    commit: 2
    file: kernel/mmap.c
    lines: 53-102
    focus: 65-84
    diff: true
    state:
      hart: 0
      mode: S
      proc: mmaptest (pid 3)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_mmap]
      sp: {"on": kernel, detail: "pid 3's kernel stack, `sp` = `0x3fffff9f60`"}
    note: |
      `sys_mmap` fetches six arguments, the most any system call in this tree takes: `a0`
      to `a5` are all the argument registers [[argraw]] knows. Then it refuses, in order:

      - an `addr` other than 0 (the kernel chooses), a zero or absurd `len`, an `off` that is
        not a page boundary, and an `off + len` that wraps around;
      - any `prot` but read or read-write (`W` without `R` is reserved in a RISC-V PTE);
      - any `flags` but exactly one of shared and private;
      - a bad descriptor, a pipe or device (pages are read from an inode), or a file not
        opened for reading;
      - a shared writable mapping of a file opened read-only (line 83): its stores would end
        up in a file the process may not write. `mmaptest private` checks this one.

      This is `mmaptest shared` (pid 3), on hart 0, in a system call: interrupts on, nothing
      held. gdb recorded the state at line 95, after all the checks; nothing on the way there
      takes a lock.
  - title: "mmap: find room at the top, take a reference"
    commit: 2
    file: kernel/mmap.c
    lines: 31-101
    focus: 86-101
    state:
      hart: 0
      mode: S
      proc: mmaptest (pid 3)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_mmap]
      sp: {"on": kernel}
    note: |
      A free slot, then a place: `vmaplace` (lines 34-51) starts with `end` at `TRAPFRAME`,
      tries `[end - len, end)`, and whenever an existing mapping overlaps it, moves `end` down
      to that mapping's start and tries again. Each retry lowers `end`, so the loop ends, at
      the first gap that fits or at the heap, which it never crosses (line 41).

      gdb at line 95: `start` = `0x3fffffb000`, `len` = `0x3000`, `p->sz` = `0x7000`, file
      inode 25 with `f->ref` 1. The mapping ends exactly at `TRAPFRAME` (`0x3fffffe000`), and
      between it and the top of the heap lie about 256 GiB of empty address space.

      Line 99 takes the reference: [[filedup]] makes `f->ref` 2, one for the descriptor and one
      for the mapping, under `ftable.lock` for a moment (`noff` 1 inside [[filedup]]). The test
      closes the descriptor right after `mmap` returns; the mapping keeps the file open. Nothing
      else happens: no page is allocated, no PTE is written, no byte is read. `mmap` costs the
      same for 1 page as for 1000.
  - title: The heap stops at the lowest mapping
    commit: 3
    file: kernel/proc.c
    lines: 233-254
