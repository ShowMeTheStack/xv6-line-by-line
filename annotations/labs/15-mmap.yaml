      **`mmaptest locked`: `panic: acquire`.** The pipe write and read worked: the file had
      just been written, its blocks were in the [[g:buffer-cache]], and loading those two pages
      never slept. Then `wait(&status)` with `status` in page 2 of the mapping (`va`
      274877894656 = `0x3fffffd000`). [[kwait]] has found the zombie child and holds
      `wait_lock` and the child's `p->lock` (`proc+3000`; the parent is `proc+2000`) while it
      copies the status out ([[kernel/proc.c:390]]). The copy loads the page; [[readi]] reads
      the block and releases its buffer with [[brelse]], which releases the buffer's
      sleep-lock, and [[releasesleep]] calls [[wakeup]] in case anyone waits for that buffer.
      [[wakeup]] acquires *every* process's `p->lock` in turn ([[kernel/proc.c:581]]),
      including the child's, already held on this hart: [[acquire]]'s [[holding]] check panics.
      `noff` 4: `wait_lock`, the child's `p->lock`, the buffer sleep-lock's own spinlock held by
