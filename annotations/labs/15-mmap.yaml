      cache: any load, cached or not, releases a buffer. Five boots, five identical panics.

      The pipe paths are still wrong, only quieter: [[pipewrite]] and [[piperead]] hold
      `pi->lock`, which [[wakeup]] does not need, so they fail only when the load has to sleep
      (a cache miss, or the file's inode or a buffer locked by another process: three readers
      hammering a one-page file produced `panic: sched locks` on a pipe write);
      then [[sleep]] adds `p->lock` and [[sched]] sees `noff` 2: `panic: sched
      locks`. A version of this test with a larger file panicked with `sched
      locks` on this kernel (no backtrace was recorded for that run).

      **`mmaptest self`: a process waiting for itself.** `read` of the mapped file into page 1
      of its own mapping (`va` 274877890560 = `0x3fffffc000`). [[fileread]] locks inode 25
