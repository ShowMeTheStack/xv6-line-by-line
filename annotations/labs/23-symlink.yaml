    symptom: |
      $ symlinktest
      symlinktest: basic: OK
      symlinktest: relative: OK
      symlinktest: dangling: OK
      symlinktest: nofollow: FAIL
      symlinktest: chain: OK
      symlinktest: cycle: OK
      symlinktest: directory: OK
      symlinktest: not followed in the middle of a path or by chdir: OK
      symlinktest: create through a link: OK
      symlinktest: unlink: OK
      symlinktest: hard link to a symlink: FAIL
      symlinktest: unlinked symlink's inode freed: FAIL
      symlinktest: errors: OK
      worker 0: bad link /stt/c/l3: 'target'
      worker 2: bad link /stt/c/l3: 'target'
      worker 1: bad link /stt/c/l3: 'target'
      symlinktest: concurrent: FAIL
      symlinktest: SOME TESTS FAILED
      $ usertests -q
      usertests starting
      [...]
      ALL TESTS PASSED
    why: |
      Every check that asks for the link *itself* fails, and nothing else does. `nofollow`
      expected type `T_SYMLINK` and the data `/stt/a` and got the file. `hard link to a
