  - title: "resolve: a relative target, from the link's directory"
    commit: 4
    file: kernel/sysfile.c
    lines: 328-346
    focus: 334-345
    diff: true
    state:
      hart: 2
      mode: S
      proc: cat (pid 6)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_open, follow, resolve]
      sp: {"on": kernel}
    note: |
      `path` is `sys_open`'s own `MAXPATH` buffer, still holding the name `open` was called
      with. `resolve` rewrites it in place to name the target: strip trailing slashes,
      then the link's own name, keeping the directory part including its final `/`; an
      absolute target throws even that away. gdb stopped here with `path` = `"d/l"` and
      `target` = `"f"`: `dirlen` ends at 2, and [[safestrcpy]] writes `f` after `d/`, giving
      `d/f`.

      The test at line 342 refuses a result that would not fit. [[safestrcpy]] would
      truncate silently, and a truncated path names the wrong file.

      Why is the directory part right? Because only the last component of a path is ever
      followed: everything before the last `/` was walked by [[namex]] as real directories.
      In a design that follows links in the middle of a path, the link's directory is not a
      prefix of the string any more, and this trick would not work.
    others: |
      The prefix is walked *again*, as text, with no lock held between the two walks. If
      another process removes the link, then its emptied directory, and makes a new
      directory with the same name, all between the two walks, the target is looked up in
      the new directory. xv6 has no `rename`, so that is the only way the prefix can change
      meaning, and the result is still a correct lookup of a name as it exists *now*; the
      same is true of any path a program looks up twice.
