    why: |
      The check looks at the inode `open` found *by name*, which is the link; the inode
      `open` returns is the one at the end of the link. `symlinktest directory` notices
      only that `open("/stt/dlink", O_RDWR)` now succeeds.

      The shell shows what that means. `echo xx > dl` opens `dl` with `O_WRONLY | O_CREATE |
      O_TRUNC`; [[create]] returns the existing link, `follow` turns it into the directory
      `d` (inode 25), and nothing refuses a writable directory any more (`O_TRUNC` applies
      only to `T_FILE`). gdb saw `echo`'s two `write` calls with `ofile[1]` pointing at
      inode 25, type 1. They wrote `xx` and `\n` over the first 3 bytes of `d`'s data: the
      entry for `.`. Its 2-byte inode number became `0x7878` = 30840 and its name `\n`.

      `ls d` reads that entry and stats `d/\n`: [[dirlookup]] finds it and calls [[iget]]
