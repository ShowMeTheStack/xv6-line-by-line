      (another boot)
      $ mkdir d
      $ echo hi > d/f
      $ ln -s d dl
      $ ls d
      .              1 25 48
      ..             1 1 1024
      f              2 26 3
      $ echo xx > dl
      $ ls d
      panic: ilock: no type

      # gdb, breakpoint on panic:
      #1  0x00000000800032d8 in ilock (ip=ip@entry=0x8001e078 <itable+432>) at kernel/fs.c:317
      #2  0x000000008000524a in sys_open () at kernel/sysfile.c:409
