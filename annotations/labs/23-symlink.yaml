reveal:
  - title: A fourth kind of inode
    commit: 1
    file: kernel/stat.h
    lines: 1-12
    focus: 1-4
    diff: true
    state:
      hart: any
      proc: "(definitions shared by the kernel, mkfs and user programs)"
      locks: []
    note: |
      The story of this tour was recorded in one boot of the finished branch, on three
      harts, with gdb attached from boot. You type `mkdir d` (it becomes inode 25), `echo hi > d/f` (inode
      26), `ln -s f d/l` (`ln` is pid 5; the link becomes inode 27) and `cat d/l` (pid 6),
      which prints `hi`. Later steps follow pid 5 through `symlink` and pid 6 through
      `open`.

      Commit 1 only defines things. `T_SYMLINK` is the value 4 in the `type` field that every
      inode already has, on disk (`struct dinode`) and in memory (`struct inode`). Nothing
      about the shape of an inode changes: a link is an inode with a size and data blocks,
      like a file, whose data happens to be a path. That is why `mkfs` and the on-disk format
      need no change, only a rebuild, since this header is shared.

      Every piece of code that tests `type` now has a value it has never seen. Code that asks
      "is it a directory?" (like [[namex]] at [[kernel/fs.c:703]]) treats a link as "not a
      directory", which is exactly the behaviour the spec promises for links in the middle of
      a path.
  - title: A flag for the link itself, and a bound
    commit: 1
    file: kernel/fcntl.h
    lines: 1-6
    focus: 6
    diff: true
    state:
      hart: any
      proc: "(definitions)"
      locks: []
    note: |
      `O_NOFOLLOW` is a new bit for `open`'s mode, 0x800, next to `O_CREATE` (0x200) and
      `O_TRUNC` (0x400). The low two bits are not separate flags but an access mode
      (`O_RDONLY` 0, `O_WRONLY` 1, `O_RDWR` 2), so a new flag must take a bit above them. The
      other lines only change their padding so the values line up.

      The same commit adds `MAXSYMLINK` (10) to `kernel/param.h`: the most links one `open`
      will follow. It is a constant of the kernel, like `MAXPATH`, and user programs may
      include `param.h` to see it (the test does, to build a chain of exactly 10 and one of
      11).
  - title: The plumbing of a new system call
    commit: 2
    file: kernel/syscall.c
    lines: 102-136
    focus: 134
    diff: true
    state:
      hart: any
      proc: "(the system-call table)"
      locks: []
    note: |
      A new system call needs four small pieces outside its own code: a number
      (`SYS_symlink` 23 in `syscall.h`), a user-side stub (`entry("symlink")` in `usys.pl`,
      which generates `li a7, SYS_symlink`, `ecall`, `ret`), a prototype in `user.h`, and this table entry
      (line 134) with its `extern` (line 106). [[syscall]] indexes the table with `a7` from the trapframe; the
      arguments stay in `a0` and `a1` until `sys_symlink` fetches them. See [[tour:5]] for the
      whole path.

      The table is `static` and never written, so three harts read it without a lock.
  - title: "sys_symlink: arguments, then one transaction"
    commit: 2
    file: kernel/sysfile.c
    lines: 397-452
    focus: 402-415
    diff: true
    state:
      hart: 1
      mode: S
      proc: ln (pid 5)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_symlink]
      sp: {"on": kernel, detail: "pid 5's kernel stack, base `0x3fffff9000`"}
    note: |
      Both strings are copied into the kernel first, with [[argstr]], into two `MAXPATH`
      buffers on the kernel stack: 256 of this function's 288-byte frame. [[argstr]]
      returns the length, which `sys_symlink` keeps in `n`: it is how many bytes the target
      is, and soon the size of the new inode. An empty target is refused.

      Then [[begin_op]] joins (or opens) a log transaction, reserving room for
      `MAXOPBLOCKS` = 10 blocks, and [[nameiparent]] finds the directory `d` and puts the
      last name, `l`, in `name`. Everything up to `end_op` is one operation in the log, so
      a crash leaves either the whole link or nothing.

      No lock is held at the focus lines (noff 0), and interrupts are on, as in any system
      call after [[usertrap]]'s `intr_on`. The inode sleep-locks taken next do not change
      that: sleep-locks are not counted in `noff`, and gdb saw noff 0 and `sstatus` =
      `0x200000022` (SIE set) at every stop in this function.
  - title: Parent, then a new inode, both locked
    commit: 2
    file: kernel/sysfile.c
    lines: 397-452
    focus: 416-429
    state:
      hart: 1
      mode: S
      proc: ln (pid 5)
      intr: "on"
      satp: kernel
      locks: ["inode 25 (d) lock (sleep-lock)", "inode 27 (the new link) lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_symlink]
      sp: {"on": kernel, detail: "`sp` = `0x3fffff9e80`"}
    note: |
      These are [[create]]'s first steps, written out: lock the parent, refuse a removed
      directory (`nlink` 0) or an existing name, take a fresh inode from [[ialloc]] with type
      4, lock it, set `nlink` to 1 and write it back. Why not call [[create]]? Because it
      adds the directory entry before returning, and the reference wants the name to appear
      last (next step).

      gdb stopped right after [[ialloc]]: `d` (inode 25) locked by pid 5, the new inode 27,
      `name` = `"l"`, on hart 1, and the log holding 1 block: 34, the inode block for inodes
      16 to 31, which [[ialloc]] marked allocated (the [[iupdate]] that follows writes the
      same block, absorbed).

      Two inode sleep-locks are held at once, in the order parent, then child: the order
      [[namex]], [[create]] and [[sys_unlink]] use. Nobody else can know inode 27 yet, and
      nobody can search `d` while it is locked.
  - title: The target first, the name last
    commit: 2
    file: kernel/sysfile.c
    lines: 427-452
    focus: 431-446
    state:
      hart: 2
      mode: S
      proc: ln (pid 5)
      intr: "on"
      satp: kernel
      locks: ["inode 25 (d) lock (sleep-lock)", "inode 27 (the new link) lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_symlink]
      sp: {"on": kernel, detail: "`sp` = `0x3fffff9e80`"}
    note: |
      [[writei]] at offset 0, `n` bytes from a kernel address (`user_src` = 0): the bytes of
      the target, without the NUL. gdb at the call (hart 1): inode 27, type 4, `nlink` 1,
      `size` 0, `n` = 1 (the target is `f`), 1 block in the log. At the [[dirlink]] that
      follows, `ln` was on **hart 2**: inside [[writei]] it had given up the CPU (to wait for a
      sleep-lock or the disk, or at a timer interrupt; gdb did not show which) and was
      rescheduled on another hart, holding both inode sleep-locks, which
      is allowed for sleep-locks. The log then held 3 blocks: 34, 46 (the free-block
      bitmap, where [[balloc]] marked the new block used) and 1073 (the link's data, zeroed
      by [[balloc]] and then written). After [[dirlink]] wrote the entry `(l, 27)` into
      `d`'s block 1071: 4 blocks, `size` 1, `addrs[0]` = 1073.

      Only now does the name exist, and the link it names is complete. If [[writei]] or
      [[dirlink]] finds the disk full, no entry was written; `nlink` goes back to 0 and
      [[iunlockput]]'s [[iput]] frees the inode with [[itrunc]] and [[ifree]], inside this
      transaction. A test that fills the disk confirmed it on this branch: `symlink
      returned -1`, `/lk does not exist`, and after freeing space `symlink again returned
      0`.

      Then both locks go, child first (the order of release does not matter for
      deadlock), and `end_op`, the last operation outstanding, commits: the 4 blocks go to
      the log on disk, the header is written, then the blocks are installed at their homes
      ([[tour:31]]).
    others: |
      Suppose `cat d/l` starts on hart 0 right now. Its [[namex]] needs to search `d`, so it
      sleeps in [[ilock]] on `d`'s lock until `ln` releases it, after the entry is written.
      Even without that lock, the entry would not exist before the target does. The log
      plays no part in this: it orders writes for crashes, it does not hide blocks from
      other processes.
