measure: |
  **What a link costs on disk, and in the log.** An instrumented copy of the kernel printed
  the log just before `sys_symlink`'s `end_op` (instrumentation not on the branch):

  | link | blocks logged |
  |---|---|
  | `d/l`, link and `d` in the same inode block (the reveal's run) | 4: inode block, `d`'s entries, bitmap, link data |
  | `/m/1` … `/m/3` (same inode block as `/m`) | 4 |
  | `/m/4` … `/m/a` (a new inode block) | 5 |
  | `/g/l`, in a directory whose first block was full | 5: inode block, bitmap (once, for two new blocks), the new directory block, `/g`'s inode block, link data |
  | `l1` in `/` | 5 |

  Every link uses one inode and one whole 1024-byte block, whatever the length of its
  target. A transaction never came near the `MAXOPBLOCKS` of 10 that [[begin_op]] reserves.

  **What following costs.** The same instrumented kernel counted calls to [[bread]] during
  one `open` (all were cache hits: 0 disk reads), and the plain branch timed 10,000
  `open`+`close` pairs with `uptime` (one tick is about 0.1 s; measured while the computer
  was busy with other work, so your times will differ and only the ratios mean much):

  | `open` of | `bread` calls | 10,000 opens |
  |---|---|---|
  | `/m/f` (the file) | 33 | 113 ticks |
  | `/m/1` → `f` (1 link) | 68 | 233 ticks |
  | `/m/a` → `9` → … → `1` → `f` (10 links) | 428 | 1,485 ticks |

  A link roughly doubles the cost of an `open`, because following is a second full path
  lookup. After the first lookup and one [[bread]] for the link's own block, the resolved
  path is looked up again from the start: [[dirlookup]] reads the entries of `/` up to `m`,
  then those of `/m`, once more, one [[bread]] per 16-byte entry. Ten links cost about
  thirteen lookups. That is the price of the simple design (look up the whole resolved
  path again from the start), and one reason real kernels cache name lookups.
further: |
  - **Follow links in the middle of a path.** Move following into [[namex]]: when a
    middle component is a link, splice its target in front of the rest of the path and go
    on, with one depth count for the whole lookup. Then `cd dl`, `cat dl/f` and running
    programs through links work. You will have to decide, for each caller of [[namei]] and
    [[nameiparent]], whether its *last* component is followed, and redo this lab's locking
    argument inside [[namex]], where a directory is locked.
  - **lstat and readlink.** `O_NOFOLLOW` + `fstat` + `read` is a workable `lstat` and
    `readlink`; add them as system calls and teach `ls` to show links (type 4) with their
    targets instead of following them.
  - **Fast symlinks.** Store targets shorter than 52 bytes in `addrs[]` itself instead of a
    data block, as ext2 does: no block, one fewer bitmap update, and a lookup that reads no
    data block. Count the blocks saved with the measurement above.
  - **O_CREATE through a dangling link.** Make `open(link, O_CREATE)` create the missing
    target, as Linux does. Work out which directory it must be created in, and what must be
    locked while you do.
