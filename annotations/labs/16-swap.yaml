measure: |
  The numbers below come from a copy of the branch with two extra programs, not part of
  the branch: `pinread` and `sstat`.

  **Reading into a lazy buffer, as before.** `pinread` reads the 2,441-byte `README` into a buffer reserved with `sbrklazy` and never touched,
  of 1, 1,000, 34,000 and 100,000 pages. On the original kernel and on the reference branch
  the output is the same:

  ```text
  pinread: read(README, 1-page lazy buffer) = 2441
  pinread: read(README, 1000-page lazy buffer) = 2441
  pinread: read(README, 34000-page lazy buffer) = 2441
  pinread: read(README, 100000-page lazy buffer) = 2441
  ```

  `read` on a file pins nothing, and the copy allocates only the one page it fills. (With a
  pin of the whole buffer, the last two lines read `= -1`.)

  **How much `usertests -q` swaps.** `sstat` prints `swapstat`'s numbers. In one boot the
  copy ran `pinread`, `sstat`,
  `usertests -q`, `sstat`, `swaptest`, `sstat`:

  ```text
  sstat: free 32403 slots 0/8192 out 0 in 0 uptime 6
  [...]
  ALL TESTS PASSED
  sstat: free 32404 slots 1/8192 out 49160 in 34 uptime 873
  [...]
  swaptest: ALL OK
  sstat: free 32406 slots 3/8192 out 98391 in 33303 uptime 1378
  ```

  | | pages written out | pages read in | time |
  |---|---|---|---|
  | `usertests -q` | 49,160 | 34 | 867 ticks (about 87 s); 89.9 s by the wall clock |
  | `swaptest` (that run) | 49,231 | 33,269 | 505 ticks (about 50 s) |
  | `usertests -q` on the original kernel | 0 | 0 | 54.1 s by the wall clock |

  `usertests` writes out about 49,000 pages and reads back 34: the tests that fill memory
  (`sbrkfail`, `execout` with its 15 rounds, `countfree`) push their own pages out and then
  exit, and freeing a page that is in swap costs no I/O, only `swapfree`. That is probably
  most of the extra half minute. (These timings were measured while the computer was busy
  with other work; your times will differ, but the page counts will not change much.)

  **What a page costs.** In the `swaptest` run above, 82,500 page transfers took about 50 s
  of wall time, including everything else the test did: at most about 0.6 ms per transfer,
  one 4,096-byte virtio request each, on QEMU's emulated disk.

  **The clock and a sequential scan.** `big` writes pages 0 to 35,999 and then checks them
  from 35,999 down. A scan larger than memory is the classic bad case for LRU-like policies.
  On a freshly booted kernel the check moved 32,299 pages each way in every recorded run;
  run again in the same boot, it moved about 16,000 (16,073 and 16,095), because the clock
  hand starts from wherever the last test left it. The hand goes round physical pages, not
  virtual addresses, so the pages in swap are not simply "the oldest" ones. A real kernel
  adds read-ahead and smarter aging; see *further*.

  **What it costs in memory.** The frame table is 512 KiB (128 pages), the slot counts
  8 KiB, and `swapio`'s unused buffer 1 KiB: the kernel image ends at `0x800a40b8` instead of
  `0x80020bb0`, 131 pages more. 32 pages are kept free by `ualloc` as a reserve.
further: |
  - **Skip clean pages.** Keep the slot of a page that was read in, and clear D when you do;
    if D is still clear when the page is evicted again, the copy on disk is still good and no
    write is needed. This is the *swap cache*, and it is where the D bit, which the hardware
    already maintains, pays off.
  - **A swapper thread.** Move eviction into a kernel thread that wakes when free memory
    drops below a low-water mark and evicts up to a high-water mark. `ualloc` then only waits,
    and `fork` could wait for it too instead of failing when memory is full.
  - **Let fork make room.** `fork` cannot evict under `np->lock`. Count the parent's resident
    pages first and evict until that many are free, *before* [[allocproc]]; or combine with
    copy-on-write (lab 11), which makes `fork` need almost no pages at all.
  - **TLB shootdowns.** Add an interprocessor interrupt (the SBI or the CLINT's software
    interrupts) that makes another hart execute `sfence.vma` and acknowledge it, and then
    allow evicting pages of processes that are running. Measure what the round trip costs,
    and see why real kernels batch shootdowns.
  - **Several requests in flight.** `swapio.lock` allows one page transfer at a time. The
    virtio queue has room for more; give each eviction its own buffer and a per-slot "being
    written" flag, and measure `swaptest` again.
