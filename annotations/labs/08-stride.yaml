      very first steps. Here is how. At boot, init is the only RUNNABLE process and all three
      schedulers scan the table continuously. Two harts' scans see init RUNNABLE. One takes
      init's lock first, sets RUNNING and switches to it. The other waits on the lock; init
      releases it at the top of [[forkret]] ([[kernel/proc.c:520]] in the original), and the
      second hart gets it, sets RUNNING again and switches to init's saved context. That
      context was never updated (init has not switched out yet), so it still says what
      [[allocproc]] put there: `ra = forkret`, `sp` = the top of init's kernel stack. The
      second hart starts a second copy of `forkret` on the same kernel stack; `static int
      first` is still 1 for both, so both run [[fsinit]].

      From there the two copies overwrite each other's stack frames and saved registers, and
      what breaks first varies: [[sched]] found noff not 1 (`panic: sched locks`, boots 1, 3
      and 5; in boot 5 hart 0 is the one that panicked, hart 1 is the other copy, and hart 2's
      disk interrupt waits for init's lock), or init took an instruction page fault in user
      mode while the kernel jumped to `0x8000fe30`, the address of `proc[0]`, as if it were
      code (boot 4). In boots 2 and 4 two harts printed at once: after `panicking` is set,
      [[printk]] no longer takes its lock, so two messages interleave character by character
      (in boot 2 a `panic: release` and a kerneltrap report; in boot 4 the second line of the
      `usertrap()` message and `panic: kerneltrap`).

      The window looks tiny (between `release` at the end of the scan and `acquire` of the
      candidate), but at boot it is hit almost every time, because idle harts do nothing but
      scan. The re-check costs one comparison. The general rule: what you saw under a lock you
      have released is a hint; act only on what you see under the lock you hold.
  - bug: Keeping the candidate's lock, with scans that start at different slots
    change: |
      The scan keeps the best candidate's lock (so nobody can take the candidate away, and no
      re-check is needed), and, to break ties fairly, each hart starts its next scan after the
      slot it last ran:

      ```c
      best = 0;
      for (int i = 0; i < NPROC; i++) {
        p = &proc[(first + i) % NPROC];
        acquire(&p->lock);
        if (p->state == RUNNABLE && (best == 0 || p->pass < best->pass)) {
          if (best)
            release(&best->lock);
          best = p; // keep its lock: nobody can take it from us
        } else {
          release(&p->lock);
        }
      }
      ...
      first = (best - proc + 1) % NPROC; // break ties round robin
      ```
    symptom: |
      $ stridetest
      stridetest: tickets: OK
      [... nothing more; after 5 minutes gdb was attached:]
        Id   Target Id                    Frame
      * 1    Thread 1.1 (CPU#0 [running]) acquire (lk=lk@entry=0x80010730 <proc+2304>) at kernel/spinlock.c:37
        2    Thread 1.2 (CPU#1 [running]) acquire (lk=lk@entry=0x80010a30 <proc+3072>) at kernel/spinlock.c:37
        3    Thread 1.3 (CPU#2 [running]) acquire (lk=lk@entry=0x80010730 <proc+2304>) at kernel/spinlock.c:37

      Thread 3 (Thread 1.3 (CPU#2 [running])):
      #0  acquire (lk=lk@entry=0x80010730 <proc+2304>) at kernel/spinlock.c:37
      #1  0x0000000080001e64 in scheduler () at kernel/proc.c:481
      #2  0x0000000080000ea0 in main () at kernel/main.c:44

      Thread 2 (Thread 1.2 (CPU#1 [running])):
      #0  acquire (lk=lk@entry=0x80010a30 <proc+3072>) at kernel/spinlock.c:37
      #1  0x0000000080001e64 in scheduler () at kernel/proc.c:481
      #2  0x0000000080000ea0 in main () at kernel/main.c:44

      Thread 1 (Thread 1.1 (CPU#0 [running])):
      #0  acquire (lk=lk@entry=0x80010730 <proc+2304>) at kernel/spinlock.c:37
      #1  0x00000000800020cc in wakeup (chan=chan@entry=0x800078c0 <ticks>) at kernel/proc.c:635
      #2  0x0000000080002696 in clockintr () at kernel/trap.c:172
      #3  0x0000000080002716 in devintr () at kernel/trap.c:215
      #4  0x0000000080002758 in usertrap () at kernel/trap.c:69
      #5  0x0000003ffffff09c in ?? ()
      [...]
      proc[5] pid 8 state 3 lock 0 held by cpus+2147419600 name stridetest
      proc[6] pid 9 state 3 lock 1 held by cpus+128 name stridetest
      proc[7] pid 10 state 4 lock 0 held by cpus+2147419600 name stridetest
      proc[8] pid 11 state 3 lock 1 held by cpus+256 name stridetest
    why: |
      All three boots hung at the same place, the start of the share phase, when six spinners
      became RUNNABLE at once. In this build `struct proc` is 384 bytes, so `proc+2304` is
      `proc[6]` and `proc+3072` is `proc[8]`; `struct cpu` is 128 bytes, so `cpus+128` is hart
      1 and `cpus+256` hart 2 (the large number is the subtraction for a lock held by nobody).
      State 3 is RUNNABLE.

      - Hart 1 holds `proc[6]` (pid 9) as its candidate and spins for `proc[8]`.
      - Hart 2 holds `proc[8]` (pid 11) as its candidate and spins for `proc[6]`.
      - Hart 0 took a timer interrupt in user mode; [[clockintr]] holds `tickslock` and its
        [[wakeup]] of `&ticks` spins for `proc[6]` too.

      Hart 2 reached slot 8 before slot 6: its scan started above 6 and wrapped around. Hart 1's
      scan reached 6 first. Each holds what the other wants, with interrupts off: a classic
      two-lock cycle between two schedulers ([[concept:locks#order]]), and the third hart hangs
      behind it. The other two boots froze the same way with other pairs (`proc[3]` and
      `proc[4]`; `proc[3]` and `proc[5]`), each time with the third hart spinning on one of
      the two locks.

      Holding two `p->lock`s is only safe if every holder takes them in one global order.
      Scanning from slot 0 every time is such an order, and that variant (otherwise identical)
      passed `stridetest`, `usertests -q` and `stridetest` again. Starting at different slots
      destroys the order. The reference avoids the question altogether by never holding two.
  - bug: A 32-bit pass
    change: |
      `pass`, `bestpass` and `vtime.now` are `uint` (32 bits) instead of `uint64`. To see the
      wrap at once rather than after a while (question 7), the experiment also starts virtual
      time 20 strides before 2^32:

      ```diff
      -  uint64 pass;          // stride scheduling: CPU used, in virtual time
      +  uint pass;            // stride scheduling: CPU used, in virtual time
      ...
      -} vtime;
      +} vtime = {.now = 0xffffffff - 20 * STRIDE1}; // EXPERIMENT: start 20 strides before the wrap
      ```
    symptom: |
      $
      1 sleep  init tickets 10 pass 4277456056
      2 run    sh tickets 10 pass 4278294912
      vtime 4278190055
      stridetest
      stridetest: tickets: OK
      stridetest: share: 6 processes with 1 1 2 2 3 3 tickets, 50 ticks
      stridetest: share: tickets 1: cpu 166 per mille (ideal 167); chunks 160 per mille
      stridetest: share: tickets 2: cpu 326 per mille (ideal 333); chunks 331 per mille
      stridetest: share: tickets 3: cpu 506 per mille (ideal 500); chunks 507 per mille
      stridetest: share: OK
      stridetest: sleeper: cpu 0 ms, the others 1803 ms on average (ratio 0/100)
      stridetest: sleeper: FAIL
      stridetest: newcomer: cpu 0 ms, the others 1800 ms on average (ratio 0/100)
      stridetest: newcomer: FAIL
      stridetest: SOME FAILED
      $
      1 sleep  init tickets 10 pass 4277456056
      2 run    sh tickets 10 pass 89844
      vtime 4294952283
      stridetest
      stridetest: tickets: OK
      stridetest: share: 6 processes with 1 1 2 2 3 3 tickets, 50 ticks
      stridetest: share: tickets 1: cpu 666 per mille (ideal 167); chunks 673 per mille
      stridetest: share: tickets 2: cpu 333 per mille (ideal 333); chunks 326 per mille
      stridetest: share: tickets 3: cpu 0 per mille (ideal 500); chunks 0 per mille
      stridetest: share: FAIL
      stridetest: sleeper: cpu 0 ms, the others 1802 ms on average (ratio 0/100)
      stridetest: sleeper: FAIL
      stridetest: newcomer: cpu 0 ms, the others 1802 ms on average (ratio 0/100)
      stridetest: newcomer: FAIL
      stridetest: SOME FAILED
    why: |
      The Ctrl-P lines (before and between the runs) show the clock. The initializer sets
      virtual time to 4,273,995,775 (`0xffffffff − 20 × 2^20`); by the first Ctrl-P it stood at
      4,278,190,055, 16.8 million short of 2^32 = 4,294,967,296. During the first share phase
      the spinners' passes cross 2^32 and wrap to small numbers. From then on:

      - **Virtual time stops.** It only moves when a pick's pass is larger than it
        (`best->pass > vtime.now`), and no wrapped pass ever is. It stays at 4,294,952,283,
        just below the wrap.
      - **Wakers starve.** Every process that wakes is moved up to that stuck value, behind
        every wrapped process: the sleeper, the alarm and the waiting parent get no CPU in
        the window, in both runs. The shell wrapped too: woken after the run, it was moved up
        to the stuck 4,294,952,283, charged one stride (104,857 for 10 tickets) when picked,
        and wrapped to 4,294,952,283 + 104,857 − 2^32 = 89,844.
      - **The schedule inverts.** In the second run, all six spinners start near the top
        (virtual time). Those with the largest stride, the 1-ticket processes, cross 2^32
        first; with tiny passes they win every comparison against processes that have not
        wrapped. The 1-ticket pair got 666 per mille of the CPU, the 2-ticket pair 333 and
        the 3-ticket pair nothing at all.

      The first share check passed only because the spinners started together and crossed
      the wrap close together. A comparison that survives the wrap (`(int)(a - b) < 0`, the
      trick of the ticket lock lab) would help only while compared passes stay within 2^31 of
      each other, which on three harts they need not (question 7); `uint64` makes the question
      moot for centuries even at the fastest rate measured.
reveal:
  - title: Tickets live with the fields p->lock protects
    commit: 1
    file: kernel/proc.h
    lines: 80-107
    focus: 85-93
    diff: true
    state:
      hart: any
      mode: S
      proc: any
      intr: "off"
      satp: kernel
      locks: ["the process's p->lock"]
      irq: {noff: 1, intena: 1, note: "in a system call; inside the scheduler the same lock is held with intena 0"}
      stack: [sys_settickets]
      sp: {"on": kernel}
    note: |
      The first commit adds the knob and the measuring instrument, and changes no behaviour:
      the scheduler still ignores tickets.

      Where the fields go is a locking decision. `struct proc` is divided by the comments above
      the fields: those that need `p->lock`, the one that needs `wait_lock`, and those private
      to the process. `tickets` goes in the first group (line 91). It is written by the process
      itself (`settickets`) and read by schedulers on *other* harts, which choose among
      processes they do not own; any field read across harts needs a lock, and the scheduler
      already holds `p->lock` when it looks at a process ([[concept:locks#lock-proc]]). The
      comment records the one exception the design uses later: after creation only the process
      itself writes its tickets, so the process may *read* its own field without the lock
      (question 6).

      `cputime` and `runstart` (lines 92-93) are the instrument: the scheduler writes them
      around `swtch`, under the process's lock, and the process reads them through a system
      call. Defaults are in `param.h`: `DEFTICKETS` (10) for a process that never set any,
      `MAXTICKETS` (100) as the upper bound `settickets` accepts.
  - title: settickets, under the caller's own lock
    commit: 1
    file: kernel/sysproc.c
    lines: 102-130
    focus: 125-128
    diff: true
    state:
      hart: 2
      mode: S
      proc: stridetest (pid 3)
      intr: "off"
      satp: kernel
      locks: ["stridetest's p->lock (pid 3)"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_settickets]
      sp: {"on": kernel, detail: "pid 3's kernel stack (`sp` = `0x3fffff9f90`)"}
    note: |
      The system call checks the range first (lines 123-124), with no lock: `n` is a local
      copy of the argument. Then it swaps old for new under the caller's `p->lock` and returns
      the old count, which is how a program (or the test) can read its tickets without a
      second system call.

      Recorded with gdb on the finished branch, where this function is unchanged: `stridetest`
      (pid 3) on hart 2 calling `settickets(7)`, stopped at line 127. noff 1 (the `p->lock`),
      intena 1: [[usertrap]] turned interrupts on before the system call
      ([[kernel/trap.c:66]]), so the [[release]] on line 128 will turn them back on. `sstatus`
      read `0x200000020`: SIE (bit 1) clear while the lock is held.
    others: |
      While hart 2 holds pid 3's lock, a scheduler on hart 0 or 1 scanning the table spins
      briefly at pid 3's slot before it can look at pid 3's state. The critical section is two
      instructions long. pid 3 is RUNNING on hart 2, so no other scheduler would pick it
      anyway; the lock is for the *value*, which from commit 3 on every scheduler reads when
      it charges a stride.
  - title: The instrument, CPU time per process
    commit: 1
    file: kernel/proc.c
    lines: 436-476
    focus: 456-460
    diff: true
    state:
      hart: any
      mode: S
      proc: none (scheduler)
      intr: "off"
      satp: kernel
      locks: ["the chosen process's p->lock"]
      irq: {noff: 1, intena: 0}
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "this hart's slice of `stack0`"}
    note: |
      Before changing the scheduler, the lab gives it a meter. Line 458 reads the `time` CSR
      just before `swtch` to the process; line 460 runs when the process has switched back
      (by yielding, sleeping or exiting) and adds the time it spent away from the scheduler to
      `p->cputime`. Both happen under the process's lock, which the scheduler holds on both
      sides of `swtch` ([[concept:locks#handoff]]). [[allocproc]] sets `cputime` to 0
      (line 128).

      `sys_cputime` (in `sysproc.c`, after `settickets`) returns `p->cputime` plus the part of
      the current slice already used, `r_time() - p->runstart`: the caller is running, so its
      `runstart` is the moment its current slice began. It reads both under its own lock.

      Why a kernel counter? A user program can count its own work (iterations of a loop), but
      that measures CPU received only if every hart runs at the same speed. On QEMU each hart
      is a host thread, and its speed varies with what else the computer is doing; Measure shows the counts
      straying by several percent while the kernel's numbers stay put. The `time` CSR is the
      same clock on every hart (QEMU's 10 MHz timebase), so CPU time measured with it does not
      depend on which hart ran the process.

      The cost is two CSR reads per switch. Everything later in the lab is measured with it,
      round robin included.
  - title: fork passes the tickets on
    commit: 1
    file: kernel/proc.c
    lines: 285-310
    focus: 302-307
    diff: true
    state:
      hart: 2
      mode: S
      proc: stridetest (pid 3), forking pid 4
      intr: "off"
      satp: kernel
      locks: ["child's p->lock (pid 4)"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_fork, kfork]
      sp: {"on": kernel, detail: "pid 3's kernel stack (`sp` = `0x3fffff9f70`)"}
    note: |
      [[kfork]] already re-takes the child's lock at the very end to make it RUNNABLE
      ([[kernel/proc.c:300]]-[[kernel/proc.c:302]] in the original). The child's tickets are
      set in the same critical section, before any scheduler can see the child as RUNNABLE:
      the moment another hart can pick it, its tickets are right.

      The value comes from the *parent*, read without the parent's lock. That is the exception
      recorded in `proc.h`: after creation only a process writes its own tickets, and the
      parent is busy here, in [[kfork]]. Taking the parent's lock would mean holding two
      `p->lock`s (child and parent), and nothing in the kernel defines an order between two
      `p->lock`s.

      [[allocproc]] gives every new process `DEFTICKETS` first (line 127); for a fork child
      line 305 overwrites it. The only process that keeps the default is `init`, created by
      [[userinit]] without a parent. `exec` does not touch tickets at all, so `nice 3 cmd`
      works: `nice` sets its own tickets and becomes `cmd`.

      Recorded on the finished branch at the equivalent line (gdb, `stridetest`'s first fork:
      hart 2, pid 3 creating pid 4, noff 1, intena 1).
    others: |
      The child's lock is held, so no scheduler can look at the child until line 307. A
      scheduler on another hart that reaches the child's slot spins for a few instructions.
      The parent's own lock is *not* held: another hart's scheduler can read the parent's
      tickets at this very moment, which is fine, because nobody is writing them.
  - title: "The test: CPU time in a window"
    commit: 2
    file: user/stridetest.c
    lines: 1-60
    focus: 30-59
    diff: true
    state:
      hart: any
      mode: U
      proc: stridetest (a spinner)
      intr: "on"
      satp: user
      locks: []
      stack: [main, sharetest, measure, spin]
      sp: {"on": user}
    note: |
      Each spinner runs a busy loop in chunks of 50,000 iterations; after each chunk it asks
      the kernel for the time (`uptime`, in ticks). The first time it sees the clock inside the
      window `[wstart, wend)` it reads its CPU time (line 50); when the window has ended it
      reads it again (line 56). The difference is the CPU this process received during the
      window, measured by the kernel; its share of all spinners' CPU time is what the checks
      use. Both readings are taken within one chunk (well under a millisecond of CPU) of the
      window's edges.

      The chunks finished inside the window are counted too (line 52) and printed beside the
      CPU shares, as information. They are what a user program would naturally measure, and
      Measure shows how much they stray on QEMU.

      `x` is `volatile` so that the compiler cannot delete the loop. A process that is not
      running reads nothing, and when it next runs after `wend` it leaves at its first look at
      the clock. Every spinner reports one 16-byte `struct result` on a pipe; the parent reads
      six of them. Six results fit in the pipe's 512-byte buffer, so no writer waits for space
      in the middle of its write, and [[pipewrite]] holds the pipe's lock for the whole of it:
      the results cannot interleave.
  - title: "Sleepers that really sleep"
    commit: 2
    file: user/stridetest.c
    lines: 61-131
    focus: 94-117
    state:
      hart: any
      mode: U
      proc: stridetest (the parent)
      intr: "on"
      satp: user
      locks: []
      stack: [main, latetest, measure]
      sp: {"on": user}
    note: |
      `measure` forks the spinners and, for the sleeper and newcomer checks, an *alarm*
      process. The sleeper (line 100) and the parent (line 112, before it forks the newcomer)
      block in `read` on the `go` pipe; the alarm waits until the window starts and writes one
      byte.

      The comment on lines 77-79 explains why the sleeper does not simply call `pause` until
      the window. A sleeper that did would show no burst at all on the stride kernel: [[sys_pause]] waits on `&ticks` and is woken at every tick
      ([[kernel/sysproc.c:83]]), so a "sleeping" process was picked, and charged, again and
      again (question 4). A process blocked in `read` is woken exactly once. The alarm itself
      may use `pause`: its own share does not matter.

      In the newcomer check the parent is the one asleep, so the newcomer is forked by a
      process that slept for 30 ticks. That is the case commit 3 gets wrong: its fork copies
      the parent's pass.
  - title: "The checks, and round robin's result"
    commit: 2
    file: user/stridetest.c
    lines: 171-232
    focus: 189-207
    state:
      hart: any
      mode: U
      proc: stridetest (the parent)
      intr: "on"
      satp: user
      locks: []
      stack: [main, sharetest]
      sp: {"on": user}
    note: |
      The share check runs six spinners with 1, 1, 2, 2, 3 and 3 tickets. With six, no process
      ever deserves more than one hart (a 3-ticket process deserves 3/12 of the CPU, 0.75 of a
      hart on three harts), so the ideal shares, 167, 333 and 500 per mille for the three pairs,
      hold on 1 to 4 harts. Each pair's share of CPU time must be within 20% (line 203). The
      sleeper and newcomer checks (lines 214-232) use equal tickets and compare the late
      process's CPU time with the average of the other five, between 0.67 and 1.5.

      On this commit the scheduler still ignores tickets, and the test says so (3 harts):

      ```text
      stridetest: share: tickets 1: cpu 333 per mille (ideal 167); chunks 332 per mille
      stridetest: share: tickets 2: cpu 339 per mille (ideal 333); chunks 344 per mille
      stridetest: share: tickets 3: cpu 326 per mille (ideal 500); chunks 323 per mille
      stridetest: share: FAIL
      stridetest: sleeper: cpu 1603 ms, the others 1482 ms on average (ratio 108/100)
      stridetest: sleeper: OK
      stridetest: newcomer: cpu 1403 ms, the others 1522 ms on average (ratio 92/100)
      stridetest: newcomer: OK
      ```

      Round robin keeps no history, so it cannot be unfair to a sleeper: the late checks pass.
      They are there for what comes next. Every check is computed from the CPU times; the chunk
      shares are not checked, and the final line, `ALL OK` or `SOME FAILED`, covers the checks
      only.
  - title: "The scan: look at everyone, one lock at a time"
    commit: 3
    file: kernel/proc.c
    lines: 427-469
    focus: 452-469
    diff: true
    state:
      hart: any
      mode: S
      proc: none (scheduler)
      intr: "off"
      satp: kernel
      locks: ["p->lock of the slot being looked at"]
      irq: {noff: 1, intena: 0}
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "this hart's slice of `stack0`"}
    note: |
      The loop body changes shape. The original ran each RUNNABLE process as soon as it met it
      ([[kernel/proc.c:447]]). Now the scan only *looks*: for each slot it takes the lock, reads
      the state and the pass, remembers the slot if it is RUNNABLE with a smaller pass than
      the best so far, and releases the lock before moving on (lines 457-464). Ties go to the
      earlier slot, because only a strictly smaller pass replaces the best.

      One lock at a time, never two (the comment on lines 452-454): no lock-order question can
      arise among `p->lock`s, whatever the other harts do (question 3). The price is that
      `bestpass` and `best` are only a record of what was true while each lock was held.

      If nothing is RUNNABLE, the hart waits for an interrupt (`wfi`) and then starts over, as
      the original did. The `intr_on(); intr_off();` at the top is unchanged: interrupts are
      off during the whole scan, so intena is 0 for every acquire here
      ([[concept:locks#sched-intena]]).
    others: |
      The other two harts may be scanning the same table at this moment, each in its own loop.
      They meet only at individual locks: if two harts want the lock of the same slot, one
      spins for the few instructions the other needs to read two fields. A process running on
      another hart may also take its own `p->lock` to [[yield]] or [[sleep]]; the scan simply
      waits for that slot.
