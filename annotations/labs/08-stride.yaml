  - title: The whole scheduler, and what it cost
    commit: 5
    file: kernel/proc.c
    lines: 474-524
    focus: 478-504
    state:
      hart: any
      mode: S
      proc: none (scheduler)
      intr: "off"
      satp: kernel
      locks: ["best's p->lock"]
      irq: {noff: 1, intena: 0}
      stack: [main, scheduler]
      sp: {"on": scheduler}
    note: |
      The change is about 80 added lines in `proc.c`, `proc.h` and `param.h`, plus two system
      calls. Nothing outside the process code noticed: `usertests -q` passes at every commit.

      What it bought: on 1, 2 and 3 harts, six processes with 1:2:3 tickets got 1:2:3 shares
      of the CPU, within a slice or two of a 50-tick window, where round robin gave every one
      the same (Measure).

      What it cost: a scan of all 64 slots before every pick (the original also scans, but runs
      the first RUNNABLE process it meets), a second `acquire` of the chosen process, a leaf
      lock taken on every pick and every wakeup, and an approximation (the minimum is only
      approximately the minimum, on three harts).

      And what the clinics taught: the dangerous decisions are not in the arithmetic but in
      the concurrency. Acting on a value seen under a released lock ran one process on two
      harts. Holding two locks in an order that depends on the hart deadlocked two schedulers
      and hung the third hart. Placing a process on the wrong clock (pass 0, or a stale pass,
      or a wrapped one) starved someone; which one depended on where the clocks pointed.
