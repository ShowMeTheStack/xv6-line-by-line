measure: |
  **Shares, round robin against stride** (per mille of the CPU time of all spinners in the
  50-tick window, per ticket count, from the kernel's counter; ideal 167 / 333 / 500). Round
  robin is commit 2 of the branch: tickets exist, the scheduler ignores them.

  | kernel | harts | 1 ticket | 2 tickets | 3 tickets |
  |---|---|---|---|---|
  | round robin | 3 | 333, 346 | 339, 326 | 326, 326 |
  | round robin | 1 | 339 | 319 | 340 |
  | stride | 3 | 159-166 | 326-333 | 506 |
  | stride, 24 runs on a busy computer | 3 | 163-166 | 325-329 | 506-507 |
  | stride | 2 | 159 | 330 | 509 |
  | stride | 1 | 159 | 320 | 519 |

  (Stride on 3 harts: six quiet runs on commits 3, 4 and 5, which schedule CPU-bound
  processes identically.) CPU time is handed out in whole slices of about 100 ms, so a
  50-tick window cannot split exactly 1:2:3: on one hart, the six processes of
  `stridetest 1 1 2 2 3 3` used 400, 400, 800, 800, 1,301 and 1,301 ms, that is 8, 16 and
  26 slices per pair where 8.3, 16.7 and 25 would be exact.

  **Three processes with 1, 2 and 3 tickets** (`stridetest 1 2 3`, CPU time in the window):

  | kernel | harts | 1 ticket | 2 tickets | 3 tickets |
  |---|---|---|---|---|
  | round robin | 1 | 1,701 ms (339) | 1,602 ms (320) | 1,702 ms (340) |
  | stride | 1 | 801 ms (160) | 1,601 ms (319) | 2,604 ms (520) |
  | stride | 2 | 1,601 ms (160) | 3,402 ms (340) | 5,003 ms (499) |
  | stride | 3 | 5,001 ms (333) | 5,003 ms (333) | 5,005 ms (333) |

  On 3 harts there is nothing to share: each process has a hart (question 8). On 2 harts the
  3-ticket process deserves exactly one hart, the most it can use, and gets all of it.

  **Late processes** (CPU time of the sleeper or newcomer divided by the others' average,
  3 harts):

  | kernel | sleeper | newcomer |
  |---|---|---|
  | round robin (commit 2) | 1.08, 0.99 | 0.92, 1.00 |
  | stride, pass kept or copied (commit 3) | 2.37, 2.38 | 2.37, 2.37 |
  | stride with virtual time (commits 4, 5), quiet | 1.08 (4 runs) | 1.08 (4 runs) |
  | the same, 24 runs on a busy computer | 0.99-1.09 | 1.07-1.13 |
  | woken pass kept (clinic 2) | 2.37, 2.37 | 1.08, 1.07 |
  | new pass 0 (clinic 1) | 0 | 0 |

  The reference's 1.08 is a small advantage of about one slice: a woken or new process
  starts exactly at virtual time, level with the front of the queue, and ties go to the
  earlier slot. On one hart, where the window holds only about five slices per process, the
  same one slice makes 1.24.

  **Why count CPU time and not work.** Counting chunks of a busy loop is what a user program
  would naturally do. In the 24 busy runs above, the chunk share of the 1-ticket pair
  ranged from 153 to 173 per mille while its CPU share stayed at 163 to 166, and in 83 runs
  of a version of the test that checked chunk shares, they went as low as 132. The
  scheduler was exact; the chunks were not. Two things make chunks stray. Each QEMU hart is
  a host thread whose speed depends on what else the computer runs; on a busy computer,
  `stridetest 1 2 3` once gave chunk shares of 277,
  357 and 365 per mille although each process had a hart to itself. And the twelve picks of
  a stride round fall on the three harts in a repeating pattern, so the 1-ticket processes run
  on only some harts: in one recorded trace both ran on hart 0 for 20 of 21 picks, in another
  only on harts 1 and 2. Their chunk count then measures the speed of fewer harts than the
  other pairs' does. The `time` CSR is the same 10 MHz clock on every hart, so CPU time
  measured with it does not care which hart ran the process.

  **How fast virtual time can grow.** With a scratch program on a copy of the branch, two
  1-ticket processes passing a byte back and forth through pipes made 20,299 and 20,961
  round trips in 100 ticks; virtual time rose from 4,299,137 to 21,349,741,335 and then to
  43,379,484,233, about 2.1 to 2.2 billion per second, one stride per round trip
  (question 7).

  **The schedule, recorded.** A gdb breakpoint at the charging line printed every pick
  without stopping the machine for long (reveal, "Re-check under the lock"): one `STRIDE1` of
  virtual time, 9,317,318 to 10,365,894, contained twelve picks on three harts, one per
  ticket.
further: |
  - **Charge for time used.** The kernel already measures each slice for `cputime`. Add
    `stride × used / slice` instead of a whole stride, and measure an interactive process
    (one that sleeps after a millisecond) against CPU-bound neighbours before and after.
    Look at the `pause` case of question 4 again.
  - **Infeasible weights.** On three harts, `stridetest 1 2 3` cannot give 3/6 to one process.
    Cap each process's effective tickets at what one hart can deliver, and keep the passes of
    processes that run alone from drifting (Ctrl-P showed 43.0 million against 17.5
    million). Compare with how Linux's CFS handles a task whose weight exceeds a CPU.
  - **Per-hart run queues.** The scan of all 64 slots under 64 locks, on every pick, on every
    hart, is the cost of one shared table. Give each hart its own queue of RUNNABLE processes
    sorted by pass, and work out what moving a process between queues needs (lab 18 did the
    same for free pages).
  - **A 32-bit pass that survives the wrap.** Keep `uint`, compare with `(int)(a - b) < 0`, and
    find out what must hold for every two passes ever compared to stay within 2^31 of each
    other: question 7 shows that drifting passes on three harts break it within minutes, so
    the infeasible-weight fix above is a prerequisite. Then run clinic 5's experiment against
    it.
  - **Lottery scheduling.** Replace the minimum with a random draw weighted by tickets and
    compare the variance of the shares over short windows with stride's.
