  - title: Virtual time, and a lock of its own
    commit: 4
    file: kernel/proc.c
    lines: 21-49
    focus: 29-48
    diff: true
    state:
      hart: 0
      mode: S
      proc: stridetest (the alarm process, writing to the pipe)
      intr: "off"
      satp: kernel
      locks: ["the pipe's lock", "pid 12's p->lock", vtime.lock]
      irq: {noff: 3, intena: 1, note: "inside catchup, called from wakeup; reasoned from the recorded noff 2 just before the call"}
      stack: [usertrap, syscall, sys_write, filewrite, pipewrite, wakeup, catchup]
      sp: {"on": kernel}
    note: |
      `vtime.now` is the largest pass with which any process has been picked. Because each
      pick is the smallest pass a scheduler found, `vtime.now` follows the front of the queue:
      where a process that has been competing all along would be now.

      `catchup` (lines 41-48) is called whenever a process becomes RUNNABLE after *not*
      competing, and raises its pass to virtual time if it is behind. It never lowers a pass:
      a process that used a whole stride and slept for a moment is ahead, and stays ahead.

      The lock is the interesting part. `vtime.now` is written by every hart's scheduler and
      read by [[wakeup]] on any hart, so it needs one. Every caller already holds a `p->lock`,
      and `catchup` takes nothing else while holding `vtime.lock`: the comment on line 32
      records its place in the lock order, *after* `p->lock`, as a leaf. A leaf lock cannot be
      part of a cycle. The alternative, computing the current minimum at wakeup time, would
      need every other process's lock while holding this one's (question 5).

      The state shown is the recorded wakeup of the next steps, one level deeper: inside
      `catchup` the waking hart holds the pipe's lock, the sleeper's `p->lock` and
      `vtime.lock`, noff 3.
  - title: The scheduler moves virtual time
    commit: 4
    file: kernel/proc.c
    lines: 474-524
    focus: 496-504
    diff: true
    state:
      hart: 1
      mode: S
      proc: none (scheduler; about to run pid 6)
      intr: "off"
      satp: kernel
      locks: ["pid 6's p->lock", vtime.lock]
      irq: {noff: 2, intena: 0, note: "reasoned: gdb recorded noff 1 at line 504, after the release of vtime.lock"}
      stack: [main, scheduler]
      sp: {"on": scheduler, detail: "hart 1's slice of `stack0`"}
    note: |
      Just before charging, the scheduler raises virtual time to the pass the chosen process
      had (lines 500-503), under `vtime.lock`, nested inside the chosen process's `p->lock`.
      The order matters: virtual time is the pass *before* the charge, the position of the
      front of the queue. Raising it after adding the stride would put virtual time one slice
      ahead of the front, and every waking process would start one slice behind the processes
      already competing.

      "Never let it go back" (the `>` on line 501) keeps virtual time monotonic even though the
      three harts pick at slightly different passes: in the recorded trace, a hart picked a
      3-ticket process at 9,317,314 while virtual time was already 9,317,318, and virtual time
      stayed where it was.

      The nesting is the one recorded in the lock-order comment: `p->lock` then `vtime.lock`.
      The scheduler holds no other lock here, and [[wakeup]] nests them the same way, so the
      two can never wait for each other in opposite orders.
    others: |
      While hart 1 holds `vtime.lock` (three instructions), a wakeup on another hart calling
      `catchup` spins for it while holding the sleeper's `p->lock`. Hart 1 never wants the
      sleeper's lock while holding `vtime.lock`, so the wait is bounded.
