  - title: A cap on user memory
    commit: 1
    file: kernel/memlayout.h
    lines: 52-68
    focus: 59-68
    diff: true
    state:
      hart: any
      proc: "(a definition: used by sbrk, growproc and exec)"
      locks: []
    note: |
      The story in this tour, recorded with gdb attached on three harts: you type `sumtest`,
      the shell forks pid 3, pid 3 calls `exec`, and `sumtest` (still pid 3) runs its checks:
      copies through pipes and files, a `read` into a lazy page, bad pointers, `fork`.

      A note on the state boxes: the tour schema knows only three page tables, so on this
      branch `satp: kernel` means *the running process's own kernel page table*
      (`p->kpagetable`), except in the scheduler, where the details say which.

      Commit 1 makes room. A process's kernel page table (commit 2) will map the process's
      pages at their user addresses, next to everything the kernel maps. The kernel's lowest
      mapping is the [[g:plic|PLIC]], at `0x0c000000` (192 MB); the UART and virtio come next,
      at `0x10000000`. So user memory now ends at `USERTOP` = [[PLIC]] instead of
      [[TRAPFRAME]]. [[growproc]] (eager `sbrk`) and [[sys_sbrk]] (lazy) test against it, and
      [[kexec]] refuses a program whose segments or stack would end above it.

      The [[TRAPFRAME]] and [[TRAMPOLINE]] pages stay where they were, above `USERTOP`: they
      have no `PTE_U` and will never be mirrored.
  - title: Two usertests that asked for a gigabyte
    commit: 1
    file: user/usertests.c
    lines: 2620-2636
    focus: 2623-2625
    diff: true
    state:
      hart: any
      proc: "(user code, before it runs)"
      locks: []
    note: |
