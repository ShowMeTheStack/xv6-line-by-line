    symptom: |
      $ usertests -q
      usertests starting
      test copyin: write(fd, 0x0000000080000000, 8192) returned 8192, not -1
      FAILED
      SOME TESTS FAILED
      $

      (another boot)
      $ sumtest
      sumtest: copy: OK
      sumtest: lazy: OK
      sumtest: write(pipe, 0x0000000080000000) from kernel text (KERNBASE) returned 16
      sumtest: read(fd, 0x0000000087FFF000) into kernel RAM (PHYSTOP - PGSIZE) returned 16
      scause=0panic:

      # gdb, attached afterwards (another boot of the same test, which stopped
      # printing in the middle of the same line):
      0x87fff000:	0x6120736920367678	0x6c706d692d657220
      0x87fff000:	"xv6 is a re-impl\001p\377!"
    why: |
      `write(fd, 0x80000000, 8192)` reads 8 KB of the kernel's own code into a file: kernel
      text is mapped `R|X` without `U`, and supervisor mode may read it, `SUM` or not. Nothing
      faults, nothing panics, and a user program now holds a copy of kernel memory.

      `sumtest` goes further. `read(fd, PHYSTOP - 4096, 16)` *stores* 16 bytes of README into
      the last page of RAM, mapped `R|W` for the kernel. In this build that page is the root of
      [[kernel_pagetable]] (`0x87fff000`): it is the first page [[kalloc]] hands out, and
      [[kvmmake]] takes it. gdb shows README's first 16 bytes there: "xv6 is a re-impl". Those
      bytes are now root entries 0 and 1; `0x78` and `0x20` are even, so both are *invalid*
      PTEs, and gigabyte 0, the devices, has vanished from the kernel page table.

      `sumtest`'s own kernel page table has a private root (copied when it was created), so in
      principle it could go on, but in every boot output stopped at or just after the `read`
      into `PHYSTOP - 4096`; in one of them a panic message broke off after `scause=0`
      (followed by an unprintable byte). We did not trace the collapse step by step. When gdb
      attached, hart 2 was in a nested panic inside `printk`, hart 1 was spinning in
      [[acquire]] in its scheduler, and hart 0 was in `kernelvec` with `satp` =
      `0x8000000000000000`, a page table at physical address 0. What the bytes at `0x87fff000` show is enough: the kernel's own page table
      was overwritten from user space.

      A missing range check is a security hole that the test suite only catches by luck (here,
      one `usertests` line). Any user program could overwrite any kernel page.
  - bug: ucopystr leaves SUM set when it finds the '\0'
    change: |
      An early return that forgets to clean up, the classic mistake:

      ```diff
       2:
      -        csrc sstatus, t0
               li a0, 0
               ret
      ```

      To see the effect, both this kernel and the reference got a deliberately buggy system
      call, `kpeek(int *addr)`, that returns `*(int *)addr`, a user pointer used without
      [[copyin]]. The test program calls `open("README", ...)` (a [[copyinstr]] that finds the
      `'\0'`), then `kpeek(&secret)` with `secret = 42`, then prints two lines with
      `printf`, then calls `kpeek` again.
    symptom: |
      # the reference branch plus kpeek:
      $ peektest
      peektest: secret is at 0x0000000000001000
      scause=0xd sepc=0x80002d9a stval=0x1000
      panic: kerneltrap

      # with the bug:
      $ peektest
      peektest: secret is at 0x0000000000001000
      peektest: right after open(), kpeek returned 42
      peektest: and after these printf()s?
      scause=0xd sepc=0x80002d9a stval=0x1000
      panic: kerneltrap
    why: |
      `0x80002d9a` is the `lw a0,0(a5)` of `return *(int *)addr` in `sys_kpeek`.

      On the reference, the stray dereference faults at once: `SUM` is clear outside the copy
      loops, the page at `0x1000` has `U`, and the kernel panics. That is `SUM` doing its job,
      turning a kernel bug into a loud crash.

      With the bug, `open` leaves `SUM` set on this hart, and the very next system call's stray
      dereference succeeds and returns the user's 42. Then `printf` calls `write` once per
      character, each a [[copyin]] through `ucopy`, which clears `SUM` on its way out. So the
      *second* `kpeek`, the same buggy line, panics. Whether the bug shows depends on which
      copy ran last on this hart, and, since `SUM` is per hart, on which hart the process is
      running. A kernel built this way passes `usertests -q` and `sumtest`: nothing in a test
      suite of correct system calls notices that the safety net is gone.
  - bug: The scheduler stays on the process's kernel page table
    change: |
      The switch back after [[swtch]] is missing:

      ```diff
               kvmswitch(p->kpagetable);
               swtch(&c->context, &p->context);
      -
      -        // back to the kernel's own page table: p's may be
      -        // freed once p->lock is released.
      -        kvminithart();
      ```
    symptom: |
      init: starting sh
      $ usertests -q
      [... no more output for 900 seconds]

      (another boot)
      init: starting sh
      $
      [... the typed command is never echoed; gdb:]
        Id   Target Id                    Frame
      * 1    Thread 1.1 (CPU#0 [running]) kernelvec () at kernel/kernelvec.S:14
        2    Thread 1.2 (CPU#1 [halted ]) s_sstatus (x=2) at kernel/riscv.h:69
        3    Thread 1.3 (CPU#2 [running]) kernelvec () at kernel/kernelvec.S:14
      [...]
      Thread 3 (Thread 1.3 (CPU#2 [running])):
      $1 = 0x8000000000087f52
      Thread 2 (Thread 1.2 (CPU#1 [halted ])):
      $2 = 0x8000000000087f31
      Thread 1 (Thread 1.1 (CPU#0 [running])):
      $3 = 0x8000000000087f52
      [...]
      0x87f52000:	0x8000000000087f31	0x0000003fffffc000
      0x87f52010:	0x00000000800027ee	0x0000000000000ca4
    why: |
      The three `$` values are each hart's `satp`. Harts 0 and 2 are still using `0x87f52000`
      as their root page table, and gdb (reading through hart 1, which is on the shell's table
      `0x87f31000`) shows what that page holds now: `0x8000000000087f31`, `0x3fffffc000`,
      `0x800027ee` (`usertrap`), `0xca4`. Those are the first fields of a **trapframe**:
      `kernel_satp`, `kernel_sp`, `kernel_trap`, `epc`. The page was some process's kernel
      page table, was freed, and was handed out again as a trapframe, while two idle harts kept
      it in `satp`.

      How it happens without the switch back: an idle hart keeps whatever page table the last
      process it ran left in `satp`. That process may exit and be reaped, or `exec` on another
      hart and free its old kernel page table. The idle hart's TLB hides the problem for a
      while; at its next miss the hardware walks the freed page, finds garbage, and faults; [[kerneltrap]] faults again,
      and the hart never gets out of `kernelvec`. With two harts gone, the console falls
      silent. In the first boot it happened as soon as `usertests` started; in the second,
      before the shell could echo the command.

      The rule from question 5: a hart must stop using a page table before anyone can free it.
      The scheduler holds `p->lock` across the switch back, and the freer needs that lock.
