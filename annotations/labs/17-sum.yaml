      page in every 64 (`lazy_unmap` one in every 4096, each in a new child). With a 192 MB
      ceiling, a 1 GB reservation fails and both tests would print `sbrklazy() failed`. 176 MB
      fits below the ceiling and is still more than all of RAM, so only a lazy reservation can
      succeed. The tests do less than before, though: `lazy_alloc` touches 704 pages instead
      of 4,096, and `lazy_unmap` runs 11 rounds instead of 64.

      `lazy_sbrk` changed too (in the same commit): it grew memory in 1 GB steps towards
      [[MAXVA]] and checked the top page below [[TRAPFRAME]]. Its loop never notices that
      `sbrklazy` failed, so with the new cap it would spin forever. It now grows to one page
      below `USERTOP` in a single call; the step loop and its comment are gone. These are the
      only changes to `usertests`, and every check is kept.
  - title: A kernel page table that shares almost everything
    commit: 2
    file: kernel/vm.c
    lines: 84-123
    focus: 92-107
    diff: true
    state:
      hart: 0
      mode: S
      proc: sumtest (pid 3), forking pid 4
      intr: "off"
      satp: kernel
      locks: ["np->lock (pid 4's)"]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_fork, kfork, allocproc, kvmcreate]
      sp: {"on": kernel, detail: "pid 3's kernel stack"}
    note: |
      `kvmcreate` builds one process's kernel page table in two pages:

      - a **root** that starts as a copy of [[kernel_pagetable]]'s 512 entries, so entries 2
        (RAM) and 255 (trampoline, kernel stacks) point at the kernel's own level-1 pages,
        shared;
      - a **private level-1 page** for gigabyte 0, a copy of the kernel's, whose entries 96 to
        128 still point at the kernel's level-0 pages for the PLIC, UART and virtio. Entries 0
        to 95, below `USERTOP`, are empty: the user pages go there (commit 3).

      gdb read the shell's (pid 2's) kernel page table on the finished branch:

      ```text
                     kernel_pagetable   sh's kpagetable
      root[0]        0x21fff801         0x21fcc001    private level-1 page
      root[2]        0x21ff7001         0x21ff7001    shared (RAM)
      root[255]      0x21fe6c01         0x21fe6c01    shared (trampoline, kstacks)
      level-1[96]    0x21fff001         0x21fff001    shared (PLIC)
      level-1[128]   0x21fff401         0x21fff401    shared (UART, virtio)
      ```

      `kvmcreate` is called from [[allocproc]] with the new process's `p->lock` held: when
      `sumtest` forks, that is pid 4's lock, noff 1, and intena 1, because the system call
      turned interrupts on before the [[acquire]]. ([[allocproc]]'s lock state is reasoned
      from the code; gdb recorded noff 1, intena 1 a few lines later in [[kfork]], under the
      same lock.)
    others: |
      The kernel's shared pages are written only by [[kvmmake]], at boot, before the other
      harts start. Afterwards every hart only reads them, through the page-table walker, so
      sharing them needs no lock. The private pages belong to one process; only the hart
      running that process, or its parent during `fork`, touches them.
