verify: |
  On the branch (`ext/17-sum`, 7 commits), built with the project toolchain and run on 3 harts
  (`-smp 3 -m 128M`), in one boot:

  ```text
  $ sumtest
  sumtest: copy: OK
  sumtest: lazy: OK
  sumtest: bad pointers: OK
  sumtest: shrink: OK
  sumtest: limit: OK
  sumtest: fork: OK
  sumtest: ALL OK
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  [...]
  test MAXVAplus: usertrap(): unexpected scause 0xf pid=6519
  [...]
  test lazy_alloc: OK
  [...]
  test lazy_sbrk: OK
  test partial_write: OK
  test unlinkcwd: OK
  ALL TESTS PASSED
  $ sumtest
  sumtest: copy: OK
  sumtest: lazy: OK
  sumtest: bad pointers: OK
  sumtest: shrink: OK
  sumtest: limit: OK
  sumtest: fork: OK
  sumtest: ALL OK
  $ ls | wc
  29 116 722
  ```

  The `usertrap()` lines inside `usertests` are expected kills (`MAXVAplus`, `nowrite` and
  others store where they may not, on purpose). `usertests -q` passing shows that the bad-pointer
  tests (`copyin`, `copyout`, `copyinstr1`, `lazy_copy`), lazy allocation through system calls
  (`lazy_copy`, `lazy_copyinstr`), partial copies (`partial_write`), `exec` with arguments and the
  free-page count all behave as before.

  `usertests -q` also printed `ALL TESTS PASSED` on 3 harts at each of commits 1 to 6, each built
  on its own. Another boot of the head also ran `sumtest` a third time after `ls | wc`: `ALL OK`.

  The same `sumtest` on the original kernel (`USERTOP` defined just for the build) passes every
  check except `limit`, which prints `sbrk beyond USERTOP succeeded` and
  `read() across USERTOP did not stop at USERTOP`: the old kernel already refused all the
  bad pointers, by walking the page table. The point of `sumtest` is that the new kernel, which no
  longer walks, refuses them too.
measure: |
  All numbers are from QEMU 10.2.1, 3 harts, measured while the computer was busy with other
  work (your times will differ), so the two kernels were alternated run by run and the tables
  report ranges. The timing instrumentation is not on the branch: a scratch system call ran
  [[copyout]] or [[copyin]] 100,000 times (2,000 for 512 and 4096 bytes) on a user buffer and
  returned the elapsed `time` CSR ticks (10 MHz, 100 ns each).

  **Per call, in the kernel** (two quietest pairs of runs, ns per call):

  | | original | direct (SUM) |
  |---|---|---|
  | `copyout`, 1 byte | 179-220 | 395-479 |
  | `copyout`, 4096 bytes | 5,496-6,289 | 8,022-8,659 |
  | `copyin`, 1 byte | 144-168 | 400-435 |
  | `copyin`, 4096 bytes | 5,356-6,085 | 8,379-8,870 |

  Over all 11 pairs of runs (some noisier than others) the direct path was slower for 1, 8 and
  64 bytes in every pair, about 2x. For 512 and 4096 bytes it was slower in 39 of 44
  comparisons, about 1.4x; the 5 exceptions came from runs where the original kernel's own
  times jumped by half.

  **Where the time goes** (the same scratch system call timing one ingredient at a time; runs 9
  and 10, both kernels):

  | ingredient | ns |
  |---|---|
  | [[myproc]] (in the new [[copyout]], [[copyin]], [[copyinstr]]) | 279-315 |
  | `csrs` + `csrc` of `SUM` | 82-94 |
  | `csrs` + `csrc` of `SPIE`, for comparison | 83-96 |
  | [[walkaddr]] (twice per page in the old path), original kernel | 86-98 |
  | [[walkaddr]], branch kernel, for comparison | 47 |
  | `memmove` of 4096 bytes, kernel to kernel | 5,051-6,131 |
  | `ucopy` of 4096 bytes to the user buffer | 7,647-8,341 |

  So the fixed cost of a direct copy on QEMU is mostly [[myproc]], a [[push_off]] and
  [[pop_off]] whose CSR accesses are expensive under emulation, plus about 90 ns to set and
  clear `SUM`, which costs no more than toggling any other `sstatus` bit. The per-byte cost is
  the loop: 7 instructions per byte in `ucopy` against 5 in the compiled `memmove`
  (`kernel/kernel.asm`), close to the measured ratio of about 1.5. The two walks it saves cost
  less than the [[myproc]] it adds.

  **From user mode** (`sumtest time`, operations in 20 ticks, 6 runs each):

  | | original | direct (SUM) |
  |---|---|---|
  | `fstat` (one 24-byte copyout) | 36,170-45,920 | 30,740-46,140 |
  | `write` + `read` of 512 bytes through a pipe | 2,990-4,110 | 2,340-3,040 |
  | `open` + 8 KB `read` + `close` | 1,320-1,720 | 1,240-1,670 |

  `fstat` and file reads are dominated by the system call and the file system: no difference
  beyond the noise. Pipes copy one byte per [[copyin]] or [[copyout]] call, 1,024 calls per
  round trip, and in every pair of runs the direct kernel completed 21 to 27% fewer round trips
  (27 to 37% more time per round trip).

  **Memory.** At the first shell prompt, with `init` and `sh` running, gdb counted the pages on
  `kmem.freelist`: 32,545 on the original kernel and 32,539 on the branch, out of 32,735 pages
  between the kernel's `end` and [[PHYSTOP]] in both builds (two separate counts agreed).
  That is 190 pages in use against 196 on
  the branch. That is 3 pages for each of `init` and `sh`: a root, a private level-1 page, and
  one level-0 page for their first 2 MB. A process with a 100 MB heap would need another 50
  level-0 pages (reasoned, not measured).

  **Context switches** now write `satp` (with two `sfence.vma`) before [[swtch]] and again
  after it. We did not measure that cost separately.

  The honest conclusion: on QEMU, direct user access makes copies slower, because the
  ingredients the design adds (a [[myproc]] call per copy, two CSR writes) cost more under
  emulation than the page walks they replace. We have no hardware numbers.
further: |
  - **Drop `myproc()` from the hot path.** Give `copyin` and `copyout` a signature without a
    page table (as Linux's `copy_to_user` has) and let [[kexec]] call a separately named walking
    copy. Re-measure: how much of the slowdown is left?
  - **Copy eight bytes at a time.** Align, then use `ld`/`sd` in `ucopy`, with a byte loop
    for the ends. The fault recovery still works, since a faulting `ld` is just another
    instruction between the labels. Which sizes get faster on QEMU?
  - **One page table per process.** Instead of mirroring user pages into a second table, put
    the kernel's mappings into each *user* page table without `PTE_U` (as Linux does), and drop
    the trampoline's `satp` switches. What becomes of the trampoline, and of the 192 MB cap?
  - **An exception table.** Replace the single address range with a table of (faulting
    instruction, resume address) pairs, so that C code can contain individual user accesses
    (`get_user`/`put_user` in Linux). What must the compiler guarantee for that to be safe?
  - **Faults on the kernel's side of a copy.** The recovery range also catches a fault on the
    *kernel* pointer inside `ucopy` (a kernel bug) and turns it into -1 instead of a panic.
    Make [[kerneltrap]] check that `stval` is a user address below `p->sz` before it forgives a
    fault, and panic otherwise.
  - **A and D bits.** After lab 16 (swapping), a kernel needs to know whether a page was
    accessed or written; with two PTEs per page, combine them. Where would that code go?
