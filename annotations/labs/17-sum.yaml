  - title: Mirroring the user's pages
    commit: 3
    file: kernel/vm.c
    lines: 134-156
    focus: 145-154
    diff: true
    state:
      hart: any
      proc: "(called from fork, sbrk, lazy faults and exec)"
      locks: []
    note: |
      `kvmsync` makes one range of a process's kernel page table agree with its user page
      table. For each page: if the user PTE is a valid leaf with `PTE_U`, copy it (allocating
      level-0 pages in the private level-1 page as needed); otherwise clear the kernel copy, if
      there is one.

      The `PTE_U` test keeps the **stack guard page** out. gdb, the shell's PTEs for
      `0x0`-`0x4000` on the finished branch:

      ```text
      va       user page table   kernel page table
      0x0000   0x21fce05b        0x21fce01b    text (R|X|U)
      0x1000   0x21fcd41b        0x21fcd45b    text
      0x2000   0x21fcd0d7        0x21fcd017    data (R|W|U)
      0x3000   0x21fccc07        0x0           guard page: no U, not mirrored
      0x4000   0x21fcc8d7        0x21fcc817    stack
      ```

      Same physical pages, same permissions, but different `A` (`0x40`) and `D` (`0x80`) bits:
      the hardware sets them in whichever copy it used. The user ran its text and wrote its
      data and stack; the kernel only read `0x1000`. Nothing in xv6 reads `A` or `D`, but a
      kernel that did (to choose pages to swap out, for example) would have to combine both
      copies.

      The function only *writes* the private part of the kernel page table, and only for
      addresses below `USERTOP`: its callers guarantee that.
