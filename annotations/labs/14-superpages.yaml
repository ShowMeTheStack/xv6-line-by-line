  - title: Sixty-four chunks of RAM
    commit: 2
    file: kernel/kalloc.c
    lines: 18-55
    focus: 22-46
    diff: true
    state:
      hart: 0
      mode: S
      proc: none (boot)
      intr: "off"
      satp: bare
      locks: []
      irq: 0
      stack: [main, kinit]
      sp: {"on": boot, detail: "hart 0's slice of `stack0`; paging is still off"}
    note: |
      RAM from [[KERNBASE]] to [[PHYSTOP]] is 64 aligned chunks of 2 megabytes, and the
      allocator now tracks each: `FREE` (whole and free), `SUPER` (whole, in use as a
      superpage) or `SPLIT` (512 pages, each free or in use). A split chunk has its own free
      list and count.

      [[kinit]] marks the chunk that holds the kernel `SPLIT` (in this build `end` is
      `0x80021f88`, so only chunk 0) and frees its pages above `end` as before: 478 pages.
      Chunks 1 to 63 need no work: a static array starts at 0, which is `FREE`. That also
      means boot no longer writes junk over 126 megabytes; pages are junk-filled when they
      are allocated or freed.

      No lock is needed: hart 0 runs alone, harts 1 and 2 wait in [[main]] for `started`.
  - title: kfree puts a page back on its own chunk's list
    commit: 2
    file: kernel/kalloc.c
    lines: 57-84
    focus: 75-83
    state:
      hart: any
      mode: S
      proc: "a process shrinking with sbrk(-n)"
      intr: "off"
      satp: kernel
      locks: [kmem.lock]
      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_sbrk, growproc, uvmdealloc, uvmunmap, kfree]
      sp: {"on": kernel}
    note: |
      A freed page goes onto the list of the chunk it belongs to, `CHUNK(pa)`, and the
      chunk's count goes up. The count will matter in commit 3: a split chunk whose 512
      pages are all free is as good as a free chunk.

      The state check is new and cheap: a page can only be freed one at a time if its chunk
      is split. Freeing a page of a superpage (or of a free chunk) is always a bug, and the
      panic `kfree: whole chunk` catches it at the call that makes the mistake (clinic 4).
      The original allocator would have accepted it and leaked or double-allocated memory.

      The second check narrows a hole that chunks open. Freeing a page twice already
      corrupts the original free list; here it can also make a chunk's count reach 512
      while one of its pages is still in use, and commit 3 would then hand that chunk out
      as a superpage over a live page. A count that would exceed 512 can only mean a page
      was freed twice, so [[kfree]] panics `kfree: double free`. It does not catch every
      double free: one in a chunk that still has a page in use can leave the count at
      exactly 512. Catching all of them would take a "free" bit per page.

      The state shown is the reasoned one for a page freed by `sbrk(-n)` in a system call:
      `kmem.lock` held, noff 1, intena 1.
  - title: kalloc takes a page from the lowest chunk it can
