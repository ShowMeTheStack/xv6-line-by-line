      irq: {noff: 1, intena: 1}
      stack: [usertrap, syscall, sys_write, filewrite, pipewrite, copyin, walkaddr, walklevel]
      sp: {"on": kernel, detail: "pid 5's kernel stack at `0x3fffff7000`"}
    note: |
      The loop is the old [[walk]] with two changes. It walks down only to the level the
      caller asks for (`*level` on entry: 0 for a page, 1 to find a superpage's slot), and
      it stops at a valid leaf, returning that PTE and leaving its level in `*level`.

      Without the stop, line 115 would take a superpage's physical address for a page-table
      page and return a pointer into the user's data: clinic 2 shows the kernel then
      treating bytes the user wrote as PTEs, until [[freewalk]] panics.

      [[walk]] keeps its interface, so its many callers compile unchanged; but they now get
      a level-1 PTE back for a superpage address, and each one must be checked. [[mappages]]
      is already safe: a valid leaf where it wants to map a page makes it panic `remap`.

      State: the moment shown is a later one in the recorded run, `supertest`'s pipe test.
      [[pipewrite]] holds `pi->lock` (noff 1, intena 1, since the system call had turned
      interrupts on) and copies the user's bytes one at a time with [[copyin]], which calls
      [[walkaddr]], which calls this function.
    others: |
      `pi->lock` makes a reader of the same pipe on another hart spin in [[piperead]]; the
      walk itself touches only pid 5's page table, which no other hart can be using.
