      stack: [usertrap, syscall, sys_sbrk, growproc, uvmalloc]
      sp: {"on": kernel}
    note: |
      Everything before was preparation; this is where superpages appear. Every address in
      the new range that is 2-megabyte aligned, with 2 full megabytes below `newsz`, gets a
      zeroed superpage if `superalloc` has one and `mapsuper` finds the slot free;
      otherwise the old page code runs. A superpage that `mapsuper` refused goes back with
      `superfree`.

      Recorded: `uvmalloc(oldsz=0x200000, newsz=0x600000)` for pid 5's `sbrk(4 MiB)`, two
      `superalloc`s (chunks 63 and 62) and two `mapsuper`s, and none of the 1,024
      [[kalloc]]s the original would have made. The 2-megabyte `memset` runs with
      interrupts on and no lock held, so a timer interrupt may preempt it there, and the
      process may continue on another hart.

      Two properties the rest of the branch relies on: a superpage always lies entirely
      below the new size (so [[uvmfree]] always covers it whole), and every caller of
      [[uvmalloc]] gets them, including [[kexec]] for a program whose segments span an
      aligned 2 megabytes. Lazy growth never comes here: `sbrklazy` raises `p->sz` only, and
      [[vmfault]] maps one page per fault.
