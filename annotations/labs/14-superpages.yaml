      run): after a demotion the level-0 page stays, so a later growth that covers
      that 2 megabytes again allocates a superpage, zeroes it, has `mapsuper` refuse it,
      frees it (2 more megabytes of junk fill) and then maps pages. Correct, but wasted
      work; a kernel could free an empty level-0 page, or check the slot first.

      Recorded on hart 1 for pid 5's `sbrk(4 MiB)`: the leaf for `0x200000` at
