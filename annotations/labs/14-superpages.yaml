      irq: {noff: 2, intena: 1}
      stack: [usertrap, syscall, sys_wait, kwait, freeproc, proc_freepagetable, uvmfree, freewalk]
      sp: {"on": kernel}
    note: |
      [[freewalk]] frees page-table pages recursively after [[uvmunmap]] has removed every
      leaf. Its test on line 367 is the hardware's rule at every level: a valid PTE with R,
      W and X clear points to a table; any other valid PTE is a leaf, and finding one means
      somebody forgot to unmap it.

      This lab changes nothing here, and the panic is its most useful line. In clinic 2
      (`walk` descending into superpages) it was the *only* code that recognised the
      superpage: [[uvmunmap]] never saw the level-1 leaf, and [[freewalk]] stopped at entry
      1 of the level-1 page, the region `0x200000`, with `panic: freewalk: leaf`.

      State (reasoned for the reference, matching clinic 2's gdb run): the parent reaping
      in [[kwait]] under `wait_lock` and the zombie's `p->lock`, noff 2.
  - title: Asking the kernel what it did
    commit: 8
    file: kernel/sysproc.c
    lines: 114-137
    focus: 116-130
    diff: true
    state:
      hart: any
      mode: S
      proc: supertest
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_pglevel]
      sp: {"on": kernel}
    note: |
      A test that runs in user space cannot see a page table, and "the program works" does
      not show that superpages were used: the original kernel runs `supertest`'s byte checks
      perfectly. `pglevel` walks the caller's page table with `walklevel` and returns the
      level of the leaf, and `freesuper` returns the count of chunks `superalloc` could hand
      out, which [[kalloc]]-level bugs (clinic 4's, clinic 6's) would disturb.

      Both are debugging interfaces, not something a real kernel would expose this way;
      Linux reports the same facts through `/proc/<pid>/smaps` (`AnonHugePages`).
  - title: The test that makes fragmentation on purpose
    commit: 9
    file: user/supertest.c
    lines: 161-227
    focus: 166-203
    diff: true
    state:
      hart: any
      mode: U
      proc: supertest (pid 5)
      intr: "on"
      satp: user
      locks: []
      stack: [main, demotefork, fragment]
      sp: {"on": user}
    note: |
      `fragment` forks two helpers. Each first gives back the superpages it inherited (so it
      holds only pages), then on every command allocates 64 pages with `sbrk`. The test
      process sends commands to them in turn until `freesuper()` reaches 0, then makes one
      exit. Because the reference [[kalloc]] fills the lowest split chunk first, each chunk
      ends up holding 64-page runs of both helpers, and when one leaves, the other's pages
      pin every chunk: 14,145 free pages and 0 superpages in every recorded run.

      Two details matter. The helpers must give back their inherited superpages first:
      if they keep them, the survivor's allocations use up the freed memory before any
      chunk is split, and the test hangs in `wait`. And the free-page
      count runs in a child that exits: the counting process's own page-table pages, freed
      last, would otherwise pin chunks themselves.
verify: |
  On the branch (`ext/14-superpages`, 9 commits), built with the project toolchain and run on
  3 harts (`-smp 3 -m 128M`), in one boot:

  ```text
  $ supertest
  supertest: heap at 0x0000000000005000, superpages at 0x0000000000200000 and 0x0000000000400000
  supertest: superpages: OK
  supertest: every byte: OK
  supertest: system calls: OK
  supertest: fork copies superpages: OK
  supertest: fragmented: 0 free superpages, 14145 free pages
  supertest: fork without free superpages: OK
  supertest: shrink splits: OK
  supertest: unaligned growth uses pages: OK
  supertest: lazy growth uses pages: OK
  supertest: free pages 32459 before, 32459 after
  supertest: free superpages 63 before, 63 after
  supertest: no leaks: OK
  supertest: ALL OK
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  [...]
  test MAXVAplus: usertrap(): unexpected scause 0xf pid=6526
  [...]
  ALL TESTS PASSED
  $ supertest
  [...]
  supertest: free pages 32459 before, 32459 after
  supertest: free superpages 63 before, 63 after
  supertest: no leaks: OK
  supertest: ALL OK
  ```

  Every line of `supertest` is checked by the program itself; the two information lines
  are printed for the reader. The `usertrap()` lines inside `usertests` are the expected
  kills of tests that touch memory they must not, as on the original kernel. `usertests`
  exercises the superpage paths (from reading its code; we did not trace them during the
  run): `sbrkmuch` grows to 100 megabytes, which can take up to 49 superpages, shrinks by
  one page, which demotes the last one, and grows back; `sbrkfail` runs memory out with
  ten processes. And `supertest` after it
  still finds all 63 superpages free: nothing `usertests` did left a stray page in a chunk.

  Every commit was built on its own, and `usertests -q` passed on 3 harts at every commit
  of the branch.
measure: |
  **Page-table pages.** A measurement program (not on the branch) aligned its heap, grew it
  by 64 megabytes either in one `sbrk` (superpages on the branch) or in 64 steps of
  1 megabyte (no step contains a whole aligned 2 megabytes, so pages), and counted free
  pages before and after with helper processes forked while it was still small:

  | kernel | grown in one `sbrk` | grown in 1 MiB steps |
  |---|---|---|
  | reference branch | 16,352 pages counted as used | 16,384 |
  | original 06aad25 | 16,384 | 16,384 |

  Both rows include the same distortion: the counting helper itself needs fewer page-table
  pages when less memory is free, which cancels the 32 level-0 pages of the page-only case.
  The *difference* is what matters, and it is exactly 32 pages (128 KiB): one level-0 page
  per 2 megabytes, present with pages, absent with superpages. Same numbers in every run on
  each kernel (six on the branch, three on the original).

  **Fragmentation.** Free superpages reported by `supertest` (before its own tests run):

  | allocator | fresh boot | after `usertests -q` |
  |---|---|---|
  | reference (lowest split chunk first) | 63 | 63 |
  | one free list, last freed first | 63, but `supertest` got no superpage at all | 52 |

  With one free list the pages freed last by `supertest`'s counting child (its
  page-table pages, one in nearly every chunk) were the first ones handed out again, so
  every chunk had a page in use by the time the test asked for a superpage.

  **Time, honestly.** The same program timed four things: six runs on the branch (three
  of them without its final one-line check in `kfree`), three on the original kernel (ticks are tenths of a second):

  | | branch, superpages | branch, pages | original |
  |---|---|---|---|
  | one load per page, 16,384 pages × 20,000 | 44-55 | 44-59 | 48-59 |
  | every word, 64 MiB × 400 | 55-105 | 52-110 | 64-100 |
  | `fork` + `exit` + `wait` of the 64 MiB process × 20 | 19-20 | 20 | 19-20 |
  | grow 64 MiB | 1-3 | 1-3 | 1-3 |

  No difference stands out from the noise. The loop with one load per page is the one that
  would show TLB reach on hardware: 16,384 pages are more than typical TLBs hold as
  4096-byte entries, and 32 superpage entries would cover them. QEMU does not show it; the
  explanation is in QEMU's source, not in a timing run: in QEMU 10.2.1,
  `riscv_cpu_tlb_fill` in `target/riscv/cpu_helper.c` installs every
  translation with `tlb_size = TARGET_PAGE_SIZE` (only PMP can make it smaller), so its
  software TLB holds one entry per 4096-byte guest page whatever the guest's leaf size, and
  a superpage saves QEMU at most a shorter walk on a miss. Measure superpages on real hardware; on
  QEMU, count page-table pages.
further: |
  - **Transparent promotion.** When a process has touched all 512 pages of an aligned
    2 megabytes (lazily, or after a demotion), copy them into a free chunk and replace the
    level-0 page by one leaf. It teaches when the kernel may move a process's memory under
    it, and why the TLB must then be flushed on every hart that might use the old entries.
  - **Compaction.** When no chunk is whole, move the few pages in use out of an almost-free
    chunk. Page-table pages and kernel stacks cannot be moved this way, which is why real
    kernels allocate them from different chunks than user pages (Linux's migrate types).
  - **Superpages for exec.** [[kexec]] already gets them for any segment that spans an
    aligned 2 megabytes; link a program whose code is that large and check with `pglevel`.
    Think about what `PTE_X` on a superpage means for `fence.i`.
  - **Gigapages.** A level-2 leaf maps 1 gigabyte. This machine has 128 megabytes, but the
    kernel's own direct map could use level-1 leaves: map RAM in [[kvmmake]] with
    superpages and count the page-table pages saved (the direct map of RAM alone uses one
    level-0 page per 2 megabytes, 64 of them).
  - **Shared superpages with copy-on-write.** Combine with lab 11: what does a store fault
    on a shared superpage copy, 4096 bytes after a demotion or all 2 megabytes?
