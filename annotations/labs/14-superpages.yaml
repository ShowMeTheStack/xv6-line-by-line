    note: |
      [[kalloc]] scans the 64 chunks for the lowest split chunk with a free page. Only if
      there is none does it split the lowest free chunk: `split` pushes the chunk's 512
      pages onto its list (top first, so the list starts at the chunk's lowest page) and
      marks it `SPLIT`.

      gdb caught the first splits of the run: pid 4, the child that counts free memory by
      calling `sbrk(4096)` until it fails, on hart 2, split chunk 1 when its heap reached
      `0x10f000`: chunk 0's free pages above the kernel were used up. Then chunk 2 at
      `0x30e000`, chunk 3 at `0x50d000`, and so on: about 2 megabytes of heap per chunk,
      because the low chunks fill up first.

      This order is the allocator's whole policy against fragmentation: small allocations
      pile up at the bottom of RAM, and the chunks at the top stay whole. Think question 3
      tells what happens with an allocator that reuses the most recently freed page
      first: after a full `usertests -q`, only 52 of the 63 chunks were still available as
      superpages.

      The scan costs up to 64 comparisons per [[kalloc]], under `kmem.lock` with interrupts
      off: noff 1, intena 1, SIE 0, as gdb printed.
