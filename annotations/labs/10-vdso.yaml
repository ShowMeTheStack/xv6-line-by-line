      #0  panic (s=s@entry=0x80007390 "kerneltrap") at kernel/printk.c:139
      #1  0x000000008000289c in kerneltrap () at kernel/trap.c:159
      #2  0x0000000080005728 in kernelvec () at kernel/kernelvec.S:38
      Backtrace stopped: frame did not save the PC
      interrupted: sepc 0x80000b2e kalloc + 32 in section .text s1 0x800e022e4061141 fp 0x3fffff9e90
        saved ra 0x80000b24 kalloc + 22 in section .text
        ra 0x80000fb8 walk + 122 in section .text
        ra 0x8000105a mappages + 72 in section .text
        ra 0x8000144a uvmcopy + 100 in section .text
        ra 0x80001da6 kfork + 44 in section .text
        ra 0x80002a9e sys_fork + 12 in section .text
        ra 0x80002a2e syscall + 58 in section .text
        ra 0x800027b4 usertrap + 166 in section .text
