         }
      +
      +  // map the usyscall page, read-only for user code.
      +  if (mappages(p->pagetable, USYSCALL, PGSIZE, (uint64)(p->usyscall),
      +               PTE_R | PTE_U) < 0) {
      +    freeproc(p);
      +    release(&p->lock);
      +    return 0;
      +  }
      ```
    symptom: |
      $ vdsotest
      usertrap(): unexpected scause 0xd pid=3
                  sepc=0x980 stval=0x3fffffd000
      $ usertests -q
      usertests starting
      [...]
      ALL TESTS PASSED

      # gdb, breakpoint on setkilled (rerun):
      setkilled: {'hart': 2, 'noff': 0, 'intena': 0, 'sie': 0, 'pid': 3, 'name': 'vdsotest'} scause 0xd stval 0x3fffffd000 sepc 0x980
        frames ['setkilled', 'usertrap', '0x3ffffff09c']
        p->usyscall 0x87f51000 pid in page 3
        pagetable 0x87f21000
        PTE for 0x3ffffff000: 0x2000184b
        PTE for 0x3fffffe000: 0x21fcfcc7
        PTE for 0x3fffffd000: no PTE (level-0 entry 509 is 0x0)
        PTE for 0x3fffffc000: 0x21fd6413
    why: |
      The console shows exactly what clinic 1 showed: the first `ugetpid()` load faults. Only
      the page table tells them apart. Here the physical page exists and holds the right pid,
      but the page table of the `exec`'d `vdsotest` has no entry at all for it: [[kexec]] built
      that table with [[proc_pagetable]] ([[kernel/exec.c:56]]), and the mapping now lives in
      [[allocproc]], which `exec` never calls. A forked child that does *not* `exec` would read
      its pid fine, but in practice every program a user runs is started by `exec`, so the page
      is missing in all of them.

      The fix is to map fixed pages in the one function every user page table comes from. The
      trapframe has always been mapped there for the same reason.
