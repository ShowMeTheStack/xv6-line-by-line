      | `uuptime()` | 89,029,000 | 22 ns |

      About 500 times faster. The instruction counts explain a factor of about 74 (1,109
      versus 15 per loop iteration, see Measure); the remaining factor of about 7 is time per
      instruction. Removing the four `sfence.vma` (an experiment only) made `getpid` about a
      third faster, so QEMU's translation-cache flushes are a large share of it; the rest was
      not measured. On real hardware the ratio is
      different, but the cost has the same parts: the trap, the register save, the page-table
      switch and the work around it. That is the price this lab stops paying for two values
      the process may simply know.
