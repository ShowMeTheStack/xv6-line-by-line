      Two different mistakes come out of one line.

      **At `exec`, from boot on.** Every `exec` frees the running process's own page, while the
      process keeps mapping and owning it. It starts before the shell prompt: init's `exec` of
      `/init` freed `0x87f54000` (`PTE 0x21fd5013`), and the shell's `exec` freed `0x87f52000`.
      When the shell then `exec`s `vdsotest` (pid 3), [[kexec]] frees pid 3's page,
      `p->usyscall` = `0x87f51000`, which the *new* page table maps too. [[kfree]] fills a
      freed page with `0x01` bytes and stores the free-list link in its first 8 bytes: gdb read
      exactly that in pid 3's page (`0x87f19000`, then `0x0101...`). `ugetpid()` returns the low
      32 bits of a kernel pointer: `pid: FAIL`. Freed pages get reused while still mapped: after
      serving as pid 3's first page table, init's page `0x87f54000` was handed to pid 4 by
      [[allocproc]] as its usyscall page, while init still maps it as its own `USYSCALL`. Two
      processes now share one pid page, and the kernel has no idea.

      **At wait.** For each child `vdsotest` reaps, [[freeproc]] calls `kfree(p->usyscall)` and
      then [[proc_freepagetable]] frees the same page again (both records show pid 4's page,
      `PTE 0x21fd5013` = physical `0x87f54000`). A page freed twice makes the free list
      point at itself: `X.next = X`. [[kalloc]] hands `X` out (most likely to a `fork`, whose
      [[uvmcopy]] copies a code page into it), then, because the head still says `X`, hands out
      `X` again and sets the head to `X`'s first 8 bytes, now *program code*:
      `0x0800e022e4061141` is the little-endian form of `41 11 06 e4 22 e0 00 08`, the
      instructions `addi sp,sp,-16; sd ra,8(sp); sd s0,0(sp); addi s0,sp,16`. The next
      [[kalloc]], from [[walk]] inside a later [[uvmcopy]] (noff 2: the child's `p->lock`
      and `kmem.lock`), loads `r->next` through that "pointer": a load page fault in the
      kernel (`scause 0xd` at `kalloc+32`), and [[kerneltrap]] panics.

      The general rule: every physical page has exactly one owner that frees it. For the usyscall
      page that is [[freeproc]]; page tables only borrow it.
