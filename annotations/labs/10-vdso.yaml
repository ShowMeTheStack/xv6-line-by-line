    note: |
      Only hart 0 counts ticks. One line is added inside the existing critical section: the new
      value goes to the shared page right after `ticks++`. gdb stopped here with `ticks` 1, 2, 3
      during boot, each time taken in hart 0's scheduler loop (no process: the interrupt landed
      in [[scheduler]]'s `intr_on` window), noff 1, intena 0.

      In this build the line is one `sw a5,0(a4)` at `0x8000267c`: a single naturally aligned
      32-bit store. That is what makes a lock-free reader safe: under RVWMO an aligned word
      access is single-copy atomic, so a reader sees the old value or the new one, never a mix.
      `tickslock` protects `ticks` against [[sys_uptime]] and [[sys_pause]]; it does not
      protect the copy from user readers, who take no lock, and it does not need to.

      The copy lives at the moment [[release]] runs its `fence rw,w`: everything before it,
      including this store, is visible to any hart that later acquires `tickslock`. That gives
      the first half of `vdsotest`'s `uptime() <= uuptime() <= uptime()`. The second half holds
      too: a reader that saw the value stored inside some critical section of [[clockintr]] makes
      its next [[sys_uptime]] call afterwards, and that call's [[acquire]] of `tickslock` comes
      after the release ending that section, so it reads `ticks` at least as large.
    others: |
      Recorded at the second stop: hart 1 in [[pop_off]], hart 2 in [[scheduler]]. Later, with
      `vdsotest` running, a reader on another hart executes `lw` on the same word:

      | time | hart 0 (clockintr) | hart 1 (`uuptime()` in user mode) |
      |---|---|---|
      | 1 | `ticks++` → 42 | `lw` → 41 (old) |
      | 2 | `sw` 42 into the shared page | |
      | 3 | `release(&tickslock)` | `lw` → 41 or 42 |
      | 4 | | `lw` → 42 (eventually, and for good) |

      No row can show a value that was never stored. If the page held *two* fields updated
      together, a reader between two stores could pair a new one with an old one; that would
      need a sequence counter.
