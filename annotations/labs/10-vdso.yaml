      With `W` set, user stores just succeed. `forge` makes its own `ugetpid()` report pid 1,
      and its store to the shared page makes `uuptime()` report 1,000,000 ticks, in *every*
      process, until hart 0's next [[clockintr]] overwrites it. A per-process page that the
      process can write is merely useless; a writable shared page lets any process lie to all
      the others.

      The kernel is fooled as well. [[copyout]]'s only defence is its `PTE_W` test
      ([[kernel/vm.c:364]]), so `read(fd, USYSCALL, 8)` now succeeds and writes 8 bytes of
      `README` over the pid: `read() into usyscall fails: FAIL`, and from then on
      `pid unchanged` and `fork` (which compares the parent's `ugetpid()` with `getpid()`)
      fail too. `heap ceiling` fails because the child's final store survives. `usertests
      lazy_copy` catches the same `read`.
