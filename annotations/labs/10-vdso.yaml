published: true
title: "A shared read-only page: system calls without a trap"
area: Memory
stars: 2
branch: ext/10-vdso
prerequisites: {tours: [5, 7, 20, 22, 25, 26, 28], concepts: [stacks, locks]}
summary: |
  `getpid()` asks the kernel for one integer it already knows. To get it, the process executes
  `ecall`, the hart traps, [[uservec]] saves 31 registers, the kernel switches page tables,
  [[usertrap]] and [[syscall]] run, and the whole trip is undone on the way back. In this tree
  that is 1,103 instructions after the `ecall`, two writes to `satp` and four `sfence.vma`
  (counted with gdb). In this lab you map one extra page into every process, at a fixed
  address just below the [[g:trapframe]], with the process's pid in it, readable but not
  writable from user mode. `ugetpid()` then becomes one load: 12 instructions, no trap.

  A second page, the same physical page in every process, carries a copy of the kernel's
  `ticks`, written by [[clockintr]] and read with no lock by `uuptime()`. That raises the
  question every shared-memory design must answer: can a reader see a half-written value?

  The code is small (about 70 lines of kernel, a third of them comments), but placing a page
  at the top of the user address space touches more than you might expect. What else in the
  kernel already decides what lives near the top of a user address space? Who creates a page
  table, who throws one away, and how often does that happen in the life of one process? Does
  the kernel itself obey a read-only PTE when a system call touches user memory? Answering
  those is the lab. On QEMU the result is about 500 times faster per call.
learn:
  - "The top of a user address space: [[TRAMPOLINE]] (no `PTE_U`, used only in S-mode), the [[g:trapframe]] page below it, and now two pages that user code may read; how a fixed virtual address becomes a contract between the kernel and the user library."
  - "What the PTE permission bits do to each kind of access, and what happens in this tree, where store faults already mean lazy allocation, when a user program stores to a page it may only read."
  - "How long a page lives compared with the page tables that map it, and what `exec`, which builds a whole new page table, does to a page that must outlive it."
  - "Whether the kernel's own copies to and from user memory obey the same PTE bits as the hardware does, and what that means for a page user code may read but should not hand to a system call."
  - "When a value shared between harts can be read with no lock (one writer, one naturally aligned 32-bit word, a `volatile` read) and when it cannot (two values that must agree)."
  - "What a trap costs, measured two ways: instructions counted with gdb, and calls per tick timed from user mode, and why user code here cannot read the `time` CSR."
spec: |
  **Behaviour.** Every process has two extra pages mapped at fixed addresses just below the
  trapframe, both readable and not writable from user mode:

  | address | name | contents | physical page |
  |---|---|---|---|
  | `0x3fffffd000` | `USYSCALL` | `struct usyscall { int pid; }` | one per process |
  | `0x3fffffc000` | `USHARED` | `struct ushared { uint ticks; }` | one for the whole system |

  The user library gains two functions that read them without a system call:

  ```c
  int ugetpid(void);   // == getpid()
  int uuptime(void);   // == uptime(), give or take a tick in flight
  ```

  - A forked child reads its own pid; an `exec`'d image reads the same pid as before `exec`.
  - The copy of `ticks` changes by itself, once per tick, in every process.
  - A user store to either page kills the process, like a store to program text. Nothing may
    turn that store into a lazily allocated page.
  - The heap may not grow into the pages: `sbrk` and `sbrklazy` stop at `USHARED`.

  **What must not change.** System calls behave as before for every address below `p->sz`.
  A system call handed a pointer into the new pages fails, as it did when nothing was mapped
  there (`usertests lazy_copy` checks `read` and `write` on exactly these addresses). No page
  leaks; the shared page is never freed. **`usertests -q` must print `ALL TESTS PASSED` on 3
  harts.** (One test, `lazy_sbrk`, checks the old heap ceiling by its exact value; the
  reference branch updates that one expected value, see the reveal.)

  **The test program**, `vdsotest`, prints one line per check:

  ```text
  $ vdsotest
  vdsotest: pid: OK
  vdsotest: uptime agrees: OK
  vdsotest: uptime advances: OK
  usertrap(): unexpected scause 0xf pid=4
              sepc=0x14 stval=0x3fffffd000
  vdsotest: usyscall read-only: OK
  usertrap(): unexpected scause 0xf pid=5
              sepc=0x2e stval=0x3fffffc000
  vdsotest: ushared read-only: OK
  vdsotest: read() into usyscall fails: OK
  vdsotest: write() from ushared fails: OK
  vdsotest: pid unchanged: OK
  usertrap(): unexpected scause 0xf pid=6
              sepc=0xd2 stval=0x3fffffd000
  vdsotest: heap ceiling: OK
  vdsotest: fork: OK
  vdsotest: exec: OK
  vdsotest: 20 children: OK
  vdsotest: ALL OK
  ```

  - **pid**: `ugetpid() == getpid()`.
  - **uptime agrees**: `uptime()`, then `uuptime()`, then `uptime()` again; the middle value
    lies between the other two. **uptime advances**: after `pause(2)`, `uuptime()` is at least 2
    larger.
  - **usyscall / ushared read-only**: a child stores to the page; it must be killed (exit
    status -1), not survive (status 0). The `usertrap()` lines are those kills, expected; the
    test checks each child's status itself.
  - **read() into usyscall fails, write() from ushared fails, pid unchanged**: system calls
    refuse the pages in both directions.
  - **heap ceiling**: a child grows its heap lazily to the limit; `sbrklazy(1)` more must fail,
    and a store to `USYSCALL` with `p->sz` at its maximum must still kill it.
  - **fork**, **exec**: a child, and a child that `exec`s `vdsotest exec`, read their own pid.
  - **20 children**: 20 children on 3 harts each read their own pid 100,000 times.

  `vdsotest time` measures: it reports whether user mode may execute `rdtime`, then how many
  `getpid`, `ugetpid`, `uptime` and `uuptime` calls fit into 20 ticks.
think:
  - title: What does getpid cost, and which part of it is necessary?
    q: |
      Trace `getpid()` from the user stub to the return. List what the hardware and the kernel do
      on the way in and on the way out. Then ask: which of those steps is needed to produce the
      answer, and what would user code need in order to find the pid by itself, with no trap?
      Commit to an answer before reading the hints: could the kernel *give* the process its pid
      once, and keep it correct afterwards?
    hints:
      - "Follow [[tour:5]]: the stub in `usys.S`, `ecall`, [[uservec]] ([[kernel/trampoline.S:22]]), [[usertrap]], [[syscall]], [[sys_getpid]], then [[prepare_return]] and [[userret]]. Count what is saved, switched and flushed."
      - "The only work that produces the answer is one load of `p->pid` in [[sys_getpid]]. Everything else exists to cross the boundary between user mode and the kernel safely. A user load can reach any page its page table maps with `PTE_U`."
      - "Put the pid in a page of its own, filled in by the kernel when the process is created, and map that page into the process's own page table where user code can read it. A pid never changes for the life of a process, so the kernel never has to update it."
    answer: |
      On the way in: `ecall` switches the hart to S-mode and jumps to [[uservec]] on the
      [[g:trampoline]] page; [[uservec]] saves all 31 user registers in the trapframe, loads the
      kernel stack, `satp` and `tp`, and jumps to [[usertrap]], which saves `sepc`, checks
      [[killed]] (taking `p->lock`), turns interrupts on and calls [[syscall]]. [[sys_getpid]]
      finally loads `p->pid`. On the way out, [[usertrap]] checks [[killed]] again,
      [[prepare_return]] sets `stvec`, `sstatus` and `sepc`, and [[userret]] switches `satp` back
      and restores the 31 registers before `sret`.

      Counted with gdb on the reference branch (see Measure): 1,103 instructions from the first
      instruction of [[uservec]] to `sret`, with 2 `csrw satp`, 4 `sfence.vma` and one
      `fence.i`. 392 of them are in [[mycpu]], 144 in [[push_off]] and 118 in [[pop_off]]: the
      bookkeeping behind [[myproc]] (called 4 times) and the two acquisitions of `p->lock` in
      [[killed]]. Ten are in [[sys_getpid]].

      The answer itself needs none of that. The pid is fixed from [[allocproc]] to
      [[freeproc]], so the kernel can write it once into a page and map the page into the
      process's own page table with `PTE_U`. A user load then reads it: `ugetpid()` compiles
      to `lui`, `addi`, `slli` and one `lw`: 12 instructions from its entry to its `ret`.
      Values that change, like the tick count, need the kernel to keep the page up to date
      (a later question).
    checks:
      - id: lab10-01
        level: 1
        type: number
        q: |
          In one `getpid()` round trip on this kernel, from `ecall` to the instruction after it,
          how many times is `satp` written?
        code: kernel/trampoline.S:86-112@92-111
        answer: 2
        wrong:
          4: |
            You may have counted the `sfence.vma` instructions: there are four (two around each
            `csrw satp`). They flush cached translations; they do not write `satp`.
          1: |
            You may have counted only the switch into the kernel page table in [[uservec]].
            [[userret]] must switch back to the user page table before `sret`
            ([[kernel/trampoline.S:111]]).
          0: |
            You may have thought a system call keeps the user page table. In xv6 the kernel runs
            on its own page table, which does not map user memory at user addresses, so every
            trap switches tables.
        why_wrong: "One `csrw satp` in uservec (into the kernel page table) and one in userret (back to the user page table)."
        explain: |
          [[uservec]] loads the kernel's `satp` from the trapframe at
          [[kernel/trampoline.S:92]], and [[userret]] loads the user's at
          [[kernel/trampoline.S:111]]; each is bracketed by `sfence.vma`. That is why both live
          on the trampoline page, which is mapped at the same address in both tables. See
          [[tour:7]] and [[tour:43]].
      - id: lab10-02
        level: 2
        type: choice
        q: |
          gdb counted 1,103 instructions from the first instruction of [[uservec]] to `sret` for
          one `getpid`. Which part of that work does `ugetpid()` keep?
        options:
          - text: "None of it: ugetpid is an ordinary call that loads the pid from a page in the process's own address space."
            correct: true
            why: |
              Right. No `ecall`, so no trap, no register save, no page-table switch and no lock.
              The page-table walk for the load is done by the hardware, usually from the TLB.
          - text: "The page-table switch: the page with the pid belongs to the kernel, so satp must change to read it."
            why: |
              You may have thought kernel-written data needs the kernel page table. The page is
              mapped into the user page table too, with `PTE_U`; the hardware lets a user load
              reach it directly.
          - text: "The register save in uservec, because a load into a0 would destroy a user register."
            why: |
              You may be thinking of a trap, which interrupts code that does not expect it.
              `ugetpid` is a normal function call: the compiler already treats `a0` and the
              other caller-saved registers as clobbered.
          - text: "The lock: reading a field of struct proc requires p->lock."
            why: |
              [[sys_getpid]] does not take `p->lock` for `p->pid` either; the locks in the count
              come from [[killed]]. And `ugetpid` does not read `struct proc` at all, only a
              copy of the pid that never changes.
        explain: |
          A system call is expensive because of the boundary, not because of the work. When
          the answer is a value the process may know, the kernel can publish it in memory the
          process can read, and the boundary disappears. Linux does the same with its vDSO
          (`clock_gettime`, `getcpu`).
  - title: Where in the address space?
    q: |
      User code must find the page without asking the kernel, so its address must be fixed and
      known when the user library is compiled. Look at the user address space ([[tour:25]]):
      which addresses are already taken, and by what? Pick an address for the per-process page,
      and check it against everything else that can place memory in a user address space. What
      else in the kernel has to learn about your choice?
    hints:
      - "Read the layout comment in [[kernel/memlayout.h:54]]-[[kernel/memlayout.h:63]] and what grows: the heap, through [[growproc]] and the lazy branch of [[sys_sbrk]] ([[kernel/proc.c:243]], [[kernel/sysproc.c:60]])."
      - "Text, data and the stack sit at the bottom and are placed by [[kexec]]; the heap grows up from there, and today it may grow all the way to [[TRAPFRAME]]. A fixed page anywhere in that range collides with a large enough heap."
      - "Take the pages directly below [[TRAPFRAME]] (`TRAPFRAME - PGSIZE`, then one more for the shared page) and lower the heap's ceiling to the lowest of them, in both places that enforce it."
    answer: |
      The reference uses `USYSCALL = TRAPFRAME - PGSIZE` = `0x3fffffd000` and, one page lower,
      `USHARED` = `0x3fffffc000`. The top of the address space is already reserved for
      kernel-managed pages ([[TRAMPOLINE]], [[TRAPFRAME]]), and the bottom belongs to the
      program. Between them only the heap can grow, and it used to be allowed to grow up to
      [[TRAPFRAME]]. So the new pages lower the ceiling: `MAXHEAP = USHARED`, checked in
      [[growproc]] and in [[sys_sbrk]]'s lazy branch.

      Forgetting the ceiling is clinic 6. Lazily, the heap's `p->sz` could cover the new pages;
      eagerly, [[uvmalloc]] would try to map a page where one is already mapped. `usertests
      lazy_sbrk` does exactly that: it grows the heap to the ceiling and then asks for one more
      byte, and the kernel panics with `mappages: remap`. Worse, `sbrk(-n)` would then call
      [[uvmdealloc]] over the pages and *free* them, the shared page included.

      The ceiling is not what keeps user stores out: [[vmfault]] refuses a fault on these pages
      twice over, because the address is at or above `p->sz` ([[kernel/vm.c:463]]) and because
      the page is already mapped ([[kernel/vm.c:466]]); the second test refuses even if `p->sz`
      covered the pages (clinic 6 shows it). What the ceiling does is keep `p->sz` from covering
      them at all. Otherwise the kernel's own reads would treat them as process memory (a later
      question), eager `sbrk` would panic in [[mappages]], and `sbrk(-n)` would free the shared
      page while every process maps it.

      One existing test encodes the old ceiling: `lazy_sbrk` expects the last heap page at
      `TRAPFRAME - PGSIZE` ([[user/usertests.c:2793]]). The reference changes that expected value
      to `MAXHEAP - PGSIZE`; it is the only change to `usertests`.
    checks:
      - id: lab10-03
        level: 1
        type: number
        q: |
          [[MAXVA]] is `1L << 38`, [[TRAMPOLINE]] is `MAXVA - PGSIZE` and [[TRAPFRAME]] is
          `TRAMPOLINE - PGSIZE`. What is `USYSCALL = TRAPFRAME - PGSIZE`, in hex?
        code: kernel/memlayout.h:46-63
        answer: "0x3fffffd000"
        wrong:
          "0x3fffffe000": |
            That is [[TRAPFRAME]] itself. `USYSCALL` is one page (0x1000) lower.
          "0x7fffffd000": |
            You may have used 2^39, the full Sv39 range. xv6 uses one bit less
            ([[kernel/riscv.h:417]]) to avoid sign-extended addresses, so MAXVA is
            0x4000000000.
          "0x3ffffff000": |
            That is [[TRAMPOLINE]], the very top page.
        why_wrong: "0x4000000000 - 0x1000 = 0x3ffffff000 (TRAMPOLINE); minus 0x1000 = 0x3fffffe000 (TRAPFRAME); minus 0x1000 again = 0x3fffffd000."
        explain: |
          Counting down from [[MAXVA]] = 0x4000000000: trampoline, trapframe, usyscall, ushared.
          The test output confirms it: the store fault on the page reports
          `stval=0x3fffffd000`.
      - id: lab10-04
        level: 2
        type: choice
        q: |
          You map the two pages but leave the heap ceiling at [[TRAPFRAME]] in [[growproc]] and
          [[sys_sbrk]]. `usertests lazy_sbrk` grows the heap lazily to `0x3fffffb000`, adds one
          page eagerly with `sbrk(4096)` so that `p->sz` is `0x3fffffc000`, then calls
          `sbrk(1)`. What happens?
        code: kernel/proc.c:236-254
        options:
          - text: "growproc lets it through, uvmalloc tries to map 0x3fffffc000, and mappages panics: mappages: remap."
            correct: true
            why: |
              `sz + 1` is still below [[TRAPFRAME]], so [[uvmalloc]] runs, and [[mappages]] finds
              the shared page's valid PTE there ([[kernel/vm.c:167]]). Clinic 6 shows exactly
              this panic.
          - text: "sbrk(1) returns -1, because uvmalloc notices the page is already mapped and fails cleanly."
            why: |
              You may have expected [[uvmalloc]] to check first, as [[vmfault]] does with
              [[ismapped]]. It does not: it calls [[mappages]], which treats an existing valid
              PTE as a kernel bug and panics.
          - text: "It succeeds, and the process now has a writable heap page at 0x3fffffc000."
            why: |
              That would need [[mappages]] to overwrite the existing PTE. It never does; a
              remap is always a panic in xv6.
          - text: "The process is killed with scause 0xf."
            why: |
              A kill needs a user instruction that faults. Here nothing faults: the kernel
              itself is asked to map a page over an existing mapping, inside the system call.
        explain: |
          Two independent parts of the kernel decide what lives at an address: the code that
          maps fixed pages and the heap's ceiling. Adding a fixed page means lowering the
          ceiling in every place that enforces it, or the two collide. See [[tour:26]] for the
          eager and lazy `sbrk` paths.
  - title: Which bits in the PTE, and what does a store do?
    q: |
      Choose the permission bits for the two new PTEs. Then predict, step by step, what happens
      when a user program executes `*(int *)USYSCALL = 1234;`. Which `scause`? Which kernel
      function is asked to deal with it first, and what must it decide? Could it end up giving
      the process a fresh writable page at that address?
    hints:
      - "Look at the PTE bits in [[kernel/riscv.h:395]]-[[kernel/riscv.h:399]], at how [[uvmalloc]] maps heap pages ([[kernel/vm.c:234]]), and at the fault branch of [[usertrap]] ([[kernel/trap.c:71]])."
      - "On every user access the hardware checks the PTE: `V` and `U` always, then `R` for a load, `W` for a store, `X` for a fetch. A failed store is a store page fault, `scause` 15, whatever the reason. In this tree [[usertrap]] gives every load or store page fault to [[vmfault]] before giving up."
      - "`PTE_R | PTE_U`: no `W`, no `X`. Then read [[vmfault]]'s first two tests ([[kernel/vm.c:463]], [[kernel/vm.c:466]]) with `va = 0x3fffffd000` and the process's `p->sz`."
    answer: |
      The PTEs get `PTE_R | PTE_U` (plus `PTE_V`, which [[mappages]] adds). `U` makes the page
      reachable from user mode, `R` lets loads succeed, and the missing `W` and `X` forbid
      stores and execution. Recorded on the branch, pid 3's page-table entry for
      `USYSCALL` is `0x21fd4413`: physical page `0x87f51`, flags `0x13` = `V|R|U`.

      The store: the hart finds `W` clear and raises a store/AMO page fault, `scause` = 15, with
      `stval` = `0x3fffffd000` and `sepc` at the store. [[uservec]] and [[usertrap]] run as for
      any trap; the fault branch calls [[vmfault]] ([[kernel/trap.c:71]]). Its first test is
      `va >= psz`, and here `va` is `0x3fffffd000` while `p->sz` was `0x5000` in the recorded
      run, so it returns 0 at once. [[usertrap]] prints `unexpected scause 0xf` and kills the
      process.

      Could [[vmfault]] ever allocate a page there? Only if both of its tests passed: the
      address below `p->sz` (impossible once the heap's ceiling is `USHARED`), and the page not
      mapped (never true: the page is always mapped). Either test alone is enough. The ceiling test in `vdsotest` checks the worst case: with `p->sz` at its
      maximum, `0x3fffffc000`, gdb recorded [[vmfault]] declining `va 0x3fffffd000` against
      `psz 0x3fffffc000`, and the child was killed.

      With `PTE_W` left on (clinic 2) the store simply succeeds: any process can rewrite the pid
      that its own library reports, and, worse, the shared page, which every other process
      reads.
    checks:
      - id: lab10-05
        level: 2
        type: bits
        q: |
          gdb read this PTE for `USYSCALL` in `vdsotest`'s page table, after the program had
          called `ugetpid()`. Decode the flag bits.
        value: "0x21fd4453"
        fields:
          - label: "U (bit 4)"
            options: ["0", "1"]
            answer: "1"
            why: "0x53 = 0101 0011: bit 4 (0x10) is set. Without it, every user access would fault (clinic 1)."
          - label: "W (bit 2)"
            options: ["0", "1"]
            answer: "0"
            why: "The low nibble 0x3 is bits 0 and 1 (V, R). W is clear, so a user store faults."
          - label: "A (bit 6)"
            options: ["0", "1"]
            answer: "1"
            why: "0x40 is set. The kernel mapped it as 0x13; the hardware set A when ugetpid loaded from the page, because this tree enables hardware A/D updates (Svadu)."
          - label: "Physical page number (bits 10 and up)"
            options: ["0x87f51", "0x21fd4", "0x3fffffd"]
            answer: "0x87f51"
            why: "Shift right by 10, not 12: 0x21fd4453 >> 10 = 0x87f51, the page at physical address 0x87f51000, which is p->usyscall for this process."
        explain: |
          Flags `0x53` = `V` (1) + `R` (2) + `U` (0x10) + `A` (0x40). The kernel wrote `0x13`;
          the `A` (accessed) bit appeared after the first user load, set by the hardware because
          [[kernel/start.c:41]] turns on hardware A/D updates ([[g:svadu]]). See [[g:pte]].
      - id: lab10-06
        level: 2
        type: choice
        q: |
          `vdsotest`'s child executes `*(volatile int *)USYSCALL = 1234;` with `p->sz` =
          `0x5000`. Which statement describes what the kernel does?
        code: kernel/trap.c:69-79
        options:
          - text: "scause is 15; vmfault returns 0 because 0x3fffffd000 >= p->sz; usertrap prints the message and kills the child."
            correct: true
            why: |
              That is the recorded path: gdb stopped in [[vmfault]] at the `va >= psz` test
              with `va 0x3fffffd000 psz 0x5000`, and the console showed
              `unexpected scause 0xf pid=4`.
          - text: "scause is 13, because the page is read-only and so the access counts as a load fault."
            why: |
              You may have mixed up the page's permission with the access type. The cause
              depends on the access: a store is 15 (store/AMO page fault), a load 13.
          - text: "vmfault allocates a zeroed page at 0x3fffffd000 and the store is retried."
            why: |
              That needs `va < p->sz` and an unmapped page. Both tests fail here: the address
              is far above `p->sz`, and the page is mapped ([[ismapped]]).
          - text: "The kernel panics in walk, because 0x3fffffd000 is an invalid address."
            why: |
              [[walk]] panics only for `va >= MAXVA` (0x4000000000). `0x3fffffd000` is a valid
              user address; it just is not writable.
        explain: |
          The hardware decides *that* the store faults; the kernel decides *what it means*. In
          this tree a store fault first goes to lazy allocation ([[tour:26]]), so [[vmfault]]
          must refuse it. It does, twice over: the address is above `p->sz`, and the page is
          already mapped ([[ismapped]]).
  - title: Who owns the page, and when does it live?
    q: |
      The per-process page needs a physical page and a mapping. Decide when the physical page is
      allocated, when the pid is written into it, when it is mapped, unmapped and freed. Walk
      the life of a process that the shell forks and that then `exec`s a program: does your
      design give the `exec`'d program the page? What happens to the page table `exec` throws
      away?
    hints:
      - "The [[g:trapframe]] is the model: another per-process page at a fixed address near the top of the user address space. Find every line that touches `p->trapframe` or `TRAPFRAME` in `proc.c` and `exec.c`, and note which function each one is in."
      - "Two lifetimes: the physical page must live as long as the process slot is in use (fork to wait), but `exec` builds a whole new page table and discards the old one ([[kernel/exec.c:138]]), and [[freewalk]] panics if a page table still holds a leaf when it is freed ([[kernel/vm.c:276]])."
      - "Allocate the page (and write the pid) next to the trapframe's allocation, free it next to the trapframe's free. Map it in the one function that creates every user page table, so `fork` and `exec` both get it; unmap it, without freeing, in that function's mirror."
    answer: |
      Like the trapframe, the page has two separate lifetimes:

      | | physical page | mapping |
      |---|---|---|
      | created | [[allocproc]], right after the trapframe, which also writes `p->pid` into it | [[proc_pagetable]], after the trapframe's mapping |
      | destroyed | [[freeproc]], next to `kfree(p->trapframe)` | [[proc_freepagetable]], `uvmunmap(..., USYSCALL, 1, 0)`: unmap, do not free |
      | how many | one per process slot in use | one per page table that exists |

      [[proc_pagetable]] is called in two places: by [[allocproc]] for a new process, and by
      [[kexec]] for the new image ([[kernel/exec.c:56]]). Mapping the page there gives both the
      page automatically. During `exec` two page tables map the same physical page for a
      moment; when [[kexec]] commits, [[proc_freepagetable]] removes the mapping from the old one
      ([[kernel/exec.c:138]]). That unmap must not free the page, which the new image is using.
      Recorded on the branch: `sh` (pid 3) built the new table on hart 2 and dropped the old
      one on hart 0, both mapping physical page `0x87f51000`.

      What goes wrong otherwise:

      - Map it somewhere only [[allocproc]] reaches (clinic 5): the first program `exec`'d by
        the shell has no page, and its first `ugetpid()` is a load fault.
      - Forget to unmap it (clinic 3): [[uvmfree]] only removes the pages below `sz`, and
        [[freewalk]] finds a leaf PTE at index 509 and panics with `freewalk: leaf`, at the
        very first `exec`, during boot.
      - Unmap it with `do_free` = 1 (clinic 4): `exec` frees a page the process still maps, and
        [[freeproc]] frees it a second time. The free list is corrupted.
    checks:
      - id: lab10-07
        level: 2
        type: order
        q: |
          The shell forks pid 3, which `exec`s `vdsotest`, which exits and is reaped by the
          shell. Put these events for pid 3's usyscall page in order.
        items:
          - text: "allocproc allocates the page and writes 3 into it"
            why: "Nothing can be mapped before the physical page exists; allocproc runs inside kfork, before the child exists for anyone else."
          - text: "proc_pagetable maps it into the child's first page table"
            why: "allocproc calls proc_pagetable after allocating the page, because the mapping needs its physical address."
          - text: "kexec's call to proc_pagetable maps the same page into the new image's page table"
            why: "exec builds the complete new page table before it commits to it."
          - text: "proc_freepagetable unmaps it from the old page table, without freeing it"
            why: "kexec drops the old page table only after p->pagetable points at the new one (exec.c:133-138)."
          - text: "freeproc, in the shell's wait, frees the page and removes the last mapping"
            why: "Only the parent's wait frees a zombie's resources; an exiting process cannot free the page tables it is still running on."
        why_wrong: "Allocation and the pid come first, then a mapping per page table: the fork's, then exec's new one; exec then drops the old one; freeproc ends the page's life."
        explain: |
          The page belongs to the slot from [[allocproc]] to [[freeproc]]; each page table gets its
          own mapping from [[proc_pagetable]] and loses it in [[proc_freepagetable]]. See
          [[tour:20]] and [[tour:22]] for where those calls sit in `fork` and `exec`.
      - id: lab10-08
        level: 3
        type: choice
        q: |
          You add `uvmunmap(pagetable, USYSCALL, 1, 0)` to [[proc_pagetable]]'s error paths but
          forget it in [[proc_freepagetable]]. When does the kernel first notice?
        code: kernel/vm.c:262-290
        options:
          - text: "During boot: the first process's exec of /init frees its first page table, and freewalk panics with freewalk: leaf."
            correct: true
            why: |
              The first process starts with a page table from [[userinit]]'s [[allocproc]] and
              immediately `exec`s `/init` in [[forkret]]; [[kexec]] frees the old table, and
              [[freewalk]] finds the `USYSCALL` leaf. Clinic 3 recorded exactly that, before
              `init: starting sh`.
          - text: "When the first process exits, because exit frees the page table."
            why: |
              You may have forgotten that `exec` frees a page table too, and that every program
              is started by `exec`. The first free happens long before any exit.
          - text: "Never: uvmfree removes all user pages, including this one."
            why: |
              [[uvmfree]] unmaps only `[0, sz)` ([[kernel/vm.c:288]]); the page is far above
              `sz`. Then [[freewalk]] insists that no leaf remains.
          - text: "Only when the page is freed twice, much later."
            why: |
              That is a different bug (unmapping *with* `do_free`). Here nothing is freed
              twice; the walk refuses to free a table that still maps something.
        explain: |
          [[freewalk]] is a safety net: it frees page-table pages and panics if it finds a valid
          leaf, because that would mean a mapping was forgotten, and the physical page behind it
          would leak or stay reachable. Every page mapped outside `[0, sz)` must be unmapped
          explicitly, which is why [[proc_freepagetable]] lists [[TRAMPOLINE]] and
          [[TRAPFRAME]] by name.
  - title: What do fork and exec give the new image?
    q: |
      After your answer to the previous question, check two cases by reading code, not by
      assumption. A forked child must see *its* pid, not its parent's: is there any way the
      parent's page, or its contents, could end up in the child? And after `exec`, could the new
      image see a stale value?
    hints:
      - "Read [[kfork]] ([[kernel/proc.c:258]]) and the loop in [[uvmcopy]] ([[kernel/vm.c:299]]): which virtual addresses does it copy?"
      - "[[uvmcopy]] copies the pages in `[0, sz)` only. Everything above `sz` in the child's page table was put there by [[proc_pagetable]] when [[allocproc]] built it."
      - "The child's page is new and was filled in by [[allocproc]] with the child's pid. `exec` keeps the same `struct proc` and therefore the same page and the same pid."
    answer: |
      [[kfork]] calls [[allocproc]] first, which allocates a fresh page and writes the child's
      pid into it (gdb recorded pid 3's page at `0x87f51000` while the shell, pid 2, had
      `0x87f52000`), then maps it in the child's new page table. [[uvmcopy]] copies only
      `[0, p->sz)` ([[kernel/proc.c:271]]), far below `USYSCALL`, so the parent's page is never
      copied or shared. That is also why the mapping must not be made by copying the parent's
      PTE: the child would then read the parent's pid.

      `exec` does not create a process; [[kexec]] reuses `p`, so `p->usyscall` and the pid in it
      are unchanged, and the new page table maps the same page. `vdsotest`'s fork and exec
      checks confirm both: the child, and a child that `exec`s `vdsotest exec`, compare
      `ugetpid()` with `getpid()` and exit 0.

      The shared page is the opposite case on purpose: every page table maps the *same*
      physical page, so a forked child and its parent read the same `ticks`.
    checks:
      - id: lab10-09
        level: 2
        type: tf
        q: |
          True or false: in the reference design, [[uvmcopy]] copies the parent's usyscall page
          into the child, and [[kfork]] then overwrites the pid in the copy.
        answer: false
        why_tf: |
          You may have assumed that fork copies the whole address space. It copies `[0, sz)`;
          the pages above, like the trapframe, are created per process.
        reasons:
          - text: "The child's page is a new page from allocproc, mapped by proc_pagetable; uvmcopy never sees addresses above p->sz."
            correct: true
            why: |
              Right. The child's pid is written in [[allocproc]] before [[uvmcopy]] runs at all.
          - text: "uvmcopy skips the page because it has no PTE_W."
            why: |
              You may be thinking of copy-on-write designs. [[uvmcopy]] in this tree copies
              read-only pages too (text has no `W`); it skips this page because of its address,
              not its flags.
          - text: "uvmcopy skips the page because it is unmapped in the parent."
            why: |
              The page is mapped in the parent. [[uvmcopy]] never reaches it because its loop
              stops at `sz`.
        explain: |
          The address space has two parts: `[0, sz)`, which is the program's memory and is
          copied by `fork` and replaced by `exec`, and the fixed pages at the top, which
          [[proc_pagetable]] creates for every page table. See [[tour:25]].
  - title: The kernel reads and writes user memory too
    q: |
      Your pages are mapped and read-only. Now a program passes their address to a system call:
      `read(fd, (char *)USYSCALL, 8)` asks the kernel to write the page, and
      `write(fd, (char *)USHARED, 8)` asks it to read it. The kernel does not use the user's PTE
      the way the hardware does. What happens to each call? Is either result a problem? Run
      `usertests -q` at this point if you have built that far.
    hints:
      - "The kernel copies with [[copyout]] and [[copyin]]. Both translate the user address with [[walkaddr]] ([[kernel/vm.c:122]]) and then use `memmove` on a physical address, through the kernel's [[g:direct-map]] of RAM."
      - "[[walkaddr]] checks only `PTE_V` and `PTE_U`. [[copyout]] adds a software check for `PTE_W` ([[kernel/vm.c:364]]); [[copyin]] adds nothing. Now read `usertests lazy_copy` ([[user/usertests.c:2712]]-[[user/usertests.c:2738]]), and look at which addresses it lists."
      - "Find the rule xv6 already applies to user pointers in other places (how does the kernel decide whether an address is part of the process's memory?), and make the copy routines that read user memory apply it too."
    answer: |
      `read` into `USYSCALL` fails: [[copyout]] finds the page through [[walkaddr]], then sees
      that `PTE_W` is clear and returns -1. Good.

      `write` from `USHARED` succeeds: [[copyin]] finds a valid `PTE_U` page and copies from it.
      Reading a read-only page is not dangerous in itself, but it changes behaviour that a test
      relies on. `usertests lazy_copy` lists `0x3fffffc000` and `0x3fffffd000` among
      addresses that `read` and `write` must reject, because nothing used to be mapped there.
      With the pages mapped, the test fails, from commit 3 on (recorded at commit 4):

      ```text
      $ usertests lazy_copy
      usertests starting
      test lazy_copy: write succeeded
      FAILED
      SOME TESTS FAILED
      ```

      The fix states a rule the kernel already half-follows: a system call may only touch the
      process's memory, below `p->sz`. [[fetchaddr]] enforces it byte by byte and [[vmfault]]
      for faults; the reference adds `if (va0 >= psz) return -1;` to [[copyin]] and
      [[copyinstr]]. That test is page-granular: it refuses pages that start at or above
      `p->sz` (below `PGROUNDUP(p->sz)` everything is as before, including the bytes between
      `sz` and the end of its page). [[copyout]] needs no
      change because its `PTE_W` test already refuses both pages. Every caller of [[copyin]]
      passes the calling process's own `sz` (even [[pipewrite]], which names it `pr`,
      [[kernel/pipe.c:96]]), so nothing below `sz` is affected.

      (Linux makes the opposite choice: its vDSO pages may be passed to `write`. Either is
      consistent; this tree's tests encode the stricter one.)
    checks:
      - id: lab10-10
        level: 2
        type: match
        q: |
          Before the [[copyin]] fix, match each access to the new pages with what happens.
        pairs:
          - left: "a user store to USYSCALL"
            right: "store page fault; vmfault declines; the process is killed"
            why: "The hardware checks PTE_W on a user store. Only the kernel's own copies bypass that check."
          - left: "read(fd, USYSCALL, 8)"
            right: "copyout sees no PTE_W and returns -1"
            why: "copyout writes through the direct map, so nothing faults; its software test of PTE_W is what refuses."
          - left: "write(fd, USHARED, 8)"
            right: "copyin copies 8 bytes; write returns 8"
            why: "copyin asks walkaddr only for V and U, both present. That is what usertests lazy_copy catches."
          - left: "a user load from USHARED"
            right: "succeeds: the hardware finds V, R and U"
            why: "That is the point of the page: a load needs R and U, nothing more."
        explain: |
          Two different checkers look at the same PTE: the hardware on user accesses, and the
          kernel's own code in [[copyin]] and [[copyout]], which access memory through the
          kernel page table. A design has to be right for both. See [[tour:28]].
  - title: One page for everyone, read with no lock
    q: |
      `uptime()` returns `ticks`, which [[clockintr]] increments on hart 0 under `tickslock`, and
      [[sys_uptime]] reads under the same lock. For `uuptime()` the kernel copies `ticks` into
      one page shared by all processes, and user code reads it with no lock at all (it could
      not take a kernel spinlock anyway). Where does the page come from, and who may free it?
      Then the hard part: on three harts, can a reader see a value that was never written? Can
      the compiler or the hardware make the read return something stale forever?
    hints:
      - "Read [[clockintr]] ([[kernel/trap.c:166]]-[[kernel/trap.c:180]]) and [[sys_uptime]]. Who writes `ticks`, on which hart, under which lock? Look at the concept page on [[concept:locks#unlocked|shared data with no lock]]."
      - "A RISC-V load or store of a naturally aligned 32-bit word is single-copy atomic: another hart sees the whole old value or the whole new one. But a compiler may keep a value it has already loaded in a register, unless the access is `volatile` (or atomic). And two separate words can be seen in any mix of old and new."
      - "Allocate one page at boot (after the allocator exists, before the first process), never free it, map it in every user page table, and in [[clockintr]] store the new `ticks` into it inside the existing critical section. Read it in user code through a `volatile` pointer."
    answer: |
      **The page.** [[trapinit]] runs on hart 0 during boot, after [[kinit]] and before
      [[userinit]]; the reference allocates the page there with [[kalloc]] and zeroes it
      (recorded: `0x87f59000`). Every user page table maps that same physical page at `USHARED`.
      Nobody owns it, so nobody frees it: [[proc_freepagetable]] unmaps it with `do_free` = 0.
      Freeing it when one process exits would put a page on the free list that every other
      process still maps and that [[clockintr]] still writes, ten times a second.

      **The write.** [[clockintr]] adds `ushared->ticks = ticks;` right after `ticks++`, inside
      `tickslock`. The lock is not needed against readers (they take none), but [[clockintr]]
      already holds it and there is only one writer, hart 0. In this build the store is one
      `sw a5,0(a4)` at `0x8000267c`.

      **The read.** `uuptime()` compiles to one `lw`. RVWMO makes an aligned 32-bit load or
      store single-copy atomic, so a reader on hart 1 sees either the old count or the new
      one, never two halves. Staleness is bounded too: the store becomes visible to other harts
      in finite time, and each call of `uuptime()` loads again because the pointer is
      `volatile`. Without `volatile`, a loop like `while (uuptime() == t0)` may be compiled
      into one load followed by an endless loop (here `uuptime` is a separate function in
      `ulib.c`, which hides the problem; inline it and it may appear). The strictly portable C
      would use `__atomic_store_n` and `__atomic_load_n` with `__ATOMIC_RELAXED`.

      **When this is not enough.** A single value is consistent by itself. Two values that must
      agree (ticks and a timestamp of the last tick, or a 64-bit counter written as two 32-bit
      halves) can be read half-updated. That needs a sequence counter: the writer increments it
      before and after the update, and the reader retries if it saw an odd value or a change.
      That is how the Linux vDSO publishes the time.

      **Ordering against uptime().** `vdsotest` checks `uptime() <= uuptime() <= uptime()`.
      [[clockintr]] stores the copy before [[release]], whose `fence rw,w` publishes it with
      `ticks`; a later [[sys_uptime]] acquires `tickslock` after that release, so the first
      `uptime()` is never ahead of the copy. Conversely, a value the reader saw was stored inside
      a critical section, and the following [[sys_uptime]] acquires the lock after that
      section's release, so the second `uptime()` is never behind it. The check passed in every
      recorded run.
    checks:
      - id: lab10-11
        level: 2
        type: multi
        q: |
          `uuptime()` reads the shared page with no lock while [[clockintr]] on hart 0 writes it.
          Which statements are true for this tree on RISC-V?
        options:
          - text: "A reader can never see half of an old value and half of a new one."
            correct: true
            why: |
              `ticks` is a naturally aligned 32-bit word, written by one `sw` and read by one
              `lw`; RVWMO makes such accesses single-copy atomic.
          - text: "Without volatile, the compiler may reuse a value it loaded earlier, so a waiting loop could spin forever."
            correct: true
            why: |
              Nothing in the C code tells the compiler that memory at `USHARED` changes, so it
              may keep the first load in a register. `volatile` forces a load on every read.
          - text: "Readers must take tickslock, or they could read a value that was never written."
            why: |
              You may be applying the rule "shared data needs a lock" mechanically. A lock is
              needed to keep several updates consistent or to make read-modify-write atomic.
              Here there is one writer and one word, and the readers only read.
          - text: "If the page also held the time of the last tick, a reader could pair a new ticks with an old time."
            correct: true
            why: |
              Two separate words are not updated atomically together. That is when a sequence
              counter (or a lock) becomes necessary.
          - text: "The hardware may tear the load into two 16-bit halves when another hart writes at the same moment."
            why: |
              You may be thinking of misaligned or multi-word accesses. An aligned 32-bit `lw`
              on RISC-V is one single-copy-atomic access.
        explain: |
          Correctness without a lock rests on three facts here: one writer, one aligned word, and
          a `volatile` read. Change any of them (two writers doing `++`, two words, a packed
          struct) and you need a lock or atomics. See [[concept:locks#unlocked]] and
          [[tour:19]].
      - id: lab10-12
        level: 1
        type: choice
        q: |
          [[proc_freepagetable]] unmaps the shared page. Which `do_free` argument is right, and
          why?
        options:
          - text: "0: the page is mapped by every process and written by clockintr; it must never return to the free list."
            correct: true
            why: |
              Right. It is allocated once in [[trapinit]] and lives until the machine stops.
          - text: "1: the last process to exit should free it."
            why: |
              You may be thinking of reference counting. Nothing counts the mappings, so the
              very first [[proc_freepagetable]] (init's `exec` of `/init`, during boot) would
              free it, and the page always has a user: [[clockintr]].
          - text: "1, because uvmunmap ignores do_free for pages that other page tables map."
            why: |
              [[uvmunmap]] knows nothing about other page tables. With `do_free` = 1 it calls
              [[kfree]] on whatever physical page the PTE names.
          - text: "It does not matter: kfree refuses pages that are still mapped."
            why: |
              [[kfree]] only checks alignment and range ([[kernel/kalloc.c:51]]). It cannot know
              whether any page table still maps the page.
        explain: |
          Shared and per-process pages differ in exactly this: a per-process page dies with its
          owner, a shared page with nobody. Clinic 4 shows how a page freed while still mapped
          corrupts the allocator's free list.
  - title: How do you measure the difference?
    q: |
      You want numbers: how long one `getpid()` takes versus one `ugetpid()`. The best clock is
      the `time` CSR, which [[clockintr]] reads with `rdtime`. Can a user program execute
      `rdtime` in this tree? If not, what clock can you use from user mode, and how many calls
      must you make for the answer to be meaningful?
    hints:
      - "Read [[timerinit]] ([[kernel/start.c:56]]-[[kernel/start.c:66]]): which counter-enable register is written, and for which mode? Is any other one written anywhere?"
      - "Each privilege mode needs its own permission: `mcounteren` lets S-mode read the counters, `scounteren` lets U-mode. A disallowed `rdtime` is an illegal instruction, `scause` 2."
      - "Use ticks. A tick is about 0.1 s (`1000000` counts of the `time` CSR, which runs at 10 MHz on QEMU's virt machine), so count how many calls fit into, say, 20 ticks, and read the clock with `uuptime()` so that the timing loop itself makes no system call."
    answer: |
      No. [[timerinit]] sets bit 1 (`TM`) of [[g:csr-mcounteren]] so that S-mode may read `time`
      ([[kernel/start.c:62]]), but nothing writes `scounteren`, so U-mode may not. `vdsotest
      time` checks it: its child executes `rdtime` and is killed with `scause 0x2` (illegal
      instruction) and `stval=0xc01027f3`, the instruction's own encoding (`rdtime a5`).

      So the measurement counts calls per tick: 1,000 calls at a time until `uuptime()` has
      advanced 20 ticks (about 2 seconds). Results from a recorded run on 3 harts:
      `getpid()` 175,000 calls (about 11,400 ns each), `ugetpid()` 88,831,000 calls (about
      22 ns each). The resolution is one tick in 20, 5%, plenty for a 500-fold difference.

      These are QEMU numbers. Counting instructions per iteration of the timing loop (the
      loop's own `jalr`, `addiw`, `bnez` included): 1,109 for `getpid` against 15 for
      `ugetpid`, a factor of about 74. The remaining factor of about 7 is time per
      instruction: QEMU spends far longer per instruction on the kernel path. Translation-cache
      flushes are a large share of that: an experiment that removed the four
      `sfence.vma` from the trampoline (an experiment only; real hardware needs them) cut
      `getpid` by about a third, from about 11,700-12,300 ns to about 7,900-8,200 ns, with
      `ugetpid` unchanged. We did not measure the rest. Real hardware has different ratios,
      but a trap with two page-table switches is expensive everywhere.
    checks:
      - id: lab10-13
        level: 2
        type: choice
        q: |
          A user program on this kernel executes `rdtime a5` (as `vdsotest time`'s probe does). What happens?
        code: kernel/start.c:54-66
        options:
          - text: "An illegal-instruction exception (scause 2); usertrap kills the process."
            correct: true
            why: |
              U-mode access to `time` needs `scounteren.TM`, which nobody sets. Recorded:
              `usertrap(): unexpected scause 0x2` with `stval=0xc01027f3`, the encoding of
              `rdtime a5`.
          - text: "It reads the time, because mcounteren.TM is set in start.c."
            why: |
              You may have read `mcounteren` as "counters for everyone". It grants access to
              the next lower mode, S. U-mode needs S-mode's `scounteren` as well.
          - text: "It traps to the kernel, which emulates the instruction and returns the time."
            why: |
              Some kernels do emulate such instructions; xv6 does not. Its [[usertrap]] kills
              the process for any cause it does not recognize.
          - text: "It returns 0, because the counter is disabled."
            why: |
              A disabled counter is not read as 0; the access itself is illegal and raises an
              exception.
        explain: |
          Counter access is delegated mode by mode: M-mode's `mcounteren` decides what S-mode may
          read, S-mode's `scounteren` what U-mode may read. Setting `scounteren.TM` would let
          user code time itself precisely, and a real vDSO uses exactly that for
          `clock_gettime`. See [[g:csr-time]].
build: |
  **Start.**

  ```text
  git checkout -b my-vdso 06aad25
  ```

  Write the test first: copy the spec's checks into `user/vdsotest.c` and add
  `$U/_vdsotest\` to `UPROGS` in the `Makefile`. Until the library functions exist it will not
  link; that is fine, it tells you what to build.

  **Milestones, in an order that keeps the system bootable after each one.**

  1. **The layout.** `USYSCALL`, `USHARED`, the two structs and the heap's new ceiling in
     `kernel/memlayout.h`; use the ceiling in [[growproc]] and [[sys_sbrk]]; update the one
     expected value in `usertests lazy_sbrk`. Guard the structs with `#ifndef __ASSEMBLER__`:
     `trampoline.S` includes `memlayout.h`. Test: `usertests -q`.
  2. **The physical page.** A `struct usyscall *usyscall` field in `struct proc`; allocate,
     zero and fill it in [[allocproc]], free it in [[freeproc]]. Test: `usertests -q` (the page
     exists but nothing maps it; a leak would show in the free-page checks).
  3. **The mapping.** Map it read-only in the function that builds user page tables, unmap it
     in the one that frees them, and undo it in the error path. Test: boot. If the kernel
     panics before the shell prompt, read clinic 3. From here until milestone 5, `usertests
     -q` fails at `lazy_copy` (`write succeeded`); that is expected.
  4. **The shared page.** Allocate it in [[trapinit]], update it in [[clockintr]], map and
     unmap it like the per-process page (but never free it).
  5. **The kernel's copies.** Run `usertests -q`: `lazy_copy` fails with `write succeeded`.
     Make [[copyin]] and [[copyinstr]] refuse addresses at or above `psz`. Test: `usertests -q`.
  6. **The library and the test.** `ugetpid` and `uuptime` in `user/ulib.c`, prototypes in
     `user/user.h`. Test: `vdsotest`, then `usertests -q`, then `vdsotest` again.

  **Debugging advice.** To catch anything during boot (clinic 3 panics before the shell
  starts), start QEMU halted with `make qemu-gdb` (it adds `-S` and a gdb port of its own,
  which it writes into `.gdbinit`), run `${TOOLPREFIX}gdb kernel/kernel` in another
  terminal, and set breakpoints before the first `continue`. `TOOLPREFIX` is your RISC-V
  toolchain's prefix, the same one xv6's Makefile detects (`riscv64-unknown-elf-`,
  `riscv64-linux-gnu-` or `riscv64-elf-`); set it with `export
  TOOLPREFIX=riscv64-unknown-elf-` or whichever you have. On Debian/Ubuntu/WSL,
  `gdb-multiarch` also works as the debugger.

  - `usertrap(): unexpected scause 0xd ... stval=0x3fffffd000` at the first `ugetpid()`: the
    load faulted. Print the PTE. From a kernel breakpoint (for example on [[setkilled]]), walk
    `myproc()->pagetable` for `0x3fffffd000` by hand: indices 255, 511 and 509 at levels 2, 1
    and 0, each PTE's physical page number shifted left by 12 to reach the next table (the
    kernel's direct map lets gdb read those physical addresses directly). No PTE means the page was not mapped in *this* page table (was it
    `exec`'d?); a PTE without `0x10` means `PTE_U` is missing.
  - `panic: freewalk: leaf` while booting: some page above `sz` is still mapped when a page
    table is freed. `bt` shows which free ([[kexec]] or [[freeproc]]); `p i` in the innermost
    [[freewalk]] frame gives the index, 509 for `USYSCALL`, 508 for `USHARED`.
  - `panic: mappages: remap` from [[growproc]]: the heap reached the new pages.
  - Strange pids or a crash in [[kalloc]]: a page was freed while still mapped, or twice.
    Break on [[kfree]] with the condition `pa == <the page's address>` and look at each `bt`.
  - To see user code from gdb, set breakpoints on user addresses from `user/vdsotest.asm`
