    symptom: |
      # one boot:
      $ vdsotest
      [...]
      vdsotest: pid unchanged: OK
      vdsotest: heap ceiling: FAIL
      vdsotest: fork: OK
      vdsotest: exec: OK
      vdsotest: 20 children: OK
      vdsotest: SOME TESTS FAILED
      $ usertests lazy_sbrk
      usertests starting
      test lazy_sbrk: panic: mappages: remap

      # a second boot, gdb attached, breakpoint on panic, `usertests lazy_sbrk`:
      #0  panic (s=s@entry=0x80007108 "mappages: remap") at kernel/printk.c:139
      #1  0x00000000800010ac in mappages (pagetable=pagetable@entry=0x80023000, va=va@entry=274877890560, size=size@entry=4096, pa=<optimized out>, pa@entry=2147725312, perm=perm@entry=22) at kernel/vm.c:167
      #2  0x0000000080001302 in uvmalloc (pagetable=0x80023000, oldsz=274877890560, newsz=274877890561, xperm=xperm@entry=4) at kernel/vm.c:234
      #3  0x0000000080001d4a in growproc (n=1) at kernel/proc.c:281
      #4  0x0000000080002b28 in sys_sbrk () at kernel/sysproc.c:51
      #5  0x0000000080002a2e in syscall () at kernel/syscall.c:146
      #6  0x00000000800027b4 in usertrap () at kernel/trap.c:74
      [...]

      # two more boots with a probe program (ceilprobe, not on the branch) whose children
      # grow p->sz lazily to 0x3fffffe000, over both new pages:
      $ ceilprobe store
      ceilprobe: sz 0x0000003FFFFFE000, storing to USYSCALL
      usertrap(): unexpected scause 0xf pid=4
                  sepc=0x9e stval=0x3fffffd000
      ceilprobe: store child status -1
      ceilprobe: sz 0x0000003FFFFFE000, write(USHARED) returns 8
      $
      [...]
      $ ceilprobe shrink
      ceilprobe: sz 0x0000003FFFFFE000, sbrk(-8192)
      usertrap(): unexpected scause 0xd pid=4
                  sepc=0x490 stval=0x3fffffc000
      ceilprobe: shrink child status -1, uuptime 3
      $ ceilprobe store
      usertrap(): unexpected scause 0xf pid=5
                  sepc=0xa70 stval=0x0
      $ vdsotest
      usertrap(): unexpected scause 0xf pid=6
                  sepc=0xa70 stval=0x0
    why: |
      `vdsotest heap ceiling` notices first, without any damage: its child's `sbrklazy(1)` beyond
      `0x3fffffc000` succeeds, so by the code the child exits with status 3 instead of being
      killed, and `p->sz` now covers the shared page.

      `usertests lazy_sbrk` turns the same hole into a panic. It grows the heap lazily up to
      `MAXHEAP - PGSIZE`, maps the last page eagerly with `sbrk(4096)`, and then asks for one
      byte more, expecting -1. [[growproc]] compares with the old ceiling, so it calls
      [[uvmalloc]] from `oldsz` = `274877890560` = `0x3fffffc000`: the address of `USHARED`.
      [[mappages]] finds the shared page's PTE there and panics ([[kernel/vm.c:167]]).

      The probe runs show what the ceiling really protects. A store to `USYSCALL` with `p->sz`
      covering it is still killed: [[vmfault]] declines because [[ismapped]] finds the page.
      But [[copyin]]'s new test is bypassed, so `write` from `USHARED` returns 8. And
      `sbrk(-8192)` from `0x3fffffe000` makes [[uvmdealloc]] unmap both pages with `do_free` =
      1: the child's next `uuptime()` faults on the now-unmapped `0x3fffffc000`, and the shared
      page, which every other process still maps and [[clockintr]] still writes, is on the
      free list. From then on every new program died at once (`scause 0xf`, `stval=0x0`), even
      `vdsotest`. We did not trace that last failure further; a shared page freed while in use
      is enough to explain a broken system.
reveal:
  - title: Two new pages at the top of the address space
    commit: 1
    file: kernel/memlayout.h
    lines: 46-82
    focus: 54-70
    diff: true
    state:
      hart: any
      proc: "(definitions: used by the kernel and, through ulib.c, by user programs)"
      locks: []
    note: |
      The story of this tour: the machine boots on three harts, you type `vdsotest`, the shell
      (pid 2) forks pid 3, which `exec`s `vdsotest`; `vdsotest` forks children that read their
      pid, store to the pages and are killed, and are reaped. The states come from gdb runs on
      the finished branch (`ext/10-vdso`, 8 commits), started halted with breakpoints set first.

      Commit 1 is a contract. User code must find the pages without asking, so their addresses
      are compile-time constants that both the kernel and `user/ulib.c` include. Counting down
      from [[MAXVA]] (`0x4000000000`):

      | address | page | `PTE_U` |
      |---|---|---|
      | `0x3ffffff000` | [[TRAMPOLINE]] | no |
      | `0x3fffffe000` | [[TRAPFRAME]] | no |
      | `0x3fffffd000` | `USYSCALL`, this process's pid | yes, read-only |
      | `0x3fffffc000` | `USHARED`, the tick count, one page for all | yes, read-only |

      `MAXHEAP` names the heap's new ceiling. The structs are what the pages contain; the
      `#ifndef __ASSEMBLER__` guard matters because [[kernel/trampoline.S:14]] includes this
      header and the assembler does not understand C structs (GCC defines `__ASSEMBLER__` for
      `.S` files).
  - title: The heap stops below the new pages
    commit: 1
    file: kernel/sysproc.c
    lines: 39-65
    focus: 54-63
    diff: true
    state:
      hart: any
      mode: S
      proc: vdsotest (the heap-ceiling child)
      intr: "on"
      satp: kernel
      locks: []
      irq: 0
      stack: [usertrap, syscall, sys_sbrk]
      sp: {"on": kernel, detail: "the child's kernel stack, with only these three frames"}
    note: |
      Two places enforce the heap's ceiling: the lazy branch here, and [[growproc]] for eager
      growth and shrinking ([[kernel/proc.c:243]], changed the same way). Before this commit the
      heap could grow to [[TRAPFRAME]]; now it stops at `MAXHEAP` = `USHARED`.

      If `p->sz` could cover the new pages, three things would break (clinic 6): [[uvmalloc]]
      would try to map over them (`panic: mappages: remap`), `sbrk(-n)` would unmap and free
      them, the shared page included, and the kernel's own reads, which commit 5 limits to the
      process's memory below `p->sz`, would accept them. User stores are not among the three:
      [[vmfault]]'s [[ismapped]] test refuses those even without the ceiling.

      The state is reasoned from the code, not recorded: `vdsotest`'s ceiling check runs in a
      child that calls `sbrklazy` in 1 GiB steps until `p->sz` is exactly `0x3fffffc000`, then
      `sbrklazy(1)`, which line 60 refuses. A system call runs with interrupts on (after
      [[usertrap]]'s `intr_on`) and no lock held: `p->sz` is private to the running process.
