measure: |
  **Time per call**, from `vdsotest time` on 3 harts (QEMU 10.2.1; a tick is about 0.1 s,
  20 ticks per measurement; times on QEMU depend on the computer and on what else it is
  doing, so yours will differ):

  | | calls in 20 ticks | about | ratio |
  |---|---|---|---|
  | `getpid()` | 175,000 | 11,428 ns | |
  | `ugetpid()` | 88,831,000 | 22 ns | 508× |
  | `uptime()` | 169,000 | 11,834 ns | |
  | `uuptime()` | 89,029,000 | 22 ns | 527× |

  Two earlier runs gave 174,000 / 168,000 `getpid()` and 89,731,000 / 87,894,000 `ugetpid()`
  calls: the numbers are stable to a few percent.

  **Instructions per call**, single-stepped with gdb (QEMU's single-step with interrupts
  masked, one hart locked):

  | | user mode | kernel and trampoline | `csrw satp` | `sfence.vma` |
  |---|---|---|---|---|
  | `ugetpid()` | 12 | 0 | 0 | 0 |
  | `getpid()` | 3 (`li a7,11`, `ecall`, `ret`) | 1,103 (first instruction of [[uservec]] to `sret`) | 2 | 4 |

  Where the 1,103 go: 83 in the trampoline ([[uservec]] 44, [[userret]] 39), 392 in
  [[mycpu]], 144 in [[push_off]], 118 in [[pop_off]], 84 in [[myproc]], 86 in [[acquire]] and
  [[holding]], 34 in [[release]], 38 in [[killed]], 43 in [[usertrap]], 42 in
  [[prepare_return]], 29 in [[syscall]] and 10 in [[sys_getpid]]. Most of the cost is
  bookkeeping around the trap: finding the current process four times and checking `killed`
  twice, each under `p->lock`. The answer itself is one load in both cases.

  **Instructions against time.** The timing loop adds 3 instructions per call (`jalr s2`,
  `addiw`, `bnez` at `0x53c`-`0x540` in `user/vdsotest.asm`), so one iteration is 1,109
  instructions with `getpid` (3 + 3 + 1,103) and 15 with `ugetpid` (3 + 12): a factor of about
  74. The measured factor is about 508, so each instruction on the `getpid` path costs about 7
  times as much time. A run with the four `sfence.vma` removed from `trampoline.S`
  (not valid on hardware; on QEMU the `satp` writes still flush): `getpid` went from 11,695 and
  12,269 ns to 8,230 and 7,874 ns, `ugetpid` stayed at 21-24 ns. Translation-cache flushes are
  therefore a large share of the extra time per instruction; the rest was not measured.

  **Memory.** One page per process (the usyscall page, allocated next to the trapframe) and one
  page in total for `USHARED`. Two pages of user virtual address space are taken from the top
  of the heap's range.
further: |
  - **A real vDSO clock.** Set `scounteren.TM` in the kernel so that user code may execute
    `rdtime`, and publish in the shared page what is needed to convert `time` to seconds. Then
    `uuptime` can report fractions of a tick. You will need two values that must agree, and so
    a sequence counter; it teaches the reader-retry protocol that Linux uses.
  - **More per-process facts.** Publish the parent's pid, or a per-process count of system
    calls that the kernel updates on every trap. Which of them need `volatile`, which need
    ordering, and which can only be written by the process's own hart?
  - **Map code, not just data.** Put a small function in a page shared by all processes,
    mapped `R|X|U`, and let user programs call it at a fixed address. This is what a real vDSO
    is: an ELF image the kernel maps into every process. It teaches position-independent code
    and why the kernel must never let that page be writable.
  - **Measure on real hardware.** Run the branch on a RISC-V board and compare the
    `getpid` / `ugetpid` ratio with QEMU's. The instruction counts stay the same; the cost of a
    trap and of `sfence.vma` will not.
