      pages deliberately lack it; only S-mode code on the trampoline uses them). `R`: loads
      succeed. No `W`: a user store faults (`scause` 15), [[vmfault]] declines because the
      address is above `p->sz`, and the process is killed. No `X`: the page cannot be executed.

      The error path unmaps what was mapped before, in reverse order, then frees the page-table
      pages with `uvmfree(pagetable, 0)`. It does not free the usyscall page: when [[proc_pagetable]]
      returns 0, [[allocproc]] calls [[freeproc]] (line 147), which frees it with everything
      else.
    others: |
