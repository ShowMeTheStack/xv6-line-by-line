      stack: [usertrap, syscall, sys_trace]
      sp: kernel
      irq: 0
    note: |
      The mask is state of one process, so it lives in `struct proc`. The struct is divided
      by lock: fields that other processes or interrupt handlers read or write (`state`,
      `chan`, `killed`, `xstate`, `pid`) need `p->lock`; `parent` needs `wait_lock`; the rest
      are "private to the process": only the process itself uses them, so no lock is needed.

      `tracemask` goes in the private section, next to `name`. Only two pieces of code ever
      touch a process's own mask, `sys_trace` and `syscall()`, and both run *as* that
      process. An xv6 process has one thread and runs on at most one hart at a time, so
      there is never a second party. The exceptions are `kfork` (which writes a child's
      mask before the child can run) and [[freeproc]] (which clears it, under `p->lock`,
      when the process is gone), both coming up.

      The state shown is for the moment `sys_trace` uses the field, two steps from now.
