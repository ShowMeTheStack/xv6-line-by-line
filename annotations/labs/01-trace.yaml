published: true
title: "trace: logging system calls"
area: The system-call and trap path
stars: 1
branch: ext/01-trace
prerequisites: {tours: [5, 6, 20, 22, 38], concepts: [stacks, locks]}
summary: |
  You add a new system call, `trace(mask)`, and a command, `trace MASK command args...`.
  While a process's mask has bit *i* set, the kernel prints one line each time system call
  number *i* returns: `3: syscall read -> 1023`. Children made by `fork` inherit the mask, and
  `exec` keeps it, so `trace 32 grep hello README` shows every `read` that `grep` makes.

  The feature is small (about fifty lines of kernel code, half of them a table of names), but building it walks you through
  every layer a system call crosses, from the three-instruction user stub to the
  [[g:trapframe]] and back. You will see every place a new system call must be registered and
  why each one exists, where per-process state lives and what `fork` copies under which lock,
  and why the only place that can print the return value is right after the call in
  [[syscall]]. On three [[g:hart|harts]], you will also see that `printk`'s lock keeps trace
  lines whole with respect to each other, but not with respect to a user program's output.
learn:
  - "The full path of a system call: the [[g:syscall-stub]] puts the number in `a7`, `ecall` traps, [[uservec]] saves every register in the trapframe, [[usertrap]] calls [[syscall]], which indexes `syscalls[]`, and the return value travels back to user space through the saved `a0`."
  - "Every place a new system call must be registered (the number, the stub generator, the user prototype, the kernel table and its prototype) and what breaks, at compile time, link time or run time, when one is missing."
  - "Where per-process state lives in `struct proc`, which fields need `p->lock` and which are private to the process, and what [[kfork]] copies while it holds the child's lock."
  - "Why a forked child never passes through [[syscall]] on its way back from `fork`, and why a successful `exit` never returns to it."
  - "What `pr.lock` in [[printk]] guarantees on three harts (whole lines among kernel messages) and what it does not (it does not exclude user output written through [[uartwrite]])."
  - "How [[argint]] reads an integer argument from the trapframe, and why pointer arguments need [[copyin]] instead."
spec: |
  **The system call.** `int trace(int mask)` sets the calling process's trace mask and
  returns the previous mask. Bit *i* of the mask enables tracing of system call number *i*
  (the numbers in [[kernel/syscall.h]]; `trace` itself gets number 23). It never fails.

  **What gets printed.** When a traced system call returns to the process, the kernel prints
  one line on the console:

  ```text
  <pid>: syscall <name> -> <return value>
  ```

  The value is printed as a signed 64-bit number, so a failure shows as `-1`. A system call
  that never returns (a successful `exit`) prints nothing.

  **Inheritance.** A child created by `fork` starts with its parent's mask. `exec` keeps the
  mask. A child changing its own mask does not change its parent's.

  **The command.** `trace MASK command args...` sets the mask, then execs the command:

  ```text
  $ trace 32 grep hello README
  3: syscall read -> 1023
  3: syscall read -> 965
  3: syscall read -> 453
  3: syscall read -> 0
  ```

  (32 is `1 << 5`, and `SYS_read` is 5. `2147483647` sets every bit up to 30 and traces
  everything.)

  **The test.** `tracetest` checks, and prints `OK` or `FAIL` for each: that `trace` returns
  the previous mask, that `fork` copies the mask to the child, that a child's change leaves
  the parent alone, and that `exec` keeps the mask. A program cannot read the console, so the
  printing itself is checked by eye: between a `begin` and an `end` marker only `getpid` is
  traced, the parent and a child each call `getpid` once (plus untraced `uptime`, `fork` and
  `wait` calls, and the child's `exit`; the markers themselves are printed outside that
  window), and the test then prints the two lines that should have
  appeared:

  ```text
  tracetest: begin
  3: syscall getpid -> 3
  6: syscall getpid -> 6
  tracetest: end
  tracetest: expected between the markers, and nothing else:
  3: syscall getpid -> 3
  6: syscall getpid -> 6
  tracetest: 4 checks OK; now compare the lines between the markers by eye
  ```

  The last line deliberately does not claim the printing is right: only your comparison
  can say that.

  **Constraints.** Untraced processes must behave exactly as before, and `usertests -q` must
  still print `ALL TESTS PASSED` on three harts. Do not change any existing system call's
  number.
think:
  - title: Where must a new system call be registered?
    q: |
      List every file you must touch before a user program can call `trace(32)` and reach a
      kernel function `sys_trace`. For each, say what would go wrong without it: a compile
      error, a link error, or a failure at run time.
    hints:
      - |
        Follow `write` through the tree: grep for `SYS_write`, for `sys_write` and for
        `write` in [[user/usys.pl]] and [[user/user.h]]. Then look at how the Makefile builds
        `user/usys.S` and `fs.img`.
      - |
        The kernel and user programs are compiled separately and share nothing at run time
        except the number in `a7`. So the number must come from one header both sides
        include, and each side needs its own declaration of the function it uses.
      - |
        Five places in the source, plus the Makefile for the new user program: a `#define`
        in `kernel/syscall.h`; an `entry("trace")` in `user/usys.pl`; a prototype in
        `user/user.h`; an `extern` prototype and a `[SYS_trace] = sys_trace` entry in
        `kernel/syscall.c`; and the function itself, in `kernel/sysproc.c`.
    answer: |
      | Where | What it provides | Without it |
      |---|---|---|
      | `kernel/syscall.h`: `#define SYS_trace 23` | the one number both sides agree on; the kernel table and the generated stub both include this header | the kernel table and the stub both use the name `SYS_trace`, so neither builds |
      | `user/usys.pl`: `entry("trace")` | generates the stub `trace: li a7, SYS_trace; ecall; ret` in `user/usys.S` | the C compiler is happy (user.h declares `trace`), but the [[g:linker]] finds no symbol `trace`: `undefined reference to 'trace'` (clinic 4) |
      | `user/user.h`: `int trace(int);` | tells the C compiler the stub's type | `-Werror` turns the implicit declaration into a compile error |
      | `kernel/syscall.c`: `extern uint64 sys_trace(void);` | lets the table refer to a function defined in another file | compile error in the table |
      | `kernel/syscall.c`: `[SYS_trace] = sys_trace,` | maps 23 to the handler; [[syscall]] dispatches only through this table | builds fine, but every call prints `unknown sys call 23` and returns -1 |
      | `kernel/sysproc.c`: `sys_trace` | the handler | link error in the kernel |
      | `Makefile`: `$U/_trace` in `UPROGS` | builds the program and puts it in `fs.img` | `exec trace failed` from the shell (clinic 6) |

      The table uses [[g:designated-initializer|designated initializers]] (`[SYS_trace] =`),
      so the order of the lines does not matter and a missing entry is a null pointer that
      [[syscall]] checks for ([[kernel/syscall.c:143]]). The user side never sees the kernel's
      function names at all: the only thing that crosses the boundary is the number in `a7`.
    checks:
      - id: lab01-01
        level: 1
        type: match
        q: |
          Match each change to what it provides.
        pairs:
          - left: "`#define SYS_trace 23` in kernel/syscall.h"
            right: the number both the stub and the kernel table use
            why: |
              You may have thought the header is only for the kernel. `user/usys.S` includes
              `kernel/syscall.h` too, which is how `li a7, SYS_trace` becomes `li a7,23`.
          - left: "`entry(\"trace\")` in user/usys.pl"
            right: the code that loads a7 and executes ecall
            why: |
              You may have confused the stub generator with the prototype. The Perl script
              writes assembly: `li a7, SYS_trace`, `ecall`, `ret`.
          - left: "`int trace(int);` in user/user.h"
            right: the type the C compiler checks calls against
            why: |
              You may have thought the prototype generates code. It only declares the type;
              without the stub, linking still fails.
          - left: "`[SYS_trace] = sys_trace` in kernel/syscall.c"
            right: the mapping syscall() uses to find the handler
            why: |
              You may have thought the kernel finds `sys_trace` by name. It never does: it
              indexes the table with the number from `a7`.
          - left: "`$U/_trace` in UPROGS"
            right: the program file in fs.img
            why: |
              You may have thought the Makefile entry affects the kernel. It only decides which
              user programs are built and copied into the disk image by `mkfs`.
        explain: |
          The two halves of the system meet in exactly one value, the number in `a7`. Everything
          else is per side: a stub and a prototype for user programs, a table entry and a
          prototype for the kernel. See [[g:syscall-number]] and [[tour:5]].
  - title: How do the number and the mask reach sys_trace?
    q: |
      The `trace` program calls `trace(32)`. Trace the two values, 23 and 32, from that call
      to the moment `sys_trace` holds 32 in a local variable. Name the register each value
      travels in, where it is saved, and who reads it back.
    hints:
      - |
        Read [[tour:5]] steps 2 to 10, or the code: the stub in `user/usys.S`, [[uservec]]
        in [[kernel/trampoline.S]], [[usertrap]] and [[syscall]], then [[argraw]].
      - |
        `ecall` changes no general-purpose register. Whatever is in `a0` and `a7` at the
        `ecall` is what the kernel sees, and it sees it in the [[g:trapframe]], not in the
        registers, because C code in the kernel reuses every register.
      - |
        `a0 = 32` by the [[g:calling-convention]]; `a7 = 23` by the stub; `uservec` stores
        both in the trapframe (offsets 112 and 168); `syscall()` reads `trapframe->a7`;
        `argint(0, ...)` reads `trapframe->a0` through `argraw`.
    answer: |
      1. The C call `trace(32)` puts 32 in `a0`: the first argument register.
      2. The stub runs `li a7,23` (in this build at address `0x3c0` of the program) and
         `ecall`.
      3. `ecall` switches to supervisor mode and jumps to [[uservec]]; `a0` and `a7` still
         hold 32 and 23.
      4. `uservec` saves all 31 user registers in the process's trapframe: `a0` at offset 112
         (through `sscratch`, [[kernel/trampoline.S:72]]), `a7` at offset 168. Then it
         switches to the kernel stack and page table and jumps to [[usertrap]].
      5. `usertrap` sees `scause` 8, adds 4 to the saved `epc`, turns interrupts on, and calls
         [[syscall]].
      6. `syscall()` reads `num = p->trapframe->a7` ([[kernel/syscall.c:142]]), checks it is
         in range and calls `syscalls[23]`, which is `sys_trace`.
      7. `sys_trace` calls [[argint]]`(0, &mask)`, which reads `p->trapframe->a0` through
         [[argraw]]: 32.

      The way back is the mirror image: `syscall()` stores the result in `trapframe->a0`,
      and [[userret]] reloads `a0` from the trapframe last ([[kernel/trampoline.S:149]]), so
      `trace()` returns that value in `a0`.
    checks:
      - id: lab01-02
        level: 2
        type: order
        q: |
          Put the steps of `trace(32)` in the order they happen.
        items:
          - "The compiler's call puts 32 in a0"
          - "The stub executes li a7,23"
          - "ecall: the hart enters supervisor mode at uservec"
          - "uservec saves a0 and a7 in the trapframe"
          - "usertrap adds 4 to the saved epc and turns interrupts on"
          - "syscall() reads trapframe->a7 and calls syscalls[23]"
          - "argint reads trapframe->a0"
        why_wrong: |
          You may have placed a kernel step before the trap. Nothing in the kernel runs until
          `ecall`, and nothing reads the trapframe until `uservec` has filled it. Inside the
          kernel, `usertrap` dispatches to `syscall()`, which dispatches to `sys_trace`, which
          calls `argint`.
        explain: |
          The values ride in registers until `uservec` saves them, then live in the trapframe
          for the rest of the system call. `syscall()` and `argint` read the saved copies,
          never the live registers. See [[tour:5]] and [[g:syscall-arguments]].
      - id: lab01-03
        level: 2
        type: state
        q: |
          `sys_trace` is running its first line, `argint(0, &mask)`. Fill in the machine state
          of the hart running it.
        state: {mode: S, stack: kernel, satp: kernel, sie: "on", noff: "0", intena: "-"}
        why:
          mode: You may have thought a system call handler runs in user mode on the process's behalf. It runs in supervisor mode; the process is in the kernel.
          stack: You may have thought the kernel uses the user's stack or a per-hart stack. uservec switched to the process's own kernel stack ([[kernel/trampoline.S:76]]).
          satp: You may have thought the user page table stays installed. uservec switched to the kernel page table before calling usertrap ([[kernel/trampoline.S:92]]).
          sie: You may have thought interrupts stay off for the whole trap. usertrap turned them on with intr_on() before calling syscall() ([[kernel/trap.c:66]]).
          noff: You may have thought some lock is held. Nothing on this path takes a spinlock before sys_trace; sys_trace itself takes none.
          intena: With noff 0 there is no saved interrupt state to report.
        why_wrong: |
          Ask the three questions of [[concept:mode-stack-page-table]]: which mode, which
          stack, which page table. Then ask whether any spinlock is held.
        explain: |
          A system call handler runs in supervisor mode, on the process's kernel stack, with
          the kernel page table and interrupts on, holding no lock. That is why `sys_trace`
          can be interrupted by the timer and even resume on another hart; it is safe because
          it touches only its own process's state.
  - title: Why is argint enough here?
    q: |
      `sys_trace` reads its argument with one call to [[argint]] and never checks it. Is that
      safe? What would you have to do differently if the argument were a pointer, say
      `trace(int *mask)`?
    hints:
      - |
        Read [[argraw]] ([[kernel/syscall.c:35]]), [[argint]] and [[argaddr]]
        ([[kernel/syscall.c:67]]), then [[copyin]].
      - |
        What could go wrong with an `int` value? With a pointer value, whose page table
        gives it meaning, and which page table is installed while `sys_trace` runs?
      - |
        For an `int`, nothing to check. For a pointer, fetch it with `argaddr` and copy the
        value with `copyin(p->pagetable, ...)`, which checks the address against the process's
        page table and returns -1 instead of faulting.
    answer: |
      [[argint]] copies the saved `a0` out of the trapframe ([[kernel/syscall.c:58]]). The
      trapframe is kernel memory that `uservec` filled, so reading it is always safe, and any
      32-bit value is a valid mask: bit 30, for example, matches no system call and is never
      tested. So `sys_trace` needs no check and cannot fail.

      A pointer argument is a different matter. The value in `a0` would be a user virtual
      address: meaningless under the kernel page table, and possibly pointing at nothing or
      at the guard page. The kernel never dereferences it. It fetches it with [[argaddr]] and
      copies through [[copyin]], which translates the address with the process's page table
      (refusing pages without `PTE_U`), allocates a lazily allocated page only if the address
      is below the process's size, and otherwise returns -1. See [[tour:6]] and [[tour:28]].
    checks:
      - id: lab01-10
        level: 2
        type: choice
        q: |
          Suppose `trace` took `int *mask` and `sys_trace` did `argaddr(0, &a); mask = *(int *)a;`.
          What is wrong?
        options:
          - text: "`a` is a user virtual address; the kernel runs with its own page table, so the load reads the wrong memory or faults."
            correct: true
            why: |
              User addresses are translated by the user's page table, which is not installed in
              the kernel. The kernel must copy through [[copyin]], which translates the address
              with the process's page table and checks it.
          - text: Nothing, because argaddr already checked that the address is valid.
            why: |
              You may have trusted the name. [[argaddr]] only copies the raw value from the
              trapframe; its comment says it does not check legality.
          - text: The load needs interrupts off, because the user could change the value meanwhile.
            why: |
              You may have thought the danger is a race. xv6 processes have one thread, and the
              real problem is translation: the address belongs to another page table.
          - text: It works, but only on hart 0, which has the user's page table installed.
            why: |
              You may have thought page tables belong to harts. Every hart runs kernel code with
              the kernel page table; no hart has the user table installed while in C code.
        explain: |
          The kernel never trusts or dereferences a user pointer. It copies with
          [[copyin]]/[[copyout]], which translate through the process's own page table and fail
          cleanly. An `int` argument needs none of this, which is why `trace` takes one. See
          [[tour:28]].
  - title: Where does the mask live, and who may touch it?
    q: |
      The mask belongs to a process. Which structure gets the new field, in which section,
      and which lock (if any) must be held to read or write it? Consider the three places
      that will touch it: `sys_trace`, `syscall()` and `kfork`.
    hints:
      - |
        Read the comments inside `struct proc` in [[kernel/proc.h]]: the fields are grouped
        by the lock that protects them.
      - |
        A field needs a lock only if two threads can touch it at the same time. xv6
        processes have one thread each. Who else, apart from the process itself, could
        ever read or write its mask?
      - |
        Only the process itself reads and writes its own mask, so it goes in the "private to
        the process" section with `sz`, `ofile` and `name`, with no lock. The one exception,
        `kfork` writing the *child's* mask, happens before the child can run.
    answer: |
      Put `int tracemask;` in `struct proc`, in the section headed "these are private to the
      process, so p->lock need not be held" ([[kernel/proc.h:95]]).

      - `sys_trace` and `syscall()` run *as* the process, on its kernel stack. A process runs
        on one hart at a time, and nothing else reads its mask (not even [[procdump]]), so no
        lock is needed. If the process is preempted and moves to another hart in between, it
        still is the only thread that touches the field.
      - `kfork` reads the parent's mask (the parent is the running process: private) and
        writes the child's. It writes it while it still holds the child's `np->lock`, taken by
        [[allocproc]], and before `np->state = RUNNABLE`, so no scheduler can pick the child
        and run it. It is the same reasoning that lets `kfork` write `np->sz` and
        `np->ofile[]` there.
      - [[freeproc]] clears it with the other fields, under `p->lock`, when the parent reaps
        the child in [[kwait]].

      Putting the field under `p->lock` would work too, but every `syscall()` would then take
      and release a spinlock on the hottest path in the kernel for nothing.
    checks:
      - id: lab01-04
        level: 2
        type: tf
        q: |
          True or false: in `kfork`, reading the parent's `p->tracemask` must be done while
          holding the **parent's** `p->lock`.
        answer: false
        why_tf: |
          You may have thought every `struct proc` field needs its own `p->lock`. Only the
          fields in the first section do (`state`, `chan`, `killed`, `xstate`, `pid`), because
          other processes and interrupt handlers read or write them.
        reasons:
          - text: "False: the parent is the process running kfork, and the mask is private to it; no other thread reads or writes it."
            correct: true
            why: This is the reason. Private fields need no lock because only their owner touches them, and the owner is running this code.
          - text: "True: a timer interrupt could change the mask in the middle of the read."
            why: You may have thought interrupt handlers touch process fields. No handler touches the mask, and a 4-byte aligned load is a single instruction.
          - text: "False: kfork already holds the parent's p->lock for its whole run."
            why: You may have confused the two locks. kfork holds the child's np->lock (from allocproc), never the parent's p->lock.
          - text: "True: another hart could be running the parent at the same time."
            why: You may have thought a process can run on two harts at once. An xv6 process has one thread, and the scheduler runs it on at most one hart.
        explain: |
          Locks protect data that two threads can touch at once. The parent's mask is touched
          only by the parent. The child's mask is written by the parent, but the child cannot
          run yet: it is not RUNNABLE, and `np->lock` is held. See
          [[concept:locks#lock-proc]] and [[kernel/proc.h:95]].
  - title: Where exactly do you print?
    q: |
      You need the system call's number, its name and its return value. Which function is
      the one place every system call passes through, and on which line must the print go
      so that the return value is known?
    hints:
      - |
        Read [[syscall]] ([[kernel/syscall.c:136]]). Every system call passes through it. Which
        variable holds the number, and which one will hold the result?
      - |
        Before line 146 runs, `p->trapframe->a0` still holds what the user put in `a0`: the
        first argument. After it, `a0` holds the result. And some calls never come back to
        this line at all.
      - |
        Print right after line 146, inside the `if`, when `p->tracemask & (1 << num)` is
        nonzero, and print `p->trapframe->a0`.
    answer: |
      In [[syscall]], immediately after `p->trapframe->a0 = syscalls[num]();`
      ([[kernel/syscall.c:146]]):

      ```c
      if (p->tracemask & (1 << num))
        printk("%d: syscall %s -> %ld\n", p->pid, syscallnames[num],
               p->trapframe->a0);
      ```

      - Before the call, `a0` in the trapframe is still the user's first argument: a file
        descriptor for `read`, a pointer for `exec` (clinic 2 shows `read -> 3` and
        `exec -> 16336`).
      - Inside each `sys_*` function would mean twenty-three edits, and the handler does not
        know its own number.
      - In [[usertrap]] after `syscall()` returns would work for system calls, but `usertrap`
        also handles interrupts and faults, so it would need to remember whether this trap
        was a system call.

      Two consequences of "after the call": a successful `exit` never prints, because
      [[kexit]] never returns; and `trace` traces itself with the *new* mask, because the
      check runs after `sys_trace` installed it. `trace 8388608 echo x` (bit 23) prints
      `trace -> 0`, and `trace(0)` called with the trace bit set prints nothing.

      `%ld` prints the full 64-bit `a0` as a signed number, so `-1` shows as `-1` and an
      `sbrk` result shows as an address. `1 << num` is an `int` shift, fine for numbers up to
      30; a kernel with more than 31 system calls would need a 64-bit mask and `1L << num`.
    checks:
      - id: lab01-06
        level: 1
        type: line
        q: |
          Click the line right after which the trace check must go.
        code: kernel/syscall.c:136-151
        answer: 146
        lines:
          142: |
            You may have thought you only need the number. You need the return value too, and
            it does not exist until the handler has run.
          144: |
            That is a comment. You may have wanted to print before the call, but at that point
            `trapframe->a0` still holds the first argument.
          148: |
            You may have confused the two branches. The `else` branch handles numbers with no
            handler; the traced call has already returned on line 146.
          149: |
            That line runs only for an unknown number. A real system call never reaches it.
        why_wrong: |
          You may have picked a line outside the successful-call path. The print must run after
          the handler has stored its result, and only when there was a handler.
        explain: |
          Line 146 is the only point where the number (`num`), the process (`p`) and the return
          value (`p->trapframe->a0`) are all known. Printing before it shows the first
          argument instead of the result. See [[tour:5]].
      - id: lab01-07
        level: 2
        type: number
        q: |
          Suppose the print is placed *before* line 146. `grep` calls `read(3, buf, 1023)` and
          the call returns 1023. What number does the trace line show after `->`?
        answer: 3
        wrong:
          1023: |
            You may have thought the return value is already known. Before the call nothing
            has written `trapframe->a0` since `uservec` saved the user's `a0`.
          5: |
            You may have confused the number with the result. 5 is `SYS_read`, which is in
            `a7`, not `a0`.
          0: |
            You may have thought the kernel clears `a0` on entry. It saves the user's `a0`
            unchanged; for `read` that is the file descriptor.
        why_wrong: |
          Think about which value is in the trapframe's `a0` slot when the system call has not
          run yet: the first argument the user passed.
        explain: |
          `trapframe->a0` does double duty: on entry it is the first argument, on return it is
          the result. Before line 146 it is still the argument, here the descriptor 3. The
          recorded run of this mistake printed `3: syscall read -> 3` four times.
  - title: What should fork, exec and exit do with the mask?
    q: |
      The spec says children inherit the mask and `exec` keeps it. Which functions must
      change? And when a traced `sh` forks, how many `fork` lines should the trace print,
      one or two? You know where the print is now (the previous question); use that.
    hints:
      - |
        Read [[kfork]], [[kexec]] and [[freeproc]]. Which of them builds a new `struct proc`,
        which reuses one, and which clears one?
      - |
        `exec` replaces the memory image but not the process: the `struct proc` (and
        everything in it) stays. A forked child returns from `fork` without ever having made
        a system call itself.
      - |
        Copy the mask in `kfork` next to `safestrcpy(np->name, ...)`, before `release(&np->lock)`.
        Clear it in `freeproc`. Leave `kexec` alone. The child's first return to user space
        goes through `forkret`, which never calls `syscall()`.
    answer: |
      - **fork**: [[kfork]] copies `np->tracemask = p->tracemask` while it holds the child's
        lock (before [[kernel/proc.c:294]]). The child slot came from [[allocproc]], whose
        fields were cleared by `freeproc` when the slot was last freed (or are zero from
        boot), so without this line the child is untraced (clinic 1).
      - **exec**: nothing. [[kexec]] builds a new page table and user memory but keeps the
        `struct proc`, so the mask survives. That is exactly what makes the `trace` command
        work: it sets the mask, then execs the command.
      - **exit/wait**: [[freeproc]] sets `tracemask = 0` with the other fields. At this
        commit every caller of `allocproc` either copies a mask (`kfork`) or runs at boot,
        when the table is all zeros (`userinit`), so this is hygiene rather than a fix, but a
        future caller of `allocproc` would otherwise inherit a stranger's mask.
      - **One fork line, not two.** The parent's `fork` returns through [[syscall]] and prints
        the child's pid. The child never executed `ecall`: [[kfork]] gave it a copy of the
        trapframe with `a0 = 0`, and [[allocproc]] gave it a fresh kernel stack and a
        context whose `ra` is [[forkret]], so its first `swtch` lands there.
        `forkret` goes straight to [[prepare_return]] and [[userret]]. The child never
        passes through `syscall()`, so it prints nothing.
    checks:
      - id: lab01-05
        level: 2
        type: choice
        q: |
          A shell running with every bit of its mask set forks a child. How many lines
          mention `fork`?
        options:
          - text: One, printed by the parent, showing the child's pid.
            correct: true
            why: |
              The parent's `fork` returns through `syscall()`. The child's "return" from fork
              is manufactured by `kfork` (`a0 = 0` in its trapframe) and reaches user space
              through `forkret`, never through `syscall()`.
          - text: Two, one from the parent showing the child's pid and one from the child showing 0.
            why: |
              You may have thought the child returns from the same system call. It never made
              one: it starts life in [[forkret]] on a fresh kernel stack and goes straight to
              user space. Only the parent passes through `syscall()`. (The recorded run shows
              `3: syscall fork -> 4` and no `4: syscall fork` line.)
          - text: One, printed by the child, showing 0.
            why: |
              You may have thought only the child "returns" from fork. Both return to user
              space, but only the parent's return goes through `syscall()`.
          - text: None, because the parent's mask is copied after the child has started running.
            why: |
              You may have thought the copy races with the child. `kfork` copies the mask while
              holding `np->lock` and before setting `RUNNABLE`, so the child cannot run yet;
              and in any case the parent's own line depends only on the parent's mask.
        explain: |
          Printing happens in `syscall()`, so a line appears only for a process that is
          returning from a call it made. A forked child made none. See [[tour:20]] for how
          `kfork` sets up the child's first return.
  - title: How do you turn a number into a name?
    q: |
      The output needs `read`, not `5`. Where do the names come from, and how do you make sure
      name *i* really is system call *i*, even if someone later adds a number in the middle?
    hints:
      - |
        Look at how `syscalls[]` is written ([[kernel/syscall.c:109]]): `[SYS_fork] = sys_fork`.
      - |
        Numbering starts at 1, not 0. A plain list `{"fork", "exit", ...}` puts "fork" at
        index 0.
      - |
        Use the same designated initializers: `[SYS_read] = "read"`. Then the index is the
        constant itself, and the array has exactly as many slots as `syscalls[]`.
    answer: |
      A second table, indexed like the first:

      ```c
      static char *syscallnames[] = {
        [SYS_fork]    = "fork",
        ...
        [SYS_trace]   = "trace",
      };
      ```

      With [[g:designated-initializer|designated initializers]] the position in the source
      does not matter; slot 0 stays empty, as in `syscalls[]`; and the array's length is
      `SYS_trace + 1`, the same as `syscalls[]`, so the range check in [[syscall]] covers
      both. A plain list starting with `"fork"` is off by one: `read` (5) prints the sixth
      name, `kill`, and the last number indexes one slot past the end (clinic 3, which
      panicked).
    checks:
      - id: lab01-08
        level: 2
        type: choice
        q: |
          The names are written as a plain list, `{"fork", "exit", "wait", "pipe", "read",
          "kill", ...}`, in the order of `syscall.h`. What does `trace 32 grep hello README`
          print?
        options:
          - text: "Lines like `3: syscall kill -> 1023`"
            correct: true
            why: |
              `SYS_read` is 5, and index 5 of a list that starts at 0 is the sixth name,
              `kill`. The value is still right: only the name is shifted.
          - text: "Lines like `3: syscall pipe -> 1023`"
            why: |
              You may have shifted the wrong way. Index 5 in a 0-based list is the sixth
              element. `pipe` is the fourth name, at index 3.
          - text: "Correct lines, because the list is in the same order as syscall.h"
            why: |
              You may have thought order is enough. The order is right but the numbering
              starts at 1, so every name is one slot early.
          - text: The kernel panics at the first read
            why: |
              You may have expected an out-of-bounds read. Index 5 is inside the array; only
              the highest number, 23, falls off the end (and that did panic in the clinic).
        explain: |
          `syscall.h` numbers from 1, so a 0-based plain list is off by one everywhere and
          short by one slot at the end. Designated initializers make the index explicit. See
          [[g:designated-initializer]].
  - title: Three harts, one console. Will the lines come out whole?
    q: |
      With three harts, two traced processes can return from system calls at the same moment,
      and a third process can be writing its own output. What keeps a trace line from being
      mixed with another trace line? Is anything keeping it from being mixed with a user
      program's output?
    hints:
      - |
        Read [[printk]] ([[kernel/printk.c:63]]) and how a user `write` to the console reaches
        the UART: [[consolewrite]] and [[uartwrite]]. Which lock does each path take?
      - |
        `pr.lock` is held for a whole `printk` call. `uartwrite` holds the sleep-lock
        `tx_lock` for at most 32 bytes at a time. The two paths share the UART but not a lock.
      - |
        List the lock each path holds while it writes the UART's transmit register:
        `printk`'s path holds ?, `consolewrite`'s path holds ?. A lock excludes only code
        that takes the same lock.
    answer: |
      [[printk]] holds `pr.lock` (a [[g:spinlock]]) from before the first character to after
      the last ([[kernel/printk.c:70]], [[kernel/printk.c:131]]). Every kernel message takes it
      (except while the kernel is panicking), so two `printk` calls never interleave: a trace line printed on hart 1 and one printed
      on hart 2 come out one after the other, in some order. While the lock is held,
      interrupts are off on the printing hart (`noff` 1, then 2 inside [[uartputc_sync]]),
      and each character is sent by spinning on the UART's status register.

      User output does not take `pr.lock`. `write(1, ...)` goes through [[consolewrite]] to
      [[uartwrite]], which holds the sleep-lock `tx_lock` for each 32-byte batch. Nothing makes
      `printk` and `uartwrite` exclude each other, so their characters can alternate at the
      UART. That happened in a recorded run of `cat README &; trace 65536 echo hello`
      (see Measure): `Behnam` and `write` came out as `Bwehritena`.

      The trace line for one process's own `write` always comes *after* that write's text,
      because the same process prints it after the call returns: `hi4: syscall write -> 2` in the recorded run.
      (The text has no newline, so the trace line continues it.)
    checks:
      - id: lab01-09
        level: 3
        type: multi
        q: |
          Which of these does `pr.lock` guarantee on three harts?
        options:
          - text: Two trace lines printed on different harts never have their characters mixed.
            correct: true
            why: Both printk calls take pr.lock for the whole line, so one waits for the other.
          - text: While a trace line is printing, interrupts are off on the hart printing it.
            correct: true
            why: Holding any spinlock means interrupts are off on that hart (acquire calls push_off).
          - text: A trace line never lands in the middle of another process's write() output.
            why: |
              You may have thought all console output goes through printk. User writes go
              through consolewrite and uartwrite, which take tx_lock, not pr.lock. The recorded
              run shows a trace line interleaved character by character with cat's output.
          - text: Other harts stop running while a trace line prints.
            why: |
              You may have thought turning interrupts off affects other harts. SIE is per hart;
              the others keep running, and only a hart that also calls printk waits.
          - text: Trace lines appear in the order the system calls returned.
            why: |
              You may have thought the lock is first-come, first-served. A spinlock gives no
              fairness or order: whichever hart's `amoswap` wins next goes next, and a call
              that returned first may still print second.
        explain: |
          A lock only excludes code that takes the same lock. `pr.lock` makes kernel messages
          atomic with respect to each other; user output uses a different lock (`tx_lock`) and
          is not excluded. See [[concept:locks#lock-pr]] and [[tour:38]].
build: |
  **Start from the frozen commit**, in your own clone of xv6 (not this site's `xv6/`):

  ```sh
  git checkout -b my-trace 06aad25
  ```

  Work in this order; each milestone can be tested before the next.

  1. **The plumbing.** Add `SYS_trace` (23) to `kernel/syscall.h`, `entry("trace")` to
     `user/usys.pl` and `int trace(int);` to `user/user.h`. Run `make`. Nothing calls it
     yet, but `user/usys.S` should now contain a `trace:` stub. Check with
     `grep -A3 'trace:' user/usys.S`.
  2. **The mask and the handler.** Add `int tracemask;` to `struct proc` (in the private
     section), write `sys_trace` in `kernel/sysproc.c`, add its `extern` and table entry in
     `kernel/syscall.c`, and clear the field in `freeproc`. A quick test: a tiny program that
     calls `trace(5)` and prints `trace(0)` should print 5. Without the table entry you would
     see `unknown sys call 23` instead.
  3. **Inheritance.** One line in `kfork`, before `release(&np->lock)`.
  4. **The print.** The names table and the `printk` in `syscall()`. Now `trace` works from
     a test program: set a mask, make a call, see the line.
  5. **The command.** `user/trace.c` (check `argc`, `trace(atoi(argv[1]))`, `exec`, print an
     error if `exec` returns) and `$U/_trace` in `UPROGS`. Try `trace 32 grep hello README`
     and `trace 2147483647 echo hi`.
  6. **The test.** `tracetest` (or your own), then `usertests -q`.

  **Debugging.** Run QEMU with three harts (`make qemu` uses `CPUS := 3`). If a line is
  missing, ask in order: is the bit set (print the mask in `sys_trace`)? Did the call
  come through `syscall()` (a forked child's first return does not)? Is the name table
  indexed like `syscalls[]`? For a crash inside the print, attach [[g:gdb]] (`make qemu-gdb`
  in one terminal, `${TOOLPREFIX}gdb kernel/kernel` and `target remote` in another), `break
  panic`, and look at `bt`, `p/x $scause`, `p/x $stval` and `p/x $sepc`: clinic 3 shows
  what that looks like. `TOOLPREFIX` is your RISC-V toolchain's prefix, the same one xv6's
  Makefile detects (`riscv64-unknown-elf-`, `riscv64-linux-gnu-` or `riscv64-elf-`); set it
  with `export TOOLPREFIX=riscv64-unknown-elf-` or whichever you have. On
  Debian/Ubuntu/WSL, `gdb-multiarch` also works as the debugger.
clinic:
  - bug: Forgot to copy the mask in kfork
    change: |
      The one line in `kfork` is missing:

      ```diff
         safestrcpy(np->name, p->name, sizeof(p->name));

      -  // the child inherits the parent's trace mask.
      -  np->tracemask = p->tracemask;
      -
         pid = np->pid;
      ```
    symptom: |
      $ tracetest
      tracetest: trace returns the previous mask: OK
      tracetest: fork copies the mask to the child: FAIL
      tracetest: the child's trace(0) leaves the parent alone: OK
      tracetest: exec keeps the mask: FAIL
      tracetest: begin
      3: syscall getpid -> 3
      tracetest: end
      tracetest: expected between the markers, and nothing else:
      3: syscall getpid -> 3
      6: syscall getpid -> 6
      tracetest: 2 FAILED
      $ trace 65536 sh
      $ 7: syscall write -> 2
      echo hi
      hi
      $ 7: syscall write -> 2
    why: |
      The child's `struct proc` comes from [[allocproc]], and its mask is whatever
      [[freeproc]] left there: 0. So the child starts untraced. "exec keeps the mask" fails
      too, though `exec` is fine: the test runs `exec` in a forked child, which had already
      lost the mask at the `fork`. Between the markers only the parent's `getpid` is
      printed. In the traced shell, `sh` itself is traced (its `write` of the two-byte
      prompt `$ ` prints `write -> 2`), but `echo`, forked by `sh`, prints `hi` with no trace
      line. Bugs in inheritance are invisible when the traced program never forks: `trace 32
      grep hello README` still works perfectly, because `trace` execs `grep` in the same
      process.
  - bug: Printed before calling the handler
    change: |
      The check moved above the call in `syscall()`:

      ```diff
      -    p->trapframe->a0 = syscalls[num]();
           if (p->tracemask & (1 << num))
             printk("%d: syscall %s -> %ld\n", p->pid, syscallnames[num],
                    p->trapframe->a0);
      +    p->trapframe->a0 = syscalls[num]();
      ```
    symptom: |
      $ trace 32 grep hello README
      3: syscall read -> 3
      3: syscall read -> 3
      3: syscall read -> 3
      3: syscall read -> 3
      $ trace 2147483647 echo hi
      4: syscall exec -> 16336
      4: syscall write -> 1
      hi4: syscall write -> 1

      4: syscall exit -> 0
      $

      (a separate boot, same kernel:)
      $ tracetest
      tracetest: trace returns the previous mask: OK
      tracetest: fork copies the mask to the child: OK
      tracetest: the child's trace(0) leaves the parent alone: OK
      tracetest: exec keeps the mask: OK
      tracetest: begin
      3: syscall getpid -> 0
      6: syscall getpid -> 0
      tracetest: end
      tracetest: expected between the markers, and nothing else:
      3: syscall getpid -> 3
      6: syscall getpid -> 6
      tracetest: 4 checks OK; now compare the lines between the markers by eye
    why: |
      Before the handler runs, `p->trapframe->a0` still holds the user's `a0`, saved by
      [[uservec]]: the **first argument**. Every `read` shows the descriptor 3, both `write`s
      show the descriptor 1, and `exec` shows the address of its path string in `trace`'s
      memory (16336 is `0x3fd0`). Three more differences give the bug away: `exit` now prints
      (the line comes out before [[kexit]] gets the chance not to return); the `trace` call
      itself is missing, because the mask was still 0 when it was checked; and each `write`
      line comes out *before* its text, so `hi` appears in front of the second line instead
      of the first.

      `tracetest`'s four checks all pass, because they test only the mask, never the printed
      value: only the comparison by eye catches this bug. `getpid` takes no argument, so the
      `a0` it shows is whatever the program last left there: in the parent, the 0 returned
      by the `trace` call just before it; in the child, the 0 that `fork` returned. This is
      why the test's last line asks you to compare instead of claiming that all is well.
  - bug: Off-by-one in the names table
    change: |
      The names are a plain list in `syscall.h` order, without designated initializers:

      ```diff
       static char *syscallnames[] = {
         // clang-format off
      -  [SYS_fork]    = "fork",
      -  [SYS_exit]    = "exit",
      +  "fork",
      +  "exit",
         ...
      -  [SYS_trace]   = "trace",
      +  "trace",
      ```
    symptom: |
      $ trace 32 grep hello README
      3: syscall kill -> 1023
      3: syscall kill -> 965
      3: syscall kill -> 453
      3: syscall kill -> 0
      $ trace 2147483647 echo hi
      4: syscall panic: acquire

      (a second run, fresh boot, `trace 2147483647 echo hi` as the first command,
      with gdb attached and a breakpoint on panic, on hart 1:)
      #0  panic (s=s@entry=0x80007048 "acquire") at kernel/printk.c:139
      #1  0x0000000080000c28 in acquire (lk=lk@entry=0x8000faa8 <pr>) at kernel/spinlock.c:26
      #2  0x000000008000057a in printk (fmt=fmt@entry=0x80007350 "scause=0x%lx sepc=0x%lx stval=0x%lx\n") at kernel/printk.c:71
      #3  0x0000000080002758 in kerneltrap () at kernel/trap.c:151
      #4  0x0000000080005648 in kernelvec () at kernel/kernelvec.S:38
      (gdb) p/x $scause
      $1 = 0xd
      (gdb) p/x $stval
      $2 = 0x400000000
      (gdb) p/x $sepc
      $3 = 0x8000072c
      (gdb) x/2wx 0x80007908+23*8
      0x800079c0 <first.1>:	0x00000000	0x00000004
    why: |
      The list starts at index 0, but the numbers start at 1. `read` is 5, and index 5 is the
      sixth name, `kill`. The values are right; only the names are shifted.

      The panic is the interesting part. The first traced call is `trace` itself, number 23,
      and a 23-entry list has indices 0 to 22. `syscallnames[23]` reads the 8 bytes after the
      array. In that build the array sits at `0x80007908` and its 184 bytes are followed by
      `forkret`'s `static int first` (0 by now) and, in the next word, `nextpid` (address
      `0x800079c4` from the symbol table; `x/2wx` showed it held 4), which
      together make the "pointer" `0x400000000`. [[printk]]'s `%s` loop loads from it (the
      `lbu` at `0x8000072c`), and the kernel page table maps nothing there: a load page fault
      (`scause` 13) in supervisor mode, so [[kerneltrap]] runs. It finds no device
      interrupt and calls `printk` to report `scause`, and that `printk` tries to acquire
      `pr.lock`, which this hart already holds, because it faulted in the middle of a
      `printk`. [[acquire]] notices that the holder is this very hart and panics
      ([[kernel/spinlock.c:25]]) before the real report can print. The first run, where
      `nextpid` was 5, faulted the same way at `0x500000000`.
  - bug: Forgot the usys.pl entry
    change: |
      Everything else is in place (`syscall.h`, `user.h`, the kernel side), but `user/usys.pl`
      has no `entry("trace");`.
    symptom: |
      ${TOOLPREFIX}ld -z max-page-size=4096 -T user/user.ld -o user/_trace user/trace.o user/ulib.o user/usys.o user/printf.o user/umalloc.o
      ${TOOLPREFIX}ld: user/trace.o: in function `main':
      ./user/trace.c:12:(.text+0x3e): undefined reference to `trace'
      make: *** [user/_trace] Error 1
    why: |
      The compiler is satisfied: `user/user.h` declares `int trace(int)`, so `trace.c`
      compiles to an object file with an unresolved call. The [[g:linker]] then looks for a
      symbol named `trace` in `ulib.o`, `usys.o`, `printf.o` and `umalloc.o`, and nobody
      defines it: the only definition would have been the stub that `usys.pl` generates. The
      kernel side builds fine, because the kernel never refers to the user stub. (The line
      number in the message is ld's approximation from the optimized code's debug
      information; the call is on line 15. Your output shows your own toolchain prefix where
      this one shows `${TOOLPREFIX}`.)
  - bug: Declared the mask as a char
    change: |
      A learner saves space in `struct proc`:

      ```diff
      -  int tracemask;               // bit i set: trace system call i
      +  char tracemask;              // bit i set: trace system call i
      ```

      Everything else is unchanged, including `p->tracemask & (1 << num)`.
    symptom: |
      $ tracetest
      tracetest: trace returns the previous mask: FAIL
      tracetest: fork copies the mask to the child: FAIL
      tracetest: the child's trace(0) leaves the parent alone: FAIL
      tracetest: exec keeps the mask: FAIL
      tracetest: begin
      tracetest: end
      tracetest: expected between the markers, and nothing else:
      3: syscall getpid -> 3
      6: syscall getpid -> 6
      tracetest: 4 FAILED
      $ trace 32 grep hello README
      7: syscall read -> 1023
      7: syscall read -> 965
      7: syscall read -> 453
      7: syscall read -> 0
      $ trace 65536 echo hi
      hi
      $
    why: |
      `p->tracemask = mask` silently keeps only the low 8 bits (C converts the `int` to
      `char` without a warning under xv6's flags). So only system calls 1 to 7 can ever be
      traced. `read` is 5, so `trace 32` works perfectly and hides the bug; `write` is 16,
      and `1 << 16` truncates to 0. Every `tracetest` mask is above bit 7 (`uptime` is 14,
      `getpid` is 11), so every check fails and nothing prints between the markers.

      The shift itself is not the problem here: `1 << num` is an `int` shift and
      fine for `num` up to 30. It would become one if you widened the mask to 64 bits to
      support more than 31 system calls: then you need `1L << num`, because shifting an
      `int` by 32 or more is undefined in C.
  - bug: Forgot to add trace to UPROGS
    change: |
      The program is written, but the Makefile is unchanged:

      ```diff
         $U/_sync\
      -  $U/_trace\
         $U/_tracetest\
      ```
    symptom: |
      $ trace 32 grep hello README
      exec trace failed
      $ tracetest
      tracetest: trace returns the previous mask: OK
      tracetest: fork copies the mask to the child: OK
      tracetest: the child's trace(0) leaves the parent alone: OK
      tracetest: exec keeps the mask: OK
      tracetest: begin
      4: syscall getpid -> 4
      7: syscall getpid -> 7
      tracetest: end
      tracetest: expected between the markers, and nothing else:
      4: syscall getpid -> 4
      7: syscall getpid -> 7
      tracetest: 4 checks OK; now compare the lines between the markers by eye
    why: |
      `make` builds only the user programs listed in `UPROGS`, and `mkfs` copies only those
      into `fs.img`. The kernel is complete, which is why `tracetest` passes, but there is no
      file `/trace` on the disk. The shell's child calls `exec("trace", ...)`, [[kexec]]'s
      [[namei]] finds nothing and returns -1, and [[user:runcmd]] prints `exec trace failed`
      ([[user/sh.c:80]]). The message comes from the shell, not from your program, which never
      ran.
reveal:
  - title: A number both sides agree on
    commit: 1
    file: kernel/syscall.h
    lines: 1-24
    focus: 24
    diff: true
    state:
      hart: 1
      mode: U
      proc: trace (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main, trace]
      sp: {"on": user, detail: "the trace program's user stack"}
    note: |
      The story for this tour: you type `trace 2147483647 sh` at a fresh shell, then
      `echo hi`, then Ctrl-D. That run was recorded on three harts. The `trace` program is
      pid 3, running on hart 1; it becomes `sh` by `exec`, forks `echo` as pid 4, and the
      first shell (pid 2) and `init` (pid 1) are asleep in `wait` meanwhile.

      The first commit adds the number. `SYS_trace` is 23, the next free one. This header is
      the only thing the kernel and user programs share about system calls: the kernel's
      table is indexed by these constants, and the generated `user/usys.S` includes this same
      file, so its `li a7, SYS_trace` assembles to `li a7,23`. The same commit adds
      `int trace(int);` to [[user/user.h]] so that C programs can call it.

      At this commit, a call to `trace` gets as far as [[syscall]] and no further: there is
      no handler yet.
  - title: The stub that makes the trap
    commit: 1
    file: user/usys.pl
    lines: 9-46
    focus: 19-21
    diff: true
    state:
      hart: 1
      mode: U
      proc: trace (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main, trace]
      sp: {"on": user, detail: "`ecall` does not change `sp`"}
    note: |
      `entry("trace")` makes this Perl script emit three instructions into `user/usys.S`:

      ```text
      trace:
       li a7, SYS_trace
       ecall
       ret
      ```

      In the built `trace` program the stub is at address `0x3c0`, and its first instruction
      is the 2-byte `li a7,23`. When `main` calls `trace(2147483647)`, the
      [[g:calling-convention]] has already put the mask in `a0`; the stub adds the number in
      `a7` and executes [[g:insn-ecall|ecall]]. From here the path is the one [[tour:5]]
      follows in detail: [[uservec]] saves every register in the [[g:trapframe]], switches
      to the kernel stack and page table, and jumps to [[usertrap]].

      Forget this line and the C compiler still accepts `trace(...)` (the prototype is in
      `user.h`), but the linker finds no `trace` symbol anywhere (clinic 4).
  - title: usertrap hands the call to syscall()
    commit: 1
    file: kernel/trap.c
    lines: 49-68
    focus: 66-68
    state:
      hart: 1
      mode: S
      proc: trace (pid 3)
      intr: "on"
      satp: kernel
      locks: []
      stack: [usertrap]
      sp: {"on": kernel, detail: "trace's kernel stack, holding only `usertrap`'s frame"}
      irq: 0
    note: |
      Nothing in the trap path changes for a new system call. [[usertrap]] saw `scause` 8,
      added 4 to the saved `epc` so the process will resume after the `ecall`, and turned
      interrupts back on (line 66). Then it calls [[syscall]].

      That `intr_on` matters for everything `trace` adds. From here on, a timer interrupt can
