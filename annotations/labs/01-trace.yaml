measure: |
  **How many system calls does `ls` make?** `trace 2147483647 ls` in `/` (26 entries)
  printed **808** lines: 1 `trace` (by the `trace` program, before the exec), 1 `exec`, then
  `ls` itself made 65 `read`s (64 directory entries of 16 bytes and one end-of-file read), 27
  `open`s, 27 `fstat`s, 27 `close`s (one set for `.` and one per entry, through [[user:stat]])
  and **660 `write`s of 1 byte each**. User-space `printf` calls `write` once per character
  ([[user/printf.c:12]]), so more than four out of five of the system calls `ls` makes print one character, each paying
  for a full trap, two `satp` switches and a return.

  **What does the shell do for one command?** `trace 2147483647 sh`, then `echo hi`, then
  Ctrl-D: 21 lines in all.

  ```text
  3: syscall trace -> 0
  3: syscall exec -> 1
  3: syscall open -> 3
  3: syscall close -> 0
  $ 3: syscall write -> 2
  echo hi
  3: syscall read -> 1          (eight of these: "echo hi\n", one byte per read)
  3: syscall fork -> 4
  4: syscall sbrk -> 20480
  4: syscall exec -> 2
  hi4: syscall write -> 2

  4: syscall write -> 1
  3: syscall wait -> 4
  $ 3: syscall write -> 2
  3: syscall read -> 0
  ```

  For one command, the shell makes 11 calls (8 one-byte `read`s in [[user:gets]], `fork`,
  `wait`, and the prompt's `write`), and the child makes 4 visible ones: `sbrk`, because the
  child parses the command and `malloc` grows the heap; `exec`; and `echo`'s two `write`s. The
  `open`/`close` pair at the start is the shell making sure descriptors 0 to 2 are open
  ([[user/sh.c:152]]). Neither `exit` prints, and neither does the child's return from `fork`.

  **Interleaving on three harts.** `cat README &; trace 65536 echo hello` printed, in the
  middle of the README, `Marcelo helloArroyo, Hirb3: syscall od Bwehritena -> m, S5il` and,
  a line later, `carlc` / `3: syscall write ->lo 1` / `ne`: the kernel's trace lines and
  `cat`'s text alternated byte by byte, because `printk` and `uartwrite` do not share a lock.
further: |
  - **Print the arguments too.** `read(3, 0x1010, 1023) -> 1023` (`0x1010` is `grep`'s buffer) needs a per-call
    description of the arguments (how many, which are strings). Teaches how [[argstr]] and
    [[fetchstr]] copy strings safely from user memory, and why the kernel must copy them
    *before* the call (after `exec`, the old memory is gone).
  - **Trace other processes.** `trace -p PID MASK` sets another process's mask. Now the field
    is no longer private: it moves to the `p->lock` section, and both `sys_trace` and
    `syscall()` must take the lock. Teaches why the private/locked split in `struct proc`
    exists, and what a lock on the hottest path costs.
  - **Keep trace lines out of user output.** Make `printk` and `uartwrite` exclude each
    other, then decide whether a process may sleep holding the lock that `printk` needs.
    Teaches the spinlock/sleep-lock boundary in [[concept:locks#rules]].
  - **Count instead of print.** Keep per-process counters of each system call and print a
    summary when the process exits (like `strace -c`). Teaches where in [[kexit]] a process
    can still safely print, and what happens to the counters across `fork`.
  - **More than 31 system calls.** Widen the mask to `uint64` and fix every shift. Teaches
    C's integer promotion rules and why `1 << 31` is already undefined for an `int`.
