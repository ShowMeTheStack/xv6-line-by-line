  The "child said / parent got" line shows the child's own last reading and what the parent
  received through `wait`. The extra millisecond of system time is what the child did
  after its last reading: two `write`s to the pipe and its `exit`. The new child, in a
  reused slot, starts at 112 µs. `time cputest par 1000` charges three spinners 2.9 times
