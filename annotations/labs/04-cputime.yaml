measure: |
  **Precise against sampled, by measurement.** A scratch copy of the reference kernel kept
  four ledgers side by side for every process: the reference (the clock read in C, at the
  transitions); the clock read inside the trampoline instead (right after `uservec` saves the
  registers, right after `userret` switches `satp`); one 0.1 s sample per timer interrupt on
  *every* hart, by the mode it interrupted; and the same sampling on hart 0 only. A small
  program ran each workload for 3 s of real time on three harts (seconds, one boot):

  | workload | real | in C: user / sys | in trampoline: user / sys | sampled, all harts | sampled, hart 0 only |
  |---|---|---|---|---|---|
  | spin, 3 runs | 3.000 | 2.89-2.90 / 0.10-0.11 | 2.73-2.77 / 0.23-0.27 | 2.6-2.9 / 0.1-0.4 | 2.6-2.8 / 0.1-0.4 |
  | getpid loop, 3 runs | 3.009-3.012 | 2.16-2.17 / 0.83-0.85 | 0.22 / 2.79 | 0.7-1.1 / 1.9-2.3 | 0.7-1.1 / 1.9-2.1 |
  | `pause(30)`, 2 runs | 2.930, 2.969 | 0.000 / 0.001 | 0.000 / 0.001 | 0 / 0 | 0 / 0 |
  | 3 spinners (sum), 3 runs | 3.073-3.074 | 8.64-8.68 / 0.32-0.36 | 8.19-8.24 / 0.76-0.80 | 8.1-8.5 / 0.3-0.7 | 2.5-2.8 / 0.2-0.5 |

  What it shows:

  - **Hart 0 sees one hart in three.** For three spinners, sampling on hart 0 charged 2.5 to
    2.8 s against 8.6 to 8.7 s. For a single process, it depends on where the process runs.
    In this boot the single spinners happened to stay on hart 0. Clinic 1's runs show the
    other case, `user 0 ms` for 300 ms of spinning.
  - **Sampling is coarse.** Every sampled number is a multiple of 0.1 s, and the spinner's
    sampled `sys` swings between 0.1 and 0.4 s from run to run, where the precise ledger
    says 0.10 to 0.11.
  - **Sampling is biased for system-call-heavy code.** The trampoline ledger, the truest
    of the four, says the `getpid` loop spends about 93% of its time in the kernel; sampling
    said 63 to 77%. The scratch kernel also counted the user-mode samples whose `sepc` was
    exactly the address the process had just returned to. In the three `getpid` runs that
    was **every** user-mode sample (11 of 11, 7 of 7, 9 of 9). A likely explanation (the counts
    are recorded, the mechanism is reasoned): a timer that fires while [[prepare_return]]
    and [[userret]] run with interrupts off is held pending until `sret`, taken before
    the first user instruction, and recorded as user time. QEMU delivers interrupts only
    between translated blocks, which may be why no user sample landed anywhere else.
  - **Where the boundary sits matters on QEMU.** With the clock read in C, the `getpid`
    loop is "72% user"; with it read at the real mode switch, 7%. The difference is the
    trampoline (step 5). For computing programs the two user times agree within about 6%.
  - **Sleeping costs nothing** in every ledger, as it should.

  **CPU time against real time.** `time cputest par 1000` printed `real 2.053`,
  `user 6.018`: three harts, almost three seconds of CPU per second. Three boots of
  `time usertests -q` (the first on a build that differed only in `sys_cputime`'s
  interrupts-on read; the other two on the final branch, measured while the computer was
  busy with other work; your times will differ) printed:

  ```text
  real 69.387             real 382.520            real 190.911
  user 11.640             user 9.664              user 9.810
  sys  40.088             sys  31.647             sys  30.889
  ```

  Real time varied more than fivefold. CPU time (user plus sys) varied much less: 51.7,
  41.3 and 40.7 s, about three quarters of it kernel time. `usertests` spends most of its
  real time not running at all (waiting for the disk, for its children, in `pause`), and
  how long those waits take depends on what else the computer is doing. On QEMU even CPU
  time is not clean when the computer is busy, because the guest's clock keeps running
  while the host deschedules a vCPU thread. That is why `time` prints both, and why CPU time on an
  emulator is only an approximation.
further: |
  - **Move the boundary into the trampoline.** Read `time` in [[uservec]] after the registers
    are saved and in [[userret]] after `satp` is switched, store both in spare trapframe
    slots, and charge from them. The Measure section shows what changes. Teaches what each
    trampoline instruction is for and which registers are free where.
  - **Account interrupts separately.** Read the clock at the start and end of [[devintr]]
    and keep interrupt time per hart, so that `sys` means work done for the process.
    Teaches how much of the kernel's time is not on behalf of anyone in particular.
  - **`waitx` or `getrusage`.** Return one child's times as it is reaped, or the caller's own
    and its children's separately, as Unix does. Teaches how much interface design
    hides in the choice of where totals live.
  - **A `top`.** Let a process read *other* processes' CPU time. Now the fields are no
    longer private to their owner: the reader needs `p->lock` and a consistent snapshot of
    a running process (lab 3 does the snapshot). Teaches why the private section exists.
  - **Schedule by CPU time.** Use `utime + stime` to favour processes that have used little
    CPU (lab 8's stride scheduler is one way). Teaches why accurate accounting matters
    beyond reporting.
