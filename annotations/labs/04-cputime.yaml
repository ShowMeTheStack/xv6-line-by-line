      instructions. A likely explanation, not measured instruction by instruction: QEMU emulates
      the TLB in software, and changing `satp` and fencing are expensive for it; real
      hardware has different proportions. For a program that mostly
      computes the difference is small (the spinner: 2.89 to 2.90 s against 2.73 to 2.77 s
      of user time).
