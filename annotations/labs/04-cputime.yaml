      `push_off`). gdb showed `noff` 1 and SIE 0 at this line. Clinic 5 is
      the version without it: `cputest` saw `stime` go backwards.

      `utime`, `cutime` and `cstime` need no such care. Only [[usertrap]]'s entry and
      [[kwait]] change them, and the process is in neither right now. Each division by
      `tpus` (10) turns ticks into microseconds. [[copyout]] checks the user address, as
      for `fstat`.
