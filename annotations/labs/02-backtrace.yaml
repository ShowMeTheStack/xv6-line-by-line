  case 2 stops at the top of the idle hart's `stack0` slice, after `main` and the boot-time
  return address into `start`, without reading `start`'s record.

  The rest of the kernel is unharmed, in the same boot:

  ```text
  $ usertests -q
  usertests starting
  [...]
  ALL TESTS PASSED
  ```

  `bttest` run again after `usertests` printed the same eleven addresses and
  `4 checks OK`. No other program calls `kbacktrace`, so the only cost to an ordinary
  kernel is one load of `btwant` per timer interrupt taken in the kernel.
measure: |
  **How deep are the stacks the walk climbs?** Measured with gdb on the branch (frame
  pointers at the moment `backtrace` starts, against each stack's top):

  | case | stack | top | `backtrace`'s fp | depth |
  |---|---|---|---|---|
  | 0 | `bttest`'s kernel stack | `0x3fffffa000` | `0x3fffff9f90` | 112 bytes, 3 frames |
  | 1 | the same, with a `kernelvec` frame | `0x3fffffa000` | `0x3fffff9e60` | 416 bytes (256 of them `kernelvec`'s) |
  | 2 | hart 1's slice of `stack0` | `0x800098d0` | `0x80009720` | 432 bytes |

  **How much of the 4096 bytes does real work use?** [[kalloc]] fills every page with the
  byte 5, including the 64 kernel stacks that [[proc_mapstacks]] allocates once at boot, and
  `stack0` starts out zero (QEMU's RAM is zeroed, and nothing else writes it). So after a run, the lowest byte of a stack that no longer holds
  its initial value marks the deepest point that stack ever reached (to within a few bytes,
  if a stored value happened to end in that byte). Read with gdb after one boot running
  `usertests -q` and then `bttest`, on the branch:

  - kernel stacks: all 64 slots had been used; the deepest went **1632 bytes** down
    (slots 1, 2 and 4), then 1232, 1200, 1152 and less. The same 1632 bytes were already
    reached after just booting and running `echo hi`, so `usertests -q` never went deeper
    than the shell does.
  - scheduler stacks: hart 0 **672** bytes (all of boot ran on it), hart 1 **640**, hart 2
    **767**.

  So the deepest normal path leaves about 2.4 KiB of each 4 KiB kernel stack unused, and
  the guard page is never approached. What fills a stack is recursion that should not
  happen: in clinic 2, each round of fault, `kerneltrap`, `panic` and walk took 368 bytes,
  and in the eleventh round `kerneltrap`'s frame reached the guard page.

  **What PGROUNDUP gets wrong on stack0, in numbers.** In this build the slice tops are at
  `0x...8d0`: 2256 bytes above a page boundary and 1840 bytes below the next one. A walk
  that starts in the top 2256 bytes of a slice (every scheduler-stack walk in the recorded runs of a
  healthy kernel: the deepest scheduler-stack use measured was 767 bytes) gets a bound 1840
  bytes too high and reads `start`'s record; one that starts deeper gets a bound inside the
  slice and stops early.
  Clinic 3 recorded both in one run: five walks too long, then one too short.
further: |
  - **Name the interrupted function.** When the walk meets the return address into
    `kernelvec`, the function that was interrupted is missing. Have `kernelvec` store
    `sepc` in its frame (there is room in the 256 bytes) and print it as an extra line.
    Teaches what unwind information is, and why gdb stops at `kernelvec`.
  - **Backtraces of sleeping processes on Ctrl-P.** A process that is not running has its
    frame pointer in `p->context.s0` and its return address in `p->context.ra`. Make
    [[procdump]] walk each sleeping process's kernel stack. Teaches where a suspended
    process lives ([[tour:47]]) and why the walk must take the stack's top from the process
    (`p->kstack + PGSIZE`), not from the hart.
  - **Symbols inside the kernel.** Generate a sorted table of function start addresses at
    build time (from `${TOOLPREFIX}nm`), link it into the kernel, and print names instead of
    numbers. Teaches a two-pass build and why the table's own size moves every address.
  - **A stack high-water mark.** Repeat the measurement above from inside the kernel: check
    the lowest byte still holding 5 in each kernel stack, and print it on Ctrl-P. Teaches
    stack painting and how close the kernel runs to its guard pages.
  - **A user-space backtrace on a fatal fault.** When [[usertrap]] kills a process for an
    unexpected `scause`, walk the *user* stack from `p->trapframe->s0`, using [[copyin]]
    for every load. Teaches why the kernel may never dereference a user pointer, and what
    bounds a user stack has (one page, a guard page below, [[kernel/exec.c:91]]).
