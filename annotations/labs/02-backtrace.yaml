      sp: {"on": kernel, detail: "bttest's kernel stack, KSTACK(2) = 0x3fffff9000; backtrace's s0 is 0x3fffff9f90"}
      irq: 0
    note: |
      The story of this tour is one run of `bttest` on three harts, recorded with gdb
      breakpoints on `backtrace` and on `sys_kbacktrace`. `bttest` is pid 3 in proc slot 2,
      so its kernel stack is the page at `0x3fffff9000`. Cases 0 and 1 ran on hart 2; for
      case 2 it went to sleep on hart 0, and hart 1 printed. Every address in this tour is
      from that build of the finished branch; earlier commits build to slightly different
      addresses.

      The first commit adds one accessor, next to `r_sp` and `r_ra`. C cannot name a
      register, so `r_fp` is a one-instruction [[g:inline-asm|asm statement]] that copies
      `s0` into a variable. Because it is `static inline`, the `mv` runs inside the caller,
      after the caller's prologue: in `backtrace`, it reads `backtrace`'s own frame pointer,
      `0x3fffff9f90` in case 0.

      The state shown is that moment: hart 2 in supervisor mode on `bttest`'s kernel stack,
      interrupts on (as in every system call after [[usertrap]]'s `intr_on`), no lock held.
      The walk will read only memory of this stack, so it needs no lock: nothing else writes
      a running process's kernel stack.
    others: |
      In case 0 nothing else was runnable (`init` and `sh` were waiting), so harts 0 and 1
      sat idle in [[scheduler]], each on its own slice of `stack0`. Three harts means three
      stacks in use at once, one per hart. A walk only ever reads the
      stack of the hart it runs on.
  - title: The record every prologue writes
    commit: 1
    file: Makefile
    lines: 60-72
    focus: 66
    state:
      hart: 2
      mode: S
      proc: bttest (pid 3)
      intr: "on"
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_kbacktrace, backtrace]
      sp: kernel
      irq: 0
    note: |
      Nothing in this commit changes the Makefile; this is the flag the lab depends on.
      `-fno-omit-frame-pointer` ([[g:flag-frame]]) makes every C function keep a frame
      pointer in `s0`. `backtrace`'s own prologue in this build:

      ```text
      80000834:  7179   addi  sp,sp,-48
      80000836:  f406   sd    ra,40(sp)
      80000838:  f022   sd    s0,32(sp)
      ...
      8000083e:  1800   addi  s0,sp,48
      ```

      `s0` ends up 48 bytes above the new `sp`, at the old `sp`, with the return address at
      `s0-8` and the caller's `s0` at `s0-16`. In case 0, gdb showed `sp` = `0x3fffff9f90` on
      entry, so `backtrace`'s record holds `0x80002c46` (its return address in
      `sys_kbacktrace`) at `0x3fffff9f88` and `0x3fffff9fc0` (`sys_kbacktrace`'s frame
