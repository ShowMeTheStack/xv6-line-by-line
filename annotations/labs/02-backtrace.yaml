      ```text
      bttest's kernel stack (KSTACK(2), one page)
        0x3fffffa000  top = usertrap's fp   record: ra 0x3ffffff09c, s0 0x3fd0
        0x3fffff9fe0  syscall's fp          record: ra 0x80002736, s0 0x3fffffa000
        0x3fffff9fc0  sys_kbacktrace's fp   record: ra 0x800029f2, s0 0x3fffff9fe0
