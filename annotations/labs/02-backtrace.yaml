      one had been, its saved context would have been overwritten.

      Below the last kernel stack there is nothing mapped down to `PHYSTOP`, and the
      silent traps carried `sp` all the way down (`stval=0x88000000`) into the kernel's
      direct map of RAM. Reasoning from the memory map from here on: the recursion then
      wrote downwards through physical memory; later faults at `0x87f43000` and
      `0x80008000`, addresses the kernel page table maps read-write, mean that page-table
      pages had been overwritten too; and the fault at `0x80011000` lies inside `proc[]`,
      so the stack passed through the process table.

      Logged by gdb: hart 0's `sp` was `0x80007810`, below `stack0` (`0x800078b0` in this
      copy), among the kernel's global variables, with `scause` 13 and `stval` `0x3fa8`, and
      it was spinning in [[uartputc_sync]] at line 109 with `c=115`, the `s` of yet another
      `scause=` line: the loop that runs once `panicked` is nonzero. No panic had finished
      (`panic` never returns, and every hart was still in a fault or in `acquire`), so the
      stack's own writes had set `panicked`, at `0x80007880`, which `sp` had passed. Harts 1
      and 2 were spinning in [[acquire]] on a `p->lock` (inferred: one whose memory the
      stack had overwritten), and gdb could not even read `panicked`: "Cannot access memory
      at address 0x80007880". An earlier run of the same copy, stopped earlier, had printed
      431,519 lines of output.

      The guard pages turn a stack overflow into a fault; they cannot stop a fault handler
      that itself uses the overflowing stack.
