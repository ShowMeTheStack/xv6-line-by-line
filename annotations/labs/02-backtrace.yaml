published: true
title: A kernel backtrace on panic
area: The system-call and trap path
stars: 1
branch: ext/02-backtrace
prerequisites: {tours: [5, 8, 12, 42, 44], concepts: [stacks]}
summary: |
  When this kernel panics it prints one line, such as `panic: sched locks`, and stops. The
  line names the check that failed, not the path that led to it. In this lab you add
  `backtrace()`, which prints the return address of every function on the current kernel
  call chain, and make [[panic]] call it. On the host, `addr2line` turns the addresses
  into file names and line numbers.

  The walk itself is a five-line loop over the [[g:flag-frame|frame pointers]] the compiler
  already maintains. The interesting part is where the loop must stop, and that depends on
  which stack it is walking. A process's [[g:kernel-stack]] is one page, so its top is a
  page boundary. A hart's [[g:scheduler-stack]] is a 4096-byte slice of `stack0`, which is
  only 16-byte aligned, so its top is in the middle of a page, and its top 32 bytes hold two
  frames left over from boot. And when an interrupt arrives in the middle of a call chain, [[kernelvec]]
  pushes a 256-byte [[g:kernelvec-frame]] that the walk has to step across. You will see all
  three, in real output from three [[g:hart|harts]], and you will see what goes wrong, in
  recorded runs, when the walk does not stop where it should.
learn:
  - "How a RISC-V function's prologue links its frame to its caller's: with `-fno-omit-frame-pointer`, `s0` points just above a two-word record holding the return address (at `s0-8`) and the caller's `s0` (at `s0-16`), so the frames form a linked list through the stack."
  - "What sits at the top of each kind of kernel stack: on a process's kernel stack, [[usertrap]]'s record, holding the address after `uservec`'s `jalr` (the first instruction of [[userret]]) and the *user's* `s0`; on a scheduler stack, `start`'s and `main`'s frames, never popped, with `start`'s record holding the `ra` and `s0` of power-on."
  - "Why `stack0` slices are not page-aligned, and what `PGROUNDUP(fp)` does on them: it stops the walk too late (printing `start`'s power-on record, and, without an upward check, following its `s0` of 0) or too early (cutting the chain at a page boundary in the middle of the slice). Both happen in one recorded run."
  - "What the walk sees across a trap: [[kernelvec]] saves `ra` but not `s0` and builds no record, so the chain goes from [[kerneltrap]] straight to the interrupted function's frame, and the interrupted function's own name never appears (nor its caller's, if the trap strikes in a prologue or epilogue); its address is in `sepc`."
  - "How to turn return addresses into lines with `addr2line`, and why you should look up `ra - 1`: with optimization, the instruction after a call can belong to another line, or to another block of code entirely."
  - "Why a backtrace in [[panic]] must run before `panicked` is set and must never fault: a fault inside it re-enters [[kerneltrap]], which panics again. A recorded run of a walk without bounds went down through every kernel stack below its own and their guard pages, then through the top of physical memory, before it froze."
spec: |
  **The function.** `void backtrace(void)` prints `backtrace:` and then, one per line, the
  return addresses of the current kernel call chain, newest first, in the form `printk`'s
  `%p` produces (`0x0000000080002c46`). It must stop at the top of the stack it started
  on, whichever kind of kernel stack that is, and it must never read outside that stack:
  it is about to be called from [[panic]], where a fault would start another panic.

  **panic.** [[panic]] prints its message, then the backtrace, then stops as before.

  **A way to try it from user space.** A system call `int kbacktrace(int where)` makes the
  kernel print a backtrace from one of three places:

  | `where` | where the backtrace is taken | stack it walks |
  |---|---|---|
  | 0 | inside the system call | the calling process's kernel stack |
  | 1 | in [[kerneltrap]], at the next timer interrupt that arrives while this system call is running | the same kernel stack, with a [[g:kernelvec-frame]] in the middle |
  | 2 | in [[kerneltrap]], at the next timer interrupt that some *idle* hart takes in [[scheduler]] | that hart's slice of `stack0` |

  It returns 0 when the backtrace has been printed, and -1 for any other `where` or if no
  hart took a `where 2` request within 10 ticks.

  **The test.** `bttest` calls `kbacktrace` with 0, 1, 2 and 3 and checks the return values
  (0, 0, 0, -1). It cannot read the console, so the addresses themselves are checked by eye,
  by symbolizing them on the host; its last line says so:

  ```text
  $ bttest
  bttest: from a system call, on this process's kernel stack:
  backtrace:
  0x0000000080002c46
  0x00000000800029f2
  0x0000000080002736
  bttest: kbacktrace(0) returned 0: OK
  bttest: from a timer interrupt during a system call:
  backtrace:
  ...
  bttest: kbacktrace(3) returned -1: OK
  bttest: 4 checks OK; the addresses can only be checked by symbolizing them on the host with addr2line
  ```

  `bttest N` runs only case `N`, to look at one stack at a time.

  **Constraints.** Nothing else may change: no new output from any other program, and
  `usertests -q` must still print `ALL TESTS PASSED` on three harts. Do not change the
  compiler flags; the kernel is already built with `-fno-omit-frame-pointer`.
think:
  - title: What does a function leave behind that leads to its caller?
    q: |
      To print the chain of calls that led to the current function, you need a way to get
      from a function to its caller, then to the caller's caller, and so on. When a C
      function in this kernel is called, what does it store on the stack that would let you
      do that, and where exactly? Look at a few real prologues before you answer.
    hints:
      - |
        Build the kernel and open `kernel/kernel.asm`. Read the first four or five
        instructions of `cpuid`, `usertrap` and `scheduler`. Then find the compiler flags on
        line 66 of the [[Makefile]].
      - |
        Two registers are saved by every one of those prologues: `ra`, the address to return
        to, and `s0`. Then `s0` is set from `sp`. Work out where the two saved values sit
        relative to the *new* `s0`, and whose `s0` the saved one is.
      - |
        After the prologue, `s0` points just above a two-word record: the return address at
        `s0-8` and the caller's `s0` at `s0-16`. Loading `s0-16` gives you the caller's
        record, and so on up the stack.
    answer: |
      Here is `cpuid`, in the branch's build, a function so small that it calls nothing:

      ```text
      8000199a:  1141   addi  sp,sp,-16
      8000199c:  e406   sd    ra,8(sp)
      8000199e:  e022   sd    s0,0(sp)
      800019a0:  0800   addi  s0,sp,16
      ```

      The prologue makes room, saves `ra` and the caller's `s0`, and points `s0` at the old
      `sp`. So `ra` is at `s0-8` and the caller's `s0` at `s0-16`, and the same holds for
      `usertrap` (`addi sp,sp,-32`, `sd ra,24(sp)`, `sd s0,16(sp)`, `addi s0,sp,32`) and
      every other C function in the kernel. Variadic functions differ in one detail:
      [[printk]] keeps its register save area *above* the record (`addi s0,sp,128` in a
      192-byte frame), but the record is still at `s0-8` and `s0-16`.

      The saved `s0` values link the frames into a list running up the stack, newest first.
      That list is what `-fno-omit-frame-pointer` buys ([[g:flag-frame]]; line 66 of the
      Makefile). Without it, GCC at `-O` treats `s0` as one more callee-saved register and
      keeps a variable in it; clinic 4 shows what a walk finds then.

      Notice that `cpuid` saves `ra` even though it never calls anything: with this flag every
      function, leaf or not, gets a record, so the walk never has to know which kind it is in.
    checks:
      - id: lab02-01
        level: 1
        type: number
        q: |
          `usertrap` begins `addi sp,sp,-32; sd ra,24(sp); sd s0,16(sp); sd s1,8(sp);
          sd s2,0(sp); addi s0,sp,32`. At what offset from the new `s0` is the caller's `s0`
          saved? (Write a negative number.)
        answer: -16
        wrong:
          -8: |
            You may have mixed up the two words of the record. `ra` is saved at `24(sp)`,
            which is `s0-8`; the old `s0` is at `16(sp)`, which is `s0-16`.
          16: |
            You may have read the offset from `sp` instead of from `s0`. `16(sp)` is
            correct relative to `sp`, but the walk only knows `s0`, which is `sp + 32`.
          -32: |
            You may have taken the frame size for the offset. `s0-32` is where `sp` points,
            the bottom of the frame; it holds `s2`.
        why_wrong: |
          Compute from the prologue: `s0 = sp + 32`, and the old `s0` is stored at `sp + 16`,
          so it is at `s0 - 16`.
        explain: |
          With `-fno-omit-frame-pointer`, every prologue in this kernel stores the return
          address at `s0-8` and the caller's `s0` at `s0-16`, whatever the frame size. That
          fixed layout is what makes a walk possible without knowing each function's frame.
      - id: lab02-02
        level: 2
        type: bits
        q: |
          A copy of the kernel built **without** `-fno-omit-frame-pointer` printed, from a
          backtrace taken in [[kerneltrap]], `fp 0x0000000200000120 is not on a kernel stack`:
          `s0` held some variable of `kerneltrap`'s. Decode the value as the register it
          really came from, `sstatus`.
        value: "0x200000120"
        fields:
          - label: SPP (bit 8), the mode the trap came from
            options: ["0: user", "1: supervisor"]
            answer: "1: supervisor"
            why: You may have missed bit 8. `0x120` is `0x100 + 0x20`, so bit 8 is set; the trap came from supervisor mode, as every trap into kerneltrap does.
          - label: SPIE (bit 5), SIE before the trap
            options: ["0", "1"]
            answer: "1"
            why: You may have read the wrong nibble. `0x20` is bit 5, so SPIE is 1. Interrupts were on when the timer interrupt arrived, which is why it could arrive.
          - label: SIE (bit 1), interrupts now
            options: ["0", "1"]
            answer: "0"
            why: You may have expected interrupts to be on in a handler. Taking a trap clears SIE, and kerneltrap checks that it is still clear.
          - label: UXL (bits 32-33)
            options: ["0", "1", "2", "3"]
            answer: "2"
            why: You may have overlooked the high word. `0x2_0000_0000` is 2 in bits 32-33, meaning user mode is 64-bit.
        explain: |
          `kerneltrap` keeps `sstatus` in a callee-saved register so it can restore it at
          the end ([[kernel/trap.c:163]]); without frame pointers the compiler picked `s0`.
          So "the frame pointer" was just `sstatus`. The flag is not a detail: without it there
          is no chain to walk.
  - title: How does C code get hold of the first link?
    q: |
      The walk starts from the current function's frame pointer. C has no way to name a
      register. How will your walker read `s0`, and whose frame pointer will it get? Would
      reading `sp` do as well?
    hints:
      - |
        [[kernel/riscv.h]] already has a dozen two-line functions that each read one
        register. Look at the ones for `sp` and `tp`, and at how they are declared.
      - |
        A `static inline` function's body is copied into its caller, so an `asm` statement in
        it runs in the caller's frame. And `sp` is the *bottom* of the current frame, where
        nothing is stored at a fixed offset.
      - |
        One more `static inline` accessor beside `r_sp`, for the other register, called
        first thing in the walker. Then ask whose record the first iteration prints.
    answer: |
      Add `r_fp()` to [[kernel/riscv.h]], next to `r_sp` and `r_ra`: one `mv %0, s0`
      instruction in a `static inline` function. Because it is inlined, the instruction runs
      inside `backtrace` itself, after `backtrace`'s prologue has set `s0`, so the value is
      `backtrace`'s frame pointer. The first line printed is then the return address saved by
      `backtrace`'s own prologue: the place in the caller where `backtrace()` was called,
      which is exactly where you want the list to start. (GCC's
      `__builtin_frame_address(0)` gives the same value.)

      `sp` will not do. It points at the bottom of `backtrace`'s frame, below which there is
      only memory that calls *from* `backtrace` will use. A copy of the branch with
      `r_sp()` in place of `r_fp()` printed one line, `0x0000000000000017`, for each of
      the three cases, and stopped. That is not a code address: the call
      `printk("backtrace:\n")` had just written `printk`'s varargs save area right below
      `backtrace`'s frame, so `*(sp-8)` was `printk`'s saved copy of `a7`.
    checks:
      - id: lab02-03
        level: 2
        type: choice
        q: |
          Why is the register reader declared `static inline` rather than as an ordinary
          function in some `.c` file?
        options:
          - text: So that its `mv` runs in the caller's frame and reads the caller's `s0`.
            correct: true
            why: |
              An inlined body has no prologue of its own. As an ordinary function it would get
              a prologue that sets `s0` to *its* frame, and the walk would start one frame
              too deep (harmless here, but no longer what the name says).
          - text: Because `asm` statements are only allowed in header files.
            why: |
              You may have generalized from where xv6 happens to put them. `asm` works in any
              C file; `kernelvec` and `swtch` are separate `.S` files for other reasons.
          - text: Because an ordinary function call would overwrite `s0` with `sp`.
            why: |
              You may have half-remembered the prologue. A call saves `s0` and then points it
              at the new frame; the caller's value is not lost, it is one record up.
          - text: To make it faster; the value is the same either way.
            why: |
              You may have thought inlining never changes behaviour. For code that reads the
              frame pointer it does: the value depends on whose frame is current.
        explain: |
          Reading a register from C means one `asm` instruction, and whose register value you
          get depends on which function's code it runs in. `static inline` puts it in the
          caller. See the other accessors in [[kernel/riscv.h]] and [[g:inline-asm]].
  - title: Where does the chain end on a process's kernel stack?
    q: |
      Start from a system-call handler and follow the saved frame pointers up. Every record
      leads to the caller's record, until you reach the outermost frame of the kernel stack.
      What is stored in *that* frame's record, and what happens if the walk follows it?
      How will the walker know where to stop?
    hints:
      - |
        Who calls [[usertrap]], and how? Read [[kernel/trampoline.S:76]] to
        [[kernel/trampoline.S:98]]. Then read how kernel stacks are placed: `KSTACK` in
        [[kernel/memlayout.h]] and [[proc_mapstacks]].
      - |
        `uservec` enters `usertrap` with `jalr t0` and never sets `s0`, so `usertrap`'s
        prologue saves a return address into the trampoline and whatever `s0` the *user
        program* had. The kernel stack is exactly one page, at a page-aligned address, and
        `usertrap`'s frame pointer is its top.
      - |
        Compute the top once, from the first `fp`, as the next page boundary above it, and
        stop as soon as `fp` reaches it. As a second guard, stop if a saved frame pointer is
        not above the current one: callers' frames are always higher.
    answer: |
      `bttest`'s kernel stack, read with gdb at the moment of its first backtrace (pid 3,
      slot 2, `KSTACK(2)` = `0x3fffff9000`):

      | frame pointer | function | its record: return address | saved `s0` |
      |---|---|---|---|
      | `0x3fffffa000` | `usertrap` | `0x3ffffff09c` (after `uservec`'s `jalr`) | `0x3fd0` (the user's) |
      | `0x3fffff9fe0` | `syscall` | `0x80002736` (in `usertrap`) | `0x3fffffa000` |
      | `0x3fffff9fc0` | `sys_kbacktrace` | `0x800029f2` (in `syscall`) | `0x3fffff9fe0` |
      | `0x3fffff9f90` | `backtrace` | `0x80002c46` (in `sys_kbacktrace`) | `0x3fffff9fc0` |

      `usertrap` was not called by a kernel function. [[uservec]] loaded `sp` with the empty
      stack's top ([[kernel/trampoline.S:76]]) and jumped with `jalr t0`
      ([[kernel/trampoline.S:98]]), so `usertrap`'s record holds the address after that
      `jalr` (the trampoline page is mapped at `0x3ffffff000`) and the user program's own
      frame pointer, `0x3fd0`, a user virtual address. Following it means loading from
      `0x3fc8` with the kernel page table installed, which maps nothing there: a load page
      fault in the kernel, and [[kerneltrap]] panics (clinic 2).

      So the walk must stop *at* `usertrap`'s frame, without printing its record. Its frame
      pointer equals the top of the stack, and the top is easy to compute: kernel stacks are
      exactly one page at page-aligned addresses, so for any `fp` strictly inside one, the
      top is `PGROUNDUP(fp)`, here `0x3fffffa000`. The loop runs `while (fp < top)`; the
      `usertrap` line still appears, because `syscall`'s record holds the return address
      into `usertrap`.

      The second guard, "a saved `fp` must be higher than the current one", costs one
      comparison and protects against a corrupted chain, which is exactly what you may be
      walking in a panic. Clinic 1 shows it catching a real mistake.
    checks:
      - id: lab02-04
        level: 1
        type: number
        q: |
          The walk starts with `fp = 0x3fffff9f90` on a process's kernel stack. What is
          `PGROUNDUP(fp)`, the address where it stops? (Hex is fine.)
        answer: "0x3fffffa000"
        wrong:
          "0x3fffff9000": |
            You may have rounded down. `0x3fffff9000` is the *bottom* of this kernel stack
            (`PGROUNDDOWN`); the stack grows down from the top.
          "0x3fffff9f90": |
            You may have thought `PGROUNDUP` of an address inside a page is the address
            itself. Only an address already on a page boundary rounds to itself.
          "0x3ffffff000": |
            You may have jumped to `TRAMPOLINE`. The next page boundary above
            `0x3fffff9f90` is `0x3fffffa000`.
        why_wrong: |
          Round up to the next multiple of 4096 (`0x1000`): clear the low 12 bits and add
          `0x1000`, unless they were already zero.
        explain: |
          A kernel stack is one 4096-byte page at a page-aligned address ([[proc_mapstacks]]),
          so the next page boundary above any address inside it is its top, here
          `KSTACK(2) + PGSIZE`. That is also `usertrap`'s frame pointer.
      - id: lab02-05
        level: 2
        type: tf
        q: |
          True or false: the record of `usertrap`'s frame, the outermost one on a process's
          kernel stack, holds a saved frame pointer that points to another frame on the same
          kernel stack.
        answer: false
        why_tf: |
          You may have assumed that every function was called by another kernel function.
          `usertrap` is entered from the trampoline, which does not maintain `s0`.
        reasons:
          - text: "False: it holds the user program's s0, because uservec never sets s0 before it jumps to usertrap."
            correct: true
            why: That is the reason. In the recorded run it was `0x3fd0`, an address in `bttest`'s user stack.
          - text: "False: it holds 0, because uservec clears s0 for safety."
            why: You may have expected the kernel to sanitize registers. uservec saves the user's registers in the trapframe but leaves `s0` itself as it was.
          - text: "True: uservec builds a frame record before it calls usertrap."
            why: You may have thought the trampoline is ordinary compiled code. It is hand-written assembly that uses no stack at all until usertrap.
          - text: "True: the kernel stack always holds the frames of the previous system call underneath."
            why: You may have thought kernel stacks keep old frames. Every entry from user space starts on an empty kernel stack; `kernel_sp` is always the top.
        explain: |
          The user/kernel boundary is also the boundary of the frame chain. Above `usertrap`
          there is no kernel frame, so the walk must stop at the top of the stack rather than
          wait for the chain to end. See [[concept:stacks#kernel]].
  - title: How do you turn the printed numbers into names?
    q: |
      The walk prints numbers like `0x0000000080002736`. The running kernel has no symbol
      table to look them up in. How do you find the function and line for each one, and is
      the line you get the line of the call?
    hints:
      - |
        `kernel/kernel` is an [[g:elf]] file built with `-ggdb`: it carries a symbol table and
        line information. The cross toolchain has a tool that maps addresses to lines.
      - |
        A return address is the address of the instruction *after* the call. With
        optimization, that instruction can belong to the next line, or to a different block
        of code altogether when the called function never returns.
      - |
        Run `${TOOLPREFIX}addr2line -e kernel/kernel -f -p ADDR` on each address, and once
        more on `ADDR - 1`, which lands inside the call instruction itself. `TOOLPREFIX` is
        your RISC-V toolchain's prefix, the same one xv6's Makefile detects
        (`riscv64-unknown-elf-`, `riscv64-linux-gnu-` or `riscv64-elf-`); set it with
        `export TOOLPREFIX=riscv64-unknown-elf-` or whichever you have. On
        Debian/Ubuntu/WSL, `gdb-multiarch` also works as the debugger.
    answer: |
      On the host:

      ```text
      $ ${TOOLPREFIX}addr2line -e kernel/kernel -f -p 0x80002735
      usertrap at ./kernel/trap.c:75
      ```

      Asking for `ADDR - 1` matters. Here are the five distinct addresses that cases 0 and 1
      of `bttest` printed, looked up both ways:

      | printed | `addr2line ADDR` | `addr2line ADDR-1` |
      |---|---|---|
      | `0x80002c46` | `sys_kbacktrace` sysproc.c:129 | `sys_kbacktrace` sysproc.c:128 |
      | `0x800029f2` | `syscall` syscall.c:148 | `syscall` syscall.c:148 |
      | `0x80002736` | `usertrap` trap.c:88 | `usertrap` trap.c:75 |
      | `0x80002862` | `kerneltrap` trap.c:170 | `kerneltrap` trap.c:169 |
      | `0x800057e8` | `kernelvec` kernelvec.S:41 | `kernelvec` kernelvec.S:38 |

      The right column is the line of each call. The left one is wrong four times out of
      five: with `-O` the instruction after a call often belongs to the next statement
      (`usertrap`'s return address lands on line 88, the `killed(p)` check after the `if`).
      It can be much worse in a function that never returns from a call; think question 6
      meets such a case. `ADDR - 1` is always inside the call instruction (4 bytes for
      `jal`, 2 for the compressed `c.jalr`), so it always names the call. `gdb` does the same
      when it prints caller frames.

      One address will not resolve: `0x3ffffff09c`, the address after `uservec`'s `jalr t0`
      ([[kernel/trampoline.S:98]]), if you ever print it. The trampoline is *linked* at
      `0x80006000` but runs at `TRAMPOLINE` (`0x3ffffff000`). Even `0x8000609c` gives only
      `userret at ??:?`: it is [[userret]]'s first instruction, and the trampoline has no
      line information.
    checks:
      - id: lab02-13
        level: 1
        type: choice
        q: |
          Case 0 printed `0x0000000080002736`. `${TOOLPREFIX}addr2line -e kernel/kernel -f -p
          0x80002736` says `usertrap at ./kernel/trap.c:88`, the `if (killed(p))` after the
          system call. Which line actually made the call that this address returns from?
        options:
          - text: "trap.c:75, the `syscall()` call; `addr2line` on `0x80002735` names it."
            correct: true
            why: |
              A return address is the instruction *after* the call. One byte back is inside
              the `jal`, so it maps to the line of the call.
          - text: "trap.c:88; the backtrace shows where `usertrap` was when it was interrupted."
            why: |
              You may have read a backtrace line as "where the hart is". Each line is a
              place to return to; `usertrap` is waiting for `syscall()` to return.
          - text: "trap.c:87, because a return address is always exactly one line after the call."
            why: |
              You may have expected a fixed offset in lines. The next instruction can belong
              to any line the compiler laid out next; only the address minus one is reliable.
          - text: "None: `addr2line` cannot map kernel addresses, only user ones."
            why: |
              You may have thought the kernel has no debug information. `kernel/kernel` is
              built with `-ggdb`, and `addr2line` reads its line table on the host.
        explain: |
          Look up `ra - 1`. A return address points after the call; with `-O` that
          instruction often belongs to the next statement.
  - title: What does the walk see across a trap?
    q: |
      Suppose a timer interrupt arrives while some system-call handler `f` is running in the
      kernel, and the walk starts inside the interrupt handler. [[kernelvec]] pushes 256
      bytes onto the same stack and calls [[kerneltrap]]. Which return addresses will the
      walk print, and which function on the path will not appear at all?
    hints:
      - |
        Read [[kernel/kernelvec.S:14]] to [[kernel/kernelvec.S:38]]: which registers does
        `kernelvec` save, does it touch `s0`, and does it create a frame record?
      - |
        `s0` is callee-saved, so `kernelvec` leaves it alone: when `kerneltrap`'s prologue
        saves "the caller's `s0`", it saves `f`'s frame pointer. And `kerneltrap`'s return
        address points into `kernelvec`.
      - |
        The walk goes from `kerneltrap`'s record (return address in `kernelvec`) straight
        to `f`'s record, whose return address is in `f`'s *caller*. Nothing records where in
        `f` the interrupt struck; that is `sepc`.
    answer: |
      `kernelvec` saves `ra`, `gp`, the `t` and `a` registers, and leaves `sp`, `tp` and the
      callee-saved `s` registers alone ([[kernel/kernelvec.S:17]] to
      [[kernel/kernelvec.S:35]]). It builds no record. So the 256 bytes are invisible to the
      walk: `kerneltrap`'s saved `s0` is the interrupted function's frame pointer, and the
      chain goes on through `f`'s frame as if `kerneltrap` had been called from inside `f`.
      (That holds once `f`'s prologue has set `s0` and before its epilogue reloads it. If the
      trap strikes inside `f`'s prologue or epilogue, `s0` still holds the caller's frame
      pointer, and the caller is missing as well; a stack-overflow fault, for example, lands
      in a prologue.)

      The recorded case 1, `sys_kbacktrace` spinning with interrupts on and the timer firing
      on hart 2:

      | frame pointer | function | return address in its record | saved `s0` |
      |---|---|---|---|
      | `0x3fffff9fe0` | `syscall` | `0x80002736` (`usertrap`) | `0x3fffffa000` |
      | `0x3fffff9fc0` | `sys_kbacktrace` | `0x800029f2` (`syscall`) | `0x3fffff9fe0` |
      | | `kernelvec`'s 256 bytes, `0x3fffff9e90` to `0x3fffff9f90` | no record | |
      | `0x3fffff9e90` | `kerneltrap` | `0x800057e8` (`kernelvec`) | `0x3fffff9fc0` |
      | `0x3fffff9e60` | `backtrace` | `0x80002862` (`kerneltrap`) | `0x3fffff9e90` |

      The console showed `kerneltrap`, `kernelvec`, `syscall`, `usertrap`. Each line names
      the *caller* of a frame, so `sys_kbacktrace`, the function that was interrupted, never
      appears: no record holds an address inside it. Its address is in `sepc`
      (`0x80002c64`, the spin loop on line 135 of `sysproc.c`), which `kerneltrap` keeps in
      a register. When a fault (not an interrupt) panics through [[kerneltrap]], the
      `scause=... sepc=...` line it prints first is the only place the faulting function is
      named.

      gdb's own `bt` does worse here: it stops at `kernelvec` with "Backtrace stopped: frame
      did not save the PC", because `kernelvec` has no unwind information. The frame-pointer
      walk crosses the trap only because `kernelvec` leaves `s0` untouched.
    checks:
      - id: lab02-07
        level: 2
        type: order
        q: |
          In case 1, a timer interrupt hits `sys_kbacktrace`'s spin loop and `kerneltrap`
          calls `backtrace()`. Put the functions named by the printed lines in the order they
          are printed.
        items:
          - kerneltrap
          - kernelvec
          - syscall
          - usertrap
        why_wrong: |
          You may have listed callees instead of callers, or put `sys_kbacktrace` in. The
          first line is the return address in `backtrace`'s own record, which is in
          `kerneltrap`; each later line is one caller further out. `sys_kbacktrace` is the
          interrupted function and no record points into it.
        explain: |
          The printed lines are return addresses, newest first: kerneltrap (where it called
          backtrace), kernelvec (where it called kerneltrap), then the interrupted function's
          record, which points into syscall, then syscall's, which points into usertrap.
      - id: lab02-08
        level: 3
        type: choice
        q: |
          Why can the frame-pointer walk continue past `kernelvec` at all, when `kernelvec`
          builds no frame record?
        options:
          - text: kernelvec never changes s0, so kerneltrap's prologue saves the interrupted function's frame pointer as "the caller's".
            correct: true
            why: |
              Callee-saved registers survive the trap untouched; the chain is linked through
              them, not through anything kernelvec stores. (If the trap strikes in a prologue
              or epilogue, `s0` is still the caller's, and one more frame goes missing.)
          - text: kernelvec saves s0 at a fixed offset in its 256-byte frame, and the walk reads it from there.
            why: |
              You may have expected a trap entry to save everything. kernelvec saves only the
              caller-saved registers plus `ra` and `gp`; the `sd s0` line does not exist, and
              the walk never looks inside the 256 bytes.
          - text: kerneltrap reads sepc and links the interrupted function into the chain.
            why: |
              You may have thought the handler repairs the chain. kerneltrap only reads sepc
              to restore it later; nothing writes it into a record.
          - text: It cannot; the walk stops at kernelvec, just like gdb's bt.
            why: |
              You may have generalized from gdb. gdb unwinds with debug information, which
              kernelvec lacks; the frame-pointer walk needs none and went on to `syscall` and
              `usertrap` in the recorded run.
        explain: |
          A trap that saves only caller-saved registers is transparent to a frame-pointer
          walk: the interrupted function's frame pointer is still in `s0` when the handler's
          prologue saves it. What the walk loses is the interrupted *pc*, which only `sepc`
          holds. See [[g:kernelvec-frame]] and [[concept:stacks#same]].
  - title: Where is the top of a scheduler stack?
    q: |
      The same walk must work when the interrupted code is the [[scheduler]] loop on an idle
      hart. That stack is not a process's kernel stack: it is the hart's slice of `stack0`,
      the same memory it booted on. Is "the next page boundary above `fp`" still its top? If
      not, what happens when the walk uses it, and how should the walker find the real top?
    hints:
      - |
        Read the declaration of `stack0` ([[kernel/start.c:11]]) and how `sp` is set from
        it ([[kernel/entry.S:12]] to [[kernel/entry.S:17]]). Then look up `stack0` in
        `kernel/kernel.sym`. What is at the very top of a slice ([[concept:stacks#boot]])?
      - |
        `stack0` is aligned to 16 bytes, not 4096, and each slice is 4096 bytes, so slice
        *h* ends at `stack0 + 4096 * (h + 1)`, in the middle of a page. Above `scheduler`'s
        frame sit `main`'s and `start`'s, and `start`'s record holds the `ra` and `s0` the
        hart had at power-on.
      - |
        Decide by address which kind of stack `fp` is on. Inside `stack0`: compute the
        slice's top from `stack0`'s address. Inside the kernel-stack area: next page
        boundary. Anywhere else: print a warning and do not walk.
    answer: |
      In the unmodified kernel `stack0` is at `0x80007890`; in this branch's build, at
      `0x800078d0`. So in this build the three slices in use end at `0x800088d0`,
      `0x800098d0` and `0x8000a8d0` (`...890` in the unmodified one), none of them on a page
      boundary. On hart 1, recorded with gdb during case 2:

      | frame pointer | function | return address | saved `s0` |
      |---|---|---|---|
      | `0x800098d0` (the slice's top) | `start` | `0x8000001a` (`spin` in [[_entry]]) | `0x0` (power-on) |
      | `0x800098c0` | `main` | `0x800000c2` (in `start`) | `0x800098d0` |
      | `0x800098b0` | `scheduler` | `0x80000f66` (in `main`) | `0x800098c0` |
      | | `kernelvec`'s 256 bytes | | |
      | `0x80009750` | `kerneltrap` | `0x800057e8` | `0x800098b0` |
      | `0x80009720` | `backtrace` | `0x80002862` | `0x80009750` |

      `PGROUNDUP(0x80009720)` is `0x8000a000`, 1840 bytes above the real top. A walk bounded
      by it does not stop at `start`'s frame: it prints `start`'s return address
      `0x8000001a` (`spin`), a line that describes no call. The upward check then stops at
      the saved `s0` of 0 (a copy of the branch with only this bound changed printed exactly
      that extra line, three runs out of three). A loop without that check (clinic 3)
      follows 0 and loads from `0xfffffffffffffff8`, a kernel page fault. And the opposite
      error is just as real: the page boundary `0x80009000` lies
      2256 bytes below the top, so a walk that *starts* deeper than that computes
      `0x80009000` as the top and stops in the middle of the chain. Clinic 3 has a single
      recorded run that does both.

      The fix is to know the layout: `stacktop(fp)` checks whether `fp` is inside `stack0`
      (`base + (fp - base) / 4096 * 4096 + 4096`), inside the 64 kernel stacks
      (`PGROUNDUP`), or neither (return 0, and `backtrace` prints `fp ... is not on a kernel
      stack` instead of walking). The starting `fp` is always strictly inside its slice,
      because `backtrace` is called by a function with a frame of its own, so the division
      picks the right slice.

      Symbolizing this chain (think question 4) holds one more trap: `0x80000f66` gives
      `main.c:14` (`consoleinit()`) as printed, `main.c:44` minus one. `main` calls
      [[scheduler]] on line 44 as its very last action, and the compiler placed the code of
      the `cpuid() == 0` branch right after that call, so the return address lands there.

      `main`'s record is worth a second look. `start` never *called* `main`; it reached it
      with `mret` ([[kernel/start.c:51]]). `main`'s prologue saved whatever was in `ra` at
      that moment: the return address of `start`'s call to `timerinit` on line 44, a fossil
      from boot that every scheduler-stack backtrace prints (`0x800000c2` looks up as the
      inlined `r_mhartid` as printed, `start.c:44` minus one).
    checks:
      - id: lab02-06
        level: 2
        type: choice
        q: |
          A backtrace contains `0x0000000080000f66`, and `addr2line` reports
          `main at ./kernel/main.c:14`, the line `consoleinit();`. Yet the stack belongs to
          a hart that has been in the scheduler for minutes. What is going on?
        options:
          - text: The address is the return address after main's call to scheduler; the compiler placed other code of main right after that call.
            correct: true
            why: |
              `scheduler()` never returns, so nothing after the `jal` on line 44 ever runs on
              that path, and the compiler put the code of the `cpuid() == 0` branch there.
              `addr2line 0x80000f65` says main.c:44.
          - text: The hart is still in consoleinit, which never finished.
            why: |
              You may have taken the line as "where the hart is". A backtrace line names a
              place to *return* to; this hart is far past `consoleinit`, which returned
              during boot.
          - text: The walk read a stale value left on the stack by consoleinit during boot.
            why: |
              You may have suspected the walk. The value is the live return address in
              `scheduler`'s record; only its line attribution is off.
          - text: addr2line is reading the wrong kernel file.
            why: |
              You may have suspected the tool. With the wrong ELF you would usually get
              nonsense or `??`; here the function is right and only the line is off by the
              layout of the code.
        explain: |
          A return address points *after* the call. Look up `ra - 1` to get the call itself.
          The effect is largest exactly where a backtrace often ends: in functions that never
          return, like `main` calling `scheduler`.
      - id: lab02-09
        level: 2
        type: number
        q: |
          In the unmodified kernel `stack0` is at `0x80007890` and each hart's slice is 4096
          bytes. What is the address of the top of hart 2's slice, where `_entry` points
          hart 2's first `sp`? (Hex is fine.)
        answer: "0x8000a890"
        wrong:
          "0x8000b000": |
            You may have rounded up to a page boundary. That is `PGROUNDUP` of an address in
            hart 2's slice, which is exactly the mistake this question is about: the slice
            ends `0x770` bytes earlier.
          "0x80009890": |
            You may have forgotten the `+ 1` in `(hartid + 1) * 4096`. `0x80009890` is the
            top of hart 1's slice and the bottom of hart 2's.
          "0x8000a000": |
            You may have assumed the slices are page-aligned. `stack0` is only 16-byte
            aligned, so every slice boundary is `0x890` past a page boundary.
        why_wrong: |
          Compute `stack0 + (2 + 1) * 4096 = 0x80007890 + 0x3000`.
        explain: |
          `_entry` sets `sp = stack0 + (hartid + 1) * 4096` ([[kernel/entry.S:17]]). The
          alignment of `stack0` is 16 ([[kernel/start.c:11]]), so none of these tops is a
          page boundary, and `PGROUNDUP` cannot find them.
      - id: lab02-10
        level: 2
        type: state
        q: |
          Case 2: an idle hart takes a timer interrupt in the scheduler loop's `intr_on();
          intr_off();` window, and `kerneltrap` calls `backtrace()`. Fill in the machine
          state on that hart as `backtrace` starts.
        state: {mode: S, stack: scheduler, satp: kernel, sie: "off", noff: "0", intena: "-"}
        why:
          mode: You may have thought the scheduler runs in machine mode because it started on the boot stack. After start's mret, the kernel runs in supervisor mode.
          stack: You may have expected an interrupt stack or a process's kernel stack. xv6 has neither for this case; kernelvec pushed its frame onto the scheduler stack the hart was already on.
          satp: You may have thought paging is off on stack0. main turned paging on long ago; stack0 is reached through the kernel page table's direct map.
          sie: You may have thought the interrupt left interrupts on. Taking a trap clears SIE, and kerneltrap panics if it finds it set.
          noff: You may have thought the scheduler holds a lock here. In the intr_on/intr_off window it holds none; that is why an interrupt can be taken there at all.
          intena: With noff 0 there is no saved interrupt state to report.
        why_wrong: |
          Ask the three questions of [[concept:mode-stack-page-table]], then whether a lock is
          held. The recorded run (hart 1) had `noff` 0 and SIE 0.
        explain: |
          Supervisor mode, the hart's slice of `stack0`, the kernel page table, interrupts off,
          no lock: the scheduler stack with a [[g:kernelvec-frame]] on top
          ([[concept:stacks#scheduler]]). `kerneltrap` will not [[yield]], because
          `myproc()` is 0.
  - title: How can a user program make the kernel walk from each place?
    q: |
      To test the walk you want a backtrace (a) from inside a system call, (b) from the
      interrupt handler while a system call is the interrupted code, and (c) from the
      interrupt handler on an idle hart's scheduler stack. (a) is a system call that calls
      the walker. Design (b) and (c): how does the interrupt handler know it should print,
      how do you make sure exactly one hart prints, and when may the system call return?
    hints:
      - |
        Timer interrupts in the kernel all reach [[kerneltrap]]. What tells it whether a
        process was interrupted ([[myproc]])? Are interrupts on while a system call runs
        ([[kernel/trap.c:66]])?
      - |
        One shared variable can carry the request. For (b) only the requesting process can
        match it, and it runs on one hart. For (c) *any* idle hart can match it, and the
        timers of idle harts fire at nearly the same moment. And the requester must not
        return, and print its own next line, while another hart is still printing.
      - |
        One shared request word with more than two states. Decide who may change it from
        which state to which, and with what kind of operation; then decide, for (b) and (c)
        separately, whether the requester should spin or sleep while it waits, and what it
        does if nobody ever answers.
    answer: |
      The branch adds `kbacktrace(where)` and one variable in `trap.c`:

      - **(b)** `sys_kbacktrace` stores its pid in `btwant` and spins `while (btwant != 0)`.
        Interrupts are on during a system call, so the next timer interrupt on that hart
        lands in the loop, and `kerneltrap` sees its own process's pid. No other hart runs
        that process, so only one hart can match.
      - **(c)** `sys_kbacktrace` stores -1 and sleeps on `ticks`, as [[sys_pause]] does,
        until `btwant` is 0 again. While it sleeps, its own hart goes idle too. Every idle
        hart's timer interrupt reaches `kerneltrap` with `myproc() == 0`, and all of them
        can match -1.
      - **Exactly one hart.** Idle harts' timers are not staggered: clinic 6 recorded all
        three idle harts in `kerneltrap` within the same instant. A plain
        `if (btwant == -1) { btwant = 0; ... }` lets two of them pass the test before either
        clears it. `__sync_bool_compare_and_swap(&btwant, want, -2)` is a single atomic
        step (an `lr.w`/`sc.w` loop on RISC-V), so exactly one hart wins.
      - **Clear only after printing.** The winner sets -2 ("printing"), prints, and only
        then sets 0. Clearing the request first is a real bug: hart 0's
        timer interrupt runs [[clockintr]], which wakes everything sleeping on `ticks` before
        `kerneltrap` gets to the backtrace, so (reasoning from the code) when hart 0 won,
        the woken `bttest` could run on another hart and print in the middle; the log does
        not show which hart printed. A recorded run of a version that cleared first (which also
        had clinic 2's bug) printed `b0x0000000080005768` and then
        `ttest: kbacktrace(2) returned 0: OK` a few lines later.
      - **Withdraw.** If no hart has taken the request after 10 ticks, the system call takes
        it back with another compare-and-swap (-1 to 0) and returns -1; if a hart took it in
        the meantime, the swap fails and the call keeps waiting for the print to finish.

      None of this is needed for [[panic]], which calls the walker directly. It exists so
      that `bttest` can show all three stacks on a healthy kernel.
    checks:
      - id: lab02-11
        level: 3
        type: multi
        q: |
          Which statements about the request variable `btwant` in the reference are true?
        options:
          - text: Without the compare-and-swap, two idle harts could both print a backtrace for one case-2 request.
            correct: true
            why: Both can read -1 before either writes 0; the timers of idle harts fire at nearly the same time.
          - text: Case 1 would be correct even with a plain test and clear, because only the requesting process can match its own pid.
            correct: true
            why: The pid is matched only on the hart running that process, and that process is the interrupted code, so nothing else can race for it.
          - text: The value -2 exists so that the requester keeps waiting while the winner prints.
            correct: true
            why: The requester waits for 0. If the winner wrote 0 before printing, the requester could return and print in the middle of the backtrace.
          - text: btwant must be protected by tickslock, because kerneltrap reads it in an interrupt handler.
            why: |
              You may have thought every shared variable needs a spinlock. Here one atomic
              compare-and-swap does the whole test-and-set, and kerneltrap never takes
              tickslock for it.
          - text: The compare-and-swap also makes the backtrace lines of two harts come out whole.
            why: |
              You may have confused two guarantees. Whole lines come from `pr.lock` in printk;
              the swap only decides *who* prints.
        explain: |
          A test followed by a write is two steps; between them another hart can take the
          same test. An atomic compare-and-swap makes it one step. The request then has
          three states, none, requested and printing, so that the requester can wait for the
          end of the print. See [[g:atomic]] and [[concept:locks#amoswap]].
  - title: What must panic do, and in what order?
    q: |
      Now make [[panic]] print a backtrace. Where in `panic` does the call go, and what must
      the walker itself never do when it is called from there?
    hints:
      - |
        Read [[panic]] and [[uartputc_sync]] ([[kernel/uart.c:103]]): what do `panicking`
        and `panicked` change, and for which harts?
      - |
        `panicked` makes the next character printed by *any* hart spin forever, including
        the panicking hart's. And a fault inside the walker is a trap from the kernel, which
        goes to [[kerneltrap]], which calls `panic` again.
      - |
        Which of the two flags must still be clear while the walk prints, and which may
        already be set? And which of the guards you built earlier make sure the walk itself
        cannot trap?
    answer: |
      ```c
      panicking = 1;
      printk("panic: ");
      printk("%s\n", s);
      backtrace(); // before panicked, which would freeze this hart's output too
      panicked = 1;
      ```

      **Before `panicked`.** [[uartputc_sync]] spins forever once `panicked` is set
      ([[kernel/uart.c:108]]), on every hart: the flag does not know who set it. A copy of
      the branch with the two lines swapped printed `panic: sched locks` and then nothing,
      ever (clinic 5's bug used as the trigger).

      **After `panicking`.** While `panicking` is set, [[printk]] takes no lock
      ([[kernel/printk.c:70]]). So a panic on a hart that already holds `pr.lock` still gets
      its backtrace out, but two harts panicking at once interleave character by character:
      clinic 6 shows exactly that.

      **Never fault.** A fault inside the walk enters [[kerneltrap]], which prints
      `scause=...` and calls `panic` again, which walks again, from a deeper point on the same
      stack, through the same bad link. Clinics 2 and 3 show where that recursion goes. With
      the bounds, every load is at `fp - 8` or `fp - 16` for an `fp` at or above the first
      frame pointer and below the stack's top: inside the one stack the walk started on,
      which is always mapped. And the upward check makes even a corrupted chain end.
    checks:
      - id: lab02-12
        level: 2
        type: tf
        q: |
          True or false: if `backtrace()` were called after `panicked = 1`, it would still
          print, because `panicked` is meant to freeze the *other* harts' output.
        answer: false
        why_tf: |
          You may have trusted the comment "freeze uart output from other CPUs". The check in
          uartputc_sync does not compare harts.
        reasons:
          - text: "False: uartputc_sync spins forever for any hart once panicked is set, including the one that set it."
            correct: true
            why: That is the reason; the recorded run of that order printed the panic message and nothing after it.
          - text: "False: panicked turns interrupts off, and printing needs interrupts."
            why: You may have thought console output is interrupt-driven. printk writes each character with uartputc_sync, which polls the UART's status register and does not use interrupts at all.
          - text: "True: panicked only takes effect on harts that try to acquire pr.lock."
            why: You may have mixed up the two flags. panicking makes printk skip pr.lock; panicked stops every character.
          - text: "True: the panicking hart has already printed its message, so the flag is checked only once."
            why: You may have thought the flag is checked at the start of printk. It is checked before every single character.
        explain: |
          `panicked` exists so that other harts cannot scribble over the panic report. Since
          the check is in the character output routine, anything the panicking hart wants to
          print must come before it sets the flag.
build: |
  **Start** from the frozen commit, in your own clone of xv6 (not this site's `xv6/`):

  ```text
  git checkout -b my-backtrace 06aad25
  ```

  **Milestones.**

  1. **Read `s0`.** Add `r_fp()` to `kernel/riscv.h`. Nothing uses it yet; `make` must
     still build (`-Werror` is on, so an unused `static inline` is fine but an unused
     `static` function is not).
  2. **The walk, for kernel stacks.** `backtrace()` in `kernel/printk.c`, bounded by
     `PGROUNDUP` of the first `fp`, with the "saved `fp` must be higher" check, and its
     prototype in `kernel/defs.h`. Nothing calls it yet; milestone 3 is its first test.
  3. **A system call.** `kbacktrace(0)`: the number in `kernel/syscall.h`, the table entry
     and `extern` in `kernel/syscall.c`, `entry("kbacktrace")` in `user/usys.pl`, the
     prototype in `user/user.h` (lab 1, `trace`, explains each one), and a three-line test
     program. You should see three addresses; symbolize them (`${TOOLPREFIX}addr2line -e
     kernel/kernel -f -p ADDR-1`) and check that they are `sys_kbacktrace`, `syscall`,
     `usertrap`.
  4. **Across a trap.** The `btwant` request, the spin in `sys_kbacktrace`, and the check in
     `kerneltrap`. Expect `kerneltrap`, `kernelvec`, `syscall`, `usertrap`.
  5. **The scheduler stack.** Write `stacktop()` first, then the case-2 request with the
     compare-and-swap and the sleeping wait. Expect `kerneltrap`, `kernelvec`, `main`,
     `start`.
  6. **panic.** One line. To see it work, break something on purpose in a scratch copy (the
     clinic has several ideas) and check the backtrace against the panic message.
  7. **The test**, then `usertests -q`, then the test again.

  **Debugging.** Run QEMU on three harts (`make qemu` uses `CPUS := 3`). To see the frames
  the walk should find, use gdb: `make qemu-gdb` in one terminal, `${TOOLPREFIX}gdb
  kernel/kernel` and `target remote` with the port `make qemu-gdb` chose in another, `break
  backtrace` *before* the first `continue` (in the recorded runs, breakpoints set after
  attaching to an already-running QEMU did not fire), then at the breakpoint `p/x $sp`, `p/x $s0`, and `x/2gx $s0-16` to see a record.
  Walk it by hand with `x/2gx` on each saved `s0`. `info symbol ADDR` names a return
  address. If your walk prints one strange line and stops, compare the line with `$s0`: an
  address that looks like a stack address means you printed the saved `fp` instead of the
  return address (clinic 1).
clinic:
  - bug: The two words of the record swapped
    change: |
      The return address and the saved frame pointer are read from each other's slots:

      ```diff
         while (fp < top) {
      -    printk("%p\n", (void *)*(uint64 *)(fp - 8));
      -    uint64 prev = *(uint64 *)(fp - 16);
      +    printk("%p\n", (void *)*(uint64 *)(fp - 16));
      +    uint64 prev = *(uint64 *)(fp - 8);
           if (prev <= fp)
             break; // a caller's frame is always higher: the chain is broken
      ```
    symptom: |
      $ bttest
      bttest: from a system call, on this process's kernel stack:
      backtrace:
      0x0000003fffff9fc0
      bttest: kbacktrace(0) returned 0: OK
      bttest: from a timer interrupt during a system call:
      backtrace:
      0x0000003fffff9e90
      bttest: kbacktrace(1) returned 0: OK
      bttest: from a timer interrupt on a scheduler stack:
      backtrace:
      0x000000008000a750
      bttest: kbacktrace(2) returned 0: OK
      bttest: kbacktrace(3) returned -1: OK
