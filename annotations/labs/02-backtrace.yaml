      `0x3fffffa000`, which equals `top`, and the loop ends without reading `usertrap`'s
      record. Its contents are the subject of the next step: they are not kernel frames.

      `top` is `PGROUNDUP(fp)` of the *first* `fp`: kernel stacks are exactly one page at
      page-aligned addresses ([[proc_mapstacks]]), and `backtrace`'s own frame is strictly
      inside the page, so the next page boundary is the top. The `prev <= fp` test is the
      second guard: callers' frames are always higher on a downward-growing stack, so a
      saved frame pointer that is not higher means the chain is broken, and the walk stops
      rather than follow it. A panic is exactly when the chain may be broken.

      The function goes in `printk.c` because it prints and because [[panic]] will call it,
      and its prototype in [[kernel/defs.h]].
