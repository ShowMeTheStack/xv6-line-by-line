    why: |
      At `-O`, GCC on RISC-V omits the frame pointer by default and uses `s0` as an ordinary
      callee-saved register. `backtrace` itself no longer sets `s0` (its prologue in this
      build saves `s0` but has no `addi s0,...`), so `r_fp()` returns whatever value some
      caller left in `s0`:

      - In case 0 that is `0x800100e0`, which is `&proc[2]`: [[usertrap]] keeps `p`, its
        `struct proc` pointer, in `s0` (`mv s0,a0` after `myproc()`; `lw a2,48(s0)` reads
        `p->pid`).
      - In cases 1 and 2 it is `0x200000120`, the `sstatus` value that [[kerneltrap]] keeps
        in `s0` so it can restore it at the end: SPP and SPIE set, UXL = 2.

      Neither is inside `stack0` or the kernel-stack area, so `stacktop()` returns 0 and the
      walk refuses to start. With the plain `PGROUNDUP` loop of clinic 3, case 0 would have
      read `0x800100d8` and `0x800100d0` (fields of a `struct proc`) as a return address and a
      frame pointer and gone on from there. Checking that the starting `fp` is on a known
      stack costs two comparisons and turns garbage into a clear message.
