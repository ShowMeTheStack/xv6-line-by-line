measure: |
  All numbers from recorded runs (QEMU 10.2.1, 3 harts), except where a row says "from
  mkfs". Timings on QEMU depend on what else the computer is doing: "quiet" times were
  measured on an otherwise idle computer, "busy" ones while it was busy with other work;
  your times will differ. Ranges are over our runs.

  | | original (06aad25) | this branch |
  |---|---|---|
  | largest file | 268 blocks, 274,432 bytes | 65,803 blocks, 67,382,272 bytes |
  | `struct dinode`, inodes per block | 64 bytes, 16 | 64 bytes, 16 |
  | `FSSIZE`, image size (from mkfs) | 2000 blocks, 2 MB | 70,000 blocks, 70 MB |
  | log, buffer cache (`MAXOPBLOCKS` × 3) | 30 blocks, 30 buffers | 39 blocks, 39 buffers |
  | metadata, first data block (from mkfs) | 47 | 64 |
  | free blocks on a fresh image (with the test program) | 948 at the first count | 68,930 |
  | `bigfiletest 268`: write, read back, unlink | 1.5 s | 1.5 s |
  | `bigfiletest` (6580 blocks) | not possible | 36.8 s quiet; 114 s with the computer busy |
  | `bigfiletest 65803` | not possible | 384 s quiet; 3157 s busy |
  | `usertests -q` | 43.0 s, 45.1 s | 421 s quiet; 3390 s busy |

  **Metadata cost.** 27 indirect blocks for 6580 data blocks, 258 for 65,803: 0.4% either
  way. One table block per 256 data blocks, plus two.

  **What the log sees.** A copy of each kernel printed every commit of 9 or more blocks
  during `usertests -q`, and the copy of the branch also kept the lowest number of free
  buffers it ever saw:

  | | original | this branch |
  |---|---|---|
  | commits of 9 or more blocks | 11, 10 (`sharedfd`); 11, 13, 9 (`fourfiles`) | 12 (`writebig`); 15 (`sharedfd`) |
  | largest commit of a *single* operation | under 9 (none printed) | 12, `writebig`'s `unlink` |
  | fewest free buffers | not measured | 23 of 39 |
  | `lograce` (clinic 7) | (with `MAXOPBLOCKS` 10:) `panic: bget: no buffers` | a 30-block group commit, 8 of 39 buffers free at the lowest; 12 of 12 attempts survive |
  | one write chunk on a fragmented disk (`frag13`) | not possible | 13 blocks |

  The `sharedfd` and `fourfiles` commits are group commits: several processes write at once
  and their operations share one transaction. With the larger budget more operations fit
  in one group, so the branch's `sharedfd` commit is larger. The 12-block one is a single
  operation: `writebig` runs alone, and its `unlink` logged `64 42 43 55 56 57 58 59 60 61
  62 63`, the directory block, two inode blocks and all nine bitmap blocks.

  **Time.** `usertests -q` takes about ten times longer. The only quick test whose work
  grew is `writebig`, which now writes, reads and frees 65,803 blocks instead of 268, one
  transaction per block, so the difference is its (reasoned; we timed the suite, not each
  test). `bigfiletest 268` takes the same 1.5 s on both kernels: the new code only adds
  work beyond block 266 (on the branch the 268-block file already has 3 table blocks
  instead of 1, which costs nothing measurable). Every one-block `write` is a transaction
  of its own: typically 4 logged blocks (bitmap, indirect block, data, inode), so 10 disk
  writes at commit (4 to the log, the header, 4 installs, the header again; [[commit]]).
further: |
  - **Truncate in pieces.** The `unlink` bound is `nbitmap + 3`, so the reference's budget of
    13 only works up to 10 bitmap blocks, about 80,000 blocks of disk; mkfs refuses more.
    Free a large tree a few bitmap blocks at a time, each part in its own transaction, so the
    budget no longer grows with the disk. Work out why this is crash-safe in this tree
    ([[ireclaim]] finishes an unlinked inode at the next boot), what a reader of the
    half-truncated file could see, and how `O_TRUNC` in `sys_open` and every other caller of
    [[iput]] (each already inside someone's transaction) must change.
  - **A version number for the format.** Clinic 6 shows the new kernel silently misreading
    an old image. Change `FSMAGIC` (or add a version field to the superblock) whenever the
    meaning of `addrs[]` changes, so that an old image stops at `panic: invalid file system`
    instead.
  - **One spare buffer.** With `NBUF == LOGBLOCKS`, a group commit that really logs
    `LOGBLOCKS` distinct blocks still pins every buffer, and [[commit]] cannot read a log
    block (the original xv6 has the same edge at 30). Give the cache a few more buffers than
    the log and argue that no admitted group can then exhaust it.
  - **A smarter balloc.** Remember where the last search ended and start there. Measure
    `bigfiletest 65803` before and after on a quiet machine; the late allocations of a large
    file currently scan eight full bitmap blocks each.
  - **Extents.** Replace the block tree with a list of (start, length) runs, as ext4 does.
    Compare the metadata blocks and the number of block reads per `bmap` for a file written
    sequentially, and think about what fragmentation does to it.
  - **mkfs, too.** Teach [[mkfs:iappend]] the doubly-indirect level and put a file of more
    than 267 blocks into `fs.img`. Two implementations of one format must agree; write a test
    that would catch them disagreeing.
