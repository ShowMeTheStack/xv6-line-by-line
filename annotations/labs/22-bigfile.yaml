  - title: Thirteen slots, new meanings
    commit: 1
    file: kernel/fs.h
    lines: 23-46
    focus: 26-39
    diff: true
    state:
      hart: any
      proc: "(definitions shared by the kernel and by mkfs)"
      locks: []
    note: |
      The story of this tour was recorded in one run on the finished branch, on three harts,
      with gdb attached: `bigfiletest 300` (pid 3, file `bigtest.dat`, inode 25) writes 300 blocks,
      reads them back and unlinks the file. 300 blocks is enough to need the doubly-indirect
      block and one indirect block under it; the later steps follow file block 267, the first
      one in the new range.

      Commit 1 makes room. `NDIRECT` drops from 12 to 11 and the array is declared
      `addrs[NDIRECT + 2]`: still 13 entries, so `struct dinode` is still 64 bytes, `IPB` is
      still 16, and inode 25 is still at offset `(25 % 16) * 64` = 576 of the second inode
      block (block 43 on the finished branch, whose larger log pushes the inodes back). What changes is the meaning of two slots: `addrs[11]` was a data block
      and is now the singly-indirect block; `addrs[12]` was the singly-indirect block and will
      be the doubly-indirect one.

      `MAXFILE` is still `NDIRECT + NINDIRECT`, now 267 blocks, one fewer than before: nothing
      can reach slot 12 yet, so the kernel works at every commit of this branch. But this is
      already an on-disk format change. An image made by the old mkfs has data where the new
      kernel expects a table (clinic 6). `make` rebuilds mkfs and `fs.img` because both depend
      on this header.
  - title: The in-memory inode must agree
    commit: 1
    file: kernel/file.h
    lines: 16-30
    focus: 29
    diff: true
    state:
      hart: any
      proc: "(a definition used by every inode operation)"
      locks: []
    note: |
      `struct inode` is the kernel's cached copy of an inode, one of the 50 entries in
      `itable`. Its `addrs` array is separate from the on-disk one, and the two are connected
      only by `memmove(ip->addrs, dip->addrs, sizeof(ip->addrs))` in [[ilock]] and the reverse
      in [[iupdate]] ([[kernel/fs.c:313]], [[kernel/fs.c:240]]). Both copy the *in-memory*
      array's size. Lengthen one array and not the other and the copy silently drops or
      invents a slot; that is why this line changes in the same commit.

      The fields "below `lock`" in this struct are protected by `ip->lock`, a
      [[g:sleeplock|sleep-lock]]: [[bmap]] and [[itrunc]] change `ip->addrs[]` and are only
      ever called with it held ([[concept:locks#lock-inode]]). Nothing in this lab needs a new
      lock. Every new block is reached from one inode, and that inode's sleep-lock serializes
      everything done to its tree; the shared pieces (the bitmap blocks, the log) already have
      their own locks.
  - title: "bmap, third range: the doubly-indirect block"
    commit: 2
    file: kernel/fs.c
    lines: 419-497
    focus: 459-468
    diff: true
    state:
      hart: 2
      mode: S
      proc: bigfiletest (pid 3)
      intr: "on"
      satp: kernel
      locks: ["inode 25 lock (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_write, filewrite, writei, bmap]
      sp: {"on": kernel, detail: "pid 3's kernel stack: `sp` = `0x3fffff9e80`, base `0x3fffff9000`"}
    note: |
      The new range follows the shape of the singly-indirect one: subtract the size of the
      range just passed (`bn -= NINDIRECT`, line 459), then compare with the size of this one.
      After both subtractions `bn` is 0 to 65,535.

      This is the moment gdb recorded, on hart 2: `writei` was called with `off` = 273,408,
      file block 267, so `bn` is 0 here. The inode's slots were `{1070, ..., 1080, 1081, 0}`:
      11 direct blocks, the singly-indirect block 1081, and no doubly-indirect block yet. So
      line 464 calls [[balloc]], which will return 1338, the next free block on this disk, and
      line 467 stores it in the in-memory inode. That store is not logged here and does not
      need to be: [[writei]] ends with [[iupdate]], which copies `ip->addrs` into the inode's
      block and logs it, in this same transaction.

      State: a `write` system call, so interrupts are on (`sstatus` = `0x200000022`, SIE set)
      and no spinlock is held (noff 0). The process holds inode 25's sleep-lock, taken by
      [[filewrite]] through [[ilock]]. The transaction is open (`log.outstanding` = 1) and has
      logged nothing yet (`log.lh.n` = 0).
    others: |
      Another process writing another file on hart 1 can be inside its own [[bmap]] at the same
      time; they share nothing but the bitmap blocks and the log. The bitmap block is a buffer
      with a sleep-lock, so two [[balloc]]s serialize on it and never hand out the same block.
      Both writes join the same group commit if their transactions overlap ([[tour:31]]).
  - title: Allocating a block inside the transaction
    commit: 2
    file: kernel/fs.c
    lines: 51-90
    focus: 76-81
    state:
      hart: any
      mode: S
      proc: bigfiletest (pid 3)
      intr: "on"
      satp: kernel
      locks: ["inode 25 lock (sleep-lock)", "buf 55, bitmap block 0 (sleep-lock)"]
      irq: 0
      stack: [usertrap, syscall, sys_write, filewrite, writei, bmap, balloc]
      sp: {"on": kernel}
    note: |
      [[balloc]] is unchanged by this lab, but every level of the tree goes through it, so it
      is worth seeing what one allocation logs. (The state shown is for the first call, from
      line 464, which allocates the doubly-indirect block itself, so no table buffer is held
      yet; for the later levels the parent table's buffer is held too.) It finds the first clear bit in the bitmap,
      sets it, and logs the bitmap block (line 80). Then `bzero` (lines 52-61) reads the new
      block, fills it with zeros and logs it too. Two logged blocks per allocation, and the
      zeroing is essential for tables: 0 is how [[bmap]] recognizes an empty entry.

      `bzero` reads the block from disk only to overwrite it. On a cache miss that is a real
      disk read, and the process sleeps in [[virtio_disk_rw]] until the interrupt: allowed,
      because only sleep-locks are held. A process that sleeps (or is made to yield by a timer
      interrupt, which [[kerneltrap]] does whenever no spinlock is held) may resume on another
      hart. In the recorded run it did: [[bmap]] started on hart 2, was on hart 1 after the
      first two allocations and on hart 0 after the third, always with the same kernel stack
      (`sp` = `0x3fffff9e80` each time).
      That is why this step says "any".

      After the doubly-indirect block and the first indirect block are allocated, gdb showed
      `log.lh.n` = 3: bitmap block 55, block 1338 and block 1339, each logged once although
      the bitmap block was changed twice ([[log_write]] absorbs repeats).
    others: |
      While this process holds buf 55's sleep-lock, any other process that needs a block waits
      in [[bread]] (it sleeps; the hart runs something else). The lock is held from line 75 to
      line 81 only, then released before the zeroing, so the bitmap is never held across a
      disk read of the new block.
