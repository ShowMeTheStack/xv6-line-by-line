      sp: {"on": scheduler, detail: "hart 1's scheduler stack"}
      irq: {noff: 1, intena: 0}
    note: |
      Nothing in `proc.c` changes, and that is worth checking. The [[scheduler]] acquires a
      process's `p->lock` (line 446), takes a ticket, waits its turn, and [[swtch]]es to the
      process with the lock held. The process releases it in [[yield]], [[sleep]] or
      [[forkret]]: a different thread, on the same hart. When the process gives up the hart,
      it acquires its own `p->lock` and the scheduler releases it at line 463.
      ([[concept:locks#handoff]], [[tour:13]].)

      The ticket lock is fine with that. The ticket was a local variable in the scheduler's
      `acquire` and is forgotten once the wait ends. `release` only checks `holding()` (same
      hart) and advances `serving`, whichever thread runs it.

      What does change is how the scheduler waits. Every scheduler scans all 64 slots, taking
      each `p->lock` in turn; when two schedulers reach the same slot, the second now queues
      for it in order instead of racing. These locks are taken constantly: each of the five
      `p->lock`s gdb printed had been acquired more than 1,600 times 20 seconds after boot, at
      an idle shell, and more than 370,000 times by the end of `usertests -q`. The state is
      reasoned from the code.
    others: |
      Hart 1's pid 6 is one of the `locktest` children. When it is RUNNABLE, any of the three
      schedulers may reach its slot; whichever took the earlier ticket gets it, and the other
      finds it RUNNING when its turn comes.
