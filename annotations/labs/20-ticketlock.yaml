    commit: 3
    file: kernel/spinlock.c
    lines: 38-51
    focus: 40-47
    state:
      hart: 1
      mode: S
      proc: locktest (pid 6)
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_lockbench, acquire]
      sp: kernel
      irq: {noff: 2, intena: 1, note: "lockbench's push_off plus acquire's, not yet holding benchlock; recorded by gdb on hart 1"}
    note: |
      The loop compiled to five instructions:

      ```text
      80000e5e:  addi   a5,s1,4         # &lk->serving
      80000e62:  lw     a5,0(a5)        # load serving
      80000e64:  fence  r,rw            # acquire: later loads and stores stay after it
      80000e68:  sext.w a5,a5
      80000e6a:  bne    a5,a4,80000e5e  # not my number yet: again
      ```

      `a4` holds the ticket, `0xfffffff1` on hart 1 when gdb stopped it at `0x80000e62`. Every
      iteration loads `serving` again, because `__atomic_load_n` is an atomic access the
      compiler may not hoist (clinic 1), and every iteration runs the fence. The fence matters
      only on the last iteration: it keeps the critical section's loads and stores after the
      load that saw the ticket, and so after the release store that published the previous
      holder's work.

      Compare the original loop: every iteration was an `amoswap`, an atomic *write*. Here
      the waiters only read. And `==` (`bne` to keep waiting) is the only comparison: it is
      what keeps the wrap harmless (commit 4).

      After the loop, `lk->cpu = mycpu()` records the owner, exactly as before.
    others: |
      Hart 2 is in the critical section; hart 0 is about to take ticket `0xfffffff2` and wait
      in this same loop (previous step). When hart 2 releases, only hart 1's comparison can
      succeed. Under the swap loop, hart 1, hart 0 and, if it came back quickly, hart 2 itself
      would all race.
