  Without `runlock`, the same two commands print `panic: release`.

  `usertests -q` passing on three harts means every lock in the kernel, including every
  `p->lock` handed across `swtch`, works as a ticket lock, and every busy one crossed the
  wrap during the run (a second boot, with gdb attached after `usertests`, found every lock
  it printed wrapped except `cons.lock`). `locktest` crosses the wrap of `benchlock` with three
  harts contending and found every acquisition counted once. Each commit builds on its own;
  commit 2 (the original lock with the instrument) also passes `usertests -q`.

  Shares need not be equal: in another run of this lock, process 2 got 89,392
  acquisitions and the others about 105,000. A FIFO lock serves whoever is in line; it does
  not guarantee equal shares to a process that is sometimes *not* in line (preempted between
  iterations, or its host thread delayed).
measure: |
  **Aggregate numbers** (three processes × 300,000 acquisitions, three boots of each kernel,
  alternating, three `locktest` runs per boot). These kernels lacked commit 1's reset check,
  which adds only a check-in and check-out under `runlock` around each run and leaves the
  measured loop unchanged:

  | | swap loop (commit 2) | ticket lock (commit 4) |
  |---|---|---|
  | smallest / largest share of one process | 97,150 / 102,533 | 97,123 / 102,545 |
  | mean wait of one process | 739–902 ns | 863–996 ns |
  | longest single wait in a run | 14 µs – 4,004 µs | 19–144 µs |
  | longest run by one hart (see below) | 14–54 | 6–36 |
  | throughput (acquisitions per ms) | 1,351–1,630 | 1,209–1,351 |

  On QEMU both locks share the lock nearly evenly in aggregate. The swap loop does not
  starve anyone here. Run lengths do not separate the locks either: other runs of the ticket
  lock gave 68, 72 and 86, because a waiter that is not in line (preempted, or its host thread
  delayed) lets the other harts take turn after turn under either lock. The longest waits
  (milliseconds) and the throughput track what else the computer is doing more than the
  lock: other builds of the same lock gave 1,115 and 1,010 acquisitions per ms, builds
  differing by one line gave as little as 591 (measured while the computer was busy with
  other work; your times will differ), and in the instrumented builds below the ticket lock
  was the faster one (1,408–1,754 against 1,107–1,345). We do not claim a throughput
  difference.

  **Per acquisition.** A scratch copy of each kernel (never the branch) counted, inside
  `acquire`, how many other acquisitions of the same lock happened between the moment a
  hart asked and the moment it got in, and how many times it went round the spin loop
  (a counter `acqs` in `struct spinlock`, incremented by each new holder, and two per-hart
  fields to hand the numbers to `lockbench`). For the ticket lock the count starts right
  after the `amoadd`, for the swap loop right before the first `amoswap`: in both cases, the
  moment the hart joins the contest. Nine runs of three processes per lock:

  | | swap loop | ticket lock |
  |---|---|---|
  | most acquisitions that passed one waiter (per run) | 12, 4, 4, 126, 7, 4, 7, 14, 6 | 2 in every run |
  | acquisitions passed by 2 or more (per run of 300,000) | about 4,900–7,200 | 47–179 |
  | acquisitions passed by 3 or more (per run) | 56–216 | 0 |
  | mean spin iterations per acquisition | 19–22 | 40–50 |

  The ticket lock's bound is exact: with three harts and interrupts off while waiting, at
  most two tickets can be ahead of yours, and 2.7 million acquisitions never saw more. The
  swap loop usually behaves too (about 98% of acquisitions were passed by at most one
  other), but nothing stops the occasional waiter from losing 126 races in a row. With two
  processes the bound for tickets is 1, and it held; the swap loop's worst was 3.

  Tickets spin about twice as many iterations per acquisition, because a hart that releases
  and immediately asks again now goes to the back of the line and waits, where under the
  swap loop it often walked straight back in. But iterations are not time: a ticket
  iteration is a load and a fence, a swap-loop iteration an AMO, and in these same
  instrumented builds the mean wait of one process was not longer with tickets (709–905 ns)
  than with the swap loop (865–1,098 ns).

  **What QEMU cannot show.** QEMU's multi-threaded TCG runs each hart as a host thread and
  does not model RISC-V caches. On real hardware
  the swap loop's unfairness comes largely from cache-line ownership, and the ticket lock's
  cost from every waiter re-fetching the `serving` line after each release; neither is
  modelled. The FIFO property, which is a property of the code, shows exactly.
further: |
  - **Spin on relaxed loads, fence once.** Move the acquire ordering out of the loop: spin
    with `__ATOMIC_RELAXED` loads and put one `__atomic_thread_fence(__ATOMIC_ACQUIRE)`
    after it. Read the new `kernel.asm` and measure spin iterations again. Teaches the
    difference between an acquire load and an acquire fence.
  - **Proportional backoff.** A waiter knows how many tickets are ahead of it (`my -
    serving`). Pause for that many short delays before re-reading. Teaches why ticket locks
    make backoff easy and swap loops do not.
  - **An MCS lock.** Give each waiter its own node to spin on, linked into a queue with one
    atomic swap. Teaches how real kernels avoid every waiter re-reading one word, and why the
    node must live somewhere other than the stack of a thread that might move.
  - **Lock statistics.** Turn the measurement counters into a permanent feature, per lock
    name, printed by Ctrl-P ([[procdump]]). Teaches how Linux's `lockstat` finds the locks
    worth fixing, and what a counter on every `acquire` costs.
  - **A trylock.** `int tryacquire(struct spinlock *)` that never waits. Work out why "take
    a ticket, give it back if it is not called" is impossible, and what compare-and-swap
    (LR/SC) on both counters at once would need.
