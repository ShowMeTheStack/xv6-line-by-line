      give the same answer; the first half keeps the meaning "held, and by me" that callers
      such as [[sched]] rely on ([[kernel/proc.c:485]]).

      Interrupts must be off here, as the comment says: [[mycpu]] names the hart, and an
      interrupt that moved this thread to another hart between the load of `lk->cpu` and the
      call would compare against the wrong one. All three callers, `acquire` (after its
      `push_off`), `release` and [[sched]], run with noff > 0.
