      irq: {noff: 2, intena: 1}
    note: |
      Release is three steps, compiled as:

      ```text
      80000ee4:  sd     zero,16(s1)     # lk->cpu = 0
      80000ee8:  lw     a5,4(s1)        # serving
      80000eea:  addiw  a5,a5,1         # + 1
      80000eec:  addi   a4,s1,4         # &lk->serving
      80000ef0:  fence  rw,w            # release ordering
      80000ef4:  sw     a5,0(a4)        # the next ticket may enter
      80000ef6:  jal    pop_off
      ```

      No AMO: only the holder writes `serving`, so reading it with a plain `lw` and writing
      it back cannot lose an update. What the store needs is ordering, and that is the
      `fence rw,w`, the same fence the original release had: every load and store of the
      critical section is ordered before the `sw` that lets the next hart in.

      The order of the first and last stores matters. `lk->cpu = 0` comes first, while this
      hart still owns the lock. After the `sw`, the next hart may be inside within a few
      instructions and store its own `cpu`; clearing `cpu` after that would erase the new
      owner (clinic 4).

      [[pop_off]] comes after the store: interrupts stay off until the lock is handed on. The
      state shown is reasoned for hart 2 releasing `benchlock` (the recorded snapshot of this
      code is at the wrap, two steps from the end).
    others: |
      Harts 1 and 0 are in the wait loop. The `sw` changes `serving` to `0xfffffff1`; hart 1's
      next `lw` sees it, its `bne` falls through, and it is in. Hart 0 loads the same new
      value, compares it with `0xfffffff2`, and keeps waiting. One store, and every waiter
      re-reads the word: on real hardware, every waiter's cached copy of that line is
      invalidated, even though only one of them can proceed.
