      same mistake:** 1 of 7 boots froze (1 of 17 runs). Pooled, those numbers are weak
      evidence, because the boots ran while the computer was doing different amounts of other
      work, and timings on QEMU depend on that. The fair comparison is two batches in which
      both kernels booted at the same time on the same computer: 7 of 8 ticket boots froze
      and 0 of 8 swap-loop boots did. Load changes how often either freezes, but not the
      order.

