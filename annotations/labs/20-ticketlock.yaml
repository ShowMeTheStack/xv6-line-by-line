  - title: One lock, and a score kept under it
    commit: 1
    file: kernel/lockbench.c
    lines: 1-54
    focus: 12-54
    diff: true
    state:
      hart: 1
      mode: S
      proc: locktest (pid 3)
      intr: "off"
      satp: kernel
      locks: [runlock]
      stack: [usertrap, syscall, sys_lockbench, benchreset]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      `benchlock` is an ordinary `struct spinlock`, nothing special: whatever [[acquire]] and
      [[release]] do to every lock in the kernel, they do to this one. The `bench` struct is
      the data it protects: the target, the count so far, and the score. Its fields are
      written only with `benchlock` held, except by the reset, and read without it only by the
      spin on `arrived` and after the run is over; that is why plain C is enough for them.

      `benchreset` calls [[initlock]] again, which is only safe when nobody is using the lock.
      Reinitializing a lock that a hart holds sets `next == serving` under it; the holder's
      own `release` then fails [[holding]] and the kernel panics `release`. Any process can
      call `lockbench(0, ...)`, so a comment is not enough: a second spinlock, `runlock`,
      protects `running`, the number of callers between their start line and the end of their
      run, and the reset refuses (returns -1) unless it is 0. (With only the comment, typing
      `locktest 3 3000000 &` and then `locktest` panics the kernel. Verify shows the same two
      commands with `runlock`.) `runlock` is never passed to `initlock`: a zeroed
      `struct spinlock` is a free lock under both the old and the new `acquire`.

      The reset matters later: commit 4 makes `initlock` start the counters just below the
      wrap, and this reset is what makes every `locktest` run cross it.

      `inside` and `overlaps` are the mutual-exclusion check: the critical section sets
      `inside`, and a hart that finds it already set counts an overlap. It cannot catch every
      overlap (two harts could miss each other), so `locktest` also checks that the counts add
      up.
  - title: A start line, outside any lock
    commit: 1
    file: kernel/lockbench.c
    lines: 86-116
    focus: 104-116
    state:
      hart: 0
      mode: S
      proc: locktest (pid 4)
      intr: "on"
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_lockbench]
      sp: kernel
      irq: 0
    note: |
      Each of the three children calls `lockbench(3, 300000, &st)`. To compare locks, they
      must contend from the first acquisition, so each one counts itself in `running` (under
      `runlock`, which keeps a reset out until it is done), checks in (incrementing `arrived`
      under `benchlock`) and then spins until all three have arrived.

      The start-line spin is deliberately **outside** any lock and with interrupts **on**
      (noff 0). The third child may not even be running yet: it may be RUNNABLE, waiting for
      a hart. If the first two spun with interrupts off, no timer interrupt could make them
      [[yield]], and on a machine with fewer harts than callers the third would never run.
      With interrupts on, a timer tick can take the hart away, and nothing is held that
      anyone else needs.

      `arrived` is read with `__atomic_load_n(..., __ATOMIC_RELAXED)`: an atomic load, so the
      compiler must re-read it on every iteration (clinic 1 shows what a plain read in a loop
      becomes), and relaxed, because the start line protects no data. This state is reasoned
      from the code; gdb did not stop here.
    others: |
      Hart 2 is running pid 5 through the same check-in; hart 1 is running pid 6, or pid 3,
      the parent, which has forked and is about to block in `read` on the pipe. Only
      `arrived` is shared, and it only grows.
  - title: "The loop: time the wait, keep score, let go"
    commit: 1
    file: kernel/lockbench.c
    lines: 116-145
    focus: 118-131
    state:
      hart: 1
      mode: S
      proc: locktest (pid 6)
      intr: "off"
      satp: kernel
      locks: []
