      ticket freezes; the other 5 showed the same queue: `cpu` 0 and a served ticket that no
      spinning hart held.) `tickslock` is serving ticket `0x9aa90`, and
      nobody is recorded as holding it (`cpu = 0x0`). The tickets handed out are `0x9aa90` to
