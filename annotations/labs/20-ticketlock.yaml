    commit: 3
    file: kernel/spinlock.c
    lines: 22-47
    focus: 27
    state:
      hart: 0
      mode: S
      proc: lockstress (any worker)
      intr: "off"
      satp: kernel
      locks: []
      stack: [usertrap, syscall, sys_uptime, acquire]
      sp: kernel
      irq: {noff: 1, intena: 1}
    note: |
      Line 27 did not change, but its job grew. In the original lock, interrupts had to be off
      while a lock was *held*, so that a handler on this hart could not want it. With tickets,
      they must be off while a hart *waits*, too: from the moment it takes a ticket, every
      later ticket depends on it.

      Picture hart 0 in [[sys_uptime]] with ticket N for `tickslock`, spinning. If interrupts
      were on, the timer could interrupt it, and [[clockintr]] would take ticket N+1
      ([[kernel/trap.c:170]]). Ticket N is called, but its owner is underneath the handler,
      and the handler is waiting for N. Clinic 3 moved `push_off` after the loop and caught
      exactly this, with the ticket in the interrupted frame equal to `serving`.

      With `push_off` first, the state above holds during the whole wait: noff 1, SIE off,
      `intena` 1. The timer interrupt stays pending until [[release]]'s [[pop_off]] turns
      interrupts back on, and `clockintr` then takes its ticket on a hart that holds none.
      (Reasoned from the code.)
    others: |
      Harts 1 and 2 are running other `lockstress` workers, taking tickets for `tickslock` in
      the same way. Because none of them can be interrupted while holding a ticket, each
      ticket is served and released in a bounded time, and `clockintr` on hart 0 waits at
      most for the tickets taken before it.
