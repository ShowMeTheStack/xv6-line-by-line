    note: |
      Each iteration is `push_off`, read the `time` CSR, [[acquire]], read it again, keep
      score, [[release]], [[pop_off]]. The extra `push_off` at line 119 keeps a timer interrupt
      from landing between the two `r_time()` calls, so the wait measured is the lock's, not a
      context switch's. The `time` CSR counts at 10 MHz on QEMU's `virt` machine: one tick is
      100 ns.

      So a hart waiting for `benchlock` is at noff 2, SIE off, `intena` 1 (interrupts were on
      when the system call reached line 119). gdb recorded exactly that on hart 1
      (`cpus[1].noff = 2`, `intena = 1`, `sstatus = 0x8000000200006020`, SIE bit clear).

      Between iterations, after line 130, noff drops to 0 and interrupts are on again for a
      few instructions: that is where a timer tick can preempt the process. The stop test is
      made with the lock held (line 123), so every caller sees the same final count and
      leaves.

      At this commit `acquire` is still the original swap loop; the state above was recorded
      on the finished branch, where the noff and `intena` values are the same.
    others: |
      In the recorded snapshot, hart 2 (pid 5) held `benchlock` and hart 0 (pid 4) was
      between iterations: in [[pop_off]] just after its `intr_on` (`0x80000eb2`), with
      `cpus[0].noff = 0` and SIE back on (`sstatus = 0x8000000200006022`).
  - title: Inside the critical section
    commit: 1
    file: kernel/lockbench.c
    lines: 56-84
    focus: 61-83
    state:
      hart: 2
      mode: S
      proc: locktest (pid 5)
      intr: "off"
      satp: kernel
      locks: [benchlock]
      stack: [usertrap, syscall, sys_lockbench, critical]
      sp: kernel
      irq: {noff: 2, intena: 1, note: "lockbench's push_off plus benchlock's; recorded by gdb (cpus[2].noff = 2, intena = 1)"}
    note: |
      gdb stopped hart 2 here, at the first instruction of `critical` (inlined into
      `sys_lockbench`, `0x80000d54`), holding `benchlock` with `bench = {count = 237, last =
      0, run = 1, maxrun = 2}`: 237 acquisitions so far, the previous one by hart 0.

      [[cpuid]] is safe because interrupts are off: the process cannot move to another hart
      in the middle. The run counter records how many acquisitions in a row the same hart
      made; a test-and-set lock that lets the releasing hart walk straight back in would show
      up as long runs. But long runs also come from waiters that are not in line at all (a
      process preempted between iterations, a host thread delayed), under either lock: the
      measured runs do not separate the two locks (Measure). The caller's own count, per-hart tally and waits go into `st`, its private
      copy on its kernel stack, which is copied out to user space at the end.

      `inside` is accessed with relaxed atomics so that the load and both stores stay real
      memory accesses. As plain C, the store of 1 followed later by the store of 0, with no
      read of it in between, is the kind of dead store a compiler may delete. In this build
      they are `lw` at `0x80000d5c`, `sw` at `0x80000d6c` and `sw zero` at `0x80000d28`. It is a
      tripwire, not a lock: mutual exclusion is still the lock's job.
    others: |
      Hart 1 (pid 6) was spinning in `acquire(&benchlock)`. On the finished branch it held
      the next ticket, `0xfffffff1`; on the original lock it would simply be retrying its
      `amoswap`.
