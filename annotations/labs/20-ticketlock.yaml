      [[clockintr]] with `0x9aa92`. Ticket `0x9aa90` is in no
      spinning hart's registers: it was saved by [[kernelvec]] on hart 0's stack, in the frame
      of the `sys_uptime` that the timer interrupted while it waited (`sepc` `0x80000dce` is
      the top of the spin loop, and its saved `a5` holds the last `serving` it read,
      `0x9aa8f`). Its turn came while it was underneath `clockintr`, and `clockintr` waits for
      its turn after it. Harts 1 and 2 still take timer interrupts and may [[yield]], but that
      cannot help: the code that owns `0x9aa90` can only run on hart 0, underneath
      `clockintr`.

      Another freeze had the same shape without a device handler. A process on hart 2 was in
      [[killed]] ([[kernel/trap.c:81]]), waiting with a ticket for its own `p->lock`. The timer
      interrupted it; [[kerneltrap]] called [[yield]] ([[kernel/trap.c:158]]), which took a
      ticket for that same `p->lock` ([[kernel/proc.c:504]]): the process queued behind
      itself. The scheduler on hart 1 and `clockintr`'s [[wakeup]] on hart 0 (holding
      `tickslock`) queued for the same lock, and the whole machine stopped.

      With the swap loop, a waiter holds nothing; the only window is the few instructions
      between winning the swap and the `csrrci` in [[push_off]]. We did not attach gdb to the
      one swap-loop freeze, so where it stopped is not recorded.

      Deleting `push_off()` outright (instead of moving it) fails at once: the first
      [[release]], in the first `printk` of [[main]], reaches [[pop_off]] with noff 0 and the
      console shows only `panic: pop_off`.
  - bug: Letting the next ticket in before clearing lk->cpu
    change: |
      The two writes in `release` swapped:

      ```diff
      -  lk->cpu = 0;
      -
         __atomic_store_n(&lk->serving, lk->serving + 1, __ATOMIC_RELEASE);
      +  lk->cpu = 0;
      ```

      In this build the window is one instruction: `sw a5,0(a4)` (the release store) is
      followed directly by `sd zero,16(s1)`.
    symptom: |
      $ locktest
      [...]
      locktest: mutual exclusion (300000 counted, 0 overlaps): OK
      (five locktest runs, then usertests -q:)
      ALL TESTS PASSED
      $ locktest
      [...]
      locktest: mutual exclusion (300000 counted, 0 overlaps): OK

      (a copy with a 1000-iteration delay loop between the two writes, gdb from reset:)
      xv6 kernel is booting

      hart 1 starting
      hart 2 starting
      panic: release

      #1  0x0000000080000eac in release (lk=lk@entry=0x80020be0 <disk+296>) at kernel/spinlock.c:64
      #2  0x0000000080005d0c in virtio_disk_rw (b=b@entry=0x80015848 <bcache+24>, write=write@entry=0) at kernel/virtio_disk.c:297
      [...]
      $15 = {next = 0xffffff03, serving = 0xffffff02, name = 0x80007658, cpu = 0x0}
    why: |
      As written, the bug never showed: six `locktest` runs (1.8 million acquisitions of
      `benchlock` from three harts) and `usertests -q` passed. For it to fail, the next hart
      must see the new `serving`, leave its loop and store its own `cpu` into `lk->cpu`, all
      between two consecutive instructions of the old holder.

      The widened copy shows what the bug does when it hits. Reconstructed from the code and
      the lock's state: a [[virtio_disk_intr]] on another hart released `disk.vdisk_lock` and, during its delay, [[virtio_disk_rw]] on hart 0 took
      the lock (ticket `0xffffff02`) and recorded `cpu = cpus[0]`. The delayed `lk->cpu = 0`
      then erased that. When `virtio_disk_rw` released, [[holding]] saw `cpu == 0` and
      panicked `release`; gdb shows `serving` at the panicking hart's own ticket and `cpu` 0.
      The original code clears `cpu` first for exactly this reason
      ([[concept:locks#fence]]). A test that passes says little when the window is one
      instruction wide.
  - bug: Releasing with a plain increment
    change: |
      No atomic store, no ordering:

      ```diff
      -  __atomic_store_n(&lk->serving, lk->serving + 1, __ATOMIC_RELEASE);
      +  lk->serving++;
      ```

      The compiled `release` loses its fence: `sd zero,16(s1)`, `lw a5,4(s1)`,
      `addiw a5,a5,1`, `sw a5,4(s1)`, then the call to `pop_off`.
    symptom: |
      $ locktest
      [...]
      locktest: mutual exclusion (300000 counted, 0 overlaps): OK
      (three locktest runs, then:)
      $ usertests -q
      [...]
      ALL TESTS PASSED
      $ lockstress up 100000
      [...] lockstress up 100000 done
      $ locktest
      [...]
      locktest: mutual exclusion (300000 counted, 0 overlaps): OK
    why: |
      Nothing failed: four `locktest` runs, `usertests -q` and 300,000 `uptime` calls from
      three harts. This is the same result as [[tour:52]]'s break 7, and for the same reason.
      The fence orders the critical section's stores before the store that lets the next
      hart in. RVWMO permits a store to become visible to other harts before an earlier store
      to a different address; when QEMU's TCG runs on an x86-64 host, stores become visible
      in program order, so the reordering the fence forbids does not occur there. On real RISC-V
      hardware the next holder could read `bench.count` (or `ticks`, or a `p->state`) as it
      was *before* the previous critical section's writes.

      Two more things this change gives up, also invisible here. A plain `lk->serving++`
      lets the compiler reorder the critical section's own stores past it (inside `release`
      it cannot see them, which is why the build happened to keep the order). And the
      spinners in other harts read `serving` with atomic loads while this store is not
      atomic: in C11 terms that is a data race, undefined behaviour, even though RISC-V's
      aligned `sw` is in fact a single store. Not failing is not a pass.
