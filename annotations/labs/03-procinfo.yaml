      (`li a7, SYS_procinfo`, `ecall`, `ret`), and the prototype on line 29.

      Line 4 is the one new idea. `user.h` is included by every user program, and most of them
      never include `pinfo.h`. A prototype that mentions `struct pinfo *` where no `struct
      pinfo` has been declared makes the compiler declare a new structure type valid only
      inside that parameter list, and it warns. Under `-Werror` the build stops:
      `'struct pinfo' declared inside parameter list will not be visible outside of this
      definition or declaration` (recorded by removing line 4). `struct pinfo;` declares the
      tag without its contents, exactly as `struct stat;` on line 3 does for `fstat`. A
      pointer to an incomplete structure is enough for a prototype.

      At this commit the kernel has no handler yet: a call would reach [[syscall]], fail its
      range check, print an "unknown sys call 23" message and return -1.
