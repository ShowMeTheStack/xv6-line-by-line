      cpus[0].proc = 0x80010208 <proc+1080> noff = 2
      cpus[1].proc = 0x80010370 <proc+1440> noff = 2
      cpus[2].proc = 0x800100a0 <proc+720> noff = 2
      [...]
      slot  2 pid     3 state RUNNING   name procinfotest  lock.locked 0 lock.cpu 0x0 parent 0x8000ff38 <proc+360>
      slot  3 pid     5 state RUNNING   name procinfotest  lock.locked 0 lock.cpu 0x0 parent 0x800100a0 <proc+720>
      slot  4 pid     6 state RUNNING   name procinfotest  lock.locked 1 lock.cpu 0x8000fad0 <cpus+256> parent 0x800100a0 <proc+720>
      [...]
    why: |
      The test got through its first four checks, in which `procinfo` overlaps another
      process's `exit` at most once (check 2's child), a window far too short to hit; the
      stress phase overlaps thousands, and the test hung there. Each `struct proc` is
      360 bytes and each `struct cpu` 128, so the addresses decode as follows (the line numbers
      in the backtraces are those of this build, one more than the site's source for
      `kwait`):

      - **Hart 2** runs `procinfotest` (pid 3, slot 2: `cpus[2].proc` is `proc+720`). Its
        `procinfo` holds slot 4's lock (`lock.cpu` is `cpus+256`, hart 2) and spins for
        `wait_lock` at the line the change added.
      - **Hart 1** runs pid 6, a churning child in slot 4 (`proc+1440`). Its [[kwait]] holds
        `wait_lock` (`cpu = cpus+128`, hart 1) and calls [[killed]] on itself
        ([[kernel/proc.c:408]]), which spins for slot 4's lock: its own, held by hart 2.
      - **Hart 0** runs pid 5, the spinning child in slot 3. A timer interrupt arrived in user
        mode; [[clockintr]] took `tickslock` and called [[wakeup]] on `ticks`, which takes
        every `p->lock` in turn and now spins on slot 4's. Hart 0 is not part of the cycle,
        but it is caught anyway, holding `tickslock`.

      Hart 1 waits for hart 2 and hart 2 waits for hart 1: a two-lock cycle, made of the
      `wait_lock` → `p->lock` order that `kwait` uses and the `p->lock` → `wait_lock` order the
      change introduced. Every `noff` is 2: one lock held plus the `push_off` of the `acquire`
      that spins. Interrupts are off on all three harts, so no timer can ever move anything
      again, and since hart 0 holds `tickslock`, even `uptime` would hang now.

      The partner varies from run to run. Another run of the same variant closed the
      cycle with `kwait`'s scan of its children instead: hart 1 in `kwait` holding `wait_lock`
      at `proc.c:385` (this build's numbering), acquiring a child's lock (slot 6) that hart 0's
      `procinfo` held, with hart 2 in `kwait` at line 418 as a victim spinning on `wait_lock`
      (`noff` 1). That is the first option of the check in question 3. Lock order is a
      property of the whole kernel:
      a new function must follow the order every existing path already uses.
