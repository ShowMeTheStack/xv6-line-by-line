      Slots 0 to 2 (`init`, `sh`, `ps`) were in use and released normally. Each of the other 61
      slots was locked and then skipped by `continue`, so `ps`'s hart (hart 2, `cpus+256`)
      left `procinfo` holding 61 `p->lock`s. `wait_lock` was released at the end, as the code
      says, so `procinfo` returned, the `copyout` worked, and `ps` went back to user space with
      61 spinlocks held. The way back to user space does not look at `noff`: [[prepare_return]]
      sets `SPIE`, and `sret` copies it into `SIE`, so interrupts were on again.

