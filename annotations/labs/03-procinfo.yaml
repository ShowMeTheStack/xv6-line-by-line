      is fine because it holds nothing; the moment a lock is added, every exit from the loop
      body must pass through the `release`. Had the panic not caught it, the next scheduler to
      reach slot 3 would have spun forever.
reveal:
  - title: A record both sides agree on
    commit: 1
    file: kernel/pinfo.h
    lines: 1-10
    diff: true
    state:
      hart: 1
      mode: U
      proc: ps (pid 3)
      intr: "on"
      satp: user
      locks: []
      stack: [main]
      sp: {"on": user, detail: "ps's user stack"}
    note: |
      The story for this tour is a recorded run on three harts: at a fresh shell you type
      `ps`. `ps` is pid 3, running on hart 1; `init` (pid 1) and the shell (pid 2) are asleep,
      `init` in `wait` for the shell and the shell in `wait` for `ps`. The machine-state values
      in the steps for `sys_procinfo` and `procinfo` come from that run, with QEMU started
      halted and breakpoints set before it ran.

      The first commit defines the record. It lives in its own header because two programs
      compiled separately, the kernel and `ps`, must agree on it byte for byte: the kernel
      fills it, `copyout` copies its bytes, and `ps` reads them through the same declaration.

      The layout has no padding: four `int`s (16 bytes), then the 8-byte `sz` at offset 16,
      already aligned, then 16 characters, 40 bytes in all. That matters for a structure the
      kernel hands to user space: a padding hole would be a few bytes the kernel copies out
      without ever writing, whatever happened to be in its buffer before.

      `state` is the kernel's `enum procstate` number. User programs cannot include
      `kernel/proc.h` (it needs the kernel's spinlock and page-table types), so `ps` keeps its
      own table of names for 1 to 5.
