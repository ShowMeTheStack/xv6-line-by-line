      It deliberately does **not** check that no two RUNNING records name the same hart, and the
      comment says why. A test that checked it would pass thousands of snapshots and then
      fail in the run after `usertests`, which saw four RUNNING records at once on three
      harts: a correct kernel, an over-strict test. A test must claim
      no more than the design guarantees.

      The other checks: the test's own record; a child seen sleeping in `read`, then as a
      zombie, then gone after `wait`; `max` values of 1, 0 and -1 against a buffer filled with
      `0xab`; and bad buffers (address 0, which is read-only text; an address above `sz`; the
      trapframe page, which has no `PTE_U`) plus a lazily allocated one. Each prints `OK` or
      `FAIL`, and on failure the max check and the stress check print what they saw.
verify: |
  On the branch, on three harts, `procinfotest` passes, `usertests -q` passes, and
  `procinfotest` passes again on the same boot:

  ```text
  $ procinfotest
  procinfotest: own record: running on a hart, right name: OK
  procinfotest: child: sleeping, then zombie, then gone after wait: OK
  procinfotest: max=1 writes one record, max=0 none, max=-1 fails: OK
  procinfotest: bad buffers return -1; a lazy buffer works: OK
  procinfotest: 8318 snapshots, 0 bad, newest pid seen 2222, most RUNNING at once 3
  procinfotest: snapshots during fork/exit churn: every one consistent: OK
  procinfotest: 5 checks OK
  $ usertests -q
  usertests starting
  test copyin: OK
  test copyout: OK
  [...]
  test partial_write: OK
  test unlinkcwd: OK
  ALL TESTS PASSED
  $ procinfotest
  procinfotest: own record: running on a hart, right name: OK
  procinfotest: child: sleeping, then zombie, then gone after wait: OK
  procinfotest: max=1 writes one record, max=0 none, max=-1 fails: OK
  procinfotest: bad buffers return -1; a lazy buffer works: OK
  procinfotest: 5757 snapshots, 0 bad, newest pid seen 10350, most RUNNING at once 4
  procinfotest: snapshots during fork/exit churn: every one consistent: OK
  procinfotest: 5 checks OK
  $ ps
  PID   PPID  STATE   CPU  SIZE    NAME
  1     0     sleep   -    16384   init
  2     1     sleep   -    20480   sh
  10351 2     run     0    16384   ps
  ```

  What this shows: about fourteen thousand snapshots taken while thousands of processes were
  created and destroyed around them (pids climbed to 2222 during the first run alone), each one keeping its promises (records consistent
  with themselves, parents present). The second run's `most RUNNING at once 4` on three
  harts is not a failure: it is the evidence that a snapshot read slot by slot is not an
  instant of the whole table, which is why the test does not check for it. `usertests`
  makes no `procinfo` calls, so it shows that nothing else changed. The snapshot count varies
  between runs: timings on QEMU depend on what else the computer is doing.
measure: |
  All numbers come from runs on three harts under QEMU, using a scratch measurement program
  (not part of the branch) on a copy of the branch's kernel. One tick is 0.1 s (the timer is
  set 1,000,000 `time` units ahead, and QEMU's `time` runs at 10 MHz), so tick counts are
  coarse.

  **What a call costs.** 50,000 calls each, on an otherwise idle system, measured with
  `uptime` (two runs, same results):

  | Call | Ticks for 50,000 | Per call, roughly |
  |---|---|---|
  | `getpid()` | 5 | 10 µs |
  | `procinfo(buf, 1)` | 11 and 10 | 21 µs |
  | `procinfo(buf, 64)` | 23 | 46 µs |

  A full snapshot costs about four `getpid`s. Even `max = 1`, which stops the scan at the
  first in-use slot, costs twice a `getpid`: allocating and freeing the page and the
  `copyout` are not free.

  **How often a snapshot catches the table mid-change.** For 50 ticks, one child spun and
  two forked and reaped children as fast as they could, while the program took snapshots and
  counted (two runs on the reference kernel):

  | | Run 1 | Run 2 |
  |---|---|---|
  | snapshots | 31,691 | 32,315 |
  | records (about 7.7 per snapshot) | 244,204 | 247,093 |
  | records RUNNING / RUNNABLE / SLEEPING | 90,198 / 36,593 / 85,945 | 89,999 / 39,283 / 86,834 |
  | snapshots with a child caught mid-fork (USED) | 8,796 (28%) | 8,721 (27%) |
  | ... of those USED records, with `ppid` 0 | 8,802 of 8,802 | 8,721 of 8,721 |
  | snapshots with a ZOMBIE | 18,254 (58%) | 17,887 (55%) |
  | snapshots with 3 RUNNING records | 27,032 | 26,637 |
  | snapshots with two RUNNING records on one hart | 0 | 0 |
  | snapshots with a parent missing | 0 | 0 |

  A quarter of the snapshots show a process that does not fully exist yet, and more than
  half show one that no longer runs: a `ps` on a busy machine sees processes in transition
  all the time, and correctly so. Every child caught mid-fork had no parent yet, because
  [[kfork]] sets the parent under `wait_lock`, which the scan holds. (That is what the runs
  showed, not a guarantee: a child whose parent was set just before the scan began, but
  which is not yet RUNNABLE, would show its parent.) Two RUNNING records on one hart did not
  occur in these 64,006 snapshots, but did occur in the `procinfotest` run in Verify (four
  RUNNING on three harts): rare, possible.

  The same program on a kernel with `wait_lock` removed from `procinfo` (keeping every
  `p->lock`): 29,802 and 29,507 snapshots; USED records with a parent already set, 7 of 8,208
  and 4 of 8,179; snapshots with two RUNNING records on one hart, **16 and 10**; parent
  missing, 0 and 0. A likely explanation (reasoned, not measured): holding `wait_lock` also
  keeps the churning children from sleeping and waking in `wait` while the scan runs, so
  harts switch processes mid-scan less often.

  **Does copying out under the locks cost anything?** A copy of each kernel recorded the
  `time` CSR after taking `wait_lock` and before releasing it (units of 0.1 µs), for the
  reference and for clinic 1's version that copies each record out inside the locks:

  | Workload (calls) | Reference: mean, max (run 1; run 2) | Copy under locks: mean, max (run 1; run 2) |
  |---|---|---|
  | mapped buffer (20,000) | 346, 2,191; 535, 36,129 | 338, 2,249; 285, 654 |
  | a fresh lazy page each call (300) | 303, 421; 534, 910 | 420, 1,040; 363, 665 |
  | mapped buffer during fork/exit churn (20,000) | 9,136, 110,339; 11,803, 128,434 | 9,312, 147,157; 6,209, 62,429 |

  No consistent difference: run-to-run variation (timings on QEMU depend on what else the
  computer is doing) is larger than any effect of
  three or four 40-byte copies, even when the first one allocates a page.

  **A caution about the churn row.** Its mean near 1 ms is an artefact of the measurement
  program, not a typical scan. Its lazy-page phase ran first and grew it to about 300 pages,
  so every `fork` in the churn copied about 1.2 MB in [[uvmcopy]] while holding the new
  child's `p->lock` (which [[kfork]] holds from [[allocproc]] until line 294), and the scan
  waited at that USED slot. An instrumented run that timed each `acquire` in the
  scan confirmed it: with churners of 16 KB (`procinfotest`'s workload) the scan held
  `wait_lock` for 50 to 80 µs on average (worst case under 0.5 ms), while after growing to
  304 pages it averaged 573 µs, almost all of it spent waiting at USED slots. The row is still
  a fair A/B comparison of the two kernels. The lesson is that the longest `p->lock` hold in
  this kernel is `kfork`'s, not the schedulers', and that a scan pays for whatever the other
  holders of the locks it visits are doing.
further: |
  - **A `top`.** Take two snapshots a second apart and show what changed. Pids are never
    reused here (`nextpid` only grows), so matching records across snapshots is easy; with the
    per-process CPU time of lab 4 you can sort by usage. Teaches why a snapshot is always
    about the past.
  - **Exact names.** Make [[kexec]] write `p->name` under `p->lock`, or give each process a
    sequence counter that `kexec` bumps before and after the write, and have `procinfo` retry
    while the counter is odd or changed. Teaches the seqlock pattern: consistent reads without
    blocking the writer.
  - **A consistent instant.** Take all 64 `p->lock`s in slot order (plus `wait_lock`), read
    everything, release in reverse. Measure how long the other harts stall, and whether two
    such scans on two harts can deadlock (they take the locks in the same order). Teaches
    what global consistency costs.
  - **One process.** `procinfo1(pid, struct pinfo *)` for a single process. With pids never
    reused, a `kill`-style "find, then act" stays safe even when the process exits in between.
    Teaches the difference between naming a process by pid and by slot.
  - **Wedge-proof dump.** Change [[procdump]] to *try* each `p->lock` a bounded number of
    times and mark slots it could not lock. Teaches why a debugging path must never block, and
    what a try-lock looks like on RISC-V.
