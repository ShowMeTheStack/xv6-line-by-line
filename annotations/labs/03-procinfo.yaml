      Torn records do show up, but rarely per snapshot: on one boot, six runs took 213,431
      snapshots in all and only 4 were inconsistent (3 in the first run, 1 in the second, none
      in the other four, which printed `5 checks OK`). Per run it is less rare: a second series
      of six runs failed 4 of them. Each bad record mixes two moments:

      - **`state 4 cpu -1`, "running, but on no hart".** The compiled loop loads `p->state`
        three separate times (three `lw a5,24(s1)` in this build: the UNUSED test, the copy into
        the record, and the RUNNING test before the `cpus[]` loop). The copy saw RUNNING, and
        by the time the `cpus[]` loop ran, no hart's `c->proc` pointed at the process: it had
        just yielded or slept, or the scheduler had set RUNNING ([[kernel/proc.c:451]]) but
        not yet `c->proc` (line 452).
      - **`state 3 cpu 2`, "on a hart, but not running".** The reverse: the copy saw RUNNABLE,
        then the scheduler on hart 2 picked the process, and the third load saw RUNNING, so
        the loop found it on hart 2.
      - **`pid 8223 ppid 0 state 0`, "bad pid or state"** (seen in that second series).
        The first load saw a live state, so the slot was recorded with its pid, but the copy
        of `state` came after [[freeproc]] on another hart had set UNUSED: a record of a
        process that, as far as the record says, does not exist.

      With `p->lock` held, the scheduler cannot be between those lines, and all three loads see
      the same value. Without it, the program receives a record that was never true at any
      moment. Nothing crashed: this build loads `p->parent` once into a register, checks it for
      0 and then dereferences that same register, so the parent pointer could not be read as
      non-zero and then as zero. That is luck of code generation, not a guarantee.

      A second variant kept `p->lock` but dropped `wait_lock`. Six runs (60,643 snapshots)
      printed no bad snapshot at all: this workload's parents (the test and its two churning
      children) never exit while their children live, so no parent link changes during a
      scan. It still gives up layer 2 of question 6 (parent links may now change while the
      scan runs); a measurement saw only milder effects (see Measure): some children caught
      mid-fork already had a parent, and snapshots with two RUNNING records on one hart became
      more common. Rare is not never: a race test that passes is weak evidence.
