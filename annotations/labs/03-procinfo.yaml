      releases `tx_lock` with [[releasesleep]], which calls [[wakeup]], which acquires every
      `p->lock` in turn, and slot 3's is already held **by this hart**. [[acquire]] notices
      ([[kernel/spinlock.c:25]]) and panics: `panic: acquire`, right after the `P`. `noff` 63 is
