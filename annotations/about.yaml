software:
  - name: "µSystem 8086"
    shot: img/tools/usystem8086.jpg
    caption: "The PC/XT board, wired chip by chip, that boots FreeDOS"
    href: https://8086.jyotiprakash.org
    status: Available now
    text: A cycle-accurate 8086/8088 system simulator — wire period-correct chips pin by pin, step by cycle, probe any wire. The CPU core is 100.00% exact on all 3,007,000 SingleStepTests cases and the PC/XT preset boots FreeDOS 1.3.
  - name: PipeLens
    shot: img/tools/pipelens.jpg
    caption: "Data hazards on the five-stage pipeline, cycle by cycle"
    status: In closed testing
    text: Pipelines, caches and coherence in one explained, verified, offline simulator. RISC-V programs run on six textbook processor models — from the five-stage pipeline through the CDC 6600 scoreboard and Tomasulo's algorithm to an R10K-style out-of-order core — behind a configurable hierarchy of caches, coherence, networks, DRAM and several cores. Every cycle of every component is explained, and every run is checked in lock step against a reference ISS and a golden memory.
  - name: NetSim
    shot: img/tools/netsim.jpg
    caption: "A first ping: ARP and ICMP in the sniffer, decoded to the byte"
    status: In closed testing
    text: A browser network simulator — build IPv4 networks, send and sniff byte-accurate packets, step TCP congestion control, routing, VLANs, NAT and 802.11.
  - name: Compy
    shot: img/tools/compy.jpg
    caption: "A use-after-free caught and explained, with the process memory map"
    status: In closed testing
    text: Every phase of a from-scratch C89 compiler opened up, with programs running over an inspectable memory model that catches and explains classic C bugs.
