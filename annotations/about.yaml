why: |
  This site is the companion to **RISC-V Architecture and XV6: Instruction Set Architecture,
  Systems Programming, and Kernel Development** (De Gruyter Brill, 2026). It grew from years of
  teaching operating systems — first as the graduate teaching assistant for *Introduction to
  Operating Systems* at the University of Wisconsin–Madison, then in lecture halls at KIIT and in
  seventy-eight free lectures on YouTube — and from a conviction that a student should be able to
  see *everything*: every line of a real kernel explained, every claim checked against the code,
  every experiment actually run. The annotations, tours, concept pages, the 500 self-graded
  questions and the extension labs were designed and directed by Jyotiprakash Mishra, and
  every fact in them was verified against xv6 running on QEMU.
profile: |
  Over fifteen years spanning enterprise software engineering, healthcare technology
  leadership, university teaching and hardware-security research. Doctoral research at BITS
  Pilani on the security of the hardware–software interface — microarchitectural side
  channels, memory encryption, and hardware-assisted malware detection on RISC-V — with the
  thesis submitted and the degree expected in December 2026. Educated at BITS Pilani and the
  University of Wisconsin–Madison, graduating with distinction from both; the MS at
  UW–Madison was fully funded through a guaranteed teaching assistantship. Formerly a Team
  Lead at Epic (USA) and Senior Member of Technical Staff at Oracle.
